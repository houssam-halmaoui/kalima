            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px;

            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }

        }

            height: 12px;

            opacity: 0.7;
            transition: all 0.3s;
        }

            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }

        function createTreemap(data, containerId) {

            const sources = [...new Set(data.articles.map(d => d.source))];

            const root = d3.hierarchy(hierarchyData)

            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)

            treemap(root);
            
            const nodes = container.selectAll(".node")
