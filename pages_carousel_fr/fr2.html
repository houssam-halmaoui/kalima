<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>
<body>
    <header> 
        <div class="header-title"> Les principales actualités des dernières 24 heures

</div>    
        <div class="header-subtitle"> Dernière mise à jour : 07/11/2026 - 17h57</div>  
    </header>
    
    

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="treemap-carousel"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        const treemapData = [{'community_id': '2', 'articles': [{'id': '1', 'title': 'Le Marocain Adnane Remmal lauréat du Prix UNESCO pour la recherche en sciences de la vie', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/495480-le-marocain-adnane-remmal-laureat-du-prix-unesco-pour-la-recherche-en-sciences-de-la-vie.html', 'summary': 'Le Marocain Adnane Remmal lauréat du Prix UNESCO pour la recherche en sciences de la vie. Le chercheur marocain Adnane Remmal a été distingué, vendredi soir à Paris, parmi les trois lauréats du Prix international UNESCO-Guinée équatoriale pour la recherche en sciences de la vie, en reconnaissance de leurs contributions majeures à la recherche scientifique et à l’amélioration de la santé humaine. Professeur à l’Université Sidi Mohamed Ben Abdellah de Fès, . ', 'size': 3}, {'id': '14', 'title': 'Le chercheur marocain Adnane Remmal lauréat du Prix UNESCO-Guinée équatoriale', 'source': 'lematin.ma', 'link': 'https://lematin.ma/societe/le-chercheur-adnane-remmal-laureat-du-prix-unesco-guinee-equatoriale/374411', 'summary': "Le chercheur marocain Adnane Remmal lauréat du Prix UNESCO-Guinée équatoriale. Professeur à l'Université Sidi Mohamed Ben Abdellah de Fès, Adnane Remmal a été honoré pour ses travaux pionniers dans la lutte contre l'antibiorésistance, considérée comme.", 'size': 2}, {'id': '86', 'title': 'Adnane Remmal primé par l’UNESCO pour ses recherches contre la résistance aux antibiotiques', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/207014/adnane-remmal-prime-l-unesco-pour.html', 'summary': 'Adnane Remmal primé par l’UNESCO pour ses recherches contre la résistance aux antibiotiques. Le chercheur marocain Adnane Remmal a été distingué vendredi soir à Paris par le Prix international UNESCO–Guinée Équatoriale pour la recherche en sciences de la vie, aux côtés de chercheurs chinois et espagnol, saluant ses travaux sur la lutte contre la résistance aux antibiotiques.', 'size': 2}], 'main_title': 'Le Marocain Adnane Remmal lauréat du Prix UNESCO pour la recherche en sciences de la vie'}, {'community_id': '1', 'articles': [{'id': '6', 'title': 'Les températures attendues ce samedi 7 novembre 2026', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/495454-les-temperatures-attendues-ce-samedi-7-novembre-2026.html', 'summary': 'Les températures attendues ce samedi 7 novembre 2026. Voici les températures minimales et maximales prévues par la Direction générale de la météorologie pour le samedi 7 novembre 2026 Min Max – Oujda 13 25 – Bouarfa 12 22 – Al Hoceima 13 21 – Tétouan 14 21 – Sebta 18 21 – Mellilia 16 21 – Tanger 17 25 – Kénitra 15 26 . ', 'size': 2}, {'id': '43', 'title': 'Températures prévues pour dimanche 08 novembre 2026', 'source': 'maroc-diplomatique.net', 'link': 'https://maroc-diplomatique.net/temperatures-prevues-pour-dimanche-08-novembre-2026/', 'summary': 'Températures prévues pour dimanche 08 novembre 2026. Voici les températures minimales et maximales prévues par la Direction générale de la météorologie pour le dimanche 08 novembre 2026 : Min Max – Oujda 14 27 – Bouarfa 12 23 – Al Hoceima 15 22 – Tétouan 16 21 – Sebta 20 22 – Mellilia 19 22 – Tanger 19 25 – Kénitra 17 [.] .', 'size': 2}], 'main_title': 'Les températures attendues ce samedi 7 novembre 2026'}, {'community_id': '0', 'articles': [{'id': '75', 'title': 'JOJ Dakar 2026 Futsal : le Maroc écrase les Îles Salomon (15-1) et file en demi-finales', 'source': 'lematin.ma', 'link': 'https://lematin.ma/sports/joj-dakar-futsal-le-maroc-ecrase-les-iles-salomon-et-file-en-demi-finales/374434', 'summary': 'JOJ Dakar 2026 Futsal : le Maroc écrase les Îles Salomon (15-1) et file en demi-finales. Les quinze réalisations marocaines ont été inscrites par Hamza El Ahmadi (5 buts), Mohammed Karouk El Bahi (3), Alae Aït Challa (3), Brahim Houdane (2), Zakariya Sarghine (1) et Mo.', 'size': 2}, {'id': '91', 'title': 'JOJ Dakar 2026 : le Maroc en demi-finale de futsal', 'source': 'maroc-diplomatique.net', 'link': 'https://maroc-diplomatique.net/joj-dakar-2026-le-maroc-en-demi-finale-de-futsal/', 'summary': 'JOJ Dakar 2026 : le Maroc en demi-finale de futsal. La sélection marocaine masculine de futsal s’est qualifiée pour les demi-finales des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, en surclassant les Îles Salomon sur le score sans appel de 15 buts à 1, samedi à Dakar, lors de la phase de groupes, grâce notamment à un quintuplé de Hamza El Ahmadi. Les quinze [.] .', 'size': 2}], 'main_title': 'JOJ Dakar 2026 Futsal : le Maroc écrase les Îles Salomon (15-1) et file en demi-finales'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>




</html>
