<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>
<body>
    <header> 
        <div class="header-title"> Les principales actualités des dernières 24 heures

</div>    
        <div class="header-subtitle"> Dernière mise à jour : 06/09/2026 - 10h35</div>  
    </header>
    
    

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="treemap-carousel"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>

026', 'source': 'leseco.ma', 'link': 'https://leseco.ma/maroc/narsa-pas-de-remplacement-obligatoire-de-toutes-les-plaques-dimmatriculation-avant-fin-2026.html', 'summary': "NARSA : pas de remplacement obligatoire de toutes les plaques d’immatriculation avant fin 2026. L’Agence nationale de la sécurité routière (NARSA) a affirmé, vendredi, que la date du 31 décembre 2026 n’est pas une échéance générale pour le remplacement de l'ensemble des plaques d’immatriculation des véhicules au Maroc, soulignant que la décision n°640.26, publiée le 03 août dernier, prévoit des dispositions transitoires fixant la date à laquelle le remplacement des plaques d’immatriculation devient obligatoire selon la situation du véhicule. ", 'size': 5}, {'id': '46', 'title': 'Plaques d’immatriculation : la NARSA précise les modalités de remplacement', 'source': 'lnt.ma', 'link': 'https://lnt.ma/plaques-dimmatriculation-la-narsa-precise-les-modalites-de-remplacement/', 'summary': 'Plaques d’immatriculation : la NARSA précise les modalités de remplacement. La date du 31 décembre 2026 ne constitue pas une échéance générale imposant le remplacement de toutes les plaques d’immatriculation des véhicules en circulation au Maroc. La NARSA a apporté cette précision après la diffusion d’informations erronées sur les nouvelles dispositions réglementaires. Les délais applicables varient en réalité selon le type de plaque et la . ', 'size': 2}], 'main_title': 'NARSA : pas de remplacement obligatoire de toutes les plaques d’immatriculation avant fin 2026'}, {'community_id': '1', 'articles': [{'id': '16', 'title': "Maroc : Jusqu'à 46°C\xa0et averses orageuses de samedi à mardi", 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/202182/maroc-jusqu-a-averses-orageuses-samedi.html', 'summary': "Maroc : Jusqu'à 46°C et averses orageuses de samedi à mardi. Une vague de chaleur et des averses orageuses accompagnées de grêle et de rafale de vent sous orages sont attendues, de samedi à mardi, dans plusieurs provinces du Maroc, a indiqué la Direction générale de la météorologie (DGM).", 'size': 2}, {'id': '24', 'title': 'Météo : Jusqu’à 46 °C dans plusieurs provinces du Royaume', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/influences/climat/meteo-jusqua-46-c-dans-plusieurs-provinces-du-royaume/', 'summary': 'Météo : Jusqu’à 46 °C dans plusieurs provinces du Royaume. Une vague de chaleur avec des températures pouvant atteindre 46 °C, ainsi que des averses orageuses accompagnées de grêle et de fortes rafales de vent, sont attendues de samedi à mardi dans plusieurs provinces du Royaume. L’article est apparu en premier sur .', 'size': 2}, {'id': '44', 'title': 'Météo : jusqu’à 46°C et des averses orageuses attendues dans plusieurs provinces', 'source': 'lnt.ma', 'link': 'https://lnt.ma/meteo-jusqua-46c-et-des-averses-orageuses-attendues-dans-plusieurs-provinces/', 'summary': 'Météo : jusqu’à 46°C et des averses orageuses attendues dans plusieurs provinces. Une vague de chaleur touchera plusieurs provinces du Maroc de samedi à mardi, avec des températures pouvant atteindre 46°C dans certaines zones, selon la Direction générale de la météorologie (DGM). Des averses orageuses accompagnées de grêle et de rafales de vent sont également prévues samedi dans plusieurs provinces, dans le cadre d’un bulletin d’alerte de . ', 'size': 3}], 'main_title': 'Météo : jusqu’à 46°C et des averses orageuses attendues dans plusieurs provinces'}, {'community_id': '2', 'articles': [{'id': '23', 'title': 'En hausse de 4,5%, plus de 14 millions de touristes accueillis à fin août 2026', 'source': 'aujourdhui.ma', 'link': 'https://aujourdhui.ma/actualite/en-hausse-de-45-plus-de-14-millions-de-touristes-accueillis-a-fin-aout-2026', 'summary': 'En hausse de 4,5%, plus de 14 millions de touristes accueillis à fin août 2026. Le Maroc a accueilli 14,1 millions de touristes à fin août 2026, en hausse de 4,5% par rapport à la même période de 2025, soit près de 608.000 arrivées additionnelles, selon le ministère du Tourisme, de l’Artisanat et de l’Économie sociale et solidaire. En effet, le mois d’août a franchi pour la première fois la .', 'size': 2}, {'id': '47', 'title': 'Tourisme : le Maroc dépasse les 14 millions d’arrivées à fin août 2026', 'source': 'lnt.ma', 'link': 'https://lnt.ma/tourisme-le-maroc-depasse-les-14-millions-darrivees-a-fin-aout-2026/', 'summary': 'Tourisme : le Maroc dépasse les 14 millions d’arrivées à fin août 2026. Le Maroc a accueilli 14,1 millions de touristes au cours des huit premiers mois de 2026, soit une progression de 4,5% par rapport à la même période de l’année précédente, selon le ministère du Tourisme, de l’Artisanat et de l’Économie sociale et solidaire. Le seul mois d’août a dépassé, pour la première fois, le seuil . ', 'size': 2}], 'main_title': 'En hausse de 4,5%, plus de 14 millions de touristes accueillis à fin août 2026'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
