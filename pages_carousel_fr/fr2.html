 pour les supporters via l’application Yalla. À l’approche de la CAN Maroc 2025, le Comité Local d’Organisation, en coordination avec les autorités marocaines et la Confédération Africaine de Football (CAF), a officialisé la m.', 'size': 4}, {'id': '270', 'title': "CAN 2025 : Le e-visa désormais gratuit via l'application Yalla", 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/180984/2025-e-visa-desormais-gratuit-l-application.html', 'summary': "CAN 2025 : Le e-visa désormais gratuit via l'application Yalla. Les autorités marocaines et la Confédération africaine de football (CAF) ont annoncé que les visas électroniques pour les supporters voyageant au Maroc pour assister à la Coupe dAfrique des nations (CAN 2025) sont désormais gratuits. Les visas peuvent être obtenus via lapplication Yalla, qui sert de plateforme officielle pour le tournoi.", 'size': 4}], 'main_title': 'CAN-2025: les visas électroniques via l’application Yalla désormais gratuits (communiqué)'}, {'community_id': '11', 'articles': [{'id': '54', 'title': 'Akdital clôture avec succès une émission obligataire de 1,2 MMDH', 'source': 'www.lopinion.ma', 'link': 'https://www.lopinion.ma/Akdital-cloture-avec-succes-une-emission-obligataire-de-12-MMDH_a73782.html', 'summary': 'Akdital clôture avec succès une émission obligataire de 1,2 MMDH. Le Groupe Akdital a réalisé avec succès une émission obligataire ordinaire par placement privé pour un montant global de 1,2 milliard de dirhams (MMDH), souscrite par des investisseurs qualifiés.', 'size': 2}, {'id': '198', 'title': 'Santé : Akdital lève 1,2 MMDH pour accélérer son développement à l’international', 'source': 'leseco.ma', 'link': 'https://leseco.ma/business/sante-akdital-leve-12-mmdh-pour-accelerer-son-developpement-a-linternational.html', 'summary': 'Santé : Akdital lève 1,2 MMDH pour accélérer son développement à l’international. Le groupe Akdital a placé avec succès une émission obligataire de 1,2 milliard de dirhams aup                         hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
