ture amazighe à Marrakech. Le Musée Yves Saint Laurent Marrakech abritera, le jeudi 23 octobre 2025 à 19h, une conférence et une séance de signature autour de l’ouvrage Amazighes. Cycles, motifs, parures de Salima Naji. L’événement est organisé par la Fondation Jardin Majorelle, en partenariat avec le MUCEM, Musée des Civilisations de l’Europe et de la Méditerranée à Marseille. . ', 'size': 3}, {'id': '282', 'title': "Le Musée YSL Marrakech célèbre l'exposition “Amazighes” qui a attiré 100.000 visiteurs à Marseille", 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2025/10/24/le-musee-ysl-marrakech-celebre-lexposition-amazighes-qui-a-attire-100-000-visiteurs-a-marseille_1957537/', 'summary': "Le Musée YSL Marrakech célèbre l'exposition “Amazighes” qui a attiré 100.000 visiteurs à Marseille. Le Musée Yves Saint Laurent Marrakech a accueilli, jeudi soir, une conférence et une séance de signature autour de l’exposition “Amazighes. Cycles, motifs, parures”, en présence de son co-commissaire, l’architecte et anthropologue Salima Naji. Présentée du 30 avril au 2 novembre 2025 au Musée des civilisations de l’Europe et de la Méditerranée (MUCEM) à Marseille,.", 'size': 2}], 'main_title': 'La Fondation Jardin Majorelle accueille une conférence sur la culture amazighe à Marrakech'}, {'community_id': '3', 'articles': [{'id': '155', 'title': 'Lekjaa: Les exploits réalisés sont le couronnement de la Vision de SM le Roi', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/sport/lekjaa-les-exploits-realises-sont-le-couronnement-de-la-vision-de-sm-le-roi/', 'summary': 'Lekjaa: Les exploits réalisés sont le couronnement de la Vision de SM le Roi. Les succès des équipes marocaines de football reflètent la vision sportive de Sa Majesté le Roi Mohammed VI, a affirmé Fouzi Lekjaa, président de la Fédération Royale Marocaine de Football (FRMF), dans un entretien accordé au Figaro. Ces accomplissements sont le fruit d’une stratégie nationale initiée depuis 2008 e rientations de Sa Majesté le Roi Mohammed VI, que Dieu L’assiste, visant à parachever la réforme d.', 'size': 2}, {'id': '327', 'title': 'Santé : 49 nouveaux centres de soins ouverts dans 9 régions du Royaume', 'source': 'lnt.ma', 'link': 'https://lnt.ma/sante-49-nouveaux-centres-de-soins-ouverts-dans-9-regions-du-royaume/', 'summary': 'Santé : 49 nouveaux centres de soins ouverts dans 9 régions du Royaume. En application des orientations de SM le Roi Mohammed VI visant à parachever la réforme du système national de santé, et conformément aux instructions du ministre de la Santé et de la Protection sociale, Amine Tehraoui, 49 nouveaux centres de santé urbains et ruraux sont entrés en service le vendredi 24 octobre 2025, dans neuf . ', 'size': 2}], 'main_title': 'Mise en service de 49 nouveaux centres de santé dans 9 régions du Royaume'}, {'community_id': '4', 'articles': [{'id': '238', 'title': 'Transport au Maroc : les aéroports franchissent la barre des 23,9 millions de passagers en huit mois', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/446765-transport-au-maroc-les-aeroports-franchissent-la-barre-des-239-millions-de-passagers-en-huit-mois.html', 'summary': 'Transport au Maroc : les aéroports franchissent la barre des 23,9 millions de passagers en huit mois. Le dynamisme du transport aérien au Maroc se confirme. Les aéroports du Royaume ont accueilli plus de 23,9 millions de voyageurs entre janvier et août 2025, enregistrant une hausse de 11,7 % par rapport à la même période de l’année précédente, selon les données de la Direction des études et des prévisions financières (DEPF). Cette . ', 'size': 3}, {'id': '272', 'title': 'Aéroports du Royaume : plus de 23,9 millions de passagers accueillis en huit mois', 'source': 'www.lopinion.ma', 'link': 'https://www.lopinion.ma/Aeroports-du-Royaume-plus-de-239-millions-de-passagers-accueillis-en-huit-mois_a73160.html', 'summary': 'Aéroports du Royaume : plus de 23,9 millions de passagers accueillis en huit mois. Le flux de voyageurs accueillis dans les aéroports du Royaume a dépassé 23,9 millions de personnes durant les huit premiers mois de 2025, en hausse de 11,7% par rapport à la même période un an auparavant, selon la Direction des études et des prévisions financières (DEPF).', 'size': 3}, {'id': '288', 'title': 'Aéroports du Maroc : plus de 23,9 millions de passagers accueillis en huit mois', 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2025/10/24/aeroports-du-maroc-plus-de-239-millions-de-passagers-accueillis-en-huit-mois_1957504/', 'summary': 'Aéroports du Maroc : plus de 23,9 millions de passagers accueillis en huit mois. Le flux de voyageurs accueillis dans les aéroports du Royaume a dépassé 23,9 millions de personnes durant les huit premiers mois de 2025, en hausse de 11,7% par rapport à la même période un an auparavant, selon la Direction des études et des prévisions financières (DEPF). Cette progression fait suite au renforcement du trafic international.', 'size': 3}], 'main_title': 'Transport au Maroc : les aéroports franchissent la barre des 23,9 millions de passagers en huit mois'}, {'community_id': '23', 'articles': [{'id': '249', 'title': 'Marsa Maroc et CMA CGM bouclent leur partenariat pour le Terminal à Conteneurs Ouest de Nador', 'source': 'lematin.ma', 'link': 'https://lematin.ma/economie/marsa-maroc-et-cma-cgm-finalisent-laccord-sur-ndw/309626', 'summary': 'Marsa Maroc et CMA CGM bouclent leur partenariat pour le Terminal à Conteneurs Ouest de Nador. Selon les termes de l’accord, une coentreprise détenue à 51% par Marsa Maroc et à 49% par CMA Terminals sera chargée de la gestion, du développement et de l’exploitation du termina.', 'size': 4}, {'id': '264', 'title': "Port Nador West Med : Marsa Maroc et CMA CGM signent un accord pour l'exploitation du Terminal à Conteneurs Ouest", 'source': 'www.lopinion.ma', 'link': 'https://www.lopinion.ma/Port-Nador-West-Med-Marsa-Maroc-et-CMA-CGM-signent-un-accord-pour-l-exploitation-du-Ter         const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
