aux-Le-CMI-et-JCB-renforcent-leur-partenariat_a73436.html', 'summary': 'Paiements internationaux : Le CMI et JCB renforcent leur partenariat. Le Centre monétique interbancaire (CMI) et la société japonaise JCB annoncent la mise en service de l’acceptation des paiements par carte JCB auprès des établissements de paiement acquéreurs affiliés au CMI.', 'size': 2}, {'id': '205', 'title': 'Le CMI et JCB étendent l’acceptation des paiements internationaux au Maroc', 'source': 'lnt.ma', 'link': 'https://lnt.ma/le-cmi-et-jcb-etendent-lacceptation-des-paiements-internationaux-au-maroc/', 'summary': 'Le CMI et JCB étendent l’acceptation des paiements internationaux au Maroc. CB International Co., Ltd., filiale internationale de la marque japonaise JCB, et le Centre Monétique Interbancaire (CMI) annoncent l’activation de l’acceptation des cartes JCB auprès des établissements de paiement acquéreurs affiliés au CMI. Cette évolution élargit un partenariat engagé en 2023 : après l’acceptation par l’ensemble des commerçants affiliés au CMI, le dispositif couvre désormais . ', 'size': 2}], 'main_title': 'Paiements internationaux : Le CMI et JCB renforcent leur partenariat'}, {'community_id': '8', 'articles': [{'id': '69', 'title': 'Casablanca : panne sur une conduite d’eau potable, coupure dans certains quartiers', 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2025/10/31/casablanca-panne-sur-une-conduite-deau-potable-coupure-dans-certains-quartiers_1958646/', 'summary': 'Casablanca : panne sur une conduite d’eau potable, coupure dans certains quartiers. La Société régionale multiservices Casablanca-Settat a annoncé dans un communiqué qu’une panne s’est produite, hier, jeudi 30 octobre, sur l’une des principales conduites d’eau potable alimentant les quartiers de Moulay Rachid, Sbata, Salmia, Sidi Othmane et la partie nord d’El Harraouine à Casablanca. Dès l’incident signalé, les équipes techniques de la société ont immédiatement procédé.', 'size': 2}, {'id': '208', '  'summary': 'SM le Roi | La Résolution du Conseil de Sécurité définit les principes et les fondements susceptibles de conduire à un règlement politique définitif de la question du Sahara dans le strict respect des droits légitimes du Maroc. La Résolution du Conseil de Sécurité de l’ONU définit les principes et les fondements susceptibles de conduire à un règlement politique définitif de la question du Sahara, dans le strict respect des droits légitimes du Maroc, a affirmé Sa Majesté le Roi Mohammed VI. “Dieu soit loué, nous entrons dans la phase décisive du processus ', 'size': 2}], 'main_title': 'Mohammed VI : La Résolution du Conseil de Sécurité définit les principes et les fondements susceptibles de conduire à un règlement politique définitif de la question du Sahara dans le strict respect des droits légitimes du Maroc'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
