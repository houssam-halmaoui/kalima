main_title': "L'ONDA lance l'appel d'offres pour le nouveau terminal de l'aéroport Casablanca Mohammed V"}, {'community_id': '4', 'articles': [{'id': '30', 'title': 'Cap Hospitality : 91 demandes éligibles enregistrées pour un investissement global de 7 milliards de DH', 'source': 'lematin.ma', 'link': 'https://lematin.ma/economie/cap-hospitality-91-demandes-eligibles-enregistrees/311768', 'summary': 'Cap Hospitality : 91 demandes éligibles enregistrées pour un investissement global de 7 milliards de DH. Cap Hospitality illustre la force du partenariat public-privé dans le secteur touristique. Ensemble, nous veillons à ce que les financements mobilisés soutiennent concrètemen.', 'size': 2}, {'id': '141', 'title': '«\xa0Cap Hospitality\xa0» : 91 demandes éligibles enregistrées pour un investissement global de 7 MMDH', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/au-royaume/cap-hospitality-91-demandes-eligibles-enregistrees-pour-un-investissement-global-de-7-mmdh/', 'summary': '« Cap Hospitality » : 91 demandes éligibles enregistrées pour un investissement global de 7 MMDH. Ce programme de financement pour la mise à niveau des hôtels, a enregistré, à ce jour, 91 demandes éligibles représentant 14.000 chambres et un investissement global de 7 MMDH, dont une soixantaine de dossiers déjà accordés, selon le ministère du Tourisme.', 'size': 3}, {'id': '207', 'title': '“Cap Hospitality”: le ministère du Tourisme veut accélérer la rénovation hôtelière', 'source': 'lnt.ma', 'link': 'https://lnt.ma/cap-hospitality-le-ministere-du-tourisme-veut-accelerer-la-renovation-hoteliere/', 'summary': '“Cap Hospitality”: le ministère du Tourisme veut accélérer la rénovation hôtelière. Le programme « Cap Hospitality », dédié à la mise à niveau et à la modernisation des établissements d’hébergement touristiques classés, poursuit sa montée en puissance. Selon le ministère du Tourisme, de l’Artisanat et de l’Économie sociale et solidaire, il a enregistré à ce jour 91 demandes éligibles, représentant 14.000 chambres et un investissement global . ', 'size': 2}], 'main_title': '«\xa0Cap Hospitality\xa0» : 91 demandes éligibles enregistrées pour un investissement global de 7 MMDH'}, {'community_id': '7', 'articles': [{'id': '33', 'title': 'Abdellatif Jouahri distingué “African Central Bank Governor” aux AFIS Awards 2025', 'source': 'lematin.ma', 'link': 'https://lematin.ma/economie/jouahri-distingue-african-central-bank-governor-aux-afis-awards-2025/311687', 'summary': 'Abdellatif Jouahri distingué “African Central Bank Governor” aux AFIS Awards 2025. Selon le communiqué des organisateurs, Abdellatif Jouahri a été honoré pour sa prudence, sa crédibilité et son excellence de gouvernance, des qualités qui ont permis à Bank Al-Magh.', 'size': 2}, {'id': '193', 'title': 'AFIS Awards 2025 : la finance marocaine à l’honneur avec Abdellatif Jouahri et Mohamed El Kettani distingués', 'source': 'atlasinfo.fr', 'link': 'https://atlasinfo.fr/afis-awards-2025-la-finance-marocaine-a-lhonneur-avec-abdellatif-jouahri-et-mohamed-el-kettani-distingues.html', 'summary': 'AFIS Awards 2025 : la finance marocaine à l’honneur avec Abdellatif Jouahri et Mohamed El Kettani distingués. La finance marocaine s’est distinguée lors des AFIS Awards 2025, tenus lundi soir à Casablanca en marge du 5ème Africa Financial Summit (AFIS), avec la consécration du Wali de Bank Al-Maghrib, Abdellatif Jouahri, désigné « African Central Bank Governor », et du Président-Directeur Général d’Attijariwafa Bank, Mohamed El Kettani, sacré « African Banker ». « M. Jouahri a été Honoré . L’article est apparu en premier sur .', 'size': 2}], 'main_title': 'Abdellatif Jouahri distingué “African Central Bank Governor” aux AFIS Awards 2025'}, {'community_id': '12', 'articles': [{'id': '37', 'title': 'FIFM 2025 : Jodie Foster, Raouya, Guillermo del Toro et Hussein Fahmi à l’honneur', 'source': 'lematin.ma', 'link': 'https://lematin.ma/culture/fifm-2025-jodie-foster-raouya-del-toro-et-hussein- 'lnt.ma', 'link': 'https://lnt.ma/marche-du-travail-recul-du-chomage-mais-hausse-du-sous-emploi/', 'summary': 'Marché du travail : Recul du chômage mais hausse du sous-emploi. L’économie marocaine a enregistré la création nette de 167.000 emplois entre le troisième trimestre de 2024 et celui de 2025, dont 164.000 en milieu urbain et 3.000 en milieu rural, selon la note d’information du Haut-Commissariat au Plan (HCP) sur la situation du marché du travail. Cette progression s’explique par la hausse de l’emploi rémunéré . ', 'size': 2}], 'main_title': 'Marché du travail : L’emploi progresse mais le sous-emploi s’aggrave'}, {'community_id': '13', 'articles': [{'id': '55', 'title': 'Transport aérien : le Maroc pleinement disposé à concrétiser les partenariats interarabes (Kayouh)', 'source': 'www.lopinion.ma', 'link': 'https://www.lopinion.ma/Transport-aerien-le-Maroc-pleinement-dispose-a-concretiser-les-partenariats-interarabes-Kayouh_a73542.html', 'summary': 'Transport aérien : le Maroc pleinement disposé à concrétiser les partenariats interarabes (Kayouh). Le ministre du Transport et de la Logistique, Abdessamad Kayouh, a affirmé, lundi à Rabat, que le Maroc est pleinement disposé à soutenir toute initiative visant à consolider la coopération arabe dans le domaine du transport aérien et à concrétiser les partenariats interarabes.', 'size': 2}, {'id': '202', 'title': 'Transport aérien | Le Maroc pleinement disposé à concrétiser les partenariats interarabes (Kayouh)', 'source': 'www.lereporter.ma', 'link': 'https://www.lereporter.ma/transport-aerien-le-maroc-pleinement-dispose-a-concretiser-les-partenariats-interarabes-kayouh/', 'summary': 'Transport aérien | Le Maroc pleinement disposé à concrétiser les partenariats interarabes (Kayouh). Le ministre du Transport et de la Logistique, Abdessamad Kayouh, a affirmé, lundi à Rabat, que le Maroc est pleinement disposé à soutenir toute initiative visant à consolider la coopération arabe dans le domaine du transport aérien et à concrétiser les partenariats interarabes. “L’intégration arabe dans le domaine du transport aérien n’est pas seulement un choix, ', 'size': 2}], 'main_title': 'Transport aérien : le Maroc pleinement disposé à concrétiser les partenariats interarabes (Kayouh)'}, {'community_id': '6', 'articles': [{'id': '92', 'title': "Aéronautique : avec la production de moteurs d'avions, “le Maroc franchit une étape décisive”, selon Mezzour", 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2025/11/04/aeronautique-avec-la-production-de-moteurs-davions-le-maroc-franchit-une-etape-decisive-selon-mezzour_1959208/', 'summary': "Aéronautique : avec la production de moteurs d'avions, “le Maroc franchit une étape décisive”, selon Mezzour. Le Maroc a franchi une étape décisive dans son développement industriel avec le récent lancement des travaux de la réalisation du complexe de moteurs d’avions du groupe Safran, a affirmé, lundi à Rabat, le ministre de l’Industrie et du Commerce, Ryad Mezzour. Ce projet, qui représente un jalon majeur dans le processus de transformation économique.", 'size': 2}, {'id': '221', 'title': 'Production de moteurs d’avion: Mezzour annonce un tournant industriel pour le Maroc', 'source': 'lnt.ma', 'link': 'https://lnt.ma/production-de-moteurs-davion-mezzour-annonce-un-tournant-industriel-pour-le-maroc/', 'summary': 'Production de moteurs d’avion: Mezzour annonce un tournant industriel pour le Maroc. Le Maroc a franchi une étape décisive dans son développement industriel avec le récent lancement des travaux de la réalisation du complexe de « moteurs d’avions » du groupe Safran, a affirmé, lundi à Rabat, le ministre de l’Industrie et du Commerce, Ryad Mezzour. Ce projet, qui représente un jalon majeur dans le processus de transformation économique . ', 'size': 2}], 'main_title': "Aéronautique : avec la production de moteurs d'avions, “le Maroc franchit une étape décisive”, selon Mezzour"}, {'community_id': '19', 'articles': [{'id': '93', 'title': 'L         let clickTimer = null;

        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")

                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
