 de coopération douanière (CDD) Maroc-Union européenne (UE) s’est tenue, mardi, au siège de l’Administration des Douanes et Impôts Indirects (ADII) à Rabat. L’ouverture a été marquée par la présence du directeur général de l’ADII, Mohammed Ezzahaoui, et de l’ambassadeur de l’UE à Rabat, Dimiter Tzantchev, indique l’ADII dans un communiqué,.', 'size': 2}, {'id': '92', 'title': 'Maroc-UE : la coopération douanière au centre d’une réunion à Rabat', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/207624/maroc-ue-cooperation-douaniere-centre-d-une.html', 'summary': 'Maroc-UE : la coopération douanière au centre d’une réunion à Rabat. La 13e session du comité de coopération douanière Maroc-Union européenne s’est tenue mardi au siège de l’Administration des douanes et impôts indirects (ADII), à Rabat. Consacrée à l’évolution des règles douanières et à plusieurs chantiers de coopération, elle s’est ouverte en présence du directeur général de l’administration, Mohammed Ezzahaoui, et de l’ambassadeur de l’UE à Rabat, Dimiter Tzantchev. La délégation européenne était conduite par Matthias Petschke, directeur douane à la DG TAXUD.', 'size': 2}], 'main_title': 'Rabat : Tenue de la 13ème session du comité de coopération douanière Maroc-UE'}, {'community_id': '22', 'articles': [{'id': '64', 'title': 'Marché carbone: accord maroco-norvégien à Antalya pour générer près de 9 millions de tonnes équivalent CO₂ sur 10 ans', 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2026/11/13/marche-carbone-accord-maroco-norvegien-a-antalya-pour-generer-pres-de-9-millions-de-tonnes-equivalent-co%e2%82%82-sur-10-ans_2018004/', 'summary': 'Marché carbone: accord maroco-norvégien à Antalya pour générer près de 9 millions de tonnes équivalent CO₂ sur 10 ans. Le Maroc et la Norvège renforcent leur coopération dans les domaines de la finance climatique et des marchés carbone, à travers la signature, jeudi à Antalya, d’un accord d’achat de résultats d’atténuation (Mitigation Outcome Purchase Agreement – MOPA), visant à générer jusqu’à 8,89 millions de tonnes équivalent CO₂ de réductions d’émissions sur 10 ans. Ce.', 'size': 2}, {'id': '109', 'title': 'Le Maroc et la Norvège signent un accord de financement carbone à Antalya', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/207560/maroc-norvege-signent-accord-financement.html', 'summary': 'Le Maroc et la Norvège signent un accord de financement carbone à Antalya. Le Maroc et la Norvège ont conclu, jeudi 12 novembre à Antalya, en marge de la COP31, un accord visant à financer des projets solaires et éoliens au Maroc par le biais du marché carbone. Ces projets pourraient permettre de réduire les émissions de gaz à effet de serre de jusqu’à 8,89 millions de tonnes équivalent COâ‚‚ sur dix ans. En contrepartie des financements norvégiens, les réductions d’émissions obtenues seraient transférées.', 'size': 3}, {'id': '189', 'title': 'Marché carbone : le Maroc et la Norvège signent un accord portant sur près de 9 millions de tonnes de CO₂ évitées', 'source': 'lnt.ma', 'link': 'https://lnt.ma/marche-carbone-le-maroc-et-la-norvege-signent-un-accord-portant-sur-pres-de-9-millions-de-tonnes-de-co%e2%82%82-evitees/', 'summary': 'Marché carbone : le Maroc et la Norvège signent un accord portant sur près de 9 millions de tonnes de CO₂ évitées. Le Maroc et la Norvège ont conclu, jeudi 12 novembre à Antalya, un accord destiné à mobiliser des financements carbone pour soutenir le développement des énergies renouvelables dans le Royaume. Signé en marge de la COP31, ce partenariat prévoit jusqu’à 8,89 millions de tonnes équivalent CO₂ de réductions d’émissions sur dix ans, correspondant potentiellement au . ', 'size': 2}], 'main_title': 'Le Maroc et la Norvège signent un accord de financement carbone à Antalya'}, {'community_id': '3', 'articles': [{'id': '66', 'title': 'Douanes : près de 91 milliards de DH de recettes à fin octobre', 'source': 'telquel.ma         const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
