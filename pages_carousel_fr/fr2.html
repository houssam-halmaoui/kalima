<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>
<body>
    <header> 
        <div class="header-title"> Les principales actualités des dernières 24 heures

</div>    
        <div class="header-subtitle"> Dernière mise à jour : 20/09/2026 - 19h36</div>  
    </header>
    
    

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="treemap-carousel"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        const treemapData = [{'community_id': '1', 'articles': [{'id': '16', 'title': 'Elections 2026 : l’emploi des femmes, angle mort de plusieurs programmes électoraux (FLDF)', 'source': 'lematin.ma', 'link': 'https://lematin.ma/nation/elections-2026-lemploi-des-femmes-angle-mort-de-plusieurs-programmes/365987', 'summary': 'Elections 2026 : l’emploi des femmes, angle mort de plusieurs programmes électoraux (FLDF). À trois jours des élections législatives, la place des femmes dans les programmes électoraux ne se résume plus à la parité ou à leur présence sur les listes. Emploi, pouvoir d’acha.', 'size': 2}, {'id': '37', 'title': 'Élections législatives au Maroc:  ce que disent les programmes des partis', 'source': 'atlasinfo.fr', 'link': 'https://atlasinfo.fr/elections-legislatives-au-maroc-ce-que-disent-les-programmes-des-partis.html', 'summary': 'Élections législatives au Maroc: ce que disent les programmes des partis. À quelques jours des élections législatives du 23 septembre, la lecture des programmes marocains réserve une surprise. Les partis s’opposent, mais parlent de plus en plus des mêmes choses : emploi, pouvoir d’achat, santé, école, eau, protection sociale, logement, jeunesse, territoires. Cette convergence n’efface pas leurs différences. Elle dit autre chose : les grandes urgences ', 'size': 2}], 'main_title': 'Elections 2026 : l’emploi des femmes, angle mort de plusieurs programmes électoraux (FLDF)'}, {'community_id': '2', 'articles': [{'id': '38', 'title': 'Victime d’un choc à la tête avec Anderlecht, Tawfik Bentayeb échappe au pire', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/489105-victime-dun-choc-a-la-tete-avec-anderlecht-tawfik-bentayeb-echappe-au-pire.html', 'summary': 'Victime d’un choc à la tête avec Anderlecht, Tawfik Bentayeb échappe au pire. L’attaquant marocain d’Anderlecht Tawfik Bentayeb, sorti samedi soir après un choc à la tête lors du match contre Zulte Waregem, ne souffre ni de commotion cérébrale ni de fracture, rapporte dimanche le quotidien belge « Le Soir ». « Les nouvelles sont bonnes après son choc. Les premiers échos indiquent que rien de grave n’est arrivé au joueur. . ', 'size': 2}, {'id': '57', 'title': 'Anderlecht : Frayeur pour Tawfik Bentayeb avant le rassemblement du Maroc', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/203238/anderlecht-frayeur-pour-tawfik-bentayeb.html', 'summary': 'Anderlecht : Frayeur pour Tawfik Bentayeb avant le rassemblement du Maroc. Plus de peur que de mal. L’attaquant marocain Tawfik Bentayeb, évoluant à Anderlecht, n’a subi ni commotion cérébrale ni fracture après avoir été heurté à la tête samedi soir lors du match contre Zulte Waregem, rapporte le quotidien belge Le Soir.', 'size': 2}], 'main_title': 'Victime d’un choc à la tête avec Anderlecht, Tawfik Bentayeb échappe au pire'}, {'community_id': '0', 'articles': [{'id': '42', 'title': 'Alerte météo: Pluies orageuses, fortes chaleurs et rafales de vent de dimanche à mardi', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/489092-alerte-meteo-pluies-orageuses-fortes-chaleurs-et-rafales-de-vent-de-dimanche-a-mardi.html', 'summary': 'Alerte météo: Pluies orageuses, fortes chaleurs et rafales de vent de dimanche à mardi. Des averses orageuses, un temps chaud et de fortes rafales de vent sont attendus, de dimanche à mardi, dans plusieurs provinces du Royaume, a annoncé la Direction générale de la météorologie (DGM). Ainsi, des averses orageuses avec grêle et rafales de vent sous orages (20-30 mm) sont attendues, dimanche de 12H00 à 23H00, dans les . ', 'size': 2}, {'id': '54', 'title': "Alerte-Météo : Jusqu'à 42°C et de fortes averses dans plusieurs régions du Maroc", 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/203244/alerte-meteo-jusqu-a-fortes-averses-dans.html', 'summary': "Alerte-Météo : Jusqu'à 42°C et de fortes averses dans plusieurs régions du Maroc. La Direction générale de la météorologie a annoncé que des averses orageuses accompagnées de grêle et de rafales de vent, ainsi que des vents forts, avec un temps chaud sont attendus, de dimanche à mardi dans plusieurs régions du Royaume.", 'size': 2}], 'main_title': 'Alerte météo: Pluies orageuses, fortes chaleurs et rafales de vent de dimanche à mardi'}, {'community_id': '3', 'articles': [{'id': '52', 'title': 'Coupe Davis de Tennis : le Maroc signe un sans-faute lors de la première journée face au Nigeria', 'source': 'lematin.ma', 'link': 'https://lematin.ma/sports/coupe-davis-de-tennis-le-maroc-signe-un-sans-faute-la-premiere-journee/366070', 'summary': 'Coupe Davis de Tennis : le Maroc signe un sans-faute lors de la première journée face au Nigeria. La sélection marocaine a réalisé un sans-faute pour lancer sa confrontation face au Nigeria dans le Groupe mondial II de la Coupe Davis. Devant son public à Rabat, le Maroc a rempo.', 'size': 2}, {'id': '58', 'title': 'Coupe Davis : Le Maroc se qualifie pour les barrages du Groupe mondial I', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/203235/coupe-davis-maroc-qualifie-pour.html', 'summary': 'Coupe Davis : Le Maroc se qualifie pour les barrages du Groupe mondial I. L’équipe nationale marocaine de tennis a décroché, dimanche, sa qualification pour les barrages du Groupe mondial I de la Coupe Davis, prévus en février 2027, après sa victoire 3-0 face au Nigeria sur les courts du Club des Cheminots à Rabat.', 'size': 2}], 'main_title': 'Coupe Davis de Tennis : le Maroc signe un sans-faute lors de la première journée face au Nigeria'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>




</html>
