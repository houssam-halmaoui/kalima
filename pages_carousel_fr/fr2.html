<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>
<body>
    <header> 
        <div class="header-title"> Les principales actualités des dernières 24 heures

</div>    
        <div class="header-subtitle"> Dernière mise à jour : 16/08/2026 - 12h26</div>  
    </header>
    
    

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="treemap-carousel"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>

ois pour accélérer la transformation territoriale'}, {'community_id': '3', 'articles': [{'id': '8', 'title': "CAN féminine Maroc: L'Algérie remporte la troisième place face aux Lionnes de l'Atlas", 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/485299-can-feminine-maroc-lalgerie-remporte-la-troisieme-place-face-aux-lionnes-de-latlas.html', 'summary': "CAN féminine Maroc: L'Algérie remporte la troisième place face aux Lionnes de l'Atlas. L’équipe d’Algérie s’est imposée face aux Lionnes de l’Atlas lors du match de 3ème place de la CAN féminine Maroc, ce samedi soir à Rabat. Les joueuses marocaines qui étaient nettement supérieures à leur homologues algériennes durant le match de la petite finale de la Coupe d’Afrique féminine, se sont inclinées à l’épreuve des tirs . ", 'size': 2}, {'id': '19', 'title': 'CAN féminine : Maroc-Algérie, un derby maghrébin pour la médaille de bronze', 'source': 'telquel.ma', 'link': 'https://telquel.ma/instant-t/2026/08/15/can-feminine-maroc-algerie-un-derby-maghrebin-pour-la-medaille-de-bronze_2003411/', 'summary': 'CAN féminine : Maroc-Algérie, un derby maghrébin pour la médaille de bronze. Le Maroc et l’Algérie s’affronteront, ce samedi au stade Olympique à Rabat, dans un derby maghrébin pour tenter de décrocher la médaille de bronze de la Coupe d’Afrique des Nations féminine (Maroc-2026). Ce derby maghrébin, qui sera sans doute très disputé, offre une affiche de prestige pour la petite finale de la CAN féminine et.', 'size': 3}, {'id': '38', 'title': 'CAN Féminine 2026 : Le Cameroun et le Malawi en finale inédite à Rabat après le derby Maroc-Algérie pour le bronze', 'source': 'atlasinfo.fr', 'link': 'https://atlasinfo.fr/can-feminine-2026-le-cameroun-et-le-malawi-en-finale-inedite-a-rabat-apres-le-derby-maroc-algerie-pour-le-bronze.html', 'summary': "CAN Féminine 2026 : Le Cameroun et le Malawi en finale inédite à Rabat après le derby Maroc-Algérie pour le bronze. Le tableau final de la Coupe d'Afrique des Nations féminine 2026 au Maroc rend son verdict ce week-end à Rabat avec le derby maghrébin Maroc-Algérie pour la médaille de bronze ce samedi 15 août, avant la grande finale inédite opposant le Cameroun au Malawi le dimanche 16 août. L’article est apparu en premier sur .", 'size': 2}], 'main_title': 'CAN féminine : Maroc-Algérie, un derby maghrébin pour la médaille de bronze'}, {'community_id': '1', 'articles': [{'id': '37', 'title': 'Indonésie : Un séisme de magnitude 7,7 frappe l’île de Florès et fait au moins 47 morts', 'source': 'atlasinfo.fr', 'link': 'https://atlasinfo.fr/indonesie-un-seisme-de-magnitude-77-frappe-lile-de-flores-et-fait-au-moins-47-morts.html', 'summary': "Indonésie : Un séisme de magnitude 7,7 frappe l’île de Florès et fait au moins 47 morts. Un puissant tremblement de terre sous-marin de magnitude 7,7 a frappé tôt samedi l'est de l'archipel indonésien au large de l'île de Florès. La catastrophe a causé la mort d'au moins 47 personnes, détruit des centaines de bâtiments et provoqué des vagues de tsunami localisées le long des zones côtières. L’article est apparu en premier sur .", 'size': 2}, {'id': '48', 'title': 'Indonésie : deux séismes en une journée, au moins 40 morts sur l’île de Florès', 'source': 'lnt.ma', 'link': 'https://lnt.ma/indonesie-deux-seismes-en-une-journee-au-moins-40-morts-sur-lile-de-flores/', 'summary': 'Indonésie : deux séismes en une journée, au moins 40 morts sur l’île de Florès. Un tremblement de terre de magnitude 7,7 a frappé l’est de l’archipel indonésien samedi à l’aube, faisant au moins 40 morts et une cinquantaine de blessés. Douze heures plus tard, une seconde secousse de magnitude 6,9 a touché Sumatra, à l’autre extrémité du pays. L’Indonésie a vécu, ce samedi 15 août 2026, une journée sismique . ', 'size': 2}], 'main_title': 'Indonésie : Un séisme de magnitude 7,7 frappe l’île de Florès et fait au moins 47 morts'}, {'community_id': '0', 'articles': [{'id': '60', 'title': "Averses orageuses dimanche dans plusieurs Provinces du Maroc (Bulletin d'alerte)", 'source': 'lematin.ma', 'link': 'https://lematin.ma/regions/averses-orageuses-dimanche-dans-plusieurs-provinces-du-maroc/361013', 'summary': "Averses orageuses dimanche dans plusieurs Provinces du Maroc (Bulletin d'alerte). Ainsi, ces averses avec risque de grêle et de fortes rafales de vent sous orages (20 à 35 mm) seront prévues, dimanche de 13H à 23H, dans les provinces de Jerada, Driouch, Guercif,.", 'size': 2}, {'id': '69', 'title': 'Alerte météo: Averses orageuses dimanche', 'source': 'aujourdhui.ma', 'link': 'https://aujourdhui.ma/actualite/alerte-meteo-averses-orageuses-dimanche', 'summary': 'Alerte météo: Averses orageuses dimanche. Des averses orageuses avec risque de grêle et de fortes rafales de vent sous orages sont attendus, dimanche, dans plusieurs provinces du Royaume, a indiqué la Direction générale de la météorologie (DGM). Ainsi, ces averses avec risque de grêle et de fortes rafales de vent sous orages (20 à 35 mm) seront prévues, dimanche de .', 'size': 3}, {'id': '70', 'title': 'Averses orageuses et risque de grêle dans neuf provinces dimanche', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/influences/climat/averses-orageuses-et-risque-de-grele-dans-neuf-provinces-dimanche/', 'summary': 'Averses orageuses et risque de grêle dans neuf provinces dimanche. La DGM annonce des averses orageuses accompagnées de grêle et de fortes rafales de vent dans plusieurs provinces du Royaume, dimanche de 13h à 23h. L’article est apparu en premier sur .', 'size': 2}], 'main_title': 'Alerte météo: Averses orageuses dimanche'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
