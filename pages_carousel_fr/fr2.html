<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>

nce de Presse Bahreïnie, le Commandement Général de Défense a ', 'size': 2}], 'main_title': 'Bahreïn : destruction de 86 missiles et 148 drones depuis le début de l’agression iranienne'}, {'community_id': '2', 'articles': [{'id': '66', 'title': 'Washington menace d’intensifier les frappes contre l’Iran, Téhéran affirme qu’il ne « se rendra jamais »', 'source': 'lnt.ma', 'link': 'https://lnt.ma/washington-menace-dintensifier-les-frappes-contre-liran-teheran-affirme-quil-ne-se-rendra-jamais/', 'summary': 'Washington menace d’intensifier les frappes contre l’Iran, Téhéran affirme qu’il ne « se rendra jamais ». La guerre menée par les États-Unis et Israël contre l’Iran est entrée dans sa deuxième semaine et continue de s’étendre à plusieurs pays du Moyen-Orient. Le président américain Donald Trump a menacé d’accroître les frappes contre la République islamique, tandis que les autorités iraniennes affirment qu’aucune capitulation n’est envisageable malgré les bombardements en cours. Dans . ', 'size': 2}, {'id': '75', 'title': 'L’Iran affirme pouvoir soutenir six mois de guerre face aux frappes israélo-américaines', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/465114-liran-affirme-pouvoir-soutenir-six-mois-de-guerre-face-aux-frappes-israelo-americaines.html', 'summary': 'L’Iran affirme pouvoir soutenir six mois de guerre face aux frappes israélo-américaines. Au neuvième jour d’un conflit qui embrase le Moyen-Orient, Téhéran a affirmé dimanche être en mesure de poursuivre la guerre contre les États-Unis et Israël pendant « au moins » six mois supplémentaires. Alors que les frappes visent désormais les infrastructures pétrolières iraniennes, le conflit déborde largement sur le Liban et les pays du Golfe, . ', 'size': 2}], 'main_title': 'Washington menace d’intensifier les frappes contre l’Iran, Téhéran affirme qu’il ne « se rendra jamais »'}, {'community_id': '0', 'articles': [{'id': '68', 'title': 'Des chutes de neige du mardi au mercredi dans plusieurs provinces du Maroc', 'source': 'fr.hespress.com', 'link': 'https://fr.hespress.com/465122-des-chutes-de-neige-du-mardi-au-mercredi-dans-plusieurs-provinces-du-maroc.html', 'summary': 'Des chutes de neige du mardi au mercredi dans plusieurs provinces du Maroc. Des chutes de neige, à partir de 1400m, sont attendues du mardi au mercredi dans plusieurs provinces du Royaume, a annoncé la Direction générale de la météorologie (DGM). Ce phénomène intéressera, du mardi à 06H00 au mercredi 23H00, les provinces d’Azilal, Béni Mellal, Ifrane et Boulemane (20-40 cm), a précisé la DGM dans un bulletin . ', 'size': 3}, {'id': '83', 'title': 'Des chutes de neige du mardi au mercredi dans plusieurs régions du Maroc', 'source': 'lematin.ma', 'link': 'https://lematin.ma/regions/des-chutes-de-neige-du-mardi-au-mercredi-dans-plusieurs-regions/333786', 'summary': "Des chutes de neige du mardi au mercredi dans plusieurs régions du Maroc. Des chutes de neige sont prévues, du mardi à 06H00 au mercredi 23H00, les provinces d'Azilal, Béni Mellal, Ifrane et Boulemane (20-40 cm), a précisé la DGM dans un bulletin d#.", 'size': 3}, {'id': '99', 'title': 'Alerte météo : Des chutes de neige du mardi au mercredi', 'source': 'aujourdhui.ma', 'link': 'https://aujourdhui.ma/actualite/alerte-meteo-des-chutes-de-neige-du-mardi-au-mercredi', 'summary': 'Alerte météo : Des chutes de neige du mardi au mercredi. Des chutes de neige, à partir de 1400m, sont attendues du mardi au mercredi dans plusieurs provinces du Royaume, a annoncé la Direction générale de la météorologie (DGM). Ce phénomène intéressera, du mardi à 06H00 au mercredi 23H00, les provinces d’Azilal, Béni Mellal, Ifrane et Boulemane (20-40 cm), a précisé la DGM dans un bulletin .', 'size': 3}], 'main_title': 'Des chutes de neige du mardi au mercredi dans plusieurs provinces du Maroc'}, {'community_id': '3', 'articles': [{'id': '84', 'title': 'S.M. le Roi a toujours considéré que la sécurité et la stabilité des pays du Golfe Arabe sont indissociables de la sécurité du Maroc (Bourita)', 'source': 'lematin.ma', 'link': 'https://lematin.ma/nation/la-stabilite-des-pays-du-golfe-sont-indissociables-de-la-securite-du-maroc/333781', 'summary': 'S.M. le Roi a toujours considéré que la sécurité et la stabilité des pays du Golfe Arabe sont indissociables de la sécurité du Maroc (Bourita). Cette position a été exprimée dans l’allocution de M. Bourita, lors des travaux de la session extraordinaire du Conseil de la Ligue des États arabes au niveau ministériel, consacré.', 'size': 2}, {'id': '106', 'title': 'Bourita: SM Le Roi considère que la sécurité du Golfe est indissociable de celle du Maroc', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/pouvoirs/diplomatie/bourita-sm-le-roi-considere-que-la-securite-du-golfe-est-indissociable-de-celle-du-maroc/', 'summary': 'Bourita: SM Le Roi considère que la sécurité du Golfe est indissociable de celle du Maroc. Cette position a été exprimée dans son allocution lors des travaux de la session extraordinaire du Conseil de la Ligue des États arabes au niveau ministériel, consacrée à l’examen de l’agression de l’Iran contre la souveraineté et l’intégrité des États arabes. L’article est apparu en premier sur .', 'size': 2}], 'main_title': 'S.M. le Roi a toujours considéré que la sécurité et la stabilité des pays du Golfe Arabe sont indissociables de la sécurité du Maroc (Bourita)'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
