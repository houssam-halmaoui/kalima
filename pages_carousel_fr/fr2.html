<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهم الأخبار - Treemap Carousel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.4.1/swiper-bundle.min.js"></script>
    
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
        }
        
        .swiper {
            width: 100%;
            height: 90vh;
            margin-top: 10px;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 10px;
            width: calc(100% - 20px); /* Utilisez calc pour soustraire les marges */
            margin-left: auto;
            margin-right: auto;

        }
        
        .treemap-container {
           width: 100%;
            height: 100%;
            margin-bottom: 10px;
            direction: rtl; /* Changez rtl en ltr */
            position: relative;
          z-index: 1;

        }
        
        .community-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            position: relative;
              z-index: 10;
              padding: 10px;
              background: rgba(255, 255, 255, 0.8); 
              text-align: center;
        }
        
        .node {
            overflow: hidden;
            border: 1px solid white;
            position: absolute;
            transition: all 0.3s;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .node:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .node-content {
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .node-title {
            font-size: 14px;  
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .node-source {
            font-size: 12px;  
            color: #666;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            font-size: 16px; 
            max-width: 90%;
            width: 350px;
            color: #333;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            direction: rtl;
            text-align: right;
        }
        
        .tooltip-title {
            font-size: 16px;  
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tooltip-source {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .tooltip-summary {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .swiper-pagination {
            position: relative;
            bottom: 0;
            margin-top: 15px;
        }
        
        .swiper-pagination-bullet {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .swiper-pagination-bullet-active {
            background-color: #007aff;
            opacity: 1;
            width: 20px;
            border-radius: 6px;
        }
        
        .swiper-button-next, .swiper-button-prev {
            color: #fff;
            background-color: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .swiper-button-next:hover, .swiper-button-prev:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: bold;
        }
        
        .header-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        @media screen and (max-width: 768px) {
            .node-title {
                font-size: 14px;  
            }
            .node-source {
                font-size: 12px;  
            }
            .community-title {
                font-size: 16px;  
            }
            .tooltip {
                max-width: 90%;
                padding: 12px;
            }
            .tooltip-title {
                font-size: 16px;
            }
            .swiper-button-next, .swiper-button-prev {
                width: 36px;
                height: 36px;
            }
        }
    </style>
    
    
    
</head>
<body>
    <header> 
        <div class="header-title"> Les principales actualités des dernières 24 heures

</div>    
        <div class="header-subtitle"> Dernière mise à jour : 08/03/2026 - 11h28</div>  
    </header>
    
    

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="treemap-carousel"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

ble" à "positive". L’agence de notation Moody’s Ratings a révisé de « stable » à « positive » la perspective de la note « Ba1 » du Maroc pour sa dette à long terme en devises et en monnaie locale. « La perspective positive reflète l’amélioration progressive de la solidité économique et budgétaire du Maroc, susceptible de renforcer davantage son profil de crédit et, si.', 'size': 4}, {'id': '34', 'title': 'Moody’s révise la note souveraine du Maroc de «\xa0stable\xa0» à «\xa0positive\xa0» : une amélioration prometteuse ouvrant la voie vers l’Investment grade', 'source': 'aujourdhui.ma', 'link': 'https://aujourdhui.ma/economie/moodys-revise-la-note-souveraine-du-maroc-de-stable-a-positive-une-amelioration-prometteuse-ouvrant-la-voie-vers-linvestment-grade', 'summary': 'Moody’s révise la note souveraine du Maroc de « stable » à « positive » : une amélioration prometteuse ouvrant la voie vers l’Investment grade. L’Agence de notation Moody’s a relevé la perspective de la note souveraine du Royaume du Maroc, la faisant passer de « stable » à « positive », tout en maintenant la notation à « Ba1 ». Cette évolution confirme la trajectoire ascendante de la notation souveraine du Royaume, après la dégradation de la perspective à négative en 2021, liée aux impacts .', 'size': 2}, {'id': '40', 'title': 'Moody’s\xa0: Perspectives positives pour le Royaume', 'source': 'www.lavieeco.com', 'link': 'https://www.lavieeco.com/argent/moodys-perspectives-positives-pour-le-royaume/', 'summary': 'Moody’s : Perspectives positives pour le Royaume. Le 6 mars 2026, l’agence de notation Moody’s Ratings a révisé de « stable » à « positive » la perspective de la note « Ba1 » du Maroc pour sa dette à long terme en devises et en monnaie locale. L’article est apparu en premier sur .', 'size': 4}, {'id': '43', 'title': 'Moody’s relève la perspective du Maroc à «\xa0positive\xa0»', 'source': 'leseco.ma', 'link': 'https://leseco.ma/maroc/moodys-releve-la-perspective-du-maroc-a-positive.html', 'summary': 'Moody’s relève la perspective du Maroc à « positive ». L’agence de notation Moody’s Ratings a révisé de "stable" à "positive" la perspective de la note "Ba1" du Maroc pour sa dette à long terme en devises et en monnaie locale. ', 'size': 4}, {'id': '60', 'title': 'Moody’s relève la perspective de la note souveraine du Maroc à « positive »', 'source': 'lnt.ma', 'link': 'https://lnt.ma/moodys-releve-la-perspective-de-la-note-souveraine-du-maroc-a-positive/', 'summary': 'Moody’s relève la perspective de la note souveraine du Maroc à « positive ». L’agence de notation Moody’s Ratings a révisé de « stable » à « positive » la perspective associée à la note « Ba1 » du Maroc pour sa dette souveraine à long terme, libellée en devises et en monnaie locale. Cette décision reflète l’amélioration progressive des fondamentaux économiques et budgétaires du Royaume, indique le ministère . ', 'size': 5}], 'main_title': 'Moody’s relève la perspective de la note souveraine du Maroc à « positive »'}, {'community_id': '2', 'articles': [{'id': '51', 'title': 'Bahreïn : destruction de 86 missiles et 148 drones depuis le début de l’agression iranienne', 'source': 'atlasinfo.fr', 'link': 'https://atlasinfo.fr/bahrein-destruction-de-86-missiles-et-148-drones-depuis-le-debut-de-lagression-iranienne-contre-le-royaume.html', 'summary': 'Bahreïn : destruction de 86 missiles et 148 drones depuis le début de l’agression iranienne. Le Commandement Général des Forces de Défense du Bahreïn a annoncé samedi, que ses systèmes de défense aérienne ont intercepté et détruit 86 missiles et 148 drones ciblant le Royaume du Bahreïn et ce, depuis le début de l’agression iranienne. Dans un communiqué relayé par l’Agence de Presse Bahreïnie, le Commandement Général de Défense a . L’article est apparu en premier sur .', 'size': 2}, {'id': '57', 'title': 'Bahreïn | 86 missiles et 148 drones interceptés et détruits depuis le début de l’agression iranienne', 'source': 'www.lereporter.ma', 'link': 'https://www.lereporter.ma/bahrein-86-missiles-et-148-drones-interceptes-et-detruits-depuis-le-debut-de-lagression-iranienne/', 'summary': 'Bahreïn | 86 missiles et 148 drones interceptés et détruits depuis le début de l’agression iranienne. Le Commandement Général des Forces de Défense du Bahreïn a annoncé samedi, que ses systèmes de défense aérienne ont intercepté et détruit 86 missiles et 148 drones ciblant le Royaume du Bahreïn et ce, depuis le début de l’agression iranienne. Dans un communiqué relayé par l’Agence de Presse Bahreïnie, le Commandement Général de Défense a ', 'size': 2}], 'main_title': 'Bahreïn : destruction de 86 missiles et 148 drones depuis le début de l’agression iranienne'}];
        
        const tooltip = d3.select("#tooltip");
        
        const communityColors = d3.scaleOrdinal()
            .domain(treemapData.map(d => d.community_id))
            .range(d3.quantize(d3.interpolateRainbow, treemapData.length));
        
        let clickTimer = null;
        let clickCount = 0;
        
        function createTreemap(data, containerId) {
            const container = d3.select(`#${containerId}`);
            const width = container.node().getBoundingClientRect().width;
            const height = container.node().getBoundingClientRect().height;
            
            const sources = [...new Set(data.articles.map(d => d.source))];
            const color = d3.scaleOrdinal()
                .domain(sources)
                .range(d3.quantize(d3.interpolateHcl("#007FFF", "#FFA500"), sources.length));
            
                        
            const hierarchyData = {
                name: "root",
                children: data.articles
            };
            
            const root = d3.hierarchy(hierarchyData)
                .sum(d => d.size || 1)
                .sort((a, b) => b.value - a.value);
            
            const treemap = d3.treemap()
                .size([width, height])
                .padding(4)
                .round(true);
            
            treemap(root);
            
            const nodes = container.selectAll(".node")
                .data(root.leaves())
                .enter()
                .append("div")
                .attr("class", "node")
                .style("left", d => `${d.x0}px`)
                .style("top", d => `${d.y0}px`)
                .style("width", d => `${d.x1 - d.x0}px`)
                .style("height", d => `${d.y1 - d.y0}px`)
                .style("background-color", d => color(d.data.source))
                .on("click", function(event, d) {
                    clickCount++;
                    
                    if (clickCount === 1) {
                        showTooltip(event, d);
                        
                        clickTimer = setTimeout(function() {
                            clickCount = 0;
                        }, 300);
                    } else {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        if (d.data.link && d.data.link !== "#") {
                            window.open(d.data.link, '_blank');
                        }
                    }
                })
                .on("mouseover", function(event, d) {
                    if (window.innerWidth > 768) {
                        showTooltip(event, d);
                    }
                })
                .on("mousemove", function(event) {
                    if (window.innerWidth > 768) {
                        moveTooltip(event);
                    }
                })
                .on("mouseout", function() {
                    if (window.innerWidth > 768 && clickCount === 0) {
                        hideTooltip();
                    }
                });
            
            nodes.append("div")
                .attr("class", "node-content")
                .html(d => `
                    <div class="node-title">${d.data.title ? d.data.title : 'Sans titre'}</div>
                    <div class="node-source">${d.data.source}</div>
                `);
        }
        
        function showTooltip(event, d) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = d.data.summary || '';

            const cleanSummary = tempDiv.textContent || tempDiv.innerText || '';

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
