26', 'source': 'www.yabiladi.com', 'link': 'https://www.yabiladi.com/articles/details/208205/maroc-prix-consommation-augmentent-octobre.html', 'summary': 'Maroc : les prix à la consommation augmentent de 1,9% en octobre 2026. Au Maroc, l’indice des prix à la consommation (IPC) a progressé de 1,9% en octobre 2026 par rapport à octobre 2025, selon une note du Haut-Commissariat au Plan (HCP). Cette hausse s’explique par le renchérissement des produits non alimentaires (+3,1%) et alimentaires (+0,3%).', 'size': 3}], 'main_title': 'La hausse des prix alimentaires s’accélère en octobre 2026 (HCP)'}, {'community_id': '6', 'articles': [{'id': '36', 'title': "Football pour amputés : ces Lions de l'Atlas qui font sensation au Mondial 2026", 'source': 'telquel.ma', 'link': 'https://telquel.ma/2026/11/20/football-pour-amputes-ces-lions-de-latlas-qui-font-sensation-au-mondial-2026_2019208', 'summary': "Football pour amputés : ces Lions de l'Atlas qui font sensation au Mondial 2026. Encore peu connue du grand public, la sélection marocaine de football pour amputés réalise un parcours historique à la Coupe du monde 2026 au Mexique. Invaincus, les Lions de l’Atlas se sont qualifiés pour les demi-finales en éliminant l’Angola, ancien champion du monde. Un exploit qui enflamme les réseaux sociaux et met en lumière une.", 'size': 2}, {'id': '212', 'title': 'Mondial de football pour amputés : le Maroc élimine l’Angola (4-1) et se qualifie pour les demi-finales', 'source': 'lnt.ma', 'link': 'https://lnt.ma/mondial-de-football-pour-amputes-le-maroc-elimine-langola-4-1-et-se-qualifie-pour-les-demi-finales/', 'summary': 'Mondial de football pour amputés : le Maroc élimine l’Angola (4-1) et se qualifie pour les demi-finales. La sélection marocaine de football pour amputés poursuit sa campagne au Mondial 2026. Opposés à l’Angola en quart de finale, les joueurs dirigés par Othman El Najmi se sont imposés sur le score de 4 buts à 1, au terme d’une rencontre qui s’est prolongée au-delà du temps                 .html(`
                    <div class="tooltip-title">${d.data.title}</div>
                    <div class="tooltip-source">${d.data.source}</div>
                    <div class="tooltip-summary">${cleanSummary ? cleanSummary : ''}</div>
                `);

            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltipNode = tooltip.node();
            const tooltipWidth = tooltipNode.offsetWidth;
            const tooltipHeight = tooltipNode.offsetHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            if (left + tooltipWidth > window.innerWidth) {
                left = event.pageX - tooltipWidth - 15;
            }
            
            if (top + tooltipHeight > window.innerHeight) {
                top = event.pageY - tooltipHeight - 15;
            }
            
            if (window.innerWidth <= 768) {
                left = (window.innerWidth - tooltipWidth) / 2;
                top = window.scrollY + (window.innerHeight - tooltipHeight) / 3;
            }
            
            tooltip.style("left", `${left}px`)
                .style("top", `${top}px`);
        }
        
        // Fonction pour cacher le tooltip
        function hideTooltip() {
            tooltip.style("opacity", 0);
        }
        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768 && 
                !event.target.closest('.node') && 
                !event.target.closest('.tooltip')) {
                hideTooltip();
            }
        });
        
        function initCarousel() {
            const carouselContainer = document.getElementById('treemap-carousel');
            
            treemapData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                const title = document.createElement('div');
                title.className = 'community-title';
                title.textContent = data.main_title;
                slide.appendChild(title);
                
                const treemapContainer = document.createElement('div');
                treemapContainer.className = 'treemap-container';
                treemapContainer.id = `treemap-${data.community_id}`;
                slide.appendChild(treemapContainer);
                
                carouselContainer.appendChild(slide);
            });
            
            const swiper = new Swiper(".mySwiper", {
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                    
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                spaceBetween: 30,
                
                keyboard: {
                    enabled: true,
                },
                grabCursor: true, 
                effect: "slide", 
                speed: 600, 
                loop: true, 
                spaceBetween: 30,
                on: {
                    slideChange: function() {
                        
                        setTimeout(function() {
                            window.dispatchEvent(new Event('resize'));
                            hideTooltip();
                        }, 300);
                    }
                }
            });
            
            setTimeout(() => {
                treemapData.forEach(data => {
                    createTreemap(data, `treemap-${data.community_id}`);
                });
            }, 300);
            
            window.addEventListener('resize', () => {
                treemapData.forEach(data => {
                    const container = document.getElementById(`treemap-${data.community_id}`);
                    container.innerHTML = '';
                    createTreemap(data, `treemap-${data.community_id}`);
                });
                hideTooltip();
            });
        }
        
        window.addEventListener('load', initCarousel);
        
    </script>
    
    
    
</body>
