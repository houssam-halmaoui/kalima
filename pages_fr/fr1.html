nce Madame Rachel Ruto, Premi\u00e8re Dame de la R\u00e9publique du Kenya. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Voici un communiqu\u00e9 du Cabinet\nRoyal :Eu \u00e9gard au tournant...", "mass": 5, "physics": false, "shape": "box", "title": "Voici un communiqu\u00e9 du Cabinet Royal :Eu \u00e9gard au tournant historique qu\u2019a connu le processus de la Cause Nationale et ayant \u00e0 l\u2019esprit les d\u00e9veloppements d\u00e9cisifs apport\u00e9s p. [lematin.ma]\n-------------------------------------------------\nDans un communiqu\u00e9, le Cabinet royal a annonc\u00e9 l\u2019instauration du 31 octobre comme nouvelle f\u00eate nationale baptis\u00e9e \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), en hommage au tournant historique de la cause nationale et \u00e0 la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9. [telquel.ma]\n-------------------------------------------------\nPar un communiqu\u00e9 du Cabinet Royal diffus\u00e9 lundi, Sa Majest\u00e9 le Roi Mohammed VI a d\u00e9cr\u00e9t\u00e9 la date du 31 octobre de chaque ann\u00e9e comme \u201cA\u00efd Al Wahda\u201d, la F\u00eate de l\u2019Unit\u00e9 nationale. [www.yabiladi.com]\n-------------------------------------------------\nVoici un communiqu\u00e9 du Cabinet Royal : \u00ab Eu \u00e9gard au tournant historique qu\u2019a connu le processus de la Cause Nationale et ayant \u00e0 l\u2019esprit les d\u00e9veloppements d\u00e9cisifs apport\u00e9s par la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9, qui a fait l\u2019objet du r\u00e9cent Discours adress\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste et . [aujourdhui.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a d\u00e9cr\u00e9t\u00e9 que la journ\u00e9e du 31 octobre sera d\u00e9sormais c\u00e9l\u00e9br\u00e9e chaque ann\u00e9e comme \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), selon un communiqu\u00e9 du Cabinet Royal diffus\u00e9 mardi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "L\u2019ONDA lance l\u2019appel d\u2019offres pour\nle futur terminal HUB de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ONDA lance l\u2019appel d\u2019offres pour le futur terminal HUB de l\u2019a\u00e9roport Casablanca Mohammed V. Apr\u00e8s un appel \u00e0 manifestation d\u2019int\u00e9r\u00eat international en mai dernier, l\u2019ONDA enclenche la vitesse sup\u00e9rieure en ouvrant l\u2019appel d\u2019offres pour d\u00e9signer le constructeur ou groupemen. [lematin.ma]\n-------------------------------------------------\nL\u0027ONDA lance l\u0027appel d\u0027offres pour le nouveau terminal de l\u0027a\u00e9roport Casablanca Mohammed V. L\u2019Office national des a\u00e9roports a lanc\u00e9 l\u2019appel d\u2019offres pour la construction du nouveau terminal hub de l\u2019a\u00e9roport Casablanca Mohammed V, apr\u00e8s le lancement, en mai dernier, d\u2019un appel \u00e0 manifestation international, selon un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des a\u00e9roports (ONDA) a lanc\u00e9 un appel d\u2019offres pour la construction du futur terminal HUB de l\u2019a\u00e9roport Casablanca Mohammed V, engageant l\u2019une des plus grandes op\u00e9rations de construction de son histoire et confirmant sa dynamique de transformation. [lnt.ma]\n-------------------------------------------------\nL\u2019Office national des a\u00e9roports (ONDA) a lanc\u00e9 un appel d\u2019offres pour la construction du nouveau terminal hub de l\u2019a\u00e9roport Casablanca Mohammed V, un projet majeur estim\u00e9 \u00e0 10 milliards de dirhams. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cap Hospitality illustre la force\ndu partenariat public-priv\u00e9 dans le...", "mass": 5, "physics": false, "shape": "box", "title": "Cap Hospitality illustre la force du partenariat public-priv\u00e9 dans le secteur touristique. [lematin.ma]\n-------------------------------------------------\nCe programme de financement pour la mise \u00e0 niveau des h\u00f4tels, a enregistr\u00e9, \u00e0 ce jour, 91 demandes \u00e9ligibles repr\u00e9sentant 14.000 chambres et un investissement global de 7 MMDH, dont une soixantaine de dossiers d\u00e9j\u00e0 accord\u00e9s, selon le minist\u00e8re du Tourisme. [www.lavieeco.com]\n-------------------------------------------------\nSelon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, il a enregistr\u00e9 \u00e0 ce jour 91 demandes \u00e9ligibles, repr\u00e9sentant 14.000 chambres et un investissement global . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Selon le communiqu\u00e9 des organisateurs,\nAbdellatif Jouahri a \u00e9t\u00e9 honor\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le communiqu\u00e9 des organisateurs, Abdellatif Jouahri a \u00e9t\u00e9 honor\u00e9 pour sa prudence, sa cr\u00e9dibilit\u00e9 et son excellence de gouvernance, des qualit\u00e9s qui ont permis \u00e0 Bank Al-Magh. [lematin.ma]\n-------------------------------------------------\nLa finance marocaine s\u2019est distingu\u00e9e lors des AFIS Awards 2025, tenus lundi soir \u00e0 Casablanca en marge du 5\u00e8me Africa Financial Summit (AFIS), avec la cons\u00e9cration du Wali de Bank Al-Maghrib, Abdellatif Jouahri, d\u00e9sign\u00e9 \u00ab African Central Bank Governor \u00bb, et du Pr\u00e9sident-Directeur G\u00e9n\u00e9ral d\u2019Attijariwafa Bank, Mohamed El Kettani, sacr\u00e9 \u00ab African Banker \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Depuis plus de vingt ans,\nle Festival international du film...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis plus de vingt ans, le Festival international du film de Marrakech c\u00e9l\u00e8bre le cin\u00e9ma dans ce qu\u2019il a de plus universel : sa capacit\u00e9 \u00e0 \u00e9mouvoir, \u00e0 rassembler et \u00e0 raconter le. [lematin.ma]\n-------------------------------------------------\nPour sa 22\u1d49 \u00e9dition, le Festival International du Film de Marrakech, qui se tiendra du 28 novembre au 6 d\u00e9cembre 2025, rend hommage \u00e0 quatre figures embl\u00e9matiques du septi\u00e8me art : Jodie Foster, Guillermo del Toro, Raouya et Hussein Fahmi. [www.lopinion.ma]\n-------------------------------------------------\nLa 22e \u00e9dition du Festival International du Film de Marrakech, qui se d\u00e9roulera du 28 novembre au 6 d\u00e9cembre 2025, c\u00e9l\u00e9brera quatre grandes figures du septi\u00e8me art : Jodie Foster, Guillermo del Toro, Raouya et Hussein Fahmi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La province de Sidi Bennour\na accueilli mardi une rencontre...", "mass": 5, "physics": false, "shape": "box", "title": "La province de Sidi Bennour a accueilli mardi une rencontre de concertation consacr\u00e9e \u00e0 la nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9, conform\u00e9ment aux hautes orientations de SM le Roi Mohammed VI. [www.lopinion.ma]\n-------------------------------------------------\nSous l\u2019impulsion de S.M le Roi Mohammed VI, le Royaume lance ce mardi 4 novembre 2025 une nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Selon la note du Haut-Commissariat\nau Plan (HCP) relative au...", "mass": 5, "physics": false, "shape": "box", "title": "Selon la note du Haut-Commissariat au Plan (HCP) relative au troisi\u00e8me trimestre 2025, le ch\u00f4mage recule l\u00e9g\u00e8rement, mais le sous-emploi atteint son niveau le plus \u00e9lev\u00e9 depuis trois ans, traduisant les tensions persistantes sur la qualit\u00e9 de l\u2019emploi. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019\u00e9conomie marocaine a enregistr\u00e9 la cr\u00e9ation nette de 167.000 emplois entre le troisi\u00e8me trimestre de 2024 et celui de 2025, dont 164.000 en milieu urbain et 3.000 en milieu rural, selon la note d\u2019information du Haut-Commissariat au Plan (HCP) sur la situation du march\u00e9 du travail. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le ministre du Transport et\nde la Logistique, Abdessamad Kayouh,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre du Transport et de la Logistique, Abdessamad Kayouh, a affirm\u00e9, lundi \u00e0 Rabat, que le Maroc est pleinement dispos\u00e9 \u00e0 soutenir toute initiative visant \u00e0 consolider la coop\u00e9ration arabe dans le domaine du transport a\u00e9rien et \u00e0 concr\u00e9tiser les partenariats interarabes. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre du Transport et de la Logistique, Abdessamad Kayouh, a affirm\u00e9, lundi \u00e0 Rabat, que le Maroc est pleinement dispos\u00e9 \u00e0 soutenir toute initiative visant \u00e0 consolider la coop\u00e9ration arabe dans le domaine du transport a\u00e9rien et \u00e0 concr\u00e9tiser les partenariats interarabes. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label de SM le Roi Mohammed VI, la 22e \u00e9dition du salon Maroc in Mode (MIM) se tiendra du 5 au 7 novembre 2025 [www.challenge.ma]\n-------------------------------------------------\nPlac\u00e9e sous le Haut Patronage du Roi Mohammed VI, la 22\u1d49 \u00e9dition du salon Maroc in Mode (MIM) se tiendra du 5 au 7 novembre 2025 \u00e0 Casablanca, sous le th\u00e8me \u00ab Morocco, the Smart Hub for Global Textile \u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "SM le Roi inaugure le\nComplexe hospitalo-universitaire International Mohammed VI...", "mass": 5, "physics": false, "shape": "box", "title": "SM le Roi inaugure le Complexe hospitalo-universitaire International Mohammed VI de Rabat et ordonne la mise en service du CHU Mohammed VI d\u2019Agadir. [www.challenge.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi inaugure le Complexe hospitalo-universitaire international Mohammed VI de Rabat et donne Ses Hautes Instructions pour la mise en service du CHU Mohammed VI d\u2019Agadir. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Trois nageurs passionn\u00e9s, Dino Sebti,\nS\u00e9bastien Deflandre et Nadia Ben...", "mass": 5, "physics": false, "shape": "box", "title": "Trois nageurs passionn\u00e9s, Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 repousser leurs limites pour rendre hommage \u00e0 cet \u00e9v\u00e9nement historique \u00e0 travers une aventure in\u00e9dite : \u00ab La Nage Verte \u00bb. [leseco.ma]\n-------------------------------------------------\nTrois nageurs passionn\u00e9s, Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 repousser leurs limites pour rendre hommage \u00e0 cet \u00e9v\u00e9nement historique \u00e0 travers une aventure in\u00e9dite : \u00abLa Nage . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La troisi\u00e8me \u00e9dition de la\nJourn\u00e9e nationale de l\u2019industrie, organis\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "La troisi\u00e8me \u00e9dition de la Journ\u00e9e nationale de l\u2019industrie, organis\u00e9e les 3 et 4 novembre 2025 \u00e0 Rabat, a \u00e9t\u00e9 marqu\u00e9e d\u00e8s sa premi\u00e8re journ\u00e9e par la signature de cinq conventions d\u00e9di\u00e9es \u00e0 la promotion de l\u2019industrie \u201cMade in Morocco\u201d. [leseco.ma]\n-------------------------------------------------\nEn marge de la 3\u00e8me Journ\u00e9e Nationale de l\u2019Industrie tenue les 3 et 4 novembre \u00e0 Rabat, M.Nassim Belkhayat, le patron de Neo Motors Maroc, a bien voulu nous expliquer les ambitions du groupe, mais surtout les enjeux de l\u2019industrie automobile \u00ab Made In Morocco \u00bb. [lnt.ma]\n-------------------------------------------------\nLors de la 3\u00e8me Journ\u00e9e nationale de l\u2019industrie \u00e0 Rabat, le Chef du gouvernement Aziz Akhannouch a mis en lumi\u00e8re la forte progression du secteur industriel marocain, qui double son effectif en dix ans avec 985.000 salari\u00e9s, et les exportations manufacturi\u00e8res en hausse de 64 % depuis 2019. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le Wali de Bank Al-Maghrib\n(BAM), Abdellatif Jouahri, a tenu,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Wali de Bank Al-Maghrib (BAM), Abdellatif Jouahri, a tenu, lundi \u00e0 Casablanca, une r\u00e9union de travail avec Andr\u00e9 Wameso Nkualoloki, Gouverneur de la Banque Centrale du Congo (BCC), en marge de la 5\u1d49 \u00e9dition de l\u2019Africa Financial Industry Summit (AFIS 2025), organis\u00e9e les 3 et 4 novembre. [lnt.ma]\n-------------------------------------------------\nEn marge du Sommet africain de l\u2019industrie financi\u00e8re (AFIS 2025), Abdellatif Jouahri, wali de Bank Al-Maghrib, et Andr\u00e9 Wameso Nkualoloki, gouverneur de la Banque centrale du Congo (BCC), ont tenu une r\u00e9union de travail consacr\u00e9e au renforcement de la coop\u00e9ration bilat\u00e9rale entre les deux institutions. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le jeune socialiste d\u00e9mocrate est\nle nouveau maire qui va...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune socialiste d\u00e9mocrate est le nouveau maire qui va pr\u00e9sider, \u00e0 partir de janvier 2026, aux destin\u00e9es de la ville de New York, \u00ab citadelle \u00bb du lib\u00e9ralisme am\u00e9ricain et haut lieu de la politique du libre march\u00e9. [fr.hespress.com]\n-------------------------------------------------\nLe jeune socialiste d\u00e9mocrate est le nouveau maire qui va pr\u00e9sider, \u00e0 partir de janvier 2026, aux destin\u00e9es de la ville de New York, \u00ab citadelle \u00bb du lib\u00e9ralisme am\u00e9ricain et haut lieu de la politique du libre march\u00e9. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "L\u0027une des figures majeures du\ncin\u00e9ma contemporain et laur\u00e9at de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027une des figures majeures du cin\u00e9ma contemporain et laur\u00e9at de la Palme d\u2019or du Festival de Cannes en 2007 pour son film 4 mois, 3 semaines et 2 jours, le grand ci. [lematin.ma]\n-------------------------------------------------\nDu 30 novembre au 4 d\u00e9cembre, la 8\u1d49 \u00e9dition des Ateliers de l\u2019Atlas, volet professionnel du Festival International du Film de Marrakech, r\u00e9unira 28 pr         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {

                    Array.from(mutation.addedNodes).forEach(function(node) {

                            }
                        }

            });
        });

            childList: true,
            subtree: true
        });
