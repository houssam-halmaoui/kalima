 lors d\u2019une intervention devant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e mercredi lors d\u2019une intervention devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies, dans le cadre de la reprise du d\u00e9bat sur les cons\u00e9quences du veto . [fr.hespress.com]\n-------------------------------------------------\nLe plan d\u2019autonomie marocain a \u00e9t\u00e9 soutenu par une large majorit\u00e9 de pays, mardi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies, le consid\u00e9rant comme la seule base s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste pour le r\u00e8glement d\u00e9finitif du diff\u00e9rend artificiel autour du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Maroc PME a fait escale,\nmercredi 11 novembre 2026, \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Maroc PME a fait escale, mercredi 11 novembre 2026, \u00e0 Casablanca dans le cadre de sa tourn\u00e9e nationale \u00ab Pacte TPME en R\u00e9gions \u00bb, organis\u00e9e sous le th\u00e8me \u00ab Pacte TPME : L\u2019acc\u00e9l\u00e9rat. [lematin.ma]\n-------------------------------------------------\n\u00c0 Casablanca, Maroc PME poursuit sa tourn\u00e9e r\u00e9gionale pour rapprocher ses dispositifs d\u2019accompagnement des entrepreneurs et soutenir la croissance des TPME. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Agence Maroc PME a organis\u00e9, mercredi 11 novembre \u00e0 Casablanca, une rencontre dans le cadre de sa tourn\u00e9e nationale \u00ab PACTE TPME en R\u00e9gions \u00bb, plac\u00e9e sous le th\u00e8me \u00ab PACTE TPME : l\u2019acc\u00e9l\u00e9rateur de votre croissance \u00bb. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le jeune Marocain Ali Dbilij\na r\u00e9ussi l\u0027ascension du Kilimandjaro...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune Marocain Ali Dbilij a r\u00e9ussi l\u0027ascension du Kilimandjaro \u00e0 l\u0027\u00e2ge de 17 ans. [lematin.ma]\n-------------------------------------------------\nDe retour \u00e0 Casablanca le 10 novembre, il a \u00e9t\u00e9 chaleureusement accueilli \u00e0 l\u2019a\u00e9roport Mohammed V. Au terme d\u2019une exp\u00e9dition de sept jours en Tanzanie, Ali Dbilij, 17 ans, a r\u00e9ussi l\u2019ascension du plus haut sommet du continent par . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le groupe haraki \u00e0 la\nChambre des repr\u00e9sentants a propos\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe haraki \u00e0 la Chambre des repr\u00e9sentants a propos\u00e9, dans ses amendements au projet de loi de finances pour 2027, de limiter l\u2019exon\u00e9ration des droits de douane sur les importations de b\u00e9tail et de viande \u00e0 la p\u00e9riode allant du 1er janvier 2027 au 31 d\u00e9cembre 2028, et de soumettre son b\u00e9n\u00e9fice \u00e0 un. [telquel.ma]\n-------------------------------------------------\nL\u2019examen des amendements au projet de loi de finances (PLF) 2027 a donn\u00e9 lieu, mercredi 11 novembre \u00e0 la Chambre des repr\u00e9sentants, \u00e0 plusieurs d\u00e9bats portant sur la r\u00e9glementation de la profession de transitaire en douane, les exon\u00e9rations accord\u00e9es aux importations de b\u00e9tail et de viandes, ainsi que la protection de l\u2019industrie pharmaceutique nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Les terminaux \u00e0 conteneurs du\nport d\u2019Alg\u00e9siras sont totalement paralys\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Les terminaux \u00e0 conteneurs du port d\u2019Alg\u00e9siras sont totalement paralys\u00e9s depuis 2 heures du matin et devraient le rester jusqu\u2019\u00e0 jeudi \u00e0 la m\u00eame heure, en raison d\u2019une gr\u00e8ve g\u00e9n\u00e9rale convoqu\u00e9e en Espagne, ont rapport\u00e9 des sources portuaires cit\u00e9es par l\u2019agence de presse EFE. [telquel.ma]\n-------------------------------------------------\nLa gr\u00e8ve au port d\u2019Alg\u00e9siras paralyse les terminaux \u00e0 conteneurs depuis 2 heures du matin, mercredi 11 novembre, selon des sources portuaires cit\u00e9es par l\u2019agence EFE. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "En c\u00e9dant pr\u00e8s de 500.000\nactions le 26 octobre, MC...", "mass": 5, "physics": false, "shape": "box", "title": "En c\u00e9dant pr\u00e8s de 500.000 actions le 26 octobre, MC IV Money S.A et Mediterrania Capital IV Morocco FPCC-RFA Compartiment 1 ram\u00e8nent leur participation commune \u00e0 environ 8,15 % du capital de Cash Plus. [telquel.ma]\n-------------------------------------------------\nDans les six mois qui suivent le franchissement du seuil pr\u00e9cit\u00e9, MC IV Money S.A. et Mediterrania Capital IV Morocco FPCC-RFA Compartiment 1 envisagent de poursuivre leurs cessions sur la valeur Cash Plus. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le minist\u00e8re de l\u2019Equipement, de\nl\u2019Eau et des For\u00eats a...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Equipement, de l\u2019Eau et des For\u00eats a appel\u00e9 les usagers de la route \u00e0 observer un ensemble de mesures de pr\u00e9vention afin de garantir leur s\u00e9curit\u00e9, suite au bulletin d\u2019alerte m\u00e9t\u00e9orologique \u00e9mis par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie qui pr\u00e9voit, mercredi et jeudi, de fortes pluies orageuses accompagn\u00e9es d\u2019importantes pr\u00e9cipitations dans. [telquel.ma]\n-------------------------------------------------\nMesures de pr\u00e9vention : Le minist\u00e8re de l\u2019\u00e9quipement, de l\u2019eau et des for\u00eats a appel\u00e9 les usagers de la route \u00e0 observer plusieurs mesures de pr\u00e9vention afin de garantir leur s\u00e9curit\u00e9, suite au bulletin d\u2019alerte m\u00e9t\u00e9orologique \u00e9mis par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie qui pr\u00e9voit, mercredi et jeudi, de fortes pluies orageuses accompagn\u00e9es d\u2019importantes . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La direction provinciale du minist\u00e8re\nde l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire,...", "mass": 5, "physics": false, "shape": "box", "title": "La direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification a annonc\u00e9 la suspension des cours, mercredi, dans l\u2019ensemble des \u00e9tablissements scolaires en milieu rural, ainsi que durant l\u2019apr\u00e8s-midi dans ceux situ\u00e9s en milieu urbain. [telquel.ma]\n-------------------------------------------------\nLes cours sont exceptionnellement suspendus dans l\u2019apr\u00e8s-midi du mercredi 11 novembre 2026 dans tous les \u00e9tablissements scolaires de la province d\u2019Essaouira, en raison des mauvaises conditions m\u00e9t\u00e9orologiques annonc\u00e9es. [www.yabiladi.com]\n-------------------------------------------------\nLa Direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification a annonc\u00e9 la suspension exceptionnelle des cours pour l\u2019apr\u00e8s-midi de ce mercredi dans l\u2019ensemble des \u00e9tablissements scolaires de la province, en raison des mauvaises conditions m\u00e9t\u00e9orologiques pr\u00e9vues. [aujourdhui.ma]\n-------------------------------------------------\nLes Directions provinciales de l\u0027\u00c9ducation nationale ont d\u00e9cid\u00e9 cette suspension provisoire \u00e0 la suite du bulletin d\u0027alerte de la DGM. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "L\u2019AS FAR s\u2019est hiss\u00e9e, mercredi\n11 novembre, en finale de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019AS FAR s\u2019est hiss\u00e9e, mercredi 11 novembre, en finale de la Ligue des champions f\u00e9minine de la CAF 2026, organis\u00e9e en \u00c9gypte, gr\u00e2ce \u00e0 sa victoire contre le club camerounais Leki\u00e9 Football Filles (1-0). [www.yabiladi.com]\n-------------------------------------------------\nL\u2019AS FAR s\u2019est qualifi\u00e9e mercredi pour la finale de la Ligue des champions f\u00e9minine de la CAF 2026, apr\u00e8s sa victoire (1-0) face au club camerounais de Leki\u00e9 Football Filles. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le ministre des Affaires \u00e9trang\u00e8res\nNasser Bourita repr\u00e9sente le roi...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res Nasser Bourita repr\u00e9sente le roi Mohammed VI au sommet des dirigeants de la COP31, organis\u00e9 les 11 et 12 novembre 2026 \u00e0 Antalya, en Turquie. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, repr\u00e9sente Sa Majest\u00e9 le Roi Mohammed VI aux travaux du Sommet des dirigeants de la COP31, organis\u00e9 les 11 et 12 novembre \u00e0 Antalya, en Turquie. [www.lavieeco.com]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, une importante d\u00e9l\u00e9gation marocaine participe \u00e0 la COP31 \u00e0 Antalya, du 9 au 20 novembre 2026. [maroc-diplomatique.net]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019Assiste, une importante d\u00e9l\u00e9gation du Royaume du Maroc prend part \u00e0 la 31\u1d49 Conf\u00e9rence des Parties \u00e0 la Convention-cadre des Nations unies sur les changements climatiques (COP31), qui se tient du 9 au 20 novembre \u00e0 Antalya, en Turquie. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Objectif : renforcer la coh\u00e9rence\ndes politiques publiques, am\u00e9liorer l\u2019attractivit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Objectif : renforcer la coh\u00e9rence des politiques publiques, am\u00e9liorer l\u2019attractivit\u00e9 des r\u00e9gions et r\u00e9\u00e9quilibrer le d\u00e9veloppement urbain. [www.lavieeco.com]\n-------------------------------------------------\nLe gouvernement pr\u00e9pare une nouvelle vision de l\u2019am\u00e9nagement du territoire \u00e0 l\u2019horizon 2050, avec l\u2019ambition de mieux articuler les politiques publiques, de renforcer le r\u00f4le des villes interm\u00e9diaires et de r\u00e9duire les disparit\u00e9s territoriales. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Un test ADN, une famille\naux secrets bien gard\u00e9s et...", "mass": 5, "physics": false, "shape": "box", "title": "Un test ADN, une famille aux secrets bien gard\u00e9s et une enqu\u00eate o\u00f9 l\u2019humour se m\u00eale au suspense : les Th\u00e9\u00e2trales pr\u00e9sentent \u00ab ADN \u00bb, un thriller th\u00e9\u00e2tral inspir\u00e9 de faits r\u00e9els, le jeudi 19 novembre \u00e0 20h30 au Studio des Arts Vivants de Casablanca. [leseco.ma]\n-------------------------------------------------\nLes Th\u00e9\u00e2trales pr\u00e9sentent la pi\u00e8ce \u00ab ADN \u00bb, un thriller m\u00ealant suspense et humour, le jeudi 19 novembre \u00e0 20h30 au Studio des Arts Vivants de Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Plusieurs pays ont exprim\u00e9, mardi\ndevant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale, leur regret...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs pays ont exprim\u00e9, mardi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale, leur regret face au veto de la Russie ayant emp\u00each\u00e9 l\u2019adoption, le 30 octobre 2026, du projet de r\u00e9solution am\u00e9ricain sur le Sahara marocain, soutenu par onze membres du Conseil de s\u00e9curit\u00e9 des Nations Unies. [www.lereporter.ma]\n-------------------------------------------------\nLe pays d\u00e9plore que le Conseil de s\u00e9curit\u00e9 n\u2019ait pas pu renouveler le mandat de la mission, apr\u00e8s le rejet, le 30 octobre 2026, d\u2019un projet de r\u00e9solution am\u00e9ricain conforme aux recommandations du Secr\u00e9taire g\u00e9n\u00e9ral. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Dans un communiqu\u00e9 publi\u00e9 mercredi,\nl\u2019organisation annonce la nomination des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9 publi\u00e9 mercredi, l\u2019organisation annonce la nomination des pr\u00e9sidents et vice-pr\u00e9sidents de ses sept commissions th\u00e9matiques, \u00e0 l\u2019issue d\u2019une d\u00e9cision de son Bureau ex\u00e9cutif, pr\u00e9sid\u00e9 par Sonia Mezzour. [lnt.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration marocaine des exportateurs (ASMEX) a mis en place sept commissions th\u00e9matiques pour la mandature 2026-2029. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La temp\u00eate Charles qui s\u00e9vit\ndans plusieurs r\u00e9gions de la...", "mass": 5, "physics": false, "shape": "box", "title": "La temp\u00eate Charles qui s\u00e9vit dans plusieurs r\u00e9gions de la c\u00f4te atlantique nord du Royaume a provoqu\u00e9, mercredi, une coupure d\u2019\u00e9lectricit\u00e9 \u00e0 16h55 au niveau de certains quartiers de la ville de Casablanca, notamment le Centre-ville, M\u00e2arif, El Fida, Ain Chock, Ben M\u2019sick, Sbata, Sidi Othmane, Hay Hassani ainsi que certaines zones de la province . [fr.hespress.com]\n-------------------------------------------------\nLa temp\u00eate Charles, qui touche plusieurs r\u00e9gions de la c\u00f4te atlantique nord du Royaume, a provoqu\u00e9 mercredi 11 novembre 2026 une coupure d\u2019\u00e9lectricit\u00e9 \u00e0 16h55 dans certains quartiers de Casablanca, selon un communiqu\u00e9 de l\u2019ONEE. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Voici les temp\u00e9ratures minimales et\nmaximales pr\u00e9vues par la Direction...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le jeudi 12 novembre 2026 Min Max \u2013 Oujda 16 23 \u2013 Bouarfa 13 23 \u2013 Al Hoceima 16 23 \u2013 T\u00e9touan 16 20 \u2013 Sebta 19 21 \u2013 Mellilia 18 22 \u2013 Tanger 18 21 \u2013 K\u00e9nitra 18 22 . [fr.hespress.com]\n-------------------------------------------------\nVoici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le vendredi 13 novembre 2026 : Min Max \u2013 Oujda 14 23 \u2013 Bouarfa 11 21 \u2013 Al Hoceima 14 20 \u2013 T\u00e9touan 18 20 \u2013 Sebta 18 21 \u2013 Mellilia 17 21 \u2013 Tanger 18 21 \u2013 K\u00e9nitra 17 [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Sign\u00e9e par la soci\u00e9t\u00e9 Parc\nLogistique et Industriel Int\u00e9gr\u00e9 de...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9e par la soci\u00e9t\u00e9 Parc Logistique et Industriel Int\u00e9gr\u00e9 de Zenata (PLIIZ S.A.) et par Attijariwafa Bank et Bank of Africa, en qualit\u00e9 de co-arrangeurs, en pr\u00e9sence du ministre. [lematin.ma]\n-------------------------------------------------\nLa plateforme logistique et industrielle de Zenata b\u00e9n\u00e9ficiera d\u2019un financement de 300 millions de dirhams pour accompagner ses travaux d\u2019am\u00e9nagement et de lotissement. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les acquis accomplis au sein\ndu syst\u00e8me de l\u2019\u00e9ducation, de...", "mass": 5, "physics": false, "shape": "box", "title": "Les acquis accomplis au sein du syst\u00e8me de l\u2019\u00e9ducation, de la formation et de la recherche scientifique n\u2019ont pas encore abouti \u00e0 la transformation globale et syst\u00e9mique escompt\u00e9e, telle que pr\u00e9conis\u00e9e par la vision strat\u00e9gique de la r\u00e9forme 2015-2030, a affirm\u00e9, mercredi \u00e0 Rabat, le directeur de l\u2019Instance nationale d\u2019\u00e9valuation (INE), Hicham Ait Mansour. [telquel.ma]\n-------------------------------------------------\nMalgr\u00e9         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
