pement professionnel des banques du Maroc (GPBM) le 8 janvier prochain, consacr\u00e9e notamment \u00e0 l\u2019examen de la question des d\u00e9passements de lignes de cr\u00e9dit et des taux qui leur sont appliqu\u00e9s par le syst\u00e8me bancaire. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Orange Maroc a annonc\u00e9, ce\nmardi, l\u2019atterrissement du c\u00e2ble sous-marin...", "mass": 5, "physics": false, "shape": "box", "title": "Orange Maroc a annonc\u00e9, ce mardi, l\u2019atterrissement du c\u00e2ble sous-marin d\u0027interconnexion Medusa sur les c\u00f4tes marocaines \u00e0 Nador, parall\u00e8lement \u00e0 l\u2019inauguration de sa \u00ab Cable La. [lematin.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur Inwi annonce l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, le lundi 16 d\u00e9cembre 2025, marquant une avanc\u00e9e majeure pour la souverainet\u00e9 num\u00e9rique du Royaume et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [www.lopinion.ma]\n-------------------------------------------------\ninwi annonce, mardi 16 d\u00e9cembre 2025, l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u00e9tape qui marque une avanc\u00e9e majeure dans le renforcement de la souverainet\u00e9 num\u00e9rique du [www.challenge.ma]\n-------------------------------------------------\nOrange Maroc renforce la connectivit\u00e9 du Royaume avec l\u2019atterrissement du c\u00e2ble sous-marin Medusa \u00e0 Nador et l\u2019ouverture de la premi\u00e8re Cable Landing Station open access du pays, un projet strat\u00e9gique pour la souverainet\u00e9 num\u00e9rique et le positionnement du Maroc comme hub digital africain. [www.lavieeco.com]\n-------------------------------------------------\nLe 16 d\u00e9cembre 2025, inwi a annonc\u00e9 l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u00e9tape majeure pour le renforcement de la souverainet\u00e9 num\u00e9rique du Maroc et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [leseco.ma]\n-------------------------------------------------\ninwi a annonc\u00e9, mardi, l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u00e9tape qui marque une avanc\u00e9e majeure dans le renforcement de la souverainet\u00e9 num\u00e9rique du Royaume et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [www.lereporter.ma]\n-------------------------------------------------\nOrange Maroc a inaugur\u00e9, lundi \u00e0 Arekmane dans la province de Nador, son infrastructure strat\u00e9gique \u201cCable Landing Station\u201d, afin de permettre le raccordement du Maroc au c\u00e2ble sous-marin Medusa, le plus long de la M\u00e9diterran\u00e9e. [www.lereporter.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur t\u00e9l\u00e9com inwi a annonc\u00e9 en ce d\u00e9but de semaine l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u00e9tape qui marque, selon l\u2019op\u00e9rateur, une avanc\u00e9e majeure dans le renforcement de la souverainet\u00e9 num\u00e9rique du Royaume et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "D\u2019envergure nationale, cette op\u00e9ration pr\u00e9voit\nle d\u00e9ploiement de moyens logistiques...", "mass": 5, "physics": false, "shape": "box", "title": "D\u2019envergure nationale, cette op\u00e9ration pr\u00e9voit le d\u00e9ploiement de moyens logistiques et humains importants, en coordination \u00e9troite avec le minist\u00e8re de l\u2019Int\u00e9rieur, afin de r\u00e9pondr. [lematin.ma]\     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
