e (IA) tiers \u00e0 son service WhatsApp et \u00e0 ses utilisateurs. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 l\u2019issue d\u2019une enqu\u00eate ouverte fin 2025, la Commission europ\u00e9enne estime que Meta a vraisemblablement abus\u00e9 de sa position dominante en bloquant l\u2019acc\u00e8s des IA tierces \u00e0 WhatsApp et en . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Environ 70 % des petites\net moyennes entreprises (PME) marocaines...", "mass": 5, "physics": false, "shape": "box", "title": "Environ 70 % des petites et moyennes entreprises (PME) marocaines sont d\u00e9j\u00e0 engag\u00e9es dans un processus de d\u00e9carbonation, \u00e0 des niveaux d\u2019avancement variables, r\u00e9v\u00e8le une enqu\u00eate men\u00e9e par la Banque europ\u00e9enne d\u2019investissement (BEI) dans le cadre du Trade and Competitiveness Programme (TCP), cofinanc\u00e9 par l\u2019Union europ\u00e9enne. [fr.hespress.com]\n-------------------------------------------------\nQuelque 70% des petites et moyennes entreprises (PME) marocaines sont d\u00e9j\u00e0 engag\u00e9es dans un processus de d\u00e9carbonation d\u00e9ploy\u00e9 \u00e0 \u00e9chelle variable, r\u00e9v\u00e8le une enqu\u00eate de la Banque europ\u00e9enne d\u2019investissement (BEI), men\u00e9e dans le cadre du Trade and Competitiveness Programme (TCP) cofinanc\u00e9 par l\u2019Union europ\u00e9enne (UE). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019Office National de S\u00e9curit\u00e9 Sanitaire\ndes Produits Alimentaires (ONSSA) a...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office National de S\u00e9curit\u00e9 Sanitaire des Produits Alimentaires (ONSSA) a tenu \u00e0 rassurer l\u2019opinion publique nationale suite \u00e0 une alerte internationale concernant des pr\u00e9parations lact\u00e9es pour nourrissons. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 la suite d\u2019une notification internationale concernant le rappel pr\u00e9ventif de certains lots de pr\u00e9parations lact\u00e9es pour nourrissons, l\u2019ONSSA a men\u00e9 des investigations imm\u00e9diates ayant confirm\u00e9 qu\u2019aucun produit objet du rappel n\u2019a \u00e9t\u00e9 commercialis\u00e9 au Maroc, les lots concern\u00e9s ayant \u00e9t\u00e9 consign\u00e9s puis d\u00e9truits avant leur mise en vente. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "C\u2019est lors de la premi\u00e8re\n\u00e9dition de la Conf\u00e9rence APSB,...", "mass": 5, "physics": false, "shape": "box", "title": "C\u2019est lors de la premi\u00e8re \u00e9dition de la Conf\u00e9rence APSB, organis\u00e9e par l\u2019Association professionnelle des soci\u00e9t\u00e9s de bourse (APSB), que la ministre de l\u2019\u00c9conomie et des Finances, N. [lematin.ma]\n-------------------------------------------------\nOrganis\u00e9e par l\u2019Association professionnelle des soci\u00e9t\u00e9s de Bourse (APSB), la conf\u00e9rence d\u00e9di\u00e9e \u00e0 l\u2019avenir du march\u00e9 boursier marocain, tenue le 9 f\u00e9vrier 2026 \u00e0 Casablanca, a act\u00e9 l\u2019entr\u00e9e de la place financi\u00e8re dans une phase de transformation structurelle avanc\u00e9e. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Dans le d\u00e9tail, 48% ont\nd\u00e9j\u00e0 mis en place des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le d\u00e9tail, 48% ont d\u00e9j\u00e0 mis en place des initiatives, tandis que 22% disposent d\u2019une strat\u00e9gie claire et l\u2019appliquent de mani\u00e8re active, fait savoir la m\u00eame source. [lematin.ma]\n-------------------------------------------------\nMen\u00e9e aupr\u00e8s de 150 dirigeants de PME, cette \u00e9tude d\u00e9montre que 48% d\u2019entre eux, ont d\u00e9j\u00e0 mis en place des initiatives, alors que 22% ont une strat\u00e9gie claire et l\u0027appliquent de mani\u00e8re active. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Des pluies fortes et des\naverses orageuses avec risque de...", "mass": 5, "physics": false, "shape": "box", "title": "Des pluies fortes et des averses orageuses avec risque de gr\u00eale (40 \u00e0 60 mm) sont attendues de lundi \u00e0 11h00 \u00e0 mardi \u00e0 12h00 dans les provinces de Tanger-Assilah, M\u0027Diq-Fnideq,. [lematin.ma]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale et de fortes rafales de vent sont pr\u00e9vues, lundi et mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), notamment dans le nord et dans les r\u00e9gions de l\u2019Oriental et F\u00e8s-Mekn\u00e8s. [telquel.ma]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale et de fortes rafales de vent sont pr\u00e9vues, lundi et mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lereporter.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a annonc\u00e9, dans un bulletin d\u2019alerte de niveau de vigilance orange, la survenue de fortes pluies, d\u2019averses orageuses avec risque de gr\u00eale, de chutes de neige et de rafales de vent soutenues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Mohamed Ould Errachid, pr\u00e9sident de\nla Chambre des conseillers, s\u2019est...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ould Errachid, pr\u00e9sident de la Chambre des conseillers, s\u2019est exprim\u00e9 lors de la s\u00e9ance d\u2019ouverture du 10\u1d49 Forum parlementaire international de la justice sociale, tenu ce lundi \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLe Maroc, gr\u00e2ce \u00e0 la Vision Royale \u00e9clair\u00e9e, dispose d\u2019une feuille de route claire pour parachever le processus de son d\u00e9veloppement et consolider la justice sociale et territoriale, a affirm\u00e9, lundi \u00e0 Rabat, le pr\u00e9sident de la Chambre des conseillers, Mohamed Ould Errachid. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le lancement du march\u00e9 \u00e0\nterme au Maroc est pr\u00e9vu...", "mass": 5, "physics": false, "shape": "box", "title": "Le lancement du march\u00e9 \u00e0 terme au Maroc est pr\u00e9vu le 6 avril 2026, a annonc\u00e9, lundi \u00e0 Casablanca, la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah. [telquel.ma]\n-------------------------------------------------\nLe lancement du march\u00e9 \u00e0 terme au Maroc est pr\u00e9vu le 6 avril 2026, a annonc\u00e9, ce lundi \u00e0 Casablanca, la ministre de l\u0027\u00c9conomie et des Finances, Nadia Fettah. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, s\u2019entretiendra ce lundi \u00e0 18h \u00e0 Madrid avec son homologue espagnol, Jos\u00e9 Manuel Albares, dans le cadre d\u2019une s\u00e9rie de consultations diplomatiques qui se sont tenues ces derni\u00e8res 48 heures sur le dossier du Sahara marocain. [telquel.ma]\n-------------------------------------------------\n\u00abConcernant le Sahara occidental, je tiens \u00e0 signaler que des d\u00e9l\u00e9gations de haut niveau des Nations unies, dont lEnvoy\u00e9 personnel du Secr\u00e9taire g\u00e9n\u00e9ral, Staffan de Mistura, ainsi que des repr\u00e9sentants des \u00c9tats-Unis, ont men\u00e9 des discussions \u00e0 Madrid avec des repr\u00e9sentants du Maroc, du Front Polisario, de lAlg\u00e9rie et de la Mauritanie. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre espagnol des Affaires \u00e9trang\u00e8res, Jos\u00e9 Manuel Albares, a re\u00e7u lundi \u00e0 Madrid le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, ainsi que l\u2019envoy\u00e9 personnel du Secr\u00e9taire g\u00e9n\u00e9ral des Nations unies pour le Sahara, Staffan de Mistura, dans le cadre de consultations diplomatiques consacr\u00e9es \u00e0 . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Ainsi, l\u2019a\u00e9roport de la Cit\u00e9\ndes Aliz\u00e9s a accueilli 310.436...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, l\u2019a\u00e9roport de la Cit\u00e9 des Aliz\u00e9s a accueilli 310.436 passagers en 2025, contre 230.959 une ann\u00e9e auparavant, pr\u00e9cise l\u2019ONDA dans son bilan du trafic a\u00e9rien au titre de. [telquel.ma]\n-------------------------------------------------\nL\u0027A\u00e9roport international Essaouira-Mogador a enregistr\u00e9 une hausse de 34,4% du trafic des passagers en 2025 par rapport \u00e0 l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Office National des A\u00e9roports (ONDA). [leseco.ma]\n-------------------------------------------------\nAinsi, l\u2019a\u00e9roport de la Cit\u00e9 des Aliz\u00e9s a accueilli 310.436 passagers en 2025, contre 230.959 une ann\u00e9e auparavant, pr\u00e9cise l\u2019ONDA dans son bilan du trafic a\u00e9rien au titre de . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "R\u00e9uni en session extraordinaire, le\nRassemblement national des ind\u00e9pendants (RNI)...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni en session extraordinaire, le Rassemblement national des ind\u00e9pendants (RNI) a port\u00e9 \u00e0 sa direction Mohamed Chaouki, d\u00e9put\u00e9 de Boulemane et pr\u00e9sident du groupe parlementaire \u00e0 la Chambre des repr\u00e9sentants. [telquel.ma]\n-------------------------------------------------\nLe nouveau pr\u00e9sident du RNI, Mohamed Chaouki, a soulign\u00e9, lors du Congr\u00e8s extraordinaire du Rassemblement national des ind\u00e9pendants (RNI), tenu le 7 f\u00e9vrier \u00e0 El-Jadida, qu\u2019Aziz Akhannouch a redonn\u00e9 de la valeur \u00e0 l\u2019engagement politique s\u00e9rieux, avec comme base une coh\u00e9rence claire entre le discours et les r\u00e9sultats. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc a \u00e9t\u00e9 battu\nlors des play-offs du groupe...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a \u00e9t\u00e9 battu lors des play-offs du groupe mondial I de la Coupe Davis de tennis, qui se sont d\u00e9roul\u00e9s les 7 et 8 f\u00e9vrier \u00e0 Casablanca, face \u00e0 une \u00e9quipe colombienne exp\u00e9riment\u00e9e et mieux class\u00e9e (1-3). [telquel.ma]\n-------------------------------------------------\nLe Maroc a sign\u00e9 une         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
