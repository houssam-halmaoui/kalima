di...", "mass": 5, "physics": false, "shape": "box", "title": "Son Altesse Royale le Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, \u00e0. [lematin.ma]\n-------------------------------------------------\nSon Altesse Royale le Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, \u00e0 l\u2019occasion de la 50e \u00e9dition du Troph\u00e9e Hassan II de golf et de la 29e \u00e9dition de la Coupe Lalla Meryem, organis\u00e9es [www.lereporter.ma]\n-------------------------------------------------\nLe Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par le Roi Mohammed VI, \u00e0 l\u2019occasion de la 50e \u00e9dition du Troph\u00e9e Hassan II de golf et de la 29e \u00e9dition de la Coupe Lalla Meryem. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La FRMF a lanc\u00e9 une\nop\u00e9ration sp\u00e9ciale permettant aux supporters...", "mass": 5, "physics": false, "shape": "box", "title": "La FRMF a lanc\u00e9 une op\u00e9ration sp\u00e9ciale permettant aux supporters marocains d\u2019acheter des billets pour les matchs des Lions de l\u2019Atlas au Mondial 2026 \u00e0 550 DH. [lematin.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF) vient de lancer l\u2019op\u00e9ration de vente des billets pour les matchs de la phase de poules des Lions de l\u2019Atlas lors de la Coupe du monde 2026, au tarif unique de 550 dirhams par ticket. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\npar le Vice-ministre panam\u00e9en des...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e par le Vice-ministre panam\u00e9en des Relations ext\u00e9rieures, Carlos Arturo Hoyos Boyd, en visite de travail au Maroc, \u00e0 l\u2019issue de sa rencontre avec le mi. [lematin.ma]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [telquel.ma]\n-------------------------------------------------\nLe vice-ministre panam\u00e9en des Relations ext\u00e9rieures, Carlos Arturo Hoyos Boyd, en d\u00e9placement officiel au Maroc, a port\u00e9 ce message \u00e0 l\u0027issue de ses entretiens avec le ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u0027\u00e9tranger, Nasser Bourita. [www.lavieeco.com]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u0027a\u00e9roport Mohammed V, repr\u00e9sentant plus\nde 30% du trafic global,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027a\u00e9roport Mohammed V, repr\u00e9sentant plus de 30% du trafic global, a accueilli 3.756.740 passagers, soit une progression de 12,6% par rapport \u00e0 fin avril 2025, pr\u00e9cise l\u0027OND. [lematin.ma]\n-------------------------------------------------\nLes a\u00e9roports du Maroc ont enregistr\u00e9 un volume de trafic commercial de 12.336.962 passagers \u00e0 fin avril 2026, en croissance de 9,7% par rapport \u00e0 la m\u00eame p\u00e9riode [www.challenge.ma]\n-------------------------------------------------\nLes a\u00e9roports du Maroc ont enregistr\u00e9 un volume de trafic commercial de 12.336.962 passagers \u00e0 fin avril 2026, en croissance de 9,7% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u0027Office National des A\u00e9roports (ONDA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Saisi en urgence par le\nchef du gouvernement, le Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Saisi en urgence par le chef du gouvernement, le Conseil de la concurrence a approuv\u00e9, le 21 mai 2026, la mise en place de mesures temporaires pour r\u00e9guler les march\u00e9s d\u00e9di\u00e9s \u00e0 la vente des moutons de l\u2019A\u00efd. [telquel.ma]\n-------------------------------------------------\nSaisi par le chef du gouvernement, le Conseil de la concurrence vient de valider, dans un avis publi\u00e9 ce vendredi, les mesures mises en place pour combattre la sp\u00e9culation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7",
