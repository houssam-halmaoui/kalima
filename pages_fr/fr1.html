 r\u00e9gionales dans cette dynamique dint\u00e9gration. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et l\u2019Argentine disposent d\u2019un potentiel \u00e9conomique d\u2019exception pour hisser leurs relations bilat\u00e9rales au rang d\u2019un partenariat strat\u00e9gique continental, a affirm\u00e9 l\u2019ambassadeur du Royaume en Argentine, Fares Yassir, soulignant la convergence des opportunit\u00e9s r\u00e9gionales dans cette dynamique d\u2019int\u00e9gration. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La direction du Groupement sanitaire\nterritorial (GST) Casablanca-Settat a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La direction du Groupement sanitaire territorial (GST) Casablanca-Settat a annonc\u00e9 l\u2019entr\u00e9e en fonction effective du Groupement, \u00e0 compter de mardi, avec le d\u00e9but de l\u2019exercice de ses attributions. [telquel.ma]\n-------------------------------------------------\nCette nouvelle structure vise \u00e0 renforcer la gestion r\u00e9gionale de l\u2019offre de soins, am\u00e9liorer la coordination entre les \u00e9tablissements de sant\u00e9 et optimiser l\u2019utilisation des ressources. [www.lavieeco.com]\n-------------------------------------------------\nLa direction du Groupement Sanitaire Territorial (GST) Casablanca-Settat a annonc\u00e9 l\u2019entr\u00e9e en fonction effective du Groupement, \u00e0 compter de mardi, avec le d\u00e9but de l\u2019exercice de ses attributions. [leseco.ma]\n-------------------------------------------------\nCette nouvelle structure doit assurer une gestion r\u00e9gionale et coordonn\u00e9e de l\u2019offre de soins, avec notamment pour priorit\u00e9s l\u2019am\u00e9lioration des parcours des patients, la rationalisation des ressources et l\u2019acc\u00e9l\u00e9ration de la . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Une vague de chaleur et\ndes averses orageuses avec gr\u00eale...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur et des averses orageuses avec gr\u00eale et rafale de vent sous orages sont attendues, de mercredi \u00e0 vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur et des averses orageuses avec gr\u00eale et rafale de vent sous orages sont attendues, de mercredi \u00e0 vendredi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nUne vague de chaleur, avec des temp\u00e9ratures atteignant 45 \u00b0C, ainsi que des averses orageuses accompagn\u00e9es de gr\u00eale et de fortes rafales de vent sont attendues de mercredi \u00e0 vendredi dans plusieurs provinces du Royaume, selon la DGM. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Lors d\u2019une conf\u00e9rence de presse\n\u00e0 l\u2019acad\u00e9mie du club, M....", "mass": 5, "physics": false, "shape": "box", "title": "Lors d\u2019une conf\u00e9rence de presse \u00e0 l\u2019acad\u00e9mie du club, M. J\u00e9mez s\u2019est r\u00e9joui d\u2019avoir \u00e9t\u00e9 choisi pour ce poste, disant qu\u2019il s\u2019agit pour lui d\u2019une mission de grande importance au vu de la stature. [telquel.ma]\n-------------------------------------------------\nLors d\u2019une conf\u00e9rence de presse \u00e0 l\u2019acad\u00e9mie du club, M. J\u00e9mez s\u2019est r\u00e9joui d\u2019avoir \u00e9t\u00e9 choisi pour ce poste, disant qu\u2019il s\u2019agit pour lui d\u2019une mission de grande importance au vu de la stature . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le directeur g\u00e9n\u00e9ral de la\nS\u00fbret\u00e9 nationale et de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la surveillance du territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, mercredi \u00e0 Rabat, lambassadeur du Japon au Maroc, Nakata Masahiro, dans le cadre du renforcement de la coop\u00e9ration s\u00e9curitaire entre les deux pays. [www.yabiladi.com]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, mercredi \u00e0 Rabat, l\u2019ambassadeur extraordinaire et pl\u00e9nipotentiaire du Japon au Maroc, Nakata Masahiro. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Deux Marocaines, une m\u00e8re et\nsa fille, ont trouv\u00e9 la...", "mass": 5, "physics": false, "shape": "box", "title": "Deux Marocaines, une m\u00e8re et sa fille, ont trouv\u00e9 la mort et deux hommes ont \u00e9t\u00e9 bless\u00e9s, dont l\u2019un gri\u00e8vement, apr\u00e8s que la voiture dans laquelle ils se trouvaient a chut\u00e9 en mer dans le port d\u2019Alg\u00e9siras, aux premi\u00e8res heures du mercredi 2 septembre, alors qu\u2019ils s\u2019appr\u00eataient \u00e0 embarquer sur un ferry \u00e0 destination de Tanger. [www.yabiladi.com]\n-------------------------------------------------\nDeux Marocaines, une m\u00e8re de 71 ans et sa fille de 43 ans, sont mortes noy\u00e9es dans la nuit de mardi \u00e0 mercredi apr\u00e8s que leur voiture a chut\u00e9 dans les eaux du port d\u0027Alg\u00e9siras, dans le sud de l\u0027Espagne, alors qu\u0027elles s\u0027appr\u00eataient \u00e0 embarquer pour Tanger. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Diagnostic Le Conseil \u00e9conomique, social\net environnemental (CESE), r\u00e9uni le...", "mass": 5, "physics": false, "shape": "box", "title": "Diagnostic Le Conseil \u00e9conomique, social et environnemental (CESE), r\u00e9uni le 31 ao\u00fbt \u00e0 Rabat, a adopt\u00e9 deux avis consacr\u00e9s \u00e0 la place du douar dans le d\u00e9veloppement rural et la lutte contre les atteintes \u00e0 l\u2019environnement. [aujourdhui.ma]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) a tenu, lundi, la 185e session ordinaire de son assembl\u00e9e g\u00e9n\u00e9rale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Durant cette p\u00e9riode, Jumia proposera\nune s\u00e9lection d\u2019offres et de...", "mass": 5, "physics": false, "shape": "box", "title": "Durant cette p\u00e9riode, Jumia proposera une s\u00e9lection d\u2019offres et de promotions dans plusieurs cat\u00e9gories, avec la participation de marques nationales et internationales. [aujourdhui.ma]\n-------------------------------------------------\nDurant cette p\u00e9riode, la plateforme propose des offres et promotions dans plusieurs cat\u00e9gories, avec la participation de marques nationales et internationales telles qu\u2019Adidas, DeFacto ou encore Epson. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Pr\u00e8s de 50.000 \u00e9l\u00e8ves ont\nrepris, ce mercredi 2 septembre,...", "mass": 5, "physics": false, "shape": "box", "title": "Pr\u00e8s de 50.000 \u00e9l\u00e8ves ont repris, ce mercredi 2 septembre, le chemin de l\u2019\u00e9cole au sein du r\u00e9seau de l\u2019enseignement fran\u00e7ais au Maroc. [leseco.ma]\n-------------------------------------------------\nCalendrier Mercredi 2 septembre, pr\u00e8s de 50.000 \u00e9coliers, coll\u00e9giens et lyc\u00e9ens du r\u00e9seau de l\u2019enseignement fran\u00e7ais au Maroc ont repris le chemin de leur classe. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u0027a\u00e9roport de Rabat-Sal\u00e9 a accueilli\n1.446.355 passagers au cours des...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027a\u00e9roport de Rabat-Sal\u00e9 a accueilli 1.446.355 passagers au cours des sept premiers mois de 2026, en hausse de 16,06% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon les donn\u00e9es de l\u0027Office national des a\u00e9roports. [atlasinfo.fr]\n-------------------------------------------------\nCe volume est en hausse de 16,06 % par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, durant laquelle 1.246.221 voyageurs ont \u00e9t\u00e9 accueillis par cet a\u00e9roport, pr\u00e9cise [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "R\u00e9union Lors d\u2019une r\u00e9union du\nConseil de paix et de...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9union Lors d\u2019une r\u00e9union du Conseil de paix et de s\u00e9curit\u00e9 de l\u2019UA, le Maroc a insist\u00e9 sur la n\u00e9cessit\u00e9 d\u2019assurer une r\u00e9int\u00e9gration durable des enfants anciennement associ\u00e9s aux groupes arm\u00e9s, \u00e0 travers des programmes adapt\u00e9s associant notamment l\u2019acc\u00e8s \u00e0 l\u2019\u00e9ducation, l\u2019accompagnement psychosocial et la formation. [aujourdhui.ma]\n-------------------------------------------------\nDevant le Conseil de paix et de s\u00e9curit\u00e9 de l\u2019Union africaine, r\u0         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {

                var nodeId = params.nodes[0];

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
