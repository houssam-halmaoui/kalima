repr\u00e9sentants de pays participants. [www.yabiladi.com]\n-------------------------------------------------\nConform\u00e9ment aux Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, les Forces marocaines et am\u00e9ricaines co-organisent, jusqu\u2019au 08 mai, la 22\u00e8me \u00e9dition de l\u2019exercice \u00ab African Lion \u00bb. [aujourdhui.ma]\n-------------------------------------------------\nLes Forces Arm\u00e9es Royales et les forces arm\u00e9es des \u00c9tats-Unis ont proc\u00e9d\u00e9, \u00e0 Agadir, au lancement officiel de la 22\u1d49 \u00e9dition de l\u2019African Lion, un exercice multinational interarm\u00e9es organis\u00e9 jusqu\u2019au 8 mai. [lnt.ma]\n-------------------------------------------------\nConform\u00e9ment aux Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, les Forces marocaines et am\u00e9ricaines co-organisent, jusqu\u2019au 08 mai, la 22\u00e8me \u00e9dition de l\u2019exercice \u201cAfrican Lion\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Pour cette nouvelle \u00e9dition, le\nFestival Mawazine d\u00e9voile une premi\u00e8re...", "mass": 5, "physics": false, "shape": "box", "title": "Pour cette nouvelle \u00e9dition, le Festival Mawazine d\u00e9voile une premi\u00e8re annonce tr\u00e8s attendue : Ninho se produira sur la sc\u00e8ne internationale de l\u2019OLM Souissi le vendredi 19 juin 20. [lematin.ma]\n-------------------------------------------------\nLa sc\u00e8ne internationale de l\u2019OLM Souissi accueillera, le 19 juin prochain, le rappeur Ninho pour l\u2019ouverture du Festival Mawazine dans le cadre de sa 21e \u00e9dition pr\u00e9vue du 19 au 27 juin \u00e0 Rabat et Sal\u00e9. [telquel.ma]\n--------------------         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
