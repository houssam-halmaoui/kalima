hid a pr\u00e9sid\u00e9, dimanche au Royal Complexe des sports \u00e9questres et Tbourida Dar Es Salam \u00e0 Rabat, la finale de la 25e \u00e9dition du Troph\u00e9e Hassan II des arts \u00e9questres traditionnels \u00ab Tbourida \u00bb, organis\u00e9e du 15 au 21 juin, sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Danny Makkelie sera assist\u00e9 de\nses compatriotes Hessel Steegstra et...", "mass": 5, "physics": false, "shape": "box", "title": "Danny Makkelie sera assist\u00e9 de ses compatriotes Hessel Steegstra et Jan de Vries, tandis que le Portugais Jo\u00e3o Pinheiro officiera en tant que quatri\u00e8me arbitre. [lematin.ma]\n-------------------------------------------------\nLa FIFA a d\u00e9sign\u00e9 l\u2019arbitre n\u00e9erlandais Danny Makkelie pour le dernier match du groupe C, opposant le Maroc \u00e0 Ha\u00efti lors de la Coupe du monde 2026, le 24 juin prochain. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "En d\u00e9placement \u00e0 Beijing, le\nministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement,...", "mass": 5, "physics": false, "shape": "box", "title": "En d\u00e9placement \u00e0 Beijing, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la convergence et de l\u2019\u00e9valuation des politiques publiques, Karim Zidane, a mis en avant les opportunit\u00e9s offertes par le Maroc aux entreprises chinoises. [www.yabiladi.com]\n-------------------------------------------------\nLa d\u00e9l\u00e9gation marocaine est conduite par le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u0027Investissement, de la Convergence et de l\u0027\u00c9valuation des politiques publiques, Karim Zidane. [www.lavieeco.com]\n--------------------------------                             if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
