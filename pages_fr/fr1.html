d": "comm_label_16", "label": "Le financement mobilis\u00e9 contribuera \u00e0\naccompagner les investissements de l\u0027ONEE...", "mass": 5, "physics": false, "shape": "box", "title": "Le financement mobilis\u00e9 contribuera \u00e0 accompagner les investissements de l\u0027ONEE visant \u00e0 renforcer l\u0027efficacit\u00e9, la r\u00e9silience et la durabilit\u00e9 des infrastructures de production d\u0027eau potable, en appui aux efforts du Royaume en mati\u00e8re de s\u00e9curit\u00e9 hydrique et d\u0027adaptation aux changements climatiques. [www.lavieeco.com]\n-------------------------------------------------\nTamwilcom et l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de garantie portant sur un financement de 250 millions d\u2019euros (M\u20ac) accord\u00e9 par la Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) \u00e0 l\u2019ONEE \u2013 Branche Eau. [telquel.ma]\n-------------------------------------------------\nLa Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) soutient la s\u00e9curit\u00e9 hydrique du Maroc gr\u00e2ce \u00e0 un pr\u00eat de 250 millions d\u2019euros accord\u00e9 \u00e0 l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE). [aujourdhui.ma]\n-------------------------------------------------\nTamwilcom et l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) ont sign\u00e9 une convention de garantie portant sur un financement de 250 millions d\u2019euros accord\u00e9 par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) \u00e0 la branche Eau de l\u2019Office. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "\u00c0 l\u0027occasion du 27e anniversaire\nde la F\u00eate du Tr\u00f4ne,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u0027occasion du 27e anniversaire de la F\u00eate du Tr\u00f4ne, les Forces Arm\u00e9es Royales organiseront, les 30 et 31 juillet, des d\u00e9monstrations a\u00e9riennes et des exhibitions de parachutisme \u00e0 M\u0027diq, Martil et Sal\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nDans le cadre de la c\u00e9l\u00e9bration du 27e anniversaire de l\u2019accession de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, que Dieu Le glorifie, au Tr\u00f4ne de Ses Glorieux Anc\u00eatres, les Forces Arm\u00e9es Royales (FAR) organisent les 30 et 31 juillet des shows a\u00e9riens et des sauts d\u2019exhibition en [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le r\u00e9sultat net du secteur\ndes assurances a atteint 5,3...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00e9sultat net du secteur des assurances a atteint 5,3 milliards de dirhams (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur la Stabilit\u00e9 financi\u00e8re. [leseco.ma]\n-------------------------------------------------\nLe r\u00e9sultat net du secteur des assurances a atteint 5,3 milliards de dirhams (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Attawfiq Microfinance, filiale du Groupe\nBanque Centrale Populaire, a obtenu...", "mass": 5, "physics": false, "shape": "box", "title": "Attawfiq Microfinance, filiale du Groupe Banque Centrale Populaire, a obtenu la certification MSI 20000, d\u00e9livr\u00e9e par l\u0027organisme ind\u00e9pendant COFICERT, lors d\u0027une c\u00e9r\u00e9monie organis\u00e9e le jeudi 25 juin \u00e0 la Bourse de Paris, Euronext. [leseco.ma]\n-------------------------------------------------\nAttawfiq Microfinance, filiale du Groupe Banque Centrale Populaire (BCP), a obtenu la certification internationale MSI 20000, une distinction qui \u00e9value la qualit\u00e9 de la gouvernance financi\u00e8re et de la situation financi\u00e8re des entreprises et institutions. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "L\u0027Arabie saoudite a annonc\u00e9 mercredi\navoir men\u00e9, en coordination avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027Arabie saoudite a annonc\u00e9 mercredi avoir men\u00e9, en coordination avec le commandement central am\u00e9ricain, des frappes contre des groupes arm\u00e9s soutenus par l\u0027Iran en Irak, en repr\u00e9sailles \u00e0 des attaques de drones visant ses installations p\u00e9troli\u00e8res. [atlasinfo.fr]\n-------------------------------------------------\nLes Etats-Unis et leur alli\u00e9 saoudien ont dit avoir vis\u00e9 mercredi des groupes arm\u00e9s pro-iraniens en Irak, nouvelle extension de la guerre au Moyen-Orient qui implique des factions soutenues par T\u00e9h\u00e9ran. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "L\u0027ambassadeur des \u00c9tats-Unis au Maroc,\nDuke Buchan, a annonc\u00e9 sur...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan, a annonc\u00e9 sur X que Washington s\u0027engageait \u00e0 construire \"un avenir pacifique et prosp\u00e8re\" pour le Sahara marocain, apr\u00e8s sa rencontre avec le maire de La\u00e2youne. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 La\u00e2youne, l\u2019ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan III, a annonc\u00e9 le premier financement public am\u00e9ricain en faveur d\u2019un projet du secteur priv\u00e9 dans le Sahara marocain. [telquel.ma]\n-------------------------------------------------\nLannonce du premier financement am\u00e9ricain pour un projet priv\u00e9 dans le Sahara marocain a marqu\u00e9 la visite, mardi \u00e0 La\u00e2youne, de lambassadeur des \u00c9tats-Unis, Duke Buchan. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le Pr\u00e9sident de la Chambre\ndes Repr\u00e9sentants, Rachid Talbi El...", "mass": 5, "physics": false, "shape": "box", "title": "Le Pr\u00e9sident de la Chambre des Repr\u00e9sentants, Rachid Talbi El Alami, a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, mardi \u00e0 Lima, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture de la nouvelle Pr\u00e9sidente de la R\u00e9publique du P\u00e9rou, Keiko Fujimori. [www.lereporter.ma]\n-------------------------------------------------\nLors de cette c\u00e9r\u00e9monie, qui s\u2019est d\u00e9roul\u00e9e au si\u00e8ge du Congr\u00e8s p\u00e9ruvien, en pr\u00e9sence de Chefs d\u2019\u00c9tat et de d\u00e9l\u00e9gations \u00e9trang\u00e8res, de repr\u00e9sentants d\u2019organisations internationales. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "\u00c0 l\u2019occasion du 27\u00e8me Anniversaire\nde l\u2019Intronisation de Sa Majest\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [fr.hespress.com]\n-------------------------------------------------\nCette pi\u00e8ce comm\u00e9morative pr\u00e9sente, \u00e0 l\u0027avers, l\u0027effigie de Sa Majest\u00e9 le Roi Mohammed VI entour\u00e9e des inscriptions \u0645\u062d\u0645\u062f \u0627\u0644\u0633\u0627\u062f\u0633 et \u0627\u0644\u0645\u0645\u0644\u0643\u0629 \u0627\u0644\u0645\u063a\u0631\u0628\u064a\u0629 - \u2d5c\u2d30\u2d33\u2d4d. [lematin.ma]\n-------------------------------------------------\n\u00c0 loccasion du 27e anniversaire de laccession de Mohammed VI au Tr\u00f4ne, Bank Al-Maghrib (BAM) a d\u00e9voil\u00e9 une pi\u00e8ce comm\u00e9morative en argent, dune valeur faciale de 250 dirhams. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [aujourdhui.ma]\n-------------------------------------------------\nBank Al-Maghrib c\u00e9l\u00e8bre le 27e anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI par l\u2019\u00e9mission d\u2019une pi\u00e8ce comm\u00e9morative en argent d\u2019une valeur faciale de 250 dirhams. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Une op\u00e9ration conjointe men\u00e9e par\nles agents de la S\u00fbret\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Une op\u00e9ration conjointe men\u00e9e par les agents de la S\u00fbret\u00e9 nationale et des Douanes au poste fronti\u00e8re de Guerguerat, au sud de Dakhla, mardi 28 juillet apr\u00e8s-midi, a permis la saisie de 61 kilogrammes de coca\u00efne et l\u2019arrestation de deux hommes, \u00e2g\u00e9s de 30 et 34 ans, soup\u00e7onn\u00e9s d\u2019implication dans un trafic international de stup\u00e9fiants.. [telquel.ma]\n-------------------------------------------------\nLa police marocaine et les douanes ont intercept\u00e9 61 kg de coca\u00efne et arr\u00eat\u00e9 deux suspects au poste-fronti\u00e8re de Guerguerat, au sud de Dakhla, lors d\u2019une op\u00e9ration conjointe mardi, rapporte la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Le Conseil d\u2019Administration de l\u2019Office\nNational de l\u2019Electricit\u00e9 et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019Administration de l\u2019Office National de l\u2019Electricit\u00e9 et de l\u2019Eau Potable (ONEE), tenu lundi \u00e0 Rabat, sous la Pr\u00e9sidence de la ministre de l\u2019Economie et des Finances, Nadia Fettah, a adopt\u00e9 le plan d\u2019\u00e9quipement 2026-2030 d\u2019une enveloppe de plus de 248 milliards de dirhams (MMDH). [telquel.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration de l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) a approuv\u00e9 un plan d\u2019\u00e9quipement 2026-2030 d\u2019un montant sup\u00e9rieur \u00e0 248 milliards de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9\navec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de...", "mass": 5, "physics": false, "shape": "box", "title": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9 avec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de son capital social par apport en num\u00e9raire, r\u00e9serv\u00e9e aux actionnaires et aux d\u00e9tenteurs de droits pr\u00e9f\u00e9rentiels de souscription [www.challenge.ma]\n-------------------------------------------------\nLes souscriptions ont atteint 884,6 MDH, soit 27% de plus que le montant propos\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019op\u00e9ration, vis\u00e         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
