, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00e9curit\u00e9 des syst\u00e8mes d\u2019information (DGSSI)...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00e9curit\u00e9 des syst\u00e8mes d\u2019information (DGSSI) a publi\u00e9, ce jeudi 12 novembre 2026, un bulletin d\u2019alerte class\u00e9 au niveau de risque et d\u2019impact \u00ab critique \u00bb (r\u00e9f. [fr.hespress.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00e9curit\u00e9 des syst\u00e8mes d\u2019information (DGSSI) du Maroc a lanc\u00e9, le 12 novembre 2026, une alerte critique sur une campagne mondiale de cyberattaques visant les prestataires informatiques utilisant la version cloud de ConnectWise ScreenConnect, un outil de gestion et de d\u00e9pannage \u00e0 distance des ordinateurs. [www.yabiladi.com]\n-------------------------------------------------\nC\u2019est le risque mis en lumi\u00e8re par une vaste campagne de cyberattaques ciblant les utilisateurs de ConnectWise ScreenConnect, un outil de t\u00e9l\u00e9maintenance largement utilis\u00e9 par les prestataires informatiques. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le groupe Colas a annonc\u00e9\nce jeudi 12 novembre 2026...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Colas a annonc\u00e9 ce jeudi 12 novembre 2026 que sa filiale Colas Rail avait remport\u00e9 aupr\u00e8s de l\u2019Office national des chemins de fer . [fr.hespress.com]\n-------------------------------------------------\nColas Rail, filiale du groupe Bouygues, vient de remporter un nouveau contrat aupr\u00e8s l\u2019Office national des chemins de fer (ONCF). [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des chemins de fer du Maroc (ONCF) a confi\u00e9 \u00e0 l\u2019entreprise fran\u00e7aise Colas Rail un march\u00e9 d\u2019environ 29 millions d\u2019euros pour des travaux dans la r\u00e9gion de Casablanca. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La Cheffe du gouvernement, Fatima\nEzzahra El Mansouri, a eu,...", "mass": 5, "physics": false, "shape": "box", "title": "La Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a eu, jeudi, un entretien t\u00e9l\u00e9phonique avec le Premier ministre de la R\u00e9publique de Roumanie, Luca-Alexandru Niculescu. [fr.hespress.com]\n-------------------------------------------------\nCet entretien t\u00e9l\u00e9phonique a offert l\u0027occasion de mettre en avant la solidit\u00e9 des relations unissant le Royaume du Maroc et la R\u00e9publique de Roumanie et de souligner la n\u00e9cessi. [lematin.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, a eu, ce jeudi, un entretien t\u00e9l\u00e9phonique avec le Premier ministre roumain, Luca-Alexandru Nicolescu, consacr\u00e9 aux perspectives de renforcement de la coop\u00e9ration bilat\u00e9rale entre les deux pays. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, a eu, jeudi, un entretien t\u00e9l\u00e9phonique avec le Premier ministre de la R\u00e9publique de Roumanie, M. Luca-Alexandru Niculescu. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La protection du pouvoir d\u2019achat\ndes citoyens figure parmi les...", "mass": 5, "physics": false, "shape": "box", "title": "La protection du pouvoir d\u2019achat des citoyens figure parmi les principales priorit\u00e9s du gouvernement. [lematin.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [telquel.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat demeure une priorit\u00e9 du gouvernement, a r\u00e9affirm\u00e9 jeudi la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, lors du Conseil de gouvernement. [leseco.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [www.lereporter.ma]\n-------------------------------------------------\nLe gouvernement a annonc\u00e9 une s\u00e9rie de mesures destin\u00e9es \u00e0 limiter les effets de la hausse des prix sur le pouvoir d\u2019achat des m\u00e9nages. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi, le projet de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi, le projet de loi n\u00b006.25 portant transformation de l\u2019Office national des a\u00e9roports (ONDA) en soci\u00e9t\u00e9 anonyme.Ce projet de loi s\u2019appuie. [lematin.ma]\n-------------------------------------------------\nCe projet de loi s\u2019appuie sur les dispositions de la loi-cadre n\u00b050.21 relative \u00e0 la r\u00e9forme des \u00e9tablissements et entreprises publics (EEP), en prenant en consid\u00e9ration les dispositions de la loi n\u00b082.20 portant. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Battus par l\u2019Argentine en demi-finale\ndu tournoi olympique de la...", "mass": 5, "physics": false, "shape": "box", "title": "Battus par l\u2019Argentine en demi-finale du tournoi olympique de la jeunesse \u00e0 Dakar, les Lionceaux de l\u2019Atlas ont su r\u00e9pondre pr\u00e9sent dans ce rendez-vous d\u00e9cisif face \u00e0 l\u2019Afghanistan. [lematin.ma]\n-------------------------------------------------\nElle a battu l\u2019Afghanistan 2-1 lors du match pour la troisi\u00e8me place, et termine ainsi sur le podium apr\u00e8s sa d\u00e9faite en demi-finale. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Wafa Assurance poursuit son d\u00e9veloppement\nsur le march\u00e9 de l\u2019assurance-vie...", "mass": 5, "physics": false, "shape": "box", "title": "Wafa Assurance poursuit son d\u00e9veloppement sur le march\u00e9 de l\u2019assurance-vie avec la signature d\u2019un accord aupr\u00e8s du groupe Saham en vue d\u2019acqu\u00e9rir 99,98% du capital de La Marocaine. [lematin.ma]\n-------------------------------------------------\nWafa Assurance a sign\u00e9 un accord en vue de mettre la main sur 99,98% du capital de La Marocaine Vie. [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, qui reste soumise aux autorisations r\u00e9glementaires, s\u0027accompagne d\u0027un partenariat de bancassurance de long terme entre Wafa Assurance et Saham Bank. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le long-m\u00e9trage Fez Summer 55,\nr\u00e9alis\u00e9 par Abdelha\u00ef Laraki et...", "mass": 5, "physics": false, "shape": "box", "title": "Le long-m\u00e9trage Fez Summer 55, r\u00e9alis\u00e9 par Abdelha\u00ef Laraki et produit par Caroline Locardi (A2L Production), a re\u00e7u deux distinctions le 10 novembre 2026, lors de la 7e \u00e9dition du Festival de film de Matera, en Italie : le Prix du film et le Prix de la production Focus M\u00e9diterran\u00e9e. [telquel.ma]\n-------------------------------------------------\nProduit par Caroline Locardi, d\u2019A2L Production, le long m\u00e9trage a \u00e9t\u00e9 distingu\u00e9 pour le film et sa production dans la section Focus M\u00e9diterran\u00e9e, selon un communiqu\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Une actrice oscaris\u00e9e, huit personnalit\u00e9s\ndu cin\u00e9ma international et quatorze...", "mass": 5, "physics": false, "shape": "box", "title": "Une actrice oscaris\u00e9e, huit personnalit\u00e9s du cin\u00e9ma international et quatorze films en qu\u00eate de l\u2019\u00c9toile d\u2019or : le Festival International du Film de Marrakech a d\u00e9voil\u00e9 le jury de sa 23\u1d49 \u00e9dition, plac\u00e9 sous la pr\u00e9sidence de Marion Cotillard. [telquel.ma]\n-------------------------------------------------\nPr\u00e9sid\u00e9 par Marion Cotillard, oscaris\u00e9e pour La M\u00f4me, il r\u00e9unit huit personnalit\u00e9s du cin\u00e9ma international charg\u00e9es de d\u00e9partager les quatorze films en lice pour l\u2019\u00c9toile d\u2019or. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019H\u00f4pital universitaire international Mohammed VI\nde Rabat a r\u00e9alis\u00e9, le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019H\u00f4pital universitaire international Mohammed VI de Rabat a r\u00e9alis\u00e9, le 15 octobre, sa premi\u00e8re transplantation h\u00e9patique \u00e0 partir d\u2019une donneuse vivante. [telquel.ma]\n-------------------------------------------------\nCette intervention, r\u00e9alis\u00e9e le 15 octobre, est la premi\u00e8re greffe du foie \u00e0 partir d\u2019un donneur vivant pratiqu\u00e9e \u00e0 l\u2019H\u00f4pital universitaire international Mohammed VI de Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les acquis accomplis au sein\ndu syst\u00e8me de l\u2019\u00e9ducation, de...", "mass": 5, "physics": false, "shape": "box", "title": "Les acquis accomplis au sein du syst\u00e8me de l\u2019\u00e9ducation, de la formation et de la recherche scientifique n\u2019ont pas encore abouti \u00e0 la transformation globale et syst\u00e9mique escompt\u00e9e, telle que pr\u00e9conis\u00e9e par la vision strat\u00e9gique de la r\u00e9forme 2015-2030, a affirm\u00e9, mercredi \u00e0 Rabat, le directeur de l\u2019Instance nationale d\u2019\u00e9valuation (INE), Hicham Ait Mansour. [telquel.ma]\n-------------------------------------------------\nMalgr\u00e9 les avanc\u00e9es enregistr\u00e9es au cours de la derni\u00e8re d\u00e9cennie, le syst\u00e8me marocain d\u2019\u00e9ducation, de formation et de recherche scientifique n\u2019a pas encore connu la transformation structurelle attendue dans le cadre de la Vision strat\u00e9gique 2015-2030. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les projets ferroviaires en cours\nde r\u00e9alisation, notamment la Ligne...", "mass": 5, "physics": false, "shape": "box", "title": "Les projets ferroviaires en cours de r\u00e9alisation, notamment la Ligne \u00e0 grande vitesse (LGV) qui reliera Tanger \u00e0 Marrakech, vont transformer le paysage du transport et de la mobilit\u00e9 dans le Royaume \u00e0 l\u2019horizon 2029, a affirm\u00e9, mercredi \u00e0 la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [telquel.ma]\n-------------------------------------------------\nDevant la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh, a notamment mis en avant les perspectives offertes par la ligne \u00e0 grande vitesse Tanger-Marrakech, le d\u00e9veloppement des trains r\u00e9gionaux . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019examen des amendements propos\u00e9s au\nprojet de loi de finances...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019examen des amendements propos\u00e9s au projet de loi de finances (PLF) de 2027 a port\u00e9, mercredi lors d\u2019une r\u00e9union de la Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants, sur plusieurs dispositions douani\u00e8res et fiscales relatives notamment \u00e0 l\u2019organisation de la profession de transitaire en douane, \u00e0 l\u2019importation de b\u00e9tail et. [telquel.ma]\n-------------------------------------------------\nL\u2019examen des amendements au projet de loi de finances (PLF) 2027 a donn\u00e9 lieu, mercredi 11 novembre \u00e0 la Chambre des repr\u00e9sentants, \u00e0 plusieurs d\u00e9bats portant sur la r\u00e9glementation de la profession de transitaire en douane, les exon\u00e9rations accord\u00e9es aux importations de b\u00e9tail et de viandes, ainsi que la protection de l\u2019industrie pharmaceutique nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Plusieurs quartiers de Casablanca restent\npriv\u00e9s d\u2019\u00e9lectricit\u00e9 ce mercredi 11...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs quartiers de Casablanca restent priv\u00e9s d\u2019\u00e9lectricit\u00e9 ce mercredi 11 novembre au soir, malgr\u00e9 le r\u00e9tablissement du courant dans certains secteurs. [telquel.ma]\n-------------------------------------------------\nLes \u00e9quipes de la Soci\u00e9t\u00e9 R\u00e9gionale Multiservices Casablanca-Settat (SRM-CS) sont mobilis\u00e9es pour d\u00e9terminer l\u2019origine de l\u2019incident et \u00e9valuer le d\u00e9lai n\u00e9cessaire au r\u00e9tablissement de l\u2019alimentation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le Maroc figure parmi les\nsix premiers pays et programmes...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc figure parmi les six premiers pays et programmes r\u00e9gionaux retenus dans le cadre d\u2019ARISE, une initiative des Fonds d\u2019investissement climatiques (CIF) destin\u00e9e \u00e0 soutenir les investissements dans la r\u00e9silience climatique. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc figure parmi les six premiers b\u00e9n\u00e9ficiaires du programme ARISE, lanc\u00e9 par les Fonds d\u2019investissement climatiques (CIF), avec la possibilit\u00e9 de mobiliser jusqu\u2019\u00e0 30 millions de dollars de financements concessionnels. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "La Banque Centrale Populaire (BCP)\net sa filiale Upline Securities...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9, le 12 novembre 2026 \u00e0 Casablanca, avoir obtenu aupr\u00e8s des autorit\u00e9s comp\u00e9tentes les agr\u00e9ments n\u00e9cessaires pour intervenir sur le march\u00e9 \u00e0 terme au Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLa Banque centrale populaire (BCP) et sa filiale Upline Securities ont obtenu leurs agr\u00e9ments respectifs aupr\u00e8s des autorit\u00e9s comp\u00e9tentes dans le cadre du lancement du march\u00e9 \u00e0 terme au Maroc, une nouvelle \u00e9tape dans le d\u00e9veloppement du march\u00e9 des capitaux national. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9, jeudi 12 novembre, l\u2019obtention de leurs agr\u00e9ments dans le cadre de l\u2019ouverture du march\u00e9 \u00e0 terme au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le groupe Laprophan pr\u00e9voit de\nmettre en service courant 2027,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Laprophan pr\u00e9voit de mettre en service courant 2027, par l\u2019interm\u00e9diaire de sa filiale Amanys Pharma, une unit\u00e9 de production d\u2019injectables st\u00e9riles \u00e0 A\u00efn El Aouda, pr\u00e8s de Rabat. [www.yabiladi.com]\n-------------------------------------------------\nDot\u00e9e d\u2019une capacit\u00e9 annuelle de 30 millions d\u2019unit\u00e9s, cette installation vise \u00e0 r\u00e9pondre aux besoins du march\u00e9 national tout en ouvrant de nouvelles perspectives \u00e0 l\u2019export. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 travers sa filiale Amanys Pharma, acquise int\u00e9gralement en 2024, il pr\u00e9pare l\u2019entr\u00e9e en activit\u00e9 d\u2019une nouvelle unit\u00e9 sp\u00e9cialis\u00e9e dans la fabrication de m\u00e9dicaments injectables st\u00e9riles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Les \u00c9tats-Unis engagent 4 millions\nde dollars en faveur de...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00c9tats-Unis engagent 4 millions de dollars en faveur de STRIDES, qui s\u2019ajoutent \u00e0 plus de 10 millions de dollars consacr\u00e9s aux actions conjointes de s\u00e9curit\u00e9 sanitaire, par l\u2019interm\u00e9diaire des Centres pour le contr\u00f4le et la pr\u00e9vention des maladies et de l\u2019Agence t de se rendre au Maroc, fin novembre, pour examiner les six stades propos\u00e9s pour cette comp\u00e9tition. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La Caisse Mutualiste Interprofessionnelle Marocaine\n(CMIM) organise, en partenariat avec...", "mass": 5, "physics": false, "shape": "box", "title": "La Caisse Mutualiste Interprofessionnelle Marocaine (CMIM) organise, en partenariat avec la Marocaine des Jeux et des Sports (MDJS), le 25 novembre 2026, \u00e0 Casablanca, sa 13\u1d49 Journ\u00e9e Sant\u00e9 au Travail, autour d\u2019une th\u00e9matique au c\u0153ur des transformations du monde professionnel : Repenser le travail. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Caisse mutualiste interprofessionnelle marocaine (CMIM) organise, le 25 novembre 2026, \u00e0 Casablanca, en partenariat avec la Marocaine des jeux et des sports (MDJS), sa 13e Journ\u00e9e Sant\u00e9 au travail, sous le th\u00e8me \u00abRepenser le travail. [leseco.ma]\n-------------------------------------------------\nLa sant\u00e9 mentale des travailleurs sera au centre de la 13e Journ\u00e9e Sant\u00e9 au Travail organis\u00e9e par la Caisse Mutualiste Interprofessionnelle Marocaine (CMIM), le 25 novembre prochain \u00e0 Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le g\u00e9ant am\u00e9ricain du logiciel\nMicrosoft, confront\u00e9 \u00e0 une panne...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9ant am\u00e9ricain du logiciel Microsoft, confront\u00e9 \u00e0 une panne mondiale de sa messagerie Outlook, a \u00e9cart\u00e9 vendredi l\u2019hypoth\u00e8se d\u2019une action malveillante pour expliquer ce dysfonctionnement et affirm\u00e9 percevoir de premiers \u00ab r\u00e9sultats positifs \u00bb en vue d\u2019un retour \u00e0 la             setTimeout(positionCommunityLabels, 50);

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
