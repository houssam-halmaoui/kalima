 fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u0027article 92 de la Constitution. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, ce jeudi \u00e0 Rabat, des propositions de nomination \u00e0 des fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u2019article 92 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Dans son rapport \u00ab Food\nSovereignty in Morocco \u00bb, le...", "mass": 5, "physics": false, "shape": "box", "title": "Dans son rapport \u00ab Food Sovereignty in Morocco \u00bb, le Moroccan Institute for Policy Analysis (MIPA) interroge un mod\u00e8le agricole qui, malgr\u00e9 ses performances \u00e0 l\u2019export, d\u00e9pend toujours largement des importations pour subvenir aux besoins essentiels. [www.lopinion.ma]\n-------------------------------------------------\nUn rapport du Moroccan Institute for Policy Analysis (MIPA) sur la souverainet\u00e9 alimentaire au Maroc, publi\u00e9 le 21 octobre, remet en cause la r\u00e9alit\u00e9 de l\u2019autosuffisance alimentaire du royaume dans le secteur des viandes. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Selon une \u00e9tude command\u00e9e par\nle gouvernement espagnol \u00e0 l\u2019entreprise...", "mass": 5, "physics": false, "shape": "box", "title": "Selon une \u00e9tude command\u00e9e par le gouvernement espagnol \u00e0 l\u2019entreprise allemande Herrenknecht, le projet de tunnel ferroviaire sous le d\u00e9troit de Gibraltar reliant l\u2019Espagne au Maroc est techniquement viable. [www.lopinion.ma]\n-------------------------------------------------\nUne \u00e9tude command\u00e9e par le gouvernement espagnol \u00e0 l\u2019entreprise allemande Herrenknecht, sp\u00e9cialis\u00e9e dans la construction de gros tunneliers, conclut que le projet de tunnel sous-marin reliant l\u2019Espagne au Maroc est techniquement viable, rapporte la presse espagnole. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Soci\u00e9t\u00e9 r\u00e9gionale multiservices Casablanca-Settat\na annonc\u00e9 dans un communiqu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Soci\u00e9t\u00e9 r\u00e9gionale multiservices Casablanca-Settat a annonc\u00e9 dans un communiqu\u00e9 qu\u2019une panne s\u2019est produite, hier, jeudi 30 octobre, sur l\u2019une des principales conduites d\u2019eau potable alimentant les quartiers de Moulay Rachid, Sbata, Salmia, Sidi Othmane et la partie nord d\u2019El Harraouine \u00e0 Casablanca. [telquel.ma]\n-------------------------------------------------\nUne rupture s\u2019est produite le jeudi 30 octobre 2025 sur une conduite principale d\u2019eau potable alimentant plusieurs quartiers de Casablanca, notamment Moulay Rachid, Sbata, Salmiya, Sidi Othmane et Lahraouiyine Nord. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le projet de loi de\nfinances (PLF) de l\u2019ann\u00e9e 2026...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026 incarne les efforts d\u00e9ploy\u00e9s par le Royaume pour consolider les fondements de la trajectoire du \u00ab Maroc \u00e9mergent \u00bb, \u00e0 m\u00eame de r\u00e9aliser un d\u00e9veloppement inclusif alliant efficacit\u00e9 \u00e9conomique, justice sociale et d\u00e9veloppement territorial int\u00e9gr\u00e9, a affirm\u00e9, jeudi \u00e0 la Chambre des repr\u00e9sentants, la ministre de l\u2019\u00c9conomie. [telquel.ma]\n-------------------------------------------------\nLe projet de loi de finances (PLF) 2026 traduit, selon la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, la volont\u00e9 de consolider les fondements d\u2019un \u00ab Maroc \u00e9mergent \u00bb articul\u00e9 autour de l\u2019efficacit\u00e9 \u00e9conomique, de la justice sociale et d\u2019un d\u00e9veloppement territorial int\u00e9gr\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Cette nouvelle connexion, op\u00e9r\u00e9e une\nfois par semaine, marque une...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle connexion, op\u00e9r\u00e9e une fois par semaine, marque une \u00e9tape majeure dans la strat\u00e9gie de diversification des march\u00e9s et de d\u00e9saisonnalisation de la destination Maroc \u00bb, indique jeudi, un communiqu\u00e9 de l\u2019ONMT. [telquel.ma]\n-------------------------------------------------\nGr\u00e2ce \u00e0 l\u2019action de l\u2019Office National Marocain du Tourisme, Air Transat inaugurera le 12 juin 2026 la premi\u00e8re liaison directe entre Montr\u00e9al et Agadir. [www.challenge.ma]\n-------------------------------------------------\nCe nouveau vol constitue une premi\u00e8re historique, dans la mesure o\u00f9 il relie directement l\u2019Am\u00e9rique du Nord au Sud marocain. [www.lavieeco.com]\n-------------------------------------------------\nLa desserte sera op\u00e9r\u00e9e chaque vendredi du 12 juin au 23 octobre de l\u2019ann\u00e9e prochaine. [leseco.ma]\n-------------------------------------------------\nGr\u00e2ce \u00e0 l\u2019action de l\u2019Office National Marocain du Tourisme (ONMT), la compagnie canadienne Air Transat inaugurera le 12 juin 2026 la premi\u00e8re liaison directe entre Montr\u00e9al et Agadir. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La s\u00e9lection marocaine de football\ndisputera deux matches amicaux face...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football disputera deux matches amicaux face au Mozambique et \u00e0 l\u2019Ouganda, respectivement les 14 et 18 novembre prochain au Grand Stade de Tanger. [telquel.ma]\n-------------------------------------------------\nAu rythme de la pr\u00e9paration pour la prochaine CAN 2025, les matchs amicaux des Lions de l\u0027Atlas contre le Mozambique et l\u0027Ouganda se d\u00e9rouleront les 14 et 18 novembre au Grand Stade de Tanger. [www.lavieeco.com]\n-------------------------------------------------\nLa derni\u00e8re \u00e9tape pr\u00e9paratoire des Lions de l\u2019Atlas avant la Coupe d\u2019Afrique 2025 verra l\u2019\u00e9quipe nationale A affronter le Mozambique et l\u2019Ouganda les 14 et 18 novembre. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Conseil de gouvernement, r\u00e9uni\nce jeudi 30 octobre sous...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni ce jeudi 30 octobre sous la pr\u00e9sidence d\u2019Aziz Akhannouch, a adopt\u00e9 plusieurs d\u00e9cisions majeures, dont l\u2019attribution des licences 5G aux trois op\u00e9rateurs t\u00e9l\u00e9coms du royaume. [telquel.ma]\n-------------------------------------------------\nCes licences ont \u00e9t\u00e9 attribu\u00e9es aux trois op\u00e9rateurs, Itissalat Al-Maghrib, M\u00e9di Telecom et Wana corporate, pour l\u2019\u00e9tablissement et l\u2019exploitation de r\u00e9seaux de t\u00e9l\u00e9communications utilisant cette technologie. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, trois projets de d\u00e9cret relatifs \u00e0 l\u2019octroi de licences pour l\u2019\u00e9tablissement et l\u2019exploitation de r\u00e9seaux de t\u00e9l\u00e9communications utilisant les technologies mobiles de 5\u00e8me g\u00e9n\u00e9ration (5G), pr\u00e9sent\u00e9s par la ministre d\u00e9l\u00e9gu\u00e9e aupr\u00e8s du Chef du gouvernement, charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La production pr\u00e9visionnelle des dattes\ns\u2019\u00e9l\u00e8ve \u00e0 160.000 tonnes au...", "mass": 5, "physics": false, "shape": "box", "title": "La production pr\u00e9visionnelle des dattes s\u2019\u00e9l\u00e8ve \u00e0 160.000 tonnes au titre de la campagne agricole 2025-2026, a fait savoir, mercredi \u00e0 Erfoud, le ministre de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats, Ahmed El Bouari. [telquel.ma]\n-------------------------------------------------\nLa production pr\u00e9visionnelle des dattes s\u2019\u00e9l\u00e8ve \u00e0 160.000 tonnes au titre de la campagne agricole 2025-2026, a fait savoir, mercredi \u00e0 Erfoud, le ministre de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats, Ahmed El Bouari. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Verdure Sous le ciel \u00e9toil\u00e9\nde la cit\u00e9 ocre, le...", "mass": 5, "physics": false, "shape": "box", "title": "Verdure Sous le ciel \u00e9toil\u00e9 de la cit\u00e9 ocre, le Royal Palm Marrakech a c\u00e9l\u00e9br\u00e9, le jeudi 23 octobre, la r\u00e9v\u00e9lation du Jardin Ocre lors d\u2019une soir\u00e9e empreinte d\u2019\u00e9l\u00e9gance et de raffinement. [aujourdhui.ma]\n-------------------------------------------------\n\u00c9tendu sur cinq hectares, ce jardin se veut une v\u00e9ritable ode \u00e0 la biodiversit\u00e9 marocaine avec plus de 38 000 plantes et 250 esp\u00e8ces v\u00e9g\u00e9tales, dont une roseraie de 2 300 . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Groupe Barid Al-Maghrib et\nl\u2019Ordre National des Adouls ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe Barid Al-Maghrib et l\u2019Ordre National des Adouls ont proc\u00e9d\u00e9, ce jeudi, \u00e0 la signature d\u2019une convention-cadre de partenariat lors d\u2019une c\u00e9r\u00e9monie organis\u00e9e au Mus\u00e9e Barid Al-Maghrib \u00e0 Rabat. [www.lavieeco.com]\n-------------------------------------------------\nUne convention-cadre de partenariat a \u00e9t\u00e9 conclue, jeudi \u00e0 Rabat, entre le Groupe Barid Al-Maghrib et l\u2019Ordre national des Adouls, pour l\u2019accompagnement et la modernisation de la profession d\u2019Adoul. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "En septembre 2025, l\u2019agr\u00e9gat M3\ns\u2019est \u00e9tabli \u00e0 pr\u00e8s de...", "mass": 5, "physics": false, "shape": "box", "title": "En septembre 2025, l\u2019agr\u00e9gat M3 s\u2019est \u00e9tabli \u00e0 pr\u00e8s de 1.996 milliards de dirhams, en hausse annuelle de 7,8% contre 8,3% un mois plus t\u00f4t, selon Bank Al-Maghrib. [www.lavieeco.com]\n-------------------------------------------------\nLa masse mon\u00e9taire M3 a atteint 1.996,14 MMDH en septembre 2025, en hausse de 7,8% en glissement annuel, apr\u00e8s 8,3% en ao\u00fbt, selon le bulletin des statistiques mon\u00e9taires de Bank Al-Maghrib. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Dans le cadre du renforcement\ndes relations \u00e9conomiques entre le...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre du renforcement des relations \u00e9conomiques entre le Royaume du Maroc et     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

                    }
                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
