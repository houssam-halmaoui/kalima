u00e8res, Jean-No\u00ebl Barrot. [fr.hespress.com]\n-------------------------------------------------\nCet entretien a eu lieu en marge du 2e Sommet mondial sur l\u2019\u00e9nergie nucl\u00e9aire auquel le chef du gouvernement, Aziz Akhannouch, a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI.L\u2019entrevue. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a eu, mardi 10 mars \u00e0 Paris, un entretien avec le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot. [telquel.ma]\n-------------------------------------------------\nLe ministre marocain des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u00e9tranger, Nasser Bourita, a rencontr\u00e9 mardi \u00e0 Paris Jean-No\u00ebl Barrot, ministre fran\u00e7ais de lEurope et des Affaires \u00e9trang\u00e8res. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u0027\u00e9tranger, Nasser Bourita, a eu, mardi \u00e0 Paris, un entretien avec le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La premi\u00e8re partie installe une\natmosph\u00e8re \u00e9pur\u00e9e : seule en...", "mass": 5, "physics": false, "shape": "box", "title": "La premi\u00e8re partie installe une atmosph\u00e8re \u00e9pur\u00e9e : seule en sc\u00e8ne avec sa guitare, Amina Bensouda ouvre un esp. [lematin.ma]\n-------------------------------------------------\nPens\u00e9 comme un cheminement int\u00e9rieur, ce concert auto-produit se d\u00e9         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
