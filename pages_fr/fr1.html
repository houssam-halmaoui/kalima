[www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les a\u00e9roports du Royaume ont\naccueilli plus de 23,9 millions...", "mass": 5, "physics": false, "shape": "box", "title": "Les a\u00e9roports du Royaume ont accueilli plus de 23,9 millions de voyageurs entre janvier et ao\u00fbt 2025, enregistrant une hausse de 11,7 % par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les donn\u00e9es de la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [fr.hespress.com]\n-------------------------------------------------\nLe flux de voyageurs accueillis dans les a\u00e9roports du Royaume a d\u00e9pass\u00e9 23,9 millions de personnes durant les huit premiers mois de 2025, en hausse de 11,7% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [www.lopinion.ma]\n-------------------------------------------------\nLe flux de voyageurs accueillis dans les a\u00e9roports du Royaume a d\u00e9pass\u00e9 23,9 millions de personnes durant les huit premiers mois de 2025, en hausse de 11,7% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [telquel.ma]\n-------------------------------------------------\nLe flux de voyageurs accueillis dans les a\u00e9roports du Royaume a d\u00e9pass\u00e9 23,9 millions de personnes durant les huit premiers mois de 2025, en hausse de 11,7% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Selon les termes de l\u2019accord,\nune coentreprise d\u00e9tenue \u00e0 51%...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les termes de l\u2019accord, une coentreprise d\u00e9tenue \u00e0 51% par Marsa Maroc et \u00e0 49% par CMA Terminals sera charg\u00e9e de la gestion, du d\u00e9veloppement et de l\u2019exploitation du termina. [lematin.ma]\n-------------------------------------------------\nMarsa Maroc et CMA Terminals, filiale du Groupe CMA CGM, ont annonc\u00e9, vendredi, la finalisation de l\u2019accord de partenariat pour l\u2019exploitation du Terminal \u00e0 Conteneurs Ouest du port Nador West Med. [www.lopinion.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue de la finalisation de cet accord, soumise \u00e0 l\u2019approbation des autorit\u00e9s comp\u00e9tentes, Marsa Maroc d\u00e9tiendra 51 % du capital et des droits de vote de la soci\u00e9t\u00e9 concessionnaire, tandis que CMA Terminals en poss\u00e9dera 49 %. [www.lavieeco.com]\n-------------------------------------------------\nMarsa Maroc et CMA Terminals, filiale du Groupe CMA CGM, ont annonc\u00e9 la finalisation de leur accord de partenariat pour l\u2019exploitation du Terminal \u00e0 Conteneurs Ouest du port Nador West Med. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Royal Air Maroc lance de\nnouvelles liaisons reliant Marrakech \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc lance de nouvelles liaisons reliant Marrakech \u00e0 Dakha et La\u00e2youne, d\u0027une augmentation des fr\u00e9quences depuis Rabat vers La\u00e2youne et Dakhla, d\u0027une offre \u00e9toff. [lematin.ma]\n-------------------------------------------------\nDans le d\u00e9tail, deux nouvelles liaisons a\u00e9riennes strat\u00e9giques ont \u00e9t\u00e9 inaugur\u00e9es en octobre courant au d\u00e9part de Marrakech, renfor\u00e7ant la connectivit\u00e9 entre la ville ocre et les provinces du Sud.. [telquel.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) intensifie sa pr\u00e9sence dans les provinces du Sud du Royaume avec une offre enrichie et diversifi\u00e9e, dans le cadre d\u2019un plan strat\u00e9gique de renforcement des liaisons a\u00e9riennes domestiques. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La Directrice r\u00e9gional de la\nSant\u00e9 de Rabat-Sal\u00e9-K\u00e9nitra, Nouria Saidi,...", "mass": 5, "physics": false, "shape": "box", "title": "La Directrice r\u00e9gional de la Sant\u00e9 de Rabat-Sal\u00e9-K\u00e9nitra, Nouria Saidi, a \u00e9t\u00e9 d\u00e9mise de ses fonctions et remplac\u00e9e, apprend-on de source s\u00fbre. [www.lopinion.ma]\n-------------------------------------------------\nJeudi dernier, le ministre de la Sant\u00e9, Amine Tahraoui, a d\u00e9mi Noria Saidi de ses fonctions de directrice r\u00e9gionale de la Sant\u00e9 et de la Protection sociale pour la r\u00e9gion de Rabat-Sal\u00e9-K\u00e9nitra. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Un total de 148 projets\nayant pour support un foncier...", "mass": 5, "physics": false, "shape": "box", "title": "Un total de 148 projets ayant pour support un foncier relevant du domaine priv\u00e9 de l\u0027Etat ont \u00e9t\u00e9 approuv\u00e9s au premier semestre de l\u2019exercice 2025, pour une superficie globale de 20.771 hectares (Ha), selon le rapport sur le foncier public mobilis\u00e9 pour l\u0027investissement accompagnant le projet de loi de finances (PLF) de 2026. [www.lopinion.ma]\n-------------------------------------------------\nLe rapport sur le foncier public mobilis\u00e9 pour l\u2019investissement accompagnant le projet de loi de finances (PLF) de 2026, indique qu\u2019un total de 148 projets ayant pour support un foncier relevant du domaine priv\u00e9 de l\u2019Etat ont \u00e9t\u00e9 approuv\u00e9s au 1er semestre de l\u2019exercice 2025, pour une superficie globale de 20.771 hectares (Ha). [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Stellantis Maroc et Al Barid\nBank ont conclu un partenariat...", "mass": 5, "physics": false, "shape": "box", "title": "Stellantis Maroc et Al Barid Bank ont conclu un partenariat pour faciliter l\u2019acc\u00e8s au financement de v\u00e9hicules de micro mobilit\u00e9 avec des offres pouvant atteindre jusqu\u0027\u00e0 80 % de la valeur du v\u00e9hicules pour les clients professionnels. [www.lopinion.ma]\n-------------------------------------------------\nStellantis Maroc et Al Barid Bank ont sign\u00e9 un partenariat strat\u00e9gique pour faciliter l\u2019acc\u00e8s au financement de v\u00e9hicules de micro-mobilit\u00e9 destin\u00e9s aux professionnels marocains. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "L\u2019Institution du M\u00e9diateur du Royaume\na annonc\u00e9 que les usagers...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Institution du M\u00e9diateur du Royaume a annonc\u00e9 que les usagers de l\u2019application \"Pass Jeunes\" peuvent acc\u00e9der, \u00e0 partir de ce vendredi 24 octobre, \u00e0 la plateforme \"MARFI9I\", d\u00e9di\u00e9e \u00e0 la participation citoyenne autour de l\u2019\u00e9valuation des services de sant\u00e9 dans le cadre de son programme \"Forums sur la gouvernance publique\". [www.lopinion.ma]\n-------------------------------------------------\nL\u2019Institution du M\u00e9diateur du Royaume a annonc\u00e9 que les usagers de l\u2019application \u201cPass Jeunes\u201d peuvent acc\u00e9der, \u00e0 partir de ce vendredi 24 octobre, \u00e0 la plateforme \u201cMARFI9I\u201d, d\u00e9di\u00e9e \u00e0 la participation citoyenne autour de l\u2019\u00e9valuation des services de sant\u00e9 dans le cadre de son programme \u201cForums sur la gouvernance publique\u201d. [telquel.ma]\n-------------------------------------------------\nLanc\u00e9e dans le cadre du programme \"Forums sur la gouvernance publique\" de l\u2019Institution du M\u00e9diateur du Royaume, cette initiative marque une nouvelle \u00e9tape dans la promotion du dialogue entre citoyens et institutions publiques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "D\u00e9ploy\u00e9e en partenariat avec le\nminist\u00e8re de l\u2019\u00c9ducation nationale et...", "mass": 5, "physics": false, "shape": "box", "title": "D\u00e9ploy\u00e9e en partenariat avec le minist\u00e8re de l\u2019\u00c9ducation nationale et les Acad\u00e9mies r\u00e9gionales de Rabat et Tanger, l\u2019initiative est port\u00e9e par la Fondation Al Mada, avec le soutien op\u00e9rationnel des programmes. [telquel.ma]\n-------------------------------------------------\nLa Fondation Al Mada a c\u00e9l\u00e9br\u00e9 cette semaine, \u00e0 Rabat et Tanger, la premi\u00e8re promotion du programme Acad\u00e9mie des Arts, marquant une nouvelle \u00e9tape dans son engagement pour une jeunesse marocaine cr\u00e9ative, \u00e9panouie et actrice de son avenir. [aujourdhui.ma]\n-------------------------------------------------\nEn c\u00e9l\u00e9brant la premi\u00e8re promotion de l\u2019Acad\u00e9mie des Arts \u00e0 Rabat et Tanger, la Fondation Al Mada consacre un mod\u00e8le in\u00e9dit de formation artistique gratuite, ouvert \u00e0 tous les jeunes talents du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Des associations \u0153uvrant pour la\npromotion de la langue amazighe...", "mass": 5, "physics": false, "shape": "box", "title": "Des associations \u0153uvrant pour la promotion de la langue amazighe au Maroc et \u00e0 l\u2019\u00e9tranger ont adress\u00e9 une lettre, sous forme de p\u00e9tition, \u00e0 Fouzi Lekjaa, pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [telquel.ma]\n-------------------------------------------------\nCinquante associations au Maroc et de l\u00e9tranger ont soumis une p\u00e9tition \u00e0 Fouzi Lekjaa, pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football, demandant lint\u00e9gration de la langue amazighe dans les activit\u00e9s de linstance. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La production de l\u2019\u00e9nergie \u00e9lectrique\nau niveau national s\u2019est appr\u00e9ci\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "La production de l\u2019\u00e9nergie \u00e9lectrique au niveau national s\u2019est appr\u00e9ci\u00e9e de 5,3% au terme des huit premiers mois de 2025, apr\u00e8s une augmentation de 2,3% un an auparavant, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF) relevant du minist\u00e8re de l\u2019\u00c9conomie et des Finances. [telquel.ma]\n-------------------------------------------------\nLes derniers indicateurs publi\u00e9s par la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF), relevant du minist\u00e8re de l\u2019\u00c9conomie et des Finances, montrent une consolidation de la dynamique \u00e9conomique du Maroc sur plusieurs fronts au cours des neuf premiers mois de 2025. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019op\u00e9ration de versement de l\u2019aide\nfinanci\u00e8re directe aux \u00e9leveurs sera...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration de versement de l\u2019aide financi\u00e8re directe aux \u00e9leveurs sera effectu\u00e9e selon un dispositif transparent et s\u00e9curis\u00e9, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats, Ahmed El Bouari. [telquel.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration de versement de l\u2019aide financi\u00e8re directe aux \u00e9leveurs sera effectu\u00e9e selon un dispositif transparent et s\u00e9curis\u00e9, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats, Ahmed El Bouari. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le minist\u00e8re de l\u2019Agriculture, de\nla P\u00eache maritime, du D\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats a donn\u00e9, jeudi, le coup d\u2019envoi de l\u2019op\u00e9ration de versement de l\u2019aide financi\u00e8re directe aux \u00e9leveurs, dans le cadre du programme de reconstitution du cheptel national. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats a donn\u00e9, jeudi, le coup d\u2019envoi de l\u2019op\u00e9ration de versement de l\u2019aide financi\u00e8re directe aux \u00e9leveurs, dans le cadre du programme de reconstitution du cheptel national. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi 23 octobre, une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi 23 octobre, une s\u00e9rie de propositions de nomination \u00e0 des fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u2019article 92 de la Constitution. [www.challenge.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, ce jeudi \u00e0 Rabat, des propositions de nomination \u00e0 des fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u2019article 92 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le texte de la fatwa\nsur la zakat du Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Le texte de la fatwa sur la zakat du Conseil sup\u00e9rieur des oul\u00e9mas a \u00e9t\u00e9 mis en ligne, vendredi \u00e0 15h00, apr\u00e8s que le roi Mohammed VI a pris connaissance de ce texte et donn\u00e9 son approbation pour sa mise \u00e0 la disposition du public. [www.yabiladi.com]\n-------------------------------------------------\nLe texte de la Fatwa sur la Zakat du Conseil Sup\u00e9rieur des Oul\u00e9mas a \u00e9t\u00e9 mis en ligne, vendredi \u00e0 15h00, apr\u00e8s que Sa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, que Dieu Le pr\u00e9serve, ait bien voulu prendre connaissance de ce texte et donner Sa Haute approbation pour sa mise \u00e0 la disposition du public. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Une distinction accord\u00e9e par le\ncabinet Certi-Trust attestant de la...", "mass": 5, "physics": false, "shape": "box", "title": "Une distinction accord\u00e9e par le cabinet Certi-Trust attestant de la conformit\u00e9 du syst\u00e8me de management anti-corruption (SMAC) du Groupe aux exigences internationales et illustre son engagement fort en faveur de la transparence et de l\u2019\u00e9thique. [aujourdhui.ma]\n-------------------------------------------------\nCette certification confirme que le Syst\u00e8me de Management Anti-Corruption (SMAC) du groupe r\u00e9pond aux exigences internationales, soulignant son engagement envers la transparence et l\u2019\u00e9thique dans ses activit\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a d\u00e9voil\u00e9, mercredi, la...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9, mercredi, la liste des nomin\u00e9s pour les cat\u00e9gories masculines des CAF Awards 2025, avec une forte pr\u00e9sence du football marocain dans toutes les cat\u00e9gories. [www.lavieeco.com]\n-------------------------------------------------\nUne liste o\u00f9 le football marocain est repr\u00e9sent\u00e9 dans toutes les cat\u00e9gories, augurant une belle moisson lors de la c\u00e9r\u00e9monie. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat, a adopt\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret n\u00b02.23.715 modifiant le d\u00e9cret n\u00b02.08.358 du 5 Rajab 1429 (9 juillet 2008) fixant le montant des allocations familiales accord\u00e9es par la Caisse nationale de s\u00e9curit\u00e9 sociale (CNSS). [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat sous la pr\u00e9sidence du Chef du gouvernement, a adopt\u00e9 plusieurs textes de d\u00e9crets portant sur des domaines sociaux, \u00e9nerg\u00e9tiques et agricoles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Dans son rapport au Conseil\nde s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "Dans son rapport au Conseil de s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019ONU, Antonio Guterres, a interpell\u00e9 le \"polisario\" sur ses violations syst\u00e9matiques et continues du cessez-le-feu, preuve \u00e0 l\u2019appui. [www.lopinion.ma]\n-------------------------------------------------\nDans son rapport au Conseil de s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019ONU, Antonio Guterres, a interpell\u00e9 le \u00ab polisario \u00bb sur ses violations syst\u00e9matiques et continues du cessez-le-feu, preuve \u00e0 l\u2019appui. [aujourdhui.ma]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
