al des Forces arm\u00e9es royales marocaines re\u00e7oit le nouveau commandant de la force de la MINURSO\nSource: www.yabiladi.com", "url": "https://www.yabiladi.com/articles/details/206143/l-inspecteur-general-forces-armees-royales.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 3, "id": 201, "label": "Notation: Casablanca d\u00e9croche la note...", "shape": "dot", "size": 47, "title": "Notation:\u00a0Casablanca d\u00e9croche la note BBB-/A-3 de S\u0026P Global Ratings, avec perspective stable\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/argent/notation-casablanca-decroche-la-note-bbb-a-3-de-sp-global-ratings-avec-perspective-stable/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Roi Mohammed VI a\ntoujours fait de l\u2019Afrique une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le Roi au troisi\u00e8me Sommet Russie-Afrique. [fr.hespress.com]\n-------------------------------------------------\nLe roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le roi au troisi\u00e8me Sommet Russie-Afrique. [telquel.ma]\n-------------------------------------------------\nLa Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, qui repr\u00e9sente Sa Majest\u00e9 le Roi Mohammed VI au troisi\u00e8me Sommet Russie-Afrique, a pris part, mercredi soir au Kremlin, \u00e0 la r\u00e9ception solennelle offerte par le Pr\u00e9sident russe, M. Vladimir Poutine, en l\u2019honneur des chefs d\u2019\u00c9tat, de gouvernement et des d\u00e9l\u00e9gations participants. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Bourse de Casablanca pr\u00e9voit\nde lancer, dans les prochains...", "mass": 5, "physics": false, "shape": "box", "title": "La Bourse de Casablanca pr\u00e9voit de lancer, dans les prochains jours, deux nouveaux indices baptis\u00e9s \u00ab MASI Rentabilit\u00e9 Brut \u00bb et \u00ab MASI Rentabilit\u00e9 Net \u00bb. [lematin.ma]\n-------------------------------------------------\nLa Bourse de Casablanca a annonc\u00e9, mercredi, le lancement de deux nouveaux indices boursiers, le MASI.20 Rentabilit\u00e9 Brut et le MASI.20 Rentabilit\u00e9 Net, visant \u00e0 offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les dividendes, ces indicateurs doivent offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Lors de cette rencontre, qui\na \u00e9t\u00e9 l\u2019occasion pour \u00e9changer...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette rencontre, qui a \u00e9t\u00e9 l\u2019occasion pour \u00e9changer sur les activit\u00e9s de la Mission des Nations Unies dans les provinces Sud du Royaume, le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohamm. [lematin.ma]\n-------------------------------------------------\nLe g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e Mohammed Berrid, inspecteur g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR) et commandant la zone sud a re\u00e7u, ce jeudi au si\u00e8ge de l\u2019\u00e9tat-major de la zone sud \u00e0 Agadir, le g\u00e9n\u00e9ral de division Jawwad Ahmed, nouveau commandant de la Force de la mission des Nations Unies dans les provinces sud du Royaume. [telquel.ma]\n-------------------------------------------------\nLe G\u00e9n\u00e9ral de Division Jawwad Ahmed, nouveau Commandant de la Force de la Mission des Nations Unies dans les provinces Sud du Royaume, a \u00e9t\u00e9 re\u00e7u, ce jeudi au si\u00e8ge de l\u2019Etat-Major de la Zone Sud \u00e0 Agadir, par le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud. [fr.hespress.com]\n-------------------------------------------------\nLe g\u00e9n\u00e9ral de division Jawwad Ahmed, fra\u00eechement nomm\u00e9 commandant de la force de la Mission des Nations unies pour lorganisation dun r\u00e9f\u00e9rendum au Sahara occidental (MINURSO), a \u00e9t\u00e9 re\u00e7u le jeudi 29 octobre au si\u00e8ge de la Zone Sud \u00e0 Agadir. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les deux grands complexes portuaires\nmarocains Nador West Med et...", "mass": 5, "physics": false, "shape": "box", "title": "Les deux grands complexes portuaires marocains Nador West Med et Tanger Med s\u2019appr\u00eatent \u00e0 franchir de nouvelles \u00e9tapes dans leur d\u00e9veloppement. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI a pr\u00e9sid\u00e9, ce mercredi au palais royal de Rabat, une s\u00e9ance de travail consacr\u00e9e \u00e0 l\u2019ouverture imminente du premier terminal de Nador West Med et au lancement prochain des travaux de Tanger Med 3, annonce le Palais royal dans un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a pr\u00e9sid\u00e9, ce mercredi, au Palais Royal de Rabat, une s\u00e9ance de travail consacr\u00e9e \u00e0 l\u2019avancement du complexe portuaire et industriel Nador West Med, ainsi qu\u2019au projet d\u2019extension du complexe Tanger Med. [leseco.ma]\n-------------------------------------------------\nCommuniqu\u00e9 du Cabinet Royal : \u00ab Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a pr\u00e9sid\u00e9 ce jour au Palais Royal de Rabat, une s\u00e9ance de travail consacr\u00e9e \u00e0 l\u2019avancement du complexe portuaire et industriel Nador West Med, dont le premier terminal doit entrer en exploitation dans les prochains jours, ainsi qu\u2019au projet d\u2019extension du [www.lereporter.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a pr\u00e9sid\u00e9 ce mercredi au Palais royal de Rabat une s\u00e9ance de travail sur la mise en service de Nador West Med et l\u2019extension de Tanger Med. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Selon M. Garc\u00eda-Page, 24 victimes\nse trouvaient \u00e0 bord du...", "mass": 5, "physics": false, "shape": "box", "title": "Selon M. Garc\u00eda-Page, 24 victimes se trouvaient \u00e0 bord du train AVE, tandis que les 44 autres voyageaient \u00e0 bord d\u0027un train de la compagnie Iryo. [lematin.ma]\n-------------------------------------------------\nLe bilan de l\u2019accident ferroviaire survenu mercredi \u00e0 Urda, dans la province de Tol\u00e8de, dans le centre de l\u2019Espagne, s\u2019\u00e9l\u00e8ve \u00e0 au moins 68 morts, a annonc\u00e9 le pr\u00e9sident de la r\u00e9gion de Castille-La Manche, Emiliano Garc\u00eda-Page. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Cette nouvelle desserte s\u2019inscrit dans\nle cadre des efforts visant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle desserte s\u2019inscrit dans le cadre des efforts visant \u00e0 faciliter la mobilit\u00e9 des citoyens et \u00e0 accompagner le d\u00e9veloppement touristique et \u00e9conomique des r\u00e9gions. [lematin.ma]\n-------------------------------------------------\nLa nouvelle liaison a\u00e9rienne directe Casablanca-Essaouira a \u00e9t\u00e9 inaugur\u00e9e, mercredi \u00e0 Essaouira, marquant une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne int\u00e9rieure et de l\u2019int\u00e9gration territoriale du Royaume. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Dans un communiqu\u00e9 publi\u00e9 mardi\n28 octobre 2026, le groupe...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9 publi\u00e9 mardi 28 octobre 2026, le groupe annonce avoir obtenu le visa d. [lematin.ma]\n-------------------------------------------------\nVisa de l\u2019AMMC obtenu, le laboratoire casablancais fond\u00e9 en 1949 ouvre sa souscription au public dans moins de deux semaines. [telquel.ma]\n-------------------------------------------------\nLe groupe pharmaceutique marocain Laprophan a re\u00e7u l\u2019accord de l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) pour entrer en Bourse \u00e0 la Bourse de Casablanca, avec une op\u00e9ration pouvant atteindre 2,22 milliards de dirhams, a annonc\u00e9 l\u2019entreprise le 28 octobre. [www.yabiladi.com]\n-------------------------------------------------\nLAPROPHAN a obtenu, ce 28 octobre 2026, le visa de l\u2019AMMC sous la r\u00e9f\u00e9rence VI/EM/033/2026 pour son introduction \u00e0 la Bourse de Casablanca. [leseco.ma]\n-------------------------------------------------\nApr\u00e8s Jet Energy, le groupe pharmaceutique marocain Laprophan a annonc\u00e9, jeudi 29 octobre, son introduction \u00e0 la Bourse de Casablanca pour un montant maximal de 2,22 milliards de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Commune de Casablanca a\nannonc\u00e9, le         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
