n-------------------------------------------------\nUne d\u00e9l\u00e9gation parlementaire marocaine prend part \u00e0 la session d\u2019automne de l\u2019Assembl\u00e9e parlementaire du Conseil de l\u2019Europe (APCE), organis\u00e9e ce lundi \u00e0 Strasbourg. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette nomination s\u2019inscrit dans le\ncadre d\u2019une nouvelle dynamique visant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nomination s\u2019inscrit dans le cadre d\u2019une nouvelle dynamique visant \u00e0 renforcer le positionnement de Technopark Morocco en tant qu\u2019acteur de r\u00e9f\u00e9rence de l\u2019innovation, de l\u2019en. [lematin.ma]\n-------------------------------------------------\nIntervenue lors du Conseil d\u2019administration tenu le 18 septembre 2026, sous la pr\u00e9sidence de la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration,. [telquel.ma]\n-------------------------------------------------\nLa d\u00e9cision a \u00e9t\u00e9 prise lors du Conseil d\u2019administration tenu le 18 septembre 2026, sous la pr\u00e9sidence d\u2019Amal El Fallah Seghrouchni, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration. [lnt.ma]\n-------------------------------------------------\nIdriss Lamjaouri a \u00e9t\u00e9 d\u00e9sign\u00e9 directeur g\u00e9n\u00e9ral de Technopark Morocco lors dune r\u00e9union du conseil dadministration le 18 septembre 2026, pr\u00e9sid\u00e9e par Amal El Fallah Seghrouchni, ministre d\u00e9l\u00e9gu\u00e9e en charge de la Transition num\u00e9rique et de la R\u00e9forme de ladministration. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019affaire des irr\u00e9gularit\u00e9s ayant marqu\u00e9\nles op\u00e9rations \u00e9lectorales dans deux...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019affaire des irr\u00e9gularit\u00e9s ayant marqu\u00e9 les op\u00e9rations \u00e9lectorales dans deux bureaux de vote de la circonscription de Tanger-Assilah conna\u00eet un nouveau d\u00e9veloppement. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection dans la ville de Tanger \u00e0 la suite des irr\u00e9gularit\u00e9s ayant entach\u00e9 l\u2019op\u00e9ration \u00e9lectorale dans deux bureaux de vote, \u00e0 l\u2019occasion des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription \u00e9lectorale de Tanger-Assilah. [telquel.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9 du minist\u00e8re de l\u2019Int\u00e9rieur, \u00ab\u00e0 la suite des irr\u00e9gularit\u00e9s ayant entach\u00e9 le processus \u00e9lectoral dans deux bureaux de vote lors des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription de Tanger-Assilah, le minist\u00e8re a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour enqu\u00eater et \u00e9tablir les faits, en menant des investigations administratives n\u00e9cessaires et en examinant les donn\u00e9es relatives \u00e0 ces incidents\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour faire la lumi\u00e8re sur les irr\u00e9gularit\u00e9s relev\u00e9es dans deux bureaux de vote lors des l\u00e9gislatives du 23 septembre. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection dans la ville 0e9tention, le transport et la commercialisation de stup\u00e9fiants et. [telquel.ma]\n-------------------------------------------------\nDrogue \u00bb Un fonctionnaire de police en poste \u00e0 Rabat et sa s\u0153ur ont \u00e9t\u00e9 arr\u00eat\u00e9s, dimanche 27 septembre, par la brigade antigang relevant du service pr\u00e9fectoral de la police judiciaire de Rabat, en coordination \u00e9troite avec les services de la direction g\u00e9n\u00e9rale de la surveillance du territoire, apprend-on d\u2019une source judiciaire. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Selon des sources m\u00e9diatiques concordantes,\nMounir Laymouri, pr\u00e9sident du conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Selon des sources m\u00e9diatiques concordantes, Mounir Laymouri, pr\u00e9sident du conseil communal de Tanger et dirigeant du Parti authenticit\u00e9 et modernit\u00e9 (PAM), a \u00e9t\u00e9 interpell\u00e9 ce lundi matin d\u00e8s son arriv\u00e9e \u00e0 l\u2019a\u00e9roport de Tanger Ibn Battouta, en provenance de Malaga, en Espagne. [telquel.ma]\n-------------------------------------------------\nLe maire de Tanger et coordonnateur provincial du Parti authenticit\u00e9 et modernit\u00e9 (PAM), Mounir Laymouri, a \u00e9t\u00e9 plac\u00e9 en garde \u00e0 vue dans le cadre dune enqu\u00eate judiciaire sur des documents \u00e9lectoraux li\u00e9s au bureau de vote de l\u00e9cole Al-Qods dans la ville. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des m\u00e8res se sont rassembl\u00e9es\nsamedi devant le Parlement \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Des m\u00e8res se sont rassembl\u00e9es samedi devant le Parlement \u00e0 Rabat pour r\u00e9clamer la lib\u00e9ration de leurs fils, parfois mineurs, emprisonn\u00e9s     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
