---------------------------------------\nLa France a r\u00e9affirm\u00e9, vendredi 13 novembre 2026, son soutien \u00e0 la souverainet\u00e9 marocaine sur le Sahara occidental, \u00e0 l\u2019issue d\u2019un entretien \u00e0 Essaouira entre les ministres des Affaires \u00e9trang\u00e8res Nasser Bourita et Jean-No\u00ebl Barrot. [www.yabiladi.com]\n-------------------------------------------------\nLa France consid\u00e8re \u00e9galement le plan d\u2019autonomie propos\u00e9 par le Maroc en 2007 comme \u00ab la seule base \u00bb pour parvenir \u00e0 une solution politique juste, durable et n\u00e9goci\u00e9e. [www.lavieeco.com]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9 vendredi sa position sur le Sahara marocain, selon laquelle le pr\u00e9sent et l\u2019avenir du territoire s\u2019inscrivent dans le cadre de la souverainet\u00e9 marocaine. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre fran\u00e7ais de l\u2019Europe\net des Affaires \u00e9trang\u00e8res, Jean...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean No\u00ebl Barrot, a salu\u00e9, vendredi \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine en mati\u00e8re de coexistence et de dialogue au service de la paix. [fr.hespress.com]\n-------------------------------------------------\nLe ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, s\u2019est entretenu avec son homologue marocain, Nasser Bourita, ce vendredi 13 novembre \u00e0 Essaouira. [telquel.ma]\n-------------------------------------------------\nLe ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, a salu\u00e9 vendredi 13 novembre 2026, \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine de coexistence et de dialogue, qu\u2019il a pr\u00e9sent\u00e9e comme un appui \u00e0 la paix. [www.yabiladi.com]\n-------------------------------------------------\nIntervenant ce vendredi au Forum mondial des femmes pour la paix \u00e0 Essaouira, le ministre des Affaires \u00e9trang\u00e8res, Nasser Bourita, a r\u00e9affirm\u00e9 l\u2019engagement du Maroc en faveur d\u2019une paix juste et durable. [www.lavieeco.com]\n-------------------------------------------------\nIl a pris part aux travaux de cette rencontre internationale, organis\u00e9e autour du rapprochement entre diplomatie et soci\u00e9t\u00e9 civile pour construire la paix. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les travaux de gros \u0153uvre\ndevraient \u00eatre achev\u00e9s \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "Les travaux de gros \u0153uvre devraient \u00eatre achev\u00e9s \u00e0 la fin du mois en cours, tandis que l\u2019ach\u00e8vement de l\u2019ensemble des travaux de la premi\u00e8re phase, qui comprend \u00e9galement les. [lematin.ma]\n-------------------------------------------------\nL\u2019ensemble de la premi\u00e8re phase de cette mise \u00e0 niveau de l\u0027infrastructure sportive, qui comprend aussi les lots techniques et la couverture de la partie ouest, est attendu vers fin mars 2027. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La protection du pouvoir d\u2019achat\ndes citoyens figure parmi les...", "mass": 5, "physics": false, "shape": "box", "title": "La protection du pouvoir d\u2019achat des citoyens figure parmi les principales priorit\u00e9s du gouvernement. [lematin.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [telquel.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat demeure une priorit\u00e9 du gouvernement, a r\u00e9affirm\u00e9 jeudi la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, lors du Conseil de gouvernement. [leseco.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [www.lereporter.ma]\n-------------------------------------------------\nLe gouvernement a annonc\u00e9 une s\u00e9rie de mesures destin\u00e9es \u00e0 limiter les effets de la hausse des prix sur le pouvoir d\u2019achat des m\u00e9nages. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0\nl\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies sur les vetos russe et am\u00e9ricain du 30 octobre pour mettre fin \u00e0 la mission de l\u2019ONU au Sahara (MINURSO), les pays du continent africain l\u2019ayant souhait\u00e9 en ont profit\u00e9 pour se prononcer sur le diff\u00e9rend du Sahara. [telquel.ma]\n-------------------------------------------------\nLa fin du mandat de la MINURSO n\u2019a pas clos le d\u00e9bat sur la place des Nations unies dans le r\u00e8glement du diff\u00e9rend r\u00e9gional autour du Sahara marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019alerte ayant entra\u00een\u00e9 le confinement\ndes \u00e9l\u00e8ves et du personn e Purchase Agreement \u2013 MOPA), visant \u00e0 g\u00e9n\u00e9rer jusqu\u2019\u00e0 8,89 millions de tonnes \u00e9quivalent CO\u2082 de r\u00e9ductions d\u2019\u00e9missions sur 10 ans. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, en marge de la COP31, un accord visant \u00e0 financer des projets solaires et \u00e9oliens au Maroc par le biais du march\u00e9 carbone. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, un accord destin\u00e9 \u00e0 mobiliser des financements carbone pour soutenir le d\u00e9veloppement des \u00e9nergies renouvelables dans le Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les recettes douani\u00e8res ont \u00e9t\u00e9\nde 90,8 milliards de dirhams...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes douani\u00e8res ont \u00e9t\u00e9 de 90,8 milliards de dirhams (MMDH) au terme des dix premiers mois de 2026, en am\u00e9lioration de 8,6% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les taxes int\u00e9rieures de consommation sur les tabacs manufactur\u00e9s et les autres produits, les recettes de la fiscalit\u00e9 douani\u00e8re avoisinent 108 milliards de dirhams, port\u00e9es notamment par la progression de la TVA \u00e0 l\u2019importation et des droits de douane. [www.lavieeco.com]\n-------------------------------------------------\nLes recettes douani\u00e8res ont atteint 90,8 milliards de dirhams \u00e0 fin octobre 2026, en progression de 8,6 % par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume (TGR). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Quatre lignes \u00e0 haute tension\ntouch\u00e9es, des quartiers plong\u00e9s dans...", "mass": 5, "physics": false, "shape": "box", "title": "Quatre lignes \u00e0 haute tension touch\u00e9es, des quartiers plong\u00e9s dans le noir pendant plusieurs heures le mercredi 11 novembre : \u00e0 Casablanca, la coupure d\u2019\u00e9lectricit\u00e9 du 11 novembre serait li\u00e9e aux intemp\u00e9ries provoqu\u00e9es par la temp\u00eate Charles. [telquel.ma]\n-------------------------------------------------\nLa coupure d\u2019\u00e9lectricit\u00e9 qui a touch\u00e9 plusieurs quartiers de Casablanca, mercredi 11 novembre, doit \u00eatre replac\u00e9e dans le contexte des conditions m\u00e9t\u00e9orologiques exceptionnelles ayant accompagn\u00e9 la temp\u00eate Charles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Casablanca Finance City Authority (CFCA),\nla Caisse de d\u00e9p\u00f4t et...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca Finance City Authority (CFCA), la Caisse de d\u00e9p\u00f4t et de gestion (CDG) et le Global Green Growth Institute (GGGI) ont sign\u00e9, au pavillon marocain de la COP31 \u00e0 Antalya, un accord destin\u00e9 \u00e0 financer des projets d\u2019\u00e9nergies renouvelables au Maroc gr\u00e2ce \u00e0 des fonds carbone norv\u00e9giens. [www.yabiladi.com]\n-------------------------------------------------\nLa Caisse de D\u00e9p\u00f4t et de Gestion (CDG), Casablanca Finance City Authority (CFCA) et le Global Green Growth Institute (GGGI) ont sign\u00e9, jeudi \u00e0 Antalya, un accord destin\u00e9 \u00e0 mobiliser des financements carbone norv\u00e9giens au profit de projets d\u2019\u00e9nergies renouvelables au Maroc. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Deux matchs du Championnat national\nprofessionnel de football f\u00e9minin de...", "mass": 5, "physics": false, "shape": "box", "title": "Deux matchs du Championnat national professionnel de football f\u00e9minin de premi\u00e8re division seront diffus\u00e9s chaque semaine sur les cha\u00eenes de la Soci\u00e9t\u00e9 nationale de radiodiffusion et de t\u00e9l\u00e9vision (SNRT), a indiqu\u00e9 le 13 novembre 2026 la Ligue nationale de football f\u00e9minin (LNFF). [www.yabiladi.com]\n-------------------------------------------------\nDeux rencontres du Championnat national professionnel de football f\u00e9minin (D1) seront retransmises chaque semaine sur les cha\u00eenes de la Soci\u00e9t\u00e9 nationale de radiodiffusion et de t\u00e9l\u00e9vision (SNRT). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Wafa Assurance a annonc\u00e9, le\n12 novembre 2026, avoir sign\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Wafa Assurance a annonc\u00e9, le 12 novembre 2026, avoir sign\u00e9 un accord avec le groupe Saham pour acqu\u00e9rir 99,98 % du capital de La Marocaine Vie. [www.yabiladi.com]\n-------------------------------------------------\nWafa Assurance a conclu un accord avec le groupe Saham pour acqu\u00e9rir 99,98 % du capital de La Marocaine Vie. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "L\u2019attaquant international marocain Hamza Igamane\npoursuit sa reprise avec le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019attaquant international marocain Hamza Igamane poursuit sa reprise avec le LOSC Lille pendant la tr\u00eave internationale de novembre, apr\u00e8s une grave blessure au genou subie lors de la finale de la CAN, le 18 janvier \u00e0 Rabat. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019attaquant international marocain Hamza Igamane, soci\u00e9taire du LOSC Lille, se trouve en phase de reprise de la comp\u00e9tition pendant la tr\u00eave internationale, indique le club nordiste sur son site web. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le gouvernement marocain et la\nBanque africaine de d\u00e9veloppement ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement marocain et la Banque africaine de d\u00e9veloppement ont sign\u00e9, vendredi 13 novembre 2026 \u00e0 Rabat, un accord de financement d\u2019un montant \u00e9quivalent \u00e0 434,4 millions d\u2019euros pour acc\u00e9l\u00e9rer la transformation structurelle de l\u2019\u00e9conomie marocaine et promouvoir une croissance plus dynamique, inclusive et r\u00e9siliente aux chocs exog\u00e8nes et climatiques. [aujourdhui.ma]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement ont conclu, ce vendredi 13 novembre \u00e0 Rabat, un accord de financement de 434,4 millions d\u2019euros. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Quelque 74.989 nouvelles entreprises ont\n\u00e9t\u00e9 immatricul\u00e9es au registre du...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 74.989 nouvelles entreprises ont \u00e9t\u00e9 immatricul\u00e9es au registre du commerce au Maroc durant les neuf premiers mois de 2026, selon les donn\u00e9es de l\u2019Office marocain de la propri\u00e9t\u00e9 industrielle et commerciale (OMPIC). [www.lavieeco.com]\n-------------------------------------------------\nAu terme des neuf premiers mois de l\u2019ann\u00e9e 2026, 74 989 nouvelles entreprises ont \u00e9t\u00e9 immatricul\u00e9es au registre du commerce au Maroc. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Situ\u00e9 sur la route d\u2019Azemmour\n\u00e0 Casablanca, ce nouvel espace...", "mass": 5, "physics": false, "shape": "box", "title": "Situ\u00e9 sur la route d\u2019Azemmour \u00e0 Casablanca, ce nouvel espace d\u00e9voile l\u2019univers architectural et esth\u00e9tique de la premi\u00e8re adresse r\u00e9sidentielle sign\u00e9e ELIE SAAB au Maroc [leseco.ma]\n-------------------------------------------------\nART OF LIVING et EKTAR ont inaugur\u00e9 le showroom du projet r\u00e9sidentiel ELIE SAAB Casablanca ART OF LIVING, situ\u00e9 sur la route d\u2019Azemmour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Banque Centrale Populaire (BCP)\net sa filiale Upline Securities...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9 l\u2019obtention de leurs agr\u00e9ments aupr\u00e8s des autorit\u00e9s comp\u00e9tentes, dans le cadre du lancement du march\u00e9 \u00e0 terme au Maroc. [leseco.ma]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9, jeudi 12 novembre, l\u2019obtention de leurs agr\u00e9ments dans le cadre de l\u2019ouverture du march\u00e9 \u00e0 terme au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Les mesures pr\u00e9vues par le\nprojet de loi de finances...", "mass": 5, "physics": false, "shape": "box", "title": "Les mesures pr\u00e9vues par le projet de loi de finances (PLF) au titre de l\u2019ann\u00e9e 2027 en faveur du soutien eeco.com]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
