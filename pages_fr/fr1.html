nseil d\u2019administration de la Banque Centrale Populaire (BCP), r\u00e9uni le 17 d\u00e9cembre 2025 sous la pr\u00e9sidence de Mme Naziha Belkeziz, a proc\u00e9d\u00e9 \u00e0 la nomination de M. Adil Rzal en tant que directeur g\u00e9n\u00e9ral en charge des risques groupe. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Ryanair annonce l\u2019ouverture d\u2019une nouvelle\nbase \u00e0 Rabat \u00e0 partir...", "mass": 5, "physics": false, "shape": "box", "title": "Ryanair annonce l\u2019ouverture d\u2019une nouvelle base \u00e0 Rabat \u00e0 partir d\u2019avril 2026, sa cinqui\u00e8me au Maroc, avec 2 avions bas\u00e9s, 20 lignes op\u00e9r\u00e9es et un investissement de 200 millions de. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne Ryanair, en partenariat avec l\u2019Office National Marocain du Tourisme (ONMT), a annonc\u00e9, mercredi \u00e0 l\u2019A\u00e9roport Rabat-Sal\u00e9, l\u2019ouverture d\u2019une nouvelle base \u00e0 Rabat \u00e0 partir d\u2019avril 2026, sa cinqui\u00e8me au Maroc, avec 2 avions bas\u00e9s, 20 lignes op\u00e9r\u00e9es et un investissement de 200 millions de dollars (2 milliards de dirhams). [telquel.ma]\n-------------------------------------------------\nRyanair a annonc\u00e9 l\u2019ouverture de sa cinqui\u00e8me base au Maroc, avec un investissement de 200 millions d\u2019euros et le d\u00e9ploiement de deux avions, pour desservir sept nouvelles destinations europ\u00e9ennes d\u00e8s avril 2026. [atlasinfo.fr]\n-------------------------------------------------\nLa compagnie a\u00e9rienne Ryanair, en partenariat avec l\u2019Office National Marocain du Tourisme (ONMT), a annonc\u00e9, mercredi \u00e0 l\u2019A\u00e9roport Rabat-Sal\u00e9, l\u2019ouverture d\u2019une nouvelle base \u00e0 Rabat \u00e0 partir d\u2019avril 2026, sa cinqui\u00e8me au Maroc, avec 2 avions bas\u00e9s, 20 lignes op\u00e9r\u00e9es et un investissement de 200 millions de dollars (M$). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Sothema a annonc\u00e9 le closing\nde l\u2019op\u00e9ration relative \u00e0 l\u2019acquisition...", "mass": 5, "physics": false, "shape": "box", "title": "Sothema a annonc\u00e9 le closing de l\u2019op\u00e9ration relative \u00e0 l\u2019acquisition de 99,99 % du capital de la soci\u00e9t\u00e9 Soludia Maghreb (\u00ab Soludia \u00bb), un acteur de r\u00e9f\u00e9rence dans le domaine de l\u2019. [lematin.ma]\n-------------------------------------------------\nSothema a annonc\u00e9 le 17 d\u00e9cembre 2025 \u00ab le closing de l\u2019op\u00e9ration portant sur l\u2019acquisition de 99,99% du capital de la soci\u00e9t\u00e9 Soludia Maghreb (\u00ab Soludia \u00bb) \u00bb, selon un communiqu\u00e9 de presse. [telquel.ma]\n-------------------------------------------------\nLe groupe pharmaceutique Sothema a finalis\u00e9 l\u2019acquisition de 99,99 % du capital de Soludia Maghreb, acteur majeur de l\u2019h\u00e9modialyse au Maroc, consolidant ainsi sa position sur le march\u00e9 marocain et en Afrique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Orange Maroc a annonc\u00e9, ce\nmardi, l\u2019atterrissement du c\u00e2ble sous-marin...", "mass": 5, "physics": false, "shape": "box", "title": "Orange Maroc a annonc\u00e9, ce mardi, l\u2019atterrissement du c\u00e2ble sous-marin d\u0027interconnexion Medusa sur les c\u00f4tes marocaines \u00e0 Nador, parall\u00e8lement \u00e0 l\u2019inauguration de sa \u00ab Cable La. [lematin.ma]\n-------------------------------------------------\nOrange Maroc renforce la connectivit\u00e9 du Royaume avec l\u2019atterrissement du c\u00e2ble sous-marin Medusa \u00e0 Nador et l\u2019ouverture de la premi\u00e8re Cable Landing Station open access du pays, un projet strat\u00e9gique pour la souverainet\u00e9 num\u00e9rique et le positionnement du Maroc comme hub digital africain. [www.lavieeco.com]\n-------------------------------------------------\nOrange Maroc a inaugur\u00e9, lundi \u00e0 Arekmane dans la province de Nador, son infrastructure strat\u00e9gique \u201cCable Landing Station\u201d, afin de permettre le raccordement du Maroc au c\u00e2ble sous-marin Medusa, le plus long de la M\u00e9diterran\u00e9e. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Conform\u00e9ment aux dispositions des Statuts\net du R\u00e8glement Int\u00e9rieur de...", "mass": 5, "physics": false, "shape": "box", "title": "Conform\u00e9ment aux dispositions des Statuts et du R\u00e8glement Int\u00e9rieur de la CGEM, et en application de la d\u00e9cision du Conseil d\u2019Administration du 15 septembre 2025, cette Assembl\u00e9e G. [lematin.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Marocaine des Entreprises de Services de Sant\u00e9 (FMAESS) a tenu sa premi\u00e8re Assembl\u00e9e G\u00e9n\u00e9rale \u00c9lective (AGE), mardi 16 d\u00e9cembre 2025 \u00e0 15h, au si\u00e8ge de la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "\u200bLe renforcement de la coop\u00e9ration\nentre le Maroc et la...", "mass": 5, "physics": false, "shape": "box", "title": "\u200bLe renforcement de la coop\u00e9ration entre le Maroc et la Mauritanie en mati\u00e8re de d\u00e9centralisation et d\u2019am\u00e9nagement du territoire a \u00e9t\u00e9 au centre de r\u00e9unions de travail tenues, r\u00e9cemment \u00e0 Nouakchott, par une d\u00e9l\u00e9gation marocaine, avec des repr\u00e9sentants du gouvernement maur  offrir aux voyageurs une connectivit\u00e9 renforc\u00e9e, des avantages de voyage \u00e9largis et une exp\u00e9rience fluide \u00e0 travers les vols des deux transporteurs en Afrique, en Europe et en Asie. [leseco.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) et Malaysia Airlines ont sign\u00e9, r\u00e9cemment, une convention de partage de codes (code share), visant \u00e0 offrir aux voyageurs une connectivit\u00e9 renforc\u00e9e, des avantages de voyage \u00e9largis et une exp\u00e9rience fluide \u00e0 travers les vols des deux transporteurs en Afrique, en Europe et en Asie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Conclu dans le cadre du\nprogramme GEFF Plus, cet accord...", "mass": 5, "physics": false, "shape": "box", "title": "Conclu dans le cadre du programme GEFF Plus, cet accord vise \u00e0 soutenir les entreprises marocaines dans la mise en \u0153uvre de projets de transition \u00e9nerg\u00e9tique, indique un communiqu\u00e9 de presse de la banque. [www.lopinion.ma]\n-------------------------------------------------\nCr\u00e9dit du Maroc a annonc\u00e9 la signature d\u2019un partenariat strat\u00e9gique avec la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD), dans le cadre du programme GEFF Plus, visant \u00e0 accompagner les entreprises marocaines dans leurs projets de transition \u00e9nerg\u00e9tique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Bank Al-Maghrib (BAM) pr\u00e9voit de\nlancer, en 2026, une phase...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) pr\u00e9voit de lancer, en 2026, une phase pilote du ciblage d\u0027inflation, dans le cadre d\u0027une transition graduelle et prudente vers un r\u00e9gime de change plus flexible, a annonc\u00e9, mardi \u00e0 Rabat, le Wali de BAM, Abdellatif Jouahri. [www.lopinion.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) pr\u00e9voit de lancer, en 2026, une phase pilote du ciblage d\u2019inflation, dans le cadre d\u2019une transition graduelle et prudente vers un r\u00e9gime de change plus flexible, a annonc\u00e9, mardi \u00e0 Rabat, le Wali de BAM, Abdellatif Jouahri. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les d\u00e9p\u00f4ts aupr\u00e8s des banques\nse sont \u00e9tablis \u00e0 1.299...", "mass": 5, "physics": false, "shape": "box", "title": "Les d\u00e9p\u00f4ts aupr\u00e8s des banques se sont \u00e9tablis \u00e0 1.299 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en progression annuelle de 7,1%, selon le r\u00e9cent tableau de bord \u00ab Cr\u00e9dits-D\u00e9p\u00f4ts bancaires \u00bb de Bank Al-Maghrib (BAM). [telquel.ma]\n-------------------------------------------------\nCe volume repr\u00e9sente une hausse de 19% en glissement annuel et de 15,2% par rapport \u00e0 fin d\u00e9cembre 2024, pr\u00e9cise Bank Al-Maghrib dans son r\u00e9cent tableau de bord \"Cr\u00e9dits-D\u00e9p\u00f4ts bancaires\". [www.lavieeco.com]\n-------------------------------------------------\nLes d\u00e9p\u00f4ts aupr\u00e8s des banques se sont \u00e9tablis \u00e0 1.299 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en progression annuelle de 7,1%, selon le r\u00e9cent tableau de bord \u00ab Cr\u00e9dits-D\u00e9p\u00f4ts bancaires \u00bb de Bank Al-Maghrib (BAM). [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019encours du cr\u00e9dit bancaire s\u2019est \u00e9tabli \u00e0 1.188,2 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, enregistrant une hausse de 6% par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le Parti du progr\u00e8s et\ndu socialisme (PPS) a appel\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parti du progr\u00e8s et du socialisme (PPS) a appel\u00e9 le gouvernement \u00e0 tirer les enseignements des r\u00e9cents \u00e9v\u00e9nements catastrophiques, en mettant l\u2019accent sur la pr\u00e9vention des risques et la r\u00e9duction des d\u00e9g\u00e2ts li\u00e9s aux catastrophes naturelles. [telquel.ma]\n-------------------------------------------------\nPour y parvenir, il est imp\u00e9ratif de faire appliquer rigoureusement les lois et dassurer un contr\u00f4le strict, notamment en mati\u00e8re de r\u00e9glementation de la construction et de lurbanisme, tout en luttant contre la corruption. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Quinze ans apr\u00e8s son inscription\ndans la Constitution, le m\u00e9canisme...", "mass": 5, "physics": false, "shape": "box", "title": "Quinze ans apr\u00e8s son inscription dans la Constitution, le m\u00e9canisme de l\u2019exception d\u2019inconstitutionnalit\u00e9 est enfin remis sur la table du l\u00e9gislateur. [telquel.ma]\n-------------------------------------------------\nEn adoptant \u00e0 l\u2019unanimit\u00e9 trois projets de loi relatifs aux \u0153uvres sociales des magistrats, du pouvoir judiciaire et de l\u2019Administration p\u00e9nitentiaire, la Chambre des repr\u00e9sentants ent\u00e9rine une nouvelle \u00e9tape dans la recomposition institutionnelle de la justice. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du\nBduget, Fouzi Lekjaa, et la...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
