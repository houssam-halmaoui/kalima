3, "label": "S\u00e9curit\u00e9 sportive : Abdellatif Hammouchi...", "shape": "dot", "size": 47, "title": "S\u00e9curit\u00e9 sportive : Abdellatif Hammouchi lance un nouveau protocole anti-hooliganisme\nSource: lnt.ma", "url": "https://lnt.ma/securite-sportive-abdellatif-hammouchi-lance-un-nouveau-protocole-anti-hooliganisme/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Cinq ans apr\u00e8s une rupture\nqui avait profond\u00e9ment fragilis\u00e9 le...", "mass": 5, "physics": false, "shape": "box", "title": "Cinq ans apr\u00e8s une rupture qui avait profond\u00e9ment fragilis\u00e9 le projet d\u2019unification de la gauche marocaine, deux de ses principales composantes ont annonc\u00e9, mercredi \u00e0 Casablanca, la cr\u00e9ation de l\u2019\u00ab Alliance de la gauche \u00bb. [fr.hespress.com]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration de la gauche d\u00e9mocratique (FGD) et le Parti socialiste unifi\u00e9 (PSU) ont annonc\u00e9, lors d\u2019une conf\u00e9rence de presse organis\u00e9e ce mercredi \u00e0 Casablanca, la cr\u00e9ation d\u2019une alliance politique strat\u00e9gique baptis\u00e9e \u201cAlliance de la gauche\u201d. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le directeur g\u00e9n\u00e9ral de la\nS\u00fbret\u00e9 nationale et de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, a pr\u00e9sid\u00e9, ce mercredi, une r\u00e9union de travail, consacr\u00e9e \u00e0 la lutte contre le hooliganisme et les violences dans les stades au Maroc. [fr.hespress.com]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, a pr\u00e9sid\u00e9 une r\u00e9union de travail au nouveau si\u00e8ge de la DGSN \u00e0 Rabat, ce mercredi 3 juin. [telquel.ma]\n-------------------------------------------------\nEt cette fois, l\u2019objectif est clair : Pr\u00e9venir le hooliganisme avant qu\u2019il ne devienne une menace majeure pour les grands \u00e9v\u00e9nements sportifs \u00e0 venir. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Sign\u00e9e au nouveau si\u00e8ge de\nla DGSN par la ministre...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9e au nouveau si\u00e8ge de la DGSN par la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u0027Administration, Amal El Fallah Seghrouchni, et le Directeur. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019Administration et la Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) ont sign\u00e9, mercredi \u00e0 Rabat, une convention-cadre pour appuyer le partenariat institutionnel visant \u00e0 d\u00e9velopper les programmes d\u2019accueil des usagers des services de la S\u00fbret\u00e9 nationale, aux niveaux central et r\u00e9gional. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Plus de 300 chercheurs, experts,\ndoctorants et leaders industriels issus...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 300 chercheurs, experts, doctorants et leaders industriels issus de plus de 35 pays se sont r\u00e9unis mercredi \u00e0 Marrakech, \u00e0 l\u2019occasion de la 25\u00e8 \u00e9dition de la Conf\u00e9rence mondiale de l\u2019association des universit\u00e9s du textile (AUTEX), pour \u00e9changer autour des ruptures technologiques et dessiner les tendances futures de la fili\u00e8re du textile. [telquel.ma]\n-------------------------------------------------\nR\u00e9unissant plus de 300 chercheurs, experts et industriels venus de plus de 35 pays, la 25\u1d49 Conf\u00e9rence mondiale de l\u2019Association des universit\u00e9s du textile (AUTEX) s\u2019est ouverte \u00e0 Marrakech. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Tamwilcom a lanc\u00e9, mercredi \u00e0\nSal\u00e9, son nouveau plan strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Tamwilcom a lanc\u00e9, mercredi \u00e0 Sal\u00e9, son nouveau plan strat\u00e9gique 2026-2030, baptis\u00e9 \u00ab Jossour 2030 \u00bb, qui pr\u00e9voit la mobilisation de 300 milliards de dirhams (MMDH) de financements, pour un volume d\u2019engagements de 170 MMDH. [telquel.ma]\n-------------------------------------------------\nTamwilcom a lanc\u00e9, ce mercredi \u00e0 Sal\u00e9, son nouveau plan strat\u00e9gique 2026-2030, baptis\u00e9 \"Jossour 2030\", qui pr\u00e9voit la mobilisation de 300 milliards de dirhams (MMDH) de financements, pour un volume d\u0027engagements de 170 MMDH. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le chef du gouvernement, Aziz\nAkhannouch a repr\u00e9sent\u00e9 le roi...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 le roi Mohammed VI, mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar Morin, disparu le 29 mai dernier. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar [www.challenge.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 le roi Mohammed VI, mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar Morin, disparu le 29 mai dernier. [www.yabiladi.com]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 le Roi Mohammed VI, ce mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar Morin, disparu le 29 mai dernier. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La minist\u00e8re de l\u2019\u00c9ducation nationale,\ndu Pr\u00e9scolaire et des Sports...", "mass": 5, "physics": false, "shape": "box", "title": "La minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 la mise \u00e0 disposition de billets d\u2019avion gratuits aller-retour au profit des \u00e9l\u00e8ves des classes pr\u00e9paratoires aux grandes \u00e9coles ayant r\u00e9ussi les \u00e9preuves \u00e9crites des concours fran\u00e7ais et appel\u00e9s \u00e0 passer les \u00e9preuves orales en France au titre de l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports a annonc\u00e9 la prise en charge de billets d\u2019avion au profit des candidats marocains admissibles aux \u00e9preuves orales des grandes \u00e9coles fran\u00e7aises d\u2019ing\u00e9nierie et de commerce, au titre de la session 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label"
