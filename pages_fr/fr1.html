a\nfix\u00e9 les jeudi 22 octobre...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a fix\u00e9 les jeudi 22 octobre et vendredi 23 octobre 2026 deux rendez-vous consacr\u00e9s au programme gouvernemental et \u00e0 la pr\u00e9sentation du projet de loi de finances (PLF) pour l\u2019ann\u00e9e budg\u00e9taire 2027. [fr.hespress.com]\n-------------------------------------------------\nLa premi\u00e8re s\u00e9ance pr\u00e9vue \u00e0 partir de 10H00, sera consacr\u00e9e \u00e0 la discussion du Programme gouvernemental, indique un communiqu\u00e9 de la Chambre des Repr\u00e9sentants, ajoutant qu\u2019une deuxi\u00e8me s\u00e9ance (18H00) sera d\u00e9di\u00e9e \u00e0 la r\u00e9ponse de la. [telquel.ma]\n-------------------------------------------------\nLe projet de loi de finances 2027 a \u00e9t\u00e9 d\u00e9pos\u00e9 ce mardi 20 octobre au bureau de la Chambre des repr\u00e9sentants, conform\u00e9ment \u00e0 l\u2019\u00e9ch\u00e9ance pr\u00e9vue par la loi organique relative \u00e0 la loi de finances. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Nabil Massali occupait auparavant les\nfonctions de directeur de l\u2019Aviation...", "mass": 5, "physics": false, "shape": "box", "title": "Nabil Massali occupait auparavant les fonctions de directeur de l\u2019Aviation Civile au sein du minist\u00e8re du Transport et de la Logistique, un poste hautement strat\u00e9gique au regard de. [lematin.ma]\n-------------------------------------------------\nNabil Massali occupait auparavant les fonctions de directeur de l\u2019aviation civile au sein du minist\u00e8re du Transport et de la Logistique, \u00ab un poste hautement strat\u00e9gique au regard des enjeux de. [telquel.ma]\n-------------------------------------------------\nAncien directeur de l\u0027Aviation civile au minist\u00e8re du Transport et de la Logistique, il aura pour mission de renforcer la performance du p\u00f4le et d\u0027accompagner son \u00e9volution selon les standards internationaux. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Oscillant entre 30 et 40\nmm, ces averses sont pr\u00e9vues,...", "mass": 5, "physics": false, "shape": "box", "title": "Oscillant entre 30 et 40 mm, ces averses sont pr\u00e9vues, de 8h00 jusqu\u0027\u00e0 23h, dans les provinces de Tan-Tan, Tarfaya, Es-Semara, La\u00e2youne, Aousserd, Oued Ed-Dahab et Boujdour, a. [lematin.ma]\n-------------------------------------------------\nOscillant entre 30 et 40 mm, ces averses sont pr\u00e9vues, de 8h00 jusqu\u2019\u00e0 23h, dans les provinces de Tan-Tan, Tarfaya, Es-Semara, Laayoune, Aousserd, Oued Ed-Dahab et Boujdour, . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Sacr\u00e9s champions d\u2019Afrique en 2016,\n2020 et 2024, les Lions...", "mass": 5, "physics": false, "shape": "box", "title": "Sacr\u00e9s champions d\u2019Afrique en 2016, 2020 et 2024, les Lions de l\u2019Atlas de futsal tenteront de d\u00e9crocher une quatri\u00e8me Coupe d\u0027Afrique des Nations cons\u00e9cutive face \u00e0 l\u0027Angol. [lematin.ma]\n-------------------------------------------------\nLe Maroc a termin\u00e9 en t\u00eate du groupe A de la Coupe d\u2019Afrique des nations de futsal avec trois victoires en autant de rencontres, sans encaisser de but, et s\u2019est qualifi\u00e9 pour les demi-finales. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Bank of Africa \u00e9largit ses\nservices digitaux destin\u00e9s aux entreprises...", "mass": 5, "physics": false, "shape": "box", "title": "Bank of Africa \u00e9largit ses services digitaux destin\u00e9s aux entrepris b refuse de consid\u00e9rer la privation de la vie comme un instrument pour rendre justice \u00bb. [telquel.ma]\n-------------------------------------------------\nLa pr\u00e9sidente du Conseil national des droits de l\u2019Homme (CNDH), Amina Bouayach, a soulign\u00e9, mardi \u00e0 Rabat, la n\u00e9cessit\u00e9 d\u2019humaniser le d\u00e9bat sur la peine de mort, estimant que cette approche \u00ab refuse de consid\u00e9rer la privation de la vie comme un instrument pour rendre justice \u00bb. [www.lereporter.ma]\n-------------------------------------------------\nLa pr\u00e9sidente du Conseil national des droits de l\u2019Homme, Amina Bouayach, a appel\u00e9 mardi \u00e0 Rabat le gouvernement et le Parlement \u00e0 faire de l\u2019abolition de la peine de mort une priorit\u00e9 l\u00e9gislative et \u00e0 adopter les textes qui la retireraient du syst\u00e8me p\u00e9nal. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Conseil de gouvernement, r\u00e9uni\nmardi \u00e0 Rabat sous la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni mardi \u00e0 Rabat sous la pr\u00e9sidence de la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a examin\u00e9 et adopt\u00e9 le Projet de Loi de Finances n\u00b0 60.26 pour l\u2019ann\u00e9e budg\u00e9taire 2027. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni mardi \u00e0 Rabat sous la pr\u00e9sidence de la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a adopt\u00e9 le Projet de Loi de Finances n\u00b060.26 pour l\u2019ann\u00e9e budg\u00e9taire 2027. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni mardi \u00e0 Rabat sous la pr\u00e9sidence de la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a examin\u00e9 et adopt\u00e9 le Projet de Loi de Finances n\u00b0 60.26 pour l\u2019ann\u00e9e budg\u00e9taire 2027. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Escroquerie Deux jeunes hommes, \u00e2g\u00e9s\nde vingt-trois et vingt-huit ans,...", "mass": 5, "physics": false, "shape": "box", "title": "Escroquerie Deux jeunes hommes, \u00e2g\u00e9s de vingt-trois et vingt-huit ans, ont \u00e9t\u00e9 arr\u00eat\u00e9s, samedi 17 octobre, \u00e0 Casablanca par la brigade de police judiciaire du district de la s\u00fbret\u00e9 d\u2019A\u00efn Seba\u00e2-Hay Mohammadi, apprend-on d\u2019une source judiciaire. [aujourdhui.ma]\n-------------------------------------------------\nLa police judiciaire de la zone de s\u00fbret\u00e9 d\u2019A\u00efn Seba\u00e2-Hay Mohammadi a interpell\u00e9 le samedi 17 octobre \u00e0 Casablanca deux hommes de 23 et 28 ans, soup\u00e7onn\u00e9s de piratage des r\u00e9seaux de t\u00e9l\u00e9communications et d\u2019escroquerie par faux messages d\u2019amendes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le M-Automotiv NOUR Rallye Raid\nrevient du 27 au 31...", "mass": 5, "physics": false, "shape": "box", "title": "Le M-Automotiv NOUR Rallye Raid revient du 27 au 31 octobre 2026 pour une 4\u1d49 \u00e9dition qui marque une nouvelle \u00e9tape dans le d\u00e9veloppement de cette aventure automobile 100 % f\u00e9minine. [www.lavieeco.com]\n-------------------------------------------------\nPlus de 30 \u00e9quipages f\u00e9minins attendus entre Erfoud et Merzouga pour une \u00e9dition qui s\u2019ouvre aux motos et buggys et renforce son engagement solidaire avec l\u2019association NOUR POUR ELLE. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019Agence marocaine de d\u00e9veloppement des\ninvestissements et     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
