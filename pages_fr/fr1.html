urces du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant. [fr.hespress.com]\n-------------------------------------------------\nLes recettes douani\u00e8res nettes se sont \u00e9tablies \u00e0 plus de 83,5 milliards de dirhams (MMDH) au terme des dix premiers mois de 2025, en hausse de 9,5% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [www.lopinion.ma]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nCes \u00e9missions ont repr\u00e9sent\u00e9 un taux de r\u00e9alisation de 58% du total pr\u00e9vu par la loi de finances 2025, pr\u00e9cise la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume dans son r\u00e9cent bulletin mensuel de statistiques des finances publiques (BMSFP). [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit budg\u00e9taire du Maroc a atteint 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre 40,5 MMDH \u00e0 la m\u00eame p\u00e9riode de 2024, selon les donn\u00e9es publi\u00e9es par la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR) dans son dernier Bulletin mensuel de statistiques des finances publiques (BMSFP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00ab La Fondation Trois Cultures\na acc\u00e9d\u00e9 aujourd\u2019hui au Club...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab La Fondation Trois Cultures a acc\u00e9d\u00e9 aujourd\u2019hui au ----------\nCes deux liaisons sont assur\u00e9es par Transavia France, pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanches. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9\ndepuis un an en Alg\u00e9rie...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9 depuis un an en Alg\u00e9rie et au c\u0153ur d\u2019une crise diplomatique entre Alger et Paris, va b\u00e9n\u00e9ficier d\u2019une gr\u00e2ce pr\u00e9sidentielle, a annonc\u00e9 mercredi 12 novembre la pr\u00e9sidence alg\u00e9rienne. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a accept\u00e9 une demande de l\u2019Allemagne de gracier et transf\u00e9rer l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, emprisonn\u00e9 depuis un an, dans ce pays pour qu\u2019il puisse y \u00eatre soign\u00e9, a indiqu\u00e9 un communiqu\u00e9 de la pr\u00e9sidence alg\u00e9rienne mercredi. [telquel.ma]\n-------------------------------------------------\nCe mercredi, le pr\u00e9sident alg\u00e9rien Abdelmadjid Tebboune a accord\u00e9 une gr\u00e2ce \u00e0 l\u00e9crivain Boualem Sansal, d\u00e9tenu depuis le 16 novembre 2024 et condamn\u00e9 en mars dernier \u00e0 cinq ans de prison pour \u00abatteinte \u00e0 lunit\u00e9 nationale\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nAtteint d\u0027un cancer, le romancier et essayiste avait \u00e9t\u00e9 arr\u00eat\u00e9 le 16 novembre 2024, avant d\u0027\u00eatre condamn\u00e9 en appel en juillet \u00e0 cinq ans de r\u00e9clusion. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a annonc\u00e9 ce mercredi 12 novembre 2025 avoir \u00abaccept\u00e9\u00bb de gracier l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, \u00e2g\u00e9 de 80 ans, d\u00e9tenu depuis pr\u00e8s d\u2019un an. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "\u200bL\u2019exp\u00e9rience marocaine dans la gestion\ndes ressources hydriques, \u00e0 travers...", "mass": 5, "physics": false, "shape": "box", "title": "\u200bL\u2019exp\u00e9rience marocaine dans la gestion des ressources hydriques, \u00e0 travers des projets de r\u00e9utilisation des eaux us\u00e9es trait\u00e9es, port\u00e9s par les collectivit\u00e9s territoriales, a \u00e9t\u00e9 mise en avant mardi lors de la COP30 \u00e0 Bel\u00e9m, en Amazonie br\u00e9silienne. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019exp\u00e9rience marocaine dans la gestion des ressources hydriques, \u00e0 travers des projets de r\u00e9utilisation des eaux us\u00e9es trait\u00e9es, port\u00e9s par les collectivit\u00e9s territoriales, a \u00e9t\u00e9 mise en avant mardi lors de la COP30 \u00e0 Bel\u00e9m, en Amazonie br\u00e9silienne. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le pr\u00e9sident fran\u00e7ais, Emmanuel Macron\na annonc\u00e9 avoir convenu avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident fran\u00e7ais, Emmanuel Macron a annonc\u00e9 avoir convenu avec son homologue palestinien Mahmoud Abbas de mettre en place un comit\u00e9 conjoint pour \u00ab la consolidation de l\u0027\u00c9tat de Palestine \u00bb. [www.lopinion.ma]\n-------------------------------------------------\nLe pr\u00e9sident fran\u00e7ais Emmanuel Macron a annonc\u00e9 mardi la cr\u00e9ation d\u0027un \"comit\u00e9 conjoint pour la consolidation de l\u0027Etat de Palestine\", \u00e0 l\u0027issue de sa rencontre avec le pr\u00e9sident pal sion de formation approfondie sur la production de drones SPY-X. [telquel.ma]\n-------------------------------------------------\nAvant l\u2019inauguration de son unit\u00e9 de production des drones SPY-X \u00e0 Benslimane, une \u00e9quipe marocaine a b\u00e9n\u00e9fici\u00e9 d\u2019une formation d\u00e9di\u00e9e au transfert de technologie. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nAu total, 350 amendements ont \u00e9t\u00e9 pr\u00e9sent\u00e9s au cours de cette s\u00e9ance tenue en pr\u00e9sence du ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa, dont 325 \u00e9manant de l\u2019opposition, 23 de la majorit\u00e9 et deux amendements introduits par l\u2019Ex\u00e9cutif. [aujourdhui.ma]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [atlasinfo.fr]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique de la Chambre des repr\u00e9sentants a approuv\u00e9, mercredi t\u00f4t dans la matin\u00e9e, la premi\u00e8re partie du projet de loi de finances (PLF) pour l\u2019ann\u00e9e 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "L\u2019\u00e9quipe nationale du Maroc des\nmoins de 17 ans affrontera...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale du Maroc des moins de 17 ans affrontera les Etats-Unis, vendredi \u00e0 l\u2019Aspire Zone \u00e0 Doha au Qatar, pour le compte des 16es de finale de la Coupe du monde de la cat\u00e9gorie, \u00e0 l\u2019issue des derniers matchs de la phase de poules disput\u00e9s mardi. [telquel.ma]\n-------------------------------------------------\nLes Lionceaux de l\u2019Atlas entament la phase \u00e0 \u00e9limination directe du Mondial U17 avec un duel d\u00e9cisif face aux \u00c9tats-Unis, ce vendredi \u00e0 16 h 45 sur la pelouse de l\u2019Aspire Zone Pitc. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Les quatorze ports marocains ouverts\nau commerce international assurent 95%...", "mass": 5, "physics": false, "shape": "box", "title": "Les quatorze ports marocains ouverts au commerce international assurent 95% de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a soulign\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a mis en avant, mardi \u00e0 Rabat, le r\u00f4le strat\u00e9gique des ports marocains dans le commerce ext\u00e9rieur, soulignant que les 14 ports ouverts au commerce international assurent \u00e0 eux seuls 95% des \u00e9changes du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLes quatorze ports marocains ouverts au commerce international assurent 95 % de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de\nl\u2019Insertion sociale, Abdeljebbar Rachidi, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques en 2025, dans le cadre du Projet de l\u2019\u00e9ducation inclusive. [telquel.ma]\n-------------------------------------------------\nLe Secr\u00e9taire d\u0027\u00c9tat charg\u00e9 de l\u0027Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques en 2025 dans le cadre du Projet de l\u0027\u00e9ducation inclusive. [atlasinfo.fr]\n-------------------------------------------------\nLe secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Inclusion sociale, Abdeljabbar Rachidi, a annonc\u00e9 ce mardi, lors de son intervention \u00e0 la Chambre des conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques au cours de l\u2019ann\u00e9e 2025, dans le cadre du projet d\u2019\u00e9ducation inclusive. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "L\u2019Organisation des Nations Unies pour\nl\u2019\u00e9ducation, la science et la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Organisation des Nations Unies pour l\u2019\u00e9ducation, la science et la culture (UNESCO) et la Fondation Maroc 2030 ont sign\u00e9, mardi \u00e0 Rabat, un accord de partenariat \u00e9tablissant un cadre de coop\u00e9ration (2025-2030), visant \u00e0 faire du sport un levier d\u2019\u00e9ducation, d\u2019inclusion et de coh\u00e9sion sociale. [telquel.ma]\n-------------------------------------------------\n\u00c0 moins de deux mois de la CAN 2025, l\u2019UNESCO et la Fondation Maroc 2030 scellent un partenariat in\u00e9dit pour faire du sport un outil d\u2019\u00e9ducation, d\u2019\u00e9galit\u00e9 et de d\u00e9veloppement durable. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Sous la direction artistique de\nYasmine Bennani, la galerie Inspiration...", "mass": 5, "physics": false, "shape": "box", "title": "Sous la direction artistique de Yasmine Bennani, la galerie Inspiration Design BY en collaboration avec Artelys Maroc, signe un manifeste po\u00e9tique du design avec l\u2019exposition \u00ab Design with Soul \u00bb \u2013 H\u00e9ritage et Innovation \u00bb \u00e0 Casablanca le 11 novembre 2025, une exp\u00e9rience o\u00f9 la m\u00e9moire des gestes, la noblesse des mati\u00e8res et la force . [aujourdhui.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9e \u00e0 la Galerie Inspiration Design BY, en partenariat avec Artelys, la sc\u00e9nographie immersive \u00ab Design with Soul : H\u00e9ritage et Innovation \u00bb a c\u00e9l\u00e9br\u00e9, le 11 novembre \u00e0 Casablanca, la rencontre entre tradition et modernit\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Dans le cadre de sa\nstrat\u00e9gie de digitalisation, l\u2019Office des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de sa strat\u00e9gie de digitalisation, l\u2019Office des Changes a int\u00e9gr\u00e9 la solution nationale d\u2019identification num\u00e9rique (E-ID), d\u00e9velopp\u00e9e par la DGSN, \u00e0 son application mobile \u201cOC CONNECT\u201d. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Office des Changes a annonc\u00e9 l\u2019int\u00e9gration de la solution nationale d\u2019identification num\u00e9rique (E-ID), d\u00e9velopp\u00e9e par la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN), \u00e0 son application mobile \u00ab OC CONNECT \u00bb, dans le cadre de la poursuite de sa strat\u00e9gie de digitalisation et de modernisation de ses services. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 fin octobre 2025, la\nvaleur des produits issus de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 fin octobre 2025, la valeur des produits issus de la p\u00eache c\u00f4ti\u00e8re et artisanale au Maroc s\u2019est \u00e9tablie \u00e0 pr\u00e8s de 9 milliards de dirhams, en l\u00e9ger recul de 3% sur un an, selon les donn\u00e9es publi\u00e9es par l\u2019Office national des p\u00eaches (ONP). [www.lavieeco.com]\n-------------------------------------------------\nLes d\u00e9barquements de produits commercialis\u00e9s issus de la p\u00eache c\u00f4ti\u00e8re et artisanale ont totalis\u00e9 948.177 tonnes \u00e0 fin octobre 2025, soit une baisse de 14% en volume par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les donn\u00e9es de l\u2019Office national des p\u00eaches (ONP). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "L\u2019ESSEC Business School \u2013 Campus\nAfrique et sa Chaire Business...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ESSEC Business School \u2013 Campus Afrique et sa Chaire Business et Industrie en Afrique organisent une conf\u00e9rence-d\u00e9bat \u00e0 la Maison des Alumni d ion. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "BANK OF AFRICA ACADEMY l\u2019Universit\u00e9\nd\u2019Entreprise du Groupe \u00e9ponyme re\u00e7oit...", "mass": 5, "physics": false, "shape": "box", "title": "BANK OF AFRICA ACADEMY l\u2019Universit\u00e9 d\u2019Entreprise du Groupe \u00e9ponyme re\u00e7oit le 2\u1d49 prix mondial dans la cat\u00e9gorie \u201cBest Innovative Organization \u2013 Private Sector\u201d lors de la prestigieuse c\u00e9r\u00e9monie des GIMI Innovation Awards 2025, organis\u00e9e \u00e0 Rio de Janeiro le 7 novembre 2025 par le Global Innovation Management Institute (GIMI). [leseco.ma]\n-------------------------------------------------\nBANK OF AFRICA Academy, universit\u00e9 d\u2019entreprise du Groupe BANK OF AFRICA, a obtenu la deuxi\u00e8me place mondiale dans la cat\u00e9gorie \u00ab Best Innovative Organization \u2013 Private Sector \u00bb lors des GIMI Innovation Awards 2025, tenus le 7 novembre \u00e0 Rio de Janeiro par le Global Innovation Management Institute (GIMI). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La Fondation Nationale des Mus\u00e9es\n(FNM), la F\u00e9d\u00e9ration Royale Marocaine...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Nationale des Mus\u00e9es (FNM), la F\u00e9d\u00e9ration Royale Marocaine des Jeux \u00c9lectroniques (FRMJE) et la Ligue R\u00e9gionale Rabat-Sal\u00e9-K\u00e9nitra des Jeux \u00c9lectroniques (LRRSKJE) ont sign\u00e9, mercredi 12 novembre 2025, au Mus\u00e9e Mohammed VI d\u2019Art Moderne et Contemporain de Rabat, une convention de partenariat in\u00e9dite consacr\u00e9e \u00e0 la valorisation du patrimoine culturel \u00e0 travers le num\u00e9rique . [fr.hespress.com]\n-------------------------------------------------\nUne convention de partenariat a \u00e9t\u00e9 sign\u         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
