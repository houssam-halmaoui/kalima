 milliards de dirhams (MMDH) \u00e0 fin mai 2026, contre 46,16 MMDH \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLes transferts de fonds effectu\u00e9s par les Marocains r\u00e9sidant \u00e0 l\u00e9tranger (MRE) ont atteint plus de 50,22 milliards de dirhams (MMDH) \u00e0 fin mai 2026, contre 46,16 MMDH \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon lOffice des changes. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Alors que Bruxelles pr\u00e9pare son\nIndustrial Accelerator Act pour relocaliser...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que Bruxelles pr\u00e9pare son Industrial Accelerator Act pour relocaliser une partie de la production industrielle, les constructeurs automobiles europ\u00e9ens mettent en garde contre un effet pervers : affaiblir des cha\u00eenes de valeur d\u00e9j\u00e0 int\u00e9gr\u00e9es. [fr.hespress.com]\n-------------------------------------------------\nAlors que Bruxelles pr\u00e9pare sa loi sur l\u2019acc\u00e9l\u00e9ration industrielle (Industrial Accelerator Act), les constructeurs automobiles europ\u00e9ens r\u00e9clament un traitement de faveur pour leurs usines marocaines et turques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 et de la Protection sociale appelle l\u0027ensemble des citoyennes et citoyens \u00e0 faire preuve de vigilance et \u00e0 adopter les gestes de pr\u00e9vention n\u00e9cessaires. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale appelle l\u2019ensemble des citoyennes et citoyens \u00e0 faire preuve de vigilance et \u00e0 adopter les gestes de pr\u00e9vention n\u00e9cessaires pour limiter les risques li\u00e9s aux fortes temp\u00e9ratures, notamment chez les personnes les plus vuln\u00e9rables. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale appelle l\u2019ensemble des citoyennes et citoyens \u00e0 faire preuve de vigilance et \u00e0 adopter les gestes de pr\u00e9vention n\u00e9cessaires pour limiter les risques li\u00e9s aux fortes temp\u00e9ratures, notamment chez les personnes les plus vuln\u00e9rables. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Cet investissement dans les infrastructures\nd\u2019\u00e9nergie propre, l\u2019un des plus...", "mass": 5, "physics": false, "shape": "box", "title": "Cet investissement dans les infrastructures d\u2019\u00e9nergie propre, l\u2019un des plus importants en Afrique, permettra de renforcer la fiabilit\u00e9 et la r\u00e9silience du syst\u00e8me \u00e9lectrique maroca. [lematin.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque mondiale a approuv\u00e9, le 1er juillet 2026, un financement de 265 millions de dollars (environ 2,4 milliards de dirhams) pour le projet de station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, dans le nord du Maroc. [telquel.ma]\n-------------------------------------------------\nCet investissement vise \u00e0 renforcer les infrastructures d\u00e9nergie verte dans le nord du pays, \u00e0 travers un projet qui constitue lun des plus importants dispositifs de stockage d\u2019\u00e9nergie en Afrique. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9, mercredi, un financement de 265 millions de dollars pour la Station de transfert d\u0027\u00e9nergie par pompage (STEP) d\u0027Ifahsa, pr\u00e8s de Chefchaouen, l\u0027un des plus importants investissements en \u00e9nergie propre en Afrique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 l\u0027approche du duel entre\nle Maroc et le Canada...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u0027approche du duel entre le Maroc et le Canada en huiti\u00e8me de finale du Mondial 2026, le s\u00e9lectionneur canadien Jesse Marsch s\u0027attend \u00e0 un d\u00e9fi de taille. [lematin.ma]\n-------------------------------------------------\nQualifi\u00e9 pour la premi\u00e8re fois de son histoire pour les huiti\u00e8mes de finale d\u2019une Coupe du monde, le Canada h\u00e9rite d\u2019un adversaire coriace : le Maroc, demi-finaliste. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur du Canada, Jesse Marsch, a qualifi\u00e9 le duel avec le Maroc en huiti\u00e8mes de finale de la Coupe du monde 2026 de \u00abcauchemar sanglant et horrible\u00bb, tout en couvrant d\u2019\u00e9loges les Lions de l\u2019Atlas avant la rencontre pr\u00e9vue samedi \u00e0 Houston. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Conseil de gouvernement a\napprouv\u00e9 le projet de loi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9 le projet de loi n\u00b0 46.26 relatif au syst\u00e8me statistique national, pr\u00e9sent\u00e9 par le ministre de l\u0027Int\u00e9rieur.S\u0027inscrivant dans le cadre. [lematin.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de l\u2019Int\u00e9rieur, ce projet de loi qui s\u2019inscrit dans le cadre du suivi des hautes orientations royales, vise essentiellement \u00e0 mettre en place. [telquel.ma]\n-------------------------------------------------\nCe projet de loi vise essentiellement \u00e0 mettre en place un nouveau cadre juridique concernant le Syst\u00e8me statistique national, en d\u00e9terminant ses composantes et missions, ainsi que ses r\u00e8gles d\u2019organisation et les principes fondamentaux des statistiques officielles. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "AXA Assurance Maroc d\u00e9voile sa\npremi\u00e8re campagne de marque panafricaine,...", "mass": 5, "physics": false, "shape": "box", "title": "AXA Assurance Maroc d\u00e9voile sa premi\u00e8re campagne de marque panafricaine, une initiative qui place la solidarit\u00e9 interg\u00e9n\u00e9rationnelle au c\u0153ur de son discours. [lematin.ma]\n-------------------------------------------------\nDans un contexte de transformation d\u00e9mographique et d\u2019\u00e9volution des sch\u00e9mas familiaux au Maroc et en Afrique, les questions de protection, d\u2019accompagnement et de transmission prennent une place de [www.challenge.ma]\n-------------------------------------------------\nCette initiative, premi\u00e8re campagne panafricaine de la marque con\u00e7ue au Maroc, sera progressivement d\u00e9ploy\u00e9e dans plusieurs pays du continent apr\u00e8s son lancement sur le march\u00e9 marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Conseil de gouvernement a\nadopt\u00e9, jeudi \u00e0 Rabat, le...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9, jeudi \u00e0 Rabat, le projet de loi N\u00b0 051.26 relatif \u00e0 l\u2019organisation de la profession d\u2019adoul, pr\u00e9sent\u00e9 par le ministre de la Justice. [telquel.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de la Justice, ce texte vise \u00e0 tirer les cons\u00e9quences juridiques de la d\u00e9cision de la Cour constitutionnelle concernant la loi n\u00b0 16.22 sur la m\u00eame profession, conform\u00e9ment \u00e0 l\u0027article 134 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du\np\u00f4le DGSN-DGST, a re\u00e7u le...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du p\u00f4le DGSN-DGST, a re\u00e7u le g\u00e9n\u00e9ral de division Luis Pelaez Pi\u00f1eiro, chef de la Commission du renseignement de la Garde civile espagnole, \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation de haut niveau en visite de travail au Royaume du Maroc. [telquel.ma]\n-------------------------------------------------\nJeudi, \u00e0 Rabat, Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, a accueilli une d\u00e9l\u00e9gation de haut niveau de la Garde civile espagnole, dirig\u00e9e par le g\u00e9n\u00e9ral de division Luis Pel\u00e1ez Pi\u00f1eiro, chef de la Direction du renseignement. [www.yabiladi.com]\n-------------------------------------------------\nLe Directeur G\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, jeudi au Si\u00e8ge de la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale \u00e0 Rabat, le g\u00e9n\u00e9ral Luis Pel\u00e1ez Pi\u00f1eiro, chef du Commissariat du renseignement de la Garde civile espagnole, actuellement en visite de travail au Maroc \u00e0 la [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "la     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
