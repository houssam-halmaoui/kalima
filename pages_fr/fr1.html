l", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Dans le sillage des excellentes\nrelations bilat\u00e9rales liant le Royaume...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le sillage des excellentes relations bilat\u00e9rales liant le Royaume du Maroc et le Royaume d\u2019Espagne, les gouvernements des deux pays ont d\u00e9cid\u00e9 de tenir la XIII\u00e8me R\u00e9union de Haut Niveau le 4 d\u00e9cembre prochain \u00e0 Madrid. [fr.hespress.com]\n-------------------------------------------------\nDans le sillage des relations bilat\u00e9rales liant le Royaume du Maroc et le Royaume d\u2019Espagne, les gouvernements des deux pays ont d\u00e9cid\u00e9 de tenir la XIII\u00e8me R\u00e9union de Haut Niveau le 4 d\u00e9cembre prochain \u00e0 Madrid. [atlasinfo.fr]\n-------------------------------------------------\nCette r\u00e9union sera pr\u00e9c\u00e9d\u00e9e du Forum \u00e9conomique Maroc-Espagne, dont les travaux se tiendront le 3 d\u00e9cembre dans la capitale espagnole, indique un communiqu\u00e9 du D\u00e9partement du Chef. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Princesse Lalla Zineb, Pr\u00e9sidente\nde La Ligue Marocaine pour...", "mass": 5, "physics": false, "shape": "box", "title": "La Princesse Lalla Zineb, Pr\u00e9sidente de La Ligue Marocaine pour la Protection de l\u2019Enfance (LMPE), a pr\u00e9sid\u00e9 jeudi \u00e0 Rabat, la r\u00e9union de l\u2019Assembl\u00e9e G\u00e9n\u00e9rale de la Ligue, au cours de laquelle ont \u00e9t\u00e9 pr\u00e9sent\u00e9s les rapports moral et financier au titre de l\u2019ann\u00e9e 2024, le programme d\u2019actions 2025-2026, ainsi que le rapport du commissaire . [fr.hespress.com]\n-------------------------------------------------\nSon Altesse a salu\u00e9 l\u2019engagement continu et la mobilisation constante de tous les membres et acteurs de la Ligue qui contribuent \u00e0 la mise en \u0153uvre des programmes et des plans d\u2019actions, pour le renforcement des m\u00e9canismes de protection et l\u2019am\u00e9lioration de la qualit\u00e9 de prise en charge des b\u00e9n\u00e9ficiaires. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de La Ligue Marocaine pour la Protection de l\u2019Enfance (LMPE), a pr\u00e9sid\u00e9 jeudi \u00e0 Rabat, la r\u00e9union de l\u2019Assembl\u00e9e G\u00e9n\u00e9rale de la Ligue, au cours de laquelle ont \u00e9t\u00e9 pr\u00e9sent\u00e9s les rapports moral et financier au titre de l\u2019ann\u00e9e 2024, le programme d\u2019actions 2025-2026, ainsi que le rapport . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Maroc occupe actuellement la\n13e place dans le classement...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc occupe actuellement la 13e place dans le classement mondial de l\u2019ONU Tourisme des meilleures destinations en termes de croissance au niveau international. [lematin.ma]\n-------------------------------------------------\nLe Maroc confirme, une fois de plus, son statut de destination incontournable, en figurant parmi les meilleures destinations dans la plupart des listes et classements internationaux pour 2025-2026, [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Roi Mohammed VI, que\nDieu l\u2019assiste, \u00e0 renforcer les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI, que Dieu l\u2019assiste, \u00e0 renforcer les liens fraternels et la coop\u00e9ration fruct. [lematin.ma]\n-------------------------------------------------\nLe chef du gouvernement a rappe  "group": 6, "id": "comm_label_6", "label": "Dans un mot publi\u00e9 sur\nle site officiel du Festival...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un mot publi\u00e9 sur le site officiel du Festival international du Film de Marrakech \u00e0 l\u0027occasion de sa 22e \u00e9dition, qui se d\u00e9roulera du 28 novembre au 06 d\u00e9cembre, S.A.R. [lematin.ma]\n-------------------------------------------------\nDepuis sa cr\u00e9ation, le Festival international du Film de Marrakech \u201cs\u2019est affirm\u00e9 comme un lieu de dialogue et de d\u00e9couverte, un espace o\u00f9 les cultures se croisent et les talents \u00e9mergent\u201d, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Niger, Bakary Yaou Sangar\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u0027Organisation internationale de police criminelle\n(INTERPOL) a d\u00e9cern\u00e9 au Directeur...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027Organisation internationale de police criminelle (INTERPOL) a d\u00e9cern\u00e9 au Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, M. Abdellatif Hammouchi, la plus haute distinction de l\u0027Organisation. [www.lopinion.ma]\n-------------------------------------------------\nLa 93e Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (INTERPOL) a \u00e9t\u00e9 \u00ab un succ\u00e8s \u00bb \u00e0 tous les niveaux et sur tous les plans, a affirm\u00e9, jeudi \u00e0 Marrakech, le Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi. [atlasinfo.fr]\n-------------------------------------------------\nLa 93e Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (INTERPOL) a \u00e9t\u00e9 \u00ab un succ\u00e8s \u00bb \u00e0 tous les niveaux et sur tous les plans, a affirm\u00e9, jeudi \u00e0 Marrakech, le Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le groupe Intelcia, cofond\u00e9 par\nKarim Bernoussi et El Aoufi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Intelcia, cofond\u00e9 par Karim Bernoussi et El Aoufi, a annonc\u00e9 ce mercredi 26 novembre la signature d\u2019un accord avec le Altice pour racheter les 65 % du capital que le groupe de Patrick Drahi d\u00e9tenait depuis 2016. [telquel.ma]\n-------------------------------------------------\nLes actionnaires dirigeants d\u2019Intelcia, \u00e0 savoir les co-fondateurs Karim Bernoussi et Youssef El Aoufir, d\u00e9tiennent d\u00e9sormais 100% des parts de la soci\u00e9t\u00e9, apr\u00e8s un accord convenu, le 24 [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le g\u00e9ant am\u00e9ricain de la\nmobilit\u00e9 a officialis\u00e9 ce jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9ant am\u00e9ricain de la mobilit\u00e9 a officialis\u00e9 ce jeudi son retour au Maroc, sept ans apr\u00e8s avoir suspendu ses activit\u00e9s en raison d\u2019un vide juridique persistant dans le secteur des VTC. [telquel.ma]\n-------------------------------------------------\nL\u0027application Uber est d\u00e9sormais accessible \u00e0 Casablanca et Marrakech, en partenariat exclusif avec des v\u00e9hicules de transport agr\u00e9\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nUber a officiellement lanc\u00e9 son service de transport au Maroc, offrant d\u00e9sormais la possibilit\u00e9 de commander des courses via son application \u00e0 Casablanca et Marrakech. [lnt.ma]\n-------------------------------------------------\nLa plateforme entend devenir un partenaire privil\u00e9gi\u00e9 de cette transformation num\u00e9rique, en apportant des solutions technologiques innovantes, fiables et famili\u00e8res . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019op\u00e9ration d\u2019inscription \u00e9lectronique des personnes\nd\u00e9sireuses d\u2019accomplir le rite du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration d\u2019inscription \u00e9lectronique des personnes d\u00e9sireuses d\u2019accomplir le rite du p\u00e8lerinage au titre de la saison 1448 H/2027 se d\u00e9roulera du lundi 8 d\u00e9cembre au vendredi 19 d\u00e9cembre 2025, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re des Habous et des Affaires islamiques a annonc\u00e9 que les inscriptions \u00e9lectroniques pour le p\u00e8lerinage au titre de la saison 1448 H/2027 auront lieu du 8 au 19 d\u00e9cembre 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La collaboration avec le Maroc\nest non pas \u00e0 inventer,...", "mass": 5, "physics": false, "shape": "box", "title": "La collaboration avec le Maroc est non pas \u00e0 inventer, mais elle est \u00e0 faire vivre encore plus \u00bb, a d\u00e9clar\u00e9 \u00e0 la presse Lucas Philippe, \u00e9lu \u00e0 la t\u00eate de. [telquel.ma]\n-------------------------------------------------\nLe Fran\u00e7ais Lucas Philippe, a \u00e9t\u00e9 \u00e9lu, jeudi 27 novembre, nouveau pr\u00e9sident d\u2019Interpol pour un mandat de quatre ans, lors de la 93\u00e8me Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale [www.challenge.ma]\n-------------------------------------------------\nLe nouveau pr\u00e9sident de l\u2019Organisation internationale de police criminelle (INTERPOL), Lucas Philippe, a promis, depuis Marrakech, de renforcer davantage la coop\u00e9ration s\u00e9curitaire avec le Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLors de la 93e Assembl\u00e9e g\u00e9n\u00e9rale d\u2019Interpol, tenue \u00e0 Marrakech du 24 au 27 novembre, Lucas Philippe a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de l\u2019Organisation internationale de police criminelle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Bureau central d\u2019investigations judiciaires\n(BCIJ) a proc\u00e9d\u00e9, mardi, sur...", "mass": 5, "physics": false, "shape": "box", "title": "Le Bureau central d\u2019investigations judiciaires (BCIJ) a proc\u00e9d\u00e9, mardi, sur la base d\u2019informations pr\u00e9cises fournies par les Services centraux de la Direction g\u00e9n\u00e9rale de la Surveillance du territoire (DGST), au d\u00e9mant\u00e8lement d\u2019un r\u00e9seau criminel de trafic international de drogues, exploitant les plages proches de Casablanca comme points de d\u00e9part d\u2019op\u00e9rations de trafic par voie maritime. [telquel.ma]\n-------------------------------------------------\nLe Bureau central d\u2019investigations judiciaires (BCIJ) a proc\u00e9d\u00e9, mardi, sur la base d\u2019informations pr\u00e9cises fournies par les Services centraux de la Direction g\u00e9n\u00e9rale de la Surveillance du territoire (DGST), au d\u00e9mant\u00e8lement d\u2019un r\u00e9seau criminel de trafic international de drogues, exploitant les plages proches de Casablanca comme points de d\u00e9part d\u2019op\u00e9rations de trafic par voie maritime . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le pr\u00e9sident du Conseil d\u2019administration\nde la Bourse de Casablanca,...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du Conseil d\u2019administration de la Bourse de Casablanca, Brahim Benjelloun Touimi, a appel\u00e9, jeudi \u00e0 Rabat, \u00e0 adopter une approche \u00ab Africa First \u00bb, qui place le continent [www.challenge.ma]\n-------------------------------------------------\nLe pr\u00e9sident du Conseil d\u0027administration de la Bourse de Casablanca, Brahim Benjelloun Touimi, a appel\u00e9, jeudi \u00e0 Rabat, \u00e0 adopter une approche \"Africa First\", qui place le continent au c\u0153ur des strat\u00e9gies de financement, afin de renforcer l\u0027attractivit\u00e9 des projets africains et d\u0027acc\u00e9l\u00e9rer leur bancabilit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le minist\u00e8re de l\u2019Industrie et\ndu Commerce a officiellement annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Industrie et du Commerce a officiellement annonc\u00e9 la cl\u00f4ture de son enqu\u00eate antidumping sur les importations de polychlorure de vinyle (PVC) en provenance d\u2019\u00c9gypte, lanc\u00e9e le 27 novembre 2024. [maroc-diplomatique.net]\n-------------------------------------------------\nApr\u00e8s un an d\u2019investigation, le minist\u00e8re du Commerce et de l\u2019Industrie confirme l\u2019existence d\u2019un dumping massif sur les importations de PVC \u00e9gyptien, ayant fragilis\u00e9 la fili\u00e8re nationale et recommande l\u2019instauration de droits d\u00e9finitifs d\u2019un niveau exceptionnel. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Avec la reprise des parts\nd\u2019Altice par ses dirigeants, le...", "mass": 5, "physics": false, "shape": "box", "title": "Avec la reprise des parts d\u2019Altice par ses dirigeants, le groupe est d\u00e9sormais int\u00e9gralement d\u00e9tenu par son management, ouvrant une phase d\u00e9cisive de d\u00e9veloppement, d\u2019innovation et de projection mondiale. [leseco.ma]\n-------------------------------------------------\nIntelcia franchit une \u00e9tape majeure avec la signature, le 24 novembre 2025, d\u2019un accord entre ses actionnaires dirigeants et Altice portant sur la reprise des 65 % du capital d\u00e9tenus par ce dernier depuis 2016. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u0027Office National de l\u2019\u00c9lectricit\u00e9 et\nde l\u2019Eau Potable (ONEE) vient...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) vient de lancer un avis de pr\u00e9-qualification des constructeurs pour la r\u00e9alisation de lignes \u00e9lectriques Ultra Haute Tension \u00e0 courant alternatif (UHT), destin\u00e9es \u00e0 assurer le transport de l\u2019\u00e9lectricit\u00e9 sur une distance d\u0027environ 1.000 km, reliant les zones de Boujdour et de Tensift. [leseco.ma]\n-------------------------------------------------\nL\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable lance la pr\u00e9-qualification pour un projet de pr\u00e8s de 1.000 km de lignes \u00e0 ultra haute tension entre Boujdour et Tensift, une infrastructure cl\u00e9 destin\u00e9e \u00e0 transporter jusqu\u2019\u00e0 2 000 MW d\u2019\u00e9lectricit\u00e9 renouvelable vers le Centre du pays d\u2019ici 2028. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Apr\u00e8s une 6\u1d49 \u00e9dition organis\u00e9e\nsous le Haut Patronage de...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s une 6\u1d49 \u00e9dition organis\u00e9e sous le Haut Patronage de Sa Majest\u00e9 le Roi, la R\u00e9gion de l\u2019Oriental accueillera les 19 et 20 d\u00e9cembre la 7\u1d49 \u00e9dition du MEET the Lead, rendez-vous d\u00e9di\u00e9 \u00e0 la transformation num\u00e9rique, \u00e0 l\u2019innovation et au d\u00e9veloppement territorial. [lnt.ma]\n-------------------------------------------------\nPr\u00e9vu les 19 et 20 d\u00e9cembre \u00e0 Oujda, ce rendez-vous de r\u00e9f\u00e9rence d\u00e9di\u00e9 \u00e0 la transformation num\u00e9rique, \u00e0 l\u2019innovation et au d\u00e9veloppement territorial d\u00e9battra cette ann\u00e9e de la r\u00e9gionalisation avanc\u00e9e et de la gouvernance. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Haut-Commissariat au Plan (HCP),\na fait \u00e9tat d\u2019une hausse...", "mass": 5, "physics": false, "sha     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
