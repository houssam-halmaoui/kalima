te priv\u00e9e qu\u2019effectue Son Altesse Cheikh Mohammed Ben Zayed Al-Nahyane, Pr\u00e9sident de l\u2019Etat des Emirats Arabes Unis fr\u00e8re,. [telquel.ma]\n-------------------------------------------------\nLa m\u00eame source indique que \u00abcette rencontre a \u00e9t\u00e9 une occasion propice pour examiner et \u00e9changer les points de vue entre les dirigeants des deux pays au sujet des questions et d\u00e9fis que conna\u00eet la sc\u00e8ne internationale, en particulier celles qui concernent les Etats du Golfe et du Moyen-Orient\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLe pr\u00e9sident des Emirats arabes unis, Cheikh Mohammed Ben Zayeb Al-Nahyane, qui effectue une visite priv\u00e9e au Maroc, a re\u00e7u, mardi \u00e0 sa r\u00e9sidence \u00e0 Rabat, le Roi Mohammed VI, indique un communiqu\u00e9 du Cabinet royal. [leseco.ma]\n-------------------------------------------------\nVoici un communiqu\u00e9 du Cabinet Royal : \u00ab Dans le cadre de la visite priv\u00e9e qu\u2019effectue Son Altesse Cheikh Mohammed Ben Zayed Al-Nahyane, Pr\u00e9sident de l\u2019Etat des Emirats Arabes Unis fr\u00e8re, \u00e0 son deuxi\u00e8me pays le Royaume du Maroc, Son Altesse a re\u00e7u son fr\u00e8re Sa Majest\u00e9 le Roi Mohammed VI, que Dieu Les pr\u00e9serve, ce . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Copr\u00e9sid\u00e9e par le ministre de\nl\u0027Industrie et du Commerce, Ryad...", "mass": 5, "physics": false, "shape": "box", "title": "Copr\u00e9sid\u00e9e par le ministre de l\u0027Industrie et du Commerce, Ryad Mezzour, et le ministre d\u0027\u00c9tat britannique au Commerce international, Chris Bryant, cette rencontre a \u00e9t\u00e9 l#. [lematin.ma]\n-------------------------------------------------\nLe Royaume-Uni consid\u00e8re le Maroc comme une terre d\u2019opportunit\u00e9s et ambitionne de doubler le volume de ses \u00e9changes commerciaux avec le Royaume au cours des cinq \u00e0 sept prochaines ann\u00e9es, a indiqu\u00e9 mardi \u00e0 Rabat, le ministre d\u2019\u00c9tat britannique au Commerce international, Chris Bryant. [telquel.ma]\n-------------------------------------------------\nLe ministre d\u2019Etat britannique a exprim\u00e9 le souhait du Royaume-Uni de collaborer avec le Maroc, en tant que partenaire strat\u00e9gique, pour la r\u00e9ussite des grands \u00e9v\u00e9nements sportifs, en l\u2019occurrence la Coupe du Monde 2030. [www.lavieeco.com]\n-------------------------------------------------\nLe Royaume-Uni consid\u00e8re le Maroc comme une terre d\u2019opportunit\u00e9s et ambitionne de doubler le volume de ses \u00e9changes commerciaux avec le Royaume au cours des cinq \u00e0 sept prochaines ann\u00e9es, a indiqu\u00e9 mardi \u00e0 Rabat, le ministre d\u2019\u00c9tat britannique au Commerce international, Chris Bryant. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 cette occasion, le pr\u00e9sident\nde la Commission, Moulay Abderrahmane...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 cette occasion, le pr\u00e9sident de la Commission, Moulay Abderrahmane Blila, a annonc\u00e9 que le groupe socialiste-opposition ittihadie avait retir\u00e9 les amendements qu\u0027il avait d\u00e9p. [lematin.ma]\n-------------------------------------------------\nLa Commission de l\u2019Int\u00e9rieur, des collectivit\u00e9s territoriales et des infrastructures de base \u00e0 la Chambre des conseillers a approuv\u00e9, lundi \u00e0 l\u2019unanimit\u00e9, le projet de loi organique N\u00b0031.26 modifiant et compl\u00e9tant la loi organique N\u00b0 111.14 relative aux r\u00e9gions. [telquel.ma]\n-------------------------------------------------\nLe texte vient d\u2019\u00eatre adopt\u00e9 en commission parlementaire \u00e0 la deuxi\u00e8me Chambre R     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
