os Kury Pesantes. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc et l\u2019\u00c9quateur ont r\u00e9affirm\u00e9 leur volont\u00e9 de renforcer leur coop\u00e9ration bilat\u00e9rale, notamment sur les plans diplomatique et \u00e9conomique, \u00e0 l\u2019issue d\u2019une rencontre tenue lundi 9 novembre \u00e0 Rabat entre le ministre marocain des Affaires \u00e9trang\u00e8res, Nasser Bourita, et son homologue \u00e9quatorien, Roberto Carlos Kury Pesantes. [www.yabiladi.com]\n-------------------------------------------------\nLe renforcement des relations \u00e9conomiques et commerciales et le d\u00e9veloppement des \u00e9changes bilat\u00e9raux ont \u00e9t\u00e9 au centre des entretiens, lundi \u00e0 Rabat, entre le ministre de l\u2019Industrie, du Commerce, de l\u2019Investissement et de l\u2019Inclusion \u00e9conomique, Ryad Mezzour, et le ministre \u00e9quatorien des Relations ext\u00e9rieures et de la Mobilit\u00e9 humaine, Roberto Carlos Kury Pesantes. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La s\u00e9lection marocaine de futsal\ns\u2019est inclin\u00e9e face \u00e0 son...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de futsal s\u2019est inclin\u00e9e face \u00e0 son homologue argentine sur le score de 4 buts \u00e0 2, lundi, en demi-finale des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, et disputera le match pour la m\u00e9daille de bronze contre l\u2019Afghanistan, jeudi 12 novembre. [fr.hespress.com]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale marocaine de futsal s\u2019est inclin\u00e9e lundi face \u00e0 l\u2019Argentine (4-2) en demi-finale des Jeux olympiques de la jeunesse Dakar 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le chef de l\u2019\u00c9tat s\u2019est\ndit \u00ab tr\u00e8s heureux \u00bb...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef de l\u2019\u00c9tat s\u2019est dit \u00ab tr\u00e8s heureux \u00bb de voir le quintuple champion olympique s\u2019engager dans le d\u00e9bat politique et estime que son arriv\u00e9e dans la course peut apporter au pays. \u00ab [fr.hespress.com]\n-------------------------------------------------\nLe quintuple champion olympique de judo Teddy Riner, ic\u00f4ne du sport fran\u00e7ais, a annonc\u00e9 lundi sa candidature \u00e0 l\u2019\u00e9lection pr\u00e9sidentielle de 2027, dans une vid\u00e9o post\u00e9e sur ses r\u00e9seaux sociaux. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Ligue Nationale de Football\nProfessionnel (LNFP) a fix\u00e9 au...", "mass": 5, "physics": false, "shape": "box", "title": "La Ligue Nationale de Football Professionnel (LNFP) a fix\u00e9 au vendredi 27 novembre la reprise des comp\u00e9titions de la Botola Pro D1 \u00ab Inwi \u00bb au titre de la saison sportive 2026-2027. [fr.hespress.com]\n-------------------------------------------------\nLa Ligue nationale de football professionnel (LNFP) a fix\u00e9 au vendredi 27 novembre la reprise des comp\u00e9titions de la Botola Pro D1 \u00ab Inwi \u00bb au titre de la saison sportive 2026-2027. [telquel.ma]\n-------------------------------------------------\nCette date a \u00e9t\u00e9 fix\u00e9e pour la reprise des comp\u00e9titions du championnat marocain de premi\u00e8re division, dans le cadre de la saison sportive 2026-2027. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le Comit\u00e9 directeur de la\nF\u00e9d\u00e9ration royale marocaine de football...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale, le 12 d\u00e9cembre prochain. [lematin.ma]\n-------------------------------------------------\nLe Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, ce lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance le 12 d\u00e9cembre prochain. [www.lavieeco.com]\n-------------------------------------------------\nLe Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale, le 12 d\u00e9cembre prochain, \u00e0 l\u2019issue de sa r\u00e9union pr\u00e9sid\u00e9e par Fouzi Lekjaa. [telquel.ma]\n-------------------------------------------------\nR\u00e9uni lundi sous la pr\u00e9sidence de Fouzi Lekjaa, son Comit\u00e9 directeur a fix\u00e9 au 12 d\u00e9cembre prochain la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a lanc\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a lanc\u00e9, lundi 9 novembre, un nouveau service num\u00e9rique permettant aux Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE) de demander \u00e0 dista. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a g\u00e9n\u00e9ralis\u00e9, d\u00e8s ce lundi 9 novembre, le service de demande en ligne de la fiche anthropom\u00e9trique aux Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), \u00e0 travers le portail \u00abEpolice\u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le projet d\u2019hydrog\u00e8ne vert et\nde production d\u2019ammoniac renouvelable port\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet d\u2019hydrog\u00e8ne vert et de production d\u2019ammoniac renouvelable port\u00e9 par Sahamco Holding BV dans la r\u00e9gion de Dakhla entre dans une nouvelle \u00e9tape dans sa maturation technique. [lematin.ma]\n-------------------------------------------------\nLe projet d\u2019hydrog\u00e8ne vert et d\u2019ammoniac port\u00e9 par Sahamco Holding BV \u00e0 Dakhla franchit une nouvelle \u00e9tape avec l\u2019ach\u00e8vement des \u00e9tudes de pr\u00e9faisabilit\u00e9 avanc\u00e9e (Pr\u00e9-FEED) de sa premi\u00e8re phase. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le groupe Addoha annonce avoir\nobtenu l\u2019agr\u00e9ment de la National...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Addoha annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC), lui permettant de participer en qualit\u00e9 de d\u00e9veloppeur partenaire \u00e0 des projets immobiliers r. [lematin.ma]\n-------------------------------------------------\nLe Groupe Addoha annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC) pour participer, en tant que d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels dans le Royaume d\u2019Arabie Saoudite. [telquel.ma]\n-------------------------------------------------\nLe groupe Addoha a obtenu l\u0027agr\u00e9ment de la National Housing Company (NHC) pour participer, en qualit\u00e9 de d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels en Arabie saoudite. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Addoha, cot\u00e9 \u00e0 la Bourse de Casablanca, a annonc\u00e9 le lundi 9 novembre 2026 avoir re\u00e7u lagr\u00e9ment de la National Housing Company (NHC) pour agir comme d\u00e9veloppeur partenaire sur des projets r\u00e9sidentiels en Arabie saoudite. [www.yabiladi.com]\n-------------------------------------------------\nDans un communiqu\u00e9 publi\u00e9 sur le site de l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC), la soci\u00e9t\u00e9 annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC), organisme saoudien sp\u00e9cialis\u00e9 dans le d\u00e9veloppement de destinations r\u00e9sidentielles int\u00e9gr\u00e9es. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "En ex\u00e9cution des hautes instructions\nroyales, Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des hautes instructions royales, Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la cheffe du gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, a re\u00e7u lundi, au si\u00e8ge de cette administration, Amir Baram, directeur g\u00e9n\u00e9ral du minist\u00e8re de la D\u00e9fense isra\u00e9lien, en visite officielle au Maroc \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation. [telquel.ma]\n-------------------------------------------------\nSuite aux directives royales, M. Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de lAdministration de la D\u00e9fense nationale, a accueilli lundi M. Amir Baram, Directeur G\u00e9n\u00e9ral du minist\u00e8re de la d\u00e9fense isra\u00e9lien, lors de sa visite officielle au Maroc. [www.yabiladi.com]\n-------------------------------------------------\nCette rencontre, tenue sur Hautes Instructions Royales, s\u2019inscrit dans le cadre de la visite officielle au Maroc du responsable isra\u00e9lien, accompagn\u00e9 d\u2019une importante d\u00e9l\u00e9gation. [maroc-diplomatique.net]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, M. Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, a re\u00e7u lundi, au si\u00e8ge de cette Administration, M. Amir Baram, Directeur G\u00e9n\u00e9ral du minist\u00e8re de d\u00e9fense isra\u00e9lien, en visite officielle au Maroc \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Du 3 au 6 d\u00e9cembre\n2026, le Festival Zamane revient...", "mass": 5, "physics": false, "shape": "box", "title": "Du 3 au 6 d\u00e9cembre 2026, le Festival Zamane revient \u00e0 M\u2019hamid El Ghizlane, aux portes du Sahara et au c\u0153ur de la vall\u00e9e du Dr\u00e2a, pour une cinqui\u00e8me \u00e9dition plac\u00e9e sous le th\u00e8me \u00ab Le Chant Ahidous \u00bb. [telquel.ma]\n-------------------------------------------------\nElle r\u00e9unira des artistes reconnus de diff\u00e9rentes sc\u00e8nes musicales, dans un dialogue entre h\u00e9ritages traditionnels et expressions contemporaines. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La ville de Casablanca accueillera,\ndu 21 au 29 novembre...", "mass": 5, "physics": false, "shape": "box", "title": "La ville de Casablanca accueillera, du 21 au 29 novembre courant, la 4\u00e8 \u00e9dition du Salon international du livre enfant et jeunesse (SILEJ 2026), organis\u00e9 sous le th\u00e8me \u00ab Litt\u00e9rature, environnement et r\u00e9cits de la nature \u00bb. [telquel.ma]\n-------------------------------------------------\nCasablanca accueillera, du 21 au 29 novembre, la quatri\u00e8me \u00e9dition du Salon international du livre enfant et jeunesse (SILEJ 2026), un rendez-vous consacr\u00e9 \u00e0 la promotion de la lecture, de la litt\u00e9rature et de la cr\u00e9ation culturelle aupr\u00e8s des enfants et des adolescents. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La s\u00e9lection marocaine a remport\u00e9,\npour la premi\u00e8re fois de...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine a remport\u00e9, pour la premi\u00e8re fois de son histoire, la Coupe arabe de beach soccer, apr\u00e8s sa victoire face \u00e0 la Mauritanie (6-5), ce lundi, en finale de la comp\u00e9tition organis\u00e9e \u00e0 Port-Sa\u00efd, en \u00c9gypte. [telquel.ma]\n-------------------------------------------------\nLes Lions de lAtlas ont \u00e9crit une nouvelle page de leur histoire en remportant pour la premi\u00e8re fois la Coupe arabe de beach soccer, battant la Mauritanie 6-5 lors dune finale intense \u00e0 Port-Sa\u00efd, en \u00c9gypte. [www.yabiladi.com]\n-------------------------------------------------\nTitre La s\u00e9lection marocaine de beach-soccer a remport\u00e9, lundi, la Coupe arabe pour la premi\u00e8re fois de son histoire, apr\u00e8s sa victoire face \u00e0 son homologue mauritanienne sur le score de 6 buts \u00e0 5, en finale de la cinqui\u00e8me \u00e9dition de cette comp\u00e9tition, disput\u00e9e \u00e0 Port-Sa\u00efd, en \u00c9gypte. [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection nationale a d\u00e9croch\u00e9 le titre lundi \u00e0 Port-Sa\u00efd, au terme d\u2019une finale disput\u00e9e face \u00e0 la Mauritanie, conclue sur une victoire marocaine par 6 buts \u00e0 5. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Des averses orageuses localement fortes\net de fortes rafales de...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses localement fortes et de fortes rafales de vent avec chasse-poussi\u00e8res locales sont pr\u00e9vues, du lundi au jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie annonce des averses orageuses localis\u00e9es et de violentes rafales de vent, accompagn\u00e9es par endroits de chasse-poussi\u00e8res, du lundi au jeudi prochain dans plusieurs r\u00e9gions du royaume. [www.yabiladi.com]\n-------------------------------------------------\nDes averses orageuses localement fortes et de fortes rafales de vent avec chasse-poussi\u00e8res locales sont pr\u00e9vues, du lundi au jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nDes averses orageuses localement fortes et de fortes rafales de vent avec chasse-poussi\u00e8res locales sont pr\u00e9vues, du lundi au jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a \u00e9mis, lundi 9 novembre, un bulletin d\u2019alerte de niveau de vigilance orange annon\u00e7ant de fortes averses orageuses et des rafales de vent accompagn\u00e9es localement de chasse-poussi\u00e8res dans plusieurs provinces du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Pour sa 23e \u00e9dition, qui\nse tiendra du 20 au...", "mass": 5, "physics": false, "shape": "box", "title": "Pour sa 23e \u00e9dition, qui se tiendra du 20 au 28 novembre, le Festival international du film de Marrakech invite le public \u00e0 d\u00e9couvrir la part plus personnelle de la cr\u00e9ation \u00e0 travers son programme \u00ab Conversations \u00bb. [telquel.ma]\n-------------------------------------------------\nAutour d\u2019eux, les \u00ab Conversations \u00bb r\u00e9uniront des cin\u00e9astes et com\u00e9diens qui ont fait du septi\u00e8me art autre chose qu\u2019un divertissement, une mani\u00e8re de regarder le monde, et parfois de le d\u00e9fier. [www.lavieeco.com]\n-------------------------------------------------\nLe Festival international du film de Marrakech a d\u00e9voil\u00e9, lundi 9 novembre, les noms des trois artistes qui seront honor\u00e9s lors de sa 23e \u00e9dition. [lnt.ma]\n-------------------------------------------------\nTrois parcours singuliers, trois univers artistiques et une m\u00eame passion pour le cin\u00e9ma seront mis \u00e0 l\u2019honneur \u00e0 travers des hommages qui c\u00e9l\u00e8brent leur contribution au . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans le communiqu\u00e9 conjoint publi\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans le communiqu\u00e9 conjoint publi\u00e9 \u00e0 l\u2019issue d\u2019un entretien, lundi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger,. [telquel.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans le communiqu\u00e9 conjoint publi\u00e9 \u00e0 l\u2019issue d\u2019un entretien, lundi \u00e0 Rabat, entre le ministre des affaires . [aujourdhui.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans le communiqu\u00e9 conjoint publi\u00e9 \u00e0 l\u2019issue d\u2019un entretien, lundi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, [www.lereporter.ma]\n-------------------------------------------------\nLa R\u00e9publique de l\u2019\u00c9quateur a exprim\u00e9, lundi 9 novembre \u00e0 Rabat, son soutien \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le chef du bloc de\nl\u2019opposition isra\u00e9lienne, Gadi Eisenkot, qui...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du bloc de l\u2019opposition isra\u00e9lienne, Gadi Eisenkot, qui a officiellement re\u00e7u dimanche le mandat de former le prochain gouvernement, s\u2019est dit ouvert \u00e0 une coalition incluant la formation de Benjamin Netanyahu, auquel il a imput\u00e9 d\u2019avoir plong\u00e9 le pays dans une crise historique. [telquel.ma]\n-------------------------------------------------\nSa tentative de b\u00e2tir une coalition intervient alors que le Maroc et Isra\u00ebl cherchent \u00e0 approfondir leurs liens, pr\u00e8s de six ans apr\u00e8s la normalisation de leurs relations. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le taekwondo\u00efste marocain Abdellatif Ladimat\na remport\u00e9, dimanche, la m\u00e9daille...", "mass": 5, "physics": false, "shape": "box", "title": "Le taekwondo\u00efste marocain Abdellatif Ladimat a remport\u00e9, dimanche, la m\u00e9daille de bronze aux Jeux olympiques de la jeunesse \u00ab Dakar 2026 \u00bb, offrant ainsi au Maroc sa premi\u00e8re m\u00e9daille de cette \u00e9dition, au terme d\u2019un parcours marqu\u00e9 par un combat intense et disput\u00e9 face au Fran\u00e7ais Maxence Buta. [telquel.ma]\n-------------------------------------------------\nDakar La Chine a conserv\u00e9, dimanche, la premi\u00e8re place au classement provisoire des m\u00e9dailles des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, avec un total de 17 distinctions, dont onze en or, tandis que le Maroc fait son entr\u00e9e au tableau des m\u00e9dailles gr\u00e2ce au bronze d\u00e9croch\u00e9 par le taekwondo\u00efste Abdellatif Ladimat. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Alors que la crise migratoire\nde Ceuta continue de susciter...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que la crise migratoire de Ceuta continue de susciter des interrogations sur les relations entre Madrid et Rabat, le Premier ministre espagnol Pedro S\u00e1nchez a d\u00e9fendu son approche fond\u00e9e sur la coop\u00e9ration et les relations de bon voisinage avec le Maroc, niant que le soutien de son pays \u00e0 l\u2019autonomie au Sahara ait relev\u00e9 d\u2019un \u00abdonnant-donnant\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nDans un entretien r\u00e9cent, le pr\u00e9sident du gouvernement espagnol a d\u00e9fendu le choix diplomatique de Madrid en faveur de l\u2019initiative marocaine, tout en rejetant l\u2019id\u00e9e d\u2019une quelconque transaction avec Rabat. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Les deux pays entendent ainsi\npoursuivre le rapprochement engag\u00e9 et...", "mass": 5, "physics": false, "shape": "box", "title": "Les deux pays entendent ainsi poursuivre l <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

        const tooltip = document.getElementById('tooltip');

            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
