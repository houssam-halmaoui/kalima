ixte de Coop\u00e9ration Maroc-S\u00e9n\u00e9gal, ont permis aux deux parties de convenir d\u2019une nouvelle feui. [lematin.ma]\n-------------------------------------------------\nLes moyens de renforcer la coop\u00e9ration dans les domaines de l\u2019enseignement sup\u00e9rieur, de la recherche scientifique et de l\u2019innovation ont \u00e9t\u00e9 au centre des entretiens, lundi \u00e0 Rabat, entre le ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui, et son homologue s\u00e9n\u00e9galais, Daouda Ngom. [telquel.ma]\n-------------------------------------------------\nVoulue comme un cadre d\u2019\u00e9change et d\u2019ajustements permanents pour maintenir une coop\u00e9ration bilat\u00e9rale qualitative, la 15e session de la Grande commission mixte entre le Maroc et le S\u00e9n\u00e9gal s\u2019est tenue ce lundi \u00e0 Rabat, sous la pr\u00e9sidence des chefs de gouvernements des deux pays. [www.yabiladi.com]\n-------------------------------------------------\nLe Chef du gouvernement et son homologue s\u00e9n\u00e9galais ont pr\u00e9sid\u00e9 les travaux de la 15\u00e8me Commission mixte de partenariat Nouveau souffle : La coop\u00e9ration entre les Maroc et le S\u00e9n\u00e9gal continuera \u00e0 se renforcer. [aujourdhui.ma]\n-------------------------------------------------\nEn marge des travaux de la 15e Grande Commission mixte de coop\u00e9ration Maroc-S\u00e9n\u00e9gal, les deux parties ont \u00e9chang\u00e9 sur les moyens permettant de traduire en actions concr\u00e8tes leur volont\u00e9 commune d\u2019\u00e9tablir une coop\u00e9ration plus dynamique, durable et mutuellement b\u00e9n\u00e9fique. [www.lavieeco.com]\n-------------------------------------------------\nLes moyens de renforcer la coop\u00e9ration dans les domaines de l\u2019enseignement sup\u00e9rieur, de la recherche scientifique et de l\u2019innovation ont \u00e9t\u00e9 au centre des entretiens, lundi \u00e0 Rabat, entre le ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui, et son homologue s\u00e9n\u00e9galais, Daouda Ngom. [www.lereporter.ma]\n-------------------------------------------------\nR\u00e9unis \u00e0 Rabat \u00e0 l\u2019occasion de la 15\u1d49 session de la Grande Commission mixte de coop\u00e9ration, le Maroc et le S\u00e9n\u00e9gal ont r\u00e9affirm\u00e9 la solidit\u00e9 et la profondeur d\u2019un partenariat strat\u00e9gique fa\u00e7onn\u00e9 par l\u2019histoire, la confiance politique et une vision partag\u00e9e du d\u00e9veloppement en Afrique. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le pr\u00e9sident du gouvernement des\n\u00celes Canaries, Fernando Clavijo Batlle,...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du gouvernement des \u00celes Canaries, Fernando Clavijo Batlle, a entam\u00e9 lundi, une visite dans la r\u00e9gion Souss Massa ax\u00e9e sur le renforcement de la coop\u00e9ration entre les deux parties. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident des \u00celes Canaries, Fernando Clavijo, effectue, \u00e0 partir de ce lundi 26 janvier 2026, une visite officielle de deux jours \u00e0 Agadir, \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation institutionnelle, \u00e9conomique et scientifique de haut niveau. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Valoris\u00e9 \u00e0 pr\u00e8s d\u2019un milliard\nde dirhams, le sp\u00e9cialiste des...", "mass": 5, "physics": false, "shape": "box", "title": "Valoris\u00e9 \u00e0 pr\u00e8s d\u2019un milliard de dirhams, le sp\u00e9cialiste des phytosanitaires et des produits chimiques agricoles et industriels affiche 500 millions de dirhams de chiffre         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
