id": "comm_label_9", "label": "Conclu dans le cadre du\nprogramme GEFF Plus, cet accord...", "mass": 5, "physics": false, "shape": "box", "title": "Conclu dans le cadre du programme GEFF Plus, cet accord vise \u00e0 soutenir les entreprises marocaines dans la mise en \u0153uvre de projets de transition \u00e9nerg\u00e9tique, indique un communiqu\u00e9 de presse de la banque. [www.lopinion.ma]\n-------------------------------------------------\nCr\u00e9dit du Maroc a annonc\u00e9 la signature d\u2019un partenariat strat\u00e9gique avec la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD), dans le cadre du programme GEFF Plus, visant \u00e0 accompagner les entreprises marocaines dans leurs projets de transition \u00e9nerg\u00e9tique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Bank Al-Maghrib (BAM) pr\u00e9voit de\nlancer, en 2026, une phase...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) pr\u00e9voit de lancer, en 2026, une phase pilote du ciblage d\u0027inflation, dans le cadre d\u0027une transition graduelle et prudente vers un r\u00e9gime de change plus flexible, a annonc\u00e9, mardi \u00e0 Rabat, le Wali de BAM, Abdellatif Jouahri. [www.lopinion.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) pr\u00e9voit de lancer, en 2026, une phase pilote du ciblage d\u2019inflation, dans le cadre d\u2019une transition graduelle et prudente vers un r\u00e9gime de change plus flexible, a annonc\u00e9, mardi \u00e0 Rabat, le Wali de BAM, Abdellatif Jouahri. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019Office National des Chemins de\nFer (ONCF), en sa qualit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office National des Chemins de Fer (ONCF), en sa qualit\u00e9 de sponsor officiel de la Coupe d\u2019Afrique des Nations TotalEnergies Maroc (CAN-2025), d\u00e9ploie un dispositif exceptionnel et int\u00e9gr\u00e9 afin d\u2019assurer des d\u00e9placements fluides et s\u00e9curis\u00e9s, d\u2019offrir aux supporters un accueil de qualit\u00e9 et de contribuer activement \u00e0 la r\u00e9ussite de cet \u00e9v\u00e9nement continental majeur. [telquel.ma]\n-------------------------------------------------\nPartenaire officiel de la Coupe d\u2019Afrique des Nations (CAN) 2025, l\u2019Office national des chemins de fer (ONCF) a annonc\u00e9 la mise en place d\u2019un dispositif exceptionnel destin\u00e9 \u00e0 garantir la fluidit\u00e9 et la s\u00e9curit\u00e9 des d\u00e9placements des supporters vers les villes h\u00f4tes desservies par le r\u00e9seau ferroviaire. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019Office National des Chemins de Fer (ONCF), en sa qualit\u00e9 de sponsor officiel de la Coupe d\u2019Afrique des Nations TotalEnergies Maroc (CAN-2025), d\u00e9ploie un dispositif exceptionnel et int\u00e9gr\u00e9 afin d\u2019assurer des d\u00e9placements fluides et s\u00e9curis\u00e9s, d\u2019offrir aux supporters un accueil de qualit\u00e9 et de contribuer activement \u00e0 la r\u00e9ussite de cet \u00e9v\u00e9nement continental majeur. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le minist\u00e8re de l\u2019\u00c9quipement et\nde l\u2019Eau a indiqu\u00e9 que...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau a indiqu\u00e9 que certains axes routiers relevant des provinces o\u00f9 sont pr\u00e9vues des chutes de neige denses et de fortes pluies orageuses peuvent conna\u00eetre des perturbations de la circulation, exhortant les usagers de la route \u00e0 reporter leur voyage \u00e0 travers ces provinces, sauf en cas de force. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau alerte sur des perturbations de la circulation sur certains axes routiers des provinces touch\u00e9es par de fortes pluies et des chutes de neige denses entre le 15 et le 17 d\u00e9cembre, appelant les usagers \u00e0 reporter leurs d\u00e9placements ou \u00e0 prendre toutes les pr\u00e9cautions n\u00e9cessaires. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Suite aux Instructions du roi\nMohammed VI, que Dieu L\u2019assiste,...", "mass": 5, "physics": false, "shape": "box", "title": "Suite aux Instructions du roi Mohammed VI, que Dieu L\u2019assiste, la Fondation Mohammed V pour la Solidarit\u00e9 a enclench\u00e9 l\u2019op\u00e9ration \u201cGrand Froid\u201d, visant \u00e0 apporter une aide humanitaire d\u2019urgence aux populations touch\u00e9es par la vague de froid qui s\u00e9vit actuellement dans plusieurs provinces du Royaume. [telquel.ma]\n-------------------------------------------------\nSuite aux Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, la Fondation Mohammed V pour la Solidarit\u00e9 a enclench\u00e9 l\u2019op\u00e9ration \u201cGrand Froid\u201d, visant \u00e0 apporter une aide humanitaire d\u2019urgence aux populations touch\u00e9es par la vague de froid qui s\u00e9vit actuellement dans plusieurs provinces du Royaume. [www.lereporter.ma]\n-------------------------------------------------\nSous limpulsion du Roi Mohammed VI, la Fondation Mohammed V pour la Solidarit\u00e9 a lanc\u00e9 l\u2019op\u00e9ration \u00abGrand Froid\u00bb, visant \u00e0 fournir une aide humanitaire d\u2019urgence aux populations touch\u00e9es par la vague de froid s\u00e9vissant actuellement dans plusieurs provinces du Maroc. [www.yabiladi.com]\n-------------------------------------------------\nMohammed VI, la Fondation Mohammed V pour la solidarit\u00e9 lance l\u2019op\u00e9ration \u201cGrand Froid\u201d. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "En ex\u00e9cution des instructions du\nroi Mohammed VI, le minist\u00e8re...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions du roi Mohammed VI, le minist\u00e8re de l\u2019Int\u00e9rieur a proc\u00e9d\u00e9, en \u00e9troite coordination avec l\u2019ensemble des secteurs gouvernementaux, services et \u00e9tablissements concern\u00e9s, au rel\u00e8vement des niveaux de mobilisation afin de faire face aux r\u00e9percussions potentielles des fluctuations m\u00e9t\u00e9orologiques susceptibles d\u2019\u00eatre enregistr\u00e9es durant la saison hivernale 2025-2026. [telquel.ma]\n-------------------------------------------------\nEn ex\u00e9cution des hautes instructions du Roi Mohammed VI, le minist\u00e8re de l\u2019Int\u00e9rieur en \u00e9troite coordination avec les diff\u00e9rents d\u00e9partements gouvernementaux, services et institutions concern\u00e9s, s\u2019est employ\u00e9 \u00e0 \u00e9lever le niveau de mobilisation pour faire face aux \u00e9ventuelles r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques durant l\u2019hiver 2025-2026. [atlasinfo.fr]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, le minist\u00e8re de l\u2019Int\u00e9rieur, en \u00e9troite coordination avec les diff\u00e9rents d\u00e9partements gouvernementaux, services et institutions concern\u00e9s, s\u2019est employ\u00e9 \u00e0 \u00e9lever le niveau de mobilisation pour faire face aux \u00e9ventuelles r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques durant l\u2019hiver 2025-2026. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "\u00c0 quelques jours du coup\nd\u2019envoi de la Coupe d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 quelques jours du coup d\u2019envoi de la Coupe d\u2019Afrique des Nations (CAN 2025), pr\u00e9vu le 21 d\u00e9cembre, l\u2019Office des Changes a engag\u00e9 un ensemble de mesures destin\u00e9es \u00e0 accompagner l\u2019accueil des visiteurs \u00e9trangers et des Marocains R\u00e9sidant \u00e0 l\u2019\u00c9tranger (MRE), dans un contexte marqu\u00e9 par un afflux important de supporters et par des exigences. [telquel.ma]\n-------------------------------------------------\nEn pr\u00e9vision de la Coupe d\u2019Afrique des Nations (CAN 2025), qui d\u00e9butera le 21 d\u00e9cembre au Maroc, l\u2019Office des Changes a mis en \u0153uvre un dispositif global d\u2019accompagnement \u00e0 destination des visiteurs \u00e9trangers et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE). [leseco.ma]\n-------------------------------------------------\n\u00c0 quelques jours du coup d\u2019envoi de la Coupe d\u2019Afrique des Nations (CAN 2025), pr\u00e9vu le 21 d\u00e9cembre, l\u2019Office des Changes a engag\u00e9 un ensemble de mesures destin\u00e9es \u00e0 accompagner l\u2019accueil des visiteurs \u00e9trangers et des Marocains R\u00e9sidant \u00e0 l\u2019\u00c9tranger (MRE), dans un contexte marqu\u00e9 par un afflux important de supporters et par des exigences [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "L\u2019op\u00e9rateur marocain a contract\u00e9 aupr\u00e8s\nde Medusa Submarine Cable System...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9rateur marocain a contract\u00e9 aupr\u00e8s de Medusa Submarine Cable System une liaison \u00ab tr\u00e8s haut d\u00e9bit \u00bb de 1 416 kilom\u00e8tres reliant Nador. [telquel.ma]\n-------------------------------------------------\nL\u0027op\u00e9rateur a contract\u00e9 aupr\u00e8s de Medusa Submarine Cable System une liaison tr\u00e8s haut d\u00e9bit de 1.416 kilom\u00e8tres, reliant Nador \u00e0 Marseille, renfor\u00e7ant la connectivit\u00e9 internationale du Maroc. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le secr\u00e9taire g\u00e9n\u00e9ral de la\nConf\u00e9d\u00e9ration africaine de football (CAF),...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration africaine de football (CAF), V\u00e9ron Mosengo-Omba, a affirm\u00e9, mardi \u00e0 Rabat, que la Coupe d\u2019Afrique des Nations (CAN), qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, sera \u00ab la meilleure jamais organis\u00e9e \u00bb, assurant que plus d\u2019un million de billets sont d\u00e9j\u00e0 vendus. [telquel.ma]\n-------------------------------------------------\nPoint de presse Le secr\u00e9taire g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration africaine de football (CAF), V\u00e9ron Mosengo-Omba, a affirm\u00e9, mardi \u00e0 Rabat, que la Coupe d\u2019Afrique des Nations (CAN), qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, sera \u00abla meilleure jamais organis\u00e9e\u00bb. [aujourdhui.ma]\n-------------------------------------------------\nLe secr\u00e9taire g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration africaine de football (CAF), V\u00e9ron Mosengo-Omba, a affirm\u00e9, mardi \u00e0 Rabat, que la Coupe d\u2019Afrique des Nations (CAN), qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, sera \u00ab la meilleure jamais organis\u00e9e \u00bb, assurant que plus d\u2019un million de billets sont d\u00e9j\u00e0 vendus. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc s\u2019appr\u00eate \u00e0 accueillir \u00abla meilleure Coupe d\u2019Afrique des Nations jamais organis\u00e9e\u00bb, selon le secr\u00e9taire g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration africaine de football, V\u00e9ron Mosengo-Omba. [leseco.ma]\n-------------------------------------------------\nLe Secr\u00e9taire G\u00e9n\u00e9ral de la CAF, V\u00e9ron Mosengo-Omba, a d\u00e9voil\u00e9 mardi \u00e0 Rabat les pays ayant acquis le plus de billets pour la prochaine Coupe dAfrique des Nations, qui se tiendra au Maroc dans quelques jours. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "L\u2019introduction en Bourse (IPO \u2013\nInitial Public Offering) du groupe...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019introduction en Bourse (IPO \u2013 Initial Public Offering) du groupe SGTM (Soci\u00e9t\u00e9 g\u00e9n\u00e9rale des travaux du Maroc) a \u00e9t\u00e9 sursouscrite 34 fois par plus de 171.000 souscripteurs, soit un taux de satisfaction de 2,94%, a annonc\u00e9, mardi \u00e0 Casablanca, le directeur g\u00e9n\u00e9ral par int\u00e9rim de la Bourse de Casablanca, Mohamed Saad. [telquel.ma]\n-------------------------------------------------\nL\u0027introduction en Bourse (IPO \u2013 Initial Public Offering) du groupe SGTM (Soci\u00e9t\u00e9 g\u00e9n\u00e9rale des travaux du Maroc) a \u00e9t\u00e9 sursouscrite 34 fois par plus de 171.000 souscripteurs, soit un taux de satisfaction de 2,94%, a annonc\u00e9, mardi \u00e0 Casablanca, le directeur g\u00e9n\u00e9ral adjoint de la Bourse de Casablanca, Mohamed Saad. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Marsa Maroc a acquis 45%\ndu capital et des droits...", "mass": 5, "physics": false, "shape": "box", "title": "Marsa Maroc a acquis 45% du capital et des droits de vote de l\u2019espagnol Boluda Corporacion Maritima (BMT), op\u00e9rateur implant\u00e9 dans 9 ports situ\u00e9s entre la p\u00e9ninsule ib\u00e9rique [www.challenge.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur portuaire marocain Marsa r\u00e9ussit une op\u00e9ration tr\u00e8s strat\u00e9gique, avec l\u2019acquisition de 45% de la filiale portuaire du groupe espagnol Boluda Maritime Terminals. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Initiative L\u2019association Casam\u00e9moire a annonc\u00e9,\nlundi soir \u00e0 l\u2019American Arts...", "mass": 5, "physics": false, "shape": "box", "title": "Initiative L\u2019association Casam\u00e9moire a annonc\u00e9, lundi soir \u00e0 l\u2019American Arts Center \u00e0 Casablanca, le lancement du programme culturel \u00abSport, Ville et Patrimoine\u00bb, une initiative qui vise \u00e0 mettre en lumi\u00e8re le lien \u00e9troit entre le sport, l\u2019histoire urbaine et le patrimoine architectural de la capitale \u00e9conomique. [aujourdhui.ma]\n-------------------------------------------------\n\u00c0 Casablanca, l\u2019association Casam\u00e9moire organise le programme \u00ab Sport, Ville et Patrimoine \u00bb, une initiative consacr\u00e9e \u00e0 la mani\u00e8re dont les pratiques sportives ont contribu\u00e9 \u00e0 fa\u00e7onner l\u2019histoire urbaine et la m\u00e9moire collective de la m\u00e9tropole. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le groupe pharmaceutique Sothema a\nfinalis\u00e9 l\u2019acquisition de 99,99 %...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe pharmaceutique Sothema a finalis\u00e9 l\u2019acquisition de 99,99 % du capital de Soludia Maghreb, acteur majeur de l\u2019h\u00e9modialyse au Maroc, consolidant ainsi sa position sur le march\u00e9 marocain et en Afrique. [www.lavieeco.com]\n-------------------------------------------------\nSothema a annonc\u00e9 le closing de l\u2019op\u00e9ration relative \u00e0 l\u2019acquisition de 99,99 % du capital de la soci\u00e9t\u00e9 Soludia Maghreb (\u00ab Soludia \u00bb), un acteur de r\u00e9f\u00e9rence dans le domaine de l\u2019. [lematin.ma]\n-------------------------------------------------\nSothema a annonc\u00e9 le 17 d\u00e9cembre 2025 \u00ab le closing de l\u2019op\u00e9ration portant sur l\u2019acquisition de 99,99% du capital de la soci\u00e9t\u00e9 Soludia Maghreb (\u00ab Soludia \u00bb) \u00bb, selon un communiqu\u00e9 de presse. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "ACWA Power a sign\u00e9 un\ncadre de coop\u00e9ration avec la...", "mass": 5, "physics": false, "shape": "box", "title": "ACWA Power a sign\u00e9 un cadre de coop\u00e9ration avec la Banque africaine de d\u00e9veloppement (BAD) en marge du Forum d\u2019investissement en Afrique \u00e0 Rabat, visant \u00e0 mobiliser jusqu\u2019\u00e0 5 milliards de dollars (pr\u00e8s de 45,9 MMDH), entre 2025 et 2030, pour financer des projets d\u2019\u00e9nergie renouvelable et de dessalement de l\u2019eau sur le continent. [www.lavieeco.com]\n-------------------------------------------------\nACWA Power et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, en marge du Forum d\u2019investissement en Afrique tenu \u00e0 Rabat, un cadre de coop\u00e9ration visant \u00e0 renforcer leur collaboration dans le d\u00e9veloppement, l\u2019investissement et le financement de projets durables dans les secteurs de l\u2019\u00e9nergie et de l\u2019eau \u00e0 l\u2019\u00e9chelle du continent africain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "\u00c0 l\u2019occasion de la Coupe\nd\u2019Afrique des nations 2025, l\u2019Office...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la Coupe d\u2019Afrique des nations 2025, l\u2019Office national des a\u00e9roports (ONDA) am\u00e9nage des fan-zones dans les a\u00e9roports du Royaume afin de permettre aux voyageurs de suivre les matchs en direct et de vivre l\u2019ambiance de la CAN, m\u00eame en transit. [www.lavieeco.com]\n-------------------------------------------------\nPour la Coupe d\u2019Afrique des Nations 2025, l\u0027Office National des A\u00e9roports (ONDA) a mis en place des Fan zones aux a\u00e9roports sp\u00e9cialement am\u00e9nag\u00e9es pour permettre aux voyageurs et passagers en voyage ou en transit de suivre les matchs en direct, de vibrer \u00e0 chaque but et de plonger dans l\u2019ambiance de la comp\u00e9tition. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Royal Air Maroc (RAM) et\nMalaysia Airlines ont sign\u00e9, r\u00e9cemment,...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc (RAM) et Malaysia Airlines ont sign\u00e9, r\u00e9cemment, une convention de partage de codes (code share), visant \u00e0 offrir aux voyageurs une connectivit\u00e9 renforc\u00e9e, des avantages de voyage \u00e9largis et une exp\u00e9rience fluide \u00e0 travers les vols des deux transporteurs en Afrique, en Europe et en Asie. [leseco.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) et Malaysia Airlines ont sign\u00e9, r\u00e9cemment, une convention de partage de codes (code share), visant \u00e0 offrir aux voyageurs une connectivit\u00e9 renforc\u00e9e, des avantages de voyage \u00e9largis et une exp\u00e9rience fluide \u00e0 travers les vols des deux transporteurs en Afrique, en Europe et en Asie. [lnt.ma]\n-------------------------------------------------\nLe groupe Malaysia Aviation Group (MAG) et Royal Air Maroc ont conclu un accord strat\u00e9gique de partage de codes visant \u00e0 renforcer la connectivit\u00e9 et les droits de voyage des passagers sur les liaisons en Afrique, en Europe et en Asie. [www.lopinion.ma]\n-------------------------------------------------\nEn tant que membres de lalliance oneworld, ce partenariat ambitionne doffrir aux voyageurs une flexibilit\u00e9 accrue, des avantages \u00e9largis et un parcours simplifi\u00e9 \u00e0 travers leurs r\u00e9seaux combin\u00e9s, selon un communiqu\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "Le ministre de la Justice,\nAbdellatif Ouahbi, conduit la d\u00e9l\u00e9gation...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Justice, Abdellatif Ouahbi, conduit la d\u00e9l\u00e9gation du Maroc participant \u00e0 la 11e session ordinaire du Comit\u00e9 technique sp\u00e9cialis\u00e9 de l\u2019Union africaine (UA) sur la Justice et les affaires juridiques (CTS-JAJ), dont les travaux ont d\u00e9but\u00e9 mardi \u00e0 Nairobi. [fr.hespress.com]\n-------------------------------------------------\nAu cours de cette session, pr\u00e9sid\u00e9e par les ministres de la Justice des \u00c9tats membres, Abdellatif Ouahbi, qui conduit la d\u00e9l\u00e9gation marocaine, a pris part \u00e0 l\u2019examen du rapport issu de la r\u00e9union des experts juridiques gouvernementaux, ainsi qu\u2019\u00e0 la discussion de plusieurs projets d\u2019instruments juridiques strat\u00e9giques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Les \u00e9l\u00e9ments de la police\nont \u00e9t\u00e9 fortement mobilis\u00e9s dans...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9l\u00e9ments de la police ont \u00e9t\u00e9 fortement mobilis\u00e9s dans la r\u00e9solution d\u2019affaires li\u00e9es au trafic de s d\u00e9p\u00f4ts aupr\u00e8s des banques se sont \u00e9tablis \u00e0 1.299 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en progression annuelle de 7,1%, selon le r\u00e9cent tableau de bord \u00ab Cr\u00e9dits-D\u00e9p\u00f4ts bancaires \u00bb de Bank Al-Maghrib (BAM). [telquel.ma]\n-------------------------------------------------\nCe volume repr\u00e9sente une hausse de 19% en glissement annuel et de 15,2% par rapport \u00e0 fin d\u00e9cembre 2024, pr\u00e9cise Bank Al-Maghrib dans son r\u00e9cent tableau de bord \"Cr\u00e9dits-D\u00e9p\u00f4ts bancaires\". [www.lavieeco.com]\n-------------------------------------------------\nLes d\u00e9p\u00f4ts aupr\u00e8s des banques se sont \u00e9tablis \u00e0 1.299 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en progression annuelle de 7,1%, selon le r\u00e9cent tableau de bord \u00ab Cr\u00e9dits-D\u00e9p\u00f4ts bancaires \u00bb de Bank Al-Maghrib (BAM). [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019encours du cr\u00e9dit bancaire s\u2019est \u00e9tabli \u00e0 1.188,2 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, enregistrant une hausse de 6% par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Parti du progr\u00e8s et\ndu socialisme (PPS) a appel\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parti du progr\u00e8s et du socialisme (PPS) a appel\u00e9 le gouvernement \u00e0 tirer les enseignements des r\u00e9cents \u00e9v\u00e9nements catastrophiques, en mettant l\u2019accent sur la pr\u00e9vention des risques et la r\u00e9duction des d\u00e9g\u00e2ts li\u00e9s aux catastrophes naturelles. [telquel.ma]\n-------------------------------------------------\nPour y parvenir, il est imp\u00e9ratif de faire appliquer rigoureusement les     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
