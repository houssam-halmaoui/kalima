na Machado offre sa m\u00e9daille Nobel \u00e0 Donald Trump\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/maria-corina-machado-offre-sa-medaille-nobel-a-donald-trump.html", "x": 0, "y": 0}, {"font": {"vadjust": -124.5}, "group": 17, "id": 241, "label": "Al Mada annonce la nomination...", "shape": "dot", "size": 83, "title": "Al Mada annonce la nomination de Mme Noufissa Kessar en tant que Pr\u00e9sidente-Directrice G\u00e9n\u00e9rale\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/al-mada-annonce-la-nomination-de-mme-noufissa-kessar-en-tant-que-presidente-directrice-generale.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Selon un rapport publi\u00e9 par\nla Conf\u00e9d\u00e9ration africaine de football,...", "mass": 5, "physics": false, "shape": "box", "title": "Selon un rapport publi\u00e9 par la Conf\u00e9d\u00e9ration africaine de football, la Coupe d\u2019Afrique des nations 2025, organis\u00e9e au Maroc, s\u2019impose comme l\u2019\u00e9dition la plus performante de l\u2019histoire de la comp\u00e9tition sur le plan commercial. [fr.hespress.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9 que la Coupe dAfrique des nations (CAN 2025), organis\u00e9e par le Maroc, est devenue l\u00e9dition la plus r\u00e9ussie commercialement dans lhistoire du continent, g\u00e9n\u00e9rant une augmentation de plus de 90% des revenus de la CAF. [www.yabiladi.com]\n-------------------------------------------------\nLa Coupe d\u2019Afrique des Nations (CAN) Maroc 2025 s\u2019impose d\u00e9sormais comme le plus grand succ\u00e8s commercial de l\u2019histoire du football africain, avec des revenus en hausse de plus de 90%, selon la Conf\u00e9d\u00e9ration africaine de Football (CAF). [maroc-diplomatique.net]\n-------------------------------------------------\nLa Coupe d\u0027Afrique des Nations (CAN) Maroc 2025 s\u2019impose d\u00e9sormais comme le plus grand succ\u00e8s commercial de l\u2019histoire du football africain, avec des revenus en hausse de plus de 90%, selon la Conf\u00e9d\u00e9ration africaine de Football (CAF). [leseco.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a publi\u00e9 un bilan \u00e9conomique exceptionnel de la TotalEnergies CAF Coupe d\u2019Afrique des Nations Maroc 2025, qualifi\u00e9e de \u00ab plus grand succ\u00e8s commercial de l\u2019histoire du football africain \u00bb avec une hausse de plus de 90 % des revenus. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le minist\u00e8re de l\u2019\u00c9ducation nationale,\ndu Pr\u00e9scolaire et des Sports...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9, vendredi, le report des dates de tenue des deux examens unifi\u00e9s locaux concernant les cycles de l\u2019enseignement primaire et du secondaire coll\u00e9gial, ainsi que la reprogrammation des devoirs du contr\u00f4le continu. [fr.hespress.com]\n-------------------------------------------------\nDans un communiqu\u00e9 publi\u00e9 ce vendredi 16 janvier, le minist\u00e8re de l\u2019\u00c9ducation nationale, de l\u2019Enseignement pr\u00e9scolaire et des Sports a annon. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 vendredi le report de l\u2019examen unifi\u00e9 local et des devoirs du contr\u00f4le continu dans les cycles de l\u2019enseignement primaire et de l\u2019enseignement secondaire coll\u00e9gial, initialement pr\u00e9vus au titre du premier semestre de l\u2019ann\u00e9e scolaire 2025-2026. [telquel.ma]\n------------------ 00e9 de presse du d\u00e9partement. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le 25 janvier 2026, les\nsalons historiques du Crillon accueilleront...", "mass": 5, "physics": false, "shape": "box", "title": "Le 25 janvier 2026, les salons historiques du Crillon accueilleront un d\u00e9fil\u00e9 exclusif de deux marques venues du Sultanat d\u2019Oman, Yoland Fashion House et des \u00c9mirats arabes unis, R. [lematin.ma]\n-------------------------------------------------\nLe 25 janvier 2026, les salons historiques du Crillon accueilleront un d\u00e9fil\u00e9 exclusif de deux marques venues du Sultanat d\u2019Oman, Yoland Fashion House et des Emirats Arabes Unis, . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Suite au d\u00e9c\u00e8s de M.\nHassan Ouriagli, Pr\u00e9sident Directeur G\u00e9n\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "Suite au d\u00e9c\u00e8s de M. Hassan Ouriagli, Pr\u00e9sident Directeur G\u00e9n\u00e9ral d\u2019Al Mada, le Conseil d\u2019administration, r\u00e9uni le 16 janvier 2026, lui a rendu hommage pour son leadership, ses nom. [lematin.ma]\n-------------------------------------------------\nSuite au d\u00e9c\u00e8s de Hassan Ouriagli, Pr\u00e9sident-Directeur G\u00e9n\u00e9ral d\u2019Al Mada, le Conseil d\u2019administration du groupe a d\u00e9cid\u00e9 de nommer Mme Noufissa Kessar \u00e0 ce poste, avec effet imm\u00e9diat. [www.challenge.ma]\n-------------------------------------------------\nSuite au d\u00e9c\u00e8s de Hassan Ouriagli, PDG dAl Mada, survenu d\u00e9but janvier \u00e0 Paris, le Conseil dadministration du groupe a annonc\u00e9 la nomination de Noufissa Kessar comme nouvelle Pr\u00e9sidente-Directrice G\u00e9n\u00e9rale. [www.yabiladi.com]\n------------------------------------------
