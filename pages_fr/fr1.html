ne, Azzeddine Farhane, a \u00e9t\u00e9 \u00e9lu vice-pr\u00e9sident du 15e Congr\u00e8s des Nations Unies pour la pr\u00e9vention du crime et la justice p\u00e9nale, au nom du Groupe africain, dont les travaux se sont ouverts samedi \u00e0 Abou Dhabi. [fr.hespress.com]\n-------------------------------------------------\nLes autres membres du Bureau du Congr\u00e8s de l\u2019ONU pour la pr\u00e9vention du crime et la justice p\u00e9nale, \u00e0 l\u2019exception du pr\u00e9sident, ont \u00e9galement \u00e9t\u00e9 \u00e9lus lors de cette rencontre, organ. [lematin.ma]\n-------------------------------------------------\nL\u2019ambassadeur Azzeddine Farhane repr\u00e9sentera le Groupe africain au sein du Bureau du 15e Congr\u00e8s des Nations Unies pour la pr\u00e9vention du crime et la justice p\u00e9nale, ouvert samedi \u00e0 Abou Dhabi. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "En marge des travaux de\nla 81e session de l\u2019Assembl\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "En marge des travaux de la 81e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations Unies \u00e0 New York, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, s\u2019est entretenu ce vendredi 25 septembre, avec le ministre \u00e9mirati de l\u2019Industrie et des Technologies avanc\u00e9es, Sultan Ahmed Al Jaber. [fr.hespress.com]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e \u00e0 l\u2019occasion d\u2019une rencontre entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bou. [lematin.ma]\n-------------------------------------------------\nSelon le ministre arm\u00e9nien des Affaires \u00e9trang\u00e8res, Ararat Mirzoyan, ce plan \u00abouvre la voie au renforcement de l\u2019unit\u00e9 territoriale du Royaume du Maroc\u00bb, apr\u00e8s une rencontre avec son homologue marocain, Nasser Bourita. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre russe des Affaires \u00e9trang\u00e8res, Sergue\u00ef Lavrov, et le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger du Royaume du Maroc, Nasser Bourita, ont tenu une r\u00e9union en marge de la semaine de haut niveau de la 81e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies \u00e0 New York. [atlasinfo.fr]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e \u00e0 l\u2019occasion d\u2019une rencontre entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue arm\u00e9nien, [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le chanteur marocain Saad Lamjarred\na \u00e9t\u00e9 condamn\u00e9 \u00e0 dix...", "mass": 5, "physics": false, "shape": "box", "title": "Le chanteur marocain Saad Lamjarred a \u00e9t\u00e9 condamn\u00e9 \u00e0 dix ans de prison ferme par la cour d\u2019assises de Cr\u00e9teil, \u00e0 l\u2019issue de son proc\u00e8s en appel dans l\u2019affaire remontant \u00e0 2016, a confirm\u00e9 \u00e0 Hespress FR une source tr\u00e8s proche de sa famille. [fr.hespress.com]\n-------------------------------------------------\nSaad Lamjarred avait \u00e9t\u00e9 condamn\u00e9 en 2023 \u00e0 six ans de prison par la cour d\u0027assises de Paris. [lematin.ma]\n-------------------------------------------------\nLe chanteur marocain Saad Lamjarred a \u00e9t\u00e9 condamn\u00e9 en appel samedi \u00e0 Cr\u00e9teil \u00e0 dix ans de r\u00e9clusion criminelle pour viol, une peine plus lourde qu\u2019en premi\u00e8re instance. [telquel.ma]\n-------------------------------------------------\nLa cour criminelle du Val-de-Marne, \u00e0 Cr\u00e9teil, a condamn\u00e9 vendredi le chanteur marocain Saad Lamjarred \u00e0 dix ans de r\u00e9clusion criminelle et a ordonn\u00e9 son placement en d\u00e9tention, dans une affaire de viol remontant \u00e0 2016. [www.yabiladi.com]\n-------------------------------------------------\nLe chanteur marocain Saad Lamjarred a \u00e9t\u00e9 condamn\u00e9 en appel, samedi, par la cour d\u2019appel de Cr\u00e9teil, \u00e0 une peine de dix ans de r\u00e9clusion criminelle pour des faits de viol, une sanction plus s\u00e9v\u00e8re que celle prononc\u00e9e lors du jugement en premi\u00e8re instance. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "N\u00e9 en 1939 \u00e0 Tanger,\nHamid Barrada, dipl\u00f4m\u00e9 en philosophie,...", "mass": 5, "physics": false, "shape": "box", "title": "N\u00e9 en 1939 \u00e0 Tanger, Hamid Barrada, dipl\u00f4m\u00e9 en philosophie, en droit et en sociologie politique, avait rejoint l\u2019hebdomadaire \u00abJeune Afrique\u00bb, o\u00f9 il est devenu grand reporter. [lematin.ma]\n-------------------------------------------------\nGrand reporter, r\u00e9dacteur en chef et pr\u00e9sentateur de t\u00e9l\u00e9vision, Hamid Barrada est d\u00e9c\u00e9d\u00e9 dans la nuit de vendredi \u00e0 samedi. [www.lavieeco.com]\n-------------------------------------------------\nN\u00e9 en 1939 \u00e0 Tanger, le d\u00e9funt, dipl\u00f4m\u00e9 en philosophie, en droit et en sociologie politique, avait rejoint l\u2019hebdomadaire \u00abJeune Afrique\u00bb, o\u00f9 il est devenu grand reporter. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Nous avons r\u00e9affirm\u00e9 l\u0027amiti\u00e9 s\u00e9culaire\nliant nos deux pays ainsi...", "mass": 5, "physics": false, "shape": "box", "title": "Nous avons r\u00e9affirm\u00e9 l\u0027amiti\u00e9 s\u00e9culaire liant nos deux pays ainsi que notre vision commune pour le d\u00e9veloppement de la r\u00e9gion du Sahara et pour une coop\u00e9ration renforc\u00e9e. [lematin.ma]\n-------------------------------------------------\nVendredi, \u00e0 New York, le ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a rencontr\u00e9 le secr\u00e9taire d\u2019\u00c9tat adjoint am\u00e9ricain, Christopher Landau. [www.yabiladi.com]\n-------------------------------------------------\nLe Secr\u00e9taire d\u2019\u00c9tat adjoint am\u00e9ricain, M. Christopher Landau, a affirm\u00e9, vendredi \u00e0 New York, l\u2019engagement des \u00c9tats-Unis pour le d\u00e9veloppement de la r\u00e9gion du Sahara sous la souverainet\u00e9 du Royaume du Maroc. \u00ab [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cette r\u00e9union intervient au moment\no\u00f9 l\u2019Initiative Africaine Atlantique, lanc\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Cette r\u00e9union intervient au moment o\u00f9 l\u2019Initiative Africaine Atlantique, lanc\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI, marque des consolidations significatives et gagne en importance.L. [lematin.ma]\n-------------------------------------------------\nR\u00e9unis vendredi \u00e0 New York, les ministres des Affaires \u00e9trang\u00e8res du PEAA ont dress\u00e9 un bilan positif de l\u0027Initiative Africaine Atlantique, tout en appelant \u00e0 acc\u00e9l\u00e9rer sa mise en \u0153uvre. [www.lavieeco.com]\n-------------------------------------------------\nLe Processus des Etats Africains Atlantiques (PEAA) a tenu, vendredi \u00e0 New York, sa 8e r\u00e9union des ministres des Affaires \u00e9trang\u00e8res, sous la pr\u00e9sidence du ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019Union constitutionnelle (UC) et le\nMouvement d\u00e9mocratique et social (MDS)...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union constitutionnelle (UC) et le Mouvement d\u00e9mocratique et social (MDS) ont annonc\u00e9 leur d\u00e9cision de former \u00e0 nouveau un groupe parlementaire commun \u00e0 la Chambre des repr\u00e9sentants au cours de la douzi\u00e8me l\u00e9gislature, \u00e0 l\u2019issue de concertations entre les directions et les parlementaires des deux partis. [telquel.ma]\n-------------------------------------------------\nL\u2019Union constitutionnelle (UC) et le Mouvement d\u00e9mocratique et social (MDS) ont annonc\u00e9 leur d\u00e9cision de former, \u00e0 nouveau, un groupe parlementaire commun \u00e0 la Chambre des repr\u00e9sentants au titre de la 12e l\u00e9gislature, \u00e0 l\u2019issue de consultations men\u00e9es entre les responsables des deux partis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les r\u00e9sultats finaux des \u00e9lections\nl\u00e9gislatives du 23 septembre 2026,...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9sultats finaux des \u00e9lections l\u00e9gislatives du 23 septembre 2026, annonc\u00e9s par les commissions provinciales et r\u00e9gionales, confirment les r\u00e9sultats provisoires pr\u00e9c\u00e9demment communiqu\u00e9s, indique un communiqu\u00e9 du minist\u00e8re de lInt\u00e9rieur ce vendredi. [www.yabiladi.com]\n-------------------------------------------------\nLes r\u00e9sultats d\u00e9finitifs des \u00e9lections l\u00e9gislatives organis\u00e9es le mercredi 23 septembre 2026, proclam\u00e9s par les commissions provinciales et r\u00e9gionales de recensement, correspondent parfaitement aux r\u00e9sultats g\u00e9n\u00e9raux provisoires annonc\u00e9s pr\u00e9c\u00e9demment, indique vendredi un communiqu\u00e9 du ministre de l\u0027Int\u00e9rieur. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le ministre des Affaires \u00e9trang\u00e8res\na r\u00e9affirm\u00e9, vendredi \u00e0 New...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res a r\u00e9affirm\u00e9, vendredi \u00e0 New York, l\u0027engagement du Maroc aux c\u00f4t\u00e9s des pays du Sahel, port\u00e9e par la Vision de Sa Majest\u00e9 le Roi Mohammed VI en faveur de la s\u00e9curit\u00e9, du d\u00e9veloppement et de la prosp\u00e9rit\u00e9 de la r\u00e9gion. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a mis en avant, vendredi \u00e0 New York, la Vision de Sa Majest\u00e9 le Roi Mohammed VI pour accompagner les pays du Sahel dans leurs efforts en faveur de la s\u00e9curit\u00e9, du d\u00e9veloppement et de la prosp\u00e9rit\u00e9. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La s\u00e9lection marocaine de football\ns\u2019est impos\u00e9e (2-0) face \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football s\u2019est impos\u00e9e (2-0) face \u00e0 son homologue gabonaise, vendredi soir au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour la premi\u00e8re journ\u00e9e du Groupe A des \u00e9liminatoires de la Coupe d\u2019Afrique des Nati         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
