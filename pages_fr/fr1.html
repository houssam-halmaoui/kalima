seco.ma/maroc/sahara-marocain-quel-role-pour-lonu-apres-la-minurso.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 0, "id": 104, "label": "M. Nasser Bourita s\u2019entretient \u00e0...", "shape": "dot", "size": 47, "title": "M. Nasser Bourita s\u2019entretient \u00e0 Essaouira avec son homologue fran\u00e7ais M. Jean-No\u00ebl Barrot\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/m-nasser-bourita-sentretient-a-essaouira-avec-son-homologue-francais-m-jean-noel-barrot/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 6, "id": 107, "label": "\u00c9liminatoires CAN-2027 : le Maroc...", "shape": "dot", "size": 47, "title": "\u00c9liminatoires CAN-2027 : le Maroc domine le Niger (5-1) et se rapproche de la qualification\nSource: lnt.ma", "url": "https://lnt.ma/eliminatoires-can-2027-le-maroc-domine-le-niger-5-1-et-se-rapproche-de-la-qualification/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 7, "id": 129, "label": "Espagne : Jes\u00fas Owono \u00e9cope...", "shape": "dot", "size": 47, "title": "Espagne : Jes\u00fas Owono \u00e9cope de 12 matchs de suspension apr\u00e8s le drame de Tenerife\nSource: maroc-diplomatique.net", "url": "https://maroc-diplomatique.net/espagne-jesus-owono-ecope-de-12-matchs-de-suspension-apres-le-drame-de-tenerife/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le quotidien sportif espagnol AS\nn\u2019a pas tari d\u2019\u00e9loges sur...", "mass": 5, "physics": false, "shape": "box", "title": "Le quotidien sportif espagnol AS n\u2019a pas tari d\u2019\u00e9loges sur Achraf Hakimi apr\u00e8s la large victoire du Maroc face au Niger (5-1), vendredi soir, en \u00e9liminatoires de la CAN. [fr.hespress.com]\n-------------------------------------------------\nLe quotidien sportif espagnol AS a salu\u00e9, samedi, le talent \u00ab hors pair \u00bb de l\u2019international marocain Achraf Hakimi, qu\u2019il consid\u00e8re comme le \u00ab meilleur lat\u00e9ral du monde \u00bb, mettant en avant son r\u00f4le d\u00e9terminant dans la large victoire des Lions de l\u2019Atlas face au Niger (5-1), vendredi soir, dans le cadre des \u00e9liminatoires de la Coupe [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Commission de discipline de\nla F\u00e9d\u00e9ration espagnole de football...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de discipline de la F\u00e9d\u00e9ration espagnole de football a inflig\u00e9 une suspension de 12 matchs \u00e0 Jes\u00fas Owono, gardien de l\u2019Andorra FC, apr\u00e8s son intervention muscl\u00e9e contre Jes\u00fas de Miguel, joueur de Tenerife, d\u00e9c\u00e9d\u00e9 au lendemain de leur rencontre en deuxi\u00e8me division espagnole. [fr.hespress.com]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale espagnole de football (RFEF) a annonc\u00e9 avoir inflig\u00e9 une suspension de douze matches au gardien de but du FC Andorre, Jes\u00fas Owono, \u00e0 la suite du choc survenu avec l\u2019attaquant de Tenerife, Jes\u00fas de Miguel, qui a succomb\u00e9 \u00e0 ses blessures. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La Cheffe du gouvernement, Fatima\nEzzahra El Mansouri, est arriv\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "La Cheffe du gouvernement, Fatima Ezzahra El Mansouri, est arriv\u00e9e samedi \u00e0 Phnom Penh pour repr\u00e9senter Sa Majest\u00e9 le Roi Mohammed VI au 20e Sommet de la Francophonie, pr\u00e9vu les 15 et 16 novembre dans la capitale cambodgienne. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 son arriv\u00e9e \u00e0 l\u2019a\u00e9roport international de Techo, Mme El Mansouri a \u00e9t\u00e9 accueillie par Un Kheang, secr\u00e9taire d\u2019\u00c9tat au minist\u00e8re cambodgien des Affaires \u00e9trang\u00e8res et de la Coop\u00e9r. [lematin.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, est arriv\u00e9e, samedi 14 novembre \u00e0 Phnom Penh, pour repr\u00e9senter le roi Mohammed VI au 20e Sommet de la francophonie, pr\u00e9vu les 15 et 16 novembre dans la capitale cambodgienne. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette nouvelle structure traduit, une\nnouvelle fois, la Haute Sollicitude...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle structure traduit, une nouvelle fois, la Haute Sollicitude de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, pour la promotion du secteur de la sant\u00e9, en g\u00e9n. [lematin.ma]\n-------------------------------------------------\nElle a \u00e9galement pr\u00e9sid\u00e9 la signature d\u2019une convention de partenariat entre le minist\u00e8re de la Sant\u00e9 et sa fondation, dans le cadre du Plan Sant\u00e9 mentale 2030. [telquel.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Oumkeltoum, pr\u00e9sidente de la Fondation Lalla Oumkeltoum pour la sant\u00e9 mentale, a effectu\u00e9, vendredi, une visite au nouvel h\u00f4pital psychiatrique de K\u00e9nitra, dot\u00e9 d\u2019une capacit\u00e9 de 120 lits. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le Maroc s\u2019est impos\u00e9 face\nau Niger sur le score...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc s\u2019est impos\u00e9 face au Niger sur le score de 5 buts \u00e0 1, en match de la 3\u00e8 journ\u00e9e du groupe A des \u00e9liminatoires de la Coupe d\u2019Afrique des Nati         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
