019un des plus prestigieux festivals de cin\u00e9ma au monde. [leseco.ma]\n-------------------------------------------------\nLa participation du Maroc en tant que pays \u00e0 l\u2019honneur de l\u2019European Film Market (EFM) a \u00e9t\u00e9 officiellement inaugur\u00e9e mercredi soir \u00e0 Berlin, dans le cadre de la 76-\u00e8me \u00e9dition du Festival international du film de Berlin (Berlinale), en pr\u00e9sence de grandes figures de l\u2019industrie cin\u00e9matographique mondiale. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019industrie et l\u2019\u00e9cosyst\u00e8me cin\u00e9matographiques marocains ont \u00e9t\u00e9 mis sous les projecteurs, mercredi soir, lors de l\u2019inauguration officielle de la participation du Maroc, en qualit\u00e9 de \u201cCountry in focus\u201d, \u00e0 l\u2019European Film Market (EFM), organis\u00e9 dans le cadre de la 76-\u00e8me \u00e9dition du Festival international du film de Berlin (Berlinale), en pr\u00e9sence d\u2019une pl\u00e9iade de professionnels [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Les liaisons maritimes entre les\nports de Tarifa (Cadix) et...", "mass": 5, "physics": false, "shape": "box", "title": "Les liaisons maritimes entre les ports de Tarifa (Cadix) et Tanger ont \u00e9t\u00e9 suspendues jeudi et le seront \u00e9galement vendredi, en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la temp\u00eate \"Nils\", qui affecte le d\u00e9troit de Gibraltar, indiquent les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [leseco.ma]\n-------------------------------------------------\nLes liaisons maritimes entre les ports de Tarifa (Cadix) et Tanger ont \u00e9t\u00e9 suspendues jeudi et le seront \u00e9galement vendredi, en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la temp\u00eate \u00ab         function positionCommunityLabels() {

            var communities = {};

                var node = network.body.nodes[nodeId];
