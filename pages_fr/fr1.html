se, "shape": "box", "title": "Le nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME) a \u00e9t\u00e9 officiellement lanc\u00e9 mardi \u00e0 Errachidia, lors d\u2019une rencontre nationale pr\u00e9sid\u00e9e par. [lematin.ma]\n-------------------------------------------------\nDot\u00e9 d\u2019une approche d\u00e9centralis\u00e9e, ce dispositif ambitionne de soutenir plus efficacement le tissu entrepreneurial national, pilier essentiel de la croissance et de la comp\u00e9titivit\u00e9 du Maroc. [www.lopinion.ma]\n-------------------------------------------------\nLe coup d\u2019envoi du nouveau dispositif de soutien sp\u00e9cifique aux tr\u00e8s petites, petites et moyennes entreprises (TPME), a \u00e9t\u00e9 donn\u00e9 mardi \u00e0 Errachidia, lors d\u2019une rencontre nationale, pr\u00e9sid\u00e9e par le Chef du gouvernement, Aziz Akhannouch. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a affirm\u00e9, mardi \u00e0 Errachidia, que le lancement officiel du nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME) constitue une \u00e9tape essentielle dans le processus de promotion de la justice territoriale et de valorisation des potentialit\u00e9s locales. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le partenariat entre le Conseil\nde la concurrence et le...", "mass": 5, "physics": false, "shape": "box", "title": "Le partenariat entre le Conseil de la concurrence et le Haut-Commissariat au Plan s\u0027inscrit dans le cadre des efforts d\u00e9ploy\u00e9s pour renforcer la transparence \u00e9conomique, am\u00e9lio. [lematin.ma]\n-------------------------------------------------\nLe Conseil de la concurrence et le Haut-Commissariat au Plan (HCP) ont proc\u00e9d\u00e9, mardi \u00e0 Rabat, \u00e0 la signature d\u0027une convention de partenariat visant \u00e0 instaurer un cadre de coop\u00e9ration strat\u00e9gique entre les deux institutions, en mati\u00e8re d\u0027\u00e9change d\u0027informations, de production d\u0027\u00e9tudes conjointes, de formation et d\u0027organisations d\u0027actions de sensibilisation. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de la concurrence et le Haut-commissariat au plan ont sign\u00e9, hier mardi, \u00e0 Rabat, une convention de partenariat visant \u00e0 renforcer la coop\u00e9ration strat\u00e9gique entre les deux institutions. [leseco.ma]\n-------------------------------------------------\nLe Conseil de la concurrence et le Haut-Commissariat au Plan (HCP) ont proc\u00e9d\u00e9, mardi \u00e0 Rabat, \u00e0 la signature d\u2019une convention de partenariat visant \u00e0 instaurer un cadre de coop\u00e9ration strat\u00e9gique entre les deux institutions, en mati\u00e8re d\u2019\u00e9change d\u2019informations, de production d\u2019\u00e9tudes conjointes, de formation et d\u2019organisations d\u2019actions de sensibilisation. [www.lereporter.ma]\n-------------------------------------------------\nLe Conseil de la concurrence et le Haut-Commissariat au Plan (HCP) ont sign\u00e9, mardi \u00e0 Rabat, une convention de partenariat destin\u00e9e \u00e0 instaurer un cadre de coop\u00e9ration strat\u00e9gique en mati\u00e8re d\u2019\u00e9change d\u2019informations, de production d\u2019\u00e9tudes conjointes, de formation et d\u2019actions de sensibilisation. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les 14 ports marocains ouverts\nau commerce international assurent 95%...", "mass": 5, "physics": false, "shape": "box", "title": "Les 14 ports marocains ouverts au commerce international assurent 95% de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a soulign\u00e9 mardi le ministre de l\u0027\u00c9quipement et de l\u0027Eau, Nizar Baraka. [www.lopinion.ma]\n-------------------------------------------------\nLes quatorze ports marocains ouverts au commerce international assurent 95% de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a soulign\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a mis en avant, mardi \u00e0 Rabat, le r\u00f4le strat\u00e9gique des ports marocains dans le commerce ext\u00e9rieur, soulignant que les 14 ports ouverts au commerce international assurent \u00e0 eux seuls 95% des \u00e9changes du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLes quatorze ports marocains ouverts au commerce international assurent 95 % de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de\nl\u2019Insertion sociale, Abdeljebbar Rachidi, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques en 2025, dans le cadre du Projet de l\u2019\u00e9ducation inclusive. [telquel.ma]\n-------------------------------------------------\nLe Secr\u00e9taire d\u0027\u00c9tat charg\u00e9 de l\u0027Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\ nger, pour un investissement d\u2019environ 250 millions de dirhams. [leseco.ma]\n-------------------------------------------------\nUn m\u00e9morandum d\u2019entente (MoU) portant sur le d\u00e9veloppement de la Cit\u00e9 de la M\u00e9diterran\u00e9e \u00e0 Tanger a \u00e9t\u00e9 sign\u00e9 entre le d\u00e9partement du tourisme marocain et le groupe saoudien Naif Al Rajhi Investment, en marge de la 26e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation mondiale du tourisme des Nations unies, tenue du 7 au 11 novembre [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Banque Mondiale (BM) a\npr\u00e9sent\u00e9, mardi 11 novembre \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Mondiale (BM) a pr\u00e9sent\u00e9, mardi 11 novembre \u00e0 Rabat, un rapport sur l\u2019emploi des femmes dans la r\u00e9gion MENAAP (Moyen-Orient, l\u2019Afrique du Nord, l\u2019Afghanistan et le [www.challenge.ma]\n-------------------------------------------------\nLa ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, a plaid\u00e9 mardi \u00e0 Rabat pour que l\u2019emploi des femmes soit plac\u00e9 au m\u00eame rang que les grands \u00e9quilibres macro\u00e9conomiques dans les feuilles de route nationales. [lnt.ma]\n-------------------------------------------------\nLa Banque Mondiale (BM) a pr\u00e9sent\u00e9, mardi \u00e0 Rabat, son r\u00e9cent bulletin d\u2019information \u00e9conomique de la r\u00e9gion MENAAP (Moyen-Orient, l\u2019Afrique du Nord, l\u2019Afghanistan et le Pakistan), intitul\u00e9 \u201cEmplois et femmes : Talents inexploit\u00e9s, croissance non r\u00e9alis\u00e9e\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le ministre espagnol de l\u2019Int\u00e9rieur,\nFernando Grande-Marlaska, color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "BANK OF AFRICA ACADEMY l\u2019Universit\u00e9\nd\u2019Entreprise du Groupe \u00e9ponyme re\u00e7oit...", "mass": 5, "physics": false, "shape": "box", "title": "BANK OF AFRICA ACADEMY l\u2019Universit\u00e9 d\u2019Entreprise du Groupe \u00e9ponyme re\u00e7oit le 2\u1d49 prix mondial dans la cat\u00e9gorie \u201cBest Innovative Organization \u2013 Private Sector\u201d lors de la prestigieuse c\u00e9r\u00e9monie des GIMI Innovation Awards 2025, organis\u00e9e \u00e0 Rio de Janeiro le 7 novembre 2025 par le Global Innovation Management Institute (GIMI). [leseco.ma]\n-------------------------------------------------\nBANK OF AFRICA Academy, universit\u00e9 d\u2019entreprise du Groupe BANK OF AFRICA, a obtenu la deuxi\u00e8me place mondiale dans la cat\u00e9gorie \u00ab Best Innovative Organization \u2013 Private Sector \u00bb lors des GIMI Innovation Awards 2025, tenus le 7 novembre \u00e0 Rio de Janeiro par le Global Innovation Management Institute (GIMI). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La Galerie Banque Populaire accueille,\ndu 30 octobre 2025 au...", "mass": 5, "physics": false, "shape": "box", "title": "La Galerie Banque Populaire accueille, du 30 octobre 2025 au 28 f\u00e9vrier 2026, l\u2019exposition \u00ab QUATRE VOIX, UNE TERRE \u00bb, une c\u00e9l\u00e9bration de l\u2019art contemporain africain \u00e0 travers quatre artistes du continent : Hiba Baddou et Abdelmalik Berhiss (Maroc), Amadou Camara Gueye (S\u00e9n\u00e9gal) et Djo Ilanga (R\u00e9publique D\u00e9mocratique du Congo). [leseco.ma]\n-------------------------------------------------\nLa Galerie Banque Populaire accueille, jusqu\u2019au 28 f\u00e9vrier 2026, l\u2019exposition \u00ab Quatre voix, une terre \u00bb, une c\u00e9l\u00e9bration de l\u2019art contemporain africain \u00e0 travers quatre artistes du continent : Hiba Baddou et Abdelmalik Berhiss (Maroc), Amadou Camara Gueye (S\u00e9n\u00e9gal) et Djo Ilanga (R\u00e9publique D\u00e9mocratique du Congo). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume\n(TGR), a fait savoir que...", "mass": 5, "physics": false, "shape": "box", "title": "La Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR), a fait savoir que la situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant. [fr.hespress.com]\n-------------------------------------------------\nLes recettes douani\u00e8res nettes se sont \u00e9tablies \u00e0 plus de 83,5 milliards de dirhams (MMDH) au terme des dix premiers mois de 2025, en hausse de 9,5% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [www.lopinion.ma]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nCes \u00e9missions ont repr\u00e9sent\u00e9 un taux de r\u00e9alisation de 58% du total pr\u00e9vu par la loi de finances 2025, pr\u00e9cise la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume dans son r\u00e9cent bulletin mensuel de statistiques des finances publiques (BMSFP). [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit budg\u00e9taire du Maroc a atteint 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre 40,5 MMDH \u00e0 la m\u00eame p\u00e9riode de 2024, selon les donn\u00e9es publi\u00e9es par la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR) dans son dernier Bulletin mensuel de statistiques des finances publiques (BMSFP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "\u00ab La Fondation Trois Cultures\na acc\u00e9d\u00e9 aujourd\u2019hui au Club...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab La Fondation Trois Cultures a acc\u00e9d\u00e9 aujourd\u2019hui au Club tr\u00e8s ferm\u00e9 et tr\u00e8s recherch\u00e9 des Institutions qui dans le monde sont class\u00e9es et reconnues par l\u2019UNESCO comme Centres de . [fr.hespress.com]\n-------------------------------------------------\nLa Fondation Trois Cultures de la M\u00e9diterran\u00e9e a \u00e9t\u00e9 officiellement reconnue par l\u2019Organisation des Nations Unies pour l\u2019\u00e9ducation, la science et la culture (UNESCO) comme Centre de Cat\u00e9gorie 2, rejoignant ainsi le r\u00e9seau mondial d\u2019institutions \u0153uvrant \u00e0 la promotion du dialogue interculturel, de la diversit\u00e9 et de la paix. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Un rapport de l\u2019Observatoire national\nde la criminalit\u00e9 r\u00e9v\u00e8le que...", "mass": 5, "physics": false, "shape": "box", "title": "Un rapport de l\u2019Observatoire national de la criminalit\u00e9 r\u00e9v\u00e8le que les crimes de falsification, de contrefa\u00e7on et d\u2019usurpation de fonction, de titre ou d\u2019identit\u00e9 ont connu une \u00e9volution significative au Maroc sur les vingt derni\u00e8res ann\u00e9es, atteignant des niveaux record en 2005 et 2019. [fr.hespress.com]\n-------------------------------------------------\nEntre 2002 et 2022, ces infractions ont connu d\u2019importantes fluctuations, atteignant des pics notables en 2005, 2015 et 2019, ses orageuses par endroits et rafales de vent sous orages sont attendues, de mercredi \u00e0 jeudi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses et des vents forts sont attendus, dans les prochaines 24 heures, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) [www.challenge.ma]\n-------------------------------------------------\nDes rafales de vent localement fortes avec chasse-poussi\u00e8res ainsi que des averses orageuses par endroits et rafales de vent sous orages sont attendues, de mercredi \u00e0 jeudi, dans plusieurs provinces du Maroc, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La compagnie a repris la\nligne Rennes-Marrakech d\u00e8s fin octobre,...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a repris la ligne Rennes-Marrakech d\u00e8s fin octobre, op\u00e9rationnelle pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanch. [lematin.ma]\n-------------------------------------------------\nLes deux liaisons a\u00e9riennes directes Rennes-Marrakech et Brest-Marrakech sont d\u00e9sormais assur\u00e9es deux fois par semaines sur toute l\u2019ann\u00e9e par Transavia France, a-t-on indiqu\u00e9 aupr\u00e8s de cette compagnie low-cost. [telquel.ma]\n-------------------------------------------------\nCes deux liaisons sont assur\u00e9es par Transavia France, pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanches. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Dans une \u00e9tude consacr\u00e9e aux\nd\u00e9fis des micro, tr\u00e8s petites...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une \u00e9tude consacr\u00e9e aux d\u00e9fis des micro, tr\u00e8s petites et petites entreprises (micro/TPE/PE), le Conseil \u00e9conomique, social et environnemental (CESE) tire la sonnette d\u2019alarme sur la fragilit\u00e9 d\u2019un secteur pourtant vital pour l\u2019\u00e9conomie nationale. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) vient de publier une \u00e9tude intitul\u00e9e \u201cles d\u00e9fis des micro, tr\u00e8s petites et petites entreprises au Maroc : croissance, modernisation et d\u00e9veloppement\u201d, \u00e9labor\u00e9e \u00e0 la suite d\u2019une saisine de la Chambre des conseillers. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9\ndepuis un an en Alg\u00e9rie...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9 depuis un an en Alg\u00e9rie et au c\u0153ur d\u2019une crise diplomatique entre Alger et Paris, va b\u00e9n\u00e9ficier d\u2019une gr\u00e2ce pr\u00e9sidentielle, a annonc\u00e9 mercredi 12 novembre la pr\u00e9sidence alg\u00e9rienne. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a accept\u00e9 une demande de l\u2019Allemagne de gracier et transf\u00e9rer l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, emprisonn\u00e9 depuis un an, dans ce pays pour qu\u2019il puisse y \u00eatre soign\u00e9, a indiqu\u00e9 un communiqu\u00e9 de la pr\u00e9sidence alg\u00e9rienne mercredi. [telquel.ma]\n-------------------------------------------------\nCe mercredi, le pr\u00e9sident alg\u00e9rien Abdelmadjid Tebboune a accord\u00e9 une gr\u00e2ce \u00e0 l\u00e9crivain Boualem Sansal, d\u00e9tenu depuis le 16 novembre 2024 et condamn\u00e9 en mars dernier \u00e0 cinq ans de prison pour \u00abatteinte \u00e0 lunit\u00e9 nationale\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nAtteint d\u0027un cancer, le romancier et essayiste avait \u00e9t\u00e9 arr\u00eat\u00e9 le 16 novembre 2024, avant d\u0027\u00eatre condamn\u00e9 en appel en juillet \u00e0 cinq ans de r\u00e9clusion. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a annonc\u00e9 ce mercredi 12 novembre 2025 avoir \u00abaccept\u00e9\u00bb de gracier l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, \u00e2g\u00e9 de 80 ans, d\u00e9tenu depuis pr\u00e8s d\u2019un an. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Le pr\u00e9sident fran\u00e7ais, Emmanuel Macron\na annonc\u00e9 avoir convenu avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident fran\u00e7ais, Emmanuel Macron a annonc\u00e9 avoir convenu avec son homologue palestinien Mahmoud Abbas de mettre en place un comit\u00e9 conjoint pour \u00ab la consolidation de l\u0027\u00c9tat de Palestine \u00bb. [www.lopinion.ma]\n-------------------------------------------------\nLe pr\u00e9sident fran\u00e7ais Emmanuel Macron a annonc\u00e9 mardi la cr\u00e9ation d\u0027un \"comit\u00e9 conjoint pour la consolidation de l\u0027Etat de Palestine\", \u00e0 l\u0027issue de sa rencontre avec le pr\u00e9sident palestinien Mahmoud Abbas. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Sous la direction artistique de\nYasmine Bennani, la galerie Inspiration...", "mass": 5, "physics": false, "shape": "box", "title": "     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
