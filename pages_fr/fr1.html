atch nul en premi\u00e8re journ\u00e9e (1-1 face \u00e0 la Zambie), sans oublier que les \u00e9quipes qui affrontent le M. [lematin.ma]\n-------------------------------------------------\nLe match contre la s\u00e9lection malienne, comptant pour la deuxi\u00e8me journ\u00e9e du groupe A de la CAN Maroc-2025 de football, sera relev\u00e9 contre un adversaire accul\u00e9 \u00e0 la victoire, a indiqu\u00e9 le joueur de l\u2019\u00e9quipe nationale du Maroc, Oussama Targhaline, jeudi \u00e0 Sal\u00e9. [telquel.ma]\n-------------------------------------------------\nLe match contre la s\u00e9lection malienne, comptant pour la deuxi\u00e8me journ\u00e9e du groupe A de la CAN Maroc-2025 de football, sera relev\u00e9 contre un adversaire accul\u00e9 \u00e0 la victoire, a indiqu\u00e9 le joueur de l\u2019\u00e9quipe nationale du Maroc, Oussama Targhaline, jeudi \u00e0 Sal\u00e9. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le quotidien fran\u00e7ais L\u2019\u00c9quipe a\nr\u00e9v\u00e9l\u00e9 que la star du...", "mass": 5, "physics": false, "shape": "box", "title": "Le quotidien fran\u00e7ais L\u2019\u00c9quipe a r\u00e9v\u00e9l\u00e9 que la star du Real Madrid, Kylian Mbapp\u00e9, est arriv\u00e9e ce jeudi en d\u00e9but d\u2019apr\u00e8s-midi \u00e0 Rabat, accompagn\u00e9e de sa famille. [fr.hespress.com]\n-------------------------------------------------\nSelon Top Afrika Sports, Kylian Mbapp\u00e9, star du Real Madrid et capitaine de l\u2019\u00e9quipe de France, est arriv\u00e9 au Maroc ce jeudi 25 d\u00e9cembre 2025 en compagnie de sa famille. [www.lopinion.ma]\n-------------------------------------------------\nLe Fran\u00e7ais, accompagn\u00e9 de sa famille, a r\u00e9pondu \u00e0 l\u2019invitation de son ami Achraf Hakimi et pourrait prolonger son s\u00e9jour jusqu\u2019\u00e0 la reprise madril\u00e8ne. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "fo assagers et confirme sa part de 31% du trafic national, port\u00e9 par l\u2019\u00e9lan exceptionnel de [www.challenge.ma]\n-------------------------------------------------\nL\u2019A\u00e9roport Mohammed V de Casablanca franchit le cap historique des 11 millions de passagers et confirme sa part de 31 % du trafic national, port\u00e9e par l\u2019\u00e9lan exceptionnel de la Coupe d\u2019Afrique des Nations 2025. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019A\u00e9roport Mohammed V de Casablanca franchit le cap historique des 11 millions de passagers et confirme sa part de 31 % du trafic national, port\u00e9 par l\u2019\u00e9lan exceptionnel de la Coupe d\u2019Afrique des Nations 2025 [leseco.ma]\n-------------------------------------------------\nL\u2019A\u00e9roport Mohammed V de Casablanca franchit le cap historique des 11 millions de passagers et confirme sa part de 31 % du trafic national, port\u00e9 par l\u2019\u00e9lan exceptionnel de la Coupe d\u2019Afrique des Nations 2025 Cette semaine, l\u2019a\u00e9roport a franchi pour la premi\u00e8re fois le seuil symbolique des 11 millions de passagers, marquant une \u00e9tape [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le comit\u00e9 d\u2019organisation marocain de\nla Coupe d\u2019Afrique des nations...", "mass": 5, "physics": false, "shape": "box", "title": "Le comit\u00e9 d\u2019organisation marocain de la Coupe d\u2019Afrique des nations 2025 a mis en place, avec l\u2019accord de la Conf\u00e9d\u00e9ration africaine de football, une mesure exceptionnelle autorisa. [lematin.ma]\n-------------------------------------------------\nDepuis le coup d\u2019envoi de la Coupe d\u2019Afrique des Nations 2025, les distinctions d\u2019\u00ab Homme du match \u00bb mettent en lumi\u00e8re les individualit\u00e9s qui ont pes\u00e9 de mani\u00e8re d\u00e9cisive sur le d\u00e9roulement des rencontres, selon la Commission technique de la CAF [www.lopinion.ma]\n-------------------------------------------------\nLe comit\u00e9 d\u2019organisation marocain de la CAN-2025, avec l\u2019accord de la Conf\u00e9d\u00e9ration africaine de football, autorise l\u2019acc\u00e8s gratuit aux supporters environ vingt minutes apr\u00e8s le coup d\u2019envoi, afin de remplir les stades sur certaines rencontres, selon plusieurs m\u00e9dias. [lnt.ma]\n-------------------------------------------------\nEn accord avec la Conf\u00e9d\u00e9ration africaine de football, le Comit\u00e9 d\u2019organisation marocain de la Coupe d\u2019Afrique des Nations 2025 a instaur\u00e9 une mesure exceptionnelle autorisant l\u2019entr\u00e9e gratuite dans certains stades, et ce, une vingtaine de minutes apr\u00e8s le coup d\u2019envoi. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le festival Comediablanca a franchi\nun cap dans son d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "Le festival Comediablanca a franchi un cap dans son d\u00e9veloppement en se produisant pour la premi\u00e8re fois \u00e0 l\u2019international, \u00e0 Paris. [lematin.ma]\n-------------------------------------------------\nLa sc\u00e8ne mythique de l\u2019Olympia a accueilli, le 22 d\u00e9cembre, le temps d\u2019une soir\u00e9e exceptionnelle, la premi\u00e8re escale internationale de Comediablanca, festival produit par Tendansia et co-fond\u00e9 par Saad Lahjouji Idrissi et Myriam Bouayad. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019enseignement pr\u00e9scolaire au Maroc a\nconnu une am\u00e9lioration notable de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019enseignement pr\u00e9scolaire au Maroc a connu une am\u00e9lioration notable de l\u2019acc\u00e8s entre 2015 et 2025 avec un taux de pr\u00e9scolarisation des enfants \u00e2g\u00e9s de 4 \u00e0 5 ans pass\u00e9 de 50,2% \u00e0 70,4% a affirm\u00e9, jeudi \u00e0 Rabat, le directeur de l\u0027Instance nationale d\u0027\u00e9valuation relevant du Conseil sup\u00e9rieur de l\u2019\u00e9ducation, de la formation et de la recherche scientifique (CSEFRS), Hicham Ait Mansour. [www.lopinion.ma]\n-------------------------------------------------\nLe taux de pr\u00e9scolarisation des enfants \u00e2g\u00e9s de 4 \u00e0 5 ans est pass\u00e9 de 50,2% \u00e0 70,4%, a affirm\u00e9, jeudi \u00e0 Rabat, le directeur de lInstance nationale d\u00e9valuation relevant du Conseil sup\u00e9rieur de l\u2019\u00e9ducation, de la formation et de la recherche scientifique (CSEFRS), Hicham Ait Mansour. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019enseignement pr\u00e9scolaire au Maroc a connu une am\u00e9lioration notable de l\u2019acc\u00e8s entre 2015 et 2025 avec un taux de pr\u00e9scolarisation des enfants \u00e2g\u00e9s de 4 \u00e0 5 ans pass\u00e9 de 50,2% \u00e0 70,4% a affirm\u00e9, jeudi \u00e0 Rabat, le directeur de l\u2019Instance nationale d\u2019\u00e9valuation relevant du Conseil sup\u00e9rieur de l\u2019\u00e9ducation, de la formation et de . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Des averses orageuses avec chutes\nde gr\u00eale et rafales de...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec chutes de gr\u00eale et rafales de vent, des chutes de neige et un temps froid sont pr\u00e9vus de jeudi \u00e0 dimanche dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDes averses orageuses avec chutes de gr\u00eale et rafales de vent, des chutes de neige et un temps froid sont pr\u00e9vus de jeudi \u00e0 dimanche dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses avec chutes de gr\u00eale et rafales de vent, des chutes de neige et un temps froid sont pr\u00e9vus de jeudi \u00e0 dimanche dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nDes averses orageuses avec chutes de gr\u00eale et rafales de vent, des chutes de neige et un temps froid sont pr\u00e9vus de jeudi \u00e0 dimanche dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de\nl\u2019Investissement, de la Convergence et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la Convergence et de l\u2019Evaluation des politiques publiques, Karim Zidane, et le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, ont proc\u00e9d\u00e9, mercredi dans la zone industrielle de Ben Souda \u00e0 F\u00e8s, au lancement officiel du projet de cr\u00e9ation de la soci\u00e9t\u00e9 Euwen Textiles, filiale du groupe chinois. [telquel.ma]\n-------------------------------------------------\nLe ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la Convergence et de l\u2019Evaluation des politiques publiques, Karim Zidane, et le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, ont proc\u00e9d\u00e9, mercredi dans la zone industrielle de Ben Souda \u00e0 F\u00e8s, au lancement officiel du projet de cr\u00e9ation de la soci\u00e9t\u00e9     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
