i,\nl\u2019adoption par le Conseil de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Niger a salu\u00e9, mardi, l\u2019adoption par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution historique 2797 qui consacre, dans le cadre de la souverainet\u00e9 marocaine, le plan d\u2019autonomie propos\u00e9 par le Royaume comme base s\u00e9rieuse, cr\u00e9dible et durable pour parvenir \u00e0 une solution \u00e0 la question du Sahara marocain. [fr.hespress.com]\n-------------------------------------------------\nLe Niger a salu\u00e9, mardi, l\u2019adoption par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution historique 2797 qui consacre, dans le cadre de la souverainet\u00e9 marocaine, le plan d\u2019autonomie propos\u00e9 par le Royaume comme base s\u00e9rieuse, cr\u00e9dible et durable pour parvenir \u00e0 une solution \u00e0 la question du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc a accueilli 18\nmillions de touristes durant les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a accueilli 18 millions de touristes durant les onze premiers mois de 2025, un niveau historique qui d\u00e9passe d\u00e9j\u00e0 le total de toute l\u2019ann\u00e9e 2024 avec plus de 600.000 touristes suppl\u00e9mentaires, annonce le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc a accueilli 18 millions de touristes durant les onze premiers mois de 2025, un niveau historique qui d\u00e9passe d\u00e9j\u00e0 le total de toute l\u0027ann\u00e9e 2024 avec plus de 600.000 touristes suppl\u00e9mentaires, annonce le minist\u00e8re du Tourisme, de l\u0027Artisanat et de l\u0027\u00c9conomie sociale et solidaire. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 peine install\u00e9 dans la\ncapitale, le nouvel ambassadeur des...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 peine install\u00e9 dans la capitale, le nouvel ambassadeur des \u00c9tats-Unis au Maroc a assist\u00e9 \u00e0 la lev\u00e9e du drapeau am\u00e9ricain en pr\u00e9sence d\u2019\u00e9l\u00e9ments des Marines, un rite protocolaire. [lematin.ma]\n-------------------------------------------------\nLe nouvel Ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan III, a inaugur\u00e9 son mandat \u00e0 Rabat par une c\u00e9r\u00e9monie de lev\u00e9e du drapeau am\u00e9ricain au-dessus de sa r\u00e9sidence. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\npar le ministre des Affaires...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e par le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traore, lors de son entretie. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traor\u00e9, a salu\u00e9, mardi \u00e0 Rabat, la dynamique de coop\u00e9ration entre le Burkina Faso et le Maroc, mettant en avant l\u2019importance de l\u2019Initiative Royale Internationale visant \u00e0 favoriser l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traor\u00e9, a salu\u00e9, mardi \u00e0 Rabat, la dynamique de coop\u00e9ration entre le Burkina Faso et le Maroc, mettant en avant l\u2019importance de l\u2019Initiative Royale Internationale visant \u00e0 favoriser l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "PLF 2026 : la premi\u00e8re\npartie adopt\u00e9e en commission \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "PLF 2026 : la premi\u00e8re partie adopt\u00e9e en commission \u00e0 la Chambre des conseillers avec plusieurs amendements. [lematin.ma]\n-------------------------------------------------\nLa Commission des finances, de la planification et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des conseillers a adopt\u00e9, mardi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du Projet de loi de finances (PLF) 2026, en pr\u00e9sence du ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa. [www.lopinion.ma]\n-------------------------------------------------\nLa Chambre des conseillers tiendra des s\u00e9ances pl\u00e9ni\u00e8res, mercredi et jeudi, pour examiner et voter le Projet de loi de finances N\u00b050.25 au titre de l\u2019ann\u00e9e budg\u00e9taire 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "D\u00e9sormais, les habitants de Casablanca\nont acc\u00e8s direct \u00e0 l\u0027A\u00e9roport...", "mass": 5, "physics": false, "shape": "box", "title": "D\u00e9sormais, les habitants de Casablanca ont acc\u00e8s direct \u00e0 l\u0027A\u00e9roport Mohammed V via A\u00e9robus, une nouvelle navette lanc\u00e9e, ce mardi, par l\u0027Office National des A\u00e9roports (ONDA). [www.lopinion.ma]\n-------------------------------------------------\nL\u0027ONDA lance A\u00e9robus, une navette directe entre Casablanca et l\u0027a\u00e9roport Mohammed V. L\u2019Office national des a\u00e9roports (ONDA) a lanc\u00e9 hier un nouveau service de navette baptis\u00e9 A\u00e9robus, reliant Casablanca \u00e0 l\u2019a\u00e9roport Mohammed V. Cette solution de mobilit\u00e9 vise \u00e0 rendre les d\u00e9placements plus simples, plus fluides et plus confortables entre l\u2019a\u00e9roport et la m\u00e9tropole \u00e9conomique. [telquel.ma]\n-------------------------------------------------\nL\u2019ONDA lance A\u00e9robus, une navette entre Casablanca et l\u2019a\u00e9roport Mohammed V. L\u2019Office National des A\u00e9roports (ONDA) met en place une nouvelle solution de mobilit\u00e9 con\u00e7ue pour rendre leurs d\u00e9placements plus simples, plus fluides et plus confortables entre l\u2019a\u00e9roport Mohammed V de Casablanca et la m\u00e9tropole \u00e9conomique. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le pr\u00e9sident de l\u0027Instance nationale\nde la probit\u00e9, de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de l\u0027Instance nationale de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC), Mohamed Benalilou, a mis en lumi\u00e8re ces efforts aupr\u00e8s de responsables am\u00e9ricains et internationaux. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc a mis en avant \u00e0 Washington son exp\u00e9rience en mati\u00e8re de pr\u00e9vention et de lutte contre la corruption, lors de rencontres qui ont permis de pr\u00e9senter les avanc\u00e9es nationales et de renforcer le dialogue avec des institutions am\u00e9ricaines et internationales. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019exp\u00e9rience du Maroc en mati\u00e8re de pr\u00e9vention et de lutte contre la corruption a \u00e9t\u00e9 mise en avant, lundi \u00e0 Washington, \u00e0 l\u2019occasion d\u2019une s\u00e9rie de r\u00e9unions entre le pr\u00e9sident de l\u2019Instance nationale de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC), Mohamed Benalilou, et des responsables am\u00e9ricains et internationaux. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Le ministre de la Justice,\nAbdellatif Ouahbi, a fait \u00e9tat,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Justice, Abdellatif Ouahbi, a fait \u00e9tat, lundi \u00e0 la Chambre des repr\u00e9sentants, d\u0027un net recul des mariages des mineurs, passant de 26.298 cas en 2017 \u00e0 seulement 8.955 en 2024. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, a fait \u00e9tat, lundi \u00e0 la Chambre des repr\u00e9sentants, dun net recul des mariages des mineurs, passant de 26 298 cas en 2017 \u00e0 seulement 8 955 en 2024. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, a fait \u00e9tat, lundi \u00e0 la Chambre des repr\u00e9sentants, d\u2019un net recul des mariages des mineurs, passant de 26.298 cas en 2017 \u00e0 seulement 8.955 en 2024. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Cette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0\nbord d\u2019un Airbus A320 \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Cette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0 bord d\u2019un Airbus A320 \u00e0 raison de deux vols par semaine (jeudi et samedi), reliera l\u2019a\u00e9roport Vaclav Havel de Prague et Marrakech Menara, selon. [telquel.ma]\n-------------------------------------------------\nCette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0 bord d\u2019un Airbus A320 \u00e0 raison de deux vols par semaine (jeudi et samedi), relie l\u2019a\u00e9roport Vaclav Havel de Prague et Marrakech Menara, selon la compagnie low cost allemande. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Une salle de contr\u00f4le de\nvid\u00e9osurveillance a \u00e9t\u00e9 inaugur\u00e9e, mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Une salle de contr\u00f4le de vid\u00e9osurveillance a \u00e9t\u00e9 inaugur\u00e9e, mardi au si\u00e8ge de la Brigade de la police touristique relevant du district de police de l\u2019ancienne m\u00e9dina \u00e0 Marrakech, dans le cadre du renforcement de la s\u00e9curit\u00e9 urbaine et de la modernisation du dispositif de surveillance. [telquel.ma]\n-------------------------------------------------\nUne salle de contr\u00f4le de vid\u00e9osurveillance a \u00e9t\u00e9 inaugur\u00e9e, mardi au si\u00e8ge de la Brigade de la police touristique relevant du district de police de l\u0027ancienne m\u00e9dina \u00e0 Marrakech, dans le cadre du renforcement de la s\u00e9curit\u00e9 urbaine et de la modernisation du dispositif de surveillance. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le lancement officiel d\u2019une carte\nde r\u00e9duction destin\u00e9e \u00e0 faciliter...", "mass": 5, "physics": false, "shape": "box", "title": "Le lancement officiel d\u2019une carte de r\u00e9duction destin\u00e9e \u00e0 faciliter les d\u00e9placements en train des personnes en situation de handicap, a \u00e9t\u00e9 donn\u00e9 mardi \u00e0 Sal\u00e9, lors d\u2019une rencontre pr\u00e9sid\u00e9e par la ministre de la Solidarit\u00e9, de l\u2019insertion sociale et de la famille, Na\u00efma Ibn Yahya, le Secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019insertion sociale, Abdeljabbar Rachidi,. [telquel.ma]\n-------------------------------------------------\nLe lancement officiel d\u2019une carte de r\u00e9duction destin\u00e9e \u00e0 faciliter les d\u00e9placements en train des personnes en situation de handicap, a \u00e9t\u00e9 donn\u00e9 mardi \u00e0 Sal\u00e9, lors d\u2019une rencontre pr\u00e9sid\u00e9e par la ministre de la Solidarit\u00e9, de l\u2019Insertion Sociale et de la Famille, Na\u00efma Ibn Yahya, le Secr\u00e9taire d\u2019\u00c9tat Charg\u00e9 de l\u2019Insertion Sociale, Abdeljabbar Rachidi, [www.lereporter.ma]\n-------------------------------------------------\nLe lancement officiel d\u2019une carte de r\u00e9duction destin\u00e9e \u00e0 faciliter les d\u00e9placements en train des personnes en situation de handicap, a \u00e9t\u00e9 donn\u00e9 mardi \u00e0 Sal\u00e9, lors dune rencontre pr\u00e9sid\u00e9e par la ministre de la Solidarit\u00e9, de l\u2019insertion sociale et de la famille, Na\u00efma Ibn Yahya, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019insertion sociale, Abdeljabbar Rachidi, le ministre du transport et de la logistique, Abdessamad Kayouh et le directeur g\u00e9n\u00e9ral de l\u2019Office national des chemins de fer (ONCF), Mohamed Rabie Khlie. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Le secr\u00e9taire g\u00e9n\u00e9ral adjoint des\nNations unies, chef du bureau...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire g\u00e9n\u00e9ral adjoint des Nations unies, chef du bureau des Nations unies pour la lutte contre le terrorisme (ONUCT), Alexander Zuev, a salu\u00e9 mardi \u00e0 Rabat le partenariat \u201csolide\u201d avec le Maroc dans les efforts collectifs de lutte contre le terrorisme. [telquel.ma]\n-------------------------------------------------\nComme annonc\u00e9, Rabat accueille les 2 et 3 d\u00e9cembre la premi\u00e8re conf\u00e9rence des victimes africaines du terrorisme, organis\u00e9e en partenariat avec le Bureau des Nations Unies pour la Lutte contre le Terrorisme (UNOC). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le segment minist\u00e9riel de la\nConf\u00e9rence sur les victimes africaines...", "mass": 5, "physics": false, "shape": "box", "title": "Le segment minist\u00e9riel de la Conf\u00e9rence sur les victimes africaines du terrorisme, tenue mardi \u00e0 Rabat, a ent\u00e9rin\u00e9 la D\u00e9claration de Rabat qui r\u00e9affirme la place centrale des victimes dans les r\u00e9ponses nationales et r\u00e9gionales au terrorisme et appelle \u00e0 renforcer les cadres juridiques, institutionnels et op\u00e9rationnels d\u00e9di\u00e9s \u00e0 leur protection. [telquel.ma]\n-------------------------------------------------\nLe segment minist\u00e9riel de la Conf\u00e9rence sur les victimes africaines du terrorisme, tenue mardi \u00e0 Rabat, a ent\u00e9rin\u00e9 la D\u00e9claration de Rabat qui r\u00e9affirme la place centrale des victimes dans les r\u00e9ponses nationales et r\u00e9gionales au terrorisme et appelle \u00e0 renforcer les cadres juridiques, institutionnels et op\u00e9rationnels d\u00e9di\u00e9s \u00e0 leur protection. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Des chutes de neige \u00e0\npartir de 1700 m, ainsi...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1700 m, ainsi que de fortes rafales de vent sont attendues, mercredi, dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1 700 m, ainsi que de fortes rafales de vent sont attendues, mercredi, dans plusieurs provinces du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1700 m, ainsi que de fortes rafales de vent sont attendues, mercredi, dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [atlasinfo.fr]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m et de fortes rafales de vent sont attendues mercredi dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "OCP Green Energy, filiale du\nGroupe OCP, a proc\u00e9d\u00e9, lundi,...", "mass": 5, "physics": false, "shape": "box", "title": "OCP Green Energy, filiale du Groupe OCP, a proc\u00e9d\u00e9, lundi, \u00e0 la mise en service effective de la premi\u00e8re phase de son programme d\u2019investissement solaire, totalisant une capacit\u00e9 de 202 m\u00e9gawatts-cr\u00eate (MWc), marquant ainsi une \u00e9tape d\u00e9cisive dans la feuille de route de d\u00e9carbonation du g\u00e9ant mondial des phosphates. [telquel.ma]\n-------------------------------------------------\nOCP Green Energy, filiale du Groupe OCP, a proc\u00e9d\u00e9, lundi, \u00e0 la mise en service effective de la premi\u00e8re phase de son programme d\u0027investissement solaire, totalisant une capacit\u00e9 de 202 m\u00e9gawatts-cr\u00eate (MWc), marquant ainsi une \u00e9tape d\u00e9cisive dans la feuille de route de d\u00e9carbonation du g\u00e9ant mondial des phosphates. [leseco.ma]\n-------------------------------------------------\nOCP Green Energy, filiale du Groupe OCP, a proc\u00e9d\u00e9, lundi, \u00e0 la mise en service effective de la premi\u00e8re phase de son programme d\u2019investissement solaire, totalisant une capacit\u00e9 de 202 m\u00e9gawatts-cr\u00eate (MWc), marquant ainsi une \u00e9tape d\u00e9cisive dans la feuille de route de d\u00e9carbonation du g\u00e9ant mondial des phosphates. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "L\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes\nd\u2019inscription en vue de la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes d\u2019inscription en vue de la r\u00e9vision annuelle des listes \u00e9lectorales g\u00e9n\u00e9rales pour l\u2019ann\u00e9e 2026 est ouverte jusqu\u2019au 31 d\u00e9cembre 2025, annonce, lundi, un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [telquel.ma]\n-------------------------------------------------\nLes d\u00e9marches sont ouvertes jusqu\u2019au 31 d\u00e9cembre 2025, permettant aux citoyens et aux professionnels de v\u00e9rifier, mettre \u00e0 jour ou transf\u00e9rer leurs inscriptions afin de garantir leur participation aux prochaines \u00e9lections. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes d\u2019inscription en vue de la r\u00e9vision annuelle des listes \u00e9lectorales g\u00e9n\u00e9rales pour l\u2019ann\u00e9e 2026 est ouverte jusqu\u2019au 31 d\u00e9cembre 2025, annonce, lundi, un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de\nla Transition num\u00e9rique et de...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fellah Seghrouchni, a indiqu\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, que embre Marrakech, les travaux du Congr\u00e8s Mondial de l\u2019Eau, dont la 19e \u00e9dition est d\u00e9di\u00e9e [www.challenge.ma]\n-------------------------------------------------\nLe Maroc est engag\u00e9 \u00e0 apporter une contribution active \u00e0 la mise en \u0153uvre de la Vision et la Politique Africaine de l\u2019Eau 2063 (VPAE 2063), a affirm\u00e9, mardi \u00e0 Marrakech, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [maroc-diplomatique.net]\n-------------------------------------------------\nLors de l\u2019ouverture de la 19e \u00e9dition du Congr\u00e8s mondial de l\u2019eau, \u00e0 Marrakech, Nizar Baraka, ministre de l\u2019\u00c9quipement et de l\u2019Eau, a annonc\u00e9 que 17 stations de dessalement sont d\u00e9j\u00e0 en service, totalisant 350,3 millions de m\u00e8tres cubes (Mm\u00b3) par an. [leseco.ma]\n-------------------------------------------------\nLe Maroc est engag\u00e9 \u00e0 apporter une contribution active \u00e0 la mise en \u0153uvre de la Vision et la Politique Africaine de l\u2019Eau 2063 (VPAE 2063), a affirm\u00e9, mardi \u00e0 Marrakech, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "\u0003 Financement Selon Bank Al-Maghrib,\nl\u2019\u00e9volution du concours bancaire au...", "mass": 5, "physics": false, "shape": "box", "title": "\u0003 Financement Selon Bank Al-Maghrib, l\u2019\u00e9volution du concours bancaire au secteur non financier traduit l\u2019att\u00e9nuation de la baisse des facilit\u00e9s de tr\u00e9sorerie, la progression des cr\u00e9dits . [aujourdhui.ma]\n-------------------------------------------------\nSelon les derniers chiffres de Bank Al-Maghrib, les pr\u00eats aux m\u00e9nages atteignent 412,8 MMDH, soutenus par l\u2019immobilier et le financement participatif, tandis que les cr\u00e9dits aux entreprises priv\u00e9es et publiques connaissent des dynamiques contrast\u00e9es. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9\naux entreprises logistiques pour la...", "mass": 5, "physics": false, "shape": "box", "title": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \"PME Supply Chain\", a \u00e9t\u00e9 lanc\u00e9, mardi \u00e0 Rabat, avec un budget global de 100 millions de dirhams. [www.lavieeco.com]\n-------------------------------------------------\nLe nouveau programme d\u2019accompagnement \u00ab PME Supply Chain \u00bb, destin\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, a \u00e9t\u00e9 officiellement lanc\u00e9 le 2 d\u00e9cembre lors d\u0027une c\u00e9r\u00e9monie \u00e0 Rabat. [leseco.ma]\n-------------------------------------------------\nLe nouveau programme d\u2019accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \u00ab PME Supply Chain \u00bb, a \u00e9t\u00e9 lanc\u00e9, mardi \u00e0 Rabat, avec un budget global de 100 millions de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les projets de loi organique\nrelative \u00e0 la Chambre des...", "mass": 5, "physics": false, "shape": "box", "title": "Les projets de loi organique relative \u00e0 la Chambre des repr\u00e9sentants, celle concernant les partis politiques et la troisi\u00e8me aff\u00e9rente aux listes \u00e9lectorales g\u00e9n\u00e9rales, aux op\u00e9rations de r\u00e9f\u00e9rendum et \u00e0 l\u2019utilisation des moyens audiovisuels publics durant les campagnes \u00e9lectorales et r\u00e9f\u00e9rendaires ont tous \u00e9t\u00e9 adopt\u00e9s \u00e0 une large majorit\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a approuv\u00e9 \u00e0 l\u2019unanimit\u00e9, lundi lors d\u2019une s\u00e9ance l\u00e9gislative, trois projets de loi relatifs au syst\u00e8me \u00e9lectoral, et ce en pr\u00e9sence du ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [maroc-diplomatique.net]\n-------------------------------------------------\nApr\u00e8s trois heures de discussions, la Chambre des Repr\u00e9sentants a adopt\u00e9, lundi soir, le projet de loi organique n\u00b053.25 modifiant et compl\u00e9tant la loi organique n\u00b027.11 relative \u00e0 la Chambre des Repr\u00e9sentants. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Cette navette permet de relier\nCasa Port au Terminal 2,...", "mass": 5, "physics": false, "shape": "box", "title": "Cette navette permet de relier Casa Port au Terminal 2, avec un arr\u00eat au Terminal 1, tout en desservant les principaux quartiers de la ville jusqu\u2019au terminus \u00e0 la gare de Casa Port. [www.lavieeco.com]\n-------------------------------------------------\nCasablanca : l\u2019ONDA lance une navette A\u00e9robus vers l\u2019a\u00e9roport Mohammed V. L\u2019Office national des a\u00e9roports (ONDA) a mis en service A\u00e9robus, une nouvelle navette reliant Casablanca \u00e0 l\u2019a\u00e9roport Mohammed V. Le service, op\u00e9rationnel depuis hier, propose un d\u00e9part toutes les 30 minutes entre Casa Port et le Terminal 2, avec un arr\u00eat au Terminal 1 et la desserte de plusieurs quartiers de la ville. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 cette occasion, les deux\nparties ont \u00e9voqu\u00e9 les d\u00e9fis...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 cette occasion, les deux parties ont \u00e9voqu\u00e9 les d\u00e9fis pos\u00     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {

                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },

                    barnesHut: {

                    }
                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
