e, une r\u00e9union de haut niveau avec des repr\u00e9sentants du Groupe de la Banque Mondiale, et de la Gates Foundation, consacr\u00e9e au positionnement strat\u00e9gique du Maroc comme hub pharmaceutique et logistique continental. [fr.hespress.com]\n-------------------------------------------------\nEn marge de sa participation \u00e0 la 79\u00e8me Assembl\u00e9e mondiale de la sant\u00e9, tenue \u00e0 Gen\u00e8ve du 18 au 23 mai, le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, a tenu, mercredi 20 mai, une r\u00e9union de haut niveau avec des repr\u00e9sentants du Groupe de la Banque mondiale et de la. [telquel.ma]\n-------------------------------------------------\nLe Ministre de la Sant\u00e9 et de la Protection Sociale engage, avec le Groupe de la Banque Mondiale et de la Gates Foundation, le lancement d\u2019une feuille de route pour le positionnement du Maroc comme hub pharmaceutique et logistique r\u00e9gional. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a engag\u00e9 une nouvelle initiative visant \u00e0 renforcer son positionnement dans l\u2019industrie pharmaceutique et la logistique sanitaire \u00e0 l\u2019\u00e9chelle continentale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Intervenant \u00e0 l\u0027ouverture de la\n2e Conf\u00e9rence Minist\u00e9rielle sur le...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant \u00e0 l\u0027ouverture de la 2e Conf\u00e9rence Minist\u00e9rielle sur le Maintien de la Paix en Environnement Francophone, le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00c9trang\u00e8res, de la Coop\u00e9ration Africaine et des Marocains R\u00e9sidant \u00e0 l\u2019\u00c9tranger, Nasser Bourita, a pris la parole mercredi \u00e0 l\u2019ouverture de la 2e Conf\u00e9rence Minist\u00e9rielle sur le Maintien de la Paix en Environnement Francophone. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc est un acteur cl\u00e9 en mati\u00e8re de maintien de la paix et un partenaire majeur sur le continent africain, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot. [www.lereporter.ma]\n-------------------------------------------------\nLe Royaume est un acteur cl\u00e9 en mati\u00e8re de maintien de la paix et un partenaire majeur sur le continent africain, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Conseil Sup\u00e9rieur du Pouvoir\nJudiciaire (CSPJ) et l\u2019Autorit\u00e9 Marocaine...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil Sup\u00e9rieur du Pouvoir Judiciaire (CSPJ) et l\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) ont sign\u00e9, mercredi 20 mai \u00e0 Rabat, un accord-cadre de partenariat et de coo. [lematin.ma]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur du pouvoir judiciaire (CSPJ) et l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) ont conclu, mercredi 20 mai au si\u00e8ge du CSPJ \u00e0 Rabat, un accord-cadre [www.challenge.ma]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur du pouvoir judiciaire (CSPJ) et l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) ont sign\u00e9, mercredi \u00e0 Rabat, un accord-cadre de partenariat et de coop\u00e9ration visant \u00e0 renforcer la coordination institutionnelle entre les deux instances autour des enjeux li\u00e9s \u00e0 la r\u00e9gulation financi\u00e8re, \u00e0 la s\u00e9curit\u00e9 juridique des investissements et \u00e0 la protection . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc a proc\u00e9d\u00e9, le\n19 mai 2026, \u00e0 une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a proc\u00e9d\u00e9, le 19 mai 2026, \u00e0 une \u00e9mission obligataire sur le march\u00e9 financier international pour un montant total de 2,25 milliards d\u2019euros. [lematin.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration a attir\u00e9 des ordres pour un total de 5,2 milliards d\u2019euros, soit un taux de couverture d\u2019environ 2,5 fois, selon Asharq. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La c\u00e9r\u00e9monie de signature a\n\u00e9t\u00e9 pr\u00e9sid\u00e9e, pour la partie...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9r\u00e9monie de signature a \u00e9t\u00e9 pr\u00e9sid\u00e9e, pour la partie marocaine, par M. Redouane Houssaini, ambassadeur de Sa Majest\u00e9 le Roi \u00e0 Jakarta, et, pour la partie indon\u00e9sienne, par M. A. [lematin.ma]\n-------------------------------------------------\nLe Maroc et l\u2019Indon\u00e9sie ont proc\u00e9d\u00e9, mercredi \u00e0 Jakarta, \u00e0 la signature d\u2019un accord relatif \u00e0 la reconnaissance mutuelle de la certification Halal entre l\u2019Institut marocain de normalisation (IMANOR) et l\u2019Agence indon\u00e9sienne de garantie des produits halal (BPJPH). [telquel.ma]\n-------------------------------------------------\nLe Royaume du Maroc et la R\u00e9publique d\u2019Indon\u00e9sie ont proc\u00e9d\u00e9, mercredi \u00e0 Jakarta, \u00e0 la signature d\u2019un accord strat\u00e9gique relatif \u00e0 la reconnaissance mutuelle de la certification Halal entre l\u2019Institut Marocain de Normalisation (IMANOR) et l\u2019Agence indon\u00e9sienne de garantie des produits Halal (BPJPH). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Lors de la session d\u2019ouverture\nde cette conf\u00e9rence, Antonio Guterres...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la session d\u2019ouverture de cette conf\u00e9rence, Antonio Guterres a indiqu\u00e9, dans une intervention pr\u00e9enregistr\u00e9e, que le maintien de la paix constitue l\u0027un des visages les. [lematin.ma]\n-------------------------------------------------\nLors de la session d\u2019ouverture de cette conf\u00e9rence, Guterres a indiqu\u00e9, dans une intervention pr\u00e9enregistr\u00e9e, que le maintien de la paix constitue l\u0027un des visages les plus concrets de l\u2019ONU, \u00e0 un moment o\u00f9 le monde compte actuellement plus de conflits depuis 1945. [www.lavieeco.com]\n-------------------------------------------------\nLe Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019Organisation des Nations Unies, Antonio Guterres, a exprim\u00e9 sa gratitude envers le Maroc et la France pour leur r\u00f4le dans l\u2019organisation et la copr\u00e9sidence de la deuxi\u00e8me Conf\u00e9rence minist\u00e9rielle sur le maintien de la paix en environnement francophone, qui s\u2019est tenue mercredi \u00e0 Rabat. [atlasinfo.fr]\n-------------------------------------------------\nLe Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019Organisation des Nations Unies, M. Antonio Guterres, a exprim\u00e9 ses remerciements au Maroc et \u00e0 la France pour l\u2019organisation et la copr\u00e9sidence de la deuxi\u00e8me Conf\u00e9rence minist\u00e9rielle sur le maintien de la paix en environnement francophone, tenue mercredi \u00e0 Rabat. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "\u00c0 l\u2019occasion du Mondial 2026,\nRoyal Air Maroc met en...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du Mondial 2026, Royal Air Maroc met en place un dispositif a\u00e9rien sp\u00e9cial pour les supporters des Lions de l\u2019Atlas. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la participation de la s\u00e9lection nationale \u00e0 la plus grande manifestation footballistique du monde, Royal Air Maroc d\u00e9ploie un programme de vols exceptionnel d\u00e9di\u00e9 aux supporters souhaitant encourager les Lions de l\u2019Atlas lors des matchs disput\u00e9s aux Etats Unis d\u2019Am\u00e9rique. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la participation de la s\u00e9lection nationale \u00e0 la plus grande manifestation footballistique du monde, Royal Air Maroc (RAM) d\u00e9ploie un programme de vols exceptionnel d\u00e9di\u00e9 [www.challenge.ma]\n-------------------------------------------------\n\u00c0 l\u0027occasion de la participation de la s\u00e9lection nationale \u00e0 la plus grande manifestation footballistique du monde, Royal Air Maroc (RAM) d\u00e9ploie un programme de vols exceptionnel d\u00e9di\u00e9 aux supporters souhaitant encourager les Lions de l\u0027Atlas lors des matchs disput\u00e9s aux \u00c9tats-Unis d\u0027Am\u00e9rique. [leseco.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la participation de la s\u00e9lection nationale \u00e0 la plus grande manifestation footballistique du monde, Royal Air Maroc (RAM) d\u00e9ploie un programme de vols exceptionnel d\u00e9di\u00e9 aux supporters souhaitant encourager les Lions de l\u2019Atlas lors des matchs disput\u00e9s aux \u00c9tats-Unis d\u2019Am\u00e9rique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le groupe europ\u00e9en Cegid renforce\nsa pr\u00e9sence au Maroc avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe europ\u00e9en Cegid renforce sa pr\u00e9sence au Maroc avec l\u2019ouverture de \u00ab Cegid Atlas \u00bb, un nouveau centre d\u2019excellence install\u00e9 aux 12e et 13e \u00e9tages de la Cross Tower, au sein. [lematin.ma]\n-------------------------------------------------\nLe centre s\u0027articule autour de quatre p\u00f4les d\u0027expertise : le support client, le p\u00f4le Delivery \u0026 Services, la R\u0026D et le back-office, couvrant des fonctions li\u00e9es \u00e0 la finance, aux ressources humaines et aux syst\u00e8mes d\u0027information. [www.lavieeco.com]\n-------------------------------------------------\nImplant\u00e9 dans la Cross Tower, ce site s\u2019inscrit dans la strat\u00e9gie de d\u00e9veloppement international du groupe sp\u00e9cialis\u00e9 dans les solutions de gestion cloud destin\u00e9es aux m\u00e9tiers de la finance, des ressources humaines, du retail . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Coalition pour la Valorisation\ndes D\u00e9chets (COVAD) a reconduit...", "mass": 5, "physics": false, "shape": "box", "title": "La Coalition pour la Valorisation des D\u00e9chets (COVAD) a reconduit Mounir El Bari \u00e0 sa pr\u00e9sidence pour le mandat 2026-2031, \u00e0 l\u2019issue de son Assembl\u00e9e G\u00e9n\u00e9rale \u00c9lective tenue le 7 m. [lematin.ma]\n-------------------------------------------------\nLa Coalition pour la valorisation des d\u00e9chets (COVAD) a tenu son assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective, \u00e0 l\u2019issue de laquelle Mounir El Bari a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour le mandat 2026-2031. [leseco.ma]\n-------------------------------------------------\nLa Coalition pour la Valorisation des D\u00e9chets (COVAD) a annonc\u00e9 la r\u00e9\u00e9lection de Mounir El Bari \u00e0 s _label_12", "label": "La s\u00e9lection marocaine de football\n(U17) s\u2019est qualifi\u00e9e pour la...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football (U17) s\u2019est qualifi\u00e9e pour la Coupe du Monde (Qatar-2026) en validant son billet pour les quarts de finale de la Coupe d\u2019Afrique des Nations (Maroc-2026), gr\u00e2ce \u00e0 sa victoire face \u00e0 l\u2019\u00c9gypte (2-1), lors de la 3\u00e8 journ\u00e9e du groupe A, disput\u00e9e mardi soir sur le terrain n\u00b08 du Complexe. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football (U17) s\u2019est qualifi\u00e9e pour la Coupe du monde (Qatar 2026) en validant son billet pour les quarts de finale de la Coupe d\u2019Afrique des nations (Maroc 2026), gr\u00e2ce \u00e0 sa victoire face \u00e0 l\u2019\u00c9gypte (2-1), lors de la 3\u00e8 journ\u00e9e du groupe A, disput\u00e9e mardi soir sur le terrain n\u00b08 du Complexe Mohammed VI de football. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football U17 a r\u00e9alis\u00e9 un exploit remarquable en se qualifiant pour la Coupe du Monde U17, qui se tiendra au Qatar du 19 novembre au 13 d\u00e9cembre 2026. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Pr\u00e9sentant les principales nouveaut\u00e9s du\nprojet de loi, le ministre...", "mass": 5, "physics": false, "shape": "box", "title": "Pr\u00e9sentant les principales nouveaut\u00e9s du projet de loi, le ministre de la Justice, Abdellatif Ouahbi, a indiqu\u00e9 que. [telquel.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9 mardi, \u00e0 la majorit\u00e9 des voix, le projet de loi 66.23 relatif \u00e0 la r\u00e9glementation de la profession davocat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La premi\u00e8re phase du projet\nde la carte universitaire comprend...", "mass": 5, "physics": false, "shape": "box", "title": "La premi\u00e8re phase du projet de la carte universitaire comprend 26 nouveaux \u00e9tablissements universitaires, dont le d\u00e9cret de cr\u00e9ation est en phase finale d\u2019approbation, a affirm\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui. [telquel.ma]\n-------------------------------------------------\n\u00c0 la Chambre des conseillers, le ministre de l\u0027Enseignement sup\u00e9rieur, Azzedine El Midaoui, a \u00e9galement annonc\u00e9 que le projet pr\u00e9voit la scission de l\u0027Universit\u00e9 Ibn Zohr en cinq universit\u00e9s : celles de Dakhla, La\u00e2youne et Guelmim, deux universit\u00e9s \u00e0 A\u00eft Melloul et Agadir, ainsi que le rattachement de Ouarzazate \u00e0 sa r\u00e9gion d\u0027appartenance. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le prince h\u00e9ritier Moulay El\nHassan a pr\u00e9sid\u00e9, mardi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le prince h\u00e9ritier Moulay El Hassan a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, l\u2019ouverture de la 3e \u00e9dition du Morocco Gaming Expo (MGE 2026), un rendez-vous des jeunes passionn\u00e9s, professionnels et acteurs de l\u2019industrie du gaming, organis\u00e9 du 20 au 24 mai sous le haut patronage du roi Mohammed VI. [telquel.ma]\n-------------------------------------------------\nPlac\u00e9e sous le th\u00e8me \"Talent Marocain\", cette \u00e9dition, organis\u00e9e par le minist\u00e8re de la Jeunesse, de la Culture et de la Communication, met en valeur la cr\u00e9ativit\u00e9, l\u0027innovation et le savoir-faire des jeunes talents marocains dans le domaine du gaming et de l\u0027eSport. [www.lavieeco.com]\n-------------------------------------------------\nLe Prince H\u00e9ritier Moulay El Hassan a pr\u00e9sid\u00e9, ce mardi \u00e0 Rabat, l\u2019ouverture de la 3e \u00e9dition du Morocco Gaming Expo (MGE 2026), un rendez-vous incontournable des jeunes passionn\u00e9s, des professionnels et des acteurs de l\u2019industrie du gaming, organis\u00e9 du 20 au 24 mai sous le Haut Patronage du Roi Mohammed VI. [leseco.ma]\n-------------------------------------------------\nLa troisi\u00e8me \u00e9dition du Morocco Gaming Expo (MGE) s\u2019est ouverte \u00e0 Rabat sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, avec une inauguration pr\u00e9sid\u00e9e par Son Altesse Royale le Prince H\u00e9ritier Moulay El Hassan. [lnt.ma]\n-------------------------------------------------\nSAR le Prince H\u00e9ritier Moulay El Hassan pr\u00e9side \u00e0 Rabat l\u2019ouverture de la 3\u00e8me \u00e9dition du Morocco Gaming Expo. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Dans le cadre du d\u00e9veloppement\nde son projet Smart Health...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre du d\u00e9veloppement de son projet Smart Health Care City, l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) poursuit la structuration de son \u00e9cosyst\u00e8me de sant\u00e9 int\u00e9gr\u00e9 \u00e0 Bengu\u00e9rir [www.challenge.ma]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) poursuit le d\u00e9veloppement de son projet Smart Health Care City \u00e0 Benguerir, avec le renforcement progressif de son \u00e9cosyst\u00e8me hospitalo-universitaire articul\u00e9 autour de son h\u00f4pital universitaire et de la Faculty of Medical Sciences (FMS). [lnt.ma]\n-----         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
