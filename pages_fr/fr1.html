ammed VI, Amir Al-Mouminine, que D. [lematin.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, accomplira vendredi 20 mars 2026, correspondant au 1er Chaoual 1447 de l\u2019H\u00e9gire, la pri\u00e8re de l\u2019A\u00efd Al-Fitr \u00e0 la mosqu\u00e9e Ahl F\u00e8s au Mechouar \u00e0 Rabat, selon un communiqu\u00e9 du minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, que Dieu L\u2019assiste, accomplira vendredi 1er Chaoual 1447 de l\u2019H\u00e9gire correspondant au 20 mars 2026, la pri\u00e8re de l\u2019A\u00efd Al-Fitr b\u00e9ni \u00e0 la mosqu\u00e9e \u201cAhl F\u00e8s\u201d au Mechouar \u00e0 Rabat, annonce un communiqu\u00e9 du Minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie. [www.lereporter.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, que Dieu L\u2019assiste, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, de SAR le Prince Moulay Rachid et de SA le Prince Moulay Ahmed, a accompli, vendredi, la pri\u00e8re de l\u2019A\u00efd Al-Fitr b\u00e9ni \u00e0 la mosqu\u00e9e \u00ab Ahl F\u00e8s \u00bb au Mechouar \u00e0 Rabat, et re\u00e7u les v\u0153ux . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a indiqu\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a indiqu\u00e9, ce vendredi, que les \u00e9l\u00e9ments de la police au port de Tanger Med, en coordination avec les services des douanes, ont r\u00e9ussi jeudi soir \u00e0 d\u00e9jouer une tentative de trafic international de drogue et \u00e0 saisir trois tonnes et 932 kilogrammes de r\u00e9sine de cannabis . [fr.hespress.com]\n-------------------------------------------------\nUne op\u00e9ration conjointe de la police et des services de douane au port de Tanger-Med a permis de saisir, dans la soir\u00e9e du jeudi 19 mars, pr\u00e8s de 4 tonnes de haschich dissimul\u00e9es dans une cargaison de poissons congel\u00e9s. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les cours du p\u00e9trole reculaient\nvendredi apr\u00e8s une s\u00e9ance volatile,...", "mass": 5, "physics": false, "shape": "box", "title": "Les cours du p\u00e9trole reculaient vendredi apr\u00e8s une s\u00e9ance volatile, tandis que les Bourses asiatiques \u00e9voluaient majoritairement dans le rouge, p\u00e9nalis\u00e9es par les tensions li\u00e9es \u00e0 la guerre au Moyen-Orient qui en est \u00e0 sa troisi\u00e8me semaine. [fr.hespress.com]\n-------------------------------------------------\nLes cours du p\u00e9trole reculaient vendredi apr\u00e8s une s\u00e9ance volatile, tandis que les Bourses asiatiques \u00e9voluaient majoritairement dans le rouge, p\u00e9nalis\u00e9es par les tensions li\u00e9es \u00e0 la guerre au Moyen-Orient qui en est \u00e0 sa troisi\u00e8me semaine. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Voici les principaux titres d\u00e9velopp\u00e9s\npar la presse nationale ce...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les principaux titres d\u00e9velopp\u00e9s par la presse nationale ce vendredi 20 mars 2026: Le Matin \u00c0 l\u2019occasion de l\u2019av\u00e8nement de l\u2019A\u00efd Al Fitr b\u00e9ni, Sa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, que Dieu L\u2019assiste et Le glorifie, a adress\u00e9 des cartes de v\u0153ux et de f\u00e9licitations \u00e0 Ses fr\u00e8res Leurs Majest\u0                     if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
