s du Maroc, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le roi Mohammed VI a\nadress\u00e9 ce lundi un message...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI a adress\u00e9 ce lundi un message de condol\u00e9ances au vice-pr\u00e9sident des \u00c9mirats arabes unis, pr\u00e9sident du conseil des ministres et gouverneur de Duba\u00ef, \u00e0 la suite du d\u00e9c\u00e8s de son fr\u00e8re Ahmed Ben Rached Al-Maktoum. [www.yabiladi.com]\n-------------------------------------------------\nVoici les principaux titres d\u00e9velopp\u00e9s par la presse nationale de ce mardi 22 septembre 2026 Le Matin \u2022 Le Roi Mohammed VI a adress\u00e9 un message de condol\u00e9ances et de compassion au Pr\u00e9sident de l\u2019\u00c9tat des \u00c9mirats Arabes Unis, Cheikh Mohamed Ben Zayed Al Nahyane, \u00e0 la suite du d\u00e9c\u00e8s de Ahmed Ben Rached Al-Maktoum. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cet \u00e9v\u00e9nement comm\u00e9more le 28e\nanniversaire du d\u00e9c\u00e8s de Feu...", "mass": 5, "physics": false, "shape": "box", "title": "Cet \u00e9v\u00e9nement comm\u00e9more le 28e anniversaire du d\u00e9c\u00e8s de Feu le Roi Hassan II, selon un communiqu\u00e9 du minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie. [www.yabiladi.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, que Dieu L\u2019assiste, pr\u00e9sidera, ce lundi, la veill\u00e9e religieuse qui sera organis\u00e9e au Mausol\u00e9e Mohammed V \u00e0 Rabat, \u00e0 l\u2019occasion du 28e anniversaire de la disparition du grand regrett\u00e9 du Maroc, Feu SM le Roi Hassan II, que Dieu ait son \u00e2me, annonce un communiqu\u00e9 du minist\u00e8re . [aujourdhui.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, pr\u00e9sidera ce lundi 21 septembre une veill\u00e9e religieuse au Mausol\u00e9e Mohammed V \u00e0 Rabat, \u00e0 l\u2019occasion du 28e anniversaire de la disparition de Feu SM le Roi Hassan II. [www.lavieeco.com]\n-------------------------------------------------\nLe Roi Mohammed VI, Amir Al-Mouminine, pr\u00e9sidera, ce lundi, la veill\u00e9e religieuse qui sera organis\u00e9e au Mausol\u00e9e Mohammed V \u00e0 Rabat, \u00e0 l\u0027occasion du 28e anniversaire de la disparition de Feu Hassan II. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Lors d\u0027une rencontre \u00e0 Belgrade,\nl\u0027ambassadeur du Royaume, Omar Amghar,...", "mass": 5, "physics": false, "shape": "box", "title": "Lors d\u0027une rencontre \u00e0 Belgrade, l\u0027ambassadeur du Royaume, Omar Amghar, et le ministre serbe de l\u0027Information et des T\u00e9l\u00e9communications, Boris Bratina, ont examin\u00e9 les moyens de renforcer leur coop\u00e9ration, de la 5G \u00e0 la cybers\u00e9curit\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la Serbie ont examin\u00e9 les moyens de renforcer leur coop\u00e9ration bilat\u00e9rale dans le domaine de l\u2019intelligence artificielle (IA) et des technologies de l\u2019information, \u00e0 l\u2019occasion d\u2019une rencontre lundi \u00e0 Belgrade entre le ministre serbe de l\u2019Information et des T\u00e9l\u00e9communications, Boris Bratina, et l\u2019ambassadeur du Royaume \u00e0 Belgrade, Omar Amghar. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le ministre des Affaires \u00e9trang\u00e8res\nde la Coop\u00e9ration africaine et...", "mas         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
