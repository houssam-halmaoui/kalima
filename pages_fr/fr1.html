tion du Golfe (CCG), \u00e0 la suite des \u00ab agressions iraniennes abjectes \u00bb visant ces \u00c9tats, traduisent la solidarit\u00e9 du Maroc avec . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019ambassadeur, repr\u00e9sentant permanent du Maroc\naupr\u00e8s de l\u2019ONU \u00e0 Gen\u00e8ve,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU \u00e0 Gen\u00e8ve, Omar Zniber, a appel\u00e9, jeudi, \u00e0 renforcer l\u2019action collective pour lutter contre les discours de haine et promouvoir le dialogue interreligieux, soulignant que les \u00e9volutions pr\u00e9occupantes observ\u00e9es dans le monde rendent cette lutte \u00ab plus urgente que jamais \u00bb. [fr.hespress.com]\n-------------------------------------------------\nL\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU \u00e0 Gen\u00e8ve, Omar Zniber, a appel\u00e9, ce jeudi, \u00e0 renforcer l\u2019action collective pour lutter contre les discours de haine et promouvoir le dialogue interreligieux, soulignant que les \u00e9volutions pr\u00e9occupantes observ\u00e9es dans le monde rendent cette lutte \"plus urgente que jamais\". [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Maroc accueillera la 9e\nR\u00e9union minist\u00e9rielle conjointe avec les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc accueillera la 9e R\u00e9union minist\u00e9rielle conjointe avec les pays du Conseil de coop\u00e9ration des Etats arabes du Golfe, \u00e0 l\u2019initiative des pays du CCG en reconnaissance du r\u00f4le que joue le Royaume dans le renforcement des relations de coop\u00e9ration et du partenariat strat\u00e9gique entre les deux parties. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc accueillera la 9e R\u00e9union minist\u00e9rielle conjointe avec les pays du Conseil de coop\u00e9ration des Etats arabes du Golfe, \u00e0 l\u2019initiative des pays du CCG en reconnaissance du r\u00f4le que joue le Royaume dans le renforcement des relations de coop\u00e9ration et du partenariat strat\u00e9gique entre les deux parties. [atlasinfo.fr]\n-------------------------------------------------\nCette annonce a \u00e9t\u00e9 faite lors de la 8e R\u00e9union minist\u00e9rielle conjointe Maroc-CCG, tenue jeudi par visioconf\u00e9rence en pr\u00e9sence du ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ratio. [lematin.ma]\n-------------------------------------------------\nLe Maroc accueillera la 9e R\u00e9union minist\u00e9rielle conjointe avec les pays du Conseil de coop\u00e9ration des Etats arabes du Golfe (CCG), \u00e0 l\u2019initiative des pays du CCG en reconnaissance du r\u00f4le que joue le Royaume dans le renforcement des relations de coop\u00e9ration et du partenariat strat\u00e9gique entre les deux parties. [telquel.ma]\n-------------------------------------------------\nLe Maroc sappr\u00eate \u00e0 accueillir la 9e R\u00e9union minist\u00e9rielle conjointe avec les pays du Conseil de coop\u00e9ration des \u00c9tats arabes du Golfe. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les Etats arabes du Golfe\nont exprim\u00e9 leur gratitude au...", "mass": 5, "physics": false, "shape": "box", "title": "Les Etats arabes du Golfe ont exprim\u00e9 leur gratitude au Roi Mohammed VI pour ses positions de soutien et sa solidarit\u00e9 claire face a l\u2019agression iranienne. [fr.hespress.com]\n-------------------------------------------------\nLes repr\u00e9sentants des pays du Conseil de coop\u00e9ration du Golfe (CCG) ont exprim\u00e9, jeudi, leurs sinc\u00e8res remerciements et leur profonde consid\u00e9ration au roi Mohammed VI pour le soutien fort et la solidarit\u00e9 claire manifest\u00e9s par le Royaume du Maroc envers ses fr\u00e8res du Golfe face \u00e0 l\u2019agression iranienne. [telquel.ma]\n-------------------------------------------------\nLes repr\u00e9sentants des pays du Conseil de coop\u00e9ration du Golfe (CCG) ont exprim\u00e9, jeudi, leurs sinc\u00e8res remerciements et leur profonde consid\u00e9ration au Roi Mohammed VI pour le soutien fort et la solidarit\u00e9 claire manifest\u00e9s par le Royaume du Maroc envers ses fr\u00e8res du Golfe face \u00e0 l\u2019agression iranienne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Fondation Mohammed V pour\nla Solidarit\u00e9 lance son programme...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Mohammed V pour la Solidarit\u00e9 lance son programme 2026 de campagnes m\u00e9dicales de proximit\u00e9 avec une premi\u00e8re campagne m\u00e9dico-chirurgicale qui sera organis\u00e9e, du 13 au 15 mars, \u00e0 l\u2019occasion du mois sacr\u00e9 de Ramadan, \u00e0 la Commune de Oued Amlil (province de Taza) au b\u00e9n\u00e9fice des populations rurales. [fr.hespress.com]\n-------------------------------------------------\nLe dispositif m\u00e9dical mobilis\u00e9 couvrira plusieurs sp\u00e9cialit\u00e9s, avec la participation de pr\u00e8s de 100 personnes, dont 33 m\u00e9decins sp\u00e9cialistes. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Conseil sup\u00e9rieur des oul\u00e9mas\npr\u00e9cise dans un avis que...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil sup\u00e9rieur des oul\u00e9mas pr\u00e9cise dans un avis que la Zakat consiste \u00e0 offrir un boisseau proph\u00e9tique (Sa\u00e2 nabaoui) qui \u00e9quivaut \u00e0 4 amd\u00e         if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
