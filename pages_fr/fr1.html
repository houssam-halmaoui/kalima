ustrielle de LEONI Maroc \u00e0 Bouskoura. [lematin.ma]\n-------------------------------------------------\nLe groupe LEONI a lanc\u00e9 les travaux d\u2019une nouvelle unit\u00e9 industrielle \u00e0 Bouskoura, un projet de 640 millions de dirhams (MDH) qui devrait g\u00e9n\u00e9rer pr\u00e8s de 4.000 emplois directs et indirects. [www.lavieeco.com]\n-------------------------------------------------\nLeoni, fournisseur mondial de solutions de gestion de l\u2019\u00e9nergie et des donn\u00e9es pour le secteur automobile, a proc\u00e9d\u00e9, le 11 juin, au lancement des travaux de sa nouvelle unit\u00e9 industrielle \u00e0 Bouskoura. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La s\u00e9lection marocaine de football\na progress\u00e9 d\u2019une place pour...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football a progress\u00e9 d\u2019une place pour acc\u00e9der au 7\u00e8 rang mondial, pour la premi\u00e8re fois de l\u2019histoire, selon l\u2019\u00e9dition de juin du classement de la FIFA publi\u00e9e jeudi. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc franchit une \u00e9tape historique dans le dernier classement mondial masculin publi\u00e9 par la FIFA, co\u00efncidant avec le debut de la Coupe du monde 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le durcissement des conditions d\u2019exercice,\nau sein de l\u2019Union europ\u00e9enne,...", "mass": 5, "physics": false, "shape": "box", "title": "Le durcissement des conditions d\u2019exercice, au sein de l\u2019Union europ\u00e9enne, de l\u2019activit\u00e9 d\u2019interm\u00e9diation op\u00e9r\u00e9e par les filiales des banques marocaines constitue l\u2019un des principaux d\u00e9fis auxquels est confront\u00e9 l\u2019\u00e9cosyst\u00e8me national des transferts de fonds des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), a indiqu\u00e9, jeudi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de Bank Al-Maghrib (BAM), Abderrahim Bouazza. [telquel.ma]\n-------------------------------------------------\nLe renforcement des exigences r\u00e9glementaires impos\u00e9es dans l\u2019Union europ\u00e9enne aux filiales des banques marocaines constitue l\u2019un des principaux d\u00e9fis auxquels fait face le syst\u00e8me de transferts de fonds des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), a d\u00e9clar\u00e9 jeudi le directeur g\u00e9n\u00e9ral de Bank Al-Maghrib (BAM), Abderrahim Bouazza. [www.yabiladi.com]\n-------------------------------------------------\nLe durcissement des conditions d\u2019exercice, au sein de l\u2019Union Europ\u00e9enne, de l\u2019activit\u00e9 d\u2019interm\u00e9diation op\u00e9r\u00e9e par les filiales des banques marocaines constitue l\u2019un des principaux d\u00e9fis auxquels est confront\u00e9 l\u2019\u00e9cosyst\u00e8me national des transferts de fonds des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), a indiqu\u00e9, ce jeudi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de Bank Al-Maghrib (BAM), Abderrahim Bouazza. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Conseil de la r\u00e9gion\nF\u00e8s-Mekn\u00e8s a approuv\u00e9, lors d\u2019une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de la r\u00e9gion F\u00e8s-Mekn\u00e8s a approuv\u00e9, lors d\u2019une session extraordinaire tenue mercredi \u00e0 F\u00e8s, neuf conventions de partenariat relatives \u00e0 la r\u00e9alisation de plusieurs projets de d\u00e9veloppement, dont le projet de construction du Grand stade de Mekn\u00e8s, dot\u00e9 d\u2019une enveloppe financi\u00e8re globale de pr\u00e8s de 600 millions de dirhams (MDH). [telquel.ma]\n-------------------------------------------------\nLa future infrastructure sportive sera r\u00e9alis\u00e9e dans le cadre d\u2019un partenariat r\u00e9unissant le minist\u00e8re de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports, la FRMF, la r\u00e9gion F\u00e8s-Mekn\u00e8s, ainsi que d\u2019autres partenaires. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de la r\u00e9gion F\u00e8s-Mekn\u00e8s a approuv\u00e9, lors d\u2019une session extraordinaire tenue mercredi \u00e0 F\u00e8s, neuf conventions de partenariat relatives \u00e0 la r\u00e9alisation de plusieurs projets de d\u00e9veloppement, dont le projet de construction du Grand stade de Mekn\u00e8s, dot\u00e9 d\u2019une enveloppe financi\u00e8re globale de pr\u00e8s de 600 millions de dirhams (MDH). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019ailier Abde Ezzalzouli, le d\u00e9fenseur\nNoussair Mazraoui et le lat\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ailier Abde Ezzalzouli, le d\u00e9fenseur Noussair Mazraoui et le lat\u00e9ral Anass Salah Eddine, bless\u00e9s, ont manqu\u00e9 l\u2019entra\u00eenement de l\u2019\u00e9quipe du nationale mercredi \u00e0 Basking Ridge dans le New Jersey, \u00e0 trois jours de son entr\u00e9e en lice dans le Mondial contre le Br\u00e9sil. [telquel.ma]\n-------------------------------------------------\nNayef Aguerd et Abdessamad \u00ab Abde \u00bb Ezzalzouli, deux titulaires majeurs des Lions de l\u2019Atlas, ont officiellement d\u00e9clar\u00e9 forfait pour la Coupe du monde en raison de blessures. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le ministre du Transport et\nde la Logistique, Abdessamad Kayouh,...", "mass": 5, "physics": false, "shape": "box", "title": "Le minis         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;

                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;

                    if (network.body.nodes[labelId]) {

                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true

                }
            }
