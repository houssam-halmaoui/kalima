 le 12 et le 18 d\u00e9cembre, avec des r\u00e9serves d\u0027eau d\u00e9passant 5,5 milliards de m\u00e8tres cubes, a indiqu\u00e9 jeudi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les Lions de l\u2019Atlas ont\nouvert le score d\u00e8s la...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lions de l\u2019Atlas ont ouvert le score d\u00e8s la 4\u00e8 minute du jeu par le biais de Oussama Tannane, auteur d\u2019un missile du milieu de terrain qui a fil\u00e9 en pleine. [telquel.ma]\n-------------------------------------------------\nLes Lions de l\u2019Atlas ont ouvert le score d\u00e8s la 4\u00e8 minute du jeu par le biais de Oussama Tannane, auteur d\u2019un missile du milieu de terrain qui a fil\u00e9 en pleine . [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a remport\u00e9 la Coupe arabe (Qatar-2025), en s\u0027imposant face \u00e0 la Jordanie (3-2, a.p), jeudi au Stade Lusail. [www.lavieeco.com]\n-------------------------------------------------\nLes Lions de l\u2019Atlas ont ouvert le score d\u00e8s la 4\u00e8 minute du jeu par le biais de Oussama Tannane, auteur d\u2019un missile du milieu de terrain qui a fil\u00e9 en pleine [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a remport\u00e9, jeudi au stade Lusail, la Coupe arabe Qatar 2025, en s\u2019imposant face \u00e0 la Jordanie sur le score de 3 buts \u00e0 2 apr\u00e8s prolongations. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat, a approuv\u00e9...", "mass": 5, "physics": false, "shape": "box 9sentation du plan strat\u00e9gique de la Sonarges (Soci\u00e9t\u00e9 nationale de r\u00e9alisation et de gestion des \u00e9quipements sportifs), et au suivi de l\u2019avancement des projets structurants li\u00e9s \u00e0 la mise \u00e0 niveau des infrastructures sportives nationales. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans le cadre de la\nnouvelle r\u00e9glementation autorisant les bureaux...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la nouvelle r\u00e9glementation autorisant les bureaux de change \u00e0 accepter les paiements \u00e9lectroniques via des terminaux de paiement \u00e9lectronique (TPE), NAPS annonce la signature [www.challenge.ma]\n-------------------------------------------------\nDans le cadre de la nouvelle r\u00e9glementation autorisant les bureaux de change \u00e0 accepter les paiements \u00e9lectroniques via des terminaux de paiement \u00e9lectronique (TPE), NAPS annonce la signature d\u2019un partenariat strat\u00e9gique avec la F\u00e9d\u00e9ration Marocaine des Soci\u00e9t\u00e9s de Change de Devises. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La compagnie a\u00e9rienne Ryanair, en\npartenariat avec l\u2019Office National Marocain...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a\u00e9rienne Ryanair, en partenariat avec l\u2019Office National Marocain du Tourisme (ONMT), a annonc\u00e9 l\u2019ouverture d\u2019une nouvelle base \u00e0 Rabat \u00e0 partir d\u2019avril 2026, sa cinqui\u00e8me au [www.challenge.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne Ryanair, en partenariat avec l\u0027Office National Marocain du Tourisme (ONMT), a annonc\u00e9, mercredi \u00e0 l\u0027A\u00e9roport Rabat-Sal\u00e9, l\u0027ouverture d\u0027une nouvelle base \u00e0 Rabat \u00e0 partir d\u0027avril 2026, sa cinqui\u00e8me au Maroc, avec 2 avions bas\u00e9s, 20 lignes op\u00e9r\u00e9es et un investissement de 200 millions de dollars (M$). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Maroc occupe la premi\u00e8re\nplace en Afrique en termes...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc occupe la premi\u00e8re place en Afrique en termes de Stabilit\u00e9-Attractivit\u00e9, selon le classsement 2025 de l\u2019Institut Amadeus, qui pr\u00e9cise que le Royaume est le seul pays [www.challenge.ma]\n-------------------------------------------------\nLe Maroc s\u2019est hiss\u00e9 \u00e0 la 1re place du Classement 2025 combin\u00e9 Stabilit\u00e9-Attractivit\u00e9 en Afrique, selon l\u2019Institut Amadeus, en partenariat avec Casablanca Finance City Authority. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "McDonald\u2019s Maroc ouvre son 80e\nrestaurant \u00e0 l\u2019A\u00e9roport Mohammed V....", "mass": 5, "physics": false, "shape": "box", "title": "McDonald\u2019s Maroc ouvre son 80e restaurant \u00e0 l\u2019A\u00e9roport Mohammed V. Dans le sillage de la Coupe d\u2019Afrique des Nations 2025, qui s\u2019ouvre dimanche 21 d\u00e9cembre dans le Royaume, McDonald\u2019s Maroc franchit une nouvelle \u00e9tape strat\u00e9gique de son d\u00e9veloppement [www.challenge.ma]\n-------------------------------------------------\nMcDonald\u2019s Maroc ouvre son 80e restaurant \u00e0 l\u2019a\u00e9roport Mohammed V. Dans le cadre de la Coupe d\u2019Afrique des Nations 2025 organis\u00e9e par le Royaume du Maroc, McDonald\u2019s Maroc franchit une nouvelle \u00e9tape strat\u00e9gique de son d\u00e9veloppement avec l\u2019ouverture de son 80e restaurant, situ\u00e9 au Terminal 1 de l\u2019A\u00e9roport Mohammed V de Casablanca, au niveau des portes d\u2019embarquement E1 \u00e0 E8, principal hub a\u00e9rien du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "En leur qualit\u00e9 de copr\u00e9sidents\nde la Commission Nationale de...", "mass": 5, "physics": false, "shape": "box", "title": "En leur qualit\u00e9 de copr\u00e9sidents de la Commission Nationale de Gouvernance d\u2019Entreprise (CNGE), le minist\u00e8re de l\u2019Investissement, de la Convergence et de l\u2019\u00c9valuation des Politiques Publiques et la [www.challenge.ma]\n-------------------------------------------------\nLes nouveaux Codes de bonnes pratiques de gouvernance des entreprises ont \u00e9t\u00e9 lanc\u00e9s, mercredi \u00e0 Casablanca, \u00e0 l\u2019initiative du minist\u00e8re de l\u2019Investissement, de la Convergence et de l\u2019\u00c9valuation des politiques publiques et la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), en leur qualit\u00e9 de copr\u00e9sidents de la Commission nationale de gouvernance d\u2019entreprise (CNGE). [www.lereporter.ma]\n-------------------------------------------------\nLe Minist\u00e8re de l\u2019Investissement, de la Convergence et de l\u2019\u00c9valuation des Politiques Publiques et la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) ont coorganis\u00e9, le 17 d\u00e9cembre 2025 \u00e0 Casablanca, l\u2019\u00e9v\u00e9nement officiel de lancement des nouveaux codes de bonnes pratiques de gouvernance d\u2019entreprise, en leur qualit\u00e9 de copr\u00e9sidents de la Commission Nationale de Gouvernance d\u2019Entreprise . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "En application des Hautes Instructions\nRoyales, le gouvernement a lanc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "En ap comm_label_18", "label": "Il rejoint, par ailleurs, pour\nla premi\u00e8re fois le cercle...", "mass": 5, "physics": false, "shape": "box", "title": "Il rejoint, par ailleurs, pour la premi\u00e8re fois le cercle s\u00e9lectif des programmes labellis\u00e9s BGA (Business Graduates Association). [aujourdhui.ma]\n-------------------------------------------------\nLe Groupe ISCAE, leader en formation et recherche, franchit une nouvelle \u00e9tape dans la reconnaissance internationale, en obtenant pour la troisi\u00e8me fois cons\u00e9cutive la prestigieuse accr\u00e9ditation AMBA (Association of MBAs), tout en rejoignant, pour la premi\u00e8re fois, le cercle s\u00e9lectif des programmes labellis\u00e9s BGA (Business Graduates Association). [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "L\u0027op\u00e9ration humanitaire a concern\u00e9 les\npopulations des communes de Tlat...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027op\u00e9ration humanitaire a concern\u00e9 les populations des communes de Tlat N\u0027Yacoub (351 familles b\u00e9n\u00e9ficiaires), d\u0027Ighil (278 familles) et d\u0027Aghbar (334 familles), qui figurent parmi les zones les plus expos\u00e9es aux intemp\u00e9ries et \u00e0 la baisse des temp\u00e9ratures. [www.lavieeco.com]\n-------------------------------------------------\nLa Fondation Mohammed V pour la Solidarit\u00e9 a proc\u00e9d\u00e9, jeudi, \u00e0 la distribution d\u2019aides au profit de 963 m\u00e9nages issus de plusieurs communes de la province d\u2019Al Haouz, et ce dans le cadre de l\u2019Op\u00e9ration \u201cGrand Froid\u201d, lanc\u00e9e en application des instructions du roi Mohammed VI. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Sous le titre \"\u00c0 quelques\njours de la CAN, le...", "mass": 5, "physi <script>

    }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
