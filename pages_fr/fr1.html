Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc a accueilli 15,7 millions de touristes \u00e0 fin septembre 2026, en hausse de 5% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, soit plus de 717.000 arriv\u00e9es additionnelles, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [telquel.ma]\n-------------------------------------------------\nLe Maroc a accueilli 15,7 millions de touristes durant les neuf premiers mois de 2026, enregistrant une hausse de 5 % par rapport \u00e0 la m\u00eame p\u00e9riode en 2025, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La filiale du groupe OCP,\nJESA, acteur majeur dans la...", "mass": 5, "physics": false, "shape": "box", "title": "La filiale du groupe OCP, JESA, acteur majeur dans la livraison de projets et fournisseur de solutions int\u00e9gr\u00e9es au Maroc et en Afrique, accompagne le R\u00e9seau gazier du S\u00e9n\u00e9gal S.A. (RGS), filiale de Petrosen Holding, dans le d\u00e9veloppement et la pr\u00e9paration \u00e0 l\u2019exploitation du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe d\u2019ing\u00e9nierie JESA, coentreprise entre OCP et Worley, participe au d\u00e9veloppement du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal, une infrastructure de pr\u00e8s de 400 kilom\u00e8tres destin\u00e9e \u00e0 relier les ressources gazi\u00e8res offshore aux centrales \u00e9lectriques et aux zones industrielles du pays. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size":
