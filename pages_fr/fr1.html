es prenantes int. [lematin.ma]\n-------------------------------------------------\nCe label a pour vocation d\u2019encourager les entreprises marocaines \u00e0 adopter une d\u00e9marche globale en tenant compte des imp\u00e9ratifs \u00e9conomiques, environnementaux et sociaux dans leur strat\u00e9gie manag\u00e9riale [www.lavieeco.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) a attribu\u00e9, \u00e0 l\u2019issue de la r\u00e9union de son Comit\u00e9 d\u2019attribution du Label Responsabilit\u00e9 Soci\u00e9tale des Entreprises (RSE), le Label RSE \u00e0 Red Med Private Equity et l\u2019a renouvel\u00e9 \u00e0 l\u2019entreprise HPS. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Battu \u00e0 quatre reprises la\nsaison derni\u00e8re par son \u00e9ternel...", "mass": 5, "physics": false, "shape": "box", "title": "Battu \u00e0 quatre reprises la saison derni\u00e8re par son \u00e9ternel rival, le club madril\u00e8ne a pris sa revanche au Santiago Bernab\u00e9u gr\u00e2ce \u00e0 un Mbapp\u00e9 encore d\u00e9cisif (22e, 1-0) \u2014 malgr\u00e9 un. [lematin.ma]\n-------------------------------------------------\nLe Real a remport\u00e9 le premier Clasico de la saison, ce dimanche 26 octobre 2025, au Santiago Bernab\u00e9u. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La c\u00e9r\u00e9monie de lancement de\nla 10e \u00e9tape de la...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9r\u00e9monie de lancement de la 10e \u00e9tape de la course symbolique de relais de la Marche Verte s\u0027est tenue en pr\u00e9sence du secr\u00e9taire g\u00e9n\u00e9ral de la province de Guelmim-Oued Noun. [lematin.ma]\n-------------------------------------------------\nLa 10e \u00e9tape de la course symbolique de relais de la Marche verte, organis\u00e9e par la F\u00e9d\u00e9ration royale marocaine du sport pour tous (FRMSPT), a \u00e9t\u00e9 lanc\u00e9e dimanche \u00e0 Guelmim. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Plus de 10 000 coureurs\nont pris part ce dimanche...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 10 000 coureurs ont pris part ce dimanche \u00e0 la 16e \u00e9dition du Marathon de Casablanca. [lematin.ma]\n-------------------------------------------------\nLa 16e \u00e9dition du Marathon International de Casablanca, tenue ce dimanche, a \u00e9t\u00e9 marqu\u00e9e par une participation record de plus de 10.000 coureurs issus de 75 nationalit\u00e9s. [www.lopinion.ma]\n-------------------------------------------------\nEl Mahjoub Dazza s\u2019est adjug\u00e9 le titre apr\u00e8s avoir parcouru la distance de 42,195 km en 2h 09min 43sec, devan\u00e7ant son compatriote Omar Ait Chitachen, auteur d\u2019un. [telquel.ma]\n-------------------------------------------------\nLe coureur marocain El Mahjoub Dazza a remport\u00e9, dimanche, la 16\u1d49 \u00e9dition du Marathon International de Casablanca, marqu\u00e9e par la participation de plus de 10.000 coureurs et coureuses. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Pour l\u2019Office National Marocain du\nTourisme, \u00e0 l\u2019initiative de cet...", "mass": 5, "physics": false, "shape": "box", "title": "Pour l\u2019Office National Marocain du Tourisme, \u00e0 l\u2019initiative de cet accord strat\u00e9gique avec Delta Air Lines, cette arriv\u00e9e symbolise une \u00e9tape concr\u00e8te dans le renforcement des lien. [lematin.ma]\n-------------------------------------------------\nInauguration : Le Boeing 767-400 de Delta Air Lines s\u2019est pos\u00e9 dimanche 26 octobre 2025 \u00e0 Marrakech, marquant l\u2019ouverture officielle de la premi\u00e8re ligne directe reliant la m\u00e9tropole marocaine \u00e0 la ville d\u2019Atlanta. [aujourdhui.ma]\n-------------------------------------------------\nUn Boeing 767-400 de la compagnie \u201cDelta Air Lines\u201d a atterri dimanche \u00e0 l\u2019a\u00e9roport international de Marrakech-M\u00e9nara, marquant l\u2019ouverture officielle de la premi\u00e8re ligne directe reliant la m\u00e9tropole marocaine \u00e0 la ville d\u2019Atlanta. [www.lereporter.ma]\n-------------------------------------------------\nLe vol inaugural reliant Atlanta \u00e0 Marrakech a atterri, dimanche \u00e0 l\u2019a\u00e9roport de la cit\u00e9 ocre, marquant le lancement effectif de la ligne directe entre les deux villes par Delta Air Lines. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le rideau est tomb\u00e9 sur\nla 25\u1d49 \u00e9dition du Festival...", "mass": 5, "physics": false, "shape": "box", "title": "Le rideau est tomb\u00e9 sur la 25\u1d49 \u00e9dition du Festival national du film (FNF), tenue \u00e0 Tanger du 17 au 25 octobre courant, avec un palmar\u00e8s domin\u00e9 par \u00abLa Mer au loin\u00bb de Sa\u00efd Hamich B. [lematin.ma]\n-------------------------------------------------\nLe long-m\u00e9trage \u00ab La Mer au loin \u00bb, du r\u00e9alisateur marocain Sa\u00efd Hamich Benlarbi, a remport\u00e9 le Grand Prix de la 25\u00e8me \u00e9dition du Festival national du film de Tanger (FNF), qui a d\u00e9voil\u00e9 son palmar\u00e8s, samedi soir, au Palais des arts et de la culture. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Air France a annonc\u00e9, lundi,\nle renforcement de son offre...", "mass": 5, "physics": false, "shape": "box", "title": "Air France a annonc\u00e9, lundi, le renforcement de son offre au Maroc pour la saison hiver 2025-2026, avec un programme de vols \u00e9largi, l\u2019introduction de l\u2019Airbus A220 sur la ligne Rabat\u2013Paris, le d\u00e9ploiement des surmatelas Sofitel en cabine Business et le lancement progressif du wifi gratuit \u00e0 bord, selon un communiqu\u00e9 de la compagnie. [www.lopinion.ma]\n-------------------------------------------------\nAir France confirme son ancrage sur le march\u00e9 marocain \u00e0 travers un programme de vols enrichi et plusieurs nouveaut\u00e9s destin\u00e9es \u00e0 am\u00e9liorer l\u2019exp\u00e9rience de ses passagers. [lematin.ma]\n-------------------------------------------------\nAir France renforce sa pr\u00e9sence au Maroc en annon\u00e7ant plusieurs nouveaut\u00e9s pour l\u2019hiver 2025. [www.challenge.ma]\n-------------------------------------------------\nAir France a annonc\u00e9 un programme de vols hivernal \u00e9largi pour le Maroc, ainsi que de nouvelles am\u00e9liorations \u00e0 bord con\u00e7ues pour accro\u00eetre le confort et la connectivit\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nLa compagnie a\u00e9rienne Air France a annonc\u00e9, lundi, le renforcement de son offre et de ses services au Maroc avec l\u2019introduction de plusieurs nouveaut\u00e9s, notamment l\u2019arriv\u00e9e de l\u2019Airbus A220, le d\u00e9ploiement des surmatelas Sofitel et le lancement du wifi gratuit \u00e0 bord. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Ordre National des V\u00e9t\u00e9rinaires et\nAl Barid Bank ont proc\u00e9d\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Ordre National des V\u00e9t\u00e9rinaires et Al Barid Bank ont proc\u00e9d\u00e9 \u00e0 la signature d\u2019une convention de partenariat visant la mise en place d\u2019une offre bancaire d\u00e9di\u00e9e aux membres de l\ ressortissant fran\u00e7ais d\u2019origine alg\u00e9rienne, \u00e2g\u00e9 de 24 ans, faisant l\u2019objet d\u2019un mandat d\u2019arr\u00eat international \u00e9mis par les autorit\u00e9s judiciaires fran\u00e7aises. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Du 30 octobre au 2\nnovembre 2025, Essaouira f\u00eatera les...", "mass": 5, "physics": false, "shape": "box", "title": "Du 30 octobre au 2 novembre 2025, Essaouira f\u00eatera les 20 ans de son mythique Festival des Andalousies Atlantiques. [www.challenge.ma]\n-------------------------------------------------\nCet \u00e9v\u00e9nement r\u00e9unira des artistes venus des quatre coins du monde, chacun porteur d\u2019un h\u00e9ritage unique, pour c\u00e9l\u00e9brer la richesse de la musique andalouse et de ses influences. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement proposera une vingtaine de concerts r\u00e9unissant artistes marocains et internationaux autour du patrimoine musical andalou, jud\u00e9o-musulman et flamenco. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "\u00c0 l\u2019occasion de la c\u00e9l\u00e9bration\ndu 80\u1d49 anniversaire des Nations...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la c\u00e9l\u00e9bration du 80\u1d49 anniversaire des Nations Unies, le Groupe Barid Al-Maghrib annonce, en partenariat avec le Centre d\u2019Information des Nations Unies (CINU) au Maroc, l\u2019\u00e9mission d\u2019un timbre-poste comm\u00e9moratif intitul\u00e9 \u00ab Nations Unies : 80 ans \u00bb. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la c\u00e9l\u00e9bration du 80\u1d49 anniversaire des Nations Unies, le Groupe Barid Al-Maghrib annonce, en partenariat avec le Centre d\u2019Information des Nations Unies (CINU) au Maroc, l\u2019\u00e9mission d\u2019un timbre-poste comm\u00e9moratif intitul\u00e9 \u00ab Nations Unies : 80 ans \u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La 7\u1d49 \u00e9dition de la\nCoupe du Monde de Football...", "mass": 5, "physics": false, "shape": "box", "title": "La 7\u1d49 \u00e9dition de la Coupe du Monde de Football des Entreprises (FIFCO World Corporate Champions Cup) s\u2019est achev\u00e9e dimanche \u00e0 F\u00e8s par la victoire de l\u2019\u00e9quipe marocaine Ventec, qui s\u2019est impos\u00e9e en finale face \u00e0 la formation d\u2019Oman. [lnt.ma]\n-------------------------------------------------\nLa 7e \u00e9dition de la Coupe du monde de football des entreprises (FIFCO World Corporate Champions Cup) s\u2019est conclue en beaut\u00e9, dimanche \u00e0 F\u00e8s, avec la cons\u00e9cration de l\u2019\u00e9quipe maroc. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Biya, investi par le Rassemblement\nd\u00e9mocratique du Peuple camerounais (RDPC),...", "mass": 5, "physics": false, "shape": "box", "title": "Biya, investi par le Rassemblement d\u00e9mocratique du Peuple camerounais (RDPC), a devanc\u00e9 le candidat Issa Tchiroma Bakary, arriv\u00e9 deuxi\u00e8me avec 35,19% des voix, suivi de Cabral Libii (3,41%), . [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour un huiti\u00e8me mandat au Cameroun avec 53,66% des suffrages, selon les r\u00e9sultats officiels proclam\u00e9s par le Conseil constitutionnel lundi. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu sans surprise avec 53,66% des voix, selon les r\u00e9sultats officiels publi\u00e9s lundi, aussit\u00f4t contest\u00e9s par son principal adversaire Issa Tchiroma Bakary qui a d\u00e9nonc\u00e9 une \u00ab mascarade \u00bb. [www.lereporter.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya a \u00e9t\u00e9 r\u00e9\u00e9lu pour un huiti\u00e8me mandat cons\u00e9cutif \u00e0 la t\u00eate du pays, avec 53,66 % des suffrages exprim\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Forum de cl\u00f4ture du\nProgramme statistique panafricain II (PAS...", "mass": 5, "physics": false, "shape": "box", "title": "Le Forum de cl\u00f4ture du Programme statistique panafricain II (PAS II) s\u0027est ouvert, lundi 27 octobre \u00e0 Casablanca, mettant en avant ses principaux r\u00e9sultats et ses renseignement. [lematin.ma]\n-------------------------------------------------\nCe dispositif financ\u00e9 par l\u2019Union europ\u00e9enne, manag\u00e9 par Eurostat et mis en \u0153uvre par Statafric (Commission de l\u2019Union africaine) en partenariat avec Expertise France se veut un programme phare pour la modernisation du syst\u00e8me statistique . [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement a permis de pr\u00e9senter les principaux r\u00e9sultats du programme, ainsi que les enseignements tir\u00e9s en mati\u00e8re de coop\u00e9ration, d\u2019innovation et de gouvernance statistique sur le continent africain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Plusieurs agglom\u00e9rations b\u00e9n\u00e9ficieront de ce\nnouvel arrivage qui fait partie...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs agglom\u00e9rations b\u00e9n\u00e9ficieront de ce nouvel arrivage qui fait partie de la premi\u00e8re phase de ce programme visant \u00e0 doter l\u0027ensemble des villes du Royaume d\u0027un trans. [lematin.ma]\n-------------------------------------------------\nUn total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi au port de Casablanca, dans le cadre de la mise en \u0153uvre du nouveau Programme pour le transport public urbain par autobus (2025-2029). [telquel.ma]\n-------------------------------------------------\nUn total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s lundi au Port de Casablanca, dans le cadre de la premi\u00e8re phase du Programme national pour le transport public urbain par autobus (2025-2029). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Equatorial Coca-Cola Bottling Company (ECCBC)\nMaroc a inaugur\u00e9 aujourd\u2019hui les...", "mass": 5, "physics": false, "shape": "box", "title": "Equatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9 aujourd\u2019hui les nouvelles lignes de production de son usine COBOMI, implant\u00e9e dans la zone industrielle Technopole Mohammed V \u00e0 Nouaceur, Casablanca. [www.lopinion.ma]\n-------------------------------------------------\nCet investissement strat\u00e9gique de 715 millions de dirhams (MDH) dans l\u0027usine de Cobomi-Casablanca s\u0027inscrit dans le cadre d\u0027un plan d\u2019investissement global de \"Equatorial Coca-Cola Bottling Company\" au Maroc de pr\u00e8s de 3,2 milliards de dirhams (MMDH) mis en \u0153uvre entre 2020 et 2025. [www.lavieeco.com]\n-------------------------------------------------\nEquatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9, lundi 27 octobre, de nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle Technopole Mohammed V \u00e0 Nouaceur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true,         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {

                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });

            childList: true,
            subtree: true
