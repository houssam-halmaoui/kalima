": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le jury, compos\u00e9 de huit\npersonnalit\u00e9s de premier plan issues...", "mass": 5, "physics": false, "shape": "box", "title": "Le jury, compos\u00e9 de huit personnalit\u00e9s de premier plan issues de quatre continents et de diff\u00e9rentes g\u00e9n\u00e9rations, aura pour mission d\u2019appr\u00e9cier les quatorze premiers et seconds lon. [lematin.ma]\n-------------------------------------------------\n\u00c0 quelques jours de l\u2019ouverture de la 22\u1d49 \u00e9dition du Festival international du film de Marrakech, pr\u00e9vue du 28 novembre au 6 d\u00e9cembre 2025, les organisateurs d\u00e9voilent la composition d\u2019un jury qui illustre, une fois encore, l\u2019ambition du rendez-vous marocain. [www.lopinion.ma]\n-------------------------------------------------\nCe jury compos\u00e9 de huit personnalit\u00e9s issues de quatre continents et de diff\u00e9rentes g\u00e9n\u00e9rations sera charg\u00e9 d\u2019\u00e9valuer les quatorze premiers et seconds longs m\u00e9trages en comp\u00e9tition officielle, consacr\u00e9e. [telquel.ma]\n-------------------------------------------------\nLe Festival International du Film de Marrakech a d\u00e9voil\u00e9, mercredi, la composition du jury de sa 22e \u00e9dition, qui se tiendra du 28 novembre au 6 d\u00e9cembre 2025. [leseco.ma]\n-------------------------------------------------\nLe Festival international du film de Marrakech a d\u00e9voil\u00e9, mercredi, la composition du jury de la 22e \u00e9dition, qui se tiendra du 28 novembre au 6 d\u00e9cembre 2025. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Malawi, George Tapatula Chaponda,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \"historique\" par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [www.lopinion.ma]\n-------------------------------------------------\nLa Gambie par la voix de son ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration internationale et des Gambiens \u00e0 l\u2019\u00e9tranger, Sering Modou Njie, a r\u00e9it\u00e9r\u00e9, mercredi \u00e0 Rabat, son soutien constant \u00e0 la souverainet\u00e9 du Maroc sur le Sahara, se f\u00e9licitant vivement de l\u2019adoption par le Conseil de s\u00e9curit\u00e9 des Nations unies, de la r\u00e9solution . [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue gambien, Sering Modou Njie, ont r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, la d\u00e9termination du Maroc et de la Gambie \u00e0 consolider la coop\u00e9ration bilat\u00e9rale dans plusieurs domaines. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \u201chistorique\u201d par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Apr\u00e8s pr\u00e8s de deux mois\ndu d\u00e9marrage de l\u2019ann\u00e9     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },

                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,

                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
