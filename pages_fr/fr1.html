nn\u00e9e 1448 H- 2026 G, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu perp\u00e9tue Sa gloire, a bien voulu acc. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "TAMWILCOM et l\u2019Office National de\nl\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable...", "mass": 5, "physics": false, "shape": "box", "title": "TAMWILCOM et l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de garantie portant sur un financement de 250 millions d\u2019euros accord\u00e9 par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) \u00e0 la branche Eau de l\u2019ONEE. [fr.hespress.com]\n-------------------------------------------------\nTamwilcom et l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de garantie portant sur un financement de 250 millions d\u2019euros (M\u20ac) accord\u00e9 par la Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) \u00e0 l\u2019ONEE \u2013 Branche Eau. [telquel.ma]\n-------------------------------------------------\nLa Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) soutient la s\u00e9curit\u00e9 hydrique du Maroc gr\u00e2ce \u00e0 un pr\u00eat de 250 millions d\u2019euros accord\u00e9 \u00e0 l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE). [aujourdhui.ma]\n-------------------------------------------------\nLe financement mobilis\u00e9 contribuera \u00e0 accompagner les investissements de l\u0027ONEE visant \u00e0 renforcer l\u0027efficacit\u00e9, la r\u00e9silience et la durabilit\u00e9 des infrastructures de production d\u0027eau potable, en appui aux efforts du Royaume en mati\u00e8re de s\u00e9curit\u00e9 hydrique et d\u0027adaptation aux changements climatiques. [www.lavieeco.com]\n-------------------------------------------------\nTamwilcom et l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) ont sign\u00e9 une convention de garantie portant sur un financement de 250 millions d\u2019euros accord\u00e9 par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) \u00e0 la branche Eau de l\u2019Office. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Royaume du Maroc condamne,\ndans les termes les plus...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [fr.hespress.com]\n-------------------------------------------------\nLe Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nLe Maroc a fermement d\u00e9nonc\u00e9 les attaques par drones provenant des Houthis et des milices chiites dIrak, contre des installations p\u00e9troli\u00e8res en Arabie saoudite, consid\u00e9r\u00e9es comme un pays fr\u00e8re. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc a condamn\u00e9 avec fermet\u00e9 les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res en Arabie saoudite, r\u00e9affirmant sa pleine solidarit\u00e9 avec Riyad et son soutien aux mesures prises pour pr\u00e9server sa souverainet\u00e9 et sa s\u00e9curit\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a condamn\u00e9 mercredi dans les termes les plus fermes les attaques de drones ayant vis\u00e9 des installations p\u00e9troli\u00e8res en Arabie saoudite, exprimant sa pleine solidarit\u00e9 avec le Royaume face \u00e0 cette \"attaque odieuse\". [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Une vague de chaleur et\nun temps chaud sont attendus,...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur et un temps chaud sont attendus, de mercredi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte m\u00e9t\u00e9orologique de niveau de vigilance orange. [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur et un temps chaud sont attendus, de mercredi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte m\u00e9t\u00e9orologique de niveau de vigilance orange. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Groupe BCP et Seniors\nPlus ont conclu un partenariat...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe BCP et Seniors Plus ont conclu un partenariat pour le lancement de Bladi Tiqqa, une offre de services destin\u00e9e aux Marocains du Monde et con\u00e7ue pour r\u00e9pondre. [lematin.ma]\n-------------------------------------------------\nLe Groupe Banque Populaire du Maroc (BCP) s\u2019allie \u00e0 Seniors Plus pour lancer Bladi Tiqqa, une offre de services unique d\u00e9di\u00e9e aux Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE). [www.yabiladi.com]\n-------------------------------------------------\nLe Groupe Banque Centrale Populaire (BCP) et Seniors Plus ont conclu un partenariat strat\u00e9gique pour lancer \u00ab Bladi Tiqqa \u00bb, une offre de services destin\u00e9e aux Marocains du Monde (MDM) souhaitant accompagner leurs proches \u00e2g\u00e9s de 60 ans et plus vivant au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Intitul\u00e9 \u00abLe guide de la\nHACA pour comprendre le pluralisme...", "mass": 5, "physics": false, "shape": "box", "title": "Intitul\u00e9 \u00abLe guide de la HACA pour comprendre le pluralisme d\u2019expression politique \u00e0 la radio et \u00e0 la t\u00e9l\u00e9vision\u00bb, ce document pr\u00e9sente notamment les fondements constitutionnels et. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019approche des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales du 23 septembre 2026, la Haute Autorit\u00e9 de la Communication Audiovisuelle (HACA) publie et diffuse un guide destin\u00e9 \u00e0 pr\u00e9senter les principes, les r\u00e8gles et les m\u00e9canismes qui encadrent l\u2019expression pluraliste politique dans les m\u00e9dias audiovisuels, en p\u00e9riode \u00e9lectorale comme en dehors de celle-ci. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Cette pi\u00e8ce comm\u00e9morative pr\u00e9sente, \u00e0\nl\u0027avers, l\u0027effigie de Sa Majest\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Cette pi\u00e8ce comm\u00e9morative pr\u00e9sente, \u00e0 l\u0027avers, l\u0027effigie de Sa Majest\u00e9 le Roi Mohammed VI entour\u00e9e des inscriptions \u0645\u062d\u0645\u062f \u0627\u0644\u0633\u0627\u062f\u0633 et \u0627\u0644\u0645\u0645\u0644\u0643\u0629 \u0627\u0644\u0645\u063a\u0631\u0628\u064a\u0629 - \u2d5c\u2d30\u2d33\u2d4d. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u1d49 anniversaire de l\u2019intronisation du roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [telquel.ma]\n-------------------------------------------------\n\u00c0 loccasion du 27e anniversaire de laccession de Mohammed VI au Tr\u00f4ne, Bank Al-Maghrib (BAM) a d\u00e9voil\u00e9 une pi\u00e8ce comm\u00e9morative en argent, dune valeur faciale de 250 dirhams. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [aujourdhui.ma]\n-------------------------------------------------\nBank Al-Maghrib c\u00e9l\u00e8bre le 27e anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI par l\u2019\u00e9mission d\u2019une pi\u00e8ce comm\u00e9morative en argent d\u2019une valeur faciale de 250 dirhams. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Selon le 13\u1d49 Rapport sur\nla stabilit\u00e9 financi\u00e8re, publi\u00e9 conjointement...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le 13\u1d49 Rapport sur la stabilit\u00e9 financi\u00e8re, publi\u00e9 conjointement par Bank Al-Maghrib, l\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) et l\u2019Autorit\u00e9. [lematin.ma]\n-------------------------------------------------\nL\u2019activit\u00e9 Takaful a g\u00e9n\u00e9r\u00e9 un volume de primes de 141,9 millions de dirhams (MDH) en 2025, en hausse de 49,5% par rapport \u00e0 l\u2019exercice pr\u00e9c\u00e9dent, ressort-il du rapport annuel sur la stabilit\u00e9 financi\u00e8re. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "\u00c0 La\u00e2youne, l\u2019ambassadeur des \u00c9tats-Unis\nau Maroc, Duke Buchan III,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 La\u00e2youne, l\u2019ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan III, a annonc\u00e9 le premier financement public am\u00e9ricain en faveur d\u2019un projet du secteur priv\u00e9 dans le Sahara marocain. [telquel.ma]\n-------------------------------------------------\nLannonce du premier financement am\u00e9ricain pour un projet priv\u00e9 dans le Sahara marocain a marqu\u00e9 la visite, mardi \u00e0 La\u00e2youne, de lambassadeur des \u00c9tats-Unis, Duke Buchan. [www.yabiladi.com]\n-------------------------------------------------\nL\u0027ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan, a annonc\u00e9 sur X que Washington s\u0027engageait \u00e0 construire \"un avenir pacifique et prosp\u00e8re\" pour le Sahara marocain, apr\u00e8s sa rencontre avec le maire de La\u00e2youne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Une op\u00e9ration conjointe men\u00e9e par\nles agents de la S\u00fbret\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Une op\u00e9ration conjointe men\u00e9e par les agents de la S\u00fbret\u00e9 nationale et des Douanes au poste fronti\u00e8re de Guerguerat, au sud de Dakhla, mardi 28 juillet apr\u00e8s-midi, a permis la saisie de 61 kilogrammes de coca\u00efne et l\u2019arrestation de deux hommes, \u00e2g\u00e9s de 30 et 34 ans, soup\u00e7onn\u00e9s d\u2019implication dans un trafic international de stup\u00e9fiants.. [telquel.ma]\n-------------------------------------------------\nLa police marocaine et les douanes ont intercept\u00e9 61 kg de coca\u00efne et arr\u00eat\u00e9 deux suspects au poste-fronti\u00e8re de Guerguerat, au sud de Dakhla, lors d\u2019une op\u00e9ration conjointe mardi, rapporte la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Conseil d\u2019Administration de l\u2019Office\nNational de l\u2019Electricit\u00e9 et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019Administration de l\u2019Office National de l\u2019Electricit\u00e9 et de l\u2019Eau Potable (ONEE), tenu lundi \u00e0 Rabat, sous la Pr\u00e9sidence de la ministre de l\u2019Economie et des Finances, Nadia Fettah, a adopt\u00e9 le plan d\u2019\u00e9quipement 2026-2030 d\u2019une enveloppe de plus de 248 milliards de dirhams (MMDH). [telquel.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration de l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) a approuv\u00e9 un plan d\u2019\u00e9quipement 2026-2030 d\u2019un montant sup\u00e9rieur \u00e0 248 milliards de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les exportations des produits agroalimentaires\nont poursuivi leur progression, atteignant...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [telquel.ma]\n-------------------------------------------------\nLes exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [aujourdhui.ma]\n-------------------------------------------------\nLes exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Infobip, plateforme mondiale de communication\ncloud, et Orange Maroc annoncent...", "mass": 5, "physics": false, "shape": "box", "title": "Infobip, plateforme mondiale de communication cloud, et Orange Maroc annoncent le renforcement de leur partenariat autour de Smart Message Plus, une nouvelle version de l\u2019offre Smart Message de [www.challenge.ma]\n-------------------------------------------------\nOrange Maroc et Infobip, plateforme sp\u00e9cialis\u00e9e dans les communications cloud, annoncent le renforcement de leur partenariat avec le lancement de Smart Message Plus, une nouvelle version de l\u2019offre Smart Message d\u2019Orange Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le r\u00e9sultat net du secteur\ndes assurances a atteint 5,3...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00e9sultat net du secteur des assurances a atteint 5,3 milliards de dirhams (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur [www.challenge.ma]\n-------------------------------------------------\nLe r\u00e9sultat net du secteur des assurances a atteint 5,3 milliards de dirhams (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur la Stabilit\u00e9 financi\u00e8re. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9\navec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de...", "mass": 5, "physics": false, "shape": "box", "title": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9 avec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de son capital social par apport en num\u00e9raire, r\u00e9serv\u00e9e aux actionnaires et aux d\u00e9tenteurs de droits pr\u00e9f\u00e9rentiels de souscription [www.challenge.ma]\n-------------------------------------------------\nLes souscriptions ont atteint 884,6 MDH, soit 27% de plus que le montant propos\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nCr\u00e9dit du Maroc a cl\u00f4tur\u00e9 avec succ\u00e8s l\u0027op\u00e9ration d\u0027augmentation de son capital social par apport en num\u00e9raire, r\u00e9serv\u00e9e aux actionnaires et aux d\u00e9tenteurs de droits pr\u00e9f\u00e9rentiels de souscription (DPS), ayant fait l\u0027objet du prospectus vis\u00e9 par l\u0027Autorit\u00e9 marocaine du march\u00e9 des capitaux le 12 juin dernier. [leseco.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration, vis\u00e9e par l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) en juin dernier, a suscit\u00e9 une demande sup\u00e9rieure au montant propos\u00e9, traduisant un taux de souscription de 127 %. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le r\u00e9sultat net part du\ngroupe (RNPG) du groupe Attijariwafa...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00e9sultat net part du groupe (RNPG) du groupe Attijariwafa bank a atteint 5,9 milliards de dirhams (MMDH) au terme des six premiers mois de 2026, en progression [www.challenge.ma]\n-------------------------------------------------\nLe r\u00e9sultat net part du groupe (RNPG) du groupe Attijariwafa bank a atteint 5,9 milliards de dirhams (MMDH) au terme des six premiers mois d     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
