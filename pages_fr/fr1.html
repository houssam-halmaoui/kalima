nue des comp\u00e9titions internationales. [leseco.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine de Football a salu\u00e9 la d\u00e9cision rendue par le Jury d\u2019appel de la Conf\u00e9d\u00e9ration Africaine de Football concernant la finale de la Coupe d\u2019Afrique des Nations 2025 opposant le Maroc au S\u00e9n\u00e9gal, estimant que ce verdict renforce le respect des r\u00e8gles et la stabilit\u00e9 des comp\u00e9titions internationales. [lnt.ma]\n-------------------------------------------------\nLe jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9, mardi 17 mars, d\u2019annuler le r\u00e9sultat initial de la finale remport\u00e9e sur le terrain par le S\u00e9n\u00e9gal et de d\u00e9clarer le Maroc vainqueur de la comp\u00e9tition. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le pr\u00e9sident de la Conf\u00e9d\u00e9ration\nafricaine de football (CAF), Patrice...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, a affirm\u00e9, mercredi, qu\u2019aucun pays africain n\u2019est trait\u00e9 d\u2019 \u00bbune mani\u00e8re plus privil\u00e9gi\u00e9e, plus avantageuse ou plus favorable \u00bb. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration Africaine de Football (CAF), Patrice Motsepe, a affirm\u00e9, mercredi, qu\u2019aucun pays africain n\u2019est trait\u00e9 d\u2019\"une mani\u00e8re plus privil\u00e9gi\u00e9e, plus avantageuse ou plus favorable\". [atlasinfo.fr]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration Africaine de Football (CAF), Patrice Motsepe, a affirm\u00e9, mercredi, qu\u2019aucun pays africain n\u2019est trait\u00e9 d\u2019\u201dune mani\u00e8
