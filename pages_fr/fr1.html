borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Toujours en phase de r\u00e9cup\u00e9ration\napr\u00e8s une rupture des ligaments...", "mass": 5, "physics": false, "shape": "box", "title": "Toujours en phase de r\u00e9cup\u00e9ration apr\u00e8s une rupture des ligaments du genou, l\u2019international marocain Hamza Igamane ne pourra pas prendre part \u00e0 la phase r\u00e9guli\u00e8re de la Ligue des champions avec Lille. [fr.hespress.com]\n-------------------------------------------------\nL\u2019international marocain Hamza Igamane, toujours convalescent suite \u00e0 une rupture des ligaments contract\u00e9e en d\u00e9but d\u2019ann\u00e9e, ne disputera pas avec Lille la phase r\u00e9guli\u00e8re de la Ligue des champions, a-t-on indiqu\u00e9 aupr\u00e8s du club. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Directeur g\u00e9n\u00e9ral du p\u00f4le\nDGST-DGSN, Abdellatif Hammouchi, a d\u00e9cid\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Directeur g\u00e9n\u00e9ral du p\u00f4le DGST-DGSN, Abdellatif Hammouchi, a d\u00e9cid\u00e9 d\u2019accorder une promotion exceptionnelle au policier martyr du devoir, le gardien de la paix, Hamza El Zaam, de la Brigade antigang (BAG) de la s\u00fbret\u00e9 r\u00e9gionale d\u2019Al Hoceima. [fr.hespress.com]\n-------------------------------------------------\nMembre de la brigade antigang (BAG) de la s\u00fbret\u00e9 r\u00e9gionale d\u2019Al Hoceima, le gardien de la paix Hamza Za\u00e2m a \u00e9t\u00e9 tu\u00e9, ce lundi 7 septembre, lors d\u2019une attaque au fusil. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "S\u2019exprimant lundi \u00e0 Paris devant\nle Conseil de l\u2019OCDE, le...", "mass": 5, "physics": false, "shape         function positionCommunityLabels() {

            var communities = {};

                    communities[groupId].y += node.y;
