bat. [leseco.ma]\n-------------------------------------------------\nLa s\u00e9lection s\u00e9n\u00e9galaise a valid\u00e9 son ticket pour la finale de la Coupe d\u2019Afrique des Nations U17 de football (Maroc-2026) en \u00e9liminant le Maroc lors d\u2019une s\u00e9ance de tirs au but, apr\u00e8s un match nul de 1-1 dans le temps r\u00e9glementaire. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection s\u00e9n\u00e9galaise a rejoint la Tanzanie en finale de la Coupe d\u2019Afrique des Nations U17 de football (Maroc-2026), apr\u00e8s sa victoire face \u00e0 son homologue marocaine par 7 tirs au but \u00e0 6 (1-1 dans le temps r\u00e9glementaire), jeudi au Stade Moulay El Hassan \u00e0 Rabat. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Un Temps chaud et des\naverses orageuses locales avec risque...", "mass": 5, "physics": false, "shape": "box", "title": "Un Temps chaud et des averses orageuses locales avec risque de gr\u00eale sont pr\u00e9vus, de jeudi \u00e0 vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nUn temps chaud et des averses orageuses locales avec risque de gr\u00eale sont pr\u00e9vus, de vendredi \u00e0 lundi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nAinsi, des temp\u00e9ratures variant entre 40 et 43\u00b0C concerneront, de vendredi \u00e0 lundi, les provinces de Tata, Es-Semara, Assa-Zag, Boujdour, Aousserd et Oued Ed-Dahab, a pr\u00e9cis\u00e9 la DG. [lematin.ma]\n-------------------------------------------------\nUn temps chaud et des averses orageuses locales avec risque de gr\u00eale sont pr\u00e9vus, de vendredi \u00e0 lundi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019ambassadeur repr\u00e9sentant permanent du Maroc\naupr\u00e8s des Nations Unies, Omar...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a d\u00e9clar\u00e9, lors du s\u00e9minaire r\u00e9gional du Comit\u00e9 des 24 de l\u2019ONU (C24), tenu du 25 au 27 mai \u00e0 Managua au Nicaragua, que le maintien de la question du Sahara marocain dans l\u2019agenda de ce comit\u00e9 est anachronique. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a d\u00e9clar\u00e9, lors du s\u00e9minaire r\u00e9gional du Comit\u00e9 des 24 de l\u2019ONU (C24), tenu du 25 au 27 mai \u00e0 Managua au Nicaragua, que le maintien de la question du Sahara marocain dans l\u2019agenda de ce comit\u00e9 est anachronique. [www.lereporter.ma]\n-------------------------------------------------\nL\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a estim\u00e9 que le maintien de la question du Sahara marocain \u00e0 l\u2019ordre du jour du Comit\u00e9 des 24 de l\u2019ONU (C24) est d\u00e9sormais \u00ab anachronique \u00bb, au regard des d\u00e9veloppements r\u00e9cents enregistr\u00e9s autour de ce dossier. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Bank Of Africa (BOA) a\n\u00e9t\u00e9 d\u00e9sign\u00e9e meilleure banque d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Of Africa (BOA) a \u00e9t\u00e9 d\u00e9sign\u00e9e meilleure     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
