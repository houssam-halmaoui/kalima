n nationale de qualit\u00e9 de gestion d\u2019investissement IMQR par Fitch ratings, laquelle passe de \u00abStrong (mar)\u00bb \u00e0 \u00abExcellent (mar)\u00bb, avec une perspective stable. [leseco.ma]\n-------------------------------------------------\nValoris Management a annonc\u00e9 le rel\u00e8vement de sa notation nationale de qualit\u00e9 de gestion d\u2019investissement (IMQR) par Fitch Ratings, passant de \u00ab Strong (mar) \u00bb \u00e0 \u00ab Excellent (mar) \u00bb, avec une perspective stable. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "easyJet a officiellement inaugur\u00e9 \u00e0\nMarrakech sa premi\u00e8re base en...", "mass": 5, "physics": false, "shape": "box", "title": "easyJet a officiellement inaugur\u00e9 \u00e0 Marrakech sa premi\u00e8re base en Afrique, marquant une nouvelle \u00e9tape dans sa pr\u00e9sence au Maroc, o\u00f9 la compagnie op\u00e8re depuis plus de 20 ans. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u2019a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u2019Office national marocain du tourisme (ONMT). [telquel.ma]\n-------------------------------------------------\nLa compagnie easyJet a inaugur\u00e9, mercredi 15 avril, sa nouvelle base \u00e0 l\u2019a\u00e9roport Marrakech Menara, dans le cadre de la strat\u00e9gie de l\u2019Office National Marocain du Tourisme (ONMT) [www.challenge.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u0027a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u0027Office National Marocain du Tourisme (O             setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
