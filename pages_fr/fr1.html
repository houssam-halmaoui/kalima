cquisition de 100% du capital de Ramo Pharm, acteur marocain sp\u00e9cialis\u00e9. [lematin.ma]\n-------------------------------------------------\nLe groupe de Lamia Tazi a sign\u00e9 un accord pour acqu\u00e9rir 100 % du capital de Ramo Pharm, annonc\u00e9 ce mercredi 28. [telquel.ma]\n-------------------------------------------------\nLe groupe pharmaceutique marocain Sothema a annonc\u00e9, ce 28 octobre, la signature d\u2019un accord visant l\u2019acquisition de 100 % du capital de Ramo Pharm, entreprise sp\u00e9cialis\u00e9e dans les compl\u00e9ments alimentaires. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Son Altesse Royale la Princesse\nLalla Asmaa, Pr\u00e9sidente de la...", "mass": 5, "physics": false, "shape": "box", "title": "Son Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, a visit\u00e9, mardi \u00e0 Kigali, le M\u00e9morial d\u00e9di\u00e9 aux victimes du g\u00e9nocide rwandais, ainsi que le Mus. [lematin.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, a visit\u00e9, mardi \u00e0 Kigali, la Mike Stenbock Gemura Kitchen, la premi\u00e8re cuisine centrale du Rwanda d\u00e9di\u00e9e aux patients hospitalis\u00e9s et r\u00e9alis\u00e9e avec le soutien de la Fondation Mohammed VI pour le d\u00e9veloppement durable. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Ce programme renforc\u00e9 permettra \u00e0\nUnited de proposer son offre...", "mass": 5, "physics": false, "shape": "box", "title": "Ce programme renforc\u00e9 permettra \u00e0 United de proposer son offre de si\u00e8ges la plus \u00e9lev\u00e9e \u00e0 ce jour au d\u00e9part de Marrakech et de prolonger sa. [lematin.ma]\n-------------------------------------------------\nCe renforcement intervient seulement deux ans apr\u00e8s l\u2019ouverture de la liaison Marrakech-New York/Newark en octobre 2024. [www.lavieeco.com]\n-------------------------------------------------\nLa compagnie a\u00e9rienne United Airlines a annonc\u00e9 avoir renforc\u00e9 sa liaison saisonni\u00e8re sans escale entre Marrakech et New York/Newark pour la saison 2026-2027, avec une augmentation de plus de 37% de son offre de si\u00e8ges. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Chambre des conseillers a\n\u00e9lu, mardi en s\u00e9ance pl\u00e9ni\u00e8re,...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des conseillers a \u00e9lu, mardi en s\u00e9ance pl\u00e9ni\u00e8re, les deux nouveaux pr\u00e9sidents de la Commission de la justice, de la l\u00e9gislation et des droits de l\u2019Homme, et de la Commission de l\u2019int\u00e9rieur, des collectivit\u00e9s territoriales et des infrastructures. [telquel.ma]\n-------------------------------------------------\nMoulay Abderrahmane Blila, du groupe du RNI, a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de la Commission de la justice, de la l\u00e9gislation et des droits de l\u2019Homme, tandis qu\u2019Abou Bakr Abid, du groupe socialiste, a \u00e9t\u00e9 \u00e9lu \u00e0 la t\u00eate de la Commission de l\u2019int\u00e9rieur, des collectivit\u00e9s territoriales et des infrastructures. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Maroc a r\u00e9alis\u00e9 une\nprogression remarquable en se hissant...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a r\u00e9alis\u00e9 une progression remarquable en se hissant au quatri\u00e8me rang des destinations d\u2019investissement les plus attractives du continent africain, port\u00e9 par des ann\u00e9es d\u2019ind     function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
