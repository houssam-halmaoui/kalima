ge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Mission diplomatique des \u00c9tats-Unis\nau Maroc, a annonc\u00e9, samedi...", "mass": 5, "physics": false, "shape": "box", "title": "La Mission diplomatique des \u00c9tats-Unis au Maroc, a annonc\u00e9, samedi 4 avril, le d\u00e9m\u00e9nagement du consulat g\u00e9n\u00e9ral \u00e0 Casablanca vers un nouveau complexe situ\u00e9 dans le quartier de Casa Finance City. [telquel.ma]\n-------------------------------------------------\nLe Consulat g\u00e9n\u00e9ral des Etats-Unis \u00e0 Casablanca d\u00e9m\u00e9nage dans son nouveau complexe moderne et \u00e0 la pointe de la technologie situ\u00e9 \u00e0 Casa Finance City (Rue des Liserons), [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019Espagnol Rafael J\u00f3dar a remport\u00e9,\ndimanche \u00e0 Marrakech, la 40e...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Espagnol Rafael J\u00f3dar a remport\u00e9, dimanche \u00e0 Marrakech, la 40e \u00e9dition du Grand Prix Hassan II, disput\u00e9e sur les courts du Royal Tennis Club de Marrakech. [telquel.ma]\n-------------------------------------------------\nL\u2019Espagnol Rafael J\u00f3dar a remport\u00e9 la 40e \u00e9dition du Grand Prix Hassan II de tennis, disput\u00e9e du 30 mars au 5 avril sur les courts du Royal Tennis Club de Marrakech, en s\u2019imposant en finale face \u00e0 l\u2019Argentin Marco Trungelliti. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Bank Al-Maghrib et l\u2019Autorit\u00e9 Marocaine\ndu March\u00e9 des Capitaux (AMMC)...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib et l\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) annoncent la mise en ligne du site web institutionnel de l\u2019Instance de Coordination du March\u00e9 \u00e0 terme (ICMAT), [www.challenge.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) et l\u0027Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) ont annonc\u00e9, lundi, la mise en ligne du site web institutionnel de l\u0027Instance de coordination du March\u00e9 \u00e0 terme (ICMAT). [leseco.ma]\n-------------------------------------------------\nBank Al-Maghrib et Autorit\u00e9 Marocaine du March\u00e9 des Capitaux ont annonc\u00e9 la mise en ligne du portail institutionnel de l\u2019Instance de Coordination du March\u00e9 \u00e0 terme (ICMAT). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "z.systems, startup sp\u00e9cialis\u00e9e dans la\ndigitalisation du commerce traditionnel au...", "mass": 5, "physics": false, "shape": "box", "title": "z.systems, startup sp\u00e9cialis\u00e9e dans la digitalisation du commerce traditionnel au Maroc, annonce une nouvelle lev\u00e9e de fonds de 1,65 million de dollars, men\u00e9e par Azur Innovation Fund, avec [www.challenge.ma]\n-------------------------------------------------\nMen\u00e9e par AZUR Innovation Fund, l\u2019op\u00e9ration qui repr\u00e9sente le dernier tour de financement de z.systems r\u00e9unit investisseurs historiques et nouveaux partenaires autour de la plateforme d\u2019infrastructure digitale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Depuis son lancement, le service\nWeTaxi, d\u00e9velopp\u00e9 par la startup...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis son lancement, le service WeTaxi, d\u00e9velopp\u00e9 par la startup marocaine Tripass, a permis le transport de plus de 2,1 millions de passagers entre les a\u00e9roports du Royaume [www.challenge.ma]\n-------------------------------------------------\nLa startup marocaine Tripass met en avant les premiers r\u00e9sultats de WeTaxi, sa solution de digitalisation du transport en taxi au d\u00e9part des a\u00e9roports du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u00e9quipe nationale U17 a remport\u00e9,\ndimanche \u00e0 Benghazi (Libye), le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u00e9quipe nationale U17 a remport\u00e9, dimanche \u00e0 Benghazi (Libye), le tournoi de lUnion nord-africaine de football (UNAF) en signant un parcours sans faute, apr\u00e8s sa victoire lors de la derni\u00e8re journ\u00e9e face \u00e0 la s\u00e9lection libyenne sur le score de 3 buts \u00e0 1. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale U17 du Maroc a triomph\u00e9, dimanche \u00e0 Benghazi (Libye), en s\u2019imposant dans le tournoi de l\u2019Union Nord Africaine de Football (UNAF) avec un parcours sans faute. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale U17 a remport\u00e9, dimanche \u00e0 Benghazi (Libye), le tournoi de l\u2019Union Nord Africaine de Football (UNAF) en signant un parcours sans faute, apr\u00e8s sa victoire lors de la derni\u00e8re journ\u00e9e face \u00e0 la s\u00e9lection libyenne sur le score de 3 buts \u00e0 1. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La F\u00e9d\u00e9ration marocaine des professionnels\ndu sport (FMPS) a d\u00e9cern\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration marocaine des professionnels du sport (FMPS) a d\u00e9cern\u00e9 le label \u00abSoci\u00e9t\u00e9 Sportive 2026-2027\u00bb \u00e0 14 entreprises, \u00e0 l\u2019occasion d\u2019une c\u00e9r\u00e9m         function positionCommunityLabels() {

            var communities = {};

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }

                var numNodes = comm.nodes.length;
