 "label": "En marge de la 26\u1d49\nsession de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "En marge de la 26\u1d49 session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019ONU Tourisme \u00e0 Riyad, le Maroc a franchi une nouvelle \u00e9tape dans sa strat\u00e9gie de d\u00e9veloppement touristique. [lematin.ma]\n-------------------------------------------------\nUn m\u00e9morandum d\u2019entente (MoU) portant sur le d\u00e9veloppement de la Cit\u00e9 de la M\u00e9diterran\u00e9e \u00e0 Tanger a \u00e9t\u00e9 sign\u00e9 entre le d\u00e9partement du tourisme marocain et le groupe saoudien Naif Al Rajhi Investment, en marge de la 26e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation mondiale du tourisme des Nations unies, tenue du 7 au 11 novembre \u00e0 Riyad. [www.lopinion.ma]\n-------------------------------------------------\nEn marge de la 26\u1d49 session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale d\u2019ONU Tourisme \u00e0 Riyad, Fatim-Zahra Ammor, Ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et Solidaire, et Imad Barrakad, Directeur G\u00e9n\u00e9ral de la Soci\u00e9t\u00e9 Marocaine d\u2019Ing\u00e9nierie Touristique (SMIT), ont proc\u00e9d\u00e9 \u00e0 la signature d\u2019un m\u00e9morandum d\u2019entente avec le groupe saoudien Naif Al-Rajhi Investment, portant sur le d\u00e9veloppement de la Cit\u00e9 de la M\u00e9diterran\u00e9e \u00e0 Tanger, pour un investissement d\u2019environ 250 millions de dirhams. [leseco.ma]\n-------------------------------------------------\nUn m\u00e9morandum d\u2019entente (MoU) portant sur le d\u00e9veloppement de la Cit\u00e9 de la M\u00e9diterran\u00e9e \u00e0 Tanger a \u00e9t\u00e9 sign\u00e9 entre le d\u00e9partement du tourisme marocain et le groupe saoudien Naif Al Rajhi Investment, en marge de la 26e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation mondiale du tourisme des Nations unies, tenue du 7 au 11 novembre [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc et le groupe saoudien Naif Al Rajhi Investment ont conclu un m\u00e9morandum d\u2019entente (MoU) portant sur le d\u00e9veloppement de la Cit\u00e9 de la M\u00e9diterran\u00e9e \u00e0 Tanger, [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les cabinets accr\u00e9dit\u00e9s sont Certi\ntrust, Bureau Veritas, Targetup Consulting,...", "mass": 5, "physics": false, "shape": "box", "title": "Les cabinets accr\u00e9dit\u00e9s sont Certi trust, Bureau Veritas, Targetup Consulting, KPMG et SGS Maroc, indique la CGEM dans un communiqu\u00e9, rappelant que ledit label a \u00e9t\u00e9 lanc\u00e9 en mai 2. [lematin.ma]\n-------------------------------------------------\nLes cabinets accr\u00e9dit\u00e9s sont Certi trust, Bureau Veritas, Targetup Consulting, KPMG et SGS Maroc, indique la CGEM dans un communiqu\u00e9, rappelant que ledit label a \u00e9t\u00e9 lanc\u00e9 en. [telquel.ma]\n-------------------------------------------------\nLes cabinets accr\u00e9dit\u00e9s sont Certi trust, Bureau Veritas, Targetup Consulting, KPMG et SGS Maroc, indique la CGEM dans un communiqu\u00e9, rappelant que ledit label a \u00e9t\u00e9 lanc\u00e9 en . [lnt.ma]\n-------------------------------------------------\nLa CGEM a accr\u00e9dit\u00e9 cinq cabinets sp\u00e9cialis\u00e9s, Certi Trust, Bureau Veritas, Targetup Consulting, KPMG et SGS Maroc, pour mener les \u00e9valuations des entreprises candidates au Label PME Responsable. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les 14 ports marocains ouverts\nau commerce international assurent 95%...", "mass": 5, "physics": false, "shape": "box", "title": "Les 14 ports marocains ouverts au commerce international assurent es nationaux repr\u00e9sent\u00e9s dans les deux Chambres du Parlement se sont f\u00e9licit\u00e9s de l\u2019Approche participative u Roi Mohammed VI pour l\u2019actualisation et la formulation d\u00e9taill\u00e9e de l\u2019initiative d\u2019autonomie au Sahara marocain. [atlasinfo.fr]\n-------------------------------------------------\nLes chefs des partis politiques nationaux repr\u00e9sent\u00e9s dans les deux Chambres du Parlement ont salu\u00e9, lundi \u00e0 Rabat, l\u2019approche participative pr\u00f4n\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI pour l\u2019actualisation et la formulation d\u00e9taill\u00e9e de l\u2019initiative d\u2019autonomie au Sahara marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [fr.hespress.com]\n-------------------------------------------------\nAu total, 350 amendements ont \u00e9t\u00e9 pr\u00e9sent\u00e9s au cours de cette s\u00e9ance tenue en pr\u00e9sence du. [lematin.ma]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nAu total, 350 amendements ont \u00e9t\u00e9 pr\u00e9sent\u00e9s au cours de cette s\u00e9ance tenue en pr\u00e9sence du ministre d\u00e9l\u00e9gu\u00e9 char <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
