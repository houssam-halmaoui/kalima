i Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le roi au troisi\u00e8me Sommet Russie-Afrique. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, qui repr\u00e9sente Sa Majest\u00e9 le Roi au troisi\u00e8me Sommet Russie-Afrique. [www.lereporter.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, repr\u00e9sente SM le Roi Mohammed VI au troisi\u00e8me sommet Russie-Afrique, ouvert mercredi \u00e0 Moscou. [lnt.ma]\n-------------------------------------------------\nRepr\u00e9sentant le Roi Mohammed VI au troisi\u00e8me Sommet Russie-Afrique, la cheffe du gouvernement, Fatima Ezzahra El Mansouri, a r\u00e9affirm\u00e9 la place centrale du continent dans la politique \u00e9trang\u00e8re du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e\nMohammed Berrid, inspecteur g\u00e9n\u00e9ral des...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e Mohammed Berrid, inspecteur g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR) et commandant la zone sud a re\u00e7u, ce jeudi au si\u00e8ge de l\u2019\u00e9tat-major de la zone sud \u00e0 Agadir, le g\u00e9n\u00e9ral de division Jawwad Ahmed, nouveau commandant de la Force de la mission des Nations Unies dans les provinces sud du Royaume. [telquel.ma]\n-------------------------------------------------\nLe G\u00e9n\u00e9r             subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
