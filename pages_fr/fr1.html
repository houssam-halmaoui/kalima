rapport \u00ab. [lematin.ma]\n-------------------------------------------------\nSelon la deuxi\u00e8me \u00e9dition du rapport \u00abBusiness Ready\u00bb de la Banque mondiale, le Royaume se classe deuxi\u00e8me en Afrique et dans le Monde arabe, avec un score agr\u00e9g\u00e9 de 63,44 points sur 100, marquant une progression par rapport \u00e0 la premi\u00e8re \u00e9dition. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Les prix du gasoil et\nde l\u2019essence enregistrent une baisse...", "mass": 5, "physics": false, "shape": "box", "title": "Les prix du gasoil et de l\u2019essence enregistrent une baisse \u00e0 la pompe \u00e0 compter du 30 d\u00e9cembre 2025 \u00e0 00h01, marquant un retournement apr\u00e8s les deux derni\u00e8res hausses observ\u00e9es sur. [lematin.ma]\n-------------------------------------------------\nPour la premi\u00e8re fois depuis 2021, le prix du gasoil au Maroc est repass\u00e9 sous la barre symbolique des 10 dirhams le litre, marquant un tournant notable sur le march\u00e9 national des carburants. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Une rencontre \u00e9largie entre responsables\net acteurs \u00e9conomiques s\u0027est tenue...", "mass": 5, "physics": false, "shape": "box", "title": "Une rencontre \u00e9largie entre responsables et acteurs \u00e9conomiques s\u0027est tenue ce lundi matin au si\u00e8ge de la province d\u0027El Jadida, d\u00e9di\u00e9e \u00e0 la pr\u00e9sentation de nouveaux m\u00e9canismes de soutien aux entreprises. [www.lopinion.ma]\n-------------------------------------------------\nLa caravane r\u00e9gionale d\u00e9di\u00e9e \u00e0 la pr\u00e9sentation du nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME) a fait escale, lundi, dans la province d\u2 ut de l\u2019UNESCO pour l\u2019apprentissage tout au long de la vie (UIL) pour la p\u00e9riode 2026-2028, \u00e0 travers la diplomate Zohour Alaoui, ambassadrice du Royaume \u00e0 Berlin. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de\nla P\u00eache maritime a annonc\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de la P\u00eache maritime a annonc\u00e9, mardi, l\u2019ouverture de la campagne de p\u00eache au poulpe hivernale \u00e0 partir du 1er janvier jusqu\u2019au 31 mars 2026 sur tout le littoral national. [www.lopinion.ma]\n-------------------------------------------------\nLe secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de la P\u00eache maritime a annonc\u00e9, mardi 30 d\u00e9cembre, l\u2019ouverture de la campagne de p\u00eache au poulpe hivernale \u00e0 partir du 1er janvier jusqu\u2019au [www.challenge.ma]\n-------------------------------------------------\nLe secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de la P\u00eache maritime a annonc\u00e9 le lancement de la campagne hivernale de p\u00eache au poulpe, qui se d\u00e9roulera du 1er janvier au 31 mars 2026 sur l\u2019ensemble du littoral national. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La Soci\u00e9t\u00e9 nationale des autoroutes\ndu Maroc (ADM) a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Soci\u00e9t\u00e9 nationale des autoroutes du Maroc (ADM) a annonc\u00e9 ce lundi la fin des travaux de transformation du n\u0153ud autoroutier de A\u00efn Harrouda, entr\u00e9e nord de Casablanca. [telquel.ma]\n-------------------------------------------------\nL\u2019infrastructure made in Morocco, dont la r\u00e9alisation a n\u00e9cessit\u00e9 un investissem
