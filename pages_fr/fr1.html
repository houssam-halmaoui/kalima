19a\u00e9roport...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office National des A\u00e9roports (ONDA), a fait savoir que l\u2019a\u00e9roport de Rabat-Sal\u00e9 a accueilli, \u00e0 fin avril dernier, un total de 776.908 passagers, contre 684.607 durant la m\u00eame p\u00e9riode de l\u2019ann\u00e9e \u00e9coul\u00e9e. [fr.hespress.com]\n-------------------------------------------------\nL\u0027a\u00e9roport de Rabat-Sal\u00e9 a accueilli, \u00e0 fin avril dernier, un total de 776.908 passagers, contre 684.607 durant la m\u00eame p\u00e9riode de l\u2019ann\u00e9e \u00e9coul\u00e9e, soit une hausse de 13,48%, selon les donn\u00e9es publi\u00e9es par l\u2019Office national des a\u00e9roports (ONDA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Sign\u00e9e au nouveau si\u00e8ge de\nla DGSN par la ministre...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9e au nouveau si\u00e8ge de la DGSN par la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u0027Administration, Amal El Fallah Seghrouchni, et le Directeur. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019Administration et la Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) ont sign\u00e9, mercredi \u00e0 Rabat, une convention-cadre pour appuyer le partenariat institutionnel visant \u00e0 d\u00e9velopper les programmes d\u2019accueil des usagers des services de la S\u00fbret\u00e9 nationale, aux niveaux central et r\u00e9gional. [www.lereporter.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration et la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale ont sign\u00e9 une convention-cadre destin\u00e9e \u00e0 renforcer la qualit\u00e9 de l\u2019accueil des usagers au sein des services de la S\u00fbret\u00e9 nationale, aussi bien au niveau central que r\u00e9gional. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La F\u00e9d\u00e9ration de la gauche\nd\u00e9mocratique (FGD) et le Parti...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration de la gauche d\u00e9mocratique (FGD) et le Parti socialiste unifi\u00e9 (PSU) ont annonc\u00e9, lors d\u2019une conf\u00e9rence de presse organis\u00e9e ce mercredi \u00e0 Casablanca, la cr\u00e9ation d\u2019une alliance politique strat\u00e9gique baptis\u00e9e \u201cAlliance de la gauche\u201d. [telquel.ma]\n-------------------------------------------------\nLe processus de coordination engag\u00e9 depuis des mois entre le Parti socialiste unifi\u00e9 (PSU) et la F\u00e9d\u00e9ration de la gauche d\u00e9mocratique (FGD) a abouti, mercredi \u00e0 Casablanca, \u00e0 l\u2019annonce officielle de la cr\u00e9ation de l\u2019\u00abAlliance de la gauche\u00bb. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Plus de 300 chercheurs, experts,\ndoctorants et leaders industriels issus...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 300 chercheurs, experts, doctorants et leaders industriels issus de plus de 35 pays se sont r\u00e9unis mercredi \u00e0 Marrakech, \u00e0 l\u2019occasion de la 25\u00e8 \u00e9dition de la Conf\u00e9rence mondiale de l\u2019association des universit\u00e9s du textile (AUTEX), pour \u00e9changer autour des ruptures technologiques et dessiner les tendances futures de la fili\u00e8re du textile. [telquel.ma]\n-------------------------------------------------\nR\u00e9unissant plus de 300 chercheurs, experts et industriels venus de plus de 35 pays, la 25\u1d49 Conf\u00e9rence mondiale de l\u2019Association des universit\u00e9s du textile (AUTEX) s\u2019est ouverte \u00e0 Marrakech. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Tamwilcom a lanc\u00e9, mercredi \u00e0\nSal\u00e9, son nouveau plan strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Tamwilcom a lanc\u00e9, mercredi \u00e0 Sal\u00e9, son nouveau plan strat\u00e9gique 2026-2030, baptis\u00e9 \u00ab Jossour 2030 \u00bb, qui pr\u00e9voit la mobilisation de 300 milliards de dirhams (MMDH) de financements, pour un volume d\u2019engagements de 170 MMDH. [telquel.ma]\n-------------------------------------------------\nTamwilcom a lanc\u00e9, ce mercredi \u00e0 Sal\u00e9, son nouveau plan strat\u00e9gique 2026-2030, baptis\u00e9 \"Jossour 2030\", qui pr\u00e9voit la mobilisation de 300 milliards de dirhams (MMDH) de financements, pour un volume d\u0027engagements de 170 MMDH. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le chef du gouvernement, Aziz\nAkhannouch a repr\u00e9sent\u00e9 le roi...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 le roi Mohammed VI, mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar Morin, disparu le 29 mai dernier. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, mercredi \u00e0 Paris, \u00e0 la c\u00e9r\u00e9monie d\u2019hommage national au philosophe et \u00e9crivain fran\u00e7ais, Edgar [www.challenge.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a repr\u00e9sent\u00e9 le Roi Mohammed VI, ce mercredi w York. [www.lavieeco.com]\n-------------------------------------------------\nLe Royaume du Maroc a \u00e9t\u00e9 choisi, mardi \u00e0 New York, pour occuper le premier si\u00e8ge lors de la 81\u00e8 session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations Unies qui d\u00e9butera en septembre prochain. [lnt.ma]\n-------------------------------------------------\nLe Maroc a \u00e9t\u00e9 d\u00e9sign\u00e9, mardi \u00e0 New York, par tirage au sort pour occuper le premier si\u00e8ge lors de la 81e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations Unies, qui s\u2019ouvrira en septembre prochain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Plus de 105.000 personnes ont\nb\u00e9n\u00e9fici\u00e9 du programme d\u2019aide directe...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 105.000 personnes ont b\u00e9n\u00e9fici\u00e9 du programme d\u2019aide directe au logement, a indiqu\u00e9 mardi \u00e0 Rabat, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Habitat, Adib Benbrahim. [telquel.ma]\n-------------------------------------------------\nEn r\u00e9ponse \u00e0 une question orale \u00e0 la Chambre des conseillers sur \u00ab le bilan du programme d\u2019aide directe au logement \u00bb, le responsable gouvernemental a pr\u00e9cis\u00e9 que le programme a connu . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Voici un communiqu\u00e9 du Cabinet\nRoyal : \u00ab Dans le...", "mass": 5, "physics": false, "shape": "box", "title": "Voici un communiqu\u00e9 du Cabinet Royal : \u00ab Dans le cadre de la visite priv\u00e9e qu\u2019effectue Son Altesse Cheikh Mohammed Ben Zayed Al-Nahyane, Pr\u00e9sident de l\u2019Etat des Emirats Arabes Unis fr\u00e8re,. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident des         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
