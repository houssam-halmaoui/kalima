e, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Quelque 390.000 veuves b\u00e9n\u00e9ficient du\nprogramme d\u0027aide sociale directe, a...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 390.000 veuves b\u00e9n\u00e9ficient du programme d\u0027aide sociale directe, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le parlement, porte-parole du gouvernement, Mustapha Baitas. [www.lopinion.ma]\n-------------------------------------------------\nQuelque 390.000 veuves b\u00e9n\u00e9ficient du programme d\u2019aide sociale directe, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le parlement, porte-parole du gouvernement, Mustapha Baitas. [maroc-diplomatique.net]\n-------------------------------------------------\nEn r\u00e9ponse \u00e0 une question pos\u00e9e lors d\u0027un point de presse \u00e0 l\u0027issue du Conseil de gouvernement, Mustapha Baitas a expliqu\u00e9 que le syst\u00e8me d\u0027aide sociale couvre d\u00e9sormai. [lematin.ma]\n-------------------------------------------------\nQuelque 390 000 veuves b\u00e9n\u00e9ficient du programme d\u2019aide sociale directe, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le parlement, porte-parole du gouvernement, Mustapha Baitas. [www.yabiladi.com]\n-------------------------------------------------\nQuelque 390.000 veuves b\u00e9n\u00e9ficient du programme d\u2019aide sociale directe, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le Conseil de gouvernement a\nadopt\u00e9, jeudi, le projet de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9, jeudi, le projet de loi n\u00b022.25 relatif \u00e0 l\u0027accr\u00e9ditation des organismes d\u0027\u00e9valuation de la conformit\u00e9, pr\u00e9sent\u00e9 par le ministre de l\u0027Industrie et du Commerce. [www.lopinion.ma]\n-------------------------------------------------\nLe projet de loi vise \u00e0 d\u00e9finir le cadre g\u00e9n\u00e9ral du syst\u00e8me d\u0027accr\u00e9ditation et \u00e0 cr\u00e9er l\u0027Institut marocain d\u0027accr\u00e9ditation des organismes d\u0027\u00e9valuation de la conformit\u00e9. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi, deux projets de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi, deux projets de d\u00e9cret relatifs \u00e0 l\u0027application de la Haute D\u00e9cision Royale d\u00e9cr\u00e9tant la journ\u00e9e du 31 octobre de chaque ann\u00e9e F\u00eate nationale baptis\u00e9e \"Aid Al Wahda\" (F\u00eate de l\u0027Unit\u00e9). [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, ce jeudi 15 janvier, deux projets de d\u00e9cret relatifs \u00e0 l\u0027application de la d\u00e9cision royale d\u00e9cr\u00e9tant le 31 octobre F\u00eate de l\u0027Unit\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, deux projets de d\u00e9cret relatifs \u00e0 l\u2019application de la d\u00e9cision royale d\u00e9cr\u00e9tant la journ\u00e9e du 31 octobre de chaque ann\u00e9e F\u00eate nationale baptis\u00e9e \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9). [telquel.ma]\n-------------------------------------------------\nLe conseil de gouvernement a approuv\u00e9, jeudi, deux projets de d\u00e9cret relatifs \u00e0 lapplication de la d\u00e9cision royale d\u00e9cr\u00e9tant la journ\u00e9e du 31 octobre de chaque ann\u00e9e F\u00eate nationale baptis\u00e9e Aid Al Wahda (F\u00eate de lunit\u00e9). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Lors de la cinqui\u00e8me r\u00e9union\ninternationale des ministres en charge...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la cinqui\u00e8me r\u00e9union internationale des ministres en charge des affaires mini\u00e8res \u00e0 Riyad, la ministre de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, Leila Benali, a pr\u00e9sent\u00e9 la strat\u00e9gie du Royaume visant \u00e0 devenir un hub r\u00e9gional pour les minerais et les m\u00e9taux verts, reliant l\u2019Afrique de l\u2019Ouest aux march\u00e9s mondiaux. [www.lopinion.ma]\n-------------------------------------------------\nLa ministre de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, Leila Benali, s\u2019est entretenue mercredi \u00e0 Riyad, avec le ministre des Mines de la R\u00e9publique d\u00e9mocratique du Congo, Louis Watum Kabamba, sur les perspectives de la coop\u00e9ration bilat\u00e9rale dans le secteur minier, en marge de la 5eme la Conf\u00e9rence mini\u00e8re internationale, qui se tient du. [telquel.ma]\n-------------------------------------------------\nEn marge de la 5e Conf\u00e9rence mini\u00e8re internationale \u00e0 Riyad, la ministre de la Transition \u00e9nerg\u00e9tique et du d\u00e9veloppement durable, Leila Benali, s\u2019est entretenue avec son homologue congolais des Mines, Louis Watum Kabamba, afin d\u2019examiner les perspectives de coop\u00e9ration bilat\u00e9rale dans le secteur minier, en mettant l\u2019accent sur la cr\u00e9ation de valeur locale, le d\u00e9veloppement durable et la bonne gouvernance \u00e0 l\u2019\u00e9chelle africaine. [www.lavieeco.com]\n-------------------------------------------------\nLeila Benali, ministre de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, s\u2019est entretenue \u00e0 Riyad avec Bandar bin Ibrahim Al-Khorayef, en marge de la cinqui\u00e8me \u00e9dition de la Conf\u00e9rence mini\u00e8re internationale organis\u00e9e du 13 au 15 janvier. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Fondation Nationale des Mus\u00e9es\n(FNM) et la Fondation du...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Nationale des Mus\u00e9es (FNM) et la Fondation du Patrimoine culturel prussien (Stiftung Preu\u00dfischer Kulturbesitz \u2013 SPK) ont sign\u00e9, jeudi \u00e0 Rabat, une convention de partenariat strat\u00e9gique visant \u00e0 renforcer la coop\u00e9ration maroco-allemande dans les domaines mus\u00e9al, scientifique, \u00e9ducatif et culturel. [www.lopinion.ma]\n-------------------------------------------------\nLa Fondation nationale des mus\u00e9es (FNM) et la Fondation du patrimoine culturel prussien (Stiftung Preu\u00dfischer Kulturbesitz \u2013 SPK) ont conclu, jeudi \u00e0 Rabat, une convention de partenariat visant \u00e0 renforcer leur coop\u00e9ration dans le domaine des mus\u00e9es. [telquel.ma]\n-------------------------------------------------\nLa Fondation nationale des mus\u00e9es (FNM) et la Fondation du patrimoine culturel prussien (Stiftung Preu\u00dfischer Kulturbesitz \u2013 SPK) ont conclu, jeudi \u00e0 Rabat, une convention de partenariat visant \u00e0 renforcer leur coop\u00e9ration dans le domaine des mus\u00e9es. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Dans le cadre des rencontres\np\u00e9riodiques entre les Forces arm\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre des rencontres p\u00e9riodiques entre les Forces arm\u00e9es royales (FAR) et la Mission des Nations Unies dans les provinces Sud du Royaume, le g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e, Mohammed Berrid, inspecteur g\u00e9n\u00e9ral des FAR et commandant la Zone Sud, a re\u00e7u, jeudi au si\u00e8ge de l\u2019Etat-major de la Zone Sud \u00e0 Agadir, le g\u00e9n\u00e9ral. [telquel.ma]\n-------------------------------------------------\nDans le cadre des rencontres p\u00e9riodiques entre les Forces Arm\u00e9es Royales (FAR) et la Mission des Nations Unies dans les provinces Sud du Royaume, le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud, a re\u00e7u, jeudi au si\u00e8ge de l\u2019Etat-Major de la Zone Sud \u00e0 Agadir, le G\u00e9n\u00e9ral [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Maroc a \u00e9t\u00e9 plac\u00e9\ndans le groupe A de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a \u00e9t\u00e9 plac\u00e9 dans le groupe A de la Coupe d\u2019Afrique des nations f\u00e9minine, pr\u00e9vue du 17 mars au 3 avril prochains au Maroc, aux c\u00f4t\u00e9s de l\u2019Alg\u00e9rie, du S\u00e9n\u00e9gal et du Kenya, \u00e0 l\u2019issue du tirage au sort, effectu\u00e9 jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [telquel.ma]\n-------------------------------------------------\nLes Lionnes de l\u2019Atlas affronteront l\u2019Alg\u00e9rie, le S\u00e9n\u00e9gal et le Kenya dans une \u00e9dition \u00e9largie \u00e0 16 \u00e9quipes, qualificative pour la Coupe du monde f\u00e9minine 2027 au Br\u00e9sil. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a \u00e9t\u00e9 plac\u00e9 dans le groupe A de la Coupe d\u2019Afrique des nations f\u00e9minine, pr\u00e9vue du 17 mars au 3 avril prochains au Maroc, aux c\u00f4t\u00e9s de l\u2019Alg\u00e9rie, du S\u00e9n\u00e9gal et du Kenya, \u00e0 l\u2019issue du tirage au sort, effectu\u00e9 jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les r\u00e9formes r\u00e9glementaires \u00ab plus\nprofondes que pr\u00e9vu \u00bb mises...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9formes r\u00e9glementaires \u00ab plus profondes que pr\u00e9vu \u00bb mises en \u0153uvre au Maroc pour promouvoir l\u2019activit\u00e9 du secteur priv\u00e9 pourraient stimuler la croissance, r\u00e9duire l\u2019\u00e9conomie informelle et cr\u00e9er des emplois, estime le Groupe de la Banque mondiale (BM) dans une mise \u00e0 jour de ses \u00ab Perspectives \u00e9conomiques mondiales \u00bb, rendues publiques \u00e0 Washington. [telquel.ma]\n-------------------------------------------------\nLes r\u00e9formes r\u00e9glementaires engag\u00e9es au Maroc pour renforcer le r\u00f4le du secteur priv\u00e9 pourraient avoir des effets positifs significatifs sur la croissance \u00e9conomique, la r\u00e9duction de l\u2019\u00e9conomie informelle et la cr\u00e9ation d\u2019emplois. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le s\u00e9lectionneur national, Walid Regragui,\ns\u2019est dit heureux pour les...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, s\u2019est dit heureux pour les joueurs et le public, apr\u00e8s la qualification des Lions de l\u2019Atlas pour la finale de la CAN Maroc-2025 en battant, mercredi, le Nigeria. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, s\u0027est dit heureux pour les joueurs et le public, apr\u00e8s la qualification des Lions de l\u0027Atlas pour la finale de la CAN Maroc-2025 en battant, mercredi, le Nigeria. [atlasinfo.fr]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, s\u2019est dit heureux pour les joueurs et le public, apr\u00e8s la qualification des Lions de l\u2019Atlas pour la finale de la CAN Maroc-2025 en battant, mercredi, le Nigeria. [www.lereporter.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, s\u2019est dit heureux pour les joueurs et le public, apr\u00e8s la qualification des Lions de l\u2019Atlas pour la finale de la CAN Maroc-2025 en battant, mercredi, le Nigeria. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Acteur majeur de la distribution\nautomobile au Maroc, M-AUTOMOTIV a...", "mass": 5, "physics": false, "shape": "box", "title": "Acteur majeur de la distribution automobile au Maroc, M-AUTOMOTIV a proc\u00e9d\u00e9 ce jeudi 15 janvier au lancement officiel d\u2019EXEED, une marque chinoise premium, ainsi que de son univers [www.challenge.ma]\n-------------------------------------------------\nM-AUTOMOTIV, leader de la distribution automobile au Maroc, annonce le lancement officiel d\u2019EXEED, marque automobile premium, et de son univers technologique de nouvelle g\u00e9n\u00e9ration, incarn\u00e9 par EXLANTIX, v\u00e9ritable extension high-tech de la marque. [www.lavieeco.com]\n-------------------------------------------------\nJeudi 15 janvier 2026 \u00e0 Casablanca, M-Automotiv a officialis\u00e9, lors d\u2019une conf\u00e9rence de lancement, l\u2019arriv\u00e9e de la marque EXEED au Maroc, dont il devient l\u2019importateur exclusif. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi, des propositions de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi, des propositions de nomination \u00e0 des fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u2019article 92 de la Constitution. [www.challenge.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, des propositions de nomination \u00e0 des fonctions sup\u00e9rieures, conform\u00e9ment aux dispositions de l\u2019article 92 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019occasion de la Coupe\nd\u2019Afrique des Nation de football...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la Coupe d\u2019Afrique des Nation de football (CAN-2025), le Maroc confirme sa capacit\u00e9 \u00e0 accueillir des \u00e9v\u00e9nements sportifs majeurs et \u00e0 en faire des leviers [www.challenge.ma]\n-------------------------------------------------\nInvit\u00e9s par l\u2019ONMT, Christian Mantei, pr\u00e9sident d\u2019Atout France, et Patrice Caradec, pr\u00e9sident du SETO, saluent la qualit\u00e9 de l\u2019organisation et la strat\u00e9gie globale qui structure l\u2019exp\u00e9rience touristique du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nInvit\u00e9s par l\u2019ONMT, Christian Mantei, pr\u00e9sident d\u2019Atout France, et Patrice Caradec, pr\u00e9sident du SETO, saluent la qualit\u00e9 de l\u2019organisation et la strat\u00e9gie globale qui structure l\u2019exp\u00e9rience . [maroc-diplomatique.net]\n-------------------------------------------------\nLe pr\u00e9sident d\u2019Atout France, Christian Mantei, et le pr\u00e9sident du SETO (Syndicat des Entreprises du Tour Operating), Patrice Caradec, invit\u00e9s par l\u0027Office national marocain du tourisme (ONMT), ont salu\u00e9 la qualit\u00e9 de l\u2019organisation de la Coupe d\u2019Afrique des Nations (CAN) 2025 par le Maroc et la strat\u00e9gie globale qui structure l\u2019exp\u00e9rience touristique du Royaume. [leseco.ma]\n-------------------------------------------------\nLe pr\u00e9sident d\u2019Atout France, Christian Mantei, et le pr\u00e9sident du SETO (Syndicat des Entreprises du Tour Operating), Patrice Caradec, invit\u00e9s par l\u2019Office national marocain du tourisme (ONMT), ont salu\u00e9 la qualit\u00e9 de l\u2019organisation de la Coupe d\u2019Afrique des Nations (CAN) 2025 par le Maroc et la strat\u00e9gie globale qui structure l\u2019exp\u00e9rience touristique du Royaume. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Cette initiative vise \u00e0 accompagner\nles PME marocaines dans leur...", "mass": 5, "physics": false, "shape": "box", "title": "Cette initiative vise \u00e0 accompagner les PME marocaines dans leur transition vers des mod\u00e8les \u00e9conomiques durables, g\u00e9n\u00e9rateurs d\u2019emplois d\u00e9cents, en coh\u00e9rence avec les priorit\u00e9s nationales et les Objectifs de d\u00e9veloppement durable. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027Investor day du Green Growth \u0026 Jobs Accelerator Project (GGJAP), un \u00e9v\u00e9nement strat\u00e9gique d\u00e9di\u00e9 \u00e0 la promotion de l\u0027entrepreneuriat vert et \u00e0 la cr\u00e9ation d\u0027emplois durables, a \u00e9t\u00e9 tenu, jeudi \u00e0 Rabat, \u00e0 l\u0027initiative de Programme des Nations Unies pour le D\u00e9veloppement (PNUD) au Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le Royaume du Maroc et\nla R\u00e9publique du Suriname ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc et la R\u00e9publique du Suriname ont r\u00e9affirm\u00e9, jeudi, leur ferme engagement \u00e0 renforcer davantage la coop\u00e9ration bilat\u00e9rale pour le b\u00e9n\u00e9fice des deux gouvernements et de leurs peuples. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Royaume du Maroc et la R\u00e9publique du Suriname ont r\u00e9affirm\u00e9, jeudi, leur ferme engagement \u00e0 renforcer davantage la coop\u00e9ration bilat\u00e9rale pour le b\u00e9n\u00e9fice des deux gouvernements et de leurs peuples. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) se trouve confront\u00e9e \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) se trouve confront\u00e9e \u00e0 un dilemme majeur pour l\u2019attribution de la Coupe d\u2019Afrique des Nations 2028 : aucun pays ne semble pr\u00eat \u00e0 organiser cette \u00e9dition dans un d\u00e9lai aussi court (deux ans et demi), poussant certains responsables \u00e0 \u00e9voquer en interne le Maroc comme solution de secours. [atlasinfo.fr]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9 que la Coupe dAfrique des nations (CAN 2025), organis\u00e9e par le Maroc, est devenue l\u00e9dition la plus r\u00e9ussie commercialement dans lhistoire du continent, g\u00e9n\u00e9rant une augmentation de plus de 90% des revenus de la CAF. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le 15 janvier 2026, \u00e0\nRyad, un haut responsable saoudien...", "mass": 5, "physics": false, "shape": "box", "title": "Le 15 janvier 2026, \u00e0 Ryad, un haut responsable saoudien a r\u00e9v\u00e9l\u00e9 \u00e0 l\u2019AFP que l\u2019Arabie saoudite, le Qatar et Oman ont men\u00e9 des efforts diplomatiqu         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {

                    positionCommunityLabels();

                }, 100);
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                scrollUp.className = 'scroll-up';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
