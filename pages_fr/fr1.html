s du transport routier de personnes et de marchandises, couvrant une p\u00e9riode de 30 jours. [telquel.ma]\n-------------------------------------------------\nLe gouvernement r\u00e9affirme son plein engagement \u00e0 poursuivre son soutien \u00e0 ce secteur, en fonction du rythme de hausse des prix des carburants \u00e0 l\u0027international et ce, jus. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re du Transport et de la Logistique a annonc\u00e9, vendredi, le lancement d\u2019une nouvelle tranche de soutien exceptionnel direct au profit des professionnels du transport routier de personnes et de marchandises, couvrant une p\u00e9riode de 30 jours. \u00ab [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Ainsi, les Marocains devront retarder\nleurs montres de 60 minutes...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, les Marocains devront retarder leurs montres de 60 minutes \u00e0 2h00 du matin, le dimanche 20 septembre 2026, pour revenir \u00e0 l\u2019heure GMT. [fr.hespress.com]\n-------------------------------------------------\nLes horloges devront \u00eatre retard\u00e9es de soixante minutes \u00e0 2 heures du matin, selon un communiqu\u00e9 publi\u00e9 ce vendredi 18 septembre par la pr\u00e9sidence du gouvernement. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Dans le cadre de la\n63e session du Conseil des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la 63e session du Conseil des droits de l\u2019Homme des Nations unies, Ayman Okeil, intervenant au nom de l\u2019organisation \u00ab Maat for Peace, Development and Human Rights \u00bb, a attir\u00e9 l\u2019attention sur la situation dans les camps de Tindouf, indiquant que l\u2019organisation suivait avec inqui\u00e9tude les atteintes commises par le fp . [fr.hespress.com]\n-------------------------------------------------\nLors de la 63e session du Conseil des droits de l\u2019homme de l\u2019ONU, Ayman Okeil, repr\u00e9sentant l\u2019organisation \u00abMaat for Peace, Development and Human Rights\u00bb, a mis en lumi\u00e8re la situation pr\u00e9occupante dans les camps de Tindouf. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Des averses orageuses avec gr\u00eale,\ntemps chaud et de fortes...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec gr\u00eale, temps chaud et de fortes rafales de vent sont attendus, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nAinsi, des averses orageuses avec gr\u00eale et rafales de vent sous orages (15-25 mm) sont attendues, vendredi de 12H00 \u00e0 23H00, dans les provinces de Tinghir, Errachidia, Midelt et Ou. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses accompagn\u00e9es de gr\u00eale, un temps chaud et de fortes rafales de vent sont attendus de vendredi \u00e0 dimanche dans plusieurs r\u00e9gions du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Apr\u00e8s plusieurs ann\u00e9es \u00e0 la\nt\u00ea idarit\u00e9 absolue\u00bb envers l\u2019Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux Houthis, lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU organis\u00e9e le 17 septembre selon la formule Arria. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a r\u00e9affirm\u00e9 jeudi devant le Conseil de s\u00e9curit\u00e9 de l\u0027ONU le soutien et la solidarit\u00e9 absolue du Maroc avec l\u0027Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux rebelles houthis, tout en alertant sur la menace pesant sur les d\u00e9troits de Bab al-Mandab et d\u0027Ormuz. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc a r\u00e9affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations unies selon la formule Arria, son soutien et sa solidarit\u00e9 absolue avec le Royaume d\u2019Arabie saoudite \u00e0 la suite des attaques \u00ab l\u00e2ches \u00bb perp\u00e9tr\u00e9es par les rebelles houthis. \u00ab [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La s\u00e9ance de cotation reprend\nce vendredi 18 septembre selon...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9ance de cotation reprend ce vendredi 18 septembre selon les horaires habituels de n\u00e9gociation, apr\u00e8s l\u2019incident technique surven. [lematin.ma]\n-------------------------------------------------\nLa Bourse de Casablanca informe ses clients et partenaires que les mesures correctives n\u00e9cessaires ont \u00e9t\u00e9 mises en \u0153uvre \u00e0 la suite de l\u2019incident technique survenu le 17 septembre 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Banque Populaire introduit ce\ndispositif au Maroc avec le...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Populaire introduit ce dispositif au Maroc avec le lancement de \u00ab La Populaire Numberless \u00bb, une ca. [lematin.ma]\n-------------------------------------------------\nLa Banque Populaire franchit un nouveau cap dans l\u2019innovation bancaire au Maroc avec le lancement de \u00ab LA POPULAIRE NUMBERLESS \u00bb, pr\u00e9sent\u00e9e comme la premi\u00e8re carte bancaire marocaine sans num\u00e9ro. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "N\u00e9 \u00e0 Beyrouth dans une\nfamille d\u2019artistes et install\u00e9 en...", "mass": 5, "physics": false, "shape": "box", "title": "N\u00e9 \u00e0 Beyrouth dans une famille d\u2019artistes et install\u00e9 en France d\u00e8s son enfance, Ibrahim Maalouf a d\u00e9velopp\u00e9 un langage musical singulier, nourri par sa formation classique autant. [lematin.ma]\n-------------------------------------------------\nIl y pr\u00e9sentera \u00ab Trumpets of Michel-Ange \u00bb, un projet qui s\u2019inscrit dans un parcours musical \u00e0 la crois\u00e9e du jazz, des musiques orientales et de la cr\u00e9ation contemporaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Les Etats-Unis ont pour la\ndeuxi\u00e8me ann\u00e9e cons\u00e9cutive refus\u00e9 d\u2019accorder...", "mass": 5, "physics": false, "shape": "box", "title": "Les Etats-Unis ont pour la deuxi\u00e8me ann\u00e9e cons\u00e9cutive refus\u00e9 d\u2019accorder un visa au pr\u00e9sident palestinien Mahmoud Abbas pour participer \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019ONU la semaine prochaine, l\u2019Autorit\u00e9 palestinienne d\u00e9non\u00e7ant jeudi une \u00ab mesure injustifi\u00e9e \u00bb. [telquel.ma]\n-------------------------------------------------\nLes sie (Turnix sylvaticus sylvaticus) a \u00e9t\u00e9 mis en place pour pr\u00e9server cette sous-esp\u00e8ce menac\u00e9e et am\u00e9liorer ses chances de survie au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le renforcement de la coop\u00e9ration\nentre les acteurs \u00e9conomiques et...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement de la coop\u00e9ration entre les acteurs \u00e9conomiques et les hommes d\u2019affaires marocains et leurs homologues mauritaniens a \u00e9t\u00e9 au centre des entretiens, mercredi \u00e0 Nouakchott, de l\u2019ambassadeur du Maroc en R\u00e9publique Islamique de Mauritanie, Hamid Chabar, avec le pr\u00e9sident de l\u2019Union nationale du patronat mauritanien (UNPM), Mohamed Zein El Abidine Ould Cheikh Ahmed.. [telquel.ma]\n-------------------------------------------------\nLe renforcement de la coop\u00e9ration entre les acteurs \u00e9conomiques et les hommes d\u2019affaires marocains et leurs homologues mauritaniens a \u00e9t\u00e9 au centre des entretiens, mercredi \u00e0 Nouakchott, de l\u2019ambassadeur du Maroc en R\u00e9publique Islamique de Mauritanie, Hamid Chabar, avec le pr\u00e9sident de l\u2019Union nationale du patronat mauritanien (UNPM), Mohamed Zein El Abidine Ould Cheikh Ahmed. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Un dialogue \u201couvert, franc et\nserein demeure la voie \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Un dialogue \u201couvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re\u201d, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami, \u00e0 la suite de l\u2019adoption, jeudi 17 septembre par le Parlement europ\u00e9en, d\u2019une. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s le vote du Parlement europ\u00e9en sur les \u00e9v\u00e9nements de Sebta, l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, a soulign\u00e9 que le texte ne comporte \u00abaucune incrimination ou injonction\u00bb \u00e0 l\u2019encontre du Maroc et appelle \u00e0 privil\u00e9gier le dialogue pour traiter les enjeux migratoires. [www.lavieeco.com]\n-------------------------------------------------\nApr\u00e8s l\u0027adoption jeudi par le Parlement europ\u00e9en d\u0027une r\u00e9solution sur les \u00e9v\u00e9nements survenus fin juillet \u00e0 Sebta, l\u0027ambassadeur du Maroc aupr\u00e8s de l\u0027Union europ\u00e9enne et de l\u0027OTAN, Ahmed Reda Chami, a plaid\u00e9 pour un dialogue franc et responsable, affirmant que le texte ne comporte aucune incrimination contre le Royaume. [atlasinfo.fr]\n-------------------------------------------------\nUn dialogue ouvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami \u00e0 la suite de l\u2019adoption, jeudi, par le Parlement europ\u00e9en d\u2019une r\u00e9solution sur [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le jeune milieu offensif marocain\nSafouane Benzahra, 18 ans, devrait...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune milieu offensif marocain Safouane Benzahra, 18 ans, devrait signer dans les prochains jours son premier contrat professionnel avec l\u2019AS Monaco, club fran\u00e7ais de Ligue 1, rapportent des m\u00e9dias sp\u00e9cialis\u00e9s. [telquel.ma]\n-------------------------------------------------\nLe jeune talent marocain Safouane Ben Zahra, \u00e2g\u00e9 de 18 ans, sappr\u00eate \u00e0 signer son premier contrat professionnel avec l\u2019AS Monaco, selon plusieurs sources sp\u00e9cialis\u00e9es. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le Maghreb de F\u00e8s (MAS),\nchampion en titre de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [telquel.ma]\n-------------------------------------------------\nLe Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le Maroc et la Banque\nafricaine de d\u00e9veloppement (BAD) ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, jeudi \u00e0 Rabat, deux accords de financement d\u2019un montant total de 405 millions d\u2019euros (soit environ 4,4 milliards de dirhams) destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9 deux accords de financement d\u2019un montant total de 405 millions d\u2019euros destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires             if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
