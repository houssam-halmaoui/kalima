aine de football (CAF). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Intervenant lors d\u2019une conf\u00e9rence de\npresse tenue \u00e0 l\u2019issue de...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors d\u2019une conf\u00e9rence de presse tenue \u00e0 l\u2019issue de sa rencontre, mardi \u00e0 Rabat, avec Nasser Bourita, ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et de. [lematin.ma]\n-------------------------------------------------\n\u00c0 Rabat, Mike Waltz a r\u00e9affirm\u00e9 la reconnaissance par les \u00c9tats-Unis de la souverainet\u00e9 marocaine sur le Sahara occidental et assur\u00e9 que Washington poursuivrait ses efforts pour un r\u00e8glement durable, malgr\u00e9 le veto oppos\u00e9 \u00e0 son projet de r\u00e9solution au Conseil de s\u00e9curit\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Younes El Mechrafi continuera de\nsi\u00e9ger au comit\u00e9 ex\u00e9cutif de...", "mass": 5, "physics": false, "shape": "box", "title": "Younes El Mechrafi continuera de si\u00e9ger au comit\u00e9 ex\u00e9cutif de la World Lottery Association (WLA), aux c\u00f4t\u00e9s de 14 autres membres. [lematin.ma]\n-------------------------------------------------\nYounes El Mechrafi, Directeur G\u00e9n\u00e9ral de la Marocaine des Jeux et des Sports (MDJS), a \u00e9t\u00e9 r\u00e9\u00e9lu au poste de Senior Vice-Pr\u00e9sident de la World Lottery Association (WLA), [www.challenge.ma]\n-------------------------------------------------\nPour la MDJS, cette troisi\u00e8me \u00e9lection cons\u00e9cutive constitue une reconnaissance internationale suppl\u00e9mentaire de son r\u00f4le au sein de la communaut\u00e9 mondiale des loteries. [www.lavieeco.com]\n----------------------------------------- : 26}, "group": 10, "id": "comm_label_10", "label": "Batteries \u00e9lectriques : 65,15 millions\nde dollars de la Banque...", "mass": 5, "physics": false, "shape": "box", "title": "Batteries \u00e9lectriques : 65,15 millions de dollars de la Banque asiatique d\u2019investissement pour l\u2019usine d\u2019anodes de BTR \u00e0 Tanger. [lematin.ma]\n-------------------------------------------------\nLa Banque asiatique d\u2019investissement dans les infrastructures a inscrit \u00e0 son portefeuille un financement de 65,15 millions de dollars destin\u00e9 \u00e0 l\u2019usine de mat\u00e9riaux d\u2019anodes du groupe chinois BTR New Material Group \u00e0 Tanger. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Satisfaire les besoins nationaux avant\nl\u2019exportation ou la transformation :...", "mass": 5, "physics": false, "shape": "box", "title": "Satisfaire les besoins nationaux avant l\u2019exportation ou la transformation : c\u2019est la priorit\u00e9 d\u00e9fendue par Fouzi Lekjaa lors de la pr\u00e9sentation des grandes lignes du projet de loi de finances pour 2027 \u00e0 la Chambre des conseillers. [telquel.ma]\n-------------------------------------------------\nLe mardi 17 novembre 2026, devant la Commission des finances, de la planification et du d\u00e9veloppement \u00e9conomique de la Chambre des conseillers, Fouzi Lekjaa a pr\u00e9sent\u00e9 les principales mesures sociales du projet de loi de finances 2027. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les engagements en cours dans\nle domaine de la valorisation...", "mass": 5, "physics": false, "shape": "box", "title": "Les engagements en cours dans le domaine de la valorisation des potentialit\u00e9s touristiques territoriales portent sur 200 projets, mobilisant une enveloppe globale de pr\u00e8s     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>


    
    
</html>
