ust": -124.5}, "group": 5, "id": 329, "label": "D\u00e9fense et s\u00e9curit\u00e9 : 22...", "shape": "dot", "size": 83, "title": "D\u00e9fense et s\u00e9curit\u00e9 : 22 MMDH pour d\u00e9velopper une base industrielle nationale\nSource: lnt.ma", "url": "https://lnt.ma/defense-et-securite-22-mmdh-pour-developper-une-base-industrielle-nationale/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le ministre de l\u2019Agriculture, de\nla P\u00eache maritime et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Agriculture, de la P\u00eache maritime et de la Souverainet\u00e9 alimentaire, Khalid Hatimy, a annonc\u00e9, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers, la suspension des exportations de tomates, de pommes de terre et d\u2019oignons, expliquant que cette d\u00e9cision venait en l\u2019absence de contrats sp\u00e9cifiques destin\u00e9s au march\u00e9 national. [fr.hespress.com]\n-------------------------------------------------\nFace \u00e0 la persistance des prix \u00e9lev\u00e9s des viandes rouges et \u00e0 la fragilisation du cheptel national, le gouvernement entend agir sur plusieurs maillons de la fili\u00e8re. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La Princesse Lalla Asmaa, Pr\u00e9sidente\nde la Fondation Lalla Asmaa,...", "mass": 5, "physics": false, "shape": "box", "title": "La Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, est arriv\u00e9e mercredi \u00e0 San Salvador pour une visite de travail en R\u00e9publique d\u2019El Salvador, \u00e0 l\u2019invitation de Gabriela Rodr\u00edguez de Bukele, Premi\u00e8re Dame de la R\u00e9publique. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 sa descente d\u0027avion \u00e0 l\u0027a\u00e9roport international Saint \u00d3scar Arnulfo Romero y Gald\u00e1mez, Son Altesse Royale la Princesse Lalla Asmaa a \u00e9t\u00e9 accueillie par la Prem. [lematin.ma]\n-------------------------------------------------\nAccueillie par la Premi\u00e8re Dame Gabriela Rodr\u00edguez de Bukele, SAR la Princesse Lalla Asmaa effectue une visite visant \u00e0 renforcer le partenariat entre les deux pays autour de l\u2019enfance, seize mois apr\u00e8s la visite de la Premi\u00e8re Dame au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, est arriv\u00e9e mercredi \u00e0 San Salvador pour une visite de travail en R\u00e9publique d\u2019El Salvador, \u00e0 l\u2019invitation de Son Excellence Madame Gabriela Rodr\u00edguez de Bukele, Premi\u00e8re Dame de la R\u00e9publique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Invit\u00e9 de l\u0027\u00e9mission The Early\nBird, l\u0027ambassadeur du Maroc aux...", "mass": 5, "physics": false, "shape": "box", "title": "Invit\u00e9 de l\u0027\u00e9mission The Early Bird, l\u0027ambassadeur du Maroc aux \u00c9tats-Unis, Youssef Amrani a livr\u00e9 une lecture strat\u00e9gique des relations maroco-am\u00e9ricaines, met. [lematin.ma]\n-------------------------------------------------\nL\u2019ambassadeur du Maroc aux \u00c9tats-Unis, Youssef Amrani, a pr\u00e9sent\u00e9 mercredi sur la cha\u00eene Real America\u2019s Voice les ambitions industrielles du Royaume dans le domaine de la d\u00e9fense. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Label Soci\u00e9t\u00e9 Sportive distingue\nles entreprises et les organisations...", "mass": 5, "physics": false, "shape": "box", "title": "Le Label Soci\u00e9t\u00e9 Sportive distingue les entreprises et les organisations qui s\u2019engagent concr\u00e8tement en faveur de l\u2019activit\u00e9 physique et sportive aupr\u00e8s de leurs collaborateurs. [lematin.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Marocaine des Professionnels du Sport (FMPS) annonce l\u2019ouverture des candidatures pour la nouvelle \u00e9dition de son Label Soci\u00e9t\u00e9 Sportive, une initiative visant \u00e0 promouvoir le d\u00e9veloppement du sport en entreprise au Maroc et \u00e0 valoriser les organisations engag\u00e9es dans cette dynamique. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019introduction en Bourse de Laprophan\na enregistr\u00e9 un montant total...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019introduction en Bourse de Laprophan a enregistr\u00e9 un montant total souscrit de 15,29 milliards de dirhams, pour une enveloppe initialement sollicit\u00e9e de 2,2 milliards de dirhams.. [lematin.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration est sursouscrite sept fois, pour un montant de 15,29 milliards de dirhams aupr\u00e8s de 44.378 investisseurs, soit un taux de satisfaction de 14,51%. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le roi Mohammed VI a\npr\u00e9sid\u00e9 ce mercredi 25 novembre,...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI a pr\u00e9sid\u00e9 ce mercredi 25 novembre, au Palais royal de Rabat, la signature de deux conventions-cadres. [telquel.ma]\n-------------------------------------------------\nDans ce sens, Sa Majest\u00e9 le Roi Mohammed VI a bien voulu charger Ali Seddiki de veiller \u00e0 l\u2019\u00e9laboration op\u00e9rationnelle de la mise en \u0153uvre de la feuille de route relative au d\u00e9veloppement de l\u2019industrie nationale de d\u00e9fense et de s\u00e9curit\u00e9, tout . [aujourdhui.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, accompagn\u00e9 du Prince H\u00e9ritier Moulay El Hassan, a pr\u00e9sid\u00e9, ce mercredi au Palais Royal de Rabat, la signature de deux conventions-cadres consacr\u00e9es au financement de la feuille de route de l\u0027industrie nationale de d\u00e9fense et de s\u00e9curit\u00e9 et \u00e0 la mobilisation des secteurs priv\u00e9 et financier. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, a pr\u00e9sid\u00e9 mercredi 25 novembre au Palais Royal de Rabat la signature de deux conventions-cadres. [maroc-diplomatique.net]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, accompagn\u00e9 de Son Altesse Royale le Prince H\u00e9ritier Moulay El Hassan, a pr\u00e9sid\u00e9, ce mercredi 25 novembre 2026 au Palais Royal de Rabat, la c\u00e9r\u00e9monie de signature de deux conventions-cadres portant sur le financement de la feuille de route pour le d\u00e9veloppement de l\u2019industrie de d\u00e9fense [www.lereporter.ma]\n-------------------------------------------------\nUne semaine apr\u00e8s la pr\u00e9sentation de l\u2019\u00abOffre Maroc\u00bb, le Roi Mohammed VI confie au directeur g\u00e9n\u00e9ral de l\u2019AMDIE une mission de pr\u00e9paration op\u00e9rationnelle de la feuille de route pour le d\u00e9veloppement de l\u2019industrie nationale de d\u00e9fense et de s\u00e9curit\u00e9. [leseco.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, a pr\u00e9sid\u00e9, mercredi 25 novembre 2026 au Palais Royal de Rabat, la c\u00e9r\u00e9monie de signature de deux conventions-cadres portant sur le financement de la feuille de route pour le d\u00e9veloppement de l\u2019industrie nationale de d\u00e9fense et de s\u00e9curit\u00e9 et la mobilisation . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Son IPO avait \u00e9t\u00e9 souscrite\npr\u00e8s de sept fois par...", "mass": 5, "physics": false, "shape": "box", "title": "Son IPO avait \u00e9t\u00e9 souscrite pr\u00e8s de sept fois par 44.378 investisseurs, pour 15,29 milliards de dirhams demand\u00e9s. [telquel.ma]\n-------------------------------------------------\nL\u2019introduction en Bourse du groupe Laprophan \u00e0 Casablanca a \u00e9t\u00e9 sursouscrite sept fois par 44.378 investisseurs, a annonc\u00e9 mercredi 25 novembre 2026 le directeur g\u00e9n\u00e9ral de la Bourse de Casablanca, Nasser Seddiqi, lors de la premi\u00e8re cotation du groupe. [www.yabiladi.com]\n-------------------------------------------------\nLors de la c\u00e9r\u00e9monie de premi\u00e8re cotation, le directeur g\u00e9n\u00e9ral de la Bourse de Casablanca, Nasser Seddiqi, a annonc\u00e9 que le nombre d\u2019actions demand\u00e9es avait atteint 44.914.984, pour un montant global souscrit de 15,29 milliards de dirhams. [lnt.ma]\n-------------------------------------------------\nMercredi 25 novembre, la Bourse de Casablanca a accueilli la premi\u00e8re cotation du groupe pharmaceutique marocain Laprophan, \u00e0 l\u2019issue d\u2019une introduction en Bourse couronn\u00e9e de succ\u00e8s. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Ce sont les priorit\u00e9s que\nla CGEM et la Comader...", "mass": 5, "physics": false, "shape": "box", "title": "Ce sont les priorit\u00e9s que la CGEM et la Comader ont mises en avant, mercredi 25 novembre \u00e0 Rabat, lors de leurs \u00e9changes avec la cheffe du gouvernement, Fatima Ezzahra El Mansouri. [telquel.ma]\n-------------------------------------------------\nRe\u00e7ues mardi 24 novembre \u00e0 Rabat, les trois centrales syndicales les plus repr\u00e9sentatives ont demand\u00e9 une revalorisation des salaires et des pensions de retraite. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u0027issue des rencontres avec la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, les pr\u00e9sidents des deux Conf\u00e9d\u00e9rations ont soulign\u00e9, mercredi \u00e0 Rabat, que l\u0027appui au secteur priv\u00e9 est un levier pour l\u0027investissement et l\u0027exportation. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement a pr\u00e9sid\u00e9 \u00e0 Rabat les premi\u00e8res rencontres de concertation avec les centrales syndicales les plus repr\u00e9sentatives. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a tenu mardi \u00e0 Rabat, trois rencontres de communication avec les centrales syndicales les plus repr\u00e9sentatives, \u00e0 savoir l\u2019Union marocaine du travail (UMT), l\u2019Union g\u00e9n\u00e9rale des travailleurs du Maroc (UGTM) et la Conf\u00e9d\u00e9ration d\u00e9mocratique du travail (CDT). [maroc-diplomatique.net]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) et la Conf\u00e9d\u00e9ration marocaine de l\u2019agriculture et du d\u00e9veloppement rural (COMADER) ont soulign\u00e9, mercredi \u00e0 Rabat, la n\u00e9cessit\u00e9 de soutenir le secteur priv\u00e9 pour favoriser l\u2019investissement et les exportations au Maroc. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) et la Conf\u00e9d\u00e9ration marocaine de l\u2019agriculture et du d\u00e9veloppement rural (COMADER) ont soulign\u00e9, mercredi 25 novembre \u00e0 Rabat, la n\u00e9cessit\u00e9 de renforcer les m\u00e9canismes de soutien au secteur priv\u00e9 afin de stimuler l\u2019investissement et les exportations. [lnt.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, a rencontr\u00e9 mardi \u00e0 Rabat l\u2019Union marocaine du travail (UMT), l\u2019Union g\u00e9n\u00e9rale des travailleurs du Maroc (UGTM) et la Conf\u00e9d\u00e9ration d\u00e9mocratique du travail (CDT), en pr\u00e9paration des prochains cycles du dialogue social central et sectoriel. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) et la Conf\u00e9d\u00e9ration marocaine de l\u2019agriculture et du d\u00e9veloppement rural (COMADER) ont plaid\u00e9, mercredi \u00e0 Rabat, pour un renforcement du soutien au secteur priv\u00e9, \u00e0 l\u2019occasion des rencontres de concertation avec l\u2019Ex\u00e9cutif, pr\u00e9sid\u00e9es par la cheffe du gouvernement, Fatima Ezzahra El Mansouri. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Sur ordre du roi Mohammed\nVI, des pri\u00e8res rogatoires (salat...", "mass": 5, "physics": false, "shape": "box", "title": "Sur ordre du roi Mohammed VI, des pri\u00e8res rogatoires (salat al-istisqa) seront accomplies, vendredi \u00e0 10H00, dans les aires de pri\u00e8re (mousallas) et grandes mosqu\u00e9es \u00e0 travers l\u2019ensemble des r\u00e9gions et provinces du Royaume, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [telquel.ma]\n-------------------------------------------------\nSur Ordre de SM le Roi Mohammed VI, Amir Al-Mouminine, des pri\u00e8res rogatoires (salat al-istisqa) seront accomplies, vendredi \u00e0 10H00 dans les aires de pri\u00e8re (mousallas) et grandes mosqu\u00e9es \u00e0 travers l\u2019ensemble des r\u00e9gions et provinces du Royaume, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. \u00ab [aujourdhui.ma]\n-------------------------------------------------\nLes pri\u00e8res de salat al-istisqa se tiendront \u00e0 10h00 dans les aires de pri\u00e8re et grandes mosqu\u00e9es, sur ordre de SM le Roi Mohammed VI, a indiqu\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [www.lavieeco.com]\n-------------------------------------------------\nSur Ordre de SM le Roi Mohammed VI, Amir Al-Mouminine, des pri\u00e8res rogatoires (salat al-istisqa) seront accomplies, vendredi \u00e0 10H00 dans les aires de pri\u00e8re (mousallas) et grandes mosqu\u00e9es \u00e0 travers l\u2019ensemble des r\u00e9gions et provinces du Royaume, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La plateforme permet aux conducteurs\nde d\u00e9poser leur demande en...", "mass": 5, "physics": false, "shape": "box", "title": "La plateforme permet aux conducteurs de d\u00e9poser leur demande en ligne, sans se rendre dans une agence Al Barid Bank ou Barid Cash, puis de suivre leur dossier en temps r\u00e9el jusqu\u2019\u00e0 la remise du permis. [telquel.ma]\n-------------------------------------------------\nLa plateforme E-ROKHSATI a \u00e9t\u00e9 pr\u00e9sent\u00e9e mardi 24 novembre 2026 \u00e0 Rabat, lors d\u2019une rencontre pr\u00e9sid\u00e9e par le ministre du Transport et de la Logistique, Abdessamad Kayouh. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a d\u00e9voil\u00e9, mercredi, les...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9, mercredi, les listes finales des nomin\u00e9s aux CAF Awards 2026, marqu\u00e9es par une forte pr\u00e9sence marocaine dans les principales cat\u00e9gories. [www.challenge.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9 mercredi 25 novembre 2026 les listes finales des nomin\u00e9s aux CAF Awards. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019Office national des chemins de\nfer (ONCF) et AP Moller-Maersk...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des chemins de fer (ONCF) et AP Moller-Maersk ont sign\u00e9 un protocole d\u2019accord afin d\u2019explorer les possibilit\u00e9s de d\u00e9veloppement conjoint du transport ferroviaire et de solutions [www.challenge.ma]\n-------------------------------------------------\nMoller\u2013Maersk ont sign\u00e9 un protocole d\u2019accord pour \u00e9tudier des projets communs de transport ferroviaire et de logistique int\u00e9gr\u00e9e au Maroc, a annonc\u00e9 Maersk le 24 novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les dirigeants de six partis\npolitiques, dont les quatre formations...", "mass": 5, "physics": false, "shape": "box", "title": "Les dirigeants de six partis politiques, dont les quatre formations constituant la coalition gouvernementale, ont sign\u00e9, mardi 24 novembre \u00e0 Rabat, la \u00abCharte de la majorit\u00e9\u00bb, un pacte [www.challenge.ma]\n-------------------------------------------------\nLes six partis de la majorit\u00e9 gouvernementale ont sign\u00e9, mardi \u00e0 Rabat, la \u00ab Charte de la majorit\u00e9 \u00bb, un pacte politique et moral qui se veut un m\u00e9canisme de r\u00e9f\u00e9rence pour encadrer l\u2019action de la coalition gouvernementale et renforcer la coordination et la coh\u00e9sion au sein de ses composantes. [www.lereporter.ma]\n-------------------------------------------------\nQuelques semaines apr\u00e8s l\u2019entr\u00e9e en fonction du nouvel Ex\u00e9cutif, les partis de la majorit\u00e9 gouvernementale se dotent d\u2019un cadre commun destin\u00e9 \u00e0 organiser leur action politique et \u00e0 renforcer leurs m\u00e9canismes de coordination. [lnt.ma]\n-------------------------------------------------\nLes quatre partis composant le gouvernement et les deux formations qui lui apportent leur soutien ont sign\u00e9, mardi, \u00e0 Rabat, la charte de la majorit\u00e9 pour la l\u00e9gislature 2026-2031. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "L\u2019autorit\u00e9 marocaine du march\u00e9 des\ncapitaux (AMMC) a annonc\u00e9 l\u2019enregistrement...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a annonc\u00e9 l\u2019enregistrement de la soci\u00e9t\u00e9 \u00abAdvisory and Finance Group\u00bb pour exercer des activit\u00e9s de conseil en investissement financier de cat\u00e9gorie n\u00b02. [www.yabiladi.com]\n-------------------------------------------------\nAdvisory and Finance Group a obtenu son enregistrement aupr\u00e8s de l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) pour exercer les activit\u00e9s de conseil en investissement financier relevant de la cat\u00e9gorie 2, d\u00e9di\u00e9e au conseil aux \u00e9metteurs. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les investissements li\u00e9s \u00e0 l\u2019organisation\nde la Coupe du monde...", "mass": 5, "physics": false, "shape": "box", "title": "Les investissements li\u00e9s \u00e0 l\u2019organisation de la Coupe du monde 2030 devraient g\u00e9n\u00e9rer 840.000 emplois au Maroc, dont plus de la moiti\u00e9 dans le secteur du b\u00e2timent et de la construction, a indiqu\u00e9 mercredi le ministre de la Jeunesse, de la Culture et des Sports, Mohamed Mehdi Bensaid, devant la Chambre des conseillers. [www.lavieeco.com]\n-------------------------------------------------\nLes investissements li\u00e9s \u00e0 la Coupe du monde 2030 devraient contribuer \u00e0 la cr\u00e9ation de 840.000 emplois au Maroc, a indiqu\u00e9 mercredi 25 novembre 2026 \u00e0 Rabat le ministre de la Jeunesse, de la Culture et des Sports, Mohamed Mehdi Bensaid. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "R\u00e9unis \u00e0 Casablanca jusqu\u2019au 28\nnovembre, les trois salons mettent...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unis \u00e0 Casablanca jusqu\u2019au 28 novembre, les trois salons mettent en lumi\u00e8re les ambitions industrielles du Maroc et les nouvelles perspectives de coop\u00e9ration avec l\u2019Italie et d\u2019autres pays dans les secteurs strat\u00e9giques. [maroc-diplomatique.net]\n-------------------------------------------------\nLes salons \u00ab Elec Expo \u00bb, \u00ab EneR Event \u00bb et \u00ab Tronica Expo \u00bb, plac\u00e9s sous le Haut Patronage du Roi Mohammed VI, se sont ouverts, mercredi \u00e0 Casablanca, sous le th\u00e8me \u00ab Vision 2030 : Infrastructures strat\u00e9giques et dessalement au service de la souverainet\u00e9 industrielle \u00bb, avec l\u2019Italie comme pays \u00e0 l\u2019honneur. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Un accord relatif au renforcement\ndes services a\u00e9riens entre le...", "mass": 5, "physics": false, "shape": "box", "title": "Un accord relatif au renforcement des services a\u00e9riens entre le Ma         box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        z-index: 10001;
    }

    @media (hover: hover) and (pointer: fine) {
        #info-icon:hover + #tooltip {
            display: block;
        }
    }
</style>

<div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 26/11/2026 à 13h21, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
