u00e9rieur. [www.lavieeco.com]\n-------------------------------------------------\nLes r\u00e9sultats finaux des \u00e9lections l\u00e9gislatives du 23 septembre 2026, annonc\u00e9s par les commissions provinciales et r\u00e9gionales, confirment les r\u00e9sultats provisoires pr\u00e9c\u00e9demment communiqu\u00e9s, indique un communiqu\u00e9 du minist\u00e8re de lInt\u00e9rieur ce vendredi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Mohamed Ouahbi a d\u00e9voil\u00e9 le\nonze de d\u00e9part des Lions...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ouahbi a d\u00e9voil\u00e9 le onze de d\u00e9part des Lions de l\u2019Atlas pour affronter le Gabon, ce vendredi soir au stade Prince Moulay Abdellah de Rabat, \u00e0 l\u2019occasion de la premi\u00e8re journ\u00e9e des \u00e9liminatoires de la CAN 2027. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc affronte le Gabon ce vendredi \u00e0 Rabat pour le compte des \u00e9liminatoires de la Coupe d\u0027Afrique des Nations 2027. [lematin.ma]\n-------------------------------------------------\nLe Maroc affronte le Gabon ce vendredi 25 septembre \u00e0 19h00 GMT (21h00 heure locale marocaine) au Stade Prince Moulay Abdellah de Rabat, pour le compte de la premi\u00e8re journ\u00e9e des \u00e9liminatoires de la Coupe d\u2019Afrique des nations (CAN) 2027. [atlasinfo.fr]\n-------------------------------------------------\nPour leur premier rendez-vous apr\u00e8s la Coupe du Monde 2026, l\u2019\u00e9quipe nationale a parfaitement lanc\u00e9 sa campagne qualificative pour la CAN-2027 en s\u2019imposant face au Gabon (2-0) au Stade Prince Moulay Abdellah. [www.lavieeco.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est impos\u00e9e (2-0) face \u00e0 son homologue gabonaise, vendredi soir au Stade Prince Moulay Abdellah         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

            setTimeout(positionCommunityLabels, 50);
