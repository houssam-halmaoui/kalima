rti de la justice et du d\u00e9veloppement (PJD), Abdelilah Benkirane, a exclu toute participation de sa formation au futur gouvernement. [fr.hespress.com]\n-------------------------------------------------\nAbdelilah Benkirane, secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement (PJD), a d\u00e9clar\u00e9 avoir appel\u00e9 le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, apr\u00e8s l\u2019annonce des r\u00e9sultats des \u00e9lections l\u00e9gislatives. [telquel.ma]\n-------------------------------------------------\nAbdelilah Benkirane, secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement (PJD), a d\u00e9clar\u00e9 que son parti ne prendrait pas part au prochain gouvernement, qui doit \u00eatre dirig\u00e9 par le Parti authenticit\u00e9 et modernit\u00e9 (PAM). [www.yabiladi.com]\n-------------------------------------------------\nLe secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement a annonc\u00e9 que sa formation ne participerait pas au prochain gouvernement, au lendemain d\u2019un scrutin qui lui a rendu 54 si\u00e8ges apr\u00e8s l\u2019effondrement de 2021. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Son premier secr\u00e9taire, Driss Lachgar,\na estim\u00e9 que les r\u00e9sultats...", "mass": 5, "physics": false, "shape": "box", "title": "Son premier secr\u00e9taire, Driss Lachgar, a estim\u00e9 que les r\u00e9sultats provisoires du scrutin marquent une baisse par rapport aux pr\u00e9c\u00e9dentes \u00e9ch\u00e9ances, tout en assurant que le parti proc\u00e9dera \u00e0 une analyse approfondie de la situation . [fr.hespress.com]\n-------------------------------------------------\nLe Premier secr\u00e9taire de l\u2019Union socialiste des forces populaires (USFP), Driss Lachgar, a indiqu\u00e9 que les r\u00e9sultats des \u00e9lections l\u00e9gislatives, tenues mercredi, traduisent un recul du parti, affirmant que ce dernier s\u2019attachera \u00e0 examiner ces r\u00e9sultats au sein de ses propres instances. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Cette rencontre s\u0027inscrit dans le\ncadre des liens fraternels solides...", "mass": 5, "physics": false, "shape": "box", "title": "Cette rencontre s\u0027inscrit dans le cadre des liens fraternels solides et historiques unissant le Royaume du Maroc et l\u2019\u00c9tat du Kowe\u00eft, et r\u00e9affirme la volont\u00e9 commune de hisser. [lematin.ma]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, a re\u00e7u, ce jeudi \u00e0 Rabat, l\u2019ambassadeur de l\u2019\u00c9tat du Kowe\u00eft au Maroc, Ahmed Abderrahmane Al Baker. [leseco.ma]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi a re\u00e7u, jeudi \u00e0 Rabat, l\u2019ambassadeur de l\u2019\u00c9tat du Kowe\u00eft au Maroc, Ahmed Abdel Rahman Al-Bakr. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Sign\u00e9 en marge de la\n15e \u00e9dition d\u2019InnoTrans, l\u2019un des...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9 en marge de la 15e \u00e9dition d\u2019InnoTrans, l\u2019un des plus grands salons mondiaux consacr\u00e9s aux techniques de transport, l\u2019accord instaure un cadre d\u2019\u00e9change et de partage d\u2019exper. [lematin.ma]\n-------------------------------------------------\nLe prix d\u00e9cern\u00e9 par l\u2019Union internationale des chemins de fer, intervient dans le cadre de la participation de l\u2019ONCF \u00e0 la 15e \u00e9dition d\u2019InnoTrans, l\u2019un des plus grands salons mondiaux consacr\u00e9s aux techniques de transport, qui se tient du 22 au 25 septembre \u00e0 Berlin. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le d\u00e9partement de l\u2019Industrie planche\nsur l\u2019organisation du Forum marocain...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9partement de l\u2019Industrie planche sur l\u2019organisation du Forum marocain des zones industrielles. [lematin.ma]\n-------------------------------------------------\nDans le cadre du d\u00e9ploiement de sa strat\u00e9gie de d\u00e9veloppement industriel et d\u2019attractivit\u00e9 des investissements productifs, le minist\u00e8re de l\u2019Industrie et du Commerce compte organiser le futur Forum marocain des zones industrielles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La Banque Centrale Populaire et\nR\u00e9seau Entreprendre Maroc veulent r\u00e9duire...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Centrale Populaire et R\u00e9seau Entreprendre Maroc veulent r\u00e9duire la distance entre accompagnement entrepreneurial et acc\u00e8s au financement, deux \u00e9tapes souvent d\u00e9terminante. [lematin.ma]\n-------------------------------------------------\nLa Banque Centrale Populaire et R\u00e9seau Entreprendre Maroc ont sign\u00e9, jeudi \u00e0 Casablanca, une convention destin\u00e9e \u00e0 mieux accompagner les jeunes entrepreneurs. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et R\u00e9seau Entreprendre Maroc (REM) ont sign\u00e9 une nouvelle convention visant \u00e0 renforcer l\u2019accompagnement des jeunes entrepreneurs et \u00e0 faciliter leur acc\u00e8s au financement. [lnt.ma]"}, {"bord <script>

    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
