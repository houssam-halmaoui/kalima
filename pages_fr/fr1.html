abel_1", "label": "Le ministre du Transport et\nde la Logistique, Abdessamad Kayouh,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre du Transport et de la Logistique, Abdessamad Kayouh, a affirm\u00e9 que les indicateurs enregistr\u00e9s entre 2022 et 2025 d\u00e9montrent que le secteur des transports, tous modes confondus, a connu une reprise significative, atteignant et m\u00eame d\u00e9passant les niveaux d\u2019avant la pand\u00e9mie du Covd-19 dans plusieurs domaines. [fr.hespress.com]\n-------------------------------------------------\nLe ministre du Transport et de la Logistique, Abdessamad Kayouh, a indiqu\u00e9, lundi \u00e0 Rabat, que les indicateurs enregistr\u00e9s entre 2022 et 2025 montrent une reprise du secteur des transports, tous modes confondus, qui atteint et d\u00e9passe, dans plusieurs domaines, les niveaux d\u2019avant la pand\u00e9mie de Covid-19. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Gr\u00e2ce \u00e0 la vision \u00e9clair\u00e9e\ndu Roi Mohammed VI, le...", "mass": 5, "physics": false, "shape": "box", "title": "Gr\u00e2ce \u00e0 la vision \u00e9clair\u00e9e du Roi Mohammed VI, le Maroc a entam\u00e9 une nouvelle phase de mobilisation des ressources en eau reposant sur un syst\u00e8me int\u00e9gr\u00e9, a affirm\u00e9, lundi \u00e0 Marrakech, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a lanc\u00e9, lundi 1er d\u00e9cembre Marrakech, les travaux du Congr\u00e8s Mondial de l\u2019Eau, dont la 19e \u00e9dition est d\u00e9di\u00e9e [www.challenge.ma]\n-------------------------------------------------\nLe lancement du 19\u1d49 Congr\u00e8s Mondial de l\u2019Eau \u00e0 Marrakech a permis au Maroc et au Conseil Mondial de l\u2019Eau d\u2019affirmer une volont\u00e9 conjointe de promouvoir des solutions innovantes pour la gestion des ressources hydriques. [maroc-diplomatique.net]\n-------------------------------------------------\nGr\u00e2ce \u00e0 la vision \u00e9clair\u00e9e de Sa Majest\u00e9 le Roi Mohammed VI, le Maroc a entam\u00e9 une nouvelle phase de mobilisation des ressources en eau reposant sur un syst\u00e8me int\u00e9gr\u00e9, a affirm\u00e9, lundi \u00e0 Marrakech, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, s\u2019est entretenu lundi 1er d\u00e9cembre 2025 avec M. Li Guoying, ministre des Ressources en eau de la R\u00e9publique populaire de Chine, en marge des travaux de la 19\u1d49 \u00e9dition du Congr\u00e8s mondial de l\u2019eau, organis\u00e9 sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI \u00e0 Marrakech. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La ministre de la Transition\nnum\u00e9rique et de la R\u00e9forme...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Serghrouchni, a annonc\u00e9 que la strat\u00e9gie nationale de lutte contre la corruption a \u00e9t\u00e9 profond\u00e9ment remani\u00e9e. [fr.hespress.com]\n-------------------------------------------------\nLa ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fellah Seghrouchni, a indiqu\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, que la feuille de route pour les services cloud 2025-2030, mise au point par le minist\u00e8re, renforcera la souverainet\u00e9 num\u00e9rique du Royaume, dans le cadre de la strat\u00e9gie Maroc Digital. [telquel.ma]\n-------- ": "Moins de 100 Airbus de\nla gamme A320 restent immobilis\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Moins de 100 Airbus de la gamme A320 restent immobilis\u00e9s en raison d\u2019un logiciel de commandes vuln\u00e9rable, sur les quelque 6.000 appareils potentiellement concern\u00e9s, a annonc\u00e9 lundi le constructeur a\u00e9ronautique. [telquel.ma]\n-------------------------------------------------\nMoins de 100 avions Airbus de la gamme A320 restent clou\u00e9s au sol en raison d\u2019un logiciel de commandes vuln\u00e9rable aux radiations solaires, sur les quelque 6.000 appareils potentiellement concern\u00e9s, a annonc\u00e9 lundi le constructeur a\u00e9ronautique. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les recettes de voyage du\nMaroc ont atteint 113 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et solidaire. [telquel.ma]\n-------------------------------------------------\nLes recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et solidaire. [aujourdhui.ma]\n-------------------------------------------------\nLes recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et : "comm_label_15", "label": "L\u2019arr\u00eat\u00e9 du compte satellite du\ntourisme pour l\u2019ann\u00e9e 2024 fait...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019arr\u00eat\u00e9 du compte satellite du tourisme pour l\u2019ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u2019\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nSelon le Haut-commissariat au Plan, la contribution au PIB national du tourisme s\u0027est am\u00e9lior\u00e9e en 2024 pour se situer \u00e0 7,3% contre 6,8% en 2019. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019arr\u00eat\u00e9 du compte satellite du tourisme pour l\u2019ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u2019\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [maroc-diplomatique.net]\n-------------------------------------------------\nL\u0027arr\u00eat\u00e9 du compte satellite du tourisme pour l\u0027ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u0027\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nLe secteur du tourisme a confirm\u00e9 en 2024 son r\u00f4le de pilier majeur de l\u2019\u00e9conomie nationale, avec un Produit int\u00e9rieur brut (PIB) touristique estim\u00e9 \u00e0 116,2 milliards de dirhams (MMDH), en hausse de 38,4 % par rapport \u00e0 son niveau de 2019, selon les donn\u00e9es du compte satellite du tourisme publi\u00e9es par le Haut-Commissariat au . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Ils peuvent soumettre leurs demandes\naupr\u00e8s des autorit\u00e9s administratives locales...", "mass": 5, "physics": false, "shape": "box", "title": "Ils peuvent soumettre leurs demandes aupr\u00e8s des autorit\u00e9s administratives locales de leur lieu de r\u00e9sidence ou directement via le site www.listeselectorales.ma\u00bb, pr\u00e9cise le minist\u00e8re dans un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nLes d\u00e9marches sont ouvertes jusqu\u2019au 31 d\u00e9cembre 2025, permettant aux citoyens et aux professionnels de v\u00e9rifier, mettre \u00e0 jour ou transf\u00e9rer leurs inscriptions afin de garantir leur participation aux prochaines \u00e9lections. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes d\u2019inscription en vue de la r\u00e9vision annuelle des listes \u00e9lectorales g\u00e9n\u00e9rales pour l\u2019ann\u00e9e 2026 est ouverte jusqu\u2019au 31 d\u00e9cembre 2025, annonce, lundi, un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [telquel.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes d\u2019inscription en vue de la r\u00e9vision annuelle des listes \u00e9lectorales g\u00e9n\u00e9rales pour l\u2019ann\u00e9e 2026 est ouverte jusqu\u2019au 31 d\u00e9cembre 2025, annonce, lundi, un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019op\u00e9ration de d\u00e9p\u00f4t des demandes d\u2019inscription en vue de la r\u00e9vision annuelle des listes \u00e9lectorales g\u00e9n\u00e9rales pour l\u2019ann\u00e9e 2026 est ouverte jusqu\u2019au 31 d\u00e9cembre 2025, annonce, lundi, un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
