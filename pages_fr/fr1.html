d": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La Bourse de Casablanca a\ntermin\u00e9 la semaine du 4...", "mass": 5, "physics": false, "shape": "box", "title": "La Bourse de Casablanca a termin\u00e9 la semaine du 4 au 8 mai sur une note positive, son indice principal, le MASI, progressant de 1,98% \u00e0 18.950,94 points (pts). [fr.hespress.com]\n-------------------------------------------------\nLa Bourse de Casablanca a termin\u00e9 la semaine du 4 au 8 mai sur une note positive, son indice principal, le MASI, progressant de 1,98% \u00e0 18.950,94 points (pts). [leseco.ma]\n-------------------------------------------------\nLa Bourse de Casablanca a cl\u00f4tur\u00e9 la semaine du 4 au 8 mai sur une orientation positive, port\u00e9e par une progression de son indice principal, le MASI, qui a gagn\u00e9 1,98% pour s\u2019\u00e9tablir \u00e0 18.950,94 points. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc a franchi une\nnouvelle \u00e9tape dans la modernisation...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a franchi une nouvelle \u00e9tape dans la modernisation de ses capacit\u00e9s militaires avec la r\u00e9ception, vendredi \u00e0 Tan-Tan, d\u2019un deuxi\u00e8me lot de sept h\u00e9licopt\u00e8res de combat Apache AH-64E destin\u00e9s aux Forces Arm\u00e9es Royales (FAR). [fr.hespress.com]\n-------------------------------------------------\nLe Maroc a r\u00e9ceptionn\u00e9 r\u00e9cemment le deuxi\u00e8me lot de sept h\u00e9licopt\u00e8res de combat Apache AH-64E, indique un communiqu\u00e9 de l\u2019Etat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR). [www.challenge.ma]\n-------------------------------------------------\nL\u2019acquisition des h\u00e9licopt\u00e8res Apache s\u2019inscrit dans le cadre des Hautes Directives de SM le Roi, Chef supr\u00eame et Chef d\u2019\u00e9tat-major une r\u00e9union avec les dirigeants et responsables des partis politiques non repr\u00e9sent\u00e9s au Parlement, dans le cadre des pr\u00e9paratifs des \u00e9lections des membres de la Chambre des repr\u00e9sentants pr\u00e9vues le 23 septembre prochain. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Coupe du monde 2026\nde football d\u00e9butera pour la...", "mass": 5, "physics": false, "shape": "box", "title": "La Coupe du monde 2026 de football d\u00e9butera pour la premi\u00e8re fois de son histoire avec trois c\u00e9r\u00e9monies d\u2019ouverture distinctes, organis\u00e9es successivement au Mexique, au Canada et aux \u00c9tats-Unis, a annonc\u00e9 samedi la Fifa, qui entend faire de cette \u00e9dition \u00e0 48 \u00e9quipes \u00ab une c\u00e9l\u00e9bration continentale et mondiale \u00bb m\u00ealant football, musique et culture. [fr.hespress.com]\n-------------------------------------------------\nLa Coupe du monde 2026 de football d\u00e9butera pour la premi\u00e8re fois de son histoire avec trois c\u00e9r\u00e9monies d\u2019ouverture distinctes, organis\u00e9es successivement au Mexique, au Canada et aux \u00c9tats-Unis, a annonc\u00e9 samedi la FIFA, qui entend faire de cette \u00e9dition \u00e0 48 \u00e9quipes \"une c\u00e9l\u00e9bration continentale et mondiale\" m\u00ealant football, musique et culture. [leseco.ma]\n-------------------------------------------------\nLa FIFA a annonc\u00e9 que la Coupe du monde 2026 d\u00e9butera, pour la premi\u00e8re fois de son histoire, avec trois c\u00e9r\u00e9monies d\u2019ouverture distinctes organis\u00e9es dans chacun des pays h\u00f4tes : le Mexique, le Canada et les \u00c9tats-Unis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le lat\u00e9ral droit du PSG\nAchraf Hakimi, touch\u00e9 \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "Le lat\u00e9ral droit du PSG Achraf Hakimi, touch\u00e9 \u00e0 la cuisse lors de la demi-finale de la Ligue des champions face au Bayern Munich, \u00ab poursuit son protocole de soin \u00bb dans la perspective de la finale contre Arsenal, a annonc\u00e9 samedi le club de Ligue 1. [fr.hespress.com]\n-------------------------------------------------\nLe PSG esp\u00e8re r\u00e9cup\u00e9rer Hakimi avant la finale de la Ligue des champions face \u00e0 Arsenal le 30 mai, rapporte RMC Sport citant une source du club, pr\u00e9cisant que le staff esp\u00e8re avoir. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Huit cas de hantavirus, dont\ntrois d\u00e9c\u00e8s, ont \u00e9t\u00e9 recens\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Huit cas de hantavirus, dont trois d\u00e9c\u00e8s, ont \u00e9t\u00e9 recens\u00e9s apr\u00e8s une flamb\u00e9e survenue \u00e0 bord du navire de croisi\u00e8re MV Hondius, battant pavillon n\u00e9erlandais, ayant navigu\u00e9 entre l\u2019. [lematin.ma]\n-------------------------------------------------\nL\u2019Organisation mondiale de la sant\u00e9 (OMS) a annonc\u00e9 qu\u2019un total de huit cas de hantavirus, dont trois d\u00e9c\u00e8s, a \u00e9t\u00e9 recens\u00e9 \u00e0 la suite d\u2019une flamb\u00e9e \u00e9pid\u00e9mique survenue \u00e0 bord du navire de croisi\u00e8re MV Hondius, qui naviguait entre l\u2019Argentine, l\u2019Antarctique et plusieurs \u00eeles de l\u2019Atlantique Sud. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Lors de cette c\u00e9r\u00e9monie, qui\ns\u2019est d\u00e9roul\u00e9e au Centre international...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette c\u00e9r\u00e9monie, qui s\u2019est d\u00e9roul\u00e9e au Centre international des conf\u00e9rences dans la capitale djiboutienne, en pr\u00e9sence de plusieurs chefs d\u2019\u00c9tat et de gouvernement et de d\u00e9. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita a repr\u00e9sent\u00e9, samedi, le Roi Mohammed VI, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture du pr\u00e9sident de la R\u00e9publique de Djibouti, M. Isma\u00efl Omar Guelleh. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u00e9tranger, Nasser Bourita, a repr\u00e9sent\u00e9, samedi 9 mai, le roi Mohammed VI lors de la c\u00e9r\u00e9monie dinvestiture du pr\u00e9sident de Djibouti, Isma\u00efl Omar Guelleh. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita a repr\u00e9sent\u00e9, samedi, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture du pr\u00e9sident de la R\u00e9publique de Djibouti, M. Isma\u00efl Omar Guelleh. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "A cette occasion, Aziz Akhannouch,\naccompagn\u00e9 d\u0027une importante d\u00e9l\u00e9gation compos\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "A cette occasion, Aziz Akhannouch, accompagn\u00e9 d\u0027une importante d\u00e9l\u00e9gation compos\u00e9e notamment du ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Ben. [lematin.ma]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, le Chef du gouvernement, M. Aziz Akhannouch a proc\u00e9d\u00e9, vendredi, \u00e0 l\u2019inauguration du Pavillon du Maroc \u00e0 la 61e Exposition internationale d\u2019art de la Biennale de Venise de 2026. [aujourdhui.ma]\n-------------------------------------------------\nOrganis\u00e9e tous les deux ans, en alternance avec la Biennale d\u2019architecture, elle constitue un rendez-vous incontournable du monde de l\u2019art. [www.lavieeco.com]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, le Chef du gouvernement, M. Aziz Akhannouch a proc\u00e9d\u00e9, vendredi, \u00e0 l\u2019inauguration du Pavillon du Maroc \u00e0 la 61e Exposition internationale d\u2019art de la Biennale de Venise de 2026. [www.lereporter.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a affirm\u00e9 vendredi \u00e0 Venise que le Maroc a, sous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, fait de la culture un levier strat\u00e9gique au service du d\u00e9veloppement, \u00e0 l\u2019occasion de l\u2019inauguration du Pavillon du Royaume \u00e0 la 61e Exposition internationale d\u2019art de la Biennale de Venise. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Commission des investissements a\napprouv\u00e9, depuis le d\u00e9but de...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des investissements a approuv\u00e9, depuis le d\u00e9but de l\u2019actuel mandat gouvernemental, 381 projets de conventions d\u2019investissement et d\u2019avenants, pour un montant global d\u2019environ 581 milliards de [www.challenge.ma]\n-------------------------------------------------\nCes projets de conventions ont \u00e9t\u00e9 approuv\u00e9s pour un montant global d\u0027environ 581 milliards de dirhams (MMDH) et devraient permettre \u00e0 terme la cr\u00e9ation de plus de 245.000 emplois directs et indirects. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le r\u00f4le strat\u00e9gique de la\ndiaspora marocaine dans l\u2019investissement, l\u2019innovation...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00f4le strat\u00e9gique de la diaspora marocaine dans l\u2019investissement, l\u2019innovation et le d\u00e9veloppement \u00e9conomique du Maroc a \u00e9t\u00e9 au centre de plusieurs panels organis\u00e9s, vendredi \u00e0 Marrakech, dans le cadre du 2e Forum \u00e9conomique des Marocains du monde. [www.lavieeco.com]\n-------------------------------------------------\nEn cl\u00f4ture de son 2e Forum \u00e9conomique des Marocains du monde ce vendredi \u00e0 Marrakech, la Fondation des troph\u00e9es MDM a d\u00e9cern\u00e9 des prix \u00e0 des entrepreneurs marocains issus de la diaspora qui ont investi dans leur pays d\u2019origine ou qui y ont cr\u00e9e des filiales de leurs entreprises. [atlasinfo.fr]\n-------------------------------------------------\nUne enqu\u00eate nationale sur l\u2019innovation au Maroc a \u00e9t\u00e9 pr\u00e9sent\u00e9e, samedi \u00e0 Marrakech, en pr\u00e9sence d\u2019investisseurs, d\u2019entrepreneurs et d\u2019experts issus de la communaut\u00e9 marocaine \u00e9tablie \u00e0 l\u2019\u00e9tranger. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Dans ce message, Sa Majest\u00e9\nle Roi affirme avoir appris...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce message, Sa Majest\u00e9 le Roi affirme avoir appris avec grande affliction la disparition du grand artiste et musicien Abdelwahab Doukkali, apr\u00e8s une riche carri\u00e8re artistique. [lematin.ma]\n-------------------------------------------------\nDans ce message, le Roi affirme     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
