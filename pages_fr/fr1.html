"comm_label_8", "label": "Une d\u00e9l\u00e9gation du Federal Bureau\nof Investigation (FBI) effectue une...", "mass": 5, "physics": false, "shape": "box", "title": "Une d\u00e9l\u00e9gation du Federal Bureau of Investigation (FBI) effectue une visite officielle au Maroc du 4 au 6 janvier afin d\u2019examiner le dispositif de s\u00e9curit\u00e9 mis en place lors de la Coupe d\u2019Afrique des nations 2025. [fr.hespress.com]\n-------------------------------------------------\nConduite par Douglas Olson, directeur des op\u00e9rations au sein de la division des services d\u2019interventions sur le terrain, et Kevin Kowalski, directeur adjoint du groupe d\u2019interventi. [lematin.ma]\n-------------------------------------------------\nUne d\u00e9l\u00e9gation du Bureau f\u00e9d\u00e9ral d\u2019enqu\u00eate am\u00e9ricain (FBI), dirig\u00e9e par Douglas Olsan, directeur des op\u00e9rations de la division des services d\u2019intervention sur le terrain, et Kevin Kowalski, directeur adjoint du groupe d\u2019intervention d\u2019urgence, effectue une visite officielle au Maroc du 4 au 6 janvier, afin de s\u2019informer sur le protocole de s\u00e9curit\u00e9 et de s\u00fbret\u00e9. [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a re\u00e7u une d\u00e9l\u00e9gation officielle du Federal Bureau of Investigation (FBI), dans le cadre dune visite du 4 au 6 janvier, ax\u00e9e sur les dispositifs de s\u00e9curit\u00e9 pour la Coupe dAfrique des nations (CAN 2025) qui se d\u00e9roule actuellement au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les examens m\u00e9dicaux ont confirm\u00e9\nque le milieu de terrain...", "mass": 5, "physics": false, "shape": "box", "title": "Les examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, ies parfois orageuses,\ndes chutes de neige, un...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Maroc, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc a enregistr\u00e9 en\n2025 un total de 19,8...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a enregistr\u00e9 en 2025 un total de 19,8 millions d\u2019arriv\u00e9es touristiques, en hausse de 14 % par rapport \u00e0 2024. [lematin.ma]\n-------------------------------------------------\nCe niveau rapproche pour la premi\u00e8re fois le Royaume du seuil de 20 millions de visiteurs sur une ann\u00e9e. [lnt.ma]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 19,8 millions d\u2019arriv\u00e9es touristiques en 2025, soit une progression de 14% par rapport \u00e0 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de [www.challenge.ma]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 19,8 millions d\u2019arriv\u00e9es touristiques en 2025, soit une progression de 14% par rapport \u00e0 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "R\u00e9alis\u00e9e en granit par les\nartistes Ben Jakober et Yannick...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9alis\u00e9e en granit par les artistes Ben Jakober et Yannick Jakober, l\u2019\u0153uvre vient enrichir le parvis du mus\u00e9e, pens\u00e9 comme un espace d\u2019exposition \u00e0 ciel ouvert. [lematin.ma]\n-------------------------------------------------\nNouvelle installation Le Mus\u00e9e Mohammed VI d\u2019art moderne et contemporain (MMVI) \u00e0 Rabat abrite, mercredi prochain, la c\u00e9r\u00e9monie de d\u00e9voilement de la nouvelle sculpture \u00abPaloma\u00bb, une \u0153uvre majestueuse en granit, con\u00e7ue par les artistes Ben et Yannick Jakober. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La Chambre fran\u00e7aise de commerce\net d\u2019industrie du Maroc (CFCIM)...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre fran\u00e7aise de commerce et d\u2019industrie du Maroc (CFCIM) a proc\u00e9d\u00e9 au renouvellement de son Bureau \u00e0 l\u2019issue de son Conseil d\u2019administration r\u00e9uni le 11 d\u00e9cembre 2025. [lematin.ma]\n-------------------------------------------------\nDirecteur g\u00e9n\u00e9ral de Batifer et d\u2019Interfer, S\u00e9bastien Le Bont\u00e9 a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de l\u2019institution et succ\u00e9dera officiellement \u00e0 Claudia Gaudiau-Francisco \u00e0 compter du 1er janvier 2026. [www.lopinion.ma]\n-------------------------------------------------\nA l\u2019issue du Conseil d\u2019Administration de la Chambre Fran\u00e7aise de Commerce et d\u2019Industrie du Maroc (CFCIM), r\u00e9uni le 11 d\u00e9cembre 2025, les Administrateurs ont \u00e9lu un nouveau Bureau. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le prochain adversaire de l\u0027\u00e9quipe\ndu Maroc en quart de...", "mass": 5, "physics": false, "shape": "box", "title": "Le prochain adversaire de l\u0027\u00e9quipe du Maroc en quart de finale de la CAN 2025 est un poids lourd du continent. [lematin.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN 2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au stade Al Madina \u00e0 Rabat. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection camerounaise s\u2019est qualifi\u00e9e, dimanche au stade Al Madina \u00e0 Rabat, pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 en s\u2019imposant face \u00e0 l\u2019Afrique du Sud sur le score de deux buts \u00e0 un, lors du huiti\u00e8me de finale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les livraisons de ciment s\u2019\u00e9l\u00e8vent\n\u00e0 14,8 millions de tonnes...", "mass": 5, "physics": false, "shape": "box", "title": "Les livraisons de ciment s\u2019\u00e9l\u00e8vent \u00e0 14,8 millions de tonnes \u00e0 fin d\u00e9cembre 2025, soit une hausse de 8,2%, selon les donn\u00e9es du minist\u00e8re de l\u0027Am\u00e9nagement du Territoire nationa. [lematin.ma]\n-------------------------------------------------\nLes livraisons de ciment ont atteint plus de 14,81 millions de tonnes (MT) au titre de l\u0027ann\u00e9e 2025, en hausse de 8,21% par rapport \u00e0 l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le minist\u00e8re de l\u0027Am\u00e9nagement du territoire national, de l\u0027Urbanisme, de l\u0027Habitat et de la Politique de la ville. [leseco.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, a fait savoir que les livraisons de ciment ont atteint plus de 14,81 millions de tonnes (MT) au titre de l\u2019ann\u00e9e 2025, en hausse de 8,21% par rapport \u00e0 l\u2019ann\u00e9e pr\u00e9c\u00e9dente. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Aida Faye Samb, une S\u00e9n\u00e9galaise\nr\u00e9sidant au Maroc, a trouv\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Aida Faye Samb, une S\u00e9n\u00e9galaise r\u00e9sidant au Maroc, a trouv\u00e9 la mort samedi dans un accident sur l\u2019autoroute Rabat-K\u00e9nitra, alors qu\u2019elle se rendait \u00e0 Tanger pour assister aux huiti\u00e8mes de finale de la Coupe d\u2019Afrique des Nations entre le S\u00e9n\u00e9gal et le Soudan, remport\u00e9 3-1 par les Lions de la Teranga. [www.lopinion.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football a annonc\u00e9 dans un communiqu\u00e9 publi\u00e9 dimanche quune S\u00e9n\u00e9galaise r\u00e9sidant au Maroc, Aida Faye Samb, a \u00e9t\u00e9 tu\u00e9e dans un accident de la route sur lautoroute Rabat-K\u00e9nitra. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les derni\u00e8res pr\u00e9cipitations enregistr\u00e9es dans\nla r\u00e9gion de Tanger-T\u00e9touan-Al Hoceima...", "mass": 5, "physics": false, "shape": "box", "title": "Les derni\u00e8res pr\u00e9cipitations enregistr\u00e9es dans la r\u00e9gion de Tanger-T\u00e9touan-Al Hoceima ont contribu\u00e9 \u00e0 renforcer les r\u00e9serves hydriques des grands barrages relevant de la zone d\u2019action de l\u2019Agence du bassin hydraulique du Loukkos, portant leur taux de remplissage \u00e0 plus de 61%. [www.lopinion.ma]\n-------------------------------------------------\nLes derni\u00e8res pr\u00e9cipitations enregistr\u00e9es dans la r\u00e9gion de Tanger-T\u00e9touan-Al Hoceima ont contribu\u00e9 \u00e0 renforcer les r\u00e9serves hydriques des grands barrages relevant de la zone d\u2019action de l\u2019Agence du bassin hydraulique du Loukkos, portant leur taux de remplissage \u00e0 plus de 61%. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Haut-Commissariat au Plan a\nindiqu\u00e9, dans une note publi\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "La Haut-Commissariat au Plan a indiqu\u00e9, dans une note publi\u00e9e lundi 5 janvier, que l\u2019indice des valeurs moyennes \u00e0 l\u2019importation a recul\u00e9 de 5,8 %, tandis que celui des exportations a progress\u00e9 l\u00e9g\u00e8rement de 0,4 % au troisi\u00e8me trimestre 2025 par rapport \u00e0 la m\u00eame p\u00e9riode en 2024. [www.lopinion.ma]\n-------------------------------------------------\nLes indices des valeurs unitaires \u00e0 l\u2019importation ont recul\u00e9 de 5,8% et ceux \u00e0 l\u2019exportation ont augment\u00e9 de 0,4% durant le troisi\u00e8me trimestre de 2025, indique le Haut-Commissariat [www.challenge.ma]\n-------------------------------------------------\nLes indices des valeurs unitaires \u00e0 l\u0027importation ont recul\u00e9 de 5,8% et ceux \u00e0 l\u0027exportation ont augment\u00e9 de 0,4% durant le troisi\u00e8me trimestre de 2025, selon le Haut-Commissariat au plan (HCP). [www.lavieeco.com]\n-------------------------------------------------\nSelon le rapport trimestriel publi\u00e9 le 5 janvier 2026 par le Haut-Commissariat au Plan, l\u2019\u00e9conomie marocaine a enregistr\u00e9 en 2025 une d\u00e9sinflation marqu\u00e9e \u00e0 l\u2019importation et des \u00e9volutions contrast\u00e9es \u00e0 l\u2019exportation. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Maroc r\u00e9affirme son soutien\n\u00e0 l\u2019unit\u00e9 du Y\u00e9men et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc r\u00e9affirme son soutien \u00e0 l\u2019unit\u00e9 du Y\u00e9men et appelle au dialogue, alors que les combats entre forces gouvernementales et s\u00e9paratistes du Sud ont fait au moins 80 morts depuis vendredi. [telquel.ma]\n-------------------------------------------------\nLe Royaume du Maroc a r\u00e9it\u00e9r\u00e9, samedi, son soutien \u00ab in\u00e9branlable \u00bb \u00e0 l\u2019unit\u00e9 nationale de la R\u00e9publique s\u0153ur du Y\u00e9men et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, tout en exprimant son attachement au droit du peuple y\u00e9m\u00e9nite \u00e0 la s\u00e9curit\u00e9 et \u00e0 la stabilit\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Selon le communiqu\u00e9 de presse\nde l\u2019ONDA, \u201cce centre strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le communiqu\u00e9 de presse de l\u2019ONDA, \u201cce centre strat\u00e9gique marque une avanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle du premier a\u00e9roport du Royaume et contribuera \u00e0 la fluidit\u00e9 durant la CAN 2025. [telquel.ma]\n-------------------------------------------------\nL\u2019Office National des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u2019a\u00e9roport international Mohammed V de Casablanca, marquant une avanc\u00e9e structurante dans l\u2019organisation [www.challenge.ma]\n-------------------------------------------------\nDans un contexte de croissance soutenue du trafic a\u00e9rien, estim\u00e9e \u00e0 plus de 12%, l\u2019objectif est de favoriser fluidit\u00e9 durant la Coupe d\u2019Afrique des nations (CAN 2025) qui se d\u00e9roule au Maroc, mais aussi pendant les grands \u00e9v\u00e9nements internationaux que le pays va accueillir prochainement. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019ONDA lance un centre de commandement au sein de l\u2019a\u00e9roport Mohammed V. L\u0027Office national des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u0027a\u00e9roport international Mohammed V de Casablanca. [leseco.ma]\n-------------------------------------------------\nL\u2019Office national des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u2019a\u00e9roport international Mohammed V de Casablanca. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Donald Trump a affirm\u00e9 que\nles Etats-Unis \u00e9taient \u00ab aux...", "mass": 5, "physics": false, "shape": "box", "title": "Donald Trump a affirm\u00e9 que les Etats-Unis \u00e9taient \u00ab aux commandes \u00bb du Venezuela apr\u00e8s la capture du pr\u00e9sident Nicolas Maduro, qui doit \u00eatre pr\u00e9sent\u00e9 lundi \u00e0 un tribunal \u00e0 New York pour se voir signifier des accusations de trafic de drogue. [telquel.ma]\n-------------------------------------------------\nLes Etats-Unis ont laiss\u00e9 entendre dimanche qu\u2019ils pourraient collaborer avec les dirigeants v\u00e9n\u00e9zu\u00e9liens encore au pouvoir, apr\u00e8s la capture du pr\u00e9sident Nicolas Maduro par les forces am\u00e9ricaines et son transfert \u00e0 New York pour r\u00e9pondre devant la justice am\u00e9ricaine d\u2019accusations de \u00ab narcoterrorisme \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La Royal air Maroc (RAM)\na annonc\u00e9, ce lundi, l\u2019annulation...", "mass": 5, "physics": false, "shape": "box", "title": "La Royal air Maroc (RAM) a annonc\u00e9, ce lundi, l\u2019annulation de deux vols AT850 et AT851, pr\u00e9vus ce 5 janvier 2026 depuis et vers l\u2019a\u00e9roport d\u2019Amsterdam Schiphol (Pays-Bas), en raison des conditions m\u00e9t\u00e9orologiques dans la r\u00e9gion. [www.yabiladi.com]\n-------------------------------------------------\nRoyal Air Maroc a annonc\u00e9 l\u2019annulation des vols AT850 et AT851, pr\u00e9vus le 5 janvier 2026 entre Casablanca et Amsterdam Schiphol, en raison de conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans la r\u00e9gion d\u2019Amsterdam. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le s\u00e9lectionneur national, Walid Regragui,\na indiqu\u00e9, dimanche \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [leseco.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La s\u00e9lection marocaine de football\na battu son homologue de...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football a battu son homologue de la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour les huiti\u00e8mes de finale de la Coupe d\u0027Afrique des nations (CAN-2025). [leseco.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe \u00e9gyptienne de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2025 en s\u2019imposant face \u00e0 son homologue b\u00e9ninoise sur le score de 3 buts \u00e0 1 apr\u00e8s prolongation, en match des huiti\u00e8mes de finale disput\u00e9 lundi au Grand stade d\u20     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
