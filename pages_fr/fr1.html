s de la Colombie. [telquel.ma]\n-------------------------------------------------\n\u00c0 la suite du s\u00e9isme qui a frapp\u00e9 plusieurs r\u00e9gions de Colombie, Sa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message de condol\u00e9ances au Pr\u00e9sident colombien, exprimant sa compassion aux familles endeuill\u00e9es et la pleine solidarit\u00e9 du Maroc avec le peuple colombien. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les autorit\u00e9s publiques ont pris\ntoutes les mesures n\u00e9cessaires pour...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s publiques ont pris toutes les mesures n\u00e9cessaires pour contrer toute tentative de passage ill\u00e9gal vers les villes de Sebta et Mellilia et intercepter toute personne c. [lematin.ma]\n-------------------------------------------------\nLes autorit\u00e9s publiques ont pris toutes les mesures n\u00e9cessaires pour contrer toute tentative de passage ill\u00e9gal vers les villes de Sebta et Mellilia et intercepter toute personne cherchant [www.challenge.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur affirme avoir pris toutes les mesures n\u00e9cessaires pour emp\u00eacher toute tentative de passage collectif et ill\u00e9gal vers Sebta et Melillia, apr\u00e8s la diffusion sur les r\u00e9seaux sociaux d\u2019appels li\u00e9s au 15 ao\u00fbt 2026. [www.lavieeco.com]\n-------------------------------------------------\nLes autorit\u00e9s publiques marocaines ont pris toutes les mesures n\u00e9cessaires pour faire face \u00e0 toute tentative de passage ill\u00e9gal vers les villes de Sebta et Mellilia et intercepter toute personne cherchant \u00e0 y participer, a indiqu\u00e9, mercredi \u00e0 Rabat, le porte-parole du minist\u00e8re marocain de l\u2019Int\u00e9rieur. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Diplomate de carri\u00e8re, Christopher Deutsch\narrive au Maroc avec plusieurs...", "mass": 5, "physics": false, "shape": "box", "title": "Diplomate de carri\u00e8re, Christopher Deutsch arrive au Maroc avec plusieurs d\u00e9cennies d\u2019exp\u00e9rience au sein du Foreign Service am\u00e9ricain. [lematin.ma]\n-------------------------------------------------\nDiplomatie : Sous la direction de l\u2019ambassadeur des \u00c9tats-Unis Duke Buchan III, la Mission des \u00c9tats-Unis au Maroc annonce l\u2019arriv\u00e9e de Christopher Deutsch en tant que nouveau consul g\u00e9n\u00e9ral des \u00c9tats-Unis \u00e0 Casablanca. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Ainsi, des averses avec risque\nde gr\u00eale et rafales de...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, des averses avec risque de gr\u00eale et rafales de vent sous orages (20 \u00e0 35 mm) sont pr\u00e9vues, mercredi de 13H \u00e0 23H, dans les provinces de Ifrane, Khemisset, Figuig, Rehamna, M. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, de rafale de vent sous orages et une vague de chaleur sont attendues, de mercredi \u00e0 vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie annonce des averses orageuses avec risque de gr\u00eale dans plusieurs provinces et une vague de chaleur pouvant atteindre 48\u00b0C dans le sud du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le nombre de nuit\u00e9es enregistr\u0 laire (MP), de propos portant atteinte \u00e0 son pr\u00e9sident Driss Chahtane. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "A l\u2019oppos\u00e9 de la fronde\ndes Europ\u00e9ens, six f\u00e9d\u00e9rations nationales...", "mass": 5, "physics": false, "shape": "box", "title": "A l\u2019oppos\u00e9 de la fronde des Europ\u00e9ens, six f\u00e9d\u00e9rations nationales arabes de football, dont celle du Maroc, ont apport\u00e9, jeudi 13 ao\u00fbt 2026, leur \u00ab soutien total \u00bb au pr\u00e9sident [www.challenge.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football (FRMF), Fouzi Lekjaa, ainsi que les pr\u00e9sidents de cinq f\u00e9d\u00e9rations arabes, ont annonc\u00e9 leur soutien au pr\u00e9sident de la F\u00e9d\u00e9ration internationale de football (FIFA), Gianni Infantino, confront\u00e9 \u00e0 une crise apr\u00e8s l\u2019\u00e9chec de son projet visant \u00e0 ouvrir les comp\u00e9titions de l\u2019instance, dont la Coupe du monde, aux investissements priv\u00e9s. [www.yabiladi.com]"}]);

        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
