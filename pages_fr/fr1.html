------------------------------------------------\n\u2014 Malgr\u00e9 des bases macro\u00e9conomiques solides, le mod\u00e8le de croissance actuelreste insuffisamment cr\u00e9ateur d\u2019emplois, avec une population activequi progresse plus vite que l\u2019emploi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Face aux tensions persistantes au\nMoyen-Orient et \u00e0 leurs r\u00e9percussions...", "mass": 5, "physics": false, "shape": "box", "title": "Face aux tensions persistantes au Moyen-Orient et \u00e0 leurs r\u00e9percussions sur les march\u00e9s de l\u2019\u00e9nergie, le d\u00e9bat \u00e9conomique au Maroc se concentre d\u00e9sormais sur une question centrale. [lematin.ma]\n-------------------------------------------------\n\u2014 Selon El Mehdi Fakir, le pays ne devrait pas recourir, pour l\u2019instant,\u00e0 une loi de finances rectificative, gr\u00e2ce \u00e0 des marges budg\u00e9taireset des m\u00e9canismes d\u2019ajustement encore disponibles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019ambassadeur du Maroc aux Etats-Unis,\nYoussef Amrani, a eu des...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur du Maroc aux Etats-Unis, Youssef Amrani, a eu des entretiens \u00e0 Washington avec le Directeur ex\u00e9cutif du Groupe de travail de la Maison Blanche pour la Coupe du Monde 2026, Andrew Giuliani, une rencontre qui traduit \u00e0 la fois un fort int\u00e9r\u00eat de coop\u00e9ration et l\u2019amiti\u00e9 historique liant le Royaume et les Etats-Unis. [telquel.ma]\n-------------------------------------------------\nL\u2019ambassadeur du Maroc aux Etats-Unis, Youssef Amrani, a tenu r\u00e9cemment des entretiens avec le Conseiller pr\u00e9sidentiel en charge de la Task Force de la Maison-Blanche pour la Coupe du monde 2026, Andrew Giuliani. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Selon la page officielle des\nForces Arm\u00e9es Royales sur Facebook...", "mass": 5, "physics": false, "shape": "box", "title": "Selon la page officielle des Forces Arm\u00e9es Royales sur Facebook (Far Maroc), deux militaires am\u00e9ricains participant \u00e0 l\u2019exercice African Lion 2026 ont \u00e9t\u00e9 port\u00e9s disparus le 2 mai 2026 vers 21h00, au niveau d\u2019une falaise \u00e0 Cap Draa, dans la r\u00e9gion de TanTan. [telquel.ma]\n-------------------------------------------------\nDeux militaires am\u00e9ricains participant \u00e0 African Lion 2026 ont \u00e9t\u00e9 port\u00e9s disparus le 2 mai 2026 vers 21h00, au niveau d\u2019une falaise \u00e0 Cap Draa, dans la r\u00e9gion de TanTan, apprend-on aupr\u00e8s de sources officielles des Forces Arm\u00e9es Royales. [www.lereporter.ma]\n-------------------------------------------------\nDeux militaires am\u00e9ricains participant \u00e0 l\u2019exercice African Lion 2026 ont \u00e9t\u00e9 port\u00e9s disparus dans la soir\u00e9e du 2 mai, au niveau d\u2019une falaise situ\u00e9e \u00e0 Cap Draa, selon des sources officielles des Forces Arm\u00e9es Royales. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les autobus ont \u00e9t\u00e9 remis\nau d\u00e9l\u00e9gataire charg\u00e9 du transport...", "mass": 5, "physics": false, "shape": "box", "title": "Les autobus ont \u00e9t\u00e9 remis au d\u00e9l\u00e9gataire charg\u00e9 du transport urbain et p\u00e9riurbain par bus, \u00e0 savoir la soci\u00e9t\u00e9 \u00abIssal T\u00e9touan\u00bb, issue d\u2019un partenariat entre la Soci\u00e9t\u00e9 marocaine de transport et la soci\u00e9t\u00e9 \u00abTransdev\u00bb, pour le compte de . [aujourdhui.ma]\n-------------------------------------------------\nCe parc est         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({

                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
