erie [www.challenge.ma]\n-------------------------------------------------\nAttijariwafa bank, l\u2019Office National Interprofessionnel des C\u00e9r\u00e9ales et des L\u00e9gumineuses (ONICL) et la F\u00e9d\u00e9ration Nationale de la Minoterie (FNM) ont sign\u00e9 une convention de partenariat strat\u00e9gique visant \u00e0 renforcer l\u2019accompagnement financier des minoteries industrielles marocaines et \u00e0 soutenir durablement un secteur cl\u00e9 de l\u2019\u00e9conomie nationale. [www.lavieeco.com]\n-------------------------------------------------\nAttijariwafa bank, l\u2019Office National Interprofessionnel des C\u00e9r\u00e9ales et des L\u00e9gumineuses (ONICL) et la F\u00e9d\u00e9ration Nationale de la Minoterie (FNM) ont sign\u00e9 une convention de partenariat strat\u00e9gique visant \u00e0 renforcer l\u2019accompagnement financier des minoteries industrielles marocaines et \u00e0 soutenir durablement un secteur cl\u00e9 de l\u2019\u00e9conomie nationale. [leseco.ma]\n-------------------------------------------------\nAttijariwafa bank, l\u2019Office National Interprofessionnel des C\u00e9r\u00e9ales et des L\u00e9gumineuses (ONICL) et la F\u00e9d\u00e9ration Nationale de la Minoterie (FNM) ont sign\u00e9 une convention de partenariat strat\u00e9gique visant \u00e0 renforcer l\u2019accompagnement financier des minoteries industrielles marocaines et \u00e0 soutenir durablement un secteur cl\u00e9 de l\u2019\u00e9conomie nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La 6\u00e8me Conf\u00e9rence minist\u00e9rielle annuelle\nde l\u0027initiative AAA (Adaptation de...", "mass": 5, "physics": false, "shape": "box", "title": "La 6\u00e8me Conf\u00e9rence minist\u00e9rielle annuelle de l\u0027initiative AAA (Adaptation de l\u0027Agriculture Africaine) tenue, mercredi \u00e0 Mekn\u00e8s en marge du 18\u00e8me Salon Internati. [lematin.ma]\n------------ onstitue pas une rupture, mais l\u2019aboutissement d\u2019une transformation structur\u00e9e des usages, qui . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Donald Trump a publi\u00e9 jeudi\nplusieurs messages au ton agressif...", "mass": 5, "physics": false, "shape": "box", "title": "Donald Trump a publi\u00e9 jeudi plusieurs messages au ton agressif sur l\u2019Iran, en disant en particulier avoir ordonn\u00e9 \u00e0 la marine am\u00e9ricaine d\u0027 \u00bbabattre et tuer tous les bateaux, aussi petits soient-ils () qui posent des mines \u00bb dans le d\u00e9troit d\u2019Ormuz. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident Donald Trump a d\u00e9clar\u00e9, jeudi, avoir ordonn\u00e9 \u00e0 la marine am\u00e9ricaine de \u00ab tirer pour d\u00e9truire \u00bb tout navire qui poserait des mines dans les eaux du d\u00e9troit d\u2019Ormuz, tout en assurant que les op\u00e9rations de d\u00e9minage de ce d\u00e9troit strat\u00e9gique vont \u00eatre acc\u00e9l\u00e9r\u00e9es. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le pr\u00e9sident de la F\u00e9d\u00e9ration\nsalvadorienne de football, Yamil Bukele,...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la F\u00e9d\u00e9ration salvadorienne de football, Yamil Bukele, a annonc\u00e9 l\u2019annulation du match amical qui devait opposer la s\u00e9lection de son pays \u00e0 celle du Maroc, apr\u00e8s r\u00e9ception d\u2019un courrier officiel de la F\u00e9d\u00e9ration royale marocaine de football. [telquel.ma]\n-------------------------------------------------\nYamil Bukele, pr\u00e9sident de la F\u00e9d\u00e9ration salvadorienne de football, a annonc\u00e9 un changement dans le programme des matchs amicaux de son \u00e9quipe nationale pour la prochaine tr\u es du Tr\u00e9sor (SCRT) \u00e0 fin mars 2026 fait ressortir un exc\u00e9dent budg\u00e9taire de 5,1 milliards de dirhams (MMDH), contre un exc\u00e9dent de 768 millions de dirhams (MDH) un an auparavant, selon le minist\u00e8re de l\u0027\u00c9conomie et des Finances. [www.lavieeco.com]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor (SCRT) a d\u00e9gag\u00e9 un besoin de financement de 796 millions de dirhams (MDH) \u00e0 fin mars 2026, contre 15,6 milliards de dirhams (MMDH) durant la m\u00eame p\u00e9riode de l\u2019ann\u00e9e \u00e9coul\u00e9e, selon le minist\u00e8re de l\u2019\u00c9conomie et des Finances. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "\u00c0 l\u2019occasion du SIAM 2026,\nCentrale Danone annonce le lancement...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du SIAM 2026, Centrale Danone annonce le lancement au Maroc de la \u00ab Milk Academy \u00bb, un dispositif structurant d\u00e9di\u00e9 \u00e0 la mont\u00e9e en comp\u00e9tences des \u00e9leveurs, et [www.challenge.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la 18\u1d49 \u00e9dition du Salon International de l\u2019Agriculture au Maroc (SIAM 2026), tenue \u00e0 Mekn\u00e8s le 22 avril, Centrale Danone a annonc\u00e9 le lancement de la \u00ab Milk Academy. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La Fondation Mohammed VI des\nsciences et de la sant\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Mohammed VI des sciences et de la sant\u00e9 (FM6SS) et l\u2019Agence internationale de l\u00e9nergie atomique (AIEA) ont sign\u00e9, mercredi \u00e0 Vienne, un accord de coop\u00e9ration strat\u00e9gique, marquant une avanc\u00e9e significative dans le renforcement des collaborations internationales au service de la sant\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nLa Fondation Mohammed VI des sciences et de la sant\u00e9 (FM6SS) et l\u2019Agence internationale de l\u2019\u00e9nergie atomique (AIEA) ont sign\u00e9, mercredi \u00e0 Vienne, un accord de coop\u00e9ration strat\u00e9gique, marquant une avanc\u00e9e significative dans le renforcement des collaborations internationales au service de la sant\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat sous la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat sous la pr\u00e9sidence du Chef du gouvernement, Aziz Akhannouch, a approuv\u00e9 des propositions de nomination \u00e0 de hautes fonctions, conform\u00e9ment \u00e0 l\u2019article 92 de la Constitution. [aujourdhui.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat sous la pr\u00e9sidence du chef du gouvernement, Aziz Akhannouch, a approuv\u00e9 des propositions de nomination \u00e0 de hautes fonctions, conform\u00e9ment \u00e0 l\u2019article 92 de la Constitution. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019occasion du 18e Salon\ninternational de l\u2019agriculture au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 18e Salon international de l\u2019agriculture au Maroc \u00e0 Mekn\u00e8s, l\u2019op\u00e9rateur phosphatier d\u00e9voile une vision globale des syst\u00e8mes agricoles o\u00f9 le phosphore joue un r\u00f4le central, reliant fertilit\u00e9 des sols, production v\u00e9g\u00e9tale et alimentation animale. [leseco.ma]\n-------------------------------------------------\nLe Groupe Cr\u00e9dit Agricole du Maroc (CAM) a sign\u00e9, jeudi \u00e0 Mekn\u00e8s, cinq conventions et m\u00e9morandums de partenariat avec des acteurs nationaux et internationaux, couvrant l\u2019\u00e9ducation financi\u00e8re rurale, la transition verte des fili\u00e8res agricoles, la coop\u00e9ration internationale et la m\u00e9canisation agricole. [atlasinfo.fr]\n-------------------------------------------------\nUn accord-cadre de coop\u00e9ration dans les domaines de la p\u00eache maritime et de l\u2019aquaculture a \u00e9t\u00e9 sign\u00e9, jeudi \u00e0 Mekn\u00e8s, entre le Maroc et le Cameroun, en marge du Salon International de l\u2019Agriculture au Maroc (SIAM), en vue de renforcer leur partenariat dans ce secteur strat\u00e9gique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Du 25 au 27 juin,\nEssaouira devient le c\u0153ur battant...", "mass": 5, "physics": false, "shape": "box", "title": "Du 25 au 27 juin, Essaouira devient le c\u0153ur battant d\u2019une partition musicale en perp\u00e9tuel mouvement, o\u00f9 les Ma\u00e2lems Gnaoua, d\u00e9positaires d\u2019une tradition vivante, rencontrent les grandes voix du monde pour trois jours de fusions, d\u2019\u00e9motions et de partage. [leseco.ma]\n-------------------------------------------------\nLa 27e \u00e9dition du Festival Gnaoua et Musiques du Monde, pr\u00e9vue du 25 au 27 juin prochain \u00e0 Essaouira, accueillera plus de 400 artistes, dont 42 Ma\u00e2lems, qui se produiront sur diff\u00e9rentes sc\u00e8nes, entre grands concerts et formats intimistes. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "SM le Roi Mohammed VI\na offert, ce jeudi 23...", "mass": 5, "physics": false, "shape": "box", "title": "SM le Roi M ar le Maroc, comme \u00ab la base la plus cr\u00e9dible, viable et pragmatique pour la paix au Sahara \u00bb. [www.lereporter.ma]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
