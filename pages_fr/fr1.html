nt\u00e9rieur a tenu, vendredi, une r\u00e9union avec les secr\u00e9taires g\u00e9n\u00e9raux et responsables des centrales syndicales, dans le cadre des pr\u00e9paratifs des \u00e9ch\u00e9ances \u00e9lectorales de 2027. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Banque africaine de d\u00e9veloppement\n(BAD) a annonc\u00e9, vendredi, la...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [fr.hespress.com]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [telquel.ma]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement a annonc\u00e9, vendredi 30 octobre, avoir r\u00e9alis\u00e9 sa premi\u00e8re \u00e9mission obligataire en dirhams marocains, levant 1 milliard de dirhams \u00e0 travers un placement priv\u00e9 destin\u00e9 aux investisseurs qualifi\u00e9s. [www.yabiladi.com]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [aujourdhui.ma]\n-------------------------------------------------\nEffectu\u00e9e sous forme de placement priv\u00e9 aupr\u00e8s d\u2019investisseurs qualifi\u00e9s, cette op\u00e9ration marque une nouvelle \u00e9tape dans la diversification des instruments de financement de l\u2019institution au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le s\u00e9lectionneur national Mohamed Ouahbi\nd\u00e9voilera, mercredi 4 novembre, la...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national Mohamed Ouahbi d\u00e9voilera, mercredi 4 novembre, la liste des Lions de l\u2019Atlas retenus pour la double confrontation face au Niger, comptant pour les 3\u00e8 et 4. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Mohamed Ouahbi, tiendra une conf\u00e9rence de presse mercredi prochain pour d\u00e9voiler la liste des joueurs convoqu\u00e9s pour le prochain rassemblement pr\u00e9c\u00e9dant la double confrontation face au Niger, comptant pour les 3\u00e8 et 4\u00e8 journ\u00e9es des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations 2027. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019occasion du premier anniversaire\nde la F\u00eate de l\u2019Unit\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du premier anniversaire de la F\u00eate de l\u2019Unit\u00e9, Bank Al-Maghrib \u00e9met une pi\u00e8ce comm\u00e9morative de 250 dirhams en argent.La pi\u00e8ce comm\u00e9morative pr\u00e9sente \u00e0 l\u2019avers l\u2019effigi. [lematin.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) a lanc\u00e9 une pi\u00e8ce comm\u00e9morative en argent dune valeur faciale de 250 dirhams pour c\u00e9l\u00e9brer le premier anniversaire de la F\u00eate de lUnit\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nD\u2019une valeur faciale de 250 dirhams, elle porte \u00e0 l\u2019avers l\u2019effigie de Sa Majest\u00e9 le Roi Mohamm         function positionCommunityLabels() {
