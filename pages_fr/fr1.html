x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Roi Mohammed VI, a\nre\u00e7u mercredi, au Palais Royal...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI, a re\u00e7u mercredi, au Palais Royal \u00e0 Rabat, Fatima Ezzahra El Mansouri, Cheffe du gouvernement charg\u00e9e de la formation du nouveau gouvernement, a indiqu\u00e9 un communiqu\u00e9 du cabinet royal. [fr.hespress.com]\n-------------------------------------------------\nVoici un communiqu\u00e9 du Cabinet Royal:Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u mercredi 14 octobre 2026, au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansou. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI a accord\u00e9 une deuxi\u00e8me et nouvelle audience \u00e0 Fatima Ezzahra El Mansouri ce mercredi 14 octobre, selon un communiqu\u00e9 du cabinet royal. [telquel.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a re\u00e7u, mercredi 14 octobre 2026 au Palais royal de Rabat, Fatima Ezzahra El Mansouri, Cheffe du gouvernement pour former le nouvel ex\u00e9cutif. [www.yabiladi.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u mercredi 14 octobre 2026, au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansouri, Cheffe du gouvernement charg\u00e9e de la formation du nouveau gouvernement. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Masen a annonc\u00e9 le lancement\nde la phase de pr\u00e9qualification...", "mass": 5, "physics": false, "shape": "box", "title": "Masen a annonc\u00e9 le lancement de la phase de pr\u00e9qualification du programme Noor PV multisites, destin\u00e9 \u00e0 d\u00e9velopper plusieurs centrales solaires photovolta\u00efques dans diff\u00e9rentes r\u00e9g. [lematin.ma]\n-------------------------------------------------\nL\u2019Agence marocaine pour l\u2019\u00e9nergie durable (MASEN) annonce le lancement de la phase de pr\u00e9qualification pour la s\u00e9lection du contractant charg\u00e9 de la conception, de la fourniture des \u00e9quipements, de la construction ainsi que de l\u2019exploitation et de la maintenance des centrales solaires photovolta\u00efques du programme Noor PV Multisites. [telquel.ma]\n-------------------------------------------------\nLe programme porte sur le d\u00e9veloppement de plusieurs centrales photovolta\u00efques r\u00e9parties dans diff\u00e9rentes r\u00e9gions du Royaume, pour une capacit\u00e9 totale minimale de 350 MW. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La nouvelle plateforme de traitement\ndes r\u00e9clamations propose une interface...", "mass": 5, "physics": false, "shape": "box", "title": "La nouvelle plateforme de traitement des r\u00e9clamations propose une interface plus ergonomique, intuitive et accessible, offrant aux usagers un parcours simplifi\u00e9 pour le d\u00e9p\u00f4t et le. [lematin.ma]\n-------------------------------------------------\nMise en place par l\u0027ACAPS, la plateforme propose une interface plus ergonomique, intuitive et accessible, offrant aux usagers un parcours simplifi\u00e9 pour le d\u00e9p\u00f4t et le suivi de leurs r\u00e9clamations, ainsi que pour leurs \u00e9changes avec l\u0027Autorit\u00e9, tout en assurant la tra\u00e7abilit\u00e9 des dossiers. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Selon un communiqu\u00e9 du pr\u00e9sident\nde la premi\u00e8re Chambre, cette...", "mass": 5, "physics": false, "shape": "box", "title": "Selon un communiqu\u00e9 du pr\u00e9sident de la premi\u00e8re Chambre, cette s\u00e9ance, qui se tiendra conform\u00e9ment \u00e0 l\u2019article 62 de la Constitution et des dispositions du r\u00e8glement int\u00e9rieur de l. [lematin.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9 du pr\u00e9sident de la premi\u00e8re Chambre, cette s\u00e9ance, qui se tiendra conform\u00e9ment \u00e0 l\u2019article 62 de la Constitution et des dispositions du r\u00e8glement int\u00e9rieur de la. [telquel.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants proc\u00e9dera, mercredi 14 octobre, \u00e0 l\u2019\u00e9lection des membres de son Bureau et des pr\u00e9sidents des commissions parlementaires permanentes, lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re pr\u00e9vue \u00e0 partir de 15h. [www.lavieeco.com]\n-------------------------------------------------\nSelon un communiqu\u00e9 du pr\u00e9sident de la premi\u00e8re Chambre, cette s\u00e9ance, qui se tiendra conform\u00e9ment \u00e0 l\u2019article 62 de la Constitution et des dispositions du r\u00e8glement int\u00e9rieur de la [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Que sont devenus les designers\nqui ont expos\u00e9 \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "Que sont devenus les designers qui ont expos\u00e9 \u00e0 la Galerie H ? [lematin.ma]\n-------------------------------------------------\nPour la premi\u00e8re fois, elle r\u00e9unit dans une m\u00eame exposition vingt-sept designers issus de ses diff\u00e9rentes \u00e9ditions, avec une carte blanche : chacun d\u00e9voile une \u0153uvre ou un ensemble d\u2019\u0153uvres in\u00e9dites. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Maroc poursuit le d\u00e9veloppement\net la modernisation de son...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc poursuit le d\u00e9veloppement et la modernisation de son r\u00e9seau ferroviaire \u00e0 travers un programme d\u2019investissement, assorti d\u2019un programme compl\u00e9mentaire, dot\u00e9 d\u2019une enveloppe globale de 134 milliards de dirhams (MMDH) \u00e0 l\u2019horizon 2030, a indiqu\u00e9, mercredi \u00e0 Rabat, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [telquel.ma]\n-------------------------------------------------\nLe Maroc poursuit la modernisation et l\u2019extension de son r\u00e9seau ferroviaire \u00e0 travers un programme d\u2019investissement, compl\u00e9t\u00e9 par un programme additionnel, pour une enveloppe globale de 134 MMDH \u00e0 l\u2019horizon 2030. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc poursuit le d\u00e9veloppement de ses infrastructures ferroviaires \u00e0 travers un programme d\u2019investissement, compl\u00e9t\u00e9 par des projets additionnels, repr\u00e9sentant une enveloppe globale de 134 milliards de dirhams \u00e0 l\u2019horizon 2030. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La World Surf League (WSL)\nEurope et Afrique fait son...", "mass": 5, "physics": false, "shape": "box", "title": "La World Surf League (WSL) Europe et Afrique fait son retour au Maroc avec le Junior Pro Taghazout Bay, programm\u00e9 du 11 au 15 novembre 2026 dans le cadre des Junior Qualifying Series (JQS). [telquel.ma]\n-------------------------------------------------\nLa World Surf League (WSL) Europe et Afrique organisera le Junior Pro Taghazout Bay du 11 au 15 novembre 2026, dans le cadre des Junior Qualifying Series (JQS). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le groupe H\u0026S, via sa\ndivision de distribution One Retail,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe H\u0026S, via sa division de distribution One Retail, annonce la signature d\u2019un partenariat avec le distributeur d\u2019articles de sport Intersport. [telquel.ma]\n-------------------------------------------------\nLe distributeur darticles de sport INTERSPORT simplante au Maroc gr\u00e2ce \u00e0 un partenariat avec One Retail, la branche retail du groupe H\u0026S, selon un communiqu\u00e9 du 12 octobre. [www.yabiladi.com]\n-------------------------------------------------\nLe groupe H\u0026S, via sa division de distribution One Retail, ouvre une nouvelle voie de croissance strat\u00e9gique et annonce la signature d\u0027un partenariat avec INTERSPORT, l\u0027un des leaders mondiaux de la distribution d\u0027articles de sport. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le chef de division au\nd\u00e9partement des finances publiques du...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef de division au d\u00e9partement des finances publiques du Fonds mon\u00e9taire international (FMI), Davide Furceri, a salu\u00e9, mercredi \u00e0 Bangkok, les efforts de consolidation budg\u00e9taire du Maroc. [telquel.ma]\n-------------------------------------------------\nLe chef de division au d\u00e9partement des finances publiques du FMI, Davide Furceri, a salu\u00e9 mercredi \u00e0 Bangkok les efforts du Maroc en mati\u00e8re de consolidation budg\u00e9taire, tout en appelant \u00e0 pr\u00e9server la protection sociale des populations vuln\u00e9rables face aux chocs li\u00e9s aux prix de l\u2019\u00e9nergie. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les lev\u00e9es de capitaux ont\natteint pr\u00e8s de 77 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "Les lev\u00e9es de capitaux ont atteint pr\u00e8s de 77 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre 77,05 MMDH \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC). [telquel.ma]\n-------------------------------------------------\nAMMC : Les lev\u00e9es de capitaux ont atteint pr\u00e8s de 77 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre 77,05 milliards de dirhams \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC). [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Ahmed Touizi a obtenu 220\nvoix sur les 369 voix...", "mass": 5, "physics": false, "shape": "box", "title": "Ahmed Touizi a obtenu 220 voix sur les 369 voix exprim\u00e9es, contre 59 voix pour Driss El Azami El Idrissi du Parti Justice et D\u00e9veloppement (opposition), alors que 90 bulletins ont \u00e9t\u00e9 d\u00e9clar\u00e9s nuls. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019\u00e9lection du pr\u00e9sident de la Chambre des repr\u00e9sentants s\u2019est ouverte ce mardi \u00e0 Rabat. [www.lavieeco.com]\n-------------------------------------------------\nAhmed Touizi a obtenu 220 voix sur les 369 voix exprim\u00e9es, contre 59 voix pour Driss El Azami El Idrissi du Parti Justice et D\u00e9veloppement, alors que 90 bulletins ont \u00e9t\u00e9 d\u00e9clar\u00e9s nuls. [www.lereporter.ma]\n-------------------------------------------------\nLe candidat du parti arriv\u00e9 premier aux l\u00e9gislatives du 23 septembre \u00e9tait oppos\u00e9 \u00e0 Driss El Azami El Idrissi, pr\u00e9sident du groupe parlementaire du Parti de la justice et du d\u00e9veloppement. [lnt.ma]"}, {"borderWidth": 3, "fixed":         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {

                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
