l_16", "label": "Les directions provinciales de l\u2019\u00c9ducation\nnationale, du pr\u00e9scolaire et des...", "mass": 5, "physics": false, "shape": "box", "title": "Les directions provinciales de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports de la r\u00e9gion Tanger-T\u00e9touan-Al Hoceima ont annonc\u00e9, dimanche, la suspension temporaire des cours la semaine prochaine, en raison des perturbations climatiques attendues. [telquel.ma]\n-------------------------------------------------\nLa situation pourra \u00eatre r\u00e9\u00e9valu\u00e9e en fonction de l\u2019\u00e9volution des conditions m\u00e9t\u00e9orologiques, pr\u00e9cise la direction provinciale de l\u2019\u00c9ducation nationale de la pr\u00e9fecture de Tanger-Assilah. [www.lavieeco.com]\n-------------------------------------------------\nLes directions provinciales de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports des provinces de T\u00e9touan, Ouezzane et Al Hoce\u00efma ont annonc\u00e9, lundi, la prolongation de la suspension temporaire des cours jusqu\u2019au mercredi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Club Afrique D\u00e9veloppement (CAD),\ndu groupe Attijariwafa bank, et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Club Afrique D\u00e9veloppement (CAD), du groupe Attijariwafa bank, et l\u2019Union Gabonaise de Banque (UGB) ont tenu, r\u00e9cemment \u00e0 Libreville, 44e mission multisectorielle autour du th\u00e8me \u00ab Gabon, [www.challenge.ma]\n-------------------------------------------------\nSon Excellence Monsieur Le Vice-Pr\u00e9sident de la R\u00e9publique du Gabon, M. Alexandre BARRO CHAMBRIER a pr\u00e9sid\u00e9 ce jeudi 29 janvier la 44e mission multisectorielle du Club Afrique D\u00e9veloppement (CAD) du groupe Attijariwafa bank organis\u00e9e avec l\u2019Union Gabonaise de Banque (UGB) autour du th\u00e8me \u00ab Gabon, terre d\u2019opportunit\u00e9s \u00bb. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le Maroc a d\u00e9cid\u00e9 de\nsuspendre son projet de terminal...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a d\u00e9cid\u00e9 de suspendre son projet de terminal de gaz naturel liqu\u00e9fi\u00e9 (GNL) sur la fa\u00e7ade m\u00e9diterran\u00e9enne, un investissement estim\u00e9 \u00e0 pr\u00e8s d\u2019un milliard de dollars destin\u00e9 \u00e0 renforcer les importations \u00e9nerg\u00e9tiques et \u00e0 r\u00e9duire le recours \u00e0 des combustibles plus polluants. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre de la transition \u00e9nerg\u00e9tique annonce la suspension de la proc\u00e9dure d\u2019appel d\u2019offres relative au projet de terminal de gaz naturel liqu\u00e9fi\u00e9 (GNL) \u00e0 Nador West Med, et du r\u00e9seau de gazoducs. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de la Transition Energ\u00e9tique et du D\u00e9veloppement Durable (MTEDD) a annonc\u00e9 la suspension du projet de terminal de gaz naturel liqu\u00e9fi\u00e9 (GNL) de Nador West Med. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "\u00c0 l\u2019occasion de l\u2019\u00e9dition 2026\ndu salon Officine Expo \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019\u00e9dition 2026 du salon Officine Expo \u00e0 Marrakech, Sothema et la marque Naali ont sign\u00e9 un protocole d\u2019accord portant sur la commercialisation des produits Naali par le groupe pharmaceutique marocain. [www.yabiladi.com]\n-------------------------------------------------\nLe laboratoire pharmaceutique Sothema poursuit sa strat\u00e9gie de diversification th\u00e9rapeutique en int\u00e9grant \u00e0 son portefeuille des solutions innovantes d\u00e9velopp\u00e9es par la marque Naal. [lematin.ma]\n-------------------------------------------------\nSothema diversifie son offre th\u00e9rapeutique en int\u00e9grant les solutions innovantes \u00e0 base de safran de Naali. [www.lavieeco.com]\n-------------------------------------------------\nAu cours de l\u2019\u00e9dition 2026 du salon Officine Expo \u00e0 Marrakech, \u00e9v\u00e9nement de r\u00e9f\u00e9rence pour les acteurs du secteur pharmaceutique, Sothema et Naali ont sign\u00e9 un protocole d\u2019accord portant sur la commercialisation des produits Naali par Sothema. [leseco.ma]\n-------------------------------------------------\nSothema et Naali ont conclu un partenariat strat\u00e9gique visant \u00e0 \u00e9largir l\u2019offre th\u00e9rapeutique sur le march\u00e9 marocain et r\u00e9gional, \u00e0 l\u2019occasion de l\u2019\u00e9dition 2026 du salon Officine Expo, tenue \u00e0 Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Structure mus\u00e9ale Une convention de\npassation du Mus\u00e9e de la...", "mass": 5, "physics": false, "shape": "box", "title": "Structure mus\u00e9ale Une convention de passation du Mus\u00e9e de la photographie et des arts visuels de Casablanca \u00e0 la Fondation nationale des mus\u00e9es (FNM) a \u00e9t\u00e9 sign\u00e9e r\u00e9cemment au si\u00e8ge de la wilaya de la r\u00e9gion Casablanca-Settat, consacrant davantage le rayonnement culturel de la m\u00e9tropole. [aujourdhui.ma]\n-------------------------------------------------\nUne convention de passation du Mus\u00e9e de la photographie et des arts visuels de Casablanca \u00e0 la Fondation nationale des mus\u00e9es (FNM) a \u00e9t\u00e9 sign\u00e9e vendredi 30 janvier, au si\u00e8ge de la Wilaya de Casablanca-Settat, consacrant l\u2019ancrage culturel de la m\u00e9tropole. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Cette convention de partenariat s\u0027inscrit\ndans le cadre de la...", "mass": 5, "physics": false, "shape": "box", "title": "Cette convention de partenariat s\u0027inscrit dans le cadre de la mise en \u0153uvre des objectifs de la feuille de route 2022-2026 visant \u00e0 renforcer l\u0027int\u00e9gration des technologies num\u00e9riques dans le syst\u00e8me \u00e9ducatif et \u00e0 encourager l\u2019innovation. [www.lavieeco.com]\n-------------------------------------------------\nUn nouvel avenant de la convention de partenariat entre le minist\u00e8re de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports et la soci\u00e9t\u00e9 \u00ab Samsung Electronics Maghreb Arabe \u00bb a \u00e9t\u00e9 sign\u00e9, lundi, \u00e0 Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le lat\u00e9ral droit du PSG,\nAchraf Hakimi, sera suspendu pour...", "mass": 5, "physics": false, "shape": "box", "title": "Le lat\u00e9ral droit du PSG, Achraf Hakimi, sera suspendu pour le sommet de Ligue 1 dimanche prochain face \u00e0 l\u2019OM, suite \u00e0 son expulsion pour faute \u00e0 la 75e minute du match disput\u00e9 ce week-end contre Strasbourg (1-2). [maroc-diplomatique.net]\n-------------------------------------------------\nLe lat\u00e9ral droit du PSG, Achraf Hakimi, sera suspendu pour le sommet de Ligue 1 dimanche prochain face \u00e0 l\u0027OM, suite \u00e0 son expulsion pour faute \u00e0 la 75e minute du match disput\u00e9 ce week-end contre Strasbourg (1-2). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Merck, leader en sciences et\ntechnologies, et son partenaire au...", "mass": 5, "physics": false, "shape": "box", "title": "Merck, leader en sciences et technologies, et son partenaire au Maroc, Cooper Pharma, annoncent le lancement d\u2019une collaboration strat\u00e9gique avec la Fondation Lalla Salma pour la pr\u00e9vention et la lutte contre le cancer colorectal et le cancer de la t\u00eate et du cou. [maroc-diplomatique.net]\n-------------------------------------------------\nUn partenariat strat\u00e9gique a \u00e9t\u00e9 annonc\u00e9 \u00e0 Rabat entre Merck, son partenaire marocain Cooper Pharma et la Fondation Lalla Salma, en vue de renforcer l\u2019acc\u00e8s aux th\u00e9rapies innovantes contre le cancer colorectal ainsi que les cancers de la t\u00eate et du cou. [lnt.ma]\n-------------------------------------------------\nTh\u00e9rapies innovantes : Merck et Cooper Pharma au Maroc, en collaboration avec la Fondation Lalla Salma, s\u2019associent pour renforcer l\u2019acc\u00e8s aux th\u00e9rapies innovantes contre le cancer colorectal et le cancer de la t\u00eate et du cou. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "L\u2019association Casamemoire, engag\u00e9e depuis plus\nde trente ans dans la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019association Casamemoire, engag\u00e9e depuis plus de trente ans dans la sauvegarde et la valorisation du patrimoine architectural, urbain et culturel du XX\u1d49 si\u00e8cle au Maroc, a tenu son assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e0 Casablanca. [lnt.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue de cette rencontre, un nouveau bureau ex\u00e9cutif a \u00e9t\u00e9 \u00e9lu pour accompagner l\u2019asso. [lematin.ma]\n-------------------------------------------------\nL\u2019association Casam\u00e9moire a renouvel\u00e9 son bureau ex\u00e9cutif \u00e0 Casablanca, reconduisant Karim Rouissi \u00e0 la pr\u00e9sidence. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "Les autorit\u00e9s de la province\nde T\u00e9touan ont, depuis ce...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s de la province de T\u00e9touan ont, depuis ce lundi, entrepris une s\u00e9rie de mesures proactives et d\u00e9ploy\u00e9 des efforts intensifs sur le terrain, afin de faire face aux perturbations m\u00e9t\u00e9orologiques pr\u00e9vues dans les prochains jours. [telquel.ma]\n-------------------------------------------------\nLes autorit\u00e9s provinciales de T\u00e9touan commencent, ce mardi 3 f\u00e9vrier, \u00e0 \u00e9vacuer les habitants des zones menac\u00e9es par les inondations vers des abris, en pr\u00e9vision des perturbations m\u00e9t\u00e9orologiques attendues d\u00e8s le lendemain. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "L\u2019avant-centre marocain Yassir Zabiri, champion\ndu monde U20 avec les...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019avant-centre marocain Yassir Zabiri, champion du monde U20 avec les Lionceaux de l\u2019Atlas, s\u2019est engag\u00e9 avec le Stade Rennais jusqu\u2019en 2029, en provenance du club portugais du FC Famalicao, a annonc\u00e9 le club fran\u00e7ais de Ligue 1. [telquel.ma]\n-------------------------------------------------\nL\u2019avant-centre marocain Yassir Zabiri, champion du monde U20 avec les Lionceaux de l\u2019Atlas, s\u2019est engag\u00e9 avec le Stade Rennais jusqu\u2019en 2029 en provenance du club portugais du FC Famalicao, a annonc\u00e9 le club fran\u00e7ais de Ligue 1. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Les r\u00e9centes pr\u00e9cipitations ont insuffl\u00e9\nune nouvelle dynamique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9centes pr\u00e9cipitations ont insuffl\u00e9 une nouvelle dynamique \u00e0 la campagne agricole dans la r\u00e9gion de Casablanca-Settat, o\u00f9 la superficie sem\u00e9e en c\u00e9r\u00e9ales d\u2019automne a atteint 825.953 hectares [www.challenge.ma]\n-------------------------------------------------\nInd\u00e9niablement, les r\u00e9centes pr\u00e9cipitations ont insuffl\u00e9 une nouvelle dynamique \u00e0 la campagne agricole dans la r\u00e9gion de Casablanca-Settat o\u00f9 la superficie sem\u00e9e en c\u00e9r\u00e9ales d\u2019automne a atteint 825.953 hectares \u00e0 la date du 2 f\u00e9vrier courant, soit environ 94 % de la superficie pr\u00e9vue. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le taux de ch\u00f4mage s\u2019est\nsitu\u00e9 \u00e0 13% en 2025,...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de ch\u00f4mage s\u2019est situ\u00e9 \u00e0 13% en 2025, en diminution de 0,3% par rapport \u00e0 2024, selon le Haut-Commissariat au plan (HCP). [www.yabiladi.com]\n-------------------------------------------------\nLe taux de ch\u00f4mage est en diminution de 0,3 point par rapport \u00e0 2024, selon le Haut-Commissariat au plan (HCP). [www.lavieeco.com]\n-------------------------------------------------\nL\u2019\u00e9conomie nationale a cr\u00e9\u00e9 193.000 postes d\u2019emploi entre l\u2019ann\u00e9e 2024 et celle de 2025, ressort-il d\u2019une note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 la situation du march\u00e9 du travail en 2025. [maroc-diplomatique.net]\n-------------------------------------------------\nLe taux de ch\u00f4mage s\u2019est situ\u00e9 \u00e0 13% en 2025, en diminution de 0,3 point comparativement \u00e0 une ann\u00e9e auparavant, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\n     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

                    barnesHut: {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
