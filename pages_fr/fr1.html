-\nLe gouvernement britannique a r\u00e9affirm\u00e9, jeudi, son soutien au plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc comme base la plus cr\u00e9dible, viable et pragmatique pour une solution durable au conflit cr\u00e9\u00e9 autour du Sahara marocain. [www.yabiladi.com]\n-------------------------------------------------\nLe gouvernement britannique a r\u00e9affirm\u00e9, jeudi, son soutien au plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc comme base la plus cr\u00e9dible, viable et pragmatique pour une solution durable au conflit cr\u00e9\u00e9 autour du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises\ndu Maroc (CGEM) a tenu...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu une rencontre avec le directeur g\u00e9n\u00e9ral de la Caisse nationale de s\u00e9curit\u00e9 sociale (CNSS), Hassan Boubrik, autour d. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu, jeudi \u00e0 Casablanca, en pr\u00e9sence du directeur g\u00e9n\u00e9ral de la Caisse nationale de s\u00e9curit\u00e9 sociale (CNSS), Hassan Boubrik, une rencontre d\u00e9di\u00e9e \u00e0 la relation entre la Caisse et les entreprises, ainsi qu\u0027aux enjeux et transformations engag\u00e9es dans le cadre de la g\u00e9n\u00e9ralisation de la protection sociale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "BMCE Capital a annonc\u00e9 le\nlancement de CAP\u2019AI Reverse by...", "mass": 5, "physics": false, "shape": "box", "title": "BMCE Capital a annonc\u00e9 le lancement de CAP\u2019AI Reverse by BK, cinqui\u00e8me \u                                 scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
