 "shape": "box", "title": "Lors de son entretien, \u00e0 Rabat, avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, le ministre des Relati. [lematin.ma]\n-------------------------------------------------\nLors de son entretien, \u00e0 Rabat, avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, le ministre des Relations ext\u00e9rieures de la R\u00e9publique. [telquel.ma]\n-------------------------------------------------\nLe Maroc et le Paraguay sont anim\u00e9s d\u0027une volont\u00e9 claire et responsable d\u2019intensifier leur partenariat strat\u00e9gique, dans le cadre d\u2019une vision fond\u00e9e sur le respect des engagements et la fid\u00e9lit\u00e9 aux principes, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Paraguay a mat\u00e9rialis\u00e9, mercredi, sa reconnaissance de la souverainet\u00e9 marocaine sur le Sahara par l\u2019annonce de l\u2019ouverture d\u2019un Consulat G\u00e9n\u00e9ral. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Les groupes Sanofi et Marbio\nont officialis\u00e9 un partenariat industriel...", "mass": 5, "physics": false, "shape": "box", "title": "Les groupes Sanofi et Marbio ont officialis\u00e9 un partenariat industriel et strat\u00e9gique majeur visant \u00e0 produire localement plusieurs vaccins au Maroc. [lematin.ma]\n-------------------------------------------------\nSanofi et Marbio ont annonc\u00e9, ce mardi 28 octobre dans un communiqu\u00e9, la ratification d\u2019un partenariat industriel portant sur la fabrication et fourniture locale de vaccins Sanofi au Maroc. [telquel.ma]\n-------------------------------------------------\nSanofi et Marbio annoncent la ratification d\u2019un partenariat industriel et strat\u00e9gique portant sur la fabrication et fourniture locale de vaccins Sanofi au Maroc. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le jury de la 23\u1d49\n\u00e9dition du Grand Prix national...", "mass": 5, "physics": false, "shape": "box", "title": "Le jury de la 23\u1d49 \u00e9dition du Grand Prix national de la presse a \u00e9t\u00e9 install\u00e9 mardi \u00e0 Rabat lors d\u2019une r\u00e9union pr\u00e9sid\u00e9e par le ministre de la Jeunesse, de la Culture et de la Commun. [lematin.ma]\n-------------------------------------------------\nLe jury de la 23e \u00e9dition du Grand Prix national de la presse au titre de l\u2019ann\u00e9e 2025 a \u00e9t\u00e9 install\u00e9, mardi \u00e0 Rabat, lors d\u2019une r\u00e9union pr\u00e9sid\u00e9e par le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La phase de conception et\nd\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration...", "mass": 5, "physics": false, "shape": "box", "title": "La phase de conception et d\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 commencera d\u00e8s la semaine prochaine, \u00e0 travers le lancement de larges concertations au niveau des 75 provinces du Royaume, a annonc\u00e9, mercredi, le wali, directeur g\u00e9n\u00e9ral des Collectivit\u00e9s territoriales au minist\u00e8re de l\u2019int\u00e9rieur, Jelloul Samsseme. [www.lopinion.ma]\n-------------------------------------------------\nLa phase de conception et d\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 commencera d\u00e8s la semaine prochaine, \u00e0 travers le lancement de larges concertations au niveau des 75 provinces du Maroc, a annonc\u00e9, mercredi, le wali, directeur g\u00e9n\u00e9ral des collectivit\u00e9s territoriales au minist\u00e8re de l\u2019Int\u00e9rieur, Jelloul Samsseme. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Une convention de partenariat a\n\u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention de partenariat a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, entre la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) et le Groupement fran\u00e7ais d\u0027assureurs \"Argos\", portant sur le renforcement et le d\u00e9veloppement de la coop\u00e9ration et l\u2019assistance technique pour faciliter les op\u00e9rations de recherche, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [www.lopinion.ma]\n-------------------------------------------------\nCette convention pr\u00e9voit la mise en place de points focaux et de canaux officiels de communication afin de faciliter les op\u00e9rations de coordination entre les deux parties en mati\u00e8re de recherche, d\u2019identification, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules vol\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nUne convention de partenariat a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, entre la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) et le Groupement fran\u00e7ais d\u2019assureurs \u00ab Argos \u00bb, portant sur le renforcement et le d\u00e9veloppement de la coop\u00e9ration et l\u2019assistance technique pour faciliter les op\u00e9rations de recherche, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [atlasinfo.fr]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) et le groupement des compagnies d\u2019assurance fran\u00e7aises ARGOS ont sign\u00e9, mercredi \u00e0 Rabat, un accord de partenariat portant sur le renforcement de la coop\u00e9ration et du soutien technique afin de faciliter les op\u00e9rations de recherche, de suivi et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Visiativ Africa, qui op\u00e8re dans\nla transformation num\u00e9rique au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Visiativ Africa, qui op\u00e8re dans la transformation num\u00e9rique au Maroc et en Afrique depuis pr\u00e8s de 15 ans, devient NEONOVIA. [www.lopinion.ma]\n-------------------------------------------------\nVisiativ Africa, la filiale historique du groupe fran\u00e7ais Visiativ, est d\u00e9sormais NEONOVIA, une entreprise technologique marocaine ind\u00e9pendante d\u00e9di\u00e9e \u00e0 lacc\u00e9l\u00e9ration de la transformation num\u00e9rique dans les secteurs public et priv\u00e9 au Maroc et en Afrique. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019entreprise se repositionne comme un acteur marocain ind\u00e9pendant sp\u00e9cialis\u00e9 dans la transformation digitale des organisations publiques et priv\u00e9es, tout en poursuivant sa collaboration avec le Groupe Visiativ sur le march\u00e9 africain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le programme Forsa a g\u00e9n\u00e9r\u00e9\n1,6 milliard de dirhams (MMDH)...", "mass": 5, "physics": false, "shape": "box", "title": "Le programme Forsa a g\u00e9n\u00e9r\u00e9 1,6 milliard de dirhams (MMDH) de chiffre d\u2019affaires et 21.000 emplois \u00e0 travers le Royaume, a annonc\u00e9, mercredi, le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [telquel.ma]\n-------------------------------------------------\n\u00c0 ce jour, 16 600 projets sont op\u00e9rationnels \u00e0 travers le Royaume, g\u00e9n\u00e9rant un chiffre d\u2019affaires annuel estim\u00e9 \u00e0 1,6 milliard de dirhams et pr\u00e8s de 21 000 emplois. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019Office national des a\u00e9roports (ONDA)\ndevrait r\u00e9aliser un chiffre d\u2019affaires...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des a\u00e9roports (ONDA) devrait r\u00e9aliser un chiffre d\u2019affaires (CA) de plus de 6,4 milliards de dirhams (MMDH) en 2026, r\u00e9v\u00e8le le rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de l\u2019ann\u00e9e prochaine. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des A\u00e9roports (ONDA) devrait r\u00e9aliser un chiffre d\u2019affaires (CA) de plus de 6,4 milliards de dirhams (MMDH) en 2026, r\u00e9v\u00e8le le rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de l\u2019ann\u00e9e prochaine. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) et le Maroc ont...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) et le Maroc ont confirm\u00e9 les stades et le calendrier du tournoi intercontinental des qualifications africaines pour la Coupe du Monde 2026. [telquel.ma]\n-------------------------------------------------\nLe tournoi intercontinental des qualifications africaines pour la Coupe du monde de la FIFA 2026 se d\u00e9roulera du 13 au 16 novembre 2025 \u00e0 Rabat, a annonc\u00e9 la Conf\u00e9d\u00e9ration africaine de football (CAF). [www.yabiladi.com]\n-------------------------------------------------\nLe tournoi intercontinental des qualifications africaines pour la Coupe du Monde de la FIFA 2026 se d\u00e9roulera du 13 au 16 novembre 2025 \u00e0 Rabat, a annonc\u00e9 la Conf\u00e9d\u00e9ration Africaine de Football (CAF). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le chef du gouvernement Aziz\nAkhannouch a re\u00e7u, mercredi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement Aziz Akhannouch a re\u00e7u, mercredi \u00e0 Rabat, Fran\u00e7ois Provost, directeur ex\u00e9cutif du Groupe Renault, en pr\u00e9sence de Ryad Mezzour, ministre de l\u2019Industrie et du Commerce. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement a re\u00e7u, ce 29 octobre \u00e0 Rabat, Fran\u00e7ois Provost, directeur ex\u00e9cutif du groupe Renault. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [atlasinfo.fr]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [www.lereporter.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u le 29 octobre 2025 \u00e0 Rabat Fran\u00e7ois Provost, Directeur ex\u00e9cutif du Groupe Renault, pour discuter du d\u00e9veloppement de l\u2019industrie automobile marocaine, d\u00e9sormais moteur de croissance industrielle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La police nationale espagnole a\nannonc\u00e9, mercredi, le d\u00e9mant\u00e8lement de...", "mass": 5, "physics": false, "shape": "box", "title": "La police nationale espagnole a annonc\u00e9, mercredi, le d\u00e9mant\u00e8lement de deux organisations criminelles internationales sp\u00e9cialis\u00e9es dans le trafic de hachich, dans le cadre d\u2019une op\u00e9ration conjointe men\u00e9e en collaboration avec la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, men\u00e9e en coordination aussi avec le Parquet de la Cour d\u2019appel de Tanger, a permis la saisie de 20 tonnes de hachich dissimul\u00e9es dans des cargaisons de poivrons \u00e0 bord de camions frigorifiques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Dans le cadre de sa\ndynamique de d\u00e9veloppement, l\u2019Universit\u00e9 Internationale...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de sa dynamique de d\u00e9veloppement, l\u2019Universit\u00e9 Internationale de Rabat (UIR) annonce la nomination du Professeur Mohamed TOZY au poste de Doyen du Coll\u00e8ge des Sciences Sociales. [telquel.ma]\n-------------------------------------------------\nLUniversit\u00e9 Internationale de Rabat (UIR) a nomm\u00e9 le professeur Mohamed Tozy au poste de doyen de la Facult\u00e9 des Sciences Sociales, marquant ainsi une \u00e9tape cl\u00e9 dans le d\u00e9veloppement acad\u00e9mique de l\u00e9tablissement. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Les investissements du groupe OCP\ndevraient atteindre 53 milliards de...", "mass": 5, "physics": false, "shape": "box", "title": "Les investissements du groupe OCP devraient atteindre 53 milliards de dirhams (MMDH) au terme de l\u2019ann\u00e9e 2025, port\u00e9s par plusieurs grands projets, dont le d\u00e9veloppement de nouvelles capacit\u00e9s de production d\u2019engrais, ressort-il du rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de 2026. [telquel.ma]\n-------------------------------------------------\nLes investissements du groupe OCP devraient atteindre 53 milliards de dirhams (MMDH) \u00e0 fin 2025, port\u00e9s par plusieurs chantiers majeurs, notamment l\u2019extension des capacit\u00e9s de production d\u2019engrais, selon le rapport sur les \u00e9tablissements et entreprises publics accompagnant le projet de loi de finances 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les jugements et d\u00e9cisions relatifs\naux actes de violence et...", "mass": 5, "physics": false, "shape": "box", "title": "Les jugements et d\u00e9cisions relatifs aux actes de violence et de destruction ayant \u00e9maill\u00e9 les manifestations non autoris\u00e9es ont \u00e9t\u00e9 rendus dans un d\u00e9lai raisonnable en tenant compte de la situation p\u00e9nale des accus\u00e9s, sans aucune pr\u00e9cipitation, contrairement \u00e0 ce que certains pr\u00e9tendent, a affirm\u00e9 Hassan Farhan, magistrat \u00e0 la pr\u00e9sidence du Minist\u00e8re public. [telquel.ma]\n-------------------------------------------------\nLes jugements et d\u00e9cisions relatifs aux actes de violence et de destruction ayant \u00e9maill\u00e9 les manifestations non autoris\u00e9es ont \u00e9t\u00e9 rendus dans un d\u00e9lai raisonnable en tenant compte de la situation p\u00e9nale des accus\u00e9s, sans aucune pr\u00e9cipitation, contrairement \u00e0 ce que certains pr\u00e9tendent, a affirm\u00e9 Hassan Farhan, magistrat \u00e0 la Pr\u00e9sidence du Minist\u00e8re Public. [www.lavieeco.com]\n-------------------------------------------------\nLes d\u00e9cisions judiciaires relatives aux actes de violence et de destruction enregistr\u00e9s lors des manifestations non autoris\u00e9es de fin septembre ont \u00e9t\u00e9 rendues dans des d\u00e9lais jug\u00e9s raisonnables, tout en respectant les garanties d\u2019un proc\u00e8s \u00e9quitable, a indiqu\u00e9 Hassan Farhan, magistrat \u00e0 la Pr\u00e9sidence du minist\u00e8re public. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019\u00e9quipe nationale f\u00e9minine des moins\nde 17 ans s\u2019est inclin\u00e9e,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale f\u00e9minine des moins de 17 ans s\u2019est inclin\u00e9e, mardi \u00e0 Rabat, face \u00e0 son homologue nord-cor\u00e9enne, sur le score sans appel de 6 buts \u00e0 1, dans le cadre des huiti\u00e8mes de finale de la Coupe du monde f\u00e9minine U17, qui se tient au Maroc jusqu\u2019au 8 novembre. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale f\u00e9minine des moins de 17 ans s\u2019est inclin\u00e9e, mardi \u00e0 Rabat, face \u00e0 son homologue nord-cor\u00e9enne, sur le score sans appel de 6 buts \u00e0 1, dans le cadre des huiti\u00e8mes de finale de la Coupe du monde f\u00e9minine U17, qui se tient au Maroc jusqu\u2019au 8 novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le nombre total de mosqu\u00e9es\nen milieu rural s\u2019\u00e9l\u00e8ve \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre total de mosqu\u00e9es en milieu rural s\u2019\u00e9l\u00e8ve \u00e0 37.766, contre 14.336 en zones urbaines, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq. [telquel.ma]\n-------------------------------------------------\nR\u00e9pondant \u00e0 une question orale \u00e0 la Chambre des Conseillers, le ministre des Habous et des affaires islamiques, Mohamed Toufiq, a indiqu\u00e9 \u00e9galement qu\u2019un budget de l\u2019ordre de 296 millions de dirhams est allou\u00e9 \u00e0 la construction de mosqu\u00e9es dans le milieu rural au titre de l\u2019ann\u00e9e en cours. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La secr\u00e9taire d\u2019Etat charg\u00e9e de\nla P\u00eache maritime, Zakia Driouich,...", "mass": 5, "physics": false, "shape": "box", "title": "La secr\u00e9taire d\u2019Etat charg\u00e9e de la P\u00eache maritime, Zakia Driouich, a affirm\u00e9, mardi \u00e0 la Chambre des Conseillers, que les mesures prises par le gouvernement pour rem\u00e9dier \u00e0 la probl\u00e9matique de la hausse des prix du poisson devraient permettre de maintenir la stabilit\u00e9 des prix \u00e0 des niveaux raisonnables. [telquel.ma]\n-------------------------------------------------\nZakia Dirouich a pr\u00e9sent\u00e9, au Parlement, les actions men\u00e9es par le Gouvernement pour contenir la hausse du prix du poisson, en mati\u00e8re de r\u00e9duction le nombre d\u0027interm\u00e9diaires et de renforcement du r\u00e9seau des march\u00e9s de gros de vente. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les moyens de renforcer la\ncoop\u00e9ration entre le Maroc et...", "mass": 5, "physics": false, "shape": "box", "title": "Les moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00e9t\u00e9 au centre d\u2019entretiens, mardi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et l\u2019Ambassadeur du Royaume-Uni au Maroc, Alex Pinfield. [telquel.ma]\n-------------------------------------------------\nLes moyens de consolider la coop\u00e9ration bilat\u00e9rale dans les domaines du transport ferroviaire et a\u00e9rien et des infrastructures, ont \u00e9t\u00e9 au centre d\u2019entretiens, mercredi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et le ministre paraguayen des Relations ext\u00e9rieures, Rub\u00e9n Ram\u00edrez Lezcano. [atlasinfo.fr]\n-------------------------------------------------\nLes moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00e9t\u00e9 au centre d\u2019entretiens, mardi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et l\u2019Ambassadeur du Royaume\u2013Uni au Maroc, Alex Pinfield. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies\npar la Direction g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour mardi 28 octobre 2025: \u201 <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
