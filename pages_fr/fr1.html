tre roumain, Luca-Alexandru Nicolescu, consacr\u00e9 aux perspectives de renforcement de la coop\u00e9ration bilat\u00e9rale entre les deux pays. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Un partenariat de bancassurance de\nlong terme avec Saham Bank...", "mass": 5, "physics": false, "shape": "box", "title": "Un partenariat de bancassurance de long terme avec Saham Bank accompagne la transaction, dont la r\u00e9alisation reste suspendue au feu vert du r\u00e9gulateur. [fr.hespress.com]\n-------------------------------------------------\nWafa Assurance poursuit son d\u00e9veloppement sur le march\u00e9 de l\u2019assurance-vie avec la signature d\u2019un accord aupr\u00e8s du groupe Saham en vue d\u2019acqu\u00e9rir 99,98% du capital de La Marocaine. [lematin.ma]\n-------------------------------------------------\nWafa Assurance a sign\u00e9 un accord en vue de mettre la main sur 99,98% du capital de La Marocaine Vie. [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, qui reste soumise aux autorisations r\u00e9glementaires, s\u0027accompagne d\u0027un partenariat de bancassurance de long terme entre Wafa Assurance et Saham Bank. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi, le projet de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi, le projet de d\u00e9cret N\u00b02.26.838 modifiant le d\u00e9cret N\u00b02.23.1067 du Joumada I 1445 H (1er d\u00e9cembre 2023) portant application de la loi N\u00b058.23 relative au r\u00e9gime des aides sociales directes. [fr.hespress.com]\n-------------------------------------------------\nCe projet de d\u00e9cret vise \u00e0 revaloriser le montant de l\u2019aide forfaitaire, dont le seuil minimum passera de 500 \u00e0 600 DH \u00e0 compter du 1er janvier 2027, a affirm\u00e9 le ministre de l\u2019Am\u00e9nagement du Territoire national,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Conseil de gouvernement a\napprouv\u00e9, jeudi, le projet de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9, jeudi, le projet de loi n\u00b006.25 portant transformation de l\u2019Office national des a\u00e9roports (ONDA) en soci\u00e9t\u00e9 anonyme.Ce projet de loi s\u2019appuie. [lematin.ma]\n-------------------------------------------------\nCe projet de loi s\u2019appuie sur les dispositions de la loi-cadre n\u00b050.21 relative \u00e0 la r\u00e9forme des \u00e9tablissements et entreprises publics (EEP), en prenant en consid\u00e9ration les dispositions de la loi n\u00b082.20 portant. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Battus par l\u2019Argentine en demi-finale\ndu tournoi olympique de la...", "mass": 5, "physics": false, "shape": "box", "title": "Battus par l\u2019Argentine en demi-finale du tournoi olympique de la jeunesse \u00e0 Dakar, les Lionceaux de l\u2019Atlas ont su r\u00e9pondre pr\u00e9sent dans ce rendez-vous d\u00e9cisif face \u00e0 l\u2019Afghanistan. [lematin.ma]\n-------------------------------------------------\nElle a battu l\u2019Afghanistan 2-1 lors du match pour la troisi\u00e8me place, et termine ainsi sur le podium apr\u00e8s sa d\u00e9faite en demi-finale. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, jeudi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) n\u00b060.. [lematin.ma]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, jeudi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) n\u00b060.26 pour l\u2019ann\u00e9e budg\u00e9taire 2027. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le long-m\u00e9trage Fez Summer 55,\nr\u00e9alis\u00e9 par Abdelha\u00ef Laraki et...", "mass": 5, "physics": false, "shape": "box", "title": "Le long-m\u00e9trage Fez Summer 55, r\u00e9alis\u00e9 par Abdelha\u00ef Laraki et produit par Caroline Locardi (A2L Production), a re\u00e7u deux distinctions le 10 novembre 2026, lors de la 7e \u00e9dition du Festival de film de Matera, en Italie : le Prix du film et le Prix de la production Focus M\u00e9diterran\u00e9e. [telquel.ma]\n-------------------------------------------------\nProduit par Caroline Locardi, d\u2019A2L Production, le long m\u00e9trage a \u00e9t\u00e9 distingu\u00e9 pour le film et sa production dans la section Focus M\u00e9diterran\u00e9e, selon un communiqu\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Une actrice oscaris\u00e9e, huit personnalit\u00e9s\ndu cin\u00e9ma international et quatorze...", "mass": 5, "physics": false, "shape": "box", "title": "Une actrice oscaris\u00e9e, huit personnalit\u00e9s du cin\u00e9ma international et quatorze films en qu\u00eate de l\u2019\u00c9toile d\u2019or : le Festival International du Film de Marrakech a d\u00e9voil\u00e9 le jury de sa 23\u1d49 \u00e9             }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
