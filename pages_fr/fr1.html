a]\n-------------------------------------------------\nLes compagnies maritimes Morocco Africa Link (AML) et Balearia ont suspendu les d\u00e9parts sur cette ligne \u00e0 partir de 08h00, selon les informations publi\u00e9es sur le portail destin\u00e9 aux passagers de l\u2019Autorit\u00e9 portuaire. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Cette r\u00e9union a \u00e9t\u00e9 consacr\u00e9e\nnotamment \u00e0 la pr\u00e9sentation du...", "mass": 5, "physics": false, "shape": "box", "title": "Cette r\u00e9union a \u00e9t\u00e9 consacr\u00e9e notamment \u00e0 la pr\u00e9sentation du projet de Rapport moral 2025, \u00e0 la proposition d\u0027arr\u00eat\u00e9 des comptes 2025, \u00e0 la validation de la date et de l\u0027or. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu, jeudi \u00e0 Casablanca, sa r\u00e9union du Conseil d\u2019administration, sous la pr\u00e9sidence de Chakib Alj. [telquel.ma]\n-------------------------------------------------\nLe calendrier relatif aux prochaines \u00e9lections de la pr\u00e9sidence nationale de la CGEM pour le mandat 2026-2029 a \u00e9t\u00e9 approuv\u00e9 ce jeudi lors de la r\u00e9union du conseil d\u2019administration de la conf\u00e9d\u00e9ration patronale. [www.lavieeco.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu, ce jeudi \u00e0 Casablanca, sa r\u00e9union du Conseil d\u0027administration, sous la pr\u00e9sidence de Chakib Alj. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Selon la note de conjoncture\ndu HCP, les industriels et...", "mass": 5, "physics": false, "shape": "box", "title": "Selon la note de conjoncture du HCP, les industriels et les op\u00e9rateurs du b\u00e2timent pr\u00e9voient globalement une progression de la production et de l\u2019emploi au premier trimestre 2026.. [lematin.ma]\n-------------------------------------------------\nCette \u00e9volution serait principalement attribuable, d\u2019une part, \u00e0 une hausse de l\u2019activit\u00e9 dans les branches de l\u2019\u00abIndustrie alimentaire\u00bb, de l\u2019\u00abIndustrie chimique\u00bb et de la \u00abFabrication de produits m\u00e9talliques, \u00e0 l\u2019exception des machines. [telquel.ma]\n-------------------------------------------------\nLes entreprises de l\u0027industrie manufacturi\u00e8re anticipent une augmentation de leur niveau de production au premier trimestre 2026, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat, a approuv\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a approuv\u00e9 un d\u00e9cret portant cr\u00e9ation des zones franches d\u2019exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret portant cr\u00e9ation des zones franches d\u0027exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Botola n\u2019a m\u00eame pas\nfini sa 14e journ\u00e9e que,...", "mass": 5, "physics": false, "shape": "box", "title": "La Botola n\u2019a m\u00eame pas fini sa 14e journ\u00e9e que, d\u00e9j\u00e0, elle a trouv\u00e9 sa constante : l\u2019arb opinion publique inform\u00e9e de toute \u00e9volution y aff\u00e9rente, selon l\u2019\u00e9volution de la conjoncture mondiale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nd\u00e9menti de mani\u00e8re cat\u00e9gorique les...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9menti de mani\u00e8re cat\u00e9gorique les fausses informations relay\u00e9es sur des r\u00e9seaux sociaux et plusieurs sites \u00e9lectroniques portant sur une pr\u00e9tendue note adress\u00e9e aux \u00e9tablissements scolaires, en relation avec un soi-disant \u00ab ph\u00e9nom\u00e8ne d\u2019enl\u00e8vement d\u2019enfants \u00bb. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9menti de mani\u00e8re cat\u00e9gorique les fausses informations relay\u00e9es sur des r\u00e9seaux sociaux et plusieurs sites \u00e9lectroniques portant sur une pr\u00e9tendue note adress\u00e9e aux \u00e9tablissements scolaires, en relation avec un soi-disant \u00ab ph\u00e9nom\u00e8ne d\u2019enl\u00e8vement d\u2019enfants \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Dans un communiqu\u00e9 publi\u00e9 jeudi,\nla Conf\u00e9d\u00e9ration africaine de football...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9 publi\u00e9 jeudi, la Conf\u00e9d\u00e9ration africaine de football (CAF) annonce que la comp\u00e9tition, initialement pr\u00e9vue du 17 mars au 3 avril 2026, se d\u00e9roulera finalement du 25 juillet au 16 ao\u00fbt 2026. [telquel.ma]\n-------------------------------------------------\nMohamed Ouahbi a \u00e9t\u00e9 nomm\u00e9 nouveau s\u00e9lectionneur de l\u0027\u00e9quipe nationale du Maroc du football, succ\u00e9dant \u00e0 Walid Regragui, a annonc\u00e9, jeudi soir, le pr\u00e9sident de la F\u00e9d\u00e9ration Royale marocaine de football (FRMF), Fouzi Lekja\u00e2. [www.lavieeco.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9, ce jeudi, la reprogrammation des dates de la Coupe d\u2019Afrique des Nations f\u00e9minine du 25 juillet au 16 ao\u00fbt. [leseco.ma]\n-------------------------------------------------\nLa Coupe d\u2019Afrique des nations f\u00e9minine 2026, que le Maroc doit accueillir, a \u00e9t\u00e9 officiellement report\u00e9e \u00e0 l\u2019\u00e9t\u00e9 prochain par la Conf\u00e9d\u00e9ration africaine de football (CAF), selon plusieurs m\u00e9dias marocains. [lnt.ma]\n-------------------------------------------------\nDans le cadre du Projet Stadia d\u2019INTERPOL, l\u2019entreprise de cybers\u00e9curit\u00e9 Kaspersky a collabor\u00e9 avec l\u2019organisation internationale afin de surveiller et pr\u00e9venir les menaces num\u00e9riques . [fr.hespress.com]\n-------------------------------------------------\nLe football marocain ouvre une nouvelle page avec la nomination de Mohamed Ouahbi \u00e0 la t\u00eate de la s\u00e9lection nationale A. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "C\u2019est ce qu\u2019a d\u00e9clar\u00e9, ce\njeudi 5 mars, le ministre...", "mass": 5, "physics": false, "shape": "box", "title": "C\u2019est ce qu\u2019a d\u00e9clar\u00e9, ce jeudi 5 mars, le ministre charg\u00e9 des Relations avec le Parlement et la soci\u00e9t\u00e9 civile, porte-parole du gouvernement. [telquel.ma]\n-------------------------------------------------\nQuelque 15.000 familles touch\u00e9es par les r\u00e9centes inondations dans le nord et l\u2019ouest du Maroc ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe de 6.000 dirhams chacune. [www.yabiladi.com]\n-------------------------------------------------\nLe projet de d\u00e9cret relatif au Statut des cr\u00e8ches priv\u00e9es, approuv\u00e9 jeudi \u00e0 Rabat en Conseil de gouvernement, vise \u00e0 apporter des r\u00e9ponses \u00e0 une s\u00e9rie de probl\u00e9matiques \u00e0 travers la mise en place de plusieurs mesures techniques, a affirm\u00e9 le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]\n-------------------------------------------------\nLors du point de presse tenu jeudi \u00e0 l\u2019issue de la r\u00e9union du Conseil de gouvernement, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Faouzi Lekja\u00e2, a indiqu\u00e9 que pr\u00e8s de 15.000 familles ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe dans le cadre du programme mis en place pour soutenir et accompagner les populations affect\u00e9es par les r\u00e9centes inondations au Maroc. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019embrasement r\u00e9gional au Moyen-Orient, qui\na suscit\u00e9 de la part...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019embrasement r\u00e9gional au Moyen-Orient, qui a suscit\u00e9 de la part du Royaume une r\u00e9action imm\u00e9diate et sans ambages, condamnant les attaques iraniennes, pourrait \u00e0 terme impacter l\u2019\u00e9conomie nationale, jusque-l\u00e0 entour\u00e9e de bonnes perspectives. [www.lavieeco.com]\n-------------------------------------------------\nLe blocus du d\u00e9troit d\u2019Ormuz, par lequel transite un cinqui\u00e8me de la consommation mondiale de p\u00e9trole, fait planer le risque d\u2019une r\u00e9cession mondiale induite par l\u2019envol\u00e9e des prix de l\u2019\u00e9nergie. [leseco.ma]\n-------------------------------------------------\nLa stabilit\u00e9 financi\u00e8re \u00ab n\u2019est pas en risque \u00bb en France, a assur\u00e9 jeudi la banque centrale qui affirme suivre \u00ab avec une tr\u00e8s grande attention les d\u00e9veloppements sur les prix de l\u2019\u00e9nergie et sur les march\u00e9s financiers \u00bb alors que la guerre au Moyen-Orient entrait dans son 6\u00e8me jour. [atlasinfo.fr]\n-------------------------------------------------\nPlusieurs analystes estiment que le tourisme international pourrait ralentir en 2026, notamment dans certaines r\u00e9gions d\u2019Afrique et du Moyen-Orient. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Maroc cherche \u00e0 s\u2019ancrer\ndavantage dans les cha\u00eenes de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc cherche \u00e0 s\u2019ancrer davantage dans les cha\u00eenes de valeur mondiales, tout en pr\u00e9servant ses sp\u00e9cificit\u00e9s culturelles. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019intelligence artificielle, la donn\u00e9e, la connectivit\u00e9 g\u00e9n\u00e9ralis\u00e9e, la robotisation des services, la transformation des mod\u00e8les \u00e9conomiques et administratifs redessinent simultan\u00e9ment les rapports de pouvoir, les cha\u00eenes de valeur et les hi\u00e9rarchies g\u00e9opolitiques. [lnt.ma]\n-------------------------------------------------\nIl ne s\u2019agit plus seulement de lutter contre la d\u00e9sinformation, mais de garantir l\u2019authenticit\u00e9 du r\u00e9el lui-m\u00eame. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "One Retail, filiale de H\u0026S\nGroup, annonce l\u2019acquisition de 100...", "mass": 5, "physics": false, "shape": "box", "title": "One Retail, filiale de H\u0026S Group, annonce l\u2019acquisition de 100 % des actions et des droits de vote des soci\u00e9t\u00e9s Be Cafetal et Dahab Industrie, op\u00e9rant sous la marque Dahab. [leseco.ma]\n-------------------------------------------------\nLa plateforme One Retail, appartenant \u00e0 HS Invest Holding pr\u00e9sid\u00e9 par Moncef Belkhayat, annonce l\u2019acquisition de la cha\u00eene marocaine de coffee shops Dahab. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le ministre de la Sant\u00e9\net de la Protection sociale,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tahraoui, a tenu une r\u00e9union avec les syndicats des pharmaciens au sujet, notamment, de l\u2019avis du conseil de la concurrence. [leseco.ma]\n-------------------------------------------------\nLe ministre de la sant\u00e9 et de la protection sociale re\u00e7oit les syndicats du secteur Sant\u00e9 : Le dialogue entre le minist\u00e8re de la sant\u00e9 et de la protection sociale et les repr\u00e9sentants des pharmaciens se poursuit avec une nouvelle r\u00e9union. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La 1\u00e8re \u00e9dition de GITEX\nFuture Health Africa se tiendra,...", "mass": 5, "physics": false, "shape": "box", "title": "La 1\u00e8re \u00e9dition de GITEX Future Health Africa se tiendra, du 4 au 6 mai prochain \u00e0 Casablanca, \u00e0 l\u2019initiative du minist\u00e8re de la Sant\u00e9 et de la Protection Sociale, de la Fondation Mohammed VI des Sciences et de la Sant\u00e9 (FM6SS) et de Kaoun International. [leseco.ma]\n-------------------------------------------------\nLa 1\u00e8re \u00e9dition de GITEX Future Health Africa se tiendra, du 4 au 6 mai prochain \u00e0 Casablanca, \u00e0 l\u2019initiative du minist\u00e8re de la Sant\u00e9 et de la Protection Sociale, de la Fondation Mohammed V     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
