0", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Ces r\u00e9clamations se r\u00e9partissent notamment\nsur le fonctionnement de compte...", "mass": 5, "physics": false, "shape": "box", "title": "Ces r\u00e9clamations se r\u00e9partissent notamment sur le fonctionnement de compte (28%), les moyens de paiement (28%), les conditions de cr\u00e9dit (20%) et la bancassurance (3%), pr\u00e9cise la Banque Centrale. [telquel.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) a pr\u00e9sent\u00e9, mardi \u00e0 Casablanca, la 22\u00e8me \u00e9dition de son rapport annuel sur la supervision bancaire qui porte sur l\u2019exercice 2025. [www.lereporter.ma]\n-------------------------------------------------\nBank Al-Maghrib a pr\u00e9sent\u00e9, ce mardi 21 juillet 2026 \u00e0 Casablanca, son Rapport annuel sur la supervision bancaire relatif \u00e0 l\u2019exercice 2025. [lematin.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) dresse un bilan globalement positif du secteur bancaire marocain en 2025, marqu\u00e9 par une progression de l\u2019activit\u00e9, une am\u00e9lioration de la rentabilit\u00e9 et le maintien de niveaux de solvabilit\u00e9 jug\u00e9s confortables. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le minist\u00e8re des Affaires \u00e9trang\u00e8res\nsuit avec pr\u00e9occupation les \u00e9v\u00e9nements...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re des Affaires \u00e9trang\u00e8res suit avec pr\u00e9occupation les \u00e9v\u00e9nements et les faits ayant conduit au d\u00e9c\u00e8s d\u2019un ressortissant marocain \u00e0 Bologne en Italie. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger suit avec pr\u00e9occupation les \u00e9v\u00e9nements et les faits ayant conduit au d\u00e9c\u00e8s d\u2019un ressortissant marocain survenu \u00e0 Bologne, en Italie. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger suit avec pr\u00e9occupation les \u00e9v\u00e9nements et les faits ayant conduit au d\u00e9c\u00e8s du ressortissant marocain Abderrahim Fakir \u00e0 Bologne (Italie). [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger suit avec pr\u00e9occupation les \u00e9v\u00e9nements et les faits ayant conduit au d\u00e9c\u00e8s d\u2019un ressortissant marocain survenu \u00e0 Bologne, en Italie. [www.lereporter.ma]\n-------------------------------------------------\nLe minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger suit avec pr\u00e9occupation les \u00e9v\u00e9nements et les faits ayant conduit au d\u00e9c\u00e8s d\u2019un ressortissant marocain survenu \u00e0 Bologne, en Italie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019\u00e9v\u00e8nement est organis\u00e9 par la\nMarine Royale, en partenariat avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9v\u00e8nement est organis\u00e9 par la Marine Royale, en partenariat avec le Commandement de la Composante des Forces Navales des \u00c9tats-Unis en Europe et en Afrique (NAVAF) et le Commandement des Forces des Marines des \u00c9tats-Unis en Europe et en Afrique (MARFORAF). [www.lavieeco.com]\n-------------------------------------------------\nLe Sommet des Forces Maritimes Africaines (AMFS-2026),                 }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
