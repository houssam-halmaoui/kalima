ident-directeur g\u00e9n\u00e9ral ainsi que son si\u00e8ge au conseil d\u2019administration, \u00e0 la suite d\u2019un vote unanime de cette instance. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "\u00c0 la veille de la\nd\u00e9cision attendue du Tribunal arbitral...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la veille de la d\u00e9cision attendue du Tribunal arbitral du sport (TAS) dans le litige opposant les f\u00e9d\u00e9rations marocaine et s\u00e9n\u00e9galaise apr\u00e8s la finale de la CAN 2025, le quotidien espagnol Marca estime que la juridiction sportive devrait confirmer le titre continental des Lions de l\u2019Atlas. [fr.hespress.com]\n-------------------------------------------------\nSelon le quotidien sportif espagnol Marca, le Tribunal arbitral du sport (TAS) s\u2019appr\u00eate \u00e0 rejeter le recours de la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football (FSF) et \u00e0 confirmer la d\u00e9cision de la Conf\u00e9d\u00e9ration africaine de football (CAF) en faveur des Lions de l\u2019Atlas. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le cheval Lino, mont\u00e9 par\nle jockey Mickael Forest et...", "mass": 5, "physics": false, "shape": "box", "title": "Le cheval Lino, mont\u00e9 par le jockey Mickael Forest et propri\u00e9t\u00e9 de Yannick Shulz, s\u0027est adjug\u00e9 le Grand Prix de Sa Majest\u00e9 le Roi Mohammed VI de pur-sang arabe, dan. [lematin.ma]\n-------------------------------------------------\nLa 12e \u00e9dition du Morocco International Meeting (MIM) s\u2019est achev\u00e9e dimanche \u00e0 l\u2019hippodrome Casablanca-Anfa, au terme de deux journ\u00e9es de comp\u00e9titions r\u00e9unissant des chevaux, jockeys et professionnels des courses hippiques venus du Maroc et de l\u2019\u00e9tranger. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Fondation Al Mada et\nl\u2019Agence nationale des eaux et...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Al Mada et l\u2019Agence nationale des eaux et for\u00eats (ANEF) ont conclu une convention de six ans pour financer la plantation et la r\u00e9g\u00e9n\u00e9ration de 1.000 hectares d\u2019arganie. [lematin.ma]\n-------------------------------------------------\nLa Fondation Al Mada et l\u2019Agence Nationale des Eaux et For\u00eats (ANEF) ont sign\u00e9, lundi 23 novembre 2026 \u00e0 Rabat, une convention de partenariat portant sur un ambitieux [www.challenge.ma]\n-------------------------------------------------\nLa Fondation Al Mada et l\u2019Agence Nationale des Eaux et For\u00eats (ANEF) ont sign\u00e9, ce lundi 23 novembre 2026 \u00e0 11h \u00e0 Rabat, une convention de partenariat portant sur un ambitieux programme de plantation et de r\u00e9g\u00e9n\u00e9ration d\u2019un millier d\u2019hectares d\u2019arganiers, dans un premier temps, dans la r\u00e9gion du Souss-Massa. [leseco.ma]\n-------------------------------------------------\nLa Fondation Al Mada et l\u2019Agence Nationale des Eaux et For\u00eats (ANEF) ont conclu, lundi \u00e0 Rabat, un partenariat consacr\u00e9 \u00e0 la pr\u00e9servation et \u00e0 la r\u00e9g\u00e9n\u00e9ration de l\u2019arganeraie marocaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc pr\u00e9pare le lancement\nde MA-INDAR, un syst\u00e8me national...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc pr\u00e9pare le lancement de MA-INDAR, un syst\u00e8me national destin\u00e9 \u00e0 alerter rapidement les populations en cas de danger ou de situation d\u2019urgence. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur annonce le lancement de MA-INDAR, un syst\u00e8me national d\u2019alerte par t\u00e9l\u00e9phone destin\u00e9 \u00e0 pr\u00e9venir les populations en cas de catastrophe ou de situation d\u2019urgence. [www.lavieeco.com]\n-------------------------------------------------\nLa pr\u00e9fecture de la province d\u2019El Jadida a finalis\u00e9, lundi, les pr\u00e9paratifs en pr\u00e9vision du test sur le terrain du syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone baptis\u00e9 \u00ab MA-INDAR \u00bb, mis en place par le minist\u00e8re de l\u2019Int\u00e9rieur afin de renforcer la rapidit\u00e9 et l\u2019efficacit\u00e9 de la transmission des alertes aux citoyens pr\u00e9sents dans les zones menac\u00e9es [.] [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc poursuit le renforcement de ses dispositifs de pr\u00e9vention et de gestion des risques avec la mise en place d\u2019un syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone mobile. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Bank of Africa a enregistr\u00e9\nun r\u00e9sultat net part du...", "mass": 5, "physics": false, "shape": "box", "title": "Bank of Africa a enregistr\u00e9 un r\u00e9sultat net part du groupe (RNPG) de 3,4 milliards de dirhams \u00e0 fin septembre 2026, en hausse de 13% par rapport aux 3 milliards de dirhams r\u00e9alis\u00e9s. [lematin.ma]\n-------------------------------------------------\nSon produit net bancaire, lui, reste stable, la bonne tenue du c\u0153ur de m\u00e9tier compense un net reflux des activit\u00e9s de march\u00e9. [telquel.ma]\n-------------------------------------------------\nLe r\u00e9sultat net part du groupe (RNPG) de Bank of Africa (BOA) s\u2019est \u00e9tabli \u00e0 3,4 milliards de dirhams (MMDH) \u00e0 fin septembre 2026, en progression de 13% [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Apr\u00e8s avoir \u00e9limin\u00e9 le Br\u00e9sil\nen demi-finale, les Lions de...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s avoir \u00e9limin\u00e9 le Br\u00e9sil en demi-finale, les Lions de l\u2019Atlas s\u2019inclinent face au Ghana (1-0) et remportent la m\u00e9daille d\u2019argent. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football pour amput\u00e9s est vice-championne du monde depuis dimanche soir au Mexique, apr\u00e8s s\u2019\u00eatre inclin\u00e9e 1-0 face au Ghana en finale, au stade San Mart\u00edn de San Juan de los Lagos. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football pour amput\u00e9s a conclu sa participation \u00e0 la Coupe du monde 2026 par une deuxi\u00e8me place, apr\u00e8s s\u2019\u00eatre inclin\u00e9e face au Ghana sur le score de 1 but \u00e0 0, dimanche soir au Mexique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les militaires ont saisi leurs\narmes et leur ont ordonn\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Les militaires ont saisi leurs armes et leur ont ordonn\u00e9 de rester sur place dans l\u2019attente d\u2019une d\u00e9cision des autorit\u00e9s, rapporte l\u2019agence de presse mauritanienne Al-Akhbar. [telquel.ma]\n-------------------------------------------------\nL\u2019arm\u00e9e mauritanienne a intercept\u00e9 des membres arm\u00e9s du groupe s\u00e9paratiste polisario ayant p\u00e9n\u00e9tr\u00e9 sur son territoire et proc\u00e9d\u00e9 \u00e0 la saisie de leurs armes, selon des informations rapport\u00e9es par l\u2019agence de presse mauritanienne Al-Akhbar. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#00     }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
