, dans plusieurs r\u00e9gions du royaume. [www.yabiladi.com]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nDans un bulletin m\u00e9t\u00e9orologique d\u2019un niveau de vigilance orange, la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pr\u00e9voit des averses orageuses jusqu\u2019\u00e0 65 mm, des chutes de neige pouvant atteindre 40 cm et de fortes rafales de vent. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Organis\u00e9e mardi soir \u00e0 Rabat\npar Moroccan Millenium Leaders (MML)...", "mass": 5, "physics": false, "shape": "box", "title": "Organis\u00e9e mardi soir \u00e0 Rabat par Moroccan Millenium Leaders (MML) et la Fondation Konrad Adenauer, cette 5\u00e8me \u00e9dition d\u2019anthologie du Leaders Ftour Ta. [lematin.ma]\n-------------------------------------------------\nLa 5\u00e8me \u00e9dition du \u00ab Leaders Ftour Talk \u00bb est une rencontre d\u2019anthologie qui fera date avec une affluence sans pr\u00e9c\u00e9dent marqu\u00e9e par une forte pr\u00e9sence des jeunes, a relev\u00e9 le Conseiller de SM le Roi et Pr\u00e9sident-Fondateur de l\u2019Association Essaouira-Mogador, Andr\u00e9 Azoulay. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Dans un communiqu\u00e9, la soci\u00e9t\u00e9\na indiqu\u00e9 que cette d\u00e9cision...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, la soci\u00e9t\u00e9 a indiqu\u00e9 que cette d\u00e9cision intervient apr\u00e8s l\u2019arr\u00eat de la production de GNL ainsi que de produits connexes, notamment l\u2019ur\u00e9e, les polym\u00e8res, le m\u00e9t. [lematin.ma]\n-------------------------------------------------\nFaisant suite \u00e0 la d\u00e9cision prise la veille de suspendre la production de gaz naturel liqu\u00e9fi\u00e9 (GNL) et des produits connexes, \u00ab QatarEnergy proc\u00e9dera \u00e0 l\u2019arr\u00eat de la production de certains. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Dans un communiqu\u00e9 relay\u00e9 par\nl\u2019Agence de presse des \u00c9mirats...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9 relay\u00e9 par l\u2019Agence de presse des \u00c9mirats (WAM), le minist\u00e8re a indiqu\u00e9 que les forces arm\u00e9es \u00e9miraties ont fait face \u00e0 ces attaques avec professionnalisme et ef. [lematin.ma]\n-------------------------------------------------\nLes \u00c9mirats arabes unis ont subi plus de 1.000 attaques, un nombre sup\u00e9rieur \u00e0 celui enregistr\u00e9 par l\u2019ensemble des pays cibl\u00e9s r\u00e9unis, a affirm\u00e9 le minist\u00e8re \u00e9mirati des Affaires \u00e9trang\u00e8res. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Stellar AfricaGold Inc a annonc\u00e9\nle 3 mars 2026 l\u2019ach\u00e8vement...", "mass": 5, "physics": false, "shape": "box", "title": "Stellar AfricaGold Inc a annonc\u00e9 le 3 mars 2026 l\u2019ach\u00e8vement r\u00e9ussi de la premi\u00e8re phase de sa campagne de forage exploratoire au diamant sur le projet aurif\u00e8re Tichka Est, au Maroc. [telquel.ma]\n-------------------------------------------------\nLa soci\u00e9t\u00e9 canadienne Stellar AfricaGold Inc, sp\u00e9cialis\u00e9e dans lexploration des m\u00e9taux pr\u00e9cieux, a annonc\u00e9 avoir achev\u00e9 la premi\u00e8r                                 scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
