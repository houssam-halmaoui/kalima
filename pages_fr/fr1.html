arocain-la-france-reaffirme-sa-position-intangible-de-soutien-a-la-souverainete-du-maroc/", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 17, "id": 237, "label": "Essaouira | M. Barrot salue...", "shape": "dot", "size": 71, "title": "Essaouira | M. Barrot salue l\u2019exp\u00e9rience marocaine de coexistence et de dialogue au service de la paix\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/essaouira-m-barrot-salue-lexperience-marocaine-de-coexistence-et-de-dialogue-au-service-de-la-paix/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les mesures pr\u00e9vues par le\nprojet de loi de finances...", "mass": 5, "physics": false, "shape": "box", "title": "Les mesures pr\u00e9vues par le projet de loi de finances (PLF) au titre de l\u2019ann\u00e9e 2027 en faveur du soutien au pouvoir d\u2019achat des citoyens ont \u00e9t\u00e9 favorablement accueillies lors de la discussion g\u00e9n\u00e9rale du texte au sein de la Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants. [fr.hespress.com]\n-------------------------------------------------\nLes mesures pr\u00e9vues par le projet de loi de finances (PLF) au titre de l\u2019ann\u00e9e 2027 en faveur du soutien au pouvoir d\u2019achat des citoyens ont \u00e9t\u00e9 favorablement accueillies lors de la discussion g\u00e9n\u00e9rale du texte au sein de la Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Les \u00e9l\u00e9ments du service pr\u00e9fectoral\nde la police judiciaire de...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9l\u00e9ments du service pr\u00e9fectoral de la police judiciaire de Casablanca, agissant en \u00e9troite coordination avec les services de la Direction g\u00e9n\u00e9rale de la surveillance du territoire (DGST), ont proc\u00e9d\u00e9, ce vendredi 13 novembre 2026 \u00e0 la mi-journ\u00e9e, \u00e0 l\u2019interpellation d\u2019un \u00e9l\u00e8ve mineur (15 ans), soup\u00e7onn\u00e9 d\u2019\u00eatre impliqu\u00e9 dans la fausse d\u00e9nonciation d\u2019une menace terroriste . [fr.hespress.com]\n-------------------------------------------------\nUn \u00e9l\u00e8ve de 15 ans a \u00e9t\u00e9 interpell\u00e9 vendredi 13 novembre \u00e0 la mi-journ\u00e9e \u00e0 Casablanca pour son implication pr\u00e9sum\u00e9e dans une fausse alerte \u00e0 la bombe visant un \u00e9tablissement scolaire, d\u2019apr\u00e8s une source s\u00e9curitaire. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Princesse Lalla Oumkeltoum, pr\u00e9sidente\nde la Fondation Lalla Oumkeltoum...", "mass": 5, "physics": false, "shape": "box", "title": "La Princesse Lalla Oumkeltoum, pr\u00e9sidente de la Fondation Lalla Oumkeltoum pour la sant\u00e9 mentale, a effectu\u00e9 une visite au nouvel h\u00f4pital psychiatrique de K\u00e9nitra, d\u2019une capacit\u00e9 de 120 lits, et destin\u00e9 \u00e0 renforcer l\u2019offre de soins de sant\u00e9, notamment en mati\u00e8re de sant\u00e9 mentale, au niveau de la r\u00e9gion de Rabat-Sal\u00e9-K\u00e9nitra. [fr.hespress.com]\n-------------------------------------------------\nCette nouvelle structure traduit, une nouvelle fois, la Haute Sollicitude de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, pour la promotion du secteur de la sant\u00e9, en g\u00e9n. [lematin.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Oumkeltoum, pr\u00e9sidente de la Fondation Lalla Oumkeltoum pour la sant\u00e9 mentale, a effectu\u00e9, vendredi, une visite au nouvel h\u00f4pital psychiatrique de K\u00e9nitra, dot\u00e9 d\u2019une capacit\u00e9 de 120 lits. [www.lavieeco.com]\n-------------------------------------------------\nElle a \u00e9galement pr\u00e9sid\u00e9 la signature d\u2019une convention de partenariat entre le minist\u00e8re de la Sant\u00e9 et sa fondation, dans le cadre du Plan Sant\u00e9 mentale 2030. [telquel.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Oumkeltoum, pr\u00e9sidente de la Fondation Lalla Oumkeltoum pour la sant\u00e9 mentale, a effectu\u00e9 une visite au nouvel h\u00f4pital psychiatrique de K\u00e9nitra, d\u2019une capacit\u00e9 de 120 lits, et destin\u00e9 \u00e0 renforcer l\u2019offre de soins de sant\u00e9, notamment en mati\u00e8re de sant\u00e9 mentale, au niveau de la r\u00e9gion de Rabat-Sal\u00e9-K\u00e9nitra. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La direction du groupe scolaire\n\u00ab Al Jabr \u00bb \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La direction du groupe scolaire \u00ab Al Jabr \u00bb \u00e0 Casablanca a apport\u00e9 des \u00e9claircissements officiels \u00e0 la suite de l\u2019alerte s\u00e9curitaire ayant touch\u00e9 ses \u00e9tablissements ce vendredi 13 novembre 2026. [fr.hespress.com]\n-------------------------------------------------\nL\u2019alerte ayant entra\u00een\u00e9 le confinement des \u00e9l\u00e8ves et du personnel de l\u2019\u00e9cole Al Jabr Oasis, \u00e0 Casablanca, ce vendredi 13 novembre, aurait \u00e9t\u00e9 provoqu\u00e9e par un appel t\u00e9l\u00e9phonique anonyme. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Maroc a conc\u00e9d\u00e9 une\nd\u00e9faite face \u00e0 l\u2019\u00c9gypte (0-1),...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a conc\u00e9d\u00e9 une d\u00e9faite face \u00e0 l\u2019\u00c9gypte (0-1), ce vendredi \u00e0 Sousse, en Tunisie, lors de la deuxi\u00e8me journ\u00e9e du tournoi de l\u2019Union nord-africaine de football (UNAF), qualificatif pour la prochaine Coupe d\u2019Afrique des nations U17. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine des moins de 17 ans s\u2019est inclin\u00e9e face \u00e0 l\u2019\u00c9gypte (0-1), vendredi 13 novembre 2026 au stade olympique de Sousse, en Tunisie. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Publi\u00e9e \u00e0 l\u0027issue de l\u2019entretien,\n\u00e0 Essaouira, entre le ministre...", "mass": 5, "physics": false, "shape": "box", "title": "Publi\u00e9e \u00e0 l\u0027issue de l\u2019entretien, \u00e0 Essaouira, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et. [lematin.ma]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9, vendredi 13 novembre 2026, son soutien \u00e0 la souverainet\u00e9 marocaine sur le Sahara occidental, \u00e0 l\u2019issue d\u2019un entretien \u00e0 Essaouira entre les ministres des Affaires \u00e9trang\u00e8res Nasser Bourita et Jean-No\u00ebl Barrot. [www.yabiladi.com]\n-------------------------------------------------\nLa France consid\u00e8re \u00e9galement le plan d\u2019autonomie propos\u00e9 par le Maroc en 2007 comme \u00ab la seule base \u00bb pour parvenir \u00e0 une solution politique juste, durable et n\u00e9goci\u00e9e. [www.lavieeco.com]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9 vendredi sa position sur le Sahara marocain, selon laquelle le pr\u00e9sent et l\u2019avenir du territoire s\u2019inscrivent dans le cadre de la souverainet\u00e9 marocaine. [maroc-diplomatique.net]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9, vendredi, sa position \u00ab intangible \u00bb selon laquelle \u00ab le pr\u00e9sent et l\u2019avenir du Sahara occidental s\u2019inscrivent dans le cadre de la souverainet\u00e9 marocaine \u00bb, indique-t-on dans une d\u00e9claration du porte-parole du minist\u00e8re fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0\nl\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies sur les vetos russe et am\u00e9ricain du 30 octobre pour mettre fin \u00e0 la mission de l\u2019ONU au Sahara (MINURSO), les pays du continent africain l\u2019ayant souhait\u00e9 en ont profit\u00e9 pour se prononcer sur le diff\u00e9rend du Sahara. [telquel.ma]\n-------------------------------------------------\nLa fin du mandat de la MINURSO n\u2019a pas clos le d\u00e9bat sur la place des Nations unies dans le r\u00e8glement du diff\u00e9rend r\u00e9gional autour du Sahara marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La 13\u00e8me session du comit\u00e9\nde coop\u00e9ration douani\u00e8re (CDD) Maroc-Union...", "mass": 5, "physics": false, "shape": "box", "title": "La 13\u00e8me session du comit\u00e9 de coop\u00e9ration douani\u00e8re (CDD) Maroc-Union europ\u00e9enne (UE) s\u2019est tenue, mardi, au si\u00e8ge de l\u2019Administration des Douanes et Imp\u00f4ts Indirects (ADII) \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa 13e session du comit\u00e9 de coop\u00e9ration douani\u00e8re Maroc-Union europ\u00e9enne s\u2019est tenue mardi au si\u00e8ge de l\u2019Administration des douanes et imp\u00f4ts indirects (ADII), \u00e0 Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le Maroc et la Norv\u00e8ge\nrenforcent leur coop\u00e9ration dans les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Norv\u00e8ge renforcent leur coop\u00e9ration dans les domaines de la finance climatique et des march\u00e9s carbone, \u00e0 travers la signature, jeudi \u00e0 Antalya, d\u2019un accord d\u2019achat de r\u00e9sultats d\u2019att\u00e9nuation (Mitigation Outcome Purchase Agreement \u2013 MOPA), visant \u00e0 g\u00e9n\u00e9rer jusqu\u2019\u00e0 8,89 millions de tonnes \u00e9quivalent CO\u2082 de r\u00e9ductions d\u2019\u00e9missions sur 10 ans. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, en marge de la COP31, un accord visant \u00e0 financer des projets solaires et \u00e9oliens au Maroc par le biais du march\u00e9 carbone. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, un accord destin\u00e9 \u00e0 mobiliser des financements carbone pour soutenir le d\u00e9veloppement des \u00e9nergies renouvelables dans le Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les recettes douani\u00e8res ont \u00e9t\u00e9\nde 90,8 milliards de dirhams...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes douani\u00e8res ont \u00e9t\u00e9 de 90,8 milliards de dirhams (MMDH) au terme des dix premiers mois de 2026, en am\u00e9lioration de 8,6% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les taxes int\u00e9rieures de consommation sur les tabacs manufactur\u00e9s et les autres produits, les recettes de la fiscalit\u00e9 douani\u00e8re avoisinent 108 milliards de dirhams, port\u00e9es notamment par la progression de la TVA \u00e0 l\u2019importation et des droits de douane. [www.lavieeco.com]\n-------------------------------------------------\nLes recettes douani\u00e8res ont atteint 90,8 milliards de dirhams \u00e0 fin octobre 2026, en progression de 8,6 % par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume (TGR). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Quatre lignes \u00e0 haute tension\ntouch\u00e9es, des quartiers plong\u00e9s dans...", "mass": 5, "physics": false, "shape": "box", "title": "Quatre lignes \u00e0 haute tension touch\u00e9es, des quartiers plong\u00e9s dans le noir pendant plusieurs heures le mercredi 11 novembre : \u00e0 Casablanca, la coupure d\u2019\u00e9lectricit\u00e9 du 11 novembre serait li\u00e9e aux intemp\u00e9ries provoqu\u00e9es par la temp\u00eate Charles. [telquel.ma]\n-------------------------------------------------\nLa coupure d\u2019\u00e9lectricit\u00e9 qui a touch\u00e9 plusieurs quartiers de Casablanca, mercredi 11 novembre, doit \u00eatre replac\u00e9e dans le contexte des conditions m\u00e9t\u00e9orologiques exceptionnelles ayant accompagn\u00e9 la temp\u00eate Charles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le moussem religieux et culturel\nde Moulay Abdellah Ch\u00e9rif El...", "mass": 5, "physics": false, "shape": "box", "title": "Le moussem religieux et culturel de Moulay Abdellah Ch\u00e9rif El Ouazzani se d\u00e9roulera du 18 au 21 novembre 2026 \u00e0 Ouazzane, \u00e0 l\u2019occasion des comm\u00e9morations de la F\u00eate de l\u2019Unit\u00e9, de la Marche verte et de la F\u00eate de l\u2019Ind\u00e9pendance. [www.yabiladi.com]\n-------------------------------------------------\nLe Moussem religieux et culturel de Moulay Abdellah Ch\u00e9rif El Ouazzani se tiendra, du 18 au 21 novembre, sous le th\u00e8me \u00ab Sur la voie proph\u00e9tique et dans un esprit d\u2019unit\u00e9 : rayonnement spirituel et fid\u00e9lit\u00e9 \u00e0 la nation \u00bb, \u00e0 l\u2019initiative de l\u2019Association Dar Dmana charg\u00e9e de la gestion des affaires de la zaou\u00efa Ouazzania. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Casablanca Finance City Authority (CFCA),\nla Caisse de d\u00e9p\u00f4t et...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca Finance City Authority (CFCA), la Caisse de d\u00e9p\u00f4t et de gestion (CDG) et le Global Green Growth Institute (GGGI) ont sign\u00e9, au pavillon marocain de la COP31 \u00e0 Antalya, un accord destin\u00e9 \u00e0 financer des projets d\u2019\u00e9nergies renouvelables au Maroc gr\u00e2ce \u00e0 des fonds carbone norv\u00e9giens. [www.yabiladi.com]\n-------------------------------------------------\nLa Caisse de D\u00e9p\u00f4t et de Gestion (CDG), Casablanca Finance City Authority (CFCA) et le Global Green Growth Institute (GGGI) ont sign\u00e9, jeudi \u00e0 Antalya, un accord destin\u00e9 \u00e0 mobiliser des financements carbone norv\u00e9giens au profit de projets d\u2019\u00e9nergies renouvelables au Maroc. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le ministre fran\u00e7ais de l\u2019Europe\net des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, a salu\u00e9 vendredi 13 novembre 2026, \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine de coexistence et de dialogue, qu\u2019il a pr\u00e9sent\u00e9e comme un appui \u00e0 la paix. [www.yabiladi.com]\n-------------------------------------------------\nIntervenant ce vendredi au Forum mondial des femmes pour la paix \u00e0 Essaouira, le ministre des Affaires \u00e9trang\u00e8res, Nasser Bourita, a r\u00e9affirm\u00e9 l\u2019engagement du Maroc en faveur d\u2019une paix juste et durable. [www.lavieeco.com]\n-------------------------------------------------\nIl a pris part aux travaux de cette rencontre internationale, organis\u00e9e autour du rapprochement entre diplomatie et soci\u00e9t\u00e9 civile pour construire la paix. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean No\u00ebl Barrot, a salu\u00e9, vendredi \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine en mati\u00e8re de coexistence et de dialogue au service de la paix. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Deux matchs du Championnat national\nprofessionnel de football f\u00e9minin de...", "mass": 5, "physics": false, "shape": "box", "title": "Deux matchs du Championnat national professionnel de football f\u00e9minin de premi\u00e8re division seront diffus\u00e9s chaque semaine sur les cha\u00eenes de la Soci\u00e9t\u00e9 nationale de radiodiffusion et de t\u00e9l\u00e9vision (SNRT), a indiqu\u00e9 le 13 novembre 2026 la Ligue nationale de football f\u00e9minin (LNFF). [www.yabiladi.com]\n-------------------------------------------------\nDeux rencontres du Championnat national professionnel de football f\u00e9minin (D1) seront retransmises chaque semaine sur les cha\u00
