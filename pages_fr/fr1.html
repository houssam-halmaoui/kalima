es plus r\u00e9alisables\u201d. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Autriche a exprim\u00e9, mercredi, son soutien \u00e0 la R\u00e9solution 2797 (2025) du Conseil de s\u00e9curit\u00e9 des Nations Unies, affirmant qu\u2019une \u201cv\u00e9ritable autonomie sous souverainet\u00e9 marocaine pourrait constituer l\u2019une des solutions les plus r\u00e9alisables\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Du 25 au 27 juin,\nla cit\u00e9 des aliz\u00e9s accueille...", "mass": 5, "physics": false, "shape": "box", "title": "Du 25 au 27 juin, la cit\u00e9 des aliz\u00e9s accueille la 27\u00e8me \u00e9dition du Festival Gnaoua et Musiques du Monde. [telquel.ma]\n-------------------------------------------------\nElle sera marqu\u00e9e par la diversit\u00e9 des esth\u00e9tiques repr\u00e9sent\u00e9es, entre musiques traditionnelles, jazz et musiques du monde, avec une place centrale accord\u00e9e aux rencontres entre Ma\u00e2lems Gnaoua et artistes internationaux. [aujourdhui.ma]\n-------------------------------------------------\nDu 25 au 27 juin 2026, la ville d\u2019Essaouira accueillera une nouvelle \u00e9dition du Festival Gnaoua et Musiques du Monde d\u2019Essaouira, rendez-vous d\u00e9sormais install\u00e9 dans le paysage culturel marocain et international. [lnt.ma]\n-------------------------------------------------\nDu 25 au 27 juin, Essaouira devient le c\u0153ur battant d\u2019une partition musicale en perp\u00e9tuel mouvement, o\u00f9 les Ma\u00e2lems Gnaoua, d\u00e9positaires d\u2019une tradition vivante, rencontrent les grandes voix du monde pour trois jours de fusions, d\u2019\u00e9motions et de partage. [leseco.ma]\n-------------------------------------------------\nLa 27e \u00e9dition du Festival Gnaoua et Musiques du Monde, pr\u00e9vue du 25 au 27 juin prochain \u00e0 Essaouira, accueillera plus de 400 artistes, dont 42 Ma\u00e2lems, qui se produiront sur diff\u00e9rentes sc\u00e8nes, entre grands concerts et formats intimistes. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "De fortes rafales de vent\net des averses orageuses sont...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes rafales de vent et des averses orageuses sont pr\u00e9vues, jeudi et vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), dans un bulletin d\u0027alerte m\u00e9t\u00e9o. [www.lavieeco.com]\n-------------------------------------------------\nAinsi, de fortes rafales de vent (70 \u00e0 80 km/h) avec chasse-poussi\u00e8res sont attendues, jeudi de 14H00 \u00e0 23H00, dans les provinces de Figuig, Taourirt et Jerada, a pr\u00e9cis\u00e9 la DGM da. [lematin.ma]\n-------------------------------------------------\nDe fortes rafales de vent et des averses orageuses sont pr\u00e9vues, jeudi et vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDe fortes rafales de vent et des averses orageuses sont pr\u00e9vues, jeudi et vendredi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les moyens de renforcer la\ncoop\u00e9ration parlementaire entre le Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Les moyens de renforcer la coop\u00e9ration parlementaire entre le Maroc et la France ont \u00e9t\u00e9 examin\u00e9s mercredi \u00e0 Rabat lors d\u2019une rencontre entre des membres de la Chambre des conseillers et une d\u00e9l\u00e9g                           var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
