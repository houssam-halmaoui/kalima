e, "shape": "box", "title": "Dans un communiqu\u00e9, le minist\u00e8re rel\u00e8ve que de fausses informations ont circul\u00e9, au cours des derni\u00e8res heures, sur des r\u00e9seaux sociaux et des sites web concernant une pr\u00e9tendue no. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9menti de mani\u00e8re cat\u00e9gorique les fausses informations relay\u00e9es sur des r\u00e9seaux sociaux et plusieurs sites \u00e9lectroniques portant sur une pr\u00e9tendue note adress\u00e9e aux \u00e9tablissements scolaires, en relation avec un soi-disant \u00ab ph\u00e9nom\u00e8ne d\u2019enl\u00e8vement d\u2019enfants \u00bb. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9menti de mani\u00e8re cat\u00e9gorique les fausses informations relay\u00e9es sur des r\u00e9seaux sociaux et plusieurs sites \u00e9lectroniques portant sur une pr\u00e9tendue note adress\u00e9e aux \u00e9tablissements scolaires, en relation avec un soi-disant \u00ab ph\u00e9nom\u00e8ne d\u2019enl\u00e8vement d\u2019enfants \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Apr\u00e8s plusieurs semaines de flou,\nla Conf\u00e9d\u00e9ration africaine de football...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s plusieurs semaines de flou, la Conf\u00e9d\u00e9ration africaine de football est enfin sortie de son silence pour \u00e9claircir l\u2019avenir de la Coupe d\u2019Afrique f\u00e9minine, qui devait se tenir. [lematin.ma]\n-------------------------------------------------\nDans un communiqu\u00e9 publi\u00e9 jeudi, la Conf\u00e9d\u00e9ration africaine de football (CAF) annonce que la comp\u00e9tition, initialement pr\u00e9vue du 17 mars au 3 avril 2026, se d\u00e9roulera finalement du 25 juillet au 16 ao\u00fbt 2026. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9 de reporter la Coupe d\u2019Afrique des nations f\u00e9minine 2026, que le Maroc doit accueillir. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9, ce jeudi, la reprogrammation des dates de la Coupe d\u2019Afrique des Nations f\u00e9minine du 25 juillet au 16 ao\u00fbt. [leseco.ma]\n-------------------------------------------------\nLa Coupe d\u2019Afrique des nations f\u00e9minine 2026, que le Maroc doit accueillir, a \u00e9t\u00e9 officiellement report\u00e9e \u00e0 l\u2019\u00e9t\u00e9 prochain par la Conf\u00e9d\u00e9ration africaine de football (CAF), selon plusieurs m\u00e9dias marocains. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Conseil de gouvernement a\napprouv\u00e9 le projet de d\u00e9cret...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9 le projet de d\u00e9cret N\u00b0 2.26.190 fixant la date des \u00e9lections des membres de la Chambre des repr\u00e9sentants, a relev\u00e9 M. Baitas lors d\u0027un poi. [lematin.ma]\n-------------------------------------------------\nC\u2019est ce qu\u2019a d\u00e9clar\u00e9, ce jeudi 5 mars, le ministre charg\u00e9 des Relations avec le Parlement et la soci\u00e9t\u00e9 civile, porte-parole du gouvernement. [telquel.ma]\n-------------------------------------------------\nLa date de la tenue des \u00e9lections des membres de la Chambre des repr\u00e9sentants a \u00e9t\u00e9 fix\u00e9e au mercredi 23 septembre 2026, a indiqu\u00e9 jeudi \u00e0 Rabat le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, Porte-parole du gouvernement, Mustapha Baitas. [aujourdhui.ma]\n-------------------------------------------------\nLe Conseil de gouverneme     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
