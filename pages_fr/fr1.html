 Taourirt, Midelt,. [telquel.ma]\n-------------------------------------------------\nDes averses orageuses localement fortes avec chutes de gr\u00eale sont pr\u00e9vues jeudi et vendredi dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La F\u00e9d\u00e9ration royale marocaine de\nfootball (FRMF) et l\u2019Office national...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration royale marocaine de football (FRMF) et l\u2019Office national des a\u00e9roports (ONDA) ont sign\u00e9, mercredi, une convention de partenariat strat\u00e9gique visant \u00e0 renforcer la coop\u00e9ration mutuelle et \u00e0 am\u00e9liorer les services li\u00e9s aux d\u00e9placements des \u00e9quipes nationales et des d\u00e9l\u00e9gations sportives. [telquel.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale marocaine de football (FRMF) et l\u2019Office national des a\u00e9roports (ONDA) ont sign\u00e9, mercredi \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, une convention de partenariat strat\u00e9gique pour renforcer leur coop\u00e9ration et am\u00e9liorer les services de d\u00e9placements des \u00e9quipes nationales, ainsi que des d\u00e9l\u00e9gations sportives. [www.yabiladi.com]\n-------------------------------------------------\nLa convention entre la FRMF et l\u2019ONDA vise \u00e0 am\u00e9liorer l\u2019accueil et les d\u00e9placements des s\u00e9lections nationales, tout en renfor\u00e7ant l\u2019organisation des grandes comp\u00e9titions et le positionnement du Maroc comme hub sportif. [www.lavieeco.com]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine de Football et l\u2019Office National des A\u00e9roports ont sign\u00e9 une convention de partenariat strat\u00e9gique visant \u00e0 renforcer la coop\u00e9ration entre les deux institutions et \u00e0 am\u00e9liorer les conditions de d\u00e9placement des s\u00e9lections nationales et des d\u00e9l\u00e9gations sportives. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le roi de la chanson\nfrancophone rattrap\u00e9 par la justice...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi de la chanson francophone rattrap\u00e9 par la justice : Gims a \u00e9t\u00e9 interpell\u00e9 mercredi 25 mars \u00e0 sa descente de l\u2019avion \u00e0 Paris et plac\u00e9 en garde \u00e0 vue dans une affaire de blanchiment en bande organis\u00e9e. [telquel.ma]\n-------------------------------------------------\nDans le viseur de la justice fran\u00e7aise pour soup\u00e7ons de blanchiment d\u2019argent en bande organis\u00e9e, le chanteur Gims fait l\u2019objet d\u2019une garde \u00e0 vue prolong\u00e9e pour ses liens pr\u00e9sum\u00e9s avec un projet immobilier de luxe au Maroc, a d\u00e9clar\u00e9 ce jeudi le Parquet national anticriminalit\u00e9 organis\u00e9e (PNACO) \u00e0 l\u2019AFP. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La jeune p\u00e9pite de l\u2019Ajax\nAmsterdam, Rayane Bounida, a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La jeune p\u00e9pite de l\u2019Ajax Amsterdam, Rayane Bounida, a \u00e9t\u00e9 convoqu\u00e9e par le s\u00e9lectionneur national Mohamed Ouahbi afin de prendre part aux deux rencontres amicales des Lions de l\u2019Atlas, face \u00e0 l\u2019\u00c9quateur \u00e0 Madrid et au Paraguay \u00e0 Lens. [telquel.ma]\n-------------------------------------------------\nLa jeune \u00e9toile montante de lAjax Amsterdam, Rayane Bounida, a \u00e9t\u00e9 appel\u00e9e par le s\u00e9lectionneur national Mohamed Ouahbi pour partic         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
