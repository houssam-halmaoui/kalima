": 26}, "group": 0, "id": "comm_label_0", "label": "Mohamed Ouahbi a d\u00e9voil\u00e9, ce\njeudi 17 septembre, la liste...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ouahbi a d\u00e9voil\u00e9, ce jeudi 17 septembre, la liste de joueurs convoqu\u00e9s pour les deux matchs du Maroc face au Gabon et au Lesotho, comptant pour les 1\u00e8re et 2\u00e8 journ\u00e9es (groupe A) des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations 2027. [fr.hespress.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Mohamed Ouahbi, a d\u00e9voil\u00e9, jeudi au Complexe Mohammed VI de football, la liste des joueurs convoqu\u00e9s pour les matchs du Gabon et du Lesotho, comptant respectivement pour les 1\u00e8re et 2\u00e8 journ\u00e9es des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations (CAN-2027), ainsi qu\u2019un match amical contre le Ghana. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur du Maroc, Mohamed Ouahbi, a d\u00e9voil\u00e9 jeudi une liste de 29 joueurs pour affronter le Gabon et le Lesotho lors des premiers matches \u00e9liminatoires de la Coupe d\u2019Afrique des nations 2027, ainsi quun match amical contre le Ghana \u00e0 Tanger. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc y sera l\u2019un\ndes pays les mieux pond\u00e9r\u00e9s,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc y sera l\u2019un des pays les mieux pond\u00e9r\u00e9s, donnant une nouvelle vitrine internationale aux obligations du Tr\u00e9sor en dirhams. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc sera parmi les nations les plus repr\u00e9sent\u00e9es dans le nouvel indice de JPMorgan consacr\u00e9 aux obligations souveraines en monnaie locale des march\u00e9s fronti\u00e8res, dont le lancement est pr\u00e9vu d\u2019ici antan\u00e9e. [leseco.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) appelle les \u00e9pargnants \u00e0 renforcer leur vigilance face \u00e0 la multiplication d\u2019offres d\u2019investissement frauduleuses diffus\u00e9es sur les r\u00e9seaux sociaux et les applications de messagerie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Il s\u2019agit d\u2019un voyage \u00e0\ntravers diff\u00e9rentes esth\u00e9tiques du piano...", "mass": 5, "physics": false, "shape": "box", "title": "Il s\u2019agit d\u2019un voyage \u00e0 travers diff\u00e9rentes esth\u00e9tiques du piano classique africain, du Nigeria \u00e0 l\u2019\u00c9thiopie en passant par le Maroc, qui met en lumi\u00e8re la richesse des traditions. [lematin.ma]\n-------------------------------------------------\nPr\u00e9vu samedi \u00e0 20h, ce rendez-vous musical propose un voyage du Nigeria \u00e0 l\u2019\u00c9thiopie, en passant par le Maroc, \u00e0 la d\u00e9couverte d\u2019un r\u00e9pertoire . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts\n(DGI) rappelle aux contribuables dont...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts (DGI) rappelle aux contribuables dont les revenus professionnels sont d\u00e9termin\u00e9s selon le r\u00e9gime de la Contribution professionnelle unique (CPU) et. [lematin.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que plusieurs cat\u00e9gories de contribuables sont tenues d\u2019effectuer, au plus tard le 1er octobre 2026, leurs d\u00e9clarations et versements fiscaux. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Critiqu\u00e9 pour avoir refus\u00e9 de\nporter enti\u00e8rement un tee-shirt de...", "mass": 5, "physics": false, "shape": "box", "title": "Critiqu\u00e9 pour avoir refus\u00e9 de porter enti\u00e8rement un tee-shirt de soutien \u00e0 la population de Sebta, l\u2019attaquant du Real Madrid Kylian Mbapp\u00e9 a clarifi\u00e9 sa position en assurant qu\u2019il soutenait \u00ab \u00e0 100% \u00bb les habitants de l\u2019enclave espagnole, au coeur d\u2019une crise migratoire avec le Maroc. [telquel.ma]\n-------------------------------------------------\nL\u0027attaquant du Real Madrid Kylian Mbapp\u00e9, qui a refus\u00e9 d\u0027enfiler enti\u00e8rement un t-shirt de soutien \u00e0 Sebta pour avoir aussi une pens\u00e9e pour les migrants disparus, est vis\u00e9 depuis deux jours par des critiques appuy\u00e9es de la droite et de l\u0027extr\u00eame droite espagnoles et fran\u00e7aises. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La police judiciaire de Tanger,\nen coordination avec la Direction...", "mass": 5, "physics": false, "shape": "box", "title": "La police judiciaire de Tanger, en coordination avec la Direction g\u00e9n\u00e9rale de la surveillance du territoire (DGST), a arr\u00eat\u00e9 un ressortissant su\u00e9dois de 22 ans, mercredi 16 septembre apr\u00e8s-midi. [telquel.ma]\n-------------------------------------------------\nMercredi apr\u00e8s-midi, la police de Tanger, en collaboration avec la Direction g\u00e9n\u00e9rale de la surveillance du territoire, ont interpell\u00e9 un citoyen su\u00e9dois de 22 ans, recherch\u00e9 par la police su\u00e9doise pour son implication pr\u00e9sum\u00e9e dans une tentative de meurtre avec pr\u00e9m\u00e9ditation. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Lors d\u2019une r\u00e9union trilat\u00e9rale tenue\nmardi \u00e0 New York entre...", "mass": 5, "physics": false, "shape": "box", "title": "Lors d\u2019une r\u00e9union trilat\u00e9rale tenue mardi \u00e0 New York entre le ministre isra\u00e9lien des Affaires \u00e9trang\u00e8res Gideon Saar, son homologue marocain Nasser Bourita, et l\u2019ambassadeur am\u00e9ricain aupr\u00e8s de l\u2019ONU Mike Waltz, Isra\u00ebl et le Maroc ont r\u00e9affirm\u00e9 leur engagement \u00e0 relever le niveau de leurs relations diplomatiques. [telquel.ma]\n-------------------------------------------------\nIsra\u00ebl et le Maroc se sont engag\u00e9s mardi \u00e0 New York \u00e0 \u00e9lever leurs repr\u00e9sentations diplomatiques au rang d\u0027ambassades, lors d\u0027un sommet trilat\u00e9ral r\u00e9unissant le ministre isra\u00e9lien des Affaires \u00e9trang\u00e8res Gideon Sa\u0027ar, son homologue marocain Nasser Bourita et l\u0027ambassadeur am\u00e9ricain aupr\u00e8s de l\u0027ONU Mike Waltz. [atlasinfo.fr]\n-------------------------------------------------\nLe Maroc et Isra\u00ebl vont ouvrir des ambassades dans leurs pays respectifs, a annonc\u00e9 mercredi le minist\u00e8re isra\u00e9lien des Affaires \u00e9trang\u00e8res, apr\u00e8s une rencontre entre les deux chefs de la diplomatie sous l\u0027\u00e9gide am\u00e9ricaine. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019op\u00e9ration \u00ab Marhaba 2026 \u00bb\nd\u2019accueil des Marocains R\u00e9sidant \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration \u00ab Marhaba 2026 \u00bb d\u2019accueil des Marocains R\u00e9sidant \u00e0 l\u2019Etranger (MRE) prend fin, mardi \u00e0 minuit, dans les diff\u00e9rents espaces d\u2019accueil mis en place par la Fondation Mohammed V pour la Solidarit\u00e9 \u00e0 travers le Royaume et \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration Marhaba 2026, supervis\u00e9e par la Fondation Mohammed V pour la Solidarit\u00e9, s\u2019est achev\u00e9e apr\u00e8s plus de trois mois de mobilisation, avec l\u2019accueil de 4.137.594 Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), soit une hausse de 1,8% par rapport \u00e0 l\u2019\u00e9dition 2025. [www.lereporter.ma]\n-------------------------------------------------\nPlus de trois mois durant lesquels 4.137.594 Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger ont \u00e9t\u00e9 accueillis, soit une hausse de 1,8 % par rapport \u00e0 2025. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019op\u00e9ration Marhaba s\u2019est achev\u00e9e le 15 septembre avec 4 137 594 Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger accueillis depuis le 10 juin, soit une progression de 1,8% par rapport \u00e0 l\u2019\u00e9dition pr\u00e9c\u00e9dente. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Marine royale marocaine prendra\npossession, jeudi, du patrouilleur hauturier...", "mass": 5, "physics": false, "shape": "box", "title": "La Marine royale marocaine prendra possession, jeudi, du patrouilleur hauturier \u00abMoulay Hassan I\u00bb, construit par Navantia, sans c\u00e9r\u00e9monie officielle, en raison de la crise \u00e0 Ceuta. [www.yabiladi.com]\n-------------------------------------------------\nLa Marine royale marocaine a pris possession jeudi du patrouilleur hauturier Moulay Hassan I, construit par le chantier naval espagnol Navantia, sans c\u00e9r\u00e9monie officielle en raison de la crise entre le Maroc et l\u0027Espagne li\u00e9e \u00e0 Sebta. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c0 une semaine du scrutin\ndu 23 septembre, la comp\u00e9tition...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 une semaine du scrutin du 23 septembre, la comp\u00e9tition s\u2019intensifie dans les 16 circonscriptions locales de Casablanca-Settat. [www.lavieeco.com]\n-------------------------------------------------\nEntre forte densit\u00e9 de candidatures, poids des partis et ancrage territorial des candidats, la comp\u00e9tition s\u2019annonce particuli\u00e8rement disput\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Hakam Abdellatif Finances a franchi\n\u00e0 la baisse le seuil...", "mass": 5, "physics": false, "shape": "box", "title": "Hakam Abdellatif Finances a franchi \u00e0 la baisse le seuil de 10% dans le capital d\u2019Auto Hall, sous l\u2019effet de la dilution cons\u00e9cutive \u00e0 l\u2019augmentation de capital de la soci\u00e9t\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a annonc\u00e9, mardi, que Hakam Abdellatif Finances a d\u00e9clar\u00e9 avoir franchi directement \u00e0 la baisse, par un effet de dilution, le seuil de participation de 10% dans le capital d\u2019Auto Hall. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Ces nominations s\u2019inscrivent dans la\ncontinuit\u00e9 de la dynamique des...", "mass": 5, "physics": false, "shape": "box", "title": "Ces nominations s\u2019inscrivent dans la continuit\u00e9 de la dynamique des marques Renault et Dacia au Maroc et traduisent la volont\u00e9 de Renault Group de consolider leurs positions sur un march\u00e9 automobile en pleine \u00e9volution. [fr.hespress.com]\n-------------------------------------------------\nMehdi Yaroub est nomm\u00e9 Directeur G\u00e9n\u00e9ral de la marque Renault au Maroc \u00e0 compter du 1er octobr. [lematin.ma]\n-------------------------------------------------\nRenault Group Maroc a annonc\u00e9 deux nouvelles nominations au sein de ses activit\u00e9s commerciales, \u00e0 la t\u00eate des marques Renault et Dacia. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Des averses orageuses avec risque\nde gr\u00eale, rafales de vent...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale et rafales de vent sous orages (20-25 mm) toucheront, jeudi de 12H00 \u00e0 23H00, les provinces de Zagora, Tinghir, Ouarzazate, Azilal, Boule. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "N\u00e9 \u00e0 Beyrouth dans une\nfamille d\u2019artistes et install\u00e9 en...", "mass": 5, "physics": false, "shape": "box", "title": "N\u00e9 \u00e0 Beyrouth dans une famille d\u2019artistes et install\u00e9 en France d\u00e8s son enfance, Ibrahim Maalouf a d\u00e9velopp\u00e9 un langage musical singulier, nourri par sa formation classique autant. [lematin.ma]\n-------------------------------------------------\nLe trompettiste et compositeur franco-libanais Ibrahim Maalouf se produira au Th\u00e9\u00e2tre Royal de Rabat le mardi 22 septembre 2026 \u00e0 20h30, selon un communiqu\u00e9 publi\u00e9 le 17 septembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le UAE Moroccan Festival revient\n\u00e0 Casablanca pour une deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le UAE Moroccan Festival revient \u00e0 Casablanca pour une deuxi\u00e8me \u00e9dition plac\u00e9e sous le signe des courses hippiques de haut niveau. [lematin.ma]\n-------------------------------------------------\nOrganis\u00e9 par la Soci\u00e9t\u00e9 Royale d\u2019Encouragement du Cheval (SOREC) en partenariat avec le UAE President Cup Committee, l\u2019\u00e9v\u00e9nement illustre la coop\u00e9ration culturelle et sportive entre le Maroc et les \u00c9mirats Arabes Unis, deux nations r\u00e9unies par leur passion pour l\u2019univers \u00e9questre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La s\u00e9ance de cotation \u00e0\nla Bourse de Casablanca est...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9ance de cotation \u00e0 la Bourse de Casablanca est momentan\u00e9ment suspendue en raison d\u2019un incident technique survenu ce jeudi matin, a annonc\u00e9 la place casablancaise. [lematin.ma]\n-------------------------------------------------\nDans la foul\u00e9e, la Bourse de Casablanca a publi\u00e9 un communiqu\u00e9 et annonce qu\u2019elle \u00ab rassure l\u2019ensemble des intervenants du march\u00e9 et des investisseurs quant au suivi \u00e9troit de la situation, conform\u00e9ment aux proc\u00e9dures en. [telquel.ma]\n-------------------------------------------------\nLa Bourse de Casablanca a momentan\u00e9ment interrompu ses \u00e9changes jeudi, suite \u00e0 un incident technique survenu plus t\u00f4t dans la matin\u00e9e, a-t-elle annonc\u00e9 dans un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nUn incident technique survenu ce matin a contraint la Bourse de Casablanca \u00e0 suspendre momentan\u00e9ment sa s\u00e9ance de cotation. [www.lavieeco.com]\n-------------------------------------------------\nLa Bourse de Casablanca a annonc\u00e9 la suspension momentan\u00e9e de la s\u00e9ance de cotation de ce jeudi, en raison d\u2019un incident technique survenu dans la matin\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc et la Banque\nafricaine de d\u00e9veloppement (BAD) ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, jeudi \u00e0 Rabat, deux accords de financement d\u2019un montant total de 405 millions d\u2019euros (soit environ 4,4 milliards de dirhams) destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont conclu, jeudi \u00e0 Rabat, deux accords de financement cumulant 405 millions deuros. [www.yabiladi.com]\n-------------------------------------------------\nR\u00e9unis jeudi \u00e0 Rabat, le gouvernement marocain et la Banque africaine de d\u00e9veloppement ont paraph\u00e9 deux accords destin\u00e9s \u00e0 moderniser le rail et \u00e0 d\u00e9velopper les comp\u00e9tences professionnelles, pour un montant cumul\u00e9 de 405 millions d\u0027euros. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9 deux accords de financement d\u2019un montant total de 405 millions d\u2019euros destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les inf     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
