ovince de Safi ont annonc\u00e9 un nouveau bilan humain \u00e0 la hausse \u00e0 la suite des violentes pr\u00e9cipitations orageuses qui ont frapp\u00e9 la r\u00e9gion dans la soir\u00e9e du dimanche 14 d\u00e9cembre 2025, provoquant des crues soudaines et exceptionnelles en un laps de temps tr\u00e8s court. [fr.hespress.com]\n-------------------------------------------------\nLe bilan des pluies diluviennes et orageuses qui se sont abattues sur la province de Safi ce dimanche, provoquant des crues exceptionnelles en seulement une heure, est pass\u00e9 \u00e0 21 d\u00e9c\u00e8s, ont indiqu\u00e9 les autorit\u00e9s locales. [www.lopinion.ma]\n-------------------------------------------------\nSelon un bilan actualis\u00e9 des autorit\u00e9s locales, les pluies torrentielles sous orage, qui se sont abattues sur la province de Safi, ont fait 14 morts. [www.lavieeco.com]\n-------------------------------------------------\nLe bilan des pluies diluviennes et orageuses qui se sont abattues sur la province de Safi ce dimanche, provoquant des crues exceptionnelles en seulement une heure, est pass\u00e9 \u00e0 21 d\u00e9c\u00e8s, ont indiqu\u00e9 les autorit\u00e9s locales. [atlasinfo.fr]\n-------------------------------------------------\nLa Direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Safi a annonc\u00e9 la suspension des cours dans l\u2019ensemble des \u00e9tablissements scolaires de la province pour une dur\u00e9e de trois jours, en raison des mauvaises conditions m\u00e9t\u00e9orologiques. [telquel.ma]\n-------------------------------------------------\nLa Direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Safi a annonc\u00e9 la suspension des cours dans l\u2019ensemble des \u00e9tablissements scolaires de la province pour une dur\u00e9e de trois jours, en raison d\u2019inondations qui fait 37 morts. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La s\u00e9lection marocaine A\u2019 poursuit\nson parcours \u00e0 la Coupe...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine A\u2019 poursuit son parcours \u00e0 la Coupe arabe des nations (Qatar-2025) et disputera lundi 15 d\u00e9cembre une demi-finale d\u00e9cisive face aux \u00c9mirats arabes unis, au s. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection nationale marocaine de football A\u2019 est \u00e0 deux doigts d\u2019atteindre la finale de la Coupe Arabe, qui se d\u00e9roule jusqu\u2019au 18 d\u00e9cembre au Qatar, lorsqu\u2019elle affrontera, lundi, les \u00c9mirats arabes unis en demi-finale de cette comp\u00e9tition panarabe. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Au terme de cinq jours\nde projections de films, de...", "mass": 5, "physics": false, "shape": "box", "title": "Au terme de cinq jours de projections de films, de d\u00e9bats et d\u2019ateliers cin\u00e9matographiques, en pr\u00e9sence d\u2019un parterre d\u2019artistes et d\u2019universitaires du Maroc et de l\u2019\u00e9tranger, le p. [lematin.ma]\n-------------------------------------------------\nLe rideau est tomb\u00e9 samedi en fin de soir\u00e9e sur la 21\u00e8me \u00e9dition Festival international Cin\u00e9ma et Migrations d\u2019Agadir, avec la cons\u00e9cration du long m\u00e9trage \"La mer au loin\" qui a remport\u00e9 trois distinctions, dont le Grand Prix de cette manifestation. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le cavalier marocain, Hicham Chani\na d\u00e9croch\u00e9, dimanche, un deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le cavalier maroc     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
