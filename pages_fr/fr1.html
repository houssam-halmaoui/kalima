comm_label_9", "label": "Le ministre de l\u2019Int\u00e9rieur a\ntenu, ce jeudi 26 novembre,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur a tenu, ce jeudi 26 novembre, une deuxi\u00e8me r\u00e9union avec les responsables des partis politiques, dans le cadre des pr\u00e9paratifs des \u00e9lections pr\u00e9vues en 2027. [fr.hespress.com]\n-------------------------------------------------\nUne r\u00e9vision exceptionnelle des listes \u00e9lectorales g\u00e9n\u00e9rales et un r\u00e9examen des listes des chambres professionnelles figurent parmi les pistes discut\u00e9es jeudi 26 novembre entre le ministre de l\u2019Int\u00e9rieur et les partis politiques. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le ministre de l\u2019Am\u00e9nagement du\nterritoire national, de l\u2019Urbanisme, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, porte-parole du gouvernement, Samir Belfqih, a indiqu\u00e9 que le projet de d\u00e9cret relatif \u00e0 la classification des barrages, au suivi de leur s\u00e9curit\u00e9 et \u00e0 leur \u00e9valuation, adopt\u00e9 ce jeudi apr\u00e8s avoir \u00e9t\u00e9 report\u00e9 depuis f\u00e9vrier 2026, . [fr.hespress.com]\n-------------------------------------------------\nLe Conseil de gouvernement a adopt\u00e9, jeudi, le projet de d\u00e9cret n\u00b0 2.25.542 relatif \u00e0 la classification et \u00e0 l\u2019\u00e9valuation du niveau de s\u00e9curit\u00e9 des barrages, pr\u00e9sent\u00e9 par le minist. [lematin.ma]\n-------------------------------------------------\nLe projet de d\u00e9cret encadre aussi la surveillance des ouvrages, l\u2019\u00e9valuation des risques et la proc\u00e9dure \u00e0 suivre en cas de dysfonctionnement. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a adopt\u00e9, jeudi 26 novembre 2026 \u00e0 Rabat, un projet de d\u00e9cret encadrant la classification et l\u2019\u00e9valuation des barrages selon les risques potentiels. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil de gouvernement du 26 novembre a adopt\u00e9 le projet de d\u00e9cret n\u00b02.25.542 relatif \u00e0 la classification, \u00e0 la surveillance et \u00e0 l\u2019\u00e9valuation de la s\u00e9curit\u00e9 des barrages. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Les premi\u00e8res rencontres de concertation\navec les partenaires sociaux se...", "mass": 5, "physics": false, "shape": "box", "title": "Les premi\u00e8res rencontres de concertation avec les partenaires sociaux se sont d\u00e9roul\u00e9es dans un climat positif, selon la Cheffe du gouvernement Fatima Ezzahra El Mansouri. [lematin.ma]\n-------------------------------------------------\nLe dialogue social au Maroc a \u00e9t\u00e9 au centre d\u2019une d\u00e9claration de la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, jeudi \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a affirm\u00e9, jeudi \u00e0 Rabat, que les premi\u00e8res rencontres de concertation tenues par le gouvernement avec les centrales syndicales les plus repr\u00e9sentatives et les organisations professionnelles t\u00e9moignent de l\u0027ouverture de l\u0027Ex\u00e9cutif et de son souci d\u0027\u00eatre \u00e0 l\u0027\u00e9coute des diff\u00e9rents partenaires sociaux et professionnels. [leseco.ma]\n-------------------------------------------------\nLa Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, a affirm\u00e9, jeudi \u00e0 Rabat, que les premi\u00e8res rencontres de concertation tenues par le gouvernement avec les centrales syndicales les plus repr\u00e9sentatives et les organisations professionnelles t\u00e9moignent de l\u2019ouverture de l\u2019Ex\u00e9cutif et de son souci d\u2019\u00eatre \u00e0 l\u2019\u00e9coute des diff\u00e9rents partenaires sociaux et professionnels. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le groupe LabelVie a annonc\u00e9,\nle 26 novembre, l\u2019inauguration officielle...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe LabelVie a annonc\u00e9, le 26 novembre, l\u2019inauguration officielle d\u2019A\u00efn Seba\u00e2 Mall, un centre destin\u00e9 aux habitants de. [lematin.ma]\n-------------------------------------------------\nLe groupe LabelVie inaugure \u00e0 Casablanca un centre pens\u00e9 pour les habitants de A\u00efn Seba\u00e2 et des quartiers voisins. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "R\u00e9uni le 26 novembre 2026\nsous la pr\u00e9sidence de Moulay...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni le 26 novembre 2026 sous la pr\u00e9sidence de Moulay Hafid Elalamy, le conseil de surveillance de la banque a pris acte de la d\u00e9cision d\u2019Ahmed El Yacoubi de quitter la pr\u00e9sidence. [lematin.ma]\n-------------------------------------------------\nMoulay Mhamed Elalamy, directeur g\u00e9n\u00e9ral du Groupe Saham, prendra la pr\u00e9sidence du directoire de Saham Bank le 1er janvier 2027. [telquel.ma]\n-------------------------------------------------\nMoulay Mhamed Elalamy est nomm\u00e9 pr\u00e9sident du directoire de Saham Bank, \u00e0 compter du 1er janvier 2027, en remplacement d\u2019Ahmed El Yacoubi, qui int\u00e8gre le conseil de surveillance [www.challenge.ma]\n-------------------------------------------------\nDeux ans apr\u00e8s l\u2019entr\u00e9e du groupe Saham au capital de l\u2019ancienne Soci\u00e9t\u00e9 G\u00e9n\u00e9rale Maroc, la transition manag\u00e9riale arrive \u00e0 son terme. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de surveillance de Saham Bank, r\u00e9uni le 26 novembre 2026 sous la pr\u00e9sidence de Moulay Hafid Elalamy, a pris acte de la d\u00e9cision d\u2019Ahmed El Yacoubi de passer la main \u00e0 la t\u00eate du Directoire et de rejoindre le Conseil de surveillance. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Ce sont les trois usages\npr\u00e9vus pour InvestMOR, la plateforme...", "mass": 5, "physics": false, "shape": "box", "title": "Ce sont les trois usages pr\u00e9vus pour InvestMOR, la plateforme num\u00e9rique pr\u00e9sent\u00e9e par la Soci\u00e9t\u00e9 marocaine d\u2019ing\u00e9nierie touristique (SMIT) au Morocco Showcase Summit, \u00e0 Casablanca. [telquel.ma]\n-------------------------------------------------\nD\u00e9voil\u00e9e lors du Morocco Showcase Summit \u00e0 Casablanca, InvestMOR se veut une plateforme digitale d\u00e9di\u00e9e aux investisseurs touristiques et vise \u00e0 acc\u00e9l\u00e9rer le passage de l\u2019identification des opportunit\u00e9s \u00e0 la concr\u00e9tisation des projets. [www.lavieeco.com]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 marocaine d\u2019ing\u00e9nierie touristique (SMIT) a annonc\u00e9, jeudi 26 novembre \u00e0 Casablanca, le lancement prochain d\u2019InvestMOR, une plateforme num\u00e9rique destin\u00e9e \u00e0 faciliter l\u2019acc\u00e8s aux opportunit\u00e9s d\u2019investissement touristique au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "R\u00e9unies \u00e0 Rabat, les d\u00e9l\u00e9gations\nmilitaires marocaine et isra\u00e9lienne ont...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unies \u00e0 Rabat, les d\u00e9l\u00e9gations militaires marocaine et isra\u00e9lienne ont dress\u00e9 le bilan de leurs activit\u00e9s en 2026 et convenu d\u2019\u00e9laborer un nouveau plan de travail pour 2027. [telquel.ma]\n-------------------------------------------------\nLe Maroc et Isra\u00ebl sont convenus de pr\u00e9parer un plan d\u2019action militaire commun pour 2027, lors de discussions tenues mercredi 25 novembre au quartier g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR), \u00e0 Rabat, selon un communiqu\u00e9 des FAR. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "En ex\u00e9cution des instructions royales,\nle ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions royales, le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la cheffe du gouvernement charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale, Abdeltif Loudyi, a re\u00e7u, jeudi \u00e0 Rabat, le Congressman am\u00e9ricain (R\u00e9publicain), Abraham J. Hamadeh, membre des commissions des Forces Arm\u00e9es, en visite de travail au Royaume. [telquel.ma]\n-------------------------------------------------\nLes deux parties ont pass\u00e9 en revue la coop\u00e9ration bilat\u00e9rale, encadr\u00e9e depuis avril par la feuille de route 2026-2036. [www.lavieeco.com]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, le ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u, jeudi \u00e0 Rabat, le Congressman am\u00e9ricain (R\u00e9publicain), Abraham J. Hamadeh, membre des commissions des Forces Arm\u00e9es, en visite de travail au Royaume. [www.lereporter.ma]"}, {"borderWidth": e l\u2019Aspire Zone. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Dot\u00e9 d\u2019un budget global de\n11 millions d\u2019euros, le projet...", "mass": 5, "physics": false, "shape": "box", "title": "Dot\u00e9 d\u2019un budget global de 11 millions d\u2019euros, le projet Green Jobs, fruit de la coop\u00e9ration maroco-allemande, boucle huit ann\u00e9es d\u2019intervention aupr\u00e8s de l\u2019Agence nationale des eaux et for\u00eats (ANEF) en faveur de l\u2019entrepreneuriat vert et du d\u00e9veloppement \u00e9conomique des territoires ruraux et forestiers. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Agence nationale des eaux et for\u00eats (ANEF) et l\u2019Agence allemande de coop\u00e9ration internationale (GIZ) ont cl\u00f4tur\u00e9, jeudi \u00e0 Rabat, le projet \u00abGreen Jobs\u00bb, consacr\u00e9 \u00e0 la promotion de l\u2019emploi vert et au d\u00e9veloppement durable des territoires ruraux et forestiers. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Le Conseil de gouvernement a\nadopt\u00e9 trois projets de d\u00e9crets...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9 trois projets de d\u00e9crets portant d\u00e9l\u00e9gation de pouvoirs au ministre de l\u2019\u00c9conomie, des Finances et de la Performance publique pour l\u2019ann\u00e9e 2027. [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit budg\u00e9taire du Maroc s\u2019est \u00e9tabli \u00e0 46,7 milliards de dirhams \u00e0 fin octobre 2026, contre 60,3 milliards un an plus t\u00f4t, selon la situation des charges et ressources du Tr\u00e9sor publi\u00e9e par le minist\u00e8re de l\u2019\u00c9conomie, des Finances et de la Performance publique. [www.yabiladi.com]\n----     @media (hover: hover) and (pointer: fine) {
        #info-icon:hover + #tooltip {
            display: block;

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
