ons suivantes :Au niveau de...", "mass": 5, "physics": false, "shape": "box", "title": "Il a \u00e9t\u00e9 proc\u00e9d\u00e9 aux nominations suivantes :Au niveau de la primature - Agence nationale de r\u00e9glementation des t\u00e9l\u00e9communications (ANRT) :Abdelhamid Belmekki, directeur de l\u0027In. [lematin.ma]\n-------------------------------------------------\nAinsi, au niveau de l\u2019Agence nationale de r\u00e9glementation des t\u00e9l\u00e9communications (ANRT), M. Abdelhamid Belmekki a \u00e9t\u00e9 nomm\u00e9 directeur de l\u2019Institut national des Postes et T\u00e9l\u00e9communications (INPT), indique un communiqu\u00e9 du minist\u00e8re . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Son \u00e9tat de sant\u00e9 est\nbon, et il demeure actuellement...", "mass": 5, "physics": false, "shape": "box", "title": "Son \u00e9tat de sant\u00e9 est bon, et il demeure actuellement en observation pour la poursuite de ce bilan, a indiqu\u00e9 le club de Ligue 1 dans un communiqu\u00e9 m\u00e9dical.Affirmant qu. [lematin.ma]\n-------------------------------------------------\nL\u2019Olympique de Marseille (OM) a donn\u00e9, jeudi, des nouvelles rassurantes sur l\u2019\u00e9tat de sant\u00e9 de son milieu de terrain marocain Bilal Nadir, victime d\u2019un malaise survenu jeudi lors du match contre Angers. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u0027inauguration de ce premier vol\ninternational r\u00e9gulier vers la Cit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027inauguration de ce premier vol international r\u00e9gulier vers la Cit\u00e9 ocre marque une \u00e9tape majeure dans l\u0027\u00e9largissement de l\u2019offre a\u00e9rienne r\u00e9gionale et offre une nou. [lematin.ma]\n-------------------------------------------------\nUne nouvelle ligne directe reliant Deauville \u00e0 Marrakech vient d\u2019\u00eatre mise en service par la compagnie a\u00e9rienne Transavia France, dans le cadre d\u2019un partenariat avec l\u2019a\u00e9roport de Deauville-Normand. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Ce nouveau service permettra d\u2019\u00e9mettre\net recevoir des virements instantan\u00e9s,...", "mass": 5, "physics": false, "shape": "box", "title": "Ce nouveau service permettra d\u2019\u00e9mettre et recevoir des virements instantan\u00e9s, 24h/24 et 7j/7, vers et depuis n\u2019importe quel compte bancaire au Maroc. [lematin.ma]\n-------------------------------------------------\nLana Cash, premier \u00e9tablissement de paiement au Maroc \u00e0 lancer le virement instantan\u00e9. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0\nbord d\u2019un Boeing 737 MAX...", "mass": 5, "physics": false, "shape": "box", "title": "Cette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0 bord d\u2019un Boeing 737 MAX 8 de la compagnie polonaise LOT, \u00e0 raison de deux vols par semaine (mercredis et samedis), reliera l\u2019a\u00e9roport. [lematin.ma]\n-------------------------------------------------\nUne nouvelle liaison a\u00e9rienne entre Varsovie et Marrakech, assur\u00e9e par la compagnie a\u00e9rienne polonaise LOT, a \u00e9t\u00e9 lanc\u00e9e, mercredi, dans le cadre du d\u00e9veloppement du tourisme entre le Maroc et la Pologne. [telquel.ma]\n-------------------------------------------------\nCette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0 bord d\u2019un Boeing 737 MAX 8 de la compagnie polonaise, \u00e0 raison de deux vols par semaine (mercredis et samedis), reliera l\u2019a\u00e9roport Chopin de Varsovie et Marrakech Menara [www.la                         network.body.data.nodes.update({

                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
