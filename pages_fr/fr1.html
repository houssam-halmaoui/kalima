---------------------\nSans surprise, le bin\u00f4me form\u00e9 par Mehdi Tazi et Mohamed Bachiri prend les commandes de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc. [leseco.ma]\n-------------------------------------------------\nMehdi Tazi est port\u00e9 \u00e0 la pr\u00e9sidence de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises au Maroc (CGEM), au terme de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019organisation patronale tenue jeudi 14 [www.challenge.ma]\n-------------------------------------------------\nMehdi Tazi et Mohamed Bachiri ont \u00e9t\u00e9 \u00e9lus, jeudi \u00e0 Casablanca, respectivement Pr\u00e9sident et Vice-Pr\u00e9sident G\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), \u00e0 l\u2019issue d\u2019une Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective (AGOE). [atlasinfo.fr]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a \u00e9lu, jeudi \u00e0 Casablanca, Mehdi Tazi \u00e0 sa pr\u00e9sidence, aux c\u00f4t\u00e9s de Mohamed Bachiri en qualit\u00e9 de vice-pr\u00e9sident g\u00e9n\u00e9ral, \u00e0 l\u2019issue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective de l\u2019organisation patronale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Conseil de gouvernement a\nact\u00e9 le projet de d\u00e9cret...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a act\u00e9 le projet de d\u00e9cret n\u00b0 2.26.395 portant ouverture de cr\u00e9dits suppl\u00e9mentaires au profit du budget g\u00e9n\u00e9ral de l\u2019\u00c9tat, pr\u00e9sent\u00e9 par le ministre d\u00e9l\u00e9g. [lematin.ma]\n-------------------------------------------------\nCe projet de d\u00e9cret vise \u00e0 ouvrir des cr\u00e9dits suppl\u rection g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lavieeco.com]\n-------------------------------------------------\nDes chutes de neige et de fortes pluies sont pr\u00e9vues, vendredi et samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige et de fortes pluies sont pr\u00e9vues, vendredi et samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Entre 8 et 9 millions\nd\u2019ovins et de caprins seront...", "mass": 5, "physics": false, "shape": "box", "title": "Entre 8 et 9 millions d\u2019ovins et de caprins seront disponibles sur le march\u00e9 marocain pour l\u2019A\u00efd Al-Adha 1447, niveau sup\u00e9rieur \u00e0 la demande estim\u00e9e entre 6 et 7 millions de t\u00eates, selon le minist\u00e8re de l\u2019Agriculture, de la p\u00eache maritime, du d\u00e9veloppement rural et des eaux et for\u00eats. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 quelques semaines de l\u2019A\u00efd Al-Adha, le minist\u00e8re de l\u2019Agriculture rassure sur la disponibilit\u00e9 du cheptel et le bon \u00e9tat sanitaire des animaux destin\u00e9s au sacrifice. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019offre nationale d\u2019ovins et de caprins destin\u00e9s \u00e0 l\u2019A\u00efd Al-Adha 1447 H est estim\u00e9e entre 8 et 9 millions de t\u00eates, d\u00e9passant la demande qui est \u00e9valu\u00e9e entre 6 et 7 millions de t\u00eates, a assur\u00e9, jeudi, le minist\u00e8re de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats. [lnt.ma]"}, {"borderWidth": 3, "fixed": tr                 if (mutation.addedNodes.length) {

                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
