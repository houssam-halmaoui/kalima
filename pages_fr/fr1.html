ace et son engagement constant en faveur de la transparence financi\u00e8re. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Royaume du Maroc a\nofficiellement pris, mercredi, la pr\u00e9sidence...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a officiellement pris, mercredi, la pr\u00e9sidence du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5) pour la p\u00e9riode 2026-2028, \u00e0 l\u2019issue des travaux de la 11e Conf\u00e9rence minist\u00e9rielle dudit Groupe \u00e0 Rabat. [fr.hespress.com]\n-------------------------------------------------\nLe Royaume du Maroc a officiellement pris, ce mercredi, la pr\u00e9sidence du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5) pour la p\u00e9riode 2026-2028, \u00e0 l\u2019issue des travaux de la 11e Conf\u00e9rence minist\u00e9rielle dudit Groupe \u00e0 Rabat. [leseco.ma]\n-------------------------------------------------\nLes travaux de la 11e Conf\u00e9rence minist\u00e9rielle du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5), se sont ouverts, mercredi \u00e0 Rabat, en pr\u00e9sence des ministres et chefs de d\u00e9l\u00e9gation des pays membres du Groupe, ainsi que des repr\u00e9sentants de plusieurs organisations r\u00e9gionales et internationales partenaires. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Mus\u00e9e de la Photographie\net des Arts Visuels a...", "mass": 5, "physics": false, "shape": "box", "title": "Le Mus\u00e9e de la Photographie et des Arts Visuels a ouvert ses portes, mardi \u00e0 Casablanca, avec l\u2019exposition inaugurale CASA, une manifestation artistique qui propose une. [lematin.ma]\n----------------------------------------------- ns, Alexandre Morois, nouveau directeur g\u00e9n\u00e9ral de l\u2019Agence pour l\u2019enseignement fran\u00e7ais \u00e0 l\u2019\u00e9tranger (AEFE), a effectu\u00e9 sa premi\u00e8re visite officielle \u00e0 l\u2019\u00e9tranger au Maroc, les 23 et 24 juin 2026. [telquel.ma]\n-------------------------------------------------\nLe pays compte 44 \u00e9tablissements homologu\u00e9s accueillant pr\u00e8s de 49 000 \u00e9l\u00e8ves, constituant \u00abl\u2019un des r\u00e9seaux les plus importants et les plus dynamiques de l\u2019AEFE dans le monde\u00bb, selon un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nMoins de huit jours apr\u00e8s sa prise de fonctions, Alexandre Morois, nouveau Directeur g\u00e9n\u00e9ral de l\u0027Agence pour l\u0027enseignement fran\u00e7ais \u00e0 l\u0027\u00e9tranger (AEFE), a choisi le Maroc pour son premier d\u00e9placement \u00e0 l\u0027\u00e9tranger. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Conseil de l\u2019Universit\u00e9 Abdelmalek\nEssa\u00e2di, r\u00e9uni en session ordinaire...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de l\u2019Universit\u00e9 Abdelmalek Essa\u00e2di, r\u00e9uni en session ordinaire mardi \u00e0 Al Hoceima, a approuv\u00e9 le projet de cr\u00e9ation d\u2019une Facult\u00e9 d\u2019\u00e9conomie et de gestion au sein du complexe universitaire d\u2019A\u00eft Kamra, dans une d\u00e9marche visant \u00e0 d\u00e9velopper l\u2019offre p\u00e9dagogique et \u00e0 renforcer l\u2019ouverture de l\u2019universit\u00e9 sur son environnement socio-\u00e9conomique. [telquel.ma]\n-------------------------------------------------\nLe projet a \u00e9t\u00e9 approuv\u00e9 mardi par le Conseil de lUniversit\u00e9 Abdelmalek Essa\u00e2di, r\u00e9uni en session ordinaire. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Install\u00e9e depuis plus de deux\nd\u00e9cennies dans le calendrier sportif...", "mass": 5, "physics": false, "shape": "box", "title": "Install\u00e9e depuis plus de deux d\u00e9cennies dans le calendrier sportif national, la SNIM r\u00e9unira cette ann\u00e9e des \u00e9quipages marocains et \u00e9trangers. [telquel.ma]\n-------------------------------------------------\nInstall\u00e9e depuis plus de deux d\u00e9cennies dans le calendrier sportif national, la SNIM s\u2019affirme comme un rendez-vous nautique de r\u00e9f\u00e9rence au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La ministre du Tourisme, de\nl\u2019Artisanat et de l\u2019\u00c9conomie sociale...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, que le tourisme interne a enregistr\u00e9 plus de 4 millions de nuit\u00e9es au terme des cinq premiers mois de cette ann\u00e9e, en hausse de 2% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025.. [telquel.ma]\n-------------------------------------------------\nLa ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor, a affirm\u00e9, mardi \u00e0 la Chambre des conseillers, que le Maroc ambitionne d\u2019attirer 2,3 [www.challenge.ma]\n-------------------------------------------------\nLe Maroc ambitionne d\u2019attirer 2,3 millions de touristes d\u2019affaires et de congr\u00e8s d\u2019ici 2030, dans le cadre du d\u00e9veloppement du segment MICE, a indiqu\u00e9 la ministre du Tourisme, Fatim-Zahra Ammor. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Au             });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
