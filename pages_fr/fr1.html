 de la liaison...", "mass": 5, "physics": false, "shape": "box", "title": "Une c\u00e9r\u00e9monie officielle d\u2019accueil du vol inaugural de la liaison a\u00e9rienne Agadir-Helsinki a \u00e9t\u00e9 organis\u00e9e en pr\u00e9sence de plusieurs responsables et diplomates, dont l\u0027ambassadr. [lematin.ma]\n-------------------------------------------------\nUne nouvelle ligne a\u00e9rienne reliant Agadir et Helsinki, desservie par la compagnie finlandaise Finnair, a \u00e9t\u00e9 inaugur\u00e9e mercredi apr\u00e8s-midi \u00e0 l\u2019a\u00e9roport international d\u2019Agadir Al Massira. [telquel.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale finlandaise Finnair a repris, le 14 octobre, ses vols directs entre Helsinki et Agadir, signant son retour vers cette destination marocaine apr\u00e8s plusieurs ann\u00e9es d\u2019absence. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Office National des Chemins de\nFer (ONCF) et l\u2019Union Internationale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office National des Chemins de Fer (ONCF) et l\u2019Union Internationale des Chemins de fer (UIC) ont cl\u00f4tur\u00e9, ce jour \u00e0 Rabat, le Forum sur les solutions d\u2019investissement et de financement pour l\u2019avenir ferroviaire de l\u2019Afrique, organis\u00e9 les 14 et 15 octobre 2026 sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, Que Dieu. [telquel.ma]\n-------------------------------------------------\nL\u2019Office National des Chemins de Fer (ONCF) et l\u2019Union Internationale des Chemins de fer (UIC) ont cl\u00f4tur\u00e9, ce jour \u00e0 Rabat, le Forum sur les solutions d\u2019investissement et de financement pour l\u2019avenir ferroviaire de l\u2019Afrique, organis\u00e9 les 14 et 15 octobre 2026 sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le secteur automobile a maintenu\nen 2025 sa place de...", "mass": 5, "physics": false, "shape": "box", "title": "Le secteur automobile a maintenu en 2025 sa place de premier secteur exportateur pour la troisi\u00e8me ann\u00e9e cons\u00e9cutive, avec des exportations atteignant 159,2 milliards de dirhams (MMDH), selon l\u2019Office des Changes. [telquel.ma]\n-------------------------------------------------\nL\u2019Office des Changes a fait savoir que la position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, a affich\u00e9 une situation nette d\u00e9bitrice de 791,8 milliards de dirhams (MMDH) au terme de l\u2019ann\u00e9e 2025, en hausse de 81,1 MMDH par rapport \u00e0 2024. [fr.hespress.com]\n-------------------------------------------------\nAvec 159,2 MMDH, le secteur conserve sa place de leader pour la troisi\u00e8me ann\u00e9e cons\u00e9cutive, malgr\u00e9 un l\u00e9ger recul par rapport \u00e0 2024, selon l\u0027Office des Changes. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le roi Mohammed VI a\nadress\u00e9 un message de f\u00e9licitations...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des repr\u00e9sentants. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 M. Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des Repr\u00e9sentants. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
