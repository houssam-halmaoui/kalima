uxelles r\u00e9affirment leur ambition d\u2019un partenariat strat\u00e9gique renforc\u00e9. [www.libe.ma]\n-------------------------------------------------\nLa Belgique \u00e9tend sa pr\u00e9sence consulaire au Maroc et annonce une strat\u00e9gie d\u2019accompagnement \u00e9conomique dans les provinces du Sud. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le pr\u00e9sident am\u00e9ricain Donald Trump\na affirm\u00e9 mardi que la...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident am\u00e9ricain Donald Trump a affirm\u00e9 mardi que la fen\u00eatre diplomatique avec l\u2019Iran \u00e9tait d\u00e9sormais close, annon\u00e7ant la poursuite de la campagne militaire am\u00e9ricaine malgr\u00e9 des signaux d\u2019ouverture \u00e9voqu\u00e9s par T\u00e9h\u00e9ran. [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain, Donald Trump, a d\u00e9clar\u00e9 mardi avoir refus\u00e9 de discuter avec les autorit\u00e9s iraniennes, estimant qu\u2019il \u00e9tait \u00ab trop tard \u00bb pour le faire, apr\u00e8s des mois de n\u00e9gociations infructueuses et quatre jours d\u2019offensive militaire. [atlasinfo.fr]\n-------------------------------------------------\nParti pour durer quatre \u00e0 cinq semaines, selon le pr\u00e9sident am\u00e9ricain Donald Trump, l\u2019escalade militaire entre les \u00c9tats-Unis, Isra\u00ebl et l\u2019Iran livre plusieurs enseignements strat\u00e9giques majeurs pour le Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "R\u00e9unie mardi \u00e0 Rabat, la\nCommission Royale charg\u00e9e du p\u00e8lerinage...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unie mardi \u00e0 Rabat, la Commission Royale charg\u00e9e du p\u00e8lerinage a ent\u00e9rin\u00e9 le co\u00fbt d\u00e9finitif du Hajj au titre de la saison 1447H. [lematin.ma]\n-------------------------------------------------\nLe ministre des Habous et des Affaires islamiques, Ahmed Toufiq a indiqu\u00e9, mardi \u00e0 Rabat, que les frais d\u00e9finitifs du Hajj au titre de la saison 1447H pour les p\u00e8lerins encadr\u00e9s par le minist\u00e8re des Habous et des Affaires islamiques, ont \u00e9t\u00e9 fix\u00e9s \u00e0 63.021 dirhams. [aujourdhui.ma]\n-------------------------------------------------\nLe ministre des Habous et des Affaires islamiques, Ahmed Toufiq a indiqu\u00e9, mardi \u00e0 Rabat, que les frais d\u00e9finitifs du Hajj au titre de la saison 1447H pour les p\u00e8lerins encadr\u00e9s par le minist\u00e8re des Habous et des Affaires islamiques, ont \u00e9t\u00e9 fix\u00e9s \u00e0 63.021 dirhams. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Habous et des Affaires islamiques, Ahmed Toufiq, a annonc\u00e9, mardi \u00e0 Rabat, que les frais d\u00e9finitifs du Hajj au titre de la saison 1447 de l\u2019H\u00e9gire ont \u00e9t\u00e9 fix\u00e9s \u00e0 63.021 dirhams pour les p\u00e8lerins relevant de l\u2019organisation officielle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019Agence nationale des eaux et\nfor\u00eats (ANEF) affirme qu\u2019aucune campagne...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des eaux et for\u00eats (ANEF) affirme qu\u2019aucune campagne d\u2019abattage massif d\u2019arbres n\u2019est men\u00e9e dans la for\u00eat de la Ma\u00e2mora. [lematin.ma]\n-------------------------------------------------\nLes travaux en cours dans certains p\u00e9rim\u00e8tres de la for\u00eat de la Ma\u00e2mora consistent exclusivement en des op\u00e9rations de nettoiement et de s\u00e9curisation faisant suite aux r\u00e9centes intemp\u00e9ries, a affirm\u00e9 l\u2019Agence Nationale des Eaux et For\u00eats (ANEF), r\u00e9futant toute op\u00e9ration d\u2019abattage massif d\u2019arbres. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La startup marocaine Weego, sp\u00e9cialis\u00e9e\ndans la mobilit\u00e9 innovante, annonce...", "mass": 5, "physics": false, "shape": "box", "title": "La startup marocaine Weego, sp\u00e9cialis\u00e9e dans la mobilit\u00e9 innovante, annonce une lev\u00e9e de 1,1 million de dollars aupr\u00e8s d\u2019Azur Innovation Fund. [lematin.ma]\n-------------------------------------------------\nCe financement vise \u00e0 acc\u00e9l\u00e9rer le d\u00e9ploiement de sa plateforme au Maroc, \u00e0 renforcer son offre \u00e0 destination des entreprises et \u00e0 pr\u00e9parer son expansion vers d\u2019autres march\u00e9s . [lnt.ma]\n-------------------------------------------------\nLa startup Weego, fond\u00e9e par Saad Jittou et Mor Niane, annonce avoir boucl\u00e9 une lev\u00e9e de fonds de 1,1 million de dollars aupr\u00e8s d\u2019Azur Innovation Fund. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Plac\u00e9e sous le parrainage du\nMinist\u00e8re de l\u2019\u00c9conomie, de la...", "mass": 5, "physics": false, "shape": "box", "title": "Plac\u00e9e sous le parrainage du Minist\u00e8re de l\u2019\u00c9conomie, de la Planification et de l\u2019Am\u00e9nagement du Territoire du Cameroun, l\u2019\u00e9dition 2026 de SUFAWE a marqu\u00e9 une \u00e9tape strat\u00e9gique dan. [lematin.ma]\n-------------------------------------------------\nLe Club Afrique D\u00e9veloppement du groupe Attijariwafa bank et la Soci\u00e9t\u00e9 Commerciale de Banque (SCB Cameroun) ont organis\u00e9, r\u00e9cemment \u00e0 Douala, la quatri\u00e8me \u00e9dition du programme Stand Up [www.challenge.ma]\n-------------------------------------------------\nLe Club Afrique D\u00e9veloppement du groupe Attijariwafa bank et la Soci\u00e9t\u00e9 Commerciale de Banque Cameroun (SCB Cameroun) ont organis\u00e9 les 26 et 27 f\u00e9vrier 2026, la quatri\u00e8me \u00e9dition de la mission multisectorielle du programme Stand Up For African Women Entrepreneurs (SUFAWE), autour du th\u00e8me \u00ab Connecter, Commercer, Cro\u00eetre \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLe Club Afrique D\u00e9veloppement (CAD) du groupe Attijariwafa bank, en partenariat avec la Soci\u00e9t\u00e9 Commerciale de Banque Cameroun (SCB Cameroun), a organis\u00e9 les 26 et 27 f\u00e9vrier 2026 \u00e0 Douala la quatri\u00e8me \u00e9dition de la mission multisectorielle du programme Stand Up For African Women Entrepreneurs (SUFAWE), plac\u00e9e sous le th\u00e8me \u00ab Connecter, Commercer, Cro\u00eetre \u00bb . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019encours global des cr\u00e9dits bancaires\ns\u2019est \u00e9tabli \u00e0 1.228 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019encours global des cr\u00e9dits bancaires s\u2019est \u00e9tabli \u00e0 1.228 milliards de dirhams \u00e0 fin janvier 2026, selon les derni\u00e8res statistiques publi\u00e9es par Bank Al-Maghrib. [lematin.ma]\n-------------------------------------------------\nL\u0027encours du cr\u00e9dit bancaire s\u0027est \u00e9tabli \u00e0 fin janvier 2026 \u00e0 1.228,6 milliards de dirhams (MMDH), enregistrant une hausse de 8,4% par rapport \u00e0 janvier 2025, selon Bank Al-Maghrib (BAM). [leseco.ma]\n-------------------------------------------------\nFinancement : Selon Bank Al-Maghrib, la dynamique du cr\u00e9dit bancaire au secteur non financier s\u2019acc\u00e8l\u00e8re en ce d\u00e9but d\u2019ann\u00e9e. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size":                 if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
