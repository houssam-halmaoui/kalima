rue, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Ce projet port\u00e9 par l\u2019Institut\nfran\u00e7ais du Maroc via son...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet port\u00e9 par l\u2019Institut fran\u00e7ais du Maroc via son antenne de Marrakech a permis de r\u00e9unir de nombreuses personnalit\u00e9s fran\u00e7aises et marocaines du monde de la culture, de la. [lematin.ma]\n-------------------------------------------------\nL\u2019Ambassadeur de France au Maroc, Philippe Lalliot, a inaugur\u00e9 ce samedi 3 octobre avec la Directrice g\u00e9n\u00e9rale de l\u2019Institut fran\u00e7ais du Maroc, Chlo\u00e9 Goupille, et la directrice de son antenne de Marrakech, Flora Boillot, le nouvel espace mus\u00e9al permanent de la Maison Denise Masson, d\u00e9di\u00e9 \u00e0 la vie, \u00e0 l\u2019\u0153uvre et \u00e0 l\u2019h\u00e9ritage intellectuel de cette figure singuli\u00e8re du dialogue entre la France et le Maroc. [leseco.ma]\n-------------------------------------------------\nL\u2019ambassadeur de France au Maroc, Philippe Lalliot, a inaugur\u00e9 ce samedi un nouvel espace mus\u00e9al permanent \u00e0 la Maison Denise Masson, en compagnie de Chlo\u00e9 Goupille, Directrice g\u00e9n\u00e9rale de l\u2019Institut fran\u00e7ais du Maroc, et Flora Boillot, directrice de son antenne \u00e0 Marrakech. [atlasinfo.fr]\n-------------------------------------------------\nH\u00e9ritage Un nouvel espace mus\u00e9al permanent de la Maison Denise Masson a \u00e9t\u00e9 inaugur\u00e9 r\u00e9cemment \u00e0 Marrakech, consacr\u00e9 \u00e0 la vie, \u00e0 l\u2019\u0153uvre et \u00e0 l\u2019h\u00e9ritage intellectuel de cette figure du dialogue entre la France et le Maroc. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019Office et GNV ont conclu\n\u00e0 Rabat un accord couvrant...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office et GNV ont conclu \u00e0 Rabat un accord couvrant les trois prochaines ann\u00e9es, e. [lematin.ma]\n-------------------------------------------------\nL\u2019Office national marocain du tourisme (ONMT) a annonc\u00e9, lundi, la signature d\u2019un accord avec la compagnie maritime italienne GNV visant \u00e0 d\u00e9velopper les flux touristiques entre l\u2019Italie et le Maroc. [telquel.ma]\n-------------------------------------------------\nL\u2019ONMT et la compagnie maritime italienne GNV ont conclu un partenariat de trois ans pour renforcer la promotion du Maroc et d\u00e9velopper les flux maritimes vers le Royaume, avec l\u2019objectif d\u2019atteindre 350.000 passagers au d\u00e9part du march\u00e9 italien. [www.lavieeco.com]\n-------------------------------------------------\nLundi 5 octobre, l\u2019Office national marocain du tourisme (ONMT) a annonc\u00e9 la signature d\u2019un partenariat de trois ans avec la compagnie maritime italienne Grandi Navi Veloci (GNV), filiale du groupe de transport maritime MSC. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) a annonc\u00e9, lundi, la signature d\u2019un accord avec la compagnie maritime italienne GNV visant \u00e0 d\u00e9velopper les flux touristiques entre l\u2019Italie et le Maroc. \u00ab [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Bank Al-Maghrib et la Banque\ncentrale des \u00c9mirats arabes unis...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib et la Banque centrale des \u00c9mirats arabes unis (CBUAE) ont sign\u00e9 deux m\u00e9morandums d\u2019entente visant \u00e0 renforcer leur coop\u00e9ration dans les domaines de la supervision b. [lematin.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) et la Banque centrale des \u00c9mirats arabes unis (CBUAE) ont sign\u00e9 deux m\u00e9morandums d\u2019entente visant \u00e0 renforcer la coop\u00e9ration dans les domaines de la supervision bancaire et de la finance islamique, ainsi qu\u2019\u00e0 interconnecter les syst\u00e8mes de paiement et de messagerie financi\u00e8re. [telquel.ma]\n-------------------------------------------------\nBank Al-Maghrib et la Banque centrale des \u00c9mirats arabes unis ont conclu deux protocoles daccord pour renforcer la surveillance bancaire et la coop\u00e9ration en finance islamique, tout en explorant des passerelles entre leurs syst\u00e8mes financiers. [www.yabiladi.com]\n-------------------------------------------------\nIls visent \u00e0 renforcer la coop\u00e9ration bilat\u00e9rale et \u00e0 am\u00e9liorer l\u2019efficacit\u00e9 des transactions financi\u00e8res transfrontali\u00e8res entre les deux pays. [www.lavieeco.com]\n-------------------------------------------------\nBank Al-Maghrib (BAM) et la Banque centrale des \u00c9mirats arabes unis (CBUAE) ont sign\u00e9 deux m\u00e9morandums d\u2019entente visant \u00e0 renforcer la coop\u00e9ration dans les domaines de la supervision bancaire et de la finance islamique, ainsi qu\u2019\u00e0 interconnecter les syst\u00e8mes de paiement et de messagerie financi\u00e8re. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Une nouvelle \u00e9tude intitul\u00e9e \u00ab\nLes r\u00e9seaux sociaux et la...", "mass": 5, "physics": false, "shape": "box", "title": "Une nouvelle \u00e9tude intitul\u00e9e \u00ab Les r\u00e9seaux sociaux et la communication politique : entre opportunit\u00e9s d\u2019influence et risques de d\u00e9sinformation \u00bb, vient d\u2019\u00eatre publi\u00e9e par le groupe de travail \u00ab R\u00e9gulation et m\u00e9dias num\u00e9riques \u00bb de la Haute autorit\u00e9 de la communication audiovisuelle (HACA). [telquel.ma]\n-------------------------------------------------\nLe groupe de travail \u00ab R\u00e9gulation et m\u00e9dias num\u00e9riques \u00bb de la Haute Autorit\u00e9 de la Communication Audiovisuelle (HACA), dirig\u00e9 par Mme Narjis Rerhaye, a d\u00e9voil\u00e9 ce lundi une \u00e9tude approfondie et in\u00e9dite intitul\u00e9e \u00ab Les r\u00e9seaux sociaux et la communication politique : entre opportunit\u00e9s d\u2019influence et risques de d\u00e9sinformation \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Front des Forces D\u00e9mocratiques\n(FFD), le Parti de l\u2019\u00c9quit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Front des Forces D\u00e9mocratiques (FFD), le Parti de l\u2019\u00c9quit\u00e9 (PE), le Parti des N\u00e9o-D\u00e9mocrates (PND) et le Parti de l\u2019Unit\u00e9 et de la D\u00e9mocratie (PUD) ont annonc\u00e9 la formation d\u2019un groupement parlementaire commun \u00e0 la Chambre des repr\u00e9sentants, au regard des r\u00e9sultats des derni\u00e8res \u00e9lections l\u00e9gislatives. [telquel.ma]\n-------------------------------------------------\nLe Front des Forces D\u00e9mocratiques (FFD), le Parti de l\u2019\u00c9quit\u00e9 (PE), le Parti des N\u00e9o-D\u00e9mocrates (PND) et le Parti de l\u2019Unit\u00e9 et de la D\u00e9mocratie (PUD) ont annonc\u00e9 la cr\u00e9ation d\u2019un groupement parlementaire commun \u00e0 la Chambre des repr\u00e9sentants. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le pr\u00e9sident du gouvernement espagnol,\nPedro S\u00e1nchez, a annonc\u00e9 lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du gouvernement espagnol, Pedro S\u00e1nchez, a annonc\u00e9 lundi la convocation d\u2019\u00e9lections l\u00e9gislatives anticip\u00e9es le 29 novembre prochain, apr\u00e8s le rejet vendredi par le Congr\u00e8s de mesures pr\u00e9sent\u00e9es par son gouvernement pour r\u00e9pondre \u00e0 la crise du logement. [telquel.ma]\n-------------------------------------------------\nLe Premier ministre espagnol Pedro S\u00e1nchez a annonc\u00e9 des \u00e9lections l\u00e9gislatives anticip\u00e9es pour le 29 novembre, apr\u00e8s le rejet par le Congr\u00e8s des d\u00e9put\u00e9s de la tentative de son gouvernement de g\u00e9rer la crise du logement, sur fond de vastes manifestations. [www.yabiladi.com]\n-------------------------------------------------\nLa d\u00e9cision intervient trois jours apr\u00e8s le rejet au Congr\u00e8s de deux d\u00e9crets consacr\u00e9s au logement, sur fond de mobilisation contre la hausse des loyers et les . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le nombre d\u2019entreprises cr\u00e9\u00e9es au\nMaroc s\u2019est \u00e9tabli \u00e0 60.908...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre d\u2019entreprises cr\u00e9\u00e9es au Maroc s\u2019est \u00e9tabli \u00e0 60.908 unit\u00e9s au terme des sept premiers mois de 2026, selon l\u2019Office marocain de la propri\u00e9t\u00e9 industrielle et commerciale (OMPIC). [telquel.ma]\n-------------------------------------------------\nLe nombre d\u2019entreprises cr\u00e9\u00e9es au Maroc s\u2019est \u00e9tabli \u00e0 60.908 unit\u00e9s au terme des sept premiers mois de 2026, selon l\u2019Office marocain de la propri\u00e9t\u00e9 industrielle et commerciale (OMPIC). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Selon le Haut-Commissariat au Plan\n(HCP), l\u2019indice des valeurs unitaires...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le Haut-Commissariat au Plan (HCP), l\u2019indice des valeurs unitaires \u00e0 limportation du Maroc a augment\u00e9 de 10 % au deuxi\u00e8me trimestre 2026, tandis que celui des exportations a progress\u00e9 de 10,9 %. [www.yabiladi.com]\n-------------------------------------------------\nLes indices des valeurs unitaires \u00e0 l\u2019importation et \u00e0 l\u2019exportation ont augment\u00e9 respectivement de 10% et 10,9% durant le deuxi\u00e8me trimestre de 2026, selon le Haut-Commissariat au Plan (HCP). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Monde maritime : Isem Alumni,\nAssociation des laur\u00e9ats de l\u2019Institut...", "mass": 5, "physics": false, "shape": "box", "title": "Monde maritime : Isem Alumni, Association des laur\u00e9ats de l\u2019Institut sup\u00e9rieur d\u2019\u00e9tudes maritimes, poursuit son engagement en faveur de la culture maritime \u00e0 travers un programme de sensibilisation destin\u00e9 aux jeunes, et ce \u00e0 l\u2019occasion de sa participation au Forum de la Mer d\u2019El Jadida, qui s\u2019est tenu du 1er au 4 octobre 2026. [aujourdhui.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de sa participation au Forum de la Mer d\u2019El Jadida, qui s\u2019est tenu du 1er au 4 octobre 2026, l\u2019association ISEM ALUMNI (Association des Laur\u00e9ats de l\u2019Institut Sup\u00e9rieur d\u2019\u00c9tudes Maritimes) a d\u00e9ploy\u00e9 son concept \u2018\u2018 Classe Bleue\u2019\u2019 en vue de rapprocher les jeunes du monde maritime. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Abdellatif Ma\u00e2zouz a indiqu\u00e9 lors\nde la session ordinaire d\u0027octobre...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Ma\u00e2zouz a indiqu\u00e9 lors de la session ordinaire d\u0027octobre du Conseil de la r\u00e9gion de Casablanca-Settat un taux de mise en \u0153uvre de 96% et une enveloppe globale         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');

        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
