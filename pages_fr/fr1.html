 "Maroc | Lancement de la...", "shape": "dot", "size": 47, "title": "Maroc | Lancement de la 8\u00e8me \u00e9dition du Marrakech Airshow (MAS) 2026\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/maroc-lancement-de-la-8eme-edition-du-marrakech-airshow-mas-2026/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 10, "id": 253, "label": "Le Maroc veut passer d\u2019acheteur...", "shape": "dot", "size": 47, "title": "Le Maroc veut passer d\u2019acheteur \u00e0 producteur d\u2019armement\nSource: lnt.ma", "url": "https://lnt.ma/le-maroc-veut-passer-dacheteur-a-producteur-darmement/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 12, "id": 254, "label": "Cinq accords sign\u00e9s \u00e0 l\u2019ouverture...", "shape": "dot", "size": 59, "title": "Cinq accords sign\u00e9s \u00e0 l\u2019ouverture du Marrakech Air Show\nSource: lnt.ma", "url": "https://lnt.ma/cinq-accords-signes-a-louverture-du-marrakech-air-show/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9\nde ramener, \u00e0 partir du...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9 de ramener, \u00e0 partir du 1er octobre 2026, \u00e0 0,5 % le plafond de la commission per\u00e7ue par les banques et les \u00e9tablissements de paiement lors des transactions effectu\u00e9es par carte bancaire marocaine sur le territoire national. [fr.hespress.com]\n-------------------------------------------------\nBank Al-Maghrib (BAM) a d\u00e9cid\u00e9 de ramener, \u00e0 partir du 1er octobre 2026, \u00e0 0,5 % le plafond de la commission per\u00e7ue par les banques et les \u00e9tablissements de paiement lors des transactions effectu\u00e9es par carte bancaire marocaine sur le territoire national. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Ce stage sera ponctu\u00e9 de\ndeux matchs amicaux face \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Ce stage sera ponctu\u00e9 de deux matchs amicaux face \u00e0 l\u2019Ouzb\u00e9kistan les 09 et 12 octobre, indique mercredi la F\u00e9d\u00e9ration royale marocaine de football (FRMF) . [fr.hespress.com]\n-------------------------------------------------\nLe nouveau s\u00e9lectionneur de l\u2019\u00e9quipe nationale f\u00e9minine \u00ab A \u00bb, le Fran\u00e7ais Eric Blahic, a convoqu\u00e9 31 joueuses pour un stage de pr\u00e9paration qui se d\u00e9roule au Complexe Mohammed VI de football. [telquel.ma]\n-------------------------------------------------\nLe Fran\u00e7ais Eric Blahic, nouveau s\u00e9lectionneur de l\u2019\u00e9quipe nationale f\u00e9minine \u00ab A \u00bb du Maroc, a convoqu\u00e9 31 joueuses pour un stage de pr\u00e9paration au Complexe Mohammed VI de football, \u00e0 Ma\u00e2mora. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c0 l\u2019occasion de la 8\u1d49\n\u00e9dition du Salon a\u00e9ronautique de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la 8\u1d49 \u00e9dition du Salon a\u00e9ronautique de Marrakech, le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du chef du gouvernement charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale, Abdeltif Loudyi, a d\u00e9clar\u00e9 que le secteur de l\u2019a\u00e9ronautique et de l\u2019espace \u00ab est devenu un levier . [fr.hespress.com]\n-------------------------------------------------\nLe secteur a\u00e9ronautique marocain a franchi un saut qualitatif, passant de l\u2019assemblage \u00e0 la fabrication et \u00e0 l\u2019ing\u00e9nierie avanc\u00e9e, a affirm\u00e9 mercredi \u00e0 Marrakech Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, \u00e0 l\u2019ouverture de la 8e \u00e9dition du Marrakech Airshow. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale a pr\u00e9sent\u00e9 \u00e0 l\u2019ouverture du salon de Marrakech l\u2019industrie a\u00e9ronautique nationale comme le socle d\u2019une base industrielle de d\u00e9fense en construction. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Apr\u00e8s les consultations men\u00e9es par\nson premier secr\u00e9taire, Driss Lachgar,...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s les consultations men\u00e9es par son premier secr\u00e9taire, Driss Lachgar, avec la Cheffe de gouvernement nomm\u00e9e, Fatima-Zahra El Mansouri, le bureau politique du parti a d\u00e9gag\u00e9 une orientation g\u00e9n\u00e9rale favorable \u00e0 la participation, sans toutefois trancher d\u00e9finitivement. [fr.hespress.com]\n-------------------------------------------------\nDes informations obtenues par TelQuel Arabi r\u00e9v\u00e8lent une partie des d\u00e9tails de la rencontre qui a r\u00e9uni, dimanche 4 octobre au soir, Fatima Ezzahra El Mansouri, cheffe du gouvernement d\u00e9sign\u00e9e et charg\u00e9e de le former, et Nizar Baraka, secr\u00e9taire g\u00e9n\u00e9ral du parti de l\u2019Istiqlal, dans le cadre du deuxi\u00e8me tour des consultations pour la constitution. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 et de la Protection sociale a appel\u00e9, mercredi, les familles \u00e0 compl\u00e9ter la vaccination de leurs enfants et a confirm\u00e9 la disponibilit\u00e9 des vaccins inscrits dans le cadre du Programme national d\u2019immunisation (PNI). [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale a lanc\u00e9, mercredi, un appel aux familles pour quelles ach\u00e8vent la vaccination de leurs enfants, affirmant que les vaccins sont disponibles gr\u00e2ce au programme national dimmunisation. [www.yabiladi.com]\n-------------------------------------------------\nIl assure que les vaccins pr\u00e9vus dans le cadre du Programme national d\u2019immunisation sont disponibles en quantit\u00e9s suffisantes et administr\u00e9s gratuitement. [www.lavieeco.com]\n-------------------------------------------------\nDans un communiqu\u00e9, il exhorte les parents \u00e0 v\u00e9rifier que leurs enfants ont re\u00e7u l\u2019ensemble des doses pr\u00e9vues par le calendrier national L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale a appel\u00e9, mercredi, les familles \u00e0 compl\u00e9ter la vaccination de leurs enfants et a confirm\u00e9 la disponibilit\u00e9 des vaccins inscrits dans le cadre du Programme national d\u2019immunisation (PNI). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Royal Air Maroc (RAM) \u00e9quipera\n41 de ses appareils avec...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc (RAM) \u00e9quipera 41 de ses appareils avec la solution de connectivit\u00e9 haut d\u00e9bit Starlink, accessible gratuitement \u00e0 l\u2019ensemble des adh\u00e9rents au programme Safar Flyer. [telquel.ma]\n-------------------------------------------------\nRoyal Air Maroc va doter 41 de ses appareils du Wi-Fi haut d\u00e9bit sign\u00e9 Starlink, avec des installations pr\u00e9vues d\u00e8s le d\u00e9but de 2027, a annonc\u00e9 la compagnie le 7 octobre. [www.yabiladi.com]\n-------------------------------------------------\nAccessible gratuitement \u00e0 l\u2019ensemble des adh\u00e9rents au programme Safar Flyer, ce service constitue une avanc\u00e9e majeure dans la refonte de l\u2019exp\u00e9rience passager. [leseco.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) \u00e9quipera 41 de ses appareils avec la solution de connectivit\u00e9 haut d\u00e9bit Starlink, accessible gratuitement \u00e0 l\u2019ensemble des adh\u00e9rents au programme Safar Flyer, une avanc\u00e9e majeure dans la refonte de l\u2019exp\u00e9rience passager qui fera de la compagnie nationale la premi\u00e8re du continent africain \u00e0 proposer une connexion ultra-rapide et ininterrompue, rendue . [lnt.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) \u00e9quipera 41 de ses appareils avec la solution de connectivit\u00e9 haut d\u00e9bit Starlink, accessible gratuitement \u00e0 l\u2019ensemble des adh\u00e9rents au programme Safar Flyer, une avanc\u00e9e majeure dans la refonte de l\u2019exp\u00e9rience passager qui fera de la compagnie nationale la premi\u00e8re du continent africain \u00e0 proposer une connexion ultra-rapide et ininterrompue, rendue . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Comit\u00e9 central du Parti\ndu Progr\u00e8s et du Socialisme...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 central du Parti du Progr\u00e8s et du Socialisme (PPS) a mandat\u00e9, \u00e0 l\u2019unanimit\u00e9, le bureau politique du parti afin de g\u00e9rer la prochaine \u00e9tape relative aux consultations en vue de former le gouvernement. [telquel.ma]\n-------------------------------------------------\nLe Comit\u00e9 central du Parti du Progr\u00e8s et du Socialisme (PPS) a mandat\u00e9, \u00e0 l\u2019unanimit\u00e9, le bureau poli ion de projets afin de contribuer \u00e0 la mise en place d\u2019une infrastructure gazi\u00e8re s\u00fbre, fiable et durable au service des ambitions \u00e9nerg\u00e9tiques et industrielles du S\u00e9n\u00e9gal. [leseco.ma]\n-------------------------------------------------\nLa filiale du groupe OCP, JESA, acteur majeur dans la livraison de projets et fournisseur de solutions int\u00e9gr\u00e9es au Maroc et en Afrique, accompagne le R\u00e9seau gazier du S\u00e9n\u00e9gal S.A. (RGS), filiale de Petrosen Holding, dans le d\u00e9veloppement et la pr\u00e9paration \u00e0 l\u2019exploitation du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le d\u00e9ploiement sera amorc\u00e9 au\nd\u00e9but de l\u2019ann\u00e9e 2027, avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9ploiement sera amorc\u00e9 au d\u00e9but de l\u2019ann\u00e9e 2027, avec une mont\u00e9e en puissance progressive sur l\u2019ensemble de la flotte, afin de garantir une continuit\u00e9 op\u00e9rationnelle optimale. [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ploiement sera amorc\u00e9 au d\u00e9but de l\u2019ann\u00e9e 2027, avec une mont\u00e9e en puissance progressive sur l\u2019ensemble de la flotte, afin de garantir une continuit\u00e9 op\u00e9rationnelle optimale.. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u0027Institut fran\u00e7ais du Maroc a\nlanc\u00e9 le mardi 6 octobre...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027Institut fran\u00e7ais du Maroc a lanc\u00e9 le mardi 6 octobre sa nouvelle saison culturelle 2026-2027 consacr\u00e9e \u00e0 l\u0027innovation. [leseco.ma]\n-------------------------------------------------\nL\u2019i                                 scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
