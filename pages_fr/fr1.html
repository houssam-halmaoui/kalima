resse \u00e0 la Maison-Blanche en pr\u00e9sence du chancelier allemand Friedrich Mertz, son intention de \u00abcesser tout commerce avec lEspagne\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLe Premier ministre espagnol Pedro S\u00e1nchez a r\u00e9affirm\u00e9 mercredi son opposition \u00e0 la guerre au Moyen-Orient, r\u00e9pondant directement aux critiques et aux menaces commerciales du pr\u00e9sident am\u00e9ricain Donald Trump. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le joueur a repris les\ns\u00e9ances individuelles \u00e0 la suite...", "mass": 5, "physics": false, "shape": "box", "title": "Le joueur a repris les s\u00e9ances individuelles \u00e0 la suite de l\u2019op\u00e9ration chirurgicale qu\u2019il a subie \u00e0 la fin du mois de janvier, avec l\u2019objectif de retrouver rapidement la comp\u00e9tition. [fr.hespress.com]\n-------------------------------------------------\nL\u2019international marocain Sofyan Amrabat a annonc\u00e9 \u00eatre pr\u00eat \u00e0 retrouver les terrains apr\u00e8s une p\u00e9riode de convalescence supervis\u00e9e par son club, le Real Betis, et l\u2019intervention chirurgicale qu\u2019il a subie \u00e0 l\u2019issue de la 35\u1d49 \u00e9dition de la Coupe d\u2019Afrique des nations. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Au lendemain d\u2019un week-end marqu\u00e9\npar une mont\u00e9e brutale des...", "mass": 5, "physics": false, "shape": "box", "title": "Au lendemain d\u2019un week-end marqu\u00e9 par une mont\u00e9e brutale des tensions g\u00e9opolitiques au Moyen-Orient, le Maroc suit de pr\u00e8s l\u2019\u00e9volution de la situation et ses \u00e9ventuelles r\u00e9percussi. [lematin.ma]\n-------------------------------------------------\nFace \u00e0 l\u2019escalade des tensions g\u00e9opolitiques au Moyen-Orient, le Maroc pourrait subir des r\u00e9percussions \u00e9conomiques indirectes mais significatives. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le seuil minimal exig\u00e9 pour\nl\u0027obtention d\u0027un visa \u00e9tudiant passera...", "mass": 5, "physics": false, "shape": "box", "title": "Le seuil minimal exig\u00e9 pour l\u0027obtention d\u0027un visa \u00e9tudiant passera de 835 \u00e0 1.050 euros par mois, \u00e9crit le journal n\u00e9erlandophone, citant la ministre f\u00e9d\u00e9rale belge de l#3. [lematin.ma]\n-------------------------------------------------\nLes \u00e9tudiants non europ\u00e9ens qui souhaitent poursuivre des \u00e9tudes en Belgique devront justifier de ressources financi\u00e8res plus \u00e9lev\u00e9es \u00e0 partir de la prochaine rentr\u00e9e acad\u00e9mique, rapporte mercredi le quotidien belge \u00ab Laatste Nieuws \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le sort de la Coupe\nd\u2019Afrique f\u00e9minine 2026 reste envelopp\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le sort de la Coupe d\u2019Afrique f\u00e9minine 2026 reste envelopp\u00e9 de brouillard \u00e0 quelques jours seulement du coup d\u2019envoi officiel. [lematin.ma]\n-------------------------------------------------\nL\u2019envol\u00e9e des cours du brut de p\u00e9trole, d\u00e9passant d\u00e9j\u00e0 les hypoth\u00e8ses de la Loi de finances 2026, fait peser un risque imm\u00e9diat sur les \u00e9quilibres macro\u00e9conomiques et le pouvoir d\u2019achat au Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "R\u00e9unie mardi \u00e0 Rabat, la\nCommission Royale charg\u00e9e du p\u00e8lerinage...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unie mardi \u00e0 Rabat, la Commission Royale charg\u00e9e du p\u00e8lerinage a ent\u00e9rin\u00e9 le co\u00fbt d\u00e9finitif du Hajj au titre de la saison 1447H. [lematin.ma]\n-------------------------------------------------\nLe ministre des Habous et des Affaires islamiques, Ahmed Toufiq a indiqu\u00e9, mardi \u00e0 Rabat, que les frais d\u00e9finitifs du Hajj au titre de la saison 1447H pour les p\u00e8lerins encadr\u00e9s par le minist\u00e8re des Habous et des Affaires islamiques, ont \u00e9t\u00e9 fix\u00e9s \u00e0 63.021 dirhams. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Habous et des Affaires islamiques, Ahmed Toufiq, a annonc\u00e9, mardi \u00e0 Rabat, que les frais d\u00e9finitifs du Hajj au titre de la saison 1447 de l\u2019H\u00e9gire ont \u00e9t\u00e9 fix\u00e9s \u00e0 63.021 dirhams pour les p\u00e8lerins relevant de l\u2019organisation officielle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La startup marocaine Weego, sp\u00e9cialis\u00e9e\ndans la mobilit\u00e9 innovante, annonce...", "mass": 5, "physics": false, "shape": "box", "title": "La startup marocaine Weego, sp\u00e9cialis\u00e9e dans la mobilit\u00e9 innovante, annonce une lev\u00e9e de 1,1 million de dollars aupr\u00e8s d\u2019Azur Innovation Fund. [lematin.ma]\n-------------------------------------------------\nLa startup Weego, fond\u00e9e par Saad Jittou et Mor Niane, annonce avoir boucl\u00e9 une lev\u00e9e de fonds de 1,1 million de dollars aupr\u00e8s d\u2019Azur Innovation Fund. [leseco.ma]\n-------------------------------------------------\nCe financement vise \u00e0 acc\u00e9l\u00e9rer le d\u00e9ploiement de sa plateforme au Maroc, \u00e0 renforcer son offre \u00e0 destination des entreprises et \u00e0 pr\u00e9parer son expansion vers d\u2019autres march\u00e9s . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Plac\u00e9e sous le parrainage du\nMinist\u00e8re de l\u2019\u00c9conomie, de la...", "mass": 5, "physics": false, "shape": "box", "title": "Plac\u00e9e sous le parrainage du Minist\u00e8re de l\u2019\u00c9conomie, de la Planification et de l\u2019Am\u00e9nagement du Territoire du Cameroun, l\u2019\u00e9dition 2026 de SUFAWE a marqu\u00e9 une \u00e9tape strat\u00e9gique dan. [lematin.ma]\n-------------------------------------------------\nLe Club Afrique D\u00e9veloppement du groupe Attijariwafa bank et la Soci\u00e9t\u00e9 Commerciale de Banque (SCB Cameroun) ont organis\u00e9, r\u00e9cemment \u00e0 Douala, la quatri\u00e8me \u00e9dition du programme Stand Up [www.challenge.ma]\n-------------------------------------------------\nLe Club Afrique D\u00e9veloppement (CAD) du groupe Attijariwafa bank, en partenariat avec la Soci\u00e9t\u00e9 Commerciale de Banque Cameroun (SCB Cameroun), a organis\u00e9 les 26 et 27 f\u00e9vrier 2026 \u00e0 Douala la quatri\u00e8me \u00e9dition de la mission multisectorielle du programme Stand Up For African Women Entrepreneurs (SUFAWE), plac\u00e9e sous le th\u00e8me \u00ab Connecter, Commercer, Cro\u00eetre \u00bb . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019encours global des cr\u00e9dits bancaires\ns\u2019est \u00e9tabli \u00e0 1.228 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019encours global des cr\u00e9dits bancaires s\u2019est \u00e9tabli \u00e0 1.228 milliards de dirhams \u00e0 fin janvier 2026, selon les derni\u00e8res statistiques publi\u00e9es par Bank Al-Maghrib. [lematin.ma]\n-------------------------------------------------\nFinancement : Selon Bank Al-Maghrib, la dynamique du cr\u00e9dit bancaire au secteur non financier s\u2019acc\u00e8l\u00e8re en ce d\u00e9but d\u2019ann\u00e9e. [aujourdhui.ma]\n-------------------------------------------------\nL\u0027encours du cr\u00e9dit bancaire s\u0027est \u00e9tabli \u00e0 fin janvier 2026 \u00e0 1.228,6 milliards de dirhams (MMDH), enregistrant une hausse de 8,4% par rapport \u00e0 janvier 2025, selon Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le pr\u00e9sident Donald Trump a\nd\u00e9clar\u00e9 que la marine am\u00e9ricaine...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident Donald Trump a d\u00e9clar\u00e9 que la marine am\u00e9ricaine pourrait escorter des p\u00e9troliers \u00ab si n\u00e9cessaire \u00bb \u00e0 travers le d\u00e9troit d\u2019Ormuz, paralys\u00e9 depuis le d\u00e9but de l\u2019offensive militaire contre l\u2019Iran. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident Donald Trump a d\u00e9clar\u00e9 que la marine am\u00e9ricaine pourrait escorter des p\u00e9troliers \u00ab si n\u00e9cessaire \u00bb \u00e0 travers le d\u00e9troit d\u2019Ormuz, paralys\u00e9 depuis le d\u00e9but de l\u2019offensive militaire contre l\u2019Iran. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Faisant suite \u00e0 la d\u00e9cision\nprise la veille de suspendre...", "mass": 5, "physics": false, "shape": "box", "title": "Faisant suite \u00e0 la d\u00e9cision prise la veille de suspendre la production de gaz naturel liqu\u00e9fi\u00e9 (GNL) et des produits connexes, \u00ab QatarEnergy proc\u00e9dera \u00e0 l\u2019arr\u00eat de la production de certains. [telquel.ma]\n-------------------------------------------------\nDans un communiqu\u00e9, la soci\u00e9t\u00e9 a indiqu\u00e9 que cette d\u00e9cision intervient apr\u00e8s l\u2019arr\u00eat de la production de GNL ainsi que de produits connexes, notamment l\u2019ur\u00e9e, les polym\u00e8res, le m\u00e9t. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des frappes isra\u00e9lo-am\u00e9ricaines ont vis\u00e9\nmardi en Iran le b\u00e2timent...", "mass": 5, "physics": false, "shape": "box", "title": "Des frappes isra\u00e9lo-am\u00e9ricaines ont vis\u00e9 mardi en Iran le b\u00e2timent abritant l\u2019institution charg\u00e9e d\u2019\u00e9lire un nouveau guide supr\u00eame pour succ\u00e9der \u00e0 l\u2019ayatollah Ali Khamenei tu\u00e9 au premier jour de. [telquel.ma]\n-------------------------------------------------\nL\u2019Iran a d\u00e9cid\u00e9 mercredi de reporter les obs\u00e8ques nationales pour le guide supr\u00eame Ali Khamenei, initialement pr\u00e9vues dans la soir\u00e9e \u00e0 T\u00e9h\u00e9ran, alors que le pays fait face depuis cinq jours \u00e0 des frappes isra\u00e9lo-am\u00e9ricaines. [fr.hespress.com]\n-------------------------------------------------\nL\u2019Iran a d\u00e9cid\u00e9 mercredi de reporter les obs\u00e8ques nationales pour le guide supr\u00eame Ali Khamenei, initialement pr\u00e9vues dans la soir\u00e9e \u00e0 T\u00e9h\u00e9ran, alors que le pays fait face depuis cinq jours \u00e0 des frappes isra\u00e9lo-am\u00e9ricaines. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Sous la direction de Mohamed\nBouzoubaa, TGCC signe une ann\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Sous la direction de Mohamed Bouzoubaa, TGCC signe une ann\u00e9e 2025 record avec un produit d\u2019exploitation de 12,4 milliards de dirhams, en hausse de 53,9% par rapport \u00e0 2024. [telquel.ma]\n-------------------------------------------------\nLe \u00abBook Club Le Matin\u00bb a donn\u00e9 le coup d\u2019envoi de son programme culturel sp\u00e9cial Ramadan par une soir\u00e9e consacr\u00e9e \u00e0 la po\u00e9sie, organis\u00e9e \u00e0 l\u2019h\u00f4tel Sofitel \u00e0 Rabat. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les dix-sept consulats g\u00e9n\u00e9raux du\nRoyaume du Maroc en France...", "mass": 5, "physics": false, "shape": "box", "title": "Les dix-sept consulats g\u00e9n\u00e9raux du Royaume du Maroc en France organiseront, les 7 et 14 mars, des journ\u00e9es portes ouvertes au profit des membres de la communaut\u00e9 marocaine \u00e9tablie en France, en vue de leur permettre de retirer leurs documents consulaires sans prise de rendez-vous pr\u00e9alable. [telquel.ma]\n-------------------------------------------------\nLe Consulat g\u00e9n\u00e9ral du Royaume du Maroc \u00e0 Paris a r\u00e9cemment organis\u00e9 une exposition en hommage aux soldats marocains ayant combattu durant les Premi\u00e8re et Seconde Guerres mondiales, en reconnaissance de leurs sacrifices et de leur contribution \u00e0 la d\u00e9fense des valeurs de libert\u00e9 et de paix. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 partir du 28 f\u00e9vrier,\nCasabus op\u00e9r\u00e9 par Alsa a...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 partir du 28 f\u00e9vrier, Casabus op\u00e9r\u00e9 par Alsa a mis en place un renforcement de son offre de transport en soir\u00e9e durant le mois de Ramadan. [telquel.ma]\n-------------------------------------------------\nUne augmentation de plus de 50% de l\u2019offre Casabus op\u00e9r\u00e9 par Alsa annonce le renforcement de son offre de transport apr\u00e8s le ftour du Ramadan, avec une augmentation de 50% \u00e0 partir du 28 f\u00e9vrier, afin de r\u00e9pondre \u00e0 la demande accrue des citoyens durant les soir\u00e9es du mois sacr\u00e9. [aujourdhui.ma]\n-------------------------------------------------\nUne augmentation de plus de 50 % de l\u2019offre en soir\u00e9e est d\u00e9ploy\u00e9e sur 13 lignes strat\u00e9giques du r\u00e9seau \u00e0 partir du 28 f\u00e9vrier pour garantir une mobilit\u00e9 fluide et accessible aux Casablancaises et aux Casablancais apr\u00e8s la rupture du je\u00fbne [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u2019arm\u00e9e am\u00e9ricaine a frapp\u00e9 plus\nde 1.250 cibles dans les...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019arm\u00e9e am\u00e9ricaine a frapp\u00e9 plus de 1.250 cibles dans les premi\u00e8res 48 heures de son op\u00e9ration visant l\u2019Iran, a annonc\u00e9 lundi le Commandement militaire am\u00e9ricain pour le Moyen-Orient (Centcom). [telquel.ma]\n-------------------------------------------------\nParti pour durer quatre \u00e0 cinq semaines, selon le pr\u00e9sident am\u00e9ricain Donald Trump, l\u2019escalade militaire entre les \u00c9tats-Unis, Isra\u00ebl et l\u2019Iran livre plusieurs enseignements strat\u00e9giques majeurs pour le Maroc. [leseco.ma]\n-------------------------------------------------\nPlus de 9.000 Am\u00e9ricains ont quitt\u00e9 le Moyen-Orient depuis le d\u00e9but de l\u2019offensive am\u00e9ricaine contre l\u2019Iran, craignant notamment les attaques et tirs de missiles iraniens, selon le d\u00e9partement d\u2019\u00c9tat am\u00e9ricain. [www.lereporter.ma]\n-------------------------------------------------\nL\u2019Iran a de nouveau \u00e9t\u00e9 la cible de frappes militaires d\u2019envergure dans la nuit de lundi \u00e0 mardi, alors que le conflit qui l\u2019oppose \u00e0 Isra\u00ebl et aux \u00c9tats-Unis continue de s\u2019intensifier au Moyen-Orient. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Conseil de la r\u00e9gion\nF\u00e8s-Mekn\u00e8s a approuv\u00e9, lor         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }

                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
