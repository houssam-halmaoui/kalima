label": "Industrie : 41% de parit\u00e9\nau Maroc et progression des...", "mass": 5, "physics": false, "shape": "box", "title": "Industrie : 41% de parit\u00e9 au Maroc et progression des femmes dans les emplois qualifi\u00e9s (\u00e9tude). [lematin.ma]\n-------------------------------------------------\nLe secteur industriel marocain s\u2019illustre par une dynamique d\u2019int\u00e9gration f\u00e9minine remarquable, avec un taux de parit\u00e9 global s\u2019\u00e9tablissant \u00e0 41%, ressort-il d\u2019une \u00e9tude pr\u00e9sent\u00e9e lors de la premi\u00e8re \u00e9dition de la Journ\u00e9e Internationale des Femmes dans l\u2019Industrie. [telquel.ma]\n-------------------------------------------------\nLe secteur industriel marocain s\u0027illustre par une dynamique d\u0027int\u00e9gration f\u00e9minine remarquable, avec un taux de parit\u00e9 global s\u0027\u00e9tablissant \u00e0 41%, ressort-il d\u0027une \u00e9tude pr\u00e9sent\u00e9e lors de la premi\u00e8re \u00e9dition de la Journ\u00e9e Internationale des Femmes dans l\u2019Industrie. [leseco.ma]\n-------------------------------------------------\n\u2014 \u00c0 l\u2019occasion de la premi\u00e8re \u00e9dition de la Journ\u00e9e internationale des Femmes dans l\u2019Industrie, le 21 avril 2026 en partenariat avec l\u2019ONUDI , une \u00e9tude r\u00e9v\u00e8le que le taux de parit\u00e9 global dans le secteur industriel marocain atteint 41 %. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La France marque sa pr\u00e9sence\n\u00e0 la 18e \u00e9dition du...", "mass": 5, "physics": false, "shape": "box", "title": "La France marque sa pr\u00e9sence \u00e0 la 18e \u00e9dition du Salon international de l\u2019agriculture au Maroc (SIAM), qui se tient du 20 au 28 avril 2026 \u00e0 Mekn\u00e8s, avec un Pavillon d\u00e9di\u00e9 au sein. [lematin.ma]\n-------------------------------------------------\nLa r\u00e9union du comit\u00e9 mixte agricole Maroc-France, qui s\u2019est tenue mardi \u00e0 Mekn\u00e8s lors de la 18\u1d49 \u00e9dition du Salon International de l\u2019Agriculture au Maroc (SIAM), a insuffl\u00e9 un nouvel \u00e9lan \u00e0 un partenariat d\u2019exception, ax\u00e9 sur le d\u00e9veloppement de syst\u00e8mes agricoles durables et r\u00e9silients. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la 18\u1d49 \u00e9dition du Salon International de l\u2019Agriculture au Maroc, organis\u00e9e du 20 au 28 avril 2026 \u00e0 Mekn\u00e8s, le Royaume du Maroc met \u00e0 l\u2019honneur la R\u00e9publique Portugaise, en reconnaissance de la qualit\u00e9 et de la profondeur des relations de coop\u00e9ration entre les deux pays, notamment dans les domaines agricole et agroalimentaire. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Du 25 au 27 juin,\nla cit\u00e9 des aliz\u00e9s accueille...", "mass": 5, "physics": false, "shape": "box", "title": "Du 25 au 27 juin, la cit\u00e9 des aliz\u00e9s accueille la 27\u00e8me \u00e9dition du Festival Gnaoua et Musiques du Monde. [telquel.ma]\n-------------------------------------------------\nLa 27e \u00e9dition du Festival gnaoua et musiques du monde se tiendra du 25 au 27 juin 2026 \u00e0 Essaouira, rassemblant plus de 400 artistes dont 42 ma\u00e2lems. [www.yabiladi.com]\n-------------------------------------------------\nDerri\u00e8re le Festival Gnaoua et Musiques du Monde, sa productrice Neila Tazi d\u00e9fend une ville pens\u00e9e pour l\u2019ouverture, une culture n\u00e9e du mouvement et un projet devenu au fil du temps une \u00ab infrastructure culturelle immat\u00e9rielle \u00bb o\u00f9 la musique circule, relie, se transforme, se d\u00e9place. [www.lavieeco.com]\n-------------------------------------------------\nDu 25 au 27 juin 2026, la ville d\u2019Essaouira accueillera une nouvelle \u00e9dition du Festival Gnaoua et Musiques du Monde d\u2019Essaouira, rendez-vous d\u00e9sormais install\u00e9 dans le paysage culturel marocain et international. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019indice des prix \u00e0 la\nconsommation (IPC) a enregistr\u00e9, en...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en mars dernier, une hausse de 0,9% comparativement au m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nCette \u00e9volution est la cons\u00e9quence de l\u0027augmentation de l\u0027indice des produits alimentaires de 0,6% et de celui des produits non alimentaires de 1,1%, explique le HCP dans une note d\u0027information relative \u00e0 l\u0027IPC de mars 2026. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en mars dernier, une hausse de 0,9% comparativement au m\u00eame mois de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nL\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en mars dernier, une hausse de 0,9% comparativement au m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Pratt \u0026 Whitney Canada, une\nactivit\u00e9 de RTX, leader mondial...", "mass": 5, "physics": false, "shape": "box", "title": "Pratt \u0026 Whitney Canada, une activit\u00e9 de RTX, leader mondial dans la conception, la fabrication et la maintenance de moteurs d\u201  p\u00f4le de la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale. [telquel.ma]\n-------------------------------------------------\nLe Directeur G\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire, Abdellatif Hammouchi, a effectu\u00e9, les 20 et 21 avril, une visite de travail dans le Royaume de Su\u00e8de \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation s\u00e9curitaire compos\u00e9e de cadres et de responsables repr\u00e9sentant le p\u00f4le de la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du\nchef du gouvernement charg\u00e9 des...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du chef du gouvernement charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas, a indiqu\u00e9 que les donn\u00e9es du rapport annuel au titre de l\u2019ann\u00e9e 2024 mettent en \u00e9vidence l\u2019ampleur du financement public destin\u00e9 aux associations, qui avoisine cinq milliards de dirhams (5.698.735.273,14), et dont ont b\u00e9n\u00e9fici\u00e9 environ 17.015. [telquel.ma]\n-------------------------------------------------\nLe montant du financement public accord\u00e9 en 2024 aux associations a d\u00e9pass\u00e9 5,6 milliards de dirhams (MMDH), a annonc\u00e9, mardi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le texte de loi a\nre\u00e7u lapprobation de 20 conseillers,...", "mass": 5, "physics": false, "shape": "box", "title": "Le texte de loi a re\u00e7u lapprobation de 20 conseillers, tandis qu\u2019un seul s\u2019y est oppos\u00e9 et 11 autres se sont abstenus. [www.yabiladi.com]\n-------------------------------------------------\nLe texte a re\u00e7u l\u0027approbation de 20 conseillers, tandis qu\u2019un seul s\u2019y est oppos\u00e9 et 11 autres se sont abstenus. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "La ministre fran\u00e7aise de l\u0027Agriculture,\nde l\u0027Agroalimentaire et de la...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre fran\u00e7aise de l\u0027Agriculture, de l\u0027Agroalimentaire et de la Souverainet\u00e9 alimentaire, Annie Genevard, a salu\u00e9, mardi \u00e0 Mekn\u00e8s, les avanc\u00e9es r\u00e9alis\u00e9es par le Maroc dans le cadre de la strat\u00e9gie \"G\u00e9n\u00e9ration Green\" 2020-2030. [www.lavieeco.com]\n-------------------------------------------------\nLa ministre fran\u00e7aise de l\u2019Agriculture, de l\u2019Agroalimentaire et de la Souverainet\u00e9 alimentaire, Annie Genevard, a salu\u00e9, mardi \u00e0 Mekn\u00e8s, les avanc\u00e9es r\u00e9alis\u00e9es par le Maroc dans le cadre de la strat\u00e9gie \u201cG\u00e9n\u00e9ration Green\u201d 2020-2030. [www.lereporter.ma]\n-------------------------------------------------\nEn marge de la 18\u1d49 \u00e9dition du SIAM, le Comit\u00e9 mixte agricole Maroc-France s\u2019est r\u00e9uni le 21 avril 2026 \u00e0 Mekn\u00e8s, sous la copr\u00e9sidence de M. Ahmed El Bouari, ministre de l\u2019Agriculture, et de Mme Annie Genevard, ministre de l\u2019Agriculture, de l\u2019Agroalimentaire et de la Souverainet\u00e9 alimentaire de la R\u00e9publique fran\u00e7aise. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La Conf\u00e9d\u00e9ration des syndicats des\npharmaciens du Maroc interpelle le...", "mass": 5, "physics":  des Eaux et For\u00eats, Ahmed El Bouari. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a particip\u00e9 mardi \u00e0 la session extraordinaire du Conseil de la Ligue des \u00c9tats arabes au niveau minist\u00e9riel, tenue par visioconf\u00e9rence, et consacr\u00e9e aux attaques iraniennes ill\u00e9gales contre des Etats arabes. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a particip\u00e9 mardi \u00e0 la session extraordinaire du Conseil de la Ligue des \u00c9tats arabes au niveau minist\u00e9riel, tenue par visioconf\u00e9rence, et consacr\u00e9e aux attaques iraniennes ill\u00e9gales contre des Etats arabes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "\u00c0 l\u2019occasion de la 18e\n\u00e9dition du Salon International de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la 18e \u00e9dition du Salon International de l\u2019Agriculture au Maroc, qui se tient \u00e0 Mekn\u00e8s du 20 au 28 avril, le Groupe OCP pr\u00e9sente un dispositif construit autour d\u2019un fil conducteur unique : la mol\u00e9cule de phosphore, lue comme lien entre la mine, les sols, les cultures, l\u2019alimentation animale et les territoires. [lnt.ma]\n-------------------------------------------------\nAu c\u0153ur du Salon International de l\u2019Agriculture au Maroc \u00e0 Mekn\u00e8s, le groupe Zine Capital Invest s\u2019impose comme l\u2019un des acteurs les plus dynamiques du paysage agroalimentaire national. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Une participation inaugurale qui traduit\nla volont\u00e9 de l\u2019Office de...", "mass": 5, "physics": false, "shape": "box", "title": "Une participation inaugurale qui traduit la volont\u00e9 de l\u2019Office de mettre en lumi\u00e8re le r\u00f4le strat\u00e9gique des coop\u00e9ratives dans le d\u00e9veloppement du secteur agricole marocain. [lnt.ma]\n-------------------------------------------------\nCette participation inaugurale, indique un communiqu\u00e9 de l\u2019Office, s\u2019inscrit dans une volont\u00e9 affirm\u00e9e de mettre en exergue la place strat\u00e9gique des coop\u00e9ratives dans le d\u00e9veloppement agricole national, en particulier dans un contexte o\u00f9 les enjeux li\u00e9s . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Au SIAM, Maroc Telecom met\nen avant plusieurs solutions destin\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "Au SIAM, Maroc Telecom met en avant plusieurs solutions destin\u00e9es \u00e0 accompagner la transformation num\u00e9rique du secteur agricole, dans le cadre d\u2019une pr\u00e9sence ax\u00e9e sur l\u2019innovation technologique, la connectivit\u00e9 rurale et les services financiers digitaux. [lnt.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du SIAM 2026 \u00e0 Mekn\u00e8s, Maroc Telecom met en avant des solutions digitales innovantes d\u00e9di\u00e9es au secteur agricole. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le pr\u00e9sident fran\u00e7ais, Emmanuel Macron,\na                         if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
