 "Plus de 90 % des\njeunes de la r\u00e9gion Casablanca-Settat...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 90 % des jeunes de la r\u00e9gion Casablanca-Settat consid\u00e8rent la culture comme un levier essentiel de d\u00e9veloppement personnel et r\u00e9gional, selon les r\u00e9sultats d\u2019une enqu\u00eate pr\u00e9sent\u00e9e samedi \u00e0 Bouznika par le pr\u00e9sident de l\u2019Association des \u00c9tudes et Recherches pour le D\u00e9veloppement (AERD), Driss Guerraoui. [lnt.ma]\n-------------------------------------------------\nPlus de 90% des jeunes de la r\u00e9gion Casablanca-Settat consid\u00e8rent la culture comme un levier essentiel de d\u00e9veloppement personnel et r\u00e9gional, a r\u00e9v\u00e9l\u00e9, samedi \u00e0 Bouznika, le pr\u00e9sident de l\u2019Association des \u00e9tudes et recherches pour le d\u00e9veloppement (AERD), Driss Guerraoui. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc, sous la conduite\n\u00e9clair\u00e9e du Roi Mohammed VI,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc, sous la conduite \u00e9clair\u00e9e du Roi Mohammed VI, a connu une transformation industrielle profonde au cours des deux derni\u00e8res d\u00e9cennies, a affirm\u00e9, dimanche \u00e0 Riyad, le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [fr.hespress.com]\n-------------------------------------------------\nLors de la 21e Conf\u00e9rence g\u00e9n\u00e9rale de l\u2019ONUDI, le ministre de l\u2019Industrie, M. Mezzour, a pr\u00e9sent\u00e9 les progr\u00e8s du Maroc dans les secteurs industriels, notamment automobile et a\u00e9ronautique, tout en soulignant le r\u00f4le cl\u00e9 de l\u2019innovation et de la coop\u00e9ration internationale pour un d\u00e9veloppement industriel durable. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc, sous la conduite du roi Mohammed VI, a connu une transformation industrielle profonde au cours des deux derni\u00e8res d\u00e9cennies, a affirm\u00e9, dimanche \u00e0 Riyad, le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [telquel.ma]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9, sous l\u2019impulsion du Roi Mohammed VI, une transformation industrielle majeure au cours des deux derni\u00e8res d\u00e9cennies, a affirm\u00e9 dimanche \u00e0 Riyad le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019international marocain, Youssef En-Nesyri, a\ncontribu\u00e9 dimanche \u00e0 la large...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019international marocain, Youssef En-Nesyri, a contribu\u00e9 dimanche \u00e0 la large victoire de son \u00e9quipe, Fenerbah\u00e7e, en d\u00e9placement contre Rizespor (5-2), pour le compte de la 13e journ\u00e9e du championnat turc de football (S\u00fcper Lig). [fr.hespress.com]\n-------------------------------------------------\nYoussef En-Nesyri a marqu\u00e9 le 4e but de la rencontre \u00e0 la 78e min apr\u00e8s une passe d\u00e9cisive de son co\u00e9quipier Dorgeles Nene, offrant \u00e0 son club une avance confortable sur son advers. [lematin.ma]\n-------------------------------------------------\nLinternational marocain, Youssef En-Nesyri, a contribu\u00e9 dimanche \u00e0 la large victoire de son \u00e9quipe, Fenerbah\u00e7e, en d\u00e9placement contre Rizespor (5-2), pour le compte de la 13e journ\u00e9e du championnat turc de football (S\u00fcper Lig). [www.yabiladi.com]\n-------------------------------------------------\nL\u2019international marocain, Youssef En-Nesyri, a contribu\u00e9 dimanche \u00e0 la large victoire de son \u00e9quipe, Fenerbah\u00e7e, en d\u00e9placement contre Rizespor (5-2), pour le compte de la 13e journ\u00e9e du c     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {

                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
