.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La troisi\u00e8me et derni\u00e8re phase\nde vente des billets des...", "mass": 5, "physics": false, "shape": "box", "title": "La troisi\u00e8me et derni\u00e8re phase de vente des billets des matchs de la Coupe d\u2019Afrique des Nations 2025, organis\u00e9e au Maroc du 21 d\u00e9cembre au 18 janvier 2026 dans 9 stades, d\u00e9butera demain samedi. [telquel.ma]\n-------------------------------------------------\nLa troisi\u00e8me phase de vente des billets pour la Coupe d\u2019Afrique des Nations, (CAN) de football \u00ab Maroc-2025 \u00bb sera ouverte le 15 novembre, offrant ainsi une nouvelle opportunit\u00e9 aux supporters d\u2019Afrique et d\u2019ailleurs de r\u00e9server leurs places pour ce rendez-vous sportif majeur, a annonc\u00e9 la Conf\u00e9d\u00e9ration Africaine de Football (CAF). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Apr\u00e8s un d\u00e9marrage compliqu\u00e9 marqu\u00e9\npar une lourde d\u00e9faite contre...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s un d\u00e9marrage compliqu\u00e9 marqu\u00e9 par une lourde d\u00e9faite contre le Portugal, la s\u00e9lection marocaine des moins de 17 ans a su rebondir en \u00e9crasant la Nouvelle-Cal\u00e9donie (16-0) et se qualifier pour les seizi\u00e8mes de finale de la Coupe du Monde U17. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s deux d\u00e9faites inaugurales contre le Japon et le Portugal, les poulains de Nabil Baha ont marqu\u00e9 les esprits et l\u2019histoire contre la Nouvelle-Cal\u00e9donie (victoire 16-0). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Quelque 580.000 \u00e9leveurs de b\u00e9tail\nont b\u00e9n\u00e9fici\u00e9 \u00e0 ce jour...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 580.000 \u00e9leveurs de b\u00e9tail ont b\u00e9n\u00e9fici\u00e9 \u00e0 ce jour d\u2019une aide directe de pr\u00e8s de 2,42 milliards de dirhams (MMDH), dans le cadre des efforts visant la pr\u00e9servation du cheptel national, a indiqu\u00e9, jeudi, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [telquel.ma]\n-------------------------------------------------\nQuelque 580.000 \u00e9leveurs de b\u00e9tail ont b\u00e9n\u00e9fici\u00e9 \u00e0 ce jour d\u2019une aide directe de pr\u00e8s de 2,42 milliards de dirhams (MMDH), dans le cadre des efforts visant la pr\u00e9servation du cheptel national, a indiqu\u00e9, jeudi, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dislog Group, acteur industriel marocain\nde r\u00e9f\u00e9rence et pionnier de...", "mass": 5, "physics": false, "shape": "box", "title": "Dislog Group, acteur industriel marocain de r\u00e9f\u00e9rence et pionnier de l\u2019\u00e9conomie de la vie, annonce un partenariat avec le Festival International du Film de Marrakech (FIFM), l\u2019un des plus [www.challenge.ma]\n-------------------------------------------------\nDislog Group, acteur industriel marocain de premier plan et pionnier de l\u2019\u00e9conomie de la vie, annonce fi\u00e8rement son partenariat avec l\u2019un des \u00e9v\u00e9nements culturels les plus prestigieux du continent : le Festival International du Film de Marrakech (FIFM), qui se tiendra du 28 novembre au 6 d\u00e9cembre 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le pr\u     }

        const tooltip = document.getElementById('tooltip');

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
