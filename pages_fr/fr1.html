]\n-------------------------------------------------\nLe ministre de l\u2019Industrie et du commerce a proc\u00e9d\u00e9, ce jeudi 21 mai \u00e0 Casablanca, \u00e0 la premi\u00e8re remise officielle des certificats de labellisation \u00abMade in Morocco\u00bb, attribu\u00e9s \u00e0 pr\u00e8s de 80 entreprises industrielles marocaines. [www.lavieeco.com]\n-------------------------------------------------\nEnosis Group annonce l\u0027obtention du label \"Made in Morocco\", une distinction r\u00e9cemment lanc\u00e9e par le minist\u00e8re de l\u0027Industrie et du Commerce afin de valoriser les produits fabriqu\u00e9s au Maroc et de promouvoir le savoir-faire industriel national. [leseco.ma]\n-------------------------------------------------\nPr\u00e8s de 80 entreprises industrielles ont re\u00e7u, jeudi \u00e0 Casablanca, les certificats de labellisation \u00ab Made in Morocco \u00bb, lors d\u2019une c\u00e9r\u00e9monie tenue sous la pr\u00e9sidence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les Militaires se sont impos\u00e9es\nface \u00e0 la Renaissance Sportive...", "mass": 5, "physics": false, "shape": "box", "title": "Les Militaires se sont impos\u00e9es face \u00e0 la Renaissance Sportive de Berkane (RSB) sur le score de 4 buts \u00e0 0, en finale au Complexe Sportif de F\u00e8s.Les r\u00e9alisations de l\u0027AS FAR on. [lematin.ma]\n-------------------------------------------------\nLes Militaires ont domin\u00e9 la finale en s\u2019imposant face \u00e0 la Renaissance Sportive de Berkane (RSB) sur un score sans appel de 4 buts \u00e0 0, lors d\u2019un match disput\u00e9 au Complexe Sportif de F\u00e8s. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Son Altesse la Princesse Lalla\nZineb a mis en exergue Cap Comp\u00e9tences 2030\". [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le Groupe COSUMAR obtient la\ncertification \u00ab Made in Morocco...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe COSUMAR obtient la certification \u00ab Made in Morocco \u00bb d\u00e9livr\u00e9e par l\u2019Institut Marocain de Normalisation, consacrant ainsi pr\u00e8s d\u2019un si\u00e8cle d\u2019histoire industrielle et agricole marocaine ainsi qu\u2019un savoir-faire national transmis de g\u00e9n\u00e9ration en g\u00e9n\u00e9ration. [www.lavieeco.com]\n-------------------------------------------------\nLe Groupe Cosumar a obtenu la certification \"Made in Morocco\" d\u00e9livr\u00e9e par l\u2019Institut Marocain de Normalisation, consacrant pr\u00e8s d\u2019un si\u00e8cle d\u2019histoire industrielle et agricole marocaine et un savoir-faire national transmis de g\u00e9n\u00e9ration en g\u00e9n\u00e9ration. [leseco.ma]\n-------------------------------------------------\nLe groupe COSUMAR a annonc\u00e9 l\u2019obtention de la certification \u00ab Made in Morocco \u00bb, d\u00e9livr\u00e9e par l\u2019Institut marocain de normalisation (IMANOR), une distinction qui vient reconna\u00eetre l\u2019origine marocaine de ses produits ainsi que leur conformit\u00e9 aux normes de qualit\u00e9, de s\u00e9curit\u00e9 et aux exigences r\u00e9glementaires applicables. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "\u00c0 travers cette initiative, le\nGroupe \u00e9tend son positionnement au-del\u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 travers cette initiative, le Groupe \u00e9tend son positionnement au-del\u00e0 des services grand public afin d\u2019accompagner les entreprises et les organisations publiques dans leur transformation num\u00e9rique. [www.lavieeco.com]\n-------------------------------------------------\nYango Group annonce le lancement de Yango Tech en Afrique, une nouvelle branche d\u00e9di\u00e9e aux solutions technologiques B2B, \u00e0 l\u2019intelligence artificielle et aux infrastructures num\u00e9riques, avec le Maroc identifi\u00e9 comme l\u2019un de ses march\u00e9s prioritaires en Afrique du Nord. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) et l\u2019Institution...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) et l\u2019Institution du M\u00e9diateur du Royaume ont sign\u00e9 jeudi une convention de partenariat visant \u00e0 am\u00e9liorer et simplifier les services rendus aux usagers. [leseco.ma]\n-------------------------------------------------\nUne convention de partenariat a \u00e9t\u00e9 sign\u00e9e, jeudi \u00e0 Rabat, entre la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) et l\u2019Institution du M\u00e9diateur du Royaume afin de renforcer la coop\u00e9ration institutionnelle en mati\u00e8re de modernisation, d\u2019am\u00e9lioration et de simplification des services administratifs au profit des usagers. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La Conf\u00e9d\u00e9ration Africaine de Football\n(CAF) a annonc\u00e9 un changement...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration Africaine de Football (CAF) a annonc\u00e9 un changement d\u2019horaire pour le quart de finale de la Coupe d\u2019Afrique des Nations U17 entre le Maroc et le Cameroun. [fr.hespress.com]\n-------------------------------------------------\nInitialement programm\u00e9e le dimanche 24 mai \u00e0 20h00, cette rencontre d\u00e9butera finalement \u00e0 17h00 sur le terrain n\u00b08 du Complexe Mohammed VI de Football, a indiqu\u00e9 la F\u00e9d\u00e9ration Roya. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a avanc\u00e9 lhoraire du match opposant le Maroc au Cameroun, comptant pour les quarts de finale de la Coupe dAfrique des nations (CAN U17). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nNasser Bourita, a re\u00e7u, vendredi...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, Nasser Bourita, a re\u00e7u, vendredi \u00e0 Rabat, son homologue mauritanien, Mohamed Salem Ould Merzoug, \u00e9missaire du pr\u00e9sident mauritanien, Mohamed Ould Cheikh El Ghazouani, porteur d\u2019un message au Roi Mohammed VI. [fr.hespress.com]\n-------------------------------------------------\nLors de cette rencontre, durant laquelle Nasser Bourita a r\u00e9affirm\u00e9 la profondeur des relations maroco-mauritaniennes, les deux parties ont pass\u00e9 en revue la coop\u00e9ration bilat\u00e9rale. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Lors de ce d\u00e9fil\u00e9 d\u0027exception,\nqui a r\u00e9uni des cr\u00e9ateurs...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de ce d\u00e9fil\u00e9 d\u0027exception, qui a r\u00e9uni des cr\u00e9ateurs venus de diff\u00e9rentes r\u00e9gions du continent africain, la styliste et designer marocaine Noura Begbeg a pr\u00e9sent\u00e9 une colle. [lematin.ma]\n-------------------------------------------------\nLe caftan marocain, dans toute sa splendeur et sa magnificence a brill\u00e9 de mille feux, jeudi \u00e0 Paris, lors d\u2019un d\u                           var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
