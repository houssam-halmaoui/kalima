e, du Pr\u00e9scolaire et des Sports, Mohamed Saad Berrada. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Les frais du Hajj au\ntitre de la saison 1446H...", "mass": 5, "physics": false, "shape": "box", "title": "Les frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e9dente, a relev\u00e9, mardi, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers. [telquel.ma]\n-------------------------------------------------\nS\u2019exprimant mardi 6 janvier lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers, en r\u00e9ponse \u00e0 une question du PAM, il a indiqu\u00e9 que la r\u00e9duction atteint environ 3 095 dirhams par p\u00e8lerin. [www.yabiladi.com]\n-------------------------------------------------\nLes frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e9dente, a relev\u00e9, mardi, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers. [www.lavieeco.com]\n-------------------------------------------------\nLes frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e9dente, a relev\u00e9, mardi, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers. [www.lereporter.ma]\n-------------------------------------------------\nLes frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e9dente, a relev\u00e9, mardi, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La C\u00f4te d\u2019Ivoire a valid\u00e9\nson billet pour les quarts...", "mass": 5, "physics": false, "shape": "box", "title": "La C\u00f4te d\u2019Ivoire a valid\u00e9 son billet pour les quarts de finale de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2025, en s\u2019imposant face au Burkina Faso sur le score de (3-0), lors du match comptant pour les huiti\u00e8mes de finale, disput\u00e9 mardi soir au Grand Stade de Marrakech. [telquel.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe d\u2019Afrique des nations (CAN), qui se tient jusqu\u2019au 18 janvier au Maroc, en battant la RD Congo sur le score de 1 but \u00e0 0, en match des 8es de finale, disput\u00e9 mardi au Stade Moulay El Hassan \u00e0 Rabat. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le groupe Attijariwafa bank et\nl\u2019INSEA ont sign\u00e9 le 29...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Attijariwafa bank et l\u2019INSEA ont sign\u00e9 le 29 d\u00e9cembre 2025 une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [telquel.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA donnent un nouvel \u00e9lan \u00e0 leur coop\u00e9ration par la signature d\u2019une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2     }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
