fque Noor Atlas, ainsi que le lancement officiel des travaux de construction. [telquel.ma]\n-------------------------------------------------\nL\u2019AREP Souss-Massa, bras ex\u00e9cutif de la r\u00e9gion, engage la phase op\u00e9rationnelle des travaux en lan\u00e7ant l\u2019appel d\u2019offres pour la construction de la future gare routi\u00e8re d\u2019Inezgane, un projet de \u00abnouvelle g\u00e9n\u00e9ration\u00bb cofinanc\u00e9 par le minist\u00e8re de l\u2019Int\u00e9rieur et la r\u00e9gion. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, s\u2019est entretenu, vendredi, par t\u00e9l\u00e9phone avec le ministre des Affaires \u00e9trang\u00e8res de la F\u00e9d\u00e9ration de Russie, Sergue\u00ef Lavrov. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 cette occasion, les deux ministres se sont f\u00e9licit\u00e9s de la qualit\u00e9 des relations d\u2019amiti\u00e9 et de coop\u00e9ration liant le Royaume du Maroc et la F\u00e9d\u00e9ration de Russie, r\u00e9affirmant leur. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, s\u0027est entretenu, ce vendredi, par t\u00e9l\u00e9phone avec le ministre des Affaires \u00e9trang\u00e8res de la F\u00e9d\u00e9ration de Russie, Sergue\u00ef Lavrov. [leseco.ma]\n-------------------------------------------------\nLe chef de la diplomatie ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, s\u2019est entretenu, vendredi, par t\u00e9l\u00e9phone avec le ministre des Affaires \u00e9trang\u00e8res de la F\u00e9d\u00e9ration de Russie, M. Sergue\u00ef Lavrov. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, s\u2019est entretenu, vendredi, par t\u00e9l\u00e9phone avec le ministre des Affaires \u00e9trang\u00e8res de la F\u00e9d\u00e9ration de Russie, M. Sergue\u00ef Lavrov. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Casablanca en p\u00e9riode de Ramadan\nse m\u00e9tamorphose litt\u00e9ralement apr\u00e8s le...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca en p\u00e9riode de Ramadan se m\u00e9tamorphose litt\u00e9ralement apr\u00e8s le coucher du soleil. [lematin.ma]\n-------------------------------------------------\nChants spirituels L\u2019Association F\u00e8s-Saiss pour le d\u00e9veloppement culturel, social et \u00e9conomique \u2013 section Casablanca organise, le 8 mars, une soir\u00e9e marocaine assaouia \u00e0 Casablanca. [aujourdhui.ma]\n-------------------------------------------------\nCasablanca accueille, durant le mois de Ramadan, une s\u00e9rie d\u2019activit\u00e9s culturelles et artistiques dans le cadre de \u00ab Ramadaniat WeCasablanca \u2013 Ramadan \u00e0 l\u2019esprit bidaoui \u00bb, un programme destin\u00e9 \u00e0 animer les soir\u00e9es du mois sacr\u00e9 et \u00e0 valoriser la sc\u00e8ne culturelle de la capitale \u00e9conomique. [lnt.ma]\n-------------------------------------------------\nLa Facult\u00e9 de M\u00e9decine Dentaire de Casablanca abritera, les 7 et 8 mars 2026, la deuxi\u00e8me \u00e9dition des Journ\u00e9es scientifiques \u00ab Ramadaniyat Tibb Al Asnan \u00bb, un rendez-vous acad\u00e9mique organis\u00e9 par le Bureau des \u00c9tudiants de l\u2019\u00e9tablissement. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le football marocain ouvre une\nnouvelle page avec la nomination...", "mass": 5, "physics": false, "shape": "box", "title": "Le football marocain ouvre une nouvelle page avec la nomination de Mohamed Ouahbi \u00e0 la t\u00eate de la s\u00e9lection nationale A. [lematin.ma]\n-------------------------------------------------\nMohamed Ouahbi a \u00e9t\u00e9 nomm\u00e9 nouveau s\u00e9lectionneur de l\u2019\u00e9quipe nationale du Maroc du football, succ\u00e9dant \u00e0 Walid Regragui, a annonc\u00e9, jeudi soir, le pr\u00e9sident de la F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF), Fouzi Lekja\u00e2. [telquel.ma]\n-------------------------------------------------\nMohamed Ouahbi a \u00e9t\u00e9 nomm\u00e9 nouveau s\u00e9lectionneur de l\u0027\u00e9quipe nationale du Maroc du football, succ\u00e9dant \u00e0 Walid Regragui, a annonc\u00e9, jeudi soir, le pr\u00e9sident de la F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF), Fouzi Lekja\u00e2. [leseco.ma]\n-------------------------------------------------\nLe football marocain ouvre un nouveau chapitre avec la nomination de Mohamed Ouahbi \u00e0 la t\u00eate de la s\u00e9lection nationale, en remplacement de Walid Regragui, qui a quitt\u00e9 ses fonctions quelques mois avant la Coupe du monde 2026. [lnt.ma]\n-------------------------------------------------\nApr\u00e8s son sacre historique avec la s\u00e9lection U20, le technicien marocain s\u2019appr\u00eate \u00e0 franchir un cap majeur, symbole d\u2019une promotion b\u00e2tie sur la continuit\u00e9 et la confiance. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Il n\u0027y aura aucun accord\n rderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La plateforme One Retail, appartenant\n\u00e0 HS Invest Holding pr\u00e9sid\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La plateforme One Retail, appartenant \u00e0 HS Invest Holding pr\u00e9sid\u00e9 par Moncef Belkhayat, annonce l\u2019acquisition de la cha\u00eene marocaine de coffee shops Dahab. [lematin.ma]\n-------------------------------------------------\nOne Retail, filiale de H\u0026S Group, annonce l\u2019acquisition de 100 % des actions et des droits de vote des soci\u00e9t\u00e9s Be Cafetal et Dahab Industrie, op\u00e9rant sous la marque Dahab. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "But before Muslim troops reached\nMorocco\u2019s borders, the country already...", "mass": 5, "physics": false, "shape": "box", "title": "But before Muslim troops reached Morocco\u2019s borders, the country already had its own identity, history, and geographical and cultural characteristics. [telquel.ma]\n-------------------------------------------------\nThe event will take place from May 20 to May 24, 2026 in Rabat, at the Sofitel Jardin des Roses. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Moulay Hafid Elalamy, pr\u00e9sident du\ngroupe Saham, passe \u00e0 l\u2019offensive...", "mass": 5, "physics": false, "shape": "box", "title": "Moulay Hafid Elalamy, pr\u00e9sident du groupe Saham, passe \u00e0 l\u2019offensive sur Teleperformance en d\u00e9clenchant un Total Return Swap de 355 millions d\u2019euros via Morgan Stanley afin d\u2019augmenter progressivement sa participation de 3,7% \u00e0 15% du capital. [telquel.ma]\n-------------------------------------------------\nLe groupe Saham renforce son exposition \u00e0 Teleperformance via un contrat financier d\u00e9riv\u00e9 (Equity swap) de 355 millions d\u2019euros, lui permettant de suivre la performance de l\u2019action sans en devenir actionnaire, tout en restant flexible et ma\u00eetrisant ses risques financiers. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019aviation isra\u00e9lienne a une nouvelle\nfois pilonn\u00e9 vendredi la banlieue...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019aviation isra\u00e9lienne a une nouvelle fois pilonn\u00e9 vendredi la banlieue sud de Beyrouth et vis\u00e9 Sa\u00efda, principale ville du sud du Liban, le Premier ministre accusant Isra\u00ebl de provoquer \u201cune catastrophe humanitaire\u201d du fait des d\u00e9placements massifs de la population. [telquel.ma]\n-------------------------------------------------\nL\u2019arm\u00e9e isra\u00e9lienne a annonc\u00e9 vendredi, avoir lanc\u00e9 une s\u00e9rie d\u2019attaques dans la banlieue sud de Beyrouth, contre plusieurs sites et structures du Hezbollah, ainsi que contre un centre de commandement et dix immeubles. [www.lereporter.ma]\n-------------------------------------------------\nL\u2019aviation isra\u00e9lienne a men\u00e9 de nouvelles frappes sur la banlieue sud de Beyrouth, bastion du Hezbollah, dans un contexte d\u2019escalade militaire r\u00e9gionale impliquant l\u2019Iran, Isra\u00ebl et leurs alli\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les liaisons maritimes entre le\nport de Tarifa (Cadix) et...", "mass": 5, "physics": false, "shape": "box", "title": "Les liaisons maritimes entre le port de Tarifa (Cadix) et Tanger Ville ont \u00e9t\u00e9 annul\u00e9es vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar provoqu\u00e9es par la temp\u00eate \u00ab Regina \u00bb, indiquent les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [telquel.ma]\n-------------------------------------------------\nLes traversees par ferry, entre Tarifa et Tanger Ville, pr\u00e9vues pour ce vendredi 6 mars, ont \u00e9t\u00e9 annul\u00e9es en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar, d\u00fb \u00e0 la temp\u00eate \u00abRegina\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLes compagnies maritimes Morocco Africa Link (AML) et Balearia ont suspendu les d\u00e9parts sur cette ligne \u00e0 partir de 08h00, selon les informations publi\u00e9es sur le portail destin\u00e9 aux passagers de l\u2019Autorit\u00e9 portuaire. [www.lavieeco.com]\n-------------------------------------------------\nLes liaisons maritimes entre le port de Tarifa (Cadix) et Tanger Ville ont \u00e9t\u00e9 annul\u00e9es vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar provoqu\u00e9es par la temp\u00eate \u00ab Regina \u00bb, indiquent les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "C\u2019est ce que \u00ab Le\nprojet de d\u00e9cret relatif au...", "mass": 5, "physics": false, "shape": "box", "title": "C\u2019est ce que \u00ab Le projet de d\u00e9cret relatif au Statut des cr\u00e8ches priv\u00e9es, approuv\u00e9 jeudi \u00e0 Rabat en Conseil de gouvernement, vise \u00e0 apporter des r\u00e9ponses \u00e0 une s\u00e9rie de probl\u00e9matiques \u00e0. [telquel.ma]\n-------------------------------------------------\nLe projet de d\u00e9cret relatif au Statut des cr\u00e8ches priv\u00e9es, approuv\u00e9 jeudi \u00e0 Rabat en Conseil de gouvernement, vise \u00e0 apporter des r\u00e9ponses \u00e0 une s\u00e9rie de probl\u00e9matiques \u00e0 travers la mise en place de plusieurs mesures techniques, a affirm\u00e9 le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat, a approuv\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a approuv\u00e9 un d\u00e9cret portant cr\u00e9ation des zones franches d\u2019exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret portant cr\u00e9ation des zones franches d\u0027exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Un total de 15.000 familles\nont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res...", "mass": 5, "physics": false, "shape": "box", "title": "Un total de 15.000 familles ont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res directes d\u2019un montant de 6.000 dirhams par famille, dans le cadre du programme gouvernemental d\u2019aide et d\u2019accompagnement en faveur des populations sinistr\u00e9es suite aux inondations survenues dans le nord et l\u2019ouest du Royaume, a annonc\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi. [telquel.ma]\n-------------------------------------------------\nQuelque 15.000 familles touch\u00e9es par les r\u00e9centes inondations dans le nord et l\u2019ouest du Maroc ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe de 6.000 dirhams chacune. [www.yabiladi.com]\n-------------------------------------------------\nLors du point de presse tenu jeudi \u00e0 l\u2019issue de la r\u00e9union du Conseil de gouvernement, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Faouzi Lekja\u00e2, a indiqu\u00e9 que pr\u00e8s de 15.000 familles ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe dans le cadre du programme mis en place pour soutenir et accompagner les populations affect\u00e9es par les r\u00e9centes inondations au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nUn total de 15.000 familles ont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res directes d\u2019un montant de 6.000 dirhams par famille, dans le cadre du programme gouvernemental d\u2019aide et d\u2019accompagnement en faveur des populations sinistr\u00e9es suite aux inondations survenues dans le nord et l\u2019ouest du Royaume, a annonc\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi [www.lereporter.ma]\n-------------------------------------------------\nUn total de 15.000 familles ont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res directes d\u2019un montant de 6.000 dirhams par famille, dans le cadre du programme gouvernemental d\u2019aide et d\u2019accompagnement en faveur des populations sinistr\u00e9es suite aux inondations survenues dans le nord et l\u2019ouest du Royaume, a annonc\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le minist\u00e8re de la Transition\n\u00e9nerg\u00e9tique et du D\u00e9veloppement durable...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable a affirm\u00e9 poursuivre, de mani\u00e8re quotidienn u00e9conomiques estiment que le contexte actuel de la guerre en Iran, repr\u00e9sente une opportunit\u00e9 strat\u00e9gique pour le Maroc d\u2019acc\u00e9l\u00e9rer sa transition vers les \u00e9nergies renouvelables et r\u00e9duire sa d\u00e9pendance aux routes \u00e9nerg\u00e9tiques traditionnelles qui peuvent subir les al\u00e9as des changements g\u00e9opolitiques et des instabilit\u00e9s de la r\u00e9gion. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc cherche \u00e0 s\u2019ancrer\ndavantage dans les cha\u00eenes de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc cherche \u00e0 s\u2019ancrer davantage dans les cha\u00eenes de valeur mondiales, tout en pr\u00e9servant ses sp\u00e9cificit\u00e9s culturelles. [www.lavieeco.com]\n-------------------------------------------------\nIl ne s\u2019agit plus seulement de lutter contre la d\u00e9sinformation, mais de garantir l\u2019authenticit\u00e9 du r\u00e9el lui-m\u00eame. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019intelligence artificielle, la donn\u00e9e, la connectivit\u00e9 g\u00e9n\u00e9ralis\u00e9e, la robotisation des services, la transformation des mod\u00e8les \u00e9conomiques et administratifs redessinent simultan\u00e9ment les rapports de pouvoir, les cha\u00eenes de valeur et les hi\u00e9rarchies g\u00e9opolitiques. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "L\u0027a\u00e9roport Rabat-Sal\u00e9 a enregistr\u00e9 une\nhausse de 18,99% du trafic...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027a\u00e9roport Rabat-Sal\u00e9 a enregistr\u00e9 une hausse de 18,99% du trafic de passagers en janvier 2026, par rapport \u00e0 la m\u00eame p\u00e9riode de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Office national des a\u00e9ro     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
