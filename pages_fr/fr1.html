": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 2, "id": 244, "label": "Dialogue social : Le gouvernement...", "shape": "dot", "size": 47, "title": "Dialogue social : Le gouvernement dresse le bilan et r\u00e9affirme ses engagements\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/pouvoirs/dialogue-social-le-gouvernement-dresse-le-bilan-et-reaffirme-ses-engagements/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 7, "id": 252, "label": "L\u2019Iran s\u2019engage \u00e0 ne plus...", "shape": "dot", "size": 47, "title": "L\u2019Iran s\u2019engage \u00e0 ne plus fermer le d\u00e9troit d\u2019Ormuz, selon Donald Trump\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/liran-sengage-a-ne-plus-fermer-le-detroit-dormuz-selon-donald-trump.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Alors que l\u2019Iran a annonc\u00e9\nla reprise totale du trafic...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que l\u2019Iran a annonc\u00e9 la reprise totale du trafic maritime dans le strat\u00e9gique d\u00e9troit d\u2019Ormuz, Donald Trump a confirm\u00e9 ce vendredi le maintien des sanctions maritimes am\u00e9ricaines, conditionn\u00e9es \u00e0 la conclusion d\u2019un accord global. [fr.hespress.com]\n-------------------------------------------------\nLes cours du p\u00e9trole retombent vendredi apr\u00e8s \u00eatre nettement mont\u00e9 jeudi, le sentiment optimiste sur un apaisement du conflit au Moyen-Orient l\u2019emportant avant le week-end sur les inqui\u00e9tudes li\u00e9es \u00e0 l\u2019offre p\u00e9troli\u00e8re amput\u00e9e par la paralysie du d\u00e9troit d\u2019Ormuz. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La R\u00e9publique de l\u2019\u00c9quateur a\nr\u00e9affirm\u00e9, vendredi, son soutien \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La R\u00e9publique de l\u2019\u00c9quateur a r\u00e9affirm\u00e9, vendredi, son soutien \u00e0 l\u2019initiative d\u2019autonomie pr\u00e9sent\u00e9e par le Maroc en 2007, la qualifiant de la seule solution s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste au diff\u00e9rend r\u00e9gional autour du Sahara marocain. [fr.hespress.com]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 consign\u00e9e dans le Communiqu\u00e9 conjoint sign\u00e9, \u00e0 Rabat, \u00e0 l\u2019issue des entretiens entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Ma. [lematin.ma]\n-------------------------------------------------\nLa position a \u00e9t\u00e9 consign\u00e9e dans un communiqu\u00e9 conjoint sign\u00e9 \u00e0 Rabat, \u00e0 l\u2019issue des entretiens entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et la ministre des Relations ext\u00e9rieures et de la Mobilit\u00e9 humaine de la R\u00e9publique de l\u2019\u00c9quateur. [www.lavieeco.com]\n-------------------------------------------------\nLa R\u00e9publique de l\u2019\u00c9quateur a r\u00e9affirm\u00e9, vendredi, son soutien \u00e0 l\u2019initiative d\u2019autonomie pr\u00e9sent\u00e9e par le Maroc en 2007, la qualifiant de la seule solution s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste au diff\u00e9rend r\u00e9gional autour du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Ce projet d\u2019extension porte sur\nle renforcement des capacit\u00e9s de...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet d\u2019extension porte sur le renforcement des capacit\u00e9s de production \u00e0 travers l\u2019installation de nouvelles lignes de fabrication de biscuits, chocolats et produits de confis. [lematin.ma]\n-------------------------------------------------\nD\u2019un montant global de 220 millions de dirhams, ce projet d\u2019extension porte sur le renforcement des capacit\u00e9s de production \u00e0 travers l\u2019installation de nouvelles lignes de fabrication de biscuits, chocolats et produits de confiserie. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "\u00c9lections : comment va fonctionner\nle soutien financier aux candidats...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c9lections : comment va fonctionner le soutien financier aux candidats de moins de 35 ans. [lematin.ma]\n-------------------------------------------------\nSelon un projet de d\u00e9cret adopt\u00e9 en Conseil de gouvernement, les jeunes de moins de 35 ans, candidats aux prochaines l\u00e9gislatives, affil\u00e9es aux partis politique b\u00e9n\u00e9ficient \u00e9galement du soutien financier de l\u2019\u00c9tat. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Une convention de partenariat a\n\u00e9t\u00e9 sign\u00e9e, vendredi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention de partenariat a \u00e9t\u00e9 sign\u00e9e, vendredi \u00e0 Rabat, entre le minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau et la Caisse de D\u00e9p\u00f4t et de Gestion (CDG) portant sur le d\u00e9ploiement de la plateforme digitale \u201cConsignation\u201d, d\u00e9velopp\u00e9e par la CDG, en vue de la d\u00e9mat\u00e9rialisation des op\u00e9rations de consignation des indemnit\u00e9s d\u2019expropriation et de mainlev\u00e9e.. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u0027Eau et la CDG ont scell\u00e9 un partenariat pour d\u00e9mat\u00e9rialiser les proc\u00e9dures d\u0027indemnisation li\u00e9es \u00e0 l\u0027expropriation et \u00e0 la mainlev\u00e9e. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les \u00e9quipes de l\u2019Office National\nMarocain du Tourisme (ONMT) en...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9quipes de l\u2019Office National Marocain du Tourisme (ONMT) en d\u00e9placement \u00e0 Dakhla, engagent une nouvelle phase de consolidation et d\u2019acc\u00e9l\u00e9ration pour accompagner la mont\u00e9e en puissance de la destination. [telquel.ma]\n-------------------------------------------------\nEn d\u00e9placement \u00e0 Dakhla, les \u00e9quipes de l\u2019Office National Marocain du Tourisme (ONMT) engagent une nouvelle phase de consolidation et d\u2019acc\u00e9l\u00e9ration pour accompagner la mont\u00e9e en puissance de [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Maroc est un march\u00e9\nsur lequel EasyJet doit s\u2019ancrer,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc est un march\u00e9 sur lequel EasyJet doit s\u2019ancrer, a indiqu\u00e9, vendredi, le directeur g\u00e9n\u00e9ral adjoint de la compagnie pour la France et directeur Maroc, Reginald Otten. [telquel.ma]\n-------------------------------------------------\nDans une interview au quotidien \u00e9conomique fran\u00e7ais \u00ab La Tribune \u00bb, \u00e0 l\u2019occasion de l\u2019installation d\u2019une premi\u00e8re base hors Europe d\u2019easyJet \u00e0 Marrakech, M. Otten a mis en avant . [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Maroc gagne 4 points\net atteint un score de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc gagne 4 points et atteint un score de 51 sur 100 en mati\u00e8re de transparence budg\u00e9taire, selon l\u2019Enqu\u00eate sur le budget ouvert 2025 publi\u00e9e le 15 avril par l\u2019IBP. [telquel.ma]\n-------------------------------------------------\nLes r\u00e9sultats de de l\u2019Enqu\u00eate sur le Budget Ouvert r\u00e9v\u00e8lent que le score du Maroc, en mati\u00e8re de transparence budg\u00e9taire, a atteint 51 points en 2025, en am\u00e9lioration de 4 points (pts) par rapport \u00e0 l\u2019enqu\u00eate de 2023, indique le minist\u00e8re de l\u2019\u00c9conomie et des Finances. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La r\u00e9gion Casablanca-Settat a finalis\u00e9\njeudi l\u2019\u00e9mission d\u2019un emprunt obligataire...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9gion Casablanca-Settat a finalis\u00e9 jeudi l\u2019\u00e9mission d\u2019un emprunt obligataire r\u00e9gional d\u2019un montant de 1 milliard de dirhams (MMDH) sur le march\u00e9 des capitaux marocain, devenant la premi\u00e8re r\u00e9gion du Royaume \u00e0 r\u00e9aliser une telle op\u00e9ration financi\u00e8re. [telquel.ma]\n-------------------------------------------------\nCelle-ci consiste en l\u2019\u00e9mission d\u2019un emprunt obligataire r\u00e9gional de 1 milliard de dirhams sur les march\u00e9s de capitaux marocains. [leseco.ma]\n-------------------------------------------------\nLa R\u00e9gion Casablanca-Settat a finalis\u00e9 jeudi l\u2019\u00e9mission d\u2019un emprunt obligataire r\u00e9gional d\u2019un montant de 1 milliard de dirhams (MMDH) sur le march\u00e9 des capitaux marocain, devenant la premi\u00e8re r\u00e9gion du Royaume \u00e0 r\u00e9aliser une telle op\u00e9ration financi\u00e8re. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Maroc s\u2019af
