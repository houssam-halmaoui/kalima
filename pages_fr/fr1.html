--------\nWashington est encourag\u00e9 \u00e0 placer le Maroc au centre de ses efforts pour r\u00e9duire la d\u00e9pendance des \u00c9tats-Unis vis-\u00e0-vis de la Chine en mati\u00e8re dapprovisionnement en phosphate et en engrais, selon une analyse r\u00e9cente publi\u00e9e par le Washington Institute for Near East Policy, un think tank bas\u00e9 \u00e0 Washington sp\u00e9cialis\u00e9 dans la politique et les int\u00e9r\u00eats am\u00e9ricains au Moyen-Orient. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Premi\u00e8re Dame de la\nR\u00e9publique du Kenya, Rachel Ruto,...", "mass": 5, "physics": false, "shape": "box", "title": "La Premi\u00e8re Dame de la R\u00e9publique du Kenya, Rachel Ruto, est arriv\u00e9e, lundi \u00e0 Sal\u00e9, pour une visite de travail au Maroc. [fr.hespress.com]\n-------------------------------------------------\nLa Premi\u00e8re Dame de la R\u00e9publique du Kenya, Madame Rachel Ruto, est arriv\u00e9e, lundi \u00e0 Sal\u00e9, pour une visite de travail au Maroc. [lematin.ma]\n-------------------------------------------------\nArriv\u00e9e lundi \u00e0 Sal\u00e9, la Premi\u00e8re Dame k\u00e9nyane Rachel Ruto a \u00e9t\u00e9 accueillie par SAR la Princesse Lalla Asmaa et convi\u00e9e \u00e0 la traditionnelle c\u00e9r\u00e9monie d\u0027offrande de lait et de dattes. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 sa descente d\u2019avion \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, Mme Rachel Ruto a \u00e9t\u00e9 accueillie par Son Altesse Royale la Princesse Lalla Asmaa. [www.lereporter.ma]\n-------------------------------------------------\nLa Premi\u00e8re Dame du Kenya, Madame Rachel Ruto, est arriv\u00e9e ce lundi \u00e0 Sal\u00e9 pour une visite de travail au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "A K\u00e9nitra, les habitants font\n\u00e9tat d\u2019une situation particuli\u00e8rement d\u00e9sagr\u00e9able...", "mass": 5, "physics": false, "shape": "box", "title": "A K\u00e9nitra, les habitants font \u00e9tat d\u2019une situation particuli\u00e8rement d\u00e9sagr\u00e9able et appellent les autorit\u00e9s \u00e0 agir rapidement face \u00e0 un ph\u00e9nom\u00e8ne qui se r\u00e9p\u00e8te souvent. [fr.hespress.com]\n-------------------------------------------------\nUn incendie d\u00e9clar\u00e9 le 11 septembre dans la d\u00e9charge publique d\u2019Ouled Berjal, \u00e0 K\u00e9nitra, d\u00e9gage depuis des fum\u00e9es qui ont d\u00e9grad\u00e9 la qualit\u00e9 de l\u2019air dans plusieurs quartiers de la ville. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019Autorit\u00e9 libyenne de d\u00e9veloppement des\nexportations, rattach\u00e9e au Conseil des...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Autorit\u00e9 libyenne de d\u00e9veloppement des exportations, rattach\u00e9e au Conseil des ministres, a officialis\u00e9 ce lundi 14 septembre 2026 le lancement d\u2019une nouvelle ligne maritime directe reliant le port de la zone franche de Misrata \u00e0 plusieurs march\u00e9s cl\u00e9s d\u2019Afrique de l\u2019Ouest, notamment le Nig\u00e9ria et le Cameroun. [fr.hespress.com]\n-------------------------------------------------\nL\u2019Autorit\u00e9 libyenne de d\u00e9veloppement des exportations, rattach\u00e9e au Conseil des ministres, a inaugur\u00e9 le 14 septembre un corridor maritime reliant le port de la zone franche de Misrata aux march\u00e9s ouest-africains, en particulier le Nigeria et le Cameroun, via le hub de transbordement de Tanger Med. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019approche des \u00e9lections l\u00e9gislatives\nde septembre 2026, Rachid Hallaouy...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019approche des \u00e9lections l\u00e9gislatives de septembre 2026, Rachid Hallaouy re\u00e7oit Driss Azami El Idrissi, ancien ministre charg\u00e9 du Budget, vice-secr\u00e9taire g\u00e9n\u00e9ral du PJD et candid. [lematin.ma]\n-------------------------------------------------\nDans un entretien \u00e0 la MAP, le Premier vice-secr\u00e9taire g\u00e9n\u00e9ral du PJD, Driss El Azami El Idrissi, d\u00e9taille les enjeux du scrutin du 23 septembre, les pr\u00e9paratifs du parti et ses ambitions \u00e9lectorales. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c9nergie solaire : OCP met\nsous tension le premier syst\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c9nergie solaire : OCP met sous tension le premier syst\u00e8me de stockage par batteries \u00e0 grande \u00e9chelle au Maroc. [lematin.ma]\n-------------------------------------------------\nLe Groupe OCP a annonc\u00e9, lundi, que sa filiale d\u00e9di\u00e9e \u00e0 la production et au stockage d\u2019\u00e9lectricit\u00e9 issue de sources renouvelables, OCP Green Energy, a franchi un cap majeur avec l\u2019installation de son premier syst\u00e8me de stockage d\u2019\u00e9nergie par batteries (Battery Energy Storage System \u2013 Phase I BESS) sur le site minier de Benguerir. [telquel.ma]\n-------------------------------------------------\nOCP Green Energy, filiale du Groupe OCP d\u00e9di\u00e9e a\u0300 la production et au stockage d\u2019\u00e9lectricit\u00e9 issue de sources renouvelables, franchit un cap majeur avec l\u2019installation de son premier syst\u00e8me de stockage d\u2019\u00e9nergie par batteries (Battery Energy Storage System \u2013 Phase . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Bank Of Africa lance, en\npartenariat avec Mastercard, la deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Of Africa lance, en partenariat avec Mastercard, la deuxi\u00e8me \u00e9dition de son programme \u00ab Elevator Pitch by BANK OF AFRICA \u00bb, destin\u00e9 \u00e0 la d\u00e9tection et \u00e0 l\u2019accompagnement de por. [lematin.ma]\n-------------------------------------------------\nFort du succ\u00e8s rencontr\u00e9 lors de sa premi\u00e8re \u00e9dition, BANK OF AFRICA, en partenariat avec Mastercard, lance la deuxi\u00e8me \u00e9dition de son programme \u00ab Elevator Pitch by BANK OF AFRICA \u00bb, une initiative d\u00e9di\u00e9e \u00e0 la d\u00e9tection, \u00e0 l\u2019accompagnement et \u00e0 la valorisation des talents entrepreneuriaux marocains. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019Office national marocain du tourisme\n(ONMT) veut \u00e9largir le potentiel...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national marocain du tourisme (ONMT) veut \u00e9largir le potentiel du march\u00e9 fran\u00e7ais en ciblant davantage les voyageurs en dehors de Paris et des grandes m\u00e9tropoles. [lematin.ma]\n-------------------------------------------------\n\u00c0 la veille du salon IFTM Top Resa, pr\u00e9vu du 15 au 17 septembre \u00e0 Paris, l\u2019Office national marocain du tourisme (ONMT) a d\u00e9voil\u00e9, lundi, sa nouvelle strat\u00e9gie pour renforcer lattractivit\u00e9 du Maroc sur le march\u00e9 fran\u00e7ais. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Office national marocain du tourisme (ONMT) a pr\u00e9sent\u00e9, lundi \u00e0 Paris, devant la presse fran\u00e7aise sa strat\u00e9gie pour renforcer l\u2019attractivit\u00e9 du Maroc dans l\u2019Hexagone. [leseco.ma]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de l\u0027ONMT, Achraf Fayda, a pr\u00e9sent\u00e9 \u00e0 la presse fran\u00e7aise \u00e0 Paris la nouvelle strat\u00e9gie de l\u0027Office pour renforcer l\u0027attractivit\u00e9 du Maroc sur son premier march\u00e9 \u00e9metteur. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 la veille du salon IFTM Top Resa qui se tient dans la capitale fran\u00e7aise (15-17 septembre), le Directeur G\u00e9n\u00e9ral de l\u2019ONMT, Achraf Fayda, a rencontr\u00e9 un large panel de m\u00e9dias [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Comment une PME peut-elle mieux\nprot\u00e9ger ses collaborateurs sans perdre...", "mass": 5, "physics": false, "shape": "box", "title": "Comment une PME peut-elle mieux prot\u00e9ger ses collaborateurs sans perdre de vue ses contraintes financi\u00e8res ? [lematin.ma]\n-------------------------------------------------\nCr\u00e9dit du Maroc et AtlantaSanad Assurance ont organis\u00e9, le 10 septembre \u00e0 Casablanca, une rencontre-d\u00e9bat d\u00e9di\u00e9e aux dirigeants de PME, autour d\u2019un enjeu cl\u00e9 : attirer, fid\u00e9liser et prot\u00e9ger les talents. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le parquet de la Cour\nd\u2019appel de Casablanca vient de...", "mass": 5, "physics": false, "shape": "box", "title": "Le parquet de la Cour d\u2019appel de Casablanca vient de charger la Brigade nationale de la police judiciaire (BNPJ) d\u2019ouvrir une enqu\u00eate suite \u00e0 de graves accusations prof\u00e9r\u00e9es, dimanche 13 septembre, par Mohamed Ouzzine lors d\u2019un meeting de son parti \u00e0 Berrechid. [telquel.ma]\n-------------------------------------------------\nCette d\u00e9cision fait suite aux d\u00e9clarations du secr\u00e9taire g\u00e9n\u00e9ral d\u2019un parti politique, qui a affirm\u00e9 que sa formation \u00e9tait cibl\u00e9e par divers moyens, y compris la surveillance t\u00e9l\u00e9phonique. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La situation des charges et\nressources du Tr\u00e9sor d\u00e9gage un...", "mass": 5, "physics": false, "shape": "box", "title": "La situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 56,9 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre un d\u00e9ficit budg\u00e9taire de 54,1 MMDH durant la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 56,9 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre un d\u00e9ficit budg\u00e9taire de 54,1 MMDH durant la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Mohamed Ouahbi, s\u00e9lectionneur de l\u2019\u00e9quipe\nnationale marocaine, tiendra jeudi prochain...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ouahbi, s\u00e9lectionneur de l\u2019\u00e9quipe nationale marocaine, tiendra jeudi prochain une conf\u00e9rence de presse au Complexe Mohammed VI de football afin de d\u00e9voiler la liste d\u00e9finitive des joueurs retenus pour affronter le Gabon et le Lesotho, dans le cadre des \u00e9liminatoires de la Coupe d\u2019Afrique des nations 2027. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur de l\u2019\u00e9quipe nationale, Mohamed Ouahbi, tiendra une conf\u00e9rence de presse ce jeudi pour d\u00e9voiler la liste des joueurs retenus pour les rencontres du Maroc face au Gabon et au Lesotho, dans le cadre des 1\u00e8re et 2\u00e8me journ\u00e9es (groupe A) des \u00e9liminatoires de la Coupe d\u2019Afrique des Nations 2027. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur de l\u2019\u00e9quipe nationale, Mohamed Ouahbi, tiendra une conf\u00e9rence de presse, jeudi prochain, afin d\u2019annoncer la liste des joueurs convoqu\u00e9s pour les deux matchs du Maroc face au Gabon et au Lesotho, comptant pour les 1\u00e8re et 2\u00e8 journ\u00e9es (groupe A) des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations 2027. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Selon Hespress, ils se classent\nainsi au troisi\u00e8me rang des...", "mass": 5, "physics": false, "shape": "box", "title": "Selon Hespress, ils se classent ainsi au troisi\u00e8me rang des ressortissants de pays tiers b\u00e9n\u00e9ficiaires, derri\u00e8re les Ukrainiens (335.000) et les Indiens (227.000). [telquel.ma]\n-------------------------------------------------\nLes citoyens marocains se placent au troisi\u00e8me rang parmi les ressortissants de pays non membres de l\u2019UE ayant obtenu le plus grand nombre de premiers titres de s\u00e9jour dans les \u00c9tats membres de l\u2019Union en 2025, d\u2019apr\u00e8s les derni\u00e8res statistiques de l\u2019office europ\u00e9en Eurostat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Un temps chaud, de fortes\nrafales de vent ainsi que...", "mass": 5, "physics": false, "shape": "box", "title": "Un temps chaud, de fortes rafales de vent ainsi que de fortes averses orageuses avec risque de gr\u00eale sont attendus, dimanche et lundi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur intense, accompagn\u00e9e de fortes averses orageuses avec un risque de gr\u00eale et de rafales de vent, est pr\u00e9vue ce lundi dans plusieurs provinces du Maroc, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nUn temps chaud, de fortes averses orageuses avec risque de gr\u00eale et rafales de vent sous orages sont attendus, lundi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Lors dune visite inopin\u00e9e dont\nles d\u00e9tails demeurent confidentiels, Massad...", "mass": 5, "physics": false, "shape": "box", "title": "Lors dune visite inopin\u00e9e dont les d\u00e9tails demeurent confidentiels, Massad Boulos, haut conseiller du pr\u00e9sident am\u00e9ricain pour l\u2019Afrique, le monde arabe et le Moyen-Orient, a d\u00e9barqu\u00e9 dimanche en Alg\u00e9rie pour un entretien avec le pr\u00e9sident Abdelmadjid Tebboune. [www.yabiladi.com]\n-------------------------------------------------\nLe pr\u00e9sident alg\u00e9rien Abdelmadjid Tebboune a re\u00e7u, dimanche \u00e0 Alger, Massad Boulos, conseiller principal du pr\u00e9sident am\u00e9ricain Donald Trump pour l\u0027Afrique, les affaires arabes et le Moyen-Orient. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc a export\u00e9 10\n400 tonnes de poivrons doux...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a export\u00e9 10 400 tonnes de poivrons doux vers le Royaume-Uni entre octobre 2025 et juin 2026, g\u00e9n\u00e9rant plus de 17 millions de livres sterling. [www.yabiladi.com]\n-------------------------------------------------\nEntre octobre 2025 et juin 2026, le Royaume-Uni a import\u00e9 10.400 tonnes de poivrons marocains, pour une valeur sup\u00e9rieure \u00e0 17 millions de livres sterling. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "L\u2019international marocain, Azzedine Ounahi, a\nbrill\u00e9 en inscrivant son premier...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019international marocain, Azzedine Ounahi, a brill\u00e9 en inscrivant son premier but pour le Panathina\u00efkos, qui sest impos\u00e9 3-0 face au Panetolikos ce dimanche au stade olympique d\u2019Ath\u00e8nes (OAKA), lors de la quatri\u00e8me journ\u00e9e de la Super League grecque. [www.yabiladi.com]\n-------------------------------------------------\nSuper League grecque L\u2019international marocain Azeddine Ounahi a livr\u00e9 une performance remarquable couronn\u00e9e de son premier but avec le Panathina\u00efkos FC qui a facilement domin\u00e9 dimanche le Panetolikos 3-0 au Stade olympique d\u2019Ath\u00e8nes OAKA, lors de la 4e journ\u00e9e de la Super League grecque. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le d\u00e9ficit commercial du secteur\npourrait atteindre 13,4 milliards de...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9ficit commercial du secteur pourrait atteindre 13,4 milliards de dirhams \u00e0 l\u2019horizon 2030, port\u00e9 par des importations qui progressent beaucoup plus rapidement que les exportations, selon les projections de BMI, filiale de Fitch Solutions. [leseco.ma]\n-------------------------------------------------\nLe d\u00e9ficit commercial du Maroc sur les produits pharmaceutiques s\u2019est \u00e9tabli \u00e0 10,3 milliards de dirhams en 2025     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
