, "size": 26}, "group": 1, "id": "comm_label_1", "label": "La richesse du dialogue culturel\nentre l\u2019Italie et le Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "La richesse du dialogue culturel entre l\u2019Italie et le Maroc a \u00e9t\u00e9 mise \u00e0 l\u2019honneur lors de l\u2019\u00e9dition 2025 du Festival de F\u00e8s des Musiques Sacr\u00e9es du Monde, couronn\u00e9e par une distinction internationale de premier plan. [fr.hespress.com]\n-------------------------------------------------\nUn spectacle italo-marocain, pr\u00e9sent\u00e9 lors de l\u2019\u00e9dition 2025 du Festival de F\u00e8s des Musiques Sacr\u00e9es du Monde, a re\u00e7u le prix \u201cMercurio Alato\u201d du minist\u00e8re italien des Affaires \u00e9trang\u00e8res, consid\u00e9r\u00e9 comme l\u2019\u2019\u2019Oscar\u2019\u2019 de la diplomatie culturelle italienne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "ENJOY AI Global Final 2025\na connu la participation de...", "mass": 5, "physics": false, "shape": "box", "title": "ENJOY AI Global Final 2025 a connu la participation de plus d\u0027un million de participants issus de 34 pays, un record homologu\u00e9 par le Guinness World Records. [lematin.ma]\n-------------------------------------------------\nDes \u00e9quipes marocaines ont d\u00e9croch\u00e9 plusieurs distinctions lors de la comp\u00e9tition internationale de robotique et d\u2019intelligence artificielle (IA) ENJOY AI Global Final 2025, qui s\u2019est tenue dans la ville de Wuzhen, \u00e0 l\u2019est de la Chine. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "\u00abLe Festival du film de\nMarrakech s\u0027est d\u00e9velopp\u00e9 parall\u00e8lement \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "\u00abLe Festival du film de Marrakech s\ au stade de Lusail \u00e0 Doha. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection marocaine A\u2019 de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe arabe (Qatar-2025) en battant son homologue saoudienne sur le score de 1 but \u00e0 0, en match de la troisi\u00e8me et derni\u00e8re journ\u00e9e du groupe B, disput\u00e9 lundi au stade de Lusail \u00e0 Doha. [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine A\u2019 s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe arabe Qatar-2025 en battant l\u2019Arabie saoudite 1-0, lundi au stade de Lusail \u00e0 Doha, lors de la troisi\u00e8me journ\u00e9e du groupe B. L\u2019unique but de la rencontre a \u00e9t\u00e9 inscrit d\u00e8s la 11e minute par Karim El Berkaoui, \u00e9galement d\u00e9sign\u00e9 homme . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Alstom investit 100 millions de\ndirhams au Maroc pour y...", "mass": 5, "physics": false, "shape": "box", "title": "Alstom investit 100 millions de dirhams au Maroc pour y implanter la premi\u00e8re ligne de production mondiale de pupitres de conduite pour trains, cr\u00e9ant plus de 200 emplois et renfor\u00e7ant le positionnement du Royaume dans l\u2019industrie ferroviaire internationale. [telquel.ma]\n-------------------------------------------------\nAlstom, leader mondial de la mobilit\u00e9 propre et durable, annonce un investissement strat\u00e9gique de 100 millions de dirhams pour \u00e9largir et diversifier ses capacit\u00e9s industrielles au Maroc, consistant [www.challenge.ma]\n-------------------------------------------------\nAlstom, leader mondial de la mobilit\u00e9 propre et durable, annonce un investissement strat\u00e9gique de 100 millions de dirhams pour d\u00e9velopper et diversifier ses capacit\u00e9s industrielles au Maroc. [leseco.                             if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
