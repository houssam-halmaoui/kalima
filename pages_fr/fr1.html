visionnement en eau potable\nSource: leseco.ma", "url": "https://leseco.ma/maroc/onee-khouribga-securise-son-approvisionnement-en-eau-potable.html", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 2, "id": 274, "label": "L\u00e9gislatives 2026 : la bataille...", "shape": "dot", "size": 59, "title": "L\u00e9gislatives 2026 : la bataille de la participation\nSource: leseco.ma", "url": "https://leseco.ma/maroc/legislatives-2026-la-bataille-de-la-participation.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le groupe Stellantis a lanc\u00e9,\nmercredi \u00e0 l\u2019Atlantic Free Zone...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Stellantis a lanc\u00e9, mercredi \u00e0 l\u2019Atlantic Free Zone de K\u00e9nitra, la production de la plateforme \u00ab Smart Car \u00bb \u00e0 son usine, ouvrant un nouveau chapitre industriel pour la r\u00e9gion Afrique et Moyen-Orient (MEA \u2013 Middle East and Africa). [fr.hespress.com]\n-------------------------------------------------\nStellantis a lanc\u00e9 mercredi la production de la plateforme \"Smart Car\" \u00e0 l\u0027Atlantic Free Zone de K\u00e9nitra. [atlasinfo.fr]\n-------------------------------------------------\nLe constructeur automobile a officiellement lanc\u00e9 la production de la plateforme Smart Car sur son site marocain, marquant l\u2019arriv\u00e9e de deux nouveaux mod\u00e8les Fiat \u2013 le Fastback et le Grizzly \u2013 et renfor\u00e7ant le r\u00f4le du Royaume dans la strat\u00e9gie industrielle du groupe . [lnt.ma]\n-------------------------------------------------\nStellantis a lanc\u00e9, le 15 juillet courant, la production de v\u00e9hicules reposant sur la plateforme Smart Car \u00e0 son usine de K\u00e9nitra. [www.challenge.ma]\n-------------------------------------------------\nMercredi, Ryad Mezzour, ministre marocain de l\u2019Industrie et du Commerce, a inaugur\u00e9 la production de deux nouveaux mod\u00e8les chez Stellantis, la Fiat Fastback et la Fiat Grizzly, \u00e0 l\u2019usine de K\u00e9nitra. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Premier ministre fran\u00e7ais S\u00e9bastien\nLecornu est arriv\u00e9, mercredi soir...", "mass": 5, "physics": false, "shape": "box", "title": "Le Premier ministre fran\u00e7ais S\u00e9bastien Lecornu est arriv\u00e9, mercredi soir \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, pour une visite officielle dans le Royaume au cours de laquelle il co-pr\u00e9sidera, jeudi, avec le Chef du gouvernement, Aziz Akhannouch, la 15e session de la R\u00e9union de Haut Niveau Maroc-France. [fr.hespress.com]\n-------------------------------------------------\nLe Premier ministre fran\u00e7ais S\u00e9bastien Lecornu est arriv\u00e9, mercredi soir \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, pour une visite officielle dans le Royaume au cours de laquelle il co-pr\u00e9sidera, jeudi, avec le Chef du gouvernement, Aziz Akhannouch, la 15e session de la R\u00e9union de Haut Niveau Maroc-France. [atlasinfo.fr]\n-------------------------------------------------\nLe Premier ministre fran\u00e7ais S\u00e9bastien Lecornu est arriv\u00e9, mercredi soir \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, pour une visite officielle dans le Royaume au cours de laquelle il co-pr\u00e9sidera, jeudi, avec le Chef du gouvernement, Aziz Akhannouch, la 15\u00e8me session de la R\u00e9union de Haut Niveau Maroc-France. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch a eu, ce jeudi \u00e0 Rabat, des entretiens avec le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu, qui effectue une visite de travail au Maroc \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation fran\u00e7aise de haut niveau, dans le cadre des travaux de la 15e R\u00e9union de Haut Niveau Maroc-France. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le nombre d\u2019\u00e9lecteurs inscrits sur\nles listes \u00e9lectorales g\u00e9n\u00e9rales pour...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre d\u2019\u00e9lecteurs inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales pour les \u00e9lections l\u00e9gislatives du 23 septembre 2026 s\u2019\u00e9tablit \u00e0 15.800.136, contre 17.983.490 lors du scrutin de 2021, selon les donn\u00e9es communiqu\u00e9es par le minist\u00e8re de l\u2019Int\u00e9rieur. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9unies avec les responsables des partis politiques, les autorit\u00e9s ont pr\u00e9sent\u00e9 les principales mesures organisationnelles destin\u00e9es \u00e0 encadrer le scrutin, depuis la r\u00e9vision des listes \u00e9lectorales jusqu\u2019aux nouvelles modalit\u00e9s de d\u00e9p\u00f4t des candidatures et au financement des campagnes. [lnt.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a boucl\u00e9 la r\u00e9vision des listes \u00e9lectorales, activ\u00e9 la Commission centrale de suivi et pr\u00e9sent\u00e9 aux partis une nouvelle plateforme de d\u00e9p\u00f4t des candidatures. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "\u00ab Ces frappes visent les\ncapacit\u00e9s militaires iraniennes utilis\u00e9es pour...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Ces frappes visent les capacit\u00e9s militaires iraniennes utilis\u00e9es pour menacer les navires transitant librement par le d\u00e9troit d\u2019Ormuz, une voie navigable internationale essentielle au commerce mondial \u00bb, a . [fr.hespress.com]\n-------------------------------------------------\nCes frappes visent les capacit\u00e9s militaires iraniennes utilis\u00e9es pour menacer les navires transitant librement par le d\u00e9troit d\u2019Ormuz, une voie navigable internationale essen. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 l\u2019occasion de l\u2019introduction en\nBourse de T2S Group, son...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019introduction en Bourse de T2S Group, son PDG, Abderraouf Sordo, d\u00e9taille les moteurs \u00e9conomiques qui soutiennent le d\u00e9veloppement du sp\u00e9cialiste marocain de la Me. [lematin.ma]\n-------------------------------------------------\nTrente-cinq ans de discr\u00e9tion, une fusion \u00e0 quatre entit\u00e9s, une ambition subsaharienne : \u00e0 la veille de l\u2019entr\u00e9e en Bourse de T2S Group Holding, le PDG du groupe sp\u00e9cialiste de la MedTech Abderraouf Sordo l\u00e8ve le voile sur les coulisses d\u2019une success story marocaine. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La GIZ Maroc (Agence de\ncoop\u00e9ration internationale allemande) a ouvert...", "mass": 5, "physics": false, "shape": "box", "title": "La GIZ Maroc (Agence de coop\u00e9ration internationale allemande) a ouvert les candidatures pour la premi\u00e8re cohorte d\u2019Accel\u2019Impact, un programme d\u2019accompagnement destin\u00e9 aux petites e. [lematin.ma]\n-------------------------------------------------\nJusqu\u2019au 7 ao\u00fbt 2026, les entreprises peuvent candidater \u00e0 Accel\u2019Impact, un programme d\u2019accompagnement de 24 mois port\u00e9 par GIZ Maroc, le minist\u00e8re de l\u2019Industrie et du Commerce et R\u00e9seau Entreprendre Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", ": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "\u00c0 l\u2019entame de la saison\nestivale, l\u2019Association marocaine des professionnels...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019entame de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation renforc\u00e9e autour de la pr\u00e9vention, de la sensibilisation et du recours \u00e0 des prestations professionnelles encadr\u00e9es face aux risques li\u00e9s aux nuisibles, aux insectes vecteurs de maladies et aux esp\u00e8ces venimeuses. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019approche de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation accrue pour pr\u00e9venir les risques sanitaires li\u00e9s \u00e0 la prolif\u00e9ration des nuisibles et des esp\u00e8ces venimeuses. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Athl\u00e9tisme : Yassine Hssine signe\nun nouvel exploit en passant...", "mass": 5, "physics": false, "shape": "box", "title": "Athl\u00e9tisme : Yassine Hssine signe un nouvel exploit en passant sous les 20 secondes sur 200 m. Le sprinteur marocain Yassine Hssine continue de marquer l\u2019histoire de l\u2019athl\u00e9tisme en signant un nouvel exploit sur 200 m\u00e8tres. [telquel.ma]\n-------------------------------------------------\nL\u2019athl\u00e8te de 23 ans a effectu\u00e9 le circuit en 19,92 secondes, gagnant quelques milli\u00e8mes par rapport \u00e0 son pr\u00e9c\u00e9dent exploit de 19,97 s. Cette r\u00e9alisation a elle-m\u00eame \u00e9t\u00e9 historique, puisque c\u2019est la premi\u00e8re fois qu\u     // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
