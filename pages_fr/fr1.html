abi que la Commission de la justice, de la l\u00e9gislation et des droits de l\u2019homme \u00e0 la Chambre des conseillers a entam\u00e9 la mise en place d\u2019une sous-commission charg\u00e9e d\u2019approfondir l\u2019\u00e9tude des amendements propos\u00e9s au projet de loi n\u00b0 16.22 relatif \u00e0 l\u2019organisation de la profession des adouls.. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Devant le Parlement r\u00e9uni en\ns\u00e9ance commune, le Chef du...", "mass": 5, "physics": false, "shape": "box", "title": "Devant le Parlement r\u00e9uni en s\u00e9ance commune, le Chef du gouvernement a d\u00e9fendu un bilan \u00e9conomique structur\u00e9 autour de la relance de l\u2019investissement, de la consolidation des \u00e9quilibres macro\u00e9conomiques et d\u2019un repositionnement du Maroc dans un environnement international incertain. [fr.hespress.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a pr\u00e9sent\u00e9 mercredi devant une s\u00e9ance pl\u00e9ni\u00e8re conjointe des deux chambres du Parlement le bilan de l\u2019action gouvernementale, en mettant en avant les orientations g\u00e9n\u00e9rales du mod\u00e8le de d\u00e9veloppement du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La 12e \u00e9dition du Rendez-vous\nde Casablanca de l\u0027assurance a...", "mass": 5, "physics": false, "shape": "box", "title": "La 12e \u00e9dition du Rendez-vous de Casablanca de l\u0027assurance a ouvert ses travaux ce mercredi, sur le th\u00e8me \u00abNouveaux services et couvertures : l\u2019assurance \u00e0 la conqu\u00eate de nouve. [lematin.ma]\n-------------------------------------------------\nLa 12e \u00e9dition des Rendez-vous de Casablanca de l\u2019Assurance a r\u00e9uni r\u00e9gulateur et op\u00e9rateurs autour d\u2019un sujet crucial, celui de l\u2019adaptation de l\u2019assurance aux nouveaux risques et de la n\u00e9cessit\u00e9 de r\u00e9inventer les mod\u00e8les face \u00e0 ces d\u00e9fis. [www.lavieeco.com]\n-------------------------------------------------\nLa 12\u1d49 \u00e9dition des Rendez-vous de Casablanca de l\u2019Assurance s\u2019est ouverte ce mercredi 15 mars dans un contexte international marqu\u00e9 par de fortes incertitudes \u00e9conomiques et g\u00e9opolitiques, r\u00e9unissant plus de 1.100 participants dont pr\u00e8s de 250 invit\u00e9s internationaux. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Cette \u00e9volution marque une reconnaissance\nde la qualit\u00e9 des dispositifs...", "mass": 5, "physics": false, "shape": "box", "title": "Cette \u00e9volution marque une reconnaissance de la qualit\u00e9 des dispositifs de gestion de Valoris Management, couvrant notamment la gouvernance, les processus d\u2019investissement, la gest. [lematin.ma]\n-------------------------------------------------\nValoris Management a annonc\u00e9 le rel\u00e8vement de sa notation nationale de qualit\u00e9 de gestion d\u2019investissement (IMQR) par Fitch Ratings, passant de \u00ab Strong (mar) \u00bb \u00e0 \u00ab Excellent (mar) \u00bb, avec une perspective stable. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Arriv\u00e9 \u00e0 Rome en juillet\n2025 en provenance du RC...", "mass": 5, "physics": false, "shape": "box", "title": "Arriv\u00e9 \u00e0 Rome en juillet 2025 en provenance du RC Lens pour un montant avoisinant les 25 millions d\u2019euros, Neil El Aynaoui avait alors paraph\u00e9 un contrat de cinq ans. [lematin.ma]\n-------------------------------------------------\nMercato estival Le milieu international marocain de l\u2019AS Rome, Neil El Aynaoui, attire l\u2019attention du Real Madrid, du FC Barcelone et du RB Leipzig en pr\u00e9vision du prochain mercato estival, rapporte mardi le quotidien sportif espagnol Marca. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "AXA Services Maroc a proc\u00e9d\u00e9,\nle 15 avril \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "AXA Services Maroc a proc\u00e9d\u00e9, le 15 avril \u00e0 Rabat, \u00e0 la signature de deux conventions de partenariat avec l\u2019Universit\u00e9 Mohammed V de Rabat et l\u2019\u00c9cole Sup\u00e9rieure de Technologie de S. [lematin.ma]\n-------------------------------------------------\n\u2014 Le 15 avril 2026, \u00e0 Rabat, AXA Services Maroc a sign\u00e9 deux conventions-cadres de partenariat avec l\u2019Universit\u00e9 Mohammed V de Rabat et l\u2019\u00c9cole Sup\u00e9rieure de Technologie de Sal\u00e9 (ESTS). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Inaugur\u00e9e lundi dernier sur Ordre\nde Sa Majest\u00e9 le Roi...", "mass": 5, "physics": false, "shape": "box", "title": "Inaugur\u00e9e lundi dernier sur Ordre de Sa Majest\u00e9 le Roi Mohammed VI, par Son Altesse Royale le Prince H\u00e9ritier Moulay Hassan, la Tour Mohammed VI s\u2019affirme d\u00e9sormais comme une nouve. [lematin.ma]\n-------------------------------------------------\nLa Tour qui porte fi\u00e8rement l\u2019Auguste Nom de Sa Majest\u00e9 le Roi Mohammed VI, honor\u00e9e par la r\u00e9cente inauguration officielle de Son Altesse Royale le Prince H\u00e9ritier Moulay Hassan, rayonne d\u00e9sormais sur la vall\u00e9e du Bouregreg et, au-del\u00e0, sur les villes de Rabat et de Sal\u00e9, sur le Royaume et sur l\u2019Afrique. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La hausse des prix des\ncarburants sur les march\u00e9s internationaux...", "mass": 5, "physics": false, "shape": "box", "title": "La hausse des prix des carburants sur les march\u00e9s internationaux continue de peser sur le march\u00e9 national, mais sa r\u00e9percussion \u00e0 la pompe reste in\u00e9gale selon les produits. [lematin.ma]\n-------------------------------------------------\nSi \u00ab aucun comportement anticoncurrentiel n\u2019a \u00e9t\u00e9 relev\u00e9 sur le march\u00e9 national de carburant (gasoil et essence) \u00bb, selon une note du Conseil de la Concurrence sur l\u2019\u00e9volution des prix du gasoil et de l\u2019essence sur les march\u00e9s internationaux et leur niveau de r\u00e9percussion sur les prix de vente \u00e0 la pompe sur le march\u00e9 national, couvrant. [telquel.ma]\n-------------------------------------------------\nAucun comportement anticoncurrentiel n\u2019a \u00e9t\u00e9 relev\u00e9 sur le march\u00e9 national de carburant (gasoil et essence), ressort-il d\u2019une note du Conseil de la concurrence sur l\u2019\u00e9volution des prix sur les march\u00e9s internationaux et leur r\u00e9percussion nationale \u00e0 la pompe, du 16 mars au 1er avril 2026. [www.yabiladi.com]\n-------------------------------------------------\nAucun comportement anticoncurrentiel n\u0027a \u00e9t\u00e9 relev\u00e9 sur le march\u00e9 national de carburant (gasoil et essence), ressort-il d\u0027une note du Conseil de la Concurrence sur l\u0027\u00e9volution des prix du gasoil et de l\u0027essence sur les march\u00e9s internationaux et leur niveau de r\u00e9percussion sur les prix de vente \u00e0 la pompe sur le march\u00e9 national, couvrant la p\u00e9riode du 16 mars au 1er avril 2026. [leseco.ma]\n-------------------------------------------------\nAucun comportement anticoncurrentiel n\u2019a \u00e9t\u00e9 relev\u00e9 sur le march\u00e9 national de carburant (gasoil et essence), ressort-il d\u2019une note du Conseil de la Concurrence sur l\u2019\u00e9volution des prix du gasoil et de l\u2019essence sur les march\u00e9s internationaux et leur niveau de r\u00e9percussion sur les prix de vente \u00e0 la pompe sur le march\u00e9 national, couvrant la . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La compagnie a\u00e9rienne EasyJet a\ninaugur\u00e9, mercredi, sa premi\u00e8re base...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u2019a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u2019Office national marocain du tourisme (ONMT). [telquel.ma]\n-------------------------------------------------\nLa compagnie easyJet a inaugur\u00e9, mercredi 15 avril, sa nouvelle base \u00e0 l\u2019a\u00e9roport Marrakech Menara, dans le cadre de la strat\u00e9gie de l\u2019Office National Marocain du Tourisme (ONMT) [www.challenge.ma]\n-------------------------------------------------\nMercredi 15 avril, la\u00e9roport Marrakech Menara a accueilli linauguration dune nouvelle base easyJet, marquant ainsi la premi\u00e8re implantation de la compagnie a\u00e9rienne en Afrique, selon un communiqu\u00e9 de lOffice National Marocain du Tourisme (ONMT). [www.yabiladi.com]\n-------------------------------------------------\nLa compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u0027a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u0027Office National Marocain du Tourisme (ONMT). [leseco.ma]\n-------------------------------------------------\nPremi\u00e8re implantation de la compagnie en Afrique, cette base, dont l\u2019inauguration a eu lieu en pr\u00e9sence du directeur g\u00e9n\u00e9ral de l\u2019ONMT, Achraf Fayda et du directeur g\u00e9n\u00e9ral de EasyJet, Kenton Jarvis, constitue [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La superficie de l\u2019assiette fonci\u00e8re\nam\u00e9nag\u00e9e d\u00e9di\u00e9e aux zones industrielles...", "mass": 5, "physics": false, "shape": "box", "title": "La superficie de l\u2019assiette fonci\u00e8re am\u00e9nag\u00e9e d\u00e9di\u00e9e aux zones industrielles au Maroc atteint actuellement 15.000 hectares (ha), contre 10.000 ha au d\u00e9but de l\u2019actuel mandat gouvernemental, avec 7.000 ha suppl\u00e9mentaires programm\u00e9s, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [telquel.ma]\n-------------------------------------------------\nLa superficie de l\u2019assiette fonci\u00e8re am\u00e9nag\u00e9e d\u00e9di\u00e9e aux zones industrielles au Maroc atteint actuellement 15.000 hectares (ha), contre 10.000 ha au d\u00e9but de l\u2019actuel mandat gouvernemental, avec 7.000 ha suppl\u00e9mentaires programm\u00e9s, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le ministre de l\u2019Industrie et\ndu Commerce, Ryad Mezzour, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, a affirm\u00e9, mardi \u00e0 la Chambre des conseillers, que la situation d\u2019approvisionnement du march\u00e9 national en produits de base est \u00ab rassurante \u00bb, malgr\u00e9 un contexte g\u00e9ostrat\u00e9gique et g\u00e9opolitique marqu\u00e9 par des tensions. [telquel.ma]\n-------------------------------------------------\nEn r\u00e9ponse \u00e0 une question orale s Oul\u00e9mas, indique un communiqu\u00e9 du Cabinet royal. [leseco.ma]\n-------------------------------------------------\nM. El Yazid Er-Radi, que Sa Majest\u00e9 le Roi Mohammed VI, Amir Al-Mouminine, a nomm\u00e9, mardi, nouveau secr\u00e9taire g\u00e9n\u00e9ral du Conseil sup\u00e9rieur des Oul\u00e9mas, a exprim\u00e9 son immense honneur et sa grande fiert\u00e9 pour la Haute Confiance Royale. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le chef du gouvernement, Aziz\nAkhannouch, a pr\u00e9sid\u00e9, mardi 14...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9, mardi 14 avril \u00e0 Rabat, une r\u00e9union du comit\u00e9 de pilotage de la r\u00e9forme du syst\u00e8me national de sant\u00e9, consacr\u00e9e au suivi de la mise en \u0153uvre des diff\u00e9rents chantiers structurants de cette r\u00e9forme strat\u00e9gique. [telquel.ma]\n-------------------------------------------------\nLe Comit\u00e9 de pilotage de la r\u00e9forme du syst\u00e8me national de sant\u00e9 a examin\u00e9 l\u2019\u00e9tat d\u2019avancement des projets structurants, marqu\u00e9s notamment par la r\u00e9habilitation de centres de sant\u00e9, le d\u00e9veloppement des infrastructures hospitali\u00e8res et l\u2019acc\u00e9l\u00e9ration de la transformation num\u00e9rique du secteur. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9 mardi \u00e0 Rabat une r\u00e9union du Comit\u00e9 de pilotage de la r\u00e9forme du syst\u00e8me national de sant\u00e9, consacr\u00e9e \u00e0 l\u2019examen de l\u2019\u00e9tat d\u2019avancement des principaux chantiers engag\u00e9s dans ce cadre. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La 31e \u00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
