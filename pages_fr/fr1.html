monie de nomination du nouveau gouvernement conduit par Fatima-Zahra Mansouri, dont les membres ont pr\u00eat\u00e9 serment devant le souverain. [www.yabiladi.com]\n-------------------------------------------------\nLe Roi Mohammed VI a pr\u00e9sid\u00e9, vendredi 16 octobre 2026, au Palais Royal de Rabat, la c\u00e9r\u00e9monie de nomination des membres du nouveau gouvernement, dirig\u00e9 par Fatima Ezzahra El Mansouri. [lnt.ma]\n-------------------------------------------------\nNajwa Koukouss a \u00e9t\u00e9 nomm\u00e9e ministre de la Famille, du D\u00e9veloppement social et de l\u2019\u00c9galit\u00e9, vendredi 16 octobre, par Sa Majest\u00e9 le Roi Mohammed VI, au Palais royal de Rabat. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le lancement du Dispositif National\nd\u2019\u00c9radication du Travail des Enfants...", "mass": 5, "physics": false, "shape": "box", "title": "Le lancement du Dispositif National d\u2019\u00c9radication du Travail des Enfants s\u2019inscrit dans la continuit\u00e9 de l\u2019engagement de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu Le pr\u00e9serve, en fav. [lematin.ma]\n-------------------------------------------------\nSous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, et sous la pr\u00e9sidence effective de Son Altesse Royale la Princesse Lalla Meryem, l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE) a lanc\u00e9, vendredi \u00e0 Rabat, le Dispositif National d\u2019\u00c9radication du Travail des Enfants (DNETE), un dispositif destin\u00e9 \u00e0 accompagner chaque enfant, . [aujourdhui.ma]\n-------------------------------------------------\nLe lancement de ce dispositif s\u2019inscrit dans la continuit\u00e9 de l\u2019engagement de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu Le pr\u00e9serve, en faveur de la protection de l\u2019enfance et de la promotion des droits de l\u2019enfant, et des actions men\u00e9es par l\u2019ONDE pour prot\u00e9ger les enfants en situation de vuln\u00e9rabilit\u00e9 et lutter contre le travail des enfants, indique un communiqu\u00e9 de l\u2019observatoire. [www.lavieeco.com]\n-------------------------------------------------\nSous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019Assiste, et sous la pr\u00e9sidence effective de Son Altesse Royale la Princesse Lalla Meryem, l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE) lance ce vendredi 16 octobre le Dispositif National d\u2019\u00c9radication du Travail des Enfants (DNETE). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Avec des cumuls entre 20\net 30 mm, ces averses...", "mass": 5, "physics": false, "shape": "box", "title": "Avec des cumuls entre 20 et 30 mm, ces averses sont pr\u00e9vues de 14H00 \u00e0 22H00 dans les provinces de Guercif, Midelt, Al Hoceima, Taza, Driouch et Ifrane, a pr\u00e9cis\u00e9 la DGM dans un bu. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale et rafales de vent sous orages sont attendues, vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le groupe h\u00f4telier, Pickalbatros Hotels\nResorts, a sign\u00e9, jeudi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe h\u00f4telier, Pickalbatros Hotels Resorts, a sign\u00e9, jeudi \u00e0 Marrakech, un accord avec la Soci\u00e9t\u00e9 financi\u00e8re internationale (IFC), membre du Groupe de la Banque mondiale, et. [lematin.ma]\n-------------------------------------------------\nLe groupe h\u00f4telier a mobilis\u00e9 un financement de         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
