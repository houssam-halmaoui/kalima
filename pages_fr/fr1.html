027ext\u00e9rieur. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Les deux partenaires ont sign\u00e9\nun protocole d\u2019accord (MoU) strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Les deux partenaires ont sign\u00e9 un protocole d\u2019accord (MoU) strat\u00e9gique pour structurer un v\u00e9ritable \u00e9cosyst\u00e8me gaming au Maroc et accompagner l\u2019\u00e9mergence de talents locaux, \u00e0. [telquel.ma]\n-------------------------------------------------\nUn accord a \u00e9t\u00e9 sign\u00e9entre le minist\u00e8re de la Jeunesse,de la Culture et de la Communicationet Huawei Maroc, en marge deGITEX Africa Morocco 2026\u00e0 Marrakech. [lnt.ma]\n-------------------------------------------------\nEn marge du GITEX Africa Morocco 2026 \u00e0 Marrakech, le minist\u00e8re de la Jeunesse, de la Culture et de la Communication et Huawei Maroc officialisent un partenariat strat\u00e9gique pour structurer l\u2019\u00e9cosyst\u00e8me gaming et acc\u00e9l\u00e9rer le d\u00e9veloppement des industries num\u00e9riques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Selon les informations de TelQuel\nArabi, Motsepe a sollicit\u00e9 la...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les informations de TelQuel Arabi, Motsepe a sollicit\u00e9 la tenue de rencontres de haut niveau avec des responsables marocains afin d\u2019examiner les r\u00e9percussions de la finale de la CAN, apr\u00e8s ses \u00e9changes. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, est en visite, ce mercredi \u00e0 Dakar, pr\u00e8s dun mois apr\u00e8s que le titre de la CAN 2025 a \u00e9t\u00e9 retir\u00e9 au S\u00e9n\u00e9gal et attribu\
