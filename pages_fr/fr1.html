fi\u00e9s d\u2019\u00abinacceptables\u00bb de personnes se revendiquant de la d\u00e9l\u00e9gation alg\u00e9rienne lors des \u00e9v\u00e9nements culturels organis\u00e9s hier 20 mai au sein de l\u2019Organisation, \u00e0 l\u2019occasion de la Semaine Africaine. [telquel.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9 de la D\u00e9l\u00e9gation permanente du Royaume aupr\u00e8s de l\u2019Unesco, \u00abaucune insulte n\u2019a en effet \u00e9t\u00e9 \u00e9pargn\u00e9e aux repr\u00e9sentants de la soci\u00e9t\u00e9 civile marocaine venus cont. [lematin.ma]\n-------------------------------------------------\nLe Maroc hausse le ton contre l\u0027Alg\u00e9rie apr\u00e8s un incident survenu lors de la Semaine africaine \u00e0 l\u0027Unesco, et appelle l\u0027Organisation \u00e0 ne pas laisser ses espaces \u00eatre instrumentalis\u00e9s \u00e0 des fins politiques. [www.lavieeco.com]\n-------------------------------------------------\nLa D\u00e9l\u00e9gation permanente du Maroc aupr\u00e8s de l\u2019UNESCO a d\u00e9nonc\u00e9, jeudi, \"les agissements inacceptables de personnes se revendiquant de la d\u00e9l\u00e9gation alg\u00e9rienne\" lors des \u00e9v\u00e8nements culturels organis\u00e9s, mercredi, au sein de l\u2019organisation onusienne, \u00e0 l\u2019occasion de la Semaine africaine. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La ville de F\u00e8s a\ntrembl\u00e9, aux premi\u00e8res heures de...", "mass": 5, "physics": false, "shape": "box", "title": "La ville de F\u00e8s a trembl\u00e9, aux premi\u00e8res heures de ce jeudi, sous le poids de l\u2019\u00e9croulement soudain d\u2019un immeuble de r\u00e9sidences au sein du secteur de Ain Nokbi \u00e0 Jnan El Ouard. [fr.hespress.com]\n-------------------------------------------------\nQuatre personnes ont trouv\u00e9 la mort et six autres ont \u00e9t\u00e9 bless\u00e9es \u00e0 divers degr\u00e9s \u00e0 la suite de l\u2019effondrement, jeudi matin, d\u2019une habitation r\u00e9sidentielle (R+4) au quartier Jrondi Ain Nokbi dans l\u2019arrondissement Jnan El Ouard \u00e0 F\u00e8s, selon un premier bilan des autorit\u00e9s locales de la pr\u00e9fecture de F\u00e8s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Conseil d\u2019administration du Groupe\nde la Banque africaine de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 200 millions d\u2019euros (M\u20ac) pour la mise en \u0153uvre du programme \u00ab Cap Comp\u00e9tences 2030 \u00bb. [fr.hespress.com]\n-------------------------------------------------\nLe conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 200 millions d\u2019euros pour la mise en \u0153uvre du programme \u00ab Cap Comp\u00e9tences 2030 \u00bb. [telquel.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 200 millions d\u2019euros pour la mise en \u0153uvre du programme Cap [www.challenge.ma]\n-------------------------------------------------\nLe conseil dadministration du groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 200 millions deuros (M\u20ac) pour la mise en \u0153uvre du programme Cap Comp\u00e9tences 2030. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 200 millions d\u2019euros (M\u20ac) pour la mise en \u0153uvre du programme \u00ab Cap Comp\u00e9tences 2030 \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans un Communiqu\u00e9 conjoint ayant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans un Communiqu\u00e9 conjoint ayant sanctionn\u00e9 les entretiens, jeudi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et. [lematin.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans un Communiqu\u00e9 conjoint ayant sanctionn\u00e9 les entretiens, jeudi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine. [telquel.ma]\n-------------------------------------------------\nLa ministre des Affaires \u00e9trang\u00e8res et des Cultes de la R\u00e9publique d\u2019Ha\u00efti, Raina Forbin, a r\u00e9it\u00e9r\u00e9, mercredi \u00e0 Rabat, \u201cla position constante de la R\u00e9publique d\u2019Ha\u00efti en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Marsa Maroc a enregistr\u00e9 une\nprogression de son activit\u00e9 au...", "mass": 5, "physics": false, "shape": "box", "title": "Marsa Maroc a enregistr\u00e9 une progression de son activit\u00e9 au premier trimestre 2026, avec un chiffre d\u2019affaires consolid\u00e9 atteignant 1,43 milliard de dirhams, en hausse de 12,1% par. [lematin.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) consolid\u00e9 du groupe Marsa Maroc a atteint plus de 1,43 milliard de dirhams (MMDH) au premier trimestre 2026, en progression 12,1% par rapport \u00e0 la m\u00eame p u00e9, le 19 mai 2026, \u00e0 une \u00e9mission obligataire sur le march\u00e9 financier international pour un montant total de 2,25 milliards d\u2019euros. [lematin.ma]\n-------------------------------------------------\nLe Maroc a \u00e9mis, le 19 mai, un emprunt obligataire sur le march\u00e9 financier international de 2,25 milliards d\u2019euros en deux tranches, annonce le minist\u00e8re de l\u2019\u00c9conomie et des Finances. [telquel.ma]\n-------------------------------------------------\nC\u2019est la somme que le Maroc vient d\u2019emprunter sur le march\u00e9 international de la dette, via une \u00e9mission obligataire en deux tranches (8 et 12 ans). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts\n(DGI) rappelle que le 1er...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que le 1er juin 2026 constitue le dernier d\u00e9lai pour le d\u00e9p\u00f4t de plusieurs d\u00e9clarations fiscales au titre du mois d\u2019avril 2026, appelant les cat\u00e9gories de contribuables concern\u00e9es \u00e0 effectuer leurs d\u00e9marches par voie \u00e9lectronique via les t\u00e9l\u00e9services \u00ab SIMPL \u00bb. [telquel.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que le 1er juin 2026 constitue le dernier d\u00e9lai pour le d\u00e9p\u00f4t de plusieurs d\u00e9clarations fiscales au titre du mois d\u0027avril 2026, appelant les cat\u00e9gories de contribuables concern\u00e9es \u00e0 effectuer leurs d\u00e9marches par voie \u00e9lectronique via les t\u00e9l\u00e9services \"SIMPL\". [leseco.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que le 1er juin 2026 constitue le dernier d\u00e9lai pour le d\u00e9p\u00f4t de plusieurs d\u00e9clarations fiscales au titre du mois d\u2019avril 2026, appelant les cat\u00e9gories de contribuables concern\u00e9es \u00e0 effectuer leurs d\u00e9marches par voie \u00e9lectronique via les t\u00e9l\u00e9services \u00ab SIMPL \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "\u00c0 l\u2019occasion de l\u2019A\u00efd Al\nAdha 1447, l\u2019Office National des...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019A\u00efd Al Adha 1447, l\u2019Office National des Chemins de Fer (ONCF) a d\u00e9ploy\u00e9 un plan de transport sp\u00e9cial, du mercredi 20 mai au 7 juin, afin d\u2019accompagner les d\u00e9placements dans les meilleures conditions de confort, de s\u00e9curit\u00e9 et de fluidit\u00e9. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de l\u2019A\u00efd Al Adha 1447, l\u2019Office national des chemins de fer (ONCF) d\u00e9ploie un plan de transport sp\u00e9cial, du mercredi 20 mai au 7 juin, afin [www.challenge.ma]\n-------------------------------------------------\n\u00c0 l\u0027occasion de l\u0027A\u00efd Al-Adha 1447, l\u0027ONCF met en place un plan de transport renforc\u00e9 du 20 mai au 7 juin, avec des trains suppl\u00e9mentaires sur les principaux axes du r\u00e9seau et un dispositif d\u0027accueil \u00e9toff\u00e9 dans les gares. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u0027occasion de l\u0027A\u00efd Al Adha 1447, l\u0027Office National des Chemins de Fer (ONCF) a d\u00e9ploy\u00e9 un plan de transport sp\u00e9cial, du mercredi 20 mai au 7 juin, afin d\u0027accompagner les d\u00e9placements dans les meilleures conditions de confort, de s\u00e9curit\u00e9 et de fluidit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La F\u00e9d\u00e9ration royale marocaine des\nsports a\u00e9robic, fitness, hip hop...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration royale marocaine des sports a\u00e9robic, fitness, hip hop et disciplines assimil\u00e9es (FRMSAFH) a organis\u00e9, r\u00e9cemment \u00e0 Rabat, les Championnats du Maroc de breaking et de hip hop, o\u00f9 une nouvelle g\u00e9n\u00e9ration de danseurs sont venus d\u00e9fendre leur place sur la sc\u00e8ne nationale. [telquel.ma]\n-------------------------------------------------\nEngouement La F\u00e9d\u00e9ration royale marocaine des sports a\u00e9robic, fitness, hip hop et disciplines assimil\u00e9es (FRMSAFH) a organis\u00e9 r\u00e9cemment \u00e0 Rabat le Championnat du Maroc de breaking \u00abBreaking Morocco 2026\u00bb et le Championnat du Maroc de Hip Hop \u00abhip hop Morocco 2026\u00bb, dans le cadre de la saison sportive 2025-2026. [aujourdhui.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine des Sports A\u00e9robic, Fitness, Hip Hop et Disciplines Assimil\u00e9es (FRMSAFH) a organis\u00e9, les 16 et 17 mai 2026 \u00e0 la salle Allal El Fassi de Rabat, le Championnat du Maroc de Breaking \u00ab Breaking Morocco 2026 \u00bb et le Championnat du Maroc de Hip Hop \u00ab Hip Hop Morocco 2026 \u00bb, dans le cadre de la saison sportive 2025-2026. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "En marge de sa participation\n\u00e0 la 79\u00e8me Assembl\u00e9e mondiale...", "mass": 5, "physics": false, "shape": "box", "title": "En marge de sa participation \u00e0 la 79\u00e8me Assembl\u00e9e mondiale de la sant\u00e9, tenue \u00e0 Gen\u00e8ve du 18 au 23 mai, le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, a tenu, mercredi 20 mai, une r\u00e9union de haut niveau avec des repr\u00e9sentants du Groupe de la Banque mondiale et de la. [telquel.ma]\n-------------------------------------------------\nLe Ministre de la Sant\u00e9 et de la Protection Sociale engage, avec le Groupe de la Banque Mondiale et de la Gates Foundation, le lancement d\u2019une feuille de route pour le positionnement du Maroc comme hub pharmaceutique et logistique r\u00e9gional. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a engag\u00e9 une nouvelle initiative visant \u00e0 renforcer son positionnement dans l\u2019industrie pharmaceutique et la logistique sanitaire \u00e0 l\u2019\u00e9chelle continentale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le ministre fran\u00e7ais de l\u2019Europe\net des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, s\u2019est exprim\u00e9 ce mercredi 20 mai \u00e0 Rabat aux c\u00f4t\u00e9s de son homologue marocain Nasser Bourita, \u00e0 l\u2019occasion de la deuxi\u00e8me conf\u00e9rence minist\u00e9rielle sur le maintien de la paix en milieu francophone, coorganis\u00e9e et copr\u00e9sid\u00e9e par le Maroc et la France, dix ans apr\u00e8s. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue de sa rencontre avec Nasser Bourita \u00e0 Rabat, le ministre fran\u00e7ais des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, a r\u00e9affirm\u00e9 la position de la France au plan d\u0027autonomie propos\u00e9 par le Maroc comme \"la seule base d\u0027une solution politique juste, durable et n\u00e9goci\u00e9e\". [www.lavieeco.com]\n-------------------------------------------------\nLa visite d\u0027\u00c9tat du Roi Mohammed VI en France est \"programm\u00e9e\", a annonc\u00e9, ce mercredi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, Nasser     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
