a TotalEnergies CAF Coupe d\u2019Afrique des Nations TotalEnergies, Maroc 2025, un symbole vibrant de la fiert\u00e9 africaine et de la passion du football. [www.lereporter.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration Africaine de Football (CAF) et le Comit\u00e9 local d\u2019organisation ont d\u00e9voil\u00e9 \u00ab Assad \u00bb, la mascotte officielle de la TotalEnergies CAF Coupe d\u2019Afrique des Nations TotalEnergies, Maroc 2025, un symbole vibrant de la fiert\u00e9 africaine et de la passion du football. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Dans un entretien accord\u00e9 au\nquotidien espagnol La Razon, M....", "mass": 5, "physics": false, "shape": "box", "title": "Dans un entretien accord\u00e9 au quotidien espagnol La Razon, M. Aziz Akhannouch, chef du gouvernement revient sur la profondeur mais \u00e9galement les perspectives d\u2019avenir des relations entre le Maroc et l\u2019Espagne. [aujourdhui.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a affirm\u00e9 que, conform\u00e9ment \u00e0 la Vision Royale, le Maroc m\u00e8ne un travail acharn\u00e9 et m\u00e9thodique en vue de l\u2019\u00e9dification d\u2019un \u00c9tat social porteur d\u2019un changement concret et tangible dans la vie des citoyens. [www.lereporter.ma]\n-------------------------------------------------\nDans une interview publi\u00e9e lundi par le journal espagnol La Raz\u00f3n, le Chef du gouvernement a soulign\u00e9 que le Maroc a connu une transformation sans pr\u00e9c\u00e9dent dans le domaine de la protection sociale, de l\u2019AMO, du syst\u00e8me de sant\u00e9 et de la qualit\u00e9 de l\u2019\u00e9ducation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Club Afrique D\u00e9veloppement (CAD)\ndu groupe Attijariwafa bank et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Club Afrique D\u00e9veloppement (CAD) du groupe Attijariwafa bank et la Soci\u00e9t\u00e9 Ivoirienne de Banque ont conclu avec succ\u00e8s la 43e mission multisectorielle du CAD les 4 \u0026 5 d\u00e9cembre \u00e0 Abidjan, autour du th\u00e8me : \u00ab Made In C\u00f4te d\u2019Ivoire, Made For Africa \u00bb. [maroc-diplomatique.net]\n-------------------------------------------------\nLa 43e mission multisectorielle du Club Afrique D\u00e9veloppement (CAD) du groupe Attijariwafa bank, organis\u00e9e en partenariat avec la Soci\u00e9t\u00e9 Ivoirienne de Banque, s\u2019est achev\u00e9e le 5 d\u00e9cembre \u00e0 Abidjan sur un succ\u00e8s remarquable. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Cet \u00e9v\u00e9nement annuel s\u2019attache \u00e0\nr\u00e9v\u00e9ler et accompagner les nouvelles...", "mass": 5, "physics": false, "shape": "box", "title": "Cet \u00e9v\u00e9nement annuel s\u2019attache \u00e0 r\u00e9v\u00e9ler et accompagner les nouvelles g\u00e9n\u00e9rations d\u2019artistes issus de la m\u00e9tropole, tout en affirmant Casablanca comme un territoire dynamique, riche de . [maroc-diplomatique.net]\n-------------------------------------------------\nCasablanca donne le coup d\u2019envoi de la deuxi\u00e8me \u00e9dition du Festival des Talents pour la culture et les arts locaux (CASA WE ART 2025), un rendez-vous destin\u00e9 \u00e0 mettre en lumi\u00e8re les jeunes cr\u00e9ateurs de la m\u00e9tropole et \u00e0 renforcer le positionnement culturel de la ville. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La s\u00e9lection nationale A\u2019 de\nfootball aborde, lundi, son troisi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lecti                                 };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
