---------------------\nLa rencontre entre les g\u00e9n\u00e9rations est au c\u0153ur du Festival International du Film de Marrakech, o\u00f9 le cin\u00e9ma se partage avec une spontan\u00e9it\u00e9 et une chaleur qui donnent \u00e0 cette manifestation son caract\u00e8re si particulier, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lavieeco.com]\n-------------------------------------------------\nLa rencontre entre les g\u00e9n\u00e9rations est au c\u0153ur du Festival International du Film de Marrakech, o\u00f9 le cin\u00e9ma se partage avec une spontan\u00e9it\u00e9 et une chaleur qui donnent \u00e0 cette manifestation son caract\u00e8re si particulier, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "T2S Group annonce que sa\nfiliale IM Alliance devient distributeur...", "mass": 5, "physics": false, "shape": "box", "title": "T2S Group annonce que sa filiale IM Alliance devient distributeur agr\u00e9\u00e9 des syst\u00e8mes de vid\u00e9o-endoscopie du fabricant SonoScape Medical Corp. sur le march\u00e9 marocain. [lematin.ma]\n-------------------------------------------------\nD\u00e9j\u00e0 pr\u00e9sente en endoscopie gastro-intestinale \u00e0 travers les dispositifs d\u2019endoscopie interventionnelle de Boston Scientific, IM Alliance propose d\u00e9sormais aux \u00e9tablissements de sant\u00e9 une offre int\u00e9gr\u00e9e, des colonnes [.] [maroc-diplomatique.net]\n-------------------------------------------------\nIM Alliance devient distributeur agr\u00e9\u00e9 au Maroc des syst\u00e8mes de vid\u00e9o-endoscopie du fabricant SonoScape Medical Corp. Deux fabricants, un distributeur. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u0027introduction en Bourse de Jet\nEnergy, destin\u00e9e \u00e0 financer le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027introduction en Bourse de Jet Energy, destin\u00e9e \u00e0 financer le d\u00e9veloppement de l\u0027entreprise sp\u00e9cialis\u00e9e dans les solutions \u00e9nerg\u00e9tiques, a enregistr\u00e9 une demande de 11,77. [lematin.ma]\n-------------------------------------------------\nL\u2019introduction en Bourse de Jet Energy a suscit\u00e9 un vif int\u00e9r\u00eat aupr\u00e8s des investisseurs, avec une demande repr\u00e9sentant 31,4 fois le volume de titres propos\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nFiliale du groupe cot\u00e9 Jet Contractors, Jet Energy devient une nouvelle soci\u00e9t\u00e9 cot\u00e9e sur le march\u00e9 principal de la Bourse de Casablanca. [lnt.ma]\n-------------------------------------------------\nL\u2019introduction en Bourse (IPO \u2013 Initial Public Offering) de Jet Energy a \u00e9t\u00e9 sursouscrite 31,4 fois par 25.965 investisseurs, soit un taux de satisfaction global de 3,19%, a annonc\u00e9, lundi \u00e0 Casablanca, le directeur ex\u00e9cutif des op\u00e9rations march\u00e9s \u00e0 la Bourse de Casablanca, Ahmed Arhabi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019acc\u00e8s \u00e0 de nouveaux march\u00e9s\n\u00e9tait au programme de la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019acc\u00e8s \u00e0 de nouveaux march\u00e9s \u00e9tait au programme de la participation marocaine \u00e0 FrancoTech 2026. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de FrancoTech 2026, organis\u00e9e du 14 au 16 novembre \u00e0 Phnom Penh, en marge du XX\u1d49 Sommet de la Francophonie, le Maroc affirme ses ambitions technologiques internationales \u00e0 travers un Pavillon Maroc port\u00e9 conjointement par la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) et la F\u00e9d\u00e9ration des Technologies de l\u2019Information, des T\u00e9l\u00e9communications et [.] [maroc-diplomatique.net]\n-------------------------------------------------\n\u00c0 l\u2019occasion de FrancoTech 2026, organis\u00e9e du 14 au 16 novembre \u00e0 Phnom Penh, en marge du XX\u1d49 Sommet de la Francophonie, le Maroc participe \u00e0 travers un Pavillon Maroc port\u00e9 conjointement par la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) et la F\u00e9d\u00e9ration des Technologies de l\u2019Information, des T\u00e9l\u00e9communications et de l\u2019Offshoring (APEBI). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "R\u00e9unie \u00e0 l\u2019universit\u00e9 Stanford, la\nc\u00e9r\u00e9monie des Startup Ecosystem Stars...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unie \u00e0 l\u2019universit\u00e9 Stanford, la c\u00e9r\u00e9monie des Startup Ecosystem Stars Awards 2026 a distingu\u00e9 Tamwilcom dans la cat\u00e9gorie \u00ab Outstanding Investment Boost \u00bb. [lematin.ma]\n-------------------------------------------------\nL\u2019institution a \u00e9t\u00e9 distingu\u00e9e pour son action en faveur du financement de l\u2019innovation et du d\u00e9veloppement des startups au Maroc, dans la cat\u00e9gorie consacr\u00e9e au soutien \u00e0 l\u2019investissement et au capital-risque local, notamment par l\u2019attraction d\u2019investissements directs locaux et \u00e9trangers. [www.yabiladi.com]\n-------------------------------------------------\nTamwilcom a remport\u00e9 le prix \u00ab Outstanding Investment Boost \u00bb lors des Startup Ecosystem Stars Awards 2026, organis\u00e9s \u00e0 l\u2019universit\u00e9 Stanford, en Californie, en reconnaissance de son r\u00f4le dans le financement de l\u2019innovation et le d\u00e9veloppement du capital-risque au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nCette r\u00e9compense internationale salue son engagement dans le financement de l\u2019innovation et sa contribution au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me marocain des startups. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Sous un ciel d\u2019un bleu\n\u00e9clatant, face aux eaux vert-turquoise...", "mass": 5, "physics": false, "shape": "box", "title": "Sous un ciel d\u2019un bleu \u00e9clatant, face aux eaux vert-turquoise de l\u2019Atlantique, le Haras National d\u2019El Jadida a accueilli pendant quatre jours l\u2019\u00e9lite des chevaux Barbe et Arabe-Barbe. [www.yabiladi.com]\n-------------------------------------------------\nDeux championnats nationaux : La 9\u00e8me \u00e9dition du Meeting national des chevaux Barbe et Arabe-Barbe s\u2019est achev\u00e9e, dimanche au Haras National d\u2019El Jadida, par le sacre des meilleurs chevaux de l\u2019ann\u00e9e 2026 dans les diff\u00e9rentes cat\u00e9gories et la distinction des \u00e9leveurs-naisseurs, au terme de quatre jours de comp\u00e9titions ayant r\u00e9uni l\u2019\u00e9lite des deux races. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Destin\u00e9 \u00e0 am\u00e9liorer les conditions\nde transport, le projet s\u2019inscrit...", "mass": 5, "physics": false, "shape": "box", "title": "Destin\u00e9 \u00e0 am\u00e9liorer les conditions de transport, le projet s\u2019inscrit dans un partenariat de coop\u00e9ration d\u00e9centralis\u00e9e entre les communes des Lacs 1 et d\u2019El Mansouria, dans la province de Benslimane, avec l\u2019appui du Fonds africain d\u2019appui \u00e0 la coop\u00e9ration d\u00e9centralis\u00e9e internationale (FACDI). [www.yabiladi.com]\n-------------------------------------------------\nUne gare routi\u00e8re r\u00e9habilit\u00e9e et modernis\u00e9e gr\u00e2ce au soutien financier du Maroc a \u00e9t\u00e9 inaugur\u00e9e dimanche au Togo, dans le cadre de la coop\u00e9ration d\u00e9centralis\u00e9e entre les deux pays et de la solidarit\u00e9 agissante du Royaume avec les pays africains. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les \u00e9tablissements d\u2019h\u00e9bergement touristique class\u00e9s\n(EHTC) au Maroc ont enregistr\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9tablissements d\u2019h\u00e9bergement touristique class\u00e9s (EHTC) au Maroc ont enregistr\u00e9 plus de 34,8 millions de nuit\u00e9es de janvier \u00e0 fin septembre 2026, soit une hausse de 7% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon les donn\u00e9es de l\u2019Observatoire du tourisme rapport\u00e9es par la MAP. [www.yabiladi.com]\n-------------------------------------------------\nLe volume des nuit\u00e9es r\u00e9alis\u00e9es dans les \u00e9tablissements d\u2019h\u00e9bergement touristique class\u00e9s (EHTC) a atteint un total de plus de 34,8 millions nuit\u00e9es \u00e0 fin septembre 2026, au niveau national, en hausse de 7% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Observatoire du tourisme. [telquel.ma]\n-------------------------------------------------\nLes \u00e9tablissements d\u2019h\u00e9bergement touristique class\u00e9s ont enregistr\u00e9 plus de trente-quatre millions huit cents mille nuit\u00e9es \u00e0 fin septembre, en hausse de sept pour cent sur un an, selon le tableau de bord de septembre de l\u2019Observatoire du tourisme. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La pi\u00e8ce marocaine \u00ab40 degr\u00e9s\u00bb\na remport\u00e9 samedi \u00e0 Amman...", "mass": 5, "physics": false, "shape": "box", "title": "La pi\u00e8ce marocaine \u00ab40 degr\u00e9s\u00bb a remport\u00e9 samedi \u00e0 Amman les prix du meilleur spectacle int\u00e9gr\u00e9 et de la meilleure mise en sc\u00e8ne lors de la 31e \u00e9dition du Festival de th\u00e9\u00e2tre de Jordanie. [www.yabiladi.com]\n-------------------------------------------------\nDistinction La pi\u00e8ce de th\u00e9\u00e2tre marocaine \u00ab40 degr\u00e9s\u00bb, mise en sc\u00e8ne par Oussama Laaroussi, a remport\u00e9, r\u00e9cemment \u00e0 Amman, le prix du meilleur spectacle int\u00e9gr\u00e9 lors de la 31\u00e8me \u00e9dition du Festival de th\u00e9\u00e2tre de Jordanie, a annonc\u00e9 le jury. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le gouvernement pr\u00e9voit d\u0027\u00e9largir le\nservice du Roaming national qui...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement pr\u00e9voit d\u0027\u00e9largir le service du Roaming national qui permet aux abonn\u00e9s des services de t\u00e9l\u00e9phonie mobile l\u0027utilisation du r\u00e9seau d\u0027un autre op\u00e9rateur sans changement de tarif, avec la transition automatique entre les r\u00e9seaux, a indiqu\u00e9, lundi, le ministre de l\u0027Intelligence artificielle, de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Ahmed Rahhou. [www.lavieeco.com]\n-------------------------------------------------\nLe gouvernement pr\u00e9voit d\u2019\u00e9largir le service du Roaming national qui permet aux abonn\u00e9s des services de t\u00e9l\u00e9phonie mobile l\u2019utilisation du r\u00e9seau d\u2019un autre op\u00e9rateur sans changement de tarif, avec la transition automatique entre les r\u00e9seaux, a indiqu\u00e9, lundi, le ministre de l\u2019Intelligence artificielle, de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Ahmed Rahhou. [maroc-diplomatique.net]\n-------------------------------------------------\nLe gouvernement pr\u00e9voit d\u2019\u00e9largir le service du Roaming national qui permet aux abonn\u00e9s des services de t\u00e9l\u00e9phonie mobile l\u2019utilisation du r\u00e9seau d\u2019un autre op\u00e9rateur sans changement de tarif, avec la transition automatique entre les r\u00e9seaux, a indiqu\u00e9, lundi, le ministre de l\u2019Intelligence artificielle, de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Ahmed Rahhou.. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Membre du Conseil de l\u2019Union\ninternationale des t\u00e9l\u00e9communications depuis 1962,...", "mass": 5, "physics": false, "shape": "box", "title": "Membre du Conseil de l\u2019Union internationale des t\u00e9l\u00e9communications depuis 1962, le Maroc a \u00e9t\u00e9 r\u00e9\u00e9lu avec 125 voix lors de la Conf\u00e9rence de pl\u00e9nipotentiaires \u00e0 Doha. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a \u00e9t\u00e9 r\u00e9\u00e9lu au Conseil de l\u2019Union internationale des t\u00e9l\u00e9communications (UIT) pour la p\u00e9riode 2027-2030, avec 125 voix, \u00e0 l\u2019occasion de la 26e Conf\u00e9rence de pl\u00e9nipotentiaires, organis\u00e9e \u00e0 Doha, au Qatar. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 coups de d\u00e9clarations r\u00e9p\u00e9t\u00e9es,\nde menaces de retrait et...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 coups de d\u00e9clarations r\u00e9p\u00e9t\u00e9es, de menaces de retrait et de revendications pr\u00e9sent\u00e9es comme des \u00e9vidences, certains responsables politiques espagnols semblent vouloir peser sur la d\u00e9cision avant m\u00eame que la FIFA ne se prononce. [maroc-diplomatique.net]\n-------------------------------------------------\nLe candidat du Parti populaire (PP) \u00e0 la pr\u00e9sidence du gouvernement espagnol promet, s\u2019il acc\u00e8de \u00e0 la Moncloa, d\u2019engager des discussions avec la FIFA pour r\u00e9clamer que le match d\u00e9cisif se d\u00e9roule en Espagne. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u2019Union des Agences Conseil en\nCommunication (UACC), en collaboration avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union des Agences Conseil en Communication (UACC), en collaboration avec le D\u00e9partement de la Communication du Minist\u00e8re de la Jeunesse, de la Culture et des Sports et avec son soutien, annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019Union des Agences Conseil en Communication (UACC), en collaboration avec le D\u00e9partement de la Communication du Minist\u00e8re de la Jeunesse, de la Culture et des Sports et avec son soutien, annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [lnt.ma]\n-------------------------------------------------\nL\u2019Union des Agences Conseil en Communication (UACC) annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [telquel.ma]\n-------------------------------------------------\nL\u2019Union des agences conseil en communication (UACC), en collaboration avec le D\u00e9partement de la Communication du minist\u00e8re de la Jeunesse, de la Culture et des Sports, lance une \u00e9tude strat\u00e9gique consacr\u00e9e au march\u00e9 publicitaire marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Quatre joueuses de l\u2019AS FAR\net deux entra\u00eeneurs marocains figurent...", "mass": 5, "physics": false, "shape": "box", "title": "Quatre joueuses de l\u2019AS FAR et deux entra\u00eeneurs marocains figurent parmi les nomin\u00e9s des trois derni\u00e8res cat\u00e9gories f\u00e9minines des CAF Awards 2026, dont la c\u00e9r\u00e9monie de remise des distinctions est pr\u00e9vue le 2 d\u00e9cembre \u00e0 Lagos (Nigeria), a annonc\u00e9 mardi la Conf\u00e9d\u00e9ration africaine de football (CAF). [fr.hespress.com]\n-------------------------------------------------\nLes joueuses Ghizlane Chebbak, Khadija Er-Rmichi, Fatima Tagnaout et Imane Touriss sont en lice pour le troph\u00e9e de joueuse interclubs de l\u0027ann\u00e9e, tandis que Hicham Drissi, entr. [lematin.ma]\n-------------------------------------------------\nQuatre joueuses de l\u2019AS FAR et deux entra\u00eeneurs marocains figurent parmi les nomin\u00e9s des trois derni\u00e8res cat\u00e9gories f\u00e9minines des CAF Awards 2026, dont la c\u00e9r\u00e9monie de remise des distinctions est pr\u00e9vue le 2 d\u00e9cembre \u00e0 Lagos (Nigeria), a annonc\u00e9 mardi la Conf\u00e9d\u00e9ration africaine de football (CAF). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Des explosions ont retenti mardi\nmatin \u00e0 Bahre\u00efn, T\u00e9h\u00e9ran affirmant...", "mass": 5, "physics": false, "shape": "box", "title": "Des explosions ont retenti mardi matin \u00e0 Bahre\u00efn, T\u00e9h\u00e9ran affirmant avoir attaqu\u00e9 avec des drones une base am\u00e9ricaine dans ce pays du Golfe r\u00e9guli\u00e8rement pris pour cible depuis le d\u00e9but de la guerre au Moyen-Orient. [fr.hespress.com]\n-------------------------------------------------\nDes explosions ont \u00e9t\u00e9 entendues mardi matin \u00e0 Bahre\u00efn, o\u00f9 les Gardiens de la r\u00e9volution islamique ont revendiqu\u00e9 une attaque de drones de combat contre un syst\u00e8me radar appartenant aux forces am\u00e9ricaines sur la base Cheikh Issa. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Batteries \u00e9lectriques : 65,15 millions\nde dollars de la Banque...", "mass": 5, "physics": false, "shape": "box", "title": "Batteries \u00e9lectriques : 65,15 millions de dollars de la Banque asiatique d\u2019investissement pour l\u2019usine d\u2019anodes de BTR \u00e0 Tanger. [lematin.ma]\n-------------------------------------------------\nLa Banque asiatique d\u2019investissement dans les infrastructures a inscrit \u00e0 son portefeuille un financement de 65,15 millions de dollars destin\u00e9 \u00e0 l\u2019usine de mat\u00e9riaux d\u2019anodes du groupe chinois BTR New Material Group \u00e0 Tanger. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Cette op\u00e9ration s\u0027inscrit dans le\nprolongement de la s\u00e9ance de...", "mass": 5, "physics": false, "shape": "box", "title": "Cette op\u00e9ration s\u0027inscrit dans le prolongement de la s\u00e9ance de travail pr\u00e9sid\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, le 4 novembre dernier, consacr\u00e9e aux. [lematin.ma]\n-------------------------------------------------\nCette op\u00e9ration s\u0027inscrit dans le prolongement de la s\u00e9ance de travail pr\u00e9sid\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI, le 4 novembre dernier, consacr\u00e9e aux dispositions devant accompagner la cessation des activit\u00e9s de la Mission, cons\u00e9cutivement \u00e0 la non-reconduction de son mandat par le Conseil de s\u00e9curit\u00e9 des Nations unies. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le premier contingent de la\nMINURSO a amorc\u00e9 son retrait,...", "mass": 5, "physics": false, "shape": "box", "title": "Le premier contingent de la MINURSO a amorc\u00e9 son retrait, ce lundi \u00e0 La\u00e2youne, marquant ainsi le lancement de la premi\u00e8re phase du processus de retrait de la Mission, \u00e0 la suite de l\u2019expiration de son mandat le 31 octobre 2026, a-t-on constat\u00e9 sur place. [telquel.ma]\n-------------------------------------------------\nLe premier contingent de la MINURSO a amorc\u00e9 son retrait, ce lundi \u00e0 La\u00e2youne, marquant ainsi le lancement de la premi\u00e8re phase du processus de retrait de la Mission, \u00e0 la suite de l\u2019expiration de son mandat le 31 octobre 2026, a-t-on constat\u00e9 sur place. [www.lereporter.ma]\n-------------------------------------------------\nSelon la MAP, cette \u00e9tape intervient dans le prolongement des dispositions prises par les autorit\u00e9s marocaines pour accompagner la cessation des activit\u00e9s de la mission des Nations unies. [lnt.ma]"}]);

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');

            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
