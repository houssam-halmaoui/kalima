s de 141,9...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019activit\u00e9 Takaful a g\u00e9n\u00e9r\u00e9 un volume de primes de 141,9 millions de dirhams (MDH) en 2025, en hausse de 49,5% par rapport \u00e0 l\u2019exercice pr\u00e9c\u00e9dent, ressort-il du rapport annuel sur la stabilit\u00e9 financi\u00e8re. [fr.hespress.com]\n-------------------------------------------------\nSelon le 13\u1d49 Rapport sur la stabilit\u00e9 financi\u00e8re, publi\u00e9 conjointement par Bank Al-Maghrib, l\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) et l\u2019Autorit\u00e9. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Les exportations des produits agroalimentaires\nont poursuivi leur progression, atteignant...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [fr.hespress.com]\n-------------------------------------------------\nLes exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [telquel.ma]\n-------------------------------------------------\nLes exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Voici le texte du communiqu\u00e9\n:A l\u0027occasion de la F\u00eate...", "mass": 5, "physics": false, "shape": "box", "title": "Voici le texte du communiqu\u00e9 :A l\u0027occasion de la F\u00eate du Tr\u00f4ne de cette ann\u00e9e 1448 H- 2026 G, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu perp\u00e9tue Sa gloire, a bien voulu acc. [lematin.ma]\n-------------------------------------------------\nA l\u2019occasion de la F\u00eate du Tr\u00f4ne, le roi Mohammed VI, accord\u00e9 sa gr\u00e2ce \u00e0 1.788 personnes, dont certaines sont en d\u00e9tention et d\u2019autres en libert\u00e9, condamn\u00e9es par diff\u00e9rents tribunaux du Royaume, indique un communiqu\u00e9 du minist\u00e8re de la Justice. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc consid\u00e8re ces attaques\ncomme une violation flagrante de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc consid\u00e8re ces attaques comme une violation flagrante de la souverainet\u00e9 du Royaume d\u0027Arabie Saoudite, une atteinte grave \u00e0 sa s\u00e9curit\u00e9 nationale et une menace in. [lematin.ma]\n-------------------------------------------------\nLe Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nLe Maroc a condamn\u00e9 avec fermet\u00e9 les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res en Arabie saoudite, r\u00e9affirmant sa pleine solidarit\u00e9 avec Riyad et son soutien aux mesures prises pour pr\u00e9server sa souverainet\u00e9 et sa s\u00e9curit\u00e9. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Groupe BCP et Seniors\nPlus ont conclu un partenariat...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe BCP et Seniors Plus ont conclu un partenariat pour le lancement de Bladi Tiqqa, une offre de services destin\u00e9e aux Marocains du Monde et con\u00e7ue pour r\u00e9pondre. [lematin.ma]\n-------------------------------------------------\nLe Groupe Banque Centrale Populaire (BCP) et Seniors Plus ont conclu un partenariat strat\u00e9gique pour lancer \u00ab Bladi Tiqqa \u00bb, une offre de services destin\u00e9e aux Marocains du Monde (MDM) souhaitant accompagner leurs proches \u00e2g\u00e9s de 60 ans et plus vivant au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "\u00c0 l\u2019occasion du 27e anniversaire\nde son accession au Tr\u00f4ne,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 27e anniversaire de son accession au Tr\u00f4ne, le Roi Mohammed VI a adress\u00e9 un discours mercredi soir, depuis T\u00e9touan, Le Souverain y \u00e9rige la stabilit\u00e9 en \u00ab capital strat\u00e9gique \u00bb du pays, dresse le bilan d\u2019une d\u00e9cennie d\u2019industrialisation et appelle \u00e0 l\u2019ouverture d\u2019un nouveau cycle de d\u00e9veloppement au lendemain des prochaines l\u00e9gislatives.. [telquel.ma]\n-------------------------------------------------\nle Roi Mohammed VI a progressivement fait \u00e9merger une conception renouvel\u00e9e de la souverainet\u00e9, bien au-del\u00e0 de sa seule dimension [www.challenge.ma]\n-------------------------------------------------\nLe roi Mohammed VI s\u2019est dit fier des acquis et des r\u00e9alisations du Maroc au cours de ses 27 ann\u00e9es de r\u00e8gne, qui nourrissent \u00e9galement son optimisme pour l\u2019avenir du pays. [www.yabiladi.com]\n-------------------------------------------------\nLe Roi Mohammed VI a affirm\u00e9 que le renforcement de la souverainet\u00e9 nationale et l\u2019autosuffisance strat\u00e9gique ont \u00e9t\u00e9 \u00e9rig\u00e9s en axes majeurs du d\u00e9veloppement industriel. [leseco.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a affirm\u00e9 que le renforcement de la souverainet\u00e9 nationale et l\u2019autosuffisance strat\u00e9gique ont \u00e9t\u00e9 \u00e9rig\u00e9s en axes majeurs du d\u00e9veloppement industriel. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 l\u2019occasion du 27\u1d49 anniversaire\nde l\u2019intronisation du roi Mohammed...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 27\u1d49 anniversaire de l\u2019intronisation du roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [aujourdhui.ma]\n-------------------------------------------------\nBank Al-Maghrib c\u00e9l\u00e8bre le 27e anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI par l\u2019\u00e9mission d\u2019une pi\u00e8ce comm\u00e9morative en argent d\u2019une valeur faciale de 250 dirhams. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Conseil d\u2019Administration de l\u2019Office\nNational de l\u2019Electricit\u00e9 et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019Administration de l\u2019Office National de l\u2019Electricit\u00e9 et de l\u2019Eau Potable (ONEE), tenu lundi \u00e0 Rabat, s <div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 30/07/2026 à 13h39, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
