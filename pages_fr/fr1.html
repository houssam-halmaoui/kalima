emand Deutsche Bahn\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/affaires/transport-ferroviaire-oncf-signe-un-mou-avec-le-groupe-allemand-deutsche-bahn/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 16, "id": 248, "label": "L\u2019ONCF et le groupe allemand...", "shape": "dot", "size": 47, "title": "L\u2019ONCF et le groupe allemand Deutsche Bahn renforcent leur coop\u00e9ration\nSource: leseco.ma", "url": "https://leseco.ma/business/loncf-et-le-groupe-allemand-deutsche-bahn-renforcent-leur-cooperation.html", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 9, "id": 249, "label": "Apr\u00e8s les r\u00e9sultats, El Mansouri...", "shape": "dot", "size": 71, "title": "Apr\u00e8s les r\u00e9sultats, El Mansouri s\u2019exprime sur la primature, les alliances et Lekjaa\nSource: leseco.ma", "url": "https://leseco.ma/maroc/apres-les-resultats-el-mansouri-sexprime-sur-la-primature-les-alliances-et-lekjaa.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 14, "id": 250, "label": "InnoTrans 2026 : l\u2019ONCF remporte...", "shape": "dot", "size": 47, "title": "InnoTrans 2026 : l\u2019ONCF remporte \u00e0 Berlin le \u00ab\u00a0UIC Sustainability Impact Award\u00a0\u00bb\nSource: leseco.ma", "url": "https://leseco.ma/business/innotrans-2026-loncf-remporte-a-berlin-le-uic-sustainability-impact-award.html", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 0, "id": 253, "label": "Benkirane exclut toute participation du...", "shape": "dot", "size": 59, "title": "Benkirane exclut toute participation du PJD au gouvernement\nSource: lnt.ma", "url": "https://lnt.ma/benkirane-exclut-toute-participation-du-pjd-au-gouvernement/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Au lendemain des \u00e9lections l\u00e9gislatives\nqui ont plac\u00e9 le Parti...", "mass": 5, "physics": false, "shape": "box", "title": "Au lendemain des \u00e9lections l\u00e9gislatives qui ont plac\u00e9 le Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) en t\u00eate du scrutin, le secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement (PJD), Abdelilah Benkirane, a exclu toute participation de sa formation au futur gouvernement. [fr.hespress.com]\n-------------------------------------------------\nAbdelilah Benkirane, secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement (PJD), a d\u00e9clar\u00e9 avoir appel\u00e9 le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, apr\u00e8s l\u2019annonce des r\u00e9sultats des \u00e9lections l\u00e9gislatives. [telquel.ma]\n-------------------------------------------------\nAbdelilah Benkirane, secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement (PJD), a d\u00e9clar\u00e9 que son parti ne prendrait pas part au prochain gouvernement, qui doit \u00eatre dirig\u00e9 par le Parti authenticit\u00e9 et modernit\u00e9 (PAM). [www.yabiladi.com]\n-------------------------------------------------\nLe secr\u00e9taire g\u00e9n\u00e9ral du Parti de la justice et du d\u00e9veloppement a annonc\u00e9 que sa formation ne participerait pas au prochain gouvernement, au lendemain d\u2019un scrutin qui lui a rendu 54 si\u00e8ges apr\u00e8s l\u2019effondrement de 2021. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Son premier secr\u00e9taire, Driss Lachgar,\na estim\u00e9 que les r\u00e9sultats...", "mass": 5, "physics": false, "shape": "box", "title": "Son premier secr\u00e9taire, Driss Lachgar, a estim\u00e9 que les r\u00e9sultats provisoires du scrutin marquent une baisse par rapport aux pr\u00e9c\u00e9dentes \u00e9ch\u00e9ances, tout en assurant que le parti proc\u00e9dera \u00e0 une analyse approfondie de la situation . [fr.hespress.com]\n-------------------------------------------------\nLe Premier secr\u00e9taire de l\u2019Union socialiste des forces populaires (USFP), Driss Lachgar, a indiqu\u00e9 que les r\u00e9sultats des \u00e9lections l\u00e9gislatives, tenues mercredi, traduisent un recul du parti, affirmant que ce dernier s\u2019attachera \u00e0 examiner ces r\u00e9sultats au sein de ses propres instances. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Au lendemain du scrutin l\u00e9gislatif\ndu 23 septembre, le chef...", "mass": 5, "physics": false, "shape": "box", "title": "Au lendemain du scrutin l\u00e9gislatif du 23 septembre, le chef du gouvernement et ancien pr\u00e9sident du Rassemblement National des Ind\u00e9pendants (RNI), Aziz Akhannouch, a adress\u00e9 ses f\u00e9licitations au Parti Authenticit\u00e9 et Modernit\u00e9 (PAM), arriv\u00e9 en t\u00eate des r\u00e9sultats proclam\u00e9s aux premi\u00e8res heures de la matin\u00e9e de ce jeudi par le minist\u00e8re de l\u2019Int\u00e9rieur. [fr.hespress.com]\n-------------------------------------------------\nLe Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) est arriv\u00e9 en t\u00eate des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales pour l\u2019\u00e9lection des membres de la Chambre des repr\u00e9sentants, organis\u00e9es, mercredi, en remportant 97 si\u00e8ges selon les r\u00e9sultats provisoires, a annonc\u00e9, dans la nuit de mercredi \u00e0 jeudi, le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u0027Int\u00e9rieur, Abdelouafi Laftit, a annonc\u00e9 que les r\u00e9sultats provisoires de l\u0027op\u00e9ration de d\u00e9pouillement et de d\u00e9compte des voix au titre des circonscriptions locales et r\u00e9gionales dans le cadre des \u00e9lections l\u00e9gislatives, tenues mercredi, ont donn\u00e9 pour vainqueur le Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) avec 97 si\u00e8ges. [leseco.ma]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a annonc\u00e9 que les r\u00e9sultats provisoires de l\u2019op\u00e9ration de d\u00e9pouillement et de d\u00e9compte des voix au titre des circonscriptions locales et r\u00e9gionales dans le cadre des \u00e9lections l\u00e9gislatives, tenues mercredi, ont donn\u00e9 pour vainqueur le Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) avec 97 si\u00e8ges. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La dirigeante PAMiste, Fatima-Zahra El\nMansouri a d\u00e9clar\u00e9 ce jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "La dirigeante PAMiste, Fatima-Zahra El Mansouri a d\u00e9clar\u00e9 ce jeudi 24 septembre, que si le Roi Mohammed VI d\u00e9cidait de la nommer Chef du gouvernement, ce serait \u00ab un grand honneur \u00bb pour elle. [fr.hespress.com]\n-------------------------------------------------\nLa coordinatrice de la direction coll\u00e9giale du Parti authenticit\u00e9 et modernit\u00e9 (PAM), Fatima Ezzahra El Mansouri, a affirm\u00e9 que le parti reste ouvert \u00e0 l\u2019ensemble des formations politiques nationales et qu\u2019il n\u2019y a pas de \u00ab lignes rouges \u00bb concernant les alliances. [telquel.ma]\n-------------------------------------------------\nFatima Zahra Mansouri, coordinatrice de la direction coll\u00e9giale du secr\u00e9tariat g\u00e9n\u00e9ral du Parti Authenticit\u00e9 et Modernit\u00e9 (PAM), a affirm\u00e9 que sa formation est ouverte \u00e0 lensemble des partis politiques nationaux, soulignant qu\u00abil nexiste aucune ligne rouge en mati\u00e8re dalliances\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLa coordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) s\u0027exprimait, ce jeudi, lors d\u2019une conf\u00e9rence de presse tenue \u00e0 asablanca, une convention destin\u00e9e \u00e0 mieux accompagner les jeunes entrepreneurs. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et R\u00e9seau Entreprendre Maroc (REM) ont sign\u00e9 une nouvelle convention visant \u00e0 renforcer l\u2019accompagnement des jeunes entrepreneurs et \u00e0 faciliter leur acc\u00e8s au financement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "En ex\u00e9cution des instructions royales,\nAbdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions royales, Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du chef du gouvernement charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale, a re\u00e7u, jeudi \u00e0 Rabat, une d\u00e9l\u00e9gation du Congr\u00e8s am\u00e9ricain conduite par Brian Mast, pr\u00e9sident de la Commission des affaires \u00e9trang\u00e8res de la Chambre des repr\u00e9sentants des \u00c9tats-Unis, en visite de travail dans le. [telquel.ma]\n-------------------------------------------------\nSur Hautes Instructions Royales, Abdellatif Loudiyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du gouvernement charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale, a rencontr\u00e9 jeudi \u00e0 Rabat une d\u00e9l\u00e9gation du Congr\u00e8s am\u00e9ricain, men\u00e9e par Brian Mast, pr\u00e9sident de la commission des Affaires \u00e9trang\u00e8res de la Chambre des repr\u00e9sentants, en visite de travail au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019\u00c9tat plurinational de Bolivie a\nfait part, mercredi \u00e0 New...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00c9tat plurinatio             setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
