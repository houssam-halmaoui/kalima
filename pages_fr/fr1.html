027export en 2025, enregistrant une augmentation significative de 11 % et un chiffre d\u0027affaires d\u00e9passant 1,23 milliard de dirhams (MMDH), selon le secr\u00e9tariat d\u0027\u00c9tat charg\u00e9 de l\u0027Artisanat et de l\u0027\u00c9conomie sociale et solidaire. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "D\u00e9faits lors des demi-finales face\nau S\u00e9n\u00e9gal et au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "D\u00e9faits lors des demi-finales face au S\u00e9n\u00e9gal et au Maroc respectivement, l\u2019\u00c9gypte et le Nigeria devront se remobiliser pour disputer, samedi (17h00) au Complexe Sportif Mohammed V de Casablanca, le match de classement de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2025. [fr.hespress.com]\n-------------------------------------------------\nD\u00e9faits lors des demi-finales face au S\u00e9n\u00e9gal et au Maroc respectivement, l\u2019\u00c9gypte et le Nigeria devront se remobiliser pour disputer, samedi (17h00) au Complexe Sportif Mohammed V de Casablanca, le match de classement de la CAN 2025. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Jalal Jayed, exp\u00e9riment\u00e9 international, sera\nassist\u00e9 par ses compatriotes Zakaria...", "mass": 5, "physics": false, "shape": "box", "title": "Jalal Jayed, exp\u00e9riment\u00e9 international, sera assist\u00e9 par ses compatriotes Zakaria Brinsi et Mostafa Akarkad, tandis que l\u2019Alg\u00e9rien Lahou Benbraham officiera au VAR avec l\u2019aide du T. [lematin.ma]\n-------------------------------------------------\nLe Marocain, Jalal Jayed, a \u00e9t\u00e9 d\u00e9sign\u00e9 arbitre principal pour le match de classement de la Coupe d\u2019Afrique des Nations-2025 entre l\u2019Egypte et le Nigeria, samedi au complexe sportif Mohammed V de Casablanca (17H00), a annonc\u00e9, vendredi, la Conf\u00e9d\u00e9ration africaine de football (CAF). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Suite au d\u00e9c\u00e8s de M.\nHassan Ouriagli, Pr\u00e9sident Directeur G\u00e9n\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "Suite au d\u00e9c\u00e8s de M. Hassan Ouriagli, Pr\u00e9sident Directeur G\u00e9n\u00e9ral d\u2019Al Mada, le Conseil d\u2019administration, r\u00e9uni le 16 janvier 2026, lui a rendu hommage pour son leadership, ses nom. [lematin.ma]\n-------------------------------------------------\nSuite au d\u00e9c\u00e8s de Hassan Ouriagli, Pr\u00e9sident-Directeur G\u00e9n\u00e9ral d\u2019Al Mada, le Conseil d\u2019administration du groupe a d\u00e9cid\u00e9 de nommer Mme Noufissa Kessar \u00e0 ce poste, avec effet imm\u00e9diat. [www.challenge.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration d\u2019Al Mada, r\u00e9uni vendredi, a d\u00e9cid\u00e9 de nommer Noufissa Kessar au poste de Pr\u00e9sidente-directrice g\u00e9n\u00e9rale du groupe, avec effet imm\u00e9diat, succ\u00e9dant \u00e0 feu Hassan Ouriagli. [leseco.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration d\u2019Al Mada, r\u00e9uni vendredi, a d\u00e9cid\u00e9 de nommer Mme Noufissa Kessar au poste de Pr\u00e9sidente-Directrice G\u00e9n\u00e9rale du groupe, avec effet imm\u00e9diat, succ\u00e9dant \u00e0 feu Hassan Ouriagli. [atlasinfo.fr]\n-------------------------------------------------\nLe groupe Al Mada a annonc\u00e9, \u00e0 l\u2019issue d\u2019une r\u00e9union de son Conseil d\u2019administration, la nomination de Mme Noufissa Kessar au poste de Pr\u00e9sidente-Directrice G\u00e9n\u00e9rale, avec effet imm\u00e9diat, \u00e0 la suite du d\u00e9c\u00e8s de M. Hassan Ouriagli, qui occupait jusqu\u2019alors cette fonction. [lnt.ma]"}, {                 var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
