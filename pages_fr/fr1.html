": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Parti authenticit\u00e9 et modernit\u00e9\n(PAM), arriv\u00e9 en t\u00eate des...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parti authenticit\u00e9 et modernit\u00e9 (PAM), arriv\u00e9 en t\u00eate des l\u00e9gislatives du 23 septembre, formera la prochaine majorit\u00e9 avec l\u2019Istiqlal, l\u2019Union socialiste des forces populaires (USFP) et le Parti du Progr\u00e8s et du Socialisme (PPS). [fr.hespress.com]\n-------------------------------------------------\nApr\u00e8s deux rounds de consultations conduits par Fatima-Zahra El Mansouri, Cheffe du. [lematin.ma]\n-------------------------------------------------\nApr\u00e8s deux tours de consultations conduites par Fatima Ezzahra El Mansouri, cheffe du gouvernement d\u00e9sign\u00e9e, la nouvelle majorit\u00e9 prend forme. [telquel.ma]\n-------------------------------------------------\nLes quatre partis politiques composant la nouvelle majorit\u00e9 gouvernementale oeuvreront \u00e0 proposer des ministres, femmes et hommes, r\u00e9pondant aux crit\u00e8res de comp\u00e9tence, de sens politique, d\u2019int\u00e9grit\u00e9 [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019\u00e9quipe libyenne de futsal s\u2019est\ninclin\u00e9e face \u00e0 son homologue...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe libyenne de futsal s\u2019est inclin\u00e9e face \u00e0 son homologue zambienne par 3 buts \u00e0 1, en match de la 1\u00e8re journ\u00e9e du groupe A de la Coupe d\u2019Afrique des Nations de futsal (Maroc-2026), disput\u00e9 lundi soir \u00e0 la salle couverte du stade Prince Moulay Abdellah \u00e0 Rabat. [fr.hespress.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Hicham Dguig a affirm\u00e9 que le match qui a oppos\u00e9 l\u2019\u00e9quipe du Maroc de futsal \u00e0 son homologue alg\u00e9rienne, lundi soir \u00e0 Rabat, pour le compte de la 1\u00e8re journ\u00e9e du groupe A de la Coupe d\u2019Afrique des Nations, a \u00e9t\u00e9 bon dans son ensemble, malgr\u00e9 les nombreuses occasions manqu\u00e9es. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Un m\u00e9morandum d\u2019entente (MoU) a\n\u00e9t\u00e9 sign\u00e9, lundi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Un m\u00e9morandum d\u2019entente (MoU) a \u00e9t\u00e9 sign\u00e9, lundi \u00e0 Rabat, entre la Cour de Cassation du Maroc et la Cour supr\u00eame de l\u2019Union des Comores en vue d\u2019\u00e9tablir un cadre institutionnel de coop\u00e9ration juridique et judiciaire entre les deux parties. [fr.hespress.com]\n-------------------------------------------------\nUn m\u00e9morandum d\u2019entente (MoU) a \u00e9t\u00e9 sign\u00e9, lundi \u00e0 Rabat, entre la Cour de Cassation du Maroc et la Cour supr\u00eame de l\u2019Union des Comores en vue d\u2019\u00e9tablir un cadre institutionnel de coop\u00e9ration juridique et judiciaire entre les deux parties. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Prince H\u00e9ritier Moulay El\nHassan a pr\u00e9sid\u00e9, lundi au...", "mass": 5, "physics": false, "shape": "box", "title": "Le Prince H\u00e9ritier Moulay El Hassan a pr\u00e9sid\u00e9, lundi au Parc d\u2019expositions Mohammed VI d\u2019El Jadida, la c\u00e9r\u00e9monie d\u2019ouverture de la 17e \u00e9dition du Salon du Cheval d\u2019El Jadida, organis\u00e9e sous le haut patronage du Roi Mohammed VI, sous le th\u00e8me \u00ab Le cheval au service de l\u2019humain \u00bb. [fr.hespress.com]\n-------------------------------------------------\ 9information et le renforcement de leur r\u00e9silience ne sont plus un choix, mais une n\u00e9cessit\u00e9 dict\u00e9e par les mutations num\u00e9riques, a soulign\u00e9, lundi \u00e0 Rabat, le ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du gouvernement, charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, Abdeltif Loudyi. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Chambre des repr\u00e9sentants \u00e9lit\nson pr\u00e9sident ce mardi 13...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants \u00e9lit son pr\u00e9sident ce mardi 13 octobre, alors que tous ses groupes n\u0027ont pas encore de voix officielle. [lematin.ma]\n-------------------------------------------------\nUn communiqu\u00e9 du pr\u00e9sident du bureau provisoire de la Chambre des repr\u00e9sentants indique que cette s\u00e9ance, qui se tient conform\u00e9ment aux dispositions de l\u2019article 62 de la Constitution, et \u00e0 l\u2019article 48 du R\u00e8glement Int\u00e9rieur de la Chambre, . [aujourdhui.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants tient mardi \u00e0 15h00 une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u0027\u00e9lection de son pr\u00e9sident, conform\u00e9ment \u00e0 la Constitution et \u00e0 son R\u00e8glement int\u00e9rieur. [www.lavieeco.com]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants tiendra, mardi 13 octobre \u00e0 15h, une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019\u00e9lection de son pr\u00e9sident, selon un communiqu\u00e9 du pr\u00e9sident du bureau provisoire de l\u2019institution l\u00e9gislative. [leseco.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants tient mardi 13 octobre \u00e0 15 heures la s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019\u00e9lection de son pr\u00e9sident, convoqu\u00e9e par le pr\u00e9sident du bureau provisoire, Abdelaziz Abba, dans un communiqu\u00e9 dat\u00e9 du 11 octobre. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "ESSEC Business School : dix\nans au Maroc et de...", "mass": 5, "physics": false, "shape": "box", "title": "ESSEC Business School : dix ans au Maroc et de nouvelles ambitions pour son Campus Afrique. [lematin.ma]\n-------------------------------------------------\nDix ans apr\u00e8s son implantation au Maroc, l\u2019ESSEC Business School \u2013 Campus Afrique c\u00e9l\u00e8bre une d\u00e9cennie de d\u00e9veloppement, d\u2019innovation et d\u2019engagement au service des talents et des organisations du continent. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 Rabat, l\u2019ESSEC Business School r\u00e9unit sa gouvernance, ses partenaires et sa communaut\u00e9 pour c\u00e9l\u00e9brer les dix ans de son Campus Afrique, une d\u00e9cennie d\u2019ancrage sur le continent et d\u2019ouverture sur le monde. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Dans le cadre de ce\nnouveau contrat, Thales fournira \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de ce nouveau contrat, Thales fournira \u00e0 Royal Air Maroc une plateforme technologique de pointe dans le domaine des sacoches de vol \u00e9lectroniques (EFB). [lematin.ma]\n-------------------------------------------------\nDans le cadre de ce nouveau contrat, Thales fournira \u00e0 Royal Air Maroc une plateforme technologique de pointe dans le domaine des sacoches de vol \u00e9lectroniques (EFB). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Marrak         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');

                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                    node.scrollBy(0, 50);

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
