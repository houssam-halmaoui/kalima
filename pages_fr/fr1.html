9rieur des Oul\u00e9mas, indique un communiqu\u00e9 du Cabinet royal. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cette \u00e9volution marque une reconnaissance\nde la qualit\u00e9 des dispositifs...", "mass": 5, "physics": false, "shape": "box", "title": "Cette \u00e9volution marque une reconnaissance de la qualit\u00e9 des dispositifs de gestion de Valoris Management, couvrant notamment la gouvernance, les processus d\u2019investissement, la gest. [lematin.ma]\n-------------------------------------------------\nValoris Management a annonc\u00e9 le rel\u00e8vement de sa notation nationale de qualit\u00e9 de gestion d\u2019investissement (IMQR) par Fitch Ratings, passant de \u00ab Strong (mar) \u00bb \u00e0 \u00ab Excellent (mar) \u00bb, avec une perspective stable. [lnt.ma]\n-------------------------------------------------\nValoris management a annonc\u00e9 le rel\u00e8vement de sa notation nationale de qualit\u00e9 de gestion d\u2019investissement IMQR par Fitch ratings, laquelle passe de \u00abStrong (mar)\u00bb \u00e0 \u00abExcellent (mar)\u00bb, avec une perspective stable. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "easyJet a officiellement inaugur\u00e9 \u00e0\nMarrakech sa premi\u00e8re base en...", "mass": 5, "physics": false, "shape": "box", "title": "easyJet a officiellement inaugur\u00e9 \u00e0 Marrakech sa premi\u00e8re base en Afrique, marquant une nouvelle \u00e9tape dans sa pr\u00e9sence au Maroc, o\u00f9 la compagnie op\u00e8re depuis plus de 20 ans. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u2019a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u2019Office national marocain du tourisme (ONMT). [telquel.ma]\n-------------------------------------------------\nLa compagnie easyJet a inaugur\u00e9, mercredi 15 avril, sa nouvelle base \u00e0 l\u2019a\u00e9roport Marrakech Menara, dans le cadre de la strat\u00e9gie de l\u2019Office National Marocain du Tourisme (ONMT) [www.challenge.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne EasyJet a inaugur\u00e9, mercredi, sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u0027a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 avec l\u0027Office National Marocain du Tourisme (ONMT). [leseco.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne easyJet a inaugur\u00e9 sa premi\u00e8re base en Afrique, implant\u00e9e \u00e0 Marrakech, dans le cadre de l\u2019acc\u00e9l\u00e9ration de son d\u00e9veloppement au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "AXA Services Maroc a proc\u00e9d\u00e9,\nle 15 avril \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "AXA Services Maroc a proc\u00e9d\u00e9, le 15 avril \u00e0 Rabat, \u00e0 la signature de deux conventions de partenariat avec l\u2019Universit\u00e9 Mohammed V de Rabat et l\u2019\u00c9cole Sup\u00e9rieure de Technologie de S. [lematin.ma]\n-------------------------------------------------\nAXA Services Maroc a sign\u00e9 deux conventions-cadres de partenariat avec l\u2019Universit\u00e9 Mohammed V de Rabat et l\u2019\u00c9cole Sup\u00e9rieure de Technologie de Sal\u00e9, dans l\u2019objectif de renforcer la coop\u00e9ration entre le monde acad\u00e9mique et l\u2019entreprise. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Inaugur\u00e9e lundi dernier sur Ordre\nde Sa         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
