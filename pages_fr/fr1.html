h": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Lors de cette assembl\u00e9e, Son\nAltesse la Princesse Lalla Zineb...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette assembl\u00e9e, Son Altesse la Princesse Lalla Zineb a mis en avant les projets r\u00e9alis\u00e9s durant l\u2019ann\u00e9e 2024, en faveur des enfants priv\u00e9s de famille, dans le cadre du pro. [lematin.ma]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de La Ligue Marocaine pour la Protection de l\u2019Enfance (LMPE), a pr\u00e9sid\u00e9 jeudi \u00e0 Rabat, la r\u00e9union de l\u2019Assembl\u00e9e G\u00e9n\u00e9rale de la Ligue, au cours de laquelle ont \u00e9t\u00e9 pr\u00e9sent\u00e9s les rapports moral et financier au titre de l\u2019ann\u00e9e 2024, le programme d\u2019actions 2025-2026, ainsi que le rapport . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc occupe actuellement la\n13e place dans le classement...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc occupe actuellement la 13e place dans le classement mondial de l\u2019ONU Tourisme des meilleures destinations en termes de croissance au niveau international. [lematin.ma]\n-------------------------------------------------\nLe Maroc confirme, une fois de plus, son statut de destination incontournable, en figurant parmi les meilleures destinations dans la plupart des listes et classements internationaux pour 2025-2026, [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Dans un mot publi\u00e9 sur\nle site officiel du Festival...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un mot publi\u00e9 sur le site officiel du Festival international du Film de Marrakech \u00e0 l\u0027occasion de sa 22e \u00e9dition, qui se d\u00e9roulera du 28 novembre au 06 d\u00e9cembre, S.A.R. [lematin.ma]\n-------------------------------------------------\nDepuis sa cr\u00e9ation, le Festival international du Film de Marrakech \u201cs\u2019est affirm\u00e9 comme un lieu de dialogue et de d\u00e9couverte, un espace o\u00f9 les cultures se croisent et les talents \u00e9mergent\u201d, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Niger, Bakary Yaou Sangar\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Commission de l\u2019Int\u00e9rieur \u00e0\nla Chambre des repr\u00e9sentants a...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de l\u2019Int\u00e9rieur \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9 un amendement qui rehausse significativement les tentions par la Commission de l\u0027Int\u00e9rieur \u00e0 la Chambre des repr\u00e9sentants. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le groupe Intelcia, cofond\u00e9 par\nKarim Bernoussi et El Aoufi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Intelcia, cofond\u00e9 par Karim Bernoussi et El Aoufi, a annonc\u00e9 ce mercredi 26 novembre la signature d\u2019un accord avec le Altice pour racheter les 65 % du capital que le groupe de Patrick Drahi d\u00e9tenait depuis 2016. [telquel.ma]\n-------------------------------------------------\nLes actionnaires dirigeants d\u2019Intelcia, \u00e0 savoir les co-fondateurs Karim Bernoussi et Youssef El Aoufir, d\u00e9tiennent d\u00e9sormais 100% des parts de la soci\u00e9t\u00e9, apr\u00e8s un accord convenu, le 24 [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le g\u00e9ant am\u00e9ricain de la\nmobilit\u00e9 a officialis\u00e9 ce jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9ant am\u00e9ricain de la mobilit\u00e9 a officialis\u00e9 ce jeudi son retour au Maroc, sept ans apr\u00e8s avoir suspendu ses activit\u00e9s en raison d\u2019un vide juridique persistant dans le secteur des VTC. [telquel.ma]\n-------------------------------------------------\nLa plateforme entend devenir un partenaire privil\u00e9gi\u00e9 de cette transformation num\u00e9rique, en apportant des solutions technologiques innovantes, fiables et famili\u00e8res . [aujourdhui.ma]\n-------------------------------------------------\nL\u0027application Uber est d\u00e9sormais accessible \u00e0 Casablanca et Marrakech, en partenariat exclusif avec des v\u00e9hicules de transport agr\u00e9\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nUber a officiellement lanc\u00e9 son service de transport au Maroc, offrant d\u00e9sormais la possibilit\u00e9 de commander des courses via son application \u00e0 Casablanca et Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "L\u2019op\u00e9ration d\u2019inscription \u00e9lectronique des personnes\nd\u00e9sireuses d\u2019accomplir le rite du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration d\u2019inscription \u00e9lectronique des personnes d\u00e9sireuses d\u2019accomplir le rite du p\u00e8lerinage au titre de la saison 1448 H/2027 se d\u00e9roulera du lundi 8 d\u00e9cembre au vendredi 19 d\u00e9cembre 2025, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re des Habous et des Affaires islamiques a annonc\u00e9 que les inscriptions \u00e9lectroniques pour le p\u00e8lerinage au titre de la saison 1448 H/2027 auront lieu du 8 au 19 d\u00e9cembre 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Contr\u00f4leur g\u00e9n\u00e9ral, conseiller aux\naffaires europ\u00e9ennes et internationales \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le Contr\u00f4leur g\u00e9n\u00e9ral, conseiller aux affaires europ\u00e9ennes et internationales \u00e0 la Direction g\u00e9n\u00e9rale de la Police nationale fran\u00e7aise, Lucas Philippe, a \u00e9t\u00e9 \u00e9lu, jeudi \u00e0 Marrakech lors de la 93e Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (INTERPOL), nouveau pr\u00e9sident pour un mandat de quatre ans. [telquel.ma]\n-------------------------------------------------\nLe Fran\u00e7ais Lucas Philippe, a \u00e9t\u00e9 \u00e9lu, jeudi 27 novembre, nouveau pr\u00e9sident d\u2019Interpol pour un mandat de quatre ans, lors de la 93\u00e8me Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale [www.challenge.ma]\n-------------------------------------------------\nLors de la 93e Assembl\u00e9e g\u00e9n\u00e9rale d\u2019Interpol, tenue \u00e0 Marrakech du 24 au 27 novembre, Lucas Philippe a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de l\u2019Organisation internationale de police criminelle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le chiffre d\u2019affaires global pr\u00e9visionnel\nde l\u2019Office national des chemins...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la [www.challenge.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) global pr\u00e9visionnel de l\u0027Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u0027activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [leseco.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires (CA) global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u2019activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le pr\u00e9sident du Conseil d\u2019administration\nde la Bourse de Casablanca,...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du Conseil d\u2019administration de la Bourse de Casablanca, Brahim Benjelloun Touimi, a appel\u00e9, jeudi \u00e0 Rabat, \u00e0 adopter une approche \u00ab Africa First \u00bb, qui place le continent [www.challenge.ma]\n-------------------------------------------------\nLe pr\u00e9sident du Conseil d\u0027administration de la Bourse de Casablanca, Brahim Benjelloun Touimi, a appel\u00e9, jeudi \u00e0 Rabat, \u00e0 adopter une approche \"Africa First\", qui place le continent au c\u0153ur des strat\u00e9gies de financement, afin de renforcer l\u0027attractivit\u00e9 des projets africains et d\u0027acc\u00e9l\u00e9rer leur bancabilit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Il devient ainsi sponsor officiel\ndes \u00e9quipes nationales, consacrant l\u2019alliance...", "mass": 5, "physics": false, "shape": "box", "title": "Il devient ainsi sponsor officiel des \u00e9quipes nationales, consacrant l\u2019alliance de deux institutions unies par des valeurs communes de performance, d\u2019engagement citoyen et de contribution active au rayonnement du Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLe Groupe Al Omrane a sign\u00e9, mercredi \u00e0 Rabat, une convention de partenariat strat\u00e9gique avec la F\u00e9d\u00e9ration royale marocaine de football (FRMF), faisant officiellement de l\u2019op\u00e9rateur public un sponsor officiel des \u00e9quipes nationales. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Pr\u00e9vu les 19 et 20\nd\u00e9cembre \u00e0 Oujda, ce rendez-vous...", "mass": 5, "physics": false, "shape": "box", "title": "Pr\u00e9vu les 19 et 20 d\u00e9cembre \u00e0 Oujda, ce rendez-vous de r\u00e9f\u00e9rence d\u00e9di\u00e9 \u00e0 la transformation num\u00e9rique, \u00e0 l\u2019innovation et a
