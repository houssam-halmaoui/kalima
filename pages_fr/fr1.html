or": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La R\u00e9publique arabe d\u2019\u00c9gypte a\nr\u00e9affirm\u00e9, lundi au Caire, son...", "mass": 5, "physics": false, "shape": "box", "title": "La R\u00e9publique arabe d\u2019\u00c9gypte a r\u00e9affirm\u00e9, lundi au Caire, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Royaume du Maroc, ainsi qu\u2019\u00e0 la derni\u00e8re r\u00e9solution du Conseil de s\u00e9curit\u00e9 et une solution politique consensuelle. [fr.hespress.com]\n-------------------------------------------------\nCette r\u00e9solution souligne qu\u2019une autonomie r\u00e9elle sous souverainet\u00e9 marocaine constitue la solution la plus r\u00e9alisable pour le r\u00e8glement de la question du Sahara marocain.Cette pos. [lematin.ma]\n-------------------------------------------------\nLa R\u00e9publique arabe d\u2019\u00c9gypte a r\u00e9affirm\u00e9, lundi au Caire, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Royaume du Maroc, ainsi qu\u2019\u00e0 la derni\u00e8re r\u00e9solution du Conseil de s\u00e9curit\u00e9 et une solution politique consensuelle. [telquel.ma]\n-------------------------------------------------\nLa R\u00e9publique arabe d\u2019Egypte a r\u00e9affirm\u00e9, lundi au Caire, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Royaume du Maroc, ainsi qu\u2019\u00e0 la derni\u00e8re r\u00e9solution du Conseil de s\u00e9curit\u00e9 et une solution politique consensuelle. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "D\u00e8s la premi\u00e8re \u00e9tape du\nMarathon des sables 2026, les...", "mass": 5, "physics": false, "shape": "box", "title": "D\u00e8s la premi\u00e8re \u00e9tape du Marathon des sables 2026, les \u00e9lites mondiales ont affich\u00e9 leurs ambitions dans une course marqu\u00e9e par un rythme soutenu et des \u00e9carts particuli\u00e8rement ser. [lematin.ma]\n-------------------------------------------------\nAu bout de 40,5 km, il a enregistr\u00e9 2h58\u201926, suivi de son fr\u00e8re Rachid (3h03\u201901), puis de Micha\u00ebl Gras (3h03\u201946). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La participation de Schneider Electric\nau GITEX Africa Morocco 2026...", "mass": 5, "physics": false, "shape": "box", "title": "La participation de Schneider Electric au GITEX Africa Morocco 2026 s\u2019inscrit dans une dynamique nationale port\u00e9e par la digitalisation de l\u2019\u00e9conomie et les grands projets structur. [lematin.ma]\n-------------------------------------------------\nSchneider Electric annonce sa participation au GITEX 2026, qui se tiendra du 7 au 9 avril \u00e0 Marrakech, confirmant son engagement \u00e0 accompagner le Maroc dans sa transition vers des infrastructures \u00e9nerg\u00e9tiques durables et une industrie acc\u00e9l\u00e9r\u00e9e par l\u2019intelligence artificielle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Ce projet, qui pr\u00e9voit la\nmise en place d\u2019une unit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet, qui pr\u00e9voit la mise en place d\u2019une unit\u00e9 int\u00e9gr\u00e9e \u00e0 la raffinerie de Casablanca, repose sur un principe simple : capter le CO\u2082 issu des proc\u00e9d\u00e9s industriels, le purifier. [lematin.ma]\n-------------------------------------------------\nUne nouvelle unit\u00e9 d\u00e9di\u00e9e \u00e0 la production de CO\u2082 liquide alimentaire sera mise en exploitation \u00e0 Casablanca d\u2019ici la fin de cette ann\u00e9e, avec une capacit\u00e9 annuelle de production de d\u00e9marrage de 20.000 tonnes. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Cosumar a lanc\u00e9 le projet LCO\u2082 (gaz carbonique alimentaire liquide), une nouvelle unit\u00e9 d\u00e9di\u00e9e \u00e0 la production de CO\u2082 liquide alimentaire \u00e0 Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc et l\u2019Egypte ont\nsign\u00e9, lundi au Caire, une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et l\u2019Egypte ont sign\u00e9, lundi au Caire, une s\u00e9rie de m\u00e9morandums d\u2019entente et d\u2019accords de coop\u00e9ration bilat\u00e9rale dans des domaines vitaux, \u00e0 l\u2019occasion de la tenue de la premi\u00e8re session du comit\u00e9 de coordination et de suivi maroco-\u00e9gyptien, copr\u00e9sid\u00e9 par le Chef du gouvernement, Aziz Akhannouch, et le Premier ministre \u00e9gyptien, Moustafa Madbouli.. [telquel.ma]\n-------------------------------------------------\nLe Maroc et lEgypte ont sign\u00e9, lundi au Caire, des m\u00e9morandums d\u2019entente et des accords de coop\u00e9ration, \u00e0 l\u2019occasion de la tenue de la premi\u00e8re session du comit\u00e9 de coordination et de suivi maroco-\u00e9gyptien, copr\u00e9sid\u00e9 par le Chef du gouvernement, Aziz Akhannouch, et le Premier ministre \u00e9gyptien, Moustafa Madbouli. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et l\u2019\u00c9gypte sont d\u00e9termin\u00e9s \u00e0 renforcer leurs relations historiques solides, dans le cadre d\u2019une volont\u00e9 commune d\u2019approfondir la coop\u00e9ration bilat\u00e9rale dans plusieurs domaines, a affirm\u00e9, lundi au Caire, le chef du gouvernement, Aziz Akhannouch. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc et l\u2019Egypte ont sign\u00e9, lundi au Caire, une s\u00e9rie de m\u00e9morandums d\u2019entente et d\u2019accords de coop\u00e9ration bilat\u00e9rale dans des domaines vitaux, \u00e0 l\u2019occasion de la tenue de la premi\u00e8re session du comit\u00e9 de coordination et de suivi maroco-\u00e9gyptien, copr\u00e9sid\u00e9 par le Chef du gouvernement, Aziz Akhannouch, et le Premier ministre \u00e9gyptien, Moustafa Madbouli. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le gouvernement a achev\u00e9 la\nmise en \u0153uvre du programme...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement a achev\u00e9 la mise en \u0153uvre du programme de r\u00e9habilitation des \u00e9tablissements de soins de sant\u00e9 primaires, \u00e0 travers la reconstruction, la modernisation et l\u2019\u00e9quipement de 1.400 centres de sant\u00e9 \u00e0 travers les diff\u00e9rentes provinces du Royaume, a affirm\u00e9 samedi \u00e0 Al Haouz, le chef du gouvernement, Aziz Akhannouch. [telquel.ma]\n-------------------------------------------------\nC\u2019est dans la province d\u2019Al Haouz que le minist\u00e8re de la Sant\u00e9 et de la Protection Sociale a choisi d\u2019officialiser l\u2019ach\u00e8vement du programme de r\u00e9habilitation de 1.400 \u00e9tablissements [www.challenge.ma]\n-------------------------------------------------\nLe gouvernement a achev\u00e9 la mise en \u0153uvre du programme de r\u00e9habilitation des \u00e9tablissements de soins de sant\u00e9 primaires, \u00e0 travers la reconstruction, la modernisation et l\u2019\u00e9quipement de 1 400 centres de sant\u00e9 \u00e0 travers les diff\u00e9rentes provinces du Maroc, a affirm\u00e9 samedi \u00e0 Al Haouz, le chef du gouvernement, Aziz Akhannouch. [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale parach\u00e8ve la r\u00e9habilitation de 1.400 \u00e9tablissements de soins primaires, un chantier titanesque mobilisant 6,43 milliards de dirhams. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019Espagnol Rafael J\u00f3dar a remport\u00e9,\ndimanche \u00e0 Marrakech, la 40e...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Espagnol Rafael J\u00f3dar a remport\u00e9, dimanche \u00e0 Marrakech, la 40e \u00e9dition du Grand Prix Hassan II, disput\u00e9e sur les courts du Royal Tennis Club de Marrakech. [telquel.ma]\n-------------------------------------------------\nL\u2019Espagnol Rafael J\u00f3dar a remport\u00e9 la 40e \u00e9dition du Grand Prix Hassan II de tennis, disput\u00e9e du 30 mars au 5 avril sur les courts du Royal Tennis Club de Marrakech, en s\u2019imposant en finale face \u00e0 l\u2019Argentin Marco Trungelliti. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Bank Al-Maghrib et l\u2019Autorit\u00e9 Marocaine\ndu March\u00e9 des Capitaux (AMMC)...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib et l\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) annoncent la mise en ligne du site web institutionnel de l\u2019Instance de Coordination du March\u00e9 \u00e0 terme (ICMAT), [www.challenge.ma]\n-------------------------------------------------\nBank Al-Maghrib (BAM) et l\u0027Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) ont annonc\u00e9, lundi, la mise en ligne du site web institutionnel de l\u0027Instance de coordination du March\u00e9 \u00e0 terme (ICMAT). [leseco.ma]\n-------------------------------------------------\nBank Al-Maghrib et Autorit\u00e9 Marocaine du March\u00e9 des Capitaux ont annonc\u00e9 la mise en ligne du portail institutionnel de l\u2019Instance de Coordination du March\u00e9 \u00e0 terme (ICMAT). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "z.systems, startup sp\u00e9cialis\u00e9e dans la\ndigitalis         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                            }
                        }

            });
        });
        
        observer.observe(document.body, {

            subtree: true
