nne d\u2019investissement ont dress\u00e9, \u00e0 l\u2019occasion de leur conf\u00e9rence de presse annuelle, tenue ce mardi \u00e0 Rabat, le bilan de l\u2019ann\u00e9e 2025 et pr\u00e9sent\u00e9 les principales priorit\u00e9s ainsi que les perspectives qui orienteront la coop\u00e9ration entre l\u2019UE et le Royaume au cours de l\u2019ann\u00e9e 2026. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les autorit\u00e9s locales de la\nprovince de Chefchaouen ont supervis\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s locales de la province de Chefchaouen ont supervis\u00e9 l\u2019op\u00e9ration de retour des familles \u00e9vacu\u00e9es \u00e0 titre pr\u00e9ventif du douar \u201cImoudnene\u201d, relevant de la commune de Tala. [lematin.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Chefchaouen ont entam\u00e9, depuis lundi, l\u2019op\u00e9ration de retour des habitants \u00e9vacu\u00e9s provisoirement de leurs domiciles, en raison des perturbations m\u00e9t\u00e9orologiques ayant affect\u00e9 la province. [telquel.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Chefchaouen ont entam\u00e9, depuis lundi, l\u2019op\u00e9ration de retour des habitants \u00e9vacu\u00e9s provisoirement de leurs domiciles, en raison des perturbations m\u00e9t\u00e9orologiques ayant affect\u00e9 la province. [www.yabiladi.com]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Sidi Kacem ont entam\u00e9, lundi, l\u2019ex\u00e9cution de la deuxi\u00e8me phase du programme de retour des habitants temporairement \u00e9vacu\u00e9s suite aux conditions climatiques exceptionnelles, apr\u00e8s l\u2019am\u00e9lioration des conditions m\u00e9t\u00e9orologiques et la baisse du niveau des eaux ayant submerg\u00e9 plusieurs zones de la province. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Port\u00e9e par BANK OF AFRICA\net ses partenaires acad\u00e9miques, la...", "mass": 5, "physics": false, "shape": "box", "title": "Port\u00e9e par BANK OF AFRICA et ses partenaires acad\u00e9miques, la Chaire Panafricaine de Durabilit\u00e9 et Finance \u00e0 Impact atteint aujourd\u2019hui une phase de maturit\u00e9, confirmant sa vocation. [lematin.ma]\n-------------------------------------------------\nDans un contexte de mobilisation croissante autour des enjeux de durabilit\u00e9, Bank of Africa annonce le lancement du Prix d\u2019Excellence en Durabilit\u00e9 \u0026 Impact, une initiative pionni\u00e8re port\u00e9e [www.challenge.ma]\n-------------------------------------------------\nBank of Africa (BOA) a, r\u00e9cemment, lanc\u00e9 le Prix d\u2019Excellence en Durabilit\u00e9 \u0026 Impact avec un appel \u00e0 candidatures ouvert du 15 f\u00e9vrier au 15 avril. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00ab Sur proposition de l\u2019\u00c9tat\nfran\u00e7ais, Madame Anne-Claire Legendre a...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Sur proposition de l\u2019\u00c9tat fran\u00e7ais, Madame Anne-Claire Legendre a \u00e9t\u00e9 d\u00e9sign\u00e9e membre du Conseil d\u2019administration et \u00e9lue Pr\u00e9sidente de l\u2019Institut du monde arabe. [lematin.ma]\n-------------------------------------------------\nLe conseil d\u2019administration de l\u2019Institut du monde arabe (IMA) \u00e0 Paris a confirm\u00e9 mardi la nomination de la diplomate fran\u00e7aise Anne-Claire Legendre, premi\u00e8re femme \u00e0 la t\u00eate de cette institution. [telquel.ma]\n-------------------------------------------------\n\u00ab Sur proposition de l\u2019\u00c9tat fran\u00e7ais, Madame Anne-Claire Legendre a \u00e9t\u00e9 d\u00e9sign\u00e9e membre du Conseil d\u2019administration et \u00e9lue Pr\u00e9sidente de l\u2019Institut du monde arabe. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u2019occasion du mois sacr\u00e9\nde Ramadan 1447, l\u2019Office National...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du mois sacr\u00e9 de Ramadan 1447, l\u2019Office National des Chemins de Fer (ONCF) adresse ses meilleurs v\u0153ux \u00e0 ses clients et annonce l\u2019adaptation de son programme de circulation aux horaires administratifs en vigueur durant cette p\u00e9riode. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du mois sacr\u00e9 de Ramadan 1447, l\u2019Office National des Chemins de Fer (ONCF) annonce l\u2019adaptation de son programme de circulation aux horaires administratifs en vigueur durant [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Pour sa 19\u1d49 \u00e9dition, qui\nse tiendra du 2 au...", "mass": 5, "physics": false, "shape": "box", "title": "Pour sa 19\u1d49 \u00e9dition, qui se tiendra du 2 au 11 juillet 2026 \u00e0 Anfa Park \u00e0 Casablanca, le festival Jazzablanca annonce une nouveaut\u00e9 de taille : quatre concerts chaque soir, r\u00e9partis entre la Sc\u00e8ne 21 et la grande sc\u00e8ne. [telquel.ma]\n-------------------------------------------------\nLa 19\u1d49 \u00e9dition du festival Jazzablanca se tiendra du 2 au 11 juillet 2026,avec plus de 50 artistes programm\u00e9s sur dix jours de concerts entre Anfa Park et le Parc de la Ligue arabe, confirmant l\u2019ampleur exceptionnelle de cette nouvelle \u00e9dition. [lnt.ma]\n-------------------------------------------------\nDu 2 au 11 juillet 2026, le festival casab                     communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
