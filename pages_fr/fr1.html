 Impact, une initiative pionni\u00e8re port\u00e9e [www.challenge.ma]\n-------------------------------------------------\nBank of Africa (BOA) a, r\u00e9cemment, lanc\u00e9 le Prix d\u2019Excellence en Durabilit\u00e9 \u0026 Impact avec un appel \u00e0 candidatures ouvert du 15 f\u00e9vrier au 15 avril. [leseco.ma]\n-------------------------------------------------\nPort\u00e9e par BANK OF AFRICA et ses partenaires acad\u00e9miques, la Chaire Panafricaine de Durabilit\u00e9 et Finance \u00e0 Impact atteint aujourd\u2019hui une phase de maturit\u00e9, confirmant sa vocation. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La Chine a annonc\u00e9 la\nsuppression des droits de douane...", "mass": 5, "physics": false, "shape": "box", "title": "La Chine a annonc\u00e9 la suppression des droits de douane sur les importations en provenance de la quasi-totalit\u00e9 des pays africains, \u00e0 compter du 1er mai. [www.challenge.ma]\n-------------------------------------------------\nLa Chine va supprimer totalement les droits de douane sur les importations en provenance de 53 pays africains, dont le Maroc, \u00e0 partir du 1er mai 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Cette \u00e9dition intervient dans un\ncontexte jug\u00e9 porteur, marqu\u00e9 par...", "mass": 5, "physics": false, "shape": "box", "title": "Cette \u00e9dition intervient dans un contexte jug\u00e9 porteur, marqu\u00e9 par l\u2019entr\u00e9e en vigueur de la nouvelle Charte de l\u2019investissement Entrepreneuriat : La Banque Populaire a lanc\u00e9 \u00e0 Rabat les troisi\u00e8mes \u00e9dition des R\u00e9gionales de l\u2019investissement, une tourn\u00e9e nationale d\u00e9di\u00e9e \u00e0 la promotion de la Charte de l\u2019investissement en faveur des TPME. [aujourdhui.ma]\n---------------------  26}, "group": 22, "id": "comm_label_22", "label": "Les Royaumes du Maroc et\nde Bahre\u00efn aspirent \u00e0 hisser...", "mass": 5, "physics": false, "shape": "box", "title": "Les Royaumes du Maroc et de Bahre\u00efn aspirent \u00e0 hisser leurs relations distingu\u00e9es au rang d\u0027un partenariat compl\u00e9mentaire et solidaire, a indiqu\u00e9, lundi \u00e0 La\u00e2youne, le ministre bahre\u00efni des Affaires \u00e9trang\u00e8res, Abdullatif bin Rashid Al Zayani. [atlasinfo.fr]\n-------------------------------------------------\nLes Royaumes du Maroc et de Bahre\u00efn aspirent \u00e0 hisser leurs relations distingu\u00e9es au rang d\u2019un partenariat compl\u00e9mentaire et solidaire, a indiqu\u00e9, lundi \u00e0 La\u00e2youne, le ministre bahre\u00efni des Affaires \u00e9trang\u00e8res, Abdullatif bin Rashid Al Zayani. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les autorit\u00e9s locales de la\nprovince de Sidi Kacem ont...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s locales de la province de Sidi Kacem ont entam\u00e9, lundi, l\u2019ex\u00e9cution de la deuxi\u00e8me phase du programme de retour des habitants temporairement \u00e9vacu\u00e9s suite aux conditions climatiques exceptionnelles, apr\u00e8s l\u2019am\u00e9lioration des conditions m\u00e9t\u00e9orologiques et la baisse du niveau des eaux ayant submerg\u00e9 plusieurs zones de la province. [lnt.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Chefchaouen ont supervis\u00e9 l\u2019op\u00e9ration de retour des familles \u00e9vacu\u00e9es \u00e0 titre pr\u00e9ventif du douar \u201cImoudnene\u201d, relevant de la commune de Tala. [lematin.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Chefchaouen ont entam\u00e9, depuis lundi, l\u2019op\u00e9ration de r         function positionCommunityLabels() {

            var communities = {};

                var node = network.body.nodes[nodeId];

                    continue;

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].y += node.y;
