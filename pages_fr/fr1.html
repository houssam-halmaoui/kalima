rWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La plateforme permet aux conducteurs\nde d\u00e9poser leur demande en...", "mass": 5, "physics": false, "shape": "box", "title": "La plateforme permet aux conducteurs de d\u00e9poser leur demande en ligne, sans se rendre dans une agence Al Barid Bank ou Barid Cash, puis de suivre leur dossier en temps r\u00e9el jusqu\u2019\u00e0 la remise du permis. [telquel.ma]\n-------------------------------------------------\nLa plateforme E-ROKHSATI a \u00e9t\u00e9 pr\u00e9sent\u00e9e mardi 24 novembre 2026 \u00e0 Rabat, lors d\u2019une rencontre pr\u00e9sid\u00e9e par le ministre du Transport et de la Logistique, Abdessamad Kayouh. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u2019Office national des chemins de\nfer (ONCF) et AP Moller-Maersk...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des chemins de fer (ONCF) et AP Moller-Maersk ont sign\u00e9 un protocole d\u2019accord afin d\u2019explorer les possibilit\u00e9s de d\u00e9veloppement conjoint du transport ferroviaire et de solutions [www.challenge.ma]\n-------------------------------------------------\nMoller\u2013Maersk ont sign\u00e9 un protocole d\u2019accord pour \u00e9tudier des projets communs de transport ferroviaire et de logistique int\u00e9gr\u00e9e au Maroc, a annonc\u00e9 Maersk le 24 novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les dirigeants de six partis\npolitiques, dont les quatre formations...", "mass": 5, "physics": false, "shape": "box", "title": "Les dirigeants de six partis politiques, dont les quatre formations constituant la coalition gouvernementale, ont sign\u00e9, mardi 24 novembre \u00e0 Rabat, la \u00abCharte de la majorit\u00e9\u00bb, un pacte [www.challenge.ma]\n-------------------------------------------------\nQuelques semaines apr\u00e8s l\u2019entr\u00e9e en fonction du nouvel Ex\u00e9cutif, les partis de la majorit\u00e9 gouvernementale se dotent d\u2019un cadre commun destin\u00e9 \u00e0 organiser leur action politique et \u00e0 renforcer leurs m\u00e9canismes de coordination. [lnt.ma]\n-------------------------------------------------\nLes six partis de la majorit\u00e9 gouvernementale ont sign\u00e9, mardi \u00e0 Rabat, la \u00ab Charte de la majorit\u00e9 \u00bb, un pacte politique et moral qui se veut un m\u00e9canisme de r\u00e9f\u00e9rence pour encadrer l\u2019action de la coalition gouvernementale et renforcer la coordination et la coh\u00e9sion au sein de ses composantes. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a d\u00e9voil\u00e9 mercredi 25...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9 mercredi 25 novembre 2026 les listes finales des nomin\u00e9s aux CAF Awards. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9, mercredi, les listes finales des nomin\u00e9s aux CAF Awards 2026, marqu\u00e9es par une forte pr\u00e9sence marocaine dans les principales cat\u00e9gories. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019autorit\u00e9 marocaine du march\u00e9 des\ncapitaux (AMMC) a annonc\u00e9 l\u2019enregistrement...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a annonc\u00e9 l\u2019enregistrement de la soci\u00e9t\u00e     }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
