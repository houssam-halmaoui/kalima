----------------\nDevant les trois centrales syndicales les plus repr\u00e9sentatives, la Cheffe du gouvernement a r\u00e9affirm\u00e9 l\u2019engagement de l\u2019Ex\u00e9cutif \u00e0 mettre en \u0153uvre les accords conclus avec les partenaires sociaux. [telquel.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, a rencontr\u00e9 mardi \u00e0 Rabat l\u2019Union marocaine du travail (UMT), l\u2019Union g\u00e9n\u00e9rale des travailleurs du Maroc (UGTM) et la Conf\u00e9d\u00e9ration d\u00e9mocratique du travail (CDT), en pr\u00e9paration des prochains cycles du dialogue social central et sectoriel. [www.yabiladi.com]\n-------------------------------------------------\nLe dialogue social au Maroc a \u00e9t\u00e9 au centre d\u2019une d\u00e9claration de la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, jeudi \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a affirm\u00e9, jeudi \u00e0 Rabat, que les premi\u00e8res rencontres de concertation tenues par le gouvernement avec les centrales syndicales les plus repr\u00e9sentatives et les organisations professionnelles t\u00e9moignent de l\u0027ouverture de l\u0027Ex\u00e9cutif et de son souci d\u0027\u00eatre \u00e0 l\u0027\u00e9coute des diff\u00e9rents partenaires sociaux et professionnels. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le groupe LabelVie a annonc\u00e9,\nle 26 novembre, l\u2019inauguration officielle...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe LabelVie a annonc\u00e9, le 26 novembre, l\u2019inauguration officielle d\u2019A\u00efn Seba\u00e2 Mall, un centre destin\u00e9 aux habitants de. [lematin.ma]\n-------------------------------------------------\nLe groupe LabelVie inaugure \u00e0 Casablanca un centre pens\u00e9 pour les habitants de A\u00efn Seba\u00e2 et des quartiers voisins. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans un communiqu\u00e9 conjoint sanctionnant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans un communiqu\u00e9 conjoint sanctionnant les entretiens tenus \u00e0 Rabat entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Ma. [lematin.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans un communiqu\u00e9 conjoint sanctionnant les entretiens tenus \u00e0 Rabat entre le ministre des Affaires \u00e9trang\u00e8res, de la [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "R\u00e9uni le 26 novembre 2026\nsous la pr\u00e9sidence de Moulay...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni le 26 novembre 2026 sous la pr\u00e9sidence de Moulay Hafid Elalamy, le conseil de surveillance de la banque a pris acte de la d\u00e9cision d\u2019Ahmed El Yacoubi de quitter la pr\u00e9sidence. [lematin.ma]\n-------------------------------------------------\nMoulay Mhamed Elalamy, directeur g\u00e9n\u00e9ral du Groupe Saham, prendra la pr\u00e9sidence du directoire de Saham Bank le 1er janvier 2027. [telquel.ma]\n-------------------------------------------------\nMoulay Mhamed Elalamy est nomm\u00e9 pr\u00e9sident du directoire de Saham Bank, \u00e0 compter du 1er janvier 2027, en remplacement d\u2019Ahmed El Yacoubi, qui int\u00e8gre le conseil de surveillance [www.challenge.ma]\n-------------------------------------------------\nDeux ans apr\u00e8s l\u2019entr\u00e9e du groupe Saham au capital de l\u2019ancienne Soci\u00e9t\u00e9 G\u00e9n\u00e9rale Maroc, militaires marocaine et isra\u00e9lienne ont dress\u00e9 le bilan de leurs activit\u00e9s en 2026 et convenu d\u2019\u00e9laborer un nouveau plan de travail pour 2027. [telquel.ma]\n-------------------------------------------------\nLe Maroc et Isra\u00ebl sont convenus de pr\u00e9parer un plan d\u2019action militaire commun pour 2027, lors de discussions tenues mercredi 25 novembre au quartier g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR), \u00e0 Rabat, selon un communiqu\u00e9 des FAR. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "En ex\u00e9cution des instructions royales,\nle ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions royales, le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la cheffe du gouvernement charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale, Abdeltif Loudyi, a re\u00e7u, jeudi \u00e0 Rabat, le Congressman am\u00e9ricain (R\u00e9publicain), Abraham J. Hamadeh, membre des commissions des Forces Arm\u00e9es, en visite de travail au Royaume. [telquel.ma]\n-------------------------------------------------\nLes deux parties ont pass\u00e9 en revue la coop\u00e9ration bilat\u00e9rale, encadr\u00e9e depuis avril par la feuille de route 2026-2036. [www.lavieeco.com]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, le ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u, jeudi \u00e0 Rabat, le Congressman am\u00e9ricain (R\u00e9publicain), Abraham J. Hamadeh, membre des commissions des Forces Arm\u00e9es, en visite de travail au Royaume. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm                                 scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
