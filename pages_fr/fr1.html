box", "title": "L\u2019approche de l\u2019intelligence artificielle (IA) au sein de l\u2019institution judiciaire ne saurait se cantonner \u00e0 la simple exploitation de ses capacit\u00e9s techniques, elle exige avant tout une compr\u00e9hension rigoureuse de ses limites et la mise en place de garde-fous \u00e9thiques infranchissables. [fr.hespress.com]\n-------------------------------------------------\nLe Procureur g\u00e9n\u00e9ral du Roi pr\u00e8s la Cour de Cassation, Pr\u00e9sident du Minist\u00e8re public, Hicham Balaoui, a soulign\u00e9 lundi \u00e0 F\u00e8s, que l\u2019approche de l\u2019intelligence artificielle ne devrait pas se limiter \u00e0 l\u2019exploitation de ses capacit\u00e9s techniques, mais doit \u00e9galement reposer sur la compr\u00e9hension de ses limites et la d\u00e9finition de garde-fous \u00e9thiques. [telquel.ma]\n-------------------------------------------------\nLe Procureur g\u00e9n\u00e9ral du Roi pr\u00e8s la Cour de Cassation, Pr\u00e9sident du Minist\u00e8re public, Hicham Balaoui, a soulign\u00e9 lundi \u00e0 F\u00e8s, que l\u2019approche de l\u2019intelligence artificielle ne devrait pas se limiter \u00e0 l\u2019exploitation de ses capacit\u00e9s techniques, mais doit \u00e9galement reposer sur la compr\u00e9hension de ses limites et la d\u00e9finition de garde-fous \u00e9thiques. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Sous pression apr\u00e8s un week-end\nmarqu\u00e9 par des affrontements, des...", "mass": 5, "physics": false, "shape": "box", "title": "Sous pression apr\u00e8s un week-end marqu\u00e9 par des affrontements, des d\u00e9gradations et des pillages dans plusieurs villes fran\u00e7aises, Emmanuel Macron a reconnu, lundi, des \u00ab d\u00e9faillances d\u2019anticipation et de renseignements \u00bb dans la gestion des manifestations contre la vie ch\u00e8re. [fr.hespress.com]\n-------------------------------------------------\nEmmanuel Macron s\u2019est adress\u00e9 aux Fran\u00e7ais dimanche soir, au lendemain d\u2019une journ\u00e9e de mobilisation contre la vie ch\u00e8re qui a d\u00e9g\u00e9n\u00e9r\u00e9 en violences dans plusieurs villes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La cheffe du gouvernement, Fatima\nEzzahra El Mansouri, a affirm\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Ezzahra El Mansouri, a affirm\u00e9, lundi, l\u2019engagement de l\u2019ex\u00e9cutif \u00e0 d\u00e9fendre l\u2019int\u00e9grit\u00e9 territoriale du Royaume, \u00e0 promouvoir l\u2019initiative d\u2019autonomie sous souverainet\u00e9 marocaine, et a r\u00e9affirm\u00e9 la position du Maroc sur la question palestinienne. [fr.hespress.com]\n-------------------------------------------------\nPr\u00e9sentant le Programme gouvernemental devant les deux Chambres, la Cheffe du gouvernement a assur\u00e9 que l\u0027Ex\u00e9cutif continuera \u00e0 d\u00e9fendre la souverainet\u00e9, l\u0027int\u00e9grit\u00e9 territoriale et les int\u00e9r\u00eats du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLe Sahara marocain demeure au premier rang des causes nationales, a affirm\u00e9, lundi \u00e0 Rabat, la Cheffe du gouvernement Mme Fatema Ezzahra El Mansouri, soulignant que l\u2019Ex\u00e9cutif continuera \u00e0 d\u00e9fendre la souverainet\u00e9, l\u2019int\u00e9grit\u00e9 territoriale et les int\u00e9r\u00eats du Royaume. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La cheffe du gouvernement, Fatima\nEzzahra El Mansouri, a pr\u00e9sent\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sent\u00e9 ce lundi 19 octobre devant les deux Chambres du Parlement le programme gouvernemental 2026-2031. [lematin.ma]\n-------------------------------------------------\nFatima Ezzahra El Mansouri, pr\u00e9sente aujourd\u2019hui le programme de son gouvernement devant les deux chambres du Parlement r\u00e9unies en s\u00e9ance pl\u00e9ni\u00e8re commune. [leseco.ma]\n-------------------------------------------------\nLa nomination, vendredi, des 32 membres du gouvernement conduit par Fatima Ezzahra El Mansouri met fin \u00e0 la phase des n\u00e9gociations autour du nouvel Ex\u00e9cutif et ouvre celle de l\u2019action. [leseco.ma]\n-------------------------------------------------\nLes institutions ne sauront regagner la confiance sans une lutte effective contre la corruption et les conflits d\u2019int\u00e9r\u00eats a assur\u00e9, lundi, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [www.lereporter.ma]\n-------------------------------------------------\nPouvoir d\u2019achat, emploi des jeunes, protection sociale, lutte contre la corruption, r\u00e9forme de l\u2019\u00e9ducation, logement et souverainet\u00e9 strat\u00e9gique figurent parmi les principales priorit\u00e9s annonc\u00e9es. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Tribunal arbitral du sport\n(TAS) a apport\u00e9, lundi, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Tribunal arbitral du sport (TAS) a apport\u00e9, lundi, de nouvelles pr\u00e9cisions sur l\u2019\u00e9volution de la proc\u00e9dure relative \u00e0 la finale de la Coupe d\u2019Afrique des Nations 2025. [lematin.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a publi\u00e9, ce lundi 19 octobre 2026 \u00e0 Lausanne, une mise \u00e0 jour concernant la proc\u00e9dure relative \u00e0 la finale de la Coupe d\u2019Afrique des Nations (CAN) 2025. [telquel.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) pr\u00e9voit de rendre sa d\u00e9cision sur la finale contest\u00e9e de la Coupe d\u2019Afrique des nations 2025 entre le Maroc et le S\u00e9n\u00e9gal \u00e0 la fin du mois de novembre 2026. [www.yabiladi.com]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a annonc\u00e9 que sa d\u00e9cision concernant l\u2019appel de la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football contre la CAF et la FRMF, relatif \u00e0 la finale de la CAN 2025, est attendue fin novembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Cette nouvelle identit\u00e9 intervient dans\nle prolongement du rapprochement avec...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle identit\u00e9 intervient dans le prolongement du rapprochement avec Allianz Maroc, effectif depuis le 2 juil. [lematin.ma]\n-------------------------------------------------\nSanlam Maroc adopte la marque SanlamAllianz, dans le prolongement du rapprochement avec Allianz Maroc entr\u00e9 en vigueur le 2 juillet 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le financement des tr\u00e8s petites,\npetites et moyennes entreprises (TPME)...", "mass": 5, "physics": false, "shape": "box", "title": "Le financement des tr\u00e8s petites, petites et moyennes entreprises (TPME) et les conditions n\u00e9cessaires \u00e0 leur d\u00e9veloppement ont \u00e9t\u00e9 au centre des \u00e9changes auxquels a particip\u00e9 Bank. [lematin.ma]\n-------------------------------------------------\nBank of Africa a pris part, samedi 17 octobre \u00e0 Casablanca, au forum \u00ab Entrepreneurs en mouvement : Transformer les priorit\u00e9s en actions \u00bb, organis\u00e9 par la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Plus de 80 entreprises marocaines,\nrepr\u00e9sentant diff\u00e9rentes fili\u00e8res agro-alimentaires, ont...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 80 entreprises marocaines, repr\u00e9sentant diff\u00e9rentes fili\u00e8res agro-alimentaires, ont pris part \u00e0 la 31\u00e8me \u00e9dition du Salon international de l\u2019alimentation (SIAL) tenu au Parc des expositions de Paris Nord-Villepinte. [telquel.ma]\n-------------------------------------------------\nIniti\u00e9e par Morocco Foodex, la participation marocaine \u00e0 la 31\u1d49 \u00e9dition du Salon international de l\u0027alimentation s\u0027\u00e9tend sur 1.181 m\u00b2, r\u00e9partis entre deux halls. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est\nqualifi\u00e9e pour la phase finale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est qualifi\u00e9e pour la phase finale de la prochaine \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN), pr\u00e9vue au S\u00e9n\u00e9gal du 28 novembre au 6 d\u00e9cembre 2026. [telquel.ma]\n-------------------------------------------------\nL\u00e9quipe marocaine de beach soccer sest qualifi\u00e9e pour la phase finale de la Coupe dAfrique des Nations, qui se tiendra au S\u00e9n\u00e9gal du 28 novembre au 6 d\u00e9cembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les 9\u00e8mes Ateliers de lAtlas\nse d\u00e9rouleront du 22 au...", "mass": 5, "physics": false, "shape": "box", "title": "Les 9\u00e8mes Ateliers de lAtlas se d\u00e9rouleront du 22 au 2         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
