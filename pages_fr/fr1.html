e": "box", "title": "CAN 2025 : Mali, Zambie, \u00c9gypte et Afrique du Sud entrent en lice ce lundi. [lematin.ma]\n-------------------------------------------------\nLe Mali et la Zambie n\u2019ont pu se d\u00e9partager (1-1), ce lundi au Complexe Mohammed V de Casablanca, pour le compte de la premi\u00e8re journ\u00e9e du groupe A, celui du Maroc. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection malienne et son homologue zambienne se sont neutralis\u00e9es (1-1) en match comptant pour la premi\u00e8re journ\u00e9e du groupe A de la Coupe dAfrique des nations (CAN 2025), disput\u00e9 lundi au complexe sportif Mohammed V de Casablanca. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection malienne et son homologue zambienne se sont neutralis\u00e9es (1-1) en match comptant pour la premi\u00e8re journ\u00e9e du groupe A de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2025, disput\u00e9 lundi au Complexe Sportif Mohammed V de Casablanca. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019Office national de l\u2019\u00e9lectricit\u00e9 et\nde l\u2019eau potable (ONEE) et...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) renforcent leur partenariat. [lematin.ma]\n-------------------------------------------------\nFace \u00e0 l\u2019intensification du stress hydrique, l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont ouvert des discussions autour d\u2019un financement cons\u00e9quent d\u00e9di\u00e9 \u00e0 la modernisation des infrastructures de production d\u2019eau potable. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "le Prince H\u00e9ritier Moulay El\nHassan a pass\u00e9 en revue...", "mass": 5, "physics": false, "shape": "box", "title": "le Prince H\u00e9ritier Moulay El Hassan a pass\u00e9 en revue une section de la Garde Royale qui rendait les honneurs, avan. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est impos\u00e9e face \u00e0 son homologue comorienne (2-0), en match d\u2019ouverture de la Coupe d\u2019Afrique des Nations (Maroc-2025), disput\u00e9, dimanche soir au Stade Prince Moulay Abdellah de Rabat. [telquel.ma]\n-------------------------------------------------\nLa victoire de l\u2019\u00e9quipe du Maroc face aux Comores (2-0), dimanche soir au stade Prince Moulay Abdellah \u00e0 Rabat en ouverture de la Coupe d\u2019Afrique des Nations (CAN) de football, a \u00e9t\u00e9 \u00ab amplement m\u00e9rit\u00e9e \u00bb, bien que le match ait \u00e9t\u00e9 difficile, a indiqu\u00e9 le s\u00e9lectionneur national, Walid Regragui. [maroc-diplomatique.net]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a parfaitement entam\u00e9 son entr\u00e9e en lice dans la Coupe d\u2019Afrique des Nations, en dominant les Comores (2-0), en match d\u2019ouverture disput\u00e9, dimanche soir au Stade Prince Moulay Abdellah de Rabat, gr\u00e2ce notamment \u00e0 un bijou d\u2019Ayoub El Kaabi. [atlasinfo.fr]\n-------------------------------------------------\nLe Prince H\u00e9ritier Moulay El Hassan pr\u00e9side, dimanche au Stade \u00ab Prince Moulay Abdellah \u00bb \u00e0 Rabat, la c\u00e9r\u00e9monie d\u2019ouverture de la 35e \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN-Maroc 2025), qu\u2019abrite le Royaume jusqu\u2019au 18 janvier prochain. [atlasinfo.fr]\n-------------------------------------------------\nSon Altesse Royale le Prince H\u00e9ritier Moulay El Hassan pr\u00e9side, dimanche au Stade \u201cPrince Moulay Abdellah\u201d \u00e0 Rabat, la c\u00e9r\u00e9monie d\u2019ouverture de la 35e \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN-Maroc 2025), qu\u2019abrite le Royaume jusqu\u2019au 18 janvier prochain. [www.lereporter.ma]\n-------------------------------------------------\nLe Prince H\u00e9ritier Moulay El Hassan a pr\u00e9sid\u00e9, dimanche au stade Prince Moulay Abdellah \u00e0 Rabat, la c\u00e9r\u00e9monie d\u2019ouverture de la 35\u1d49 \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN Maroc 2025), que le Royaume abrite jusqu\u2019au 18 janvier prochain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Dans ce sens, le Directeur\ng\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce sens, le Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire, Abdellatif Hammouchi, s\u2019est inform\u00e9, dimanche apr\u00e8s-midi, des derniers dispositifs de. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a adopt\u00e9 un dispositif global et int\u00e9gr\u00e9 pour s\u00e9curiser les comp\u00e9titions de la Coupe d\u2019Afrique des nations de football (CAN Maroc-2025), qui s\u0027est ouverte dimanche \u00e0 Rabat. [leseco.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a adopt\u00e9 un dispositif global et int\u00e9gr\u00e9 pour s\u00e9curiser les comp\u00e9titions de la Coupe d\u2019Afrique des nations de football (CAN Maroc-2025), qui s\u2019est ouverte dimanche \u00e0 Rabat. [atlasinfo.fr]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (                     font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
