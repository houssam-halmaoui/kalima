]\n-------------------------------------------------\nCentrale Danone a lanc\u00e9, mercredi 1er juillet, le nouveau proc\u00e9d\u00e9 de fabrication d\u00e9nomm\u00e9 \u00abMilk-Co\u00bb, d\u00e9ploy\u00e9 sur son site industriel de Fkih Ben Salah, au cours d\u2019une c\u00e9r\u00e9monie officielle [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Huit s\u00e9ries d\u2019animation marocaines, financ\u00e9es\n\u00e0 hauteur d\u2019un million d\u2019euros...", "mass": 5, "physics": false, "shape": "box", "title": "Huit s\u00e9ries d\u2019animation marocaines, financ\u00e9es \u00e0 hauteur d\u2019un million d\u2019euros par TV5MONDE, seront prochainement diffus\u00e9es sur les antennes du groupe francophone. [telquel.ma]\n-------------------------------------------------\nTV5MONDE annonce un investissement d\u2019un million d\u2019euros (environ 10,69 MDH) au Maroc pour accompagner la production de s\u00e9ries d\u2019animation en langue fran\u00e7aise et soutenir le d\u00e9veloppement de l\u2019industrie locale. [www.lavieeco.com]\n-------------------------------------------------\nLe fruit d\u2019un partenariat ambitieux entre le m\u00e9dia francophone, les cr\u00e9ateurs locaux, le Maroc et la France pour soutenir la production en langue fran\u00e7aise. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Cette nuit, j\u2019ai pris la\nd\u00e9cision de mettre un terme...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nuit, j\u2019ai pris la d\u00e9cision de mettre un terme \u00e0 mon passage en tant que s\u00e9lectionneur des Pays-Bas \u00bb, a \u00e9crit le technicien. [telquel.ma]\n-------------------------------------------------\nD\u00e9mission Ronald Koeman a annonc\u00e9 mardi soir son d\u00e9part du poste de s\u00e9lectionneur des Pays-Bas, au lendemain de l\u2019\u00e9limination des Oranje face au Maroc en seizi\u00e8mes de finale de la Coupe du monde. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Dans un contexte de transformation\nd\u00e9mographique et d\u2019\u00e9volution des sch\u00e9mas...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un contexte de transformation d\u00e9mographique et d\u2019\u00e9volution des sch\u00e9mas familiaux au Maroc et en Afrique, les questions de protection, d\u2019accompagnement et de transmission prennent une place de [www.challenge.ma]\n-------------------------------------------------\nAXA Assurance Maroc d\u00e9voile sa premi\u00e8re campagne de marque panafricaine, une initiative qui place la solidarit\u00e9 interg\u00e9n\u00e9rationnelle au c\u0153ur de son discours. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Banque europ\u00e9enne d\u0027investissement (BEI)\na r\u00e9it\u00e9r\u00e9 son soutien au...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque europ\u00e9enne d\u0027investissement (BEI) a r\u00e9it\u00e9r\u00e9 son soutien au Maroc, confirmant sa volont\u00e9 de poursuivre son accompagnement des projets de d\u00e9veloppement \u00e9conomique, social et d\u0027infrastructures du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u2019investissement (BEI) poursuivra son accompagnement du Maroc dans sa trajectoire de croissance, de prosp\u00e9rit\u00e9 et de d\u00e9veloppement social, a affirm\u00e9, mercredi \u00e0 Rabat, sa pr\u00e9sidente, Nadia Calvi\u00f1o. [www.lereporter.ma]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u2019investissement (BEI) poursuivra son accompagnement du Maroc dans sa trajectoire de croissance, de prosp\u00e9rit\u00e9 et de d\u00e9veloppement social, a affirm\u00e9, mercredi \u00e0 Rabat, sa pr\u00e9sidente, Nadia Calvi\u00f1o. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du\nBudget et pr\u00e9sident de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget et pr\u00e9sident de la F\u00e9d\u00e9ration Royale Marocaine de Football, Fouzi Lekjaa, a soulign\u00e9 que les performances de l\u0027\u00e9quipe nationale illustrent la politique men\u00e9e sous l\u0027impulsion de Sa Majest\u00e9 le Roi Mohammed VI en faveur de la jeunesse. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc, sous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, a montr\u00e9 au monde entier que la jeunesse est capable d\u2019assumer un r\u00f4le de leadership et de servir de mod\u00e8le d\u00e8s lors que les conditions de r\u00e9ussite lui sont offertes, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "La Direction g\u00e9n\u00e9rale de la\nm\u00e9t\u00e9orologie (DGM) annonce une vague...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) annonce une vague de chaleur et des averses orageuses, de mercredi \u00e0 vendredi, dans plusieurs provinces du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), a annonc\u00e9 une vague de chaleur, des averses orageuses avec gr\u00eale et rafales de vent sous orages, attendues dans plusieurs provinces du Royaume \u00e0 partir de ce jeudi. [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses avec gr\u00eale et rafales de vent sous orages sont attendues dans plusieurs provinces du Royaume \u00e0 partir de ce jeudi, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau de vigilance orange. [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses avec gr\u00eale et rafales de vent sous orages sont attendues dans plusieurs provinces du Maroc \u00e0 partir de ce jeudi, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin dalerte de niveau de vigilance orange. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Les atouts du Royaume en\ntant que destination d\u2019investissement prometteuse...", "mass": 5, "physics": false, "shape": "box", "title": "Les atouts du Royaume en tant que destination d\u2019investissement prometteuse ont \u00e9t\u00e9 mis en avant mercredi \u00e0 Paris, lors de la Journ\u00e9e \u00e9conomique France-Maroc. [atlasinfo.fr]\n-------------------------------------------------\nLes atouts du Royaume en tant que destination d\u2019investissement \u00e0 fort potentiel ont \u00e9t\u00e9 mis en exergue, mercredi \u00e0 Paris, lors de la Journ\u00e9e \u00e9conomique France-Maroc, une rencontre de haut niveau destin\u00e9e \u00e0 promouvoir les opportunit\u00e9s d\u2019affaires, \u00e0 encourager les investissements crois\u00e9s et \u00e0 ouvrir de nouvelles perspectives de coop\u00e9ration \u00e9conomique entre Rabat et Paris. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
