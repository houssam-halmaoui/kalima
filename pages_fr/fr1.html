recteur g\u00e9n\u00e9ral de l\u2019Agence nationale des eaux et for\u00eats (ANEF), et \u00c9l\u00e9onore Caroit, ministre d\u00e9l\u00e9gu\u00e9e fran\u00e7aise charg\u00e9e de la Francophonie, des Partenariats internationaux et des Fran\u00e7ais de l\u2019\u00e9tranger. [atlasinfo.fr]\n-------------------------------------------------\nLe renforcement du partenariat strat\u00e9gique dans le secteur forestier a \u00e9t\u00e9 au centre d\u2019entretiens, lundi \u00e0 Rabat, entre le directeur g\u00e9n\u00e9ral de l\u2019Agence nationale des eaux et for\u00eats (ANEF), Abderrahim Houmy, et la ministre d\u00e9l\u00e9gu\u00e9e fran\u00e7aise charg\u00e9e de la Francophonie, des Partenariats internationaux et des Fran\u00e7ais de l\u2019\u00e9tranger, \u00c9l\u00e9onore Caroit. [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc et la France ont r\u00e9affirm\u00e9 leur volont\u00e9 de renforcer leur coop\u00e9ration dans le domaine forestier \u00e0 l\u2019occasion d\u2019une rencontre tenue le 4 mai 2026 \u00e0 Rabat entre Abderrahim Houmy et \u00c9l\u00e9onore Caroit. [lnt.ma]\n-------------------------------------------------\nLe Maroc et la France ont r\u00e9affirm\u00e9, lundi \u00e0 Rabat, leur volont\u00e9 de consolider leur coop\u00e9ration dans le domaine forestier, \u00e0 l\u2019occasion d\u2019une rencontre entre Abderrahim Houmy, directeur g\u00e9n\u00e9ral de l\u2019Agence nationale des eaux et for\u00eats (ANEF), et \u00c9l\u00e9onore Caroit, ministre d\u00e9l\u00e9gu\u00e9e fran\u00e7aise charg\u00e9e de la Francophonie et des partenariats internationaux. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Au titre des activit\u00e9s parall\u00e8les\n\u00e0 vocation humanitaire de l\u2019exercice...", "mass": 5, "physics": false, "shape": "box", "title": "Au titre des activit\u00e9s parall\u00e8les \u00e0 vocation humanitaire de l\u2 00e9venance et la bienveillance envers autrui, la solidarit\u00e9 et la manifestation d\u2019une foi [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le taux de ch\u00f4mage strict\nau Maroc s\u2019est \u00e9tabli \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de ch\u00f4mage strict au Maroc s\u2019est \u00e9tabli \u00e0 10,8% au premier trimestre 2026, ressort-il de la r\u00e9cente note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 [www.challenge.ma]\n-------------------------------------------------\nLe taux de ch\u00f4mage strict au Maroc s\u2019est \u00e9tabli \u00e0 10,8% au premier trimestre 2026, ressort-il de la r\u00e9cente note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 la situation du march\u00e9 du travail au Maroc. [telquel.ma]\n-------------------------------------------------\nDans sa note d\u2019information relative \u00e0 la situation du march\u00e9 du travail dans le pays, le Haut-commissariat au plan (HCP) indique que le taux est \u00e9tabli \u00e0 10,8%, dont 16,1% pour les femmes et 9,4% pour les hommes. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Pi\u00e8ce embl\u00e9matique du patrimoine vestimentaire\nmarocain, le caftan a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Pi\u00e8ce embl\u00e9matique du patrimoine vestimentaire marocain, le caftan a \u00e9t\u00e9 c\u00e9l\u00e9br\u00e9 dimanche \u00e0 Bruxelles \u00e0 loccasion de la premi\u00e8re \u00e9dition de la \u00abMoroccan Caftan Week Belgium\u00bb, un \u00e9v\u00e9nement qui vise \u00e0 mettre en valeur et \u00e0 promouvoir lartisanat, la mode et la haute couture du royaume. [www.yabiladi.com]\n-------------------------------------------------\nLe caftan marocain, pi\u <div id="tooltip">Carte générée par intelligence artificielle le 05/05/2026 à 13h10, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
