nt Rabat et Paris. [www.lavieeco.com]\n-------------------------------------------------\nLa nouvelle visite de M. G\u00e9rald Darmanin \u00e0 Rabat s\u2019inscrit dans un contexte de coop\u00e9ration judiciaire \u00e9troite et consolid\u00e9e, marqu\u00e9 par des extraditions sensibles, des dossiers de grand banditisme et une coordination s\u00e9curitaire soutenue, r\u00e9v\u00e9lateurs de l\u2019intensit\u00e9 des \u00e9changes entre le Maroc et la France. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, et son homologue de la R\u00e9publique fran\u00e7aise, G\u00e9rald Darmanin, ont sign\u00e9, lundi \u00e0 Rabat, un plan d\u2019action pour la coop\u00e9ration technique couvrant la p\u00e9riode 2026-2028. [telquel.ma]\n-------------------------------------------------\nUn plan d\u2019action pour la coop\u00e9ration technique dans le domaine de la justice entre le Maroc et la France au titre de la p\u00e9riode 2026/2028 a \u00e9t\u00e9 sign\u00e9, lundi \u00e0 Rabat, en vue d\u2019\u00e9tablir un cadre structur\u00e9 et durable de coop\u00e9ration et d\u2019\u00e9change entre les deux minist\u00e8res de justice. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019Agence nationale des eaux et\nfor\u00eats (ANEF) a coorganis\u00e9, ce...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des eaux et for\u00eats (ANEF) a coorganis\u00e9, ce lundi 2 f\u00e9vrier \u00e0 Essaouira, une journ\u00e9e de sensibilisation en partenariat avec la province, \u00e0 l\u2019occasion de la Journ\u00e9e mondiale des zones humides (JMZH). [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Agence Nationale des Eaux et For\u00eats (ANEF) a organis\u00e9, lundi \u00e0 Essaouira, une journ\u00e9e de sensibilisation, d\u2019\u00e9change et de valorisa                         if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
