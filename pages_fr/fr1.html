\u00e9sent\u00e9 par la Commission Europ\u00e9enne dans le cadre de la mise en \u0153uvre de ses engagements d\u00e9coulant de l\u2019Accord sous forme d\u2019Echange de lettres conclu entre le Maroc et l\u2019UE le . [maroc-diplomatique.net]\n-------------------------------------------------\nLe Parlement Europ\u00e9en a rejet\u00e9, ce mercredi, une \u201cmotion d\u2019objection\u201d introduite par certains milieux de droite et d\u2019extr\u00eame droite, contre le projet d\u2019acte d\u00e9l\u00e9gu\u00e9 pr\u00e9sent\u00e9 par la Commission Europ\u00e9enne dans le cadre de la mise en \u0153uvre de ses engagements d\u00e9coulant de l\u2019Accord sous forme d\u2019Echange de lettres conclu entre le Maroc et l\u2019UE le [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a rendu publique, mardi,...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a rendu publique, mardi, la liste d\u00e9finitive des 73 arbitres qui officieront lors de la Coupe d\u2019Afrique des nations (CAN) 2025. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration Africaine de Football (CAF) a d\u00e9voil\u00e9 la liste officielle des 28 arbitres s\u00e9lectionn\u00e9s pour la Coupe d\u2019Afrique des Nations (CAN 2025). [www.lopinion.ma]\n-------------------------------------------------\nParmi eux figurent cinq arbitres marocains : Jalal Jayed et Mustapha Kechaf comme arbitres centraux, Zakaria Brinsi et Mostafa Akarkad en tant qu\u2019assistants, ainsi que Hamza El Fareq,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le\nminist\u00e8re de la Transition \u00e9nerg\u00e9tique...", "mass": 5, "physics": false, "shape": "box", "title": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, la Wilaya et le Conseil de la R\u00e9gion Souss-Massa ainsi que la CGEM Souss-Massa, r\u00e9com. [lematin.ma]\n-------------------------------------------------\nL\u2019entreprise a remport\u00e9 le Troph\u00e9e Climat 2025, cat\u00e9gorie Agriculture, d\u00e9cern\u00e9 par le Minist\u00e8re de la Transition \u00e9nerg\u00e9tique, la Wilaya, la R\u00e9gion Souss-Massa et la CGEM locale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le chef du gouvernement, Aziz\nAkhannouch, s\u2019est entretenu, mercredi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch, s\u2019est entretenu, mercredi \u00e0 Rabat, avec le pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement (BAD), Sidi Ould Tah, sur les moyens de promouvoir le partenariat entre le Maroc et l\u2019institution financi\u00e8re. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement, M. Aziz Akhannouch a eu, mercredi 26 novembre 2025 \u00e0 Rabat, des entretiens avec M. Sidi Ould Tah, pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement qui ont \u00e9t\u00e9 l\u2019occasion de prospecter les moyens promouvoir le partenariat privil\u00e9gi\u00e9 entre le Royaume du Maroc et le Groupe de la Banque Africaine . [aujourdhui.ma]\n-------------------------------------------------\nLe pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement (BAD), Sidi Ould Tah, a salu\u00e9, mercredi \u00e0 Rabat, le soutien constant de Sa Majest\u00e9 le Roi Mohammed VI, \u00e0 l\u2019Institution financi\u00e8re panafricaine. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, s                                 scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
