m\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud, a re\u00e7u, mardi au niveau du si\u00e8ge de l\u2019Etat-Major G\u00e9n\u00e9ral des FAR \u00e0 Rabat, le G\u00e9n\u00e9ral de Division Issa Saif Bin . [fr.hespress.com]\n-------------------------------------------------\nLinspecteur g\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR) et Commandant de la Zone Sud, le g\u00e9n\u00e9ral Mohammed Berrid, a accueilli mardi \u00e0 Rabat le g\u00e9n\u00e9ral Issa Saif Bin Ablan Al Mazrouei, chef d\u00c9tat-Major des Forces Arm\u00e9es des \u00c9mirats Arabes Unis. [www.yabiladi.com]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, que Dieu L\u2019assiste, le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud, a re\u00e7u, mardi au niveau du si\u00e8ge de l\u2019\u00c9tat-Major G\u00e9n\u00e9ral des FAR \u00e0 Rabat, le G\u00e9n\u00e9ral de Division [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le premier F-16 Block 72\ndestin\u00e9 aux Forces arm\u00e9es royales...", "mass": 5, "physics": false, "shape": "box", "title": "Le premier F-16 Block 72 destin\u00e9 aux Forces arm\u00e9es royales a effectu\u00e9 avec succ\u00e8s son vol inaugural, selon Lockheed Martin. [fr.hespress.com]\n-------------------------------------------------\nLe premier F-16 Block 72 destin\u00e9 aux Forces Royales Air du Maroc a effectu\u00e9 avec succ\u00e8s son premier vol d\u2019essai, a annonc\u00e9 l\u2019entreprise am\u00e9ricaine de d\u00e9fense et de s\u00e9curit\u00e9 Lockheed Martin. [telquel.ma]\n-------------------------------------------------\nLe premier avion de chasse F-16 Block 72 du Maroc a r\u00e9ussi son vol inaugural, comme la annonc\u00e9 le constructeur am\u00e9ricain Lockheed Martin dans un communiqu\u00e9 publi\u00e9 le 6 octobre. [www.yabiladi.com]\n-------------------------------------------------\nLe premier F-16 Block 72, version la plus r\u00e9cente et la plus avanc\u00e9e du F-16 Fighting Falcon, destin\u00e9 aux Forces Royales Air, a effectu\u00e9 avec succ\u00e8s son vol inaugural au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nLe premier F-16 Block 72 destin\u00e9 aux Forces Royales Air du Maroc a effectu\u00e9 avec succ\u00e8s son premier vol, a annonc\u00e9 mardi 6 octobre le constructeur am\u00e9ricain Lockheed Martin. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le minist\u00e8re de l\u2019Am\u00e9nagement du\nterritoire national, de l\u2019Urbanisme, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, a indiqu\u00e9 que les livraisons de ciment ont atteint pr\u00e8s de 11 millions de tonnes (MT) \u00e0 fin septembre 2026, en l\u00e9g\u00e8re hausse de 1,17% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant. [fr.hespress.com]\n-------------------------------------------------\nLes livraisons de ciment ont atteint pr\u00e8s de 11 millions de tonnes (MT) \u00e0 fin septembre 2026, en l\u00e9g\u00e8re hausse de 1,17% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon les donn\u00e9es du minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [telquel.ma]\n-------------------------------------------------\nLes volumes livr\u00e9s ont atteint 1,46 million de tonnes, contre 1,22 million au m\u00eame mois de 2025, selon les donn\u00e9es du minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La participation marocaine au salon\nmobilisera 25 groupements issus des...", "mass": 5, "physics": false, "shape": "box", "title": "La participation marocaine au salon mobilisera 25 groupements issus des diff\u00e9rentes r\u00e9gions du Royaume, portant une offre repr\u00e9sentative de la diversit\u00e9 des produits du terroir nat. [lematin.ma]\n-------------------------------------------------\nLa participation du Maroc \u00e0 ce rendez-vous de grande envergure est marqu\u00e9e par la pr\u00e9sence de 25 groupements de producteurs issus des diff\u00e9rentes r\u00e9gions du Royaume, pr\u00e9sentant une offre qui refl\u00e8te \u00e0 la fois, la diversit\u00e9 et la richesse des produits du terroir national. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Des deux c\u00f4t\u00e9s de l\u2019Atlantique,\nles lecteurs de Cond\u00e9 Nast...", "mass": 5, "physics": false, "shape": "box", "title": "Des deux c\u00f4t\u00e9s de l\u2019Atlantique, les lecteurs de Cond\u00e9 Nast Traveler placent La Mamounia en t\u00eate des Readers\u2019 Choice Awards 2026 : premi\u00e8re au Maroc et quatorzi\u00e8me mondiale pour l\u2019\u00e9. [lematin.ma]\n-------------------------------------------------\nLa Mamounia, \u00e0 Marrakech, a \u00e9t\u00e9 \u00e9lue meilleur h\u00f4tel du Maroc par les lecteurs de l\u2019\u00e9dition am\u00e9ricaine de Cond\u00e9 Nast Traveler et meilleur h\u00f4tel d\u2019Afrique du Nord par ceux de l\u2019\u00e9dition britannique, selon les Readers\u2019 Choice Awards 2026, a annonc\u00e9 l\u2019\u00e9tablissement dans un communiqu\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Vantage Payment Systems (VPS) ouvre\nune nouvelle \u00e9tape de son...", "mass": 5, "physics": false, "shape": "box", "title": "Vantage Payment Systems (VPS) ouvre une nouvelle \u00e9tape de son d\u00e9veloppement au Maroc avec l\u2019arriv\u00e9e d\u2019AfricInvest Financial Inclusion Vehicle (FIVE) au capital de son actionnaire m. [lematin.ma]\n-------------------------------------------------\nIl doit notamment soutenir le d\u00e9ploiement de son offre d\u2019acquisition TPE, ses investissements technologiques et le d\u00e9veloppement de nouvelles solutions de paiement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Avec des hauteurs de 40\n\u00e0 60 mm, ces averses...", "mass": 5, "physics": false, "shape": "box", "title": "Avec des hauteurs de 40 \u00e0 60 mm, ces averses orageuses sont pr\u00e9vues, de mardi \u00e0 11h00 \u00e0 mercredi \u00e0 6h00, dans les provinces de Boujdour, Oued Ed-Dahab et Aousserd, a pr\u00e9cis\u00e9 la DGM. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses fortes avec de la gr\u00eale et des rafales de vent sous orages sont attendues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDimportantes averses orageuses, accompagn\u00e9es de gr\u00eale et de violentes rafales de vent, sont pr\u00e9vues mardi et mercredi dans plusieurs provinces marocaines, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau orange. [www.yabiladi.com]\n-------------------------------------------------\nDes averses orageuses fortes avec de la gr\u00eale et des rafales de vent sous orages sont attendues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Ce projet fait l\u2019objet de\ndeux conventions de partenariat multilat\u00e9rales,...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet fait l\u2019objet de deux conventions de partenariat multilat\u00e9rales, pour un co\u00fbt global de 17 millions de dirhams (MDH), associant le Conseil et la Wilaya de la r\u00e9gion, les d. [lematin.ma]\n-------------------------------------------------\nLa r\u00e9gion Tanger-T\u00e9touan-Al Hoceima s\u2019appr\u00eate \u00e0 renforcer le dispositif r\u00e9gional de surveillance de la qualit\u00e9 de l\u2019air et \u00e0 \u00e9tablir un inventaire des \u00e9missions de gaz polluants. [telquel.ma]\n-------------------------------------------------\nLa r\u00e9gion Tanger-T\u00e9touan-Al Hoceima pr\u00e9voit de renforcer son syst\u00e8me de surveillance de la qualit\u00e9 de l\u2019air \u00e0 travers deux conventions repr\u00e9sentant un investissement global de 17 MDH. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Grand vainqueur de la soir\u00e9e,\nle film Goundafa \u2013 The...", "mass": 5, "physics": false, "shape": "box", "title": "Grand vainqueur de la soir\u00e9e, le film Goundafa \u2013 The Cursed Song d\u2019Ali Benjelloun a remport\u00e9 le Grand Prix Issni N\u2019Ourgh (comp\u00e9tition amazighe), ainsi que les prix de l. [lematin.ma]\n-------------------------------------------------\nLe rideau est tomb\u00e9, lundi soir \u00e0 Agadir, sur la 17e \u00e9dition du Festival international du film amazigh Issni N\u2019Ourgh (FINIFA), qui c\u00e9l\u00e9brait cette ann\u00e9e ses vingt ans d\u2019existence. [telquel.ma         function positionCommunityLabels() {

                    communities[groupId].y += node.y;
