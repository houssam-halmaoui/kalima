u00e9uni\njeudi \u00e0 Rabat, a adopt\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret n\u00b02.25.983 fixant le montant du salaire minimum l\u00e9gal dans les activit\u00e9s agricoles et non agricoles, pr\u00e9sent\u00e9 par le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret n\u00b02.25.983 fixant le montant du salaire minimum l\u00e9gal dans les activit\u00e9s agricoles et non agricoles, pr\u00e9sent\u00e9 par le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret n\u00b02.25.983 fixant le montant du salaire minimum l\u00e9gal dans les activit\u00e9s agricoles et non agricoles, pr\u00e9sent\u00e9 par le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret n\u00b02.25.983 fixant le montant du salaire minimum l\u00e9gal dans les activit\u00e9s agricoles et non agricoles, pr\u00e9sent\u00e9 par le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le taux de remplissage des\nbarrages du Royaume a connu...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de remplissage des barrages du Royaume a connu une nette am\u00e9lioration, passant de 31,1% \u00e0 32.97% entre le 12 et le 18 d\u00e9cembre, avec des r\u00e9serves d\u0027eau d\u00e9passant 5,5 milliards de m\u00e8tres cubes, a indiqu\u00e9 jeudi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas [www.lopinion.ma]\n-------------------------------------------------\nLe taux de remplissage des barrages du Royaume a connu une nette am\u00e9lioration, passant de 31,1% \u00e0 32,97% entre le 12 et le 18 d\u00e9cembre, avec des r\u00e9serves d\u2019eau d\u00e9passant 5,5 milliards de m\u00e8tres cubes, a indiqu\u00e9 jeudi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [telquel.ma]\n-------------------------------------------------\nLe taux de remplissage des barrages du Royaume a connu une nette am\u00e9lioration, passant de 31,1% \u00e0 32.97% entre le 12 et le 18 d\u00e9cembre, avec des r\u00e9serves d\u0027eau d\u00e9passant 5,5 milliards de m\u00e8tres cubes, a indiqu\u00e9 jeudi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [leseco.ma]\n-------------------------------------------------\nLe taux de remplissage des barrages du Royaume a connu une nette am\u00e9lioration, passant de 31,1% \u00e0 32.97% entre le 12 et le 18 d\u00e9cembre, avec des r\u00e9serves d\u2019eau d\u00e9passant 5,5 milliards de m\u00e8tres cubes, a indiqu\u00e9 jeudi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Conform\u00e9ment aux hautes instructions royales\nde Sa Majest\u00e9 le Roi...", "mass": 5, "physics": false, "shape": "box", "title": "Conform\u00e9ment aux hautes instructions royales de Sa Majest\u00e9 le Roi Mohammed VI, et en traduction de l\u2019attention constante qu\u2019Il porte \u00e0 ses concitoyennes et concitoyens dans toutes les circonstances, notamment en veillant \u00e0 soutenir les personnes affect\u00e9es et \u00e0 leur fournir toute forme d\u2019assistance, le gouvernement a lanc\u00e9 un programme de r\u00e9habilitation des zones touch\u00e9es par les inondations exceptionnelles survenues dans la ville de Safi le dimanche 14 d\u00e9cembre 2025. [www.lopinion.ma]\n-------------------------------------------------\nEn application des instructions royales, le gouvernement a lanc\u00e9 un programme de r\u00e9habilitation des zones touch\u00e9es par les inondations exceptionnelles survenues dans la ville de Safi le dimanche 14 d\u00e9cembre 2025. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 30, "id": "comm_label_30", "label": "Washington a annonc\u00e9 vendredi la\n\u00ab suspension \u00bb imm\u00e9diate de...", "mass": 5, "physics": false, "shape": "box", "title": "Washington a annonc\u00e9 vendredi la \u00ab suspension \u00bb imm\u00e9diate de la d\u00e9livrance de visas par tirage au sort, un programme populaire dont avait b\u00e9n\u00e9fici\u00e9 l\u2019homme \u2014 de nationalit\u00e9 portugaise \u2014 suspect\u00e9 d\u2019avoir tu\u00e9 deux \u00e9tudiants \u00e0 l\u2019universit\u00e9 am\u00e9ricaine Brown et un professeur du MIT. [telquel.ma]\n-------------------------------------------------\nLa suspension des visas d\u00e9livr\u00e9s par tirage au sort aux \u00c9tats-Unis, annonc\u00e9e apr\u00e8s la fusillade de l\u2019universit\u00e9 Brown, ouvre une phase d\u2019incertitude autour d\u2019un programme migratoire mis en place depuis plus de trente ans. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La valeur globale des projets\nfinanc\u00e9s par l\u2019Agence Bayt Mal...", "mass": 5, "physics": false, "shape": "box", "title": "La valeur globale des projets financ\u00e9s par l\u2019Agence Bayt Mal Al-Qods Acharif au titre de l\u2019ann\u00e9e 2025 a atteint huit millions de dollars, a affirm\u00e9, jeudi \u00e0 Rabat, le directeur charg\u00e9 de la gestion de l\u2019Agence, Mohamed Salem Cherkaoui, soulignant que le Royaume du Maroc demeure l\u2019unique bailleur de fonds de l\u2019Agence. [telquel.ma]\n-------------------------------------------------\nLa valeur globale des projets financ\u00e9s par l\u2019Agence Bayt Mal Al-Qods Acharif au titre de l\u2019ann\u00e9e 2025 a atteint huit millions de dollars, a affirm\u00e9, jeudi \u00e0 Rabat, le directeur charg\u00e9 de la gestion de l\u2019Agence, Mohamed Salem Cherkaoui, soulignant que le Royaume du Maroc demeure l\u2019unique bailleur de fonds de l\u2019Agence. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 37, "id": "comm_label_37", "label": "La Fondation Mohammed V pour\nla Solidarit\u00e9 a proc\u00e9d\u00e9, jeudi,...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Mohammed V pour la Solidarit\u00e9 a proc\u00e9d\u00e9, jeudi, \u00e0 la distribution d\u2019aides au profit de 963 m\u00e9nages issus de plusieurs communes de la province d\u2019Al Haouz, et ce dans le cadre de l\u2019Op\u00e9ration \u201cGrand Froid\u201d, lanc\u00e9e en application des instructions du roi Mohammed VI. [telquel.ma]\n-------------------------------------------------\nL\u0027op\u00e9ration humanitaire a concern\u00e9 les populations des communes de Tlat N\u0027Yacoub (351 familles b\u00e9n\u00e9ficiaires), d\u0027Ighil (278 familles) et d\u0027Aghbar (334 familles), qui figurent parmi les zones les plus expos\u00e9es aux intemp\u00e9ries et \u00e0 la baisse des temp\u00e9ratures. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Les Lions de l\u2019Atlas ont\nouvert le score d\u00e8s la...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lions de l\u2019Atlas ont ouvert le score d\u00e8s la 4\u00e8 minute du jeu par le biais de Oussama Tannane, auteur d\u2019un missile du milieu de terrain qui a fil\u00e9 en pleine. [telquel.ma]\n-------------------------------------------------\nAvec l\u0027art et la mani\u00e8re et au bout du suspens haletant, les Lions de l\u2019Atlas se sont adjug\u00e9s, jeudi \u00e0 Doha, le sacre ultime en Coupe Arabe de football (Qatar-2025), le 2\u00e8 de leur histoire. [atlasinfo.fr]\n-------------------------------------------------\nLes Lions de l\u2019Atlas ont ouvert le score d\u00e8s la 4\u00e8 minute du jeu par le biais de Oussama Tannane, auteur d\u2019un missile du milieu de terrain qui a fil\u00e9 en pleine [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a remport\u00e9, jeudi au stade Lusail, la Coupe arabe Qatar 2025, en s\u2019imposant face \u00e0 la Jordanie sur le score de 3 buts \u00e0 2 apr\u00e8s prolongations. [lnt.ma]\n-------------------------------------------------\nCAN U17, CHAN, Coupe du monde U20 et Coupe arabe, les Lions de l\u2019Atlas n\u2019ont rien laiss\u00e9 au passage cette ann\u00e9e. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Le pr\u00e9sident de la Fondation\nMaroc 2030, Fouzi Lekjaa, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Fondation Maroc 2030, Fouzi Lekjaa, a affirm\u00e9, jeudi \u00e0 Rabat, que le secteur sportif est devenu une composante essentielle des strat\u00e9gies de d\u00e9veloppement global du Royaume. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Fondation Maroc 2030, Fouzi Lekjaa, a affirm\u00e9 jeudi \u00e0 Rabat que le sport est d\u00e9sormais une composante essentielle des strat\u00e9gies de d\u00e9veloppement global du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "L\u2019Agence marocaine de d\u00e9veloppement des\ninvestissements et des exportations (AMDIE)...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence marocaine de d\u00e9veloppement des investissements et des exportations (AMDIE) et la Conf\u00e9d\u00e9ration africaine de football (CAF) ont conclu un accord de partenariat faisant de Morocco Now, la marque \u00e9conomique du Royaume, le sponsor officiel de la Coupe d\u2019Afrique des Nations (CAN) 2025, organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, et le directeur g\u00e9n\u00e9ral de l\u2019Agence marocaine de d\u00e9veloppement des investissements et des exportations (AMDIE), Ali Seddik, [www.challenge.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) et l\u2019Agence marocaine de d\u00e9veloppement des investissements et des exportations (AMDIE) ont sign\u00e9 un accord faisant de Morocco Now le sponsor officiel de la Coupe d\u2019Afrique des Nations TotalEnergies CAF Maroc 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le chef du gouvernement, Aziz\nAkhannouch, a pr\u00e9sid\u00e9 mercredi 17...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9 mercredi 17 d\u00e9cembre 2025 \u00e0 Rabat une r\u00e9union de travail consacr\u00e9e \u00e0 la pr\u00e9sentation du plan strat\u00e9gique de la Soci\u00e9t\u00e9 nationale de R\u00e9alisation et de gestion des \u00e9quipements sportifs (SONARGES). [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9 mercredi \u00e0 Rabat une r\u00e9union de travail d\u00e9di\u00e9e \u00e0 la pr\u00e9sentation du plan strat\u00e9gique de la Sonarges (Soci\u00e9t\u00e9 nationale de r\u00e9alisation et de gestion des \u00e9quipements sportifs), et au suivi de l\u2019avancement des projets structurants li\u00e9s \u00e0 la mise \u00e0 niveau des infrastructures sportives nationales. [leseco.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9, mercredi \u00e0 Rabat, une r\u00e9union de travail consacr\u00e9e \u00e0 la pr\u00e9sentation du plan strat\u00e9gique de la Soci\u00e9t\u00e9 nationale de R\u00e9alisation et de Gestion des \u00e9quipements sportifs (SONARGES) et au suivi de l\u2019\u00e9tat d\u2019avancement des projets structurants port\u00e9s par la soci\u00e9t\u00e9 dans le cadre de la mise \u00e0 . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans le cadre de la\nnouvelle r\u00e9glementation autorisant les bureaux...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la nouvelle r\u00e9glementation autorisant les bureaux de change \u00e0 accepter les paiements \u00e9lectroniques via des terminaux de paiement \u00e9lectronique (TPE), NAPS annonce la signature [www.challenge.ma]\n-------------------------------------------------\nDans le cadre de la nouvelle r\u00e9glementation autorisant les bureaux de change \u00e0 accepter les paiements \u00e9lectroniques via des terminaux de paiement \u00e9lectronique (TPE), NAPS annonce la signature d\u2019un partenariat strat\u00e9giq     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
