, ont proc\u00e9d\u00e9, vendredi, sur la base d\u2019informations pr\u00e9cises fournies par la Direction G\u00e9n\u00e9rale de la Surveillance du Territoire (DGST), \u00e0 l\u2019interpellation de deux extr\u00e9mistes affili\u00e9s \u00e0 l\u2019organisation terroriste de \u00ab Daech \u00bb, a annonc\u00e9 le Bureau Central d\u2019Investigations Judiciaires (BCIJ). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Apr\u00e8s plus de huit heures\nde d\u00e9bats parfois tendus, la...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s plus de huit heures de d\u00e9bats parfois tendus, la Commission de la justice, de la l\u00e9gislation, des droits de l\u2019Homme et des libert\u00e9s \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, j. [lematin.ma]\n-------------------------------------------------\nLa Commission de la justice, de la l\u00e9gislation, des droits de l\u0027homme et des libert\u00e9s \u00e0 la Chambre des repr\u00e9sentants a approuv\u00e9, jeudi \u00e0 la majorit\u00e9, le projet de loi N 66.23 r\u00e9gissant la profession d\u2019avocat. [leseco.ma]\n-------------------------------------------------\nCe texte a \u00e9t\u00e9 adopt\u00e9 par 16 voix pour et 7 contre, \u00e0 l\u2019issue d\u2019une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen . [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Dans le cadre des pr\u00e9paratifs\ndes \u00e9lections l\u00e9gislatives des membres...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives des membres de la Chambre des repr\u00e9sentants, pr\u00e9vues le 23 septembre 2026, le ministre de l\u0027Int\u00e9rieur informe les. [lematin.ma]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a annonc\u00e9 le lancement de l\u2019op\u00e9ration de r\u00e9vision des listes \u00e9lectorales g\u00e9n\u00e9rales, en vertu de la d\u00e9cision n\u00b0690.26 publi\u00e9e au Bulletin officiel le 23 avril 2026, dans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives pr\u00e9vues le 23 septembre 2026 pour l\u2019\u00e9lection des membres de la Chambre des repr\u00e9sentants. [telquel.ma]\n-------------------------------------------------\nDans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives des membres de la Chambre des repr\u00e9sentants, pr\u00e9vues le 23 septembre 2026, le d\u00e9lai de d\u00e9p\u00f4t des nouvelles demandes d\u2019inscription [www.challenge.ma]\n-------------------------------------------------\nDans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives des membres de la Chambre des repr\u00e9sentants, pr\u00e9vues le 23 septembre 2026, le d\u00e9lai de d\u00e9p\u00f4t des nouvelles demandes d\u2019inscription sur les listes \u00e9lectorales g\u00e9n\u00e9rales est fix\u00e9 du 15 mai au 13 juin 2026, annonce un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [aujourdhui.ma]\n-------------------------------------------------\nDans le cadre des pr\u00e9paratifs en vue des \u00e9lections l\u00e9gislatives des membres de la Chambre des repr\u00e9sentants, programm\u00e9es pour le 23 septembre 2026, le ministre de l\u2019Int\u00e9rieur a annonc\u00e9 l\u2019ouverture de la p\u00e9riode d\u2019inscription sur les listes \u00e9lectorales. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les exportations directes de tomates\nmarocaines vers la Finlande ont...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations directes de tomates marocaines vers la Finlande ont atteint un niveau historique durant la saison 2025/2026, dans un contexte de r\u00e9organisation progressive des cir. [lematin.ma]\n-------------------------------------------------\nLe Maroc a doubl\u00e9 ses exportations directes de tomates vers la Finlande au cours de la saison 2025/26, signant un nouveau record dans les \u00e9changes bilat\u00e9raux, rapporte EastFruit. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts\n(DGI) a annonc\u00e9 que la...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) a annonc\u00e9 que la plateforme de collecte de la TVA (taxe sur la valeur ajout\u00e9e) sur les prestations de services \u00e0 distance d\u00e9mat\u00e9rialis\u00e9es, q. [lematin.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) a annonc\u00e9 que la plateforme de collecte de la TVA (taxe sur la valeur ajout\u00e9e) sur les prestations de services \u00e0 distance d\u00e9mat\u00e9rialis\u00e9es, \u00ab Taxation on digital services \u00bb, est d\u00e9sormais accessible \u00e0 travers les t\u00e9l\u00e9services SIMPL via le portail internet \u00ab www.tax.gov.ma \u00bb. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019entrepreneur Mehdi Tazi a \u00e9t\u00e9\n\u00e9lu, jeudi \u00e0 Casablanca, pr\u00e9sident...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019entrepreneur Mehdi Tazi a \u00e9t\u00e9 \u00e9lu, jeudi \u00e0 Casablanca, pr\u00e9sident de Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM), \u00e0 l\u2019issue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective d. [lematin.ma]\n-------------------------------------------------\nMehdi Tazi est port\u00e9 \u00e0 la pr\u00e9sidence de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises au Maroc (CGEM), au terme de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019organisation patronale tenue jeudi 14 [www.challenge.ma]\n-------------------------------------------------\nMehdi Tazi et Mohamed Bachiri ont \u00e9t\u00e9 \u00e9lus, jeudi \u00e0 Casablanca, respectivement pr\u00e9sident et vice-pr\u00e9sident g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), \u00e0 lissue dune Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective (AGOE). [www.yabiladi.com]\n-------------------------------------------------\nSans surprise, le bin\u00f4me form\u00e9 par Mehdi Tazi et Mohamed Bachiri prend les commandes de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc. [leseco.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a \u00e9lu, jeudi \u00e0 Casablanca, Mehdi Tazi \u00e0 sa pr\u00e9sidence, aux c\u00f4t\u00e9s de Mohamed Bachiri en qualit\u00e9 de vice-pr\u00e9sident g\u00e9n\u00e9ral, \u00e0 l\u2019issue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective de l\u2019organisation patronale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Des chutes de neige et\nde fortes pluies sont pr\u00e9vues,...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige et de fortes pluies sont pr\u00e9vues, vendredi et samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige et de fortes pluies sont pr\u00e9vues, vendredi et samedi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n--------------------------- <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
