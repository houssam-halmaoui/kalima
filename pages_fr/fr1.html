loppement rural et des Eaux et For\u00eats, charg\u00e9e de la P\u00eache Maritime, Zakia Driouich, a indiqu\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants que 68 march\u00e9s de vente de poissons sur 76 sont d\u00e9sormais int\u00e9gr\u00e9s dans un dispositif num\u00e9rique. [www.lopinion.ma]\n-------------------------------------------------\nUn syst\u00e8me num\u00e9rique a \u00e9t\u00e9 d\u00e9ploy\u00e9 au niveau des march\u00e9s de premi\u00e8re vente, garantissant transparence et tra\u00e7abilit\u00e9 pour les acheteurs,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le minist\u00e8re de l\u2019Am\u00e9nagement du\nterritoire national, de l\u2019Urbanisme, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, a fait savoir que les livraisons de ciment ont atteint plus de 14,81 millions de tonnes (MT) au titre de l\u2019ann\u00e9e 2025, en hausse de 8,21% par rapport \u00e0 l\u2019ann\u00e9e pr\u00e9c\u00e9dente. [fr.hespress.com]\n-------------------------------------------------\nLes livraisons de ciment s\u2019\u00e9l\u00e8vent \u00e0 14,8 millions de tonnes \u00e0 fin d\u00e9cembre 2025, soit une hausse de 8,2%, selon les donn\u00e9es du minist\u00e8re de l\u0027Am\u00e9nagement du Territoire nationa. [lematin.ma]\n-------------------------------------------------\nLes livraisons de ciment ont atteint plus de 14,81 millions de tonnes (MT) au titre de l\u0027ann\u00e9e 2025, en hausse de 8,21% par rapport \u00e0 l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le minist\u00e8re de l\u0027Am\u00e9nagement du territoire national, de l\u0027Urbanisme, de l\u0027Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2 inion.ma]\n-------------------------------------------------\nDeux personnes ont trouv\u00e9 la mort et quatre autres ont \u00e9t\u00e9 bless\u00e9s, \u00e0 divers degr\u00e9s de gravit\u00e9, suite \u00e0 l\u2019effondrement partiel, lundi dans le quartier Akkari \u00e0 Rabat, d\u2019un immeuble compos\u00e9 d\u2019un rez-de-chauss\u00e9e \u00e0 usage commercial et de deux \u00e9tages habit\u00e9s par une seule famille, selon les autorit\u00e9s locales de la Pr\u00e9fecture de Rabat. [telquel.ma]\n-------------------------------------------------\nUn drame est survenu lundi dans le quartier Akkari \u00e0 Rabat, o\u00f9 l\u2019effondrement partiel d\u2019un immeuble a caus\u00e9 la mort de deux personnes et fait quatre bless\u00e9s, selon les autorit\u00e9s locales de la pr\u00e9fecture de Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le Nigeria a valid\u00e9 son\nticket pour les quarts de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Nigeria a valid\u00e9 son ticket pour les quarts de finale de la Coupe d\u2019Afrique des Nations (CAN 2025), apr\u00e8s sa victoire (4-0) face au Mozambique, ce lundi au Stade de F\u00e8s. [fr.hespress.com]\n-------------------------------------------------\nEn inscrivant un but dans chacune des quatre premi\u00e8res rencontres de la Coupe d\u2019Afrique des Nations (Maroc-2025), Brahim Diaz inscrit son nom en lettres d\u2019or dans les annales [www.challenge.ma]\n-------------------------------------------------\nEn inscrivant un but dans chacune des quatre premi\u00e8res rencontres de la Coupe d\u0027Afrique des Nations (Maroc-2025), Brahim Diaz inscrit son nom en lettres d\u0027or dans les annales du ballon rond marocain. [leseco.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe \u00e9gyptienne de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2025 en s\u2019imposant face \u00e0 son homologue b\u00e9ninoise sur le score de 3 buts \u00e0 1 apr\u00e8s prolongation, en match des huiti\u00e8mes de finale disput\u00e9 lundi au Grand stade d\u2019Agadir. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Apr\u00e8s une victoire difficile face\n\u00e0 la Tanzanie, le Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s une victoire difficile face \u00e0 la Tanzanie, le Maroc a valid\u00e9 son ticket pour les quarts de finale de la CAN. [lematin.ma]\n-------------------------------------------------\nDimanche 4 janvier au Stade Prince Moulay Abdallah de Rabat, le Maroc a battu la Tanzanie 1\u20110 pour acc\u00e9der aux quarts de finale de la CAN 2025. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9 dimanche que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est contraint de d\u00e9clarer forfait pour le reste de la Coupe d\u2019Afrique des Nations Maroc-2025. [lnt.ma]\n-------------------------------------------------\nHuiti\u00e8mes de finale Solides, appliqu\u00e9s et insistants, les Lions de l\u2019Atlas ont valid\u00e9 leur qualification pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025, en \u00e9cartant la Tanzanie (1-0), dimanche au stade Prince Moulay Abdellah \u00e0 Rabat. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les avocats du Maroc en\ngr\u00e8ve ce mardi pour protester...", "mass": 5, "physics": false, "shape": "box", "title": "Les avocats du Maroc en gr\u00e8ve ce mardi pour protester contre le projet de loi sur la profession. [lematin.ma]\n-------------------------------------------------\nL\u2019Association des barreaux du Maroc annonce la suspension, \u00e0 compter d\u2019aujourd\u2019hui, des services juridiques \u00e0 l\u2019\u00e9chelle nationale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Maroc a enregistr\u00e9 en\n2025 un total de 19,8...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a enregistr\u00e9 en 2025 un total de 19,8 millions d\u2019arriv\u00e9es touristiques, en hausse de 14 % par rapport \u00e0 2024. [lematin.ma]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 19,8 millions d\u2019arriv\u00e9es touristiques en 2025, soit une progression de 14% par rapport \u00e0 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de [www.challenge.ma]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 19,8 millions d\u2019arriv\u00e9es touristiques en 2025, soit une progression de 14% par rapport \u00e0 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 19,8 millions d\u2019arriv\u00e9es touristiques au cours de l\u2019ann\u00e9e 2025, en hausse de 14 % par rapport \u00e0 2024. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "R\u00e9alis\u00e9e en granit par les\nartistes Ben Jakober et Yannick...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9alis\u00e9e en granit par les artistes Ben Jakober et Yannick Jakober, l\u2019\u0153uvre vient enrichir le parvis du mus\u00e9e, pens\u00e9 comme un espace d\u2019exposition \u00e0 ciel ouvert. [lematin.ma]\n-------------------------------------------------\nNouvelle installation Le Mus\u00e9e Mohammed VI d\u2019art moderne et contemporain (MMVI) \u00e0 Rabat abrite, mercredi prochain, la c\u00e9r\u00e9monie de d\u00e9voilement de la nouvelle sculpture \u00abPaloma\u00bb, une \u0153uvre majestueuse en granit, con\u00e7ue par les artistes Ben et Yannick Jakober. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "L\u2019enqu\u00eate de conjoncture de Bank\nAl-Maghrib (BAM) au titre du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019enqu\u00eate de conjoncture de Bank Al-Maghrib (BAM) au titre du mois de novembre 2025 fait ressortir une baisse de l\u2019activit\u00e9 industrielle. [www.lopinion.ma]\n-------------------------------------------------\nDans ces conditions, le Taux d\u2019Utilisation des Capacit\u00e9s (TUC) se serait repli\u00e9 \u00e0 79%, contre 80% le mois pr\u00e9c\u00e9dent, indique BAM dans sa r\u00e9cente enqu\u00eate mensuelle de conjoncture dans l\u2019industrie. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro,\ncaptur\u00e9 samedi lors d\u0027une op\u00e9ration...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro, captur\u00e9 samedi lors d\u0027une op\u00e9ration militaire am\u00e9ricaine \u00e0 Caracas, a plaid\u00e9 non coupable lundi devant un tribunal de New York, o\u00f9 il est poursuivi notamment pour \"narcoterrorisme\" et importation de coca\u00efne aux Etats-Unis. [www.lopinion.ma]\n-------------------------------------------------\nLe pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro, captur\u00e9 samedi lors d\u0027une op\u00e9ration militaire am\u00e9ricaine \u00e0 Caracas, doit compara\u00eetre ce lundi devant un juge \u00e0 New York, a annonc\u00e9 dimanche le tribunal o\u00f9 il sera jug\u00e9 notamment pour \"narcoterrorisme\" et importation de coca\u00efne aux Etats-Unis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Intervenant lundi \u00e0 la Chambre\ndes repr\u00e9sentants, le Secr\u00e9taire d\u2019\u00c9tat...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lundi \u00e0 la Chambre des repr\u00e9sentants, le Secr\u00e9taire d\u2019\u00c9tat aupr\u00e8s du Ministre de l\u2019Industrie et du Commerce, charg\u00e9 du Commerce ext\u00e9rieur, Omar Hejira, a estim\u00e9 que l\u2019\u00e9volution du d\u00e9ficit commercial et l\u2019augmentation des importations rel\u00e8vent d\u2019un ph\u00e9nom\u00e8ne structurel, \u00e9troitement li\u00e9 \u00e0 la vitalit\u00e9 de l\u2019investissement et \u00e0 l\u2019intensit\u00e9 de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019\u00e9volution de la balance commerciale du Maroc et la hausse des importations s\u2019inscrivent dans une tendance naturelle, traduisant la dynamique de l\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 du Commerce ext\u00e9rieur, Omar Hejira. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9volution de la balance commerciale du Maroc et la hausse des importations s\u2019inscrivent dans une tendance naturelle, traduisant la dynamique de l\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le pays, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 du Commerce ext\u00e9rieur, Omar Hejira. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9volution de la balance commerciale du Maroc et l\u2019augmentation des importations s\u2019inscrivent dans une tendance jug\u00e9e \u00ab naturelle \u00bb, reflet de la dynamique d\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de\nl\u2019Investissement, de la Convergence et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la Convergence et de l\u2019\u00e9valuation des politiques publiques, Karim Zidane, a annonc\u00e9 devant la chambre des repr\u00e9sentants que le nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises a d\u00e9j\u00e0 valid\u00e9 89 projets d\u2019investissement, pour une enveloppe totale d\u00e9passant 1,28 milliard de dirhams. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre Karim Zidane a fait le point lundi devant les d\u00e9put\u00e9s sur l\u2019avancement des m\u00e9canismes d\u2019aide aux entreprises et l\u2019am\u00e9lioration du climat des affaires au Maroc. [telquel.ma]\n-------------------------------------------------\nUn total de 89 projets d\u2019investissement, portant sur plus de 1,28 milliard de dirhams, ont \u00e9t\u00e9 approuv\u00e9s dans le cadre du dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME), lanc\u00e9 il y a un mois et demi, a annonc\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la convergence et de l\u2019\u00e9valuation des politiques publiques, Karim Zidane. [www.yabiladi.com]\n-------------------------------------------------\nLe nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises a permis l\u2019approbation de 89 projets d\u2019investissement pour un montant global , indique lundi la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "De fortes pluies parfois orageuses,\ndes chutes de neige, un...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nCette d\u00e9cision fait suite au dernier bulletin d\u0027alerte \u00e9mis par la Direction G\u00e9n\u00e9rale de la M\u00e9t\u00e9orologie (DGM) signalant des pr\u00e9cipitations abondantes et des vents forts. [www.lavieeco.com]\n-------------------------------------------------\nDe fortes pluies parfois orageuses, des chutes de neige, un temps froid et de fortes rafales de vent sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Selon le communiqu\u00e9 de presse\nde l\u2019ONDA, \u201cce centre strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le communiqu\u00e9 de presse de l\u2019ONDA, \u201cce centre strat\u00e9gique marque une avanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle du premier a\u00e9roport du Royaume et contribuera \u00e0 la fluidit\u00e9 durant la CAN 2025. [telquel.ma]\n-------------------------------------------------\nL\u2019Office National des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u2019a\u00e9roport international Mohammed V de Casablanca, marquant une avanc\u00e9e structurante dans l\u2019organisation [www.challenge.ma]\n-------------------------------------------------\nL\u2019ONDA lance un centre de commandement au sein de l\u2019a\u00e9roport Mohammed V. L\u0027Office national des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u0027a\u00e9roport international Mohammed V de Casablanca. [leseco.ma]\n-------------------------------------------------\nL\u2019Office national des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u2019a\u00e9roport international Mohammed V de Casablanca. [atlasinfo.fr]\n-------------------------------------------------\nCe centre strat\u00e9gique marque une avanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle du premier a\u00e9roport du Royaume et contribuera \u00e0 la fluidit\u00e9 durant la Coupe d\u2019Afrique des Nations (CAN) 2025 et les grands \u00e9v\u00e9nements internationaux [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Donald Trump a affirm\u00e9 que\nles Etats-Unis \u00e9taient \u00ab aux...", "mass": 5, "physics": false, "shape": "box", "title": "Donald Trump a affirm\u00e9 que les Etats-Unis \u00e9taient \u00ab aux commandes \u00bb du Venezuela apr\u00e8s la capture du pr\u00e9sident Nicolas Maduro, qui doit \u00eatre pr\u00e9sent\u00e9 lundi \u00e0 un tribunal \u00e0 New York pour se voir signifier des accusations de trafic de drogue. [telquel.ma]\n---------------------------------------------         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
