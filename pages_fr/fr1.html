on Marhaba au sein de la Fondation Mohammed V pour la solidarit\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le pr\u00e9sident de la FIFA,\nGianni Infantino, tient ce mercredi...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la FIFA, Gianni Infantino, tient ce mercredi \u00e0 Rabat une r\u00e9union de crise avec de hauts responsables de l\u2019instance mondiale, dans un contexte de fortes tensions internes. [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, a convoqu\u00e9 les hauts responsables de l\u2019instance \u00e0 une r\u00e9union, pr\u00e9vue ce mercredi \u00e0 Rabat, sur fond de crise provoqu\u00e9e par l\u2019\u00e9chec de son projet visant \u00e0 cr\u00e9er une filiale charg\u00e9e de commercialiser la phase finale de la Coupe du monde, rapporte Sky Sports. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, doit tenir mercredi au Maroc une r\u00e9union de crise avec de hauts responsables de l\u2019instance, pour consolider sa position apr\u00e8s l\u2019effondrement d\u2019un projet controvers\u00e9 portant sur les droits commerciaux de la Coupe du monde, a rapport\u00e9 Reuters. [www.yabiladi.com]\n-------------------------------------------------\nGianni Infantino a tenu mercredi une r\u00e9union de crise avec les hauts responsables de la FIFA au si\u00e8ge de l\u0027organisation \u00e0 Rabat, fragilis\u00e9 par les retomb\u00e9es de son projet avort\u00e9 d\u0027ouverture du capital de l\u0027instance \u00e0 des investisseurs priv\u00e9s. [atlasinfo.fr]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, doit r\u00e9unir mercredi matin au Maroc plusieurs hauts responsables de l\u2019instance mondiale, dans un contexte de fortes tensions internes apr\u00e8s l\u2019abandon d\u2019un projet controvers\u00e9 d\u2019ouverture des activit\u00e9s commerciales de la FIFA \u00e0 des investisseurs priv\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Voici les principaux titres d\u00e9velopp\u00e9s\npar la presse nationale de...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les principaux titres d\u00e9velopp\u00e9s par la presse nationale de ce mercredi 5 ao\u00fbt 2026 Le Matin Souss-Massa : l\u2019ANDA pr\u00e9pare une nouvelle g\u00e9n\u00e9ration de plans d\u2019am\u00e9nagement aquacole L\u2019Agence nationale pour le d\u00e9veloppement de l\u2019aquaculture engagera prochainement l\u2019actualisation du plan r\u00e9gional aquacole de Souss-Massa, six ans apr\u00e8s sa premi\u00e8re mouture. [fr.hespress.com]\n-------------------------------------------------\nSix ans apr\u00e8s l\u2019\u00e9tablissement de son premier Plan r\u00e9gional d\u2019am\u00e9nagement et de gestion aquacole (PAA), la r\u00e9gion de Souss-Massa s\u2019appr\u00eate \u00e0 voir sa carte aquacole redessin\u00e9e. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le projet de traitement et\nde valorisation des d\u00e9chets solides...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet de traitement et de valorisation des d\u00e9chets solides de Casablanca entre dans une nouvelle phase. [lematin.ma]\n-------------------------------------------------\nUn consortium emmen\u00e9 par Kanadevia Inova lancera, d\u2019ici la fin de l\u2019ann\u00e9e, la construction d\u2019une usine de valorisation \u00e9nerg\u00e9tique des d\u00e9chets \u00e0 Casablanca. [leseco.ma]\n-------------------------------------------------\nCasablanca franchit un cap historique avec son premier projet int\u00e9gr\u00e9 de valorisation \u00e9nerg\u00e9tique des d\u00e9chets. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Ainsi, une vague de chaleur\navec des temp\u00e9ratures oscillant entre...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de mercredi \u00e0 vendredi, les provinces d\u0027Errachidia, Taroudant, Zagora, Tata, Assa-Zag. [lematin.ma]\n-------------------------------------------------\nAinsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de mardi \u00e0 jeudi, les provinces d\u2019Errachidia, Taroudant, Zagora, Tata, Assa-Zag, Es-Semara, Boujdour,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 l\u0027instar des ann\u00e9es pr\u00e9c\u00e9dentes,\nce centre assure une \u00e9coute,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u0027instar des ann\u00e9es pr\u00e9c\u00e9dentes, ce centre assure une \u00e9coute, un accompagnement et un suivi des requ\u00eates formul\u00e9es par les Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger et leur permet une. [lematin.ma]\n-------------------------------------------------\nLe centre assure une \u00e9coute, un accompagnement et un suivi des requ\u00eates formul\u00e9es par les Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger et leur permet une interaction directe avec des cadres sp\u00e9cialis\u00e9s de la Fondation Hassan II dans le domaine juridique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Cette performance traduit la solidit\u00e9\ndu dispositif industriel du Groupe...", "mass": 5, "physics": false, "shape": "box", "title": "Cette perfor             if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
