u00e9riels, le chef du...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une circulaire adress\u00e9e aux d\u00e9partements minist\u00e9riels, le chef du gouvernement fixe 4 grandes priorit\u00e9s : consolider les acquis \u00e9conomiques, r\u00e9duire les disparit\u00e9s territoriales, poursuivre l\u2019\u00e9dification de l\u2019\u00c9tat social et pr\u00e9server les \u00e9quilibres des finances publiques. [telquel.ma]\n-------------------------------------------------\nLe projet de loi de finances (PLF) 2027 s\u0027articule autour de quatre axes strat\u00e9giques portant sur la croissance \u00e9conomique, la r\u00e9duction des disparit\u00e9s territoriales, le renforcement de l\u0027\u00c9tat social et la pr\u00e9servation des \u00e9quilibres budg\u00e9taires. [www.lavieeco.com]\n-------------------------------------------------\nLe chef du gouvernement Aziz Akhannouch a fix\u00e9 quatre grandes priorit\u00e9s pour le projet de loi de finances 2027, conciliant consolidation des acquis \u00e9conomiques, r\u00e9duction des disparit\u00e9s territoriales et pr\u00e9servation des \u00e9quilibres budg\u00e9taires. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Une vague de chaleur, des\naverses orageuses avec risque de...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur, des averses orageuses avec risque de gr\u00eale et rafale de vent sous orages sont attendus, de jeudi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes temp\u00e9ratures pouvant atteindre 47 \u00b0C, accompagn\u00e9es localement d\u0027averses orageuses, de chutes de gr\u00eale et de rafales de vent, sont attendues dans plusieurs r\u00e9gions du Royaume jusqu\u0027\u00e0 samedi, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie. [www.lavieeco.com]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses avec risque de gr\u00eale et rafale de vent sous orages sont attendus, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nAinsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de vendredi \u00e0 dimanche, les provinces de Taroudant, Zagora, Tata, Assa-Zag, Es-Semara, Bo. [lematin.ma]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses avec risque de gr\u00eale et rafale de vent sous orages sont attendus, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019a\u00e9roport de Rabat-Sal\u00e9 a enregistr\u00e9,\nau premier semestre 2026, une...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019a\u00e9roport de Rabat-Sal\u00e9 a enregistr\u00e9, au premier semestre 2026, une hausse de 14,8% du trafic de passagers par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e \u00e9coul\u00e9e, selon des donn\u00e9es de l\u2019Office national des a\u00e9roports (ONDA). [telquel.ma]\n-------------------------------------------------\nL\u0027a\u00e9roport de Rabat-Sal\u00e9 a accueilli plus de 1,21 million de voyageurs au cours des six premiers mois de 2026, confirmant la dynamique de croissance du transport a\u00e9rien dans la capitale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Enjeux Quatre a <script>

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
