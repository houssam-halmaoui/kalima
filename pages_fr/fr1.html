V \u00bb. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La valeur ajout\u00e9e agricole marquerait\nun rebond de 16% cette...", "mass": 5, "physics": false, "shape": "box", "title": "La valeur ajout\u00e9e agricole marquerait un rebond de 16% cette ann\u00e9e, tenant compte d\u2019une r\u00e9colte c\u00e9r\u00e9ali\u00e8re estim\u00e9e par le D\u00e9partement de l\u2019Agriculture \u00e0 93 millions de quintaux (MQx), et. [telquel.ma]\n-------------------------------------------------\nLa croissance de l\u0027\u00e9conomie nationale ralentirait de 4,9% en 2025 \u00e0 4,4% cette ann\u00e9e, puis \u00e0 2,9% en 2027, selon les projections de Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Un temps chaud, des averses\norageuses fortes avec risque de...", "mass": 5, "physics": false, "shape": "box", "title": "Un temps chaud, des averses orageuses fortes avec risque de gr\u00eale et des rafales de vent sous orages sont attendues, mardi et mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie annonce un temps chaud pour aujourd\u2019hui et demain, accompagn\u00e9 de fortes averses orageuses susceptibles de s\u2019accompagner de gr\u00eale et de rafales de vent ce mardi dans plusieurs r\u00e9gions du Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pr\u00e9voit un temps chaud, avec des temp\u00e9ratures comprises entre 38 et 42\u00b0C, dans plusieurs provinces. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "si erme, et un renforcement anticip\u00e9 de lactivit\u00e9 non agricole. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil de Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9, mardi 22 septembre, de maintenir son taux directeur inchang\u00e9 \u00e0 2,25%, dans un environnement international marqu\u00e9 par la persistance des tensions g\u00e9opolitiques et la hausse des prix de l\u2019\u00e9nergie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le 21 septembre, \u00e0 El\nJadida, NTN Europe et OCP...", "mass": 5, "physics": false, "shape": "box", "title": "Le 21 septembre, \u00e0 El Jadida, NTN Europe et OCP Maintenance Solutions, filiale du groupe OCP sp\u00e9cialis\u00e9e en maintenance pr\u00e9dictive, ont scell\u00e9 un partenariat strat\u00e9gique pour optimiser la fiabilit\u00e9, la disponibilit\u00e9 et les performances des \u00e9quipements industriels en Europe. [www.yabiladi.com]\n-------------------------------------------------\nPartenariat Le sp\u00e9cialiste fran\u00e7ais des roulements et la filiale technologique du Groupe OCP annoncent un partenariat strat\u00e9gique pour d\u00e9ployer des solutions de maintenance pr\u00e9dictive par intelligence artificielle aupr\u00e8s des industriels europ\u00e9ens, avec un premier d\u00e9ploiement pr\u00e9vu en France. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Ce scrutin, qui r\u00e9unit 7.288\ncandidatures, dessinera la nouvelle carte...", "mass": 5, "physics": false, "shape": "box", "title": "Ce scrutin, qui r\u00e9unit 7.288 candidatures, dessinera la nouvelle carte politique du pays et d\u00e9terminera les contours de la future majorit\u00e9 gouvernementale. [www.lavieeco.com]\n-------------------------------------------------\nLe 23 septembre 2026, plus de 15,8 millions de Marocains s     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
