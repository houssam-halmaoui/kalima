int-Germain retenus par Luis Enrique pour affronter Manchester City, mardi soir, \u00e0 l\u2019Etihad Stadium, lors de la deuxi\u00e8me journ\u00e9e de la phase de ligue de la Ligue des champions. [fr.hespress.com]\n-------------------------------------------------\nLe jeune gardien marocain Adam Mouak figure dans le groupe des 23 joueurs convoqu\u00e9s par l\u2019entra\u00eeneur du Paris Saint-Germain, Luis Enrique, pour le d\u00e9placement face \u00e0 Manchester City, pr\u00e9vu mardi soir \u00e0 l\u2019Etihad Stadium, dans le cadre de la 2e journ\u00e9e de la phase de ligue de la Ligue des champions. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Orange Maroc participe \u00e0 la\nMorocco CyberSecurity Week 2026, qui...", "mass": 5, "physics": false, "shape": "box", "title": "Orange Maroc participe \u00e0 la Morocco CyberSecurity Week 2026, qui se tient du 12 au 14 octobre \u00e0 Rabat, en qualit\u00e9 de Sponsor Silver \u2013 Cloud \u0026 Security Partner. [fr.hespress.com]\n-------------------------------------------------\nOrange Maroc r\u00e9affirme son engagement en faveur de la cybers\u00e9curit\u00e9 et d\u2019une transformation num\u00e9rique de confiance \u00e0 l\u2019occasion de la \u00ab Morocco CyberSecurity Week \u00bb, organis\u00e9e \u00e0 Rabat sous le th\u00e8me \u00ab La cybers\u00e9curit\u00e9 au service de la transformation et du d\u00e9veloppement num\u00e9rique \u00bb. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Simple., la n\u00e9obanque du groupe\nAttijariwafa bank, poursuit son rythme...", "mass": 5, "physics": false, "shape": "box", "title": "Simple., la n\u00e9obanque du groupe Attijariwafa bank, poursuit son rythme soutenu d\u2019innovation avec le lancement de nouvelles fonctionnalit\u00e9s con\u00e7ues pour enrichir l\u2019exp\u00e9rience de ses clients et simplifier davantage leur quotidien. [fr.hespress.com]\n-------------------------------------------------\nLa n\u00e9obanque Simple., filiale du groupe Attijariwafa bank, poursuit le d\u00e9veloppement de son application mobile en int\u00e9grant de nouveaux services qui d\u00e9passent le cadre des op\u00e9ratio. [lematin.ma]\n-------------------------------------------------\nSimple., la n\u00e9obanque du groupe Attijariwafa bank, poursuit son rythme soutenu d\u2019innovation avec le lancement de nouvelles fonctionnalit\u00e9s con\u00e7ues pour enrichir l\u2019exp\u00e9rience de ses clients et simplifier davantage leur quotidien. [www.lavieeco.com]\n-------------------------------------------------\nSimple., la n\u00e9obanque du groupe Attijariwafa bank, poursuit son rythme soutenu d\u2019innovation avec le lancement de nouvelles fonctionnalit\u00e9s con\u00e7ues pour enrichir l\u2019exp\u00e9rience de ses clients et simplifier davantage leur quotidien. [leseco.ma]\n-------------------------------------------------\nLes utilisateurs peuvent d\u00e9sormais r\u00e9server des billets d\u2019avion aupr\u00e8s de plus de 450 compagnies a\u00e9riennes et souscrire une eSIM internationale couvrant plus de 150 pays, avec un paiement en dirhams sans incidence sur leur dotation . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Chambre des Repr\u00e9sentants tient\nune s\u00e9ance pl\u00e9ni\u00e8re qui sera...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des Repr\u00e9sentants tient une s\u00e9ance pl\u00e9ni\u00e8re qui sera consacr\u00e9e \u00e0 l\u0027\u00e9lection de son pr\u00e9sident. [lematin.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants tiendra, mardi 13 octobre \u00e0 15h, une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019\u00e9lection de son pr\u00e9sident, selon 28 novembre 2026. [telquel.ma]\n-------------------------------------------------\nL\u2019actrice fran\u00e7aise oscaris\u00e9e, Marion Cotillard, pr\u00e9sidera la 23e \u00e9dition du Festival international du film de Marrakech, qui se tiendra du 20 au 28 novembre, ont annonc\u00e9 les organisateurs le 13 octobre. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019actrice fran\u00e7aise oscaris\u00e9e aura pour mission, avec les autres membres du jury, de d\u00e9cerner l\u2019\u00c9toile d\u2019or parmi les premiers et deuxi\u00e8mes longs m\u00e9trages en comp\u00e9tition internationale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le mus\u00e9e, qui s\u2019inscrit dans\nla vision Royale qui accorde...", "mass": 5, "physics": false, "shape": "box", "title": "Le mus\u00e9e, qui s\u2019inscrit dans la vision Royale qui accorde une place centrale \u00e0 la pr\u00e9servation et \u00e0 la valorisation de l\u2019ensemble des composantes de l\u2019identit\u00e9 marocaine, dans leur. [lematin.ma]\n-------------------------------------------------\nAu c\u0153ur du Mellah de F\u00e8s, l\u00e0 o\u00f9 les ruelles, les demeures anciennes et les lieux de m\u00e9moire portent encore les traces d\u2019une histoire pluris\u00e9culaire, le Mus\u00e9e de la Culture Juive Marocaine ouvre une nouvelle page dans la pr\u00e9servation et la transmission du patrimoine national. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Cette rencontre s\u2019inscrit dans le\ncadre des relations privil\u00e9gi\u00e9es d\u2019amiti\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Cette rencontre s\u2019inscrit dans le cadre des relations privil\u00e9gi\u00e9es d\u2019amiti\u00e9, de fraternit\u00e9 et de coop\u00e9ration qui unissent le Royaume d                                 scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
