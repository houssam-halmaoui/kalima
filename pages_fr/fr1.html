I d\u2019Espagne et la Reine Letizia, \u00e0 la suite de l\u2019accident ferroviaire survenu \u00e0 Tol\u00e8de, en espagne. [www.lavieeco.com]\n-------------------------------------------------\nSM le Roi Mohammed VI a adress\u00e9 un message de condol\u00e9ances \u00e0 leurs Majest\u00e9s le Roi Felipe VI d\u2019Espagne et la Reine Letizia, \u00e0 la suite de l\u2019accident ferroviaire survenu \u00e0 Tol\u00e8de. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Dans un communiqu\u00e9, le Consulat\ng\u00e9n\u00e9ral du Royaume du Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, le Consulat g\u00e9n\u00e9ral du Royaume du Maroc \u00e0 Madrid a pr\u00e9cis\u00e9 qu\u0027\u00e0 la suite de ce tragique accident ferroviaire, et soucieuse de s\u0027enqu\u00e9rir de la situation. [lematin.ma]\n-------------------------------------------------\nAucune victime de nationalit\u00e9 marocaine n\u2019est \u00e0 d\u00e9plorer, jusqu\u2019\u00e0 mercredi \u00e0 15h00 (heure locale), dans la collision survenue entre deux trains \u00e0 grande vitesse dans la r\u00e9gion d\u2019Urda (Tol\u00e8de) en Espagne, a annonc\u00e9 le Consulat g\u00e9n\u00e9ral du Royaume du Maroc \u00e0 Madrid. [telquel.ma]\n-------------------------------------------------\nAucun ressortissant marocain ne figure, \u00e0 ce stade, parmi les victimes de la collision entre deux trains \u00e0 grande vitesse survenue dans la r\u00e9gion de Tol\u00e8de, en Espagne. [www.lavieeco.com]\n-------------------------------------------------\nAucune victime de nationalit\u00e9 marocaine n\u0027est \u00e0 d\u00e9plorer, jusqu\u0027\u00e0 mercredi \u00e0 15h00 (heure locale), dans la collision survenue entre deux trains \u00e0 grande vitesse dans la r\u00e9gion d\u0027Urda (Tol\u00e8de) en Espagne. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le groupe Sothema poursuit la\ndiversification de ses activit\u00e9s avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Sothema poursuit la diversification de ses activit\u00e9s avec la signature d\u2019un accord portant sur l\u2019acquisition de 100% du capital de Ramo Pharm, acteur marocain sp\u00e9cialis\u00e9. [lematin.ma]\n-------------------------------------------------\nLe groupe de Lamia Tazi a sign\u00e9 un accord pour acqu\u00e9rir 100 % du capital de Ramo Pharm, annonc\u00e9 ce mercredi 28. [telquel.ma]\n-------------------------------------------------\nLe groupe pharmaceutique marocain Sothema a annonc\u00e9, ce 28 octobre, la signature d\u2019un accord visant l\u2019acquisition de 100 % du capital de Ramo Pharm, entreprise sp\u00e9cialis\u00e9e dans les compl\u00e9ments alimentaires. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Bourse de Casablanca a\nannonc\u00e9, mercredi, le lancement de...", "mass": 5, "physics": false, "shape": "box", "title": "La Bourse de Casablanca a annonc\u00e9, mercredi, le lancement de deux nouveaux indices boursiers, le MASI.20 Rentabilit\u00e9 Brut et le MASI.20 Rentabilit\u00e9 Net, visant \u00e0 offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les dividendes, ces indicateurs doivent offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLa Bourse de Casablanca pr\u00e9voit de lancer, dans les prochains jours, deux nouveaux indices baptis\u00e9s \u00ab MASI Rentabilit\u00e9 Brut \u00bb et \u00ab MASI Rentabilit\u00e9 Net \u00bb. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La production pr\u00e9visionnelle des dattes\ndevrait atteindre environ 180.000 tonnes...", "mass": 5, "physics": false, "shape": "box", "title": "La production pr\u00e9visionnelle des dattes devrait atteindre environ 180.000 tonnes au titre de la campagne agricole 2026-2027, a fait savoir, mercredi \u00e0 Erfoud (province d\u2019Errachidia), le ministre de l\u2019Agriculture, de la P\u00eache maritime et de la Souverainet\u00e9 Alimentaire, Khalid Hatimy. [telquel.ma]\n-------------------------------------------------\nLa production nationale de dattes devrait atteindre environ 180 000 tonnes lors de la campagne agricole 2026-2027, tandis que la consommation annuelle varie entre 220 000 et 250 000 tonnes, a annonc\u00e9 mercredi \u00e0 Erfoud le ministre de l\u2019Agriculture, de la P\u00eache maritime et de la Souverainet\u00e9 alimentaire, Khalid Hatimi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La cheffe du gouvernement, Fatima\nEzzahra El Mansouri, qui repr\u00e9sente...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le roi Mohammed VI au troisi\u00e8me Sommet Russie-Afrique, a pris part, mercredi soir au Kremlin, \u00e0 la r\u00e9ception solennelle offerte par le pr\u00e9sident russe Vladimir Poutine en l\u2019honneur des chefs d\u2019\u00c9tat, de gouvernement et des d\u00e9l\u00e9gations participants. [telquel.ma]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, est arriv\u00e9e mercredi dans la capitale russe pour repr\u00e9senter Sa Majest\u00e9 le Roi Mohammed VI aux travaux du troisi\u00e8me Sommet Russie-Afrique. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, est arriv\u00e9e, ce mercredi \u00e0 Moscou, pour repr\u00e9senter le Roi Mohammed VI au troisi\u00e8me Sommet Russie-Afrique. [leseco.ma]\n-------------------------------------------------\nLes travaux du 3e Sommet et forum \u00e9conomique Russie-Afrique se sont ouverts, ce m\u00eame jour dans la capitale russe, avec la participation de repr\u00e9sentants des pays africains membres de [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le ministre de l\u2019Int\u00e9rieur a\ntenu, mercredi \u00e0 Rabat, une...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur a tenu, mercredi \u00e0 Rabat, une r\u00e9union avec les dirigeants et responsables des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaire, et ce dans le cadre des pr\u00e9paratifs des \u00e9ch\u00e9ances \u00e9lectorales pr\u00e9vues en 2027 pour le renouvellement des instances \u00e9lues nationales, locales et professionnelles, y compris les conseils communaux et. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur a r\u00e9uni, mercredi, les dirigeants des partis disposant d\u2019un groupe parlementaire pour lancer les pr\u00e9paratifs des \u00e9lections de 2027. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur a tenu, mercredi \u00e0 Rabat, une r\u00e9union avec les dirigeants et responsables des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaire, et ce dans le cadre des pr\u00e9paratifs des \u00e9ch\u00e9ances \u00e9lectorales pr\u00e9vues en 2027 pour le renouvellement des instances \u00e9lues nationales, locales et professionnelles, y compris les conseils communaux et . [aujourdhui.ma]\n-------------------------------------------------\nLes discussions ont notamment port\u00e9 su         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
