gal lors de la finale de la CAN Maroc 2025. [leseco.ma]\n-------------------------------------------------\nLe Jury d\u0027Appel de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) a act\u00e9 le forfait du S\u00e9n\u00e9gal au profit du Maroc pour la finale de la CAN 2025, une d\u00e9cision aux cons\u00e9quences juridiques et institutionnelles majeures pour le football africain. [atlasinfo.fr]\n-------------------------------------------------\nLe jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9, mardi 17 mars, d\u2019annuler le r\u00e9sultat initial de la finale remport\u00e9e sur le terrain par le S\u00e9n\u00e9gal et de d\u00e9clarer le Maroc vainqueur de la comp\u00e9tition. [lnt.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF) a salu\u00e9, mercredi, la d\u00e9cision rendue par le Jury d\u2019Appel de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) sur la finale de la Coupe d\u2019Afrique entre le Maroc et le S\u00e9n\u00e9gal, notant que ce verdict va dans le sens du respect des r\u00e8gles et de la stabilit\u00e9 n\u00e9cessaire \u00e0 . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Face \u00e0 la flamb\u00e9e du\ncours du p\u00e9trole sur les...", "mass": 5, "physics": false, "shape": "box", "title": "Face \u00e0 la flamb\u00e9e du cours du p\u00e9trole sur les march\u00e9s internationaux et leur impact sur les prix des hydrocarbures au niveau national, le gouvernement met en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration qui avait \u00e9t\u00e9 mise en place. [telquel.ma]\n-------------------------------------------------\nLes professionnels du transport routier de marchandises et de personnes peuvent d\u00e9poser \u00e0 partir du vendredi 20 mars leurs demandes pour b\u00e9n\u00e9ficier du soutien exceptionnel mis en place ce jour par le gouvernement, compte tenu de la forte hausse des prix du p\u00e9trole sur les march\u00e9s internationaux et de son impact sur les prix des carburants \u00e0 l\u0027\u00e9chelle nationale, a annonc\u00e9 mardi le minist\u00e8re du Transport et de la Logistique. [leseco.ma]\n-------------------------------------------------\nLe gouvernement a d\u00e9cid\u00e9 de mettre en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration initi\u00e9e en mars 2022. [www.lereporter.ma]\n-------------------------------------------------\nLe gouvernement a annonc\u00e9 la mise en place d\u2019une nouvelle op\u00e9ration d\u2019aide exceptionnelle destin\u00e9e aux professionnels du transport de marchandises et de personnes, dans un contexte marqu\u00e9 par la hausse des prix des hydrocarbures sur les march\u00e9s internationaux et ses r\u00e9percussions au niveau national. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans ce sens, elle propose\n\u00abun film immersif et un...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce sens, elle propose \u00abun film immersif et un dispositif m\u00e9dia 360\u00b0\u00bb, pour mettre en lumi\u00e8re \u00abla richesse des paysages et des exp\u00e9riences outdoor au Maroc, tout en incitant les Marocains \u00e0 passer de l\u2019inspiration \u00e0 l\u2019action\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) d\u00e9ploie, \u00e0 l\u2019approche du printemps, une nouvelle vague de sa campagne \"Ntla9awfbladna\", d\u00e9di\u00e9e \u00e0 la nature et \u00e0     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
