9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [fr.hespress.com]\n-------------------------------------------------\nLe chef du gouvernement, M. Aziz Akhannouch, a pris part, lundi \u00e0 Nairobi, \u00e0 la c\u00e9r\u00e9monie de cl\u00f4ture du forum d\u2019affaires \u201cAfrica Forward : Inspire \u0026 Connect\u201d, co-pr\u00e9sid\u00e9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [atlasinfo.fr]\n-------------------------------------------------\nLe Chef du gouvernement, M. Aziz Akhannouch, a pris part, lundi \u00e0 Nairobi, \u00e0 la c\u00e9r\u00e9monie de cl\u00f4ture du forum d\u2019affaires \u00ab Africa Forward : Inspire \u0026 Connect \u00bb, co-pr\u00e9sid\u00e9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [aujourdhui.ma]\n-------------------------------------------------\nLe Chef du gouvernement a pris part, lundi au Palais d\u0027\u00c9tat, au d\u00eener offert par le pr\u00e9sident k\u00e9nyan, William Ruto en l\u2019honneur des chefs d\u2019Etat et de gouvernement participant au sommet \"Africa Forward\" \u00e0 Nairobi. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 trois jours de l\u2019\u00e9lection\n\u00e0 la t\u00eate de la...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 trois jours de l\u2019\u00e9lection \u00e0 la t\u00eate de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), le bin\u00f4me candidat, Mehdi Tazi et Mohamed Bachiri, a d\u00e9voil\u00e9, le 11 mai \u00e0 Casabl. [lematin.ma]\n-------------------------------------------------\n\u00c0 trois jours de l\u2019assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective pr\u00e9vue le 14 mai, le bin\u00f4me compos\u00e9 de Mehdi Tazi et Mohamed Bachiri a d\u00e9voil\u00e9, ce lundi 11 mai, les grandes lignes de son programme pour la mandature 2026-2029 \u00e0 la t\u00eate de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM). [telquel.ma]\n-------------------------------------------------\nLe bin\u00f4me candidat \u00e0 la pr\u00e9sidence de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc a pr\u00e9sent\u00e9, ce lundi, un programme articul\u00e9 autour de cinq axes. [www.lavieeco.com]\n-------------------------------------------------\nC\u2019est aujourd\u2019hui que Mehdi Tazi et Mohamed Bachiri, candidats \u00e0 la pr\u00e9sidence et \u00e0 la vice-pr\u00e9sidence g\u00e9n\u00e9rale de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) pour le mandat 2026-2029, pr\u00e9sentent leur feuille de route \u00e0 la presse. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Quelque 502.000 personnes, tous \u00e2ges\nconfondus, ont visit\u00e9 le 31e...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [telquel.ma]\n-------------------------------------------------\nQuelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a fait savoir le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La troisi\u00e8me \u00e9dition du classement\nTop School in Morocco a...", "mass": 5, "physics": false, "shape": "box", "title": "La troisi\u00e8me \u00e9dition du classement Top School in Morocco a d\u00e9voil\u00e9 cette semaine ses r\u00e9sultats \u00e0 Casablanca, en marge du salon Master Plus organis\u00e9 \u00e0 l\u2019\u00c9cole Centrale Casablanca. [telquel.ma]\n-------------------------------------------------\nLa troisi\u00e8me \u00e9dition du classement Top School in Morocco a d\u00e9voil\u00e9 cette semaine ses r\u00e9sultats \u00e0 Casablanca, en marge du salon MASTER PLUS organis\u00e9 \u00e0 l\u2019\u00c9cole Centrale Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Les op\u00e9rations de recherche intensives\nmen\u00e9es par les Forces arm\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "Les op\u00e9rations de recherche intensives men\u00e9es par les Forces arm\u00e9es royales (FAR) conjointement avec les Forces am\u00e9ricaines ont permis de retrouver et rep\u00eacher, samedi 9 mai, l\u2019un des deux soldats am\u00e9ricains qui participaient \u00e0 l\u2019exercice African Lion 2026, port\u00e9s disparus depuis le 2 mai au niveau d\u2019une falaise \u00e0 Cap Draa. [telquel.ma]\n-------------------------------------------------\nLes op\u00e9rations de recherche men\u00e9es conjointement par les Forces Arm\u00e9es Royales (FAR) et les forces am\u00e9ricaines ont permis de retrouver la d\u00e9pouille de l\u2019un des deux militaires am\u00e9ricains port\u00e9s disparus depuis le 2 mai au niveau d\u2019une falaise \u00e0 Cap Draa, alors qu\u2019ils participaient \u00e0 l\u2019exercice multinational African Lion 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019ambassadeur du Maroc \u00e0 P\u00e9kin,\nAbdelkader El Ansari, a pr\u00e9sent\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur du Maroc \u00e0 P\u00e9kin, Abdelkader El Ansari, a pr\u00e9sent\u00     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
