"y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Les autorit\u00e9s locales de la\npr\u00e9fecture de la province de...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s locales de la pr\u00e9fecture de la province de Sidi Slimane ont annonc\u00e9 l\u2019\u00e9laboration d\u2019un plan op\u00e9rationnel et logistique int\u00e9gr\u00e9 visant \u00e0 assurer le retour progressif, organis\u00e9 et s\u00e9curis\u00e9 des citoyens \u00e9vacu\u00e9s en raison des perturbations climatiques exceptionnelles ayant affect\u00e9 la r\u00e9gion. [fr.hespress.com]\n-------------------------------------------------\nDans le cadre des mesures mises en \u0153uvre pour assurer le retour s\u00fbr et organis\u00e9 des r\u00e9sidents \u00e9vacu\u00e9s suite aux r\u00e9centes intemp\u00e9ries exceptionnelles, les autorit\u00e9s locales de Sidi Slimane annoncent l\u2019\u00e9laboration d\u2019un plan op\u00e9rationnel et logistique complet. [telquel.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Larache ont annonc\u00e9, samedi, l\u2019\u00e9laboration d\u2019un plan op\u00e9rationnel int\u00e9gr\u00e9 visant \u00e0 assurer le retour organis\u00e9, s\u00e9curis\u00e9 et progressif des citoyens \u00e9vacu\u00e9s temporairement en raison des conditions climatiques exceptionnelles qu\u2019a connues la province. [aujourdhui.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Larache ont annonc\u00e9, ce samedi, l\u2019\u00e9laboration d\u2019un plan op\u00e9rationnel int\u00e9gr\u00e9 visant \u00e0 assurer le retour organis\u00e9, s\u00e9curis\u00e9 et progressif des citoyens \u00e9vacu\u00e9s temporairement en raison des conditions climatiques exceptionnelles qu\u2019a connues la province. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color":         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
