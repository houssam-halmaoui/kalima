 2026 dans la circonscription \u00e9lectorale de Tanger-Assilah. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour faire la lumi\u00e8re sur les irr\u00e9gularit\u00e9s relev\u00e9es dans deux bureaux de vote lors des l\u00e9gislatives du 23 septembre. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour enqu\u00eater sur des irr\u00e9gularit\u00e9s ayant entach\u00e9 le scrutin dans deux bureaux de vote de la circonscription Tanger-Assilah lors des l\u00e9gislatives du 23 septembre. [leseco.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection dans la ville de Tanger \u00e0 la suite des irr\u00e9gularit\u00e9s ayant entach\u00e9 l\u2019op\u00e9ration \u00e9lectorale dans deux bureaux de vote, \u00e0 l\u2019occasion des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription \u00e9lectorale de Tanger-Assilah. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Des m\u00e8res se sont rassembl\u00e9es\nsamedi devant le Parlement \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Des m\u00e8res se sont rassembl\u00e9es samedi devant le Parlement \u00e0 Rabat pour r\u00e9clamer la lib\u00e9ration de leurs fils, parfois mineurs, emprisonn\u00e9s apr\u00e8s des violences en marge des manifestations du mouvement GenZ 212 il y a un an. [telquel.ma]\n-------------------------------------------------\nUn rassemblement s\u2019est tenu samedi devant le Parlement \u00e0 Rabat pour r\u00e9clamer la lib\u00e9ration de jeunes incarc\u00e9r\u00e9s \u00e0 la suite des manifestations de l\u2019automne 2025, un an apr\u00e8s le d\u00e9but du mouvement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Conseil national du Parti\nde la Justice et du...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil national du Parti de la Justice et du D\u00e9veloppement (PJD) a d\u00e9cid\u00e9, \u00e0 l\u2019unanimit\u00e9, samedi \u00e0 Bouznika, de se maintenir dans l\u2019opposition parlementaire et de ne pas participer au prochain gouvernement. [telquel.ma]\n-------------------------------------------------\nArriv\u00e9 en quatri\u00e8me position aux \u00e9lections l\u00e9gislatives du 23 septembre avec 54 si\u00e8ges, le Parti de la Justice et du D\u00e9veloppement (PJD) a d\u00e9cid\u00e9 de ne pas participer au prochain gouvernement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La filiale de Volkswagen, PowerCo,\nsp\u00e9cialis\u00e9e dans les batteries, envisage...", "mass": 5, "physics": false, "shape": "box", "title": "La filiale de Volkswagen, PowerCo, sp\u00e9cialis\u00e9e dans les batteries, envisage d\u00e9tablir une nouvelle usine de mat\u00e9riaux pour batteries \u00e0 K\u00e9nitra, en collaboration avec le groupe chinois Gotion, rapporte Reuters. [www.yabiladi.com]\n-------------------------------------------------\nCe lundi 28 septembre, les groupes chinois Gotion et allemand Volkswagen ont annonc\u00e9 renforcer leur partenariat, notamment avec la cr\u00e9ation d\u2019une usine de production de cathodes LFP \u00e0 K\u00e9nitra. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Royaume prend part aux\nsessions de l\u2019Assembl\u00e9e Parlementaire du...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume prend part aux sessions de l\u2019Assembl\u00e9e Parlementaire du Conseil de l\u2019Europe en sa qualit\u00e9 de Partenaire pour la d\u00e9mocratie au Conseil de l\u2019Europe, un statut dont il jouit depuis 2011. [www.lavieeco.com]\n-------------------------------------------------\nUne d\u00e9l\u00e9gation parlementaire marocaine prend part \u00e0 la session d\u2019automne de l\u2019Assembl\u00e9e parlementaire du Conseil de l\u2019Europe (APCE), organis\u00e9e ce lundi \u00e0 Strasbourg. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Je serai de retour \u00e0\nT\u00e9h\u00e9ran dans quelques heures et...", "mass": 5, "physics": false, "shape": "box", "title": "Je serai de retour \u00e0 T\u00e9h\u00e9ran dans quelques heures et nous esp\u00e9rons recevoir une r\u00e9ponse d\u00e9finitive de la partie am\u00e9ricaine \u00bb, a d\u00e9clar\u00e9 le ministre iranien des Affaires \u00e9trang\u00e8res, Abbas Araghchi, au terme de son s\u00e9jour \u00e0 New York, o\u00f9 il a particip\u00e9 \u00e0 la semaine de haut niveau de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019ONU. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre iranien des Affaires \u00e9trang\u00e8res a indiqu\u00e9 lundi soir esp\u00e9rer une position officielle de Washington dans la journ\u00e9e de mardi, au terme de discussions indirectes conduites par la m\u00e9diation qatarie en marge de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Roi Mohammed VI, que\nDieu L\u2019assiste, a re\u00e7u, mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u, mardi au Palais Royal \u00e0 Rabat, Fatima Zahra Mansouri, coordinatrice de asse au\n54e rang mondial dans l\u2019\u00e9dition...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc se classe au 54e rang mondial dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation, publi\u00e9e mardi par l\u2019Organisation Mondiale de la Propri\u00e9t\u00e9 Intellectuelle (OMPI) \u00e0 Ge. [lematin.ma]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [telquel.ma]\n-------------------------------------------------\nLe Maroc a progress\u00e9 de trois places pour atteindre le 54e rang parmi 139 pays dans le Global Innovation Index 2026, d\u00e9voil\u00e9 mardi par l\u2019Organisation mondiale de la propri\u00e9t\u00e9 intellectuelle (OMPI). [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [leseco.ma]\n-------------------------------------------------\nLe Maroc progresse de trois positions dans l\u2019Indice mondial de l\u2019innovation 2026 et se classe d\u00e9sormais 54e, son meilleur niveau depuis la cr\u00e9ation de cet indicateur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le minist\u00e8re de la Transition\nnum\u00e9rique et de la R\u00e9forme...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
