ns la circonscription de Berkane, le membre du bureau politique du Parti authenticit\u00e9 et modernit\u00e9 (PAM) a finalement tranch\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc a import\u00e9 un\nvolume record de pommes de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a import\u00e9 un volume record de pommes de terre de consommation fra\u00eeches au cours de la campagne de commercialisation 2025/2026, apr\u00e8s les inondations qui ont endommag\u00e9 la production nationale et contraint le pays \u00e0 se tourner vers des fournisseurs europ\u00e9ens, selon EastFruit. [www.yabiladi.com]\n-------------------------------------------------\nLe march\u00e9 marocain de la pomme de terre de consommation a connu d\u2019importantes perturbations durant la campagne 2025-2026, contraignant le pays \u00e0 recourir \u00e0 des importations records pour combler les p\u00e9nuries nationales. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Diplomatie parall\u00e8le Dans le cadre\nde ses initiatives en faveur...", "mass": 5, "physics": false, "shape": "box", "title": "Diplomatie parall\u00e8le Dans le cadre de ses initiatives en faveur du dialogue, de l\u2019\u00e9change et de la coop\u00e9ration entre les peuples, l\u2019Association For Morocco a tenu, jeudi 27 ao\u00fbt 2026 \u00e0 Casablanca, la deuxi\u00e8me \u00e9dition de sa \u00abJourn\u00e9e Diplomatique\u00bb, un rendez-vous mensuel d\u00e9di\u00e9 \u00e0 la d\u00e9couverte des pays amis du Maroc et au renforcement des . [aujourdhui.ma]\n-------------------------------------------------\nL\u2019Association For Morocco poursuit ses initiatives mensuelles destin\u00e9es \u00e0 favoriser le dialogue, l\u2019\u00e9change et la connaissance mutuelle entre les peuples. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le cr\u00e9dit bancaire au secteur\nnon financier a progress\u00e9 de...", "mass": 5, "physics": false, "shape": "box", "title": "Le cr\u00e9dit bancaire au secteur non financier a progress\u00e9 de 10,1% en juillet 2026, apr\u00e8s une hausse de 9,8% en juin, selon Bank Al-Maghrib (BAM). [www.lavieeco.com]\n-------------------------------------------------\nLa masse mon\u00e9taire (agr\u00e9gat M3) s\u0027est \u00e9tablie \u00e0 2.195 milliards de dirhams en juillet 2026, enregistrant un accroissement annuel de 11,2%, apr\u00e8s 11,7% le mois pr\u00e9c\u00e9dent, selon Bank Al-Maghrib (BAM). [leseco.ma]\n-------------------------------------------------\nLe cr\u00e9dit bancaire au secteur non financier a affich\u00e9 une croissance de 10,1% en juillet 2026, apr\u00e8s 9,8% un mois auparavant, ressort-il du r\u00e9cent bulletin des statistiques mon\u00e9tai. [lematin.ma]\n-------------------------------------------------\nLe cr\u00e9dit bancaire au secteur non financier a affich\u00e9 une croissance de 10,1% en juillet 2026, apr\u00e8s 9,8% un mois auparavant, ressort-il du r\u00e9cent bulletin des statistiques mon\u00e9taires de Bank Al-Maghrib (BAM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La p\u00e9riode de d\u00e9p\u00f4t des\nd\u00e9clarations de candidature aux \u00e9lections...", "mass": 5, "physics": false, "shape": "box", "title": "La p\u00e9riode de d\u00e9p\u00f4t des d\u00e9clarations de candidature aux \u00e9lections des membres de la Chambre des repr\u00e9sentants, pr\u00e9vues le mercredi 23 septembre, d\u00e9butera lundi 31 ao\u00fbt \u00e0 8h00 et se poursuivra jusqu\u0027au mercredi 9 septembre \u00e0 midi. [www.lavieeco.com]\n-------------------------------------------------\nLa p\u00e9riode de d\u00e9p\u00f4t des d\u00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];

                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
