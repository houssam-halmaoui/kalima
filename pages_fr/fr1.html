ranchit une nouvelle \u00e9tape dans la construction d\u2019une industrie nationale de d\u00e9fense et de s\u00e9curit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le ministre de l\u2019Intelligence artificielle,\nde la Transformation num\u00e9rique et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Intelligence artificielle, de la Transformation num\u00e9rique et de la R\u00e9forme de l\u2019Administration, Ahmed Rahhou, a re\u00e7u, jeudi \u00e0 Rabat, une d\u00e9l\u00e9gation du groupe Oracl. [lematin.ma]\n-------------------------------------------------\nLe ministre de l\u2019Intelligence artificielle, de la Transformation num\u00e9rique et de la R\u00e9forme de l\u2019Administration, Ahmed Rahhou, a re\u00e7u jeudi \u00e0 Rabat une d\u00e9l\u00e9gation du groupe Oracle conduite par Andres Garcia, vice-pr\u00e9sident Cloud Africa. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les prix \u00e0 la consommation\nont enregistr\u00e9 une hausse de...", "mass": 5, "physics": false, "shape": "box", "title": "Les prix \u00e0 la consommation ont enregistr\u00e9 une hausse de 0,8% en octobre 2026 par rapport au mois pr\u00e9c\u00e9dent, selon les donn\u00e9es du Haut-Commissariat au Plan (HCP). [lematin.ma]\n-------------------------------------------------\nL\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en octobre 2026, une hausse de 1,9% par rapport au m\u00eame mois de l\u2019ann\u00e9e \u00e9coul\u00e9e, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nAu Maroc, l\u2019indice des prix \u00e0 la consommation (IPC) a progress\u00e9 de 1,9% en octobre 2026 par rapport \u00e0 octobre 2025, selon une note du Haut-Commissariat au Plan (HCP). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Encore peu connue du grand\npublic, la s\u00e9lection marocaine de...", "mass": 5, "physics": false, "shape": "box", "title": "Encore peu connue du grand public, la s\u00e9lection marocaine de football pour amput\u00e9s r\u00e9alise un parcours historique \u00e0 la Coupe du monde 2026 au Mexique. [telquel.ma]\n-------------------------------------------------\nOppos\u00e9s \u00e0 l\u2019Angola en quart de finale, les joueurs dirig\u00e9s par Othman El Najmi se sont impos\u00e9s sur le score de 4 buts \u00e0 1, au terme d\u2019une rencontre qui s\u2019est prolong\u00e9e au-del\u00e0 du temps r\u00e9glementaire. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Il s\u2019agit du projet de\nd\u00e9cret n\u00b0 2.26.705 modifiant et...", "mass": 5, "physics": false, "shape": "box", "title": "Il s\u2019agit du projet de d\u00e9cret n\u00b0 2.26.705 modifiant et compl\u00e9tant les d\u00e9crets relatifs aux statuts des corps des enseignants-chercheurs, a indiqu\u00e9 le ministre de l\u2019Am\u00e9nagement du Territoire national, de. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui, a \u00e9cart\u00e9 toute int\u00e9gration directe dans l\u2019universit\u00e9 publique des titulaires d\u2019un doctorat exer\u00e7ant dans le secteur priv\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Avec la Haute approbation du\nroi Mohammed VI, Amir Al...", "mass": 5, "physics": false, "shape": "box", "title": "Avec la Haute approbation du roi Mohammed VI, Amir Al Mouminine, pr\u00e9sident de la Fondation Mohamm                             id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
