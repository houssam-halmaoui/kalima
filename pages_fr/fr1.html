dollars le montant de son soutien financier annuel accord\u00e9 aux associations membres. [fr.hespress.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a port\u00e9 de 200.000 \u00e0 700.000 dollars le montant de son soutien financier annuel accord\u00e9 aux associations membres, a annonc\u00e9 le pr\u00e9sident de l\u2019instance continentale, Patrice Motsepe. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a augment\u00e9 son soutien financier annuel accord\u00e9 aux associations membres, le montant passant de 200 000 \u00e0 700 000 dollars, a annonc\u00e9 le pr\u00e9sident de l\u2019instance, Patrice Motsepe. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le classement 2026 d\u2019African Business\nmet en lumi\u00e8re ce mod\u00e8le...", "mass": 5, "physics": false, "shape": "box", "title": "Le classement 2026 d\u2019African Business met en lumi\u00e8re ce mod\u00e8le : trois groupes dans le Top 10, port\u00e9s par des fonds propres Tier 1 en hausse d\u2019environ 15%. [fr.hespress.com]\n-------------------------------------------------\nAvec trois \u00e9tablissements dans le Top 10 africain et neuf banques class\u00e9es parmi les 100 premi\u00e8res du continent, les groupes bancaires marocains confirment leur mont\u00e9e en puissance. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Sa Majest\u00e9 le Roi Mohammed\nVI pr\u00e9side l\u0027ouverture de la...", "mass": 5, "physics": false, "shape": "box", "title": "Sa Majest\u00e9 le Roi Mohammed VI pr\u00e9side l\u0027ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI pr\u00e9sidera, vendredi, l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature, annonce le minist\u00e8re de la Maison royale, du Protocole et de la Chancellerie dans un communiqu\u00e9, dont voici la traduction : Le minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie annonce que. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a pr\u00e9sid\u00e9, vendredi \u00e0 Rabat, l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [www.lavieeco.com]\n-------------------------------------------------\nLe Roi Mohammed VI pr\u00e9sidera vendredi 9 octobre 2026 (27 Rabii II 1448 de l\u2019H\u00e9gire) l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature, au si\u00e8ge du Parlement. [atlasinfo.fr]\n-------------------------------------------------\nSM le Roi Mohammed VI pr\u00e9side ce vendredi au si\u00e8ge du Parlement l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la douzi\u00e8me l\u00e9gislature, et prononcera un discours devant les membres des deux chambres, diffus\u00e9 \u00e0 partir de 15h45. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Casablanca accueille, depuis jeudi, la\ncinqui\u00e8me \u00e9dition d\u2019Africa Sports Expo,...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca accueille, depuis jeudi, la cinqui\u00e8me \u00e9dition d\u2019Africa Sports Expo, un \u00e9v\u00e9nement qui rassemble les principaux acteurs de l\u2019\u00e9cosyst\u00e8me sportif marocain et africain. [lematin.ma]\n-------------------------------------------------\nOuverte jeudi 8 octobre \u00e0 l\u2019OFEC, la cinqui\u00e8me \u00e9dition d\u2019Africa Sports Expo r\u00e9unit les professionnels autour des infrastructures, de la formation et des march\u00e9s africains. [leseco.ma]\n-------------------------------------------------\nJusqu\u2019au 11 octobre, l\u2019\u00e9v\u00e9nement r\u00e9unit des repr\u00e9sentants institutionnels, des acteurs \u00e9conomiques, des experts et des professionnels autour des enjeux li\u00e9s au d\u00e9veloppement de l\u2019industrie sportive au Maroc et en Afrique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Des averses orageuses (20 \u00e0\n30 mm) sont pr\u00e9vues vendredi...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses (20 \u00e0 30 mm) sont pr\u00e9vues vendredi de 9H00 \u00e0 16H00 dans les provinces d\u0027Errachidia, Midelt, Boulemane, Guercif, Figuig et Taourirt, a pr\u00e9cis\u00e9 la DGM dans. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec gr\u00eale et rafale de vent sous orages sont attendues, vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Un projet de t\u00e9l\u00e9ph\u00e9rique touristique\navec vue panoramique sur la...", "mass": 5, "physics": false, "shape": "box", "title": "Un projet de t\u00e9l\u00e9ph\u00e9rique touristique avec vue panoramique sur la M\u00e9dina de F\u00e8s se dessine. [lematin.ma]\n-------------------------------------------------\nLa ville de F\u00e8s sera prochainement dot\u00e9e d\u2019un t\u00e9l\u00e9ph\u00e9rique touristique et de mobilit\u00e9 compl\u00e9mentaire, destin\u00e9 notamment \u00e0 offrir une nouvelle exp\u00e9rience panoramique sur la M\u00e9dina, am\u00e9liorer l\u2019accessibilit\u00e9 de ses p\u00f4les patrimoniaux en hauteur et contribuer \u00e0 la diversification des parcours touristiques. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Airbus entend poursuivre son ancrage\nindustriel et sa coop\u00e9ration avec...", "mass": 5, "physics": false, "shape": "box", "title": "Airbus entend poursuivre son ancrage industriel et sa coop\u00e9ration avec le Maroc, en s\u2019appuyant notamment sur le d\u00e9veloppement de la recherche, de la technologie et des capacit\u00e9s de la cha\u00eene d\u2019approvisionnement, a affirm\u00e9 le pr\u00e9sident d\u2019Airbus pour l\u2019Afrique et le Moyen-Orient, Gabriel Semelas. [telquel.ma]\n-------------------------------------------------\nLa prochaine \u00e9tape de la coop\u00e9ration entre Airbus et le Maroc r\u00e9side notamment dans le renforcement des capacit\u00e9s technologiques et de recherche au Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Bank Al-Maghrib (BAM) a annonc\u00e9,\nvendredi, la publication de deux...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) a annonc\u00e9, vendredi, la publication de deux nouveaux documents de travail, en fran\u00e7ais et en anglais, sur son portail, dans la rubrique \u00ab Publications et recherche \u00bb. [telquel.ma]\n-------------------------------------------------\nCes publications visent \u00e0 partager, avec la communaut\u00e9 scientifique et le grand public, les r\u00e9sultats des travaux men\u00e9s par les chercheurs de Bank Al-Maghrib. [www.lavieeco.com]\n-------------------------------------------------\nBank Al-Maghrib (BAM) a annonc\u00e9, vendredi, la publication de deux nouveaux documents de travail, en fran\u00e7ais et en anglais, sur son portail, dans la rubrique \u00ab Publications et recherche \u00bb. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Un choix d\u2019organisation qui en\ndit long sur les ambitions...", "mass": 5, "physics": false, "shape": "box", "title": "Un choix d\u2019organisation qui en dit long sur les ambitions affich\u00e9es du groupe. [telquel.ma]\n-------------------------------------------------\nDans le cadre de sa strat\u00e9gie de d\u00e9veloppement et de diversification de ses activit\u00e9s, Oncorad Group annonce la cr\u00e9ation d\u0027une Direction des Affaires M\u00e9dicales (Chief Medical Affairs Office), une fonction strat\u00e9gique directement rattach\u00e9e \u00e0 la Pr\u00e9sidence du Groupe. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le pr\u00e9sident de la F\u00e9d\u00e9ration\nroyale marocaine de football (FRMF)...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) et premier vice-pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Fouzi Lekjaa, a pris part, jeudi au Cap-Vert, \u00e0 la Conf\u00e9rence strat\u00e9gique de la CAF, qui se tient du 7 au 9 octobre dans ce pays ouest-africain. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la FRMF et premier vice-pr\u00e9sident de la CAF prend part \u00e0 ce rendez-vous, qui se tient du 7 au 9 octobre et r\u00e9unit les 54 f\u00e9d\u00e9rations membres autour d\u0027une feuille de route pour le football du continent. [www.lavieeco.com]\n-------------------------------------------------\nLe pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) et premier vice-pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Fouzi Lekjaa, a pris part, jeudi au Cap-Vert, \u00e0 la Conf\u00e9rence strat\u00e9gique         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                const scrollDown = document.createElement('div');

                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
