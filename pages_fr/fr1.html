41 ans a d\u00e9cid\u00e9 de mettre un terme \u00e0 sa carri\u00e8re internationale et de raccrocher le brassard de capitaine. [fr.hespress.com]\n-------------------------------------------------\nDepuis ses d\u00e9buts en 2003, l\u2019attaquant portugais a disput\u00e9 234 rencontres et inscrit 146 buts sous le maillot national, selon le bilan pr\u00e9sent\u00e9 \u00e0 l\u2019occasion de son annonce. \u00ab [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Mohamed Ouahbi a d\u00e9voil\u00e9 sa\nliste pour les deux matchs...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ouahbi a d\u00e9voil\u00e9 sa liste pour les deux matchs face au Niger, les 13 et 17 novembre 2026, dans le cadre des \u00e9liminatoires de la CAN 2027. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Mohamed Ouahbi, a d\u00e9voil\u00e9, mercredi \u00e0 Sal\u00e9, la liste des 26 joueurs qui vont disputer les deux matchs face au Niger, comptant pour les 3\u00e8 et 4\u00e8 journ\u00e9es des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations 2027. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national Mohamed Ouahbi a d\u00e9voil\u00e9, mercredi \u00e0 Sal\u00e9, une liste de 26 joueurs pour les deux rencontres face au Niger, comptant pour les 3e et 4e journ\u00e9es des \u00e9liminatoires de la CAN 2027. [www.lavieeco.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Mohamed Ouahbi, a d\u00e9voil\u00e9 mercredi \u00e0 Sal\u00e9 sa liste de 26 joueurs retenus pour les deux prochaines rencontres face au Niger. [leseco.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Mohamed Ouahbi, a d\u00e9voil\u00e9, mercredi \u00e0 Sal\u00e9, la liste des 26 joueurs qui vont disputer les deux matchs face au Niger, comptant pour les 3\u00e8 et 4\u00e8 journ\u00e9es des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations 2026. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Sa Majest\u00e9 le Roi Mohammed\nVI a pr\u00e9sid\u00e9, ce mercredi...", "mass": 5, "physics": false, "shape": "box", "title": "Sa Majest\u00e9 le Roi Mohammed VI a pr\u00e9sid\u00e9, ce mercredi 4 novembre au Palais Royal de Rabat, une s\u00e9ance de travail consacr\u00e9e au suivi de l\u2019\u00e9tape suivant la fin du mandat de la MINURSO. [lematin.ma]\n-------------------------------------------------\nVoici l\u2019int\u00e9gralit\u00e9 du communiqu\u00e9 du Cabinet royal : \u00ab Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a pr\u00e9sid\u00e9, ce jour 04 novembre 2026. [telquel.ma]\n-------------------------------------------------\nCommuniqu\u00e9 du Cabinet Royal : \u00ab Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a pr\u00e9sid\u00e9, ce jour 04 novembre 2026 au Palais Royal de Rabat, une s\u00e9ance de travail consacr\u00e9e au suivi de l\u2019\u00e9tape \u00e0 venir apr\u00e8s la fin des t\u00e2ches de la mission des Nations Unies, \u00e0 la suite de la non-reconduction de [www.lereporter.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a pr\u00e9sid\u00e9, mercredi 4 novembre au Palais Royal de Rabat, une s\u00e9ance de travail consacr\u00e9e aux prochaines \u00e9tapes suivant la fin du mandat de la Mission des Nations Unies pour l\u2019organisation d\u2019un r\u00e9f\u00e9rendum au Sahara occidental (MINURSO). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Fonds Mohammed VI pour\nl\u2019Investissement (FM6I) dresse un premier...", "mass": 5, "physics": false, "shape": "box", "title": "Le Fonds Mohammed VI pour l\u2019Investissement (FM6I) dresse un premier bilan de ses interventions \u00e0 travers la publication de son rapport d\u2019impact au titre de l\u2019exercice 2025. [lematin.ma]\n-------------------------------------------------\nLe Fonds Mohammed VI pour l\u2019Investissement (FM6I) a engag\u00e9 7,2 milliards de dirhams (MMDH) de fonds propres \u00e0 fin 2025, selon son premier Rapport d\u2019impact publi\u00e9 au titre de l\u2019exercice 2025. [telquel.ma]\n-------------------------------------------------\nLe Fonds Mohammed VI pour l\u2019Investissement a engag\u00e9 sept milliards deux cents millions de dirhams de fonds propres \u00e0 fin 2025, toutes activit\u00e9s confondues, selon son premier rapport d\u2019impact, \u00e9tabli selon les standards de la Global Reporting Initiative et portant sur l\u2019exercice 2025. [lnt.ma]\n-------------------------------------------------\nLe Fonds Mohammed VI pour l\u2019Investissement dresse le bilan de ses interventions dans son premier rapport d\u2019impact. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le g\u00e9ant de la recherche\nen ligne Google a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9ant de la recherche en ligne Google a annonc\u00e9 cette semaine qu\u2019il n\u2019activerait plus par d\u00e9faut son assistant d\u2019intelligence artificielle Gemini pour les \u00e9l\u00e8ves, apr\u00e8s plusieurs mois de critiques de parents, d\u2019\u00e9coles et d\u2019\u00e9lus. [telquel.ma]\n-------------------------------------------------\nCe changement intervient apr\u00e8s plusieurs mois de critiques formul\u00e9es par des parents, des \u00e9tablissements scolaires et des \u00e9lus concernant l\u2019utilisation de l\u2019IA dans l\u2019enseignement. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le d\u00e9mocrate Abdul el-Sayed a\nremport\u00e9 l\u2019\u00e9lection s\u00e9natoriale dans l\u2019\u00c9tat...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9mocrate Abdul el-Sayed a remport\u00e9 l\u2019\u00e9lection s\u00e9natoriale dans l\u2019\u00c9tat du Michigan (nord), devenant le premier musulman \u00e0 \u00eatre \u00e9lu au S\u00e9nat am\u00e9ricain, selon les projections des m\u00e9dias am\u00e9ricains. [telquel.ma]\n-------------------------------------------------\nIl a recueilli environ cinquante-deux pour cent des suffrages, contre un peu plus de quarante-sept pour cent pour le r\u00e9publicain Mike Rogers, selon les r\u00e9sultats disponibles mercredi matin. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le ministre roumain des Affaires\n\u00e9trang\u00e8res, Dan Neculaescu, a r\u00e9affirm\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre roumain des Affaires \u00e9trang\u00e8res, Dan Neculaescu, a r\u00e9affirm\u00e9, dans un post publi\u00e9 sur X \u00e0 l\u2019issue d\u2019un entretien avec son homologue Nasser Bourita, la position de son pays sur le Sahara, fond\u00e9e sur le droit international, tout en saluant l\u2019engagement constructif du Maroc. [telquel.ma]\n-------------------------------------------------\nLe ministre roumain des Affaires \u00e9trang\u00e8res, Dan Necul\u0103escu, a r\u00e9affirm\u00e9, lors d\u2019un entretien t\u00e9l\u00e9phonique avec son homologue marocain Nasser Bourita, la position de Bucarest en faveur du plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre roumain des Affaires \u00e9trang\u00e8res, Dan Necul\u0103escu, a r\u00e9affirm\u00e9, \u00e0 l\u2019occasion d\u2019un entretien t\u00e9l\u00e9phonique mardi avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, que le plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc constitue \u201cla base la plus ad\u00e9quate, s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste\u201d pour parvenir \u00e0 [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le minist\u00e8re de la Jeunesse,\nde la Culture et des...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Jeunesse, de la Culture et des Sports s\u2019oriente vers le d\u00e9veloppement du programme \u00ab Moutatawi3 \u00bb en permettant aux b\u00e9n\u00e9ficiaires de prendre part \u00e0 des activit\u00e9s b\u00e9n\u00e9voles tout au long de l\u2019ann\u00e9e, au lieu de se limiter \u00e0 trois semaines par an, a annonc\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre d\u00e9l\u00e9gu\u00e9. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Jeunesse, de la Culture et des Sports envisage d\u2019\u00e9tendre le programme de volontariat \u00abMoutatawi3\u00bb \u00e0 l\u2019ensemble de l\u2019ann\u00e9e, contre trois semaines actuellement, a annonc\u00e9 mardi le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de la Jeunesse, Salah Eddine Abkari, devant la Chambre des conseillers. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Signature : L\u2019Agence nationale des\nports (ANP) et l\u2019Agence fran\u00e7aise...", "mass": 5, "physics": false, "shape": "box", "title": "Signature : L\u2019Agence nationale des ports (ANP) et l\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) ont proc\u00e9d\u00e9, mardi 3 novembre 2026, \u00e0 la signature officielle d\u2019une d\u00e9claration conjointe relative au troisi\u00e8me financement du partenariat . [aujourdhui.ma]\n--------                     continue;

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
