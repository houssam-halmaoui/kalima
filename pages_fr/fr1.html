 des imp\u00f4ts (DGI) rappelle aux contribuables dont les revenus professionnels sont d\u00e9termin\u00e9s selon le r\u00e9gime de la Contribution professionnelle unique (CPU) et. [lematin.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que plusieurs cat\u00e9gories de contribuables sont tenues d\u2019effectuer, au plus tard le 1er octobre 2026, leurs d\u00e9clarations et versements fiscaux. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 la suite de la\ndiffusion, par certains relais m\u00e9diatiques...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la suite de la diffusion, par certains relais m\u00e9diatiques \u00e0 la solde du front s\u00e9paratiste, d\u2019informations trompeuses concernant l\u0027audience accord\u00e9e par le ministre ghan\u00e9en de. [lematin.ma]\n-------------------------------------------------\nAccra a confirm\u00e9 que le retrait de sa reconnaissance de la pseudo \u00ab rasd \u00bb reste inchang\u00e9 et que la r\u00e9cente audience accord\u00e9e par son chef de la diplomatie concernait un simple envoy\u00e9 du. [telquel.ma]\n-------------------------------------------------\nFace aux interpr\u00e9tations suscit\u00e9es par une r\u00e9cente rencontre \u00e0 Accra, la diplomatie ghan\u00e9enne a r\u00e9affirm\u00e9 le maintien du retrait de la reconnaissance de la \u00abrasd\u00bb et pr\u00e9cis\u00e9 que le repr\u00e9sentant re\u00e7u par le ministre des Affaires \u00e9trang\u00e8res intervenait en qualit\u00e9 d\u2019envoy\u00e9 du Polisario. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 la suite de la diffusion, par certains relais m\u00e9diatiques \u00e0 la solde du front s\u00e9paratiste, d\u2019informations trompeuses concernant l\u2019audience accord\u00e9e par le ministre ghan\u00e9en des Affaires \u00e9tr  Cassation, pr\u00e9sident d\u00e9l\u00e9gu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Premier pr\u00e9sident de la Cour de Cassation, pr\u00e9sident d\u00e9l\u00e9gu\u00e9 du Conseil sup\u00e9rieur du pouvoir judiciaire (CSPJ), Mohamed Abdennabaoui, s\u2019est entretenu, mardi \u00e0 Rabat, avec la Procureure g\u00e9n\u00e9rale charg\u00e9e de la coop\u00e9ration judiciaire internationale au Royaume des Pays-Bas, Sue Preenen, qui effectue une visite de travail au Maroc, accompagn\u00e9e d\u2019une d\u00e9l\u00e9gation de haut niveau. [telquel.ma]\n-------------------------------------------------\nLe Premier pr\u00e9sident de la Cour de Cassation, Pr\u00e9sident d\u00e9l\u00e9gu\u00e9 du Conseil Sup\u00e9rieur du Pouvoir Judiciaire (CSPJ), Mohamed Abdennabaoui, s\u2019est entretenu, mardi \u00e0 Rabat, avec la Procureure g\u00e9n\u00e9rale charg\u00e9e de la coop\u00e9ration judiciaire internationale au Royaume des Pays-Bas, Sue Preenen, qui effectue une visite de travail au Maroc, accompagn\u00e9e d\u2019une d\u00e9l\u00e9gation de haut niveau. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019op\u00e9ration \u00ab Marhaba 2026 \u00bb\nd\u2019accueil des Marocains R\u00e9sidant \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration \u00ab Marhaba 2026 \u00bb d\u2019accueil des Marocains R\u00e9sidant \u00e0 l\u2019Etranger (MRE) prend fin, mardi \u00e0 minuit, dans les diff\u00e9rents espaces d\u2019accueil mis en place par la Fondation Mohammed V pour la Solidarit\u00e9 \u00e0 travers le Royaume et \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nL\u2019op\u00e9ration Marhaba 2026, supervis\u00e9e par la Fondation Mohammed V pour la Solidarit\u00e9, s\u2019est achev\u00e9e apr\u00e8s plus de trois mois de mobilisation, avec l\u2019accueil de 4.137.594 e, par un effet de dilution, le seuil de participation de 10% dans le capital d\u2019Auto Hall. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Marocaine Vie a annonc\u00e9\nl\u2019ouverture d\u2019un programme de d\u00e9part...", "mass": 5, "physics": false, "shape": "box", "title": "La Marocaine Vie a annonc\u00e9 l\u2019ouverture d\u2019un programme de d\u00e9part volontaire destin\u00e9 \u00e0 l\u2019ensemble de ses collaborateurs, pour une dur\u00e9e d\u2019un mois, du 16 septembre au 16 octobre 2026. [www.lavieeco.com]\n-------------------------------------------------\nEntreprise exclusivement d\u00e9di\u00e9e \u00e0 l\u2019assurance vie sur un march\u00e9 o\u00f9 la plupart des acteurs sont diversifi\u00e9s, La Marocaine Vie a engag\u00e9 depuis plusieurs ann\u00e9es une transformation . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La pr\u00e9sidence de la Conf\u00e9d\u00e9ration\ng\u00e9n\u00e9rale des entreprises du Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "La pr\u00e9sidence de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu une s\u00e9ance de travail avec l\u2019ensemble des pr\u00e9sidents des CGEM R\u00e9gions, consacr\u00e9e au renforcement de la dynamique \u00e9conomique territoriale. [www.lavieeco.com]\n-------------------------------------------------\nLe renforcement de la dynamique \u00e9conomique territoriale a \u00e9t\u00e9 au centre d\u0027une s\u00e9ance de travail tenue, jeudi dernier \u00e0 Casablanca, par la Pr\u00e9sidence de la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) avec l\u0027ensemble des pr\u00e9sidents des CGEM R\u00e9gions. [leseco.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entr     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

                var url = node.options.url;

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
