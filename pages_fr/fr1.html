, faisant plus de 230 morts. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les minist\u00e8res publics chinois et\nde 14 pays africains, dont...", "mass": 5, "physics": false, "shape": "box", "title": "Les minist\u00e8res publics chinois et de 14 pays africains, dont le Maroc, ont convenu, mercredi \u00e0 Guangzhou (sud de la Chine), d\u2019intensifier leur coop\u00e9ration judiciaire et de contribuer \u00e0 une modernisation fond\u00e9e sur la justice et le d\u00e9veloppement mutuellement b\u00e9n\u00e9fique. [telquel.ma]\n-------------------------------------------------\nLes minist\u00e8res publics chinois et de 14 pays africains, dont le Maroc, ont convenu, mercredi \u00e0 Guangzhou (sud de la Chine), d\u2019intensifier leur coop\u00e9ration judiciaire et de contribuer \u00e0 une modernisation fond\u00e9e sur la justice et le d\u00e9veloppement mutuellement b\u00e9n\u00e9fique. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Initialement pr\u00e9vu ce jeudi, l\u2019examen\npar le Conseil de s\u00e9curit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Initialement pr\u00e9vu ce jeudi, l\u2019examen par le Conseil de s\u00e9curit\u00e9 de l\u2019Organisation des Nations Unies d\u2019une nouvelle r\u00e9solution relative au mandat de la Mission de l\u2019ONU au Sahara (Minurso) aura finalement lieu ce vendredi 31 octobre, selon une source diplomatique proche du dossier. [telquel.ma]\n-------------------------------------------------\nLe Conseil de s\u00e9curit\u00e9 des Nations Unies devait se prononcer aujourdhui sur un nouveau projet de r\u00e9solution concernant le Sahara, mais le vote a \u00e9t\u00e9 report\u00e9 \u00e0 demain, vendredi 31 octobre \u00e0 15h05 (heure locale). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, " dustrie et du Commerce. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement a re\u00e7u, ce 29 octobre \u00e0 Rabat, Fran\u00e7ois Provost, directeur ex\u00e9cutif du groupe Renault. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [atlasinfo.fr]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [www.lereporter.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u le 29 octobre 2025 \u00e0 Rabat Fran\u00e7ois Provost, Directeur ex\u00e9cutif du Groupe Renault, pour discuter du d\u00e9veloppement de l\u2019industrie automobile marocaine, d\u00e9sormais moteur de croissance industrielle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Lors de son entretien, \u00e0\nRabat, avec le ministre des...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de son entretien, \u00e0 Rabat, avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, le ministre des Relations ext\u00e9rieures de la R\u00e9publique. [telquel.ma]\n-------------------------------------------------\nLe Maroc et le Paraguay sont anim\u00e9s d\u0027une volont\u00e9 claire et responsable d\u2019intensifier leur partenariat strat\u00e9gique, dans le cadre d\u2019une vision fond\u00e9e sur le respect des engagements et la fid\u00e9lit\u00e9 aux principes, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Paraguay a mat\u00e9rialis\u00e9, mercredi, sa reconnaissance de la souverainet\u00e9 marocaine sur le Sahara par l\u2019annonce de l\u2019ouverture d\u2019un Consulat G\u00e9n\u00e9ral. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La police nationale espagnole a\nannonc\u00e9, mercredi, le d\u00e9mant\u00e8lement de...", "mass": 5, "physics": false, "shape": "box", "title": "La police nationale espagnole a annonc\u00e9, mercredi, le d\u00e9mant\u00e8lement de deux organisations criminelles internationales sp\u00e9cialis\u00e9es dans le trafic de hachich, dans le cadre d\u2019une op\u00e9ration conjointe men\u00e9e en collaboration avec la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, men\u00e9e en coordination aussi avec le Parquet de la Cour d\u2019appel de Tanger, a permis la saisie de 20 tonnes de hachich dissimul\u00e9es dans des cargaisons de poivrons \u00e0 bord de camions frigorifiques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les investissements du groupe OCP\ndevraient atteindre 53 milliards de...", "mass": 5, "physics": false, "shape": "box", "ti                       });
                  

                  return network;

              }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
