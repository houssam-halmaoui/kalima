ministre des Affaires \u00e9trang\u00e8res de la R\u00e9publique du Honduras, par lettre officielle re\u00e7ue ce mercredi. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "SM le Roi Mohammed VI\na offert, ce jeudi 23...", "mass": 5, "physics": false, "shape": "box", "title": "SM le Roi Mohammed VI a offert, ce jeudi 23 avril \u00e0 Mekn\u00e8s, un d\u00eener en l\u2019honneur des invit\u00e9s et des participants \u00e0 la 18e \u00e9dition du Salon International de l\u2019Agriculture au Maroc, pr\u00e9sid\u00e9 par le Chef du gouvernement, Aziz Akhannouch. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a offert, jeudi \u00e0 Mechouar Stinia-Sahrij Souani \u00e0 Mekn\u00e8s, un d\u00eener en l\u2019honneur des invit\u00e9s et des participants \u00e0 la 18e \u00e9dition du Salon International de l\u2019Agriculture au Maroc (SIAM), pr\u00e9sid\u00e9 par le Chef du gouvernement, M. Aziz Akhannouch. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La Ministre des Affaires \u00e9trang\u00e8res\ndu Royaume-Uni, Yvette Cooper, a...", "mass": 5, "physics": false, "shape": "box", "title": "La Ministre des Affaires \u00e9trang\u00e8res du Royaume-Uni, Yvette Cooper, a r\u00e9affirm\u00e9 le soutien du Royaume-Uni au plan d\u2019autonomie marocain, le qualifiant de base \u00ab cr\u00e9dible, viable et pragmatique \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLa ministre des Affaires \u00e9trang\u00e8res du Royaume-Uni, Yvette Cooper, a r\u00e9affirm\u00e9, jeudi, la position de son pays concernant la question du Sahara marocain, en renouvelant l\u2019appui britannique au plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc, comme \u00ab la base la plus cr\u00e9dible, viable et pragmatique pour la paix au Sahara \u00bb. [atlasinfo.fr]\n-------------------------------------------------\nLa Ministre des Affaires \u00e9trang\u00e8res du Royaume-Uni, Yvette Cooper, a r\u00e9affirm\u00e9, jeudi, la position de son pays concernant la question du Sahara marocain, en renouvelant l\u2019appui britannique au plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc, comme \u00ab la base la plus cr\u00e9dible, viable et pragmatique pour la paix au Sahara \u00bb. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Un accord-cadre de coop\u00e9ration dans\nles domaines de la p\u00eache...", "mass": 5, "physics": false, "shape": "box", "title": "Un accord-cadre de coop\u00e9ration dans les domaines de la p\u00eache maritime et de l\u2019aquaculture a \u00e9t\u00e9 sign\u00e9, jeudi \u00e0 Mekn\u00e8s, entre le Maroc et le Cameroun, en marge du Salon International de l\u2019Agriculture au Maroc (SIAM), en vue de renforcer leur partenariat dans ce secteur strat\u00e9gique. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 18e Salon international de l\u2019agriculture au Maroc \u00e0 Mekn\u00e8s, l\u2019op\u00e9rateur phosphatier d\u00e9voile une vision globale des syst\u00e8mes agricoles o\u00f9 le phosphore joue un r\u00f4le central, reliant fertilit\u00e9 des sols, production v\u00e9g\u00e9tale et alimentation animale. [leseco.ma]\n-------------------------------------------------\nLe Groupe Cr\u00e9dit Agricole du Maroc (CAM) a sign\u00e9, jeudi \u00e0 Mekn\u00e8s, cinq conventions et m\u00e9morandums de partenariat avec des acteurs nationaux et internationaux, couvrant l\u2019\u00e9ducation financi\u00e8re rurale, la transition verte des fili\u00e8res agricoles, la coop\u00e9ration internationale et la m\u00e9canisation agricole. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {
