alse, "shape": "box", "title": "La position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, fait ressortir une situation nette d\u00e9bitrice de 758 milliards de dirhams (MMDH) au terme des neuf premiers mois de 2025, contre -791 MMDH \u00e0 fin juin dernier, selon l\u2019Office des Changes. [fr.hespress.com]\n-------------------------------------------------\nLa position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, fait ressortir une situation nette d\u00e9bitrice de 758 milliards de dirhams (MMDH) au terme des neuf premiers mois de 2025, contre -791 MMDH \u00e0 fin juin dernier, selon l\u2019Office des Changes. [atlasinfo.fr]\n-------------------------------------------------\nPosition ext\u00e9rieure globale : Le d\u00e9ficit patrimonial du Maroc se r\u00e9duit \u00e0 758 MMDH \u00e0 fin septembre 2025. [www.lavieeco.com]\n-------------------------------------------------\nLa position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, fait ressortir une situation nette d\u00e9bitrice de 758 milliards de dirhams (MMDH) au terme des neuf premiers mois de 2025, contre -791 MMDH \u00e0 fin juin dernier, selon l\u2019Office des Changes. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La ministre de l\u2019\u00c9conomie et\ndes Finances, Nadia Fettah, et...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, et le secr\u00e9taire ex\u00e9cutif de la Commission \u00e9conomique des Nations Unies pour l\u2019Afrique (CEA), Claver Gatete, ont proc\u00e9d\u00e9, jeudi \u00e0 Rabat, \u00e0 la signature de l\u2019Accord du pays h\u00f4te relatif \u00e0 l\u2019organisation de la 58\u1d49 session de la Conf\u00e9rence des ministres africains des finances de la . [fr.hespress.com]\n-------------------------------------------------\nNadia Fettah et Claver Gatete ont sign\u00e9, ce jeudi 22 janvier \u00e0 Rabat, l\u2019accord du pays h\u00f4te pour l\u2019organisation de la 58e session de la Conf\u00e9rence des ministres africains des finances de la CEA (COM58), pr\u00e9vue \u00e0 Tanger du 28 mars au 3 avril 2026, marquant une \u00e9tape cl\u00e9 dans les pr\u00e9paratifs de cet \u00e9v\u00e9nement continental. [www.lavieeco.com]\n-------------------------------------------------\nLa ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah Alaoui, a re\u00e7u jeudi 22 janvier, \u00e0 Rabat, Claver Gatete, secr\u00e9taire ex\u00e9cutif de la Commission \u00e9conomique pour l\u2019Afrique (CEA), en visite de travail dans le cadre des pr\u00e9paratifs de la 58e session de la Conf\u00e9rence des ministres africains des finances (COM58), qui se tiendra \u00e0 Tanger du 28 mars au 3 avril 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les Semaines du Film Europ\u00e9en\nont lev\u00e9 le voile sur...", "mass": 5, "physics": false, "shape": "box", "title": "Les Semaines du Film Europ\u00e9en ont lev\u00e9 le voile sur la programmation de leur 31\u1d49 \u00e9dition, pr\u00e9vue du 28 janvier au 11 f\u00e9vrier 2026 \u00e0 Casablanca, Marrakech et Rabat. [fr.hespress.com]\n-------------------------------------------------\nFid\u00e8le \u00e0 sa vocation depuis 1991, l\u2019\u00e9v\u00e9nement propose au public marocain une s\u00e9lection riche et singuli\u00e8re de films contemporains, refl\u00e9tant la diversit\u00e9 des \u00e9critures, des regards et des sensibilit\u00e9s qui traversent aujourd\u2019hui le cin\u00e9ma europ\u00e9en. [www.lavieeco.com]\n-------------------- ensemble des composantes de la Nation qui ont admirablement contribu\u00e9 \u00e0 la pleine r\u00e9ussite . [fr.hespress.com]\n-------------------------------------------------\n\u00c0 l\u2019issue de la CAN 2025 organis\u00e9e au Maroc, le roi Mohammed VI a adress\u00e9 un message de remerciement \u00e0 l\u2019ensemble des composantes de la Nation pour la r\u00e9ussite de cette \u00e9dition \u00ab historique \u00bb. [telquel.ma]\n-------------------------------------------------\nA l\u2019issue de la 35\u00e8me \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN), accueillie avec ferveur par le Royaume du Maroc, du 21 d\u00e9cembre 2025 au 18 janvier [www.challenge.ma]\n-------------------------------------------------\nVoici un communiqu\u00e9 du Cabinet Royal : \u00ab A l\u2019issue de la 35\u00e8me \u00e9dition de la Coupe d\u2019Afrique des Nations, accueillie avec ferveur par le Royaume du Maroc, du 21 d\u00e9cembre 2025 au 18 janvier 2026, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, tient \u00e0 exprimer Ses remerciements \u00e0 l\u2019ensemble des composantes de la . [maroc-diplomatique.net]\n-------------------------------------------------\n\u00c0 l\u2019issue de la 35\u1d49 \u00e9dition de la Coupe d\u2019Afrique des Nations, organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026, le Cabinet Royal a diffus\u00e9 un communiqu\u00e9 dans lequel le Roi Mohammed VI exprime ses remerciements \u00e0 l\u2019ensemble des composantes de la Nation pour leur contribution \u00e0 la r\u00e9ussite de cet \u00e9v\u00e9nement . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Voici un communiqu\u00e9 du Cabinet\nRoyal :Sa Majest\u00e9 le Roi...", "mass": 5, "physics": false, "shape": "box", "title": "Voici un communiqu\u00e9 du Cabinet Royal :Sa Majest\u00e9 le Roi tient particuli\u00e8rement \u00e0 f\u00e9liciter tous les citoyens, \u00e0 travers les diff\u00e9rentes villes du Royaume, de l\u2019effort fourni. [lematin.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a exprim\u00e9, ce jeudi 22 janvier, \u00abses remerciements \u00e0 lensemble des composantes de la Nation qui ont admirablement contribu\u00e9 \u00e0 la pleine r\u00e9ussite de cette magnifique manifestation\u00bb, a indiqu\u00e9 le Cabinet royal dans un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nLe Roi tient particuli\u00e8rement \u00e0 f\u00e9liciter tous les citoyens, \u00e0 travers les diff\u00e9rentes villes du Royaume, de l\u2019effort fourni et \u00e0 remercier chacun pour sa belle contribution \u00e0 ce succ\u00e8s historique, reconnu et salu\u00e9 de par le monde. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Cet agr\u00e9ment permet \u00e0 Bank\nof Africa d\u2019assurer les fonctions...", "mass": 5, "physics": false, "shape": "box", "title": "Cet agr\u00e9ment permet \u00e0 Bank of Africa d\u2019assurer les fonctions de compensation des op\u00e9rations sur produits d\u00e9riv\u00e9s standardis\u00e9s. [lematin.ma]\n-------------------------------------------------\nCet agr\u00e9ment lui permettra d\u2019assurer les fonctions de compensation des op\u00e9rations sur produits d\u00e9riv\u00e9s standardis\u00e9s et atteste du respect des standards les plus exigeants en mati\u00e8re de gestion des risques, de gouvernance, de conformit\u00e9 r\u00e9glementaire et d\u2019infrastructures op\u00e9rationnelles. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les exportations marocaines de fraises\nsurgel\u00e9es vers les \u00c9tats-Unis ont...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations marocaines de fraises surgel\u00e9es vers les \u00c9ta <script>

    }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
