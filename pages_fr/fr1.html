olor": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "M-AUTOMOTIV, importateur et distributeur exclusif\nde GAC au Maroc, annonce...", "mass": 5, "physics": false, "shape": "box", "title": "M-AUTOMOTIV, importateur et distributeur exclusif de GAC au Maroc, annonce le lancement officiel de la marque sur le march\u00e9 national, avec une gamme diversifi\u00e9e, et un r\u00e9seau d\u00e9j\u00e0 pr\u00e9sent \u00e0 Casablanca et Tanger, avec Rabat, El Jadida et Agadir comme prochaines \u00e9tapes de son d\u00e9ploiement. [fr.hespress.com]\n-------------------------------------------------\nLe Groupe M-AUTOMOTIV, importateur et distributeur exclusif de GAC au Maroc, annonce le lancement officiel de la marque sur le march\u00e9 national, avec une gamme diversifi\u00e9e, et un r\u00e9seau d\u00e9j\u00e0 pr\u00e9sent \u00e0 Casablanca et Tanger, avec Rabat, El Jadida et Agadir comme prochaines \u00e9tapes de son d\u00e9ploiement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nd\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger afin d\u2019enqu\u00eater sur des irr\u00e9gularit\u00e9s ayant entach\u00e9 le processus \u00e9lectoral dans deux bureaux de vote, \u00e0 l\u2019occasion des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription \u00e9lectorale de Tanger-Assilah. [fr.hespress.com]\n-------------------------------------------------\nL\u2019affaire des irr\u00e9gularit\u00e9s ayant marqu\u00e9 les op\u00e9rations \u00e9lectorales dans deux bureaux de vote de la circonscription de Tanger-Assilah conna\u00eet un nouveau d\u00e9veloppement. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection dans la ville de Tanger \u00e0 la suite des irr\u00e9gularit\u00e9s ayant entach\u00e9 l\u2019op\u00e9ration \u00e9lectorale dans deux bureaux de vote, \u00e0 l\u2019occasion des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription \u00e9lectorale de Tanger-Assilah. [telquel.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9 du minist\u00e8re de l\u2019Int\u00e9rieur, \u00ab\u00e0 la suite des irr\u00e9gularit\u00e9s ayant entach\u00e9 le processus \u00e9lectoral dans deux bureaux de vote lors des \u00e9lections l\u00e9gislatives du 23 septembre 2026 dans la circonscription de Tanger-Assilah, le minist\u00e8re a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour enqu\u00eater et \u00e9tablir les faits, en menant des investigations administratives n\u00e9cessaires et en examinant les donn\u00e9es relatives \u00e0 ces incidents\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a d\u00e9p\u00each\u00e9 une commission centrale d\u2019inspection \u00e0 Tanger pour faire la lumi\u00e8re sur les irr\u00e9gularit\u00e9s relev\u00e9es dans deux bureaux de vote lors des l\u00e9gislatives du 23 septembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Cette nomination s\u2019inscrit dans le\ncadre d\u2019une nouvelle dynamique visant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nomination s\u2019inscrit dans le cadre d\u2019une nouvelle dynamique visant \u00e0 renforcer le positionnement de Technopark Morocco en tant qu\u2019acteur de r\u00e9f\u00e9rence de l\u2019innovation, de l\u2019en. [lematin.ma]\n-------------------------------------------------\nDriss Lemjaouri a \u00e9t\u00e9 nomm\u00e9 directeur g\u00e9n\u00e9ral de Technopark Morocco (MITC), \u00e0 l\u2019issue du Conseil d\u2019administration tenu le 18 septembre 2026, sous la pr\u00e9sidence d\u2019Amal El Fallah Seghrouchni. [leseco.ma]\n-------------------------------------------------\nLa d\u00e9cision a \u00e9t\u00e9 prise lors du Conseil d\u2019administration tenu le 18 septembre 2026, sous la pr\u00e9sidence d\u2019Amal El Fallah Seghrouchni, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les ressortissants marocains b\u00e9n\u00e9ficient d\u2019une\nexemption des frais de visa...", "mass": 5, "physics": false, "shape": "box", "title": "Les ressortissants marocains b\u00e9n\u00e9ficient d\u2019une exemption des frais de visa pour l\u2019Irlande, selon les informations r\u00e9centes publi\u00e9es par l\u2019Immigration Service Delivery (ISD), l\u2019admi. [lematin.ma]\n-------------------------------------------------\nLes Marocains souhaitant obtenir un visa pour lIrlande sont exempt\u00e9s des frais de dossier habituels, comme lindique le Service irlandais de limmigration. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Au lendemain des l\u00e9gislatives du\nmercredi 23 septembre, les r\u00e9sultats...", "mass": 5, "physics": false, "shape": "box", "title": "Au lendemain des l\u00e9gislatives du mercredi 23 septembre, les r\u00e9sultats provisoires annonc\u00e9s par le minist\u00e8re de l\u0027I. [lematin.ma]\n-------------------------------------------------\nAu lendemain des \u00e9lections l\u00e9gislatives du 23 septembre, les r\u00e9sultats provisoires ouvrent une nouvelle s\u00e9quence politique. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La brigade antigang du service\npr\u00e9fectoral de la police judiciaire...", "mass": 5, "physics": false, "shape": "box", "title": "La brigade antigang du service pr\u00e9fectoral de la police judiciaire de Rabat, en coordination avec les services de la Direction g\u00e9n\u00e9rale de la surveillance du territoire (DGST), a interpell\u00e9, ce dimanche 27 septembre, un policier exer\u00e7ant \u00e0 Rabat et sa s\u0153ur, soup\u00e7onn\u00e9s d\u2019\u00eatre impliqu\u00e9s dans la d\u00e9tention, le transport et la commercialisation de stup\u00e9fiants et. [telquel.ma]\n-------------------------------------------------\nLa brigade antigang de la police judiciaire de Rabat, en coordination avec la Direction g\u00e9n\u00e9rale de la surveillance du territoire, a arr\u00eat\u00e9 dimanche 27 septembre un policier en service \u00e0 Rabat et sa s\u0153ur, soup\u00e7onn\u00e9s de trafic de drogues et substances psychotropes. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Selon des sources m\u00e9diatiques concordantes,\nMounir Laymouri, pr\u00e9sident du conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Selon des sources m\u00e9diatiques concordantes, Mounir Laymouri, pr\u00e9sident du conseil communal de Tanger et dirigeant du Parti authenticit\u00e9 et modernit\u00e9 (PAM), a \u00e9t\u00e9 interpell\u00e9 ce lundi matin d\u00e8s son arriv\u00e9e \u00e0 l\u2019a\u00e9roport de Tanger Ibn Battouta, en provenance de Malaga, en Espagne. [telquel.ma]\n-------------------------------------------------\nLa police de l\u2019a\u00e9roport Tanger-Ibn Battouta a arr\u00eat\u00e9 lundi matin le maire de Tanger et pr\u00e9sident de son conseil communal, Mounir Limouri, \u00e0 son arriv\u00e9e \u00e0 7h10 \u00e0 bord d\u2019un vol de Malaga, en Espagne. [www.yabiladi.com]\n-------------------------------------------------\nMounir Laymouri a \u00e9t\u00e9 appr\u00e9hend\u00e9 lundi matin \u00e0 l\u2019a\u00e9roport Ibn Battouta, \u00e0 sa descente d\u2019un vol en provenance de Malaga, en ex\u00e9cution d\u2019un mandat de recherche national \u00e9mis dans l\u2019enqu\u00eate sur des documents \u00e9lectoraux d\u00e9couverts le jour du scrutin. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019athl\u00e8te marocain Hamza Sahli a\nremport\u00e9 la 37e \u00e9dition du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019athl\u00e8te marocain Hamza Sahli a remport\u00e9 la 37e \u00e9dition du semi-marathon de Valladolid (Espagne), signant une belle victoire internationale pour le sport national lors de cette comp\u00e9tition disput\u00e9e dimanche. [telquel.ma]\n-------------------------------------------------\nLe Marocain Hamza Sahli a remport\u00e9 la 37e \u00e9dition du semi-marathon de Valladolid, en Espagne, soffrant une belle victoire lors de la comp\u00e9tition qui s\u2019est tenue dimanche. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Des m\u00e8res se sont rassembl\u00e9es\nsamedi devant le Parlement \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Des m\u00e8res se sont rassembl\u00e9es samedi devant le Parlement \u00e0 Rabat pour r\u00e9clamer la lib\u00e9ration de leurs fils, parfois mineurs, emprisonn\u00e9s apr\u00e8s des violences en marge des manifestations du mouvement GenZ 212 il y a un an. [telquel.ma]\n-------------------------------------------------\nUn rassemblement s\u2019est tenu samedi devant le Parlement \u00e0 Rabat pour r\u00e9clamer la lib\u00e9ration de jeunes incarc\u00e9r\u00e9s \u00e0 la suite des manifestations de l\u2019automne 2025, un an apr\u00e8s le d\u00e9 u00e9t\u00e9s les plus chauds au Maroc depuis 1981, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [leseco.ma]\n-------------------------------------------------\nEntre le 1er et le 20 septembre 2026, le Maroc a enregistr\u00e9 les temp\u00e9ratures moyennes les plus \u00e9lev\u00e9es jamais relev\u00e9es pour cette p\u00e9riode depuis 1981, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "T2S Group et le Groupe\nAKDITAL ont sign\u00e9 un contrat-cadre...", "mass": 5, "physics": false, "shape": "box", "title": "T2S Group et le Groupe AKDITAL ont sign\u00e9 un contrat-cadre portant sur la fourniture, l\u2019installation et la maintenance de plusieurs robots chirurgicaux interconnect\u00e9s dans plusieurs \u00e9tablissements du r\u00e9seau AKDITAL. [fr.hespress.com]\n-------------------------------------------------\nT2S Group et le groupe Akdital ont conclu un contrat-cadre portant sur le d\u00e9ploiement de plusieurs robots chirurgicaux interconnect\u00e9s dans diff\u00e9rents \u00e9tablissements du r\u00e9seau Akdit. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Parti Authenticit\u00e9 et Modernit\u00e9\n(PAM) affirme vouloir attendre les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) affirme vouloir attendre les conclusions des enqu\u00eates judiciaires et administratives en cours sur les incidents signal\u00e9s dans deux bureaux de vote de la circonscription Tanger-Assilah lors des \u00e9lections l\u00e9gislatives du 23 septembre 2026, tout en se d\u00e9clarant pr\u00eat \u00e0 assumer les responsabilit\u00e9s politiques et organisationnelles qui pourraient en d\u00e9couler. [fr.hespress.com]\n-------------------------------------------------\nLe Parti authenticit\u00e9 et modernit\u00e9 (PAM) a salu\u00e9 le d\u00e9roulement des enqu\u00eates judiciaires dans l\u2019affaire dite du \u00ab sac de Tanger \u00bb, qui a \u00e9clat\u00e9 \u00e0 la suite de faits survenus dans deux bureaux de vote de la circonscription de Tanger-Assilah lors des \u00e9lections l\u00e9gislatives du 23 septembre. [telquel.ma]\n-------------------------------------------------\nSuite aux enqu\u00eates judiciaires et administratives concernant le sac d\u00e9couvert \u00e0 Tanger contenant des documents \u00e9lectoraux, le Parti authenticit\u00e9 et modernit\u00e9 (PAM) se dit pr\u00eat \u00e0 prendre les mesures n\u00e9cessaires si une responsabilit\u00e9 ou un lien avec le parti est \u00e9tabli. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le parc de la t\u00e9l\u00e9phonie\nmobile a d\u00e9pass\u00e9 les 58,8...", "mass": 5, "physics": false, "shape": "box", "title": "Le parc de la t\u00e9l\u00e9phonie mobile a d\u00e9pass\u00e9 les 58,8 millions d\u2019abonn\u00e9s \u00e0 fin juin 2026, pr\u00e9servant ainsi quasiment son m\u00eame niveau de l\u2019ann\u00e9e pr\u00e9c\u00e9dente (+0,1%), apr\u00e8s une hausse de 3,2% un an auparavant, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [fr.hespress.com]\n-------------------------------------------------\nLe parc mobile a pr\u00e9serv\u00e9 son niveau de l\u0027an dernier (+0,1 %) \u00e0 fin juin 2026, apr\u00e8s une hausse de 3,2 % un an auparavant, selon la DEPF. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 et de la Protection sociale a fait \u00e9tat de deux foyers familiaux limit\u00e9s de dipht\u00e9rie, d\u00e9tect\u00e9s dans la pr\u00e9fecture d\u2019Agadir Ida-Outanane et la province de Chtouka A\u00eft Baha, dans la r\u00e9gion de Souss-Massa. [fr.hespress.com]\n-------------------------------------------------\nDipht\u00e9rie au Maroc : deux foyers d\u00e9tect\u00e9s, huit cas sous investigation \u00e0 Souss-Massa (Minist\u00e8re). [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale a annonc\u00e9, dans un communiqu\u00e9 dat\u00e9 du 28 septembre 2026, la d\u00e9tection de deux foyers familiaux. [telquel.ma]\n-------------------------------------------------\nDeux foyers familiaux limit\u00e9s de dipht\u00e9rie ont \u00e9t\u00e9 d\u00e9tect\u00e9s dans la pr\u00e9fecture d\u2019Agadir Ida-Outanane et la province de Chtouka A\u00eft Baha, dans la r\u00e9gion de Souss-Massa, dans le cadre du syst\u00e8me national de veille et de surveillance \u00e9pid\u00e9miologiques, a annonc\u00e9 lundi le minist\u00e8re de la Sant\u00e9 et de la Protection sociale. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le s\u00e9lectionneur national Mohamed Ouahbi\na insist\u00e9 sur la n\u00e9cessit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national Mohamed Ouahbi a insist\u00e9 sur la n\u00e9cessit\u00e9 pour la s\u00e9lection marocaine d\u2019aborder avec s\u00e9rieux et grande concentration son match face au Lesotho, mardi \u00e0 Bloemfontein, en Afrique du Sud, pour le compte de la deuxi\u00e8me journ\u00e9e des \u00e9liminatoires de la Coupe d\u2019Afrique des Nations 2027, soulignant que les conditions diff\u00e9rentes ne sauraient . [fr.hespress.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national Mohamed Ouahbi a affirm\u00e9, lundi \u0     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

                    }
                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
