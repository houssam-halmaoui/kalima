u00e9nergie renouvelable\u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Un total de 257 nouveaux\nautobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Un total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi au port de Casablanca, dans le cadre de la mise en \u0153uvre du nouveau Programme pour le transport public urbain par autobus (2025-2029). [telquel.ma]\n-------------------------------------------------\nUn total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s lundi au Port de Casablanca, dans le cadre de la premi\u00e8re phase du Programme national pour le transport public urbain par autobus (2025-2029). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le pr\u00e9sident Paul Biya, 92\nans et au pouvoir depuis...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour un huiti\u00e8me mandat au Cameroun avec 53,66% des suffrages, selon les r\u00e9sultats officiels proclam\u00e9s par le Conseil constitutionnel lundi. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu sans surprise avec 53,66% des voix, selon les r\u00e9sultats officiels publi\u00e9s lundi, aussit\u00f4t contest\u00e9s par son principal adversaire Issa Tchiroma Bakary qui a d\u00e9nonc\u00e9 une \u00ab mascarade \u00bb. [www.lereporter.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya a \u00e9t\u00e9 r\u00e9\u00e9lu pour un huiti\u00e8me mandat cons\u00e9cutif \u00e0 la t\u00eate du pays, avec 53,66 % des suffrages exprim\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Equatorial Coca-Cola Bottling Company (ECCBC)\nMaroc a inaugur\u00e9 aujourd\u2019hui, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Equatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9 aujourd\u2019hui, lundi 27 octobre ses nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle [www.challenge.ma]\n-------------------------------------------------\nCet investissement strat\u00e9gique de 715 millions de dirhams (MDH) dans l\u0027usine de Cobomi-Casablanca s\u0027inscrit dans le cadre d\u0027un plan d\u2019investissement global de Equatorial Coca-Cola Bottling Company au Maroc de pr\u00e8s de 3,2 milliards de dirhams (MMDH) mis en \u0153uvre entre 2020 et 2025. [www.lavieeco.com]\n-------------------------------------------------\nEquatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9, lundi 27 octobre, de nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle Technopole Mohammed V \u00e0 Nouaceur. [lnt.ma]\n-------------------------------------------------\nEquatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9 aujourd\u2019hui ses nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle Technopole Mohammed V \u00e0 Nouaceur \u2013 Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Du 30 octobre au 2\nnovembre 2025, Essaouira f\u00eatera les...", "mass": 5, "physics": false, "shape": "box", "title": "Du 30 octobre au 2 novembre 2025, Essaouira f\u00eatera les 20 ans de son mythique Festival des Andalousies Atlantiques. [www.challenge.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement prop ociation INJAZ Al-Maghrib. [fr.hespress.com]\n-------------------------------------------------\nVivo Energy Maroc et INJAZ Al-Maghrib renouvellent leur partenariat historique pour soutenir l\u2019entrepreneuriat des jeunes. [www.challenge.ma]\n-------------------------------------------------\nVivo Energy Maroc, l\u2019entreprise en charge de la commercialisation et de la distribution de carburants et lubrifiants de marque Shell au Maroc et de gaz de p\u00e9trole liqu\u00e9fi\u00e9 de marque Butagaz, consolide son engagement soci\u00e9tal en renouvelant son partenariat strat\u00e9gique avec l\u2019association INJAZ Al-Maghrib. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Dans le cadre des r\u00e9formes\ndu secteur public et des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre des r\u00e9formes du secteur public et des grandes orientations royales, le Conseil de la concurrence et l\u2019Agence Nationale de Gestion Strat\u00e9gique des Participations de l\u2019Etat (ANGSPE) ont scell\u00e9, ce mardi 28 octobre \u00e0 Rabat, un partenariat strat\u00e9gique visant \u00e0 garantir la transparence, la neutralit\u00e9 concurrentielle et un cadre favorable \u00e0 l\u2019investissement public . [fr.hespress.com]\n-------------------------------------------------\nLe Conseil de la concurrence et l\u2019Agence Nationale de Gestion Strat\u00e9gique des Participations de l\u2019\u00c9tat et de suivi des performances des \u00e9tablissements et entreprises publics (ANGSPE) ont sign\u00e9, Mardi \u00e0 Rabat, une convention de partenariat destin\u00e9e \u00e0 promouvoir une \u00e9conomie marocaine plus comp\u00e9titive, \u00e9quitable et align\u00e9e sur les principes de bonne gouvernance et de concurrence loyale. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22",                 if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
