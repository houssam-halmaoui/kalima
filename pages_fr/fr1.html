, Mohamed Mehdi . [maroc-diplomatique.net]\n-------------------------------------------------\nLa 22e \u00e9dition du Festival International du Film de Marrakech a \u00e9t\u00e9 officiellement lanc\u00e9e, vendredi soir au Palais des Congr\u00e8s de la cit\u00e9 ocre, sous le Haut Patronage du Roi Mohammed VI, en pr\u00e9sence du ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, et de nombreuses personnalit\u00e9s du monde . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les exportations du secteur des\nphosphates et d\u00e9riv\u00e9s se sont...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations du secteur des phosphates et d\u00e9riv\u00e9s se sont \u00e9lev\u00e9es \u00e0 pr\u00e8s de 80,6 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en croissance de 16,7% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLes exportations du secteur des phosphates et d\u00e9riv\u00e9s se sont \u00e9lev\u00e9es \u00e0 pr\u00e8s de 80,6 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en croissance de 16,7% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Office des changes. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le chiffre d\u2019affaires (CA) global\npr\u00e9visionnel de l\u2019Office national des...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires (CA) global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u2019activit\u00e9 voyageurs et la dynamique soutenue des         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({

                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
