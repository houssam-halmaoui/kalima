euses f\u00e9licitations et Ses v\u0153ux de plein succ\u00e8s \u00e0 M. Touizi dans l\u0027exercice de ses nouvelles missions parlementaires.Le Souverai. [lematin.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des repr\u00e9sentants. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 M. Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des Repr\u00e9sentants. [www.lereporter.ma]\n-------------------------------------------------\nLe roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des repr\u00e9sentants. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Voici un communiqu\u00e9 du Cabinet\nRoyal:Sa Majest\u00e9 le Roi Mohammed...", "mass": 5, "physics": false, "shape": "box", "title": "Voici un communiqu\u00e9 du Cabinet Royal:Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u mercredi 14 octobre 2026, au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansou. [lematin.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a re\u00e7u, mercredi 14 octobre au Palais Royal \u00e0 Rabat, Fatima Ezzahra El Mansouri, Cheffe du gouvernement charg\u00e9e de former le nouvel Ex\u00e9cutif. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u mercredi 14 octobre 2026, au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansouri, Cheffe du gouvernement charg\u00e9e de la formation du nouveau gouvernement. [www.lereporter.ma]\n-------------------------------------------------\nDeux jours apr\u00e8s l\u2019annonce de sa majorit\u00e9, Fatima Ezzahra El Mansouri a \u00e9t\u00e9 re\u00e7ue ce mercredi par SM le Roi Mohammed VI, au Palais royal de Rabat. [lnt.ma]\n-------------------------------------------------\nLe roi Mohammed VI a accord\u00e9 une deuxi\u00e8me et nouvelle audience \u00e0 Fatima Ezzahra El Mansouri ce mercredi 14 octobre, selon un communiqu\u00e9 du cabinet royal. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La nouvelle plateforme de traitement\ndes r\u00e9clamations propose une interface...", "mass": 5, "physics": false, "shape": "box", "title": "La nouvelle plateforme de traitement des r\u00e9clamations propose une interface plus ergonomique, intuitive et accessible, offrant aux usagers un parcours simplifi\u00e9 pour le d\u00e9p\u00f4t et le. [lematin.ma]\n-------------------------------------------------\nMise en place par l\u0027ACAPS, la plateforme propose une interface plus ergonomique, intuitive et accessible, offrant aux usagers un parcours simplifi\u00e9 pour le d\u00e9p\u00f4t et le suivi de leurs r\u00e9clamations, ainsi que pour leurs \u00e9changes avec l\u0027Autorit\u00e9, tout en assurant la tra\u00e7abilit\u00e9 des dossiers. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Masen a annonc\u00e9 le lancement\nde la phase de pr\u00e9qualification...", "mass": 5, "physics": false, "shape": "box", "title": "Masen a annonc\u00e9 le lancement de la phase de pr\u00e9qualification du programme Noor PV multisites, destin\u00e9 \u00e0 d\u00e9velopper plusieurs centrales solaires photovolta\u00efques dans diff\u00e9rentes r\u00e9g. [lematin.ma]\n-------------------------------------------------\nLe programme porte sur le d\u00e9veloppement de plusieurs centrales photovolta\u00efques r\u00e9parties dans diff\u00e9rentes r\u00e9gions du Royaume, pour une capacit\u00e9 totale minimale de 350 MW. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Agence marocaine pour l\u2019\u00e9nergie durable (MASEN) annonce le lancement de la phase de pr\u00e9qualification pour la s\u00e9lection du contractant charg\u00e9 de la conception, de la fourniture des \u00e9quipements, de la construction ainsi que de l\u2019exploitation et de la maintenance des centrales solaires photovolta\u00efques du programme Noor PV Multisites. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc poursuit la modernisation\net l\u2019extension de son r\u00e9seau...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc poursuit la modernisation et l\u2019extension de son r\u00e9seau ferroviaire \u00e0 travers un programme d\u2019investissement, compl\u00e9t\u00e9 par un programme additionnel, pour une enveloppe globale de 134 MMDH \u00e0 l\u2019horizon 2030. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc poursuit le d\u00e9veloppement de ses infrastructures ferroviaires \u00e0 travers un programme d\u2019investissement, compl\u00e9t\u00e9 par des projets additionnels, repr\u00e9sentant une enveloppe globale de 134 milliards de dirhams \u00e0 l\u2019horizon 2030. [lnt.ma]\n-------------------------------------------------\nLe Maroc poursuit le d\u00e9veloppement et la modernisation de son r\u00e9seau ferroviaire \u00e0 travers un programme d\u2019investissement, assorti d\u2019un programme compl\u00e9mentaire, dot\u00e9 d\u2019une enveloppe globale de 134 milliards de dirhams (MMDH) \u00e0 l\u2019horizon 2030, a indiqu\u00e9, mercredi \u00e0 Rabat, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [telquel.ma]\n-------------------------------------------------\nLe Maroc poursuit le d\u00e9veloppement et la modernisation de son r\u00e9seau ferroviaire \u00e0 travers un programme d\u2019investissement, assorti d\u2019un programme compl\u00e9mentaire, dot\u00e9 d\u2019une enveloppe globale de 134 milliards de dirhams (MMDH) \u00e0 l\u2019horizon 2030, a indiqu\u00e9, mercredi \u00e0 Rabat, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La World Surf League (WSL)\nEurope et Afrique organisera le...", "mass": 5, "physics": false, "shape": "box", "title": "La World Surf League (WSL) Europe et Afrique organisera le Junior Pro Taghazout Bay du 11 au 15 novembre 2026, dans le cadre des Junior Qualifying Series (JQS). [lnt.ma]\n-------------------------------------------------\nLa World Surf League (WSL) Europe et Afrique fait son retour au Maroc avec le Junior Pro Taghazout Bay, programm\u00e9 du 11 au 15 novembre 2026 dans le cadre des Junior Qualifying Series (JQS). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019Autorit\u00e9 de contr\u00f4le des assurances\net de la pr\u00e9voyance sociale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) a mis en service, en septembre 2026, une nouvelle plateforme num\u00e9rique destin\u00e9e au d\u00e9p\u00f4t et au suivi des r\u00e9clamations. [lnt.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) a mis en service, en septembre dernier, une nouvelle plateforme num\u00e9rique d\u00e9di\u00e9e au d\u00e9p\u00f4t et au suivi des r\u00e9clamations des assur\u00e9s et b\u00e9n\u00e9ficiaires. [leseco. n\u00e9e du groupe A. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de futsal s\u2019est qualifi\u00e9e pour les demi-finales de la Coupe d\u2019Afrique des Nations (CAN), apr\u00e8s sa victoire face \u00e0 son homologue zambienne sur le score sans appel de 7 buts \u00e0 0, lors du match disput\u00e9 mercredi soir \u00e0 la salle couverte du complexe sportif Prince Moulay Abdellah, \u00e0 Rabat, pour le [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le pr\u00e9sident du Conseil de\nla concurrence, Ahmed Rahhou, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du Conseil de la concurrence, Ahmed Rahhou, a soulign\u00e9, mercredi \u00e0 Marrakech, la n\u00e9cessit\u00e9 de renforcer l\u2019attractivit\u00e9 du secteur de la sant\u00e9 pour favoriser les investissements et la cr\u00e9ation de valeur ajout\u00e9e, tout en garantissant une concurrence saine, le respect de la loi et de l\u2019\u00e9thique, ainsi que la qualit\u00e9 des prestations et. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident du Conseil de la concurrence, Ahmed Rahhou, a soulign\u00e9, mercredi \u00e0 Marrakech, la n\u00e9cessit\u00e9 de renforcer l\u2019attractivit\u00e9 du secteur de la sant\u00e9 pour favoriser les investissements et la cr\u00e9ation de valeur ajout\u00e9e, tout en garantissant une concurrence saine, le respect de la loi et de l\u2019\u00e9thique, ainsi que la qualit\u00e9 des prestations et [www.lereporter.ma]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
