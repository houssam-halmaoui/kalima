ganisation du Conseil national de la presse (CNP) a pour objectif central de renforcer les pouvoirs et les capacit\u00e9s juridiques de cette institution. [lnt.ma]\n-------------------------------------------------\nL\u2019objectif principal du projet de loi de r\u00e9organisation du Conseil national de la presse (CNP) est de renforcer les pouvoirs et les capacit\u00e9s juridiques de l\u2019institution, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Groupe ISCAE organise, en\npartenariat avec la Chambre Fran\u00e7aise...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe ISCAE organise, en partenariat avec la Chambre Fran\u00e7aise de Commerce et d\u2019Industrie du Maroc (CFCIM), la 41\u1d49 \u00e9dition du Carrefour du Manager, pr\u00e9vue les 25 et 26 novembre 2025 sur son campus de Casablanca. [lnt.ma]\n-------------------------------------------------\nLa 41e \u00e9dition du Carrefour du Manager, organis\u00e9e conjointement par la Chambre fran\u00e7aise de commerce et d\u2019industrie et l\u2019Institut Sup\u00e9rieur de Commerce et d\u2019Administration des Entreprises (ISCAE), a r\u00e9uni, mardi 25 novembre, un parterre d\u2019acteurs cl\u00e9s de l\u2019\u00e9cosyst\u00e8me \u00e9conomique marocain. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "L\u2019Union europ\u00e9enne va demander lundi\n\u00e0 Washington de r\u00e9duire les...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union europ\u00e9enne va demander lundi \u00e0 Washington de r\u00e9duire les droits de douane impos\u00e9s sur les importations d\u2019acier et des produits en contenant, lors d\u2019une visite de responsables am\u00e9ricains \u00e0 Bruxelles, a annonc\u00e9 la Commission europ\u00e9enne. [lnt.ma]\n-------------------------------------------------\nAlors que les tensions commerciales transatlantiques persistent, l\u2019Union europ\u00e9enne appelle Washington \u00e0 r\u00e9duire les droits de douane sur l\u2019acier et les produits d\u00e9riv\u00e9s, tout en r\u00e9clamant des exemptions pour des secteurs cl\u00e9s comme les vins et spiritueux. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le Roi Mohammed VI a\nadress\u00e9 un message au Pr\u00e9sident...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a adress\u00e9 un message au Pr\u00e9sident du Comit\u00e9 des Nations Unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, Coly Seck, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien, c\u00e9l\u00e9br\u00e9e, cette ann\u00e9e, le 25 novembre. [fr.hespress.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message au Pr\u00e9sident du Comit\u00e9 des Nations Unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, M. Coly Seck, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien, c\u00e9l\u00e9br\u00e9e, cette ann\u00e9e, le 25 novembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les Marocains r\u00e9sidant en Europe,\nen Am\u00e9rique du Nord, en...", "mass": 5, "physics": false, "shape": "box", "title": "Les Marocains r\u00e9sidant en Europe, en Am\u00e9rique du Nord, en Australie, au Royaume-Uni et aux \u00c9mirats Arabes Unis peuvent d\u00e9sormais transf\u00e9rer des fonds directement depuis l\u2019a     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
