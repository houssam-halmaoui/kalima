": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies\npar la Direction g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le samedi 24 janvier 2026 \u2013 Chutes de neige localement importantes sur l\u2019Atlas, le Rif et les Haut plateaux orientaux \u00e0 partir de 1.200 m. \u2013 Pluies et averses orageuses sur le Tang\u00e9rois, Loukkos, le Rif, la M\u00e9diterran\u00e9e, le Nord de l\u2019Oriental, . [fr.hespress.com]\n-------------------------------------------------\nVoici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le samedi 24 janvier 2026. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La FIFA a annonc\u00e9, vendredi,\nune dotation record de 4...", "mass": 5, "physics": false, "shape": "box", "title": "La FIFA a annonc\u00e9, vendredi, une dotation record de 4 millions de dollars US pour les vainqueurs de la toute premi\u00e8re Coupe des Champions F\u00e9minine, qui aura lieu \u00e0 Londres du 28 janvier au 1er f\u00e9vrier 2026, avec la participation de l\u2019AS FAR. [fr.hespress.com]\n-------------------------------------------------\nLe club qui soul\u00e8vera le troph\u00e9e de la Coupe des Champions F\u00e9minine recevra un montant de USD 2,3 millions, tandis que le finaliste empochera USD 1 million, pr\u00e9cise un communiqu\u00e9 d. [lematin.ma]\n-------------------------------------------------\nLa FIFA a annonc\u00e9, vendredi, une dotation record de 4 millions de dollars US pour les vainqueurs de la toute premi\u00e8re Coupe des Champions F\u00e9minine, qui aura lieu \u00e0 Londres du 28 janvier au 1er f\u00e9vrier 2026, avec la participation de l\u2019AS FAR. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a r\u00e9agi,...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a r\u00e9agi, ce vendredi dans un communiqu\u00e9, aux accusations port\u00e9es par l\u2019hebdomadaire fran\u00e7ais \u201cLe Point\u201d concernant de pr\u00e9tendues attaques envers des commerces tenus par des ressortissants subsahariens en marge de la finale de la Coupe d\u2019Afrique des Nations. [telquel.ma]\n-------------------------------------------------\nL\u2019hebdomadaire fran\u00e7ais a avanc\u00e9 une s\u00e9rie d\u0027all\u00e9gations fallacieuses dans un article pr\u00e9tendant que plusieurs commerces appartenant \u00e0 des ressortissants subsahariens au Maroc auraient \u00e9t\u00e9 la cible d\u0027attaques, en marge de la finale de la CAN. [www.lavieeco.com]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) a d\u00e9menti cat\u00e9goriquement, vendredi, les all\u00e9gations fallacieuses rapport\u00e9es par l\u2019hebdomadaire fran\u00e7ais \"Le Point\" selon lesquelles plusieurs commerces appartenant \u00e0 des ressortissants subsahariens au Maroc auraient \u00e9t\u00e9 la cible d\u0027attaques et d\u0027incendies criminels, en marge de la finale de la Coupe d\u0027Afrique des Nations (CAN). [atlasinfo.fr]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a oppos\u00e9 un d\u00e9menti cat\u00e9gorique, vendredi 23 janvier 2026, aux informations relay\u00e9es par l\u2019hebdomadaire fran\u00e7ais Le Point, faisant \u00e9tat de pr\u00e9tendues attaques et d\u2019incendies criminels visant des commerces appartenant \u00e0 des ressortissants d\u2019Afrique subsaharienne au Maroc, en marge de la finale de la Coupe d\u2019Afrique des nations (CAN). [www.yabiladi.com]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) a formellement d\u00e9menti, vendredi, les informations publi\u00e9es par l\u2019hebdomadaire fran\u00e7ais Le Point, faisant \u00e9tat de pr\u00e9tendues attaques et d\u2019incendies criminels ayant vis\u00e9 des commerces appartenant \u00e0 des ressortissants subsahariens au Maroc, en marge de la finale de la Coupe d\u2019Afrique des Nations (CAN). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Conseil de gouvernement s\u2019est\ninform\u00e9, vendredi, d\u2019un accord entre...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement s\u2019est inform\u00e9, vendredi, d\u2019un accord entre les gouvernements du Royaume du Maroc et de la R\u00e9publique du Liberia dans le domaine de la coop\u00e9ration militaire, sign\u00e9 \u00e0 Rabat le 21 octobre 2025. [telquel.ma]\n-------------------------------------------------\nCet accord de coop\u00e9ration militaire entre les gouvernements du Royaume du Maroc et de la R\u00e9publique du Lib\u00e9ria a \u00e9t\u00e9 sign\u00e9 \u00e0 Rabat le 21 octobre 2025. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "De fortes pluies avec risque\nd\u2019orages, chutes de neige \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes pluies avec risque d\u2019orages, chutes de neige \u00e0 partir de 1.200 m, fortes rafales de vent et temps froid sont pr\u00e9vues de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes pluies intenses avec orages et risque de gr\u00eale, de chutes de neige \u00e0 partir de 1.200 m, de fortes rafales et temps froid sont pr\u00e9vues, de samedi \u00e0 lundi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie, \u00e0 travers un bulletin orange. [www.lavieeco.com]\n-------------------------------------------------\nDes pluies intenses avec orages et risque de gr\u00eale, de chutes de neige \u00e0 partir de 1.200 m, de fortes rafales et temps froid sont pr\u00e9vues, de samedi \u00e0 lundi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le trafic maritime entre le\nport espagnol de Tarifa et...", "mass": 5, "physics": false, "shape": "box", "title": "Le trafic maritime entre le port espagnol de Tarifa et celui de Tanger a de nouveau \u00e9t\u00e9 perturb\u00e9 vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la temp\u00eate Ingrid, qui touche la province de Cadix, ont indiqu\u00e9 les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [telquel.ma]\n-------------------------------------------------\nLe trafic maritime entre le port espagnol de Tarifa et celui de Tanger a de nouveau \u00e9t\u00e9 perturb\u00e9 vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la temp\u00eate Ingrid, qui touche la province de Cadix, ont indiqu\u00e9 les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "co <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
