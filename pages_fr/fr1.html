 26}, "group": 0, "id": "comm_label_0", "label": "Le minist\u00e8re de l\u2019Am\u00e9nagement du\nterritoire national, de l\u2019Urbanisme, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville a fait savoir que les livraisons de ciment ont atteint plus de 1,04 million de tonnes (MT) \u00e0 fin janvier 2025, en baisse de 18,77% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant. [fr.hespress.com]\n-------------------------------------------------\nLes livraisons de ciment ont atteint plus de 1,04 million de tonnes (MT) \u00e0 fin janvier 2025, en hausse de 18,77% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Un audit global, couvrant la\nstrat\u00e9gie, la gouvernance et les...", "mass": 5, "physics": false, "shape": "box", "title": "Un audit global, couvrant la strat\u00e9gie, la gouvernance et les activit\u00e9s op\u00e9rationnelles, doit permettre de red\u00e9finir le r\u00f4le de l\u2019ANAPEC dans un march\u00e9 du travail en mutation, caract\u00e9ris\u00e9 par des d\u00e9s\u00e9quilibres persistants entre l\u2019offre et la demande d\u2019emploi. [fr.hespress.com]\n-------------------------------------------------\nLe gouvernement s\u2019appr\u00eate \u00e0 engager une restructuration d\u2019envergure de l\u2019Agence nationale de promotion de l\u2019emploi et des comp\u00e9tences (ANAPEC). [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nfait le point, ce jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur a fait le point, ce jeudi 5 f\u00e9vrier, sur les op\u00e9rations d\u2019\u00e9vacuation des populations expos\u00e9es aux risques d\u2019inondations, et qui se chiffrent \u00e0 plus de 143.000 personnes. [fr.hespress.com]\n-------------------------------------------------\nCes interventions sont men\u00e9es en tenant compte des niveaux de danger et des d\u00e9g\u00e2ts potentiels, avec des moyens logistiques adapt\u00e9s pour garantir un relogement dans des conditions optimales. [www.yabiladi.com]\n-------------------------------------------------\nCes interventions d\u0027\u00e9vacuation progressive des habitants des communes expos\u00e9es aux risques d\u0027inondations se poursuivent, selon une approche prenant en consid\u00e9ration le degr\u00e9 de gravit\u00e9 et l\u0027ampleur des \u00e9ventuels d\u00e9g\u00e2ts. [www.lavieeco.com]\n-------------------------------------------------\nLes op\u00e9rations d\u2019\u00e9vacuation des habitants des communes expos\u00e9es aux risques d\u2019inondations ont permis, \u00e0 ce jour, de transporter et d\u2019\u00e9vacuer un total de 143.164 personnes, r\u00e9parties sur plusieurs provinces, dans le cadre des interventions pr\u00e9ventives visant \u00e0 prot\u00e9ger les vies et garantir la s\u00e9curit\u00e9 des citoyens, selon des donn\u00e9es actualis\u00e9es du minist\u00e8re de l\u2019Int\u00e9rieur. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Intervenant lors de la pr\u00e9sentation\ndu programme annuel des activit\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors de la pr\u00e9sentation du programme annuel des activit\u00e9s culturelles espagnoles pour l\u2019ann\u00e9e 2026, il a relev\u00e9 que cette base permettait d\u2019aller de l\u2019avant dans le ren. [lematin.ma]\n-------------------------------------------------\nEnrique Ojeda Vila : Le Maroc et l\u2019Espagne sont li\u00e9s par des relations culturelles enracin\u00e9es. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Lanc\u00e9 lors d\u2019un \u00e9v\u00e9nement organis\u00e9\npar Africa Climate Solutions, en...", "mass": 5, "physics": false, "shape": "box", "title": "Lanc\u00e9 lors d\u2019un \u00e9v\u00e9nement organis\u00e9 par Africa Climate Solutions, en partenariat avec le Cluster ENR, ce programme vise \u00e0 acc\u00e9l\u00e9rer le d\u00e9ploiement de 500 MWc de solaire photovolta\u00efq. [lematin.ma]\n-------------------------------------------------\nLe programme Solar Rooftop 500 (SR500), visant le d\u00e9ploiement de 500 MWc de solaire en toiture et la valorisation des \u00e9missions carbone \u00e9vit\u00e9es, a \u00e9t\u00e9 officiellement lanc\u00e9 mercredi \u00e0 Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Selon des sources bien inform\u00e9es,\nSaham Bank a r\u00e9cemment d\u00e9ploy\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Selon des sources bien inform\u00e9es, Saham Bank a r\u00e9cemment d\u00e9ploy\u00e9 un dispositif exceptionnel baptis\u00e9 \u00ab Op\u00e9ration Solidarit\u00e9 \u00bb, destin\u00e9 \u00e0 accompagner ses clients affect\u00e9s par les ave. [lematin.ma]\n-------------------------------------------------\nSelon des sources concordantes, Saham Bank a mis en place l\u2019\u00ab Op\u00e9ration Solidarit\u00e9 \u00bb, un dispositif exceptionnel et cibl\u00e9 destin\u00e9 \u00e0 accompagner les clients affect\u00e9s par les averses exceptionnelles et les inondations ayant r\u00e9cemment touch\u00e9 certaines r\u00e9gions du Royaume, exclusivement dans les zones officiellement reconnues comme sinistr\u00e9es. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019Acad\u00e9mie r\u00e9gionale de l\u2019\u00e9ducation et\nde la formation (AREF) de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Acad\u00e9mie r\u00e9gionale de l\u2019\u00e9ducation et de la formation (AREF) de Tanger-T\u00e9touan-Al Hoceima a exhort\u00e9 l\u2019ensemble des \u00e9tablissements scolaires de la r\u00e9gion, publics et priv\u00e9s, \u00e0 accueillir les \u00e9l\u00e8ves de la ville de Ksar El K\u00e9bir, ainsi que ceux des zones affect\u00e9es par les inondations. [telquel.ma]\n-------------------------------------------------\nLes cours resteront suspendus jeudi dans l\u2019ensemble des \u00e9tablissements scolaires relevant de l\u2019Acad\u00e9mie r\u00e9gionale de l\u2019\u00e9ducation et de la formation (AREF) de Tanger-T\u00e9touan-Al Hoce\u00efma. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Acad\u00e9mie r\u00e9gionale de l\u2019\u00e9ducation et de la formation (AREF) de Tanger-T\u00e9touan-Al Hoceima a exhort\u00e9 l\u2019ensemble des \u00e9tablissements scolaires de la r\u00e9gion, publics et priv\u00e9s, \u00e0 accueillir les \u00e9l\u00e8ves de la ville de Ksar El K\u00e9bir, ainsi que ceux des zones affect\u00e9es par les inondations. [maroc-diplomatique.net]\n-------------------------------------------------\nLes directions provinciales de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports de Tanger-Asilah, M\u2019diq-Fnideq, T\u00e9touan, Ouezzane, Chefchaouen, Al Hoceima, Fahs-Anjra et Larache ont soulign\u00e9, mercredi, que cette d\u00e9cision a \u00e9t\u00e9 prise . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Apr\u00e8s seize ans \u00e0 la\nt\u00eate de la Tr\u00e9sorerie g\u00e9n\u00e                     communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
