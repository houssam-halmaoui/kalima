 "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 10, "id": 302, "label": "Conflit dans le Golfe: Washington...", "shape": "dot", "size": 47, "title": "Conflit dans le Golfe: Washington dit examiner les propositions iraniennes\nSource: lnt.ma", "url": "https://lnt.ma/conflit-dans-le-golfe-washington-dit-examiner-les-propositions-iraniennes/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 13, "id": 303, "label": "Commerce de proximit\u00e9: Al Barid...", "shape": "dot", "size": 59, "title": "Commerce de proximit\u00e9: Al Barid Bank, Barid Cash et Chari s\u2019allient pour acc\u00e9l\u00e9rer la digitalisation\nSource: lnt.ma", "url": "https://lnt.ma/commerce-de-proximite-al-barid-bank-barid-cash-et-chari-sallient-pour-accelerer-la-digitalisation/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019ambassadeur, repr\u00e9sentant permanent du Maroc\naupr\u00e8s des Nations Unies, Omar...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a affirm\u00e9, devant le Conseil de s\u00e9curit\u00e9 lundi, que le Maroc d\u00e9nonce l\u2019instrumentation des d\u00e9troits et des voies maritimes comme cartes de pression et de chantage. [fr.hespress.com]\n-------------------------------------------------\nLors d\u2019un d\u00e9bat ouvert de haut niveau sur la s\u00e9curit\u00e9 maritime pr\u00e9sid\u00e9 par le ministre bahre\u00efni des Affaires \u00e9trang\u00e8res, Abdullatif bin Rashid Al-Zayani, dont le pays assume la pr\u00e9. [lematin.ma]\n-------------------------------------------------\nL\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a affirm\u00e9, lundi 27 avril devant le Conseil de s\u00e9curit\u00e9, que le Maroc d\u00e9nonce l\u2019instrumentalisation des d\u00e9troits [www.challenge.ma]\n-------------------------------------------------\nLors d\u2019un d\u00e9bat de haut niveau au Conseil de s\u00e9curit\u00e9 des Nations Unies, l\u2019ambassadeur du Maroc, Omar Hilale, a fermement d\u00e9nonc\u00e9 l\u2019utilisation des d\u00e9troits et des voies maritimes comme instruments de pression et de chantage. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a affirm\u00e9, devant le Conseil de s\u00e9curit\u00e9 lundi, que le Maroc d\u00e9nonce l\u2019instrumentation des d\u00e9troits et des voies maritimes comme cartes de pression et de chantage. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\nlors d\u2019un point de presse...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e lors d\u2019un point de presse avec le pr\u00e9sident du Conseil de la r\u00e9gion Souss Massa, Karim Achengli, en visite \u00e0 Las Palmas de Gran Canaria \u00e0 la t\u00eate d\u2019un. [lematin.ma]\n-------------------------------------------------\nLe gouvernement des Iles Canaries s\u2019aligne sur la position officielle de l\u2019Espagne, soutenant le plan marocain d\u2019autonomie comme la base la plus s\u00e9rieuse, r\u00e9aliste et cr\u00e9dible pour le r\u00e8glement du diff\u00e9rend autour du Sahara marocain, a affirm\u00e9, lundi \u00e0 Las Palmas de Gran Canaria, le pr\u00e9sident de l\u2019Ex\u00e9cutif, Fernando Clavijo. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Au si\u00e8ge de l\u2019\u00c9tat-Major de\nla Zone Sud \u00e0 Agadir,...", "mass": 5, "physics": false, "shape": "box", "title": "Au si\u00e8ge de l\u2019\u00c9tat-Major de la Zone Sud \u00e0 Agadir, une c\u00e9r\u00e9monie d\u2019ouverture a \u00e9t\u00e9 organis\u00e9e lundi annon\u00e7ant le lancement officiel de l\u2019exercice African Lion en pr\u00e9sence. [lematin.ma]\n-------------------------------------------------\nConform\u00e9ment aux Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, les Forces marocaines et am\u00e9ricaines co-organisent, jusqu\u2019au 08 mai, la 22\u00e8me \u00e9dition de l\u2019exercice \u00ab African Lion \u00bb. [aujourdhui.ma]\n-------------------------------------------------\nConform\u00e9ment aux Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, les Forces marocaines et am\u00e9ricaines co-organisent, jusqu\u2019au 08 mai, la 22\u00e8me \u00e9dition de l\u2019exercice \u201cAfrican Lion\u201d. [www.lereporter.ma]\n-------------------------------------------------\nLes Forces Arm\u00e9es Royales et les forces arm\u00e9es des \u00c9tats-Unis ont proc\u00e9d\u00e9, \u00e0 Agadir, au lancement officiel de la 22\u1d49 \u00e9dition de l\u2019African Lion, un exercice multinational interarm\u00e9es organis\u00e9 jusqu\u2019au 8 mai. [lnt.ma]\n-------------------------------------------------\nConform\u00e9ment aux Hautes instructions royales, les Forces marocaines et am\u00e9ricaines ont officiellement lanc\u00e9 lundi \u00e0 Agadir la 22e \u00e9dition de l\u2019exercice multinational \u00abAfrican Lion\u00bb, qui se d\u00e9roulera jusqu\u2019au 8 mai sur plusieurs sites du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Pour cette nouvelle \u00e9dition, le\nFestival Mawazine d\u00e9voile une premi\u00e8re...", "mass": 5, "physics": false, "shape": "box", "title": "Pour cette nouvelle \u00e9dition, le Festival Mawazine         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
