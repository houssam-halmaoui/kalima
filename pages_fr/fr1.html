\nconsacr\u00e9e \u00e0 l\u2019examen du recours...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019examen du recours au v\u00e9to par la Russie, l\u2019ambassadeur am\u00e9ricain \u00e0 l\u2019ONU, Mike Waltz, a rappel\u00e9 que les \u00c9tats-Unis avaient pr\u00e9s. [lematin.ma]\n-------------------------------------------------\nLes d\u00e9l\u00e9gations concern\u00e9es ont d\u00e9plor\u00e9 le rejet, le 30 octobre 2026, d\u2019un projet de r\u00e9solution am\u00e9ricain sur le Sahara marocain, qui avait obtenu le soutien de onze membres du Conseil de s\u00e9curit\u00e9. [maroc-diplomatique.net]\n-------------------------------------------------\nPlusieurs pays ont exprim\u00e9, mardi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale, leur regret face au veto de la Russie ayant emp\u00each\u00e9 l\u2019adoption, le 30 octobre 2026, du projet de r\u00e9solution am\u00e9ricain sur le Sahara marocain, soutenu par onze membres du Conseil de s\u00e9curit\u00e9 des Nations Unies. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Ces r\u00e9affirmations sont intervenues lors\nd\u2019une s\u00e9ance pl\u00e9ni\u00e8re de l\u2019Assembl\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Ces r\u00e9affirmations sont intervenues lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re de l\u2019Assembl\u00e9e consacr\u00e9e au veto russe, oppos\u00e9 le 30 octobre 2026 au Conseil de s\u00e9curit\u00e9 au projet de r\u00e9solution am\u00e9r. [lematin.ma]\n-------------------------------------------------\nLe plan d\u2019autonomie marocain a \u00e9t\u00e9 soutenu par une large majorit\u00e9 de pays, mardi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies, le consid\u00e9rant comme la seule base s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste pour le r\u00e8glement d\u00e9finitif du diff\u00e9rend artificiel autour du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Dans un communiqu\u00e9, le minist\u00e8re\ndes Habous et des Affaires...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, le minist\u00e8re des Habous et des Affaires islamiques indique avoir observ\u00e9 le croissant lunaire du mois de Joumada II ce mardi 29 Joumada I, correspondant au 10 n. [lematin.ma]\n-------------------------------------------------\nLe 1er Joumada II 1448 de l\u2019H\u00e9gire correspond au mercredi 11 novembre 2026 au Maroc, a annonc\u00e9 le minist\u00e8re des Habous et des Affaires islamiques. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La F\u00e9d\u00e9ration royale marocaine de\nfootball (FRMF) tiendra son Assembl\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration royale marocaine de football (FRMF) tiendra son Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective le 12 d\u00e9cembre 2026, ouvrant la voie \u00e0 une nouvelle \u00e9tape dans la gouvernance du football. [lematin.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale marocaine de football tiendra son Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective le 12 d\u00e9cembre prochain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Sahara \u00e9tait Marocain avant\nle 30 octobre, il est...", "mass": 5, "physics": false, "shape": "box", "title": "Le Sahara \u00e9tait Marocain avant le 30 octobre, il est encore plus marocain apr\u00e8s le 30 octobre, et il le restera jusqu\u2019\u00e0 la fin des temps, a d\u00e9clar\u00e9 l\u0027ambassadeur, R. [lematin.ma]\n-------------------------------------------------\nL\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019ONU, Omar Hilale, a r\u00e9affirm\u00e9, mardi 10 novembre 2026, devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e0 New York, la position marocaine sur le Sahara, lors d\u2019une r\u00e9union tenue apr\u00e8s le veto oppos\u00e9, le 30 octobre, \u00e0 un projet de r\u00e9solution sur ce diff\u00e9rend. [www.yabiladi.com]\n-------------------------------------------------\nIntervenant lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e \u00e0 l\u2019examen du recours au v\u00e9to par la Russie, M. Hilale soulign\u00e9 : \u00ab nous sommes ici parce que le 30 octobre 2026, un v\u00e9to a \u00e9t\u00e9 oppos\u00e9 \u00e0 la r\u00e9solution qui allait permettre le r\u00e8glement d\u00e9finitif du diff\u00e9rend r\u00e9gional du Sahara Marocain, sur la base de l\u2019autonomie sous souverainet\u00e9 marocaine \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLe Sahara \u00e9tait Marocain avant le 30 octobre, il est encore plus marocain apr\u00e8s le 30 octobre, et il le restera jusqu\u2019\u00e0 la fin des temps \u00bb, a d\u00e9clar\u00e9 l\u2019ambassadeur, Repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU, Omar Hilale, mardi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations Unies : Du haut de cette Auguste tribune je voudrais entamer [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "En c\u00e9dant pr\u00e8s de 500.000\nactions le 26 octobre, MC...", "mass": 5, "physics": false, "shape": "box", "title": "En c\u00e9dant pr\u00e8s de 500.000 actions le 26 octobre, MC IV Money S.A et Mediterrania Capital IV Morocco FPCC-RFA Compartiment 1 ram\u00e8nent leur participation commune \u00e0 environ 8,15 % du capital de Cash Plus. [telquel.ma]\n-------------------------------------------------\nDans         }
    }
</style>

<div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 11/11/2026 à 17h20, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 07h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
