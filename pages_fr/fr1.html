-edition-de-son-grand-prix-du-public/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La fin de mandat de\nla Mission des Nations unies...", "mass": 5, "physics": false, "shape": "box", "title": "La fin de mandat de la Mission des Nations unies pour l\u2019organisation d\u2019un r\u00e9f\u00e9rendum au Sahara occidental (Minurso), arriv\u00e9e \u00e0 \u00e9ch\u00e9ance le 31 octobre sans renouvellement, et l\u2019amorce de son d\u00e9sengagement sur le terrain ouvrent une s\u00e9quence in\u00e9dite sur le plan strat\u00e9gique et militaire. [fr.hespress.com]\n-------------------------------------------------\nL\u2019ONU a confirm\u00e9 dimanche \u00ab le d\u00e9but de la p\u00e9riode de liquidation \u00bb de la Mission des Nations unies pour l\u2019organisation d\u2019un r\u00e9f\u00e9rendum au Sahara occidental (MINURSO), dont le mandat n\u2019a pas \u00e9t\u00e9 renouvel\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Amal Mogador d\u2019Essaouira a remport\u00e9\ndimanche la Coupe du monde...", "mass": 5, "physics": false, "shape": "box", "title": "Amal Mogador d\u2019Essaouira a remport\u00e9 dimanche la Coupe du monde de beach soccer des clubs, apr\u00e8s sa victoire sur le Deportivo Luque\u00f1o du Paraguay sur le score de 11 buts \u00e0 8, lors de la finale qui s\u2019est d\u00e9roul\u00e9e dans la ville turque d\u2019Alanya. [fr.hespress.com]\n-------------------------------------------------\nAmal Mogador Essaouira a d\u00e9croch\u00e9 son premier titre en Coupe du monde des clubs de beach soccer apr\u00e8s avoir triomph\u00e9 lors de la derni\u00e8re \u00e9dition de la comp\u00e9tition dimanche. [www.yabiladi.com]\n-------------------------------------------------\nLe beach soccer marocain compte d\u00e9sormais un nouveau titre de r\u00e9f\u00e9rence sur la sc\u00e8ne internationale. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Des averses orageuses oscillant entre\n20 et 30 mm sont...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses oscillant entre 20 et 30 mm sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u0027Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag, a pr\u00e9cis\u00e9 la DGM d. [lematin.ma]\n-------------------------------------------------\nOscillant entre 20 et 30 mm, ces averses sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u2019Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag,. [telquel.ma]\n-------------------------------------------------\nDes pluies orageuses, pouvant s\u2019accompagner de gr\u00eale et de rafales de vent, sont pr\u00e9vues lundi 2 et mardi 3 novembre dans diff\u00e9rentes provinces du Maroc, selon un bulletin d\u2019alerte de vigilance orange de la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nOscillant entre 20 et 30 mm, ces averses sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u2019Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag, . [aujourdhui.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) annonce des averses orageuses accompagn\u00e9es de gr\u00eale et de rafales de vent dans plusieurs provinces du Maroc, lundi 2 et mardi 3 novembre 2026. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette ann\u00e9e, 10 films seront\nd\u00e9voil\u00e9s en premi\u00e8re mondiale, 12...", "mass": 5, "physics": false, "shape": "box", "title": "Cette ann\u00e9e, 10 films seront d\u00e9voil\u00e9s en premi\u00e8re mondiale, 12 ont \u00e9t\u00e9 accompagn\u00e9s par les Ateliers de l\u2019Atlas et 11 repr\u00e9senteront leur pays dans la course aux Oscars, indiquent l. [lematin.ma]\n-------------------------------------------------\nDix dentre eux seront pr\u00e9sent\u00e9s en avant-premi\u00e8re mondiale, douze ont b\u00e9n\u00e9fici\u00e9 du soutien des Ateliers de l\u2019Atlas, et onze repr\u00e9sentent leur pays dans la comp\u00e9tition pour les Oscars. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Apr\u00e8s 35 ann\u00e9es de pr\u00e9sence,\nla Minurso cesse ses op\u00e9rations...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s 35 ann\u00e9es de pr\u00e9sence, la Minurso cesse ses op\u00e9rations \u00e0 la suite de la non-reconduction de son mandat par le Conseil de s\u00e9curit\u00e9. [lematin.ma]\n-------------------------------------------------\nApr\u00e8s le non-renouvellement du mandat de la Minurso (la mission de l\u2019ONU au Sahara) par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, le Secr\u00e9taire g\u00e9n\u00e9ral des Nations Unies Antonio Guterres prend acte de la cessation de ses op\u00e9rations. [telquel.ma]\n-------------------------------------------------\nDimanche 1er novembre, les Nations Unies ont officiellement annonc\u00e9 la cessation des op\u00e9rations de la Mission, apr\u00e8s sa non-reconduction par le Conseil de s\u00e9curit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Direction g\u00e9n\u00e9rale de la\nS\u00fbret\u00e9 nationale (DGSN) a proc\u00e9d\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a proc\u00e9d\u00e9 \u00e0 la cr\u00e9ation d\u2019une nouvelle structure s\u00e9curitaire au sein de son si\u00e8ge central : un service d\u00e9di\u00e9 \u00e0 la gestion de la salle centrale pour les grands \u00e9v\u00e9nements et les crises. [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9 la cr\u00e9ation, au sein de son si\u00e8ge central, d\u2019un nouveau service charg\u00e9 de la gestion de la salle centrale des grands \u00e9. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le veto russe au projet\nam\u00e9ricain et l\u2019\u00e9chec du contre-projet...", "mass": 5, "physics": false, "shape": "box", "title": "Le veto russe au projet am\u00e9ricain et l\u2019\u00e9chec du contre-projet de Moscou ont r\u00e9v\u00e9l\u00e9 les limites d\u2019un processus onusien soumis aux rivalit\u00e9s des grandes puissances. [telquel.ma]\n-------------------------------------------------\nLe veto oppos\u00e9 vendredi par Moscou au projet am\u00e9ricain, suivi de l\u2019\u00e9chec de la contre-proposition russe, laisse la MINURSO sans nouveau mandat, une premi\u00e8re depuis sa cr\u00e9ation, en 1991. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Elle proposera une s\u00e9lection de\n76 films en provenance de...", "mass": 5, "physics": false, "shape": "box", "title": "Elle proposera une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis entre la comp\u00e9tition officielle, les s\u00e9ances de gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances jeune public \u0026. [telquel.ma]\n-------------------------------------------------\nAu total, 76 films venus de 39 pays seront pr\u00e9sent\u00e9s dans les diff\u00e9rentes sections, dont 10 en premi\u00e8re mondiale. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de sa 23e \u00e9dition qui se d\u00e9roulera du 20 au 28 novembre 2026, le Festival International du Film de Marrakech c\u00e9l\u00e8brera les cin\u00e9mas du monde \u00e0 travers une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis en plusieurs sections : la Comp\u00e9tition officielle, les s\u00e9ances de Gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances Jeune public \u0026 familles et les films projet\u00e9s dans le cadre des hommages. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La justice marocaine a condamn\u00e9\n\u00e0 quatre ans de prison...", "mass": 5, "physics": false, "shape": "box", "title": "La justice marocaine a condamn\u00e9 \u00e0 quatre ans de prison un jeune dessinateur de 22 ans, auteur de caricatures de Mohammed VI, pour \u00ab insulte \u00e0 l\u2019encontre du roi \u00bb, a indiqu\u00e9 son avocat dimanche. [telquel.ma]\n-------------------------------------------------\nLe dessinateur marocain, Yasser Mounbir, 22 ans, a \u00e9t\u00e9 condamn\u00e9 en premi\u00e8re instance \u00e0 Casablanca \u00e0 quatre ans de prison pour des caricatures du roi Mohammed VI publi\u00e9es sur Instagram, a indiqu\u00e9 son avocat dimanche 1er novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le juge d\u2019instruction pr\u00e8s la\nCour d\u2019appel d\u2019Agadir a ordonn\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le juge d\u2019instruction pr\u00e8s la Cour d\u2019appel d\u2019Agadir a ordonn\u00e9, dimanche, de placer en d\u00e9tention trois individus suite \u00e0 l\u2019incident au cours duquel un policier a \u00e9t\u00e9 percut\u00e9 \u00e0 Agadir lors de l\u2019exercice de ses fonctions et qui a failli lui co\u00fbter la vie, et ce \u00e0 l\u2019issue de                     continue;

                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
