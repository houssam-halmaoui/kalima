u00e0 Souiria K\u2019dima (province de Safi) d\u2019un port de p\u00eache de nouvelle g\u00e9n\u00e9ration, ont \u00e9t\u00e9 sign\u00e9s, mardi \u00e0 Rabat, dans le cadre du renforcement des relations de coop\u00e9ration entre le Royaume du Maroc et le Japon. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "D\u2019apr\u00e8s un communiqu\u00e9 publi\u00e9 \u00e0\nl\u2019issue de la vingt-deuxi\u00e8me r\u00e9union...", "mass": 5, "physics": false, "shape": "box", "title": "D\u2019apr\u00e8s un communiqu\u00e9 publi\u00e9 \u00e0 l\u2019issue de la vingt-deuxi\u00e8me r\u00e9union du Comit\u00e9, les primes \u00e9mises par le secteur ont atteint 53,6 milliards de dirhams (MMDH) . [fr.hespress.com]\n-------------------------------------------------\nLe Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), r\u00e9uni mardi au si\u00e8ge de Bank Al-Maghrib (BAM) \u00e0 Rabat, a examin\u00e9 et valid\u00e9 une nouvelle feuille de route visant \u00e0 consolider les acquis et \u00e0 renforcer le dispositif national de stabilit\u00e9 financi\u00e8re. [www.lavieeco.com]\n-------------------------------------------------\nLe secteur bancaire marocain a confirm\u00e9 le renforcement de ses fondamentaux financiers, selon le Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), qui a tenu mardi au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union. [maroc-diplomatique.net]\n-------------------------------------------------\nLe secteur bancaire marocain a confirm\u00e9 le renforcement de ses fondamentaux financiers, selon le Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), qui a tenu mardi au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union. [leseco.ma]\n-------------------------------------------------\nLe Comit\u00e9 de Coordination et de Surveillance des Risques Syst\u00e9miques (CCSRS) a tenu, le 23 d\u00e9cembre 2025 au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union, consacr\u00e9e \u00e0 l\u2019examen de la situation du syst\u00e8me financier national et \u00e0 l\u2019adoption d\u2019une nouvelle feuille de route en mati\u00e8re de stabilit\u00e9 financi\u00e8re. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La Tunisie s\u2019est impos\u00e9e facilement\n3 \u00e0 1 contre l\u2019Ouganda...", "mass": 5, "physics": false, "shape": "box", "title": "La Tunisie s\u2019est impos\u00e9e facilement 3 \u00e0 1 contre l\u2019Ouganda mardi \u00e0 Rabat pour son entr\u00e9e en lice dans la CAN 2025, avec notamment un doubl\u00e9 de son attaquant Elias Achouri. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection tunisienne a battu l\u2019\u00e9quipe ougandaise par 3 buts \u00e0 1, en match de la premi\u00e8re journ\u00e9e du groupe C de la Coupe d\u2019Afrique des Nations (CAN Maroc-2025), mardi au Stade Olympique \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection tunisienne a fait le plein de confiance avant d\u2019affronter le Nig\u00e9ria, vice champion de la pr\u00e9c\u00e9dente \u00e9dition, apr\u00e8s sa victoire sur l\u2019\u00e9quipe ougandaise par 3 buts \u00e0 1, en match de la premi\u00e8re journ\u00e9e du groupe C de la Coupe d\u2019Afrique des Nations (CAN Maroc-2025), mardi au Stade Olympique \u00e0 Rabat. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Quelque 4.952 familles de la\nr\u00e9gion F\u00e8s-Mekn\u00e8s ont b\u00e9n\u00e9fici\u00e9, lundi,...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 4.952 familles de la r\u00e9gion F\u00e8s-Mekn\u00e8s ont b\u00e9n\u00e9fici\u00e9, lundi, de l\u2019op\u00e9ration \u00bbGrand Froid \u00bb, men\u00e9e par la Fondation Mohammed V pour la Solidarit\u00e9, en application des hautes instructions royales visant \u00e0 apporter aide et assistance aux populations touch\u00e9es par la forte baisse des temp\u00e9ratures. [fr.hespress.com]\n-------------------------------------------------\nCes familles sont r\u00e9parties entre les provinces d\u2019El Hajeb (594 b\u00e9n\u00e9ficiaires issus de 19 douars dans 5 communes territoriales), Taounate (920 b\u00e9n\u00e9ficiaires dans la commune de Ouedka au niveau de deux douars), Taza (941 familles dans trois communes territoriales couvrant 30 douars), tandis que des aides ont \u00e9t\u00e9 apport\u00e9es \u00e0 1.397 familles dans la province de Boulemane, issues de 5 communes territoriales r\u00e9parties sur 19 douars. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le ministre de l\u2019\u00c9quipement et\nde l\u2019Eau, Nizar Baraka a...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka a annonc\u00e9 l\u2019acc\u00e9l\u00e9ration des projets de protection contre les inondations. [lematin.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a affirm\u00e9 lundi que son D\u00e9partement s\u2019emploie \u00e0 renforcer l\u2019anticipation et \u00e0 acc\u00e9l\u00e9rer la r\u00e9alisation des projets visant la protection contre les inondations. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Ainsi, des chutes de neige\n(20 \u00e0 30 cm) \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, des chutes de neige (20 \u00e0 30 cm) \u00e0 partir de 1.500 m sont atte                 }

        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
