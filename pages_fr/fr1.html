0e9 le parcours de ses joueurs et leur capacit\u00e9 \u00e0 encha\u00eener les succ\u00e8s dans les matches \u00e0 \u00e9limination directe. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine a \u00e9t\u00e9 battue par son homologue fran\u00e7aise (0-2), jeudi, en quart de finale de la Coupe du Monde 2026, disput\u00e9 au stade de Boston.Les buts des Bleus ont \u00e9t\u00e9 in. [lematin.ma]\n-------------------------------------------------\nLes buts des Bleus ont \u00e9t\u00e9 inscrits par Kylian Mbapp\u00e9 \u00e0 la 60e minute, avant qu\u2019Ousmane Demb\u00e9l\u00e9 ne double la mise \u00e0 la 66e minute. [telquel.ma]\n-------------------------------------------------\nUn revers difficile, mais qui ne doit pas occulter le parcours honorable d\u2019une s\u00e9lection marocaine ambitieuse, mobilis\u00e9e et port\u00e9e par un public venu en nombre tout au long de la comp\u00e9tition. [www.lavieeco.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine a \u00e9t\u00e9 battue par son homologue fran\u00e7aise (0-2), jeudi, en quart de finale de la Coupe du Monde 2026, disput\u00e9 au stade de Boston. [leseco.ma]\n-------------------------------------------------\nLe Maroc a vu son aventure en Coupe du monde 2026 s\u2019arr\u00eater en quart de finale apr\u00e8s une d\u00e9faite face \u00e0 la France (2-0), jeudi au stade de Boston. [atlasinfo.fr]\n-------------------------------------------------\nLe Maroc a vu son aventure en Coupe du monde 2026 s\u2019arr\u00eater en quart de finale apr\u00e8s une d\u00e9faite face \u00e0 la France (2-0), jeudi au stade de Boston. [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc a \u00e9t\u00e9 \u00e9limin\u00e9 de la Coupe du monde 2026 en quarts de finale apr\u00e8s sa d\u00e9faite face \u00e0 la France sur le score de 2 buts \u00e0 0, jeudi \u00e0 Boston, le m\u00eame qu\u2019en 2022 contre le m\u00eame adversaire. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Une reprise de la demande\nmondiale de p\u00e9trole \u00ab est...", "mass": 5, "physics": false, "shape": "box", "title": "Une reprise de la demande mondiale de p\u00e9trole \u00ab est en cours \u00bb, a indiqu\u00e9 vendredi l\u2019Agence internationale de l\u2019\u00e9nergie (AIE) qui am\u00e9liore l\u00e9g\u00e8rement sa pr\u00e9vision pour 2026. [fr.hespress.com]\n-------------------------------------------------\nDans son rapport mensuel, l\u0027agence de l\u0027\u00e9nergie de l\u0027OCDE estime que la consommation devrait augmenter par rapport \u00e0 son point bas de mai, port\u00e9e par. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019Office national des chemins de\nfer (ONCF) franchit une nouvelle...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des chemins de fer (ONCF) franchit une nouvelle \u00e9tape dans le d\u00e9ploiement du futur R\u00e9seau express r\u00e9gional (RER) de Casablanca. [fr.hespress.com]\n-------------------------------------------------\nLe vaste chantier du R\u00e9seau express r\u00e9gional (RER) qui sera op\u00e9rationnel avant 2030, franchit un nouveau cap avec le lancement par l\u0027ONCF de l\u0027appel d\u0027offres ouvert, structur\u00e9 en deux lots, pour la construction de neuf gares RER dans la capitale \u00e9conomique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette nomination porte \u00e0 17\nle nombre d\u2019associ\u00e9s de PwC...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nomination porte \u00e0 17 le nombre d\u2019associ\u00e9s de PwC au Maroc et illustre l\u2019engagement du cabinet \u00e0 promouvoir les talents en reconnaissant l\u2019expertise, l\u2019exp\u00e9rience et les comp. [lematin.ma]\n-------------------------------------------------\nPwC au Maroc annonce la cooptation d\u2019un nouvel associ\u00e9 au sein de son partnership : Ahmed El Filali, nomm\u00e9 Associ\u00e9 Deals Valuation \u0026 Business Modelling. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "West Med Container Terminal (WMCT),\nsoci\u00e9t\u00e9 concessionnaire du Terminal Est...", "mass": 5, "physics": false, "shape": "box", "title": "West Med Container Terminal (WMCT), soci\u00e9t\u00e9 concessionnaire du Terminal Est du port Nador West Med, a sign\u00e9, le 8 juillet 2026, un contrat de cr\u00e9dit long terme sous forme de Projec. [lematin.ma]\n-------------------------------------------------\nMarsa Maroc a annonc\u00e9 que West Med Container Terminal (WMCT), soci\u00e9t\u00e9 concessionnaire du Terminal Est du port Nador West Med, a sign\u00e9, mercredi, un contrat de cr\u00e9dit long terme sous forme de project finance, d\u2019un montant de 196,7 millions d\u2019euros avec un consortium de banques marocaines. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Premier ministre S\u00e9bastien Lecornu,\naccompagn\u00e9 par plusieurs membres de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Premier ministre S\u00e9bastien Lecornu, accompagn\u00e9 par plusieurs membres de son gouvernement, se rendra mercredi et jeudi prochains \u00e0 Rabat afin de rencontrer son homologue marocain, son premier d\u00e9placement \u00e0 l\u2019\u00e9tranger depuis sa prise de fonction. [telquel.ma]\n-------------------------------------------------\nS\u00e9bastien Lecornu effectuera, les 15 et 16 juillet, une visite officielle \u00e0 Rabat, son premier d\u00e9placement \u00e0 l\u2019\u00e9tranger depuis sa prise de fonction. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Il s\u2019agit du projet de\nd\u00e9cret n\u00b0 2.26.327 fixant le...", "mass": 5, "physics": false, "shape": "box", "title": "Il s\u2019agit du projet de d\u00e9cret n\u00b0 2.26.327 fixant le mod\u00e8le du cahier des charges relatif \u00e0 la candidature au poste de pr\u00e9sident d\u2019une. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, un projet de d\u00e9cret relatif au passeport biom\u00e9trique, pr\u00e9sent\u00e9 par le ministre de l\u2019Int\u00e9rieur. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le nouveau passeport biom\u00e9trique, dont\nle projet de d\u00e9cret a...", "mass": 5, "physics": false, "shape": "box", "title": "Le nouveau passeport biom\u00e9trique, dont le projet de d\u00e9cret a \u00e9t\u00e9 adopt\u00e9 jeudi en Conseil de gouvernement, garantit la s\u00e9curit\u00e9 et refl\u00e8te l\u2019identit\u00e9 marocaine dans ses multiples affluents, a soulign\u00e9 le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [telquel.ma]\n-------------------------------------------------\nEn r\u00e9ponse \u00e0 une question lors d\u0027un point de presse tenu \u00e0 l\u0027issue de la r\u00e9union hebdomadaire du Conseil de gouvernement, M. Baitas a expliqu\u00e9 que ce projet de d\u00e9cret, pr\u00e9sent\u00e9 par le ministre de l\u0027Int\u00e9rieur, s\u0027inscrit dans le cadre du renforcement des efforts visant \u00e0 prot\u00e9ger le passeport marocain par l\u0027adoption d\u0027une nouvelle g\u00e9n\u00e9ration de passeports biom\u00e9triques. [www.lavieeco.com]\n-------------------------------------------------\nLe nouveau passeport biom\u00e </script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
