e9gional de l\u2019Organisation mondiale de la sant\u00e9 (OMS) pour la M\u00e9diterran\u00e9e orientale a officiellement class\u00e9 le Maroc parmi les \u00ab pays. [lematin.ma]\n-------------------------------------------------\nLe comit\u00e9 r\u00e9gional de l\u2019Organisation mondiale de la Sant\u00e9 (OMS) pour la M\u00e9diterran\u00e9e orientale a officiellement reconnu que le Maroc est d\u00e9sormais class\u00e9 comme \"pays ma\u00eetrisant l\u2019h\u00e9patite B\", a annonc\u00e9 le minist\u00e8re de la Sant\u00e9 et de la Protection sociale. [www.lopinion.ma]\n-------------------------------------------------\nLe comit\u00e9 de l\u2019Organisation mondiale de la Sant\u00e9 (OMS) pour la M\u00e9diterran\u00e9e orientale a officiellement reconnu, lors de sa session tenue le 13 novembre 2025 au Caire, le [www.challenge.ma]\n-------------------------------------------------\nCette reconnaissance par l\u0027Organisation mondiale de la Sant\u00e9 (OMS) constitue une \u00e9tape majeure qui refl\u00e8te les progr\u00e8s significatifs r\u00e9alis\u00e9s par le Royaume en mati\u00e8re de pr\u00e9vention, de d\u00e9pistage et de prise en charge de l\u2019h\u00e9patite virale B. L\u2019article est apparu en premier sur . [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Chambre des repr\u00e9sentants a\nadopt\u00e9, vendredi lors d\u2019une s\u00e9ance...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a adopt\u00e9, vendredi lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re, \u00e0 la majorit\u00e9, le projet de loi de finances (PLF) n\u00b0 50.25 pour l\u2019ann\u00e9e budg\u00e9taire 2026. [telquel.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a approuv\u00e9, vendredi 14 novembre, \u00e0 la majorit\u00e9 le projet de loi de finances (PLF-2026) N\u00b0 50.25, au terme d\u2019une s\u00e9ance pl\u00e9ni\u00e8re qui a [www.challenge.ma]\n-------------------------------------------------\n\u200bLe PLF 2026 a re\u00e7u l\u0027aval de 165 d\u00e9put\u00e9s, avec l\u0027opposition de 55 d\u00e9put\u00e9s et 0 abstention. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La troisi\u00e8me et derni\u00e8re phase\nde vente des billets des...", "mass": 5, "physics": false, "shape": "box", "title": "La troisi\u00e8me et derni\u00e8re phase de vente des billets des matchs de la Coupe d\u2019Afrique des Nations 2025, organis\u00e9e au Maroc du 21 d\u00e9cembre au 18 janvier 2026 dans 9 stades, d\u00e9butera demain samedi. [telquel.ma]\n-------------------------------------------------\nLa troisi\u00e8me phase de vente des billets pour la Coupe d\u2019Afrique des Nations, (CAN) de football \u00ab Maroc-2025 \u00bb sera ouverte le 15 novembre, offrant ainsi une nouvelle opportunit\u00e9 aux supporters d\u2019Afrique et d\u2019ailleurs de r\u00e9server leurs places pour ce rendez-vous sportif majeur, a annonc\u00e9 la Conf\u00e9d\u00e9ration Africaine de Football (CAF). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Apr\u00e8s un d\u00e9marrage compliqu\u00e9 marqu\u00e9\npar une lourde d\u00e9faite contre...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s un d\u00e9marrage compliqu\u00e9 marqu\u00e9 par une lourde d\u00e9faite contre le Portugal, la s\u00e9lection marocaine des moins de 17 ans a su rebondir en \u00e9crasant la Nouvelle-Cal\u00e9donie (16-0) et se qualifier pour les seizi\u00e8mes de finale de la Coupe du Monde U17. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s deux d\u00e9faites inaugurales contre le Japon et le Portugal, les poulains de Nabil Baha ont marqu\u00e9 les esprits et l\u2019histoire contre la Nouvelle-Cal\u00e9donie (victoire 16-0). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La F\u00e9d\u00e9ration n\u00e9erlandaise de l\u2019industrie\ndu tourisme (ANVR) tient, pour...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration n\u00e9erlandaise de l\u2019industrie du tourisme (ANVR) tient, pour la premi\u00e8re fois, son Congr\u00e8s annuel au Maroc, en partenariat avec l\u2019Office national marocain du tourisme (ONMT). [www.challenge.ma]\n-------------------------------------------------\nUn \u00e9v\u00e9nement d\u2019envergure organis\u00e9 \u00e0 Rabat en partenariat avec l\u2019Office National Marocain du Tourisme, qui accueillera plus de 220 d\u00e9cideurs du tourisme n\u00e9erlandais. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Dislog Group, acteur industriel marocain\nde r\u00e9f\u00e9rence et pionnier de...", "mass": 5, "physics": false, "shape": "box", "title": "Dislog Group, acteur industriel marocain de r\u00e9f\u00e9rence et pionnier de l\u2019\u00e9conomie de la vie, annonce un partenariat avec le Festival International du Film de Marrakech (FIFM), l\u2019un des plus [www.challenge.ma]\n-------------------------------------------------\nDislog Group, acteur industriel marocain de premier plan et pionnier de l\u2019\u00e9conomie de la vie, annonce fi\u00e8rement son partenariat avec l\u2019un des \u00e9v\u00e9nements culturels les plus prestigieux du continent : le Festival International du Film de Marrakech (FIFM), qui se tiendra du 28 novembre au 6 d\u00e9cembre 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le ministre de l\u2019Agriculture, de\nla P\u00eache Maritime, du D\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Agriculture, de la P\u00eache Maritime, du D\u00e9veloppement Rural et des Eaux et For\u00eats, Ahmed El Bouari, a donn\u00e9, vendredi \u00e0 la commune de Ayacha (province de Larache), le coup d\u2019envoi officiel de la campagne agricole 2025/2026. [aujourdhui.ma]\n-------------------------------------------------\nLe ministre de l\u2019Agriculture, de la P\u00eache Maritime, du D\u00e9veloppement Rural et des Eaux et For\u00eats, Ahmed El Bouari, a donn\u00e9, vendredi \u00e0 la commune d\u2019Ayacha (province de Larache), le coup d\u2019envoi de la campagne agricole 2025/2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019\u00e9quipe nationale du Maroc des\nmoins de 17 ans s\u2019est...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale du Maroc des moins de 17 ans s\u2019est qualifi\u00e9e pour les huiti\u00e8mes de finale de la Coupe du Monde de football, apr\u00e8s sa victoire face \u00e0 l\u2019\u00e9quipe des Etats-Unis par 4 tirs au but \u00e0 3 (temps r\u00e9glementaire: 1-1), aux 16es de finale, vendredi \u00e0 l\u2019Aspire Zone \u00e0 Doha. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale marocaine des moins de 17 ans a valid\u00e9, vendredi \u00e0 Doha, son billet pour les huiti\u00e8mes de finale de la Coupe du monde U17, au terme d\u2019une rencontre intense face aux \u00c9tats-Unis, conclue par une victoire 4 tirs au but \u00e0 3 (1-1 \u00e0 la fin du temps r\u00e9glementaire). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Intervenant lors d\u2019un keynote dans\nle cadre du Forum MD...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors d\u2019un keynote dans le cadre     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
