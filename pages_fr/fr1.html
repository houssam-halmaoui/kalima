e Retraites et d\u2019Assurances (CNRA) et le R\u00e9gime Collectif d\u2019Allocation de Retraite (RCAR) ont annonc\u00e9, ce lundi, le paiement anticip\u00e9 exceptionnel, \u00e0 compter du 20 mai courant, des pensions mensuelles des r\u00e9gimes de retraite et des rentes accidents de la circulation (AC), \u00e0 l\u0027occasion de l\u0027A\u00efd Al-Adha de l\u0027ann\u00e9e 2026. [leseco.ma]\n-------------------------------------------------\nLa Caisse nationale de retraites et d\u2019assurances (CNRA) et le R\u00e9gime collectif d\u2019allocation de retraite (RCAR) ont annonc\u00e9 le versement anticip\u00e9, \u00e0 titre exceptionnel, des pensions mensuelles et des rentes li\u00e9es aux accidents de la circulation \u00e0 l\u2019occasion de l\u2019A\u00efd Al Adha 2026 . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019organisation souligne que les effets\nrestent in\u00e9gaux selon les r\u00e9gions...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019organisation souligne que les effets restent in\u00e9gaux selon les r\u00e9gions mais pourraient s\u2019aggraver en cas d\u2019escalade du conflit. [lematin.ma]\n-------------------------------------------------\nLa crise au Moyen-Orient fait peser de lourdes menaces sur les march\u00e9s du travail mondiaux, avec une hausse des risques pour l\u2019emploi, les revenus et les conditions de travail, particuli\u00e8rement dans les r\u00e9gions d\u00e9pendantes de l\u2019\u00e9nergie import\u00e9e, des migrations de travail et des envois de fonds, selon un rapport de l\u2019Organisation internationale du travail (OIT) . [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le partenariat entre Dolidol et\nMohamed Ouahbi accompagnera les prochaines...", "mass": 5, "physics": false, "shape": "box", "title": "Le parte che le minist\u00e8re des Habous et des Affaires islamiques. [leseco.ma]\n-------------------------------------------------\nLe 1er Dou Al Hijja de l\u2019ann\u00e9e 1447 de l\u2019H\u00e9gire correspond au lundi 18 mai 2026 et l\u2019A\u00efd Al Adha sera c\u00e9l\u00e9br\u00e9 le mercredi 27 mai, a annonc\u00e9 dimanche le minist\u00e8re des Habous et des Affaires islamiques. [atlasinfo.fr]\n-------------------------------------------------\nLe 1er Dou Al Hijja de l\u2019ann\u00e9e 1447 de l\u2019H\u00e9gire correspond au lundi 18 mai 2026 et l\u2019A\u00efd Al Adha sera c\u00e9l\u00e9br\u00e9 le mercredi 27 mai, a annonc\u00e9 dimanche le minist\u00e8re des Habous et des Affaires islamiques. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Royaume du Maroc a\nfait le choix d\u2019investir durablement...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a fait le choix d\u2019investir durablement dans le rayonnement de son institution polici\u00e8re, ses capacit\u00e9s op\u00e9rationnelles, la formation, la technologie et dans les conditions de travail de ses effectifs, a affirm\u00e9, dimanche \u00e0 Rabat, le pr\u00e9sident de l\u2019Organisation internationale de police criminelle (Interpol), Lucas Philippe. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident d\u2019Interpol souligne le renforcement de l\u2019institution polici\u00e8re marocaine sous l\u2019impulsion du Roi Mohammed V. Sous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, le Royaume du Maroc a d\u00e9cid\u00e9 d\u2019investir de mani\u00e8re durable dans le d\u00e9veloppement de son institution polici\u00e8re, en am\u00e9liorant ses capacit\u00e9s op\u00e9rationnelles, sa formation, sa technologie et les conditions de travail de ses agents, a d\u00e9clar\u00e9, dimanche \u00e0 Rabat, le pr\u00e9sident d\u2019Interpol, Lucas Philippe. [atlasinfo.fr]\n-------------------------------------------------\nSous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, le Royaume du Maroc a fait le choix d\u2019investir durablement dans le rayonnement de son institution polici\u00e8re, ses capacit\u00e9s op\u00e9rationnelles, la formation, la technologie et dans les conditions de travail de ses effectifs, a affirm\u00e9, dimanche \u00e0 Rabat, le pr\u00e9sident de l\u2019Organisation internationale de police criminelle [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Plac\u00e9e sous le patronage du\nroi Mohammed VI, la 24\u1d49...", "mass": 5, "physics": false, "shape": "box", "title": "Plac\u00e9e sous le patronage du roi Mohammed VI, la 24\u1d49 \u00e9dition du Festival International de Cin\u00e9ma d\u2019Animation de Mekn\u00e8s (FICAM) a officiellement ouvert ses portes ce vendredi 15 mai 2026, en pr\u00e9sence de r\u00e9alisateurs, artistes et producteurs marocains et \u00e9trangers. [telquel.ma]\n-------------------------------------------------\nSecr\u00e9taire g\u00e9n\u00e9rale de la Fondation A\u00efcha et directrice du Festival international du cin\u00e9ma d\u2019animation de Mekn\u00e8s (FICAM), Widad Charaibi revient aupr\u00e8s de Yabiladi sur un \u00e9l\u00e9ment cl\u00e9 de ce rendez-vous qu\u2019est l\u2019\u00e9ducation \u00e0 l\u2019image. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Entre investissements massifs, extension de\nl\u2019irrigation, renforcement des cha\u00eenes de...", "mass": 5, "physics": false, "shape": "box", "title": "Entre investissements massifs, extension de l\u2019irrigation, renforcement des cha\u00eenes de valeur et promotion de l\u2019entrepreneuriat rural, cette transformation vise \u00e0 construire une agriculture plus \"productive, r\u00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
