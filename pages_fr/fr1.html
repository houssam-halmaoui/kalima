t \u00e9t\u00e9 \u00e9pargn\u00e9e aux repr\u00e9sentants de la soci\u00e9t\u00e9 civile marocaine venus cont. [lematin.ma]\n-------------------------------------------------\nLa D\u00e9l\u00e9gation permanente du Maroc aupr\u00e8s de l\u2019UNESCO a d\u00e9nonc\u00e9 les agissements qualifi\u00e9s d\u2019\u00abinacceptables\u00bb de personnes se revendiquant de la d\u00e9l\u00e9gation alg\u00e9rienne lors des \u00e9v\u00e9nements culturels organis\u00e9s hier 20 mai au sein de l\u2019Organisation, \u00e0 l\u2019occasion de la Semaine Africaine. [telquel.ma]\n-------------------------------------------------\nLe Maroc hausse le ton contre l\u0027Alg\u00e9rie apr\u00e8s un incident survenu lors de la Semaine africaine \u00e0 l\u0027Unesco, et appelle l\u0027Organisation \u00e0 ne pas laisser ses espaces \u00eatre instrumentalis\u00e9s \u00e0 des fins politiques. [www.lavieeco.com]\n-------------------------------------------------\nLa D\u00e9l\u00e9gation permanente du Maroc aupr\u00e8s de l\u2019UNESCO a d\u00e9nonc\u00e9, jeudi, \"les agissements inacceptables de personnes se revendiquant de la d\u00e9l\u00e9gation alg\u00e9rienne\" lors des \u00e9v\u00e8nements culturels organis\u00e9s, mercredi, au sein de l\u2019organisation onusienne, \u00e0 l\u2019occasion de la Semaine africaine. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 travers plusieurs partenariats, sign\u00e9s\nmercredi en marge du Morocco...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 travers plusieurs partenariats, sign\u00e9s mercredi en marge du Morocco Gaming Expo (MGE), le minist\u00e8re de la Jeunesse, de la culture et de la communication ambitionne de structurer. [lematin.ma]\n-------------------------------------------------\nEn marge de la 3e \u00e9dition du Morocco Gaming Expo, le minist\u00e8re de la Jeunesse, de la Culture et de la Communication a sign\u00e9 mercredi \u00e0 Rabat quatre conventions de partenariat visant \u00e0 d\u00e9velopper les m\u00e9tiers du gaming, promouvoir les droits de l\u0027enfant et d\u00e9mocratiser l\u0027acc\u00e8s aux comp\u00e9tences num\u00e9riques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Marsa Maroc a enregistr\u00e9 une\nprogression de son activit\u00e9 au...", "mass": 5, "physics": false, "shape": "box", "title": "Marsa Maroc a enregistr\u00e9 une progression de son activit\u00e9 au premier trimestre 2026, avec un chiffre d\u2019affaires consolid\u00e9 atteignant 1,43 milliard de dirhams, en hausse de 12,1% par. [lematin.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) consolid\u00e9 du groupe Marsa Maroc a atteint plus de 1,43 milliard de dirhams (MMDH) au premier trimestre 2026, en progression 12,1% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Maroc et la C\u00f4te\nd\u2019Ivoire entretiennent une relation \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la C\u00f4te d\u2019Ivoire entretiennent une relation \u00ab exemplaire et de r\u00e9f\u00e9rence \u00bb en mati\u00e8re de coop\u00e9ration africaine, \u00e0 la faveur la sollicitude particuli\u00e8re du roi Mohammed VI et de Son Excellence le Pr\u00e9sident Alassane Ouattara, a indiqu\u00e9, jeudi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la C\u00f4te d\u2019Ivoire entretiennent une relation \u201cexemplaire et de r\u00e9f\u00e9rence\u201d en mati\u00e8re de coop\u00e9ration africaine, \u00e0 la faveur la sollicitude partic             setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
