\u1d49 journ\u00e9e de La Liga, a annonc\u00e9 le Comit\u00e9 de discipline de la F\u00e9d\u00e9ration espagnole de football (RFEF). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le groupe OCP, leader mondial\ndes solutions de nutrition des...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe OCP, leader mondial des solutions de nutrition des plantes et des engrais phosphat\u00e9s, et l\u2019Organisation des Nations Unies pour le d\u00e9veloppement industriel (ONUDI) ont sign\u00e9, r\u00e9cemment \u00e0 Riyad (Arabie Saoudite), un protocole d\u2019accord renouvelable de cinq ans visant \u00e0 \u00e9tablir un cadre de coop\u00e9ration strat\u00e9gique pour faire progresser la transformation agricole, le d\u00e9veloppement . [fr.hespress.com]\n-------------------------------------------------\nLe Groupe OCP et l\u2019Organisation des Nations Unies pour le d\u00e9veloppement industriel (ONUDI) ont sign\u00e9 lundi un protocole d\u2019accord renouvelable de cinq ans visant \u00e0 \u00e9tablir un cadre de coop\u00e9ration strat\u00e9gique pour faire progresser la transformation agricole, le d\u00e9veloppement industriel bas carbone, l\u2019innovation num\u00e9rique et le d\u00e9veloppement des comp\u00e9tences en Afrique et dans le monde.. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "B\u00e2tir un r\u00e9seau ferr\u00e9 s\u00fbr\net durable en Afrique passe...", "mass": 5, "physics": false, "shape": "box", "title": "B\u00e2tir un r\u00e9seau ferr\u00e9 s\u00fbr et durable en Afrique passe par des investissements renforc\u00e9s, une mont\u00e9e en comp\u00e9tence continue, un cadre r\u00e9glementaire consolid\u00e9 et surtout l\u2019ancrage d\u2019une v\u00e9ritable culture de s\u00fbret\u00e9, a soulign\u00e9, mercredi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de l\u2019Office national des chemins de fer (ONCF), Mohamed Rabie Khlie. [fr.hespress.com]\n-------------------------------------------------\nB\u00e2tir un r\u00e9seau ferr\u00e9 s\u00fbr et durable en Afrique passe par des investissements renforc\u00e9s, une mont\u00e9e en comp\u00e9tence continue, un cadre r\u00e9glementaire consolid\u00e9 et surtout l\u2019ancrage d\u2019une v\u00e9ritable culture de s\u00fbret\u00e9, a soulign\u00e9, mercredi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de l\u2019Office national des chemins de fer (ONCF), Mohamed Rabie Khlie. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "La s\u00e9ance des questions orales\n\u00e0 la Chambre des repr\u00e9sentants,...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9ance des questions orales \u00e0 la Chambre des repr\u00e9sentants, tenue lundi dernier , a \u00e9t\u00e9 marqu\u00e9e par de vives altercations opposant d\u2019un c\u00f4t\u00e9 les parlementaires du groupe de la Justice et D\u00e9veloppement (PJD) au ministre de la Justice, Abdellatif Ouahbi, et de l\u2019autre les d\u00e9put\u00e9s du m\u00eame groupe au pr\u00e9sident de s\u00e9ance. [fr.hespress.com]\n-------------------------------------------------\nUn vif \u00e9change entre le ministre de la Justice, Abdellatif Ouahbi, et des d\u00e9put\u00e9s du groupe PJD a failli d\u00e9g\u00e9n\u00e9rer en confrontation physique, obligeant la pr\u00e9sidence \u00e0 suspendre la s\u00e9ance. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc s\u2019affirme en mod\u00e8le\nen mati\u00e8re de dessalement de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc s\u2019affirme en mod\u00e8le en mati\u00e8re de dessalement de l\u2019eau de mer et de promotion des \u00e9nergies renouvelables, a soulign\u00e9 mardi \u00e0 Marrakech, l\u2019Envoy\u00e9e sp\u00e9ciale des Nations Unies pour l\u2019eau, Retno Marsudi. [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a eu mardi \u00e0 Marrakech, une s\u00e9rie d\u2019entretiens avec des responsables arabes et africains charg\u00e9s du secteur de l\u2019eau, en marge de la 19\u00e8me \u00e9dition du Congr\u00e8s mondial de l\u2019Eau, organis\u00e9e jusqu\u2019au 05 d\u00e9cembre sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre de l\u0027\u00c9quipement et de l\u0027Eau, Nizar Baraka, a eu, mercredi \u00e0 Marrakech, une s\u00e9rie d\u0027entretiens avec des ministres et des responsables arabes et africains, ax\u00e9s sur la coop\u00e9ration dans le domaine de l\u0027eau, en marge de la 19\u00e8me \u00e9dition du Congr\u00e8s mondial de l\u2019Eau, organis\u00e9e jusqu\u2019au 05 d\u00e9cembre sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La r\u00e9ussite et la reconnaissance\nque Raouya a obtenues, notamment...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9ussite et la reconnaissance que Raouya a obtenues, notamment par son hommage m\u00e9rit\u00e9 au Festival International du Film de Marrakech pour son parcours exceptionnel, ne tiennent. [lematin.ma]\n-------------------------------------------------\nLe Festival international du film de Marrakech (FIFM 2025) a rendu, mardi, un hommage \u00e9mouvant \u00e0 l\u2019artiste marocaine Fatima Harandi, connue sous le nom de Raouya. [www.yabiladi.com]\n-------------------------------------------------\nLe Festival International du Film de Marrakech a rendu, mardi soir, un hommage \u00e9mouvant \u00e0 l\u2019artiste marocaine Fatima Harandi, connue sous le nom de \u00ab Raouya \u00bb, en pr\u00e9sence de personnalit\u00e9s du monde de l\u2019art et des m\u00e9dias, du Maroc et d\u2019ailleurs. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "J\u0027ai envie de croire qu\u0027on\nva pouvoir conserver nos internationaux,...", "mass": 5, "physics": false, "shape": "box", "title": "J\u0027ai envie de croire qu\u0027on va pouvoir conserver nos internationaux, Nayef Aguerd et Aubameyang, jusqu\u0027au 15 d\u00e9cembre, a d\u00e9clar\u00e9 Mehdi Benatia mardi soir au. [lematin.ma]\n-------------------------------------------------\nL\u2019Olympique de Marseille souhaite garder son d\u00e9fenseur central Nayef Aguerd jusqu\u2019\u00e0 la mi-d\u00e9cembre, pour disputer le match tr\u00e8s attendu contre l\u2019AS Monaco, a indiqu\u00e9 son directeur sportif Medhi Benatia. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Soci\u00e9t\u00e9 des Boissons du\nMaroc revient dans le capital...", "mass": 5, "physics": false, "shape": "box", "title": "La Soci\u00e9t\u00e9 des Boissons du Maroc revient dans le capital des supermarch\u00e9s U. Dans le cadre de cette op\u00e9ration, SBM s\u0027est engag\u00e9e \u00e0 souscrire un montant de 50 millions de dirhams, correspondant \u00e0 33,33% du capital social d\u0027Africa Retail Market,. [lematin.ma]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 des boissons du Maroc (SBM) a sign\u00e9 un contrat de souscription avec Africa Retail Market (ARM), distributeur exclusif des enseignes Hyper U, Super U et U Express au Maroc, pour une prise de participation de 33,33 % du capital. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Direction de la prison\nlocale d\u0027Al Arjat 1 a...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction de la prison locale d\u0027Al Arjat 1 a affirm\u00e9 mercredi que le d\u00e9tenu \"M.Z\" n\u2019observe aucune gr\u00e8ve de la faim et que son \u00e9tat de sant\u00e9 est ordinaire. [www.lopinion.ma]\n-------------------------------------------------\nLa Direction de la prison locale d\u2019Al Arjat 1 a affirm\u00e9 mercredi que le d\u00e9tenu Moohamed Ziane n\u2019observe aucune gr\u00e8ve de la faim et que son \u00e9tat de sant\u00e9 est ordinaire. [telquel.ma]\n-------------------------------------------------\nDans une mise au point en r\u00e9action aux all\u00e9gations relay\u00e9es par un communiqu\u00e9 attribu\u00e9 \u00e0 la famille du d\u00e9tenu (M.Z), incarc\u00e9r\u00e9 dans la prison locale . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La r\u00e9alisatrice revient sur son\nrapport visc\u00e9ral aux lieux, sur...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9alisatrice revient sur son rapport visc\u00e9ral aux lieux, sur la puissance narrative des objets familiers, sur le travail de v\u00e9rit\u00e9 men\u00e9 avec Ahmed Boulane et Carmen Maura, et sur sa vision d\u2019un cin\u00e9ma affranchi des cat\u00e9gories de genre. [www.lopinion.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 au 22e Festival international du film de Marrakech (FIFM 2025), \u00abCalle M\u00e1laga\u00bb marque un tournant dans le cin\u00e9ma de Maryam Touzani. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La chambre criminelle de premi\u00e8re\ninstance de la Cour d\u2019appel...", "mass": 5, "physics": false, "shape": "box", "title": "La chambre criminelle de premi\u00e8re instance de la Cour d\u2019appel d\u2019El Jadida a rendu, tard mardi soir, des peines particuli\u00e8rement lourdes contre les six individus poursuivis pour \u201chattak \u2018ird qassir\u201d (attentat \u00e0 la pudeur d\u2019un mineur) lors du Moussem Moulay Abdellah Amghar. [telquel.ma]\n-------------------------------------------------\nLa Cour d\u2019appel d\u2019El Jadida a rendu un jugement p\u00e9nal de premi\u00e8re instance dans l\u2019affaire de viol avec violence sur un mineur survenue lors du Moussem de Moulay Abdellah Amghar l\u2019\u00e9t\u00e9 dernier. [fr.hespress.com]\n-------------------------------------------------\nLa chambre criminelle de la Cour dappel dEl Jadida a condamn\u00e9 \u00e0 15 ans de prison ferme, mardi soir, chacun des six accus\u00e9s impliqu\u00e9s dans le viol sur un mineur lors du moussem Moulay Abdallah Amghar. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Cette initiative vise \u00e0 renforcer\nles infrastructures sportives de la...", "mass": 5, "physics": false, "shape": "box", "title": "Cette initiative vise \u00e0 renforcer les infrastructures sportives de la ville, d\u00e9velopper ses \u00e9quipements publics, soutenir les activit\u00e9s sportives et culturelles dans les diff\u00e9rents arrondissements, et. [telquel.ma]\n-------------------------------------------------\nNomm\u00e9e \u00ab Casaregionsport \u00bb, la soci\u00e9t\u00e9 sera charg\u00e9e de renforcer les infrastructures sportives de la ville, d\u00e9velopper ses \u00e9quipements publics et de soutenir les activit\u00e9s sportives et culturelles dans les diff\u00e9rents arrondissements. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Cette liaison a\u00e9rienne, op\u00e9r\u00e9e \u00e0\nbord d\u2019un Airbus A320 \u00e0...", "mass": 5, "physic 2019\u00c9conomie sociale et solidaire. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "Le groupe M AUTOMOTIV vient\nfra\u00eechement d\u2019effectuer le lancement officiel...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe M AUTOMOTIV vient fra\u00eechement d\u2019effectuer le lancement officiel de la marque KGM (KG Mobility) au Maroc, marquant ainsi l\u2019arriv\u00e9e d\u2019un nouvel op\u00e9rateur sur le march\u00e9 automobile [www.challenge.ma]\n-------------------------------------------------\nLe groupe M-AUTOMOTIV, leader de la distribution de v\u00e9hicules neufs et d\u0027occasion au Maroc, annonce le lancement officiel de la marque KGM au Maroc, marquant ainsi l\u0027arriv\u00e9e d\u0027un nouvel acteur majeur sur le march\u00e9 automobile national. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "La marque ZYN sera pr\u00e9sente\nlors de certaines courses, \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La marque ZYN sera pr\u00e9sente lors de certaines courses, \u00e0 commencer par le Grand Prix de Formule 1 Etihad Airways Abu Dhabi 2025 Philip Morris International annonce aujourd\u2019hui l\u2019\u00e9largissement de son partenariat avec Scuderia Ferrari HP ainsi qu\u2019avec le Ferrari Challenge Trofeo Pirelli (le championnat monomarque cr\u00e9\u00e9 en 1993) pour la saison 2026 et les . [aujourdhui.ma]\n-------------------------------------------------\nPour c\u00e9l\u00e9brer ce moment, la marque ZYN appara\u00eetra pour la premi\u00e8re fois sur la livr\u00e9e des monoplaces Ferrari lors du Grand Prix d\u2019Abu Dhabi 2025, pr\u00e9vu le 7 d\u00e9cembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Pla istre du Transport et de la Logistique, Abdessamad Kayouh. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "CDG Capital a assur\u00e9 le\nrespect permanent de la limite...", "mass": 5, "physics": false, "shape": "box", "title": "CDG Capital a assur\u00e9 le respect permanent de la limite r\u00e9glementaire de son ratio de liquidit\u00e9 \u00e0 court terme (LCR), lequel s\u0027est \u00e9tabli \u00e0 162% \u00e0 fin septembre 2025. [www.lavieeco.com]\n-------------------------------------------------\nLe produit net bancaire (PNB) consolid\u00e9 de CDG Capital s\u0027est \u00e9tabli \u00e0 695 millions de dirhams (MDH) au terme du 3\u00e8me trimestre 2025, contre 275 MDH durant la m\u00eame p\u00e9riode une ann\u00e9e auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9\naux entreprises logistiques pour la...", "mass": 5, "physics": false, "shape": "box", "title": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \"PME Supply Chain\", a \u00e9t\u00e9 lanc\u00e9, mardi \u00e0 Rabat, avec un budget global de 100 millions de dirhams. [www.lavieeco.com]\n-------------------------------------------------\nLe nouveau programme d\u2019accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \u00ab PME Supply Chain \u00bb, a \u00e9t\u00e9 lanc\u00e9, mardi \u00e0 Rabat, avec un budget global de 100 millions de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019extradition par le Maroc de\ndeux fugitifs recherch\u00e9s en France...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019extradit     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
