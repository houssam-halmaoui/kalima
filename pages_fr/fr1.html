aroc a fait le choix d\u2019investir durablement dans le rayonnement de son institution polici\u00e8re, ses capacit\u00e9s op\u00e9rationnelles, la formation, la technologie et dans les conditions de travail de ses effectifs, a affirm\u00e9, dimanche \u00e0 Rabat, le pr\u00e9sident de l\u2019Organisation internationale de police criminelle (Interpol), Lucas Philippe. [telquel.ma]\n-------------------------------------------------\nSous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, le Royaume du Maroc a fait le choix d\u2019investir durablement dans le rayonnement de son institution polici\u00e8re, ses capacit\u00e9s op\u00e9rationnelles, la formation, la technologie et dans les conditions de travail de ses effectifs, a affirm\u00e9, dimanche \u00e0 Rabat, le pr\u00e9sident de l\u2019Organisation internationale de police criminelle [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "2\u00e8me journ\u00e9e La s\u00e9lection marocaine\nde football U17 s\u2019est relanc\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "2\u00e8me journ\u00e9e La s\u00e9lection marocaine de football U17 s\u2019est relanc\u00e9e en battant son homologue \u00e9thiopienne sur le score de 2 buts \u00e0 1, en match de la deuxi\u00e8me journ\u00e9e du groupe A de la Coupe d\u2019Afrique des Nations de football, disput\u00e9 samedi soir au Complexe Mohammed VI de football. [aujourdhui.ma]\n-------------------------------------------------\nLes Lionceaux de l\u2019Atlas affronteront l\u2019\u00c9gypte, pour leur dernier match de la phase de groupe de la CAN U17, mardi \u00e0 partir de 20 heures au Complexe Mohammed VI de football \u00e0 Sal\u00e9, dans un duel tr\u00e8s attendu. [fr.hespress.com]\n-------------------------------------------------\nLe duel entre le Maroc et l\u2019\u00c9gypte, programm\u00e9 ce mardi au Complexe Mohammed VI, s\u2019annonce d\u00e9cisif dans la course \u00e0 la premi\u00e8re place du groupe A de la CAN U17. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "En marge de la 79e\nAssembl\u00e9e mondiale de la sant\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "En marge de la 79e Assembl\u00e9e mondiale de la sant\u00e9, le ministre de la Sant\u00e9 et de la protection sociale, Amine Tehraoui, a sign\u00e9 trois protocoles d\u2019accord avec ses homologues indon\u00e9sien, libyen et letton. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, a sign\u00e9, lundi 18 mai \u00e0 Gen\u00e8ve, trois protocoles d\u2019accord avec ses homologues d\u2019Indon\u00e9sie, de Libye et de Lettonie, en marge de la 79e Assembl\u00e9e mondiale de la Sant\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "Entre investissements massifs, extension de\nl\u2019irrigation, renforcement des cha\u00eenes de...", "mass": 5, "physics": false, "shape": "box", "title": "Entre investissements massifs, extension de l\u2019irrigation, renforcement des cha\u00eenes de valeur et promotion de l\u2019entrepreneuriat rural, cette transformation vise \u00e0 construire une agriculture plus \"productive, r\u00e9siliente et inclusive\", capable de r\u00e9pondre aux d\u00e9fis climatiques et aux enjeux de d\u00e9veloppement durable. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc acc\u00e9l\u00e8re la transformation de son agriculture vers un mod\u00e8le plus r\u00e9silient, inclusif et durable, appuy\u00e9 par le Groupe de la Banque africaine de d\u00e9veloppement (BAD) qui accompagne plusieurs programmes structurants portant sur la modernisation des fili\u00e8res, la gestion de l\u0027eau, la r\u00e9silience climatique et l\u0027entrepreneuriat rural. [leseco.ma]\n-------------------------------------------------\nLe Maroc acc\u00e9l\u00e8re la transformation de son agriculture vers un mod\u00e8le plus r\u00e9silient, inclusif et durable, appuy\u00e9 par le Groupe de la Banque africaine de d\u00e9veloppement (BAD) qui accompagne plusieurs programmes structurants portant sur la modernisation des fili\u00e8res, la gestion de l\u2019eau, la r\u00e9silience climatique et l\u2019entrepreneuriat rural. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le directeur g\u00e9n\u00e9ral de la\nS\u00fbret\u00e9 nationale et de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, et l\u2019inspecteur g\u00e9n\u00e9ral de la Police nationale de la R\u00e9publique du Liberia, Gregory Coleman, ont sign\u00e9 lundi \u00e0 Rabat un m\u00e9morandum d\u2019entente portant sur le renforcement de la coop\u00e9ration s\u00e9curitaire entre les deux pays. [leseco.ma]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, et l\u2019Inspecteur g\u00e9n\u00e9ral de la Police nationale de la R\u00e9publique du Liberia, Gregory Coleman, ont sign\u00e9, lundi \u00e0 Rabat, un m\u00e9morandum d\u2019entente (MoU) portant sur le renforcement de la coop\u00e9ration s\u00e9curitaire. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Roi Mohammed VI a\nadress\u00e9 un message de f\u00e9licitations...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 Mehdi Taz         function positionCommunityLabels() {

            var communities = {};
