 un communiqu\u00e9, le Cabinet royal a annonc\u00e9 l\u2019instauration du 31 octobre comme nouvelle f\u00eate nationale baptis\u00e9e \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), en hommage au tournant historique de la cause nationale et \u00e0 la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9. [telquel.ma]\n-------------------------------------------------\nVoici un communiqu\u00e9 du Cabinet Royal : \u00ab Eu \u00e9gard au tournant historique qu\u2019a connu le processus de la Cause Nationale et ayant \u00e0 l\u2019esprit les d\u00e9veloppements d\u00e9cisifs apport\u00e9s par la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9, qui a fait l\u2019objet du r\u00e9cent Discours adress\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste et . [aujourdhui.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a d\u00e9cr\u00e9t\u00e9 que la journ\u00e9e du 31 octobre sera d\u00e9sormais c\u00e9l\u00e9br\u00e9e chaque ann\u00e9e comme \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), selon un communiqu\u00e9 du Cabinet Royal diffus\u00e9 mardi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Laurent Mauvignier a obtenu mardi\nle prix Goncourt, la plus...", "mass": 5, "physics": false, "shape": "box", "title": "Laurent Mauvignier a obtenu mardi le prix Goncourt, la plus prestigieuse r\u00e9compense litt\u00e9raire en France, pour \u00ab La maison vide \u00bb, aux \u00e9ditions de Minuit, une vaste fresque familiale de 750 pages. [fr.hespress.com]\n-------------------------------------------------\nLe prestigieux prix litt\u00e9raire fran\u00e7ais Goncourt pour l\u2019ann\u00e9e 2025 a \u00e9t\u00e9 attribu\u00e9 au romancier Laurent Mauvignier pour son oeuvre \u00ab La Maison vide \u00bb, a annonc\u00e9 mardi \u00e0 Paris, le pr\u00e9sident de l\u2019acad\u00e9mie du m\u00eame nom, Philippe Claudel. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Roi Mohammed VI a\nre\u00e7u, mardi au Palais Royal...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a re\u00e7u, mardi au Palais Royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [fr.hespress.com]\n-------------------------------------------------\nIl s\u2019agit de : Walis \u00e0 l\u2019Administration territoriale : -M. Khatib El Hebil, Wali de la r\u00e9gion Marrakech-Safi, gouverneur de la pr\u00e9fecture de Marrakech.-M. Khalid Ait Taleb, Wali de. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI, a re\u00e7u, mardi au Palais royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [telquel.ma]\n-------------------------------------------------\nLe roi Mohammed VI a re\u00e7u, mardi au Palais royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [www.yabiladi.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u, mardi au Palais Royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Cette convention vise la r\u00e9alisation\nde projets int\u00e9gr\u00e9s de production...", "mass": 5, "physics": false, "shape": "box", "title": "Cette convention vise la r\u00e9alisation de projets int\u00e9gr\u00e9s de production d\u2019\u00e9lectricit\u00e9 \u00e0 partir des \u00e9nergies renouvelables, dans le cadre des efforts du gouvernement pour renforcer l\u2019efficacit\u00e9 . [fr.hespress.com]\n- embl\u00e9matiques du septi\u00e8me art : Jodie Foster, Guillermo del Toro, Raouya et Hussein Fahmi. [www.lopinion.ma]\n-------------------------------------------------\nLa 22e \u00e9dition du Festival International du Film de Marrakech, qui se d\u00e9roulera du 28 novembre au 6 d\u00e9cembre 2025, c\u00e9l\u00e9brera quatre grandes figures du septi\u00e8me art : Jodie Foster, Guillermo del Toro, Raouya et Hussein Fahmi. [telquel.ma]\n-------------------------------------------------\nCette vingt-deuxi\u00e8me \u00e9dition, pr\u00e9vue du 28 novembre au 6 d\u00e9cembre, distinguera l\u2019actrice marocaine Raouya, l\u2019actrice et r\u00e9alisatrice am\u00e9ricaine Jodie Foster, le r\u00e9alisateur et sc\u00e9nariste mexicain Guillermo del Toro, ainsi que l\u2019acteur et producteur \u00e9gyptien Hussein Fahmi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Selon la note du Haut-Commissariat\nau Plan (HCP) relative au...", "mass": 5, "physics": false, "shape": "box", "title": "Selon la note du Haut-Commissariat au Plan (HCP) relative au troisi\u00e8me trimestre 2025, le ch\u00f4mage recule l\u00e9g\u00e8rement, mais le sous-emploi atteint son niveau le plus \u00e9lev\u00e9 depuis trois ans, traduisant les tensions persistantes sur la qualit\u00e9 de l\u2019emploi. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019\u00e9conomie marocaine a enregistr\u00e9 la cr\u00e9ation nette de 167.000 emplois entre le troisi\u00e8me trimestre de 2024 et celui de 2025, dont 164.000 en milieu urbain et 3.000 en milieu rural, selon la note d\u2019information du Haut-Commissariat au Plan (HCP) sur la situation du march\u00e9 du travail. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le ministre du Transport et\nde la Logistique, Abdessamad Kayouh,...", "ma orientations de SM le Roi Mohammed VI. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Plac\u00e9e sous le Haut Patronage\nde SM le Roi Mohammed...", "mass": 5, "physics": false, "shape": "box", "title": "Plac\u00e9e sous le Haut Patronage de SM le Roi Mohammed VI, la 22e \u00e9dition du salon Maroc in Mode (MIM) se tiendra du 5 au 7 novembre 2025 [www.challenge.ma]\n-------------------------------------------------\nPlac\u00e9e sous le Haut Patronage du Roi Mohammed VI, la 22\u1d49 \u00e9dition du salon Maroc in Mode (MIM) se tiendra du 5 au 7 novembre 2025 \u00e0 Casablanca, sous le th\u00e8me \u00ab Morocco, the Smart Hub for Global Textile \u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "\u00c0 l\u2019occasion du 50\u1d49 anniversaire\nde la Marche Verte, le...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 50\u1d49 anniversaire de la Marche Verte, le Groupe Barid Al-Maghrib c\u00e9l\u00e8bre cette \u00e9pop\u00e9e nationale \u00e0 travers l\u2019\u00e9mission sp\u00e9ciale d\u2019un bloc-feuillet et d\u2019un timbre-poste comm\u00e9moratifs, ainsi que l\u2019organisation d\u2019une exposition philat\u00e9lique plac\u00e9e sous le th\u00e8me :\u00ab La Marche Verte : M\u00e9moire et d\u00e9veloppement \u00e0 travers les timbres-poste \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nPar la m\u00eame occasion, Barid Al-Maghrib organise une exposition philat\u00e9lique sous le th\u00e8me \u00ab La Marche Verte : M\u00e9moire et d\u00e9veloppement \u00e0 travers les timbres-poste \u00bb, indique un communiqu\u00e9 du Groupe. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Pour le chef du gouvernement,\nla marque \"Made in Morocco\"...", "mass": 5, "physics": false, "shape": "box", "title": "Pour le chef du gouvernement, la marque \"Made in Morocco\" constitue d\u00e9sormais un levier strat\u00e9gique pour renforcer la position du Royaume comme destination industrielle comp\u00e9titive. [www.lavieeco.com]\n-------------------------------------------------\nLa marque \u201cMade in Morocco\u201d constitue d\u00e9sormais un levier strat\u00e9gique pour renforcer la position du Royaume comme destination industrielle comp\u00e9titive, a affirm\u00e9, lundi \u00e0 Rabat, le Chef du gouvernement, Aziz Akhannouch. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La c\u00e9r\u00e9monie a \u00e9t\u00e9 pr\u00e9sid\u00e9e\npar le chef du gouvernement,...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9r\u00e9monie a \u00e9t\u00e9 pr\u00e9sid\u00e9e par le chef du gouvernement, Aziz Akhannouch, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et du pr\u00e9sident de la CGEM, Chakib Alj. [www.lavieeco.com]\n-------------------------------------------------\nLa troisi\u00e8me \u00e9dition de la Journ\u00e9e nationale de l\u2019industrie, organis\u00e9e les 3 et 4 novembre 2025 \u00e0 Rabat, a \u00e9t\u00e9 marqu\u00e9e d\u00e8s sa premi\u00e8re journ\u00e9e par la signature de cinq conventions d\u00e9di\u00e9es \u00e0 la promotion de l\u2019industrie \u201cMade in Morocco\u201d. [leseco.ma]\n-------------------------------------------------\nEn marge de la 3\u00e8me Journ\u00e9e Nationale de l\u2019Industrie tenue les 3 et 4 novembre \u00e0 Rabat, M.Nassim Belkhayat, le patron de Neo Motors Maroc, a bien voulu nous expliquer les ambitions du groupe, mais surtout les enjeux de l\u2019industrie automobile \u00ab Made In Morocco \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Trois nageurs passionn\u00e9s, Dino Sebti,\nS\u00e9bastien Deflandre et Nadia Ben...", "mass": 5, "physics": false, "shape": "box", "title": "Trois nageurs passionn\u00e9s, Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 repousser leurs limites pour rendre hommage \u00e0 cet \u00e9v\u00e9nement historique \u00e0 travers une aventure in\u00e9dite : \u00ab La Nage Verte \u00bb. [leseco.ma]\n-------------------------------------------------\nTrois nageurs passionn\u00e9s: Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 relever un d\u00e9fi hors du commun : parcourir 100 kilom\u00e8tres \u00e0 la nage autour de la lagune, du 3 au 6 novembre . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Royaume du Maroc a\nsu mettre en place une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a su mettre en place une base industrielle solide dans le domaine de l\u2019a\u00e9ronautique pour jouer un r\u00f4le cl\u00e9 dans la cha\u00eene d\u2019approvisionnement mondiale, a relev\u00e9, lundi \u00e0 Rabat, le Secr\u00e9taire G\u00e9n\u00e9ral de l\u2019AACO (Arab Air Carriers\u2019 Organization \u2013 Organisation des transporteurs a\u00e9riens arabes), Abdul Wahab Teffaha. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc a su mettre en place une base industrielle solide dans le domaine de l\u2019a\u00e9ronautique pour jouer un r\u00f4le cl\u00e9 dans la cha\u00eene d\u2019approvisionnement mondiale, a relev\u00e9, lundi \u00e0 Rabat, le Secr\u00e9taire G\u00e9n\u00e9ral de l\u2019AACO (Arab Air Carriers\u2019 Organization \u2013 Organisation des transporteurs a\u00e9riens arabes), Abdul Wahab Teffaha. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": tr     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
