\nMen\u00e9e aupr\u00e8s de 150 dirigeants de PME, cette \u00e9tude d\u00e9montre que 48% d\u2019entre eux, ont d\u00e9j\u00e0 mis en place des initiatives, alors que 22% ont une strat\u00e9gie claire et l\u0027appliquent de mani\u00e8re active. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Des pluies fortes et des\naverses orageuses avec risque de...", "mass": 5, "physics": false, "shape": "box", "title": "Des pluies fortes et des averses orageuses avec risque de gr\u00eale (40 \u00e0 60 mm) sont attendues de lundi \u00e0 11h00 \u00e0 mardi \u00e0 12h00 dans les provinces de Tanger-Assilah, M\u0027Diq-Fnideq,. [lematin.ma]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale et de fortes rafales de vent sont pr\u00e9vues, lundi et mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), notamment dans le nord et dans les r\u00e9gions de l\u2019Oriental et F\u00e8s-Mekn\u00e8s. [telquel.ma]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale et de fortes rafales de vent sont pr\u00e9vues, lundi et mardi, dans plusieurs provinces du Maroc, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale et de fortes rafales de vent sont pr\u00e9vues, lundi et mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lereporter.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a annonc\u00e9, dans un bulletin d\u2019alerte de niveau de vigilance orange, la survenue de fortes pluies, d\u2019averses orageuses avec risque de gr\u00eale, de chutes de neige et de rafales de vent soutenues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Selon la mission diplomatique am\u00e9ricaine\naux Nations Unies, des d\u00e9l\u00e9gations...", "mass": 5, "physics": false, "shape": "box", "title": "Selon la mission diplomatique am\u00e9ricaine aux Nations Unies, des d\u00e9l\u00e9gations de haut niveau des \u00c9tats-Unis et de l\u2019ONU ont facilit\u00e9 des discussions, \u00e0 Madrid, avec le Maroc, le Polisario, l\u2019Alg\u00e9rie et la Mauritanie concernant la mise en \u0153uvre de la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies sur le Sahara. [telquel.ma]\n-------------------------------------------------\n\u00abConcernant le Sahara occidental, je tiens \u00e0 signaler que des d\u00e9l\u00e9gations de haut niveau des Nations unies, dont lEnvoy\u00e9 personnel du Secr\u00e9taire g\u00e9n\u00e9ral, Staffan de Mistura, ainsi que des repr\u00e9sentants des \u00c9tats-Unis, ont men\u00e9 des discussions \u00e0 Madrid avec des repr\u00e9sentants du Maroc, du Front Polisario, de lAlg\u00e9rie et de la Mauritanie. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le lancement du march\u00e9 \u00e0\nterme au Maroc est pr\u00e9vu...", "mass": 5, "physics": false, "shape": "box", "title": "Le lancement du march\u00e9 \u00e0 terme au Maroc est pr\u00e9vu le 6 avril 2026, a annonc\u00e9, lundi \u00e0 Casablanca, la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah. [telquel.ma]\n-------------------------------------------------\nLe lancement du march\u00e9 \u00e0 terme au Maroc est pr\u00e9vu le 6 avril 2026, a annonc\u00e9, ce lundi \u00e0 Casablanca, la ministre de l\u0027\u00c9conomie et des Finances, Nadia Fettah. [leseco.ma]\n-------------------------------------------------\nLe lancement du march\u00e9 \u00e0 terme au Maroc est pr\u00e9vu le 06 avril 2026, a annonc\u00e9, lundi \u00e0 Casablanca, la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, s\u2019entretiendra ce lundi \u00e0 18h \u00e0 Madrid avec son homologue espagnol, Jos\u00e9 Manuel Albares, dans le cadre d\u2019une s\u00e9rie de consultations diplomatiques qui se sont tenues ces derni\u00e8res 48 heures sur le dossier du Sahara marocain. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s avoir accueilli son homologue alg\u00e9rien Ahmed Attaf, le ministre espagnol des Affaires \u00e9trang\u00e8res, Jos\u00e9 Manuel Albares, a rencontr\u00e9 ce soir \u00e0 Madrid le chef de la diplomatie marocaine, Nasser Bourita. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Ainsi, l\u2019a\u00e9roport de la Cit\u00e9\ndes Aliz\u00e9s a accueilli 310.436...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, l\u2019a\u00e9roport de la Cit\u00e9 des Aliz\u00e9s a accueilli 310.436 passagers en 2025, contre 230.959 une ann\u00e9e auparavant, pr\u00e9cise l\u2019ONDA dans son bilan du trafic a\u00e9rien au titre de. [telquel.ma]\n-------------------------------------------------\nL\u0027A\u00e9roport international Essaouira-Mogador a enregistr\u00e9 une hausse de 34,4% du trafic des passagers en 2025 par rapport \u00e0 l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Office National des A\u00e9roports (ONDA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Maroc a \u00e9t\u00e9 battu\nlors des play-offs du groupe...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a \u00e9t\u00e9 battu lors des play-offs du groupe mondial I de la Coupe Davis de tennis, qui se sont d\u00e9roul\u00e9s les 7 et 8 f\u00e9vrier \u00e0 Casablanca, face \u00e0 une \u00e9quipe colombienne exp\u00e9riment\u00e9e et mieux class\u00e9e (1-3). [telquel.ma]\n-------------------------------------------------\nLe Maroc a sign\u00e9 une grande prestation lors des play-offs du groupe mondial I de la Coupe Davis de tennis, qui se sont d\u00e9roul\u00e9s les 7 et 8 f\u00e9vrier \u00e0 Casablanca, malgr\u00e9 une d\u00e9faite face \u00e0 une \u00e9quipe colombienne exp\u00e9riment\u00e9e et mieux class\u00e9e (1-3). [leseco.ma]\n-------------------------------------------------\nLe Maroc a sign\u00e9 une grande prestation lors des play-offs du groupe mondial I de la Coupe Davis de tennis, qui se sont d\u00e9roul\u00e9s les 7 et 8 f\u00e9vrier \u00e0 Casablanca, malgr\u00e9 une d\u00e9faite face \u00e0 une \u00e9quipe colombienne exp\u00e9riment\u00e9e et mieux class\u00e9e (1-3). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le barrage Mohammed V dans\nla r\u00e9gion de l\u2019Oriental affichait,...", "mass": 5, "physics": false, "shape": "box", "title": "Le barrage Mohammed V dans la r\u00e9gion de l\u2019Oriental affichait, au 6 f\u00e9vrier, un taux de remplissage exceptionnel de 86%, et ce \u00e0 la faveur des r\u00e9centes pr\u00e9cipitations qui ont renforc\u00e9 la s\u00e9curit\u00e9 hydrique dans la r\u00e9gion et raviv\u00e9 l\u2019espoir d\u2                     continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
