--------------\nSelon le palmar\u00e8s 2026 publi\u00e9 par le quotidien fran\u00e7ais Le Figaro, les classes pr\u00e9paratoires marocaines dominent largement le classement des meilleures pr\u00e9pas \u00e9trang\u00e8res qui pr\u00e9parent aux grandes \u00e9coles fran\u00e7aises. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans un avis pr\u00e9sent\u00e9 mardi\naux m\u00e9dias, Ahmed Rahhou, pr\u00e9sident...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un avis pr\u00e9sent\u00e9 mardi aux m\u00e9dias, Ahmed Rahhou, pr\u00e9sident du Conseil de la concurrence appelle \u00e0 une refonte progressive du mod\u00e8le de distribution du m\u00e9dicament, son diagnostic suscite une vive contestation parmi les pharmaciens. [leseco.ma]\n-------------------------------------------------\nLe Conseil de la concurrence appelle \u00e0 engager une r\u00e9flexion sur l\u2019\u00e9volution du mod\u00e8le \u00e9conomique des pharmacies au Maroc afin d\u2019am\u00e9liorer l\u2019acc\u00e8s aux m\u00e9dicaments et d\u2019adapter l\u2019organisation du secteur aux transformations en cours du syst\u00e8me de sant\u00e9, a expliqu\u00e9 le pr\u00e9sident du Conseil, Ahmed Rahhou, lors d\u2019un point de presse organis\u00e9 \u00e0 Rabat pour pr\u00e9senter . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Conseil sup\u00e9rieur des oul\u00e9mas\na publi\u00e9 un avis concernant...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil sup\u00e9rieur des oul\u00e9mas a publi\u00e9 un avis concernant Zakat Al Fitr pour l\u2019ann\u00e9e 1447/2026 fixant son montant \u00e0 25 DH, en indiquant que toute personne, qui le souhaite, peut aller au-del\u00e0 de ce montant. [atlasinfo.fr]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur des oul
