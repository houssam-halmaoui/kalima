s d\u2019absence. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Tandis que les stades marocains\nvibrent au rythme de la...", "mass": 5, "physics": false, "shape": "box", "title": "Tandis que les stades marocains vibrent au rythme de la Coupe d\u0027Afrique des nations 2025, Rabat devient ce m. [lematin.ma]\n-------------------------------------------------\nLes travaux du Symposium scientifique international consacr\u00e9 \u00e0 \u00ab La s\u00e9curit\u00e9 des grands \u00e9v\u00e9nements sportifs : d\u00e9fis s\u00e9curitaires et juridiques \u00e0 l\u2019\u00e8re des transformations num\u00e9riques \u00bb ont \u00e9t\u00e9 ouverts mercredi \u00e0 Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Alors que le Maroc accueille\nla Coupe d\u2019Afrique des Nations...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que le Maroc accueille la Coupe d\u2019Afrique des Nations 2025, l\u2019Office National Marocain du Tourisme (ONMT) transforme cette comp\u00e9tition en v\u00e9ritable vitrine de l\u2019offre tourist. [lematin.ma]\n-------------------------------------------------\nL\u0027Office national marocain du tourisme (ONMT) accueille, \u00e0 l\u0027occasion de la Coupe d\u0027Afrique des Nations (CAN) 2025, des prescripteurs de voyages, des tour-op\u00e9rateurs, des f\u00e9d\u00e9rations professionnelles et des journalistes internationaux pour d\u00e9couvrir \"Maroc, Terre de football\", un Maroc moderne, dynamique et pleinement capable d\u2019organiser des \u00e9v\u00e9nements sportifs internationaux majeurs. [www.lopinion.ma]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations bat son plein, l\u2019ONMT accueille prescripteurs de voyages, tour-op\u00e9rateurs, f\u00e9d\u00e9rations professionnelles et journalistes internationaux pour d\u00e9couvrir \u00ab Maroc, Terre de football [www.challenge.ma]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations bat son plein, l\u2019Office Nationale Marocain du Tourisme (ONMT) accueille prescripteurs de voyages, tour-op\u00e9rateurs, f\u00e9d\u00e9rations professionnelles et journalistes internationaux pour d\u00e9couvrir \u00ab Maroc, Terre de football \u00bb, un Maroc \u00e0 la pointe de l\u0027organisation des \u00e9v\u00e9nements sportifs internationaux majeurs. [atlasinfo.fr]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations 2025 se d\u00e9roule au Maroc, l\u2019Office National Marocain du Tourisme (ONMT) a engag\u00e9 un dispositif de promotion articul\u00e9 autour de l\u2019accueil de prescripteurs de voyages, de tour-op\u00e9rateurs, de f\u00e9d\u00e9rations professionnelles et de journalistes internationaux, invit\u00e9s \u00e0 d\u00e9couvrir la destination sous l\u2019angle du concept \u00ab Maroc, Terre de football . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le groupe Attijariwafa bank et\nl\u2019INSEA, Institut national de statistique...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Attijariwafa bank et l\u2019INSEA, Institut national de statistique et d\u2019\u00e9conomie appliqu\u00e9e, ont officialis\u00e9, lundi \u00e0 Casablanca, une nouvelle \u00e9tape de leur relation instituti. [lematin.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA ont sign\u00e9 le 29 d\u00e9cembre 2025 une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [telquel.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA donnent un nouvel \u00e9lan \u00e0 leur coop\u00e9ration par la signature d\u2019une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019Institut national de statistique et d\u2019\u00e9conomie appliqu\u00e9e (INSEA) ont sign\u00e9, le 29 d\u00e9cembre 2025 \u00e0 Casablanca, une convention de partenariat visant \u00e0 structurer et approfondir leur coop\u00e9ration en mati\u00e8re de formation et d\u2019insertion professionnelle. [lnt.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA donnent un nouvel \u00e9lan \u00e0 leur coop\u00e9ration par la signature d\u2019une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le sp\u00e9cialiste national de l\u2019exploitation\nportuaire, Marsa Maroc, envisage des...", "mass": 5, "physics": false, "shape": "box", "title": "Le sp\u00e9cialiste national de l\u2019exploitation portuaire, Marsa Maroc, envisage des extensions strat\u00e9giques des capacit\u00e9s de ses terminaux \u00e0 conteneurs TCE et TC3 au port de Casablanca.. [lematin.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur portuaire Marsa Maroc pr\u00e9voit une extension et un approfondissement de ses infrastructures au niveau des terminaux \u00e0 conteneurs TCE et TC3 au port de Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Dans un environnement international marqu\u00e9\npar le ralentissement du commerce...", "m             if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
