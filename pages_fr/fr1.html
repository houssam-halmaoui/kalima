019une maladie, a-t-on appris aupr\u00e8s de l\u2019Union des professions de l\u2019art dramatique. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "De fortes rafales de vent,\ndes chutes de neige \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes rafales de vent, des chutes de neige \u00e0 partir de 1.500m, des pluies et averses orageuses fortes et un temps froid sont pr\u00e9vus, de lundi \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nUn nouveau bulletin de la DGM annonce un temps froid, des averses orageuses, des chutes de neige \u00e0 partir de 1.500 m et des rafales de vent allant jusqu\u2019\u00e0 90 km/h, de lundi \u00e0 mercredi dans plusieurs provinces du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nDe fortes rafales de vent, des chutes de neige \u00e0 partir de 1500m, des pluies et averses orageuses fortes et un temps froid sont pr\u00e9vus, de lundi \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les op\u00e9rations sur le terrain\npour \u00e9vacuer et abriter les...", "mass": 5, "physics": false, "shape": "box", "title": "Les op\u00e9rations sur le terrain pour \u00e9vacuer et abriter les habitants touch\u00e9s par la crue de loued Loukkos, qui a submerg\u00e9 plusieurs quartiers de Ksar El Kebir, se poursuivent apr\u00e8s les pluies torrentielles qui ont frapp\u00e9 le nord du royaume ces derni\u00e8res semaines. [www.yabiladi.com]\n-------------------------------------------------\nUn certain nombre d\u2019habitants de Ksar El K\u00e9bir ont choisi de quitter provisoirement leurs domiciles, en pr\u00e9vision d\u2019une nouvelle mont\u00e9e des eaux de l\u2019oued Loukkos, suite aux fortes pr\u00e9cipitations attendues \u00e0 partir de lundi, susceptibles de provoquer l\u2019inondation de plusieurs quartiers de la ville. [maroc-diplomatique.net]\n-------------------------------------------------\nMobilisation : Depuis pr\u00e8s de 35 ans, la ville de Ksar El K\u00e9bir n\u2019a connu cette situation m\u00e9t\u00e9orologique exceptionnelle. [aujourdhui.ma]\n-------------------------------------------------\nLes op\u00e9rations de terrain se poursuivent pour l\u2019\u00e9vacuation et l\u2019h\u00e9bergement des personnes affect\u00e9es par la mont\u00e9e des eaux de l\u2019oued Loukkos et l\u2019inondation de plusieurs quartiers de la ville de Ksar El K\u00e9bir, suite aux pr\u00e9cipitations exceptionnelles enregistr\u00e9es dans le nord du Royaume au cours des derni\u00e8res semaines. [atlasinfo.fr]\n-------------------------------------------------\nUn certain nombre d\u2019habitants de Ksar El K\u00e9bir ont choisi de quitter provisoirement leurs domiciles, en pr\u00e9vision d\u2019une nouvelle mont\u00e9e des eaux de l\u2019oued Loukkos, suite aux fortes pr\u00e9cipitations attendues \u00e0 partir de lundi, susceptibles de provoquer l\u2019inondation de plusieurs quartiers de la ville. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le renforcement de la coop\u00e9ration\nentre les villes de Dakhla...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement de la coop\u00e9ration entre les villes de Dakhla et de Dreux (France), dans les domaines de l\u2019agriculture, de l\u2019aquaculture et des \u00e9nergies renouvelables, a \u00e9t\u00e9 au centre d\u2019une r\u00e9union tenue, samedi \u00e0 Dakhla. [maroc-diplomatique.net]\n----------------                                 scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
