capitaux (AMMC). [fr.hespress.com]\n-------------------------------------------------\nCes lev\u00e9es comprennent principalement les \u00e9missions de titres de cr\u00e9ances n\u00e9gociables (TCN) avec 39,29 MMDH et les \u00e9missions obligataires totalisant 14,35 MMDH, pr\u00e9cise l\u0027AMMC dans ses indicateurs mensuels du march\u00e9 des capitaux du mois de juin. [www.lavieeco.com]\n-------------------------------------------------\nLes lev\u00e9es de capitaux ont atteint plus de 55,04 milliards de dirhams (MMDH) \u00e0 fin juin 2026, contre 53,72 MMDH \u00e0 la m\u00eame p\u00e9riode de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon l\u0027Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Un juge espagnol ne peut\npas d\u00e9manteler le dispositif de...", "mass": 5, "physics": false, "shape": "box", "title": "Un juge espagnol ne peut pas d\u00e9manteler le dispositif de lutte contre l\u2019immigration clandestine et demander au Maroc d\u2019en assumer les cons\u00e9quences (source gouvernementale marocaine). [lematin.ma]\n-------------------------------------------------\nUne source gouvernementale marocaine a affirm\u00e9 lundi qu\u0027un juge espagnol ne peut pas d\u00e9manteler le dispositif de lutte contre l\u0027immigration clandestine et demander ensuite au Maroc d\u0027en assumer les cons\u00e9quences, imputant la crise \u00e0 Sebta \u00e0 une d\u00e9cision de justice espagnole. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Casablanca s\u0027appr\u00eate \u00e0 franchir une\nnouvelle \u00e9tape dans le d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca s\u0027appr\u00eate \u00e0 franchir une nouvelle \u00e9tape dans le d\u00e9veloppement de ses infrastructures fili\u00e8res de traite d\u0027\u00eatres humains. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur estime que les tentatives de passages irr\u00e9guliers observ\u00e9es r\u00e9cemment aux points de passage vers Sebta et Melilia r\u00e9sultent de plusieurs facteurs combin\u00e9s, parmi lesquels la diffusion d\u2019informations trompeuses sur les r\u00e9seaux sociaux, l\u2019action des r\u00e9seaux de traite des \u00eatres humains et des interpr\u00e9tations erron\u00e9es de certaines d\u00e9cisions juridiques espagnoles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Ainsi, une vague de chaleur\navec des temp\u00e9ratures oscillant entre...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de mardi \u00e0 jeudi, les provinces d\u2019Errachidia, Taroudant, Zagora, Tata, Assa-Zag, Es-Semara, Boujdour, . [fr.hespress.com]\n-------------------------------------------------\nAinsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de mardi \u00e0 jeudi, les provinces d\u0027Errachidia, Taroudant, Zagora, Tata, Assa-Zag, Es-S. [lematin.ma]\n-------------------------------------------------\nAinsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de mardi \u00e0 jeudi, les provinces d\u2019Errachidia, Taroudant, Zagora, Tata, Assa-Zag, Es-Semara, Boujdour,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le technicien capverdien quitte ainsi\nla s\u00e9lection du Cap-Vert apr\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "Le technicien capverdien quitte ainsi la s\u00e9lection du Cap-Vert apr\u00e8s a         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

            setTimeout(positionCommunityLabels, 50);
