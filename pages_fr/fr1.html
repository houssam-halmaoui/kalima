": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a fermement...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a fermement d\u00e9menti les rumeurs relay\u00e9es r\u00e9cemment sur les r\u00e9seaux sociaux faisant \u00e9tat de pr\u00e9tendus enl\u00e8vements d\u2019enfants assoc. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a d\u00e9menti cat\u00e9goriquement les rumeurs malveillantes portant atteinte au sentiment de s\u00e9curit\u00e9 des citoyens, qui relatent, d\u2019une mani\u00e8re alarmiste et d\u00e9form\u00e9e, des cas d\u2019enl\u00e8vement syst\u00e9matique d\u2019enfants en rapport avec un soi-disant trafic d\u2019organes. [telquel.ma]\n-------------------------------------------------\nMise au point : La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a d\u00e9menti cat\u00e9goriquement les rumeurs malveillantes portant atteinte au sentiment de s\u00e9curit\u00e9 des citoyens, qui relatent, d\u2019une mani\u00e8re alarmiste et d\u00e9form\u00e9e, des cas d\u2019enl\u00e8vements syst\u00e9matiques d\u2019enfants en rapport avec un soi-disant trafic d\u2019organes. [aujourdhui.ma]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) a d\u00e9menti cat\u00e9goriquement les rumeurs malveillantes portant atteinte au sentiment de s\u00e9curit\u00e9 des citoyens, qui relatent, d\u2019une mani\u00e8re alarmiste et d\u00e9form\u00e9e, des cas d\u2019enl\u00e8vement syst\u00e9matique d\u2019enfants en rapport avec un soi-disant trafic d\u2019organes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le d\u00e9partement de l\u2019Agriculture avance\ndans la mise en \u0153uvre...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9partement de l\u2019Agriculture avance dans la mise en \u0153uvre op\u00e9rationnelle du Registre national agricole (RNA), un dispositif destin\u00e9 \u00e0 structurer et centraliser les informations. [lematin.ma]\n-------------------------------------------------\nLe d\u00e9partement de l\u2019Agriculture poursuit le d\u00e9ploiement du Registre national agricole (RNA), un outil central de la strat\u00e9gie \u00abG\u00e9n\u00e9ration Green 2020-2030\u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc est devenu le\npremier importateur d\u2019armes en Afrique,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc est devenu le premier importateur d\u2019armes en Afrique, d\u00e9passant l\u2019Alg\u00e9rie, selon de nouvelles donn\u00e9es publi\u00e9es par l\u2019Institut international de recherche sur la paix de Stockholm (SIPRI). [telquel.ma]\n-------------------------------------------------\nSelon les derni\u00e8res donn\u00e9es publi\u00e9es par l\u2019Institut international de recherche sur la paix de Stockholm (SIPRI), le Maroc est d\u00e9sormais le premier importateur d\u2019armes en Afrique, d\u00e9passant l\u2019Alg\u00e9rie, qui occupait historiquement cette position. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Une nouvelle \u00e9tape dans le\nrenforcement de la s\u00e9curit\u00e9 hydrique...", "mass": 5, "physics": false, "shape": "box", "title": "Une nouvelle \u00e9tape dans le renforcement de la s\u00e9curit\u00e9 hydrique de la r\u00e9gion de F\u00e8s-Mekn\u00e8s vient d\u2019\u00eatre franchie, avec le lancement de l\u2019exploitation de la station de dessalement des eaux souterraines saum\u00e2tres de la ville de Missour. [telquel.ma]\n-------------------------------------------------\nUne nouvelle \u00e9tape dans le renforcement de la s\u00e9curit\u00e9 hydrique de la r\u00e9gion de F\u00e8s-Mekn\u00e8s vient d\u2019\u00eatre franchie, avec le lancement de l\u2019exploitation de la station de dessalement des eaux souterraines saum\u00e2tres de la ville de Missour. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Les cours du p\u00e9trole ont\nd\u00e9pass\u00e9 100 dollars pour la...", "mass": 5, "physics": false, "shape": "box", "title": "Les cours du p\u00e9trole ont d\u00e9pass\u00e9 100 dollars pour la premi\u00e8re fois depuis 2022, le march\u00e9 s\u2019inqui\u00e9tant de voir la guerre au Moyen-Orient se prolonger en raison des dommages sur les infrastructures \u00e9nerg\u00e9tiques et du blocage du d\u00e9troit d\u2019Ormuz. [telquel.ma]\n-------------------------------------------------\nLes cours du p\u00e9trole ont d\u00e9pass\u00e9 100 dollars pour la premi\u00e8re fois depuis 2022, le march\u00e9 s\u2019inqui\u00e9tant de voir la guerre au Moyen-Orient se prolonger en raison des dommages sur les infrastructures \u00e9nerg\u00e9tiques et du blocage du d\u00e9troit d\u2019Ormuz. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Des conventions de partenariat visant\nle d\u00e9veloppement de nouvelles zones...", "mass": 5, "physics": false, "shape": "box", "title": "Des conventions de partenariat visant le d\u00e9veloppement de nouvelles zones industrielles \u00e0 Mohammedia et Benslimane ont \u00e9t\u00e9 sign\u00e9es, samedi au si\u00e8ge de la Wilaya de la r\u00e9gion Casablanca-Settat, dans le cadre du renforcement de l\u2019offre fonci\u00e8re industrielle et de l\u2019attractivit\u00e9 \u00e9conomique de la r\u00e9gion. [telquel.             }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
