2019exportation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Banque africaine de d\u00e9veloppement\n(BAD) a annonc\u00e9, vendredi, la...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [telquel.ma]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement a annonc\u00e9, vendredi 30 octobre, avoir r\u00e9alis\u00e9 sa premi\u00e8re \u00e9mission obligataire en dirhams marocains, levant 1 milliard de dirhams \u00e0 travers un placement priv\u00e9 destin\u00e9 aux investisseurs qualifi\u00e9s. [www.yabiladi.com]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [aujourdhui.ma]\n-------------------------------------------------\nEffectu\u00e9e sous forme de placement priv\u00e9 aupr\u00e8s d\u2019investisseurs qualifi\u00e9s, cette op\u00e9ration marque une nouvelle \u00e9tape dans la diversification des instruments de financement de l\u2019institution au Maroc. [lnt.ma]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement (BAD) a annonc\u00e9, vendredi, la r\u00e9alisation avec succ\u00e8s sa premi\u00e8re \u00e9mission obligataire libell\u00e9e en dirham marocain (MAD), d\u2019un montant d\u2019un milliard de dirhams (MMDH). \u00ab [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_lab l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, qui repr\u00e9sente Sa Majest\u00e9 le Roi au troisi\u00e8me Sommet Russie-Afrique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00c0 lunanimit\u00e9, le Comit\u00e9 ex\u00e9cutif\nde la Conf\u00e9d\u00e9ration africaine de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 lunanimit\u00e9, le Comit\u00e9 ex\u00e9cutif de la Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9 de r\u00e9instaurer la tenue biennale de la Coupe dAfrique des nations, revenant ainsi sur la d\u00e9cision ant\u00e9rieure dorganiser le tournoi tous les quatre ans. [www.yabiladi.com]\n-------------------------------------------------\nLe Comit\u00e9 ex\u00e9cutif de la Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9 \u00e0 l\u2019unanimit\u00e9 ce jeudi de r\u00e9tablir l\u0027organisation de la Coupe d\u0027Afrique des Nations (CAN) tous les deux ans. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Ce d\u00e9ploiement marque une nouvelle\n\u00e9tape dans le renforcement de...", "mass": 5, "physics": false, "shape": "box", "title": "Ce d\u00e9ploiement marque une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne int\u00e9rieure et de l\u2019int\u00e9gration territoriale du Royaume. [aujourdhui.ma]\n-------------------------------------------------\nRoyal Air Maroc inaugurera, le 1er novembre, une nouvelle liaison a\u00e9rienne entre Casablanca et Essaouira. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Rallye Dakar         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

            setTimeout(positionCommunityLabels, 50);

            setTimeout(positionCommunityLabels, 50);
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                    node.scrollBy(0, 50);

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
