3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le s\u00e9lectionneur du S\u00e9n\u00e9gal, Pape\nThiaw a affirm\u00e9, samedi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur du S\u00e9n\u00e9gal, Pape Thiaw a affirm\u00e9, samedi \u00e0 Rabat, que le match contre le Maroc en finale de la Coupe d\u2019Afrique des nations (CAN-2025), pr\u00e9vu dimanche au Stade Prince Moulay Abdellah (20h00), sera difficile contre une \u00e9quipe qui propose un jeu de qualit\u00e9. [fr.hespress.com]\n-------------------------------------------------\nLes portes du stade Prince Moulay Abdellah \u00e0 Rabat seront ouvertes dimanche \u00e0 partir de 15h00 \u00e0 l\u2019occasion de la finale de la Coupe d\u2019Afrique des nations (CAN) [www.challenge.ma]\n-------------------------------------------------\nLes portes du stade Prince Moulay Abdellah \u00e0 Rabat seront ouvertes dimanche \u00e0 partir de 15h00 \u00e0 l\u2019occasion de la finale de la Coupe d\u2019Afrique des nations (CAN) devant opposer le Maroc au S\u00e9n\u00e9gal, annonce le Comit\u00e9 d\u2019organisation. [leseco.ma]\n-------------------------------------------------\nLe Complexe sportif Prince Moulay Abdellah de Rabat accueillera la finale de la 35\u00e8 \u00e9dition de la Coupe d\u2019Afrique des nations (CAN-2025), opposant le Maroc au S\u00e9n\u00e9gal, dans une affiche de tr\u00e8s haut niveau entre deux r\u00e9f\u00e9rences majeures du football continental. [atlasinfo.fr]\n-------------------------------------------------\nLes portes du stade Prince Moulay Abdellah \u00e0 Rabat seront ouvertes dimanche \u00e0 partir de 15h00 \u00e0 l\u2019occasion de la finale de la Coupe d\u2019Afrique des nations (CAN) devant opposer le Maroc au S\u00e9n\u00e9gal, annonce le Comit\u00e9 d\u2019organisation. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 la veille de la\nfinale de la Coupe d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la veille de la finale de la Coupe d\u2019Afrique des Nations 2025, dimanche face au S\u00e9n\u00e9gal, le s\u00e9lectionneur national Walid Regragui a livr\u00e9 un message clair ax\u00e9 sur la confiance, le travail et la coh\u00e9sion du groupe, mais aussi le soutien du public pour gravvir la derni\u00e8re marche vers le sacre continental. [fr.hespress.com]\n-------------------------------------------------\nS\u2019exprimant en conf\u00e9rence de presse d\u2019avant-finale, pr\u00e9vue dimanche au Stade Prince Moulay Abdellah (20h00), Walid Regragui a indiqu\u00e9 que le S\u00e9n\u00e9gal a jou\u00e9 quatre finales de. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur marocain Walid Regragui souligne que l\u2019\u00e9quipe nationale est pr\u00eate \u00e0 g\u00e9rer la pression du match \u00e0 domicile, tandis que les joueurs affichent leur d\u00e9termination \u00e0 \u00e9crire l\u2019histoire du football marocain. [www.lavieeco.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a affirm\u00e9, samedi \u00e0 Rabat, qu\u2019une seule marche s\u00e9pare l\u2019\u00e9quipe nationale du titre de la Coupe d\u2019Afrique des Nations (CAN-2025) face au S\u00e9n\u00e9gal, \u00ab l\u2019une des meilleures \u00e9quipes d\u2019Afrique \u00bb. [maroc-diplomatique.net]\n-------------------------------------------------\n\u00c0 la veille de la finale de la Coupe d\u2019Afrique des Nations 2025, programm\u00e9e dimanche au Stade Prince Moulay Abdellah de Rabat, le s\u00e9lectionneur national Walid Regragui a estim\u00e9 que l\u2019\u00e9quipe du Maroc se trouve \u00e0 une derni\u00e8re marche du sacre continental, face \u00e0 un adversaire qu\u2019il consid\u00e8re comme l\u2019un des plus redoutables du continent. [lnt.ma]"},         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
