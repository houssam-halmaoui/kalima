": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Une bombe diplomatique venue des\n\u00c9tats-Unis : dans une interview...", "mass": 5, "physics": false, "shape": "box", "title": "Une bombe diplomatique venue des \u00c9tats-Unis : dans une interview \u00e0 60 Minutes Overtime, Steve Witkoff, envoy\u00e9 sp\u00e9cial de Donald Trump pour le Moyen-Orient, a affirm\u00e9 que son \u00e9quipe travaillait \u00ab en ce moment m\u00eame \u00bb sur un accord de paix entre le Maroc et l\u2019Alg\u00e9rie, pr\u00e9voyant une signature \u00ab d\u2019ici 60 jours \u00bb. [telquel.ma]\n-------------------------------------------------\nDans une interview accord\u00e9e \u00e0 l\u2019\u00e9mission am\u00e9ricaine 60 Minutes, Steve Witkoff, envoy\u00e9 sp\u00e9cial du pr\u00e9sident des \u00c9tats-Unis pour le Moyen-Orient, a affirm\u00e9 que son \u00e9quipe travaille \u00abactivement\u00bb \u00e0 la conclusion d\u2019un r\u00e9chauffement des relations entre le Maroc et son voisin de l\u2019Est. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Royal Air Maroc a officiellement\ninaugur\u00e9, ce lundi 20 octobre...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc a officiellement inaugur\u00e9, ce lundi 20 octobre 2025, sa nouvelle liaison directe entre Casablanca et Munich. [www.challenge.ma]\n-------------------------------------------------\nLe vol inaugural de cette nouvelle desserte, op\u00e9r\u00e9e \u00e0 raison de deux fr\u00e9quences hebdomadaires (lundis et vendredis), a d\u00e9coll\u00e9 de l\u2019a\u00e9roport Mohammed V de Casablanca \u00e0 13h30 pour atterrir \u00e0 18h00 \u00e0 l\u2019a\u00e9roport international de Munich. [www.lavieeco.com]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale, Royal Air Maroc (RAM) a inaugur\u00e9, lundi, sa nouvelle ligne directe reliant Casablanca \u00e0 Munich, marquant une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne entre le Maroc et l\u2019Allemagne. [telquel.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale, Royal air Maroc (RAM) a inaugur\u00e9, lundi, sa nouvelle ligne directe reliant Casablanca \u00e0 Munich, marquant une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne entre le Maroc et l\u2019Allemagne. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 l\u2019issue du Conseil des\nministres pr\u00e9sid\u00e9 par Sa Majest\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019issue du Conseil des ministres pr\u00e9sid\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI, dimanche, le Conseil de gouvernement a tenu une r\u00e9union, sous la pr\u00e9sidence du Chef du gouvernement, Aziz Akhannouch, consacr\u00e9e \u00e0 l\u2019examen et \u00e0 l\u2019adoption du projet de loi de finances (PLF) pour l\u2019ann\u00e9e budg\u00e9taire 2026 et les textes l\u2019accompagnant. [aujourdhui.ma]\n-------------------------------------------------\n\u00c0 la suite du Conseil des ministres pr\u00e9sid\u00e9 dimanche par le Roi Mohammed VI, le Conseil de gouvernement s\u2019est r\u00e9uni sous la pr\u00e9sidence du Chef du gouvernement, Aziz Akhannouch, pour examiner et adopter le Projet de loi de finances (PLF) 2026 ainsi que plusieurs textes d\u2019application. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Manifestation Du 25 octobre au\n1er novembre 2025, la 30\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Manifestation Du 25 octobre au 1er novembre 2025, la 30\u00e8me \u00e9dition du Festival du cin\u00e9ma m\u00e9diterran\u00e9en de T\u00e9touan pr\u00e9sentera plus de 40 films issus de 15 pays m\u00e9diterran\u00e9ens, r\u00e9unissant fictions et documentaires, \u0153uvres r\u00e9centes et des films embl\u00e9matiques du patrimoine cin\u00e9matographique de la r\u00e9gion. [aujourdhui.ma]\n-------------------------------------------------\nLa 30\u1d49 \u00e9dition du Festival du Cin\u00e9ma M\u00e9diterran\u00e9en de T\u00e9touan d\u00e9voile sa s\u00e9lection officielle. [www.libe.ma]\n-------------------------------------------------\nDu 25 octobre au 1er novembre 2025, la 30\u1d49 \u00e9dition du Festival de Cin\u00e9ma M\u00e9diterran\u00e9en de T\u00e9touan pr\u00e9sentera plus de 40 films issus de 15 pays m\u00e9diterran\u00e9ens, r\u00e9unissant fictions et documentaires, \u0153uvres r\u00e9centes et des films embl\u00e9matiques du patrimoine cin\u00e9matographique de la r\u00e9gion. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "SM le Roi Mohammed VI\na adress\u00e9 un message de...", "mass": 5, "physics": false, "shape": "box", "title": "SM le Roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations aux membres de la s\u00e9lection nationale de football des moins de 20 ans suite \u00e0 leur sacre \u00e0 la Coupe du Monde organis\u00e9e au Chili. [www.lavieeco.com]\n-------------------------------------------------\nVoici les principaux titres d\u00e9velopp\u00e9s par la presse nationale de ce mardi 21 octobre 2025 Annahar almaghribia SM le Roi f\u00e9licite les membres de la s\u00e9lection nationale de football suite \u00e0 leur sacre au Mondial U-20 au Chili Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a adress\u00e9 un message de f\u00e9licitations aux membres . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Wali de Bank Al-Maghrib\n(BAM), Abdellatif Jouahri, a soulign\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Wali de Bank Al-Maghrib (BAM), Abdellatif Jouahri, a soulign\u00e9, lundi \u00e0 Rabat, la n\u00e9cessit\u00e9 pour la statistique officielle marocaine de s\u2019adapter aux mutations du contexte national et international, alors que le Royaume conna\u00eet \u00ab de profondes transitions structurelles \u00bb \u00e9conomiques et sociales. [lnt.ma]\n-------------------------------------------------\nLa statistique officielle marocaine, qui jouit d\u2019une forte cr\u00e9dibilit\u00e9 aupr\u00e8s des institutions internationales et des investisseurs, devrait \u00e9voluer et s\u2019adapter aux changements du contexte, d\u2019autant plus que le royaume a amorc\u00e9 de nombreuses transitions structurelles ces derni\u00e8res ann\u00e9es, a soulign\u00e9, lundi \u00e0 Rabat, le Wali de Bank Al-Maghrib (BAM), Abdellatif Jouahri. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019ancien pr\u00e9sident fran\u00e7ais Nicolas Sarkozy\na \u00e9t\u00e9 incarc\u00e9r\u00e9 mardi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ancien pr\u00e9sident fran\u00e7ais Nicolas Sarkozy a \u00e9t\u00e9 incarc\u00e9r\u00e9 mardi \u00e0 la prison parisienne de la Sant\u00e9, pr\u00e8s d\u2019un mois apr\u00e8s sa condamnation pour association de malfaiteurs dans l\u2019affaire du financement libyen de sa campagne pr\u00e9sidentielle, une d\u00e9tention in\u00e9dite dans l\u2019histoire de la R\u00e9publique. [fr.hespress.com]\n-------------------------------------------------\nL\u2019ancien pr\u00e9sident fran\u00e7ais Nicolas Sarkozy est arriv\u00e9, mardi 21 octobre dans la matin\u00e9e, \u00e0 la prison de la Sant\u00e9, dans le 14e arrondissement de Paris, pour y \u00eatre incarc\u00e9r\u00e9, pr\u00e8s d\u2019un mois apr\u00e8s sa condamnation pour association de malfaiteurs dans l\u2019affaire des soup\u00e7ons de financement libyen de sa campagne pr\u00e9sidentielle victorieuse en 2007. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019ancien pr\u00e9sident fran\u00e7ais Nicolas Sarkozy a \u00e9t\u00e9 incarc\u00e9r\u00e9 mardi \u00e0 la prison parisienne de la Sant\u00e9, pr\u00e8s d\u2019un mois apr\u00e8s sa condamnation pour association de malfaiteurs dans l\u2019affaire du financement libyen de sa campagne pr\u00e9sidentielle, une d\u00e9tention in\u00e9dite dans l\u2019histoire de la R\u00e9publique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies\npar la Direction g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le mardi 21 octobre 2025 \u2013 Temps relativement chaud sur le Sud-Est et l\u2019int\u00e9rieur des provinces sahariennes. [fr.hespress.com]\n-------------------------------------------------\nVoici les pr\u00e9visions m\u00e9t\u00e9orologiques \u00e9tablies par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le mardi 21 octobre 2025: \u2013 Temps relativement chaud sur le Sud-Est et l\u2019int\u00e9rieur des [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Fouzi Lekjaa, qui a re\u00e7u\nlundi au Complexe Mohammed VI...", "mass": 5, "physics": false, "shape": "box", "title": "Fouzi Lekjaa, qui a re\u00e7u lundi au Complexe Mohammed VI de football de Sal\u00e9, les membres de la d\u00e9l\u00e9gation nationale U17, a assur\u00e9 que la F\u00e9d\u00e9ration mettra \u00e0 la disposition de la d\u00e9l. [lematin.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la F\u00e9d\u00e9ration royale marocaine de football (FRMF), Fouzi Lekjaa, a appel\u00e9 les joueurs de la s\u00e9lection nationale U17, qui disputera les phases finales de la Coupe du monde U17 pr\u00e9vue au Qatar du 3 au 27 novembre prochain, \u00e0 donner le meilleur deux-m\u00eames pour d\u00e9crocher le titre. [www.yabiladi.com]\n-------------------------------------------------\nLe pr\u00e9sident de la F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF), Fouzi Lekjaa, a appel\u00e9 les joueurs de la s\u00e9lection nationale U17, qui disputera les phases finales de la Coupe du Monde U-17 pr\u00e9vue au Qatar du 3 au 27 novembre prochain, \u00e0 donner le meilleur d\u2019eux-m\u00eames pour d\u00e9crocher le titre. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019int\u00e9gration des industries du gaming\net du cin\u00e9ma constitue un...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019int\u00e9gration des industries du gaming et du cin\u00e9ma constitue un levier \u00e0 m\u00eame de stimuler l\u2019emploi des jeunes et de renforcer les industries culturelles nationales, a soulign\u00e9, lundi \u00e0 Tanger, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [telquel.ma]\n-------------------------------------------------\nL\u2019int\u00e9gration des industries du gaming et du cin\u00e9ma constitue un levier \u00e0 m\u00eame de stimuler l\u2019emploi des jeunes et de renforcer les industries culturelles nationales, a soulign\u00e9, lundi \u00e0 Tanger, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [lnt.ma]"}]);

        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
