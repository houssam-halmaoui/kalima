que europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) une lettre d\u2019intention portant sur la mise en place d\u2019un nouveau programme de financement de 250 millions d\u2019euros (environ 2,8 milliards de dirhams) destin\u00e9 \u00e0 soutenir la modernisation de ses infrastructures de production. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) va b\u00e9n\u00e9ficier d\u2019un financement de 250 millions d\u2019euros, soit pr\u00e8s de 2,8 milliards de dirhams, de la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD). [www.yabiladi.com]\n-------------------------------------------------\nCe nouveau programme financier est destin\u00e9 \u00e0 soutenir la modernisation de ses infrastructures de production d\u2019eau potable, \u00e0 d\u00e9ployer en deux tranches, assorti de subventions \u00e0 l\u2019investissement et \u00e0 la mise en place d\u2019assistance technique . [www.lavieeco.com]\n-------------------------------------------------\nLa Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) a annonc\u00e9 la signature d\u2019une lettre d\u2019intention avec l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) portant sur un financement de 250 millions d\u2019euros destin\u00e9 \u00e0 accompagner les investissements dans le secteur de l\u2019eau au Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 la suite des \u00e9lections\ndu Conseil National de l\u2019Ordre...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la suite des \u00e9lections du Conseil National de l\u2019Ordre des Experts-Comptables, tenues le 21 mai 2026, les onze membres nouvellement \u00e9lus se sont r\u00e9unis afin de compl\u00e9ter la gouver. [lematin.ma]\n----         observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
