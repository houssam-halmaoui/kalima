nement : Point de presse hebdomadaire de Mustapha Baitas, porte-parole du gouvernement. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "A l\u2019approche de la r\u00e9ouverture\ndu Grand Stade de Tanger,...", "mass": 5, "physics": false, "shape": "box", "title": "A l\u2019approche de la r\u00e9ouverture du Grand Stade de Tanger, la Soci\u00e9t\u00e9 de d\u00e9veloppement local Tanja Mobilit\u00e9 vient de d\u00e9voiler \u201cAcc\u00e8s Stade\u201d, un nouveau portail num\u00e9rique destin\u00e9 \u00e0 guider les spectateurs et \u00e0 optimiser les conditions d\u2019acc\u00e8s \u00e0 l\u2019enceinte sportive lors des matches et \u00e9v\u00e9nements majeurs. [fr.hespress.com]\n-------------------------------------------------\nD\u00e9ploy\u00e9 en amont du match inaugural Maroc\u2013Mozambique, pr\u00e9vu le 14 novembre (20h00), qui marquera la r\u00e9ouverture du Grand Stade apr\u00e8s sa modernisation, ce service innovant centralis. [lematin.ma]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 de d\u00e9veloppement local Tanja Mobilit\u00e9 a annonc\u00e9 le lancement officiel du site applicatif Acc\u00e8s Stade, destin\u00e9 \u00e0 informer en temps r\u00e9el les supporters et usagers sur les modalit\u00e9s d\u2019acc\u00e8s au Grand stade de Tanger lors des \u00e9v\u00e9nements sportifs majeurs. [www.yabiladi.com]\n-------------------------------------------------\nD\u00e9ploy\u00e9 en amont du match inaugural Maroc\u2013Mozambique, pr\u00e9vu le 14 novembre (20h00), qui marquera la r\u00e9ouverture de cette grande enceinte sportive apr\u00e8s sa modernisation, ce service innovant centralise toutes les informations pratiques pour se rendre au stade en toute simplicit\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 de d\u00e9veloppement local \u201cTanja Mobilit\u00e9\u201d a annonc\u00e9 le lancement officiel du site applicatif \u201cAcc\u00e8s Stade\u201d, destin\u00e9 \u00e0 informer en temps r\u00e9el les supporters et usagers sur les modalit\u00e9s d\u2019acc\u00e8s au Grand stade de Tanger lors des \u00e9v\u00e9nements sportifs majeurs. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "\u00c0 quelques semaines de son\nouverture, le Festival International du...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 quelques semaines de son ouverture, le Festival International du Film de Marrakech (FIFM) l\u00e8ve le voile sur la liste des personnalit\u00e9s attendues dans son programme \u00ab Conversations \u00bb, l\u2019un des rendez-vous les plus appr\u00e9ci\u00e9s du public et des cin\u00e9philes. [fr.hespress.com]\n-------------------------------------------------\nPas moins de seize cin\u00e9astes et com\u00e9diens rencontreront cin\u00e9philes et professionnels, dans le cadre du programme Conversations, inclus au 22e Festival international du film de Marrakech (du 28 novembre au 6 d\u00e9cembre 2025). [www.yabiladi.com]\n-------------------------------------------------\nSur sc\u00e8ne, celles et ceux qui, devant ou derri\u00e8re la cam\u00e9ra, font vivre le cin\u00e9ma sous toutes ses formes partagent avec le public ce qui fa\u00e7onne leur regard et nourrit leur engagement envers le 7\u1d49 art. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Il a \u00e9t\u00e9 proc\u00e9d\u00e9 aux\nnominations suivantes :Au niveau du...", "mass": 5, "physics": false, "shape": "box", "title": "Il a \u00e9t\u00e9 proc\u00e9d\u00e9 aux nominations suivantes :Au niveau du minist\u00e8re de l\u0027Equipement et de l\u0027Eau : Ithar Khairallah, directrice de l\u2019Agence du bassin hydraulique Oum Er Rbi. [lematin.ma]\n--------------------------------     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
