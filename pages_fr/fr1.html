des risques extr\u00eames et \u00e9lev\u00e9s d\u2019incendies de for\u00eats au Maroc, sur la p\u00e9riode entre les 11 et 15 septembres 2026. [www.yabiladi.com]\n-------------------------------------------------\nFahs-Anjra, Tanger-Assilah, Taounate, Taza, Essaouira et Taroudant figurent parmi les provinces les plus expos\u00e9es au risque d\u2019incendie de for\u00eat, selon le dernier bulletin de l\u2019ANEF couvrant la p\u00e9riode du 11 au 15 septembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les \u00e9l\u00e9ments de la s\u00e9lection\nmarocaine participant au Championnat d\u0027Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9l\u00e9ments de la s\u00e9lection marocaine participant au Championnat d\u0027Afrique de karat\u00e9, qui se d\u00e9roule en Alg\u00e9rie, ont r\u00e9colt\u00e9 trois m\u00e9dailles de bronze lors de la premi\u00e8re jour. [lematin.ma]\n-------------------------------------------------\nLes \u00e9l\u00e9ments de la s\u00e9lection marocaine participant au Championnat dAfrique de karat\u00e9, qui se d\u00e9roule en Alg\u00e9rie, ont r\u00e9colt\u00e9 trois m\u00e9dailles de bronze lors de la premi\u00e8re journ\u00e9e des comp\u00e9titions, qui ont d\u00e9but\u00e9 jeudi et se poursuivront jusqu\u00e0 dimanche prochain. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le minist\u00e8re de l\u2019\u00c9ducation nationale,\ndu Pr\u00e9scolaire et des Sports...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports appelle les \u00e9tablissements scolaires \u00e0 adapter l\u2019organisation du temps scolaire \u00e0 la nouvelle heure l\u00e9gale du Ro. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale a adress\u00e9 une correspondance \u00e0 l\u2019ensemble des responsables et des cadres \u00e9ducatifs concernant l\u2019adoption du nouvel horaire des cours, en parall\u00e8le de l\u2019entr\u00e9e en vigueur des dispositions de la nouvelle heure l\u00e9gale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 quelques jours des \u00e9lections\nl\u00e9gislatives, la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 quelques jours des \u00e9lections l\u00e9gislatives, la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) pose ses priorit\u00e9s pour la prochaine \u00e9tape \u00e9conomique. [lematin.ma]\n-------------------------------------------------\nLes grandes priorit\u00e9s de la rentr\u00e9e \u00e9conomique et les principaux enjeux du secteur priv\u00e9 national ont \u00e9t\u00e9 au c\u0153ur du deuxi\u00e8me conseil d\u2019administration de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) au titre du mandat 2026-2029, tenu jeudi \u00e0 Casablanca. [leseco.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a d\u00e9fini cinq priorit\u00e9s pour la rentr\u00e9e \u00e9conomique, allant de l\u2019acc\u00e9l\u00e9ration de l\u2019investissement priv\u00e9 au soutien aux TPME, en passant par l\u2019emploi et l\u2019internationalisation des entreprises. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Il s\u0027agit du projet de\nd\u00e9cret N\u00b0 2.26.98 modifiant le...", "mass": 5, "physics": false, "shape": "box", "title": "Il s\u0027agit du projet de d\u00e9cret N\u00b0 2.26.98 modifiant le d\u00e9cret N\u00b0 2.24.257 du 18 Ramadan 1445H (29 mars 2024), portant cr\u00e9ation de la ZAI El Jorf, et du projet de d\u00e9cret N\u00b0 2.26.. [lematin.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9 deux projets de d\u00e9cret relatifs \u00e0 la cr\u00e9ation des Zones d\u2019acc\u00e9l\u00e9ration industrielle (ZAI) El Jorf et Bouknadel 2, pr\u00e9sent\u00e9s par le ministre de l\u2019Industrie et du commerce. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, ce jeudi \u00e0 Rabat, deux projets de d\u00e9cret relatifs \u00e0 la cr\u00e9ation des Zones d\u2019acc\u00e9l\u00e9ration industrielle (ZAI) El Jorf et Bouknadel 2, pr\u00e9sent\u00e9s par le ministre de l\u0027Industrie et du Commerce. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La 31\u1d49 \u00e9dition du Festival\nde cin\u00e9ma M\u00e9diterran\u00e9en de T\u00e9touan...", "mass": 5, "physics": false, "shape": "box", "title": "La 31\u1d49 \u00e9dition du Festival de cin\u00e9ma M\u00e9diterran\u00e9en de T\u00e9touan (FCMT), pr\u00e9vue du 3 au 10 octobre 2026, annonce la composition de ses jurys et les personnalit\u00e9s qui seront mises \u00e0 l\u2019. [lematin.ma]\n-------------------------------------------------\n31\u00e8me \u00e9dition La 31\u00e8me \u00e9dition du Festival de cin\u00e9ma m\u00e9diterran\u00e9en de T\u00e9touan pr\u00e9vue du 3 au 10 octobre 2026, d\u00e9voile la composition de son jury officiel, pr\u00e9sid\u00e9 par l\u2019actrice espagnole M\u00f3nica L\u00f3pez, ainsi que celle du jury de la critique Mustapha Mesnaoui. [aujourdhui.ma]\n-------------------------------------------------\nLe Festival de Cin\u00e9ma M\u00e9diterran\u00e9en de T\u00e9touan l\u00e8vera le rideau sur sa 31e \u00e9dition du 3 au 10 octobre 2026, avec une programmation plac\u00e9e sous le signe de la diversi     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
