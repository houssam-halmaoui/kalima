, "group": 13, "id": 314, "label": "M. Lecornu r\u00e9affirme la position...", "shape": "dot", "size": 59, "title": "M. Lecornu r\u00e9affirme la position \u201cintangible\u201d de la France en faveur de la souverainet\u00e9 du Maroc sur son Sahara\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/m-lecornu-reaffirme-la-position-intangible-de-la-france-en-faveur-de-la-souverainete-du-maroc-sur-son-sahara/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 1, "id": 318, "label": "La RHN Maroc-France, une concr\u00e9tisation...", "shape": "dot", "size": 59, "title": "La RHN Maroc-France, une concr\u00e9tisation du nouveau cadre politique insuffl\u00e9 par SM le Roi et le Pr\u00e9sident Macron (M. Akhannouch)\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/la-rhn-maroc-france-une-concretisation-du-nouveau-cadre-politique-insuffle-par-sm-le-roi-et-le-president-macron-m-akhannouch/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "En marge de la R\u00e9union\nde haut niveau maroco-fran\u00e7aise, organis\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "En marge de la R\u00e9union de haut niveau maroco-fran\u00e7aise, organis\u00e9e ce jeudi \u00e0 Rabat, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, s\u2019est entretenu avec son homologue fran\u00e7aise, la ministre de la Culture Catherine P\u00e9gard. [fr.hespress.com]\n-------------------------------------------------\nLors de ces entretiens, les deux ministres ont mis en avant le niveau avanc\u00e9 des relations. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Chef du gouvernement, Aziz\nAkhannouch, s\u2019est entretenu, ce jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du gouvernement, Aziz Akhannouch, s\u2019est entretenu, ce jeudi 16 juillet \u00e0 Rabat, avec le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu, qui effectue une visite de travail au Maroc \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation fran\u00e7aise de haut niveau, dans le cadre des travaux de la 15\u00e8me R\u00e9union de Haut Niveau (RHN), Maroc -France. [fr.hespress.com]\n-------------------------------------------------\nLe Premier ministre fran\u00e7ais S\u00e9bastien Lecornu est arriv\u00e9, mercredi soir \u00e0 l\u2019a\u00e9roport de Rabat-Sal\u00e9, pour une visite officielle dans le Royaume au cours de laquelle il co-pr\u00e9sidera, jeudi, avec le Chef du gouvernement, Aziz Akhannouch, la 15\u00e8me session de la R\u00e9union de Haut Niveau Maroc-France. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a affirm\u00e9 que la 15e R\u00e9union de Haut Niveau (RHN) Maroc-France constitue la premi\u00e8re concr\u00e9tisation gouvernementale du nouveau cadre politique impuls\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI et le pr\u00e9sident fran\u00e7ais Emmanuel Macron, \u00e0 la suite de la visite d\u0027\u00c9tat de ce dernier au Maroc en octobre 2024. [www.lavieeco.com]\n-------------------------------------------------\n15e r\u00e9union de Haut Niveau Maroc-France : ce qu\u0027ont dit les responsables des deux pays \u00e0 Rabat. [lematin.ma]\n-------------------------------------------------\nPlusieurs accords de coop\u00e9ration et de partenariat ont \u00e9t\u00e9 sign\u00e9s, ce jeudi \u00e0 Rabat, entre le Maroc et la France dans le cadre de la 15e R\u00e9union de Haut Niveau (RHN), co-pr\u00e9sid\u00e9e par le chef du gouvernement, Aziz Akhannouch, et le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu. [leseco.ma]\n-------------------------------------------------\nPlusieurs accords de coop\u00e9ration et de partenariat ont \u00e9t\u00e9 sign\u00e9s, jeudi \u00e0 Rabat, entre le Maroc et la France dans le cadre de la 15e R\u00e9union de Haut Niveau (RHN), co-pr\u00e9sid\u00e9e par le Chef du Gouvernement, Aziz Akhannouch, et le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu. [atlasinfo.fr]\n-------------------------------------------------\nLa 15\u00e8 R\u00e9union de Haut Niveau (RHN) Maroc-France constitue \u00ab la premi\u00e8re concr\u00e9tisation gouvernementale du nouveau cadre politique \u00bb insuffl\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI, et le Pr\u00e9sident de la R\u00e9publique fran\u00e7aise, S.E.M. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 l\u2019occasion de l\u2019introduction en\nBourse de T2S Group, son...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019introduction en Bourse de T2S Group, son PDG, Abderraouf Sordo, d\u00e9taille les moteurs \u00e9conomiques qui soutiennent le d\u00e9veloppement du sp\u00e9cialiste marocain de la Me. [lematin.ma]\n-------------------------------------------------\nTrente-cinq ans de discr\u00e9tion, une fusion \u00e0 quatre entit\u00e9s, une ambition subsaharienne : \u00e0 la veille de l\u2019entr\u00e9e en Bourse de T2S Group Holding, le PDG du groupe sp\u00e9cialiste de la MedTech Abderraouf Sordo l\u00e8ve le voile sur les coulisses d\u2019une success story marocaine. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La GIZ Maroc (Agence de\ncoop\u00e9ration internationale allemande) a ouvert...", "mass": 5, "physics": false, "shape": "box", "title": "La GIZ Maroc (Agence de coop\u00e9ration internationale allemande) a ouvert les candidatures pour la premi\u00e8re cohorte d\u2019Accel\u2019Impact, un programme d\u2019accompagnement destin\u00e9 aux petites e. [lematin.ma]\n-------------------------------------------------\nJusqu\u2019au 7 ao\u00fbt 2026, les entreprises peuvent candidater \u00e0 Accel\u2019Impact, un programme d\u2019accompagnement de 24 mois port\u00e9 par GIZ Maroc, le minist\u00e8re de l\u2019Industrie et du Commerce et R\u00e9seau Entreprendre Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La croissance de l\u2019\u00e9conomie nationale\ndevrait s\u2019am\u00e9liorer \u00e0 5,4% au...", "mass": 5, "physics": false, "shape": "box", "title": "La croissance de l\u2019\u00e9conomie nationale devrait s\u2019am\u00e9liorer \u00e0 5,4% au troisi\u00e8me trimestre 2026, apr\u00e8s +4,8% au trimestre pr\u00e9c\u00e9dent, selon le r\u00e9cent point de conjoncture du Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nLa croissance de l\u2019\u00e9conomie nationale devrait s\u2019am\u00e9liorer \u00e0 5,4% au troisi\u00e8me trimestre 2026, apr\u00e8s +4,8% au trimestre pr\u00e9c\u00e9dent, selon le r\u00e9cent point de conjoncture du Haut-Commissariat au Plan (HCP). [aujourdhui.ma]\n-------------------------------------------------\nLa croissance de l\u2019\u00e9conomie nationale devrait s\u2019am\u00e9liorer \u00e0 5,4% au troisi\u00e8me trimestre 2026, apr\u00e8s +4,8% au trimestre pr\u00e9c\u00e9dent, selon le r\u00e9cent point de conjoncture du Haut-Commissariat au Plan (HCP). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Les a\u00e9roports du Royaume ont\naccueilli un total de 18.831.461...", "mass": 5, "physics": false, "shape": "box", "title": "Les a\u00e9roports du Royaume ont accueilli un total de 18.831.461 passagers au cours des six premiers mois de 2026, en hausse de 8,83% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon l\u2019Office national des a\u00e9roports (ONDA). [telquel.ma]\n-------------------------------------------------\nSelon les statistiques publi\u00e9es par l\u2019Office national des a\u00e9roports (ONDA), les plateformes a\u00e9roportuaires du Royaume ont accueilli 18 831 [www.challenge.ma]\n-------------------------------------------------\nLes a\u00e9roports du Royaume ont accueilli un total de 18.831.461 passagers au cours des six premiers mois de 2026, en hausse de 8,83% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon l\u0027Office national des a\u00e9roports (ONDA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 l\u2019entame de la saison\nestivale, l\u2019Association marocaine des professionnels...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019entame de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation renforc\u00e9e autour de la pr\u00e9vention, de la sensibilisation et du recours \u00e0 des prestations professionnelles encadr\u00e9es face aux risques li\u00e9s aux nuisibles, aux insectes vecteurs de maladies et aux esp\u00e8ces venimeuses. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019approche de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation accrue pour pr\u00e9venir les risques sanitaires li\u00e9s \u00e0 la prolif\u00e9ration des nuisibles et des esp\u00e8ces venimeuses. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Stellantis a lanc\u00e9, le 15\njuillet courant, la production de...", "mass": 5, "physics": false, "shape": "box", "title": "Stellantis a lanc\u00e9, le 15 juillet courant, la production de v\u00e9hicules reposant sur la plateforme Smart Car \u00e0 son usine de K\u00e9nitra. [www.challenge.ma]\n-------------------------------------------------\nMercredi, Ryad Mezzour, ministre marocain de l\u2019Industrie et du Commerce, a inaugur\u00e9 la production de deux nouveaux mod\u00e8les chez Stellantis, la Fiat Fastback et la Fiat Grizzly, \u00e0 l\u2019usine de K\u00e9nitra. [www.yabiladi.com]\n-------------------------------------------------\nStellantis a lanc\u00e9 mercredi la production de la plateforme \"Smart Car\" \u00e0 l\u0027Atlantic Free Zone de K\u00e9nitra. [atlasinfo.fr]\n-------------------------------------------------\nLe constructeur automobile a officiellement lanc\u00e9 la production de la plateforme Smart Car sur son site marocain, marquant l\u2019arriv\u00e9e de deux nouveaux mod\u00e8les Fiat \u2013 le Fastback et le Grizzly \u2013 et renfor\u00e7ant le r\u00f4le du Royaume dans la strat\u00e9gie industrielle du groupe . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Importateur exclusif de BYD au\nMaroc, Auto Nejma enrichit son...", "mass": 5, "physics": false, "shape": "box", "title": "Importateur exclusif de BYD au Maroc, Auto Nejma enrichit son portefeuille avec Denza, la marque premium du groupe automobile chinois. [www.challenge.ma]\n-------------------------------------------------\nImportateur exclusif de BYD au Maroc, Auto Nejma ouvre un nouveau front sur le segment premium avec l\u2019arriv\u00e9e de DENZA, la marque haut de gamme du groupe BYD : quatre mod\u00e8les, deux showrooms d\u00e9di\u00e9s \u00e0 Casablanca et \u00e0 Rabat, et surtout une technologie de recharge d\u2019exception, le Flash Charging. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nboucl\u00e9 la r\u00e9vision des l         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                scrollUp.className = 'scroll-up';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
