r\u00e9side une r\u00e9union consacr\u00e9e \u00e0 la question du pouvoir d\u2019achat\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/au-royaume/la-cheffe-du-gouvernement-preside-une-reunion-consacree-a-la-question-du-pouvoir-dachat/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 15, "id": 239, "label": "March\u00e9 britannique : L\u2019ONMT d\u00e9ploie...", "shape": "dot", "size": 47, "title": "March\u00e9 britannique : L\u2019ONMT d\u00e9ploie un pavillon de 850 m\u00b2 \u00e0 Londres\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/au-royaume/evenement/marche-britannique-lonmt-deploie-un-pavillon-de-850-m%c2%b2-a-londres/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 0, "id": 241, "label": "Tanger Med : 971 kg...", "shape": "dot", "size": 47, "title": "Tanger Med : 971 kg de coca\u00efne saisis dans un conteneur frigorifique\nSource: maroc-diplomatique.net", "url": "https://maroc-diplomatique.net/tanger-med-971-kg-de-cocaine-saisis-dans-un-conteneur-frigorifique/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Une op\u00e9ration conjointe de contr\u00f4le\naux fronti\u00e8res, de la police...", "mass": 5, "physics": false, "shape": "box", "title": "Une op\u00e9ration conjointe de contr\u00f4le aux fronti\u00e8res, de la police et des services douaniers a permis de d\u00e9jouer, mardi 3 novembre, une tentative de trafic international de stup\u00e9fiants au port Tanger Med. [fr.hespress.com]\n-------------------------------------------------\nUne op\u00e9ration s\u00e9curitaire conjointe, men\u00e9e ce mardi 3 novembre au port de Tanger-Med par les services de la police et des Douanes, a permis de faire \u00e9chec \u00e0 une tentative de trafic international de stup\u00e9fiants et de substances psychotropes, aboutissant \u00e0 la saisie de 971 kilogrammes de coca\u00efne. [telquel.ma]\n-------------------------------------------------\nLes services de la S\u00fbret\u00e9 nationale et de la Douane ont d\u00e9jou\u00e9, mardi au port Tanger Med, une op\u00e9ration de trafic international de drogue, dissimul\u00e9e dans un conteneur frigorifique. [www.lavieeco.com]\n-------------------------------------------------\nUne op\u00e9ration s\u00e9curitaire conjointe des services de la S\u00fbret\u00e9 nationale et de la Douane r\u00e9alis\u00e9e, mardi apr\u00e8s-midi au Port Tanger Med, a permis la mise en \u00e9chec d\u2019une op\u00e9ration de trafic international de drogues et de psychotropes et la saisie d\u2019un total de 971 kilogrammes de coca\u00efne. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre de l\u2019\u00c9ducation nationale,\ndu Pr\u00e9scolaire, de la Formation...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, Mohamed Nabil Benabdellah, a annonc\u00e9 ce mardi 3 novembre 2026 une nouvelle r\u00e9vision du plafond d\u2019\u00e2ge requis pour se pr\u00e9senter aux concours de recrutement de l\u2019enseignement, fixant d\u00e9sormais la limite maximale \u00e0 40 ans, apr\u00e8s avoir \u00e9t\u00e9 \u00e9tablie \u00e0 35 . [fr.hespress.com]\n-------------------------------------------------\nMohamed Nabil Benabdellah, ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, a annonc\u00e9, ce mardi, une initiative visant \u00e0 porter de 35 \u00e0 40 ans l\u2019\u00e2ge limite pour se pr\u00e9senter aux concours d\u2019acc\u00e8s au m\u00e9tier d\u2019enseignant. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, Nabil Benabdellah, a re\u00e7u lundi \u00e0 Rabat Khadija Boumlik, \u00e9l\u00e8ve distingu\u00e9e, class\u00e9e quatri\u00e8me au concours D\u00e9fi de la lecture arabe. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le directeur g\u00e9n\u00e9ral de la\nS\u00fbret\u00e9 Nationale et de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi et le Chef du Service de la S\u00e9curit\u00e9 de l\u0027\u00c9tat du Qatar, Khalf. [lematin.ma]\n-------------------------------------------------\nAbdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, a re\u00e7u ce mardi, au si\u00e8ge de la DGSN \u00e0 Rabat, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi, chef du Service de la s\u00e9curit\u00e9 de l\u2019\u00c9tat du Qatar, accompagn\u00e9 d\u2019une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La cheffe du gouvernement, Fatima\nZahra El Mansouri, a pr\u00e9sid\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Zahra El Mansouri, a pr\u00e9sid\u00e9, mardi 3 novembre 2026 \u00e0 Rabat, une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique. [lematin.ma]\n-------------------------------------------------\nFatima Ezzahra El Mansouri a indiqu\u00e9, ce mardi 3 novembre dans un communiqu\u00e9 publi\u00e9 sur ses r\u00e9seaux sociaux, avoir pr\u00e9sid\u00e9 \u00e0 Rabat une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique nationale, au suivi du pouvoir d\u2019achat des citoyennes et des citoyens, ainsi qu\u2019\u00e0 l\u2019\u00e9tude de l\u2019impact des fluctuations des prix sur. [telquel.ma]\n-------------------------------------------------\nLa Premi\u00e8re ministre Fatima Zahra Mansouri a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union ax\u00e9e sur les r\u00e9cents d\u00e9veloppements de l\u2019\u00e9conomie nationale, le suivi du pouvoir d\u2019achat des citoyens et l\u2019impact des fluctuations des prix sur le march\u00e9 int\u00e9rieur, ainsi que sur la vie quotidienne des Marocains, selon un communiqu\u00e9 de la Primature. [www.yabiladi.com]\n-------------------------------------------------\nR\u00e9uni ce mardi 3 novembre \u00e0 Rabat sous la pr\u00e9sidence de Fatima Zahra El Mansouri, le gouvernement a d\u00e9cid\u00e9 de mettre en place une commission interminist\u00e9rielle charg\u00e9e de suivre les fluctuations des prix et de prendre les mesures n\u00e9cessaires pour prot\u00e9ger le pouvoir d\u2019achat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union sur l\u0027\u00e9volution de la situation \u00e9conomique nationale et du pouvoir d\u0027achat. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Des averses orageuses oscillant entre\n30 et 40 mm sont...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses oscillant entre 30 et 40 mm sont pr\u00e9vues, ce mardi de 9h15 \u00e0 23h00, dans les provinces d\u0027Inezgane-Ait Melloul, Tarfaya, Assa-Zag, Guelmim, Tata, Chtouka-A. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale et rafales de vent sous orages sont attendues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses comprises entre 30 et 40 mm, accompagn\u00e9es d\u2019un risque de gr\u00eale et de rafales de vent sous orages, sont attendues mardi et mercredi dans plusieurs provinces du Royaume, selon un bulletin d\u2019alerte de niveau orange de la DGM. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La jeune cr\u00e9atrice culinaire marocaine\nTouria Laalioui-Mbarek a re\u00e7u le...", "mass": 5, "physics": false, "shape": "box", "title": "La jeune cr\u00e9atrice culinaire marocaine Touria Laalioui-Mbarek a re\u00e7u le Grand prix du Paris-Brest de la p\u00e2tisserie fran\u00e7aise, dans la cat\u00e9gorie \u00ab amateurs \u00bb, d\u00e9cern\u00e9 \u00e0 l\u2019occasion du Salon du Chocolat \u0026 de la P\u00e2tisserie de Paris, organis\u00e9 du 28 octobre au 1er novembre. [telquel.ma]\n-------------------------------------------------\nLa cr\u00e9atrice culinaire marocaine Touria Laalioui-Mbarek a d\u00e9croch\u00e9 le prix dans la cat\u00e9gorie amateur du Grand Prix du Paris-Brest de la P\u00e2tisserie Fran\u00e7aise, lors du Salon du chocolat et de la p\u00e2tisserie de Paris, tenu du 28 octobre au 1er novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019Agence nationale des ports (ANP)\net l\u2019Agence fran\u00e7aise de d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des ports (ANP) et l\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) ont sign\u00e9, mardi \u00e0 Rabat, une d\u00e9claration conjointe relative au troisi\u00e8me financement du partenariat ANP-AFD, d\u2019un montant global de 100 millions d\u2019euros, d\u00e9di\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [telquel.ma]\n-------------------------------------------------\nL\u0027Agence nationale des ports et l\u0027Agence fran\u00e7aise de d\u00e9veloppement ont sign\u00e9 une d\u00e9claration conjointe relative au troisi\u00e8me financement de leur partenariat strat\u00e9gique, destin\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019entra\u00eeneur de l\u2019\u00e9quipe nationale masculine\nde football U17, Ahmed Kantari...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019entra\u00eeneur de l\u2019\u00e9quipe nationale masculine de football U17, Ahmed Kantari a d\u00e9voil\u00e9, mardi, la liste finale des joueurs retenus pour disputer la 21\u00e8me \u00e9dition de la Coupe du monde FIFA Qatar 2026. [telquel.ma]\n-------------------------------------------------\nMardi \u00e0 Rabat, Ahmed Kantari, le s\u00e9lectionneur de l\u00e9quipe nationale masculine U17, a d\u00e9voil\u00e9 la liste d\u00e9finitive de 21 joueurs s\u00e9lectionn\u00e9s pour la Coupe du monde FIFA U17 Qatar 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Managem a demand\u00e9 la reprise\nde la cotation de son...", "mass": 5, "physics": false, "shape": "box", "title": "Managem a demand\u00e9 la reprise de la cotation de son titre \u00e0 compter de ce mardi 3 novembre, d\u00e8s l\u2019ouverture de la s\u00e9ance, apr\u00e8s une suspension intervenue le 30 octobre. [telquel.ma]\n-------------------------------------------------\nLe groupe minier a sollicit\u00e9 la suspension de la cotation de son titre depuis le 30 octobre dernier suite \u00e0 sa r\u00e9servation \u00e0 la baisse de 10% cons\u00e9cutivement au changement des r\u00e8gles de pond\u00e9r <div id="tooltip">Carte générée par intelligence artificielle le 03/11/2026 à 19h45, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 07h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
