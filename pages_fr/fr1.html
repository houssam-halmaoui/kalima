med V\nSource: www.challenge.ma", "url": "https://www.challenge.ma/el-arbi-es-sobaihi-nomme-directeur-de-laeroport-mohammed-v-322734/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 11, "id": 196, "label": "Italie : Premiers \u00e9l\u00e9ments de...", "shape": "dot", "size": 47, "title": "Italie : Premiers \u00e9l\u00e9ments de l\u2019autopsie du Marocain Abderrahim Fakir\nSource: www.yabiladi.com", "url": "https://www.yabiladi.com/articles/details/199318/italie-premiers-elements-l-autopsie-marocain.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 1, "id": 207, "label": "Le Pr\u00e9sident du Mali remercie...", "shape": "dot", "size": 47, "title": "Le Pr\u00e9sident du Mali remercie SM le Roi pour le soutien constant du Maroc \u00e0 la souverainet\u00e9 du Mali\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/le-president-du-mali-remercie-sm-le-roi-pour-le-soutien-constant-du-maroc-a-la-souverainete-du-mali/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Sur instruction du ministre italien\ndes Affaires \u00e9trang\u00e8res et de...", "mass": 5, "physics": false, "shape": "box", "title": "Sur instruction du ministre italien des Affaires \u00e9trang\u00e8res et de la Coop\u00e9ration internationale, Antonio Tajani, l\u2019ambassadeur d\u2019Italie \u00e0 Rabat, Pasquale Salzano, accompagn\u00e9 du consul g\u00e9n\u00e9ral d\u2019Italie \u00e0 Casablanca, a rencontr\u00e9, ce vendredi, la veuve d\u2019Abderrahim Fakir. [fr.hespress.com]\n-------------------------------------------------\nSelon des sources de TelQuel, \u00e0 la demande du ministre italien des Affaires \u00e9trang\u00e8res et de la Coop\u00e9ration internationale, Antonio Tajani, l\u2019ambassadeur d\u2019Italie au Maroc, Pasquale Salzano, et le consul g\u00e9n\u00e9ral d\u2019Italie \u00e0 Casablanca ont rencontr\u00e9 ce vendredi l\u2019\u00e9pouse d\u2019Abderrahim Fakir. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a \u00e9t\u00e9 re\u00e7u en audience, vendredi \u00e0 Bamako, par le G\u00e9n\u00e9ral d\u2019arm\u00e9e Assimi Goita, Pr\u00e9sident de la Transition, Chef de l\u2019Etat de la R\u00e9publique du Mali. [fr.hespress.com]\n-------------------------------------------------\nLe Pr\u00e9sident du Mali remercie Sa Majest\u00e9 le Roi Mohammed VI pour la position constante et coh\u00e9rente du Maroc en faveur de la souverainet\u00e9, de l\u2019unit\u00e9 et de l\u2019int\u00e9grit\u00e9 territoriale de son pays. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a \u00e9t\u00e9 re\u00e7u en audience, vendredi \u00e0 Bamako, par Son Excellence, le G\u00e9n\u00e9ral d\u2019arm\u00e9e Assimi Goita, Pr\u00e9sident de la Transition, Chef de l\u2019Etat de la R\u00e9publique du Mali. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Roi Mohammed VI a\nbien voulu donner Ses Tr\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a bien voulu donner Ses Tr\u00e8s Hautes Instructions Royales aux fins de la remise aux autorit\u00e9s de la R\u00e9publique du Mali, du Complexe Mohammed VI de Formation Professionnelle dans les m\u00e9tiers du B\u00e2timent et des Travaux Publics (BTP), ainsi que de l\u2019H\u00f4tellerie, du Tourisme et de la Restauration. [fr.hespress.com]\n-------------------------------------------------\n\u00c9difi\u00e9 sur une superficie couverte de 5.200 m2 \u00e0 Bamako, le Complexe Mohammed VI de Formation Professionnelle est r\u00e9alis\u00e9 par la Fondation Mohammed VI pour le D\u00e9veloppement Durable. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI a bien voulu donner Ses tr\u00e8s hautes instructions royales aux fins de la remise aux autorit\u00e9s de la R\u00e9publique du Mali, du complexe Mohammed VI de formation professionnelle dans les m\u00e9tiers du b\u00e2timent et des travaux publics (BTP), ainsi que de l\u2019h\u00f4tellerie, du tourisme et de la restauration. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9tablissement pourra accueillir pr\u00e8s de 1.000 stagiaires par an dans les secteurs du BTP, de l\u2019h\u00f4tellerie, du tourisme et de la restauration. [www.lavieeco.com]\n-------------------------------------------------\nLe Roi Mohammed VI a donn\u00e9 ses Hautes Instructions pour la remise aux autorit\u00e9s de la R\u00e9publique du Mali du Complexe Mohammed VI de formation professionnelle dans les m\u00e9tiers du b\u00e2timent et des travaux publics (BTP), ainsi que de l\u2019h\u00f4tellerie, du tourisme et de la restauration. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Tribunal arbitral du sport\n(TAS) a fix\u00e9 au 8...", "mass": 5, "physics": false, "shape": "box", "title": "Le Tribunal arbitral du sport (TAS) a fix\u00e9 au 8 octobre 2026 l\u2019audience consacr\u00e9e au recours introduit par la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football (FSF) concernant le litige autour de la finale de la Coupe d\u2019Afrique des nations (CAN) 2025. [fr.hespress.com]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a fix\u00e9 au 8 octobre 2026 l\u2019audience consacr\u00e9e au recours d\u00e9pos\u00e9 par la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football contre la Conf\u00e9d\u00e9ration africaine de football (CAF) et la F\u00e9d\u00e9ration royale marocaine de football (FRMF), au sujet de la finale de la CAN Maroc 2025. [telquel.ma]\n-------------------------------------------------\nLe Tribunal Arbitral du Sport (TAS) a annonc\u00e9, ce vendredi, qu\u0027une audience se tiendra le 8 octobre 2026 \u00e0 son si\u00e8ge de Lausanne, en Suisse, \u00e0 la suite de l\u2019appel interjet\u00e9 par la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise de football (FSF) contre la CAF et la FRMF concernant la finale de la CAN 2025. [leseco.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) examinera le 8 octobre prochain l\u2019appel de la F\u00e9d\u00e9ration s\u00e9n\u00e9galaise contre la d\u00e9cision de la Conf\u00e9d\u00e9ration africaine d\u2019attribuer sur tapis vert la CAN-2025 au Maroc, a fait savoir l\u2019instance vendredi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans le Communiqu\u00e9 conjoint adopt\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans le Communiqu\u00e9 conjoint adopt\u00e9 \u00e0 l\u2019issue de la 4e session de la Grande Commission Mixte de Coop\u00e9ration maroco-malienne, dont les travaux ont \u00e9t\u00e9 c. [lematin.ma]\n-------------------------------------------------\nLa R\u00e9publique du Mali a r\u00e9it\u00e9r\u00e9 sa \u00ab position en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara \u00bb, tout en r\u00e9affirmant son appui au Plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc, comme \u00e9tant \u00ab la seule solution cr\u00e9dible et r\u00e9aliste pour la r\u00e9solution de ce. [telquel.ma]\n-------------------------------------------------\nIl a aussi r\u00e9affirm\u00e9 son appui au plan d\u2019autonomie propos\u00e9 par le Maroc comme \u00abla seule solution cr\u00e9dible et r\u00e9aliste pour la r\u00e9solution de ce diff\u00e9rend r\u00e9gional\u00bb, en vertu de la r\u00e9solution 2797 adopt\u00e9e le 31 octobre 2025 par le Conseil de s\u00e9curit\u00e9 des Nations unies. [www.yabiladi.com]\n-------------------------------------------------\nLa R\u00e9publique du Mali a r\u00e9it\u00e9r\u00e9 sa \"position en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara\", tout en r\u00e9affirmant son appui au Plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc, comme \u00e9tant \"la seule solution cr\u00e9dible et r\u00e9aliste pour la r\u00e9solution de ce diff\u00e9rend r\u00e9gional\". [www.lavieeco.com]\n-------------------------------------------------\nLa R\u00e9publique du Mali a r\u00e9it\u00e9r\u00e9 sa \u00ab position en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara \u00bb, tout en r\u00e9affirmant son appui au Plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc, comme \u00e9tant \u00ab la seule solution cr\u00e9dible et r\u00e9aliste pour la r\u00e9solution de ce [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le litige autour de la\nfinale de la Coupe d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "Le litige autour de la finale de la Coupe d\u2019Afrique des nations (CAN) 2025 conna\u00eet une nouvelle phase. [lematin.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a annonc\u00e9, le 24 juillet, que l\u2019audience concernant l\u2019appel du S\u00e9n\u00e9gal contre la victoire du Maroc en finale de la Coupe d\u2019Afrique des nations 2025 se tiendra le 8 octobre, \u00e0 Lausanne. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a mis fin aux...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a mis fin aux sp\u00e9culations entourant le format de la prochaine Coupe d\u2019Afrique des Nations (CAN). [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a mis fin \u00e0 la controverse n\u00e9e ces derniers jours autour d\u2019une \u00e9ventuelle augmentation du nombre de s\u00e9lections participantes \u00e0 la phase finale de la Coupe d\u2019Afrique des nations (CAN 2027), en confirmant que le tournoi se d\u00e9roulera selon le format actuel, sans aucun changement. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Groupe de la Banque\nafricaine de d\u00e9veloppement (BAD) et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Fonds d\u0027\u00e9quipement communal (FEC) ont sign\u00e9, mercredi \u00e0 Rabat, un deuxi\u00e8me accord de pr\u00eat de 150 millions d\u0027eu. [lematin.ma]\n-------------------------------------------------\nLe Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Fonds d\u2019\u00e9quipement communal (FEC) ont sign\u00e9, mercredi \u00e0 Rabat, un deuxi\u00e8me accord de pr\u00eat de 150 millions d\u2019euros destin\u00e9 \u00e0 soutenir les investissements des collectivit\u00e9s territoriales marocaines. [lesec
