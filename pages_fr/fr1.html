.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Face \u00e0 la flamb\u00e9e du\ncours du p\u00e9trole sur les...", "mass": 5, "physics": false, "shape": "box", "title": "Face \u00e0 la flamb\u00e9e du cours du p\u00e9trole sur les march\u00e9s internationaux et leur impact sur les prix des hydrocarbures au niveau national, le gouvernement met en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration qui avait \u00e9t\u00e9 mise en place . [fr.hespress.com]\n-------------------------------------------------\nFace \u00e0 la flamb\u00e9e du cours du p\u00e9trole sur les march\u00e9s internationaux et leur impact sur les prix des hydrocarbures au niveau national, le gouvernement met en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration qui avait \u00e9t\u00e9 mise en place. [telquel.ma]\n-------------------------------------------------\nFace \u00e0 la flamb\u00e9e du cours du p\u00e9trole sur les march\u00e9s internationaux et leur impact sur les prix des hydrocarbures au niveau national, le gouvernement met en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration qui avait . [aujourdhui.ma]\n-------------------------------------------------\nLe gouvernement a d\u00e9cid\u00e9 de mettre en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration initi\u00e9e en mars 2022. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019actuel vice-pr\u00e9sident g\u00e9n\u00e9ral de la\nConf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019actuel vice-pr\u00e9sident g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc, Mehdi Tazi, a officialis\u00e9 sa candidature \u00e0 la pr\u00e9sidence de l\u2019organisation patronale. [fr.hespress.com]\n-------------------------------------------------\nMehdi Tazi, vice-pr\u00e9sident g\u00e9n\u00e9ral sortant, a annonc\u00e9 sa candidature \u00e0 la pr\u00e9sidence de la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) \u00e0 travers une publication sur Link. [lematin.ma]\n-------------------------------------------------\nUn premier bin\u00f4me et une premi\u00e8re candidature pour la pr\u00e9sidence de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM). [telquel.ma]\n-------------------------------------------------\nLa course aux \u00e9lections de la CGEM s\u2019ouvre avec un premier bin\u00f4me d\u00e9clar\u00e9 : Mehdi Tazi et Mohamed Bachiri, patron de Renault Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc accueille une \u00e9tape\nd\u00e9cisive des Qualifying Series de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc accueille une \u00e9tape d\u00e9cisive des Qualifying Series de la World Surf League avec le Pro Taghazout Bay QS 4.000, pr\u00e9vu du 22 au 29 mars sur le spot d\u2019Anchor Point. [lematin.ma]\n-------------------------------------------------\nL\u2019\u00e9lite europ\u00e9enne et africaine du surf sera au rendez-vous pour l\u2019\u00e9tape d\u00e9cisive du Pro Taghazout Bay pr\u00e9vue du 22 au 29 mars courant, sur le mythique spot d\u2019Anchor Point au nord d\u2019Agadir. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Isra\u00ebl dit avoir \u00e9limin\u00e9 Ali\nLarijani et le chef du...", "mass": 5, "physics": false, "shape": "box", "title": "Isra\u00ebl dit avoir \u00e9limin\u00e9 Ali Larijani et le chef du BassidjLe ministre isra\u00e9lien de la D\u00e9fense, Isra\u00ebl Katz, a annonc\u00e9 mardi l\u0027\u00e9limination d\u0027Ali Larijani, l#39. [lematin.ma]\n-------------------------------------------------\nLe ministre isra\u00e9lien de la D\u00e9fense, Isra\u00ebl Katz, a annonc\u00e9 mardi \u00ab l\u2019\u00e9limination \u00bb d\u2019Ali Larijani, l\u2019un des principaux dirigeants iraniens, et du g\u00e9n\u00e9ral Gholamr\u00e9za Soleimani, commandant de la milice du Bassidj, apr\u00e8s des frappes men\u00e9s dans la nuit en Iran par l\u2019arm\u00e9e isra\u00e9lienne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le milieu de terrain de\nl\u2019AS Roma et international marocain...", "mass": 5, "physics": false, "shape": "box", "title": "Le milieu de terrain de l\u2019AS Roma et international marocain Neil El Aynaoui a \u00e9t\u00e9 victime d\u2019un braquage avec s\u00e9questration \u00e0 son domicile situ\u00e9 dans le quartier de Castel Fusano, \u00e0. [lematin.ma]\n-------------------------------------------------\nDans la nuit de lundi 16 \u00e0 mardi 17 mars, vers 3h du matin, son domicile situ\u00e9 dans le quartier de Castel Fusano \u00e0 Rome a \u00e9t\u00e9 la cible d\u2019un cambriolage violent. [telquel.ma]\n-------------------------------------------------\nLe milieu de terrain marocain Neil El Aynaoui, \u00e9voluant \u00e0 lAS Roma, a \u00e9t\u00e9 victime dun cambriolage \u00e0 son domicile de Castel Fusano, \u00e0 Rome, dans la nuit de lundi \u00e0 mardi, rapporte lagence italienne ANSA. [www.yabiladi.com]\n-------------------------------------------------\nLe footballeur marocain Neil El-Aynaoui et ses proches ont \u00e9t\u00e9 victimes d\u0027un cambriolage avec s\u00e9questration \u00e0 leur domicile de Rome, au cours duquel plusieurs objets de valeur ont \u00e9t\u00e9 d\u00e9rob\u00e9s par un groupe arm\u00e9. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La croissance de l\u2019\u00e9conomie nationale\naurait connu une nette am\u00e9lioration...", "mass": 5, "physics": false, "shape": "box", "title": "La croissance de l\u2019\u00e9conomie nationale aurait connu une nette am\u00e9lioration \u00e0 4,8% en 2025 et devrait se situer \u00e0 5,6% en 2026, avant de ralentir \u00e0 3,5% en 2027, selon les projections de Bank Al-Maghrib (BAM). [telquel.ma]\n-------------------------------------------------\nLa croissance de l\u2019\u00e9conomie nationale aurait connu une nette am\u00e9lioration \u00e0 4,8% en 2025 et devrait se situer \u00e0 5,6% en 2026, avant de ralentir \u00e0 3,5% en 2027, selon les projections de Bank Al-Maghrib (BAM). [www.yabiladi.com]\n-------------------------------------------------\nLa croissance de l\u2019\u00e9conomie nationale aurait connu une nette am\u00e9lioration \u00e0 4,8% en 2025 et devrait se situer \u00e0 5,6% en 2026, avant de ralentir \u00e0 3,5% en 2027, selon les projections de Bank Al-Maghrib (BAM). [aujourdhui.ma]\n-------------------------------------------------\nLa croissance de l\u2019\u00e9conomie nationale aurait connu une nette am\u00e9lioration \u00e0 4,8% en 2025 et devrait se situer \u00e0 5,6% en 2026, avant de ralentir \u00e0 3,5% en 2027, selon les projections de Bank Al-Maghrib (BAM). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Conseil de Bank Al-Maghrib\n(BAM), r\u00e9uni mardi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de Bank Al-Maghrib (BAM), r\u00e9uni mardi \u00e0 Rabat, a d\u00e9cid\u00e9 de maintenir le taux directeur inchang\u00e9 \u00e0 2,25%. [telquel.ma]\n-------------------------------------------------\nCette d\u00e9cision tient compte de la dynamique continue de l\u2019activit\u00e9 \u00e9conomique, des niveaux mod\u00e9r\u00e9s pr\u00e9vus de l\u2019inflation et de la forte incertitude sur les perspectives internationales, outre les r\u00e9sultats des stress tests de la BAM pour l\u2019\u00e9conomie nationale. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil de Bank Al-Maghrib (BAM), r\u00e9uni mardi \u00e0 Rabat \u00e0 l\u2019occasion de sa premi\u00e8re r\u00e9union trimestrielle de l\u2019ann\u00e9e 2026, a d\u00e9cid\u00e9, comme il \u00e9tait largement anticip\u00e9, de maintenir le taux directeur inchang\u00e9 \u00e0 2,25%, confirmant ainsi l\u2019orientation prudente de la politique mon\u00e9taire dans un contexte marqu\u00e9 par des incertitudes externes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Des averses orageuses localement fortes\navec risque de gr\u00eale, des...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses localement fortes avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses localement fortes avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u0     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
