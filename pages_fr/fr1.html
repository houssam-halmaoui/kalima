ers mois de 2025, en progression de 17,5% par rapport \u00e0 la m\u00eame p\u00e9riode de 2024, a annonc\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [fr.hespress.com]\n-------------------------------------------------\nLe nombre d\u2019entreprises cr\u00e9\u00e9es au Maroc s\u2019est \u00e9tabli \u00e0 72.343 durant les huit premiers mois de 2025, en progression de 17,5% par rapport \u00e0 la m\u00eame p\u00e9riode de 2024, a annonc\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri, a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, un \u00e9tat des lieux complet de deux secteurs cl\u00e9s : la formation professionnelle et la cr\u00e9ation d\u2019entreprises, r\u00e9v\u00e9lant une dynamique en nette progression. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le s\u00e9lectionneur national, Tarik Sektioui\na affirm\u00e9, lundi \u00e0 Doha,...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Tarik Sektioui a affirm\u00e9, lundi \u00e0 Doha, que l\u2019\u00e9quipe nationale A\u2019 s\u2019est adapt\u00e9e \u00e0 toutes les circonstances et a r\u00e9alis\u00e9 l\u2019essentiel qui consiste \u00e0 se qualifier pour les quarts de finale de la Coupe arabe. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine A\u2019 de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe arabe (Qatar-2025) en battant son homologue saoudienne sur le score de 1 but \u00e0 0, en match de la troisi\u00e8me et derni\u00e8re journ\u00e9e du groupe B, disput\u00e9 lundi au stade de Lusail \u00e0 Doha. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc A\u2019 a poin\u00e7onn\u00e9 son billet pour les quarts de finale de la Coupe arabe de football (Qatar-2025) apr\u00e8s sa victoire face \u00e0 l\u2019Arabie saoudite sur le score de 1 but \u00e0 0, en match de la troisi\u00e8me journ\u00e9e du groupe B, disput\u00e9 lundi au stade de Lusail \u00e0 Doha. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection marocaine A\u2019 de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe arabe (Qatar-2025) en battant son homologue saoudienne sur le score de 1 but \u00e0 0, en match de la troisi\u00e8me et derni\u00e8re journ\u00e9e du groupe B, disput\u00e9 lundi au stade de Lusail \u00e0 Doha. [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection nationale A\u2019 de football aborde, lundi, son troisi\u00e8me et dernier match du groupe B de la Coupe arabe au Qatar face \u00e0 l\u2019Arabie Saoudite avec l\u2019objectif clair de valider son billet pour les quarts de finale et, si possible, terminer en t\u00eate de la poule. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette date, qui co\u00efncide avec\nla cr\u00e9ation de l\u0027Institution de...", "mass": 5, "physics": false, "shape": "box", "title": "Cette date, qui co\u00efncide avec la cr\u00e9ation de l\u0027Institution de Diwan Al Madhalim en 2001, est porteuse de significations symboliques et en mati\u00e8re des droits de l\u0027Homme, \u00e0 m. [lematin.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI, que Dieu L\u0027assiste, a bien voulu donner Sa Haute Approbation pour instituer le 9 d\u00e9cembre de chaque ann\u00e9e comme journ\u00e9e nationale de la m\u00e9diation de service public. [www.lopinion.ma]\n-------------------------------------------------\nCette date, qui co\u00efncide avec la cr\u00e9ation de l\u2019Institution de Diwan Al Madhalim en 2001, est porteuse de significations symboliques et en mati\u00e8re des droits de l\u2019Homme, \u00e0 m\u00eame de. [telquel.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI a bien voulu donner sa haute approbation pour instituer le 9 d\u00e9cembre de chaque ann\u00e9e comme journ\u00e9e nationale de la m\u00e9diation de service public. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Ce Centre, la troisi\u00e8me grande\nimplantation structurante du mod\u00e8le inclusif...", "mass": 5, "physics": false, "shape": "box", "title": "Ce Centre, la troisi\u00e8me grande implantation structurante du mod\u00e8le inclusif d\u00e9ploy\u00e9 par la Fondation Lalla Asmaa apr\u00e8s ceux d\u00e9j\u00e0 op\u00e9rationnels \u00e0 Rabat et Tanger, s\u2019inscrit dans le. [lematin.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa inaugure \u00e0 Mekn\u00e8s un centre r\u00e9gional d\u2019excellence offrant une prise en charge compl\u00e8te et gratuite aux enfants sourds et malentendants, incluant \u00e9ducation, formations professionnelles, orthophonie et suivi des implants cochl\u00e9aires, renfor\u00e7ant le mod\u00e8le inclusif d\u00e9velopp\u00e9 par la Fondation Lalla Asmaa. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, a proc\u00e9d\u00e9, lundi \u00e0 Mekn\u00e8s, \u00e0 l\u2019inauguration du Centre \u00ab Princesse Lalla Asmaa \u00bb, qui se veut un p\u00f4le r\u00e9gional d\u201     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
