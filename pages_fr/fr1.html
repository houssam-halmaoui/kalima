ue Dieu L\u2019assiste, a re\u00e7u, mardi au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansouri, coordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9, que le Souverain a nomm\u00e9e Cheffe du gouvernement et a charg\u00e9 de former le nouveau gouvernement, annonce le minist\u00e8re de la Maison Royale, . [aujourdhui.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a re\u00e7u, ce mardi au Palais Royal \u00e0 Rabat, Fatima Ezzahra El Mansouri, coordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9, que le Souverain a nomm\u00e9e cheffe du gouvernement. [leseco.ma]\n-------------------------------------------------\nLe Roi Mohammed VI a re\u00e7u mardi 29 septembre au Palais royal de Rabat Fatima Zahra El Mansouri, coordinatrice de la direction coll\u00e9giale du secr\u00e9tariat g\u00e9n\u00e9ral du Parti authenticit\u00e9 et modernit\u00e9 (PAM), et l\u2019a charg\u00e9e de former le nouveau gouvernement, un fait in\u00e9dit au Maroc. [atlasinfo.fr]\n-------------------------------------------------\nMme Fatima Ezzahra El Mansouri, que SM le Roi Mohammed VI, que Dieu L\u2019assiste, a nomm\u00e9e mardi Cheffe du gouvernement, est n\u00e9e le 3 janvier 1976 \u00e0 Marrakech. [www.lereporter.ma]\n-------------------------------------------------\nCoordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9 (PAM), elle a \u00e9t\u00e9 re\u00e7ue au Palais Royal \u00e0 Rabat, selon un communiqu\u00e9 du minist\u00e8re de la Maison Royale, du Protocole . [lnt.ma]\n-------------------------------------------------\nle Roi Mohammed VI a re\u00e7u, mardi 29 septembre 2026, Fatima Ezzahra El Mansouri, qu\u2019Il a nomm\u00e9e Cheffe du gouvernement. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Pour la seconde journ\u00e9e des\n\u00e9liminatoires de la CAN 2027,...", "mass": 5, "physics": false, "shape": "box", "title": "Pour la seconde journ\u00e9e des \u00e9liminatoires de la CAN 2027, le Lions de l\u2019Atlas ont remport\u00e9 une victoire importante face au Lesotho (2-0), ce mardi 29 septembre, \u00e0 Bloemfontein en Afrique du Sud. [fr.hespress.com]\n-------------------------------------------------\n\u00c9liminatoires de la CAN 2027 : le Maroc bat le Lesotho 2-0 dans le groupe A. Mardi apr\u00e8s-midi, au Toyota Stadium de Bloemfontein, le Maroc a remport\u00e9 une nouvelle victoire 2-0 contre le Lesotho, lors de son deuxi\u00e8me match du groupe A des \u00e9liminatoires de la Coupe dAfrique des nations 2027. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine a sign\u00e9 une deuxi\u00e8me victoire cons\u00e9cutive dans les \u00e9liminatoires de la Coupe d\u2019Afrique des Nations 2027 en s\u2019imposant face au Lesotho (2-0), mardi 29 septembre au Toyota Stadium de Bloemfontein, en Afrique du Sud. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc se classe au\n54e rang mondial dans l\u2019\u00e9dition...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc se classe au 54e rang mondial dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation, publi\u00e9e mardi par l\u2019Organisation Mondiale de la Propri\u00e9t\u00e9 Intellectuelle (OMPI) \u00e0 Ge. [lematin.ma]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [telquel.ma]\n-------------------------------------------------\nLe Maroc a progress\u00e9 de trois places pour atteindre le 54e rang parmi 139 pays dans le Global Innovation Index 2026, d\u00e9voil\u00e9 mardi par l\u2019Organisation mondiale de la propri\u00e9t\u00e9 intellectuelle (OMPI). [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [leseco.ma]\n-------------------------------------------------\nLe Maroc progresse de trois positions dans l\u2019Indice mondial de l\u2019innovation 2026 et se classe d\u00e9sormais 54e, son meilleur niveau depuis la cr\u00e9ation de cet indicateur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le minist\u00e8re de la Transition\nnum\u00e9rique et de la R\u00e9forme...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration (MTNRA) et Mistral ont annonc\u00e9 la mise \u00e0 disposition en open source de premi\u00e8res r\u00e9alisations issues de leur partenariat dans le domaine de l\u2019intelligence artificielle (IA). [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration (MTNRA) et Mistral ont annonc\u00e9 la mise \u00e0 disposition en open source de premi\u00e8res r\u00e9alisations issues de leur partenariat strat\u00e9gique dans le domaine de l\u2019intelligence artificielle (IA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Ce lundi 28 septembre, les\ngroupes chinois Gotion et allemand...", "mass": 5, "physics": false, "shape": "box", "title": "Ce lundi 28 septembre, les groupes chinois Gotion et allemand Volkswagen ont annonc\u00e9 renforcer leur partenariat, notamment avec la cr\u00e9ation d\u2019une usine de production de cathodes LFP \u00e0 K\u00e9nitra. [telquel.ma]\n-------------------------------------------------\nLa filiale de Volkswagen, PowerCo, sp\u00e9cialis\u00e9e dans les batteries, envisage d\u00e9tablir une nouvelle usine de mat\u00e9riaux pour batteries \u00e0 K\u00e9nitra, en collaboration avec le groupe chinois Gotion, rapporte Reuters. [www.yabiladi.com]\n-------------------------------------------------\nDans une nouvelle \u00e9tape importante pour l\u2019\u00e9cosyst\u00e8me marocain de mobilit\u00e9 \u00e9lectrique Le Groupe Volkswagen, PowerCo SE et Gotion High-tech ont annonc\u00e9 la cr\u00e9ation d\u2019une coentreprise \u00e0 K\u00e9nitra pour la production de mat\u00e9riaux actifs cathodiques LFP, un composant essentiel de la cha\u00eene de valeur des batteries pour v\u00e9hicules \u00e9lectriques. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les recettes fiscales des collectivit\u00e9s\nterritoriales (CT) ont atteint 34,7...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes fiscales des collectivit\u00e9s territoriales (CT) ont atteint 34,7 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, en hausse de 15% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nLes collectivit\u00e9s territoriales ont d\u00e9gag\u00e9 un exc\u00e9dent global de 10 milliards de dirhams \u00e0 fin ao\u00fbt 2026, contre 9,61 milliards un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le groupe Bank Of Africa\n(BOA) affiche, \u00e0 fin juin...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Bank Of Africa (BOA) affiche, \u00e0 fin juin 2026, des d\u00e9p\u00f4ts de client\u00e8le (hors repos) en hausse de 4% \u00e0 286 milliards de dirhams (MMDH).. [telquel.ma]\n-------------------------------------------------\nBMCE Group a enregistr\u00e9 un r\u00e9sultat net part du groupe (RNPG) de 2,5 milliards de dirhams au premier semestre 2026, en progression de 10% sur un an. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Idriss Lamjaouri a \u00e9t\u00e9 d\u00e9sign\u00e9\ndirecteur g\u00e9n\u00e9ral de Technopark Morocco...", "mass": 5, "physics": false, "shape": "box", "title": "Idriss Lamjaouri a \u00e9t\u00e9 d\u00e9sign\u00e9 directeur g\u00e9n\u00e9ral de Technopark Morocco lors dune r\u00e9union du conseil dadministration le 18 septembre 2026, pr\u00e9sid\u00e9e par Amal El Fallah Seghrouchni, ministre d\u00e9l\u00e9gu\u00e9e en charge de la Transition num\u00e9rique et de la R\u00e9forme de ladministration. [www.yabiladi.com]\n-------------------------------------------------\nLa d\u00e9cision a \u00e9t\u00e9 prise lors du Conseil d\u2019administration tenu le 18 septembre 2026, sous la pr\u00e9sidence d\u2019Amal El Fallah Seghrouchni, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Marine nationale fran\u00e7aise et\nla Marine Royale marocaine conduisent,...", "mass": 5, "physics": false, "shape": "box", "title": "La Marine nationale fran\u00e7aise et la Marine Royale marocain     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
