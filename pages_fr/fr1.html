s et moyennes entreprises (PME) marocaines. [telquel.ma]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 Financi\u00e8re Internationale (IFC), membre du Groupe de la Banque Mondiale (BM), vient de s\u2019associer avec la Soci\u00e9t\u00e9 nationale de Garantie et du Financement de l\u2019entreprise (Tamwilcom) afin d\u2019appuyer le financement des petites et moyennes entreprises (PME) marocaines. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La Commission de la justice,\nde la l\u00e9gislation et des...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de la justice, de la l\u00e9gislation et des droits de l\u2019homme \u00e0 la Chambre des conseillers a adopt\u00e9, ce lundi, \u00e0 la majorit\u00e9, le projet de loi n\u00b0 16.22 relatif \u00e0 l\u2019organisation de la profession des adouls, en pr\u00e9sence du ministre de la Justice, Abdellatif Ouahbi. [telquel.ma]\n-------------------------------------------------\nLe projet de loi a \u00e9t\u00e9 approuv\u00e9, au sein de la Commission de la justice, de la l\u00e9gislation et des droits de l\u2019Homme \u00e0 la deuxi\u00e8me Chambre, par sept conseillers, tandis que trois se sont abstenus, sans qu\u2019aucune opposition ne soit enregistr\u00e9e. [www.lavieeco.com]\n-------------------------------------------------\nLa Commission de la justice, de la l\u00e9gislation et des droits de l\u2019Homme \u00e0 la Chambre des conseillers a adopt\u00e9, lundi \u00e0 la majorit\u00e9, le projet de loi n\u00b0 16.22 relatif \u00e0 l\u2019organisation de la profession d\u2019Adoul, en pr\u00e9sence du ministre de la Justice, Abdellatif Ouahbi. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "\u00c0 l\u2019occasion du Salon International\nde l\u2019Agriculture au Maroc (SIAM),...",                     window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
