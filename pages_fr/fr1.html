 programme. [fr.hespress.com]\n-------------------------------------------------\nGlovo annonce le d\u00e9ploiement progressif de ses agents de conformit\u00e9 terrain, l\u2019une des six actions pr\u00e9vues dans son initiative Glovo 2030 pour la s\u00e9curit\u00e9 routi\u00e8re, objet d\u2019une convention [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur s\u2019appr\u00eate\n\u00e0 d\u00e9ployer un nouveau syst\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur s\u2019appr\u00eate \u00e0 d\u00e9ployer un nouveau syst\u00e8me national d\u2019alerte publique sur les t\u00e9l\u00e9phones mobiles, baptis\u00e9 \u00ab MA-INDAR \u00bb. [fr.hespress.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur annonce le lancement de MA-INDAR, un syst\u00e8me national d\u2019alerte par t\u00e9l\u00e9phone destin\u00e9 \u00e0 pr\u00e9venir les populations en cas de catastrophe ou de situation d\u2019urgence. [www.lavieeco.com]\n-------------------------------------------------\nDans le cadre du renforcement du dispositif d\u2019alerte publique et du d\u00e9veloppement des m\u00e9canismes d\u2019information des citoyens sur les risques et les situations d\u2019urgence, le minist\u00e8re de l\u2019Int\u00e9rieur a mis en place un syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone baptis\u00e9 \u00ab MA-INDAR \u00bb, visant \u00e0 renforcer la rapidit\u00e9 et l\u2019efficacit\u00e9 de la transmission des alertes aux citoyens [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc poursuit le renforcement de ses dispositifs de pr\u00e9vention et de gestion des risques avec la mise en place d\u2019un syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone mobile. [lnt.ma]\n-------------------------------------------------\nLa pr\u00e9fecture de la province d\u2019El Jadida a finalis\u00e9, lundi, les pr\u00e9paratifs en pr\u00e9vision du test sur le terrain du syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone baptis\u00e9 \u00ab MA-INDAR \u00bb, mis en place par le minist\u00e8re de l\u2019Int\u00e9rieur afin de renforcer la rapidit\u00e9 et l\u2019efficacit\u00e9 de la transmission des alertes aux citoyens pr\u00e9sents dans les zones menac\u00e9es [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les participants \u00e0 la deuxi\u00e8me\n\u00e9dition du Dakhla Global Summit...", "mass": 5, "physics": false, "shape": "box", "title": "Les participants \u00e0 la deuxi\u00e8me \u00e9dition du Dakhla Global Summit ont adopt\u00e9 la D\u00e9claration de Dakhla 2026, qui associe dix engagements \u00e0 une feuille de route pour renforcer la souverainet\u00e9 sanitaire africaine. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9unis les 20 et 21 novembre 2026 \u00e0 Dakhla pour la deuxi\u00e8me \u00e9dition du Dakhla Global Summit, les participants ont appel\u00e9, dans leur d\u00e9claration finale, \u00e0 faire de la sant\u00e9 un investissement et un bien commun pour renforcer la souverainet\u00e9 sanitaire africaine. [www.yabiladi.com]\n-------------------------------------------------\nLa D\u00e9claration de Dakhla 2026, adopt\u00e9e \u00e0 l\u2019issue du Dakhla Global Summit, \u00e9tablit une feuille de route destin\u00e9e \u00e0 renforcer la souverainet\u00e9 sanitaire africaine. [leseco.ma]\n-------------------------------------------------\nLa deuxi\u00e8me \u00e9dition du Dakhla Global Summit, organis\u00e9e les 20 et 21 novembre, s\u2019est achev\u00e9e samedi par l\u2019adoption d\u2019une d\u00e9claration finale appelant les pays africains \u00e0 consid\u00e9rer la sant\u00e9 comme un investissement strat\u00e9gique et un bien commun. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans un communiqu\u00e9 conjoint sanctionnant...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans un communiqu\u00e9 conjoint sanctionnant les travaux de la 2e session de la Commission Mixte de Coop\u00e9ration (CMC) maroco-malagasy, tenue \u00e0 Rabat sous. [lematin.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans un communiqu\u00e9 conjoint sanctionnant les travaux de la 2e session de la Commission mixte de coop\u00e9ration (CMC) maroco-malagasy, tenue \u00e0 Rabat. [www.lavieeco.com]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans un communiqu\u00e9 conjoint sanctionnant les travaux de la 2e session de la Commission Mixte de Coop\u00e9ration (CMC) maroco-malagasy, tenue \u00e0 Rabat sous la copr\u00e9sidence de M. Nasser Bourita, ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, et de Mme Alice N\u2019Diaye, ministre des [.] [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a re\u00e7u, lundi \u00e0 Rabat, la ministre des Affaires \u00e9trang\u00e8res de la R\u00e9publique de Madagascar, Mme Alice N\u2019Diaye, en pr\u00e9lude de la 2e session de la Commission Mixte de Coop\u00e9ration Maroc-Madagascar. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Dans un communiqu\u00e9 publi\u00 nt \u00e0 renforcer la r\u00e9silience du secteur bancaire marocain face aux risques climatiques et \u00e0 soutenir le d\u00e9veloppement de la finance verte. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Maroc s\u00e9duit les grandes\nproductions cin\u00e9matographiques internationales par ses...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc s\u00e9duit les grandes productions cin\u00e9matographiques internationales par ses infrastructures de tournage, la diversit\u00e9 de ses paysages et sa politique d\u2019accueil, a d\u00e9clar\u00e9 C\u00e9line Demoulin, repr\u00e9sentante d\u2019Universal Pictures International France, le 23 novembre 2026 \u00e0 Marrakech. [www.yabiladi.com]\n-------------------------------------------------\nMohamed Khouna, distributeur d\u2019Universal au Maroc, rappelle que l\u2019avenir du cin\u00e9ma marocain passe aussi par un meilleur acc\u00e8s aux salles dans tout le Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les Lionceaux de l\u2019Atlas affrontent\nla Chine ce lundi 23...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lionceaux de l\u2019Atlas affrontent la Chine ce lundi 23 novembre 2026, \u00e0 Doha, pour la deuxi\u00e8me journ\u00e9e de la Coupe du monde U17. [www.yabiladi.com]\n-------------------------------------------------\nLes Lionceaux de l\u2019Atlas affrontent la Chine, ce lundi 23 novembre, sur la pelouse du terrain n\u00b02 de l\u2019Aspire Zone \u00e0 Doha, pour le compte de la deuxi\u00e8me journ\u00e9e du groupe H. En jeu [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La compagnie a\u00e9rienne isra\u00e9lienne El\nAl reprendra ses vols directs...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a\u00e9rienne isra\u00e9lienne El Al reprendra ses vols directs entre Tel-Aviv et Marrakech le 21 d\u00e9cembre, avec deux liaisons hebdomadaires, les lundis et mercredis, a rapport\u00e9 The Jerusalem Post le 23 novembre. [www.yabiladi.com]\n-------------------------------------------------\nApr\u00e8s plus de trois ans d\u2019interruption, la compagnie a\u00e9rienne isra\u00e9lienne El Al annonce la reprise de sa liaison directe entre Tel-Aviv et Marrakech. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le capitaine de la s\u00e9lection\nmarocaine de football pour amput\u00e9s,...", "mass": 5, "physics": false, "shape": "box", "title": "Le capitaine de la s\u00e9lection marocaine de football pour amput\u00e9s, Mohcine Chghagh, a \u00e9t\u00e9 \u00e9lu meilleur joueur de la Coupe du monde 2026, dimanche soir \u00e0 San Juan de los Lagos, au Mexique. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football pour amput\u00e9s a conclu sa participation \u00e0 la Coupe du monde 2026 par une deuxi\u00e8me place, apr\u00e8s s\u2019\u00eatre inclin\u00e9e face au Ghana sur le score de 1 but \u00e0 0, dimanche soir au Mexique. [lnt.ma]\n-------------------------------------------------\nApr\u00e8s avoir \u00e9limin\u00e9 le Br\u00e9sil en demi-finale, les Lions de l\u2019Atlas s\u2019inclinent face au Ghana (1-0) et remportent la m\u00e9daille d\u2019argent. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le renforcement des liens \u00e9conomiques\net commerciaux entre le Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement des liens \u00e9conomiques et commerciaux entre le Maroc et l\u2019Irlande a \u00e9t\u00e         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
