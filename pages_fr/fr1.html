turelles-et-creatives-affichent-une-dynamique-de-croissance-plus-forte-quanticipee-ifc-banque-mondiale.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le pr\u00e9sident de la Conf\u00e9d\u00e9ration\nafricaine de football (CAF), Patrice...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, entame ce jeudi une visite officielle au Maroc, dans un contexte encore marqu\u00e9 par les r\u00e9percussions du tr\u00e8s controvers\u00e9 d\u00e9nouement de la finale de la Coupe d\u2019Afrique des nations (CAN 2025). [fr.hespress.com]\n-------------------------------------------------\nSelon les informations de TelQuel Arabi, Motsepe a sollicit\u00e9 la tenue de rencontres de haut niveau avec des responsables marocains afin d\u2019examiner les r\u00e9percussions de la finale de la CAN, apr\u00e8s ses \u00e9changes. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, est en visite, ce mercredi \u00e0 Dakar, pr\u00e8s dun mois apr\u00e8s que le titre de la CAN 2025 a \u00e9t\u00e9 retir\u00e9 au S\u00e9n\u00e9gal et attribu\u00e9 au Maroc sur tapis vert. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Niger a r\u00e9it\u00e9r\u00e9 son\nsoutien \u00e0 l\u2019Initiative Royale Atlantique...", "mass": 5, "physics": false, "shape": "box", "title": "Le Niger a r\u00e9it\u00e9r\u00e9 son soutien \u00e0 l\u2019Initiative Royale Atlantique et sa d\u00e9termination \u00e0 dynamiser sa coop\u00e9ration avec le Maroc, \u00e0 l\u2019occasion de la 5e session de la Commission Mixte de Coop\u00e9ration entre le Maroc et le Niger. [fr.hespress.com]\n-------------------------------------------------\nA l\u0027occasion des travaux de cette Commission mixte Maroc-Niger, co-pr\u00e9sid\u00e9e du c\u00f4t\u00e9 nig\u00e9rien par Bakary Yaou Sangar\u00e9, ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration et des. [lematin.ma]\n-------------------------------------------------\nSur instructions du roi Mohammed VI, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a pr\u00e9sid\u00e9, mercredi \u00e0 Niamey, les travaux de la 5e Commission mixte de coop\u00e9ration Maroc-Niger. [telquel.ma]\n-------------------------------------------------\nSur instructions royales, le ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u00e9tranger, Nasser Bourita, a pr\u00e9sid\u00e9, mercredi \u00e0 Niamey, les travaux de la 5e Commission mixte de coop\u00e9ration Maroc-Niger. [www.yabiladi.com]\n-------------------------------------------------\nL\u0027audience intervient en marge de la 5e session de la Commission Mixte de Coop\u00e9ration entre le Maroc et le Niger, qui a tenu ses travaux ce jour \u00e0 Niamey, sous la pr\u00e9sidence de M. Nasser Bourita et de son homologue du Niger, M. Bakary Yaou Sangar\u00e9, ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration et des Nig\u00e9riens \u00e0 l\u0027ext\u00e9rieur. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le g\u00e9n\u00e9ral Mohammed Berrid, Inspecteur\ng\u00e9n\u00e9ral des Forces Arm\u00e9es Royales...", "mass": 5, "physics": false, "shape": "box", "title": "Le g\u00e9n\u00e9ral Mohammed Berrid, Inspecteur g\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR) et Commandant de la Zone Sud, s\u2019est entretenu mardi avec le pr\u00e9sident mauritanien, Mohamed Ould Cheikh El Ghazouani. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 cette occasion, le G\u00e9n\u00e9ral de Corps d\u0027Arm\u00e9e Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales et Commandant la Zone Sud, a \u00e9t\u00e9 re\u00e7u, mardi \u00e0 Nouakchott, par le Pr. [lematin.ma]\n-------------------------------------------------\nA cette occasion, le G\u00e9n\u00e9ral de Corps d\u0027Arm\u00e9e Mohammed Berrid a \u00e9t\u00e9 re\u00e7u par le pr\u00e9sident mauritanien, Mohamed Ould Cheikh El Ghezouani. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "En marge du GITEX Africa\n2026, Mohamed Benchaaboun, CEO du...", "mass": 5, "physics": false, "shape": "box", "title": "En marge du GITEX Africa 2026, Mohamed Benchaaboun, CEO du Maroc Telecom, s\u2019est entretenu avec Henna Virkkunen, Vice-Pr\u00e9sidente ex\u00e9cutive de la Commission europ\u00e9enne, en charge notamment des questions de souverainet\u00e9 technologique. [fr.hespress.com]\n-------------------------------------------------\nEn marge du GITEX Africa 2026, Mohamed Benchaaboun, CEO du Groupe Maroc Telecom, a tenu une r\u00e9union de haut niveau avec Henna Virkkunen, Vice-Pr\u00e9sidente Ex\u00e9cutive de la Commission [www.challenge.ma]\n-------------------------------------------------\nLe CEO du Groupe Maroc Telecom, Mohamed Benchaaboun, a tenu, mercredi \u00e0 Marrakech, une r\u00e9union de haut niveau avec la Vice-Pr\u00e9sidente Ex\u00e9cutive de la Commission europ\u00e9enne, Commissaire en charge de la Souverainet\u00e9 Technologique, de la S\u00e9curit\u00e9 et de la D\u00e9mocratie, Henna Virkkunen, sur la souverainet\u00e9 num\u00e9rique. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Bank Of Africa et le\nMorocco Fintech Center s\u2019allient pour...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Of Africa et le Morocco Fintech Center s\u2019allient pour dynamiser l\u2019innovation financi\u00e8re. [fr.hespress.com]\n-------------------------------------------------\nBank Of Africa et le Morocco Fintech Center (MFC) ont officialis\u00e9, le 7 avril \u00e0 Marrakech en marge du GITEX Africa 2026, la signature d\u2019une convention-cadre de partenariat strat\u00e9gi. [lematin.ma]\n-------------------------------------------------\nLe Morocco Fintech Center (MFC) et Bank of Africa (BoA) ont sign\u00e9, mardi \u00e0 Marrakech, une convention-cadre de partenariat visant \u00e0 acc\u00e9l\u00e9rer le d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me fintech au Maroc et \u00e0 renforcer les dynamiques d\u2019innovation collaborative entre institutions financi\u00e8res et startups. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Gaming et num\u00e9rique : un\npartenariat avec Huawei pour structurer...", "mass": 5, "physics": false, "shape": "box", "title": "Gaming et num\u00e9rique : un partenariat avec Huawei pour structurer la fili\u00e8re au Maroc. [lematin.ma]\n-------------------------------------------------\nLes deux partenaires ont sign\u00e9 un protocole d\u2019accord (MoU) strat\u00e9gique pour structurer un v\u00e9ritable \u00e9cosyst\u00e8me gaming au Maroc et accompagner l\u2019\u00e9mergence de talents locaux, \u00e0. [telquel.ma]\n-------------------------------------------------\nUn accord a \u00e9t\u00e9 sign\u00e9entre le minist\u00e8re de la Jeunesse,de la Culture et de la Communicationet Huawei Maroc, en marge deGITEX Africa Morocco 2026\u00e0 Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Ces rafales (70-80 km/h) sont\nattendues jeudi de 10h \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Ces rafales (70-80 km/h) sont attendues jeudi de 10h \u00e0 21h dans les provinces d\u2019Errachidia, Midelt, Boulemane, Figuig, Jerada et Taourirt, a pr\u00e9cis\u00e9 la DGM dans un bulletin d\u2019alerte dont. [telquel.ma]\n-------------------------------------------------\nDe fortes rafales de vent avec chasse-sables sont pr\u00e9vues jeudi dans certaines provinces du Royaume, a indiqu\u00e9 mercredi la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc salue l\u2019annonce du\ncessez-le-feu entre les \u00c9tats-Unis et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc salue l\u2019annonce du cessez-le-feu entre les \u00c9tats-Unis et la R\u00e9publique islamique d\u2019Iran, indique le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nN\u00e9gociation : Le Royaume du Maroc salue l\u2019annonce du cessez-le-feu entre les Etats-Unis d\u2019Am\u00e9rique et la R\u00e9publique Islamique d\u2019Iran, indique le minist\u00e8re des affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [aujourdhui.ma]\n-------------------------------------------------\nDans un communiqu\u00e9, le minist\u00e8re des Affaires \u00e9trang\u00e8res souligne que le Royaume du Maroc soutient les n\u00e9gociations \u00e0 venir avec la facilitation pakistanaise pour aboutir \u00e0 une paix durable. [www.lavieeco.com]\n-------------------------------------------------\nLe Royaume du Maroc salue l\u2019annonce du cessez-le-feu entre les Etats-Unis d\u2019Am\u00e9rique et la R\u00e9publique Islamique d\u2019Iran, indique le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc salue l\u2019annonce du cessez-le-feu entre les Etats-Unis d\u2019Am\u00e9rique et la R\u00e9publique Islamique d\u2019Iran, indique le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La FIFA, instance dirigeante du\nfootball mondial, a confirm\u00e9 mardi...", "mass": 5, "physics": false, "shape": "box", "title": "La FIFA, instance dirigeante du football mondial, a confirm\u00e9 mardi \u00e0 l\u2019AFP avoir ouvert une proc\u00e9dure disciplinaire \u00e0 l\u2019encontre de la F\u00e9d\u00e9ration espagnole de football \u00e0 propos des chants racistes pendant le match amical Espagne-Egypte la semaine derni\u00e8re. [telquel.ma]\n-------------------------------------------------\nLa FIFA a ouvert une proc\u00e9dure disciplinaire \u00e0 l\u2019encontre de la F\u00e9d\u00e9ration espagnole de football, \u00e0 la suite des chants racistes entendus lors du match amical Espagne-Egypte disput\u00e9 la semaine derni\u00e8re, ont rapport\u00e9 les m\u00e9dias espagnols. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Conseil communal de F\u00e8s\na approuv\u00e9, lors d\u2019une session...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil communal de F\u00e8s a approuv\u00e9, lors d\u2019une session extraordinaire tenue mardi, une convention de partenariat portant sur la reconstruction du stade Hassan II, pour un co\u00fbt global avoisinant les 400 millions de dirhams (MDH). [telquel.ma]\n---------------------------     }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
