00e9gie nationale ambitieuse. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc ambitionne de transformer l\u2019intelligence artificielle en un v\u00e9ritable instrument de rayonnement international, de solidarit\u00e9 et de cod\u00e9veloppement dans le cadre de la Vision Royale de la coop\u00e9ration Sud-Sud, a soulign\u00e9, lundi \u00e0 Rabat, l\u2019ambassadeur Repr\u00e9sentant permanent du Royaume aupr\u00e8s des Nations Unies, Omar Hilale. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Maroc ambitionne d\u2019augmenter son\nproduit int\u00e9rieur brut de 100...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc ambitionne d\u2019augmenter son produit int\u00e9rieur brut de 100 milliards de dirhams (10 milliards de dollars) gr\u00e2ce \u00e0 l\u2019intelligence artificielle d\u2019ici 2030, a d\u00e9clar\u00e9 lundi la ministre charg\u00e9e de la Transition num\u00e9rique, Amal El Fallah Seghrouchni, alors que le pays intensifie ses investissements dans les programmes de formation, les centres de donn\u00e9es souverains et. [telquel.ma]\n-------------------------------------------------\nLe Maroc ambitionne de faire de l\u2019intelligence artificielle (IA) un levier de souverainet\u00e9 num\u00e9rique, d\u2019\u00e9quit\u00e9 territoriale et de d\u00e9veloppement inclusif, a affirm\u00e9, lundi \u00e0 Rabat, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La police nationale espagnole a\nannonc\u00e9 avoir intercept\u00e9, lors d\u2019une...", "mass": 5, "physics": false, "shape": "box", "title": "La police nationale espagnole a annonc\u00e9 avoir intercept\u00e9, lors d\u2019une op\u00e9ration conjointe avec la Marine espagnole, un cargo transportant 9.994 kilos de coca\u00efne au large des \u00eeles Canaries, constituant la plus grande saisie de stup\u00e9fiants r\u00e9alis\u00e9e en haute mer en Europe. [telquel.ma]\n-------------------------------------------------\nLa police nationale espagnole a annonc\u00e9 avoir intercept\u00e9, lors d\u2019une op\u00e9ration conjointe avec la Marine espagnole, un cargo transportant 9.994 kilos de coca\u00efne au large des \u00eeles Canaries, constituant la plus grande saisie de stup\u00e9fiants r\u00e9alis\u00e9e en haute mer en Europe. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le taux de remplissage des\nbarrages au Maroc s\u2019\u00e9l\u00e8ve, lundi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de remplissage des barrages au Maroc s\u2019\u00e9l\u00e8ve, lundi, \u00e0 46,03 % (plus de 7,71 milliards de m3), contre 28,31 % enregistr\u00e9s \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon des donn\u00e9es publi\u00e9es sur la plateforme \u00ab Maghreb Assoudoud \u00bb. [telquel.ma]\n-------------------------------------------------\nLe taux de remplissage des barrages au Maroc s\u0027\u00e9l\u00e8ve, ce lundi, \u00e0 46,03 % (plus de 7,71 milliards de m3), contre 28,31 % enregistr\u00e9s \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon des donn\u00e9es publi\u00e9es sur la plateforme \"Maghreb Assoudoud\". [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le ministre de la Justice,\nAbdellatif Ouahbi, s\u2019est entretenu, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Justice, Abdellatif Ouahbi, s\u2019est entretenu, lundi \u00e0 Bruxelles, avec son homologue belge, Annelies Verlinden, des moyens de hisser la coop\u00e9ration juridique et judiciaire entre les deux pays \u00e0 un niveau sup\u00e9rieur et de renforcer la coordination sur les questions d\u2019int\u00e9r\u00eat commun. [telquel.ma]\n-------------------------------------------------\nDans le cadre du renforcement des relations de coop\u00e9ration bilat\u00e9rale, le ministre de la Justice du Royaume du Maroc, Abdellatif Ouahbi, a effectu\u00e9 une visite de travail en Belgique, au cours de laquelle il a eu des entretiens officiels avec son homologue, la ministre de la Justice du Royaume de Belgique, Annelies Verlinden. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, s\u2019est entretenu, lundi \u00e0 Bruxelles, avec son homologue belge, Annelies Verlinden, des moyens de hisser la coop\u00e9ration juridique et judiciaire entre les deux pays \u00e0 un niveau sup\u00e9rieur. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a ouvert une enqu\u00eate...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a ouvert une enqu\u00eate suite \u00e0 des incidents survenus lors des quarts de finale de la CAN 2025, selon un communiqu\u00e9 publi\u00e9 ce lundi 12 janvier. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a ouvert une enqu\u00eate sur les incidents survenus lors du quart de finale Alg\u00e9rie \u2013 Nigeria, ainsi que lors de Cameroun \u2013 Maroc, condamnant \u00ab le comportement inacceptable des joueurs et des officiels \u00bb, a annonc\u00e9 l\u2019instance lundi. [lnt.ma]\n-------------------------------------------------\nApr\u00e8s les incidents d\u2019apr\u00e8s-match entre l\u2019Alg\u00e9rie et le Nigeria, la CAF a d\u00e9cid\u00e9 d\u2019ouvrir une enqu\u00eate sur les incidents survenus lors du quart de finale Alg\u00e9rie \u2013 Nigeria0, condamnant \u00ab le comportement inacceptable des joueurs et des officiels \u00bb, a annonc\u00e9 l\u2019instance lundi. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "\u00c0 l\u2019occasion de la comm\u00e9moration\nde la pr\u00e9sentation du Manifeste...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la comm\u00e9moration de la pr\u00e9sentation du Manifeste de l\u2019Ind\u00e9pendance, le roi Mohammed VI a accord\u00e9 sa gr\u00e2ce \u00e0 1.386 personnes condamn\u00e9es par diff\u00e9rents tribunaux du Royaume, annonce le minist\u00e8re de la Justice dans un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la comm\u00e9moration de la pr\u00e9sentation du Manifeste de l\u2019Ind\u00e9pendance, le Roi Mohammed VI a accord\u00e9 une gr\u00e2ce royale \u00e0 1.386 personnes condamn\u00e9es par diff\u00e9rents tribunaux du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le RNI a approuv\u00e9, \u00e0\nl\u2019issue d\u2019une r\u00e9union pr\u00e9sid\u00e9e par...", "mass": 5, "physics": false, "shape": "box", "title": "Le RNI a approuv\u00e9, \u00e0 l\u2019issue d\u2019une r\u00e9union pr\u00e9sid\u00e9e par M. Aziz Akhannouch, pr\u00e9sident du parti, la liste des membres la Commission pr\u00e9paratoire dudit Congr\u00e8s, indique le bureau politique de la formation partisane. [telquel.ma]\n-------------------------------------------------\nLe Rassemblement national des ind\u00e9pendants (RNI) a tenu, samedi \u00e0 Rabat, la session ordinaire de son Conseil national, une \u00e9tape \u00e0 la fois organisationnelle et politique, conform\u00e9ment aux statuts et au r\u00e8glement int\u00e9rieur du parti. [leseco.ma]\n-------------------------------------------------\nLe bureau politique du RNI a fix\u00e9, dimanche, la date du congr\u00e8s extraordinaire du parti et a pr\u00e9sent\u00e9 le nouvel ouvrage du parti, illustrant l\u2019engagement du RNI \u00e0 renforcer son organisation interne et \u00e0 poursuivre son projet national. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le constructeur automobile Dacia a\nd\u00e9voil\u00e9, \u00e0 l\u2019usine SOMACA de...", "mass": 5, "physics": false, "shape": "box", "title": "Le constructeur automobile Dacia a d\u00e9voil\u00e9, \u00e0 l\u2019usine SOMACA de Casablanca, sa nouvelle gamme de v\u00e9hicules compos\u00e9e des mod\u00e8les Sandero Streetway, Sandero Stepway, Logan et Jogger. [www.challenge.ma]\n-------------------------------------------------\nRenouvellement L\u2019usine Renault Group \u00e0 Casablanca, la Somaca, a c\u00e9l\u00e9br\u00e9 la sortie de cha\u00eene des versions renouvel\u00e9es des mod\u00e8les embl\u00e9matiques de Dacia : Sandero Streetway, Sandero Stepway, Logan et Jogger. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Investissement en Bourse Les interventions\ndes organismes de placement collectif...", "mass": 5, "physics": false, "shape": "box", "title": "Investissement en Bourse Les interventions des organismes de placement collectif en valeurs mobili\u00e8res (OPCVM) et des personnes physiques marocaines, sur le compartiment des actions du march\u00e9 central de la Bourse de Casablanca, ont cumul\u00e9 63,4 % du volume des transactions au troisi\u00e8me trimestre 2025. [aujourdhui.ma]\n-------------------------------------------------\nDerri\u00e8re l\u2019envol\u00e9e des vo     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
