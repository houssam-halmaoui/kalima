9vues par la Direction...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le jeudi 12 novembre 2026 Min Max \u2013 Oujda 16 23 \u2013 Bouarfa 13 23 \u2013 Al Hoceima 16 23 \u2013 T\u00e9touan 16 20 \u2013 Sebta 19 21 \u2013 Mellilia 18 22 \u2013 Tanger 18 21 \u2013 K\u00e9nitra 18 22 . [fr.hespress.com]\n-------------------------------------------------\nVoici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le vendredi 13 novembre 2026 : Min Max \u2013 Oujda 14 23 \u2013 Bouarfa 11 21 \u2013 Al Hoceima 14 20 \u2013 T\u00e9touan 18 20 \u2013 Sebta 18 21 \u2013 Mellilia 17 21 \u2013 Tanger 18 21 \u2013 K\u00e9nitra 17 [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019H\u00f4pital universitaire international Mohammed VI\nde Rabat a annonc\u00e9, le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019H\u00f4pital universitaire international Mohammed VI de Rabat a annonc\u00e9, le 12 novembre, avoir r\u00e9alis\u00e9 avec succ\u00e8s sa premi\u00e8re transplantation h\u00e9patique \u00e0 partir d\u2019une donneuse vivant. [lematin.ma]\n-------------------------------------------------\nL\u2019H\u00f4pital universitaire international Mohammed VI de Rabat a r\u00e9alis\u00e9, le 15 octobre, sa premi\u00e8re transplantation h\u00e9patique \u00e0 partir d\u2019une donneuse vivante. [telquel.ma]\n-------------------------------------------------\nCette intervention, r\u00e9alis\u00e9e le 15 octobre, est la premi\u00e8re greffe du foie \u00e0 partir d\u2019un donneur vivant pratiqu\u00e9e \u00e0 l\u2019H\u00f4pital universitaire international Mohammed VI de Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Sign\u00e9e par la soci\u00e9t\u00e9 Parc\nLogistique et Industriel Int\u00e9gr\u00e9 de...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9e par la soci\u00e9t\u00e9 Parc Logistique et Industriel Int\u00e9gr\u00e9 de Zenata (PLIIZ S.A.) et par Attijariwafa Bank et Bank of Africa, en qualit\u00e9 de co-arrangeurs, en pr\u00e9sence du ministre. [lematin.ma]\n-------------------------------------------------\nLa plateforme logistique et industrielle de Zenata b\u00e9n\u00e9ficiera d\u2019un financement de 300 millions de dirhams pour accompagner ses travaux d\u2019am\u00e9nagement et de lotissement. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Les acquis accomplis au sein\ndu syst\u00e8me de l\u2019\u00e9ducation, de...", "mass": 5, "physics": false, "shape": "box", "title": "Les acquis accomplis au sein du syst\u00e8me de l\u2019\u00e9ducation, de la formation et de la recherche scientifique n\u2019ont pas encore abouti \u00e0 la transformation globale et syst\u00e9mique escompt\u00e9e, telle que pr\u00e9conis\u00e9e par la vision strat\u00e9gique de la r\u00e9forme 2015-2030, a affirm\u00e9, mercredi \u00e0 Rabat, le directeur de l\u2019Instance nationale d\u2019\u00e9valuation (INE), Hicham Ait Mansour. [telquel.ma]\n-------------------------------------------------\nMalgr\u00e9 les avanc\u00e9es enregistr\u00e9es au cours de la derni\u00e8re d\u00e9cennie, le syst\u00e8me marocain d\u2019\u00e9ducation, de formation et de recherche scientifique n\u2019a pas encore connu la transformation structurelle attendue dans le cadre de la Vision strat\u00e9gique 2015-2030. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Les projets ferroviaires en cours\nde r\u00e9alisation, notamment la Ligne...", "mass": 5, "physics": false, "shape": "box", "title": "Les projets ferroviaires en cours de r\u00e9alisation, notamment la Ligne \u00e0 grande vitesse (LGV) qui reliera Tanger \u00e0 Marrakech, vont transformer le paysage du transport et de la mobilit\u00e9 dans le Royaume \u00e0 l\u2019horizon 2029, a affirm\u00e9, mercredi \u00e0 la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [telquel.ma]\n-------------------------------------------------\nDevant la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh, a notamment mis en avant les perspectives offertes par la ligne \u00e0 grande vitesse Tanger-Marrakech, le d\u00e9veloppement des trains r\u00e9gionaux . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Colas Rail, filiale du groupe\nBouygues, vient de remporter un...", "mass": 5, "physics": false, "shape": "box", "title": "Colas Rail, filiale du groupe Bouygues, vient de remporter un nouveau contrat aupr\u00e8s l\u2019Office national des chemins de fer (ONCF). [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des chemins de fer du Maroc (ONCF) a confi\u00e9 \u00e0 l\u2019entreprise fran\u00e7aise Colas Rail un march\u00e9 d\u2019environ 29 millions d\u2019euros pour des travaux dans la r\u00e9gion de Casablanca. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Le groupe haraki \u00e0 la\nChambre des repr\u00e9sentants a propos\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe haraki \u00e0 la Chambre des repr\u00e9sentants a propos\u00e9, dans ses amendements au projet de loi de finances pour 2027, de limiter l\u2019exon\u00e9ration des droits de douane sur les importations de b\u00e9tail et de viande \u00e0 la p\u00e9riode allant du 1er janvier 2027 au 31 d\u00e9cembre 2028, et de soumettre son b\u00e9n\u00e9fice \u00e0 un. [telquel.ma]\n-------------------------------------------------\nL\u2019examen des amendements au projet de loi de finances (PLF) 2027 a donn\u00e9 lieu, mercredi 11 novembre \u00e0 la Chambre des repr\u00e9sentants, \u00e0 plusieurs d\u00e9bats portant sur la r\u00e9glementation de la profession de transitaire en douane, les exon\u00e9rations accord\u00e9es aux importations de b\u00e9tail et de viandes, ainsi que la protection de l\u2019industrie pharmaceutique nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La direction provinciale du minist\u00e8re\nde l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire,...", "mass": 5, "physics": false, "shape": "box", "title": "La direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification a annonc\u00e9 la suspension des cours, mercredi, dans l\u2019ensemble des \u00e9tablissements scolaires en milieu rural, ainsi que durant l\u2019apr\u00e8s-midi dans ceux situ\u00e9s en milieu urbain. [telquel.ma]\n-------------------------------------------------\nLes Directions provinciales de l\u0027\u00c9ducation nationale ont d\u00e9cid\u00e9 cette suspension provisoire \u00e0 la suite du bulletin d\u0027alerte de la DGM. [www.lavieeco.com]\n-------------------------------------------------\nLa suspension des cours \u00e0 Essaouira est prolong\u00e9e \u00e0 toute la journ\u00e9e du jeudi 12 novembre 2026, en raison des mauvaises conditions m\u00e9t\u00e9orologiques. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le groupe Laprophan pr\u00e9voit de\nmettre en service courant 2027,...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Laprophan pr\u00e9voit de mettre en service courant 2027, par l\u2019interm\u00e9diaire de sa filiale Amanys Pharma, une unit\u00e9 de production d\u2019injectables st\u00e9riles \u00e0 A\u00efn El Aouda, pr\u00e8s de Rabat. [www.yabiladi.com]\n-------------------------------------------------\nDot\u00e9e d\u2019une capacit\u00e9 annuelle de 30 millions d\u2019unit\u00e9s, cette installation vise \u00e0 r\u00e9pondre aux besoins du march\u00e9 national tout en ouvrant de nouvelles perspectives \u00e0 l\u2019export. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 travers sa filiale Amanys Pharma, acquise int\u00e9gralement en 2024, il pr\u00e9pare l\u2019entr\u00e9e en activit\u00e9 d\u2019une nouvelle unit\u00e9 sp\u00e9cialis\u00e9e dans la fabrication de m\u00e9dicaments injectables st\u00e9riles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Cette aide, qui couvre la\np\u00e9riode du 1er au 15...", "mass": 5, "physics": false, "shape": "box", "title": "Cette aide, qui couvre la p\u00e9riode du 1er au 15 novembre, vise \u00e0 att\u00e9nuer les effets de la hausse persistante des cours des produits p\u00e9troliers. [www.yabiladi.com]\n-------------------------------------------------\nLe soutien aux transporteurs routiers au Maroc se poursuit avec une nouvelle tranche d\u2019aide exceptionnelle directe, annonc\u00e9e mercredi par le minist\u00e8re du Transport et de la Logistique. [maroc-diplomatique.net]\n-------------------------------------------------\nLe minist\u00e8re du Transport et de la Logistique a annonc\u00e9, mercredi 11 novembre, le lancement d\u2019une nouvelle tranche de soutien exceptionnel direct destin\u00e9e aux professionnels du transport routier de personnes et de marchandises. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le courant \u00e9lectrique a \u00e9t\u00e9\nr\u00e9tabli dans plusieurs zones de...", "mass": 5, "physics": false, "shape": "box", "title": "Le courant \u00e9lectrique a \u00e9t\u00e9 r\u00e9tabli dans plusieurs zones de Casablanca, \u00e0 la suite de la panne \u00e9lectrique ayant affect\u00e9, ce mercredi en fin d\u0027apr\u00e8s-midi, plusieurs quartiers de la m\u00e9tropole, a-t-on constat\u00e9 sur place et aupr\u00e8s des sources pr\u00e9fectorales. [www.lavieeco.com]\n-------------------------------------------------\nUne importante panne \u00e9lectrique a touch\u00e9 plusieurs quartiers de Casablanca mercredi 11 novembre, perturbant l\u2019alimentation en \u00e9lectricit\u00e9 dans diff\u00e9rentes zones de la m\u00e9tropole et dans certaines localit\u00e9s de la province de Nouaceur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, repr\u00e9sente Sa Majest\u00e9 le Roi Mohammed VI aux travaux du Sommet des dirigeants de la COP31, organis\u00e9 les 11 et 12 novembre \u00e0 Antalya, en Turquie. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019Etranger, M. Nasser Bourita, a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, Que Dieu L\u2019Assiste, aux travaux du Sommet des dirigeants de la 31\u00e8me Conf\u00e9rence des Parties \u00e0 la Convention-cadre des Nations Unies sur les changements climatiques (COP31), qui se tient [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Ces d\u00e9l\u00e9gations consid\u00e8rent l\u2019autonomie sous\nsouverainet\u00e9 marocaine comme une base...", "mass": 5, "physics": false, "shape": "box", "title": "Ces d\u00e9l\u00e9gations consid\u00e8rent l\u2019autonomie sous souverainet\u00e9 marocaine comme une base s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste pour parvenir \u00e0 un r\u00e8glement d\u00e9finitif du diff\u00e9rend sur le Sahara. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Plan d\u2019autonomie sous souverainet\u00e9 marocaine s\u2019est vu r\u00e9affirm\u00e9 par trois pays arabes, mercredi devant l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies, qui y voient la seule base s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste pour le r\u00e8glement d\u00e9finitif du diff\u00e9rend artificiel autour du Sahara marocain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "La Conf\u00e9d\u00e9ration marocaine des exportateurs\n(ASMEX) a mis en place...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration marocaine des exportateurs (ASMEX) a mis en place sept commissions th\u00e9matiques pour la mandature 2026-2029. [leseco.ma]\n-------------------------------------------------\nDans un communiqu\u00e9 publi\u00e9 mercredi, l\u2019organisation annonce la nomination des pr\u00e9sidents et vice-pr\u00e9sidents de ses sept commissions th\u00e9matiques, \u00e0 l\u2019issue d\u2019une d\u00e9cision de son Bureau ex\u00e9cutif, pr\u00e9sid\u00e9 par Sonia Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La Caisse mutualiste interprofessionnelle marocaine\n(CMIM) organise, le 25 novembre...", "mass": 5, "physics": false, "shape": "box", "title": "La Caisse mutualiste interprofessionnelle marocaine (CMIM) organise, le 25 novembre 2026, \u00e0 Casablanca, en partenariat avec la Marocaine des jeux et des sports (MDJS), sa 13e Journ\u00e9e Sant\u00e9 au travail, sous le th\u00e8me \u00abRepenser le travail. [leseco.ma]\n-------------------------------------------------\nLa Caisse Mutualiste Interprofessionnelle Marocaine (CMIM) organise, en partenariat avec la Marocaine des Jeux et des Sports (MDJS), le 25 novembre 2026, \u00e0 Casablanca, sa 13\u1d49 Journ\u00e9e Sant\u00e9 au Travail, autour d\u2019une th\u00e9matique au c\u0153ur des transformations du monde professionnel : Repenser le travail. [maroc-diplomatique.net]\n-------------------------------------------------\nLa sant\u00e9 mentale des travailleurs sera au centre de la 13e Journ\u00e9e Sant\u00e9 au Travail organis\u00e9e par la Caisse Mutualiste Interprofessionnelle Marocaine (CMIM), le 25 novembre prochain \u00e0 Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Un test ADN, une famille\naux secrets bien gard\u00e9s et...", "mass": 5, "physics": false, "shape": "box", "title": "Un test ADN, une famille aux secrets bien gard\u00e9s et une enqu\u00eate o\u00f9 l\u2019humour se m\u00eale au suspense : les Th\u00e9\u00e2trales pr\u00e9sentent \u00ab ADN \u00bb, un thriller th\u00e9\u00e2tral inspir\u00e9 de faits r\u00e9els, le jeudi 19 novembre \u00e0 20h30 au Studio des Arts Vivants de Casablanca. [leseco.ma]\n-------------------------------------------------\nLes Th\u00e9\u00e2trales pr\u00e9sentent la pi\u00e8ce \u00ab ADN \u00bb, un thriller m\u00ealant suspense et humour, le jeudi 19 novembre \u00e0 20h30 au Studio des Arts Vivants de Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Cheffe du gouvernement, Fatima\nEzzahra El Mansouri, a eu,...", "mass": 5, "physics": false, "shape": "box", "title": "La Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a eu, jeudi, un entretien t\u00e9l\u00e9phonique avec le Premier ministre de la R\u00e9publique de Roumanie, Luca-Alexandru Niculescu. [fr.hespress.com]\n-------------------------------------------------\nCet entretien t\u00e9l\u00e9phonique a offert l\u0027occasion de mettre en avant la solidit\u00e9 des relations unissant le Royaume du Maroc et la R\u00e9publique de Roumanie et de souligner la n\u00e9cessi. [lematin.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, a eu, ce jeudi, un entretien t\u00e9l\u00e9phonique avec le Premier ministre roumain, Luca-Alexandru Nicolescu, consacr\u00e9 aux perspectives de renforcement de la coop\u00e9ration bilat\u00e9rale entre les deux pays. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Un partenariat de bancassurance de\nlong terme avec Saham Bank...", "mass": 5, "physics": false, "shape": "box", "title": "Un partenariat de bancassurance de long terme avec Saham Bank accompagne la transaction, dont la r\u00e9alisation reste suspendue au feu vert du r\u00e9gulateur. [fr.hespress.com]\n-------------------------------------------------\nWafa Assurance poursuit son d\u00e9veloppement sur le march\u00e9 de l\u2019assurance-vie avec la signature d\u2019un accord aupr\u00e8s du groupe Saham en vue d\u2019acqu\u00e9rir 99,98% du capital de La Marocaine. [lematin.ma]\n-------------------------------------------------\nWafa Assurance a sign\u00e9 un accord en vue de mettre la main sur 99,98% du capital de La Marocaine Vie. [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, qui reste soumise aux autorisations r\u00e9glementaires, s\u0027accompagn         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {

                            x: centerX,

                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
