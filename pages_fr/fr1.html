posantes de la Nation pour la r\u00e9ussite de cette \u00e9dition \u00ab historique \u00bb. [telquel.ma]\n-------------------------------------------------\nA l\u2019issue de la 35\u00e8me \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN), accueillie avec ferveur par le Royaume du Maroc, du 21 d\u00e9cembre 2025 au 18 janvier [www.challenge.ma]\n-------------------------------------------------\nRabat \u2013 Communiqu\u00e9 du Cabinet Royal : \u201cA l\u2019issue de la 35\u00e8me \u00e9dition de la Coupe d\u2019Afrique des Nations, accueillie avec ferveur par le Royaume du Maroc, du 21 d\u00e9cembre 2025 au 18 janvier 2026, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, tient \u00e0 exprimer Ses remerciements \u00e0 l\u2019ensemble des composantes de la [www.lereporter.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue de la 35\u1d49 \u00e9dition de la Coupe d\u2019Afrique des Nations, organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026, le Cabinet Royal a diffus\u00e9 un communiqu\u00e9 dans lequel le Roi Mohammed VI exprime ses remerciements \u00e0 l\u2019ensemble des composantes de la Nation pour leur contribution \u00e0 la r\u00e9ussite de cet \u00e9v\u00e9nement . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des chutes de neige \u00e0\npartir de 1.600 m\u00e8tres d\u2019altitude,...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1.600 m\u00e8tres d\u2019altitude, de fortes pluies et des rafales de vent sont pr\u00e9vus, de jeudi \u00e0 samedi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a \u00e9mis un bulletin d\u2019alerte de niveau orange annon\u00e 00", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La Marocaine des Jeux et\ndes Sports (MDJS) s\u2019est vu...", "mass": 5, "physics": false, "shape": "box", "title": "La Marocaine des Jeux et des Sports (MDJS) s\u2019est vu renouveler ses certifications selon la norme ISO/IEC 27001:2022 et les standards de contr\u00f4le de s\u00e9curit\u00e9 de la World [www.challenge.ma]\n-------------------------------------------------\nLa MDJS s\u2019est vu renouveler ses certifications selon la norme L\u2019ISO/IEC 27001 version 2022 et les standards de contr\u00f4le de s\u00e9curit\u00e9 de la World Lottery Association (WLA), version 2024. [www.lavieeco.com]\n-------------------------------------------------\nLa Marocaine des Jeux et des Sports (MDJS) s\u2019est vu renouveler ses certifications selon la norme ISO/IEC 27001:2022 et les standards de contr\u00f4le de s\u00e9curit\u00e9 de la World Lottery Association (WLA), version 2024. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Bank of Africa annonce l\u2019obtention\nde l\u2019agr\u00e9ment de N\u00e9gociateur Compensateur...", "mass": 5, "physics": false, "shape": "box", "title": "Bank of Africa annonce l\u2019obtention de l\u2019agr\u00e9ment de N\u00e9gociateur Compensateur (NC) dans le cadre de l\u2019op\u00e9rationnalisation du march\u00e9 \u00e0 terme au Maroc, confirmant sa position \u00abd\u2019acteur syst\u00e9mique et [www.challenge.ma]\n-------------------------------------------------\nBank Of Africa (BOA) a annonc\u00e9, ce jeudi, l\u2019obtention de l\u2019agr\u00e9ment de N\u00e9gociateur Compensateur (NC), dans le cadre de l\u2019op\u00e9rationnalisation du march\u00e9 \u00e0 terme au Maroc. [leseco.ma]\n-------------------------------------------------\nBANK OF AFRICA a annonc\u00e9, le 21 janvier 2026 \u00e0 Casablanca, l\u2019obtention de l\u2019agr\u00e9ment de N\u00e9gociateur Compensateur (NC) dans le cadre de l\u2019op\u00e9rationnalisation du march\u00e9 \u00e0 terme au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Position ext\u00e9rieure globale : Le\nd\u00e9ficit patrimonial du Maroc se...", "mass": 5, "physics": false, "shape": "box", "title": "Position ext\u00e9rieure globale : Le d\u00e9ficit patrimonial du Maroc se r\u00e9duit \u00e0 758 MMDH \u00e0 fin septembre 2025. [www.lavieeco.com]\n-------------------------------------------------\nLa position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, fait ressortir une situation nette d\u00e9bitrice de 758 milliards de dirhams (MMDH) au terme des neuf premiers mois de 2025, contre -791 MMDH \u00e0 fin juin dernier, selon l\u2019Office des Changes. [maroc-diplomatique.net]\n-------------------------------------------------\nLa position ext\u00e9rieure globale du Maroc, qui refl\u00e8te la situation patrimoniale de l\u2019\u00e9conomie nationale vis-\u00e0-vis du reste du monde, fait ressortir une situation nette d\u00e9bitrice de 758 milliards de dirhams (MMDH) au terme des neuf premiers mois de 2025, contre -791 MMDH \u00e0 fin juin dernier, selon l\u2019Office des Changes. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Nadia Fettah et Claver Gatete\nont sign\u00e9, ce jeudi 22...", "mass": 5, "physics": false, "shape": "box", "title": "Nadia Fettah et Claver Gatete ont sign\u00e9, ce jeudi 22 janvier \u00e0 Rabat, l\u2019accord du pays h\u00f4te pour l\u2019organisation de la 58e session de la Conf\u00e9rence des ministres africains des finances de la CEA (COM58), pr\u00e9vue \u00e0 Tanger du 28 mars au 3 avril 2026, marquant une \u00e9tape cl\u00e9 dans les pr\u00e9paratifs de cet \u00e9v\     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
