 en tant qu\u2019acteur cl\u00e9 du financement des entreprises. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Sous la pr\u00e9sidence de la\nPrincesse Lalla Meryem, l\u2019Observatoire National...", "mass": 5, "physics": false, "shape": "box", "title": "Sous la pr\u00e9sidence de la Princesse Lalla Meryem, l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE), a tenu, ce lundi 30 mars \u00e0 Rabat, sa rencontre annuelle avec ses partenaires institutionnels, publics et priv\u00e9s. [fr.hespress.com]\n-------------------------------------------------\nSous la pr\u00e9sidence de Son Altesse Royale La Princesse Lalla Meryem, l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE), a tenu ce lundi 30 mars 2026 \u00e0 Rabat sa rencontre annuelle avec ses partenaires institutionnels, publics et priv\u00e9s. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019\u00e9quipe nationale marocaine des moins\nde 17 ans s\u2019est impos\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale marocaine des moins de 17 ans s\u2019est impos\u00e9e face \u00e0 son homologue \u00e9gyptienne sur le score de 2 buts \u00e0 1, lundi \u00e0 Benghazi (Libye), en match comptant pour la 3e jo. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine des moins de 17 ans sest impos\u00e9e face \u00e0 son homologue \u00e9gyptienne sur le score de 2 buts \u00e0 1, lors du match disput\u00e9 lundi \u00e0 Benghazi (Libye), pour le compte de la troisi\u00e8me journ\u00e9e du tournoi de l\u2019Union nord-africaine de football (UNAF), qualificatif \u00e0 la Coupe d\u2019Afrique des nations (CAN) de la cat\u00e9gorie. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc U17 de football s\u2019est impos\u00e9e face \u00e0 son homologue \u00e9gyptienne sur le score de 2 buts \u00e0 1, lundi \u00e0 Benghazi en Libye, en match de la 3e journ\u00e9e du tournoi de l\u2019Union nord-africaine de football (UNAF), qualificatif \u00e0 la Coupe d\u2019Afrique des nations (CAN) de la cat\u00e9gorie. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Lors de cette c\u00e9r\u00e9monie, tenue\nen pr\u00e9sence de chefs d\u2019\u00c9tat...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette c\u00e9r\u00e9monie, tenue en pr\u00e9sence de chefs d\u2019\u00c9tat et de d\u00e9l\u00e9gations \u00e9trang\u00e8res, de membres du Corps diplomatique accr\u00e9dit\u00e9 \u00e0 Bangui, ainsi que de plusieurs autres personna. [lematin.ma]\n-------------------------------------------------\n\u00c0 cette occasion, le pr\u00e9sident de la Chambre des repr\u00e9sentants a transmis au chef d\u0027Etat Faustin-Archange Touadera les f\u00e9licitations et salutations de SM le Roi Mohammed VI et l\u2019engagement constant du Souverain \u00e0 \u0153uvrer pour le d\u00e9veloppement et le renforcement de la stabilit\u00e9 du continent africain. [www.lavieeco.com]\n-------------------------------------------------\nLe Pr\u00e9sident de la Chambre des repr\u00e9sentants, Rachid Talbi El Alami, a repr\u00e9sent\u00e9, lundi \u00e0 Bangui, Sa Majest\u00e9 le Roi Mohammed VI, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture du Pr\u00e9sident de la R\u00e9publique centrafricaine, Faustin-Archange Touadera. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Un communiqu\u00e9 du P\u00f4le DGSN-DGST\nindique que cette visite s\u0027inscrit...", "mass": 5, "physics": false, "shape": "box", "title": "Un communiqu\u00e9 du P\u00f4le DGSN-DGST indique que cette visite s\u0027inscrit dans le cadre de la volont\u00e9 des services s\u00e9curitaires lib\u00e9riens de tirer profit de l\u0027exp\u00e9rience marocaine. [lematin.ma]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire, Abdellatif Hammouchi, a re\u00e7u, ce lundi apr\u00e8s-midi \u00e0 Rabat, lambassadeur de la R\u00e9publique dIndon\u00e9sie au Maroc, Yuyu Sutisna. [www.yabiladi.com]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, lundi \u00e0 Rabat, l\u0027Inspecteur g\u00e9n\u00e9ral de la Police de la R\u00e9publique du Lib\u00e9ria, Gregory Coleman, accompagn\u00e9 de l\u0027ambassadeur de son pays \u00e0 Rabat et d\u0027une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau. [atlasinfo.fr]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, lundi \u00e0 Rabat, l\u2019Inspecteur g\u00e9n\u00e9ral de la Police de la R\u00e9publique du Lib\u00e9ria, Gregory Coleman, accompagn\u00e9 de l\u2019ambassadeur de son pays \u00e0 Rabat et d\u2019une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau. [www.lereporter.ma]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la s\u00fbret\u00e9 nationale et de la Surveillance du territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, lundi \u00e0 Rabat, l\u2019Inspecteur g\u00e9n\u00e9ral de la police de la R\u00e9publique du Lib\u00e9ria, Gregory Coleman, accompagn\u00e9 de l\u2019ambassadeur de son pays \u00e0 Rabat et d\u2019une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#00     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
