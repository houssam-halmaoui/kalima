spress.com]\n-------------------------------------------------\nInitialement programm\u00e9e le dimanche 24 mai \u00e0 20h00, cette rencontre d\u00e9butera finalement \u00e0 17h00 sur le terrain n\u00b08 du Complexe Mohammed VI de Football, a indiqu\u00e9 la F\u00e9d\u00e9ration Roya. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a avanc\u00e9 lhoraire du match opposant le Maroc au Cameroun, comptant pour les quarts de finale de la Coupe dAfrique des nations (CAN U17). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nNasser Bourita, a re\u00e7u, vendredi...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, Nasser Bourita, a re\u00e7u, vendredi \u00e0 Rabat, son homologue mauritanien, Mohamed Salem Ould Merzoug, \u00e9missaire du pr\u00e9sident mauritanien, Mohamed Ould Cheikh El Ghazouani, porteur d\u2019un message au Roi Mohammed VI. [fr.hespress.com]\n-------------------------------------------------\nLors de cette rencontre, durant laquelle Nasser Bourita a r\u00e9affirm\u00e9 la profondeur des relations maroco-mauritaniennes, les deux parties ont pass\u00e9 en revue la coop\u00e9ration bilat\u00e9rale. [lematin.ma]\n-------------------------------------------------\nLe ministre mauritanien des Affaires \u00e9trang\u00e8res, Mohamed Salem Ould Merzoug, a \u00e9t\u00e9 re\u00e7u vendredi \u00e0 Rabat par Nasser Bourita en sa qualit\u00e9 d\u2019\u00e9missaire du pr\u00e9sident Mohamed Ould Cheikh El Ghazouani, porteur d\u2019un message au roi Mohammed VI. [telquel.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a re\u00e7u, jeudi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res et de la Coop\u00e9ration internationale de la R\u00e9publique de Rwanda, Olivier Nduhungirehe, porteur d\u2019un message \u00e9crit du Pr\u00e9sident rwandais, S.E.M. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a re\u00e7u, vendredi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration et des Mauritaniens de l\u2019ext\u00e9rieur, Mohamed Salem Ould Merzoug, \u00e9missaire du pr\u00e9sident mauritanien, Mohamed Ould Cheikh El Ghazouani, porteur d\u2019un message au Roi Mohammed VI. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Lors de ce d\u00e9fil\u00e9 d\u0027exception,\nqui a r\u00e9uni des cr\u00e9ateurs...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de ce d\u00e9fil\u00e9 d\u0027exception, qui a r\u00e9uni des cr\u00e9ateurs venus de diff\u00e9rentes r\u00e9gions du continent africain, la styliste et designer marocaine Noura Begbeg a pr\u00e9sent\u00e9 une colle. [lematin.ma]\n-------------------------------------------------\nLe caftan marocain, dans toute sa splendeur et sa magnificence a brill\u00e9 de mille feux, jeudi \u00e0 Paris, lors d\u2019un d\u00e9fil\u00e9 de mode organis\u00e9 dans le cadre de la Semaine africaine de l\u2019Organisation des Nations Unies pour l\u2019\u00e9ducation, la science et la culture (UNESCO) (19-22 mai). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\npar le Vice-ministre panam\u00e9en des...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim e afin de valoriser les produits fabriqu\u00e9s au Maroc et de promouvoir le savoir-faire industriel national. [leseco.ma]\n-------------------------------------------------\nPr\u00e8s de 80 entreprises industrielles ont re\u00e7u, jeudi \u00e0 Casablanca, les certificats de labellisation \u00ab Made in Morocco \u00bb, lors d\u2019une c\u00e9r\u00e9monie tenue sous la pr\u00e9sidence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Saisi en urgence par le\nchef du gouvernement, le Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Saisi en urgence par le chef du gouvernement, le Conseil de la concurrence a approuv\u00e9, le 21 mai 2026, la mise en place de mesures temporaires pour r\u00e9guler les march\u00e9s d\u00e9di\u00e9s \u00e0 la vente des moutons de l\u2019A\u00efd. [telquel.ma]\n-------------------------------------------------\nSaisi par le chef du gouvernement, le Conseil de la concurrence vient de valider, dans un avis publi\u00e9 ce vendredi, les mesures mises en place pour combattre la sp\u00e9culation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le projet \u00ab \u00c9limination des\nproduits chimiques dangereux de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet \u00ab \u00c9limination des produits chimiques dangereux de la cha\u00eene d\u2019approvisionnement du secteur de la construction au Maroc \u00bb a \u00e9t\u00e9 lanc\u00e9, vendredi \u00e0 Rabat, dans le cadre des efforts engag\u00e9s en faveur de la transition vers un mod\u00e8le de construction durable et \u00e9nerg\u00e9tiquement efficace. [telquel.ma]\n-------------------------------------------------\nPort\u00e9 par l\u2019Organisation des Nations unies pour le d\u00e9veloppement industriel (ONUDI), il est mis en \u0153uvre par lAgence marocaine pour lefficacit\u00e9 \u00e9nerg\u00e9tique (AMEE), avec l\u2019appui financier du Fonds pour l\u2019environnement mondial (FEM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Groupe de la Banque\nafricaine de d\u00e9veloppement (BAD) et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Groupe OCP ont sign\u00e9, vendredi \u00e0 Rabat, un accord portant sur une garantie partielle de cr\u00e9dit d\u2019un montant de 450 millions d\u2019euros afin de contribuer \u00e0 financer le programme d\u2019investissement du leader mondial des solutions de nutrition des plantes et des engrais phosphat\u00e9s. [telquel.ma]\n-------------------------------------------------\nLe groupe de la Banque africaine de d\u00e9veloppement et OCP Group ont sign\u00e9, jeudi \u00e0 Rabat, un accord portant sur une garantie partielle de cr\u00e9dit de 450 millions d\u2019euros (4,9 milliards de dirhams). [www.yabiladi.com]\n-------------------------------------------------\nLa Banque africaine de d\u00e9veloppement et le Groupe OCP ont sign\u00e9 \u00e0 Rabat un accord de garantie partielle de cr\u00e9dit de 450 millions d\u2019euros, destin\u00e9 \u00e0 faciliter la mobilisation d\u2019un financement vert de 530 millions d\u2019euros aupr\u00e8s de grandes banques europ\u00e9ennes, en soutien au programme d\u2019investissement 2023-2030 du groupe orient\u00e9 vers la transition industrielle et \u00e9nerg\u00e9tique. [www.lavieeco.com]\n-------------------------------------------------\nLe Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Groupe OCP ont sign\u00e9, vendredi \u00e0 Rabat, un accord portant sur une garantie partielle de cr\u00e9dit d\u2019un montant de 450 millions d\u2019euros afin de contribuer \u00e0 financer le programme d\u2019investissement du leader mondial des solutions de nutrition des plantes et des engrais phosphat\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les recettes douani\u00e8res constat\u00e9es au\ntitre de l\u2019ann\u00e9e 2025 ont...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes douani\u00e8res constat\u00e9es au titre de l\u2019ann\u00e9e 2025 ont atteint un record jamais r\u00e9alis\u00e9 auparavant, soit 162,7 milliards de dirhams (MMDH) contre 148,6 MMDH en 2024, affichant un taux de croissance de 9,5%, selon l\u2019Administration des Douanes et Imp\u00f4ts Indirects (ADII). [telquel.ma]\n-------------------------------------------------\nLes recettes douani\u00e8res constat\u00e9es au titre de l\u2019ann\u00e9e 2025 ont atteint un record jamais r\u00e9alis\u00e9 auparavant, soit 162,7 milliards de dirhams (MMDH) contre 148,6 MMDH en 2024, affichant un taux de croissance de 9,5%, selon l\u2019Administration des Douanes et Imp\u00f4ts Indirects (ADII). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019indice des prix \u00e0 la\nconsommation (IPC) a enregistr\u00e9, en...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en avril dernier, une hausse de 1,7% comparativement au m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nL\u0027indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en avril dernier, une hausse de 1,7% comparativement au m\u00eame mois de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nL\u2019indice des prix \u         });

            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
