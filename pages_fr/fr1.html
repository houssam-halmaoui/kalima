iz Akhannouch, a re\u00e7u, mardi \u00e0 Rabat, le pr\u00e9sident de l\u2019Autorit\u00e9 Nationale du Renseignement Financier (ANRF), qui lui a pr\u00e9sent\u00e9 le rapport annuel de l\u2019Autorit\u00e9 au titre de l\u2019ann\u00e9e 2024, conform\u00e9ment aux dispositions de la loi n\u00b0 43-05 relative \u00e0 la lutte contre le blanchiment de capitaux. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "En pleine Coupe d\u2019Afrique des\nNations 2025, l\u2019Office national des...", "mass": 5, "physics": false, "shape": "box", "title": "En pleine Coupe d\u2019Afrique des Nations 2025, l\u2019Office national des a\u00e9roports (ONDA) a acc\u00e9l\u00e9r\u00e9 le d\u00e9ploiement du parcours passager digitalis\u00e9 \u00e0 l\u2019a\u00e9roport Mohammed V de Casablanca afin de fluidifier les passages et am\u00e9liorer l\u2019exp\u00e9rience des voyageurs attendus durant la comp\u00e9tition. [telquel.ma]\n-------------------------------------------------\nQuelques jours apr\u00e8s le coup d\u2019envoi de la Coupe d\u2019Afrique des Nations (CAN 2025), l\u2019Office National Des A\u00e9roports (ONDA) a acc\u00e9l\u00e9r\u00e9 le d\u00e9ploiement du parcours passager digitalis\u00e9 \u00e0 [www.challenge.ma]\n-------------------------------------------------\nQuelques jours apr\u00e8s le coup d\u2019envoi de la Coupe d\u2019Afrique des nations (CAN 2025), l\u2019Office national des a\u00e9roports (ONDA) a acc\u00e9l\u00e9r\u00e9 le d\u00e9ploiement du parcours passager digitalis\u00e9 \u00e0 l\u2019a\u00e9roport Mohammed V de Casablanca afin de fluidifier les passages et am\u00e9liorer l\u2019exp\u00e9rience des voyageurs attendus durant la comp\u00e9tition. [www.yabiladi.com]\n-------------------------------------------------\nQuelques jours apr\u00e8s le coup d\u2019envoi de la Coupe d\u2019Afrique des Nations (CAN 2025), l\u2019Office National Des A\u00e9roports (ONDA) a acc\u00e9l\u00e9r\u00e9 le d\u00e9ploiement du parcours passager digitalis\u00e9 \u00e0 l\u2019a\u00e9roport Mohammed V de Casablanca afin de fluidifier les passages et am\u00e9liorer l\u2019exp\u00e9rience des voyageurs attendus durant la comp\u00e9tition. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "Le Conseil d\u2019administration de la\nBourse de Casablanca a nomm\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019administration de la Bourse de Casablanca a nomm\u00e9, \u00e0 l\u2019unanimit\u00e9, Nasser Seddiqi au poste de Directeur G\u00e9n\u00e9ral, conform\u00e9ment aux dispositions l\u00e9gales et statutaires. [telquel.ma]\n-------------------------------------------------\nNasser Seddiqi sera le nouveau directeur g\u00e9n\u00e9ral de la Bourse de Casablanca \u00e0 compter du 19 janvier 2026, suite \u00e0 une d\u00e9cision unanime du Conseil d\u2019administration. [www.challenge.ma]\n-------------------------------------------------\nNasser Seddiqi a \u00e9t\u00e9 nomm\u00e9 \u00e0 l\u2019unanimit\u00e9 nouveau directeur g\u00e9n\u00e9ral de la Bourse de Casablanca par le Conseil d\u2019administration, qui lui a exprim\u00e9 sa pleine confiance. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil d\u0027Administration de la Bourse de Casablanca a nomm\u00e9, \u00e0 l\u2019unanimit\u00e9, Nasser Seddiqi au poste de directeur g\u00e9n\u00e9ral, conform\u00e9ment aux dispositions l\u00e9gales et statutaires. [leseco.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration de la Bourse de Casablanca a proc\u00e9d\u00e9, \u00e0 l\u2019unanimit\u00e9, \u00e0 la nomination de Nasser Seddiqi au poste de Directeur g\u00e9n\u00e9ral, conform\u00e9ment aux dispositions l\u00e9gales et statutaires. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": tr aire (CMI). [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le groupe marocain Akdital, qui\ns\u2019est impos\u00e9 dans le secteur...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe marocain Akdital, qui s\u2019est impos\u00e9 dans le secteur priv\u00e9 de la sant\u00e9 ces derni\u00e8res ann\u00e9es au Maroc, a annonc\u00e9 mardi la signature d\u2019un protocole d\u2019accord portant sur l\u2019acquisition de la totalit\u00e9 du capital de Taoufik Hospitals Group (THG) pour un montant de 90 millions de dollars (900 millions de dirhams). [telquel.ma]\n-------------------------------------------------\nLe groupe Akdital, leader du secteur priv\u00e9 de la sant\u00e9 au Maroc, a annonc\u00e9, mardi 23 d\u00e9cembre, la signature d\u2019un protocole d\u2019accord portant sur l\u2019acquisition de la totalit\u00e9 [www.challenge.ma]\n-------------------------------------------------\nLe groupe marocain Akdital, leader du secteur priv\u00e9 de la sant\u00e9 au Maroc, a annonc\u00e9 mardi la signature d\u2019un protocole d\u2019accord portant sur l\u2019acquisition de la totalit\u00e9 du capital de Taoufik Hospitals Group (THG) pour un montant de 90 millions de dollars (M$). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La Commission de l\u2019enseignement et\ndes affaires culturelles et sociales...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de l\u2019enseignement et des affaires culturelles et sociales \u00e0 la Chambre des conseillers a adopt\u00e9, lundi \u00e0 la majorit\u00e9, le projet de loi n\u00b0 026.25 portant r\u00e9organisation du Conseil national de la presse, tel que transmis par la Chambre des repr\u00e9sentants. [telquel.ma]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9 le projet de loi 26.25 portant r\u00e9organisation du Conseil national de la presse, lors d\u2019une s\u00e9ance l\u00e9gislative marqu\u00e9e par le retra. [lematin.ma]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9, lors d\u0027une s\u00e9ance l\u00e9gislative tenue mercredi, le projet de loi N\u00b0 26.25 portant r\u00e9organisation du Conseil national de la presse, apr\u00e8s le retrait de l\u0027opposition. [www.lopinion.ma]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9, lors d\u0027une s\u00e9ance l\u00e9gislative tenue mercredi, le projet de loi N\u00b0 26.25 portant r\u00e9organisation du Conseil national de la presse, apr\u00e8s le retrait de l\u0027opposition. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "A l\u2019occasion de la Coupe\nd\u2019Afrique organis\u00e9e au Maroc, Haier,...", "mass": 5, "physics": false, "shape": "box", "title": "A l\u2019occasion de la Coupe d\u2019Afrique organis\u00e9e au Maroc, Haier, sponsor officiel des \u00e9quipes nationales marocaines de football, a inaugur\u00e9 le Haier Club \u00e0 Casablanca, un espace institutionnel [www.challenge.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la Coupe d\u2019Afrique organis\u00e9e au Maroc, Haier, sponsor officiel des \u00e9quipes nationales marocaines, a inaugur\u00e9 le Haier Club, un espace institutionnel et exp\u00e9rientiel d\u00e9di\u00e9 \u00e0 la valorisation de son partenariat strat\u00e9gique avec le football marocain, ainsi qu\u2019\u00e0 la promotion de l\u2019innovation et de l\u2019exp\u00e9rience de marque. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le ministre de l\u2019Int\u00e9rieur vient\nd\u2019annoncer les couleurs de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur vient d\u2019annoncer les couleurs de la r\u00e9forme \u00e0 venir dans le secteur du transport par taxi. [www.challenge.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a lanc\u00e9, au cours de cette ann\u00e9e, une \u00e9tude strat\u00e9gique approfondie visant \u00e0 identifier et diagnostiquer les dysfonctionnements du secteur du transport par taxis, et \u00e0 pr\u00e9senter des propositions \u00e0 m\u00eame de les d\u00e9passer et de d\u00e9velopper et d\u0027organiser le secteur, a indiqu\u00e9, lundi \u00e0 Rabat, le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "C\u2019est le 18 d\u00e9cembre dernier,\nsur le circuit de l\u2019UTAC...", "mass": 5, "physics": false, "shape": "box", "title": "C\u2019est le 18 d\u00e9cembre dernier, sur le circuit de l\u2019UTAC au Maroc, que Renault a \u00e9tabli un nouveau record d\u2019efficience \u00e9lectrique avec son prototype Filante Record 2025. [www.challenge.ma]\n-------------------------------------------------\nLe 18 d\u00e9cembre, le v\u00e9hicule a parcouru 1 008 kilom\u00e8tres en moins de 10 heures, avec une vitesse moyenne de 102 km/h, sans recharge, sur la piste dessai UTAC Ceram \u00e0 Oued Zem. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 30, "id": "comm_label_30", "label": "Dot\u00e9e d\u2019une capacit\u00e9 de 2\nMWc, la centrale install\u00e9e sur...", "mass": 5, "physics": false, "shape": "box", "title": "Dot\u00e9e d\u2019une capacit\u00e9 de 2 MWc, la centrale install\u00e9e sur ce site pilote, regroupe 3.254 modules photovolta\u00efques install\u00e9s sur une superficie de 1,5 hectare. [www.lavieeco.com]\n-------------------------------------------------\nLesieur Cristal, a inaugur\u00e9 mardi, sa nouvelle centrale photovolta\u00efque au sol install\u00e9e sur son site industriel d\u2019A\u00efn Harrouda, un projet d\u00e9velopp\u00e9 par Nareva Services. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Comit\u00e9 de coordination et\nde surveillance des risques syst\u00e9miques...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), r\u00e9uni mardi au si\u00e8ge de Bank Al-Maghrib (BAM) \u00e0 Rabat, a examin\u00e9 et valid\u00e9 une nouvelle feuille de route visant \u00e0 consolider les acquis et \u00e0 renforcer le dispositif national de stabilit\u00e9 financi\u00e8re. [www.lavieeco.com]\n-------------------------------------------------\nLe secteur bancaire marocain a confirm\u00e9 le renforcement de ses fondamentaux financiers, selon le Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), qui a tenu mardi au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union. [maroc-diplomatique.net]\n-------------------------------------------------\nLe secteur bancaire marocain a confirm\u00e9 le renforcement de ses fondamentaux financiers, selon le Comit\u00e9 de coordination et de surveillance des risques syst\u00e9miques (CCSRS), qui a tenu mardi au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union. [leseco.ma]\n-------------------------------------------------\nLe Comit\u00e9 de Coordination et de Surveillance des Risques Syst\u00e9miques (CCSRS) a tenu, le 23 d\u00e9cembre 2025 au si\u00e8ge de Bank Al-Maghrib \u00e0 Rabat, sa vingt-deuxi\u00e8me r\u00e9union, consacr\u00e9e \u00e0 l\u2019examen de la situation du syst\u _label_15", "label": "Des chutes de neige, de\nfortes pluies parfois orageuses et...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige, de fortes pluies parfois orageuses et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lereporter.ma]\n-------------------------------------------------\nDes chutes de neige, de fortes pluies parfois orageuses et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]\n-------------------------------------------------\nDe fortes pluies, des chutes de neige au-del\u00e0 de 1.500 m et un temps froid sont pr\u00e9vus de mercredi \u00e0 samedi dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDe fortes pluies, des chutes de neige au-del\u00e0 de 1.500 m et un temps froid sont pr\u00e9vus de mercredi \u00e0 samedi dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDe fortes pluies, des chutes de neige au-del\u00e0 de 1.500 m et un temps froid sont pr\u00e9vus de mercredi \u00e0 samedi dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Parlement alg\u00e9rien a adopt\u00e9\nmercredi \u00e0 l\u2019unanimit\u00e9 une loi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parlement alg\u00e9rien a adopt\u00e9 mercredi \u00e0 l\u2019unanimit\u0     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {

                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }

                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,

                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
