 d\u2019emplois et \u00e0 [www.challenge.ma]\n-------------------------------------------------\nLe Groupe de la Banque mondiale a annonc\u00e9 le lancement d\u2019un nouveau Cadre de partenariat de dix ans avec le Maroc pour acc\u00e9l\u00e9rer la prochaine phase de croissance et de cr\u00e9ation d\u2019emplois du Royaume et soutenir ses priorit\u00e9s de d\u00e9veloppement ambitieuses, ainsi que sa vision d\u2019une \u00e9conomie plus inclusive, comp\u00e9titive et r\u00e9siliente. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Chambre des conseillers a\nadopt\u00e9 \u00e0 l\u2019unanimit\u00e9, lundi lors...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9, lundi lors d\u2019une s\u00e9ance l\u00e9gislative, le projet de loi n\u00b047.26 relatif au Haut-Commissariat au Plan (HCP) et le projet de loi n\u00b046. [lematin.ma]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u0027unanimit\u00e9 deux projets de loi relatifs au Haut-Commissariat au plan (HCP) et au Syst\u00e8me statistique national, visant \u00e0 renforcer la gouvernance de l\u0027institution, moderniser le cadre juridique des statistiques officielles et am\u00e9liorer la coordination de la production des donn\u00e9es publiques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette \u00e9volution traduit la confiance\ncroissante des investisseurs dans le...", "mass": 5, "physics": false, "shape": "box", "title": "Cette \u00e9volution traduit la confiance croissante des investisseurs dans le potentiel de la fili\u00e8re et l\u2019efficacit\u00e9 des dispositifs d\u2019accompagnement mis en place, indique le secr\u00e9tar. [lematin.ma]\n---------------------------- "bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "BMCE Capital Global Research (BKGR)\na recommand\u00e9 de souscrire \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "BMCE Capital Global Research (BKGR) a recommand\u00e9 de souscrire \u00e0 l\u2019introduction en Bourse (IPO \u2013 Initial Public Offering) de T2S Group Holding, r\u00e9alis\u00e9e par augmentation de capital r\u00e9serv\u00e9e au public et cession d\u2019actions, au prix de 223 dirhams par action. [telquel.ma]\n-------------------------------------------------\nBMCE Capital Global Research (BKGR) a recommand\u00e9 de souscrire \u00e0 l\u0027introduction en Bourse (IPO \u2013 Initial Public Offering) de T2S Group Holding, r\u00e9alis\u00e9e par augmentation de capital r\u00e9serv\u00e9e au public et cession d\u0027actions, au prix de 223 dirhams par action. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Deux manifestants et deux gendarmes\nont \u00e9t\u00e9 bless\u00e9s lors de...", "mass": 5, "physics": false, "shape": "box", "title": "Deux manifestants et deux gendarmes ont \u00e9t\u00e9 bless\u00e9s lors de heurts ayant \u00e9clat\u00e9 lundi 13 juillet au soir dans deux exploitations agricoles d\u2019un douar relevant de la commune de Sidi Mohamed Ben Mansour, dans la province de K\u00e9nitra. [telquel.ma]\n-------------------------------------------------\nLes \u00e9l\u00e9ments dune patrouille relevant du centre territorial de la Gendarmerie royale de Ben Mansour (province de K\u00e9nitra) ont fait usage, lundi soir, de leurs armes de service \u00e0 titre de sommation, lors dune intervention visant \u00e0 neutraliser le danger \u00e9manant dindividus en \u00e9tat de forte impulsivit\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Des bulletins d\u2019alerte ont \u00e9t\u00e9\ng\u00e9n\u00e9ralis\u00e9s \u00e0 l\u2019ensemble des collectivit\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Des bulletins d\u2019alerte ont \u00e9t\u00e9 g\u00e9n\u00e9ralis\u00e9s \u00e0 l\u2019ensemble des collectivit\u00e9s territoriales du Royaume, dans le cadre du renforcement de la pr\u00e9paration face aux risques naturels, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nDes bulletins dalerte ont \u00e9t\u00e9 g\u00e9n\u00e9ralis\u00e9s \u00e0 lensemble des collectivit\u00e9s territoriales du Maroc, dans le cadre du renforcement de la pr\u00e9paration face aux risques naturels, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u00c9quipement et de leau, Nizar Baraka. [www.yabiladi.com]\n-------------------------------------------------\nDevant la Chambre des repr\u00e9sentants, le ministre de l\u0027\u00c9quipement et de l\u0027eau, Nizar Baraka, a d\u00e9taill\u00e9 les mesures prises pour renforcer la pr\u00e9paration du Royaume face aux risques naturels. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Sur instructions du roi, chef\nsupr\u00eame et chef d\u2019\u00e9tat-major g\u00e9n\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "Sur instructions du roi, chef supr\u00eame et chef d\u2019\u00e9tat-major g\u00e9n\u00e9ral des Forces arm\u00e9es royales, le g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e Mohammed Berrid, inspecteur g\u00e9n\u00e9ral des FAR et commandant la Zone Sud, s\u2019est rendu lundi \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation, au si\u00e8ge de l\u2019US AFRICOM \u00e0 Stuttgart en Allemagne, pour une visite de travail. [telquel.ma]\n------------         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
