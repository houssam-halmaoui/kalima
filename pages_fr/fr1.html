itation et d\u2019\u00e9quipement de ces structures, a annonc\u00e9 le minist\u00e8re de la Sant\u00e9 et de la Protection sociale. [telquel.ma]\n-------------------------------------------------\nL\u2019offre de soins nationale s\u2019est renforc\u00e9e avec la mise en service, mardi, de 15 \u00e9tablissements de soins de sant\u00e9 primaires dans six r\u00e9gions du Royaume, \u00e0 l\u2019issue de l\u2019ach\u00e8vement des travaux de r\u00e9habilitation et d\u2019\u00e9quipement de ces structures, a annonc\u00e9 le minist\u00e8re de la Sant\u00e9 et de la Protection sociale. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Un groupe de 40 pays\na r\u00e9affirm\u00e9 son soutien \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Un groupe de 40 pays a r\u00e9affirm\u00e9 son soutien \u00e0 la \u00ab pleine souverainet\u00e9 du Maroc sur ses provinces du Sud \u00bb, estimant que le r\u00e8glement de la question du Sahara s\u2019inscrit dans le cadre du processus politique plac\u00e9 sous l\u2019\u00e9gide du Conseil de s\u00e9curit\u00e9 et que l\u2019initiative marocaine d\u2019autonomie constitue une base r\u00e9aliste pour. [telquel.ma]\n-------------------------------------------------\nLe Maroc sest exprim\u00e9, ce mardi, au nom dun groupe de 40 \u00c9tats qui soutiennent sa souverainet\u00e9 sur le Sahara et sa proposition dautonomie, en tant que solution durable au diff\u00e9rend r\u00e9gional. [www.yabiladi.com]\n-------------------------------------------------\nDans une d\u00e9claration lors de la 63e session du Conseil des droits de l\u2019Homme, prononc\u00e9e par l\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU \u00e0 Gen\u00e8ve, Omar Zniber, le. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Fouzi Lekjaa, membre du bureau\npolitique du Parti authenticit\u00e9 et...", "mass": 5, "physics": false, "shape": "box", "title": "Fouzi Lekjaa, membre du bureau politique du Parti authenticit\u00e9 et modernit\u00e9 (PAM) et ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, a r\u00e9pondu aux critiques formul\u00e9es par le Rassemblement national des ind\u00e9pendants (RNI) contre le programme \u00e9lectoral de son parti. [telquel.ma]\n-------------------------------------------------\nFouzi Lekjaa, membre du bureau politique du Parti authenticit\u00e9 et modernit\u00e9 (PAM), a affirm\u00e9 que l\u2019\u00e9ducation et la sant\u00e9 constituaient deux piliers fondamentaux de la soci\u00e9t\u00e9 marocaine, insistant sur la n\u00e9cessit\u00e9 de redoubler d\u2019efforts pour am\u00e9liorer ces deux secteurs. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La Gr\u00e8ce r\u00e9affirme son soutien\nen faveur de la proposition...", "mass": 5, "physics": false, "shape": "box", "title": "La Gr\u00e8ce r\u00e9affirme son soutien en faveur de la proposition marocaine d\u2019autonomie, consid\u00e9rant qu\u2019elle \u00ab constitue une contribution s\u00e9rieuse et cr\u00e9dible au processus onusien en cours \u00bb et qu\u2019elle \u00ab pourrait constituer la solution la plus r\u00e9alisable \u00bb pour le r\u00e8glement d\u00e9finitif du diff\u00e9rend r\u00e9gional autour du Sahara marocain. [telquel.ma]\n-------------------------------------------------\nLa Gr\u00e8ce r\u00e9affirme son soutien en faveur de la proposition marocaine d\u2019autonomie, consid\u00e9rant qu\u2019elle \u00ab constitue une contribution s\u00e9rieuse et cr\u00e9dible au processus onusien en cours \u00bb et qu\u2019elle \u00ab pourrait constituer la solution la plus r\u00e9alisable \u00bb pour le r\u00e8glement d\u00e9finitif du diff\u00e9rend r\u00e9gional autour du Sahara marocain. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre grec des Affaires \u00e9trang\u00e8res, Georges Gerapetritis, s\u2019est exprim\u00e9 lundi \u00e0 Ath\u00e8nes \u00e0 l\u2019issue d\u2019un entretien avec Nasser Bourita. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le minist\u00e8re de la Sant\u00e9\nd\u2019Arabie Saoudite a d\u00e9livr\u00e9 au...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 d\u2019Arabie Saoudite a d\u00e9livr\u00e9 au Groupe AKDITAL l\u2019autorisation d\u2019ouvrir officiellement \"AKDITAL Hospitals Al Olaya\", son premier \u00e9tablissement hospitalier dans le Royaume saoudien. [leseco.ma]\n-------------------------------------------------\nSitu\u00e9 au c\u0153ur de Riyad, l\u2019h\u00f4pital est d\u00e9sormais pleinement op\u00e9rationnel et accueille ses premiers patients, indique AKIDATAL HOSPITALS dans un communiqu\u00e9, soulignant que cette ouverture constitue une \u00e9tape [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Quelque 8,234 millions d\u2019\u00e9l\u00e8ves devraient\nrejoindre, lundi, leurs \u00e9tablissements scolaires,...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 8,234 millions d\u2019\u00e9l\u00e8ves devraient rejoindre, lundi, leurs \u00e9tablissements scolaires, a annonc\u00e9 le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports. [leseco.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u0027\u00c9ducation nationale a annonc\u00e9 que 8,234 millions d\u0027\u00e9l\u00e8ves rejoignaient lundi les \u00e9tablissements scolaires du Royaume, \u00e0 l\u0027occasion du lancement de l\u0027ann\u00e9e scolaire 2026-2027. [atlasinfo.fr]\n-------------------------------- siste, de l\u2019acte de mariage de Moulay Driss Filali, Fils de Son Altesse Royale la Princesse Lalla Meryem, avec la jeune Ahlam Oumha\". [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Plus de 3.000 observateurs nationaux\net 200 observateurs internationaux et...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 3.000 observateurs nationaux et 200 observateurs internationaux et r\u00e9gionaux participeront au suivi des prochaines \u00e9lections l\u00e9gislatives pr\u00e9vues le 23 septembre. [fr.hespress.com]\n-------------------------------------------------\nLa Commission sp\u00e9ciale d\u0027accr\u00e9ditation, pr\u00e9sid\u00e9e par Amina Bouayach, a valid\u00e9 la participation de 3.006 observateurs issus de 26 ONG marocaines et 30 instances internationales pour suivre les \u00e9lections l\u00e9gislatives du 23 septembre. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Sofyan Amrabat a annonc\u00e9 ce\nmardi qu\u2019il ne souhaitait plus...", "mass": 5, "physics": false, "shape": "box", "title": "Sofyan Amrabat a annonc\u00e9 ce mardi qu\u2019il ne souhaitait plus repr\u00e9senter le Maroc tant que Mohamed Ouahbi est \u00e0 la t\u00eate des Lions de l\u2019Atlas. [fr.hespress.com]\n-------------------------------------------------\nCe mardi 8 septembre, le milieu de terrain marocain a fait savoir qu\u2019il ne serait plus disponible pour la s\u00e9lection tant que Mohamed Ouahbi occuperait le poste de s\u00e9lectionneur. [telquel.ma]\n-------------------------------------------------\nL\u2019international marocain Sofyan Amrabat a annonc\u00e9, mardi soir, qu\u2019il suspendait sa participation avec la s\u00e9lection nationale \u00abtant que Mohamed Ouahbi restera entra\u00eeneur\u00bb des Lions de l\u2019Atlas. [www.yabiladi.com]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
