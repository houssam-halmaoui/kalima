 l\u2019intelligence artificielle, de la connectivit\u00e9 et des services financiers digitaux. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Dans ce cadre, inwi assurera\nla conception, le d\u00e9ploiement et...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce cadre, inwi assurera la conception, le d\u00e9ploiement et l\u2019exploitation du premier r\u00e9seau 5G priv\u00e9 \u00e0 usage industriel du Royaume, au profit de. [telquel.ma]\n-------------------------------------------------\nL\u0027op\u00e9rateur inwi a sign\u00e9, mardi \u00e0 Marrakech, une convention de partenariat avec China Mobile International, l\u2019un des leaders mondiaux des t\u00e9l\u00e9communications, pour assurer la conception, le d\u00e9ploiement et l\u0027exploitation du premier r\u00e9seau 5G priv\u00e9 \u00e0 usage industriel du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Plus de la moiti\u00e9 des\nc\u00e9libataires marocains d\u00e9clarent ne pas...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de la moiti\u00e9 des c\u00e9libataires marocains d\u00e9clarent ne pas vouloir se marier, selon l\u2019Enqu\u00eate nationale sur la famille 2025 r\u00e9alis\u00e9e par le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nCette \u00e9tude statistique vise \u00e0 analyser les transformations d\u00e9mographiques, sociales et \u00e9conomiques de la famille marocaine \u00e0 travers un ensemble d\u2019indicateurs relatifs \u00e0 la composition des m\u00e9nages, aux . [lnt.ma]\n-------------------------------------------------\nEntre l\u2019essor fulgurant du mod\u00e8le nucl\u00e9aire, la baisse in\u00e9dite des intentions de mariage et une f\u00e9condit\u00e9 d\u00e9sormais sous le seuil de renouvellement, l\u2019\u00e9tude dessine le nouveau visage d\u2019une soci\u00e9t\u00e9 marocaine en profonde . [fr.hespress.com]\n-------------------------------------------------\nL\u0027Enqu\u00eate nationale sur la Famille (ENF 2025) du Haut-Commissariat au Plan (HCP) r\u00e9v\u00e8le que 73% des m\u00e9nages rel\u00e8vent du mod\u00e8le familial nucl\u00e9aire en 2025, contre 60,8% en 1995, signe d\u0027une polarisation accrue du groupe domestique autour du noyau parental. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les industries culturelles et cr\u00e9atives\n(ICC) marocaines affichent une dynamique...", "mass": 5, "physics": false, "shape": "box", "title": "Les industries culturelles et cr\u00e9atives (ICC) marocaines affichent une dynamique de croissance plus forte qu\u2019anticip\u00e9e, selon un rapport publi\u00e9 mercredi par la Soci\u00e9t\u00e9 financi\u00e8re internationale (IFC) relevant du Groupe de la Banque mondiale. [telquel.ma]\n-------------------------------------------------\nLes ICC marocaines ont g\u00e9n\u00e9r\u00e9 plus de 116.000 emplois en 2023, d\u00e9passant ainsi les secteurs de la sant\u00e9 et des services financiers, et produit pr\u00e8s de 43 milliards de dirhams de revenus, en hausse de 18% par rapport \u00e0 l\u2019ann\u00e9e pr\u00e9c\u00e9dente. [www.lavieeco.com]\n-------------------------------------------------\nDans son \u00e9valuation d\u00e9voil\u00e9e le 8 avril, la Soci\u00e9t\u00e9 financi\u00e8re internationale (IFC) qualifie les ICC dans le royaume de \u00abcomposante essentielle et de plus en plus strat\u00e9gique de l\u2019\u00e9conomie nationale\u00bb. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le festival Comediablanca signe son\nretour \u00e0 Casablanca \u00e0 l\u2019occasion...", "mass": 5, "physics": false, "shape": "box", "title": "Le festival Comediablanca signe son retour \u00e0 Casablanca \u00e0 l\u2019occasion de sa 3\u00e8me \u00e9dition pr\u00e9vue du 4 au 6 juin prochain, avec la participation de plus d\u2019une vingtaine d\u2019artistes marocains et internationaux. [telquel.ma]\n-------------------------------------------------\nPour sa troisi\u00e8me \u00e9dition, l\u2019\u00e9v\u00e9nement proposera une programmation sur trois jours, r\u00e9unissant plus de vingt artistes marocains et internationaux et attend un public total de 15 000 spectateurs, soit environ 5 000 par soir. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Les deux partenaires ont sign\u00e9\nun protocole d\u2019accord (MoU) strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Les deux partenaires ont sign\u00e9 un protocole d\u2019accord (MoU) strat\u00e9gique pour structurer un v\u00e9ritable \u00e9cosyst\u00e8me gaming au Maroc et accompagner l\u2019\u00e9mergence de talents locaux, \u00e0. [telquel.ma]\n-------------------------------------------------\nEn marge du GITEX Africa Morocco 2026 \u00e0 Marrakech, le minist\u00e8re de la Jeunesse, de la Culture et de la Communication et Huawei Maroc officialisent un partenariat strat\u00e9gique pour structurer l\u2019\u00e9cosyst\u00e8me gaming et acc\u00e9l\u00e9rer le d\u00e9veloppement des industries num\u00e9riques. [www.lavieeco.com]\n-------------------------------------------------\nUn accord a \u00e9t\u00e9 sign\u00e9entre le minist\u00e8re de la Jeunesse,de la Culture et de la Communicationet Huawei Maroc, en marge deGITEX Africa Morocco 2026\u00e0 Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Selon les informations de TelQuel\nArabi, Motsepe a sollicit\u00e9 la...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les informations de TelQuel Arabi, Motsepe a sollicit\u00e9 la tenue de rencontres de haut niveau avec des responsables marocains afin d\u2019examiner les r\u00e9percussions de la finale de la CAN, apr\u00e8s ses \u00e9changes. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la Conf\u00e9d\u00e9ration africaine de football (CAF), Patrice Motsepe, a rejet\u00e9 toute suggestion de partialit\u00e9 envers le Maroc, tout en affirmant la neutralit\u00e9 de linstance, \u00e0 la suite des pol\u00e9miques sur la finale de la CAN 2025. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Sur instructions du roi Mohammed\nVI, le ministre des Affaires...", "mass": 5, "physics": false, "shape": "box", "title": "Sur instructions du roi Mohammed VI, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a pr\u00e9sid\u00e9, mercredi \u00e0 Niamey, les travaux de la 5e Commission mixte de coop\u00e9ration Maroc-Niger. [telquel.ma]\n-------------------------------------------------\nL\u0027audience intervient en marge de la 5e session de la Commission Mixte de Coop\u00e9ration entre le Maroc et le Niger, qui a tenu ses travaux ce jour \u00e0 Niamey, sous la pr\u00e9sidence de M. Nasser Bourita et de son homologue du Niger, M. Bakary Yaou Sangar\u00e9, ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration et des Nig\u00e9riens \u00e0 l\u0027ext\u00e9rieur. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a \u00e9t\u00e9 re\u00e7u en audience, mercredi \u00e0 Niamey, par le G\u00e9n\u00e9ral d\u2019Arm\u00e9e Abdourahamane Tiani, pr\u00e9sident du N         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();

                }, 100);
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
