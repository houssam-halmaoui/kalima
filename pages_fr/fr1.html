es\nSource: leseco.ma", "url": "https://leseco.ma/business/ithmar-capital-scelle-un-partenariat-avec-le-premier-fonds-souverain-des-philippines.html", "x": 0, "y": 0}, {"font": {"vadjust": -124.5}, "group": 17, "id": 246, "label": "Le Maroc condamne \u00ab dans...", "shape": "dot", "size": 83, "title": "Le Maroc condamne \u00ab\u00a0dans les termes les plus fermes\u00a0\u00bb les attaques de drones contre l\u2019Arabie saoudite\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/le-maroc-condamne-dans-les-termes-les-plus-fermes-les-attaques-de-drones-contre-larabie-saoudite.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 2, "id": 260, "label": "Orange Maroc et Infobip renforcent...", "shape": "dot", "size": 47, "title": "Orange Maroc et Infobip renforcent leur partenariat autour d\u2019une nouvelle offre de communication omnicanale\nSource: lnt.ma", "url": "https://lnt.ma/orange-maroc-et-infobip-renforcent-leur-partenariat-autour-dune-nouvelle-offre-de-communication-omnicanale/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 15, "id": 261, "label": "Le Groupe BCP et Seniors...", "shape": "dot", "size": 59, "title": "Le Groupe BCP et Seniors Plus lancent \u00ab Bladi Tiqqa \u00bb, une offre d\u00e9di\u00e9e aux MDM\nSource: lnt.ma", "url": "https://lnt.ma/le-groupe-bcp-et-seniors-plus-lancent-bladi-tiqqa-une-offre-dediee-aux-mdm/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "\u00c0 l\u2019occasion du 27\u00e8me Anniversaire\nde l\u2019Intronisation de Sa Majest\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [fr.hespress.com]\n-------------------------------------------------\nCette pi\u00e8ce comm\u00e9morative pr\u00e9sente, \u00e0 l\u0027avers, l\u0027effigie de Sa Majest\u00e9 le Roi Mohammed VI entour\u00e9e des inscriptions \u0645\u062d\u0645\u062f \u0627\u0644\u0633\u0627\u062f\u0633 et \u0627\u0644\u0645\u0645\u0644\u0643\u0629 \u0627\u0644\u0645\u063a\u0631\u0628\u064a\u0629 - \u2d5c\u2d30\u2d33\u2d4d. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u00e8me Anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [aujourdhui.ma]\n-------------------------------------------------\nBank Al-Maghrib c\u00e9l\u00e8bre le 27e anniversaire de l\u2019Intronisation de Sa Majest\u00e9 le Roi Mohammed VI par l\u2019\u00e9mission d\u2019une pi\u00e8ce comm\u00e9morative en argent d\u2019une valeur faciale de 250 dirhams. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u1d49 anniversaire de l\u2019intronisation du roi Mohammed VI, Bank Al-Maghrib (BAM) a \u00e9mis une pi\u00e8ce comm\u00e9morative, en argent, d\u2019une valeur faciale de 250 dirhams. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Selon le 13\u1d49 Rapport sur\nla stabilit\u00e9 financi\u00e8re, publi\u00e9 conjointement...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le 13\u1d49 Rapport sur la stabilit\u00e9 financi\u00e8re, publi\u00e9 conjointement par Bank Al-Maghrib, l\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) et l\u2019Autorit\u00e9. [lematin.ma]\n-------------------------------------------------\nLe rapport annuel conjoint sur la stabilit\u00e9 financi\u00e8re au titre de l\u2019ann\u00e9e 2025, publi\u00e9 par Bank Al-Maghrib, l\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) et l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC), met en \u00e9vidence la persistance de d\u00e9s\u00e9quilibres structurels au sein des r\u00e9gimes de retraite, malgr\u00e9 l\u2019am\u00e9lioration temporaire de certains. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Lors de cette c\u00e9r\u00e9monie, qui\ns\u2019est d\u00e9roul\u00e9e au si\u00e8ge du...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette c\u00e9r\u00e9monie, qui s\u2019est d\u00e9roul\u00e9e au si\u00e8ge du Congr\u00e8s p\u00e9ruvien, en pr\u00e9sence de Chefs d\u2019\u00c9tat et de d\u00e9l\u00e9gations \u00e9trang\u00e8res, de repr\u00e9sentants d\u2019organisations internationales. [lematin.ma]\n-------------------------------------------------\nLe Pr\u00e9sident de la Chambre des Repr\u00e9sentants, Rachid Talbi El Alami, a repr\u00e9sent\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, mardi \u00e0 Lima, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture de la nouvelle Pr\u00e9sidente de la R\u00e9publique du P\u00e9rou, Keiko Fujimori. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Une convention portant sur l\u2019octroi\npar l\u2019Agence am\u00e9ricaine pour le...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention portant sur l\u2019octroi par l\u2019Agence am\u00e9ricaine pour le commerce et le d\u00e9veloppement (USTDA) d\u2019une subvention au consortium ORNX pour la r\u00e9alisation d\u0027une \u00e9tude d#. [lematin.ma]\n-------------------------------------------------\nUne convention portant sur l\u2019octroi par l\u2019Agence am\u00e9ricaine pour le commerce et le d\u00e9veloppement (USTDA) d\u2019une subvention au consortium ORNX pour la r\u00e9alisation d\u2019une \u00e9tude d\u2019ing\u00e9nierie pr\u00e9liminaire de son projet d\u2019unit\u00e9 de production d\u2019ammoniac vert \u00e0 La\u00e2youne, a \u00e9t\u00e9 sign\u00e9e mardi. [telquel.ma]\n-------------------------------------------------\nUne convention portant sur l\u2019octroi par l\u2019Agence am\u00e9ricaine pour le commerce et le d\u00e9veloppement (USTDA) d\u2019une subvention au consortium ORNX pour la r\u00e9alisation d\u2019une \u00e9tude d\u2019ing\u00e9nierie pr\u00e9liminaire de son projet d\u2019unit\u00e9 de production d\u2019ammoniac vert \u00e0 La\u00e2youne, a \u00e9t\u00e9 sign\u00e9e mardi. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La c\u00e9r\u00e9monie, organis\u00e9e par visioconf\u00e9rence\nen pr\u00e9sence de l\u0027Ambassadeur de...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9r\u00e9monie, organis\u00e9e par visioconf\u00e9rence en pr\u00e9sence de l\u0027Ambassadeur de Sa Majest\u00e9 le Roi aupr\u00e8s de la R\u00e9publique des Philippines, Mohammed Rida El Fassi, et l\u0027Ambassad. [lematin.ma]\n-------------------------------------------------\nLes fonds souverains marocain et philippin ont sign\u00e9 un protocole d\u2019accord portant sur le partage d\u2019expertise, le renforcement des capacit\u00e9s institutionnelles et la diffusion des meilleures pratiques internationales de gouvernance. [www.lavieeco.com]\n-------------------------------------------------\nIthmar Capital et Maharlika Investment Corporation (MIC), le fonds souverain de la R\u00e9publique des Philippines, ont conclu un protocole d\u2019accord destin\u00e9 \u00e0 renforcer leur coop\u00e9ration institutionnelle. [lnt.ma]\n-------------------------------------------------\nIthmar Capital et le fonds souverain philippin Maharlika Investment Corporation (MIC) ont scell\u00e9 un partenariat strat\u00e9gique pour renforcer leurs capacit\u00e9s institutionnelles et partager leurs bonnes pratiques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La Soci\u00e9t\u00e9 Maghr\u00e9bienne de G\u00e9nie\nCivil (SOMAGEC) a finalis\u00e9 une...", "mass": 5, "physics": false, "shape": "box", "title": "La Soci\u00e9t\u00e9 Maghr\u00e9bienne de G\u00e9nie Civil (SOMAGEC) a finalis\u00e9 une \u00e9mission obligataire par placement priv\u00e9, r\u00e9serv\u00e9e aux investisseurs qualifi\u00e9s, pour un montant global de 500 millio. [lematin.ma]\n-------------------------------------------------\nCIH Bank et Saham Bank ont finalis\u00e9 avec succ\u00e8s l\u2019\u00e9mission obligataire par placement priv\u00e9 de la Soci\u00e9t\u00e9 maghr\u00e9bienne de g\u00e9nie Civil (Somagec) r\u00e9serv\u00e9e aux investisseurs qualifi\u00e9s, pour un montant global de 500 millions de dirhams (MDH). [aujourdhui.ma]\n-------------------------------------------------\nCIH BANK et Saham Bank finalisent avec succ\u00e8s l\u0027\u00e9mission obligataire par placement priv\u00e9 de la Soci\u00e9t\u00e9 Maghr\u00e9bienne de G\u00e9nie Civil (SOMAGEC) r\u00e9serv\u00e9e aux investisseurs qualifi\u00e9s, pour un montant global de 500 millions de dirhams. [www.lavieeco.com]\n-------------------------------------------------\nCIH Bank et Saham Bank ont finalis\u00e9 une \u00e9mission obligataire par placement priv\u00e9 de 500 millions de dirhams pour le compte de la Soci\u00e9t\u00e9 maghr\u00e9bine de g\u00e9nie civil (SOMAGEC). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Ces productions concernent les longs\net les courts m\u00e9trages, les...", "mass": 5, "physics": false, "shape": "box", "title": "Ces productions concernent les longs et les courts m\u00e9trages, les documentaires et les s\u00e9ries t\u00e9l\u00e9vis\u00e9es, souligne le CCM dans son dernier bilan cin\u00e9matographique annuel, pr\u00e9cisant. [lematin.ma]\n-------------------------------------------------\nLe Maroc a accueilli le tournage de 48 productions cin\u00e9matographiques et t\u00e9l\u00e9vis\u00e9es \u00e9trang\u00e8res en 2025, mobilisant des investissements de plus de 1,16 milliard de dirhams (MMDH), indique le Centre cin\u00e9matographique marocain (CCM). [telquel.ma]\n-------------------------------------------------\nLes productions \u00e9trang\u00e8res tourn\u00e9es dans le Royaume ont g\u00e9n\u00e9r\u00e9 plus de 1,16 milliard de dirhams d\u0027investissements. [www.lavieeco.com]\n-------------------------------------------------\nLe cin\u00e9ma marocain a attir\u00e9 plus de 1,21 milliard de dirhams d\u2019investissements \u00e9trangers en 2025, tandis que les productions nationales ont mobilis\u00e9 596,48 millions de dirhams, selon le bilan du CCM. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "\u00c0 La\u00e2youne, l\u2019ambassadeur des \u00c9tats-Unis\nau Maroc, Duke Buchan III,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 La\u00e2youne, l\u2019ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan III, a annonc\u00e9 le premier financement public am\u00e9ricain en faveur d\u2019un projet du secteur priv\u00e9 dans le Sahara marocain. [telquel.ma]\n-------------------------------------------------\nLannonce du premier financement am\u00e9ricain pour un projet priv\u00e9 dans le Sahara marocain a marqu\u00e9 la visite, mardi \u00e0 La\u00e2youne, de lambassadeur des \u00c9tats-Unis, Duke Buchan. [www.yabiladi.com]\n-------------------------------------------------\nL\u0027ambassadeur des \u00c9tats-Unis au Maroc, Duke Buchan, a annonc\u00e9 sur X que Washington s\u0027engageait \u00e0 construire \"un avenir pacifique et prosp\u00e8re\" pour le Sahara marocain, apr\u00e8s sa rencontre avec le maire de La\u00e2youne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Une op\u00e9ration conjointe men\u00e9e par\nles agents de la S\u00fbret\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Une op\u00e9ration conjointe men\u00e9e par les agents de la S\u00fbret\u00e9 nationale et des Douanes au poste fronti\u00e8re de Guerguerat, au sud de Dakhla, mardi 28 juillet apr\u00e8s-midi, a permis la saisie de 61 kilogrammes de coca\u00efne et l\u2019arrestation de deux hommes, \u00e2g\u00e9s de 30 et 34 ans, soup\u00e7onn\u00e9s d\u2019implication dans un trafic international de stup\u00e9fiants.. [telquel.ma]\n-------------------------------------------------\nLa police marocaine et les douanes ont intercept\u00e9 61 kg de coca\u00efne et arr\u00eat\u00e9 deux suspects au poste-fronti\u00e8re de Guerguerat, au sud de Dakhla, lors d\u2019une op\u00e9ration conjointe mardi, rapporte la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Conseil d\u2019Administration de l\u2019Office\nNational de l\u2019Electricit\u00e9 et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019Administration de l\u2019Office National de l\u2019Electricit\u00e9 et de l\u2019Eau Potable (ONEE), tenu lundi \u00e0 Rabat, sous la Pr\u00e9sidence de la ministre de l\u2019Economie et des Finances, Nadia Fettah, a adopt\u00e9 le plan d\u2019\u00e9quipement 2026-2030 d\u2019une enveloppe de plus de 248 milliards de dirhams (MMDH). [telquel.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration de l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) a approuv\u00e9 un plan d\u2019\u00e9quipement 2026-2030 d\u2019un montant sup\u00e9rieur \u00e0 248 milliards de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Tamwilcom et l\u2019Office National de\nl\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable...", "mass": 5, "physics": false, "shape": "box", "title": "Tamwilcom et l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de garantie portant sur un financement de 250 millions d\u2019euros (M\u20ac) accord\u00e9 par la Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) \u00e0 l\u2019ONEE \u2013 Branche Eau. [telquel.ma]\n-------------------------------------------------\nLa Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD) soutient la s\u00e9curit\u00e9 hydrique du Maroc gr\u00e2ce \u00e0 un pr\u00eat de 250 millions d\u2019euros accord\u00e9 \u00e0 l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE). [aujourdhui.ma]\n-------------------------------------------------\nLe financement mobilis\u00e9 contribuera \u00e0 accompagner les investissements de l\u0027ONEE visant \u00e0 renforcer l\u0027efficacit\u00e9, la r\u00e9silience et la durabilit\u00e9 des infrastructures de production d\u0027eau potable, en appui aux efforts du Royaume en mati\u00e8re de s\u00e9curit\u00e9 hydrique et d\u0027adaptation aux changements climatiques. [www.lavieeco.com]\n-------------------------------------------------\nTamwilcom et l\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) ont sign\u00e9 une convention de garantie portant sur un financement de 250 millions d\u2019euros accord\u00e9 par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) \u00e0 la branche Eau de l\u2019Office. [lnt.ma]\n-------------------------------------------------\nTAMWILCOM et l\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de garantie portant sur un financement de 250 millions d\u2019euros accord\u00e9 par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) \u00e0 la branche Eau de l\u2019ONEE. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les exportations des produits agroalimentaires\nont poursuivi leur progression, atteignant...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [telquel.ma]\n-------------------------------------------------\nLes exportations des produits agroalimentaires ont poursuivi leur progression, atteignant une valeur de 86,2 milliards de dirhams (MMDH) en 2025, contre pr\u00e8s de 62 MMDH en 2020, soit une croissance de 38%. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 l\u2019approche des \u00e9lections l\u00e9gislatives\ng\u00e9n\u00e9rales du 23 septembre 2026,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019approche des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales du 23 septembre 2026, la Haute Autorit\u00e9 de la Communication Audiovisuelle (HACA) publie et diffuse un guide destin\u00e9 \u00e0 pr\u00e9senter les principes, les r\u00e8gles et les m\u00e9canismes qui encadrent l\u2019expression pluraliste politique dans les m\u00e9dias audiovisuels, en p\u00e9riode \u00e9lectorale comme en dehors de celle-ci. [telquel.ma]\n-------------------------------------------------\nIntitul\u00e9 \u00abLe guide de la HACA pour comprendre le pluralisme d\u2019expression politique \u00e0 la radio et \u00e0 la t\u00e9l\u00e9vision\u00bb, ce document pr\u00e9sente notamment les fondements constitutionnels et. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le roi Mohammed VI,adressera, mercredi\nsoir, un discours \u00e0 son...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI,adressera, mercredi soir, un discours \u00e0 son peuple fid\u00e8le \u00e0 l\u2019occasion de la comm\u00e9moration du 27e anniversaire de l\u2019accession du Souverain au tr\u00f4ne de ses glorieux anc\u00eatres, annonce un communiqu\u00e9 du minist\u00e8re de la Maison royale, du Protocole et de la Chancellerie. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie a annonc\u00e9 que le Roi Mohammed VI prononcera mercredi un discours \u00e0 l\u0027occasion du 27e anniversaire de son accession au Tr\u00f4ne. [atlasinfo.fr]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, adressera, mercredi soir, un Discours \u00e0 Son peuple fid\u00e8le \u00e0 l\u2019occasion de la comm\u00e9moration du 27e anniversaire de l\u2019accession du Souverain au Tr\u00f4ne de Ses glorieux Anc\u00eatres, annonce un communiqu\u00e9 du Minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "En ex\u00e9cution des instructions du\nroi, Chef Supr\u00eame et Chef...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions du roi, Chef Supr\u00eame et Chef d\u2019\u00c9tat-major g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR), Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Che s (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur [www.challenge.ma]\n-------------------------------------------------\nLe r\u00e9sultat net du secteur des assurances a atteint 5,3 milliards de dirhams (MMDH) en 2025, en am\u00e9lioration de 21,4% en glissement annuel, selon le rapport annuel sur la Stabilit\u00e9 financi\u00e8re. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9\navec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de...", "mass": 5, "physics": false, "shape": "box", "title": "Cr\u00e9dit du Maroc a cl\u00f4tur\u00e9 avec succ\u00e8s l\u2019op\u00e9ration d\u2019augmentation de son capital social par apport en num\u00e9raire, r\u00e9serv\u00e9e aux actionnaires et aux d\u00e9tenteurs de droits pr\u00e9f\u00e9rentiels de souscription [www.challenge.ma]\n-------------------------------------------------\nLes souscriptions ont atteint 884,6 MDH, soit 27% de plus que le montant propos\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019op\u00e9ration, vis\u00e9e par l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) en juin dernier, a suscit\u00e9 une demande sup\u00e9rieure au montant propos\u00e9, traduisant un taux de souscription de 127 %. [lnt.ma]\n-------------------------------------------------\nCr\u00e9dit du Maroc a cl\u00f4tur\u00e9 avec succ\u00e8s l\u0027op\u00e9ration d\u0027augmentation de son capital social par apport en num\u00e9raire, r\u00e9serv\u00e9e aux actionnaires et aux d\u00e9tenteurs de droits pr\u00e9f\u00e9rentiels de souscription (DPS), ayant fait l\u0027objet du prospectus vis\u00e9 par l\u0027Autorit\u00e9 marocaine du march\u00e9 des capitaux le 12 juin dernier. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le r\u00e9sultat net part du\ngroupe (RNPG) du groupe Attijariwafa...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00e9sultat net part du groupe (RNPG) du groupe Attijariwafa bank a atteint 5,9 milliards de dirhams (MMDH) au terme des six premiers mois de 2026, en progression [www.challenge.ma]\n-------------------------------------------------\nLe r\u00e9sultat net part du groupe (RNPG) du groupe Attijariwafa bank a atteint 5,9 milliards de dirhams (MMDH) au terme des six premiers mois de 2026, en progression de 1,1% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Groupe Banque Populaire du\nMaroc (BCP) s\u2019allie \u00e0 Seniors...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe Banque Populaire du Maroc (BCP) s\u2019allie \u00e0 Seniors Plus pour lancer Bladi Tiqqa, une offre de services unique d\u00e9di\u00e9e aux Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE). [www.yabiladi.com]\n-------------------------------------------------\nLe Groupe BCP et Seniors Plus ont conclu un partenariat pour le lancement de Bladi Tiqqa, une offre de services destin\u00e9e aux Marocains du Monde et con\u00e7ue pour r\u00e9pondre. [lematin.ma]\n-------------------------------------------------\nLe Groupe Banque Centrale Populaire (BCP) et Seniors Plus ont conclu un partenariat strat\u00e9gique pour lancer \u00ab Bladi Tiqqa \u00bb, une offre de services destin\u00e9e aux Marocains du Monde (MDM) souhaitant accompagner leurs proches \u00e2g\u00e9s de 60 ans et plus vivant au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u0027Arabie saoudite a annonc\u00e9 mercredi\navoir men\u00e9, en coordination avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027Arabie saoudite a annonc\u00e9 mercredi avoir men\u00e9, en coordination avec le commandement central am\u00e9ricain, des frappes contre des groupes arm\u00e9s soutenus par l\u0027Iran en Irak, en repr\u00e9sailles \u00e0 des attaques de drones visant ses installations p\u00e9troli\u00e8res. [atlasinfo.fr]\n-------------------------------------------------\nLes Etats-Unis et leur alli\u00e9 saoudien ont dit avoir vis\u00e9 mercredi des groupes arm\u00e9s pro-iraniens en Irak, nouvelle extension de la guerre au Moyen-Orient qui implique des factions soutenues par T\u00e9h\u00e9ran. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Une vague de chaleur et\nun temps chaud sont attendus,...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur et un temps chaud sont attendus, de mardi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte m\u00e9t\u00e9orologique de niveau de vigilance orange. [www.lereporter.ma]\n-------------------------------------------------\nUne vague de chaleur et un temps chaud sont attendus, de mercredi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte m\u00e9t\u00e9orologique de niveau de vigilance orange. [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur et un temps chaud sont attendus, de mercredi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte m\u00e9t\u00e9orologique de niveau de vigilance orange. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le march\u00e9 des capitaux marocain\na poursuivi son d\u00e9veloppement au...", "mass": 5, "physics": false, "shape": "box", "title": "Le march\u00e9 des capitaux marocain a poursuivi son d\u00e9veloppement au cours des premiers mois de 2026, port\u00e9 par la progression des principaux indicateurs boursiers, la croissance de la gestion collective et l\u2019acc\u00e9l\u00e9ration des r\u00e9formes engag\u00e9es par l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC). [lnt.ma]\n-------------------------------------------------\nL\u0027Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a publi\u00e9 le 14e num\u00e9ro de La Revue du March\u00e9 des Capitaux, qui met en lumi\u00e8re la progression des principaux indicateurs durant les premiers mois de 2026, sur fond de croissance du march\u00e9 actions, de la capitalisation boursi\u00e8re et des placements collectifs. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Royaume du Maroc condamne,\ndans les termes les plus...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [fr.hespress.com]\n-------------------------------------------------\nLe Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n--------------------         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
