-------------------\nBank Al-Maghrib (BAM) a annonc\u00e9, vendredi, la publication de deux nouveaux documents de travail, en fran\u00e7ais et en anglais, sur son portail, dans la rubrique \u00ab Publications et recherche \u00bb. [telquel.ma]\n-------------------------------------------------\nCes publications visent \u00e0 partager, avec la communaut\u00e9 scientifique et le grand public, les r\u00e9sultats des travaux men\u00e9s par les chercheurs de Bank Al-Maghrib. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Roi Mohammed VI, que\nDieu L\u2019assiste, accompagn\u00e9 de SAR...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI, que Dieu L\u2019assiste, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, de SAR le Prince Moulay Rachid et de SA le Prince Moulay Ahmed, a adress\u00e9, vendredi, un discours au Parlement \u00e0 l\u2019occasion de l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [fr.hespress.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, de SAR le Prince Moulay Rachid et de SA le Prince Moulay Ahmed, a adress\u00e9, vendredi, un discours au Parlement \u00e0 l\u2019occasion de l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [aujourdhui.ma]\n-------------------------------------------------\nLe Roi Mohammed VI, accompagn\u00e9 du Prince H\u00e9ritier Moulay El Hassan, du Prince Moulay Rachid et du Prince Moulay Ahmed, a adress\u00e9, vendredi, un discours au Parlement \u00e0 l\u0027occasion de l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [leseco.ma]\n-------------------------------------------------\nLe Roi Mohammed VI, accompagn\u00e9 de SAR le Prince H\u00e9ritier Moulay El Hassan, de SAR le Prince Moulay Rachid et de SA le Prince Moulay Ahmed, a pr\u00e9sid\u00e9, vendredi \u00e0 Rabat, l\u2019ouverture de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Roi Mohammed VI a\nexhort\u00e9 les Marocains a \u00eatre...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a exhort\u00e9 les Marocains a \u00eatre fiers de leur identit\u00e9 religieuse et civilisationnelle, riche de ses diff\u00e9rents et nombreux affluents. [fr.hespress.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a appel\u00e9, vendredi devant le Parlement, \u00e0 faire de la nouvelle mandature un v\u00e9ritable tournant pour le Maroc, en conciliant ambition \u00e9conomique, justice sociale et territoriale. [www.lavieeco.com]\n-------------------------------------------------\nDans son discours prononc\u00e9 \u00e0 l\u2019ouverture de la premi\u00e8re session de la 12e l\u00e9gislature, le Roi Mohammed VI a exalt\u00e9 un nouveau mandat l\u00e9gislatif et gouvernemental qui pourrait repr\u00e9senter un tournant d\u00e9cisif pour le Maroc, un pays r\u00e9solument tourn\u00e9 vers son ambition d\u2019\u00e9mergence \u00e9conomique tout en restant fid\u00e8le \u00e0 ses valeurs sociales et territoriales. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 l\u2019occasion de l\u2019ouverture, vendredi 9 octobre \u00e0 Rabat, de la premi\u00e8re session de la premi\u00e8re ann\u00e9e l\u00e9gislative de la 12e L\u00e9gislature, le Roi Mohammed VI a fix\u00e9 plusieurs priorit\u00e9s pour la nouvelle mandature. [lnt.ma]\n-----------------------------------------------     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
