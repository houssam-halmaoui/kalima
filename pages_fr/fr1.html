nt Code du m\u00e9dicament et de la pharmacie. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les entreprises fran\u00e7aises op\u00e9rant dans\nles secteurs agricole et agroalimentaire...", "mass": 5, "physics": false, "shape": "box", "title": "Les entreprises fran\u00e7aises op\u00e9rant dans les secteurs agricole et agroalimentaire sont pr\u00eates \u00e0 renforcer leurs investissements et \u00e0 sceller de nouveaux partenariats au Maroc, a affirm\u00e9, mardi \u00e0 Rabat, le pr\u00e9sident du P\u00f4le Agricole et Agroalimentaire du MEDEF (Mouvement des entreprises de France) International, Jean-Paul Torris. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9unis mardi \u00e0 Rabat, Ahmed El Bouari et le pr\u00e9sident du P\u00f4le agricole et agroalimentaire du MEDEF ont affich\u00e9 leur volont\u00e9 d\u0027acc\u00e9l\u00e9rer la coop\u00e9ration agricole entre le Maroc et la France autour de nouveaux projets d\u0027investissement et d\u0027innovation. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le secr\u00e9taire g\u00e9n\u00e9ral de l\u2019Organisation\ndes Nations unies, Antonio Guterres,...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire g\u00e9n\u00e9ral de l\u2019Organisation des Nations unies, Antonio Guterres, a lanc\u00e9 un appel fort aux acteurs mondiaux de l\u2019intelligence artificielle afin qu\u2019ils fassent preuve d\u2019une plus grande transparence concernant l\u2019impact environnemental de leurs activit\u00e9s. [fr.hespress.com]\n-------------------------------------------------\nLe secr\u00e9taire g\u00e9n\u00e9ral de l\u2019Organisation des Nations unies (ONU), Antonio Guterres, a appel\u00e9 les dirigeants des grandes entreprises de l\u2019intelligence artificielle \u00e0 faire 0e9giques visant \u00e0 promouvoir les \u00e9changes commerciaux, [www.challenge.ma]\n-------------------------------------------------\nBank of Africa a conclu ce mardi \u00e0 P\u00e9kin deux m\u00e9morandums de coop\u00e9ration destin\u00e9s \u00e0 renforcer les \u00e9changes commerciaux, les investissements et les opportunit\u00e9s d\u0027affaires entre la Chine et l\u0027Afrique, consolidant ainsi son positionnement comme partenaire de r\u00e9f\u00e9rence des relations \u00e9conomiques sino-africaines. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Implant\u00e9e sur un terrain de\n48.000 m\u00b2, l\u0027unit\u00e9 industrielle de...", "mass": 5, "physics": false, "shape": "box", "title": "Implant\u00e9e sur un terrain de 48.000 m\u00b2, l\u0027unit\u00e9 industrielle de Leoni Cable Solutions comprendra 18.000 m\u00b2 d\u0027espaces industriels et de bureaux ainsi qu\u0027une r\u00e9serve fonci. [lematin.ma]\n-------------------------------------------------\nLe groupe allemand Leoni renforce sa pr\u00e9sence au Maroc avec une nouvelle usine de c\u00e2bles automobiles \u00e0 K\u00e9nitra au sein de sa division Leoni Cable Solutions. [telquel.ma]\n-------------------------------------------------\nImplant\u00e9e l\u0027Atlantic Free Zone de K\u00e9nitra, cette unit\u00e9 industrielle fabriquera des c\u00e2bles unifilaires, multifilaires et de transmission de donn\u00e9es destin\u00e9s \u00e0 une industrie automobile de plus en plus connect\u00e9e et automatis\u00e9e. [www.lavieeco.com]\n-------------------------------------------------\nLEONI Cable Solutions (LCS) a proc\u00e9d\u00e9, mardi \u00e0 l\u2019Atlantic Free Zone de K\u00e9nitra, \u00e0 la pose de la premi\u00e8re pierre de sa nouvelle unit\u00e9 industrielle, un projet mobilisant un investissement de 630 millions de dirhams (MDH), soit pr\u00e8s de 60 millions d\u2019euros (M\u20ac), et marquant l\u2019implantation de la premi\u00e8re usine du groupe sur le continent . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Conseil de Bank Al-Maghrib\na tenu le mardi 23...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de Bank Al-Maghrib a tenu le mardi 23 juin sa deuxi\u00e8me r\u00e9union trimestrielle de l\u2019ann\u00e9e 2026. [lematin.ma]\n-------------------------------------------------\nUne d\u00e9cision qui intervient dans un contexte \u00e9conomique marqu\u00e9 par des signaux contrast\u00e9s : d\u2019un c\u00f4t\u00e9, une acc\u00e9l\u00e9ration de la croissance \u00e9conomique port\u00e9e notamment par le rebond . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La ministre du Tourisme, de\nl\u2019Artisanat et de l\u2019\u00c9conomie sociale...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, que le tourisme interne a enregistr\u00e9 plus de 4 millions de nuit\u00e9es au terme des cinq premiers mois de cette ann\u00e9e, en hausse de 2% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025.. [telquel.ma]\n-------------------------------------------------\nLa ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor, a affirm\u00e9, mardi \u00e0 la Chambre des conseillers, que le Maroc ambitionne d\u2019attirer 2,3 [www.challenge.ma]\n-------------------------------------------------\nLe Maroc ambitionne d\u2019attirer 2,3 millions de touristes d\u2019affaires et de congr\u00e8s d\u2019ici 2030, dans le cadre du d\u00e9veloppement du segment MICE, a indiqu\u00e9 la ministre du Tourisme, Fatim-Zahra Ammor. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Conseil sup\u00e9rieur de la\ncommunication audiovisuelle (CSCA), instance d\u00e9lib\u00e9rative...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil sup\u00e9rieur de la communication audiovisuelle (CSCA), instance d\u00e9lib\u00e9rative de la HACA, a adopt\u00e9 r\u00e9cemment une d\u00e9cision normative relative \u00e0 la garantie du pluralisme de l\u2019expression politique dans les services de communication audiovisuelle en p\u00e9riode \u00e9lectorale, et ce dans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales du 23 septembre 2026. [telquel.ma]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur de la communication audiovisuelle (CSCA), instance d\u00e9lib\u00e9rative de la HACA, a adopt\u00e9 une d\u00e9cision normative relative \u00e0 la garantie du pluralisme de l\u2019expression politique dans les services de communication audiovisuelle en p\u00e9riode \u00e9lectorale, et ce dans le cadre des pr\u00e9paratifs des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales du 23 septembre 2026. [atlasinfo.fr]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur de la communication audiovisuelle, instance d\u00e9lib\u00e9rative de la HACA, a adopt\u00e9 une d\u00e9cision normative destin\u00e9e \u00e0 encadrer la couverture audiovisuelle des \u00e9lections l\u00e9gislatives g\u00e9n\u00e9rales pr\u00e9vues le 23 septembre 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019augmentation de la facture \u00e9nerg\u00e9tique\net les prix des carburants,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019augmentation de la facture \u00e9nerg\u00e9tique et les prix des carburants, ainsi que celle de l\u2019 <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
