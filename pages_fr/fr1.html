s \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, et Dmitry Patrushev, vice-Premier ministre de la F\u00e9d\u00e9ration de Russie, Moscou a salu\u00e9 les initiatives royales visant \u00e0 renforcer la stabilit\u00e9 et \u00e0 promouvoir le. [telquel.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et le chef de l\u2019agence F\u00e9d\u00e9rale des P\u00eaches Russe, Ilya Shestakov ont proc\u00e9d\u00e9, vendredi \u00e0 Moscou, \u00e0 la signature d\u2019un nouvel accord de coop\u00e9ration en mati\u00e8re des p\u00eaches maritimes, qui vient remplacer l\u2019accord pr\u00e9c\u00e9dent arriv\u00e9 \u00e0 \u00e9ch\u00e9ance. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et le chef de l\u2019agence F\u00e9d\u00e9rale des P\u00eaches Russe, Ilya Shestakov ont proc\u00e9d\u00e9, vendredi \u00e0 Moscou, \u00e0 la signature d\u2019un nouvel accord de coop\u00e9ration en mati\u00e8re des p\u00eaches maritimes, qui vient remplacer l\u2019accord pr\u00e9c\u00e9dent arriv\u00e9 \u00e0 \u00e9ch\u00e9ance. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Apr\u00e8s l\u2019exploit et la qualification\nhistorique de l\u2019\u00e9quipe nationale de...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s l\u2019exploit et la qualification historique de l\u2019\u00e9quipe nationale de football \u00e0 la finale de la coupe du monde U-20 organis\u00e9e au Chili, Royal Air Maroc (RAM) programme deux vols sp\u00e9ciaux pour le d\u00e9placement des supporters marocains. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s l\u2019exploit et la qualification historique de l\u2019\u00e9quipe nationale de football \u00e0 la finale de la coupe du monde U-20 organis\u00e9e au Chili, Royal Air Maroc (RAM) programme deux vols sp\u00e9ciaux pour le d\u00e9placement des supporters marocains. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Volodymyr Zelensky aura fort \u00e0\nfaire vendredi pour convaincre Donald...", "mass": 5, "physics": false, "shape": "box", "title": "Volodymyr Zelensky aura fort \u00e0 faire vendredi pour convaincre Donald Trump de livrer \u00e0 l\u2019Ukraine des missiles Tomahawk, alors que le pr\u00e9sident am\u00e9ricain et Vladimir Poutine viennent de relancer leur dialogue. [telquel.ma]\n-------------------------------------------------\nVolodymyr Zelensky est attendu vendredi \u00e0 la Maison Blanche pour une rencontre cruciale avec Donald Trump, qui pourrait d\u00e9cider de la livraison \u00e0 l\u2019Ukraine de missiles Tomahawk, un armement strat\u00e9gique longue port\u00e9e. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Suite \u00e0 l\u2019autorisation du Conseil\nde la Concurrence, Buildings \u0026...", "mass": 5, "physics": false, "shape": "box", "title": "Suite \u00e0 l\u2019autorisation du Conseil de la Concurrence, Buildings \u0026 Logistic Services (BLS) a annonc\u00e9 la finalisation de l\u2019acquisition de 100 % des actions du groupe La Voie [www.challenge.ma]\n-------------------------------------------------\nSuite \u00e0 l\u2019autorisation du Conseil de la Concurrence, Buildings \u0026 Logistic Services (BLS) annonce la finalisation de l\u2019acquisition de 100 % des actions du groupe La Voie Express, de la fonci\u00e8re Espacim et de La Voie Express Messagerie, ainsi que d\u2019une participation de 40 % au sein de ID Logistics Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "M. Massad Boulos, Conseiller sp\u00e9cial\npour l\u2019Afrique du Pr\u00e9sident des...", "mass": 5, "physics": false, "shape": "box", "title": "M. Massad Boulos, Conseiller sp\u00e9cial pour l\u2019Afrique du Pr\u00e9sident des Etats-Unis, a r\u00e9it\u00e9r\u00e9 le soutien maintes fois exprim\u00e9 par Washington \u00e0 la souverainet\u00e9 du Maroc sur son Sahara et au Plan marocain d\u2019autonomie comme \u00ab la seule base pour une solution juste et durable \u00bb \u00e0 ce diff\u00e9rend r\u00e9gional. [aujourdhui.ma]\n-------------------------------------------------\nDans une interview \u00e0 la cha\u00eene d\u2019information arabophone \"Acharq\", Massad Boulos a rappel\u00e9 que Washington compte ouvrir prochainement un consulat am\u00e9ricain dans les Provinces du Sud du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLes \u00c9tats-Unis ont r\u00e9affirm\u00e9 leur soutien ind\u00e9fectible \u00e0 la souverainet\u00e9 du Maroc sur ses provinces du Sud, tout en exprimant leur disposition \u00e0 ouvrir un consulat \u00e0 Dakhla durant le second mandat du pr\u00e9sident Donald Trump. [maroc-diplomatique.net]\n-------------------------------------------------\nM. Massad Boulos, Conseiller sp\u00e9cial pour l\u2019Afrique du Pr\u00e9sident des \u00c9tats-Unis, a r\u00e9it\u00e9r\u00e9 le soutien maintes fois exprim\u00e9 par Washington \u00e0 la souverainet\u00e9 du Maroc sur son Sahara et au Plan marocain d\u2019autonomie comme \u201cla seule base pour une solution juste et durable\u201d \u00e0 ce diff\u00e9rend r\u00e9gional. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "A\u00e9rien : En plus de\npermettre davantage de lignes vers...", "mass": 5, "physics": false, "shape": "box", "title": "A\u00e9rien : En plus de permettre davantage de lignes vers le Maroc, la nouvelle base, qui sera cr\u00e9\u00e9e par EasyJet \u00e0 partir de l\u2019\u00e9t\u00e9 2026 \u00e0 Marrakech, permettra \u00e0 la compagnie d\u2019augmenter sa capacit\u00e9 et d\u2019offrir de nouvelles destinations dans des a\u00e9roports europ\u00e9ens contraints. [aujourdhui.ma]\n-------------------------------------------------\nEasyJet et l\u2019Office National Marocain du Tourisme ont sign\u00e9 un accord visant \u00e0 renforcer la pr\u00e9sence de la compagnie a\u00e9rienne au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 cette occasion, elle d\u00e9voile\nla GEL-KAYANO\u2122 32, nouvelle version...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 cette occasion, elle d\u00e9voile la GEL-KAYANO\u2122 32, nouvelle version de sa chaussure iconique d\u00e9di\u00e9e \u00e0 la stabilit\u00e9 et au confort de course, d\u00e9sormais disponible dans les boutiques Planet Sport et en ligne. [aujourdhui.ma]\n-------------------------------------------------\nLa marque japonaise ASICS annonce le renforcement de sa pr\u00e9sence au Maroc \u00e0 travers un partenariat officiel avec Planet Sport, son distributeur exclusif. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La 8e session de la\nCommission Mixte Intergouvernementale Maroc-Russie, qui...", "mass": 5, "physics": false, "shape": "box", "title": "La 8e session de la Commission Mixte Intergouvernementale Maroc-Russie, qui s\u2019est tenue vendredi \u00e0 Moscou, a \u00e9t\u00e9 marqu\u00e9e par la signature de plusieurs accords structurants, r\u00e9affirmant la volont\u00e9 partag\u00e9e des deux pays de donner une vision strat\u00e9gique et multi     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
