group": 13, "id": "comm_label_13", "label": "Cet investissement dans les infrastructures\nd\u2019\u00e9nergie propre, l\u2019un des plus...", "mass": 5, "physics": false, "shape": "box", "title": "Cet investissement dans les infrastructures d\u2019\u00e9nergie propre, l\u2019un des plus importants en Afrique, permettra de renforcer la fiabilit\u00e9 et la r\u00e9silience du syst\u00e8me \u00e9lectrique maroca. [lematin.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque mondiale a approuv\u00e9, le 1er juillet 2026, un financement de 265 millions de dollars (environ 2,4 milliards de dirhams) pour le projet de station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, dans le nord du Maroc. [telquel.ma]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9, mercredi, un financement de 265 millions de dollars pour la Station de transfert d\u0027\u00e9nergie par pompage (STEP) d\u0027Ifahsa, pr\u00e8s de Chefchaouen, l\u0027un des plus importants investissements en \u00e9nergie propre en Afrique. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9 mercredi un financement de 265 millions de dollars en faveur du projet de Station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, situ\u00e9 dans le nord du Maroc, indique le Groupe de la Banque mondiale dans un communiqu\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "\u00c0 l\u0027approche du duel entre\nle Maroc et le Canada...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u0027approche du duel entre le Maroc et le Canada en huiti\u00e8me de finale du Mondial 2026, le s\u00e9lectionneur canadien Jesse Marsch s\u0027attend \u00e0 un d\u00e9fi de taille. [lematin.ma]\n-------------------------------------------------\nQualifi\u00e9 pour la premi\u00e8re fois de son histoire pour les huiti\u00e8mes de finale d\u2019une Coupe du monde, le Canada h\u00e9rite d\u2019un adversaire coriace : le Maroc, demi-finaliste. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Conseil de gouvernement a\napprouv\u00e9 le projet de loi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9 le projet de loi n\u00b0 46.26 relatif au syst\u00e8me statistique national, pr\u00e9sent\u00e9 par le ministre de l\u0027Int\u00e9rieur.S\u0027inscrivant dans le cadre. [lematin.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de l\u2019Int\u00e9rieur, ce projet de loi qui s\u2019inscrit dans le cadre du suivi des hautes orientations royales, vise essentiellement \u00e0 mettre en place. [telquel.ma]\n-------------------------------------------------\nCe projet de loi vise essentiellement \u00e0 mettre en place un nouveau cadre juridique concernant le Syst\u00e8me statistique national, en d\u00e9terminant ses composantes et missions, ainsi que ses r\u00e8gles d\u2019organisation et les principes fondamentaux des statistiques officielles. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "AXA Assurance Maroc d\u00e9voile sa\npremi\u00e8re campagne de marque panafricaine,...", "mass": 5, "physics": false, "shape": "box", "title": "AXA Assurance Maroc d\u00e9voile sa premi\u00e8re campagne de marque panafricaine, une initiative qui place la solidarit\u00e9 interg\u00e9n\u00e9rationnelle au c\u0153ur de son discours. [lematin.ma]\n-------------------------------------------------\nCette initiative, premi\u00e8re campagne panafricaine de la marque con\u00e7ue au Maroc, sera progressivement d\u00e9ploy\u00e9e dans plusieurs pays du continent apr\u00e8s son lancement sur le march\u00e9 marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Ce projet de loi est\nporteur d\u2019une r\u00e9forme substantielle du...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet de loi est porteur d\u2019une r\u00e9forme substantielle du HCP qui sera ainsi transform\u00e9 en une instance de bonne gouvernance dot\u00e9e de la personnalit\u00e9 morale et de l\u2019autonomie administrative. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, le projet de loi 047.26 relatif au Haut-Commissariat au plan (HCP), pr\u00e9sent\u00e9 par le ministre de lInt\u00e9rieur. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Conseil de gouvernement a\nadopt\u00e9, jeudi \u00e0 Rabat, le...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9, jeudi \u00e0 Rabat, le projet de loi N\u00b0 051.26 relatif \u00e0 l\u2019organisation de la profession d\u2019adoul, pr\u00e9sent\u00e9 par le ministre de la Justice. [telquel.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de la Justice, ce texte vise \u00e0 tirer les cons\u00e9quences juridiques de la d\u00e9cision de la Cour constitutionnelle concernant la loi n\u00b0 16.22 sur la m\u00eame profession, conform\u00e9ment \u00e0 l\u0027article 134 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du\np\u00f4le DGSN-DGST, a re\u00e7u le...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du p\u00f4le DGSN-DGST, a re\u00e7u le g\u00e9n\u00e9ral de division Luis Pelaez Pi\u00f1eiro, chef de la Commission du renseignement de la Garde civile espagnole, \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation de haut niveau en visite de travail au Royaume du Maroc. [telquel.ma]\n-------------------------------------------------\nLe Directeur G\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi, a re\u00e7u, jeudi au Si\u00e8ge de la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale \u00e0 Rabat, le g\u00e9n\u00e9ral Luis Pel\u00e1ez Pi\u00f1eiro, chef du Commissariat du renseignement de la Garde civile espagnole, actuellement en visite de travail au Maroc \u00e0 la [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Une vague de chaleur, des\naverses orageuses avec gr\u00eale et...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur, des averses orageuses avec gr\u00eale et rafales de vent sous orages sont attendues dans plusieurs provinces du Royaume \u00e0 partir de ce jeudi, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau de vigilance orange. [telquel.ma]\n-------------------------------------------------\nCanicule : Une vague de chaleur, des averses orageuses avec gr\u00eale et rafales de vent sous orages sont attendues dans plusieurs provinces du Royaume \u00e0 partir du jeudi, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau de vigilance orange. [aujourdhui.ma]\n-------------------------------------------------\nUne vague de chaleur et des averses orageuses avec risque de gr\u00eale et rafale de vent sous orages sont attendus, de mercredi \u00e0 e7aise, aux \u00e9changes culturels et \u00e0 la promotion de la cr\u00e9ation artistique, a \u00e9t\u00e9 inaugur\u00e9e, mercredi, en pr\u00e9sence de l\u2019ambassadeur de France au Maroc, Philippe Lalliot. [telquel.ma]\n-------------------------------------------------\nL\u2019ambassadeur de France au Maroc, Philippe Lalliot, a effectu\u00e9 ce mercredi son premier d\u00e9placement officiel \u00e0 La\u00e2youne, \u00e0 l\u2019occasion de l\u2019inauguration de la nouvelle Alliance fran\u00e7aise dans la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La 11\u00e8me Commission Nationale des\nInvestissements, r\u00e9unie jeudi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "La 11\u00e8me Commission Nationale des Investissements, r\u00e9unie jeudi \u00e0 Rabat, sous la pr\u00e9sidence du Chef de gouvernement Aziz Akhannouch, a approuv\u00e9 29 projets de conventions d\u2019investissement d\u2019un total de pr\u00e8s de 42 milliards de dirhams (MMDH) et 9 avenants \u00e0 des conventions dans le cadre du dispositif principal. [aujourdhui.ma]\n-------------------------------------------------\nLes 29 projets approuv\u00e9s portent sur un montant global de pr\u00e8s de 42 milliards de dirhams, permettant la cr\u00e9ation de pr\u00e8s de 9.800 emplois, dont 2.400 directs et 7.400 indirects. [www.lavieeco.com]\n-------------------------------------------------\nLa 11\u00e8me Commission nationale des investissements, r\u00e9unie jeudi \u00e0 Rabat, sous la pr\u00e9sidence du Chef de gouvernement Aziz Akhannouch, a approuv\u00e9 29 projets de conventions d\u2019investissement d\u2019un total de pr\u00e8s de 42 milliards de dirhams (MMDH) et 9 avenants \u00e0 des conventions dans le cadre du dispositif principal. [telquel.ma]\n-------------------------------------------------\nLa 11\u1d49 Commission nationale des investissements (CNI), r\u00e9unie jeudi sous la pr\u00e9sidence du Chef du gouvernement Aziz Akhannouch, a approuv\u00e9 29 projets de conventions d\u2019investissement repr\u00e9sentant un montant global de pr\u00e8s de 42 milliards de dirhams (MMDH), ainsi que neuf avenants \u00e0 des conventions existantes dans le cadre du dispositif principal de la nouvelle Charte . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Convention La Direction des Archives\nRoyales et l\u2019Universit\u00e9 Mohammed VI...", "mass": 5, "physics": false, "shape": "box", "title": "Convention La Direction des Archives Royales et l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) ont sign\u00e9, r\u00e9cemment \u00e0 Rabat, une convention-cadre de partenariat d\u00e9di\u00e9e \u00e0 la formation, \u00e0 la recherche, \u00e0 la pr\u00e9servation et \u00e0 la valorisation du patrimoine documentaire national. [aujourdhui.ma]\n-------------------------------------------------\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La Direction des Archives Royales et l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) ont sign\u00e9 une convention-cadre pour renforcer la pr\u00e9servation, la num\u00e9risation et la valorisation du patrimoine documentaire marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Agence Maghreb Arabe Presse (MAP)\na tenu, jeudi, la toute...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence Maghreb Arabe Presse (MAP) a tenu, jeudi, la toute premi\u00e8re \u00e9dition internationale de son Town Hall \u00e0 Washington, qui a \u00e9t\u00e9 l\u2019occasion de c\u00e9l\u00e9brer les 250 ans du partenariat et de l\u2019alliance historiques d\u2019exception liant le Royaume du Maroc et les Etats-Unis d\u2019Am\u00e9rique. [www.lereporter.ma]\n------------------------------------     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
