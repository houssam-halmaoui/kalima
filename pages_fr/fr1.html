19engagement constructif du Maroc. [telquel.ma]\n-------------------------------------------------\nLe ministre roumain des Affaires \u00e9trang\u00e8res, Dan Nicolaescu, a r\u00e9it\u00e9r\u00e9 que le plan d\u2019autonomie propos\u00e9 par le Maroc est \u00abla base la plus appropri\u00e9e, s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste\u00bb pour une solution \u00e9quitable, durable et accept\u00e9e par tous concernant la question du Sahara. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre roumain des Affaires \u00e9trang\u00e8res, Dan Necul\u0103escu, a r\u00e9affirm\u00e9, lors d\u2019un entretien t\u00e9l\u00e9phonique avec son homologue marocain Nasser Bourita, la position de Bucarest en faveur du plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre roumain des Affaires \u00e9trang\u00e8res, Dan Necul\u0103escu, a r\u00e9affirm\u00e9, \u00e0 l\u2019occasion d\u2019un entretien t\u00e9l\u00e9phonique mardi avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, que le plan d\u2019autonomie pr\u00e9sent\u00e9 par le Maroc constitue \u201cla base la plus ad\u00e9quate, s\u00e9rieuse, cr\u00e9dible et r\u00e9aliste\u201d pour parvenir \u00e0 [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le minist\u00e8re de la Jeunesse,\nde la Culture et des...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Jeunesse, de la Culture et des Sports s\u2019oriente vers le d\u00e9veloppement du programme \u00ab Moutatawi3 \u00bb en permettant aux b\u00e9n\u00e9ficiaires de prendre part \u00e0 des activit\u00e9s b\u00e9n\u00e9voles tout au long de l\u2019ann\u00e9e, au lieu de se limiter \u00e0 trois semaines par an, a annonc\ e au matin, au Centre hospitalier universitaire (CHU) Mohammed [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Times Higher Education a\nd\u00e9voil\u00e9 mardi \u00e0 Bengu\u00e9rir son...", "mass": 5, "physics": false, "shape": "box", "title": "Le Times Higher Education a d\u00e9voil\u00e9 mardi \u00e0 Bengu\u00e9rir son classement 2027 des universit\u00e9s arabes lors de la 9e \u00e9dition de lArab Universities Summit 2026, tenue sur le campus de lUniversit\u00e9 Mohammed VI Polytechnique (UM6P) jusquau 5 novembre. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique, en partenariat avec Times Higher Education (THE), acteur international de r\u00e9f\u00e9rence dans l\u2019analyse et l\u2019\u00e9valuation de l\u2019enseignement sup\u00e9rieur, organise du 3 au 5 novembre 2026, sur son campus de Benguerir, le THE Arab Universities Summit 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral de\nla S\u00fbret\u00e9 nationale et de...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire (DGSN-DGST), a re\u00e7u mardi \u00e0 Rabat le chef de la S\u00fbret\u00e9 de l\u2019\u00c9tat du Qatar, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi. [www.yabiladi.com]\n-------------------------------------------------\nLe Directeur G\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), M. Abdellatif Hammouchi, a re\u00e7u, mardi \u00e0 Rabat, le Chef du Service de la S\u00e9curit\u00e9 de l\u2019\u00c9tat du Qatar, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi, en pr\u00e9sence d\u201         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
