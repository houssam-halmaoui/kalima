-----------------------------------------------\nAl Barid Bank et le Conseil National de l\u2019Ordre des M\u00e9decins Dentistes ont sign\u00e9 une convention de partenariat destin\u00e9e \u00e0 renforcer leur coop\u00e9ration et \u00e0 proposer aux m\u00e9decins dentistes inscrits \u00e0 l\u2019Ordre des solutions de financement ainsi que des services bancaires adapt\u00e9s \u00e0 leurs besoins, tant personnels que professionnels. [www.lopinion.ma]\n-------------------------------------------------\nAl Barid Bank et le Conseil national de l\u2019Ordre national des m\u00e9decins dentistes ont sign\u00e9 une convention de partenariat visant \u00e0 offrir aux praticiens une gamme compl\u00e8te de services bancaires et de solutions de financement adapt\u00e9s \u00e0 leurs besoins. [www.lavieeco.com]\n-------------------------------------------------\nAl Barid Bank et le Conseil national de l\u2019Ordre des m\u00e9decins dentistes ont sign\u00e9, le 30 octobre 2025 \u00e0 Casablanca, une convention de partenariat destin\u00e9e \u00e0 renforcer la coop\u00e9ration entre les deux institutions. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "R\u00e9alis\u00e9 sur une superficie de\n22.200 m\u00e8tres carr\u00e9es, le nouveau...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9alis\u00e9 sur une superficie de 22.200 m\u00e8tres carr\u00e9es, le nouveau site de Hirschmann Automotive \u00e0 Oujda, qui compl\u00e8te celui existant \u00e0 K\u00e9nitra, a n\u00e9cessit\u00e9 un investissement d\u2019enviro. [lematin.ma]\n-------------------------------------------------\nR\u00e9alis\u00e9 sur une superficie de 22.200 m\u00e8tres carr\u00e9es, le nouveau site de Hirschmann Automotive, qui compl\u00e8te celui existant \u00e0 K\u00e9nitra, a n\u00e9cessit\u00e9 un investissement d\u2019environ 180 millions de. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bol             mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
