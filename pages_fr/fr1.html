ique destin\u00e9 \u00e0 renforcer le suivi du d\u00e9roulement des examens et \u00e0 r\u00e9duire les \u00ab erreurs \u00bb de gestion, a indiqu\u00e9 le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports, Mohamed Saad Berrada, lundi \u00e0 la Chambre des repr\u00e9sentants. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Quelque 502.000 personnes, tous \u00e2ges\nconfondus, ont visit\u00e9 le 31e...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a fait savoir le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [fr.hespress.com]\n-------------------------------------------------\nQuelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [telquel.ma]\n-------------------------------------------------\nQuelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Autoroutes du Maroc (ADM) a\nannonc\u00e9 la poursuite des travaux...", "mass": 5, "physics": false, "shape": "box", "title": "Autoroutes du Maroc (ADM) a annonc\u00e9 la poursuite des travaux d\u2019am\u00e9nagement au niveau de l\u2019\u00e9changeur de Mohammedia Est sur l\u2019autoroute Rabat-Casablanca. [lematin.ma]\n-------------------------------------------------\n\u2014 Les  son histoire avec trois c\u00e9r\u00e9monies d\u2019ouverture distinctes, organis\u00e9es successivement au Mexique, au Canada et aux \u00c9tats-Unis, a annonc\u00e9 samedi la Fifa, qui entend faire de cette \u00e9dition \u00e0 48 \u00e9quipes \u00ab une c\u00e9l\u00e9bration continentale et mondiale \u00bb m\u00ealant football, musique et culture. [telquel.ma]\n-------------------------------------------------\nPour la premi\u00e8re fois, le continent sera repr\u00e9sent\u00e9 par dix s\u00e9lections, un exploit rendu possible gr\u00e2ce \u00e0 l\u2019\u00e9largissement du tournoi \u00e0 48 \u00e9quipes, tel que d\u00e9cid\u00e9 par la FIFA. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les op\u00e9rations de recherche intensives\nmen\u00e9es par les Forces arm\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "Les op\u00e9rations de recherche intensives men\u00e9es par les Forces arm\u00e9es royales (FAR) conjointement avec les Forces am\u00e9ricaines ont permis de retrouver et rep\u00eacher, samedi 9 mai, l\u2019un des deux soldats am\u00e9ricains qui participaient \u00e0 l\u2019exercice African Lion 2026, port\u00e9s disparus depuis le 2 mai au niveau d\u2019une falaise \u00e0 Cap Draa. [telquel.ma]\n-------------------------------------------------\nLes op\u00e9rations de recherche men\u00e9es conjointement par les Forces Arm\u00e9es Royales (FAR) et les forces am\u00e9ricaines ont permis de retrouver la d\u00e9pouille de l\u2019un des deux militaires am\u00e9ricains port\u00e9s disparus depuis le 2 mai au niveau d\u2019une falaise \u00e0 Cap Draa, alors qu\u2019ils participaient \u00e0 l\u2019exercice multinational African Lion 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019ambassadeur du Maroc \u00e0 P\u00e9kin,\nAbdelkader El Ansari, a pr\u00e9sent\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur du Maroc \u00e0 P\u00e9kin, Abdelkader El Ansari, a pr\u00e9sent\u00e9, dimanche 10 mai, les atouts du Maroc et les perspectives du partenariat \u00e9conomique multisectoriel avec la Chine, devenue, [www.challenge.ma]\n-------------------------------------------------\nL\u2019ambassadeur de Sa Majest\u00e9 le Roi en Chine, Abdelkader El Ansari, a pr\u00e9sent\u00e9, dimanche \u00e0 P\u00e9kin, les atouts du Royaume et les perspectives du partenariat \u00e9conomique multisectoriel sino-marocain, lors d\u2019une rencontre tenue dans le cadre du Festival maroco-chinois de la culture et des sports organis\u00e9 samedi et dimanche. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Chef du gouvernement, M.\nAziz Akhannouch, a pris part,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du gouvernement, M. Aziz Akhannouch, a pris part, lundi \u00e0 Nairobi, \u00e0 la c\u00e9r\u00e9monie de cl\u00f4ture du forum d\u2019affaires \u00ab Africa Forward : Inspire \u0026 Connect \u00bb, co-pr\u00e9sid\u00e9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [aujourdhui.ma]\n-------------------------------------------------\nLe Chef du gouvernement a pris part, lundi au Palais d\u0027\u00c9tat, au d\u00eener offert par le pr\u00e9sident k\u00e9nyan, William Ruto en l\u2019honneur des chefs d\u2019Etat et de gouvernement participant au sommet \"Africa Forward\" \u00e0 Nairobi. [www.lavieeco.com]\n-------------------------------------------------\nLe chef du gouvernement, M. Aziz Akhannouch, a pris part, lundi \u00e0 Nairobi, \u00e0 la c\u00e9r\u00e9monie de cl\u00f4ture du forum d\u2019affaires \u201cAfrica Forward : Inspire \u0026 Connect\u201d, co-pr\u00e9sid\u00e9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [atlasinfo.fr]\n-------------------------------------------------\nLes travaux du sommet \u00ab Africa Forward \u00bb se sont ouverts, mardi \u00e0 Nairobi, avec la participation du Chef du gouvernement, Aziz Akhannouch qui repr\u00e9sente le Roi Mohammed VI. [fr.hespress.com]\n-------------------------------------------------\nLa d\u00e9l\u00e9gation marocaine \u00e0 cette grand-messe franco-africaine, plac\u00e9e sous le th\u00e8me \u201cAfrica Forward : des partenariats entre l\u2019Afrique et la France pour l\u2019innovation et la croissance\u201d, comprend la. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a pris part, lundi \u00e0 Nairobi, \u00e0 la c\u00e9r\u00e9monie de cl\u00f4ture du forum d\u2019affaires Africa Forward : Inspire \u0026 Connect, co-pr\u00e9sid\u00e9e par le pr\u00e9sident k\u00e9nyan William Ruto et son homologue fran\u00e7ais Emmanuel Macron. [www.yabiladi.com]\n-------------------------------------------------\nLe Chef du gouvernement, M. Aziz Akhannouch, qui repr\u00e9sente Sa Majest\u00e9 le Roi Mohammed VI au sommet \u201cAfrica Forward\u201d \u00e0 Nairobi, a pris part, lundi au Palais d\u2019\u00c9tat, au d\u00eener offert par le pr\u00e9sident k\u00e9nyan, William Ruto en l\u2019honneur des chefs d\u2019Etat et de gouvernement participants. [www.lereporter.ma]\n-------------------------------------------------\nLes travaux du sommet \u00ab Africa Forward \u00bb se sont ouverts, mardi \u00e0 Nairobi, avec la participation du Chef du gouvernement, M. Aziz Akhannouch qui repr\u00e9sente SM le Roi Mohammed VI. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Chambre des repr\u00e9sentants a\nadopt\u00e9, lundi soir, \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a adopt\             tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
