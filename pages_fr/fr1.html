de certains joueurs et officiels lors de la finale de la TotalEnergies CAF Coupe d\u2019Afrique des Nations Maroc 2025 entre le Maroc et le S\u00e9n\u00e9gal, qui s\u2019est d\u00e9roul\u00e9e, dimanche, \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a condamn\u00e9 ce quelle a d\u00e9crit comme un comportement inacceptable de la part de certains joueurs et responsables lors de la finale de la Coupe dAfrique des nations (CAN 2025), qui sest jou\u00e9e dimanche soir \u00e0 Rabat entre le Maroc et le S\u00e9n\u00e9gal. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le pr\u00e9sident de la FiFA,\nGianni Infantino, a condamn\u00e9 lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la FiFA, Gianni Infantino, a condamn\u00e9 lundi \u00ab des sc\u00e8nes inacceptables \u00bb lors de la finale de la CAN, mettant en cause certains joueurs et une partie du staff du S\u00e9n\u00e9gal qui ont quitt\u00e9 le terrain plusieurs minutes en plein match. [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, a f\u00e9licit\u00e9, lundi 19 janvier, le Maroc pour avoir \u00e9t\u00e9 \u00ab l\u2019h\u00f4te exceptionnel \u00bb de la Coupe d\u2019Afrique des Nations (CAN) 2025, qu\u2019il [www.challenge.ma]\n-------------------------------------------------\nLa finale de la CAN 2025, attendue comme un sommet du football africain, a \u00e9t\u00e9 ternie par des comportements qui ont d\u00e9tourn\u00e9 l\u2019attention du terrain vers des sc\u00e8nes de tension qui ont suscit\u00e9 une pol\u00e9mique autour du respect de l\u2019esprit sportif lors des grands rendez-vous continentaux. [maroc-diplomatique.net]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, a fustig\u00e9 l\u0027attitude des joueurs et du staff s\u00e9n\u00e9galais lors de la finale de la CAN 2025 remport\u00e9e par le S\u00e9n\u00e9gal face au Maroc (1-0 apr\u00e8s prolongation). [atlasinfo.fr]\n-------------------------------------------------\nLe pr\u00e9sident de la FIFA, Gianni Infantino, a f\u00e9licit\u00e9 lundi le Maroc pour avoir \u00e9t\u00e9 \u201cl\u2019h\u00f4te exceptionnel\u201d de la Coupe d\u2019Afrique des Nations (CAN) 2025, qu\u2019il a qualifi\u00e9e de \u201ctournoi fantastique\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "le Prince Moulay Rachid a\npass\u00e9 en revue une section...", "mass": 5, "physics": false, "shape": "box", "title": "le Prince Moulay Rachid a pass\u00e9 en revue une section des Forces Auxiliaires qui rendait les honneurs, avant d\u2019\u00eatre. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection s\u00e9n\u00e9galaise de football a remport\u00e9 la Coupe d\u2019Afrique des Nations-2025 en battant son homologue marocaine par 1 but \u00e0 0 apr\u00e8s prolongations (temps r\u00e9glementaire 0-0), dimanche soir au Stade Prince Moulay Abdellah \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLe S\u00e9n\u00e9gal a remport\u00e9 la Coupe d\u2019Afrique des Nations 2025 en battant le Maroc 1-0, dimanche au Stade Prince Moulay Abdellah de Rabat, au terme d\u2019une finale longtemps ind\u00e9cise et finalement tranch\u00e9e en prolongations. [lnt.ma]\n-------------------------------------------------\nPour cette affiche de gala entre deux s\u00e9lections qui ne s\u2019\u00e9taient jamais affront\u00e9es en phase finale de la CAN, Walid Regragui a reconduit le m\u00eame Onze de d\u00e9part. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "le Roi exprime Ses plus\nchaleureuses f\u00e9licitations aux joueurs, entra\u00eeneurs,...", "mass": 5, "physics": false, "shape": "box", "title": "le Roi exprime Ses plus chaleureuses f\u00e9licitations aux joueurs, entra\u00eeneurs, staffs technique, m\u00e9dical et administratif, ainsi qu\u2019aux responsables de la f\u00e9d\u00e9r. [lematin.ma]\n-------------------------------------------------\nSM le Roi adresse un message de f\u00e9licitations aux membres de l\u2019\u00e9quipe nationale de football, finalistes de la CAN. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Chambre de Commerce Suisse\nau Maroc (CCSM) a officialis\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre de Commerce Suisse au Maroc (CCSM) a officialis\u00e9, le 16 janvier \u00e0 Casablanca, la nomination de Yassin Halhoul en tant que nouveau pr\u00e9sident, succ\u00e9dant \u00e0 Christophe de Fi. [lematin.ma]\n-------------------------------------------------\nLa Chambre de commerce suisse au Maroc (CCSM) a nomm\u00e9 Yassin Halhoul en tant que nouveau pr\u00e9sident, \u00e0 l\u2019issue de la d\u00e9mission de Christophe de Figueiredo, qui se consacre d\u00e9sormais \u00e0 de nouvelles opportunit\u00e9s professionnelles. [leseco.ma]\n-------------------------------------------------\nLa Chambre de Commerce Suisse au Maroc (CCSM) annonce la nomination de M. Yassin Halhoul en tant que nouveau Pr\u00e9sident, \u00e0 la suite de la d\u00e9mission de M. Christophe de Figueiredo, qui se consacre d\u00e9sormais \u00e0 de nouvelles opportunit\u00e9s professionnelles. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La collision entre deux trains\n\u00e0 grande vitesse dimanche soir,...", "mass": 5, "physics": false, "shape": "box", "title": "La collision entre deux trains \u00e0 grande vitesse dimanche soir, dont l\u2019un a d\u00e9raill\u00e9, dans le sud de l\u2019Espagne a fait au moins 39 morts mais le bilan n\u2019est \u00ab pas d\u00e9finitif \u00bb, ont pr\u00e9venu lundi les autorit\u00e9s, \u00e9voquant un accident \u00ab extr\u00eamement \u00e9trange \u00bb. [telquel.ma]\n-------------------------------------------------\nAu moins 39 personnes ont \u00e9t\u00e9 tu\u00e9es dimanche dans le sud de l\u2019Espagne dans un accident impliquant deux trains qui transportaient des centaines de passagers, selon un nouveau bilan fourni par les services d\u2019urgence de la r\u00e9gion d\u2019Andalousie. [maroc-diplomatique.net]\n-------------------------------------------------\nDeux trains \u00e0 grande vitesse ont d\u00e9raill\u00e9 dimanche soir pr\u00e8s d\u0027Adamuz, en Andalousie, tuant au moins 39 personnes et en blessant beaucoup d\u0027autres, dans un grave accident sur la ligne Madrid-Andalousie. [atlasinfo.fr]\n-------------------------------------------------\nUn grave accident ferroviaire impliquant deux trains \u00e0 grande vitesse a fait au moins 21 morts et plusieurs dizaines de bless\u00e9s dimanche dans le sud de l\u2019Espagne, pr\u00e8s de la localit\u00e9 d\u2019Adamuz, en Andalousie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le s\u00e9lectionneur national, Walid Regragui,\nn\u2019a pas cach\u00e9 sa frustration...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, n\u2019a pas cach\u00e9 sa frustration apr\u00e8s la finale de la Coupe dAfrique des nations (CAN 2025) remport\u00e9e, dimanche soir \u00e0 Rabat par le S\u00e9n\u00e9gal face au Maroc (0-1, a.p), reconnaissant que le football est parfois \u00abcruel\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, n\u2019a pas cach\u00e9 sa frustration apr\u00e8s la finale de la Coupe d\u2019Afrique des Nations (CAN) remport\u00e9e, dimanche soir \u00e0 Rabat par le S\u00e9n\u00e9gal face au Maroc (0-1, a.p), reconnaissant que le football est parfois \u00ab cruel \u00bb. [maroc-diplomatique.net]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, n\u2019a pas cach\u00e9 sa frustration apr\u00e8s la finale de la Coupe d\u0027Afrique des Nations (CAN) remport\u00e9e, dimanche soir \u00e0 Rabat par le S\u00e9n\u00e9gal face au Maroc (0-1, a.p), reconnaissant que le football est parfois \"cruel\". [leseco.ma]\n-------------------------------------------------\nAu lendemain de la finale de la Coupe d\u2019Afrique des Nations 2025 remport\u00e9e par le S\u00e9n\u00e9gal face au Maroc apr\u00e8s prolongations, Walid Regragui a exprim\u00e9 sa profonde d\u00e9ception en conf\u00e9rence de presse \u00e0 Rabat, reconnaissant que le football peut parfois se montrer impitoyable, notamment dans un match aussi d\u00e9cisif. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Dans un communiqu\u00e9, le pr\u00e9sident\nde la Commission de l\u2019UA...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, le pr\u00e9sident de la Commission de l\u2019UA Mahmoud Ali Youssouf a exprim\u00e9 \u00ab la profonde gratitude de la Commission \u00e0 Sa Majest\u00e9 le Roi, au gouvernement et au peuple . [maroc-diplomatique.net]\n-------------------------------------------------\nLa Commission de l\u2019Union Africaine (UA) a exprim\u00e9 sa profonde gratitude au Maroc pour lorganisation \u00abexemplaire\u00bb de la Coupe d\u2019Afrique des nations (CAN 2025). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Salon mondial de la\nfabrication avanc\u     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
