"mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a \u00e9t\u00e9 r\u00e9\u00e9lu, \u00e0 l\u2019unanimit\u00e9, \u00e0 la vice-pr\u00e9sidence du Comit\u00e9 ex\u00e9cutif du Centre europ\u00e9en pour l\u2019interd\u00e9pendance et la solidarit\u00e9 mondiales, commun\u00e9ment appel\u00e9 Centre Nord-Sud du Conseil de l\u2019Europe, lors de la r\u00e9union du Comit\u00e9 tenue le 19 mai \u00e0 Lisbonne. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9uni le 19 mai \u00e0 Lisbonne, le Comit\u00e9 ex\u00e9cutif du Centre Nord-Sud du Conseil de l\u0027Europe a r\u00e9\u00e9lu le Maroc \u00e0 l\u0027unanimit\u00e9 \u00e0 sa vice-pr\u00e9sidence. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a \u00e9t\u00e9 r\u00e9\u00e9lu, \u00e0 l\u2019unanimit\u00e9, \u00e0 la vice-pr\u00e9sidence du Comit\u00e9 ex\u00e9cutif du Centre europ\u00e9en pour l\u2019interd\u00e9pendance et la solidarit\u00e9 mondiales, commun\u00e9ment appel\u00e9 Centre Nord-Sud du Conseil de l\u2019Europe, lors de la r\u00e9union du Comit\u00e9 tenue le 19 mai \u00e0 Lisbonne. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Prince Moulay Rachid a\npr\u00e9sid\u00e9, vendredi au Royal Golf...", "mass": 5, "physics": false, "shape": "box", "title": "Le Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par le Roi Mohammed VI \u00e0 l\u2019occasion de la 50e \u00e9dition du Troph\u00e9e Hassan II de golf et de la 29e \u00e9dition de la Coupe Lalla Meryem, organis\u00e9es sous le haut patronage du Souverain. [fr.hespress.com]\n-------------------------------------------------\nSon Altesse Royale le Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, \u00e0. [lematin.ma]\n-------------------------------------------------\nEntre l\u00e9gendes et nouvelles g\u00e9n\u00e9rations, le Royal Golf Dar Es Salam vibre depuis lundi au rythme de la 50e \u00e9dition du Troph\u00e9e Hassan II et de la 29e Coupe Lalla Meryem. [leseco.ma]\n-------------------------------------------------\nSon Altesse Royale le Prince Moulay Rachid a pr\u00e9sid\u00e9, vendredi au Royal Golf Dar Es-Salam \u00e0 Rabat, le d\u00eener de gala offert par Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, \u00e0 l\u2019occasion de la 50e \u00e9dition du Troph\u00e9e Hassan II de golf et de la 29e \u00e9dition de la Coupe Lalla Meryem, organis\u00e9es [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\npar le Vice-ministre panam\u00e9en des...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e par le Vice-ministre panam\u00e9en des Relations ext\u00e9rieures, Carlos Arturo Hoyos Boyd, en visite de travail au Maroc, \u00e0 l\u2019issue de sa rencontre avec le mi. [lematin.ma]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [telquel.ma]\n-------------------------------------------------\nLe vice-ministre panam\u00e9en des Relations ext\u00e9rieures, Carlos Arturo Hoyos Boyd, en d\u00e9placement officiel au Maroc, a port\u00e9 ce message \u00e0 l\u0027issue de ses entretiens avec le ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u0027\u00e9tranger, Nasser Bourita. [www.lavieeco.com]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Panama a r\u00e9affirm\u00e9, vendredi \u00e0 Rabat, sa position constante de soutien au plan d\u2019autonomie, sous souverainet\u00e9 marocaine, comme seule solution \u00e0 la question du Sahara marocain, tout en exprimant son appui \u00e0 la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Lors de cette rencontre, durant\nlaquelle Nasser Bourita a r\u00e9affirm\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette rencontre, durant laquelle Nasser Bourita a r\u00e9affirm\u00e9 la profondeur des relations maroco-mauritaniennes, les deux parties ont pass\u00e9 en revue la coop\u00e9ration bilat\u00e9rale. [lematin.ma]\n-------------------------------------------------\nLe ministre mauritanien des Affaires \u00e9trang\u00e8res, Mohamed Salem Ould Merzoug, a \u00e9t\u00e9 re\u00e7u vendredi \u00e0 Rabat par Nasser Bourita en sa qualit\u00e9 d\u2019\u00e9missaire du pr\u00e9sident Mohamed Ould Cheikh El Ghazouani, porteur d\u2019un message au roi Mohammed VI. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u0027occasion de cette rencontre, les deux parties ont pass\u00e9 en revue l\u0027\u00e9tat de la coop\u00e9ration bilat\u00e9rale et ses perspectives, ainsi que les moyens de renforcer la coordination entre 26, en croissance de 9,7% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u0027Office National des A\u00e9roports (ONDA). [leseco.ma]\n-------------------------------------------------\nLes a\u00e9roports du Maroc ont enregistr\u00e9 un volume de trafic commercial de 12.336.962 passagers \u00e0 fin avril 2026, en croissance de 9,7% par rapport \u00e0 la m\u00eame p\u00e9riode [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00c0 travers une c\u00e9r\u00e9monie organis\u00e9e\njeudi \u00e0 Casablanca, le minist\u00e8re...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 travers une c\u00e9r\u00e9monie organis\u00e9e jeudi \u00e0 Casablanca, le minist\u00e8re de l\u2019Industrie et du Commerce a remis les premiers certificats de labellisation \u00ab Made in Morocco \u00bb \u00e0 pr\u00e8s de 80. [lematin.ma]\n-------------------------------------------------\nEnosis Group annonce l\u0027obtention du label \"Made in Morocco\", une distinction r\u00e9cemment lanc\u00e9e par le minist\u00e8re de l\u0027Industrie et du Commerce afin de valoriser les produits fabriqu\u00e9s au Maroc et de promouvoir le savoir-faire industriel national. [leseco.ma]\n-------------------------------------------------\nPr\u00e8s de 80 entreprises industrielles ont re\u00e7u, jeudi \u00e0 Casablanca, les certificats de labellisation \u00ab Made in Morocco \u00bb, lors d\u2019une c\u00e9r\u00e9monie tenue sous la pr\u00e9sidence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Saisi en urgence par le\nchef du gouvernement, le Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Saisi en urgence par le chef du gouvernement, le Conseil de la concurrence a approuv\u00e9, le 21 mai 2026, la <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
