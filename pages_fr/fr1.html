e vendredi 31 octobre 2025, \u00e0 partir de 21h. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil de s\u00e9curit\u00e9 de l\u2019ONU adopte une r\u00e9solution sur le Sahara marocain: SM le Roi adresse un Discours \u00e0 Son peuple fid\u00e8le. [aujourdhui.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, a adress\u00e9, vendredi, un Discours \u00e0 Son peuple fid\u00e8le. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a adress\u00e9, vendredi, un Discours \u00e0 Son peuple fid\u00e8le. [www.lereporter.ma]\n-------------------------------------------------\nLe Minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie annonce que Sa Majest\u00e9 le Roi Mohammed VI que Dieu L\u2019assiste et Le glorifie, adressera un Discours \u00e0 Son peuple fid\u00e8le. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Sa Majest\u00e9 le Roi Mohammed\nVI, a adress\u00e9, vendredi, un...", "mass": 5, "physics": false, "shape": "box", "title": "Sa Majest\u00e9 le Roi Mohammed VI, a adress\u00e9, vendredi, un Discours \u00e0 Son peuple fid\u00e8le, se f\u00e9licitant du nouveau chapitre victorieux dans le processus de cons\u00e9cration de la Marocanit\u00e9 du Sahara, destin\u00e9 \u00e0 clore d\u00e9finitivement le dossier de ce conflit artificiel. [www.lopinion.ma]\n-------------------------------------------------\n\u00ab Bien que la question de notre int\u00e9grit\u00e9 territoriale connaisse des \u00e9volutions positives, le Maroc demeure attach\u00e9 \u00e0 la n\u00e9cessit\u00e9 de parvenir \u00e0 une solution qui sauve la face de toutes les parties, sans vainqueur, ni vaincu \u00bb, a affirm\u00e9 le Roi Mohammed VI, dans un Discours adress\u00e9, vendredi soir, \u00e0 son peuple fid\u00e8le. [atlasinfo.fr]\n-------------------------------------------------\n\u201cBien que la question de notre int\u00e9grit\u00e9 territoriale connaisse des \u00e9volutions positives, le Maroc demeure attach\u00e9 \u00e0 la n\u00e9cessit\u00e9 de parvenir \u00e0 une solution qui sauve la face de toutes les parties, sans vainqueur, ni vaincu\u201d, a affirm\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, dans un Discours adress\u00e9, vendredi soir, \u00e0 Son peuple fid\u00e8le. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Apr\u00e8s l\u2019avanc\u00e9e historique en faveur\ndu Maroc sur le dossier...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s l\u2019avanc\u00e9e historique en faveur du Maroc sur le dossier du Sahara lors du Conseil de S\u00e9curit\u00e9 de l\u2019ONU, ce 31 octobre, l\u2019ambassade de France a publi\u00e9 un communiqu\u00e9 saluant la d\u00e9cision onusienne. [telquel.ma]\n-------------------------------------------------\nLe Conseil de s\u00e9curit\u00e9 de l\u2019ONU a adopt\u00e9, vendredi 31 octobre, une r\u00e9solution historique confirmant la centralit\u00e9 du plan d\u2019autonomie propos\u00e9 par le Maroc pour le Sahara. [www.challenge.ma]\n-------------------------------------------------\nL\u2019ambassade de France au Maroc a salu\u00e9, vendredi soir, l\u2019adoption ce jour par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797 (2025), adopt\u00e9e \u00e0 11 voix favorables, qualifiant le plan d\u2019autonomie marocain de \u00ab seule base \u00bb pour une solution juste et durable au Sahara. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Roi Mohammed VI :\n\u00ab Il y a un...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI : \u00ab Il y a un a         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
