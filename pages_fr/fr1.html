, aboutissant au d\u00e9mant\u00e8lement d\u2019un r\u00e9seau criminel sp\u00e9cialis\u00e9 dans le trafic international de drogues par voie maritime. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "S\u0027inscrivant dans le cadre de\nla strat\u00e9gie de l\u0027Office pour...", "mass": 5, "physics": false, "shape": "box", "title": "S\u0027inscrivant dans le cadre de la strat\u00e9gie de l\u0027Office pour le renforcement du r\u00e9seau national de transport d\u2019\u00e9lectricit\u00e9 et de son r\u00f4le cl\u00e9 dans la transition \u00e9nerg\u00e9tique. [lematin.ma]\n-------------------------------------------------\nL\u0027Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) vient de lancer un avis de pr\u00e9-qualification des constructeurs pour la r\u00e9alisation de lignes \u00e9lectriques Ultra Haute Tension \u00e0 courant alternatif (UHT), destin\u00e9es \u00e0 assurer le transport de l\u2019\u00e9lectricit\u00e9 sur une distance d\u0027environ 1.000 km, reliant les zones de Boujdour et de Tensift. [leseco.ma]\n-------------------------------------------------\nL\u2019Office national de l\u2019\u00e9lectricit\u00e9 et de l\u2019eau potable (ONEE) vient de lancer un avis de pr\u00e9-qualification des constructeurs pour la r\u00e9alisation de lignes \u00e9lectriques ultra haute tension \u00e0 courant alternatif (UHT), destin\u00e9es \u00e0 assurer le transport de l\u2019\u00e9lectricit\u00e9 sur une distance d\u2019environ 1 000 km, reliant les zones de Boujdour et de Tensift. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le 24 novembre 2025, ses\ndirigeants, Karim Bernoussi et Youssef...", "mass": 5, "physics": false, "shape": "box", "title": "Le 24 novembre 2025, ses dirigeants, Karim Bernoussi et Youssef El Aoufir, ont sign\u00e9 un accord de reprise. [lematin.ma]\n-------------------------------------------------\nLes actionnaires dirigeants d\u2019Intelcia, \u00e0 savoir les co-fondateurs Karim Bernoussi et Youssef El Aoufir, d\u00e9tiennent d\u00e9sormais 100% des parts de la soci\u00e9t\u00e9, apr\u00e8s un accord convenu, le 24 [www.challenge.ma]\n-------------------------------------------------\nLe groupe Intelcia, cofond\u00e9 par Karim Bernoussi et El Aoufi, a annonc\u00e9 ce mercredi 26 novembre la signature d\u2019un accord avec le Altice pour racheter les 65 % du capital que le groupe de Patrick Drahi d\u00e9tenait depuis 2016. [telquel.ma]\n-------------------------------------------------\nLes actionnaires dirigeants du groupe Intelcia, Karim Bernoussi et Youssef El Aoufir, reprennent les parts d\u00e9tenues jusque-l\u00e0 par Altice, marquant ainsi un nouveau chapitre de d\u00e9veloppement avec \u00abun tour de table 100% marocain\u00bb. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le\nminist\u00e8re de la Transition \u00e9nerg\u00e9tique...", "mass": 5, "physics": false, "shape": "box", "title": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, la Wilaya et le Conseil de la R\u00e9gion Souss-Massa ainsi que la CGEM Souss-Massa, r\u00e9com. [lematin.ma]\n-------------------------------------------------\nL\u2019entreprise a remport\u00e9 le Troph\u00e9e Climat 2025, cat\u00e9gorie Agriculture, d\u00e9cern\u00e9 par le Minist\u00e8re de la Transition \u00e9nerg\u00e9tique, la Wilaya, la R\u00e9gion Souss-Massa et la CGEM locale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Apr\u00e8s le succ\u00e8s de sa\nsixi\u00e8me \u00e9dition organis\u00e9e sous le...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s le succ\u00e8s de sa sixi\u00e8me \u00e9dition organis\u00e9e sous le Haut Patronage de Sa Majest\u00e9 le Roi, la R\u00e9gion de l\u2019Oriental se pr\u00e9pare \u00e0 accueillir les 19 et 20 d\u00e9cembre la septi\u00e8me \u00e9dition de MEET the Lead, le rendez-vous incontournable d\u00e9di\u00e9 \u00e0 la transformation num\u00e9rique, \u00e0 l\u2019innovation et au d\u00e9veloppement territorial. [www.lopinion.ma]\n-------------------------------------------------\nApr\u00e8s une 6\u1d49 \u00e9dition organis\u00e9e sous le Haut Patronage de Sa Majest\u00e9 le Roi, la R\u00e9gion de l\u2019Oriental accueillera les 19 et 20 d\u00e9cembre la 7\u1d49 \u00e9dition du MEET the Lead, rendez-vous d\u00e9di\u00e9 \u00e0 la transformation num\u00e9rique, \u00e0 l\u2019innovation et au d\u00e9veloppement territorial. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Cour d\u2019appel de Casablanca\na confirm\u00e9, ce mercredi, la...", "mass": 5, "physics": false, "shape": "box", "title": "La Cour d\u2019appel de Casablanca a confirm\u00e9, ce mercredi, la condamnation de Mohamed Boudrika, ancien pr\u00e9sident du Raja Club Athletic et ex-pr\u00e9sident de l\u2019arrondissement de Mers Sultan, \u00e0 cinq ans de prison ferme. [telquel.ma]\n-------------------------------------------------\nLancien pr\u00e9sident du Raja Club Athletic et ancien parlementaire du parti du Rassemblement national des ind\u00e9pendants (RNI), Mohamed Boudrika, a \u00e9t\u00e9 condamn\u00e9 \u00e0 cinq ans de prison, hier par la Cour dappel de Casablanca. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Lors de son passage \u00e0\nla Chambre des conseillers, mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de son passage \u00e0 la Chambre des conseillers, mardi 25 novembre, le chef du gouvernement Aziz Akhannouch a annonc\u00e9 que l\u2019ex\u00e9cutif appliquera, d\u00e8s la fin de ce mois, une hausse de l\u2019aide sociale directe, sans toucher au prix du gaz butane. [telquel.ma]\n-------------------------------------------------\nAnnonc\u00e9e par le chef du gouvernement, Aziz Akhannouch, la premi\u00e8re augmentation des montants d\u2019aide sociale directe entrera en vigueur d\u00e8s la fin du mois de novembre. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "En rejetant une motion d\u2019objection\nde certains groupes de droite...", "mass": 5, "physics": false, "shape": "box", "title": "En rejetant une motion d\u2019objection de certains groupes de droite et d\u2019extr\u00eame droite, le Parlement europ\u00e9en valide l\u2019acte d\u00e9l\u00e9gu\u00e9 de la Commission et confirme l\u2019int\u00e9gration des produits des r\u00e9gions du Sahara marocain dans le r\u00e9gime pr\u00e9f\u00e9rentiel d\u2019acc\u00e8s au march\u00e9 europ\u00e9en. [telquel.ma]\n-------------------------------------------------\nLe Parlement Europ\u00e9en a rejet\u00e9, ce mercredi, une \"motion d\u2019objection\" introduite par certains milieux de droite et d\u2019extr\u00eame droite, contre le projet d\u2019acte d\u00e9l\u00e9gu\u00e9 pr\u00e9sent\u00e9 par la Commission Europ\u00e9enne dans le cadre de la mise en \u0153uvre de ses engagements d\u00e9coulant de l\u2019Accord sous forme d\u2019Echange de lettres conclu entre le Maroc et l\u2019UE le 3 octobre dernier au sujet de l\u2019exportation des produits agricoles marocains sur le march\u00e9 europ\u00e9en L\u2019article est apparu en premier sur . [www.lavieeco.com]\n-------------------------------------------------\nLe Parlement europ\u00e9en a rejet\u00e9 mercredi une motion d\u2019objection d\u00e9pos\u00e9e par certain     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
