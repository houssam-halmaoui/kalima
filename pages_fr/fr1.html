ret\u00e9 Nationale (DGSN) a formellement r\u00e9fut\u00e9 les informations publi\u00e9es le 21 janvier 2026 par l\u2019hebdomadaire fran\u00e7ais Le Point, faisant \u00e9tat de suppos\u00e9es attaques visant des commerces appartenant \u00e0 des ressortissants subsahariens au Maroc \u00e0 la suite de la finale de la Coupe d\u2019Afrique des Nations (CAN). [maroc-diplomatique.net]\n-------------------------------------------------\nLa Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) a d\u00e9menti cat\u00e9goriquement, vendredi, les all\u00e9gations fallacieuses rapport\u00e9es par l\u2019hebdomadaire fran\u00e7ais \"Le Point\" selon lesquelles plusieurs commerces appartenant \u00e0 des ressortissants subsahariens au Maroc auraient \u00e9t\u00e9 la cible d\u0027attaques et d\u0027incendies criminels, en marge de la finale de la Coupe d\u0027Afrique des Nations (CAN). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Conseil de gouvernement s\u2019est\ninform\u00e9, vendredi, d\u2019un accord entre...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement s\u2019est inform\u00e9, vendredi, d\u2019un accord entre les gouvernements du Royaume du Maroc et de la R\u00e9publique du Liberia dans le domaine de la coop\u00e9ration militaire, sign\u00e9 \u00e0 Rabat le 21 octobre 2025. [telquel.ma]\n-------------------------------------------------\nCet accord de coop\u00e9ration militaire entre les gouvernements du Royaume du Maroc et de la R\u00e9publique du Lib\u00e9ria a \u00e9t\u00e9 sign\u00e9 \u00e0 Rabat le 21 octobre 2025. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le trafic maritime entre le\nport espagnol de Tarifa et...", "mass": 5, "physics": false, "shape": "box", "title": "Le trafic maritime entre le port -\nLa 31e \u00e9dition du Salon international de l\u2019\u00e9dition et du livre (SIEL) se tiendra du 30 avril au 10 mai 2026 \u00e0 Rabat, avec la France comme invit\u00e9 d\u0027honneur, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication - D\u00e9partement de la Culture. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le groupe CMGP, cot\u00e9 \u00e0\nla Bourse de Casablanca depuis...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe CMGP, cot\u00e9 \u00e0 la Bourse de Casablanca depuis d\u00e9cembre 2024, a annonc\u00e9, jeudi, la finalisation de l\u2019acquisition de la Compagnie de produits chimiques du Maroc (CPCM), aupr\u00e8s de ses actionnaires historiques, ABC Holding et Khalid Lahlou. [telquel.ma]\n-------------------------------------------------\nCMGP Group annonce avoir finalis\u00e9 l\u2019acquisition de 95% de la Compagnie de Produits Chimiques de Maroc (CPCM), aupr\u00e8s de ses actionnaires historiques, ABC Holding et Khalid Lahlou, avec [www.challenge.ma]\n-------------------------------------------------\nLe groupe CMGP, cot\u00e9 \u00e0 la Bourse de Casablanca depuis d\u00e9cembre 2024, a annonc\u00e9, jeudi, la finalisation de l\u0027acquisition de la Compagnie de produits chimiques du Maroc (CPCM), aupr\u00e8s de ses actionnaires historiques, ABC Holding et M. Khalid Lahlou. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le minist\u00e8re l\u2019\u00c9quipement et de\nl\u2019Eau a appel\u00e9 l\u2019ensemble des...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re l\u2019\u00c9quipement et de l\u2019Eau a appel\u00e9 l\u2019ensemble des usagers de la route \u00e0 faire preuve de la plus grande vigilance et \u00e0 respecter strictement les r\u00e8gles de conduite dans leurs d\u00e9placements de la nuit de jeudi au lundi, certains axes routiers pouvant conna\u00eetre des perturbations de trafic en raison des fortes pluies et. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau a appel\u00e9 les usagers de la route \u00e0 observer un ensemble de mesures de pr\u00e9vention afin de garantir leur s\u00e9curit\u00e9, suite [www.challenge.ma]\n-------------------------------------------------\nEn effet, certains axes routiers pourraient \u00eatre perturb\u00e9s par les fortes pluies et chutes de neige pr\u00e9vues dans plusieurs provinces. [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau a appel\u00e9 les usagers de la route \u00e0 observer un ensemble de mesures de pr\u00e9vention afin de garantir leur s\u00e9curit\u00e9, suite au bulletin d\u2019alerte m\u00e9t\u00e9orologique \u00e9mis par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie, annon\u00e7ant de fortes pluies orageuses accompagn\u00e9es d\u2019importantes pr\u00e9cipitations dans plusieurs provinces du Royaume. [lnt.ma]\n-------------------------------------------------\nIntemp\u00e9ries: Le minist\u00e8re de l\u2019Equipement exhorte les usagers de la route \u00e0 faire preuve de vigilance. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019indice de confiance des m\u00e9nages\n(ICM) s\u2019est \u00e9tabli \u00e0 57,6...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice de confiance des m\u00e9nages (ICM) s\u2019est \u00e9tabli \u00e0 57,6 points au quatri\u00e8me trimestre de 2025, contre 46,5 points au m\u00eame trimestre de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nL\u2019indice d         });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
