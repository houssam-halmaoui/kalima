-dans-les-etablissements-denseignement-superieur/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 2, "id": 244, "label": "Classement FIFA: Le Maroc reprend...", "shape": "dot", "size": 47, "title": "Classement FIFA: Le Maroc reprend la 11e place mondiale\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/sport/classement-fifa-le-maroc-reprend-la-11e-place-mondiale/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 2, "id": 257, "label": "Le Maroc toujours en t\u00eate...", "shape": "dot", "size": 47, "title": "Le Maroc toujours en t\u00eate du classement de la FIFA pour l\u2019Afrique\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/le-maroc-toujours-en-tete-du-classement-de-la-fifa-pour-lafrique.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Malawi, George Tapatula Chaponda,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \u00ab historique \u00bb par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [fr.hespress.com]\n-------------------------------------------------\nLors d\u2019un point de presse conjoint avec le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, \u00e0 l\u2019issue de leurs. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue d\u2019un point de presse conjoint, les deux ministres des Affaires \u00e9trang\u00e8res ont mis en avant la qualit\u00e9 des relations unissant les deux pays et leur engagement \u00e0 les hisser vers de nouveaux horizons. [www.lavieeco.com]\n-------------------------------------------------\nLa Gambie par la voix de son ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration internationale et des Gambiens \u00e0 l\u2019\u00e9tranger, Sering Modou Njie, a r\u00e9it\u00e9r\u00e9, mercredi \u00e0 Rabat, son soutien constant \u00e0 la souverainet\u00e9 du Maroc sur le Sahara, se f\u00e9licitant vivement de l\u2019adoption par le Conseil de s\u00e9curit\u00e9 des Nations unies, de la r\u00e9solution . [maroc-diplomatique.net]\n-------------------------------------------------\nLe Royaume du Maroc et la R\u00e9publique du Malawi ont exprim\u00e9, mercredi \u00e0 Rabat, leur volont\u00e9 partag\u00e9e de renforcer davantage leurs relations de coop\u00e9ration dans les diff\u00e9rents domaines. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue gambien, Sering Modou Njie, ont r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, la d\u00e9termination du Maroc et de la Gambie \u00e0 consolider la coop\u00e9ration bilat\u00e9rale dans plusieurs domaines. [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Malawi a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, sa position immuable et son ferme soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc, et salu\u00e9 l\u2019adoption par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797 qui consacre le plan marocain d\u2019autonomie comme seule base pour parvenir \u00e0 une solution politique au diff\u00e9rend artificiel autour du Sahara. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \"historique\" par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le lat\u00e9ral du Paris Saint-Germain\nfait partie des tout derniers...", "mass": 5, "physics": false, "shape": "box", "title": "Le lat\u00e9ral du Paris Saint-Germain fait partie des tout derniers finalistes en lice pour le titre de meilleur joueur africain de l\u2019ann\u00e9e, apr\u00e8s une saison exceptionnelle tant . [fr.hespress.com]\n-------------------------------------------------\nL\u2019international marocain Achraf Hakimi a \u00e9t\u00e9 sacr\u00e9 meilleur joueur africain, lors de la c\u00e9r\u00e9monie des CAF Awards 2025, organis\u00e9e mercredi soir \u00e0 Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Airbus Helicopters a annonc\u00e9 mardi\n18 novembre 2025 la signature...", "mass": 5, "physics": false, "shape": "box", "title": "Airbus Helicopters a annonc\u00e9 mardi 18 novembre 2025 la signature d\u0027un contrat avec le Royaume du Maroc portant sur dix H225M destin\u00e9s aux op\u00e9rations de recherche et sauvetage a. [lematin.ma]\n-------------------------------------------------\nAirbus Helicopters confirme une commande de dix h\u00e9licopt\u00e8res H225M au profit des Forces royales air, apr\u00e8s de longues discussions entre les deux parties, avec l\u2019engagement du constructeur europ\u00e9en d\u2019ouvrir [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Maroc vient de franchir\nun cap in\u00e9dit dans ses...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc vient de franchir un cap in\u00e9dit dans ses exportations agricoles vers l\u2019Irlande. [lematin.ma]\n-------------------------------------------------\nEntre octobre 2024 et ao\u00fbt 2025, le Maroc a exp\u00e9di\u00e9 3 400 tonnes de tomates dune valeur de 7,5 millions de dollars, son niveau le plus \u00e9lev\u00e9 jamais atteint, soit 62% de plus que le pr\u00e9c\u00e9dent record \u00e9tabli en 2020/21. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le jury, compos\u00e9 de huit\npersonnalit\u00e9s de premier plan issues...", "mass": 5, "physics": false, "shape": "box", "title": "Le jury, compos\u00e9 de huit personnalit\u00e9s de premier plan issues de quatre continents et de diff\u00e9rentes g\u00e9n\u00e9rations, aura pour mission d\u2019appr\u00e9cier les quatorze premiers et seconds lon. [lematin.ma]\n-------------------------------------------------\n\u00c0 quelques jours de l\u2019ouverture de la 22\u1d49 \u00e9dition du Festival international du film de Marrakech, pr\u00e9vue du 28 novembre au 6 d\u00e9cembre 2025, les organisateurs d\u00e9voilent la composition d\u2019un jury qui illustre, une fois encore, l\u2019ambition du rendez-vous marocain. [www.lopinion.ma]\n-------------------------------------------------\nLe jury, compos\u00e9 de huit personnalit\u00e9s de premier plan issues de quatre continents et de diff\u00e9rentes g\u00e9n\u00e9rations, aura pour mission d\u2019appr\u00e9cier les quatorze premiers et seconds longs m\u00e9trages pr\u00e9sent\u00e9s en comp\u00e9tition officielle, d\u00e9di\u00e9e \u00e0 la d\u00e9couverte de nouveaux talents internationaux, indique un communiqu\u00e9 des organisateurs. [www.lavieeco.com]\n-------------------------------------------------\nLe Festival International du Film de Marrakech a d\u00e9v --------------------------------------------\nLa s\u00e9lection marocaine des moins de 17 ans s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde U17 en s\u2019imposant face au Mali (3-2), mardi \u00e0 l\u2019Aspire Zone de Doha, au terme d\u2019une rencontre disput\u00e9e et marqu\u00e9e par une efficacit\u00e9 offensive marocaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Vision maritime : R\u00e9unissant experts,\nprofessionnels et laur\u00e9ats du secteur,...", "mass": 5, "physics": false, "shape": "box", "title": "Vision maritime : R\u00e9unissant experts, professionnels et laur\u00e9ats du secteur, ISEM Alumni a d\u00e9voil\u00e9 \u00e0 Rabat le Manifeste de la renaissance maritime du Maroc, un document strat\u00e9gique qui trace les contours d\u2019une politique maritime int\u00e9gr\u00e9e et ambitieuse. [aujourdhui.ma]\n-------------------------------------------------\nLa ville de Rabat vient d\u2019abriter un \u00e9v\u00e9nement maritime organis\u00e9 par l\u2019Association des Laur\u00e9ats de l\u2019Institut Sup\u00e9rieur d\u2019\u00c9tudes Maritimes (ISEM ALUMNI), d\u00e9di\u00e9 au lancement du Manifeste de la Renaissance Maritime du Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le pr\u00e9sident de la Commission\nde l\u0027UA a mis en...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Commission de l\u0027UA a mis en avant l\u2019engagement ind\u00e9fectible du Maroc en faveur de l\u2019int\u00e9gration africaine et de la transformation \u00e9conomique. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc c\u00e9l\u00e8bre ses 70 ans d\u2019ind\u00e9pendance en consolidant son r\u00f4le dans la paix, le d\u00e9veloppement et la coop\u00e9ration en Afrique, un r\u00f4le pleinement reconnu par l\u2019Union africaine, qui voit en lui un partenaire cl\u00e9 pour le continent. [maroc-diplomatique.net]\n-------------------------------------------------\nLe pr\u00e9sident de la Commission de l\u2019Union Africaine, Mahmoud Ali Youssouf, a salu\u00e9, mardi, le r\u00f4le actif du Maroc et ses contributions continues au sein de l\u2019Union, notamment en faveur de la promotion de la paix, du d\u00e9veloppement et de la coop\u00e9ration r\u00e9gionale. [www.lereporter.ma]\n-------------------------------------------------\nLe r\u00f4le actif du Maroc au sein de l\u2019Union africaine (UA) dans la promotion de la paix, du d\u00e9veloppement et de la coop\u00e9ration r\u00e9gionale a \u00e9t\u00e9 mis en avant, mardi \u00e0 Addis-Abeba, par plusieurs responsables de l\u2019organisation panafricaine, \u00e0 l\u2019occasion notamment de la c\u00e9l\u00e9bration du 70e anniversaire de la F\u00eate de l\u2019ind\u00e9pendance du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Jameel Motors, acteur majeur des\nsolutions de mobilit\u00e9 et partenaire...", "mass": 5, "physics": false, "shape": "box", "title": "Jameel Motors, acteur majeur des solutions de mobilit\u00e9 et partenaire privil\u00e9gi\u00e9 des plus grandes marques automobiles, a \u00e9t\u00e9 d\u00e9sign\u00e9 distributeur officiel de Jiangling Motors Corporation (JMC) au Maroc, constructeur chinois sp\u00e9cialis\u00e9 dans les v\u00e9hicules utilitaires l\u00e9gers. [leseco.ma]\n-------------------------------------------------\nJameel Motors poursuit l\u2019\u00e9largissement de son portefeuille au Maroc avec la signature d\u2019un accord de distribution exclusif avec Jiangling Motors Corporation (JMC), constructeur chinois sp\u00e9cialis\u00e9 dans les v\u00e9hicules utilitaires l\u00e9gers. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
