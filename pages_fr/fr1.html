abilit\u00e9 Soci\u00e9tale des Entreprises (RSE), le Label RSE \u00e0 Red Med Private Equity et l\u2019a renouvel\u00e9 \u00e0 l\u2019entreprise HPS. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Une convention de partenariat a\n\u00e9t\u00e9 sign\u00e9e, lundi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention de partenariat a \u00e9t\u00e9 sign\u00e9e, lundi \u00e0 Rabat, pour la mise en \u0153uvre du programme de renforcement des effectifs des doctorants-moniteurs dans les domaines de la transition \u00e9nerg\u00e9tique et du d\u00e9veloppement durable \u00e0 l\u0027horizon 2028. [www.lopinion.ma]\n-------------------------------------------------\nCette convention vise \u00e0 encourager les meilleurs \u00e9tudiants titulaires d\u0027un master \u00e0 poursuivre leurs \u00e9tudes en doctorat gr\u00e2ce \u00e0 l\u0027octroi de 50 bourses mensuelles pendant trois ans, afin de mener des recherches dans les domaines de la transition \u00e9nerg\u00e9tique et du d\u00e9veloppement durable. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Maroc dispose \u00e0 l\u0027\u00e9chelle\nnationale de 1.311 \u00e9tablissements de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc dispose \u00e0 l\u0027\u00e9chelle nationale de 1.311 \u00e9tablissements de protection sociale dot\u00e9s d\u0027une capacit\u00e9 d\u0027accueil d\u0027environ 115.000 personnes, a annonc\u00e9, lundi, la ministre de la Solidarit\u00e9, de l\u0027Int\u00e9gration sociale et de la Famille, Na\u00efma Ben Yahia. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc dispose de 1.311 \u00e9tablissements de protection sociale r\u00e9partis sur l\u2019ensemble du territoire national, offrant une capacit\u00e9 d\u2019accueil d\u2019environ 115.000 personnes, a indiqu\u00e9 lundi la ministre de la Solidarit\u00e9, de l\u2019Int\u00e9gration sociale et de la Famille, Na\u00efma Ben Yahia. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u0027\u00e9tranger, M. Nasser Bourita, a re\u00e7u, lundi \u00e0 Rabat, une d\u00e9l\u00e9gation de l\u0027intergroupe parlementaire italien de \"Soutien \u00e0 l\u0027initiative d\u0027Autonomie au Sahara\", en visite de travail dans le Royaume jusqu\u0027au 28 octobre. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a re\u00e7u, lundi \u00e0 Rabat, une d\u00e9l\u00e9gation de l\u2019intergroupe parlementaire italien de \u00ab Soutien \u00e0 l\u2019initiative d\u2019Autonomie au Sahara \u00bb, en visite de travail dans le Royaume jusqu\u2019au 28 octobre. [atlasinfo.fr]\n-------------------------------------------------\nLe pr\u00e9sident de la Chambre des repr\u00e9sentants, Rachid Talbi Alami, s\u2019est entretenu, lundi \u00e0 Rabat, avec une d\u00e9l\u00e9gation des deux Chambres du Parlement italien, dont des membres de l\u2019intergroupe parlementaire italien de \u201cSoutien \u00e0 l\u2019initiative d\u2019Autonomie au Sahara\u201d, en visite de travail dans le Royaume jusqu\u2019au 28 octobre. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a re\u00e7u, lundi \u00e0 Rabat, une d\u00e9l\u00e9gation de l\u2019intergroupe parlementaire italien de soutien \u00e0 l\u2019initiative d\u2019autonomie au Sahara, en visite de travail dans le Royaume jusqu\u2019au 28 octobre. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Masen et la Banque mondiale\nont lanc\u00e9, ce lundi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Masen et la Banque mondiale ont lanc\u00e9, ce lundi \u00e0 Rabat, la premi\u00e8re cohorte francophone du programme de formation \u00ab appels d\u2019offres comp\u00e9titifs pour les projets d\u2019\u00e9nergie renouvelable \u00bb. [telquel.ma]\n-------------------------------------------------\nMasen et la Banque mondiale (via les initiatives ESMAP-SRMI et PPIAF), en partenariat avec la Banque africaine de d\u00e9veloppement (Desert to Power), GIZ GET.Transform, l\u2019AFD et l\u2019IRENA, ont lanc\u00e9 \u00e0 Rabat la premi\u00e8re cohorte francophone du programme de formation \u00ab Appels d\u2019offres comp\u00e9titifs pour les projets d\u2019\u00e9nergie renouvelable \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Un total de 257 nouveaux\nautobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Un total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi au port de Casablanca, dans le cadre de la mise en \u0153uvre du nouveau Programme pour le transport public urbain par autobus (2025-2029). [telquel.ma]\n-------------------------------------------------\nUn total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s lundi au Port de Casablanca, dans le cadre de la premi\u00e8re phase du Programme national pour le transport public urbain par autobus (2025-2029). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le pr\u00e9sident Paul Biya, 92\nans et au pouvoir depuis...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour un huiti\u00e8me mandat au Cameroun avec 53,66% des suffrages, selon les r\u00e9sultats officiels proclam\u00e9s par le Conseil constitutionnel lundi. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu sans surprise avec 53,66% des voix, selon les r\u00e9sultats officiels publi\u00e9s lundi, aussit\u00f4t contest\u00e9s par son principal adversaire Issa Tchiroma Bakary qui a d\u00e9nonc\u00e9 une \u00ab mascarade \u00bb. [www.lereporter.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya a \u00e9t\u00e9 r\u00e9\u00e9lu pour un huiti\u00e8me mandat cons\u00e9cutif \u00e0 la t\u00eate du pays, avec 53,66 % des suffrages exprim\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La s\u00e9lection nationale f\u00e9minine de\nfootball des moins de 17...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection nationale f\u00e9minine de football des moins de 17 ans affrontera, mardi prochain, son homologue nord-cor\u00e9enne en huiti\u00e8mes de finale de la Coupe du Monde F\u00e9minine U17, organis\u00e9e au Maroc. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale f\u00e9minine des moins de 17 ans s\u2019appr\u00eate \u00e0 disputer, mardi \u00e0 20H (heure marocaine), un duel d\u00e9cisif face \u00e0 la coriace s\u00e9lection nord-cor\u00e9enne en huiti\u00e8mes de finale de la Coupe du monde U17, organis\u00e9e au Maroc jusqu\u2019au 8 novembre. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "El Mahjoub Dazza s\u2019est adjug\u00e9\nle titre apr\u00e8s avoir parcouru...", "mass": 5, "physics": false, "shape": "box", "title": "El Mahjoub Dazza s\u2019est adjug\u00e9 le titre apr\u00e8s avoir parcouru la distance de 42,195 km en 2h 09min 43sec, devan\u00e7ant son compatriote Omar Ait Chitachen, auteur d\u2019un. [telquel.ma]\n-------------------------------------------------\nLe coureur marocain El Mahjoub Dazza a remport\u00e9, dimanche, la 16\u1d49 \u00e9dition du Marathon International de Casablanca, marqu\u00e9e par la participation de plus de 10.000 coureurs et coureuses. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Equatorial Coca-Cola Bottling Company (ECCBC)\nMaroc a inaugur\u00e9 aujourd\u2019hui, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Equatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9 aujourd\u2019hui, lundi 27 octobre ses nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle [www.challenge.ma]\n-------------------------------------------------\nCet investissement strat\u00e9gique de 715 millions de dirhams (MDH) dans l\u0027usine de Cobomi-Casablanca s\u0027inscrit dans le cadre d\u0027un plan d\u2019investissement global de Equatorial Coca-Cola Bottling Company au Maroc de pr\u00e8s de 3,2 milliards de dirhams (MMDH) mis en \u0153uvre entre 2020 et 2025. [www.lavieeco.com]\n-------------------------------------------------\nEquatorial Coca-Cola Bottling Company (ECCBC) Maroc a inaugur\u00e9, lundi 27 octobre, de nouvelles lignes de production au sein de son usine COBOMI, situ\u00e9e dans la zone industrielle Technopole Mohammed V \u00e0 Nouaceur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "Du 30 octobre au 2\nnovembre 2025, Essaouira f\u00eatera les...", "mass": 5, "physics": false, "shape": "box", "title": "Du 30 octobre au 2 novembre 2025, Essaouira f\u00eatera les 20 ans de son mythique Festival des Andalousies Atlantiques. [www.challenge.ma]\n-------------------------------------------------\nCet \u00e9v\u00e9nement r\u00e9unira des artistes venus des quatre coins du monde, chacun porteur d\u2019un h\u00e9ritage unique, pour c\u00e9l\u00e9brer la richesse de la musique andalouse et de ses influences. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement proposera une vingtaine de concerts r\u00e9unissant artistes marocains et internationaux autour du patrimoine musical andalou, jud\u00e9o-musulman et flamenco. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Inauguration : Le Boeing 767-400\nde Delta Air Lines s\u2019est...", "mass": 5, "physics": false, "shape": "box", "title": "Inauguration : Le Boeing 767-400 de Delta Air Lines s\u2019est pos\u00e9 dimanche 26 octobre 2025 \u00e0 Marrakech, marquant l\u2019ouverture officielle de la premi\u00e8re ligne directe reliant la m\u00e9tropole marocaine \u00e0 la ville d\u2019Atlanta. [aujourdhui.ma]\n-------------------------------------------------\nLe Boeing 767-400 de Delta Air Lines s\u2019est pos\u00e9 ce dimanche 26 octobre 2025 \u00e0 Marrakech, marquant l\u2019ouverture officielle de la premi\u00e8re ligne directe reliant la m\u00e9tropole marocaine \u00e0 la ville d\u2019Atlanta. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le Royaume a pr\u00e9sid\u00e9 cette\nr\u00e9union en sa qualit\u00e9 de...", "mass": 5, "physics"         word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        z-index: 10001;
    }

    @media (hover: hover) and (pointer: fine) {
        #info-icon:hover + #tooltip {
            display: block;
        }
    }
</style>

<div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 28/10/2025 à 12h28, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
