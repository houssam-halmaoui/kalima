. [lematin.ma]\n-------------------------------------------------\nL\u2019Alliance fran\u00e7aise de La\u00e2youne, un espace d\u00e9di\u00e9 \u00e0 l\u2019apprentissage de la langue fran\u00e7aise, aux \u00e9changes culturels et \u00e0 la promotion de la cr\u00e9ation artistique, a \u00e9t\u00e9 inaugur\u00e9e, mercredi, en pr\u00e9sence de l\u2019ambassadeur de France au Maroc, Philippe Lalliot. [telquel.ma]\n-------------------------------------------------\nL\u2019ambassadeur de France au Maroc, Philippe Lalliot, a effectu\u00e9 ce mercredi son premier d\u00e9placement officiel \u00e0 La\u00e2youne, \u00e0 l\u2019occasion de l\u2019inauguration de la nouvelle Alliance fran\u00e7aise dans la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Chapter Maroc des Alumni\nde l\u0027ESSEC Business School a...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chapter Maroc des Alumni de l\u0027ESSEC Business School a officialis\u00e9 la passation de pr\u00e9sidence entre Nizar Abdellaoui Maane et Youssef Ousbane, \u00e0 l\u0027occasion d\u0027une soir. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u0027occasion d\u0027une soir\u00e9e d\u0027\u00e9t\u00e9 organis\u00e9e \u00e0 la Maison des Alumni, ESSEC Alumni Chapter Morocco a c\u00e9l\u00e9br\u00e9 la passation de bureau entre Nizar Abdellaoui Maane, pr\u00e9sident sortant, et Youssef Ousbane, nouveau pr\u00e9sident du Chapter Morocco. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Port\u00e9 par l\u0027expansion de l\u0027activit\u00e9\nindustrielle, la solide performance du...", "mass": 5, "physics": false, "shape": "box", "title": "Port\u00e9 par l\u0027expansion de l\u0027activit\u00e9 industrielle, la solide performance du tourisme, la r\u00e9silience de la demande des consommateurs et la poursuite des investissements, le M. [lematin.ma]\n-------------------------------------------------\nStandard Chartered anticipe une croissance du PIB du Maroc de 4,5% en 2026, port\u00e9e par l\u2019expansion de l\u2019activit\u00e9 industrielle, la solide performance du tourisme, la r\u00e9silience de la demande des consommateurs et la poursuite des investissements, selon un communiqu\u00e9 publi\u00e9 le 30 juin 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Centrale Danone a inaugur\u00e9, mercredi\n\u00e0 Fkih Ben Salah, son...", "mass": 5, "physics": false, "shape": "box", "title": "Centrale Danone a inaugur\u00e9, mercredi \u00e0 Fkih Ben Salah, son nouveau proc\u00e9d\u00e9 industriel Milk-Co, une innovation technologique destin\u00e9e \u00e0 optimiser la valorisation du lait collect\u00e9 lo. [lematin.ma]\n-------------------------------------------------\nAvec Milk-Co, Centrale Danone introduit au Maroc un proc\u00e9d\u00e9 industriel innovant permettant de valoriser davantage le lait collect\u00e9 localement, de soutenir l\u2019amont laitier national et de renforcer la souverainet\u00e9 industrielle du Royaume. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Conseil d\u2019administration du Groupe\nde la Banque mondiale a...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019administration du Groupe de la Banque mondiale a approuv\u00e9, le 1er juillet 2026, un financement de 265 millions de dollars (environ 2,4 milliards de dirhams) pour le projet de station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, dans le nord du Maroc. [telquel.ma]\n-------------------------------------------------\nCet investissement dans les infrastructures d\u2019\u00e9nergie propre, l\u2019un des plus importants en Afrique, permettra de renforcer la fiabilit\u00e9 et la r\u00e9silience du syst\u00e8me \u00e9lectrique maroca. [lematin.ma]\n-------------------------------------------------\nCet investissement vise \u00e0 renforcer les infrastructures d\u00e9nergie verte dans le nord du pays, \u00e0 travers un projet qui constitue lun des plus importants dispositifs de stockage d\u2019\u00e9nergie en Afrique. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9, mercredi, un financement de 265 millions de dollars pour la Station de transfert d\u0027\u00e9nergie par pompage (STEP) d\u0027Ifahsa, pr\u00e8s de Chefchaouen, l\u0027un des plus importants investissements en \u00e9nergie propre en Afrique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le flux net des investissements\ndirects \u00e9tranger (IDE) a atteint...", "mass": 5, "physics": false, "shape": "box", "title": "Le flux net des investissements directs \u00e9tranger (IDE) a atteint 23,32 milliards de dirhams (MMDH) \u00e0 fin mai, en progression de 41,8% par rapport \u00e0 une ann\u00e9e auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLe flux net des investissements directs \u00e9tranger (IDE) a atteint 23,32 milliards de dirhams (MMDH) \u00e0 fin mai, en progression de 41,8% par rapport \u00e0 une ann\u00e9e auparavant, selon lOffice des changes. [www.yabiladi.com]\n-------------------------------------------------\nLe flux net des investissements directs \u00e9trangers (IDE) a atteint 23,32 milliards de dirhams \u00e0 fin mai, en progression de 41,8% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u0027Office des changes. [www.lavieeco.com]\n-------------------------------------------------\nLe flux net des investissements directs \u00e9tranger (IDE) a atteint 23,32 milliards de dirhams (MMDH) \u00e0 fin mai, en progression de 41,8% par rapport \u00e0 une ann\u00e9e auparavant, selon l\u0027Office des changes. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Les transferts de fonds effectu\u00e9s\npar les Marocains r\u00e9sidant \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Les transferts de fonds effectu\u00e9s par les Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE) ont atteint plus de 50,22 milliards de dirhams (MMDH) \u00e0 fin mai 2026, contre 46,16 MMDH \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLes transferts de fonds effectu\u00e9s par les Marocains r\u00e9sidant \u00e0 l\u00e9tranger (MRE) ont atteint plus de 50,22 milliards de dirhams (MMDH) \u00e0 fin mai 2026, contre 46,16 MMDH \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon lOffice des changes. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Office des changes a r\u00e9v\u00e9l\u00e9 que les transferts de fonds effectu\u00e9s par les Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE) ont atteint plus de 50,22 milliards de dirhams (MMDH) \u00e0 fin mai 2026, contre 46,16 MMDH \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le s\u00e9lectionneur du Canada, Jesse\nMarsch, a qualifi\u00e9 le duel...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur du Canada, Jesse Marsch, a qualifi\u00e9 le duel avec le Maroc en huiti\u00e8mes de finale de la Coupe du monde 2026 de \u00abcauchemar sanglant et horrible\u00bb, tout en couvrant d\u2019\u00e9loges les Lions de l\u2019Atlas avant la rencontre pr\u00e9vue samedi \u00e0 Houston. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 l\u0027approche du duel entre le Maroc et le Canada en huiti\u00e8me de finale du Mondial 2026, le s\u00e9lectionneur canadien Jesse Marsch s\u0027attend \u00e0 un d\u00e9fi de taille. [lematin.ma]\n-------------------------------------------------\nQualifi\u00e9 pour la premi\u00e8re fois de son histoire pour les huiti\u00e8mes de finale d\u2019une Coupe du monde, le Canada h\u00e9rite d\u2019un adversaire coriace : le Maroc, demi-finaliste. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Convention La Direction des Archives\nRoyales et l\u2019Universit\u00e9 Mohammed VI...", "mass": 5, "physics": false, "shape": "box", "title": "Convention La Direction des Archives Royales et l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) ont sign\u00e9, r\u00e9cemment \u00e0 Rabat, une convention-cadre de partenariat d\u00e9di\u00e9e \u00e0 la formation, \u00e0 la recherche, \u00e0 la pr\u00e9servation et \u00e0 la valorisation du patrimoine documentaire national. [aujourdhui.ma]\n-------------------------------------------------\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La Direction des Archives Royales et l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) ont sign\u00e9 une convention-cadre pour renforcer la pr\u00e9servation, la num\u00e9risation et la valorisation du patrimoine documentaire marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Banque europ\u00e9enne d\u0027investissement (BEI)\na r\u00e9it\u00e9r\u00e9 son soutien au...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque europ\u00e9enne d\u0027investissement (BEI) a r\u00e9it\u00e9r\u00e9 son soutien au Maroc, confirmant sa volont\u00e9 de poursuivre son accompagnement des projets de d\u00e9veloppement \u00e9conomique, social et d\u0027infrastructures du Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u2019investissement (BEI) poursuivra son accompagnement du Maroc dans sa trajectoire de croissance, de prosp\u00e9rit\u00e9 et de d\u00e9veloppement social, a affirm\u00e9, mercredi \u00e0 Rabat, sa pr\u00e9sidente, Nadia Calvi\u00f1o. [www.lereporter.ma]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u2019investissement (BEI) poursuivra son accompagnement du Maroc dans sa trajectoire de croissance, de prosp\u00e9rit\u00e9 et de d\u00e9veloppement social, a affirm\u00e9, mercredi \u00e0 Rabat, sa pr\u00e9sidente, Nadia Calvi\u00f1o. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du\nBudget et pr\u00e9sident de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget et pr\u00e9sident de la F\u00e9d\u00e9ration Royale Marocaine de Football, Fouzi Lekjaa, a soulign\u00e9 que les performances de l\u0027\u00e9quipe nationale illustrent la politique men\u00e9e sous l\u0027impulsion de Sa Majest\u00e9 le Roi Mohammed VI en faveur de la jeunesse. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc, sous l\u2019impulsion de Sa Majest\u00e9 le Roi Mohammed VI, a montr\u00e9 au monde entier que la jeunesse est capable d\u2019assumer un r\u00f4le de leadership et de servir de mod\u00e8le d\u00e8s lors que les conditions de r\u00e9ussite lui sont offertes, a affirm\u00e9, mercredi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Alors que Bruxelles pr\u00e9pare sa\nloi sur l\u2019acc\u00e9l\u00e9ration industrielle (Industrial...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que Bruxelles pr\u00e9pare sa loi sur l\u2019acc\u00e9l\u00e9ration industrielle (Industrial Accelerator Act), les constructeurs automobiles europ\u00e9ens r\u00e9clament un traitement de faveur pour leurs usines marocaines et turques. [leseco.ma]\n-------------------------------------------------\nAlors que Bruxelles pr\u00e9pare son Industrial Accelerator Act pour relocaliser une partie de la production industrielle, les constructeurs automobiles europ\u00e9ens mettent en garde contre un effet pervers : affaiblir des cha\u00eenes de valeur d\u00e9j\u00e0 int\u00e9gr\u00e9es. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Royal Air Maroc (RAM) a\nannonc\u00e9, ce mercredi, le renforcement...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc (RAM) a annonc\u00e9, ce mercredi, le renforcement de son dispositif exceptionnel de transport a\u00e9rien \u00e0 destination de Houston (Texas), \u00e0 la suite de la qualification de l\u0027\u00c9quipe nationale de football pour les huiti\u00e8mes de finale de la Coupe du monde 2026. [leseco.ma]\n-------------------------------------------------\nMondial 2026: Royal Air Maroc d\u00e9ploie 12 vols directs entre Casablanca et Houston pour soutenir les Lions de l\u2019Atlas. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les atouts du Royaume en\ntant que destination d\u2019investissement prometteuse...", "mass": 5, "physics": false, "shape": "box", "title": "Les atouts du Royaume en tant que destination d\u2019investissement prometteuse ont \u00e9t\u00e9 mis en avant mercredi \u00e0 Paris, lors de la Journ\u00e9e \u00e9conomique France-Maroc. [atlasinfo.fr]\n-------------------------------------------------\nLes atouts du Royaume en tant que destination d\u2019investissement \u00e0 fort potentiel ont \u00e9t\u00e9 mis en exergue, mercredi \u00e0 Paris, lors de la Journ\u00e9e \u00e9conomique France-Maroc, une rencontre de haut niveau destin\u00e9e \u00e0 promouvoir les opportunit\u00e9s d\u2019affaires, \u00e0 encourager les investissements crois\u00e9s et \u00e0 ouvrir de nouvelles perspectives de coop\u00e9ration \u00e9conomique entre Rabat et Paris. [www.lereporter.ma]\n-------------------------------------------------\nLa Chambre de Commerce et d\u2019Industrie (CCI) Paris Ile-de-France et l\u2019Ambassade du Royaume en France ont coorganis\u00e9, mercredi 1er juillet, la Journ\u00e9e \u00e9conomique France-Maroc, au cours de laquelle [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Conseil de gouvernement a\napprouv\u00e9 le projet de loi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a approuv\u00e9 le projet de loi n\u00b0 46.26 relatif au syst\u00e8me statistique national, pr\u00e9sent\u00e9 par le ministre de l\u0027Int\u00e9rieur.S\u0027inscrivant dans le cadre. [lematin.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de l\u2019Int\u00e9rieur, ce projet de loi qui s\u2019inscrit dans le cadre du suivi des hautes orientations royales, vise essentiellement \u00e0 mettre en place. [telquel.ma]\n-------------------------------------------------\nCe projet de loi vise essentiellement \u00e0 mettre en place un nouveau cadre juridique concernant le Syst\u00e8me statistique national, en d\u00e9terminant ses composantes et missions, ainsi que ses r\u00e8gles d\u2019organisation et les principes fondamentaux des statistiques officielles. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Conseil de gouvernement a\nadopt\u00e9, jeudi \u00e0 Rabat, le...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9, jeudi \u00e0 Rabat, le projet de loi N\u00b0 051.26 relatif \u00e0 l\u2019organisation de la profession d\u2019adoul, pr\u00e9sent\u00e9 par le ministre de la Justice. [telquel.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de la Justice, ce texte vise \u00e0 tirer les cons\u00e9quences juridiques de la d\u00e9cision de la Cour constitutionnelle concernant la loi n\u00b0 16.22 sur la m\u00eame profession, conform\u00e9ment \u00e0 l\u0027article 134 de la Constitution. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du\np\u00f4le DGSN-DGST, a re\u00e7u le...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral du p\u00f4le DGSN-DGST, a re\u00e7u le g\u00e9n\u00e9ral de division Luis Pelaez Pi\u00f1eiro, chef de la Commission du renseignement de la Garde civile espagnole, \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation de haut niveau en visite de travail au Royaume du Maroc. [telquel.ma]\n-------------------------------------------------\nJeudi, \u00e0 Rabat, Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, a accueilli une d\u00e9l\u00e9gation de haut niveau de la Garde civile espagnole, dirig\u00e9e par le g\u00e9n\u00e9ral de division Luis Pel\u00e1ez Pi\u00f1eiro, chef de la Direction du renseignement. [www.yabiladi.com]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
