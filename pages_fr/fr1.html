cad\u00e9mie Mohammed VI de football \u00e0 Sal\u00e9- Terrain n\u00b03) Etats-Unis-Pays-bas (Acad\u00e9mie Mohammed VI de football \u00e0 Sal\u00e9- Terrain n\u00b01) (20h): Maroc-Cor\u00e9e du Nord (stade olympique . [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection nationale f\u00e9minine de football des moins de 17 ans affrontera, mardi prochain, son homologue nord-cor\u00e9enne en huiti\u00e8mes de finale de la Coupe du Monde F\u00e9minine U17, organis\u00e9e au Maroc. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Biya, investi par le Rassemblement\nd\u00e9mocratique du Peuple camerounais (RDPC),...", "mass": 5, "physics": false, "shape": "box", "title": "Biya, investi par le Rassemblement d\u00e9mocratique du Peuple camerounais (RDPC), a devanc\u00e9 le candidat Issa Tchiroma Bakary, arriv\u00e9 deuxi\u00e8me avec 35,19% des voix, suivi de Cabral Libii (3,41%), . [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour un huiti\u00e8me mandat au Cameroun avec 53,66% des suffrages, selon les r\u00e9sultats officiels proclam\u00e9s par le Conseil constitutionnel lundi. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya, 92 ans et au pouvoir depuis 1982, a \u00e9t\u00e9 r\u00e9\u00e9lu sans surprise avec 53,66% des voix, selon les r\u00e9sultats officiels publi\u00e9s lundi, aussit\u00f4t contest\u00e9s par son principal adversaire Issa Tchiroma Bakary qui a d\u00e9nonc\u00e9 une \u00ab mascarade \u00bb. [www.lereporter.ma]\n-------------------------------------------------\nLe pr\u00e9sident camerounais Paul Biya a \u00e9t\u00e9 r\u00e9\u00e9lu pour un huiti\u00e8me mandat cons\u00e9cutif \u00e0 la t\u00eate du pays, avec 53,66 % des suffrages exprim\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Forum de cl\u00f4ture du\nProgramme statistique panafricain II (PAS...", "mass": 5, "physics": false, "shape": "box", "title": "Le Forum de cl\u00f4ture du Programme statistique panafricain II (PAS II) s\u0027est ouvert, lundi 27 octobre \u00e0 Casablanca, mettant en avant ses principaux r\u00e9sultats et ses renseignement. [lematin.ma]\n-------------------------------------------------\nCe dispositif financ\u00e9 par l\u2019Union europ\u00e9enne, manag\u00e9 par Eurostat et mis en \u0153uvre par Statafric (Commission de l\u2019Union africaine) en partenariat avec Expertise France se veut un programme phare pour la modernisation du syst\u00e8me statistique . [aujourdhui.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement a permis de pr\u00e9senter les principaux r\u00e9sultats du programme, ainsi que les enseignements tir\u00e9s en mati\u00e8re de coop\u00e9ration, d\u2019innovation et de gouvernance statistique sur le continent africain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Plusieurs agglom\u00e9rations b\u00e9n\u00e9ficieront de ce\nnouvel arrivage qui fait partie...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs agglom\u00e9rations b\u00e9n\u00e9ficieront de ce nouvel arrivage qui fait partie de la premi\u00e8re phase de ce programme visant \u00e0 doter l\u0027ensemble des villes du Royaume d\u0027un trans. [lematin.ma]\n-------------------------------------------------\nUn total de 257 nouveaux autobus ont \u00e9t\u00e9 r\u00e9ceptionn\u00e9s, lundi au port de Casablanca, dans le cadre de la mise en \u0153uvre du nouveau Programme pour le transport public urbain par autobus (2025-2029). [telquel.ma]\n-------------------------------------------------\nUn porter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La 7e \u00e9dition de la\nCoupe du monde de football...", "mass": 5, "physics": false, "shape": "box", "title": "La 7e \u00e9dition de la Coupe du monde de football des entreprises (FIFCO World Corporate Champions Cup) s\u2019est conclue en beaut\u00e9, dimanche \u00e0 F\u00e8s, avec la cons\u00e9cration de l\u2019\u00e9quipe maroc. [lematin.ma]\n-------------------------------------------------\nLa 7\u1d49 \u00e9dition de la Coupe du Monde de Football des Entreprises (FIFCO World Corporate Champions Cup) s\u2019est achev\u00e9e dimanche \u00e0 F\u00e8s par la victoire de l\u2019\u00e9quipe marocaine Ventec, qui s\u2019est impos\u00e9e en finale face \u00e0 la formation d\u2019Oman. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019attribution du label RSE vient\ncouronner l\u2019engagement de ces entreprises...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019attribution du label RSE vient couronner l\u2019engagement de ces entreprises en mati\u00e8re de RSE et la prise en compte, dans leur politique, des attentes de leurs parties prenantes int. [lematin.ma]\n-------------------------------------------------\nCe label a pour vocation d\u2019encourager les entreprises marocaines \u00e0 adopter une d\u00e9marche globale en tenant compte des imp\u00e9ratifs \u00e9conomiques, environnementaux et sociaux dans leur strat\u00e9gie manag\u00e9riale [www.lavieeco.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) a attribu\u00e9, \u00e0 l\u2019issue de la r\u00e9union de son Comit\u00e9 d\u2019attribution du Label Responsabilit\u00e9 Soci\u00e9tale des Entreprises (RSE), le Label RSE \u00e0 Red Med Private Equity et l\u2019a renouvel\u0                     window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
