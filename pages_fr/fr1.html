res/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Suite \u00e0 une fin de\nmatch particuli\u00e8rement chaotique, le jury...", "mass": 5, "physics": false, "shape": "box", "title": "Suite \u00e0 une fin de match particuli\u00e8rement chaotique, le jury disciplinaire de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) a rendu un verdict d\u2019une s\u00e9v\u00e9rit\u00e9 exemplaire \u00e0 l\u2019encontre de la F\u00e9d\u00e9ration Alg\u00e9rienne de Football (FAF). [fr.hespress.com]\n-------------------------------------------------\n\u00c9limin\u00e9s apr\u00e8s une d\u00e9faite 2-0, les Fennecs avaient vu la rencontre se conclure dans une atmosph\u00e8re extr\u00eamement tendue, marqu\u00e9e par des \u00e9chauffour\u00e9es et des contestations virulentes. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a inflig\u00e9 des sanctions \u00e0 la F\u00e9d\u00e9ration alg\u00e9rienne de football (FAF), au joueur Luca Zidane et au d\u00e9fenseur Rafik Belghali \u00e0 la suite des d\u00e9bordements survenus apr\u00e8s le quart de finale de la CAN 2025 perdu par l\u2019Alg\u00e9rie face au Nigeria (0-2), le 18 janvier \u00e0 Rabat. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La Direction g\u00e9n\u00e9rale de la\nm\u00e9t\u00e9orologie (DGM) a annonc\u00e9 des...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a annonc\u00e9 des chutes de neige, \u00e0 partir de 1600 m\u00e8tres, de fortes pluies, atteignant 100 millim\u00e8tres, ainsi que des rafales de vent pr\u00e9vues de ce mercredi au samedi prochain dans plusieurs provinces du Royaume. [fr.hespress.com]\n-------------------------------------------------\nDes chutes de neiges comprises entre 15 et 30 centim\u00e8tres sont attendues, mercredi et jeudi, \u00e0 Taza, Guercif, Sefrou, Boulemane et Midelt, a indiqu\u00e9 la DGM dans un bulletin d\u2019alert. [lematin.ma]\n-------------------------------------------------\nDes chutes de neige, \u00e0 partir de 1600 m\u00e8tres, de fortes pluies, atteignant 100 millim\u00e8tres, ainsi que des rafales de vent sont pr\u00e9vues de ce mercredi au samedi prochain dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige, \u00e0 partir de 1600 m\u00e8tres, de fortes pluies, atteignant 100 millim\u00e8tres, ainsi que des rafales de vent sont pr\u00e9vues de ce mercredi au samedi prochain dans plusieurs provinces du Maroc, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) a \u00e9mis un bulletin d\u2019alerte de niveau orange annon\u00e7ant des chutes de neige et de fortes pluies attendues dans plusieurs provinces du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les \u00e9l\u00e9ments de la S\u00fbret\u00e9\nnationale de l\u2019a\u00e9roport de Marrakech-Menara...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00e9l\u00e9ments de la S\u00fbret\u00e9 nationale de l\u2019a\u00e9roport de Marrakech-Menara ont interpel\u00e9, mardi, un ressortissant fran\u00e7ais, soup\u00e7onn\u00e9 d\u2019\u00eatre impliqu\u00e9 dans une affaire de faux et usage de faux, ainsi que de trafic international de drogues et de substances psychotropes. [fr.hespress.com]\n-------------------------------------------------\nLes \u00e9l\u00e9ments de la S\u00fbret\u00  r\u00e9union, 155 magistrats des juridictions financi\u00e8res ont \u00e9galement \u00e9t\u00e9 promus au grade principal cr\u00e9\u00e9 r\u00e9cemment, suite aux Hautes Directives Royales, ce qui t\u00e9moi. [lematin.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a proc\u00e9d\u00e9 \u00e0 la nomination de 24 auditeurs en tant que magistrats de deuxi\u00e8me grade aupr\u00e8s des juridictions financi\u00e8res, \u00e0 la suite de la r\u00e9union du Conseil de la magistrature des juridictions financi\u00e8res du 9 d\u00e9cembre 2025 L\u2019article est apparu en premier sur . [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a bien voulu nommer vingt-quatre (24) auditeurs en qualit\u00e9 de magistrats de deuxi\u00e8me grade aupr\u00e8s des juridictions financi\u00e8res, sur proposition du Conseil de la magistrature des juridictions financi\u00e8res lors de sa r\u00e9union tenue le 9 d\u00e9cembre 2025, indique un communiqu\u00e9 de la Cour des comptes. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Roi Mohammed VI a bien voulu nommer vingt-quatre (24) auditeurs en qualit\u00e9 de magistrats de deuxi\u00e8me grade aupr\u00e8s des juridictions financi\u00e8res, sur proposition du Conseil de la magistrature des juridictions financi\u00e8res lors de sa r\u00e9union tenue le 9 d\u00e9cembre 2025, indique un communiqu\u00e9 de la Cour des comptes. [atlasinfo.fr]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a bien voulu nommer vingt-quatre (24) auditeurs en qualit\u00e9 de magistrats de deuxi\u00e8me grade aupr\u00e8s des juridictions financi\u00e8res, sur proposition du Conseil de la magistrature des juridictions financi\u00e8res lors de sa r\u00e9union tenue le 9 d\u00e9cembre 2025, indique un communiqu\u00e9 de la Cour des comptes. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La province de Nouaceur a\nproc\u00e9d\u00e9, ce mardi, \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La province de Nouaceur a proc\u00e9d\u00e9, ce mardi, \u00e0 la pose de la premi\u00e8re pierre du Resort Bouskoura Park, un projet structurant qui marque une nouvelle \u00e9tape dans le d\u00e9veloppement tou. [lematin.ma]\n-------------------------------------------------\nLa province de Nouaceur a lanc\u00e9 les travaux du Resort Bouskoura Park, un projet structurant de plus de 300 MDH destin\u00e9 \u00e0 renforcer l\u2019attractivit\u00e9 touristique et \u00e9conomique de Bouskoura Ville Verte. [www.lavieeco.com]\n-------------------------------------------------\nLa province de Nouaceur a proc\u00e9d\u00e9, mardi, \u00e0 la pose de la premi\u00e8re pierre du Resort Bouskoura Park, un projet dot\u00e9 d\u0027un investissement global de plus de 300 millions de dirhams et qui devrait g\u00e9n\u00e9rer plus de 500 emplois directs et indirects. [leseco.ma]\n-------------------------------------------------\nLa province de Nouaceur a proc\u00e9d\u00e9, mardi 21 janvier 2026, \u00e0 la pose de la premi\u00e8re pierre du Resort Bouskoura Park, un projet touristique et urbain dot\u00e9 d\u2019un investissement global de plus de 300 millions de dirhams. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Fonds Mohammed VI pour\nl\u0027investissement (FM6I) a lanc\u00e9, mardi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Fonds Mohammed VI pour l\u0027investissement (FM6I) a lanc\u00e9, mardi, un programme d\u00e9di\u00e9 au renforcement des capacit\u00e9s de l\u0027entreprise marocaine. [lematin.ma]\n-------------------------------------------------\nLe Fonds Mohammed VI pour l\u0027Investissement ( ": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019Union europ\u00e9enne (UE) a confirm\u00e9\nson r\u00f4le de partenaire strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union europ\u00e9enne (UE) a confirm\u00e9 son r\u00f4le de partenaire strat\u00e9gique du Maroc en mobilisant 2,48 milliards dirhams (233,42 millions d\u2019euros) d\u2019appuis budg\u00e9taires pour accompagner les grandes r\u00e9formes nationales, [www.challenge.ma]\n-------------------------------------------------\nEn 2025, l\u2019Union europ\u00e9enne a mobilis\u00e9 2,48 milliards dirhams (233,42 millions d\u2019euros), en soutien aux chantiers prioritaires du Maroc, du d\u00e9veloppement humain \u00e0 la transition verte, sans oublier la coh\u00e9sion territoriale et la croissance \u00e9conomique. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00ab Les hypoth\u00e8ses portant sur\nles principaux facteurs d\u2019anticipation de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Les hypoth\u00e8ses portant sur les principaux facteurs d\u2019anticipation de l\u2019activit\u00e9 \u00e9conomique relevant aussi bien de l\u2019environnement interne qu\u2019externe telles que d\u00e9crites pr\u00e9c\u00e9demment permettent d\u2019envisager un net redressement du cycle des affaires avec un taux de croissance . [maroc-diplomatique.net]\n-------------------------------------------------\nL\u0027\u00e9conomie nationale devrait enregistrer une croissance de 5,7% en 2026, selon les pr\u00e9visions du Centre Marocain de Conjoncture (CMC). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Acteur majeur de l\u2019ol\u00e9iculture dans\nla province depuis 2008, Lesieur...", "mass": 5, "physics": false, "shape": "box", "title": "A a suite des violences survenues lors de la finale de la Coupe dAfrique des Nations. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le Chef du gouvernement, Aziz\nAkhannouch, a eu un entretien...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du gouvernement, Aziz Akhannouch, a eu un entretien t\u00e9l\u00e9phonique, mercredi soir, avec son homologue s\u00e9n\u00e9galais, Ousmane Sonko, au cours duquel les deux parties sont convenues de la tenue de la 15e session de la Haute Commission Mixte de partenariat maroco-s\u00e9n\u00e9galaise, comme pr\u00e9vu, les 26 et 27 janvier \u00e0 Rabat. [aujourdhui.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a eu un entretien t\u00e9l\u00e9phonique, mercredi soir, avec son homologue s\u00e9n\u00e9galais, Ousmane Sonko, au cours duquel les deux parties sont convenues de la tenue de la 15e session de la Haute Commission Mixte de partenariat maroco-s\u00e9n\u00e9galaise, comme pr\u00e9vu, les 26 et 27 janvier \u00e0 Rabat. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le renforcement de la coop\u00e9ration\ndans le domaine s\u00e9curitaire a...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement de la coop\u00e9ration dans le domaine s\u00e9curitaire a \u00e9t\u00e9 au centre d\u2019entretiens, tenus mercredi \u00e0 Rabat, entre le Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la surveillance du territoire (DGSN-DGST), Abdellatif Hammouchi, avec les ambassadeurs du Royaume-Uni, du Gabon et de la Malaisie accr\u00e9dit\u00e9s au Maroc. [aujourdhui.ma]\n-------------------------------------------------\nLe renforcement de la coop\u00e9ration s\u00e9curitaire a \u00e9t\u00e9 au c\u0153ur des rencontres tenues \u0         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;

                    communities[groupId].y += node.y;
