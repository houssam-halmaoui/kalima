9exp\u00e9rience client. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le ministre de l\u2019Int\u00e9rieur, Abdelouafi\nLaftit, a adress\u00e9 une circulaire...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a adress\u00e9 une circulaire aux walis des r\u00e9gions ainsi qu\u2019aux gouverneurs des pr\u00e9fectures, provinces et arrondissements afin d\u2019acc\u00e9l\u00e9rer la mise en \u0153uvre des dispositions de la loi 14.25 modifiant la loi 47.06 relative \u00e0 la fiscalit\u00e9 des collectivit\u00e9s territoriales. [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a adress\u00e9 une circulaire aux walis des r\u00e9gions et aux gouverneurs des pr\u00e9fectures, provinces et arrondissements afin d\u2019acc\u00e9l\u00e9rer la mise en \u0153uvre des dispositions de la loi relative aux taxes des collectivit\u00e9s territoriales. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "D\u2019une port\u00e9e scientifique et humaine\nmajeure, cet \u00e9v\u00e9nement s\u2019inscrit en...", "mass": 5, "physics": false, "shape": "box", "title": "D\u2019une port\u00e9e scientifique et humaine majeure, cet \u00e9v\u00e9nement s\u2019inscrit en droite ligne de la vision \u00e9clair\u00e9e de Sa Majest\u00e9 le Roi Mohammed VI, dont l\u2019action ne cesse de promouvoir u. [lematin.ma]\n-------------------------------------------------\nCet \u00e9v\u00e8nement a \u00e9t\u00e9 marqu\u00e9 par a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u0027une convention portant sur le renforcement de la coop\u00e9ration entre la Fondation Lalla Asmaa et la Fondation Mohammed VI des Sciences et de la Sant\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, a pr\u00e9sid\u00e9, vendredi \u00e0 l\u2019Universit\u00e9 Mohammed VI des Sciences et de la Sant\u00e9 \u00e0 Rabat, la c\u00e9r\u00e9monie d\u2019ouverture du 1er Congr\u00e8s africain sur l\u2019implantation cochl\u00e9aire de l\u2019enfant, un rendez-vous majeur dans la structuration d\u2019un v\u00e9ritable hub africain consacr\u00e9 \u00e0 la surdit\u00e9 infantile [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec\nles cinq centrales syndicales repr\u00e9sent\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec les cinq centrales syndicales repr\u00e9sent\u00e9es au sein de Marsa Maroc, \u00e0 savoir l\u2019UMT, l\u2019ODT, la CDT, la FDT et l\u2019UGTM. [lematin.ma]\n-------------------------------------------------\nL\u2019accord a \u00e9t\u00e9 obtenu apr\u00e8s plusieurs rounds de n\u00e9gociation men\u00e9s dans un esprit de transparence, d\u2019\u00e9coute mutuelle et de responsabilit\u00e9 partag\u00e9e. [telquel.ma]\n-------------------------------------------------\nMarsa Maroc et les syndicats repr\u00e9sentant le personnel, UMT, ODT, CDT, FDT et UGTM, ont scell\u00e9 un accord social valable pour cinq ans, jusqu\u2019\u00e0 la fin de l\u2019ann\u00e9e 2030. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019ouverture de StartGate Rabat marque\nune nouvelle \u00e9tape dans le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ouverture de StartGate Rabat marque une nouvelle \u00e9tape dans le d\u00e9ploiement du dispositif entrepreneurial de l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P). [lematin.ma]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) a inaugur\u00e9, jeudi 11 d\u00e9cembre, StartGate Rabat, un nouveau Startup campus d\u00e9di\u00e9 aux startups et au venture building, en extension aux activit\u00e9s de [www.challenge.ma]\n-------------------------------------------------\nCe site vient compl\u00e9ter le StartGate de Benguerir, lanc\u00e9 il y a cinq ans, et renforce ainsi la volont\u00e9 de lUM6P de placer lentrepreneuriat au c\u0153ur du d\u00e9veloppement \u00e9conomique du Maroc et des ambitions africaines. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique a inaugur\u00e9, jeudi \u00e0 Rabat, \"StatGate Rabat\", un nouveau Startup campus d\u00e9di\u00e9 aux startups et au venture building, en extension aux activit\u00e9s de StartGate de Benguerir, lanc\u00e9 il y a cinq ans. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "R\u00e9unis \u00e0 Marrakech pour la\ndeuxi\u00e8me \u00e9dition du Forum d\u2019Affaires...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unis \u00e0 Marrakech pour la deuxi\u00e8me \u00e9dition du Forum d\u2019Affaires de la Zone de Libre-\u00c9change Continentale Africaine (ZLECAf), les acteurs \u00e9conomiques du continent ont d\u00e9battu, ce je. [lematin.ma]\n-------------------------------------------------\nMehdi Tazi, vice-pr\u00e9sident G\u00e9n\u00e9ral de la CGEM, a repr\u00e9sent\u00e9 le patronat marocain \u00e0 la deuxi\u00e8me \u00e9dition du Forum d\u2019Affaires de la Zone de Libre-\u00c9change Continentale Africaine (ZLECAf), qui [www.challenge.ma]\n-------------------------------------------------\nLors de son intervention \u00e0 la deuxi\u00e8me \u00e9dition du Forum d\u2019Affaires de la ZLECAF, le Vice-Pr\u00e9sident G\u00e9n\u00e9ral de la CGEM a mis l\u2019accent sur plusieurs leviers prioritaires pour acc\u00e9l\u00e9rer la mise en \u0153uvre effective du march\u00e9 continental. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc et la Banque\neurop\u00e9enne pour la reconstruction et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u0027euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \"Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III\". [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (1.5 milliards de dirhams), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [telquel.ma]\n-------------------------------------------------\nCe nouveau financement contribuera \u00e0 la construction dun r\u00e9seau de distribution pour irriguer 20 000 hectares sur la plaine du Sa\u00efss, portant le co\u00fbt total du projet \u00e0 252 millions deuros (environ 2,8 milliards de MAD), apr\u00e8s les phases pr\u00e9c\u00e9dentes financ\u00e9es en 2017 et 2020. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "ojets de d\u00e9cret fixant la\ndate du d\u00e9but effectif de...", "mass": 5, "physics": false, "shape": "box", "title": "ojets de d\u00e9cret fixant la date du d\u00e9but effectif de l\u2019exercice des comp\u00e9tences des Groupements sanitaires territoriaux (GST) dans les diff\u00e9rentes r\u00e9gions du Royaume. [www.lopinion.ma]\n-------------------------------------------------\nCes onze projets de d\u00e9cret, pr\u00e9sent\u00e9s par le ministre de la sant\u00e9, fixent la date du d\u00e9but effectif de l\u2019exercice des comp\u00e9tences des Groupements sanitaires territoriaux (GST) dans les diff\u00e9rentes r\u00e9gions du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Les ministres et hauts responsables\ngouvernementaux africains en charge du...", "mass": 5, "physics": false, "shape": "box", "title": "Les ministres et hauts responsables gouvernementaux africains en charge du commerce ont tenu, jeudi \u00e0 Marrakech, une r\u00e9union de coordination visant \u00e0 consolider la position africaine sur les principaux sujets qui seront \u00e0 l\u2019ordre du jour de la 14\u00e8 conf\u00e9rence minist\u00e9rielle de l\u2019Organisation mondiale du commerce (OMC), pr\u00e9vue en mars 2026 \u00e0 Yaound\u00e9 au Cameroun. [www.lopinion.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9, l\u2019objectif a \u00e9t\u00e9 de \u00abconsolider la position africaine sur les principaux sujets qui seront \u00e0 l\u2019ordre du jour de la 14eme conf\u00e9rence minist\u00e9rielle de l\u2019OMC, qui se tiendra en mars 2026 \u00e0 Yaound\u00e9 au Cameroun, et ancrer la coordination et le travail collectif au sein du Groupe africain\u00bb. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande\ndu Roadshow \u00ab Morocco Now...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande du Roadshow \u00ab Morocco Now \u00bb, des responsables institutionnels et \u00e9conomiques marocains et allemands se sont r\u00e9unis \u00e0 Stuttgart pour mettre en lumi\u00e8re les fondements et les perspectives du partenariat strat\u00e9gique entre les deux pays. [telquel.ma]\n-------------------------------------------------\nPlusieurs institutionnels et op\u00e9rateurs \u00e9conomiques, allemands et marocains, ont pris part, jeudi soir \u00e0 Stuttgart, dans le Bade-Wurtemberg (sud-ouest), \u00e0 la conf\u00e9rence organis\u00e9e dans le cadre de l\u2019\u00e9tape Allemagne du Roadshow \u201cMorocco Now\u201d, destin\u00e9e \u00e0 promouvoir les atouts comp\u00e9titifs du Maroc, son offre industrielle et les perspectives d\u2019investissement que le Royaume propose dans plusieurs secteurs strat\u00e9giques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Des chutes de neige \u00e0\npartir de 1.700 m\u00e8tres ainsi...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1 400 m et de fortes pluies parfois orageuses sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-----------------------------     }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
