u00c9quipement et de l\u2019Eau, Nizar Baraka, a annonc\u00e9 avoir lanc\u00e9 une \u00e9tude pour la mise en place d\u2019un nouveau syst\u00e8me de protection de la ville contre les inondations pour \u00e9viter que le drame que la ville a connu ces derniers jours, ne se r\u00e9p\u00e8te pas. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 la suite des inondations exceptionnelles qui ont ravag\u00e9 la ville de Safi, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a annonc\u00e9 lundi, depuis l\u2019H\u00e9micycle, le lancement d\u2019une \u00e9tude visant la mise en place d\u2019un nouveau dispositif de protection contre les inondations, dans l\u2019objectif d\u2019\u00e9viter la r\u00e9p\u00e9tition d\u2019un tel drame. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre de l\u0027\u00c9quipement et de l\u0027Eau, Nizar Baraka, a annonc\u00e9 \u00e0 la Chambre des repr\u00e9sentants le lancement d\u0027une \u00e9tude visant \u00e0 identifier les moyens \u00e0 m\u00eame d\u2019\u00e9viter la r\u00e9p\u00e9tition de tels \u00e9v\u00e9nements, ainsi que la mise en place des mesures pr\u00e9ventives n\u00e9cessaires pour traiter cette probl\u00e9matique, en plus de la r\u00e9alisation d\u2019ouvrages suppl\u00e9mentaires de protection contre les inondations \u00e0 Safi. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Men\u00e9e une grande partie de\nla rencontre, la s\u00e9lection \u00e9gyptien...", "mass": 5, "physics": false, "shape": "box", "title": "Men\u00e9e une grande partie de la rencontre, la s\u00e9lection \u00e9gyptien a pu compter sur sa star Mohamed Salah pour renverser la situation face au Zimbabwe (2-1), ce lundi soir au Stade Adrar d\u2019Agadir, dans la deuxi\u00e8me rencontre du groupe B de la Coupe d\u2019Afrique des nation 2025 (CAN 2025) qui se d\u00e9roule au Maroc. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection \u00e9gyptienne de football s\u2019est impos\u00e9e face \u00e0 son homologue zimbabw\u00e9enne sur le score de 2 buts \u00e0 1, en match de la 1\u00e8re journ\u00e9e du groupe B de la Coupe d\u2019Afrique des Nations (Maroc-2025), disput\u00e9 lundi soir au stade Adrar d\u2019Agadir. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection \u00e9gyptienne de football s\u2019est impos\u00e9e face \u00e0 son homologue zimbabw\u00e9enne sur le score de 2 buts \u00e0 1, en match de la 1\u00e8re journ\u00e9e du groupe B de la Coupe d\u2019Afrique des nations (CAN 2025), disput\u00e9 lundi soir au stade Adrar d\u2019Agadir. [www.yabiladi.com]\n-------------------------------------------------\nVoici l\u2019agenda des matchs de la Coupe d\u2019Afrique des Nations Maroc-2025 pr\u00e9vus mardi 23 d\u00e9cembre 2025 : -Groupe D : RD Congo \u2013 B\u00e9nin (13H30, Stade Al Madina \u00e0 Rabat) -Groupe D : S\u00e9n\u00e9gal \u2013 Botswana (16H00, Grand Stade de Tanger) -Groupe C : Nigeria \u2013 Tanzanie (18H30, Complexe Sportif de F\u00e8s) -Groupe C : . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Commission de l\u2019enseignement et\ndes affaires culturelles et sociales...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de l\u2019enseignement et des affaires culturelles et sociales \u00e0 la Chambre des conseillers a adopt\u00e9, lundi \u00e0 la majorit\u00e9, le projet de loi n\u00b0 026.25 portant r\u00e9organisation du Conseil national de la presse, tel que transmis par la Chambre des repr\u00e9sentants. [fr.hespress.com]\n-------------------------------------------------\nLa Commission de l\u2019enseignement et des affaires culturelles et sociales \u00e0 la Chambre des conseillers a adopt\u00e9, lundi \u00e0 la     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
