ng\u00e8res de la F\u00e9d\u00e9ration de Russie, M. Sergue\u00ef Lavrov. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "\u00c0 seulement 36 ans, Jo\u00e3o\nSacramento s\u2019appr\u00eate \u00e0 \u00e9crire un...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 seulement 36 ans, Jo\u00e3o Sacramento s\u2019appr\u00eate \u00e0 \u00e9crire un nouveau chapitre de sa carri\u00e8re en rejoignant le staff technique de la s\u00e9lection marocaine. [fr.hespress.com]\n-------------------------------------------------\nJo\u00e3o Sacramento, ancien bras droit de Jos\u00e9 Mourinho, l\u2019un des entra\u00eeneurs les plus c\u00e9l\u00e8bres du football mondial, s\u2019engage d\u00e9sormais dans une nouvelle aventure avec les Lions de l\u2019Atlas. [aujourdhui.ma]\n-------------------------------------------------\nJo\u00e3o Sacramento, ancien bras droit de Jos\u00e9 Mourinho, l\u0027un des entra\u00eeneurs les plus c\u00e9l\u00e8bres du football mondial, s\u2019engage d\u00e9sormais dans une nouvelle aventure avec les Lions de l\u2019Atlas. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Il n\u0027y aura aucun accord\navec l\u0027Iran, sauf une CAPITULATION...", "mass": 5, "physics": false, "shape": "box", "title": "Il n\u0027y aura aucun accord avec l\u0027Iran, sauf une CAPITULATION INCONDITIONNELLE !, a \u00e9crit Donald Trump sur son r\u00e9seau Truth social, ajoutant qu\u2019une fois cette \u00e9ta. [lematin.ma]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain, Donald Trump, a affirm\u00e9 vendredi que toute perspective d\u2019accord avec l\u2019Iran demeurait conditionn\u00e9e \u00e0 une \u201ccapitulation inconditionnelle\u201d de T\u00e9h\u00e9ran, estimant qu\u2019aucune autre option ne saurait \u00eatre envisag\u00e9e par les \u00c9tats-Unis. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain, Donald Trump, a affirm\u00e9 vendredi que toute perspective d\u2019accord avec l\u2019Iran demeurait conditionn\u00e9e \u00e0 une \u201ccapitulation inconditionnelle\u201d de T\u00e9h\u00e9ran, estimant qu\u2019aucune autre option ne saurait \u00eatre envisag\u00e9e par les \u00c9tats-Unis. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u2019aviation isra\u00e9lienne a une nouvelle\nfois pilonn\u00e9 vendredi la banlieue...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019aviation isra\u00e9lienne a une nouvelle fois pilonn\u00e9 vendredi la banlieue sud de Beyrouth et vis\u00e9 Sa\u00efda, principale ville du sud du Liban, le Premier ministre accusant Isra\u00ebl de provoquer \u201cune catastrophe humanitaire\u201d du fait des d\u00e9placements massifs de la population. [telquel.ma]\n-------------------------------------------------\nL\u2019aviation isra\u00e9lienne a men\u00e9 de nouvelles frappes sur la banlieue sud de Beyrouth, bastion du Hezbollah, dans un contexte d\u2019escalade militaire r\u00e9gionale impliquant l\u2019Iran, Isra\u00ebl et leurs alli\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Les liaisons maritimes entre le\nport de Tarifa (Cadix) et...", "mass": 5, "physics": false, "shape": "box", "title": "Les liaisons maritimes entre le port de Tarifa (Cadix) et Tanger Ville ont \u00e9t\u00e9 annul\u00e9es vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar provoqu\u00e9es par la temp\u00eate \u00ab Regina \u00bb, indiquent les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [telquel.ma]\n-------------------------------------------------\nLes traversees par ferry, entre Tarifa et Tanger Ville, pr\u00e9vues pour ce vendredi 6 mars, ont \u00e9t\u00e9 annul\u00e9es en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar, d\u00fb \u00e0 la temp\u00eate \u00abRegina\u00bb. [www.yabiladi.com]\n-------------------------------------------------\nLes liaisons maritimes entre le port de Tarifa (Cadix) et Tanger Ville ont \u00e9t\u00e9 annul\u00e9es vendredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables dans le d\u00e9troit de Gibraltar provoqu\u00e9es par la temp\u00eate \u00ab Regina \u00bb, indiquent les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "C\u2019est ce que \u00ab Le\nprojet de d\u00e9cret relatif au...", "mass": 5, "physics": false, "shape": "box", "title": "C\u2019est ce que \u00ab Le projet de d\u00e9cret relatif au Statut des cr\u00e8ches priv\u00e9es, approuv\u00e9 jeudi \u00e0 Rabat en Conseil de gouvernement, vise \u00e0 apporter des r\u00e9ponses \u00e0 une s\u00e9rie de probl\u00e9matiques \u00e0. [telquel.ma]\n-------------------------------------------------\nLe projet de d\u00e9cret relatif au Statut des cr\u00e8ches priv\u00e9es, approuv\u00e9 jeudi \u00e0 Rabat en Conseil de gouvernement, vise \u00e0 apporter des r\u00e9ponses \u00e0 une s\u00e9rie de probl\u00e9matiques \u00e0 travers la mise en place de plusieurs mesures techniques, a affirm\u00e9 le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Conseil de gouvernement, r\u00e9uni\njeudi \u00e0 Rabat, a approuv\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a approuv\u00e9 un d\u00e9cret portant cr\u00e9ation des zones franches d\u2019exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement, r\u00e9uni jeudi \u00e0 Rabat, a adopt\u00e9 le projet de d\u00e9cret portant cr\u00e9ation des zones franches d\u0027exportation dans la zone sp\u00e9ciale de d\u00e9veloppement Tanger-M\u00e9diterran\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Un total de 15.000 familles\nont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res...", "mass": 5, "physics": false, "shape": "box", "title": "Un total de 15.000 familles ont b\u00e9n\u00e9fici\u00e9 des aides financi\u00e8res directes d\u2019un montant de 6.000 dirhams par famille, dans le cadre du programme gouvernemental d\u2019aide et d\u2019accompagnement en faveur des populations sinistr\u00e9es suite aux inondations survenues dans le nord et l\u2019ouest du Royaume, a annonc\u00e9, jeudi \u00e0 Rabat, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi. [telquel.ma]\n-------------------------------------------------\nQuelque 15.000 familles touch\u00e9es par les r\u00e9centes inondations dans le nord et l\u2019ouest du Maroc ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe de 6.000 dirhams chacune. [www.yabiladi.com]\n-------------------------------------------------\nLors du point de presse tenu jeudi \u00e0 l\u2019issue de la r\u00e9union du Conseil de gouvernement, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Faouzi Lekja\u00e2, a indiqu\u00e9 que pr\u00e8s de 15.000 familles ont d\u00e9j\u00e0 b\u00e9n\u00e9fici\u00e9 d\u2019une aide financi\u00e8re directe dans le cadre du programme mis en place pour soutenir et accompagner les         });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
