, a annonc\u00e9 la F\u00e9d\u00e9ration royale marocaine de football. [www.lavieeco.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national Walid Regragui a d\u00e9voil\u00e9, ce jeudi, une liste de 28 joueurs, dont 2 r\u00e9servistes, retenus en pr\u00e9vision de la Coupe d\u2019Afrique des nations (CAN) de football qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, a annonc\u00e9 la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [leseco.ma]\n-------------------------------------------------\nLa liste finale de l\u2019\u00e9quipe du Maroc, publi\u00e9e jeudi par le s\u00e9lectionneur national Walid Regragui en pr\u00e9vision de la Coupe d\u2019Afrique des Nations (CAN) n\u2019a pas r\u00e9serv\u00e9 de grandes surprises, sauf la mise de l\u2019attaquant Hamza Igamane sur la liste de r\u00e9serve pour blessure. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Conclues avec la Conf\u00e9d\u00e9ration d\u00e9mocratique\ndu travail (CDT) pour l\u0027usine...", "mass": 5, "physics": false, "shape": "box", "title": "Conclues avec la Conf\u00e9d\u00e9ration d\u00e9mocratique du travail (CDT) pour l\u0027usine de la SOMACA et Renault Commerce Maroc, et l\u0027Union marocaine du travail (UMT) pour l\u2019usine de Tang. [lematin.ma]\n-------------------------------------------------\nLe Groupe Renault Maroc a franchi une nouvelle \u00e9tape dans le renforcement de son dialogue social en signant, mercredi \u00e0 Casablanca, des conventions collectives pour l\u2019ensemble de ses entit\u00e9s industrielles et commerciales. [telquel.ma]\n-------------------------------------------------\nLe Groupe Renault Maroc a franchi une nouvelle \u00e9tape dans le renforcement de son dialogue social en signant, mercredi \u00e0 Casablanca, des conventions collectives pour l\u2019ensemble de ses entit\u00e9s industrielles et commerciales             network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
