ion territoriaux visant 36 centres ruraux pilotes, pour une enveloppe globale de 2,8 milliards de dirhams, a indiqu\u00e9 mardi le Chef du gouvernement, Aziz Akhannouch. [www.lopinion.ma]\n-------------------------------------------------\nLe projet de Loi de finances (PLF) 2026 traduit l\u2019engagement du gouvernement \u00e0 promouvoir un d\u00e9veloppement rural int\u00e9gr\u00e9, \u00e0 travers l\u2019acc\u00e9l\u00e9ration de la mise en \u0153uvre de plans d\u2019action territoriaux visant 36 centres ruraux pilotes, pour une enveloppe globale de 2,8 milliards de dirhams, a indiqu\u00e9 mardi le Chef du gouvernement, Aziz Akhannouch. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le pr\u00e9sident chinois Xi Jinping\na \u00e9voqu\u00e9 Ta\u00efwan lundi lors...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident chinois Xi Jinping a \u00e9voqu\u00e9 Ta\u00efwan lundi lors d\u0027un entretien t\u00e9l\u00e9phonique avec son homologue am\u00e9ricain Donald Trump, estimant que le passage de l\u0027\u00eele sous le pavillon de la Chine communiste \u00e9tait un enjeu international majeur, selon un m\u00e9dia d\u0027\u00c9tat. [www.lopinion.ma]\n-------------------------------------------------\nLe pr\u00e9sident chinois Xi Jinping a abord\u00e9 la question de Ta\u00efwan lundi lors d\u2019un entretien t\u00e9l\u00e9phonique avec son homologue am\u00e9ricain Donald Trump, affirmant que le \u00ab retour \u00bb de l\u2019\u00eele sous pavillon chinois constitue un enjeu majeur pour l\u2019ordre international, selon l\u2019agence Chine nouvelle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Un chiffre fort mis en\navant par la ministre Na\u00efma...", "mass": 5, "physics": false, "shape": "box", "title": "Un chiffre fort mis en avant par la ministre Na\  3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le tribunal criminel de premi\u00e8re\ninstance de Tanger a rendu,...", "mass": 5, "physics": false, "shape": "box", "title": "Le tribunal criminel de premi\u00e8re instance de Tanger a rendu, dans la nuit de mardi \u00e0 mercredi 26 novembre 2025, son verdict \u00e0 l\u2019encontre du rappeur franco-marocain Maes, de son vrai nom Walid Ben Sghir. [fr.hespress.com]\n-------------------------------------------------\nLe rappeur franco-marocain Maes a \u00e9t\u00e9 condamn\u00e9 \u00e0 sept ans de prison ferme par le tribunal de Tanger dans la nuit de mardi \u00e0 mercredi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le\nminist\u00e8re de la Transition \u00e9nerg\u00e9tique...", "mass": 5, "physics": false, "shape": "box", "title": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, la Wilaya et le Conseil de la R\u00e9gion Souss-Massa ainsi que la CGEM Souss-Massa, r\u00e9com. [lematin.ma]\n-------------------------------------------------\nL\u2019entreprise a remport\u00e9 le Troph\u00e9e Climat 2025, cat\u00e9gorie Agriculture, d\u00e9cern\u00e9 par le Minist\u00e8re de la Transition \u00e9nerg\u00e9tique, la Wilaya, la R\u00e9gion Souss-Massa et la CGEM locale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 34, "id": "comm_label_34", "label": "La BMCI, filiale du Groupe\nBNP Paribas, a officialis\u00e9 ce...", "mass": 5, "physics": false, "shape": "box", "title": "La BMCI, filiale du Groupe BNP Paribas, a officialis\u00e9 ce 26 novembre 2025 la nomination de S\u00e9bastien Rollet au poste de Secr\u00e9taire G\u00e9n\u00e9ral. [lematin.ma]\n------------------------------                                 scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
