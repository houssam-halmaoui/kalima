 l\u2019activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [telquel.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la [www.challenge.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) global pr\u00e9visionnel de l\u0027Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u0027activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Commission de l\u2019int\u00e9rieur, des\ncollectivit\u00e9s territoriales, de l\u2019habitat, de...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de l\u2019int\u00e9rieur, des collectivit\u00e9s territoriales, de l\u2019habitat, de la politique de la ville et des affaires administratives a adopt\u00e9, jeudi soir \u00e0 la majorit\u00e9, le projet de loi organique n\u00b0 27.11 relatif \u00e0 la Chambre des repr\u00e9sentants, en pr\u00e9sence du ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [telquel.ma]\n-------------------------------------------------\nLe projet de loi organique relatif aux partis politiques, et celui relatif aux listes \u00e9lectorales g\u00e9n\u00e9rales ont \u00e9t\u00e9 adopt\u00e9s par 19 voix pour et 5 abstentions par la Commission de l\u0027Int\u00e9rieur \u00e0 la Chambre des repr\u00e9sentants. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La 93e Assembl\u00e9e g\u00e9n\u00e9rale de\nl\u2019Organisation internationale de police criminelle...", "mass": 5, "physics": false, "shape": "box", "title": "La 93e Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (INTERPOL) a \u00e9t\u00e9 \u00ab un succ\u00e8s \u00bb \u00e0 tous les niveaux et sur tous les plans, a affirm\u00e9, jeudi \u00e0 Marrakech, le Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi. [telquel.ma]\n-------------------------------------------------\nLors de la 93e Assembl\u00e9e g\u00e9n\u00e9rale d\u2019Interpol, tenue \u00e0 Marrakech du 24 au 27 novembre, Lucas Philippe a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de l\u2019Organisation internationale de police criminelle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Dans le cadre de sa\nstrat\u00e9gie visant \u00e0 renforcer les...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de sa strat\u00e9gie visant \u00e0 renforcer les services de proximit\u00e9 et \u00e0 \u00e9tendre son r\u00e9seau d\u2019agences client\u00e8le en milieu rural, la Soci\u00e9t\u00e9 R\u00e9gionale Multiservices (SRM) [www.challenge.ma]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 R\u00e9gionale Multiservices (SRM) Casablanca-Settat a proc\u00e9d\u00e9 tout r\u00e9cemment \u00e0 l\u2019ouverture d\u2019une nouvelle agence client\u00e8le dans la commune rurale d\u2019Oulad Ali Toualaa, relevant de la province de Benslimane. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le GAFIMOAN salue les efforts\ndu Maroc dans la lutte...", "mass": 5, "physics": false, "shape": "box", "title": "Le GAFIMOAN salue les efforts du Maroc dans la lutte contre le blanchiment des capitaux et le financement du terrorisme. [www.lavieeco.com]\n----     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
