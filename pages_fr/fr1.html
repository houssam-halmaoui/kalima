u00e9gion Tanger-T\u00e9touan-Al Hoceima ont d\u00e9cid\u00e9 de maintenir la suspension des cours dans les \u00e9tablissements publics et priv\u00e9s, en raison des perturbations m\u00e9t\u00e9orologiques enregistr\u00e9es dans la r\u00e9gion. [telquel.ma]\n-------------------------------------------------\nLes directions provinciales de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports de la r\u00e9gion Tanger-T\u00e9touan-Al Hoce\u00efma ont d\u00e9cid\u00e9 de maintenir la suspension des cours dans les \u00e9tablissements publics et priv\u00e9s, en raison des perturbations m\u00e9t\u00e9orologiques enregistr\u00e9es dans la r\u00e9gion. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Selon l\u2019Autorit\u00e9 portuaire de la\nbaie d\u2019Alg\u00e9siras (APBA), les liaisons...", "mass": 5, "physics": false, "shape": "box", "title": "Selon l\u2019Autorit\u00e9 portuaire de la baie d\u2019Alg\u00e9siras (APBA), les liaisons ont \u00e9t\u00e9 r\u00e9tablies \u00e0 partir de 08h00, \u00e0 la faveur d\u2019une am\u00e9lioration progressive de la situation m\u00e9t\u00e9orologiqu. [lematin.ma]\n-------------------------------------------------\nLe trafic maritime entre les ports d\u2019Alg\u00e9siras et de Tanger Med a repris dimanche, apr\u00e8s une interruption provisoire caus\u00e9e par les conditions m\u00e9t\u00e9orologiques d\u00e9favorables ayant affect\u00e9 le d\u00e9troit de Gibraltar. [maroc-diplomatique.net]\n-------------------------------------------------\nLe trafic maritime entre les ports d\u2019Alg\u00e9siras et de Tanger Med a repris dimanche, apr\u00e8s une interruption provisoire caus\u00e9e par les conditions m\u00e9t\u00e9orologiques d\u00e9favorables ayant affect\u00e9 le d\u00e9troit de Gibraltar. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "De fortes pluies, des averses\norageuses avec risque de gr\u00eale,...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes pluies, des averses orageuses avec risque de gr\u00eale, de fortes rafales de vent et des chutes de neige \u00e0 partir de 1.800m sont pr\u00e9vues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie annonce un \u00e9pisode m\u00e9t\u00e9orologique marqu\u00e9 par de fortes pluies parfois orageuses avec risque de gr\u00eale, des rafales de vent et des chutes de neige, dans plusieurs provinces du Royaume, avec un niveau de vigilance orange. [www.lavieeco.com]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale, de fortes rafales de vent et des chutes de neige \u00e0 partir de 1.800m sont pr\u00e9vues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale, de fortes rafales de vent et des chutes de neige \u00e0 partir de 1.800m sont pr\u00e9vues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Bureau politique du Rassemblement\nnational des ind\u00e9pendants (RNI) a...", "mass": 5, "physics": false, "shape": "box", "title": "Le Bureau politique du Rassemblement national des ind\u00e9pendants (RNI) a tenu une r\u00e9union le samedi 7 f\u00e9vrier 2026 \u00e0 El Jadida, sous la pr\u00e9sidence de Mohamed Chaouki, imm\u00e9diatement apr\u00e8s la cl\u00f4ture du Congr\u00e8s national extraordinaire. [www.lavieeco.com]\n-------------------------------------------------\nCandidat unique, Mohamed Chaouki a \u00e9t\u00e9 \u00e9lu lors des travaux du congr\u00e8s extraordinaire du parti, en recueillant 1.910 voix valides sur un total de 1.933 suffrages exprim\u00e9s, tandis. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Face aux perturbations m\u00e9t\u00e9orologiques ayant\nentra\u00een\u00e9 la suspension des cours...", "mass": 5, "physics": false, "shape": "box", "title": "Face aux perturbations m\u00e9t\u00e9orologiques ayant entra\u00een\u00e9 la suspension des cours et le d\u00e9placement temporaire de familles dans plusieurs r\u00e9gions du Royaume, le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 une s\u00e9rie de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 p\u00e9dagogique des \u00e9l\u00e8ves concern\u00e9s, en tenant compte des sp\u00e9cificit\u00e9s locales et dans des conditions s\u00fbres. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 qu\u2019il \u0153uvre pour la mise en place d\u2019un ensemble de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 de la scolarit\u00e9 dans des conditions s\u00fbres au profit des \u00e9l\u00e8ves relevant des \u00e9tablissements d\u2019enseignement affect\u00e9s par les r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques survenues dans certaines r\u00e9gions . [maroc-diplomatique.net]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 qu\u2019il \u0153uvre pour la mise en place d\u2019un ensemble de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 de la scolarit\u00e9 dans des conditions s\u00fbres au profit des \u00e9l\u00e8ves relevant des \u00e9tablissements d\u2019enseignement affect\u00e9s par les r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques survenues dans certaines r\u00e9gions du Royaume, tout en adaptant ces mesures aux sp\u00e9cificit\u00e9s locales. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Voici les temp\u00e9ratures minimales et\nmaximales pr\u00e9vues par la Direction...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le lundi 09 f\u00e9vrier 2026 : Min Max \u2013 Oujda 10 16 \u2013 Bouarfa 06 20 \u2013 Al Hoceima 12 18 \u2013 T\u00e9touan 12 16 \u2013 Sebta 14 16 \u2013 Mellilia 13 17 \u2013 Tanger 14 16 \u2013 K\u00e9nitra 14 . [maroc-diplomatique.net]\n-------------------------------------------------\nVoici les temp\u00e9ratures minimales et maximales pr\u00e9vues par la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pour le lundi 9 f\u00e9vrier 2026 Min Max \u2013 Oujda 10 16 \u2013 Bouarfa 06 20 \u2013 Al Hoceima 12 18 \u2013 T\u00e9touan 12 16 \u2013 Sebta 14 16 \u2013 Mellilia 13 17 \u2013 Tanger 14 16 \u2013 K\u00e9nitra 14 16 . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "L\u2019AS FAR a pris une\ns\u00e9rieuse option pour les quarts...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019AS FAR a pris une s\u00e9rieuse option pour les quarts de finale, alors que la Renaissance de Berkane s\u2019est compliqu\u00e9e la t\u00e2che, lors de la cinqui\u00e8me journ\u00e9e de la Ligu                     if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
