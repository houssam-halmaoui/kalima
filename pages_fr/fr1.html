 8,4%, en glissement annuel, \u00e0 la faveur d\u2019un [www.challenge.ma]\n-------------------------------------------------\nLes d\u00e9p\u00f4ts bancaires ont progress\u00e9 de 8,6% sur un an pour s\u2019\u00e9tablir \u00e0 1.348,7 milliards de dirhams \u00e0 fin janvier 2026, selon Bank Al-Maghrib. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027encours du cr\u00e9dit bancaire s\u0027est \u00e9tabli \u00e0 fin janvier 2026 \u00e0 1.228,6 milliards de dirhams (MMDH), enregistrant une hausse de 8,4% par rapport \u00e0 janvier 2025, selon Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 la cl\u00f4ture, l\u2019indice de\nr\u00e9f\u00e9rence de la Bourse de...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la cl\u00f4ture, l\u2019indice de r\u00e9f\u00e9rence de la Bourse de Casablanca, le Masi, a accus\u00e9 une baisse de 4,21%, pour s\u2019\u00e9tablir \u00e0 17.377 points. [lematin.ma]\n-------------------------------------------------\nPour le deuxi\u00e8me jour cons\u00e9cutif, la Bourse de Casablanca a essuy\u00e9, mardi 3 mars, de lourdes pertes, dans le sillage des chutes g\u00e9n\u00e9ralis\u00e9es des march\u00e9s financiers partout dans [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le prix du gaz europ\u00e9en\na bondi de plus de...", "mass": 5, "physics": false, "shape": "box", "title": "Le prix du gaz europ\u00e9en a bondi de plus de 50% lundi apr\u00e8s l\u2019annonce par la compagnie \u00e9nerg\u00e9tique publique du Qatar, QatarEnergy, de l\u2019arr\u00eat de sa production de GNL \u00e0 la suite d\u2019une attaque de drones iraniens. [telquel.ma]\n-------------------------------------------------\nLa compagnie \u201cQatarEnergy\u201d a annonc\u00e9, lundi, la suspension de la production de gaz naturel liqu\u00e9fi\u00e9 (GNL) et de produits d\u00e9riv\u00e9s \u00e0 la suite d\u2019une attaque militaire ayant vis\u00e9 ses installations op\u00e9rationnelles dans les zones industrielles de Ras Laffan et de Mesaieed, au Qatar. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Syndicat national des m\u00e9decins\ndu secteur lib\u00e9ral, la F\u00e9d\u00e9ration...", "mass": 5, "physics": false, "shape": "box", "title": "Le Syndicat national des m\u00e9decins du secteur lib\u00e9ral, la F\u00e9d\u00e9ration nationale des syndicats des chirurgiens-dentistes et la Conf\u00e9d\u00e9ration des syndicats des pharmaciens du Maroc ont publi\u00e9 un communiqu\u00e9 commun pour rejeter la r\u00e9cente recommandation du Conseil de la concurrence relative \u00e0 l\u2019ouverture du capital des pharmacies. [telquel.ma]\n-------------------------------------------------\nElles d\u00e9noncent un risque de \u00ab marchandisation \u00bb du m\u00e9dicament et annoncent des gr\u00e8ves nationales successives, avec une mont\u00e9e en puissance des actions de protestation. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Trois avions de combat am\u00e9ricains\nengag\u00e9s dans l\u2019op\u00e9ration militaire \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "Trois avions de combat am\u00e9ricains engag\u00e9s dans l\u2019op\u00e9ration militaire \u00ab Epic Fury \u00bb visant l\u2019Iran, ont \u00e9t\u00e9 abattus \u00ab par erreur \u00bb par les syst\u00e8mes de d\u00e9fense a\u00e9rienne kowe\u00eftiens, a indiqu\u00e9 lundi le Commandement militaire am\u00e9ricain pour le Moyen-Orient (Centcom). [telquel.ma]\n-------------------------------------------------\nTrois avions de combat am\u00e9ricains engag\u00e9s dans l\u2019op\u00e9ration militaire \"Epic Fury\" visant l\u0027Iran, ont \u00e9t\u00e9 abattus \"par erreur\" par les syst\u00e8mes de d\u00e9fense a\u00e9rienne kowe\u00eftiens, a indiqu\u00e9 ce lundi le Commandement militaire am\u00e9ricain pour le Moyen-Orient (Centcom). [leseco.ma]\n-------------------------------------------------\nTrois avions de combat am\u00e9ricains engag\u00e9s dans l\u2019op\u00e9ration militaire \u201cEpic Fury\u201d visant l\u2019Iran, ont \u00e9t\u00e9 abattus \u201cpar erreur\u201d par les syst\u00e8mes de d\u00e9fense a\u00e9rienne kowe\u00eftiens, a indiqu\u00e9 lundi le Commandement militaire am\u00e9ricain pour le Moyen-Orient (Centcom). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Des chutes de neige sur\nles hauteurs au-del\u00e0 de 1.400...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige sur les hauteurs au-del\u00e0 de 1.400 m, des averses orageuses avec risque de gr\u00eale, des rafales de vent avec chasse-poussi\u00e8res et un temps froid sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige sur les hauteurs au-del\u00e0 de 1.400 m, des averses orageuses avec risque de gr\u00eale, des rafales de vent avec chasse-poussi\u00e8res et un temps froid [www.challenge.ma]\n-------------------------------------------------\nDes chutes de neige sur les hauteurs au-del\u00e0 de 1.400 m, des averses orageuses avec risque de gr\u00eale, des rafales de vent avec chasse-poussi\u00e8res et un temps froid sont pr\u00e9vus, de lundi \u00e0 jeudi, dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00c0 l\u2019occasion de la Coupe\nd\u2019Afrique des Nations 2025, organis\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la Coupe d\u2019Afrique des Nations 2025, organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026, 529 interventions s\u00e9curitaires ont \u00e9t\u00e9 enregistr\u00e9es et 202 personnes ont \u00e9t\u00e9 pr\u00e9sent\u00e9es devant les diff\u00e9rents bureaux judiciaires install\u00e9s dans les stades h\u00f4tes de la comp\u00e9tition. [telquel.ma]\n-------------------------------------------------\nLa gestion des affaires p\u00e9nales li\u00e9es \u00e0 la Coupe d\u2019Afrique des Nations 2025, organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026, a donn\u00e9 lieu \u00e0 529 interventions s\u00e9curitaires et \u00e0 la pr\u00e9sentation de 202 personnes devant les bureaux judiciaires implant\u00e9s au sein des stades h\u00f4tes, selon un communiqu\u00e9 conjoint du Minist\u00e8re de . [lnt.ma]\n-------------------------------------------------\n529 interventions s\u00e9curitaires ont \u00e9t\u00e9 enregistr\u00e9es et 202 personnes ont \u00e9t\u00e9 pr\u00e9sent\u00e9es devant les diff\u00e9rents bureaux judiciaires install\u00e9s dans les stades ayant accueilli la Coupe d\u2019Afrique des Nations de football (CAN-2025), organis\u00e9e au Maroc du 21 d\u00e9cembre 2025 au 18 janvier 2026. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le chiffre d\u2019affaires (CA) consolid\u00e9\ndu groupe Managem a franchi...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires (CA) consolid\u00e9 du groupe Managem a franchi pour la premi\u00e8re fois le seuil des 10 milliards de dirhams en 2025, pour s\u2019\u00e9tablir \u00e0 pr\u00e8s de 13,7 MMDH, en hausse de 55% par rapport \u00e0 une ann\u00e9e auparavant. [telquel.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) consolid\u00e9 du groupe Managem a franchi pour la premi\u00e8re fois le seuil des 10 milliards de dirhams (MMDH) en 2025, pour s\u0027\u00e9tablir \u00e0 pr\u00e8s de 13,7 MMDH, en hausse de 55% par rapport \u00e0 une ann\u00e9e auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La guerre au Moyen-Orient fait\ngrimper lundi les prix du...", "mass": 5, "physics": false, "shape": "box", "title": "La guerre au Moyen-Orient fait grimper lundi les prix du gaz et du p\u00e9trole, qui \u00e9volue autour de 80 dollars le baril, tandis que les Bourses mondiales reculent et que l\u2019or est recherch\u00e9. [telquel.ma]\n-------------------------------------------------\nLa Bourse de New York a ouvert en nette baisse lundi, p\u00e9nalis\u00e9e par les incertitudes n\u00e9es de l\u0027aggravation de la crise au Moyen-Orient ce weekend. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019international marocain Omar El Hilali,\nqui \u00e9volue \u00e0 l\u2019Espanyol Barcelone...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019international marocain Omar El Hilali, qui \u00e9volue \u00e0 l\u2019Espanyol Barcelone a \u00e9t\u00e9 victime d\u2019un acte de racisme, lors de la 26e journ\u00e9e de la Liga contre le club d\u2019Elche. [telquel.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration Royale Marocaine de Football (FRMF) a exprim\u00e9, dimanche, son enti\u00e8re solidarit\u00e9 et son soutien inconditionnel \u00e0 l\u2019international marocain, Omar El Hilali, suite aux propos \u00ab offensants \u00bb dont il a \u00e9t\u00e9 victime, \u00e0 l\u2019occasion du match de la 26\u00e8 journ\u00e9e de la Liga entre Espanyol Barcelone et Elche. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le p\u00e9trole et le gaz\nflambent lundi, le conflit engag\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le p\u00e9trole et le gaz flambent lundi, le conflit engag\u00e9 par les frappes am\u00e9ricaines et isra\u00e9liennes contre l\u2019Iran ce week-end faisant redouter des perturbations de l\u2019offre, alors que [www.challenge.ma]\n-------------------------------------------------\nLe conflit d\u00e9clench\u00e9 par les frappes am\u00e9ricaines et isra\u00e9liennes contre l\u2019Iran et son extension \u00e0 plusieurs pays du Moyen-Orient devraient entra\u00eener une forte hausse des cours du p\u00e9trole \u00e0 l\u2019ouverture des march\u00e9s dans la nuit de dimanche \u00e0 lundi, avec des r\u00e9percussions potentielles sur l\u2019\u00e9conomie mondiale si la crise s\u2019inscrit dans la dur\u00e9e. [lnt.ma]\n-------------------------------------------------\nLes prix du p\u00e9trole ont flamb\u00e9 lundi, d\u00e9passant bri\u00e8vement 80 dollars le baril avant de mod\u00e9rer leurs gains, le conflit engag\u00e9 par des frappes am\u00e9ricaines et isra\u00e9liennes contre l\u2019Iran faisant redouter des perturbations de l\u2019offre de brut, alors que les investisseurs s\u2019interrogent sur l\u2019\u00e9volution de la crise. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Maroc et la Belgique\ns\u2019appr\u00eatent \u00e0 \u00e9tablir dans les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Belgique s\u2019appr\u00eatent \u00e0 \u00e9tablir dans les prochains mois \u00ables bases d\u2019un dialogue s\u00e9curitaire\u00bb pour coordonner leur action face \u00e0 des menaces communes, a annonc\u00e9 lundi le ministre marocain des Affaires \u00e9trang\u00e8res, Nasser Bourita, lors d\u2019une conf\u00e9rence de presse conjointe avec le vice-Premier ministre et ministre belge des Affaires \u00e9trang\u00e8res, Maxime Pr\u00e9vot. [www.yabiladi.com]\n-------------------------------------------------\nLe Royaume du Maroc et le Royaume de Belgique sont appel\u00e9s \u00e0 renforcer leur partenariat avec conviction et fiabilit\u00e9, a affirm\u00e9, lundi \u00e0 Rabat, le vice-Premier ministre et ministre belge des Affaires \u00e9trang\u00e8res, des Affaires europ\u00e9ennes et de la Coop\u00e9ration au d\u00e9veloppement, Maxime Pr\u00e9vot. [www.lereporter.ma]\n-------------------------------------------------\nUne cellule de crise a \u00e9t\u00e9 mise en place par le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger pour r\u00e9pondre aux pr\u00e9occupations des Marocains r\u00e9sidant dans la r\u00e9gion du Moyen Orient. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Conseil de la r\u00e9gion\nde l\u0027Oriental, r\u00e9uni lundi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de la r\u00e9gion de l\u0027Oriental, r\u00e9uni lundi \u00e0 Oujda en session ordinaire du mois de mars, a approuv\u00e9 plusieurs accords de partenariat et programmes de d\u00e9veloppement portant sur plusieurs secteurs, notamment \u00e9conomique, social, environnemental, touristique et sportif. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil r\u00e9gional de l\u2019Oriental tiendra ce lundi \u00e0 Oujda sa session ordinaire du mois de mars, avec un ordre du jour particuli\u00e8rement dense ax\u00e9 sur les partenariats, les infrastructures, la sant\u00e9, le d\u00e9veloppement social et la valorisation du patrimoine r\u00e9gional. [leseco.ma]"}, {"borderWi     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },

                    barnesHut: {

                    }
                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
