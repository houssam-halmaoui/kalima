\u2019Afrique des nations (CAN 2025) qui se d\u00e9roule au Maroc, mais aussi pendant les grands \u00e9v\u00e9nements internationaux que le pays va accueillir prochainement. [www.yabiladi.com]\n-------------------------------------------------\nCe centre strat\u00e9gique marque une avanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle du premier a\u00e9roport du Royaume et contribuera \u00e0 la fluidit\u00e9 durant la Coupe d\u2019Afrique des Nations (CAN) 2025 et les grands \u00e9v\u00e9nements internationaux . [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019ONDA lance un centre de commandement au sein de l\u2019a\u00e9roport Mohammed V. L\u0027Office national des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u0027a\u00e9roport international Mohammed V de Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Il ne pourra pas jouer\nlors de cette CAN, a...", "mass": 5, "physics": false, "shape": "box", "title": "Il ne pourra pas jouer lors de cette CAN, a regrett\u00e9 Walid Regragui en conf\u00e9ren. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est indisponible pour le reste de la comp\u00e9tition. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de lAtlas, Azzedine Ounahi, serait indisponible pour le reste de la comp\u00e9tition. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est indisponible pour le reste de la comp\u00e9tition. [maroc-diplomatique.net]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9 dimanche que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est contraint de d\u00e9clarer forfait pour le reste de la Coupe d\u2019Afrique des Nations Maroc-2025. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les livraisons de ciment s\u2019\u00e9l\u00e8vent\n\u00e0 14,8 millions de tonnes...", "mass": 5, "physics": false, "shape": "box", "title": "Les livraisons de ciment s\u2019\u00e9l\u00e8vent \u00e0 14,8 millions de tonnes \u00e0 fin d\u00e9cembre 2025, soit une hausse de 8,2%, selon les donn\u00e9es du minist\u00e8re de l\u0027Am\u00e9nagement du Territoire nationa. [lematin.ma]\n-------------------------------------------------\nLes livraisons de ciment ont atteint plus de 14,81 millions de tonnes (MT) au titre de l\u0027ann\u00e9e 2025, en hausse de 8,21% par rapport \u00e0 l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le minist\u00e8re de l\u0027Am\u00e9nagement du territoire national, de l\u0027Urbanisme, de l\u0027Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Au terme d\u2019un huiti\u00e8me de\nfinale disput\u00e9 et sans relief...", "mass": 5, "physics": false, "shape": "box", "title": "Au terme d\u2019un huiti\u00e8me de finale disput\u00e9 et sans relief spectaculaire, la s\u00e9lection marocaine a assur\u00e9 l\u2019essentiel. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [leseco.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Donald Trump a affirm\u00e9 que\nles Etats-Unis \u00e9taient \u00ab aux...", "mass": 5, "physics": false, "shape": "box", "title": "Donald Trump a affirm\u00e9 que les Etats-Unis \u00e9taient \u00ab aux commandes \u00bb du Venezuela apr\u00e8s la capture du pr\u00e9sident Nicolas Maduro, qui doit \u00eatre pr\u00e9sent\u00e9 lundi \u00e0 un tribunal \u00e0 New York pour se voir signifier des accusations de trafic de drogue. [telquel.ma]\n-------------------------------------------------\nLes Etats-Unis ont laiss\u00e9 entendre dimanche qu\u2019ils pourraient collaborer avec les dirigeants v\u00e9n\u00e9zu\u00e9liens encore au pouvoir, apr\u00e8s la capture du pr\u00e9sident Nicolas Maduro par les forces am\u00e9ricaines et son transfert \u00e0 New York pour r\u00e9pondre devant la justice am\u00e9ricaine d\u2019accusations de \u00ab narcoterrorisme \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La direction provinciale du minist\u00e8re\nde l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire...", "mass": 5, "physics": false, "shape": "box", "title": "La direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Essaouira a annonc\u00e9 la poursuite de la suspension provisoire des cours, lundi, dans l\u2019ensemble des \u00e9tablissements scolaires de la province, en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables. [telquel.ma]\n-------------------------------------------------\nLa Direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports \u00e0 Essaouira a annonc\u00e9 la poursuite de la suspension provisoire des cours, lundi, dans l\u2019ensemble des \u00e9tablissements scolaires de la province, en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables. [www.yabiladi.com]\n-------------------------------------------------\nCette d\u00e9cision fait suite au dernier bulletin d\u0027alerte \u00e9mis par la Direction G\u00e9n\u00e9rale de la M\u00e9t\u00e9orologie (DGM) signalant des pr\u00e9cipitations abondantes et des vents forts. [www.lavieeco.com]\n-------------------------------------------------\nLa Direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Essaouira a annonc\u00e9 la poursuite de la suspension provisoire des cours, lundi, dans l\u2019ensemble des \u00e9tablissements scolaires de la province, en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019\u00e9quipe du Cameroun a rejoint\nla s\u00e9lection marocaine en quart...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN 2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au stade Al Madina \u00e0 Rabat. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa s\u00e9lection camerounaise s\u2019est qualifi\u00e9e, dimanche au stade Al Madina \u00e0 Rabat, pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 en s\u2019imposant face \u00e0 l\u2019Afrique du Sud sur le score de deux buts \u00e0 un, lors du huiti\u00e8me de finale. [lnt.ma]\n-------------------------------------------------\nLe prochain adversaire de l\u0027\u00e9quipe du Maroc en quart de finale de la CAN 2025 est un poids lourd du continent. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La s\u00e9lection marocaine de football\ns\u2019est qualifi\u00e9e aux quarts de...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e aux quarts de finale de la Coupe d\u2019Afrique des Nations de football (CAN Maroc-2025), en s\u2019imposant face \u00e0 la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e aux quarts de finale de la Coupe d\u2019Afrique des Nations de football (CAN Maroc-2025), en s\u2019imposant face \u00e0 la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a battu son homologue de la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour les huiti\u00e8mes de finale de la Coupe d\u0027Afrique des nations (CAN-2025). [leseco.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine a valid\u00e9, dimanche au stade Prince Moulay Abdellah de Rabat, son billet pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 en s\u2019imposant face \u00e0 la Tanzanie sur le score de 1 but \u00e0 0. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "En inscrivant un but dans\nchacune des quatre premi\u00e8res rencontres...", "mass": 5, "physics": false, "shape": "box", "title": "En inscrivant un but dans chacune des quatre premi\u00e8res rencontres de la Coupe d\u2019Afrique des Nations (Maroc-2025), Brahim Diaz inscrit son nom en lettres d\u2019or dans les annales [www.challenge.ma]\n-------------------------------------------------\nAvec quatre buts inscrits en autant de matchs, le milieu offensif marocain devient le premier joueur du Maroc \u00e0 marquer lors de quatre rencontres cons\u00e9cutives dans la Coupe d\u2019Afrique des Nations, d\u00e9passant le record vieux de 49 ans de la l\u00e9gende Ahmed Faras. [telquel.ma]\n-------------------------------------------------\nEn inscrivant un but dans chacune des quatre premi\u00e8res rencontres de la Coupe d\u0027Afrique des Nations (Maroc-2025), Brahim Diaz inscrit son nom en lettres d\u0027or dans les annales du ballon rond marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les indices des valeurs unitaires\n\u00e0 l\u2019importation ont recul\u00e9 de...", "mass": 5, "physics": false, "shape": "box", "title": "Les indices des valeurs unitaires \u00e0 l\u2019importation ont recul\u00e9 de 5,8% et ceux \u00e0 l\u2019exportation ont augment\u00e9 de 0,4% durant le troisi\u00e8me trimestre de 2025, indique le Haut-Commissariat [www.challenge.ma]\n-------------------------------------------------\nLes indices des valeurs unitaires \u00e0 l\u0027importation ont recul\u00e9 de 5,8% et ceux \u00e0 l\u0027exportation ont augment\u00e9 de 0,4% durant le troisi\u00e8me trimestre de 2025, selon le Haut-Commissariat au plan (HCP). [www.lavieeco.com]\n-------------------------------------------------\nLa Haut-Commissariat au Plan a indiqu\u00e9, dans une note publi\u00e9e lundi 5 janvier, que l\u2019indice des valeurs moyennes \u00e0 l\u2019importation a recul\u00e9 de 5,8 %, tandis que celui des exportations a progress\u00e9 l\u00e9g\u00e8rement de 0,4 % au troisi\u00e8me trimestre 2025 par rapport \u00e0 la m\u00eame p\u00e9riode en 2024. [www.lopinion.ma]\n-------------------------------------------------\nSelon le rapport trimestriel publi\u00e9 le 5 janvier 2026 par le Haut-Commissariat au Plan, l\u2019\u00e9conomie marocaine a enregistr\u00e9 en 2025 une d\u00e9sinflation marqu\u00e9e \u00e0 l\u2019importation et des \u00e9volutions contrast\u00e9es \u00e0 l\u2019exportation. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Nouvelle installation Le Mus\u00e9e Mohammed\nVI d\u2019art moderne et contemporain...", "mass": 5, "physics": false, "shape": "box", "title": "Nouvelle installation Le Mus\u00e9e Mohammed VI d\u2019art moderne et contemporain (MMVI) \u00e0 Rabat abrite, mercredi prochain, la c\u00e9r\u00e9monie de d\u00e9voilement de la nouvelle sculpture \u00abPaloma\u00bb, une \u0153uvre majestueuse en granit, con\u00e7ue par les artistes Ben et Yannick Jakober. [aujourdhui.ma]\n-------------------------------------------------\nR\u00e9alis\u00e9e en granit par les artistes Ben Jakober et Yannick Jakober, l\u2019\u0153uvre vient enrichir le parvis du mus\u00e9e, pens\u00e9 comme un espace d\u2019exposition \u00e0 ciel ouvert. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro,\ncaptur\u00e9 samedi lors d\u2019une op\u00e9ration...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro, captur\u00e9 samedi lors d\u2019une op\u00e9ration militaire am\u00e9ricaine \u00e0 Caracas, compara\u00eetra lundi devant un juge \u00e0 New York, a annonc\u00e9 dimanche le tribunal o\u00f9 il sera jug\u00e9 notamment pour \u00ab narcoterrorisme \u00bb et importation de coca\u00efne aux Etats-Unis. [maroc-diplomatique.net]\n-------------------------------------------------\nDeux jours apr\u00e8s sa capture \u00e0 Caracas par les forces sp\u00e9ciales am\u00e9ricaines, l\u2019ancien pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro a \u00e9t\u00e9 transf\u00e9r\u00e9 lundi devant la justice am\u00e9ricaine pour sa premi\u00e8re comparution. [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro, captur\u00e9 samedi lors d\u0027une op\u00e9ration militaire am\u00e9ricaine \u00e0 Caracas, doit compara\u00eetre ce lundi devant un juge \u00e0 New York, a annonc\u00e9 dimanche le tribunal o\u00f9 il sera jug\u00e9 notamment pour \"narcoterrorisme\" et importation de coca\u00efne aux Etats-Unis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Royaume du Maroc a\nr\u00e9it\u00e9r\u00e9, samedi, son soutien \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a r\u00e9it\u00e9r\u00e9, samedi, son soutien \u00ab in\u00e9branlable \u00bb \u00e0 l\u2019unit\u00e9 nationale de la R\u00e9publique s\u0153ur du Y\u00e9men et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, tout en exprimant son attachement au droit du peuple y\u00e9m\u00e9nite \u00e0 la s\u00e9curit\u00e9 et \u00e0 la stabilit\u00e9. [lnt.ma]\n-------------------------------------------------\nLe Maroc r\u00e9affirme son soutien \u00e0 l\u2019unit\u00e9 du Y\u00e9men et appelle au dialogue, alors que les combats entre forces gouvernementales et s\u00e9paratistes du Sud ont fait au moins 80 morts depuis vendredi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Une d\u00e9l\u00e9gation du Federal Bureau\nof Investigation (FBI) effectue une...", "mass": 5, "physics": false, "shape": "box", "title": "Une d\u00e9l\u00e9gation du Federal Bureau of Investigation (FBI) effectue une visite officielle au Maroc du 4 au 6 janvier afin d\u2019examiner le dispositif de s\u00e9curit\u00e9 mis en place lors de la Coupe d\u2019Afrique des nations 2025. [fr.hespress.com]\n-------------------------------------------------\nConduite par Douglas Olson, directeur des op\u00e9rations au sein de la division des services d\u2019interventions sur le terrain, et Kevin Kowalski, directeur adjoint du groupe d\u2019interventi. [lematin.ma]\n-------------------------------------------------\nUne d\u00e9l\u00e9gation du Bureau f\u00e9d\u00e9ral d\u2019enqu\u00eate am\u00e9ricain (FBI), dirig\u00e9e par Douglas Olsan, directeur des op\u00e9rations de la division des services d\u2019intervention sur le terrain, et Kevin Kowalski, directeur adjoint du groupe d\u2019intervention d\u2019urgence, effectue une visite officielle au Maroc du 4 au 6 janvier, afin de s\u2019informer sur le protocole de s\u00e9curit\u00e9 et de s\u00fbret\u00e9. [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a re\u00e7u une d\u00e9l\u00e9gation officielle du Federal Bureau of Investigation (FBI), dans le cadre dune visite du 4 au 6 janvier, ax\u00e9e sur les dispositifs de s\u00e9curit\u00e9 pour la Coupe dAfrique des nations (CAN 2025) qui se d\u00e9roule actuellement au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Les examens m\u00e9dicaux ont confirm\u00e9\nque le milieu de terrain...", "mass": 5, "physics": false, "shape": "box", "title": "Les examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [fr.hespress.com]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [telquel.ma]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffrait d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [www.yabiladi.com]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [maroc-diplomatique.net]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions <script>

    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

        }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
