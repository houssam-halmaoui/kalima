i. [lematin.ma]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, est arriv\u00e9e, mardi apr\u00e8s-midi a Nairobi, pour une visite de travail de deux jours, \u00e0 l\u2019invitation de Son Excellence Madame Rachel Ruto, Premi\u00e8re Dame de la R\u00e9publique du Kenya. [www.lavieeco.com]\n-------------------------------------------------\nLa Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, est arriv\u00e9e mardi apr\u00e8s-midi a Nairobi, pour une visite de travail de deux jours, \u00e0 l\u2019invitation de Son Excellence Madame Rachel Ruto, Premi\u00e8re Dame de la R\u00e9publique du Kenya. [atlasinfo.fr]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, et Son Excellence Mme Rachel Ruto, Premi\u00e8re Dame de la R\u00e9publique du Kenya, Pr\u00e9sidente de la \u201cVoice of Children Foundation\u201d, ont proc\u00e9d\u00e9, mercredi au Kenyatta National Hospital \u00e0 Nairobi, au lancement de la quatri\u00e8me phase du programme \u201cUnis, on s\u2019entend mieux\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Voici un communiqu\u00e9 du Cabinet\nRoyal :Eu \u00e9gard au tournant...", "mass": 5, "physics": false, "shape": "box", "title": "Voici un communiqu\u00e9 du Cabinet Royal :Eu \u00e9gard au tournant historique qu\u2019a connu le processus de la Cause Nationale et ayant \u00e0 l\u2019esprit les d\u00e9veloppements d\u00e9cisifs apport\u00e9s p. [lematin.ma]\n-------------------------------------------------\nDans un communiqu\u00e9, le Cabinet royal a annonc\u00e9 l\u2019instauration du 31 octobre comme nouvelle f\u00eate nationale baptis\u00e9e \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), en hommage au tournant historique de la cause nationale et \u00e0 la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9. [telquel.ma]\n-------------------------------------------------\nDans un communiqu\u00e9 solennel diffus\u00e9 mardi, le Cabinet Royal a annonc\u00e9 la d\u00e9cision de Sa Majest\u00e9 le Roi Mohammed VI d\u2019instituer une nouvelle f\u00eate nationale : \u00abA\u00efd Al Wahda\u00bb (F\u00eate de l\u2019Unit\u00e9), qui sera c\u00e9l\u00e9br\u00e9e chaque ann\u00e9e le 31 octobre. [leseco.ma]\n-------------------------------------------------\nVoici le texte int\u00e9gral du communiqu\u00e9 du Cabinet Royal : \u00ab Eu \u00e9gard au tournant historique qu\u2019a connu le processus de la Cause Nationale et ayant \u00e0 l\u2019esprit les d\u00e9veloppements d\u00e9cisifs apport\u00e9s par la r\u00e9solution 2797/2025 du Conseil de s\u00e9curit\u00e9, qui a fait l\u2019objet du r\u00e9cent Discours adress\u00e9 par Sa Majest\u00e9 le Roi Mohammed VI, que . [atlasinfo.fr]\n-------------------------------------------------\nLe Roi Mohammed VI a d\u00e9cr\u00e9t\u00e9 que la journ\u00e9e du 31 octobre sera d\u00e9sormais c\u00e9l\u00e9br\u00e9e chaque ann\u00e9e comme \u00ab Aid Al Wahda \u00bb (F\u00eate de l\u2019Unit\u00e9), selon un communiqu\u00e9 du Cabinet Royal diffus\u00e9 mardi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "L\u2019ONDA lance l\u2019appel d\u2019offres pour\nle futur terminal HUB de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ONDA lance l\u2019appel d\u2019offres pour le futur terminal HUB de l\u2019a\u00e9roport Casablanca Mohammed V. Apr\u00e8s un appel \u00e0 manifestation d\u2019int\u00e9r\u00eat international en mai dernier, l\u2019ONDA enclenche la vitesse sup\u00e9rieure en ouvrant l\u2019appel d\u2019offres pour d\u00e9signer le constructeur ou groupemen. [lematin.ma]\n-------------------------------------------------\nL\u0027OND     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
