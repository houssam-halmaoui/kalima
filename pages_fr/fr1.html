ce-pr\u00e9sident Cloud Africa. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Cheffe du gouvernement, Fatima\nEzzahra El Mansouri, a pr\u00e9sid\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sid\u00e9, jeudi \u00e0 Rabat, la 2e r\u00e9union interminist\u00e9rielle consacr\u00e9e \u00e0 l\u0027examen du pouvoir d\u0027achat des citoyens et au. [lematin.ma]\n-------------------------------------------------\nR\u00e9unie jeudi \u00e0 Rabat sous la pr\u00e9sidence de Fatima Ezzahra El Mansouri, la deuxi\u00e8me r\u00e9union interminist\u00e9rielle consacr\u00e9e au pouvoir d\u2019achat a port\u00e9 sur la stabilisation des prix des l\u00e9gumes et des viandes. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sid\u00e9, jeudi \u00e0 Rabat, la 2e r\u00e9union interminist\u00e9rielle consacr\u00e9e \u00e0 l\u2019examen du pouvoir d\u2019achat des citoyens et aux mesures \u00e0 m\u00eame de garantir la stabilit\u00e9 des prix des produits de base, notamment des l\u00e9gumes et des viandes, et de pr\u00e9server le niveau de vie des m\u00e9nages. [www.lereporter.ma]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sid\u00e9, jeudi 19 novembre \u00e0 Rabat, une deuxi\u00e8me r\u00e9union interminist\u00e9rielle consacr\u00e9e \u00e0 la protection du pouvoir d\u2019achat des m\u00e9nages et \u00e0 la stabilit\u00e9 des prix des produits alimentaires de base. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019info en Face re\u00e7oit Mohamed\nRahj, professeur \u00e9m\u00e9rite et expert...", "mass": 5, "physics": false, "shape": "box", "                                 scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
