borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Face aux perturbations m\u00e9t\u00e9orologiques ayant\nentra\u00een\u00e9 la suspension des cours...", "mass": 5, "physics": false, "shape": "box", "title": "Face aux perturbations m\u00e9t\u00e9orologiques ayant entra\u00een\u00e9 la suspension des cours et le d\u00e9placement temporaire de familles dans plusieurs r\u00e9gions du Royaume, le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 une s\u00e9rie de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 p\u00e9dagogique des \u00e9l\u00e8ves concern\u00e9s, en tenant compte des sp\u00e9cificit\u00e9s locales et dans des conditions s\u00fbres. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 qu\u2019il \u0153uvre pour la mise en place d\u2019un ensemble de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 de la scolarit\u00e9 dans des conditions s\u00fbres au profit des \u00e9l\u00e8ves relevant des \u00e9tablissements d\u2019enseignement affect\u00e9s par les r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques survenues dans certaines r\u00e9gions . [maroc-diplomatique.net]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports a annonc\u00e9 qu\u2019il \u0153uvre pour la mise en place d\u2019un ensemble de mesures d\u2019urgence visant \u00e0 garantir la continuit\u00e9 de la scolarit\u00e9 dans des conditions s\u00fbres au profit des \u00e9l\u00e8ves relevant des \u00e9tablissements d\u2019enseignement affect\u00e9s par les r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques survenues dans certaines r\u00e9gions du Royaume, tout en adaptant ces mesures aux sp\u00e9cificit\u00e9s locales. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le produit net bancaire (PNB)\ndes sept banques cot\u00e9es \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le produit net bancaire (PNB) des sept banques cot\u00e9es \u00e0 la Bourse de Casablanca s\u2019est \u00e9tabli \u00e0 72 milliards de dirhams (MMDH) \u00e0 fin septembre 2025, en hausse de 6% par rapport \u00e0 l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon Attijari Global Research (AGR). [leseco.ma]\n-------------------------------------------------\nLe produit net bancaire (PNB) des sept banques cot\u00e9es \u00e0 la Bourse de Casablanca s\u2019est \u00e9tabli \u00e0 72 milliards de dirhams (MMDH) \u00e0 fin septembre 2025, enregistrant une hausse de 6% en glissement annuel, selon les donn\u00e9es publi\u00e9es par Attijari Global Research (AGR) dans son rapport \u00ab Research Report \u2013 Equity \u00bb de f\u00e9vrier 2026. . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "L\u2019Agence internationale de l\u2019\u00e9nergie atomique\n(AIEA) et le groupe OCP,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence internationale de l\u2019\u00e9nergie atomique (AIEA) et le groupe OCP, leader mondial des solutions de nutrition des plantes, ont annonc\u00e9, vendredi, avoir lanc\u00e9 un partenariat strat\u00e9gique de cinq ans visant \u00e0 acc\u00e9l\u00e9rer l\u2019innovation scientifique au service d\u2019une agriculture durable et de syst\u00e8mes alimentaires r\u00e9silients. [leseco.ma]\n-------------------------------------------------\nL\u2019Agence internationale de l\u2019\u00e9nergie atomique (AIEA) et le Groupe OCP ont annonc\u00e9 le lancement d\u2019un partenariat strat\u00e9gique de cinq ans visant \u00e0 renforcer la s\u00e9curit\u00e9 alimentaire mondiale et la sant\u00e9 des sols \u00e0 travers l\u2019innovation scientifique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le trafic maritime entre les\nports d\u2019Alg\u00e9siras et de Tanger...", "mass": 5, "physics": false, "shape": "box", "title": "Le trafic maritime entre les ports d\u2019Alg\u00e9siras et de Tanger Med a repris dimanche, apr\u00e8s une interruption provisoire caus\u00e9e par les conditions m\u00e9t\u00e9orologiques d\u00e9favorables ayant affect\u00e9 le d\u00e9troit de Gibraltar. [fr.hespress.com]\n-------------------------------------------------\nSelon l\u2019Autorit\u00e9 portuaire de la baie d\u2019Alg\u00e9siras (APBA), les liaisons ont \u00e9t\u00e9 r\u00e9tablies \u00e0 partir de 08h00, \u00e0 la faveur d\u2019une am\u00e9lioration progressive de la situation m\u00e9t\u00e9orologiqu. [lematin.ma]\n-------------------------------------------------\nLe trafic maritime entre les ports d\u2019Alg\u00e9siras et de Tanger Med a repris dimanche, apr\u00e8s une interruption provisoire caus\u00e9e par les conditions m\u00e9t\u00e9orologiques d\u00e9favorables ayant affect\u00e9 le d\u00e9troit de Gibraltar. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "De fortes pluies, des averses\norageuses avec risque de gr\u00eale,...", "mass": 5, "physics": false, "shape": "box", "title": "De fortes pluies, des averses orageuses avec risque de gr\u00eale, de fortes rafales de vent et des chutes de neige \u00e0 partir de 1.800m sont pr\u00e9vues, de dimanche \u00e0 mardi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDe fortes pluies, des averses orageuses avec risque de gr\u00eale, de fortes rafales de vent et de         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
