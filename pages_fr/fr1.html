oc demeure attach\u00e9 \u00e0 la n\u00e9cessit\u00e9 de parvenir \u00e0 une solution qui sauve la face de toutes les parties, sans vainqueur, ni vaincu\u201d, a affirm\u00e9 Sa Majest\u00e9 le Roi Mohammed VI, dans un Discours adress\u00e9, vendredi soir, \u00e0 Son peuple fid\u00e8le. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Apr\u00e8s l\u2019avanc\u00e9e historique en faveur\ndu Maroc sur le dossier...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s l\u2019avanc\u00e9e historique en faveur du Maroc sur le dossier du Sahara lors du Conseil de S\u00e9curit\u00e9 de l\u2019ONU, ce 31 octobre, l\u2019ambassade de France a publi\u00e9 un communiqu\u00e9 saluant la d\u00e9cision onusienne. [telquel.ma]\n-------------------------------------------------\nL\u2019adoption, le 31 octobre 2025, par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, d\u2019une r\u00e9solution soutenant le plan d\u2019autonomie marocain pour le Sahara marque un changement profond dans la [www.challenge.ma]\n-------------------------------------------------\nL\u2019ambassade de France au Maroc a salu\u00e9, vendredi soir, l\u2019adoption ce jour par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797 (2025), adopt\u00e9e \u00e0 11 voix favorables, qualifiant le plan d\u2019autonomie marocain de \u00ab seule base \u00bb pour une solution juste et durable au Sahara. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Soci\u00e9t\u00e9 r\u00e9gionale multiservices Casablanca-Settat\na annonc\u00e9 dans un communiqu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Soci\u00e9t\u00e9 r\u00e9gionale multiservices Casablanca-Settat a annonc\u00e9 dans un communiqu\u00e9 qu\u2019une panne s\u2019est produite, hier, jeudi 30 octobre, sur l\u2019une des principales conduites d\u2019eau potable alimentant les quartiers de Moulay Rachid, Sbata, Salmia, Sidi Othmane et la partie nord d\u2019El Harraouine \u00e0 Casablanca. [telquel.ma]\n-------------------------------------------------\nUne rupture s\u2019est produite le jeudi 30 octobre 2025 sur une conduite principale d\u2019eau potable alimentant plusieurs quartiers de Casablanca, notamment Moulay Rachid, Sbata, Salmiya, Sidi Othmane et Lahraouiyine Nord. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le projet de loi de\nfinances (PLF) de l\u2019ann\u00e9e 2026...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026 incarne les efforts d\u00e9ploy\u00e9s par le Royaume pour consolider les fondements de la trajectoire du \u00ab Maroc \u00e9mergent \u00bb, \u00e0 m\u00eame de r\u00e9aliser un d\u00e9veloppement inclusif alliant efficacit\u00e9 \u00e9conomique, justice sociale et d\u00e9veloppement territorial int\u00e9gr\u00e9, a affirm\u00e9, jeudi \u00e0 la Chambre des repr\u00e9sentants, la ministre de l\u2019\u00c9conomie. [telquel.ma]\n-------------------------------------------------\nLe projet de loi de finances (PLF) 2026 traduit, selon la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, la volont\u00e9 de consolider les fondements d\u2019un \u00ab Maroc \u00e9mergent \u00bb articul\u00e9 autour de l\u2019efficacit\u00e9 \u00e9conomique, de la justice sociale et d\u2019un d\u00e9veloppement territorial int\u00e9gr\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Dans son discours \u00e0 la\nNation, le Souverain a salu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Dans son discours \u00e0 la Nation, le Souverain a salu\u00e9 l\u2019adoption par         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
