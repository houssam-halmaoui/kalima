tat net part du groupe (RNPG) agr\u00e9g\u00e9 de 29,6 milliards de dirhams, en hausse de 12,9%. [telquel.ma]\n-------------------------------------------------\nLes publications des r\u00e9sultats du premier semestre des soci\u00e9t\u00e9s cot\u00e9es \u00e0 la Bourse de Casablanca font ressortir une performance globalement positive, mais loin d\u2019\u00eatre homog\u00e8ne. [leseco.ma]\n-------------------------------------------------\nSelon l\u2019analyse de BMCE Capital Global Research (BKGR), le chiffre d\u2019affaires agr\u00e9g\u00e9 des 72 soci\u00e9t\u00e9s ayant publi\u00e9 leurs comptes atteint 189,6 milliards de dirhams, en hausse de 10,3%, tandis que leur r\u00e9sultat net part . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "En partenariat avec l\u2019Office National\nMarocain du Tourisme, Selectair, premier...", "mass": 5, "physics": false, "shape": "box", "title": "En partenariat avec l\u2019Office National Marocain du Tourisme, Selectair, premier r\u00e9seau d\u2019agences de v. [lematin.ma]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) accueille, du 30 septembre au 4 octobre 2026 \u00e0 Tamuda Bay, le premier r\u00e9seau d\u2019agences de voyage de Belgique, Selectair, pour son rendez-vous annuel. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) accueille, du 30 septembre au 4 octobre 2026 \u00e0 Tamuda Bay, le premier r\u00e9seau d\u2019agences de voyage de Belgique, Selectair, pour son rendez-vous annuel. \u00ab [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Un d\u00e9placement hautement symbolique, soutenu\npar Madrid, mais qui rappelle...", "mass": 5, "physics": false, "shape": "box", "title": "Un d\u00e9placement hautement symbolique, soutenu par Madrid, mais qui rappelle in\u00e9vitablement celui de Juan Carlos Ier en 2007, \u00e0 l\u2019origine d\u2019une grave crise diplomatique avec Rabat. [telquel.ma]\n-------------------------------------------------\nLe Palais royal espagnol a annonc\u00e9 un d\u00e9placement du roi Felipe VI et de la reine Letizia dans les deux pr\u00e9sides occup\u00e9s, premier voyage d\u2019un souverain espagnol dans ces territoires depuis celui de Juan Carlos en 2007. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Lors de son premier \u00e9change\nt\u00e9l\u00e9phonique avec un responsable \u00e9tranger...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de son premier \u00e9change t\u00e9l\u00e9phonique avec un responsable \u00e9tranger depuis sa prise de fonction \u00e0 la t\u00eate du gouvernement marocain, Fatima Zahra Mansouri a discut\u00e9, vendredi 2 octobre, des moyens de renforcer la coop\u00e9ration entre le Maroc et le Qatar avec le Premier ministre et ministre des Affaires \u00e9trang\u00e8res du Qatar, Cheikh Mohammed ben Abdulrahman ben Jassim Al Thani. [www.yabiladi.com]\n-------------------------------------------------\nLa cheffe du gouvernement du Royaume du Maroc, Fatima Ezzahra El Mansouri, s\u2019est entretenue vendredi 2 octobre par t\u00e9l\u00e9phone avec le Premier ministre et ministre des Affaires \u00e9trang\u00e8res du Qatar, Cheikh Mohammed bin Abdulrahman bin Jassim Al Thani, selon l\u2019Agence de presse qatarie (QNA). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Dans le cadre de ce\ndispositif, Cash Plus intervient en...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de ce dispositif, Cash Plus intervient en qualit\u00e9 d\u2019autorit\u00e9 d\u2019enregistrement d\u00e9l\u00e9gu\u         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
