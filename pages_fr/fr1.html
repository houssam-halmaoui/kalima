r rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u0027Office des changes. [www.lopinion.ma]\n-------------------------------------------------\nLes exportations du secteur des phosphates et d\u00e9riv\u00e9s se sont \u00e9lev\u00e9es \u00e0 pr\u00e8s de 87,14 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, en croissance de 13,8% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u0027Office des changes. [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit commercial a atteint plus de 328,8 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, en hausse de 20,4% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u2019Office des changes. [maroc-diplomatique.net]\n-------------------------------------------------\nLes exportations du secteur des phosphates et d\u00e9riv\u00e9s se sont \u00e9lev\u00e9es \u00e0 pr\u00e8s de 87,14 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, en croissance de 13,8% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u0027Office des changes. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts\n(DGI) vient de publier l\u2019\u00e9dition...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts (DGI) vient de publier l\u2019\u00e9dition 2026 du Code g\u00e9n\u00e9ral des imp\u00f4ts (CGI) qui a actualis\u00e9 la version de 2025, en introduisant les modifications pr\u00e9vues par la loi de finances n\u00b050-25 pour l\u2019ann\u00e9e budg\u00e9taire 2026, promulgu\u00e9e par le dahir n\u00b01-25-67 du 19 joumada II 1447 (10 d\u00e9cembre 2025). [telquel.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale des imp\u00f4ts (DGI) vient de publier l\u2019\u00e9dition 2                     communities[groupId].y += node.y;
