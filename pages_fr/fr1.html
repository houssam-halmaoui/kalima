it une nouvelle \u00e9tape dans son ouverture aux march\u00e9s internationaux avec la publication de ses premi\u00e8res notations financi\u00e8res attribu\u00e9es par. [lematin.ma]\n-------------------------------------------------\nTanger Med Port Authority (TMPA) a franchi une nouvelle \u00e9tape dans sa strat\u00e9gie d\u2019ouverture aux march\u00e9s internationaux en publiant, ce 23 juillet, ses notations financi\u00e8res attribu\u00e9es par Moody\u2019s Ratings et Standard \u0026 Poor\u2019s Global Ratings. [telquel.ma]\n-------------------------------------------------\nTMPA S.A. (Tanger Med Port Authority) franchit une nouvelle \u00e9tape dans sa strat\u00e9gie d\u2019ouverture aux march\u00e9s internationaux avec la publication de ses notations financi\u00e8res, attribu\u00e9es par les deux [www.challenge.ma]\n-------------------------------------------------\nUne nouvelle \u00e9tape d\u2019ouverture aux march\u00e9s internationaux s\u2019ouvre pour Tanger Med Port Authority (TMPA), avec la publication de ses notations financi\u00e8res Moody\u2019s Ratings et Standard \u0026 Poor\u2019s Global Ratings, rendues publiques ce jeudi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Parti Authenticit\u00e9 et Modernit\u00e9\n(PAM) franchit une nouvelle \u00e9tape...", "mass": 5, "physics": false, "shape": "box", "title": "Le Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) franchit une nouvelle \u00e9tape dans sa strat\u00e9gie de communication num\u00e9rique. [lematin.ma]\n-------------------------------------------------\nLe Parti Authenticit\u00e9 et Modernit\u00e9 (PAM) a annonc\u00e9, ce jeudi, le lancement d\u2019\u00ab AM+ MEDIA \u00bb, une nouvelle plateforme num\u00e9rique d\u00e9di\u00e9e \u00e0 l\u2019analyse, au d\u00e9cryptage de l\u2019actualit\u00e9 et \u00e0 la v\u00e9rification des faits. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le parcours des passagers dans\nles a\u00e9roports marocains franchit une...", "mass": 5, "physics": false, "shape": "box", "title": "Le parcours des passagers dans les a\u00e9roports marocains franchit une nouvelle \u00e9tape dans sa transformation num\u00e9rique. [lematin.ma]\n-------------------------------------------------\nAirports of Morocco introduit une carte d\u2019embarquement enti\u00e8rement num\u00e9rique, accessible directement depuis le smartphone des passagers. [www.challenge.ma]\n-------------------------------------------------\nAirports of Morocco g\u00e9n\u00e9ralise l\u0027utilisation de la carte d\u0027embarquement 100 % mobile, permettant aux voyageurs d\u0027acc\u00e9der aux diff\u00e9rents points de contr\u00f4le et \u00e0 l\u0027embarquement directement depuis leur smartphone, sans avoir \u00e0 pr\u00e9senter un document imprim\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nAirports of Morocco (anciennement Office national des A\u00e9roports \u2013 ONDA) a annonc\u00e9, jeudi, l\u0027introduction d\u0027une nouvelle fa\u00e7on de voyager en permettant aux passagers d\u0027utiliser une carte d\u0027embarquement enti\u00e8rement num\u00e9rique, accessible directement depuis leur smartphone. [leseco.ma]\n-------------------------------------------------\nAirports of Morocco (ONDA) g\u00e9n\u00e9ralise une carte d\u0027embarquement enti\u00e8rement digitale, accessible depuis un smartphone, afin de simplifier le parcours des passagers dans les a\u00e9roports du Royaume. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La croissance \u00e9conomique du Maroc\ndevrait \u00eatre port\u00e9e notamment par...", "mass": 5, "physics": false, "shape": "box", "title": "La croissance \u00e9conomique du Maroc devrait \u00eatre port\u00e9e notamment par les mesures proactives du gouvernement et l\u0027am\u00e9lioration des performances du secteur agricole, a expliqu\u00e9 Na. [lematin.ma]\n-------------------------------------------------\nSelon la ministre de l\u0027\u00c9conomie et des Finances, croissance devrait \u00eatre port\u00e9e notamment par les mesures proactives du gouvernement et l\u0027am\u00e9lioration des performances du secteur agricole. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Chambre de Commerce et\nd\u2019Industrie du Mali (CCIM) et...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre de Commerce et d\u2019Industrie du Mali (CCIM) et la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM), en partenariat avec le Conseil National du Patronat du Mali (CNPM), ont organis\u00e9, jeudi \u00e0 Bamako, le Forum d\u2019Affaires Mali-Maroc, en marge de la 4\u00e8me session de la Commission Mixte de Coop\u00e9ration Maroc-Mali. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9v\u00e9nement est organis\u00e9 par la Chambre de commerce et d\u2019industrie du Mali (CCIM) et la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), en partenariat avec le Conseil national du patronat du Mali (CNPM), indique la CGEM dans un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nLe Forum d\u0027Affaires Mali-Maroc, s\u0027est tenu \u00e0 Bamako, en marge de la 4\u00e8me session de la Commission Mixte de Coop\u00e9ration entre les deux pays partenaires. [www.lavieeco.com]\n-------------------------------------------------\nLa Chambre de Commerce et d\u2019Industrie du Mali (CCIM) et la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM), en partenariat avec le Conseil National du Patronat du Mali (CNPM), ont organis\u00e9 aujourd\u2019hui \u00e0 Bamako le Forum d\u2019Affaires Mali-Maroc, en marge de la 4\u00e8me session de la Commission Mixte de Coop\u00e9ration Maroc-Mali. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le d\u00e9cret adopt\u00e9 le 22\njuillet suspend \u00e0 nouveau les...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9cret adopt\u00e9 le 22 juillet suspend \u00e0 nouveau les droits d\u2019importation sur les ovins et les viandes rouges. [telquel.ma]\n-------------------------------------------------\nLors de sa r\u00e9union du mercredi, le Conseil de gouvernement a d\u00e9cid\u00e9 de lever les droits d\u2019importation sur les ovins et bovins vivants ainsi que sur les viandes rouges. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le consulat g\u00e9n\u00e9ral du Maroc\n\u00e0 Bologne a affirm\u00e9 continuer...", "mass": 5, "physics": false, "shape": "box", "title": "Le consulat g\u00e9n\u00e9ral du Maroc \u00e0 Bologne a affirm\u00e9 continuer de suivre, en \u00e9troite coordination avec l\u2019ambassade du Royaume \u00e0 Rome, l\u2019affaire du d\u00e9c\u00e8s du ressortissant marocain Abderrahim Fakir, survenu le 19 juillet \u00e0 Bologne lors d\u2019une intervention des forces de police italiennes. [telquel.ma]\n-------------------------------------------------\nLa consule g\u00e9n\u00e9rale du Maroc \u00e0 Bologne, Khadija Ndour, a rendu visite ce jeudi \u00e0 la famille d\u2019Abderrahim Fakir, un ressortissant marocain d\u00e9c\u00e9d\u00e9 le 19 juillet lors d\u2019une intervention polici\u00e8re en Italie. [www.yabiladi.com]\n-------------------------------------------------\nLa consule g\u00e9n\u00e9rale du Maroc \u00e0 Bologne, Khadija Ndour, s\u2019est rendue ce jeudi aupr\u00e8s de la famille d\u2019Abderrahim Fakir, citoyen marocain d\u00e9c\u00e9d\u00e9 le 19 juillet lors d\u2019une intervention polici\u00e8re muscl\u00e9e en Italie. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Groupe de la Banque\nafricaine de d\u00e9veloppement (BAD) et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Fonds d\u2019\u00e9quipement communal (FEC) ont sign\u00e9, mercredi \u00e0 Rabat, un deuxi\u00e8me accord de pr\u00eat de 150 millions d\u2019euros soit 1,65 milliard de dhs destin\u00e9 \u00e0 soutenir la dynamique d\u2019investissement des collectivit\u00e9s territoriales marocaines. [telquel.ma]\n-------------------------------------------------\nCe soutien vise \u00e0 booster les investissements des communes marocaines, comme le pr\u00e9cise un communiqu\u00e9 de la banque dat\u00e9 du 23 juillet. [www.yabiladi.com]\n-------------------------------------------------\nLe Groupe de la Banque africaine de d\u00e9veloppement (BAD) et le Fonds d\u2019\u00e9quipement communal (FEC) ont sign\u00e9, mercredi \u00e0 Rabat, un deuxi\u00e8me accord de pr\u00eat de 150 millions d\u2019euros destin\u00e9 \u00e0 soutenir la dynamique d\u2019investissement des collectivit\u00e9s territoriales marocaines. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "BANK OF AFRICA, \u00e0 travers\nsa filiale BANK OF AFRICA...", "mass": 5, "physics": false, "shape": "box", "title": "BANK OF AFRICA, \u00e0 travers sa filiale BANK OF AFRICA United Kingdom PLC, a dirig\u00e9 avec succ\u00e8s un pr\u00eat syndiqu\u00e9 international de 300 millions de dollars am\u00e9ricains, destin\u00e9 au financement de la construction de la route Lab\u00e9\u2013Banti\u2013Tougu\u00e9\u2013Fleuve Bafing, un axe strat\u00e9gique de 160 kilom\u00e8tres inscrit dans le Plan de d\u00e9ve         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();

                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
