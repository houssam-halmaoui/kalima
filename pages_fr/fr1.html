me, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lavieeco.com]\n-------------------------------------------------\nDe fortes rafales de vent, des chutes de neige \u00e0 partir de 1500m, des pluies et averses orageuses fortes et un temps froid sont pr\u00e9vus, de lundi \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Doha Lkasmi est nomm\u00e9e au\nposte de directrice g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "Doha Lkasmi est nomm\u00e9e au poste de directrice g\u00e9n\u00e9rale de NSI Maroc, l\u2019agence globale d\u2019influence du groupe fran\u00e7ais ADIT, leader europ\u00e9en de l\u2019intelligence strat\u00e9gique et de l\u2019accompagnement \u00e0 [www.challenge.ma]\n-------------------------------------------------\nNSI, l\u2019agence globale d\u2019influence du groupe ADIT, leader europ\u00e9en de l\u2019intelligence strat\u00e9gique et de l\u2019accompagnement \u00e0 l\u2019international, annonce la nomination de Doha Lkasmi au poste de directrice g\u00e9n\u00e9rale de NSI Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le secteur du tourisme marocain\na enregistr\u00e9 une performance exceptionnelle...", "mass": 5, "physics": false, "shape": "box", "title": "Le secteur du tourisme marocain a enregistr\u00e9 une performance exceptionnelle en 2025, avec des recettes en devises qui ont atteint \u00e0 fin d\u00e9cembre 138 milliards de dirhams (MMDH), en hausse de 21% par rapport \u00e0 2024, indique le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [aujourdhui.ma]\n-------------- com]\n-------------------------------------------------\nL\u2019ex\u00e9cution de la loi de finances (LF) \u00e0 fin d\u00e9cembre 2025, laisse apparaitre un solde budg\u00e9taire n\u00e9gatif de 61,6 milliards de dirhams (MMDH), selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "\"La CAF est d\u00e9termin\u00e9e \u00e0\npr\u00e9server l\u2019int\u00e9grit\u00e9, la r\u00e9putation et...", "mass": 5, "physics": false, "shape": "box", "title": "\"La CAF est d\u00e9termin\u00e9e \u00e0 pr\u00e9server l\u2019int\u00e9grit\u00e9, la r\u00e9putation et la comp\u00e9titivit\u00e9 mondiale du football africain\" a affirm\u00e9 le pr\u00e9sident de la CAF au d\u00e9but de son intervention publi\u00e9e sur le site web officiel de l\u2019instance africaine, ce vendredi. [www.lavieeco.com]\n-------------------------------------------------\nLe Pr\u00e9sident de la Conf\u00e9d\u00e9ration Africaine de Football (CAF), Patrice Motsepe, a r\u00e9affirm\u00e9 la d\u00e9termination sans concession de l\u2019instance footballistique \u00e0 pr\u00e9server et renforcer l\u2019int\u00e9grit\u00e9, la r\u00e9putation et la comp\u00e9titivit\u00e9 mondiale du football africain et des comp\u00e9titions de la CAF. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La France est d\u00e9termin\u00e9e \u00e0\n\u00e9tablir un nouveau trait\u00e9 bilat\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "La France est d\u00e9termin\u00e9e \u00e0 \u00e9tablir un nouveau trait\u00e9 bilat\u00e9ral avec le Maroc dot\u00e9 d\u0027une forte dimension parlementaire visant \u00e0 renforcer davantage les relations existantes entre les deux pays ont affirm\u00e9, vendredi \u00e0 Rabat, le pr\u00e9sident du S\u00e9         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                scrollUp.className = 'scroll-up';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
