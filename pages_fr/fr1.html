"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Une proposition saugrenue qui en\ndit long sur le d\u00e9ni...", "mass": 5, "physics": false, "shape": "box", "title": "Une proposition saugrenue qui en dit long sur le d\u00e9ni de r\u00e9alit\u00e9 dans lequel sombre le r\u00e9gime alg\u00e9rien qui cherche \u00e0 tout prix \u00e0 \u00e9chapper aux n\u00e9gociations en d\u00e9pit du verdict onusien. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie est pr\u00eate \u00e0 \u201csoutenir\u201d dans le cadre de l\u2019ONU \u201ctoute initiative de m\u00e9diation\u201d entre les s\u00e9paratistes du Front Polisario et le Maroc afin de trouver une solution au conflit du Sahara, a indiqu\u00e9 mardi \u00e0 Alger le chef de la diplomatie alg\u00e9rienne. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Royaume du Maroc abritera,\njeudi \u00e0 Rabat, la Conf\u00e9rence...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc abritera, jeudi \u00e0 Rabat, la Conf\u00e9rence minist\u00e9rielle africaine sur le D\u00e9sarmement, la D\u00e9mobilisation et la R\u00e9int\u00e9gration (DDR) des enfants soldats, sous le th\u00e8me \"Construire des voies durables pour les enfants touch\u00e9s par les conflits arm\u00e9s\". [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc abritera, jeudi \u00e0 Rabat, la Conf\u00e9rence minist\u00e9rielle africaine sur le D\u00e9sarmement, la D\u00e9mobilisation et la R\u00e9int\u00e9gration (DDR) des enfants soldats, sous le th\u00e8me \u00ab Construire des voies durables pour les enfants touch\u00e9s par les conflits arm\u00e9s \u00bb. [telquel.ma]\n-------------------------------------------------\nLe Royaume du Maroc abritera, jeudi \u00e0 Rabat, la Conf\u00e9rence minist\u00e9rielle africaine sur le D\u00e9sarmement, la D\u00e9mobilisation et la R\u00e9int\u00e9gration (DDR) des enfants soldats, sous le th\u00e8me \"Construire des voies durables pour les enfants touch\u00e9s par les conflits arm\u00e9s\". [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc accueillera, jeudi \u00e0 Rabat, la Conf\u00e9rence minist\u00e9rielle africaine sur le D\u00e9sarmement, la D\u00e9mobilisation et la R\u00e9int\u00e9gration (DDR) des enfants soldats, plac\u00e9e sous le th\u00e8me \u00ab Construire des voies durables pour les enfants touch\u00e9s par les conflits arm\u00e9s \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le s\u00e9lectionneur national Walid Regragui\na affirm\u00e9, mardi soir \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national Walid Regragui a affirm\u00e9, mardi soir \u00e0 Tanger, que l\u2019\u00e9quipe nationale dispose d\u2019un \u00e9tat d\u2019esprit \u00e9lev\u00e9 et d\u2019un bon groupe pour aborder la prochaine Coupe d\u2019Afrique des Nations (CAN), qui se d\u00e9roulera au Maroc. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national Walid Regragui a affirm\u00e9, mardi soir \u00e0 Tanger, que le Maroc a un \u00e9tat d\u2019esprit \u00e9lev\u00e9 et un bon groupe pour aborder la Coupe d\u2019Afrique des nations (CAN 2025) \u00e0 domicile. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le pr\u00e9sident de la Commission\nde l\u0027UA a mis en...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Commission de l\u0027UA a mis en avant l\u2019engagement ind\u00e9fectible du Maroc en faveur de l\u2019int\u00e9gration africaine et de la transformation \u00e9conomique. [www.lavieeco.com]\n-------------------------------------------------\nLe pr\u00e9sident de la Commission de l\u2019Union Africaine, Mahmoud Ali Youssouf, a salu\u00e9, mardi, le r\u00f4le actif du Maroc et ses contributions continues au sein de l\u2019Union, notamment en faveur de la promotion de la paix, du d\u00e9veloppement et de la coop\u00e9ration r\u00e9gionale. [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc c\u00e9l\u00e8bre ses 70 ans d\u2019ind\u00e9pendance en consolidant son r\u00f4le dans la paix, le d\u00e9veloppement et la coop\u00e9ration en Afrique, un r\u00f4le pleinement reconnu par l\u2019Union africaine, qui voit en lui un partenaire cl\u00e9 pour le continent. [maroc-diplomatique.net]\n-------------------------------------------------\nLe r\u00f4le actif du Maroc au sein de l\u2019Union africaine (UA) dans la promotion de la paix, du d\u00e9veloppement et de la coop\u00e9ration r\u00e9gionale a \u00e9t\u00e9 mis en avant, mardi \u00e0 Addis-Abeba, par plusieurs responsables de l\u2019organisation panafricaine, \u00e0 l\u2019occasion notamment de la c\u00e9l\u00e9bration du 70e anniversaire de la F\u00eate de l\u2019ind\u00e9pendance du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Al Barid Bank lance, en\npartenariat avec Visa, la carte...", "mass": 5, "physics": false, "shape": "box", "title": "Al Barid Bank lance, en partenariat avec Visa, la carte Visa Business, destin\u00e9e aux professionnels et TPE. [leseco.ma]\n-------------------------------------------------\nCette initiative s\u2019inscrit dans le cadre du partenariat strat\u00e9gique liant les deux institutions et accompagne le positionnement d\u2019Al Barid Bank sur le segment professionnel et entrepreneurial. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", " nger, Sering Modou Njie, a r\u00e9it\u00e9r\u00e9, mercredi \u00e0 Rabat, son soutien constant \u00e0 la souverainet\u00e9 du Maroc sur le Sahara, se f\u00e9licitant vivement de l\u2019adoption par le Conseil de s\u00e9curit\u00e9 des Nations unies, de la r\u00e9solution . [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue gambien, Sering Modou Njie, ont r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, la d\u00e9termination du Maroc et de la Gambie \u00e0 consolider la coop\u00e9ration bilat\u00e9rale dans plusieurs domaines. [atlasinfo.fr]\n-------------------------------------------------\nLa Gambie par la voix de son ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration internationale et des Gambiens \u00e0 l\u2019\u00e9tranger, Sering Modou Njie, a r\u00e9it\u00e9r\u00e9, mercredi \u00e0 Rabat, son soutien constant \u00e0 la souverainet\u00e9 du Maroc sur le Sahara, se f\u00e9licitant vivement de l\u2019adoption par le Conseil de s\u00e9curit\u00e9 des Nations unies, de la r\u00e9solution [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La Pr\u00e9sidence du Minist\u00e8re public\na lanc\u00e9, mercredi, un nouveau...", "mass": 5, "physics": false, "shape": "box", "title": "La Pr\u00e9sidence du Minist\u00e8re public a lanc\u00e9, mercredi, un nouveau service num\u00e9rique visant \u00e0 renforcer la communication entre les parquets pr\u00e8s des tribunaux du Royaume et les usagers, dans le cadre des efforts en vue d\u0027am\u00e9liorer la qualit\u00e9 des prestations du Parquet g\u00e9n\u00e9ral. [www.lopinion.ma]\n-------------------------------------------------\nLa pr\u00e9sidence du Minist\u00e8re public a lanc\u00e9, mercredi, un nouveau service nu <script>

    }

    // Cacher la tooltip quand on clique ailleurs

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
