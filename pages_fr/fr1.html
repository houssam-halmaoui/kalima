 royale marocaine de football. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national Walid Regragui a d\u00e9voil\u00e9, jeudi, une liste de 28 joueurs, dont 2 r\u00e9servistes, retenus en pr\u00e9vision de la Coupe d\u2019Afrique des nations (CAN) de football qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, a annonc\u00e9 la F\u00e9d\u00e9ration royale marocaine de football. [www.lavieeco.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a affirm\u00e9 que le choix des joueurs de l\u2019\u00e9quipe nationale qui prendront part \u00e0 la Coupe d\u2019Afrique des Nations (CAN) au Maroc est bas\u00e9 sur des crit\u00e8res objectifs. [maroc-diplomatique.net]\n-------------------------------------------------\nLe s\u00e9lectionneur national Walid Regragui a d\u00e9voil\u00e9, ce jeudi, une liste de 28 joueurs, dont 2 r\u00e9servistes, retenus en pr\u00e9vision de la Coupe d\u2019Afrique des nations (CAN) de football qui se tiendra du 21 d\u00e9cembre au 18 janvier prochain au Maroc, a annonc\u00e9 la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Salim Raiss a \u00e9t\u00e9 nomm\u00e9\nDirecteur G\u00e9n\u00e9ral Maroc pour l\u2019ensemble...", "mass": 5, "physics": false, "shape": "box", "title": "Salim Raiss a \u00e9t\u00e9 nomm\u00e9 Directeur G\u00e9n\u00e9ral Maroc pour l\u2019ensemble des entit\u00e9s d\u2019AGL (Africa Global Logistics) au Maroc. [www.challenge.ma]\n-------------------------------------------------\nIl a pour mission de piloter le d\u00e9veloppement des activit\u00e9s du groupe et de renforcer sa position sur un march\u00e9 jug\u00e9 strat\u00e9gique. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Des chutes de neige \u00e0\npartir de 1 400 m...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1 400 m et de fortes pluies parfois orageuses sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nDans un bulletin d\u2019alerte de niveau de vigilance orange, la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pr\u00e9voir des chutes de neige allant jusqu\u2019\u00e0 50 cm, ainsi que de fortes pluies parfois orageuses. [www.lavieeco.com]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Ev\u00e8nement En marge de la\nCoupe d\u2019Afrique des Nations (CAN)...", "mass": 5, "physics": false, "shape": "box", "title": "Ev\u00e8nement En marge de la Coupe d\u2019Afrique des Nations (CAN) 2025, le Maroc accueille un \u00e9v\u00e9nement d\u2019envergure continentale avec l\u2019organisation de Africa Sports Expo 2025 du 18 au 20 d\u00e9cembre \u00e0 Casablanca. [aujourdhui.ma]\n-------------------------------------------------\n\u00c0 la veille de la Coupe d\u2019Afrique des nations, l\u2019Africa Sports Expo 2025 r\u00e9unira \u00e0 Casablanca, du 18 au 20 d\u00e9cembre, 180 exposants de 20 pays, 100 conf\u00e9renciers et une trentaine d\u2019animations. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Marjane d\u00e9croche une nouvelle fois\nle titre de \u00ab \u00c9lu...", "mass": 5, "physics": false, "shape": "box", "title": "Marjane d\u00e9croche une nouvelle fois le titre de \u00ab \u00c9lu Service Client de l\u2019Ann\u00e9e Maroc 2026 \u00bb dans la cat\u00e9gorie Grande Distribution, consolidant ainsi sa position de r\u00e9f\u00e9rence en mati\u00e8re d\u2019exp\u00e9rience client. [www.lavieeco.com]\n-------------------------------------------------\nMarjane d\u00e9croche une nouvelle fois le titre de \u00ab \u00c9lu Service Client de l\u2019Ann\u00e9e Maroc 2026 \u00bb dans la cat\u00e9gorie Grande Distribution, consolidant ainsi sa position de r\u00e9f\u00e9rence en mati\u00e8re d\u2019exp\u00e9rience client. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Dans un communiqu\u00e9, Holmarcom Finance\nCompany pr\u00e9cise \u00eatre en n\u00e9gociation...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, Holmarcom Finance Company pr\u00e9cise \u00eatre en n\u00e9gociation avec BNP Paribas pour acqu\u00e9rir sa participation de 67% dans le capital de la BMCI. [www.lavieeco.com]\n-------------------------------------------------\nHolmarcom Finance Company confirme des discussions exclusives et pr\u00e9liminaires avec BNP Paribas en vue d\u2019une \u00e9ventuelle acquisition de sa participation de 67 % dans le capital de la BMCI. [leseco.ma]\n-------------------------------------------------\nEn r\u00e9action aux informations circulant sur le march\u00e9, Holmarcom Finance Company a publi\u00e9 un communiqu\u00e9 concernant que.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "D\u2019une port\u00e9e scientifique et humaine\nmajeure, cet \u00e9v\u00e9nement s\u2019inscrit en...", "mass": 5, "physics": false, "shape": "box", "title": "D\u2019une port\u00e9e scientifique et humaine majeure, cet \u00e9v\u00e9nement s\u2019inscrit en droite ligne de la vision \u00e9clair\u00e9e de Sa Majest\u00e9 le Roi Mohammed VI, dont l\u2019action ne cesse de promouvoir u. [lematin.ma]\n-------------------------------------------------\nCet \u00e9v\u00e8nement a \u00e9t\u00e9 marqu\u00e9 par a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u0027une convention portant sur le renforcement de la coop\u00e9ration entre la Fondation Lalla Asmaa et la Fondation Mohammed VI des Sciences et de la Sant\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Asmaa, Pr\u00e9sidente de la Fondation Lalla Asmaa, a pr\u00e9sid\u00e9, vendredi \u00e0 l\u2019Universit\u00e9 Mohammed VI des Sciences et de la Sant\u00e9 \u00e0 Rabat, la c\u00e9r\u00e9monie d\u2019ouverture du 1er Congr\u00e8s africain sur l\u2019implantation cochl\u00e9aire de l\u2019enfant, un rendez-vous majeur dans la structuration d\u2019un v\u00e9ritable hub africain consacr\u00e9 \u00e0 la surdit\u00e9 infantile [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec\nles cinq centrales syndicales repr\u00e9sent\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec les cinq centrales syndicales repr\u00e9sent\u00e9es au sein de Marsa Maroc, \u00e0 savoir l\u2019UMT, l\u2019ODT, la CDT, la FDT et l\u2019UGTM. [lematin.ma]\n-------------------------------------------------\nL\u2019accord a \u00e9t\u00e9 obtenu apr\u00e8s plusieurs rounds de n\u00e9gociation men\u00e9s dans un esprit de transparence, d\u2019\u00e9coute mutuelle et de responsabilit\u00e9 partag\u00e9e. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Maroc et la Banque\neurop\u00e9enne pour la reconstruction et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u0027euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \"Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III\". [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (1.5 milliards de dirhams), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [telquel.ma]\n-------------------------------------------------\nCe nouveau financement contribuera \u00e0 la construction dun r\u00e9seau de distribution pour irriguer 20 000 hectares sur la plaine du Sa\u00efss, portant le co\u00fbt total du projet \u00e0 252 millions deuros (environ 2,8 milliards de MAD), apr\u00e8s les phases pr\u00e9c\u00e9dentes financ\u00e9es en 2017 et 2020. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [au         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
