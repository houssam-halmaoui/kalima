a...", "mass": 5, "physics": false, "shape": "box", "title": "Le parti fran\u00e7ais d\u2019extr\u00eame droite RN a remis sur la table son projet d\u2019interdire le port du voile islamique en public, une proposition critiqu\u00e9e de toute part, \u00e0 la fois comme une atteinte \u00e0 la libert\u00e9 religieuse et pour son applicabilit\u00e9. [telquel.ma]\n-------------------------------------------------\nCette r\u00e9action fait suite aux r\u00e9centes sorties du d\u00e9put\u00e9 du Rassemblement national (RN), Jean-Philippe Tanguy, qui a affirm\u00e9 soutenir l\u2019application de cette mesure si Marine Le Pen est \u00e9lue aux prochaines pr\u00e9sidentielles. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u2019ONSSA d\u00e9ploie, du 1er au\n30 septembre 2026, une campagne...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ONSSA d\u00e9ploie, du 1er au 30 septembre 2026, une campagne gratuite de vaccination antirabique pour les chiens et chats adopt\u00e9s en milieu urbain, en partenariat avec les cliniques v\u00e9t\u00e9rinaires priv\u00e9es et l\u2019Ordre national des v\u00e9t\u00e9rinaires. [telquel.ma]\n-------------------------------------------------\nRage La campagne \u00abAction Stop Rage\u00bb qui se d\u00e9roule du 1er au 30 septembre permet aux propri\u00e9taires des chiens et des chats de faire vacciner gratuitement leurs animaux aupr\u00e8s des v\u00e9t\u00e9rinaires participant \u00e0 cette op\u00e9ration. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le flux net des investissements\ndirects \u00e9trangers (IDE) au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Le flux net des investissements directs \u00e9trangers (IDE) au Maroc s\u2019est \u00e9tabli \u00e0 29,473 milliards de dirhams (MMDH) au terme des sept premiers mois de l\u2019ann\u00e9e 2026, en hausse de 58,5% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLe d\u00e9ficit commercial a atteint 244,69 milliards de dirhams (MMDH) au terme des sept premiers mois de 2026, en hausse de 26,5% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon l\u2019Office des changes. [www.lereporter.ma]\n-------------------------------------------------\nCe d\u00e9ficit est d\u00fb \u00e0 la hausse des importations de biens (+15,9% ou +74,481 MMDH) \u00e0 544,045 MMDH, plus importante que celle des exportations (+8,4% ou +23,174 MMDH) \u00e0 299,34 MMDH, e. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le Marrakech Short Film Festival\n(MARRAKECHsFF) a d\u00e9voil\u00e9 la s\u00e9lection...", "mass": 5, "physics": false, "shape": "box", "title": "Le Marrakech Short Film Festival (MARRAKECHsFF) a d\u00e9voil\u00e9 la s\u00e9lection officielle de sa 6e \u00e9dition, pr\u00e9vue du 25 au 30 septembre 2026 \u00e0 Marrakech. [telquel.ma]\n-------------------------------------------------\nD\u00e9veloppement international Ce nouveau rendez-vous qui a re\u00e7u plus de 400 courts m\u00e9trages provenant de plus de 90 pays est destin\u00e9 \u00e0 mettre en avant une nouvelle g\u00e9n\u00e9ration de cin\u00e9astes et de talents marocains, tout en leur offrant une plateforme de visibilit\u00e9 et de rencontre avec des professionnels et institutions venus de diff\u00e9rentes r\u00e9gions du . [aujourdhui.ma]\n-------------------------------------------------\nLe Marrakech Short Film Festival (MARRAKECHsFF) tiendra sa 6e \u00e9dition du 25 au 30 septembre 2026 \u00e0 Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Ainsi, une vague de chaleur\navec des temp\u00e9ratures oscillant entre...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 42 et 45 \u00b0C concerneront, de mardi \u00e0 vendredi, les provinces d\u2019Aousserd, Oued Ed-Dahab, Boujdour, Assa-Zag, Es-Semara, Tata et Zagora, a. [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur et des averses orageuses avec gr\u00eale et rafale de vent sous orages sont attendues, de mercredi \u00e0 vendredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur et des averses orageuses avec gr\u00eale et rafale de vent sous orages sont attendues, de mercredi \u00e0 vendredi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Conseil \u00e9conomique, social et\nenvironnemental (CESE) a tenu, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil \u00e9conomique, social et environnemental (CESE) a tenu, lundi 31 ao\u00fbt, la 185e session ordinaire de son Assembl\u00e9e g\u00e9n\u00e9rale, sous la pr\u00e9sidence de M. Abdelkader Amara, pr\u00e9sident du Conseil. [telquel.ma]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) a adopt\u00e9 deux nouveaux avis consacr\u00e9s respectivement \u00e0 la place du douar dans le d\u00e9veloppement rural et au renforcement de la lutte contre les atteintes \u00e0 l\u2019environnement au Maroc. [lnt.ma]\n-------------------------------------------------\nDiagnostic Le Conseil \u00e9conomique, social et environnemental (CESE), r\u00e9uni le 31 ao\u00fbt \u00e0 Rabat, a adopt\u00e9 deux avis consacr\u00e9s \u00e0 la place du douar dans le d\u00e9veloppement rural et la lutte contre les atteintes \u00e0 l\u2019environnement. [aujourdhui.ma]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) a tenu, lundi, la 185e session ordinaire de son assembl\u00e9e g\u00e9n\u00e9rale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le nombre de visiteurs \u00e0\nla destination \u00ab Maroc \u00bb...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre de visiteurs \u00e0 la destination \u00ab Maroc \u00bb a avoisin\u00e9 les 9,4 millions de personnes au terme du premier semestre de 2026, en accroissement de 6% en glissement annuel, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [telquel.ma]\n-------------------------------------------------\nLe nombre de visiteurs \u00e0 la destination \"Maroc\" a avoisin\u00e9 les 9,4 millions de personnes au terme du premier semestre de 2026, en accroissement de 6% en glissement annuel, selon la Direction des \u00e9tudes et des pr\u00e9visions financi\u00e8res (DEPF). [leseco.ma]\n-------------------------------------------------\nLe nombre de visiteurs au Maroc a avoisin\u00e9 les 9,4 millions de personnes au terme du premier semestre de 2026, en accroissement de 6% en glissement annuel, selon la Direction des Etudes et des Pr\u00e9visions Financi\u00e8res (DEPF). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Le Maroc et lArgentine ont\nun potentiel \u00e9conomique capable de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et lArgentine ont un potentiel \u00e9conomique capable de hisser leurs relations bilat\u00e9rales au rang ent \u00e0 la m\u00eame p\u00e9riode en 2025. [leseco.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires (CA) consolid\u00e9 de la soci\u00e9t\u00e9 nationale des Autoroutes du Maroc (ADM) a atteint plus de 2,96 milliards de dirhams (MMDH) \u00e0 fin juin 2026, en croissance de 2% comparativement \u00e0 la m\u00eame p\u00e9riode en 2025. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "L\u0027ambassadeur repr\u00e9sentant permanent du Maroc\naupr\u00e8s de l\u0027ONU, Omar Hilale,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u0027ONU, Omar Hilale, a appel\u00e9 mardi \u00e0 Belgrade le Mouvement des Non-Align\u00e9s \u00e0 s\u0027adapter aux d\u00e9fis du XXIe si\u00e8cle, tout en r\u00e9affirmant l\u0027engagement du Royaume en faveur de la coop\u00e9ration Sud-Sud, de la cause palestinienne et de la stabilisation de Gaza. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU, Omar Hilale, a appel\u00e9, mardi \u00e0 Belgrade, le Mouvement des Non-Align\u00e9s (NAM) \u00e0 \u00ab s\u2019affranchir des approches pass\u00e9istes et \u00e0 s\u2019adapter aux d\u00e9fis multidimensionnels du XXIe si\u00e8cle \u00bb. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Inscrit en 2008 par l\u2019UNESCO\nsur la liste repr\u00e9sentative du...", "mass": 5, "physics": false, "shape": "box", "title": "Inscrit en 2008 par l\u2019UNESCO sur la liste repr\u00e9sentative du patrimoine culturel immat\u00e9riel de l\u2019humanit\u00e9, le Moussem met en avant la richesse et de la diversit\u00e9 des . [lnt.ma]\n-------------------------------------------------\nValo             setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
