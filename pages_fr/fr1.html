ations 2025 entre le Maroc et le S\u00e9n\u00e9gal \u00e0 la fin du mois de novembre 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Une source proche de Fatima\nSaadi, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e du...", "mass": 5, "physics": false, "shape": "box", "title": "Une source proche de Fatima Saadi, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e du Logement et de la Politique de la ville, a d\u00e9menti les informations relay\u00e9es par certaines plateformes de r\u00e9seaux sociaux et certains m\u00e9dias faisant \u00e9tat d\u2019un jugement rendu \u00e0 son encontre dans le cadre d\u2019une affaire remontant \u00e0 une dizaine d\u2019ann\u00e9es. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 la suite de la circulation, dans certains m\u00e9dias et sur les r\u00e9seaux sociaux, d\u2019informations relatives \u00e0 une ancienne proc\u00e9dure judiciaire concernant Fatima Saadi, le Parti authen. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette nouvelle identit\u00e9 intervient dans\nle prolongement du rapprochement avec...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle identit\u00e9 intervient dans le prolongement du rapprochement avec Allianz Maroc, effectif depuis le 2 juil. [lematin.ma]\n-------------------------------------------------\nSanlam Maroc adopte la marque SanlamAllianz, dans le prolongement du rapprochement avec Allianz Maroc entr\u00e9 en vigueur le 2 juillet 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Prestigia a organis\u00e9, le 17\noctobre 2026, une soir\u00e9e musicale...", "mass": 5, "physics": false, "shape": "box", "title": "Prestigia a organis\u00e9, le 17 octobre 2026, une soir\u00e9e musicale pour marquer le lancement de La Lagune, nouvelle tranche r\u00e9sidentielle du projet Rabat Riviera Golf Living, situ\u00e9 entr. [lematin.ma]\n-------------------------------------------------\nSamedi 17 octobre, Prestigia a organis\u00e9 une soir\u00e9e exceptionnelle r\u00e9unissant plus de 100 musiciens issus des sept ensembles de lAnthologie de lart de l\u00c2la, aux c\u00f4t\u00e9s de 23 artistes internationaux repr\u00e9sentant 13 pays. [www.yabiladi.com]\n-------------------------------------------------\nPrestigia a c\u00e9l\u00e9br\u00e9, le 17 octobre 2026, le lancement de La Lagune, nouvelle tranche r\u00e9sidentielle en front de mer de Rabat Riviera Golf Living, \u00e0 travers un \u00e9v\u00e9nement exceptionnel consacr\u00e9 \u00e0 la musique andalouse marocaine. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le financement des tr\u00e8s petites,\npetites et moyennes entreprises (TPME)...", "mass": 5, "physics": false, "shape": "box", "title": "Le financement des tr\u00e8s petites, petites et moyennes entreprises (TPME) et les conditions n\u00e9cessaires \u00e0 leur d\u00e9veloppement ont \u00e9t\u00e9 au centre des \u00e9changes auxquels a particip\u00e9 Bank. [lematin.ma]\n-------------------------------------------------\nBank of Africa a pris part, samedi 17 octobre \u00e0 Casablanca, au forum \u00ab Entrepreneurs en mouvement : Transformer les priorit\u00e9s en actions \u00bb, organis\u00e9 par la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Procureur g\u00e9n\u00e9ral du Roi\npr\u00e8s la Cour de Cassation,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Procureur g\u00e9n\u00e9ral du Roi pr\u00e8s la Cour de Cassation, Pr\u00e9sident du Minist\u00e8re public, Hicham Balaoui, a soulign\u00e9 lundi \u00e0 F\u00e8s, que l\u2019approche de l\u2019intelligence artificielle ne devrait pas se limiter \u00e0 l\u2019exploitation de ses capacit\u00e9s techniques, mais doit \u00e9galement reposer sur la compr\u00e9hension de ses limites et la d\u00e9finition de garde-fous \u00e9thiques. [telquel.ma]\n-------------------------------------------------\nL\u2019approche de l\u2019intelligence artificielle (IA) au sein de l\u2019institution judiciaire ne saurait se cantonner \u00e0 la simple exploitation de ses capacit\u00e9s techniques, elle exige avant tout une compr\u00e9hension rigoureuse de ses limites et la mise en place de garde-fous \u00e9thiques infranchissables. [fr.hespress.com]\n-------------------------------------------------\nLe Procureur g\u00e9n\u00e9ral du Roi pr\u00e8s la Cour de Cassation, Pr\u00e9sident du Minist\u00e8re public, Hicham Balaoui, a soulign\u00e9 lundi \u00e0 F\u00e8s, que l\u2019approche de l\u2019intelligence artificielle ne devrait pas se limiter \u00e0 l\u2019exploitation de ses capacit\u00e9s techniques, mais doit \u00e9galement reposer sur la compr\u00e9hension de ses limites et la d\u00e9finition de garde-fous \u00e9thiques. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est\nqualifi\u00e9e pour la phase finale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est qualifi\u00e9e pour la phase finale de la prochaine \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN), pr\u00e9vue au S\u00e9n\u00e9gal du 28 novembre au 6 d\u00e9cembre 2026. [telquel.ma]\n-------------------------------------------------\nL\u00e9quipe marocaine de beach soccer sest qualifi\u00e9e pour la phase finale de la Coupe dAfrique des Nations, qui se tiendra au S     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
