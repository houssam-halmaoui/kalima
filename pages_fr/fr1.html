: "dot", "size": 47, "title": "S\u00e9curit\u00e9 hydrique : le Maroc acc\u00e9l\u00e8re sa riposte face au d\u00e9fi climatique\nSource: maroc-diplomatique.net", "url": "https://maroc-diplomatique.net/securite-hydrique-le-maroc-accelere-sa-riposte-face-au-defi-climatique/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 4, "id": 261, "label": "Ciment: les livraisons progressent de...", "shape": "dot", "size": 47, "title": "Ciment: les livraisons progressent de 4,53% en octobre\nSource: leseco.ma", "url": "https://leseco.ma/business/ciment-les-livraisons-progressent-de-453-en-octobre.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 5, "id": 270, "label": "Nizar Baraka pr\u00e9sente un plan...", "shape": "dot", "size": 47, "title": "Nizar Baraka pr\u00e9sente un plan de pr\u00e9vention contre les inondations\nSource: lnt.ma", "url": "https://lnt.ma/nizar-baraka-presente-un-plan-de-prevention-contre-les-inondations/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le gouvernement a d\u00e9cid\u00e9 de\npoursuivre le versement de l\u2019aide...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement a d\u00e9cid\u00e9 de poursuivre le versement de l\u2019aide exceptionnelle et directe destin\u00e9e aux professionnels du transport routier de personnes et de marchandises, dans le cadre des mesures d\u2019accompagnement visant \u00e0 att\u00e9nuer les effets de la hausse persistante des prix des produits p\u00e9troliers sur les march\u00e9s internationaux et son impact sur le march\u00e9 national. [fr.hespress.com]\n-------------------------------------------------\nLe gouvernement a d\u00e9cid\u00e9 de poursuivre l\u2019octroi du soutien exceptionnel et direct destin\u00e9 aux professionnels du transport routier des personnes et des marchandises, \u00e0 travers le lancement d\u2019une nouvelle tranche suppl\u00e9mentaire couvrant une p\u00e9riode de 15 jours. [telquel.ma]\n-------------------------------------------------\nLe gouvernement marocain a d\u00e9cid\u00e9, le 2 novembre \u00e0 Rabat, de reconduire le soutien exceptionnel et direct accord\u00e9 aux professionnels du transport routier de voyageurs et de marchandises, \u00e0 travers une nouvelle tranche couvrant 15 jours, afin de limiter l\u2019impact de la hausse persistante des produits p\u00e9troliers. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Les Nations unies ont d\u00e9voil\u00e9\nles d\u00e9tails de l\u2019op\u00e9ration de...", "mass": 5, "physics": false, "shape": "box", "title": "Les Nations unies ont d\u00e9voil\u00e9 les d\u00e9tails de l\u2019op\u00e9ration de liquidation de la Mission des Nations unies pour l\u2019organisation d\u2019un r\u00e9f\u00e9rendum au Sahara (MINURSO), dont la phase op\u00e9rationnelle a d\u00e9but\u00e9 le 1er novembre. [fr.hespress.com]\n-------------------------------------------------\nApr\u00e8s le non-renouvellement du mandat de la Minurso (la mission de l\u2019ONU au Sahara) par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, le Secr\u00e9taire g\u00e9n\u00e9ral des Nations Unies Antonio Guterres prend acte de la cessation de ses op\u00e9rations. [telquel.ma]\n-------------------------------------------------\nDimanche 1er novembre, les Nations Unies ont officiellement annonc\u00e9 la cessation des op\u00e9rations de la Mission, apr\u00e8s sa non-reconduction par le Conseil de s\u00e9curit\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Les membres des deux Chambres\ndu Parlement ont salu\u00e9 hautement,...", "mass": 5, "physics": false, "shape": "box", "title": "Les membres des deux Chambres du Parlement ont salu\u00e9 hautement, lundi, le contenu du communiqu\u00e9 du Cabinet Royal du 30 octobre, publi\u00e9 \u00e0 l\u2019issue de la r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU sur la question du Sahara marocain ainsi que les efforts d\u00e9ploy\u00e9s par la diplomatie marocaine pour clore d\u00e9finitivement ce conflit artificiel. [fr.hespress.com]\n-------------------------------------------------\nLes membres des deux Chambres du Parlement ont salu\u00e9 hautement, lundi, le contenu du communiqu\u00e9 du Cabinet Royal du 30 octobre, publi\u00e9 \u00e0 l\u2019issue de la r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU sur la question du Sahara marocain ainsi que les efforts d\u00e9ploy\u00e9s par la diplomatie marocaine pour clore d\u00e9finitivement ce conflit artificiel. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le club casablancais a officialis\u00e9\ncette d\u00e9cision ce lundi 2...", "mass": 5, "physics": false, "shape": "box", "title": "Le club casablancais a officialis\u00e9 cette d\u00e9cision ce lundi 2 novembre 2026, \u00e0 travers un communiqu\u00e9, \u00e0 l\u2019issue d\u2019une \u00e9valuation de la situation sportive de son \u00e9quipe premi\u00e8re. [fr.hespress.com]\n-------------------------------------------------\nLe club explique, dans un communiqu\u00e9, que cette d\u00e9cision intervient \u00e0 l\u2019issue d\u2019une \u00e9valuation globale de la situation sportive de l\u2019\u00e9quipe, les r\u00e9sultats obtenus, la qualit\u00e9 du jeu ainsi. [telquel.ma]\n-------------------------------------------------\nLe Raja Club Athletic (RCA) a annonc\u00e9, lundi 2 novembre 2026 \u00e0 Casablanca, la r\u00e9siliation du contrat de lentra\u00eeneur espagnol Paco J\u00e9mez, responsable de l\u00e9quipe premi\u00e8re de football, apr\u00e8s une analyse approfondie de la situation sportive du club, rapporte la MAP. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Selon les donn\u00e9es publi\u00e9es par\nle minist\u00e8re de l\u2019Am\u00e9nagement du...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les donn\u00e9es publi\u00e9es par le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, les ventes de ciments au titre du. [lematin.ma]\n-------------------------------------------------\nLes livraisons de ciment ont enregistr\u00e9 une hausse de 4,53% en octobre 2026, atteignant 1.585.135 tonnes, contre 1.516.473 t durant le m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les donn\u00e9es publi\u00e9es par le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9 la cr\u00e9ation, au sein de son si\u00e8ge central, d\u2019un nouveau service charg\u00e9 de la gestion de la salle centrale des grands \u00e9. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a proc\u00e9d\u00e9 \u00e0 la cr\u00e9ation d\u2019une nouvelle structure s\u00e9curitaire au sein de son si\u00e8ge central : un service d\u00e9di\u00e9 \u00e0 la gestion de la salle centrale pour les grands \u00e9v\u00e9nements et les crises. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "L\u2019association EAC-L\u2019Boulvart a annonc cr\u00e9ation, en 1991. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Elle proposera une s\u00e9lection de\n76 films en provenance de...", "mass": 5, "physics": false, "shape": "box", "title": "Elle proposera une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis entre la comp\u00e9tition officielle, les s\u00e9ances de gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances jeune public \u0026. [telquel.ma]\n-------------------------------------------------\nAu total, 76 films venus de 39 pays seront pr\u00e9sent\u00e9s dans les diff\u00e9rentes sections, dont 10 en premi\u00e8re mondiale. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de sa 23e \u00e9dition qui se d\u00e9roulera du 20 au 28 novembre 2026, le Festival International du Film de Marrakech c\u00e9l\u00e8brera les cin\u00e9mas du monde \u00e0 travers une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis en plusieurs sections : la Comp\u00e9tition officielle, les s\u00e9ances de Gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances Jeune public \u0026 familles et les films projet\u00e9s dans le cadre des hommages. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le juge d\u2019instruction pr\u00e8s la\nCour d\u2019appel d\u2019Agadir a ordonn\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le juge d\u2019instruction pr\u00e8s la Cour d\u2019appel d\u2019Agadir a ordonn\u00e9, dimanche, de placer en d\u00e9tention trois individus suite \u00e0 l\u2019incident au cours duquel un policier a \u00e9t\u00e9 percut\u00e9 \u00e0 Agadir lors de l\u2019exercice de ses fonctions et qui a failli lui co\u00fbter la vie, et ce \u00e0 l\u2         word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        z-index: 10001;
    }

    @media (hover: hover) and (pointer: fine) {
        #info-icon:hover + #tooltip {
            display: block;
        }
    }
</style>

<div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 03/11/2026 à 11h32, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
