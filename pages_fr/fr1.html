e9s\n\u00e9tait au programme de la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019acc\u00e8s \u00e0 de nouveaux march\u00e9s \u00e9tait au programme de la participation marocaine \u00e0 FrancoTech 2026. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de FrancoTech 2026, organis\u00e9e du 14 au 16 novembre \u00e0 Phnom Penh, en marge du XX\u1d49 Sommet de la Francophonie, le Maroc affirme ses ambitions technologiques internationales \u00e0 travers un Pavillon Maroc port\u00e9 conjointement par la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) et la F\u00e9d\u00e9ration des Technologies de l\u2019Information, des T\u00e9l\u00e9communications et [.] [maroc-diplomatique.net]\n-------------------------------------------------\n\u00c0 l\u2019occasion de FrancoTech 2026, organis\u00e9e du 14 au 16 novembre \u00e0 Phnom Penh, en marge du XX\u1d49 Sommet de la Francophonie, le Maroc participe \u00e0 travers un Pavillon Maroc port\u00e9 conjointement par la Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) et la F\u00e9d\u00e9ration des Technologies de l\u2019Information, des T\u00e9l\u00e9communications et de l\u2019Offshoring (APEBI). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "R\u00e9unie \u00e0 l\u2019universit\u00e9 Stanford, la\nc\u00e9r\u00e9monie des Startup Ecosystem Stars...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9unie \u00e0 l\u2019universit\u00e9 Stanford, la c\u00e9r\u00e9monie des Startup Ecosystem Stars Awards 2026 a distingu\u00e9 Tamwilcom dans la cat\u00e9gorie \u00ab Outstanding Investment Boost \u00bb. [lematin.ma]\n-------------------------------------------------\nTamwilcom a remport\u00e9 le prix \u00ab Outstanding Investment Boost \u00bb lors des Startup Ecosystem Stars Awards 2026, organis\u00e9s \u00e0 l\u2019universit\u00e9 Stanford, en Californie, en reconnaissance de son r\u00f4le dans le financement de l\u2019innovation et le d\u00e9veloppement du capital-risque au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019institution a \u00e9t\u00e9 distingu\u00e9e pour son action en faveur du financement de l\u2019innovation et du d\u00e9veloppement des startups au Maroc, dans la cat\u00e9gorie consacr\u00e9e au soutien \u00e0 l\u2019investissement et au capital-risque local, notamment par l\u2019attraction d\u2019investissements directs locaux et \u00e9trangers. [www.yabiladi.com]\n-------------------------------------------------\nCette r\u00e9compense internationale salue son engagement dans le financement de l\u2019innovation et sa contribution au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me marocain des startups. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019AS FAR a remport\u00e9, dimanche,\nson troisi\u00e8me titre de la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019AS FAR a remport\u00e9, dimanche, son troisi\u00e8me titre de la Ligue des champions f\u00e9minine de la Conf\u00e9d\u00e9ration africaine de football (CAF), le deuxi\u00e8me cons\u00e9cutif, en battant le club sud-africain de Mamelodi Sundowns par 3 buts \u00e0 1, en finale disput\u00e9e au stade de l\u2019Autorit\u00e9 du canal de Suez, \u00e0 Isma\u00eflia, en \u00c9gypte. [telquel.ma]\n-------------------------------------------------\nL\u2019AS FAR a remport\u00e9 la Ligue des champions f\u00e9minine de la CAF en s\u2019imposant face aux Sud-Africaines de Mamelodi Sundowns sur le score de 3 buts \u00e0 1, dimanche \u00e0 Isma\u00eflia, en finale de cette comp\u00e9tition continentale. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Chambre des repr\u00e9sentants a\nadopt\u00e9 \u00e0 la majorit\u00e9, lors...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a adopt\u00e9 \u00e0 la majorit\u00e9, lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re tenue samedi, le Projet de loi de finances (PLF) n\u00b060.26 au titre de l\u2019ann\u00e9e budg\u00e9taire 2027. [www.lereporter.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9, samedi 14 novembre, la premi\u00e8re partie du projet de loi de finances (PLF) 2027, par 179 voix favorables contre 126 voix d\u00e9favorables, sans aucune abstention. [lnt.ma]\n-------------------------------------------------\nAu terme d\u2019un marathon parlementaire de deux jours, la Chambre des repr\u00e9sentants a d\u00e9finitivement adopt\u00e9 le Projet de loi de finances n\u00b060.26 pour l\u2019ann\u00e9e 2027. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019Union des Agences Conseil en\nCommunication (UACC), en collaboration avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union des Agences Conseil en Communication (UACC), en collaboration avec le D\u00e9partement de la Communication du Minist\u00e8re de la Jeunesse, de la Culture et des Sports et avec son soutien, annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [lnt.ma]\n-------------------------------------------------\nL\u2019Union des Agences Conseil en Communication (UACC) annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [telquel.ma]\n-------------------------------------------------\nL\u2019Union des Agences Conseil en Communication (UACC), en collaboration avec le D\u00e9partement de la Communication du Minist\u00e8re de la Jeunesse, de la Culture et des Sports et avec son soutien, annonce le lancement d\u2019un appel d\u2019offres ouvert international (AOOI) pour la r\u00e9alisation d\u2019une \u00e9tude strat\u00e9gique du march\u00e9 publicitaire marocain. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les Lionceaux de l\u2019Atlas ont\nconclu le tournoi de l\u2019Union...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lionceaux de l\u2019Atlas ont conclu le tournoi de l\u2019Union nord-africaine de football (UNAF) par un succ\u00e8s \u00e9clatant (5-1) contre la Tunisie. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine des moins de 17 ans a battu la Tunisie (5-1), lundi 16 novembre 2026 au stade olympique de Sousse, pour son dernier match des \u00e9liminatoires nord-africaines de la CAN U17. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans un \u00e9ditorial publi\u00e9 sur\nle portail du Festival \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un \u00e9ditorial publi\u00e9 sur le portail du Festival \u00e0 l\u0027occasion de sa 23e \u00e9dition, pr\u00e9vue du 20 au 28 novembre, S.A.R. [lematin.ma]\n-------------------------------------------------\nLa rencontre entre les g\u00e9n\u00e9rations est au c\u0153ur du Festival International du Film de Marrakech, o\u00f9 le cin\u00e9ma se partage avec une spontan\u00e9it\u00e9 et une chaleur qui donnent \u00e0 cette manifestation son caract\u00e8re si particulier, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {

                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
