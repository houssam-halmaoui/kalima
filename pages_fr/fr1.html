des d\u00e9clarations de candidature se poursuit jusqu\u2019au mercredi 9 septembre\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/legislatives-le-depot-des-declarations-de-candidature-se-poursuit-jusquau-mercredi-9-septembre/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 et de la Protection sociale (MSPS) a lanc\u00e9, jeudi \u00e0 Rabat, le Plan Sant\u00e9 Mentale 2030, un cadre national de r\u00e9f\u00e9rence visant \u00e0 renforcer l\u2019acc\u00e8s aux services de sant\u00e9 mentale, \u00e0 am\u00e9liorer la qualit\u00e9 de la prise en charge et \u00e0 promouvoir les prestations en la mati\u00e8re. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc mobilisera pr\u00e8s de 4 milliards de dirhams pour mettre en \u0153uvre le Plan sant\u00e9 mentale 2030, officiellement lanc\u00e9 ce jeudi 3 septembre \u00e0 Rabat par le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui. [telquel.ma]\n-------------------------------------------------\nLe Maroc a officiellement lanc\u00e9 jeudi son Plan national de sant\u00e9 mentale 2030, dot\u00e9 de pr\u00e8s de 4 milliards de dirhams, dans le but d\u00e9largir lacc\u00e8s aux soins psychologiques et psychiatriques. [www.yabiladi.com]\n-------------------------------------------------\nLanc\u00e9 ce 3 septembre, le Plan national de la sant\u00e9 mentale pr\u00e9voit une mont\u00e9e en puissance significative de l\u2019offre de soins, avec 17 h\u00f4pitaux psychiatriques, 24 structures interm\u00e9diaires et pr\u00e8s de 4.730 lits. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de la Sant\u00e9 et de la Protection sociale a lanc\u00e9 jeudi \u00e0 Rabat le Plan Sant\u00e9 Mentale 2030, dot\u00e9 d\u0027un financement de pr\u00e8s de 4 milliards de dirhams pour renforcer l\u0027acc\u00e8s aux soins et doubler quasiment les capacit\u00e9s hospitali\u00e8res d\u0027ici 2030. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le Chef du gouvernement, Aziz\nAkhannouch, a repr\u00e9sent\u00e9 le Roi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du gouvernement, Aziz Akhannouch, a repr\u00e9sent\u00e9 le Roi Mohammed VI, jeudi \u00e0 S\u00e3o Tom\u00e9, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture du Pr\u00e9sident de S\u00e3o Tom\u00e9-et-Principe, Carlos Vila Nova, r\u00e9\u00e9lu pour un second mandat \u00e0 l\u2019issue des \u00e9lections du 19 juillet dernier. [fr.hespress.com]\n-------------------------------------------------\nLors de cette c\u00e9r\u00e9monie, qui s\u0027est d\u00e9roul\u00e9e, au si\u00e8ge de l\u0027Assembl\u00e9e nationale, en pr\u00e9sence de chefs d\u2019\u00c9tat et de gouvernement, M. Vila Nova a pr\u00eat\u00e9 serment en tant que Pr\u00e9. [lematin.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a repr\u00e9sent\u00e9 le roi Mohammed VI, jeudi \u00e0 S\u00e3o Tom\u00e9, \u00e0 la c\u00e9r\u00e9monie d\u2019investiture du Pr\u00e9sident de S\u00e3o Tom\u00e9-et-Principe, Carlos Vila Nova, r\u00e9\u00e9lu pour un second mandat \u00e0 l\u2019issue des \u00e9lections du 19 juillet dernier. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a repr\u00e9sent\u00e9 le roi Mohammed VI, jeudi \u00e0 S\u00e3o Tom\u00e9, \u00e0 la c\u00e9r\u00e9monie dinvestiture du Pr\u00e9sident de S\u00e3o Tom\u00e9-et-Principe, Carlos Vila Nova, r\u00e9\u00e9lu pour un second mandat \u00e0 lissue des \u00e9lections du 19 juillet dernier. [www.yabiladi.com]\n----------------------------------------         });

            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
