ce-d\u00e9bat \u00e0 la Maison des Alumni de Casablanca autour du livre Ce qu\u2019attend l\u2019Afrique : ressources locales, tensions mondiales (\u00c9ditions de l\u2019Aube). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le ministre de l\u2019Int\u00e9rieur, Abdelouafi\nLaftit, a indiqu\u00e9 que les...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a indiqu\u00e9 que les amendements pr\u00e9vus par le projet de loi organique n\u00b054.25, modifiant et compl\u00e9tant la loi organique n\u00b029.11 relative aux partis politiques, visent \u00e0 \u00ab moderniser le cadre juridique r\u00e9gissant les partis politiques, encadrer les proc\u00e9dures li\u00e9es \u00e0 leur cr\u00e9ation, renforcer la participation des jeunes et des . [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a soulign\u00e9, mercredi \u00e0 Rabat, que le projet de loi organique N\u00b053.25 modifiant et compl\u00e9tant la loi organique N\u00b027.11 relative \u00e0 la Chambre des repr\u00e9sentants vise en premier lieu \u00e0 consacrer et \u00e0 consolider les r\u00e8gles n\u00e9cessaires pour la moralisation des \u00e9lections des membres de la Chambre basse du parlement marocain. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a pr\u00e9sent\u00e9 mercredi devant la Commission de l\u2019Int\u00e9rieur, des Collectivit\u00e9s territoriales, de l\u2019Habitat, de la Politique de la Ville et des Affaires administratives \u00e0 la Chambre des repr\u00e9sentants, un ensemble de projets de loi visant \u00e0 moderniser en profondeur le syst\u00e8me \u00e9lectoral marocain, \u00e0 moraliser la vie politique et . [lnt.ma]\n-------------------------------------------------\nPartis politiques : Abdelouafi Laftit expose les nouveaut\u00e9s du projet de loi organique n\u00b054.25. [lematin.ma]\n-------------------------------------------------\nMoralisation de la vie politique, digitalisation des proc\u00e9dures, renforcement de la repr\u00e9sentativit\u00e9, s\u00e9curisation du scrutin, refonte du financement des partis et durcissement des conditions de cr\u00e9ation : le ministre de l\u2019Int\u00e9rieur a d\u00e9taill\u00e9 une architecture l\u00e9gislative qui transformera en profondeur le cadre du scrutin de 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Royaume s\u0027impose parmi les\ndestinations mondiales qui se distinguent...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume s\u0027impose parmi les destinations mondiales qui se distinguent par leurs cultures dynamiques, leur riche histoire, leurs paysages uniques et leurs exp\u00e9riences de. [lematin.ma]\n-------------------------------------------------\nLe Maroc figure parmi les 10 destinations touristiques \u00ab incontournables \u00bb pour 2026, offrant aux voyageurs une exp\u00e9rience passionnante et des aventures inoubliables, \u00e9crit le magazine sp\u00e9cialis\u00e9 Travel and Tour World (TTW) bas\u00e9 aux Etats-Unis. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Lors de cette audience, les\ndiscussions ont port\u00e9 sur les...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette audience, les discussions ont port\u00e9 sur les moyens de continuer \u00e0 d\u00e9velopper les m\u00e9canismes de coop\u00e9ration bilat\u00e9rale dans les domaines d\u2019int\u00e9r\u00eat commun tel que l\u2019app. [lematin.ma]\n-------------------------------------------------\nSous le haut patronage de Son Altesse la Princesse Lalla Zineb, la Ligue Marocaine pour la Protection de l\u2019Enfance et le minist\u00e8re de la Solidarit\u00e9 unissent leurs efforts pour renforcer la prise en charge et l\u2019insertion des enfants en situation de vuln\u00e9rabilit\u00e9. [www.lopinion.ma]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de la Ligue Marocaine pour la Protection de l\u2019Enfance, a re\u00e7u mercredi \u00e0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahia, en marge de sa visite au centre Lalla Meriem des enfants sans protection familiale. [www.lereporter.ma]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de la Ligue Marocaine pour la Protection de l\u2019Enfance, a re\u00e7u mercredi \u00e0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahia, en marge de sa visite au centre Lalla Meriem des enfants sans protection familiale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Youth Entrepreneurship Celebration, organis\u00e9e\nchaque ann\u00e9e par INJAZ Al-Arab,...", "mass": 5, "physics": false, "shape": "box", "title": "La Youth Entrepreneurship Celebration, organis\u00e9e chaque ann\u00e9e par INJAZ Al-Arab, rassemble les meilleures Junior Entreprises \u00e9tudiantes et lyc\u00e9ennes de 12 pays de la r\u00e9gion MENA. [lematin.ma]\n-------------------------------------------------\nLa Youth Entrepreneurship Celebration (YEC 2025) d\u2019INJAZ Al-Arab a r\u00e9uni au Caire plus de 85 finalistes issus de 12 pays de la r\u00e9gion MENA pour c\u00e9l\u00e9brer l\u2019innovation, l\u2019audace et l\u2019esprit entrepreneurial des jeunes lyc\u00e9ens et \u00e9tudiants. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Royaume a enregistr\u00e9 une\nhausse de 20,2% des d\u00e9p\u00f4ts...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume a enregistr\u00e9 une hausse de 20,2% des d\u00e9p\u00f4ts de dessins et mod\u00e8les, se pla\u00e7ant parmi les pays d\u2019origine les plus performants au niveau international, aux c\u00f4t\u00e9s de l\u2019Inde. [lematin.ma]\n-------------------------------------------------\nSelon le rapport World Intellectual Property Indicators 2025 publi\u00e9 par l\u2019Organisation mondiale de la propri\u00e9t\u00e9 intellectuelle (OMPI), le Royaume a enregistr\u00e9 une progression de 20,2 % des d\u00e9p\u00f4ts en 2024, le pla\u00e7ant parmi les origines les . [fr.hespress.com]\n-------------------------------------------------\nEn 2024, le Royaume a enregistr\u00e9 une croissance exceptionnelle de 20,2% des d\u00e9p\u00f4ts de dessins et mod\u00e8les industriels, selon le dernier rapport de l\u2019OMPI. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La compagnie a repris la\nligne Rennes-Marrakech d\u00e8s fin octobre,...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a repris la ligne Rennes-Marrakech d\u00e8s fin octobre, op\u00e9rationnelle pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanch. [lematin.ma]\n-------------------------------------------------\nLes deux liaisons a\u00e9riennes directes Rennes-Marrakech et Brest-Marrakech sont d\u00e9sormais assur\u00e9es deux fois par semaines sur toute l\u2019ann\u00e9e par Transavia France, a-t-on indiqu\u00e9 aupr\u00e8s de cette compagnie low-cost. [telquel.ma]\n-------------------------------------------------\nCes deux liaisons sont assur\u00e9es par Transavia France, pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanches. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Lors de la s\u00e9ance hebdomadaire\ndes questions orales \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la s\u00e9ance hebdomadaire des questions orales \u00e0 la Chambre des Conseillers, le ministre de l\u0027\u00c9quipement et de l\u0027Eau, Nizar Baraka, a r\u00e9pondu \u00e0 plusieurs questions sur les secteurs d\u00e9veloppement infrastructurel du Maroc. [www.lopinion.ma]\n-------------------------------------------------\nLes quatorze ports marocains ouverts au commerce international assurent 95% de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a soulign\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Avant l\u2019inauguration de son unit\u00e9\nde production des drones SPY-X...", "mass": 5, "physics": false, "shape": "box", "title": "Avant l\u2019inauguration de son unit\u00e9 de production des drones SPY-X \u00e0 Benslimane, une \u00e9quipe marocaine a b\u00e9n\u00e9fici\u00e9 d\u2019une formation d\u00e9di\u00e9e au transfert de technologie. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019entreprise isra\u00e9lienne BlueBird Aero Systems a annonc\u00e9, le 12 novembre dans un post sur LinkedIn, avoir accueilli une \u00e9quipe technique marocaine pour une session de formation approfondie sur la production de drones SPY-X. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Festival international du film\nde Marrakech a d\u00e9voil\u00e9, jeudi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Festival international du film de Marrakech a d\u00e9voil\u00e9, jeudi, la liste des personnalit\u00e9s du monde du cin\u00e9ma qui prendront part au programme phare \u00ab Conversations \u00bb de sa 22e \u00e9dition, pr\u00e9vue du 28 novembre au 6 d\u00e9cembre. [telquel.ma]\n-------------------------------------------------\nDes figures majeures du cin\u00e9ma mondial, de Bong Joon Ho \u00e0 Nadine Labaki, en passant par Guillermo del Toro, Jodie Foster et Tahar Rahim, viendront partager leur vision du 7\u1d49 art dans un format unique d\u2019\u00e9changes publics. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le ministre de l\u2019Inclusion \u00e9conomique,\nde la Petite entreprise, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri, a soulign\u00e9, mercredi \u00e0 Casablanca, que le bien-\u00eatre des travailleuses et travailleurs, piliers de tout d\u00e9veloppement et garants de la p\u00e9rennit\u00e9 de l\u2019entreprise, doit \u00eatre au c\u0153ur des priorit\u00e9s nationales. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019Inclusion \u00c9conomique, de la Petite Entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri, a soulign\u00e9, mercredi \u00e0 Casablanca, que le bien-\u00eatre des travailleuses et travailleurs, piliers de tout d\u00e9veloppement et garants de la p\u00e9rennit\u00e9 de l\u2019entreprise, doit \u00eatre au c\u0153ur des priorit\u00e9s nationales. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des rafales de vent localement\nfortes avec chasse-poussi\u00e8res ainsi que...", "mass": 5, "physics": false, "shape": "box", "title": "Des rafales de vent localement fortes avec chasse-poussi\u00e8res ainsi que des averses orageuses par endroits et rafales de vent sous orages sont attendues, de mercredi \u00e0 jeudi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses et des vents forts sont attendus, dans les prochaines 24 heures, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019Alg\u00e9rie a accept\u00e9 une demande\nde l\u2019Allemagne de gracier et...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Alg\u00e9rie a accept\u00e9 une demande de l\u2019Allemagne de gracier et transf\u00e9rer l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, emprisonn\u00e9 depuis un an, dans ce pays pour qu\u2019il puisse y \u00eatre soign\u00e9, a indiqu\u00e9 un communiqu\u00e9 de la pr\u00e9sidence alg\u00e9rienne mercredi. [telquel.ma]\n-------------------------------------------------\nAtteint d\u0027un cancer, le romancier et essayiste avait \u00e9t\u00e9 arr\u00eat\u00e9 le 16 novembre 2024, avant d\u0027\u00eatre condamn\u00e9 en appel en juillet \u00e0 cinq ans de r\u00e9clusion. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a annonc\u00e9 ce mercredi 12 novembre 2025 avoir \u00abaccept\u00e9\u00bb de gracier l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, \u00e2g\u00e9 de 80 ans, d\u00e9tenu depuis pr\u00e8s d\u2019un an. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La situation des charges et\nressources du Tr\u00e9sor d\u00e9gage un...", "mass": 5, "physics": false, "shape": "box", "title": "La situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nCes \u00e9missions ont repr\u00e9sent\u00e9 un taux de r\u00e9alisation de 58% du total pr\u00e9vu par la loi de finances 2025, pr\u00e9cise la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume dans son r\u00e9cent bulletin mensuel de statistiques des finances publiques (BMSFP). [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit budg\u00e9taire du Maroc a atteint 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre 40,5 MMDH \u00e0 la m\u00eame p\u00e9riode de 2024, selon les donn\u00e9es publi\u00e9es par la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR) dans son dernier Bulletin mensuel de statistiques des finances publiques (BMSFP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Casabus op\u00e9r\u00e9 par Alsa a\nannonc\u00e9 mercredi de nouvelles adaptations...", "mass": 5, "physics": false, "shape": "box", "title": "Casabus op\u00e9r\u00e9 par Alsa a annonc\u00e9 mercredi de nouvelles adaptations de son r\u00e9seau de transport pour faire face aux chantiers d\u2019am\u00e9nagement urbain en cours dans la m\u00e9tropole \u00e9conomique. [telquel.ma]\n-------------------------------------------------\nCasabus op\u00e9r\u00e9 par Alsa annonce les nouvelles adaptations de son r\u00e9seau pour accompagner les travaux d\u2019am\u00e9nagement urbain dans la ville de Casablanca [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mas  "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de\nl\u2019Insertion sociale, Abdeljebbar Rachidi, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques en 2025, dans le cadre du Projet de l\u2019\u00e9ducation inclusive. [telquel.ma]\n-------------------------------------------------\nBilan : Le nombre total des enfants en situation de handicap ayant b\u00e9n\u00e9fici\u00e9 du processus d\u2019int\u00e9gration dans les \u00e9coles publiques s\u2019\u00e9l\u00e8ve, \u00e0 ce jour, \u00e0 70.000 enfants, a indiqu\u00e9 mardi au Parlement le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019insertion sociale, Abdeljebbar Rachidi. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Maroc est en passe\nde devenir un leader r\u00e9gional...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc est en passe de devenir un leader r\u00e9gional de l\u2019aquaculture gr\u00e2ce \u00e0 un engagement constant et \u00e0 des investissements cibl\u00e9s cr\u00e9ant des emplois, dynamisant les exportations [www.challenge.ma]\n-------------------------------------------------\nLe Maroc est en passe de devenir un leader r\u00e9gional de l\u2019aquaculture gr\u00e2ce \u00e0 un engagement constant et \u00e0 des investissements cibl\u00e9s cr\u00e9ant des emplois, dynamisant les exportations et prot\u00e9geant les \u00e9cosyst\u00e8mes marins, affirme la Banque mondiale (BM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26},     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
