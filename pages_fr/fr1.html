u sport (TAS) de suspendre la notification de sa d\u00e9cision concernant la finale de la Coupe d\u2019Afrique des nations 2025, quelques heures avant le verdict attendu mardi 24 novembre dans l\u2019apr\u00e8s-midi, rapporte RMC Sport. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9, ce mardi, qu\u2019elle respectait la d\u00e9cision du Tribunal arbitral du sport (TAS) confirmant le sacre de la s\u00e9lection s\u00e9n\u00e9galaise \u00e0 la Coupe d\u2019Afrique des nations 2025. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc, qui a \u00e9t\u00e9 d\u00e9chu mardi de son titre de champion d\u2019Afrique 2025 au profit du S\u00e9n\u00e9gal par le Tribunal arbitral du sport (TAS), a annonc\u00e9 vouloir \u201cengager l\u2019ensemble des voies de recours juridiques possibles\u201d contre cette d\u00e9cision. [telquel.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \u00ab \u00e0 l\u2019unanimit\u00e9 \u00bb le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u2019Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [telquel.ma]\n-------------------------------------------------\nIl confirme la victoire du S\u00e9n\u00e9gal, annulant ainsi la d\u00e9cision du jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) qui avait attribu\u00e9 le titre au Maroc sur tapis vert, avec un score de 3-0. [www.yabiladi.com]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a tranch\u00e9, ce mardi 24 novembre, le litige autour de la finale de la Coupe d\u2019Afrique des nations 2025. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \"\u00e0 l\u0027unanimit\u00e9\" le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u0027Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Dans un communiqu\u00e9 publi\u00e9 sur\nson site officiel, Al Ahly...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9 publi\u00e9 sur son site officiel, Al Ahly a indiqu\u00e9 avoir remerci\u00e9 Houcine Ammouta et son staff technique pour la p\u00e9riode durant laquelle ils ont assur\u00e9 la direction de l\u2019\u00e9quipe premi\u00e8re de football. [fr.hespress.com]\n-------------------------------------------------\nDans un bref communiqu\u00e9, le club les remercie pour leur travail et indique que leurs \u00e9ventuels successeurs seront pr\u00e9sent\u00e9s dans les prochaines heures. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La s\u00e9lection marocaine de football\ndes personnes de petite taille...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football des personnes de petite taille s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde 2026, en s\u2019imposant largement face \u00e0 son homologue am\u00e9ricaine sur le score de 9 \u00e0 0, lundi \u00e0 la salle couverte de Skikina \u00e0 T\u00e9mara, pour le compte de la troisi\u00e8me journ\u00e9e du . [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football des personnes de petite taille s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde, lundi 23 novembre 2026, apr\u00e8s sa victoire 9-0 contre les \u00c9tats-Unis \u00e0 la salle couverte de Skikina, \u00e0 T\u00e9mara. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id":         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
