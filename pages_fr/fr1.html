tival des Talents pour la culture et les arts locaux (CASA WE ART 2025), un rendez-vous destin\u00e9 \u00e0 mettre en lumi\u00e8re les jeunes cr\u00e9ateurs de la m\u00e9tropole et \u00e0 renforcer le positionnement culturel de la ville. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "En r\u00e9ponse \u00e0 une question\norale relative aux crit\u00e8res adopt\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "En r\u00e9ponse \u00e0 une question orale relative aux crit\u00e8res adopt\u00e9s pour d\u00e9terminer l\u2019indice socio-\u00e9conomique, Fouzi Lekjaa a relev\u00e9 que les donn\u00e9es y aff\u00e9rentes font l\u2019objet d\u2019une mise \u00e0 jour r\u00e9guli\u00e8re pour une attribution \u00e9quitable des aides sociales. [www.lavieeco.com]\n-------------------------------------------------\nLes donn\u00e9es relatives au r\u00e9gime des aides sociales font l\u2019objet d\u2019une mise \u00e0 jour r\u00e9guli\u00e8re \u00ab afin de garantir l\u2019attribution la plus \u00e9quitable des aides \u00bb, a indiqu\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 31, "id": "comm_label_31", "label": "Dans une interview publi\u00e9e lundi\npar le journal espagnol La...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une interview publi\u00e9e lundi par le journal espagnol La Raz\u00f3n, le Chef du gouvernement a soulign\u00e9 que le Maroc a connu une transformation sans pr\u00e9c\u00e9dent dans le domaine de la protection sociale, de l\u2019AMO, du syst\u00e8me de sant\u00e9 et de la qualit\u00e9 de l\u2019\u00e9ducation. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a affirm\u00e9 que, conform\u00e9ment \u00e0 la Vision Royale, le Maroc m\u00e8ne un travail acharn\u00e9 et m\u00e9thodique en vue de l\u2019\u00e9dification d\u2019un \u00c9tat social porteur d\u2019un changement concret et tangible dans la vie des citoyens. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le nombre d\u2019\u00e9tablissements de formation\nprofessionnelle priv\u00e9e au Maroc a...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre d\u2019\u00e9tablissements de formation professionnelle priv\u00e9e au Maroc a connu une forte augmentation, pour atteindre 1.487 centres, a indiqu\u00e9, lundi \u00e0 Rabat, le ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des repr\u00e9sentants. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, Younes Sekkouri, a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, un \u00e9tat des lieux complet de deux secteurs cl\u00e9s : la formation professionnelle et la cr\u00e9ation d\u2019entreprises, r\u00e9v\u00e9lant une dynamique en nette progression. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le Secr\u00e9tariat g\u00e9n\u00e9ral du gouvernement\n(SGG) re\u00e7oit, les 8 et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Secr\u00e9tariat g\u00e9n\u00e9ral du gouvernement (SGG) re\u00e7oit, les 8 et 9 d\u00e9cembre 2025, une d\u00e9l\u00e9gation du Centre for international legal cooperation (CILC), et ce, dans le cadre du renforcement de sa coop\u00e9ration avec les institutions internationales actives dans le domaine juridique. [leseco.ma]\n-------------------------------------------------\nAu c\u0153ur des \u00e9changes, une analyse des besoins en formation afin d\u2019\u00e9lever la qualit\u00e9 normative, professionnaliser les pratiques et aligner l\u2019action juridique nationale sur les standards internationaux. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le secteur des soci\u00e9t\u00e9s financi\u00e8res\net non financi\u00e8res a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le secteur des soci\u00e9t\u00e9s financi\u00e8res et non financi\u00e8res a \u00e9t\u00e9 le premier producteur de la richesse nationale, avec une contribution au produit int\u00e9rieur brut (PIB) de 45,7%, ressort-il des comptes nationaux des secteurs institutionnels de l\u0027ann\u00e9e 2024, publi\u00e9s lundi par le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nVoici les principaux points de la note d\u2019information du Haut-Commissariat au Plan (HCP) relative aux comptes nationaux des secteurs institutionnels de l\u2019ann\u00e9e 2024 : 1. [atlasinfo.fr]\n-------------------------------------------------\nLe Haut-Commissariat au Plan (HCP) a publi\u00e9 lundi les comptes nationaux des secteurs institutionnels pour l\u2019ann\u00e9e 2024, r\u00e9v\u00e9lant une photographie d\u00e9taill\u00e9e de la cr\u00e9ation de richesse, de l\u2019\u00e9pargne, de l\u2019investissement et du pouvoir d\u2019achat au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Le Conseil national des droits\nde l\u2019Homme (CNDH) a lanc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil national des droits de l\u2019Homme (CNDH) a lanc\u00e9 une s\u00e9rie de t\u00e9moignages inspir\u00e9s de faits observ\u00e9s, dans les espaces num\u00e9riques et en dehors, afin de jeter la lumi\u00e8re sur les formes de cyberviolence \u00e0 l\u2019encontre des femmes, dans le cadre de la campagne nationale \u00ab Mansektouch Ala Al Ounf \u00bb pour l\u2019ann\u00e9e 2025. [atlasinfo.fr]\n-------------------------------------------------\nLe Conseil national des droits de l\u2019Homme (CNDH) a lanc\u00e9 une s\u00e9rie de t\u00e9moignages inspir\u00e9s de faits observ\u00e9s, dans les espaces num\u00e9riques et en dehors, afin de jeter la lumi\u00e8re sur les formes de cyberviolence \u00e0 l\u2019encontre des femmes, dans le cadre de la campagne nationale \u201cMansektouch Ala Al Ounf\u201d pour l\u2019ann\u00e9e 2025. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Un spectacle italo-marocain, pr\u00e9sent\u00e9 lors\nde l\u2019\u00e9dition 2025 du Festival...", "mass": 5, "physics": false, "shape": "box", "title": "Un spectacle italo-marocain, pr\u00e9sent\u00e9 lors de l\u2019\u00e9dition 2025 du Festival de F\u00e8s des Musiques Sacr\u00e9es du Monde, a re\u00e7u le prix \u201cMercurio Alato\u201d du minist\u00e8re italien des Affaires \u00e9trang\u00e8res, consid\u00e9r\u00e9 comme l\u2019\u2019\u2019Oscar\u2019\u2019 de la diplomatie culturelle italienne. [atlasinfo.fr]\n-------------------------------------------------\nLa richesse du dialogue culturel entre l\u2019Italie et le Maroc a \u00e9t\u00e9 mise \u00e0 l\u2019honneur lors de l\u2019\u00e9dition 2025 du Festival de F\u00e8s des Musiques Sacr\u00e9es du Monde, couronn\u00e9e par une distinction internationale de premier plan. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le magazine am\u00e9ricain Variety a\nmis en avant les atouts...", "mass": 5, "physics": false, "shape": "box", "title": "Le magazine am\u00e9ricain Variety a mis en avant les atouts de l\u2019industrie cin\u00e9matographique \u00ab florissante \u00bb au Maroc, en soulignant le r\u00f4le du Festival international du film de Marrakech en tant que vecteur du rayonnement du cin\u00e9ma marocain et carrefour de soutien aux talents \u00e9mergents. [atlasinfo.fr]\n-------------------------------------------------\n\u00abLe Festival du film de Marrakech s\u0027est d\u00e9velopp\u00e9 parall\u00e8lement \u00e0 l\u0027essor de l\u0027industrie cin\u00e9matographique marocaine. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Fintech marocaine, devenue en\ndeux d\u00e9cennies un acteur central...", "mass": 5, "physics": false, "shape": "box", "title": "La Fintech marocaine, devenue en deux d\u00e9cennies un acteur central de l\u2019inclusion financi\u00e8re, a attir\u00e9 un engouement exceptionnel de la part des investisseurs, confirmant la solidit\u00e9 de son mod\u00e8le et la . [lnt.ma]\n-------------------------------------------------\nL\u2019introduction de Cash Plus \u00e0 la Bourse de Casablanca, effective depuis le 8 d\u00e9cembre 2025, d\u00e9passe la simple op\u00e9ration financi\u00e8re pour s\u2019inscrire comme un marqueur de la maturit\u00e9 et du dynamisme de l\u2019\u00e9cosyst\u00e8me FinTech au Maroc. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u0027introduction de Cash Plus \u00e0 la Bourse de Casablanca, souscrite massivement, soit 64 fois, par pr\u00e8s de 81.000 investisseurs, marque un tournant strat\u00e9gique pour le march\u00e9 financier marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Rabat a accueilli, ce mercredi,\nla pr\u00e9sentation officielle de la...", "mass": 5, "physics": false, "shape": "box", "title": "Rabat a accueilli, ce mercredi, la pr\u00e9sentation officielle de la strat\u00e9gie quinquennale 2025-2030 de l\u2019Instance nationale de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC). [fr.hespress.com]\n-------------------------------------------------\nPr\u00e9sentant les grandes lignes de cette strat\u00e9gie, le pr\u00e9sident de l\u0027Instance de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC), Mohamed Benalilou, a indiqu\u00e9 que celle-ci marque un repositionnement de l\u0027Instance au sein du syst\u00e8me national de probit\u00e9 en vue de renforcer ses capacit\u00e9s d\u0027influence, de pilotage, d\u0027analyse, de mobilisation et de lutte. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "ENJOY AI Global Final 2025\na connu la participation de...", "mass": 5, "physics": false, "shape": "box", "title": "ENJOY AI Global Final 2025 a connu la participation de plus d\u0027un million de participants issus de 34 pays, un record homologu\u00e9 par le Guinness World Records. [lematin.ma]\n-------------------------------------------------\nDes \u00e9quipes marocaines ont d\u00e9croch\u00e9 plusieurs distinctions lors de la comp\u00e9tition internationale de robotique et d\u2019intelligence artificielle (IA) ENJOY AI Global Final 2025, qui s\u2019est tenue dans la ville de Wuzhen, \u00e0 l\u2019est de la Chine. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Bless\u00e9 depuis le 4 novembre,\nAchraf Hakimi s\u2019envole ce mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Bless\u00e9 depuis le 4 novembre, Achraf Hakimi s\u2019envole ce mardi vers le Maroc pour poursuivre sa r\u00e9athl\u00e9tisation. [lematin.ma]\n-------------------------------------------------\nBless\u00e9 \u00e0 la cheville depuis un mois, le capitaine des Lions de l\u2019Atlas poursuit sa r\u00e9\u00e9ducation au Maroc sous la supervision du staff m\u00e9dical parisien. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La Chambre des crimes financiers\nde la Cour d\u2019appel de...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des crimes financiers de la Cour d\u2019appel de Rabat a condamn\u00e9 Daniel Ziouziou, ex-directeur r\u00e9gional de l\u2019Union marocaine des banques \u00e0 T\u00e9touan, ainsi qu\u2019un employ\u00e9 de la m\u00eame agence, \u00e0 douze ans de prison ferme. [www.lopinion.ma]\n-------------------------------------------------\nLa Cour d\u2019appel de Rabat, \u00e0 travers la Chambre des crimes financiers, a rendu lundi soir un verdict particuli\u00e8rement lourd dans le dossier de d\u00e9tournements qui avait secou\u00e9 T\u00e9touan en 2024. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "\u200bL\u2019ambassadeur, repr\u00e9sentant permanent du Maroc\naupr\u00e8s de l\u2019ONU et des...", "mass": 5, "physics": false, "shape": "box", "title": "\u200bL\u2019ambassadeur, repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU et des Organisations internationales \u00e0 Gen\u00e8ve, Omar Zniber, a r\u00e9affirm\u00e9, lundi \u00e0 Gen\u00e8ve, le leadership et la solidarit\u00e9 du Maroc dans la promotion d\u2019une gouvernance migratoire humaine et digne. [www.lopinion.ma]\n-------------------------------------------------\nOmar Zniber r\u00e9affirme le leadership et la solidarit\u00e9 du Maroc dans la promotion d\u0027une gouvernance migratoire humaine et digne. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Dans le cadre du pro     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
