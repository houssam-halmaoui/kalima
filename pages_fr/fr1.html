lles, pour un montant cumul\u00e9 de 405 millions d\u0027euros. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9 deux accords de financement d\u2019un montant total de 405 millions d\u2019euros destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Banque Populaire introduit ce\ndispositif au Maroc avec le...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque Populaire introduit ce dispositif au Maroc avec le lancement de \u00ab La Populaire Numberless \u00bb, une ca. [lematin.ma]\n-------------------------------------------------\nLa Banque Populaire franchit un nouveau cap dans l\u2019innovation bancaire au Maroc avec le lancement de \u00ab LA POPULAIRE NUMBERLESS \u00bb, pr\u00e9sent\u00e9e comme la premi\u00e8re carte bancaire marocaine sans num\u00e9ro. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "N\u00e9 \u00e0 Beyrouth dans une\nfamille d\u2019artistes et install\u00e9 en...", "mass": 5, "physics": false, "shape": "box", "title": "N\u00e9 \u00e0 Beyrouth dans une famille d\u2019artistes et install\u00e9 en France d\u00e8s son enfance, Ibrahim Maalouf a d\u00e9velopp\u00e9 un langage musical singulier, nourri par sa formation classique autant. [lematin.ma]\n-------------------------------------------------\nLe trompettiste et compositeur franco-libanais Ibrahim Maalouf se produira au Th\u00e9\u00e2tre Royal de Rabat le mardi 22 septembre 2026 \u00e0 20h30, selon un communiqu\u00e9 publi\u00e9 le 17 septembre. [www.yabiladi.com]\n-------------------------------------------------\nIl y pr\u00e9sentera \u00ab Trumpets of Michel-Ange \u00bb, un projet qui s\u2019inscrit dans un parcours musical \u00e0 la crois\u00e9e du jazz, des musiques orientales et de la cr\u00e9ation contemporaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Mehdi Yaroub est nomm\u00e9 Directeur\nG\u00e9n\u00e9ral de la marque Renault...", "mass": 5, "physics": false, "shape": "box", "title": "Mehdi Yaroub est nomm\u00e9 Directeur G\u00e9n\u00e9ral de la marque Renault au Maroc \u00e0 compter du 1er octobr. [lematin.ma]\n-------------------------------------------------\nRenault Group Maroc a annonc\u00e9 deux nouvelles nominations au sein de ses activit\u00e9s commerciales, \u00e0 la t\u00eate des marques Renault et Dacia. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Des averses orageuses avec risque\nde gr\u00eale et rafales de...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale et rafales de vent sous orages (20-25 mm) toucheront, jeudi de 12H00 \u00e0 23H00, les provinces de Zagora, Tinghir, Ouarzazate, Azilal, Boule. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La s\u00e9ance de cotation \u00e0\nla Bourse de Casablanca est...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9ance de cotation \u00e0 la Bourse de Casablanca est momentan\u00e9ment suspendue en raison d\u2019un incident technique survenu ce jeudi matin, a annonc\u00e9 la place casabla idth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Depuis son lancement, le FII\na permis d\u0027accompagner pr\u00e8s de...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis son lancement, le FII a permis d\u0027accompagner pr\u00e8s de 1.000 entrepreneurs et de financer plus de 500 start-up, pour un montant global de plus de 590 millions de dirhams mobilis\u00e9s sous forme d\u0027aides, de pr\u00eats et d\u0027investissements. [www.lavieeco.com]\n-------------------------------------------------\nLe Fonds Innov Invest (FII), programme public d\u00e9di\u00e9 au financement et \u00e0 l\u0027accompagnement de l\u0027entrepreneuriat innovant, mis en \u0153uvre par Tamwilcom pour le compte du minist\u00e8re de l\u0027\u00c9conomie et des Finances, a re\u00e7u la notation \"Highly Satisfactory\", la plus haute du syst\u00e8me d\u0027\u00e9valuation de la Banque mondiale. [leseco.ma]\n-------------------------------------------------\nLe Fonds Innov Invest (FII), dispositif public de financement et d\u2019accompagnement de l\u2019entrepreneuriat innovant mis en \u0153uvre par Tamwilcom pour le compte du minist\u00e8re de l\u2019\u00c9conomie et des Finances, a obtenu la notation \u00ab Highly Satisfactory \u00bb de la Banque mondiale, soit le niveau le plus \u00e9lev\u00e9 de son syst\u00e8me d\u2019\u00e9valuation. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "L\u0027attaquant du Real Madrid Kylian\nMbapp\u00e9, qui a refus\u00e9 d\u0027enfiler...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027attaquant du Real Madrid Kylian Mbapp\u00e9, qui a refus\u00e9 d\u0027enfiler enti\u00e8rement un t-shirt de soutien \u00e0 Sebta pour avoir aussi une pens\u00e9e pour les migrants disparus, est vis\u00e9 depuis deux jours par des critiques appuy\u00e9es de la droite et de l\u0027ex         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {

                var nodeId = params.nodes[0];

                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
