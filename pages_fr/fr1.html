9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), Chakib Alj, a dress\u00e9 un bilan [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Dans la continuit\u00e9 de l\u2019engagement\ndu Maroc en faveur d\u2019une...", "mass": 5, "physics": false, "shape": "box", "title": "Dans la continuit\u00e9 de l\u2019engagement du Maroc en faveur d\u2019une Intelligence artificielle au service de la paix, de la s\u00e9curit\u00e9 et du d\u00e9veloppement durable en Afrique, le ministre des. [lematin.ma]\n-------------------------------------------------\nDans la continuit\u00e9 de l\u2019engagement du Maroc en faveur d\u2019une Intelligence Artificielle au service de la paix, de la s\u00e9curit\u00e9 et du d\u00e9veloppement durable en Afrique, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a pris part, jeudi par visioconf\u00e9rence, \u00e0 la R\u00e9union minist\u00e9rielle du Conseil. [telquel.ma]\n-------------------------------------------------\nDans la continuit\u00e9 de l\u2019engagement du Maroc en faveur d\u2019une Intelligence Artificielle au service de la paix, de la s\u00e9curit\u00e9 et du d\u00e9veloppement durable en Afrique, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a pris part, jeudi par visioconf\u00e9rence, \u00e0 la R\u00e9union minist\u00e9rielle du Conseil [www.lereporter.ma]\n-------------------------------------------------\nLe partenariat entre le Royaume du Maroc et l\u2019Union europ\u00e9enne se distingue par sa profondeur, sa richesse, son importance strat\u00e9gique et son caract\u00e8re global, a affirm\u00e9 jeudi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La compagnie a\u00e9rienne EasyJet a\ninaugur\u00e9 sa premi\u00e8re base en...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a\u00e9rienne EasyJet a inaugur\u00e9 sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u0027a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 a. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne easyJet a inaugur\u00e9 sa premi\u00e8re base en Afrique, implant\u00e9e \u00e0 Marrakech, dans le cadre de l\u2019acc\u00e9l\u00e9ration de son d\u00e9veloppement au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "OCP Group franchit un nouveau\ncap dans sa strat\u00e9gie financi\u00e8re...", "mass": 5, "physics": false, "shape": "box", "title": "OCP Group franchit un nouveau cap dans sa strat\u00e9gie financi\u00e8re en signant une op\u00e9ration in\u00e9dite pour le continent africain. [lematin.ma]\n-------------------------------------------------\nElle vise \u00e0 financer la strat\u00e9gie de croissance du groupe, tout en maintenant ses ratios de levier aux niveaux Investment Grade. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 l\u2019occasion du Salon international\nde l\u2019agriculture au Maroc (SIAM)...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du Salon international de l\u2019agriculture au Maroc (SIAM) 2026, Cosumar r\u00e9affirme son positionnement au c\u0153ur de la fili\u00e8re sucri\u00e8re nationale, dans un contexte marqu\u00e9 pa. [lematin     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
