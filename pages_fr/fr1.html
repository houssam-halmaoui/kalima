eenes d\u2019approvisionnement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les travaux de la 51e\nsession ordinaire du Comit\u00e9 des...", "mass": 5, "physics": false, "shape": "box", "title": "Les travaux de la 51e session ordinaire du Comit\u00e9 des repr\u00e9sentants permanents de l\u2019Union africaine se sont ouverts \u00e0 Addis-Abeba, avec la participation du Maroc. [leseco.ma]\n-------------------------------------------------\nLes travaux de la la 51\u00e8me session ordinaire du comit\u00e9 des repr\u00e9sentants permanents de l\u2019Union africaine (UA) ont d\u00e9but\u00e9 lundi au si\u00e8ge de l\u2019organisation panafricaine \u00e0 Addis-Abeba avec la participation du Maroc. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 32, "id": "comm_label_32", "label": "\u00c0 l\u2019approche des demi-finales de\nla Coupe d\u2019Afrique des Nations...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019approche des demi-finales de la Coupe d\u2019Afrique des Nations Maroc-2025, le tournoi se distingue par une configuration rarement observ\u00e9e dans l\u2019histoire de la comp\u00e9tition. [lnt.ma]\n-------------------------------------------------\nUne configuration d\u00e9j\u00e0 forte sur le plan sportif, mais rendue encore plus singuli\u00e8re par une donn\u00e9e rare : ces demi-finales concentrent tous les Ballons d\u2019Or . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La c\u00e9l\u00e9bration du nouvel An\nAmazigh est une illustration de...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9l\u00e9bration du nouvel An Amazigh est une illustration de la singularit\u00e9 du mod\u00e8le marocain en mati\u00e8re de gestion de la diversit\u00e9 e r\u00e9vision annuelle desdites listes, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u0027Int\u00e9rieur, Abdelouafi Laftit. [www.lopinion.ma]\n-------------------------------------------------\nAbdelouafi Laftit, ministre de l\u2019Int\u00e9rieur, a r\u00e9v\u00e9l\u00e9 ce mardi, lors de la s\u00e9ance des questions orales \u00e0 la Conseil des conseillers, que le bilan de l\u2019op\u00e9ration de r\u00e9vision annuelle ordinaire des listes \u00e9lectorales g\u00e9n\u00e9rales a abouti, \u00e0 ce stade, \u00e0 l\u2019inscription de 382.170 nouveaux \u00e9lecteurs, contre la radiation de 1,4 million de cas pour des. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "Le Groupe AKDITAL franchit un\nnouveau cap majeur dans son...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe AKDITAL franchit un nouveau cap majeur dans son d\u00e9veloppement en obtenant l\u2019Accr\u00e9ditation Platine Qmentum International, d\u00e9livr\u00e9e par Accreditation Canada, la plus haute distinction internationale en mati\u00e8re de qualit\u00e9, de s\u00e9curit\u00e9 et de performance des soins de sant\u00e9. [fr.hespress.com]\n-------------------------------------------------\nElle t\u00e9moigne de l\u0027engagement continu du groupe Akdital \u00e0 fournir des soins et des services de qualit\u00e9 sup\u00e9rieure \u00e0 ses patients. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Akdital a annonc\u00e9 l\u0027obtention de l\u0027accr\u00e9ditation Platine selon les normes Qmentum International, d\u00e9cern\u00e9e par Accr\u00e9ditation Canada. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Initi\u00e9 par l\u2019EMA en partenariat\navec Safran et l\u2019Institut des...", "mass": 5, "physics": false, "shape":     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;

                nodes: {

                    barnesHut: {

            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
