o, la marque port\u00e9e par l\u2019Office National des A\u00e9roports (ONDA), vient de d\u00e9voiler, \u00e0 24 heures du premier match des Lions de l\u2019Atlas en Coupe du Monde FIFA 2026, une nouvelle campagne nationale intitul\u00e9e \u00ab Let The Game Take Off \u00bb. [lnt.ma]\n-------------------------------------------------\nAirports of Morocco, la marque port\u00e9e par l\u0027Office National des A\u00e9roports (ONDA), vient de d\u00e9voiler, \u00e0 24 heures du premier match des Lions de l\u2019Atlas en Coupe du Monde 2026, une nouvelle campagne nationale intitul\u00e9e \"Let The Game Take Off\". [leseco.ma]\n-------------------------------------------------\n\u00c0 la veille du premier match Maroc/Br\u00e9sil en Coupe du Monde 2026, Airports of Morocco a d\u00e9voil\u00e9 ce vendredi son film institutionnel in\u00e9dit \u00ab Let The Game Take Off \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Direction g\u00e9n\u00e9rale de la\nm\u00e9t\u00e9orologie (DGM), a annonc\u00e9 une...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), a annonc\u00e9 une vague de chaleur, des averses orageuses et de fortes rafales de vent attendues, de vendredi \u00e0 dimanche dans plusieurs provinces du Royaume. [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses et de fortes rafales de vent sont pr\u00e9vues de vendredi \u00e0 dimanche dans plusieurs r\u00e9gions du Maroc, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Une vague de chaleur (41-44\u00b0C)\ntouchera, de vendredi \u00e0 dimanche,...", "mass": 5, "physics": false, "shape": "box", "title": e Maroc \u00e0 la Coupe du Monde de la FIFA 2026, en remplacement d\u2019Abdessamad Ezzalzouli et Nayef Aguerd, bless\u00e9s. [atlasinfo.fr]\n-------------------------------------------------\nEntre calendrier surcharg\u00e9, fragilit\u00e9s physiques et n\u00e9cessit\u00e9 de s\u2019appuyer sur la profondeur de l\u2019effectif, ces absences constituent un premier d\u00e9fi majeur pour le groupe de Mohamed Ouahbi avant son entr\u00e9e en lice face au Br\u00e9sil. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le s\u00e9lectionneur de l\u2019\u00e9quipe de\nFrance de football, Didier Deschamps,...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur de l\u2019\u00e9quipe de France de football, Didier Deschamps, a estim\u00e9 que le Maroc figure parmi les \u00e9quipes susceptibles de jouer les premiers r\u00f4les lors de la Coupe du monde 2026, comme lors du dernier Mondial au Qatar. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur de l\u2019\u00e9quipe de France de football, Didier Deschamps, a estim\u00e9 que le Maroc figure parmi les \u00e9quipes susceptibles de jouer les premiers r\u00f4les lors de la Coupe du monde 2026, comme lors du dernier Mondial au Qatar. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La s\u00e9lection marocaine de football\na progress\u00e9 d\u2019une place pour...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football a progress\u00e9 d\u2019une place pour acc\u00e9der au 7\u00e8 rang mondial, pour la premi\u00e8re fois de l\u2019histoire, selon l\u2019\u00e9dition de juin du classement de la FIFA publi\u00e9e jeudi. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc franchit une \u00e9tape historique dans le dernier classement mondial masculin publi\u00e9 par la FIFA, co\u00efncidant avec le debut de la Coupe du monde 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le durcissement des conditions d\u2019exercice,\nau sein de l\u2019Union europ\u00e9enne,...", "mass": 5, "physics": false, "shape": "box", "title": "Le durcissement des conditions d\u2019exercice, au sein de l\u2019Union europ\u00e9enne, de l\u2019activit\u00e9 d\u2019interm\u00e9diation op\u00e9r\u00e9e par les filiales des banques marocaines constitue l\u2019un des principaux d\u00e9fis auxquels est confront\u00e9 l\u2019\u00e9cosyst\u00e8me national des transferts de fonds des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), a indiqu\u00e9, jeudi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de Bank Al-Maghrib (BAM), Abderrahim Bouazza. [telquel.ma]\n-------------------------------------------------\nLe durcissement des conditions d\u2019exercice, au sein de l\u2019Union Europ\u00e9enne, de l\u2019activit\u00e9 d\u2019interm\u00e9diation op\u00e9r\u00e9e par les filiales des banques marocaines constitue l\u2019un des principaux d\u00e9fis auxquels est confront\u00e9 l\u2019\u00e9cosyst\u00e8me national des transferts de fonds des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger (MRE), a indiqu\u00e9, ce jeudi \u00e0 Rabat, le directeur g\u00e9n\u00e9ral de Bank Al-Maghrib (BAM), Abderrahim Bouazza. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Port\u00e9e par un contrat-programme avec\nle minist\u00e8re de l\u2019Inclusion \u00e9conomique,...", "mass": 5, "physics": false, "shape": "box", "title": "Port\u00e9e par un contrat-programme avec le minist\u00e8re de l\u2019Inclusion \u00e9conomique, cette initiative ambitionne de renforcer l\u2019insertion professionnelle et de pr\u00e9server les savoir-faire artisanaux \u00e0 l\u2019horizon 2030. [www.lavieeco.com]\n-------------------------------------------------\nLe Secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire a proc\u00e9d\u00e9, vendredi \u00e0 Marrakech, au lancement officiel du programme de formation par apprentissage dans les m\u00e9tiers de l\u2019artisanat au titre de l\u2019ann\u00e9e 2026-2027. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Sous les Hautes Instructions de\nSa Majest\u00e9 le Roi Mohammed...", "mass": 5, "physics": false, "shape": "box", "title": "Sous les Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, SAR le Prince H\u00e9ritier Moulay El Hassan a pr\u00e9sid\u00e9, jeudi au Coll\u00e8ge Royal de l\u2019Enseignement Militaire Sup\u00e9rieur (CREMS) de K\u00e9nitra, la c\u00e9r\u00e9monie de sortie de la 26e promotion du Cours Sup\u00e9rieur de D\u00e9fense et de la 60e promotion du Cours d\u2019\u00c9tat-Major. [www.lavieeco.com]\n-------------------------------------------------\nSur Hautes Instructions du Roi Mohammed VI, le Prince H\u00e9ritier Moulay El Hassan, Coordinateur des Bureaux et Services de l\u2019Etat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, a pr\u00e9sid\u00e9, ce jeudi \u00e0 K\u00e9nitra, la c\u00e9r\u00e9monie de sortie de la 26e promotion du Cours Sup\u00e9rieur de D\u00e9fense et de la 60e promotion du Cours Etat-Major. [leseco.ma]\n-------------------------------------------------\nSur Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, Chef Supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR), Son Altesse Royale le Prince H\u00e9ritier Moulay El Hassan, Coordinateur des Bureaux et Services de l\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales, a pr\u00e9sid\u         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;

                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
