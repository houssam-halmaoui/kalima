25), disput\u00e9, dimanche soir au Stade Prince Moulay Abdellah de Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Des chutes de neige, de\nfortes pluies parfois orageuses ainsi...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige, de fortes pluies parfois orageuses ainsi que de fortes rafales de vent sont pr\u00e9vues, de dimanche \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDes chutes de neige, de fortes pluies parfois orageuses ainsi que de fortes rafales de vent sont pr\u00e9vues, de dimanche \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Marocaine Des Jeux et\ndes Sports (MDJS), en partenariat...", "mass": 5, "physics": false, "shape": "box", "title": "La Marocaine Des Jeux et des Sports (MDJS), en partenariat avec l\u2019hebdomadaire sportif Derby, offre un Guide Football CAN 2025, une publication sp\u00e9ciale con\u00e7ue pour faire vivre au [www.challenge.ma]\n-------------------------------------------------\nImmersion La Marocaine des Jeux et des Sports (MDJS), en partenariat avec l\u2019hebdomadaire sportif Derby, offre un guide football CAN 2025, une publication sp\u00e9ciale con\u00e7ue pour faire vivre au grand public toute l\u2019intensit\u00e9, la passion et la ferveur de la CAN 2025, organis\u00e9e au Maroc. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Pour l\u2019\u00e9dition 2025 organis\u00e9e au\nMaroc du 2         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
