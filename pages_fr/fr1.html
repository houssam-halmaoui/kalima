e de son parti aux \u00e9lections l\u00e9gislatives du 23 septembre. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u, mardi au Palais Royal \u00e0 Rabat, Mme Fatima Ezzahra El Mansouri, coordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9, que le Souverain a nomm\u00e9e Cheffe du gouvernement et a charg\u00e9 de former le nouveau gouvernement, annonce le minist\u00e8re de la Maison Royale, . [aujourdhui.ma]\n-------------------------------------------------\nCoordinatrice de la direction coll\u00e9giale du Parti Authenticit\u00e9 et Modernit\u00e9 (PAM), elle a \u00e9t\u00e9 re\u00e7ue au Palais Royal \u00e0 Rabat, selon un communiqu\u00e9 du minist\u00e8re de la Maison Royale, du Protocole . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc se classe au\n54e rang mondial dans l\u2019\u00e9dition...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc se classe au 54e rang mondial dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation, publi\u00e9e mardi par l\u2019Organisation Mondiale de la Propri\u00e9t\u00e9 Intellectuelle (OMPI) \u00e0 Ge. [lematin.ma]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [telquel.ma]\n-------------------------------------------------\nIl se classe 4e parmi les pays \u00e0 revenu interm\u00e9diaire inf\u00e9rieur et 7e dans sa r\u00e9gion. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc r\u00e9alise une progression de trois places dans l\u2019\u00e9dition 2026 de l\u2019Indice mondial de l\u2019innovation (Global Innovation Index, GII) publi\u00e9, mardi, par l\u2019Organisation mondiale de la Propri\u00e9t\u00e9 industrielle (OMPI) \u00e0 Gen\u00e8ve, atteignant la 54e place, son meilleur classement historique. [leseco.ma]\n-------------------------------------------------\nLe Maroc progresse de trois positions dans l\u2019Indice mondial de l\u2019innovation 2026 et se classe d\u00e9sormais 54e, son meilleur niveau depuis la cr\u00e9ation de cet indicateur. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc et le groupe\nde la Banque africaine de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et le groupe de la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [telquel.ma]\n-------------------------------------------------\nLe Maroc et le groupe de la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [fr.hespress.com]\n-------------------------------------------------\nCe financement vise \u00e0 d\u00e9velopper et moderniser les infrastructures a\u00e9roportuaires du pays dans le cadre du programme PEMIA. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la BAD ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [leseco.ma]\n-------------------------------------------------\nLe Maroc et le groupe de la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les r\u00e9sultats des comptes nationaux\ndu deuxi\u00e8me trimestre (T2) 2026...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9sultats des comptes nationaux du deuxi\u00e8me trimestre (T2) 2026 font ressortir un ralentissement de la croissance \u00e9conomique nationale, qui s\u2019est \u00e9tablie \u00e0 4% au lieu de 5,8% au m\u00eame trimestre de l\u2019ann\u00e9e 2025, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nSelon le Haut-Commissariat au Plan (HCP), la demande int\u00e9rieure marocaine a augment\u00e9 de 5 % au deuxi\u00e8me trimestre 2026, contre 7,5 % \u00e0 la m\u00eame p\u00e9riode en 2025. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le minist\u00e8re de la Transition\nnum\u00e9rique et de la R\u00e9forme...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration (MTNRA) et Mistral ont annonc\u00e9 la mise \u00e0 disposition en open source de premi\u00e8res r\u00e9alisations issues de leur partenariat dans le domaine de l\u2019intelligence artificielle (IA). [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration (MTNRA) et Mistral ont annonc\u00e9 la mise \u00e0 disposition en open source de premi\u00e8res r\u00e9alisations issues de leur partenariat strat\u00e9gique dans le domaine de l\u2019intelligence artificielle (IA). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Ce lundi 28 septembre, les\ngroupes chinois Gotion et allemand...", "mass": 5, "physics": false, "shape": "box", "title": "Ce lundi 28 septembre, les groupes chinois Gotion et allemand Volkswagen ont annonc\u00e9 renforcer leur partenariat, notamment avec la cr\u00e9ation d\u2019une usine de production de cathodes LFP \u00e0 K\u00e9nitra. [telquel.ma]\n-------------------------------------------------\nDans une nouvelle \u00e9tape importante pour l\u2019\u00e9cosyst\u00e8me marocain de mobilit\u00e9 \u00e9lectrique Le Groupe Volkswagen, PowerCo SE et Gotion High-tech ont annonc\u00e9 la cr\u00e9ation d\u2019une coentreprise \u00e0 K\u00e9nitra pour la production de mat\u00e9riaux actifs cathodiques LFP, un composant essentiel de la cha\u00eene de valeur des batteries pour v\u00e9hicules \u00e9lectriques. [aujourdhui.ma]\n-------------------------------------------------\nLe Maroc prend place dans le nouveau dispositif industriel que Volkswagen, PowerCo et Gotion veulent b\u00e2tir autour des batteries LFP. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Les recettes fiscales des collectivit\u00e9s\nterritoriales (CT) ont atteint 34,7...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes fiscales des collectivit\u00e9s te \u00eener les \u00e9quipages dans un large \u00e9ventail de domaines de lutte. [aujourdhui.ma]\n-------------------------------------------------\nLa Marine nationale fran\u00e7aise et la Marine Royale marocaine conduisent, depuis le 11 septembre, l\u0027exercice annuel CHEBEC, rendez-vous annuel embl\u00e9matique de la coop\u00e9ration navale franco-marocaine. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Implant\u00e9 \u00e0 Casablanca depuis 2022,\nl\u0027\u00e9diteur fran\u00e7ais Axelor renforce ses...", "mass": 5, "physics": false, "shape": "box", "title": "Implant\u00e9 \u00e0 Casablanca depuis 2022, l\u0027\u00e9diteur fran\u00e7ais Axelor renforce ses \u00e9quipes au Maroc pour accompagner son d\u00e9veloppement aupr\u00e8s des entreprises marocaines et, progressivement, en Afrique francophone. [www.lavieeco.com]\n-------------------------------------------------\nIA : Implant\u00e9 \u00e0 Casablanca depuis 2022, l\u2019\u00e9diteur fran\u00e7ais Axelor renforce ses \u00e9quipes au Maroc pour accompagner son d\u00e9veloppement aupr\u00e8s des entreprises marocaines et, progressivement, en Afrique francophone. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Avocate de formation, ancienne maire\nde Marrakech, d\u00e9put\u00e9e puis ministre,...", "mass": 5, "physics": false, "shape": "box", "title": "Avocate de formation, ancienne maire de Marrakech, d\u00e9put\u00e9e puis ministre, Fatima Ezzahra El Mansouri acc\u00e8de \u00e0 la Chefferie du gouvernement apr\u00e8s pr\u00e8s de deux d\u00e9cennies d\u2019engagement politique. [www.lavieeco.com]\n-------------------------------------------------\nAvocate devenue maire \u00e0 33 ans, parlementaire, dirigeante du PAM puis ministre, Fatima Ezzahra El Mansouri acc\u00e8de aujourd\u2019hui \u00e0 la t\u00eate du gouvernement. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Selon le dernier Travel \u0026\nTourism Development Index (TTDI) du...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le dernier Travel \u0026 Tourism Development Index (TTDI) du Forum \u00e9conomique mondial, le Maroc se classe au 8e rang des \u00e9conomies ayant enregistr\u00e9 la plus forte progression en mati\u00e8re de d\u00e9veloppement du voyage et du tourisme, entre 2024 et 2026. [leseco.ma]\n-------------------------------------------------\nAvec un score en hausse de 5,5 % par rapport \u00e0 2024, le royaume se place parmi les dix \u00e9conomies ayant connu la progression la plus rapide au monde. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Invit\u00e9 d\u2019honneur de la 5e\n\u00e9dition de l\u2019Ol\u00e9 Summit \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Invit\u00e9 d\u2019honneur de la 5e \u00e9dition de l\u2019Ol\u00e9 Summit \u00e0 Buenos Aires, le Maroc a pr\u00e9sent\u00e9 mardi 29 septembre sa vision pour la Coupe du monde 2030, qu\u2019il coorganisera avec l\u2019Espagne et le Portugal, mettant en avant une ambition qui d\u00e9passe le seul rendez-vous sportif pour s\u2019inscrire dans une strat\u00e9gie plus large de d\u00e9veloppement, de L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nInvit\u00e9 d\u2019honneur de la 5e \u00e9dition de l\u2019Ol\u00e9 Summit \u00e0 Buenos Aires, le Maroc a pr\u00e9sent\u00e9 mardi sa vision pour la Coupe du monde 2030, qu\u2019il co-organisera avec l\u2019Espagne et le Portugal, mettant en avant une ambition qui d\u00e9passe le seul rendez-vous sportif pour s\u2019inscrire dans une strat\u00e9gie plus large de d\u00e9veloppement, de modernisation des [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Apr\u00e8s avoir re\u00e7u, mercredi matin,\nune d\u00e9l\u00e9gation du Rassemblement national...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s avoir re\u00e7u, mercredi matin, une d\u00e9l\u00e9gation du Rassemblement national des ind\u00e9pendants (RNI), elle s\u2019est entretenue dans la foul\u00e9e avec les dirigeants du Parti de l\u2019Istiqlal (PI), troisi\u00e8me force politique . [fr.hespress.com]\n-------------------------------------------------\nLa cheffe du gouvernement d\u00e9sign\u00e9e, Fatima Ezzahra El Mansouri, a poursuivi ce mercredi les consultations en vue de la formation du gouvernement, en recevant les dirigeants du Parti de l\u2019Istiqlal. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La s\u00e9lection marocaine affrontera son\nhomologue malienne, dimanche 4 octobre...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine affrontera son homologue malienne, dimanche 4 octobre prochain au Grand stade de Tanger, dans le cadre d\u2019un match amical international, en remplacement de la rencontre qui \u00e9tait initialement programm\u00e9e face au Ghana. [fr.hespress.com]\n-------------------------------------------------\nCette rencontre est pr\u00e9vue au Grand Stade de la Cit\u00e9 du D\u00e9troit \u00e0 18h00, souligne la F\u00e9d\u00e9ration royale marocaine de football (FRMF) dans un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\nCette information a \u00e9t\u00e9 communiqu\u00e9e par la F\u00e9d\u00e9ration royale marocaine de football (FRMF) dans un communiqu\u00e9 publi\u00e9 le 30 septembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les principaux acteurs am\u00e9ricains de\nl\u2019intelligence artificielle ont sign\u00e9, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Les principaux acteurs am\u00e9ricains de l\u2019intelligence artificielle ont sign\u00e9, lundi \u00e0 la Maison Blanche, un code de bonne conduite destin\u00e9 \u00e0 renforcer la surveillance des risques li\u00e9. [lematin.ma]\n-------------------------------------------------\nFace \u00e0 la multiplication d\u2019incidents de s\u00e9curit\u00e9 li\u00e9s \u00e0 l\u2019intelligence artificielle (IA), les g\u00e9ants am\u00e9ricains de la tech ont sign\u00e9 lundi \u00e0 la Maison-Blanche un code de bonne conduite destin\u00e9 \u00e0 mieux appr\u00e9hender les risques de cette technologie. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La r\u00e9\u00e9lection de Hamid Bentahar\n\u00e0 la t\u00eate du Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9\u00e9lection de Hamid Bentahar \u00e0 la t\u00eate du Conseil r\u00e9gional du tourisme Marrakech-Safi traduit la volont\u00e9 collective de poursuivre, aux c\u00f4t\u00e9s des \u00e9lus, des institutionnels et des. [lematin.ma]\n-------------------------------------------------\nLe Conseil r\u00e9gional du tourisme (CRT) Marrakech-Safi a r\u00e9\u00e9lu, mardi, Hamid Bentahar \u00e0 sa pr\u00e9sidence pour un nouveau mandat, \u00e0 l\u2019issue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective du Conseil. [telquel.ma]\n-------------------------------------------------\nUne reconduction qui intervient dans un contexte marqu\u00e9 par la poursuite des projets de promotion de la destination, avec une attention accrue port\u00e9e aux provinces de la r\u00e9gion, au patrimoine local et \u00e0 la diversification de l\u2019offre touristique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "CIH Bank a \u00e9t\u00e9 distingu\u00e9e\n\u00e0 l\u2019occasion des GEFF Awards,...", "mass": 5, "physics": false, "shape": "box", "title": "CIH Bank a \u00e9t\u00e9 distingu\u00e9e \u00e0 l\u2019occasion des GEFF Awards, organis\u00e9s par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD), indique la banque dans un communiqu\u00e9.. [lematin.ma]\n-------------------------------------------------\nCIH BANK a \u00e9t\u00e9 distingu\u00e9 \u00e0 l\u2019occasion de la c\u00e9r\u00e9monie GEFF Awards, organis\u00e9e par la Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD), en reconnaissance de son engagement dans le financement de la transition \u00e9nerg\u00e9tique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les entreprises repr\u00e9sentent la principale\ncat\u00e9gorie b\u00e9n\u00e9ficiaire, avec pr\u00e8s de...", "mass": 5, "physics": false, "shape": "box", "title": "Les entreprises repr\u00e9sentent la principale cat\u00e9gorie b\u00e9n\u00e9ficiaire, avec pr\u00e8s de 26.000 op\u00e9rations, indique Tamwilcom dans un communiqu\u00e9 publi\u00e9 \u00e0 l\u2019issue. [telquel.ma]\n-------------------------------------------------\nTamwilcom a soutenu plus de 31.500 op\u00e9rations de cr\u00e9dit, au premier semestre de cette ann\u00e9e, pour un volume de financements mobilis\u00e9s de 23,9 milliards de dirhams. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027intervention de Tamwilcom a permis de mobiliser un volume de 23,9 milliards de dirhams (MMDH) de financements \u00e0 fin juin 2026, correspondant \u00e0 14,7 MMDH d\u2019engagements, en faveur de plus de 31.500 op\u00e9rations de cr\u00e9dit. [leseco.ma]"}]);

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');

            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
