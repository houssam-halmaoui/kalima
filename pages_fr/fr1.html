0eache maritime et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Agriculture, de la P\u00eache maritime et de la Souverainet\u00e9 alimentaire, Khalid Hatimy, a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, une s\u00e9rie de mesures prises pour accompagner la campagne agricole 2026/27, portant notamment sur le soutien aux semences et aux engrais ainsi que sur la reconstitution du cheptel national. [fr.hespress.com]\n-------------------------------------------------\nSemences subventionn\u00e9es, engrais phosphat\u00e9s sans hausse de prix, soutien \u00e0 la reconstitution du cheptel : le ministre de l\u0027Agriculture a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le dispositif d\u0027accompagnement de la nouvelle campagne. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre de l\u2019Agriculture, de la P\u00eache maritime et de la Souverainet\u00e9 alimentaire, Khalid Hatimy, a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, une s\u00e9rie de mesures prises pour accompagner la campagne agricole 2026-2027, portant notamment sur le soutien aux semences et aux engrais ainsi que sur la reconstitution du cheptel national. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Roi Mohammed VI a\nr\u00e9affirm\u00e9 la centralit\u00e9 de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a r\u00e9affirm\u00e9 la centralit\u00e9 de la question palestinienne, ainsi que l\u2019implication responsable du Maroc dans les efforts internationaux visant un r\u00e8glement juste et durable. [fr.hespress.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, a adress\u00e9 un message au Pr\u00e9sident du Comit\u00e9 des Nations Unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, M. Coly Seck, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien, c\u00e9l\u00e9br\u00e9e, cette ann\u00e9e, le 23 novembre. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a adress\u00e9 un message au Pr\u00e9sident du Comit\u00e9 des Nations Unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, M. Coly Seck, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien, c\u00e9l\u00e9br\u00e9e, cette ann\u00e9e, le 23 novembre. [maroc-diplomatique.net]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a adress\u00e9 un message au Pr\u00e9sident du Comit\u00e9 des Nations Unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, M. Coly Seck, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien, c\u00e9l\u00e9br\u00e9e, cette ann\u00e9e, le 23 novembre. [www.lereporter.ma]\n-------------------------------------------------\nLe roi Mohammed VI a adress\u00e9, le 23 novembre 2026 \u00e0 New York, un message \u00e0 Coly Seck, pr\u00e9sident du Comit\u00e9 des Nations unies pour l\u2019exercice des droits inali\u00e9nables du peuple palestinien, \u00e0 l\u2019occasion de la Journ\u00e9e internationale de solidarit\u00e9 avec le peuple palestinien. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le conseil d\u2019administration du g\u00e9ant\nam\u00e9ricain des semi-conducteurs Nvidia a...", "mass": 5, "physics": false, "shape": "box", "title": "Le conseil d\u2019administration du g\u00e9ant am\u00e9ricain des semi-conducteurs Nvidia a annonc\u00e9 lundi le r\u00e9tablissement de Jensen Huang dans ses fonctions de pr\u00e9sident-directeur g\u00e9n\u00e9ral (PDG) et de membre du conseil, avec effet imm\u00e9diat, \u00e0 l\u2019issue d\u2019un vote unanime. [fr.hespress.com]\n-------------------------------------------------\nLe conseil d\u2019administration de Nvidia a annonc\u00e9, lundi 23 novembre 2026, le r\u00e9tablissement de Jensen Huang dans ses fonctions de pr\u00e9sident-directeur g\u00e9n\u00e9ral (PDG) et de membre du conseil, [www.challenge.ma]\n-------------------------------------------------\nLe dirigeant retrouve ses fonctions de pr\u00e9sident-directeur g\u00e9n\u00e9ral ainsi que son si\u00e8ge au conseil d\u2019administration, \u00e0 la suite d\u2019un vote unanime de cette instance. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Apr\u00e8s avoir re\u00e7u l\u2019\u00c9toile d\u2019Or\nde la 23e \u00e9dition du...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s avoir re\u00e7u l\u2019\u00c9toile d\u2019Or de la 23e \u00e9dition du Festival international du film de Marrakech, John Turturro a rencontr\u00e9 le public du festival pour revenir sur son parcours, ses choix de carri\u00e8re et sa conception du m\u00e9tier d\u2019acteur. [fr.hespress.com]\n-------------------------------------------------\nHommage L\u2019acteur, sc\u00e9nariste et r\u00e9alisateur am\u00e9ricain John Turturro a re\u00e7u, dimanche soir au Palais des congr\u00e8s, l\u2019\u00c9toile d\u2019Or de la 23\u00e8me \u00e9dition du Festival international du film de Marrakech. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le cheval Lino, mont\u00e9 par\nle jockey Mickael Forest et...", "mass": 5, "physics": false, "shape": "box", "title": "Le cheval Lino, mont\u00e9 par le jockey Mickael Forest et propri\u00e9t\u00e9 de Yannick Shulz, s\u0027est adjug\u00e9 le Grand Prix de Sa Majest\u00e9 le Roi Mohammed VI de pur-sang arabe, dan. [lematin.ma]\n-------------------------------------------------\nLa 12e \u00e9dition du Morocco International Meeting (MIM) s\u2019est achev\u00e9e dimanche \u00e0 l\u2019hippodrome Casablanca-Anfa, au terme de deux journ\u00e9es de comp\u00e9titions r\u00e9unissant des chevaux, jockeys et professionnels des courses hippiques venus du Maroc et de l\u2019\u00e9tranger. [lnt.ma]\n-------------------------------------------------\nReconnaissance La Soci\u00e9t\u00e9 royale d\u2019encouragement du cheval (SOREC) a cl\u00f4tur\u00e9, ce dimanche \u00e0 l\u2019Hippodrome de Casablanca-Anfa, la 12\u00e8me \u00e9dition du Morocco international meeting (MIM), organis\u00e9e les 21 et 22 novembre sous le Haut patronage de Sa Majest\u00e9 le Roi Mohammed VI. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc pr\u00e9pare le lancement\nde MA-INDAR, un syst\u00e8me national...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc pr\u00e9pare le lancement de MA-INDAR, un syst\u00e8me national destin\u00e9 \u00e0 alerter rapidement les populations en cas de danger ou de situation d\u2019urgence. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur annonce le lancement de MA-INDAR, un syst\u00e8me national d\u2019alerte par t\u00e9l\u00e9phone destin\u00e9 \u00e0 pr\u00e9venir les populations en cas de catastrophe ou de situation d\u2019urgence. [www.lavieeco.com]\n-------------------------------------------------\nLa pr\u00e9fecture de la province d\u2019El Jadida a finalis\u00e9, lundi, les pr\u00e9paratifs en pr\u00e9vision du test sur le terrain du syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone baptis\u00e9 \u00ab MA-INDAR \u00bb, mis en place par le minist\u00e8re de l\u2019Int\u00e9rieur afin de renforcer la rapidit\u00e9 et l\u2019efficacit\u00e9 de la transmission des alertes aux citoyens pr\u00e9sents dans les zones menac\u00e9es [.] [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc poursuit le renforcement de ses dispositifs de pr\u00e9vention et de gestion des risques avec la mise en place d\u2019un syst\u00e8me national d\u2019alerte publique par t\u00e9l\u00e9phone mobile. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Fondation Al Mada et l\u2019Agence\nnationale des eaux et for\u00eats...", "mass": 5, "physics": false, "shape": "box", "title": "Fondation Al Mada et l\u2019Agence nationale des eaux et for\u00eats (ANEF) ont sign\u00e9 une convention de partenariat portant sur un programme de plantation et de r\u00e9g\u00e9n\u00e9ration de 1.000 hectare. [lematin.ma]\n-------------------------------------------------\nLa Fondation Al Mada et l\u2019Agence Nationale des Eaux et For\u00eats (ANEF) ont conclu, lundi \u00e0 Rabat, un partenariat consacr\u00e9 \u00e0 la pr\u00e9servation et \u00e0 la r\u00e9g\u00e9n\u00e9ration de l\u2019arganeraie marocaine. [lnt.ma]\n-------------------------------------------------\nLa Fondation Al Mada et l\u2019Agence nationale des eaux et for\u00eats (ANEF) ont sign\u00e9, lundi 23 novembre, \u00e0 Rabat, une convention de partenariat portant sur la plantation et la r\u00e9g\u00e9n\u00e9ration, dans un premier temps, de 1.000 hectares d\u2019arganiers dans la r\u00e9gion du Souss-Massa. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Managem a r\u00e9alis\u00e9 un chiffre\nd\u2019affaires consolid\u00e9 de 17 MMDH...", "mass": 5, "physics": false, "shape": "box", "title": "Managem a r\u00e9alis\u00e9 un chiffre d\u2019affaires consolid\u00e9 de 17 MMDH \u00e0 fin septembre 2026, contre 7,42 MMDH \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, soit une progression de 129%. [lematin.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires consolid\u00e9 du groupe Managem s\u2019est \u00e9tabli \u00e0 plus de 17 milliards de dirhams (MMDH) \u00e0 fin septembre 2026, en forte hausse de 129% par rapport [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Bank of Africa a enregistr\u00e9\nun r\u00e9sultat net part du...", "mass": 5, "physics": false, "shape": "box", "title": "Bank of Africa a enregistr\u00e9 un r\u00e9sultat net part du groupe (RNPG) de 3,4 milliards de dirhams \u00e0 fin septembre 2026, en hausse de 13% par rapport aux 3 milliards de dirhams r\u00e9alis\u00e9s. [lematin.ma]\n-------------------------------------------------\nSon produit net bancaire, lui, reste stable, la bonne tenue du c\u0153ur de m\u00e9tier compense un net reflux des activit\u00e9s de march\u00e9. [telquel.ma]\n-------------------------------------------------\nLe r\u00e9sultat net part du groupe (RNPG) de Bank of Africa (BOA) s\u2019est \u00e9tabli \u00e0 3,4 milliards de dirhams (MMDH) \u00e0 fin septembre 2026, en progression de 13% [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Apr\u00e8s avoir \u00e9limin\u00e9 le Br\u00e9sil\nen demi-finale, les Lions de...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s avoir \u00e9limin\u00e9 le Br\u00e9sil en demi-finale, les Lions de l\u2019Atlas s\u2019inclinent face au Ghana (1-0) et remportent la m\u00e9daille d\u2019argent. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football pour amput\u00e9s a conclu sa participation \u00e0 la Coupe du monde 2026 par une deuxi\u00e8me place, apr\u00e8s s\u2019\u00eatre inclin\u00e9e face au Ghana sur le score de 1 but \u00e0 0, dimanche soir au Mexique. [lnt.ma]\n-------------------------------------------------\nOppos\u00e9s au Ghana en finale au stade San Mart\u00edn de San Juan de los Lagos, les Marocains se sont inclin\u00e9s sur le score de 1 \u00e0 0, d\u00e9crochant ainsi une belle deuxi\u00e8me place. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c9lu \u00e0 la t\u00eate de\nla commune sous les couleurs...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c9lu \u00e0 la t\u00eate de la commune sous les couleurs du Mouvement populaire en 2021, Mustapha Lakhsem a rejoint le Mouvement d\u00e9mocratique et social pour les l\u00e9gislatives de septembre. [telquel.ma]\n-------------------------------------------------\nRendu en premi\u00e8re instance, ce jugement fait suite \u00e0 une plainte du Mouvement populaire, d\u00e9pos\u00e9e apr\u00e8s le ralliement de Lakhsem au Mouvement d\u00e9mocratique et social. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les militaires ont saisi leurs\narmes et leur ont ordonn\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Les militaires ont saisi leurs armes et leur ont ordonn\u00e9 de rester sur place dans l\u2019attente d\u2019une d\u00e9cision des autorit\u00e9s, rapporte l\u2019agence de presse mauritanienne Al-Akhbar. [telquel.ma]\n-------------------------------------------------\nL\u2019arm\u00e9e mauritanienne a intercept\u00e9 des membres arm\u00e9s du groupe s\u00e9paratiste polisario ayant p\u00e9n\u00e9tr\u00e9 sur son territoire et proc\u00e9d\u00e9 \u00e0 la saisie de leurs armes, selon des informations rapport\u00e9es par l\u2019agence de presse mauritanienne Al-Akhbar. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Tribunal arbitral du sport\nrendra sa d\u00e9cision mardi 24...", "mass": 5, "physics": false, "shape": "box", "title": "Le Tribunal arbitral du sport rendra sa d\u00e9cision mardi 24 novembre dans l\u2019apr\u00e8s-midi. [telquel.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a annonc\u00e9, lundi, qu\u2019il rendrait \u00ab mardi 24 novembre 2026 dans le courant de l\u2019apr\u00e8s-midi \u00bb sa d\u00e9cision concernant le recours du S\u00e9n\u00e9gal contre [www.challenge.ma]\n-------------------------------------------------\nLa f\u00e9d\u00e9ration de football du Maroc a adress\u00e9 un courrier officiel au Tribunal arbitral du sport (TAS) signalant un \u00ab incident \u00bb \u00e0 quelques heures de sa d\u00e9cision concernant le recours du S\u00e9n\u00e9gal contre la victoire du Maroc sur tapis vert de la finale de la CAN 2025. [fr.hespress.com]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale marocaine de football aurait demand\u00e9 au Tribunal arbitral du sport (TAS) de suspendre la notification de sa d\u00e9cision concernant la finale de la Coupe d\u2019Afrique des nations 2025, quelques heures avant le verdict attendu mardi 24 novembre dans l\u2019apr\u00e8s-midi, rapporte RMC Sport. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts\n(DGI) rappelle que plusieurs cat\u00e9gories...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale des imp\u00f4ts (DGI) rappelle que plusieurs cat\u00e9gories de contribuables sont tenues de s\u2019acquitter de certaines obligations fiscales, notamment en mati\u00e8re de versement d\u2019imp\u00f4ts et de [www.challenge.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale des imp\u00f4ts (DGI) rappelle que plusieurs cat\u00e9gories de contribuables ont jusqu\u2019au 30 novembre 2026 pour effectuer des versements fiscaux, notamment au titre d\u2019op\u00e9rations r\u00e9alis\u00e9es en octobre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le ministre de l\u2019Industrie, du\nCommerce, de l\u2019Investissement et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Industrie, du Commerce, de l\u2019Investissement et de l\u2019Inclusion \u00e9conomique, Ryad Mezzour, s\u2019est entretenu lundi 23 novembre \u00e0 Rabat avec Robert Troy, ministre d\u2019\u00c9tat irlandais aupr\u00e8s du ministre des Finances, du renforcement des relations \u00e9conomiques et commerciales entre les deux pays. [www.yabiladi.com]\n-------------------------------------------------\nLe renforcement des liens \u00e9conomiques et commerciaux entre le Maroc et l\u2019Irlande a \u00e9t\u00e9 au centre d\u2019entretiens, lundi \u00e0 Rabat, entre le ministre de l\u2019Industrie, du Commerce, de l\u2019Investissement et de l\u2019Inclusion \u00e9conomique, Ryad Mezzour, et le ministre d\u2019\u00c9tat irlandais aupr\u00e8s du ministre des Finances, Robert Troy. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Belle entame La s\u00e9lection marocaine\nde football des personnes de...", "mass": 5, "physics": false, "shape": "box", "title": "Belle entame La s\u00e9lection marocaine de football des personnes de petite taille a r\u00e9ussi son entr\u00e9e en lice \u00e0 la deuxi\u00e8me \u00e9dition de la Coupe du monde de la discipline, en s\u2019imposant face au Guatemala sur le score de 2 \u00e0 0, samedi \u00e0 la salle couverte de Skikina, \u00e0 T\u00e9mara, pour le compte de . [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football des personnes de petite taille s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde 2026, en s\u2019imposant largement face \u00e0 son homologue am\u00e9ricaine sur le score de 9 \u00e0 0, lundi \u00e0 la salle couverte de Skikina \u00e0 T\u00e9mara, pour le compte de la troisi\u00e8me journ\u00e9e du . [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football des personnes de petite taille s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde, lundi 23 novembre 2026, apr\u00e8s sa victoire 9-0 contre les \u00c9tats-Unis \u00e0 la salle couverte de Skikina, \u00e0 T\u00e9mara. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Class\u00e9e 184e sur 1.058 \u00e9tablissements\nde 102 pays, l\u0027universit\u00e9 de...", "mass": 5, "physics": false, "shape": "box", "title": "Class\u00e9e 184e sur 1.058 \u00e9tablissements de 102 pays, l\u0027universit\u00e9 de K\u00e9nitra se hisse en t\u00eate des universit\u00e9s marocaines, publiques et priv\u00e9es confondues. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Universit\u00e9 Ibn Tofa\u00efl de K\u00e9nitra arrive en t\u00eate des \u00e9tablissements marocains, publics et priv\u00e9s, dans l\u2019\u00e9dition 2027 du classement Interdisciplinary Science Rankings de Times Higher Education (THE). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Taxe de solidarit\u00e9, retenue \u00e0\nla source sur les produits...", "mass": 5, "physics": false, "shape": "box", "title": "Taxe de solidarit\u00e9, retenue \u00e0 la source sur les produits de location et contribution aux rente  pour un gouvernement ouvert (PGO). [leseco.ma]\n-------------------------------------------------\nL\u2019Alliance africaine des institutions ouvertes d\u2019int\u00e9grit\u00e9 et de lutte contre la corruption a \u00e9t\u00e9 lanc\u00e9e lundi \u00e0 Marrakech, lors de la c\u00e9r\u00e9monie de cl\u00f4ture d\u2019une rencontre ayant r\u00e9uni les responsables des instances et commissions africaines d\u2019int\u00e9grit\u00e9 et de lutte contre la corruption. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Nexans Maroc lance la troisi\u00e8me\n\u00e9dition du Nexans Innovation Challenge,...", "mass": 5, "physics": false, "shape": "box", "title": "Nexans Maroc lance la troisi\u00e8me \u00e9dition du Nexans Innovation Challenge, un programme destin\u00e9 \u00e0 faire \u00e9merger des solutions innovantes dans le domaine de l\u2019\u00e9lectrification. [lnt.ma]\n-------------------------------------------------\nNexans, leader de la conception et de la fabrication de syst\u00e8mes de c\u00e2bles et de services associ\u00e9s, annonce le lancement de la troisi\u00e8me \u00e9dition du Nexans Innovation Challenge, une initiative port\u00e9e par Nexans Maroc, en partenariat avec le Minist\u00e8re de l\u2019Industrie, du Commerce, de l\u2019Investissement et de l\u2019Inclusion \u00e9conomique, le Minist\u00e8re de l\u2019\u00c9nergie, des Mines et du D\u00e9veloppement durable, l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) et le Cluster ENR, pour faire \u00e9merger et accompagner des solutions innovantes r\u00e9pondant aux grands d\u00e9fis de l\u2019\u00e9lectrification. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Dans un communiqu\u00e9 publi\u00e9 sur\nson site officiel, Al Ahly...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un comm         }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
