t.ma", "url": "https://lnt.ma/lecornu-souligne-le-caractere-strategique-de-la-cooperation-economique-entre-la-france-et-le-maroc/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Cette initiative, d\u00e9voil\u00e9e lors d\u2019une\nconf\u00e9rence de presse organis\u00e9e \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Cette initiative, d\u00e9voil\u00e9e lors d\u2019une conf\u00e9rence de presse organis\u00e9e \u00e0 l\u2019issue de la 15\u1d49 R\u00e9union de haut niveau maroco-fran\u00e7aise, constitue, selon lui, l\u2019un des grands projets \u00e9conomiques destin\u00e9s . [fr.hespress.com]\n-------------------------------------------------\nLe chef du gouvernement Aziz Akhannouch a eu, jeudi 16 juillet \u00e0 Rabat, des entretiens avec le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu, qui effectue une visite de travail au Maroc \u00e0 la t\u00eate d\u2019une d\u00e9l\u00e9gation fran\u00e7aise, dans le cadre des travaux de la 15\u1d49 r\u00e9union de haut niveau Maroc\u2013France. [telquel.ma]\n-------------------------------------------------\nPlusieurs accords de coop\u00e9ration et de partenariat ont \u00e9t\u00e9 sign\u00e9s, jeudi \u00e0 Rabat, entre le Maroc et la France dans le cadre de la 15e R\u00e9union de Haut Niveau (RHN), co-pr\u00e9sid\u00e9e par le Chef du Gouvernement, Aziz Akhannouch, et le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu. [aujourdhui.ma]\n-------------------------------------------------\n\u00c0 l\u0027ouverture de la 15e R\u00e9union de Haut Niveau Maroc-France, le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu, a soulign\u00e9 que cette rencontre marque une \u00e9tape d\u00e9cisive dans la relance des relations bilat\u00e9rales et pr\u00e9pare une nouvelle phase de coop\u00e9ration appel\u00e9e \u00e0 \u00eatre consolid\u00e9e par un futur trait\u00e9 d\u0027amiti\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nPlusieurs accords de coop\u00e9ration et de partenariat ont \u00e9t\u00e9 sign\u00e9s, ce jeudi \u00e0 Rabat, entre le Maroc et la France dans le cadre de la 15e R\u00e9union de Haut Niveau (RHN), co-pr\u00e9sid\u00e9e par le chef du gouvernement, Aziz Akhannouch, et le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu. [leseco.ma]\n-------------------------------------------------\nPlusieurs accords de coop\u00e9ration et de partenariat ont \u00e9t\u00e9 sign\u00e9s, jeudi \u00e0 Rabat, entre le Maroc et la France dans le cadre de la 15e R\u00e9union de Haut Niveau (RHN), co-pr\u00e9sid\u00e9e par le Chef du Gouvernement, Aziz Akhannouch, et le Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu. [www.lereporter.ma]\n-------------------------------------------------\nLe Premier ministre fran\u00e7ais, S\u00e9bastien Lecornu, a mis en avant le caract\u00e8re strat\u00e9gique de la coop\u00e9ration \u00e9conomique entre la France et le Maroc, \u00e9voquant les projets ambitieux port\u00e9s par les deux pays dans les domaines notamment des transports, de l\u2019\u00e9nergie et des technologies de pointe. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "le Roi offre un d\u00e9jeuner\nen l\u0027honneur du Premier ministre...", "mass": 5, "physics": false, "shape": "box", "title": "le Roi offre un d\u00e9jeuner en l\u0027honneur du Premier ministre fran\u00e7ais et la d\u00e9l\u00e9gation l\u2019accompagnant pr\u00e9sid\u00e9 par Akhannouch. [lematin.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI a offert, jeudi \u00e0 Rabat, un d\u00e9jeuner en l\u2019honneur du Premier ministre fran\u00e7ais, M. S\u00e9bastien Lecornu, et de la d\u00e9l\u00e9gation l\u2019accompagnant, pr\u00e9sid\u00e9 par le Chef du gouvernement, M. Aziz Akhannouch. [www.lereporter.ma]"}, {"borderWidth": 3, "fi     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
