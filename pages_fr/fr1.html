mi-les-destinations-incontournables-de-2026/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 6, "id": 295, "label": "Le CESE appelle \u00e0 un...", "shape": "dot", "size": 59, "title": "Le CESE appelle \u00e0 un Small Business Act pour relancer les micro-entreprises\nSource: lnt.ma", "url": "https://lnt.ma/le-cese-appelle-a-un-small-business-act-pour-relancer-les-micro-entreprises/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La Fondation Nationale des Mus\u00e9es\n(FNM), la F\u00e9d\u00e9ration Royale Marocaine...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation Nationale des Mus\u00e9es (FNM), la F\u00e9d\u00e9ration Royale Marocaine des Jeux \u00c9lectroniques (FRMJE) et la Ligue R\u00e9gionale Rabat-Sal\u00e9-K\u00e9nitra des Jeux \u00c9lectroniques (LRRSKJE) ont sign\u00e9, mercredi 12 novembre 2025, au Mus\u00e9e Mohammed VI d\u2019Art Moderne et Contemporain de Rabat, une convention de partenariat in\u00e9dite consacr\u00e9e \u00e0 la valorisation du patrimoine culturel \u00e0 travers le num\u00e9rique . [fr.hespress.com]\n-------------------------------------------------\nUne convention de partenariat a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, entre la Fondation nationale des mus\u00e9es (FNM), la F\u00e9d\u00e9ration royale marocaine des jeux \u00e9lectroniques (FRMJE) et la Ligue r\u00e9gionale Rabat-Sal\u00e9-K\u00e9nitra des jeux \u00e9lectroniques, en vue de promouvoir la culture num\u00e9rique et le jeu vid\u00e9o. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de\nl\u2019Inclusion sociale, Abdeljabbar Rachidi, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Inclusion sociale, Abdeljabbar Rachidi, a annonc\u00e9 ce mardi, lors de son intervention \u00e0 la Chambre des conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques au cours de l\u2019ann\u00e9e 2025, dans le cadre du projet d\u2019\u00e9ducation inclusive. [fr.hespress.com]\n-------------------------------------------------\nLe secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Insertion sociale, Abdeljebbar Rachidi, a indiqu\u00e9, mardi \u00e0 Rabat devant la Chambre des Conseillers, que 5.000 enfants en situation de handicap ont \u00e9t\u00e9 int\u00e9gr\u00e9s dans les \u00e9coles publiques en 2025, dans le cadre du Projet de l\u2019\u00e9ducation inclusive. [telquel.ma]\n-------------------------------------------------\nBilan : Le nombre total des enfants en situation de handicap ayant b\u00e9n\u00e9fici\u00e9 du processus d\u2019int\u00e9gration dans les \u00e9coles publiques s\u2019\u00e9l\u00e8ve, \u00e0 ce jour, \u00e0 70.000 enfants, a indiqu\u00e9 mardi au Parlement le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019insertion sociale, Abdeljebbar Rachidi. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Princesse Lalla Zineb, Pr\u00e9sidente\nde la Ligue Marocaine pour...", "mass": 5, "physics": false, "shape": "box", "title": "La Princesse Lalla Zineb, Pr\u00e9sidente de la Ligue Marocaine pour la Protection de l\u2019Enfance, a re\u00e7u mercredi \u00e0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahia, en marge de sa visite au centre Lalla Meriem des enfants sans protection familiale. [fr.hespress.com]\n-------------------------------------------------\nSous le haut patronage de Son Altesse la Princesse Lalla Zineb, la Ligue Marocaine pour la Protection de l\u2019Enfance et le minist\u00e8re de la Solidarit\u00e9 unissent leurs efforts pour renforcer la prise en charge et l\u2019insertion des enfants en situation de vuln\u00e9rabilit\u00e9. [www.lopinion.ma]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de la Ligue Marocaine pour la Protection de l\u2019Enfance, a re\u00e7u mercredi \u00e0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahia, en marge de sa visite au centre Lalla Meriem des enfants sans protection familiale. [www.lereporter.ma]\n-------------------------------------------------\nLors de cette audience, les discussions ont port\u00e9 sur les moyens de continuer \u00e0 d\u00e9velopper les m\u00e9canismes de coop\u00e9ration bilat\u00e9rale dans les domaines d\u2019int\u00e9r\u00eat commun tel que l\u2019app. [lematin.ma]\n-------------------------------------------------\nSon Altesse la Princesse Lalla Zineb, Pr\u00e9sidente de la Ligue Marocaine pour la Protection de l\u2019Enfance, a re\u00e7u mercredi \u00e0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahia, en marge de sa visite au centre Lalla Meriem des enfants sans protection familiale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Cette op\u00e9ration, men\u00e9e dans le\ncadre de la coop\u00e9ration s\u00e9curitaire...", "mass": 5, "physics": false, "shape": "box", "title": "Cette op\u00e9ration, men\u00e9e dans le cadre de la coop\u00e9ration s\u00e9curitaire entre la Gendarmerie Royale et la Garde civile espagnole, a permis de neutraliser un r\u00e9seau transfrontalier de tr. [lematin.ma]\n-------------------------------------------------\nLa Garde civile espagnole a annonc\u00e9, mercredi, le d\u00e9mant\u00e8lement d\u2019un r\u00e9seau criminel sp\u00e9cialis\u00e9 dans le trafic de haschich \u00e0 l\u2019aide de drones, gr\u00e2ce \u00e0 la collaboration avec la Gendarmerie Royale. [www.lopinion.ma]\n-------------------------------------------------\nLa Garde civile espagnole a annonc\u00e9, mercredi, le d\u00e9mant\u00e8lement d\u2019un r\u00e9seau criminel sp\u00e9cialis\u00e9 dans le trafic de haschich \u00e0 l\u2019aide de drones, gr\u00e2ce \u00e0 la collaboration avec la Gendarmerie Royale. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La compagnie a repris la\nligne Rennes-Marrakech d\u00e8s fin octobre,...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a repris la ligne Rennes-Marrakech d\u00e8s fin octobre, op\u00e9rationnelle pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanch. [lematin.ma]\n-------------------------------------------------\nLes deux liaisons a\u00e9riennes directes Rennes-Marrakech et Brest-Marrakech sont d\u00e9sormais assur\u00e9es deux fois par semaines sur toute l\u2019ann\u00e9e par Transavia France, a-t-on indiqu\u00e9 aupr\u00e8s de cette compagnie low-cost. [telquel.ma]\n-------------------------------------------------\nCes deux liaisons sont assur\u00e9es par Transavia France, pour toute l\u0027ann\u00e9e \u00e0 raison de deux vols hebdomadaires propos\u00e9s tous les jeudis et dimanches. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "\u00c0 quelques jours du premier\ntest de la fen\u00eatre internationale...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 quelques jours du premier test de la fen\u00eatre internationale de novembre face au Mozambique, les Lions de l\u2019Atlas ont peaufin\u00e9 leur pr\u00e9paration dans leur tani\u00e8re de Ma\u00e2mora. [lematin.ma]\n-------------------------------------------------\nLa capitale du D\u00e9troit accueillera les deux rencontres amicales des Lions de l\u2019Atlas face au Mozambique et \u00e0 l\u2019Ouganda, programm\u00e9es dans le cadre de la pr\u00e9paration pour la prochaine Coupe d\u2019Afrique . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Les Lionceaux de l\u2019Atlas entament\nla phase \u00e0 \u00e9limination directe...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lionceaux de l\u2019Atlas entament la phase \u00e0 \u00e9limination directe du Mondial U17 avec un duel d\u00e9cisif face aux \u00c9tats-Unis, ce vendredi \u00e0 16 h 45 sur la pelouse de l\u2019Aspire Zone Pitc. [lematin.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc des moins de 17 ans affrontera les Etats-Unis, vendredi \u00e0 l\u2019Aspire Zone \u00e0 Doha au Qatar, pour le compte des 16es de finale de la Coupe du monde de la cat\u00e9gorie, \u00e0 l\u2019issue des derniers matchs de la phase de poules disput\u00e9s mardi. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Avant l\u2019inauguration de son unit\u00e9\nde production des drones SPY-X...", "mass": 5, "physics": false, "shape": "box", "title": "Avant l\u2019inauguration de son unit\u00e9 de production des drones SPY-X \u00e0 Benslimane, une \u00e9quipe marocaine a b\u00e9n\u00e9fici\u00e9 d\u2019une formation d\u00e9di\u00e9e au transfert de technologie. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019entreprise isra\u00e9lienne BlueBird Aero Systems a annonc\u00e9, le 12 novembre dans un post sur LinkedIn, avoir accueilli une \u00e9quipe technique marocaine pour une session de formation approfondie sur la production de drones SPY-X. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Dans une \u00e9tude consacr\u00e9e aux\nd\u00e9fis des micro, tr\u00e8s petites...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une \u00e9tude consacr\u00e9e aux d\u00e9fis des micro, tr\u00e8s petites et petites entreprises (micro/TPE/PE), le Conseil \u00e9conomique, social et environnemental (CESE) tire la sonnette d\u2019alarme sur la fragilit\u00e9 d\u2019un secteur pourtant vital pour l\u2019\u00e9conomie nationale. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) recommande l\u2019adoption d\u2019un \u00abSmall Business Act\u00bb et l\u2019acc\u00e9l\u00e9ration de la mise en \u0153uvre d\u2019un dispositif de financement et d\u2019accompagnement d\u00e9di\u00e9 aux tr\u00e8s petites et petites entreprises. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil \u00e9conomique, social et environnemental (CESE) recommande l\u2019adoption d\u2019un \u00ab Small Business Act \u00bb et l\u2019acc\u00e9l\u00e9ration de la mise en \u0153uvre d\u2019un dispositif de financement et d\u2019accompagnement d\u00e9di\u00e9 aux tr\u00e8s petites et petites entreprises, afin de renforcer leur r\u00e9silience, soutenir leur croissance et moderniser leurs unit\u00e9s de production. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les recettes douani\u00e8res nettes se\nsont \u00e9tablies \u00e0 plus de...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes douani\u00e8res nettes se sont \u00e9tablies \u00e0 plus de 83,5 milliards de dirhams (MMDH) au terme des dix premiers mois de 2025, en hausse de 9,5% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [www.lopinion.ma]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre un d\u00e9ficit de 40,5 MMDH un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nCes \u00e9missions ont repr\u00e9sent\u00e9 un taux de r\u00e9alisation de 58% du total pr\u00e9vu par la loi de finances 2025, pr\u00e9cise la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume dans son r\u00e9cent bulletin mensuel de statistiques des finances publiques (BMSFP). [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit budg\u00e9taire du Maroc a atteint 55,5 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, contre 40,5 MMDH \u00e0 la m\u00eame p\u00e9riode de 2024, selon les donn\u00e9es publi\u00e9es par la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR) dans son dernier Bulletin mensuel de statistiques des finances publiques (BMSFP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9\ndepuis un an en Alg\u00e9rie...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, incarc\u00e9r\u00e9 depuis un an en Alg\u00e9rie et au c\u0153ur d\u2019une crise diplomatique entre Alger et Paris, va b\u00e9n\u00e9ficier d\u2019une gr\u00e2ce pr\u00e9sidentielle, a annonc\u00e9 mercredi 12 novembre la pr\u00e9sidence alg\u00e9rienne. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a accept\u00e9 une demande de l\u2019Allemagne de gracier et transf\u00e9rer l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, emprisonn\u00e9 depuis un an, dans ce pays pour qu\u2019il puisse y \u00eatre soign\u00e9, a indiqu\u00e9 un communiqu\u00e9 de la pr\u00e9sidence alg\u00e9rienne mercredi. [telquel.ma]\n-------------------------------------------------\nAtteint d\u0027un cancer, le romancier et essayiste avait \u00e9t\u00e9 arr\u00eat\u00e9 le 16 novembre 2024, avant d\u0027\u00eatre condamn\u00e9 en appel en juillet \u00e0 cinq ans de r\u00e9clusion. [atlasinfo.fr]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a annonc\u00e9 ce mercredi 12 novembre 2025 avoir \u00abaccept\u00e9\u00bb de gracier l\u2019\u00e9crivain franco-alg\u00e9rien Boualem Sansal, \u00e2g\u00e9 de 80 ans, d\u00e9tenu depuis pr\u00e8s d\u2019un an. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Des rafales de vent localement\nfortes avec chasse-poussi\u00e8res ainsi que...", "mass": 5, "physics": false, "shape": "box", "title": "Des rafales de vent localement fortes avec chasse-poussi\u00e8res ainsi que des averses orageuses par endroits et rafales de vent sous orages sont attendues, de mercredi \u00e0 jeudi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDes rafales de vent localement fortes avec chasse-poussi\u00e8res ainsi que des averses orageuses par endroits et rafales de vent sous orages sont attendues, de mercredi \u00e0 jeudi, dans plusieurs Provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses et des vents forts sont attendus, dans les prochaines 24 heures, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) [www.challenge.ma]\n-------------------------------------------------\nPlusieurs provinces sont concern\u00e9es, annonce la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie dans un bulletin de niveau de vigilance orange. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nAu total, 350 amendements ont \u00e9t\u00e9 pr\u00e9sent\u00e9s au cours de cette s\u00e9ance tenue en pr\u00e9sence du ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa, dont 325 \u00e9manant de l\u2019opposition, 23 de la majorit\u00e9 et deux amendements introduits par l\u2019Ex\u00e9cutif. [aujourdhui.ma]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, dans les premi\u00e8res heures de mercredi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) de l\u2019ann\u00e9e 2026. [atlasinfo.fr]\n-------------------------------------------------\nLa Commission des finances et du d\u00e9veloppement \u00e9conomique de la Chambre des repr\u00e9sentants a approuv\u00e9, mercredi t\u00f4t dans la matin\u00e9e, la premi\u00e8re partie du projet de loi de finances (PLF) pour l\u2019ann\u00e9e 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Les quatorze ports marocains ouverts\nau commerce international assurent 95%...", "mass": 5, "physics": false, "shape": "box", "title": "Les quatorze ports marocains ouverts au commerce international assurent 95% de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a soulign\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nLes quatorze ports marocains ouverts au commerce international assurent 95 % de l\u2019ensemble des \u00e9changes ext\u00e9rieurs du Royaume, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [lnt.ma]\n-------------------------------------------------\nLors de la s\u00e9ance hebdomadaire des questions orales \u00e0 la Chambre des Conseillers, le ministre de l\u0027\u00c9quipement et de l\u0027Eau, Nizar Baraka, a r\u00e9pondu \u00e0 plusieurs questions sur les secteurs d\u00e9veloppement infrastructurel du Maroc. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "L\u2019op\u00e9rateur global inwi vient de\nrecevoir une cons\u00e9cration exceptionnelle lors...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9rateur global inwi vient de recevoir une cons\u00e9cration exceptionnelle lors de lors de l\u2019\u00e9dition marocaine de l\u2019\u00e9tude \u00abBrand Africa 100 \u2013 Morocco\u2019s Best Brands\u00bb, r\u00e9alis\u00e9e par Brand Africa, [www.challenge.ma]\n-------------------------------------------------\nDistinction : inwi vient d\u2019annoncer qu\u2019elle a remport\u00e9 4 prix lors de \u00abBrand Africa 100\u00bb, \u00e0 savoir le premier prix \u00abMarque t\u00e9l\u00e9com marocaine la plus admir\u00e9e\u00bb, le premier prix \u00abMarque marocaine la plus admir\u00e9e toutes cat\u00e9gories confondues\u00bb, le premier prix . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Sous la direction artistique de\nYasm articipation des jeunes et des . [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a soulign\u00e9, mercredi \u00e0 Rabat, que le projet de loi organique N\u00b053.25 modifiant et compl\u00e9tant la loi organique N\u00b027.11 relative \u00e0 la Chambre des repr\u00e9sentants vise en premier lieu \u00e0 consacrer et \u00e0 consolider les r\u00e8gles n\u00e9cessaires pour la moralisation des \u00e9lections des membres de la Chambre basse du parlement marocain. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a pr\u00e9sent\u00e9 mercredi devant la Commission de l\u2019Int\u00e9rieur, des Collectivit\u00e9s territoriales, de l\u2019Habitat, de la Politique de la Ville et des Affaires administratives \u00e0 la Chambre des repr\u00e9sentants, un ensemble de projets de loi visant \u00e0 moderniser en profondeur le syst\u00e8me \u00e9lectoral marocain, \u00e0 moraliser la vie politique et . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Le Royaume s\u0027impose parmi les\ndestinations mondiales qui se distinguent...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume s\u0027impose parmi les destinations mondiales qui se distinguent par leurs cultures dynamiques, leur riche histoire, leurs paysages uniques et leurs exp\u00e9riences de. [lematin.ma]\n-------------------------------------------------\nLe Maroc figure parmi les 10 destinations touristiques \u00ab incontournables \u00bb pour 2026, offrant aux voyageurs une exp\u00e9rience passionnante et des aventures inoubliables, \u00e9crit le magazine sp\u00e9cialis\u00e9 Travel and Tour World (TTW) bas\u00e9 aux Etats-Unis. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "lab         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }

        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
