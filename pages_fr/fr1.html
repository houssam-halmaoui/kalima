n Pr\u00e9sident Directeur G\u00e9n\u00e9ral. [www.lavieeco.com]\n-------------------------------------------------\nLe Groupe Attijariwafa Bank informe le public qu\u2019un contenu circulant actuellement sur internet et les r\u00e9seaux sociaux diffuse de fausses informations en utilisant l\u2019image, la voix et le nom de son Pr\u00e9sident Directeur G\u00e9n\u00e9ral. [www.lereporter.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank a publi\u00e9 un communiqu\u00e9 mettant en garde le public contre la diffusion, sur internet et les r\u00e9seaux sociaux, d\u2019un contenu frauduleux utilisant de mani\u00e8re ill\u00e9gitime l\u2019image, la voix et le nom de son Pr\u00e9sident Directeur G\u00e9n\u00e9ral. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc a accueilli 16,6\nmillions de touristes au cours...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a accueilli 16,6 millions de touristes au cours des dix premiers mois de 2025, en progression de 14% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, a fait savoir, vendredi \u00e0 Casablanca, la ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc a accueilli 16,6 millions de touristes au cours des dix premiers mois de 2025, en progression de 14% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, a fait savoir, vendredi \u00e0 Casablanca, la ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor. [telquel.ma]\n-------------------------------------------------\nLe Maroc a accueilli 16,6 millions de touristes au cours des dix premiers mois de 2025, en progression de 14% par rapport \u00e0 la m\u00eame p\u00e9riode un an auparavant, a fait savoir, vendred                 },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
