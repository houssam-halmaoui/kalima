ay Abdallah Amghar. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du\nBudget, Fouzi Lekjaa, a affirm\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa, a affirm\u00e9 que \u00ab le projet de loi de finances pour l\u2019ann\u00e9e 2026 ne peut \u00eatre envisag\u00e9 en dehors d\u2019un processus historique initi\u00e9 il y a plus de 26 ans, un parcours qui illustre clairement la vision d\u2019un d\u00e9veloppement marocain conciliant dimension \u00e9conomique et dynamisme positif orient\u00e9 vers . [fr.hespress.com]\n-------------------------------------------------\nFouzi Lekjaa, ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, a affirm\u00e9 qu\u2019\u00ab il est impossible de comprendre le projet de loi de finances 2026 sans le replacer dans une trajectoire historique entam\u00e9e il y a plus de 26 ans \u00bb. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa, a affirm\u00e9, mercredi \u00e0 Rabat, que le projet de loi de finances (PLF) de 2026 s\u2019inscrit dans un processus historique qui s\u2019\u00e9tend sur plus de 26 ans, en ligne avec les Hautes Orientations Royales visant \u00e0 b\u00e2tir un mod\u00e8le de d\u00e9veloppement conciliant les dimensions \u00e9conomique et sociale. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa, a affirm\u00e9, mercredi \u00e0 Rabat, que le projet de loi de finances (PLF) de 2026 s\u2019inscrit dans un processus historique qui s\u2019\u00e9tend sur plus de 26 ans, en ligne avec les Hautes Orientations Royales visant \u00e0 b\u00e2tir un mod\u00e8le de d\u00e9veloppement conciliant les dimensions \         });

            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
