-------------------------------------------\nOrganis\u00e9 du 25 au 27 juin, le Festival Gnaoua et musiques du monde a une nouvelle fois marqu\u00e9 les esprits en transformant Essaouira en un v\u00e9ritable carrefour des . [aujourdhui.ma]\n-------------------------------------------------\nLa 27e \u00e9dition du Festival Gnaoua et Musiques du monde s\u2019est achev\u00e9e, samedi dernier \u00e0 Essaouira, dans une atmosph\u00e8re de f\u00eate, de partage et de ferveur populaire. [leseco.ma]\n-------------------------------------------------\nLe Festival Gnaoua et Musiques du Monde a cl\u00f4tur\u00e9 samedi sa 27e \u00e9dition apr\u00e8s trois jours de concerts, de cr\u00e9ations artistiques et de rencontres culturelles ayant r\u00e9uni plus de 300.000 festivaliers dans la cit\u00e9 des Aliz\u00e9s, selon les organisateurs. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00c0 la veille du 16\u00e8\nde finale de la Coupe...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, sest montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 l\u2019aube de son huiti\u00e8me de finale de la Coupe du monde 2026 face aux Pays-Bas, la s\u00e9lection marocaine affiche confiance et d\u00e9termination, tout en mesurant l\u2019ampleur du d\u00e9fi qui l\u2019attend lundi au stade de Monterrey. [lnt.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur des Pays-Bas, Ronald Koeman, s\u0027est montr\u00e9 \u00e9logieux envers la s\u00e9lection marocaine, estimant que le match de 16e de finale entre les deux \u00e9quipes, pr\u00e9vu lundi, sera \"un grand match\" entre deux pr\u00e9tendants aux premiers r\u00f4les de la Coupe du monde 2026. [leseco.ma]\n-------------------------------------------------\n\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, s\u2019est montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Les r\u00e9sultats des comptes nationaux\ndu premier trimestre 2026 montrent...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6 % au premier trimestre 2026, contre 5 % \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les comptes nationaux publi\u00e9s lundi par le Haut-Commissariat au Plan (HCP). [lnt.ma]\n-------------------------------------------------\nLes comptes nationaux du premier trimestre 2026 publi\u00e9s par le Haut-Commissariat au Plan (HCP) montrent que l\u0027\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6%, contre 5%. [lematin.ma]\n-------------------------------------------------\nLes r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nCette demande a contribu\u00e9 pour 6,9 points \u00e0 la croissance \u00e9conomique nationale au lieu de 5,3 points, indique le HCP dans sa note d\u2019information sur la situation \u00e9conomique [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les Tr\u00e8s petites, petites et\nmoyennes entreprises (TPME) continuent d\u2019\u00eatre...", "mass": 5, "physics": false, "shape": "box", "title": "Les Tr\u00e8s petites, petites et moyennes entreprises (TPME) continuent d\u2019\u00eatre au centre des priorit\u00e9s des responsables publics avec le lancement effectif d\u2019une nouvelle exp\u00e9rience pilote. [aujourdhui.ma]\n-------------------------------------------------\nLe Fonds Mohammed VI pour l\u2019Investissement (FM6I) a lanc\u00e9, vendredi \u00e0 Rabat, la premi\u00e8re promotion pilote de son Programme d\u2019appui aux entreprises marocaines, destin\u00e9 \u00e0 renforcer les capacit\u00e9s des entreprises, \u00e0 am\u00e9liorer leur gouvernance et \u00e0 les pr\u00e9parer \u00e0 l\u2019investissement. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Orange Maroc et Cash Plus\nont annonc\u00e9, lundi 29 juin,...", "mass": 5, "physics": false, "shape": "box", "title": "Orange Maroc et Cash Plus ont annonc\u00e9, lundi 29 juin, la signature d\u0027un partenariat strat\u00e9gique visant \u00e0 \u00e9largir l\u0027acc\u00e8s aux services financiers mobiles et aux offres t\u00e9l\u00e9c. [lematin.ma]\n-------------------------------------------------\nLe partenariat permet d\u00e9sormais aux d\u00e9tenteurs d\u2019un compte Orange Money d\u2019effectuer des op\u00e9rations de d\u00e9p\u00f4t et de retrait d\u2019esp\u00e8ces au sein du r\u00e9seau d\u2019agences Cash Plus, tout en ouvrant la voie \u00e0 la souscription aux offres t\u00e9l\u00e9coms Orange directement en agence Cash Plus. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color":     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
