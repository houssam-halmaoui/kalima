: 26}, "group": 2, "id": "comm_label_2", "label": "La R\u00e9publique f\u00e9d\u00e9rale de Somalie\na r\u00e9it\u00e9r\u00e9, vendredi, son soutien...", "mass": 5, "physics": false, "shape": "box", "title": "La R\u00e9publique f\u00e9d\u00e9rale de Somalie a r\u00e9it\u00e9r\u00e9, vendredi, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale et \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire et salu\u00e9 l\u2019adoption de la r\u00e9solution 2797 du Conseil de S\u00e9curit\u00e9 de l\u2019ONU. [fr.hespress.com]\n-------------------------------------------------\n\u200bLa R\u00e9publique f\u00e9d\u00e9rale de Somalie a r\u00e9it\u00e9r\u00e9, vendredi, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale et \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire et salu\u00e9 l\u2019adoption de la r\u00e9solution 2797 du Conseil de S\u00e9curit\u00e9 de l\u2019ONU. [www.lopinion.ma]\n-------------------------------------------------\nLa R\u00e9publique f\u00e9d\u00e9rale de Somalie a r\u00e9it\u00e9r\u00e9, vendredi, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale et \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire et salu\u00e9 l\u2019adoption de la r\u00e9solution 2797 du Conseil de S\u00e9curit\u00e9 de l\u2019ONU. [maroc-diplomatique.net]\n-------------------------------------------------\nLa R\u00e9publique f\u00e9d\u00e9rale de Somalie a r\u00e9it\u00e9r\u00e9, vendredi, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale et \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire et salu\u00e9 l\u2019adoption de la r\u00e9solution 2797 du Conseil de S\u00e9curit\u00e9 de l\u2019ONU. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le texte relatif \u00e0 la\nChambre des repr\u00e9sentants a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le texte relatif \u00e0 la Chambre des repr\u00e9sentants a \u00e9t\u00e9 adopt\u00e9 par 19 voix pour, une seule voix contre et quatre abstentions. [lematin.ma]\n-------------------------------------------------\nLa Commission de l\u2019int\u00e9rieur, des collectivit\u00e9s territoriales, de l\u2019habitat, de la politique de la ville et des affaires administratives a adopt\u00e9, jeudi soir \u00e0 la majorit\u00e9, le projet de loi organique n\u00b0 27.11 relatif \u00e0 la Chambre des repr\u00e9sentants, en pr\u00e9sence du ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [telquel.ma]\n-------------------------------------------------\nLa commission de lInt\u00e9rieur, des collectivit\u00e9s territoriales, de lhabitat, de la politique de la ville et des affaires administratives \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9 \u00e0 la majorit\u00e9, vendredi, deux projets de loi organique relatifs aux partis politiques et aux listes \u00e9lectorales, en pr\u00e9sence du ministre de lInt\u00e9rieur, Abdelouafi Laftit. [www.yabiladi.com]\n-------------------------------------------------\nLe projet de loi organique relatif aux partis politiques, et celui relatif aux listes \u00e9lectorales g\u00e9n\u00e9rales ont \u00e9t\u00e9 adopt\u00e9s par 19 voix pour et 5 abstentions par la Commission de l\u0027Int\u00e9rieur \u00e0 la Chambre des repr\u00e9sentants. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc occupe actuellement la\n13e place dans le classement...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc occupe actuellement la 13e place dans le classement mondial de l\u2019ONU Tourisme des meilleures destinations en termes de croissance au niveau international. [lematin.ma]\n-------------------------------------------------\nLe Maroc confirme, une fois de plus, son statut de destination incontournable, en figurant parmi les meilleures destinations dans la plupart des listes et classements internationaux pour 2025-2026, [www.challenge.ma]\n-------------------------------------------------\nTourisme : Le Maroc domine les classements des destinations incontournables. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le chiffre d\u0027affaires (CA) global\npr\u00e9visionnel de l\u0027Office national des...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u0027affaires (CA) global pr\u00e9visionnel de l\u0027Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u0027activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [www.lopinion.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires (CA) global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la croissance continue de l\u2019activit\u00e9 voyageurs et la dynamique soutenue des activit\u00e9s Fret. [telquel.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires global pr\u00e9visionnel de l\u2019Office national des chemins de fer (ONCF) pour l\u2019ann\u00e9e 2025 devrait d\u00e9passer les 5 milliards de dirhams (MMDH), port\u00e9 notamment par la [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Maroc et L\u2019Espagne tiennent\nla prochaine session de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et L\u2019Espagne tiennent la prochaine session de la R\u00e9union de Haut Niveau les 3 et 4 d\u00e9cembre \u00e0 Madrid. [www.lopinion.ma]\n-------------------------------------------------\nDans le sillage des relations bilat\u00e9rales liant le Royaume du Maroc et le Royaume d\u2019Espagne, les gouvernements des deux pays ont d\u00e9cid\u00e9 de tenir la XIII\u00e8me R\u00e9union de Haut Niveau le 4 d\u00e9cembre prochain \u00e0 Madrid. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Niger, Bakary Yaou Sangar\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Niger, Bakary Yaou Sangar\u00e9, a hautement salu\u00e9, jeudi \u00e0 Tanger, l\u2019Initiative Royale visant \u00e0 faciliter l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique, la qualifiant d\u2019aubaine pour les \u00c9tats enclav\u00e9s de la r\u00e9gion. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les exportations du secteur des\nphosphates et d\u00e9riv\u00e9s se sont...", "mass": 5, "physics": false, "shape": "box", "title": "Les exportations du secteur des phosphates et d\u00e9riv\u00e9s se sont \u00e9lev\u00e9es \u00e0 pr\u00e8s de 80,6 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, en croissance de 16,7% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon l\u2019Office des changes. [telquel.ma]\n-------------------------------------------------\nLes exportations du secte                     continue;

                    communities[groupId].y += node.y;
