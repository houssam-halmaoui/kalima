er sa participation...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe OCP annonce son intention de renforcer sa participation au capital d\u2019EMAPHOS \u00e0 travers l\u2019acquisition des parts actuellement d\u00e9tenues par Chemische Fabrik Budenheim KG et. [lematin.ma]\n-------------------------------------------------\nLe groupe OCP annonce son intention de prendre le contr\u00f4le total d\u2019EMAPHOS, en acqu\u00e9rant les parts d\u00e9tenues par Chemische Fabrik Budenheim KG et Prayon S.A. Cette d\u00e9marche s\u2019inscrit dans sa strat\u00e9gie de d\u00e9veloppement des phosphates de sp\u00e9cialit\u00e9 et de renforcement de sa position dans les applications phosphat\u00e9es \u00e0 forte valeur ajout\u00e9e. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019op\u00e9ration porte sur les parts d\u00e9tenues par le chimiste allemand Chemische Fabrik Budenheim et le belge Prayon, dont le groupe marocain poss\u00e8de par ailleurs 50% du capital. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Une c\u00e9r\u00e9monie officielle d\u2019accueil du\nvol inaugural de la liaison...", "mass": 5, "physics": false, "shape": "box", "title": "Une c\u00e9r\u00e9monie officielle d\u2019accueil du vol inaugural de la liaison a\u00e9rienne Agadir-Helsinki a \u00e9t\u00e9 organis\u00e9e en pr\u00e9sence de plusieurs responsables et diplomates, dont l\u0027ambassadr. [lematin.ma]\n-------------------------------------------------\nUne nouvelle ligne a\u00e9rienne reliant Agadir et Helsinki, desservie par la compagnie finlandaise Finnair, a \u00e9t\u00e9 inaugur\u00e9e mercredi apr\u00e8s-midi \u00e0 l\u2019a\u00e9roport international d\u2019Agadir Al Massira. [telquel.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale finlandaise Finnair a repris, le 14 octobre, ses vols directs entre Helsinki et Agadir, signant son retour vers cette destination marocaine apr\u00e8s plusieurs ann\u00e9es d\u2019absence. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La s\u00e9lection marocaine de futsal\na d\u00e9croch\u00e9 sa qualification pour...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de futsal a d\u00e9croch\u00e9 sa qualification pour les demi-finales de la Coupe d\u2019Afrique des Nations en dominant la Zambie (7-0), mercredi soir \u00e0 la salle couverte. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de futsal a d\u00e9croch\u00e9 son ticket pour les demi-finales de la Coupe d\u2019Afrique des nations gr\u00e2ce \u00e0 une victoire \u00e9clatante contre la Zambie (7-0) mercredi soir, \u00e0 la salle Prince Moulay Abdellah de Rabat, lors de la deuxi\u00e8me journ\u00e9e du groupe A. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de futsal s\u2019est qualifi\u00e9e pour les demi-finales de la Coupe d\u2019Afrique des Nations (CAN), apr\u00e8s sa victoire face \u00e0 son homologue zambienne sur le score sans appel de 7 buts \u00e0 0, lors du match disput\u00e9 mercredi soir \u00e0 la salle couverte du complexe sportif Prince Moulay Abdellah, \u00e0 Rabat, pour le [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le roi Mohammed VI a\nadress\u00e9 un message de f\u00e9licitations...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI a adress\u00e9 un message de f\u00e9licitations \u00e0 Ahmed Touizi \u00e0 la suite de son \u00e9lection \u00e0 la pr\u00e9sidence de la Chambre des repr\u00e9sentants. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed V         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
