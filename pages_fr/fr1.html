nnonc\u00e9 le lancement officiel de sa nouvelle plateforme num\u00e9rique, d\u00e9velopp\u00e9e pour simplifier les proc\u00e9dures et les formalit\u00e9s administratives, am\u00e9liorer la qualit\u00e9 des services offerts aux m\u00e9decins et renforcer les \u00e9changes entre les m\u00e9decins, les Conseils R\u00e9gionaux de l\u2019Ordre des M\u00e9decins (CROM) et le CNOM. [fr.hespress.com]\n-------------------------------------------------\nLe Conseil national de l\u2019Ordre des m\u00e9decins (CNOM) a annonc\u00e9 le lancement officiel de sa nouvelle plateforme num\u00e9rique, d\u00e9velopp\u00e9e pour simplifier les proc\u00e9dures et les formalit\u00e9s administratives, am\u00e9liorer la qualit\u00e9 des services offerts aux m\u00e9decins et renforcer les \u00e9changes entre les m\u00e9decins, les Conseils r\u00e9gionaux de l\u2019Ordre des m\u00e9decins (CROM) et le CNOM. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Comit\u00e9 ex\u00e9cutif de la\nConf\u00e9d\u00e9ration africaine de football (CAF)...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 ex\u00e9cutif de la Conf\u00e9d\u00e9ration africaine de football (CAF) a approuv\u00e9 \u00e0 l\u2019unanimit\u00e9 la mise \u00e0 jour conjointe pr\u00e9sent\u00e9e par le pr\u00e9sident de la FIFA, Gianni Infantino, et le secr\u00e9taire g\u00e9n\u00e9ral Mattias Grafstr\u00f6m au sujet du projet FIFA Forward Enterprise (FFE), retir\u00e9 apr\u00e8s des critiques sur sa proc\u00e9dure d\u2019\u00e9laboration. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9uni dans la capitale marocaine, le Comit\u00e9 de direction de la FIFA a r\u00e9affirm\u00e9 son soutien \u00e0 Gianni Infantino et annonc\u00e9 plusieurs mesures destin\u00e9es \u00e0 renforcer la gouvernance de l\u0027instance. [www.lavieeco.com]\n-------------------------------------------------\nLe par Ryanair au Maroc. [lematin.ma]\n-------------------------------------------------\nPour l\u0027Hiver 2026, Ryanair op\u00e8rera 156 lignes vers le Maroc, dont 17 nouvelles dessertes, avec 5,3 millions de si\u00e8ges offerts vers 14 pays europ\u00e9ens. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027Office National Marocain du Tourisme (ONMT) confirme la dynamique de sa strat\u00e9gie a\u00e9rienne avec l\u0027annonce du plus important programme hivernal jamais d\u00e9ploy\u00e9 par Ryanair au Maroc. [leseco.ma]\n-------------------------------------------------\nPour la saison Hiver 2026, la compagnie op\u00e8rera 156 lignes sur le Maroc, dont 17 nouvelles dessertes, offrant 5,3 millions de si\u00e8ges et reliant le Royaume \u00e0 14 pays [www.lereporter.ma]\n-------------------------------------------------\nRyanair s\u2019appr\u00eate \u00e0 lancer un programme hivernal sans pr\u00e9c\u00e9dent au Maroc en 2026, avec 5,3 millions de si\u00e8ges disponibles sur 156 lignes, dont 17 nouvelles connexions reliant le Royaume \u00e0 14 pays europ\u00e9ens. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Ainsi, une vague de chaleur\navec des temp\u00e9ratures oscillant entre...", "mass": 5, "physics": false, "shape": "box", "title": "Ainsi, une vague de chaleur avec des temp\u00e9ratures oscillant entre 44 et 47\u00b0C concernerait, de jeudi \u00e0 samedi, les provinces de Taroudant, Zagora, Tata, Assa-Zag, Es-Semara, Boujdou. [lematin.ma]\n-------------------------------------------------\nUne vague de chaleur, des averses orageuses avec risque de gr\u00eale et rafale de vent sous orages sont attendus, de jeudi \u00e0 samedi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes temp\u00e9ratures pouvant atteindre 47 \u00b0C, accompagn\u00e9es localement d\u0027averses orageuses, de chutes de gr\u00eale et de rafales de vent, sont attendues dans plusieurs r\u00e9gions du Royaume jusqu\u0027\u00e0 samedi, selon la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La Bourse de Casablanca a\nlanc\u00e9 une nouvelle version de...", "mass": 5, "physics": false, "shape": "box", "title": "La Bourse de Casablanca a lanc\u00e9 une nouvelle version de son site internet ainsi qu\u0027une nouvelle application mobile. [lematin.ma]\n-------------------------------------------------\nCette refonte num\u00e9rique vise \u00e0 moderniser les outils d\u2019acc\u00e8s au march\u00e9 boursier en proposant une plateforme plus intuitive, personnalis\u00e9e et adapt\u00e9e aux diff\u00e9rents profils d\u2019utilisateurs, qu\u2019il s\u2019agisse des investisseurs, des \u00e9metteurs, des professionnels du march\u00e9 ou des . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Dans une circulaire adress\u00e9e aux\nd\u00e9partements minist\u00e9riels, le chef du...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une circulaire adress\u00e9e aux d\u00e9partements minist\u00e9riels, le chef du gouvernement fixe 4 grandes priorit\u00e9s : consolider les acquis \u00e9conomiques, r\u00e9duire les disparit\u00e9s territoriales, poursuivre l\u2019\u00e9dification de l\u2019\u00c9tat social et pr\u00e9server les \u00e9quilibres des finances publiques. [telquel.ma]\n-------------------------------------------------\nLe projet de loi de finances (PLF) 2027 s\u0027articule autour de quatre axes strat\u00e9giques portant sur la croissance \u00e9conomique, la r\u00e9duction des disparit\u00e9s territoriales, le renforcement de l\u0027\u00c9tat social et la pr\u00e9servation des \u00e9quilibres budg\u00e9taires. [www.lavieeco.com]\n-------------------------------------------------\nLe chef du gouvernement Aziz Akhannouch a fix\u00e9 quatre grandes priorit\u00e9s pour le projet de loi de finances 2027, conciliant consolidation des acquis \u00e9conomiques, r\u00e9duction des disparit\u00e9s territoriales et pr\u00e9servation des \u00e9quilibres budg\u00e9taires. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019a\u00e9roport de Rabat-Sal\u00e9 a enregistr\u00e9,\nau premier semestre 2026, une...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019a\u00e9roport de Rabat-Sal\u00e9 a enregistr\u00e9, au premier semestre 2026, une hausse de 14,8% du trafic de passagers par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e \u00e9coul\u00e9e, selon des donn\u00e9es de l\u2019Office national des a\u00e9roports (ONDA). [telquel.ma]\n-------------------------------------------------\nL\u0027a\u00e9roport de Rabat-Sal\u00e9 a accueilli plus de 1,21 million de voyageurs au cours des six premiers mois de 2026, confirmant la dynamique de croissance du transport a\u00e9rien dans la capitale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le ministre des Affaires \u00e9trang\u00e8res\nNasser Bourita est arriv\u00e9 jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res Nasser Bourita est arriv\u00e9 jeudi \u00e0 Cali pour repr\u00e9senter le Roi Mohammed VI \u00e0 la c\u00e9r\u00e9monie d\u0027investiture du nouveau pr\u00e9sident colombien Abelardo De La Espriella, dans un contexte de rapprochement entre Rabat et Bogota. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 son arriv\u00e9e, M. Nasser Bouri
