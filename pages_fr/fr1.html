nonc\u00e9, lundi soir \u00e0 Rabat, les noms des laur\u00e9ats de ses diff\u00e9rentes cat\u00e9gories, lors d\u2019une c\u00e9r\u00e9monie qui s\u2019est d\u00e9roul\u00e9e en pr\u00e9sence du ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, du pr\u00e9sident de la Cour [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019Office National Marocain du Tourisme\n(ONMT) annonce la signature d\u2019un...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office National Marocain du Tourisme (ONMT) annonce la signature d\u2019un accord de cinq ans avec EasyJet, l\u2019une des principales compagnies europ\u00e9ennes sur le segment court et moyen-. [lematin.ma]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) annonce un partenariat strat\u00e9gique de cinq ans avec EasyJet. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Parmi ces investissements, 11 MMDH\nsont consacr\u00e9s \u00e0 l\u2019acquisition de...", "mass": 5, "physics": false, "shape": "box", "title": "Parmi ces investissements, 11 MMDH sont consacr\u00e9s \u00e0 l\u2019acquisition de 3.750 bus neufs de nouvelle g\u00e9n\u00e9ration et 67 MMDH d\u00e9di\u00e9s aux transports en sites propres, incluant les tramways. [lematin.ma]\n-------------------------------------------------\nPlus de 78 milliards de dirhams ont \u00e9t\u00e9 mobilis\u00e9s au Maroc pour d\u00e9velopper un syst\u00e8me de transport public propre, moderne, multimodal et accessible d\u2019ici 2029, a indiqu\u00e9 le pr\u00e9sident du conseil r\u00e9gional de Casablanca-Settat, Abdellatif Ma\u00e2zouz. [www.lopinion.ma]\n-------------------------------------------------\nPlus de 78 milliards de dirhams sont consacr\u00e9s au d\u00e9ve                 var node = network.body.nodes[nodeId];

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
