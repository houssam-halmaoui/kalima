n appel...", "shape": "dot", "size": 71, "title": "Saad Lamjarred condamn\u00e9 en appel \u00e0 10 ans de r\u00e9clusion pour viol \u00e0 Paris\nSource: telquel.ma", "url": "https://telquel.ma/instant-t/2026/09/26/saad-lamjarred-condamne-en-appel-a-10-ans-de-reclusion-pour-viol-a-paris_2010067/", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 13, "id": 168, "label": "France : Saad Lamjarred condamn\u00e9...", "shape": "dot", "size": 71, "title": "France : Saad Lamjarred condamn\u00e9 \u00e0 10 ans de prison pour viol\nSource: www.yabiladi.com", "url": "https://www.yabiladi.com/articles/details/203743/france-saad-lamjarred-condamne-prison.html", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 10, "id": 172, "label": "Pr\u00e9vention du crime : le...", "shape": "dot", "size": 59, "title": "Pr\u00e9vention du crime : le Maroc \u00e9lu \u00e0 la vice-pr\u00e9sidence du 15e Congr\u00e8s de l\u2019ONU\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/pouvoirs/diplomatie/prevention-du-crime-le-maroc-elu-a-la-vice-presidence-du-15e-congres-de-lonu/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 2, "id": 178, "label": "Hamid Barrada, figure du journalisme...", "shape": "dot", "size": 47, "title": "Hamid Barrada, figure du journalisme marocain, s\u2019\u00e9teint \u00e0 87 ans\nSource: www.lavieeco.com", "url": "https://www.lavieeco.com/influences/culture/hamid-barrada-figure-du-journalisme-marocain-seteint-a-87-ans/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 4, "id": 187, "label": "Managem am\u00e9liore son RNPG \u00e0...", "shape": "dot", "size": 47, "title": "Managem am\u00e9liore son RNPG \u00e0 pr\u00e8s de 3,8 MMDH au 1er semestre 2026\nSource: leseco.ma", "url": "https://leseco.ma/business/managem-ameliore-son-rnpg-a-pres-de-38-mmdh-au-1er-semestre-2026.html", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 13, "id": 188, "label": "France: Saad Lamjarred condamn\u00e9 \u00e0...", "shape": "dot", "size": 71, "title": "France: Saad Lamjarred condamn\u00e9 \u00e0 dix ans de prison pour viol aggrav\u00e9 en appel\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/france-saad-lamjarred-condamne-a-dix-ans-de-prison-pour-viol-aggrave-en-appel.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Cette r\u00e9union intervient au moment\no\u00f9 l\u2019Initiative Africaine Atlantique, lanc\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Cette r\u00e9union intervient au moment o\u00f9 l\u2019Initiative Africaine Atlantique, lanc\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI, marque des consolidations significatives et gagne en importance.L. [lematin.ma]\n-------------------------------------------------\nR\u00e9unis vendredi \u00e0 New York, les ministres des Affaires \u00e9trang\u00e8res du PEAA ont dress\u00e9 un bilan positif de l\u0027Initiative Africaine Atlantique, tout en appelant \u00e0 acc\u00e9l\u00e9rer sa mise en \u0153uvre. [www.lavieeco.com]\n-------------------------------------------------\nLe Processus des Etats Africains Atlantiques (PEAA) a tenu, vendredi \u00e0 New York, sa 8e r\u00e9union des ministres des Affaires \u00e9trang\u00e8res, sous la pr\u00e9sidence du ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\n\u00e0 l\u2019occasion d\u2019une rencontre entre...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e \u00e0 l\u2019occasion d\u2019une rencontre entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bou. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a affirm\u00e9, jeudi \u00e0 New York, que \u201csi les migrants ill\u00e9gaux et les mineurs ne sont pas retourn\u00e9s au Maroc, cela rel\u00e8ve exclusivement de la responsabilit\u00e9 de l\u2019Espagne\u201d. [telquel.ma]\n-------------------------------------------------\nSelon le ministre arm\u00e9nien des Affaires \u00e9trang\u00e8res, Ararat Mirzoyan, ce plan \u00abouvre la voie au renforcement de l\u2019unit\u00e9 territoriale du Royaume du Maroc\u00bb, apr\u00e8s une rencontre avec son homologue marocain, Nasser Bourita. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre russe des Affaires \u00e9trang\u00e8res, Sergue\u00ef Lavrov, et le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger du Royaume du Maroc, Nasser Bourita, ont tenu une r\u00e9union en marge de la semaine de haut niveau de la 81e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies \u00e0 New York. [atlasinfo.fr]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e \u00e0 l\u2019occasion d\u2019une rencontre entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue arm\u00e9nien, [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Maroc affronte le Gabon\nce vendredi \u00e0 Rabat pour...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc affronte le Gabon ce vendredi \u00e0 Rabat pour le compte des \u00e9liminatoires de la Coupe d\u0027Afrique des Nations 2027. [lematin.ma]\n-------------------------------------------------\nLe Maroc affronte le Gabon ce vendredi 25 septembre \u00e0 19h00 GMT (21h00 heure locale marocaine) au Stade Prince Moulay Abdellah de Rabat, pour le compte de la premi\u00e8re journ\u00e9e des \u00e9liminatoires de la Coupe d\u2019Afrique des nations (CAN) 2027. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est impos\u00e9e (2-0) face \u00e0 son homologue gabonaise, vendredi soir au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour la premi\u00e8re journ\u00e9e du Groupe A des \u00e9liminatoires de la Coupe d\u2019Afrique des Nations (CAN-2027). [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est impos\u00e9e (2-0) face \u00e0 son homologue gabonaise, vendredi soir au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour la premi\u00e8re journ\u00e9e du Groupe A des \u00e9liminatoires de la Coupe d\u2019Afrique des Nations (CAN-2027). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Jeudi 24 septembre 2026, \u00e0\nCasablanca, la marque chinoise l\u2019a...", "mass": 5, "physics": false, "shape": "box", "title": "Jeudi 24 septembre 2026, \u00e0 Casablanca, la marque chinoise l\u2019a pouss\u00e9e un peu plus loin. [lematin.ma]\n-------------------------------------------------\nM-AUTOMOTIV annonce le lancement officiel de GAC au Maroc, marquant une nouvelle \u00e9tape dans le d\u00e9veloppement de son portefeuille de marques et dans sa volont\u00e9 de proposer au march\u00e9 marocain une offre automobile internationale, technologique et futuriste. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le r\u00e9sultat net part du\ngroupe (RNPG) de Managem s\u2019\u00e9tablit...", "mass": 5, "physics": false, "shape": "box", "title": "Le r\u00e9sultat net part du groupe (RNPG) de Managem s\u2019\u00e9tablit \u00e0 3,77 milliards de dirhams, en hausse de 3,39 milliards par rapport \u00e0 fin juin 2025, o\u00f9 il ressortait \u00e0 environ 380 mill. [lematin.ma]\n-------------------------------------------------\nLe r\u00e9sultat net part du groupe (RNPG) de Managem s\u0027est \u00e9tabli \u00e0 pr\u00e8s de 3,8 milliards de dirhams (MMDH) au premier semestre 2026, contre 380 millions de dirhams (MDH) \u00e0 la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019Union constitutionnelle (UC) et le\nMouvement d\u00e9mocratique et social (MDS)...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Union constitutionnelle (UC) et le Mouvement d\u00e9mocratique et social (MDS) ont annonc\u00e9 leur d\u00e9cision de former \u00e0 nouveau un groupe parlementaire commun \u00e0 la Chambre des repr\u00e9sentants au cours de la douzi\u00e8me l\u00e9gislature, \u00e0 l\u2019issue de concertations entre les directions et les parlementaires des deux partis. [telquel.ma]\n-------------------------------------------------\nL\u2019Union constitutionnelle (UC) et le Mouvement d\u00e9mocratique et social (MDS) ont annonc\u00e9 leur d\u00e9cision de former, \u00e0 nouveau, un groupe parlementaire commun \u00e0 la Chambre des repr\u00e9sentants au titre de la 12e l\u00e9gislature, \u00e0 l\u2019issue de consultations men\u00e9es entre les responsables des deux partis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Plusieurs citoyens rappellent les engagements\npris par le parti pendant...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs citoyens rappellent les engagements pris par le parti pendant la campagne, notamment ceux concernant le pouvoir d\u2019achat et les factures d\u2019\u00e9lectricit\u00e9. [telquel.ma]\n-------------------------------------------------\nArriv\u00e9 en t\u00eate des \u00e9lections l\u00e9gislatives avec 97 si\u00e8ges, le Parti authenticit\u00e9 et modernit\u00e9 (PAM) n\u2019exclut aucune formation pour les futures alliances. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Vendredi, \u00e0 New York, le\nministre des Affaires \u00e9trang\u00e8res Nasser...", "mass": 5, "physics": false, "shape": "box", "title": "Vendredi, \u00e0 New York, le ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a rencontr\u00e9 le secr\u00e9taire d\u2019\u00c9tat adjoint am\u00e9ricain, Christopher Landau. [www.yabiladi.com]\n-------------------------------------------------\nLe Secr\u00e9taire d\u2019\u00c9tat adjoint am\u00e9ricain, M. Christopher Landau, a affirm\u00e9, vendredi \u00e0 New York, l\u2019engagement des \u00c9tats-Unis pour le d\u00e9veloppement de la r\u00e9gion du Sahara sous la souverainet\u00e9 du Royaume du Maroc. \u00ab [www.lereporter.ma]\n-------------------------------------------------\nNous avons r\u00e9affirm\u00e9 l\u0027amiti\u00e9 s\u00e9culaire liant nos deux pays ainsi que notre vision commune pour le d\u00e9veloppement de la r\u00e9gion du Sahara et pour une coop\u00e9ration renforc\u00e9e. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les r\u00e9sultats finaux des \u00e9lections\nl\u00e9gislatives du 23 septembre 2026,...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9sultats finaux des \u00e9lections l\u00e9gislatives du 23 septembre 2026, annonc\u00e9s par les commissions provinciales et r\u00e9gionales, confirment les r\u00e9sultats proviso
