et-engage-une-revision-du-schema-gazier/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Un communiqu\u00e9 de la Chefferie\ndu Gouvernement pr\u00e9cise qu\u2019au d\u00e9but...", "mass": 5, "physics": false, "shape": "box", "title": "Un communiqu\u00e9 de la Chefferie du Gouvernement pr\u00e9cise qu\u2019au d\u00e9but de ses travaux, le Conseil examinera un projet de loi relatif aux experts judiciaires. [fr.hespress.com]\n-------------------------------------------------\nUn Conseil de gouvernement se tiendra, jeudi, sous la pr\u00e9sidence du Chef du gouvernement, Aziz Akhannouch, indique un communiqu\u00e9 de son d\u00e9partement. [telquel.ma]\n-------------------------------------------------\nUn Conseil de gouvernement se tiendra, jeudi, sous la pr\u00e9sidence du Chef du gouvernement, Aziz Akhannouch, indique un communiqu\u00e9 de son d\u00e9partement. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Les provinces de Chefchaouen et\nT\u00e9touan sont plac\u00e9es en vigilance...", "mass": 5, "physics": false, "shape": "box", "title": "Les provinces de Chefchaouen et T\u00e9touan sont plac\u00e9es en vigilance rouge par la DGM, en raison de fortes pr\u00e9cipitations orageuses pr\u00e9vues \u00e0 partir de mardi 12h00 jusqu\u2019\u00e0 mercredi 23. [lematin.ma]\n-------------------------------------------------\nDans un bulletin d\u0027alerte de niveau de vigilance rouge, la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie indique que de fortes pluies parfois orageuses (100 \u00e0 150 mm) sont attendues, de mardi \u00e0 12H00 \u00e0 mercredi \u00e0 23h00 \u00e0 Chefchaouen et T\u00e9touan. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "\u00c0 Ksar El K\u00e9bir, la\nsituation s\u2019est rapproch\u00e9e, dans la...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 Ksar El K\u00e9bir, la situation s\u2019est rapproch\u00e9e, dans la nuit de lundi \u00e0 mardi, d\u2019un seuil critique. [lematin.ma]\n-------------------------------------------------\nAlors que la ville vit d\u00e9j\u00e0 sous \u00e9tat d\u2019alerte maximale en raison des risques de crues, les autorit\u00e9s ont entam\u00e9 en urgence l\u2019\u00e9vacuation d\u2019un centre d\u2019h\u00e9bergement accueillant des habitants issus des quartiers menac\u00e9s par les inondations. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le laboratoire pharmaceutique Sothema poursuit\nsa strat\u00e9gie de diversification th\u00e9rapeutique...", "mass": 5, "physics": false, "shape": "box", "title": "Le laboratoire pharmaceutique Sothema poursuit sa strat\u00e9gie de diversification th\u00e9rapeutique en int\u00e9grant \u00e0 son portefeuille des solutions innovantes d\u00e9velopp\u00e9es par la marque Naal. [lematin.ma]\n-------------------------------------------------\nSothema diversifie son offre th\u00e9rapeutique en int\u00e9grant les solutions innovantes \u00e0 base de safran de Naali. [www.lavieeco.com]\n-------------------------------------------------\nAu cours de l\u2019\u00e9dition 2026 du salon Officine Expo \u00e0 Marrakech, \u00e9v\u00e9nement de r\u00e9f\u00e9rence pour les acteurs du secteur pharmaceutique, Sothema et Naali ont sign\u00e9 un protocole d\u2019accord portant sur la commercialisation des produits Naali par Sothema. [leseco.ma]\n-------------------------------------------------\nSothema et Naali ont conclu un partenariat strat\u00e9gique visant \u00e0 \u00e9largir l\u2019offre th\u00e9rapeutique sur le march\u00e9 marocain et r\u00e9gional, \u00e0 l\u2019occasion de l\u2019\u00e9dition 2026 du salon Officine Expo, tenue \u00e0 Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 l\u2019issue de cette rencontre,\nun nouveau bureau ex\u00e9cutif a...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019issue de cette rencontre, un nouveau bureau ex\u00e9cutif a \u00e9t\u00e9 \u00e9lu pour accompagner l\u2019asso. [lematin.ma]\n-------------------------------------------------\nL\u2019association Casam\u00e9moire a renouvel\u00e9 son bureau ex\u00e9cutif \u00e0 Casablanca, reconduisant Karim Rouissi \u00e0 la pr\u00e9sidence. [leseco.ma]\n-------------------------------------------------\nL\u2019association Casamemoire, engag\u00e9e depuis plus de trente ans dans la sauvegarde et la valorisation du patrimoine architectural, urbain et culturel du XX\u1d49 si\u00e8cle au Maroc, a tenu son assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e0 Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Paraph\u00e9 par le ministre de\nla Justice, Abdellatif Ouahbi et...", "mass": 5, "physics": false, "shape": "box", "title": "Paraph\u00e9 par le ministre de la Justice, Abdellatif Ouahbi et son homologue fran\u00e7ais, G\u00e9rald Darmanin, ce document s\u0027inscrit dans le cadre de la consolidation des relations d#39. [lematin.ma]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, et son homologue de la R\u00e9publique fran\u00e7aise, G\u00e9rald Darmanin, ont sign\u00e9, lundi \u00e0 Rabat, un plan d\u2019action pour la coop\u00e9ration technique couvrant la p\u00e9riode 2026-2028. [telquel.ma]\n-------------------------------------------------\nParaph\u00e9e par le ministre de la Justice, Abdellatif Ouahbi et son homologue fran\u00e7ais, G\u00e9rald Darmanin, ce document s\u0027inscrit dans le cadre de la consolidation des relations d\u0027amiti\u00e9 et de coop\u00e9ration distingu\u00e9es unissant Rabat et Paris. [www.lavieeco.com]\n-------------------------------------------------\nUn plan d\u2019action pour la coop\u00e9ration technique dans le domaine de la justice entre le Maroc et la France au titre de la p\u00e9riode 2026/2028 a \u00e9t\u00e9 sign\u00e9, lundi \u00e0 Rabat, en vue d\u2019\u00e9tablir un cadre structur\u00e9 et durable de coop\u00e9ration et d\u2019\u00e9change entre les deux minist\u00e8res de justice. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le minist\u00e8re de l\u2019\u00c9quipement et\nde l\u2019Eau a appel\u00e9, lundi,...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau a appel\u00e9, lundi, l\u2019ensemble des usagers de la route \u00e0 faire preuve d\u2019une vigilance accrue durant cette p\u00e9riode marqu\u00e9e par des intemp\u00e9ries. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau invite l\u2019ensemble des usagers de la route \u00e0 prendre plusieurs mesures en vue d\u2019assurer leurs d\u00e9placements en cette p\u00e9riode d\u2019intemp\u00e9ries et de fortes pr\u00e9cipitations dans plusieurs provinces du Royaume. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019eau a invit\u00e9 les usagers \u00e0 la vigilance dans leurs d\u00e9placements pendant les intemp\u00e9ries et les pr\u00e9cipitations dans les provinces du Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau invite l\u2019ensemble des usagers de la route \u00e0 prendre plusieurs mesures en vue d\u2019assurer leurs d\u00e9placements en cette p\u00e9riode d\u2019intemp\u00e9ries et de fortes pr\u00e9cipitations dans plusieurs provinces du Royaume. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Les quatre terminaux \u00e0 conteneurs\ndu complexe portuaire Tanger Med...", "mass": 5, "physics": false, "shape": "box", "title": "Les quatre terminaux \u00e0 conteneurs du complexe portuaire Tanger Med ont trait\u00e9 11 millions EVP ( \u00c9quivalent Vingt pieds) en 2025, soit une hausse de 8,4% par rapport \u00e0 2024. [lematin.ma]\n-------------------------------------------------\nLes quatre terminaux \u00e0 conteneurs du complexe portuaire Tanger Med ont trait\u00e9 11 106 164 EVP en 2025, soit une hausse de 8,4 % par rapport \u00e0 2024.. [telquel.ma]\n-------------------------------------------------\nLes quatre terminaux \u00e0 conteneurs du complexe portuaire Tanger Med ont trait\u00e9 11.106.164 EVP (Equivalent Vingt Pieds) en 2025, en hausse de 8,4% par rapport \u00e0 2024, notamment [www.challenge.ma]\n-------------------------------------------------\nCette progression s\u2019explique notamment par la mise en exploitation de la derni\u00e8re extension du Terminal TC4 exploit\u00e9 par APM Terminals, indique un communiqu\u00e9 de Tanger Med Port Authority (TMPA). [www.lavieeco.com]\n-------------------------------------------------\nLes quatre terminaux \u00e0 conteneurs du complexe portuaire Tanger Med ont trait\u00e9 11.106.164 EVP (Equivalent Vingt Pieds) en 2025, en hausse de 8,4% par rapport \u00e0 2024. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Les importations ont progress\u00e9 de\n8%, soit une hausse de...", "mass": 5, "physics": false, "shape": "box", "title": "Les importations ont progress\u00e9 de 8%, soit une hausse de 60,95 milliards de dirhams (MMDH), pour s\u2019\u00e9tablir \u00e0 822 MMDH \u00e0 fin d\u00e9cembre 2025, contre 761 MMDH un an auparavant. [lematin.ma]\n-------------------------------------------------\nLe d\u00e9ficit commercial a atteint pr\u00e8s de 353,15 milliards de dirhams (MMDH) au terme de l\u0027ann\u00e9e 2025, en hausse de 15,8% comparativement \u00e0 2024, selon l\u0027Office des changes. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Produite par Tendansia, cette exp\u00e9rience\ninteractive invite les enfants d\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "Produite par Tendansia, cette exp\u00e9rience interactive invite les enfants d\u00e8s 4 ans et leurs familles \u00e0 plonger dans l\u2019univers d\u00e9jant\u00e9 de deux savants fous : le D\u02b3 Mordicus et son ac. [lematin.ma]\n-------------------------------------------------\nSpectacle Apr\u00e8s des repr\u00e9sentations \u00e0 guichets ferm\u00e9s en 2024, Satanas \u0026 Mordicus revient au Maroc pour de nouvelles dates le 28 f\u00e9vrier \u00e0 Casablanca et le 1er mars \u00e0 Marrakech. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les autorit\u00e9s de la province\nde T\u00e9touan ont, depuis ce...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s de la province de T\u00e9touan ont, depuis ce lundi, entrepris une s\u00e9rie de mesures proactives et d\u00e9ploy\u00e9 des efforts intensifs sur le terrain, afin de faire face aux perturbations m\u00e9t\u00e9orologiques pr\u00e9vues dans les prochains jours. [telquel.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de T\u00e9touan ont commenc\u00e9, ce mardi matin \u00e0 8h00, \u00e0 \u00e9vacuer les r\u00e9sidents de plusieurs zones menac\u00e9es par des inondations vers des abris d\u00e9sign\u00e9s, dans le cadre des mesures proactives pour faire face aux perturbations m\u00e9t\u00e9orologiques pr\u00e9vues mercredi 4 f\u00e9vrier. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019avant-centre marocain Yassir Zabiri, champion\ndu monde U20 avec les...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019avant-centre marocain Yassir Zabiri, champion du monde U20 avec les Lionceaux de l\u2019Atlas, s\u2019est engag\u00e9 avec le Stade Rennais jusqu\u2019en 2029, en provenance du club portugais du FC Famalicao, a annonc\u00e9 le club fran\u00e7ais de Ligue 1. [telquel.ma]\n-------------------------------------------------\nL\u2019avant-centre marocain Yassir Zabiri, champion du monde U20 avec les Lionceaux de l\u2019Atlas, s\u2019est engag\u00e9 avec le Stade Rennais jusqu\u2019en 2029 en provenance du club portugais du FC Famalicao, a annonc\u00e9 le club fran\u00e7ais de Ligue 1. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Dans le cadre de la\nmise en \u0153uvre des orientations...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la mise en \u0153uvre des orientations royales visant l\u2019acc\u00e9l\u00e9ration de la transition \u00e9nerg\u00e9tique du Maroc et conform\u00e9ment aux dispositions l\u00e9gislatives en vigueur, le Conseil de l\u2019Autorit\u00e9 Nationale de R\u00e9gulation de l\u2019\u00c9lectricit\u00e9 (ANRE), s\u2019est r\u00e9uni le 28 janvier 2026 \u00e0 Rabat, \u00e0 l\u2019effet d\u2019approuver et de publier la capacit\u00e9 d\u2019accueil du syst\u00e8me. [telquel.ma]\n-------------------------------------------------\nDans le cadre de la mise en \u0153uvre des Hautes Orientations de Sa Majest\u00e9 le Roi Mohammed VI, Que Dieu L\u2019assiste, visant l\u2019acc\u00e9l\u00e9ration de la transition \u00e9     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
