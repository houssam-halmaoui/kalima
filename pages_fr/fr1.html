t de deux organisations criminelles internationales sp\u00e9cialis\u00e9es dans le trafic de hachich, dans le cadre d\u2019une op\u00e9ration conjointe men\u00e9e en \u00e9troite collaboration avec la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [www.lopinion.ma]\n-------------------------------------------------\nLa police nationale espagnole a annonc\u00e9, mercredi, le d\u00e9mant\u00e8lement de deux organisations criminelles internationales sp\u00e9cialis\u00e9es dans le trafic de hachich, dans le cadre d\u2019une op\u00e9ration conjointe men\u00e9e en collaboration avec la Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN). [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, men\u00e9e en coordination aussi avec le Parquet de la Cour d\u2019appel de Tanger, a permis la saisie de 20 tonnes de hachich dissimul\u00e9es dans des cargaisons de poivrons \u00e0 bord de camions frigorifiques. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019Universit\u00e9 Internationale de Rabat (UIR)\nrenforce son ancrage dans le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Universit\u00e9 Internationale de Rabat (UIR) renforce son ancrage dans le champ des sciences sociales en confiant la direction de son Coll\u00e8ge d\u00e9di\u00e9 \u00e0 l\u2019un des penseurs les plus influ. [lematin.ma]\n-------------------------------------------------\nDans le cadre de sa dynamique de d\u00e9veloppement, l\u2019Universit\u00e9 Internationale de Rabat (UIR) annonce la nomination du Professeur Mohamed TOZY au poste de Doyen du Coll\u00e8ge des Sciences Sociales. [telquel.ma]\n-------------------------------------------------\nLUniversit\u00e9 Internationale de Rabat (UIR) a nomm\u00e9 le professeur Mohamed Tozy au poste de doyen de la Facult\u00e9 des Sciences Sociales, marquant ainsi un color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La hausse conjointe des arriv\u00e9es\ntouristiques, des nuit\u00e9es et des...", "mass": 5, "physics": false, "shape": "box", "title": "La hausse conjointe des arriv\u00e9es touristiques, des nuit\u00e9es et des recettes en devises refl\u00e8te l\u0027impact des efforts men\u00e9s en mati\u00e8re de renforcement de la connectivit\u00e9 a\u00e9rienne. [lematin.ma]\n-------------------------------------------------\nD\u0027apr\u00e8s le PLF 2026, la hausse conjointe des arriv\u00e9es, des nuit\u00e9es et des recettes en devises refl\u00e8te l\u0027impact des efforts men\u00e9s en mati\u00e8re de renforcement de la connectivit\u00e9 a\u00e9rienne et de promotion dans le cadre de la feuille de route 2023-2026. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 35, "id": "comm_label_35", "label": "Dans ce message, le Souverain\nexprime \u00e0 M. Alassane Ouattara...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce message, le Souverain exprime \u00e0 M. Alassane Ouattara Ses f\u00e9licitations chaleureuses et Ses v\u0153ux les meilleurs de r\u00e9ussite dans ses hautes fonctions.Je suis convaincu. [lematin.ma]\n-------------------------------------------------\nDans un message adress\u00e9 \u00e0 M. Ouattara, SM le Roi Mohammed VI Se r\u00e9jouit de la perspective de travailler avec le pr\u00e9sident ivoirien en vue de porter toujours plus haut le partenariat strat\u00e9gique entre le Royaume et la R\u00e9publique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Fort de 32 ann\u00e9es d\u2019existence,\nl\u2019Ordre des Experts-Comptables (OEC) du...", "mass": 5, "physics": false, "shape": "box", "title": "Fort de 32 ann\u00e9es d\u2019existence, l\u2019Ordre des Experts-Comptables (OEC) du Maroc tiendra son 10\u1 et d\u00e9cisions relatifs\naux actes de violence et...", "mass": 5, "physics": false, "shape": "box", "title": "Les jugements et d\u00e9cisions relatifs aux actes de violence et de destruction ayant \u00e9maill\u00e9 les manifestations non autoris\u00e9es ont \u00e9t\u00e9 rendus dans un d\u00e9lai raisonnable en tenant compte de la situation p\u00e9nale des accus\u00e9s, sans aucune pr\u00e9cipitation, contrairement \u00e0 ce que certains pr\u00e9tendent, a affirm\u00e9 Hassan Farhan, magistrat \u00e0 la Pr\u00e9sidence du Minist\u00e8re Public. [www.lopinion.ma]\n-------------------------------------------------\nLes jugements et d\u00e9cisions relatifs aux actes de violence et de destruction ayant \u00e9maill\u00e9 les manifestations non autoris\u00e9es ont \u00e9t\u00e9 rendus dans un d\u00e9lai raisonnable en tenant compte de la situation p\u00e9nale des accus\u00e9s, sans aucune pr\u00e9cipitation, contrairement \u00e0 ce que certains pr\u00e9tendent, a affirm\u00e9 Hassan Farhan, magistrat \u00e0 la pr\u00e9sidence du Minist\u00e8re public. [telquel.ma]\n-------------------------------------------------\nLes jugements et d\u00e9cisions relatifs aux actes de violence et de destruction ayant \u00e9maill\u00e9 les manifestations non autoris\u00e9es ont \u00e9t\u00e9 rendus dans un d\u00e9lai raisonnable en tenant compte de la situation p\u00e9nale des accus\u00e9s, sans aucune pr\u00e9cipitation, contrairement \u00e0 ce que certains pr\u00e9tendent, a affirm\u00e9 Hassan Farhan, magistrat \u00e0 la Pr\u00e9sidence du Minist\u00e8re Public. [www.lavieeco.com]\n-------------------------------------------------\nLes d\u00e9cisions judiciaires relatives aux actes de violence et de destruction enregistr\u00e9s lors des manifestations non autoris\u00e9es de fin septembre ont \u00e9t\u00e9 rendues dans des d\u00e9lais jug\u00e9s raisonnables, tout en respectant les garanties d\u2019un proc\u00e8s \u00e9quitable, a indiqu\u00e9 Hassan Farhan, magistrat \u00e0 la Pr\u00e9sidence du minist\u00e8re public. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les investissements du groupe OCP\ndevraient atteindre 53 milliards de...", "mass": 5, "physics": false, "shape": "box", "title": "Les investissements du groupe OCP devraient atteindre 53 milliards de dirhams (MMDH) au terme de l\u2019ann\u00e9e 2025, port\u00e9s par plusieurs grands projets, dont le d\u00e9veloppement de nouvelles capacit\u00e9s de production d\u2019engrais, ressort-il du rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de 2026. [telquel.ma]\n-------------------------------------------------\nLes investissements du groupe OCP devraient atteindre 53 milliards de dirhams (MMDH) \u00e0 fin 2025, port\u00e9s par plusieurs chantiers majeurs, notamment l\u2019extension des capacit\u00e9s de production d\u2019engrais, selon le rapport sur les \u00e9tablissements et entreprises publics accompagnant le projet de loi de finances 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "L\u2019\u00e9quipe nationale f\u00e9minine des moins\nde 17 ans s\u2019est inclin\u00e9e,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale f\u00e9minine des moins de 17 ans s\u2019est inclin\u00e9e, mardi \u00e0 Rabat, face \u00e0 son homologue nord-cor\u00e9enne, sur le score sans appel de 6 buts \u00e0 1, dans le cadre des huiti\u00e8mes de finale de la Coupe du monde f\u00e9minine U17, qui se tient au Maroc jusqu\u2019au 8 novembre. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale f\u00e9minine des moins de 17 ans s\u2019est inclin\u00e9e, mardi \u00e0 Rabat, face \u00e0 son homologue nord-cor\u00e9enne, sur le score sans appel de 6 buts \u00e0 1, dans le cadre des huiti\u00e8mes de finale de la Coupe du monde f\u00e9minine U17, qui se tient au Maroc jusqu\u2019au 8 novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 36, "id": "comm_label_36", "label": "Le nombre total de mosqu\u00e9es\nen milieu rural s\u2019\u00e9l\u00e8ve \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre total de mosqu\u00e9es en milieu rural s\u2019\u00e9l\u00e8ve \u00e0 37.766, contre 14.336 en zones urbaines, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq. [telquel.ma]\n-------------------------------------------------\nR\u00e9pondant \u00e0 une question orale \u00e0 la Chambre des Conseillers, le ministre des Habous et des affaires islamiques, Mohamed Toufiq, a indiqu\u00e9 \u00e9galement qu\u2019un budget de l\u2019ordre de 296 millions de dirhams est allou\u00e9 \u00e0 la construction de mosqu\u00e9es dans le milieu rural au titre de l\u2019ann\u00e9e en cours. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 33, "id": "comm_label_33", "label": "La secr\u00e9taire d\u2019Etat charg\u00e9e de\nla P\u00eache maritime, Zakia Driouich,...", "mass": 5, "physics": false, "shape": "box", "title": "La secr\u00e9taire d\u2019Etat charg\u00e9e de la P\u00eache maritime, Zakia Driouich, a affirm\u00e9, mardi \u00e0 la Chambre des Conseillers, que les mesures prises par le gouvernement pour rem\u00e9dier \u00e0 la probl\u00e9matique de la hausse des prix du poisson devraient permettre de maintenir la stabilit\u00e9 des prix \u00e0 des niveaux raisonnables. [telquel.ma]\n-------------------------------------------------\nZakia Dirouich a pr\u00e9sent\u00e9, au Parlement, les actions men\u00e9es par le Gouvernement pour contenir la hausse du prix du poisson, en mati\u00e8re de r\u00e9duction le nombre d\u0027interm\u00e9diaires et de renforcement du r\u00e9seau des march\u00e9s de gros de vente. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Les moyens de renforcer la\ncoop\u00e9ration entre le Maroc et...", "mass": 5, "physics": false, "shape": "box", "title": "Les moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00e9t\u00e9 au centre d\u2019entretiens, mardi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et l\u2019Ambassadeur du Royaume-Uni au Maroc, Alex Pinfield. [telquel.ma]\n-------------------------------------------------\nLes moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00e9t\u00e9 au centre d\u2019entretiens, mardi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et l\u2019Ambassadeur du Royaume\u2013Uni au Maroc, Alex Pinfield. [www.lereporter.ma]\n-------------------------------------------------\nLes moyens de consolider la coop\u00e9ration bilat\u00e9rale dans les domaines du transport ferroviaire et a\u00e9rien et des infrastructures, ont \u00e9t\u00e9 au centre d\u2019entretiens, mercredi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et le ministre paraguayen des Relations ext\u00e9rieures, Rub\u00e9n Ram\u00edrez Lezcano. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019Office national marocain du tourisme\n(ONMT) et la Conf\u00e9d\u00e9ration nationale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national marocain du tourisme (ONMT) et la Conf\u00e9d\u00e9ration nationale du tourisme (CNT) ont organis\u00e9, lundi, un workshop r\u00e9unissant plus de 100 op\u00e9rateurs touristiques, visant \u00e0 renforcer l\u2019attractivit\u00e9 du Maroc aupr\u00e8s du march\u00e9 am\u00e9ricain. [telquel.ma]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) et la Conf\u00e9d\u00e9ration Nationale du Tourisme (CNT) ont organis\u00e9, lundi, un workshop r\u00e9unissant plus de 100 op\u00e9rateurs touristiques, visant \u00e0 renforcer l\u2019attractivit\u00e9 du Maroc aupr\u00e8s du march\u00e9 am\u00e9ricain. [www.lereporter.ma]\n-------------------------------------------------\nL\u2019Office National Marocain du Tourisme (ONMT) et la Conf\u00e9d\u00e9ration Nationale du Tourisme (CNT) ont tenu, lundi, un workshop r\u00e9unissant plus de cent op\u00e9rateurs afin d\u2019acc\u00e9l\u00e9rer la p\u00e9n\u00e9tration du march\u00e9 am\u00e9ricain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La D\u00e9l\u00e9gation g\u00e9n\u00e9rale \u00e0 l\u2019administration\np\u00e9nitentiaire et \u00e0 la r\u00e9insertion...", "mass": 5, "physics": false, "shape": "box", "title": "La D\u00e9l\u00e9gation g\u00e9n\u00e9rale \u00e0 l\u2019administration p\u00e9nitentiaire et \u00e0 la r\u00e9insertion (DGAPR) a annonc\u00e9 la fermeture d\u00e9finitive de la prison locale A\u00efn Borja, sur la base des conclusions d\u2019un rapport technique \u00e9labor\u00e9 par un laboratoire sp\u00e9cialis\u00e9, qui a montr\u00e9 que le b\u00e2timent se trouvait dans un \u00e9tat de d\u00e9labrement avanc\u00e9 et qu\u2019il mena\u00e7ait de ce fait. [telquel.ma]\n-------------------------------------------------\nLa fermeture a \u00e9t\u00e9 d\u00e9cid\u00e9e par la DGAPR sur la base d\u2019un rapport qui a conclu \u00e0 l\u2019\u00e9tat de d\u00e9labrement avanc\u00e9 du b\u00e2timent. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 31, "id": "comm_label_31", "label": "Le ministre de la Sant\u00e9\net de la Protection sociale,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tahraoui, a pr\u00e9sent\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le bilan de la mise en \u0153uvre du programme de r\u00e9duction des disparit\u00e9s spatiales et sociales en milieu rural dans le secteur de la sant\u00e9. [telquel.ma]\n-------------------------------------------------\n\u0003 Programme : Le ministre de la sant\u00e9 et de la protection sociale a fait le point au Parlement sur le bilan du Programme de r\u00e9duction des disparit\u00e9s spatiales et sociales . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Alassane Ouattara a \u00e9t\u00e9 r\u00e9\u00e9lu\npr\u00e9sident de la R\u00e9publique de...", "mass": 5, "physics": false, "shape": "box", "title": "Alassane Ouattara a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident de la R\u00e9publique de C\u00f4te d\u2019Ivoire pour un nouveau quinquennat, selon les r\u00e9sultats provisoires proclam\u00e9s lundi par la Commission \u00e9lectorale ind\u00e9pendante (CEI). [telquel.ma]\n-------------------------------------------------\nCette victoire, marqu\u00e9e par une forte domination du parti au pouvoir, s\u2019inscrit dans la continuit\u00e9 d\u2019une strat\u00e9gie politique et institutionnelle ayant consolid\u00e9 son emprise sur la sc\u00e8ne nationale . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "Vivo Energy Maroc et INJAZ\nAl-Maghrib renouvellent leur partenariat historique...", "mass": 5, "physics": false, "shape": "box", "title": "Vivo Energy Maroc et INJAZ Al-Maghrib renouvellent leur partenariat historique pour soutenir l\u2019entrepreneuriat des jeunes. [www.challenge.ma]\n-------------------------------------------------\nVivo Energy Maroc, l\u2019entreprise en charge de la commercialisation et de la distribution de carburants et lubrifiants de marque Shell au Maroc et de gaz de p\u00e9trole liqu\u00e9fi\u00e9 de marque Butagaz, consolide son engagement soci\u00e9tal en renouvelant son partenariat strat\u00e9gique avec l\u2019association INJAZ Al-Maghrib. [leseco.ma]\n-------------------------------------------------\nVivo Energy Maroc et l\u2019association INJAZ Al-Maghrib ont sign\u00e9, le 24 octobre, une nouvelle convention de partenariat pour la p\u00e9riode 2025-2027. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Lors de la rencontre entre\nMohamed Ould Errachid et la...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la rencontre entre Mohamed Ould Errachid et la d\u00e9l\u00e9gation de la Commission parlementaire Mixte (CPM) Maroc-UE, les deux parties ont r\u00e9affirm\u00e9 le caract\u00e8re strat\u00e9gique de la coop\u00e9ration entre Rabat et Bruxelles dans la lutte contre le terrorisme, la criminalit\u00e9 organis\u00e9e et l\u2019immigration irr\u00e9guli\u00e8re. [www.lavieeco.com]\n-------------------------------------------------\nLe pr\u00e9sident de la Chambre des Conseillers, Mohamed Ould Errachid, a eu, mardi \u00e0 Rabat, des entretiens avec une d\u00e9l\u00e9gation de la Commission parlementaire mixte (CPM) Maroc-Union europ\u00e9enne (UE), dans le cadre du renforcement des relations de partenariat privil\u00e9gi\u00e9es unissant les deux parties. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Les groupes de la majorit\u00e9\nparlementaire \u00e0 la Chambre des...", "mass": 5, "physics": false, "shape": "box", "title": "Les groupes de la majorit\u00e9 parlementaire \u00e0 la Chambre des repr\u00e9sentants ont affirm\u00e9, mard  collectif f\u00e9minin, moteur d\u2019un changement socio-\u00e9conomique profond. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 34, "id": "comm_label_34", "label": "Le Conseil de la concurrence\net l\u2019Agence nationale de gestion...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de la concurrence et l\u2019Agence nationale de gestion strat\u00e9gique des participations de l\u2019\u00c9tat (ANGSPE) ont sign\u00e9, mardi \u00e0 Rabat, une convention visant \u00e0 renforcer la transparence, la comp\u00e9titivit\u00e9 et la bonne gouvernance au sein des \u00e9tablissements et entreprises publics. [leseco.ma]\n-------------------------------------------------\nLe Conseil de la Concurrence et l\u2019Agence Nationale de Gestion Strat\u00e9gique des Participations de l\u2019\u00c9tat et de suivi des performances des \u00e9tablissements et entreprises publics (ANGSPE) ont sign\u00e9, mardi \u00e0 Rabat, une convention de partenariat visant \u00e0 mutualiser leurs efforts pour promouvoir une \u00e9conomie comp\u00e9titive, \u00e9quitable et fond\u00e9e sur la bonne gouvernance et le respect [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "Le programme national \u00ab Tadaroj\n\u00bb pour la g\u00e9n\u00e9ralisation de...", "mass": 5, "physics": false, "shape": "box", "title": "Le programme national \u00ab Tadaroj \u00bb pour la g\u00e9n\u00e9ralisation de la formation professionnelle par apprentissage a \u00e9t\u00e9 lanc\u00e9 lundi \u00e0 Rabat, avant la signature, mardi \u00e0 Casablanca, de sa convention d\u2019ex\u00e9cution entre le minist\u00e8re de l\u2019Inclusion \u00e9conomique, de la Petite entreprise, de l\u2019Emploi et des Comp\u00e9tences, et le minist\u00e8re de la Jeunesse, de la Culture . [lnt.ma]\n-------------------------------------------------\nLe minist\u00e8re 0 l\u2019\u00e9tranger, Nasser Bourita L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nLa R\u00e9publique du Paraguay a mat\u00e9rialis\u00e9, mercredi, sa reconnaissance de la souverainet\u00e9 marocaine sur le Sahara par l\u2019annonce de l\u2019ouverture d\u2019un Consulat G\u00e9n\u00e9ral. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "La phase de conception et\nd\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration...", "mass": 5, "physics": false, "shape": "box", "title": "La phase de conception et d\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 commencera d\u00e8s la semaine prochaine, \u00e0 travers le lancement de larges concertations au niveau des 75 provinces du Royaume, a annonc\u00e9, mercredi, le wali, directeur g\u00e9n\u00e9ral des Collectivit\u00e9s territoriales au minist\u00e8re de l\u2019int\u00e9rieur, Jelloul Samsseme. [www.lopinion.ma]\n-------------------------------------------------\nLa phase de conception et d\u2019\u00e9laboration de la nouvelle g\u00e9n\u00e9ration de programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 commencera d\u00e8s la semaine prochaine, \u00e0 travers le lancement de larges concertations au niveau des 75 provinces du Maroc, a annonc\u00e9, mercredi, le wali, directeur g\u00e9n\u00e9ral des collectivit\u00e9s territoriales au minist\u00e8re de l\u2019Int\u00e9rieur, Jelloul Samsseme. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Une convention de partenariat a\n\u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention de partenariat a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, entre la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) et le Groupement fran\u00e7ais d\u0027assureurs \"Argos\", portant sur le renforcement et le d\u00e9veloppement de la coop\u00e9ration et l\u2019assistance technique pour faciliter les op\u00e9rations de recherche, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [www.lopinion.ma]\n-------------------------------------------------\nCette convention pr\u00e9voit la mise en place de points focaux et de canaux officiels de communication afin de faciliter les op\u00e9rations de coordination entre les deux parties en mati\u00e8re de recherche, d\u2019identification, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules vol\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nUne convention de partenariat a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, entre la Direction G\u00e9n\u00e9rale de la S\u00fbret\u00e9 Nationale (DGSN) et le Groupement fran\u00e7ais d\u2019assureurs \u00ab Argos \u00bb, portant sur le renforcement et le d\u00e9veloppement de la coop\u00e9ration et l\u2019assistance technique pour faciliter les op\u00e9rations de recherche, de traque et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [atlasinfo.fr]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) et le groupement des compagnies d\u2019assurance fran\u00e7aises ARGOS ont sign\u00e9, mercredi \u00e0 Rabat, un accord de partenariat portant sur le renforcement de la coop\u00e9ration et du soutien technique afin de faciliter les op\u00e9rations de recherche, de suivi et de r\u00e9cup\u00e9ration des v\u00e9hicules d\u00e9clar\u00e9s vol\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Visiativ Africa, qui op\u00e8re dans\nla transformation num\u00e9rique au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Visiativ Africa, qui op\u00e8re dans la transformation num\u00e9rique au Maroc et en Afrique depuis pr\u00e8s de 15 ans, devient NEONOVIA. [www.lopinion.ma]\n-------------------------------------------------\nVisiativ Africa, la filiale historique du groupe fran\u00e7ais Visiativ, est d\u00e9sormais NEONOVIA, une entreprise technologique marocaine ind\u00e9pendante d\u00e9di\u00e9e \u00e0 lacc\u00e9l\u00e9ration de la transformation num\u00e9rique dans les secteurs public et priv\u00e9 au Maroc et en Afrique. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019entreprise se repositionne comme un acteur marocain ind\u00e9pendant sp\u00e9cialis\u00e9 dans la transformation digitale des organisations publiques et priv\u00e9es, tout en poursuivant sa collaboration avec le Groupe Visiativ sur le march\u00e9 africain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le programme Forsa a g\u00e9n\u00e9r\u00e9\n1,6 milliard de dirhams (MMDH)...", "mass": 5, "physics": false, "shape": "box", "title": "Le programme Forsa a g\u00e9n\u00e9r\u00e9 1,6 milliard de dirhams (MMDH) de chiffre d\u2019affaires et 21.000 emplois \u00e0 travers le Royaume, a annonc\u00e9, mercredi, le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [telquel.ma]\n-------------------------------------------------\n\u00c0 ce jour, 16 600 projets sont op\u00e9rationnels \u00e0 travers le Royaume, g\u00e9n\u00e9rant un chiffre d\u2019affaires annuel estim\u00e9 \u00e0 1,6 milliard de dirhams et pr\u00e8s de 21 000 emplois. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "L\u2019Office national des a\u00e9roports (ONDA)\ndevrait r\u00e9aliser un chiffre d\u2019affaires...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des a\u00e9roports (ONDA) devrait r\u00e9aliser un chiffre d\u2019affaires (CA) de plus de 6,4 milliards de dirhams (MMDH) en 2026, r\u00e9v\u00e8le le rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de l\u2019ann\u00e9e prochaine. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des A\u00e9roports (ONDA) devrait r\u00e9aliser un chiffre d\u2019affaires (CA) de plus de 6,4 milliards de dirhams (MMDH) en 2026, r\u00e9v\u00e8le le rapport sur les \u00e9tablissements et entreprises publics (EEP) accompagnant le projet de loi de finances (PLF) de l\u2019ann\u00e9e prochaine. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) et le Maroc ont...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) et le Maroc ont confirm\u00e9 les stades et le calendrier du tournoi intercontinental des qualifications africaines pour la Coupe du Monde 2026. [telquel.ma]\n-------------------------------------------------\nLe tournoi intercontinental des qualifications africaines pour la Coupe du monde de la FIFA 2026 se d\u00e9roulera du 13 au 16 novembre 2025 \u00e0 Rabat, a annonc\u00e9 la Conf\u00e9d\u00e9ration africaine de football (CAF). [www.yabiladi.com]\n-------------------------------------------------\nLe tournoi intercontinental des qualifications africaines pour la Coupe du Monde de la FIFA 2026 se d\u00e9roulera du 13 au 16 novembre 2025 \u00e0 Rabat, a annonc\u00e9 la Conf\u00e9d\u00e9ration Africaine de Football (CAF). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le chef du gouvernement Aziz\nAkhannouch a re\u00e7u, mercredi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement Aziz Akhannouch a re\u00e7u, mercredi \u00e0 Rabat, Fran\u00e7ois Provost, directeur ex\u00e9cutif du Groupe Renault, en pr\u00e9sence de Ryad Mezzour, ministre de l\u2019Industrie et du Commerce. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement a re\u00e7u, ce 29 octobre \u00e0 Rabat, Fran\u00e7ois Provost, directeur ex\u00e9cutif du groupe Renault. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [atlasinfo.fr]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u, mercredi \u00e0 Rabat, le Directeur ex\u00e9cutif de Renault, Fran\u00e7ois Provost, en pr\u00e9sence du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et a pr\u00e9sid\u00e9 la c\u00e9r\u00e9monie de signature d\u2019un avenant \u00e0 la convention d\u2019investissement avec le groupe. [www.lereporter.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a re\u00e7u le 29 octobre 2025 \u00e0 Rabat Fran\u00e7ois Provost, Directeur ex\u00e9cutif du Groupe Renault, pour discuter du d\u00e9veloppement de l\u2019industrie automobile marocaine, d\u00e9sormais moteur de croissance industrielle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 37, "id": "comm_label_37", "label": "L\u00e9quipe desport Clear Vision du\nMaroc repr\u00e9sentera la r\u00e9gion du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u00e9quipe desport Clear Vision du Maroc repr\u00e9sentera la r\u00e9gion du Moyen-Orient et de lAfrique lors des finales du Free Fire World Series 2025 \u00e0 Jakarta, qui d\u00e9butent le 31 octobre 2025. [www.yabiladi.com]\n-------------------------------------------------\nChampionne de la zone Moyen-Orient \u0026 Afrique (MEA), la formation marocaine affrontera, \u00e0 partir du 31 octobre, dix-sept \u00e9quipes issues d\u2019Asie du Sud-Est, d\u2019Asie du Sud et d\u2019Am\u00e9rique latine. [lnt.ma]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;

                nodes: {

                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }

                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,

                }
            };

        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
