nt v\u00e9n\u00e9zu\u00e9lien Nicol\u00e1s Maduro, a indique samedi le pr\u00e9sident am\u00e9ricain Donald Trump. [www.lopinion.ma]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain Donald Trump s\u2019est f\u00e9licit\u00e9 samedi d\u2019une op\u00e9ration militaire \u00ab spectaculaire \u00bb et \u00ab in\u00e9dite depuis la Seconde guerre mondiale \u00bb, apr\u00e8s les bombardements am\u00e9ricains sur Caracas et la capture du pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicol\u00e1s Maduro. [atlasinfo.fr]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain Donald Trump a annonc\u00e9 samedi que les forces arm\u00e9es des \u00c9tats-Unis avaient men\u00e9 une \u00ab attaque de grande envergure \u00bb contre le Venezuela et captur\u00e9 puis exfiltr\u00e9 le pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicolas Maduro, ainsi que son \u00e9pouse, \u00e0 l\u2019issue d\u2019une op\u00e9ration militaire ciblant notamment des installations strat\u00e9giques \u00e0 Caracas. [lnt.ma]\n-------------------------------------------------\nLes \u00c9tats-Unis vont administrer le Venezuela en attendant une transition \u00ab s\u00fbre et appropri\u00e9e \u00bb, apr\u00e8s l\u2019op\u00e9ration militaire am\u00e9ricaine qui a permis la capture et l\u2019exfiltration du pr\u00e9sident v\u00e9n\u00e9zu\u00e9lien Nicol\u00e1s Maduro, a indique samedi le pr\u00e9sident am\u00e9ricain Donald Trump. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La s\u00e9lection marocaine qui affrontera\nson homologue tanzanienne, en huiti\u00e8mes...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine qui affrontera son homologue tanzanienne, en huiti\u00e8mes de finale de la Coupe d\u2019Afrique des Nations (CAN-2025) de football, respecte son adversaire et fera tout son [www.challenge.ma]\n--         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {

            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
