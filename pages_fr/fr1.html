ulaire du Royaume, de l\u2019industrialisation \u00e0 l\u2019int\u00e9gration logistique, et son impact sur l\u2019\u00e9conomie et la transition \u00e9nerg\u00e9tique du continent. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc, un pays qui incarne la stabilit\u00e9, la cr\u00e9dibilit\u00e9 \u00e9conomique et la capacit\u00e9 de projection strat\u00e9gique, joue un r\u00f4le \u00ab structurant \u00bb sur le continent africain, a soulign\u00e9 le secr\u00e9taire ex\u00e9cutif de la Commission \u00e9conomique des Nations Unies pour l\u2019Afrique (CEA), Claver Gatete. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Une d\u00e9l\u00e9gation marocaine de F\u00e8s-Mekn\u00e8s\na rencontr\u00e9 \u00e0 Amman le...", "mass": 5, "physics": false, "shape": "box", "title": "Une d\u00e9l\u00e9gation marocaine de F\u00e8s-Mekn\u00e8s a rencontr\u00e9 \u00e0 Amman le pr\u00e9sident du S\u00e9nat jordanien, Fay\u00e7al Al-Fayez, pour renforcer la coop\u00e9ration bilat\u00e9rale dans les secteurs du tourisme, de l\u2019artisanat et de l\u2019\u00e9conomie sociale. [www.lavieeco.com]\n-------------------------------------------------\nUn d\u00e9l\u00e9gation marocaine de la r\u00e9gion de F\u00e8s-Mekn\u00e8s a eu, mardi \u00e0 Amman, des entretiens avec le pr\u00e9sident du S\u00e9nat jordanien, Fay\u00e7al Al-Fayez, ax\u00e9s sur les moyens de renforcer la coop\u00e9ration bilat\u00e9rale, notamment dans les domaines de l\u2019\u00e9conomie sociale et du tourisme. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 28, "id": "comm_label_28", "label": "Des averses, de fortes pluies\net rafales de vent sont...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses, de fortes pluies et rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]\n-------------------------------------------------\nDes averses, de fortes pluies et rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses, de fortes pluies et rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "La collision mortelle survenue il\ny a un an dans...", "mass": 5, "physics": false, "shape": "box", "title": "La collision mortelle survenue il y a un an dans l\u2019espace a\u00e9rien de l\u2019a\u00e9roport national \u00ab Ronald Reagon \u00bb de Washington (DCA) entre un avion commercial et un h\u00e9licopt\u00e8re militaire, \u00e9tait due \u00e0 de graves \u00ab d\u00e9faillances syst\u00e9miques \u00bb au niveau du contr\u00f4le a\u00e9rien, selon l\u2019enqu\u00eate de l\u2019Agence am\u00e9ricaine de s\u00e9curit\u00e9 des transports (NTSB). [maroc-diplomatique.net]\n-------------------------------------------------\nLa collision mortelle survenue il y a un an dans l\u2019espace a\u00e9rien de l\u2019a\u00e9roport national \u00ab Ronald Reagon \u00bb de Washington (DCA) entre un avion commercial et un h\u00e9licopt\u00e8re militaire, \u00e9tait due \u00e0 de graves \u00ab d\u00e9faillances syst\u00e9miques \u00bb au niveau du contr\u00f4le a\u00e9rien, selon l\u2019enqu\u00eate de l\u2019Agence am\u00e9ricaine de s\u00e9curit\u00e9 des transports (NTSB). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2025) est le fruit de la Vision Strat\u00e9gique de Sa Majest\u00e9 le Roi Mohammed VI et d\u2019un long processus d\u2019investissements publics, a affirm\u00e9, mardi \u00e0 Rabat, le Chef du gouvernement, Aziz Akhannouch. [www.lereporter.ma]\n-------------------------------------------------\nLors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re consacr\u00e9e aux questions orales sur la politique g\u00e9n\u00e9rale \u00e0 la Chambre des conseillers, tenue mardi \u00e0 Rabat autour du th\u00e8me \u00ab Politiques gouvernementales dans le domaine du sport : r\u00e9alisations et enjeux \u00bb, le Chef du gouvernement, Aziz Akhannouch, a dress\u00e9 un bilan de l\u2019organisation de la Coupe d\u2019Afrique des Nations . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le trafic maritime entre les\nports espagnols d\u2019Alg\u00e9siras et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le trafic maritime entre les ports espagnols d\u2019Alg\u00e9siras et de Tarifa et celui de Tanger a \u00e9t\u00e9 suspendu mercredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la d\u00e9pression \u00ab Kristin \u00bb, qui affecte le d\u00e9troit, ont indiqu\u00e9 les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [fr.hespress.com]\n-------------------------------------------------\nLe trafic maritime entre les ports espagnols d\u2019Alg\u00e9siras et de Tarifa et celui de Tanger a \u00e9t\u00e9 suspendu mercredi en raison des conditions m\u00e9t\u00e9orologiques d\u00e9favorables provoqu\u00e9es par la d\u00e9pression \u00ab Kristin \u00bb, qui affecte le d\u00e9troit, ont indiqu\u00e9 les autorit\u00e9s portuaires de la baie d\u2019Alg\u00e9siras. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Roi Mohammed VI a\npr\u00e9sid\u00e9, le mercredi 28 janvier...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a pr\u00e9sid\u00e9, le mercredi 28 janvier 2026 au Palais Royal de Casablanca, une r\u00e9union de travail, consacr\u00e9e au nouveau complexe portuaire et industriel de Nador West Med. [fr.hespress.com]\n-------------------------------------------------\nLe roi a pr\u00e9sid\u00e9, ce mercredi 28 janvier au palais royal de Casablanca, une r\u00e9union de travail consacr\u00e9e au nouveau complexe portuaire et industriel de Nador West Med. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a pr\u00e9sid\u00e9, le mercredi 28 janvier 2026 au Palais Royal de Casablanca, une r\u00e9union de travail, consacr\u00e9e au nouveau complexe portuaire et [www.challenge.ma]\n-------------------------------------------------\n\u00ab Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a pr\u00e9sid\u00e9, le mercredi 28 janvier 2026 au Palais Royal de Casablanca, une r\u00e9union de travail, consacr\u00e9e au nouveau complexe portuaire et industriel de Nador West Med \u00bb, indique un communiqu\u00e9 du Cabinet Royal. [aujourdhui.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a pr\u00e9sid\u00e9, mercredi \u00e0 Casablanca, une r\u00e9union de travail consacr\u00e9e \u00e0 l\u2019\u00e9tat d\u2019avancement du complexe portuaire et industriel Nador West Med, \u00e0 l\u2019approche de son lancement op\u00e9rationnel pr\u00e9vu au quatri\u00e8me trimestre 2026. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La CAN 2025 au Maroc\na franchi un cap historique...", "mass": 5, "physics": false, "shape": "box", "title": "La CAN 2025 au Maroc a franchi un cap historique en mati\u00e8re de rayonnement digital, enregistrant plus de 6 milliards de vues sur les plateformes num\u00e9riques tout au long de la comp\u00e9tition. [fr.hespress.com]\n-------------------------------------------------\nLa CAN 2025 a \u00e9tabli un record historique d\u2019engagement num\u00e9rique avec 6 milliards de vues sur les plateformes sociales. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Organis\u00e9 par la F\u00e9d\u00e9ration Royale\nMarocaine de Surf (FRMS), cet...", "mass": 5, "physics": false, "shape": "box", "title": "Organis\u00e9 par la F\u00e9d\u00e9ration Royale Marocaine de Surf (FRMS), cet \u00e9v\u00e9nement sportif international de premier plan rassemblera l\u2019\u00e9lite mondiale du bodyboard, avec la participation d\u2019a. [lematin.ma]\n-------------------------------------------------\nOrganis\u00e9 par la F\u00e9d\u00e9ration royale marocaine de surf (FRMS), cet \u00e9v\u00e9nement sportif international rassemblera l\u2019\u00e9lite mondiale du bodyboard, avec la participation d\u2019athl\u00e8tes repr\u00e9sentant plusieurs nations, indique un communiqu\u00e9 de la F\u00e9d\u00e9ration. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le ministre de la Jeunesse,\nde la Culture et de...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Jeunesse, de la Culture et de la Communication Mohamed Mehdi Bensaid a annonc\u00e9 engager l\u2019ensemble des proc\u00e9dures l\u00e9gales et saisir la justice contre toute personne impliqu\u00e9e dans la fabrication, la publication ou la diffusion de ce qu\u2019il qualifie \u201cd\u2019all\u00e9gations mensong\u00e8res\u201d, en lien avec l\u2019affaire \u201cEscobar du Sahara\u201d. [telquel.ma]\n-------------------------------------------------\nMohammed Mehdi Bensaid, ministre de la Jeunesse, de la Culture et de la Communication, a publi\u00e9 un communiqu\u00e9 \u00e0 l\u2019attention de l\u2019opinion publique pour r\u00e9pondre aux accusations qu\u2019il juge \u00ab infond\u00e9es \u00bb et \u00ab mensong\u00e8res \u00bb relay\u00e9es par un site \u00e9lectronique et certaines pages sur les r\u00e9seaux sociaux, en lien avec l\u0027affaire \u00ab Escobar du Sahara \u00bb actuellement port\u00e9e devant la justice. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "R\u00e9uni ce mercredi 28 janvier,\nle Bureau politique du RNI...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni ce mercredi 28 janvier, le Bureau politique du RNI a annonc\u00e9 avoir re\u00e7u la candidature de Mohamed Chaouki qu\u2019il a d\u00e9cid\u00e9 de soumettre \u00e0 l\u2019appr\u00e9ciation de la session extraordinaire du congr\u00e8s. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s la cl\u00f4ture de la p\u00e9riode de candidature, le d\u00e9put\u00e9 Mohamed Chaouki est l\u2019unique candidat \u00e0 la pr\u00e9sidence du Rassemblement national des ind\u00e9pendants (RNI), suite \u00e0 la d\u00e9cision [www.challenge.ma]\n-------------------------------------------------\nLe bureau politique du Rassemblement National des Ind\u00e9pendants (RNI) a r\u00e9v\u00e9l\u00e9 dans un communiqu\u00e9 qu\u00e0 la cl\u00f4ture de la p\u00e9riode de d\u00e9p\u00f4t des candidatures pour succ\u00e9der \u00e0 Aziz Akhannouch \u00e0 la t\u00eate du parti, une seule candidature a \u00e9t\u00e9 enregistr\u00e9e, celle de Mohamed Chouki. [www.yabiladi.com]\n-------------------------------------------------\nDans un communiqu\u00e9 diffus\u00e9 ce mercredi 28 janvier, le Bureau politique du Rassemblement national des ind\u00e9pendants (RNI) a annonc\u00e9 avoir re\u00e7u la candidature de Mohamed Chaouki pour la pr\u00e9sidence du parti. [leseco.ma]\n-------------------------------------------------\nR\u00e9uni mercredi 28 ja <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
