u00e9s de la R\u00e9publique de Guin\u00e9e Bissau, Fatumata Jau, a r\u00e9it\u00e9r\u00e9, lundi \u00e0 Rabat, la position constante et ind\u00e9fectible de son pays en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les comptes nationaux du premier\ntrimestre 2026 publi\u00e9s par le...", "mass": 5, "physics": false, "shape": "box", "title": "Les comptes nationaux du premier trimestre 2026 publi\u00e9s par le Haut-Commissariat au Plan (HCP) montrent que l\u0027\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6%, contre 5%. [lematin.ma]\n-------------------------------------------------\nLes r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [www.yabiladi.com]\n-------------------------------------------------\nLes r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nCette demande a contribu\u00e9 pour 6,9 points \u00e0 la croissance \u00e9conomique nationale au lieu de 5,3 points, indique le HCP dans sa note d\u2019information sur la situation \u00e9conomique [www.lereporter.ma]\n-------------------------------------------------\nL\u2019\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6 % au premier trimestre 2026, contre 5 % \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les comptes nationaux publi\u00e9s lundi par le Haut-Commissariat au Plan (HCP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Une vague de chaleur, un\ntemps chaud et de fortes...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur, un temps chaud et de fortes rafales de vent avec temp\u00eate de sable sont attendues de lundi \u00e0 mercredi dans plusieurs provinces du Royaume, a indiqu\u00e9 lundi la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur, un temps chaud et de fortes rafales de vent avec temp\u00eate de sable sont attendues de lundi \u00e0 mercredi dans plusieurs provinces du Maroc, a indiqu\u00e9 lundi la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) annonce une vague de chaleur, un temps chaud et de fortes rafales de vent accompagn\u00e9es de temp\u00eates de sable de lundi \u00e0 mercredi dans plusieurs provinces du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La pr\u00e9sidente du Groupe de\nla Banque europ\u00e9enne d\u2019investissement (BEI),...", "mass": 5, "physics": false, "shape": "box", "title": "La pr\u00e9sidente du Groupe de la Banque europ\u00e9enne d\u2019investissement (BEI), Nadia Calvi\u00f1o, a annonc\u00e9 que la Banque pr\u00e9voit d\u2019atteindre 700 millions d\u2019euros d\u2019investissements au Maroc durant l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nEn visite de travail dans le Royaume, la pr\u00e9sidente de la Banque europ\u00e9enne d\u2019investissement (BEI), Nadia Calvi\u00f1o, a assur\u00e9 que les investisseurs internationaux font de plus en plus [www.challenge.ma]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u0027investissement (BEI) pr\u00e9voit de mobiliser plus de 700 millions d\u0027euros d\u0027investissements au Maroc en 2026, a annonc\u00e9 sa pr\u00e9sidente, Nadia Calvi\u00f1o, \u00e0 l\u0027occasion de sa premi\u00e8re visite officielle dans le Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLa pr\u00e9sidente du Groupe de la Banque europ\u00e9enne d\u0027investissement (BEI), Nadia Calvi\u00f1o, a annonc\u00e9 que la Banque pr\u00e9voit d\u0027atteindre 700 millions d\u0027euros (M\u20ac) d\u0027investissements au Maroc durant l\u0027ann\u00e9e 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le s\u00e9lectionneur des Pays-Bas, Ronald\nKoeman, s\u2019est montr\u00e9 \u00e9logieux envers...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur des Pays-Bas, Ronald Koeman, s\u2019est montr\u00e9 \u00e9logieux envers la s\u00e9lection marocaine, estimant que le match de 16e de finale entre les deux \u00e9quipes, pr\u00e9vu lundi, sera \u00ab un grand match \u00bb entre deux pr\u00e9tendants aux premiers r\u00f4les de la Coupe du monde 2026. [telquel.ma]\n-------------------------------------------------\n\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, sest montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur des Pays-Bas, Ronald Koeman, s\u0027est montr\u00e9 \u00e9logieux envers la s\u00e9lection marocaine, estimant que le match de 16e de finale entre les deux \u00e9quipes, pr\u00e9vu lundi, sera \"un grand match\" entre deux pr\u00e9tendants aux premiers r\u00f4les de la Coupe du monde 2026. [leseco.ma]\n-------------------------------------------------\n\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, s\u2019est montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.lereporter.ma]\n-------------------------------------------------\n\u00c0 l\u2019aube de son huiti\u00e8me de finale de la Coupe du monde 2026 face aux Pays-Bas, la s\u00e9lection marocaine affiche confiance et d\u00e9termination, tout en mesurant l\u2019ampleur du d\u00e9fi qui l\u2019attend lundi au stade de Monterrey. [lnt.ma]\n-------------------------------------------------\nLes Lions de l\u2019Atlas sont parvenus \u00e0 se qualifier \u00e0 l\u2019issue d\u2019une s\u00e9ance de tirs aux buts (1-1, 3-2 aux tirs aux buts) lors du seizi\u00e8me de finale opposant l\u2019\u00e9quipe nationale aux Pays-Bas. [telquel.ma]\n-------------------------------------------------\nOppos\u00e9s aux Pays-Bas, lundi soir au stade de Monterrey (Mexique), les Lions de l\u2019Atlas ont fini par s\u2019imposer lors de la s\u00e9ance des tirs au but (3-2), apr\u00e8s un match conclu sur un score de 1-1 au terme du temps r\u00e9glementaire et des prolongations. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e pour les huiti\u00e8mes de finale de la Coupe du Monde 2026, apr\u00e8s sa victoire face aux Pays-Bas aux tirs au but (3-2), lundi soir au stade de Monterrey, au Mexique. [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e pour les huiti\u00e8mes de finale de la Coupe du Monde 2026, apr\u00e8s sa victoire face aux Pays-Bas aux tirs au but (3-2), lundi soir au stade de Monterrey, au Mexique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixe
