le": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9 la cr\u00e9ation, au sein de son si\u00e8ge central, d\u2019un nouveau service charg\u00e9 de la gestion de la salle centrale des grands \u00e9. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a proc\u00e9d\u00e9 \u00e0 la cr\u00e9ation d\u2019une nouvelle structure s\u00e9curitaire au sein de son si\u00e8ge central : un service d\u00e9di\u00e9 \u00e0 la gestion de la salle centrale pour les grands \u00e9v\u00e9nements et les crises. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des averses orageuses oscillant entre\n20 et 30 mm sont...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses oscillant entre 20 et 30 mm sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u0027Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag, a pr\u00e9cis\u00e9 la DGM d. [lematin.ma]\n-------------------------------------------------\nOscillant entre 20 et 30 mm, ces averses sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u2019Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag,. [telquel.ma]\n-------------------------------------------------\nDes pluies orageuses, pouvant s\u2019accompagner de gr\u00eale et de rafales de vent, sont pr\u00e9vues lundi 2 et mardi 3 novembre dans diff\u00e9rentes provinces du Maroc, selon un bulletin d\u2019alerte de vigilance orange de la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nOscillant entre 20 et 30 mm, ces averses sont pr\u00e9vues, ce lundi de 13h \u00e0 23h00, dans les provinces d\u2019Es-Semara, Oued Ed-Dahab, Boujdour et Assa-zag, . [aujourdhui.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) annonce des averses orageuses accompagn\u00e9es de gr\u00eale et de rafales de vent dans plusieurs provinces du Maroc, lundi 2 et mardi 3 novembre 2026. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cette ann\u00e9e, 10 films seront\nd\u00e9voil\u00e9s en premi\u00e8re mondiale, 12...", "mass": 5, "physics": false, "shape": "box", "title": "Cette ann\u00e9e, 10 films seront d\u00e9voil\u00e9s en premi\u00e8re mondiale, 12 ont \u00e9t\u00e9 accompagn\u00e9s par les Ateliers de l\u2019Atlas et 11 repr\u00e9senteront leur pays dans la course aux Oscars, indiquent l. [lematin.ma]\n-------------------------------------------------\nDix dentre eux seront pr\u00e9sent\u00e9s en avant-premi\u00e8re mondiale, douze ont b\u00e9n\u00e9fici\u00e9 du soutien des Ateliers de l\u2019Atlas, et onze repr\u00e9sentent leur pays dans la comp\u00e9tition pour les Oscars. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019association EAC-L\u2019Boulvart a annonc\u00e9 le\nlancement du Grand Prix du...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019association EAC-L\u2019Boulvart a annonc\u00e9 le lancement du Grand Prix du Festival Jidar, offrant ainsi au public l\u2019opportunit\u00e9 de choisir la meilleure fresque murale r\u00e9alis\u00e9e dans le cadre de la deuxi\u00e8me \u00e9dition de cette distinction d\u00e9di\u00e9e au street art \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nL\u2019association EAC-L\u2019Boulvart a donn\u00e9 le coup d\u2019envoi de la deuxi\u00e8me \u00e9dition du Grand Prix Jidar Festival, permettant au public de voter pour sa fresque favorite parmi celles cr\u00e9\u00e9es lors du festival d\u2019art urbain \u00e0 Rabat cette ann\u00e9e. [www.yabiladi.com]\n-------------------------------------------------\nJusqu\u2019au 30 novembre, quatorze fresques r\u00e9alis\u00e9es lors de JIDAR\u2013Rabat Street Art Festival 2026 sont soumises au vote en ligne. [www.lavieeco.com]\n-------------------------------------------------\nDu 1er au 30 novembre, les internautes pourront voter pour leur fresque pr\u00e9f\u00e9r\u00e9e parmi les 14 \u0153uvres r\u00e9alis\u00e9es lors de la 11e \u00e9dition du festival, organis\u00e9e . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le veto russe au projet\nam\u00e9ricain et l\u2019\u00e9chec du contre-projet...", "mass": 5, "physics": false, "shape": "box", "title": "Le veto russe au projet am\u00e9ricain et l\u2019\u00e9chec du contre-projet de Moscou ont r\u00e9v\u00e9l\u00e9 les limites d\u2019un processus onusien soumis aux rivalit\u00e9s des grandes puissances. [telquel.ma]\n-------------------------------------------------\nLe veto oppos\u00e9 vendredi par Moscou au projet am\u00e9ricain, suivi de l\u2019\u00e9chec de la contre-proposition russe, laisse la MINURSO sans nouveau mandat, une premi\u00e8re depuis sa cr\u00e9ation, en 1991. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Elle proposera une s\u00e9lection de\n76 films en provenance de...", "mass": 5, "physics": false, "shape": "box", "title": "Elle proposera une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis entre la comp\u00e9tition officielle, les s\u00e9ances de gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances jeune public \u0026. [telquel.ma]\n-------------------------------------------------\nAu total, 76 films venus de 39 pays seront pr\u00e9sent\u00e9s dans les diff\u00e9rentes sections, dont 10 en premi\u00e8re mondiale. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de sa 23e \u00e9dition qui se d\u00e9roulera du 20 au 28 novembre 2026, le Festival International du Film de Marrakech c\u00e9l\u00e8brera les cin\u00e9mas du monde \u00e0 travers une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis en plusieurs sections : la Comp\u00e9tition officielle, les s\u00e9ances de Gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances Jeune public \u0026 familles et les films projet\u00e9s dans le cadre des hommages. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le juge d\u2019instruction pr\u00e8s la\nCour d\u2019appel d\u2019Agadir a ordonn\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le juge d\u2019instruction pr\u00e8s la Cour d\u2019appel d\u2019Agadir a ordonn\u00e9, dimanche, de placer en d\u00e9tention trois individus suite \u00e0 l\u2019incident au cours duquel un policier a \u00e9t\u00e9 percut\u00e9 \u00e0 Agadir lors de l\u2019exercice de ses fonctions et qui a failli lui co\u00fbter la vie, et ce \u00e0 l\u2019issue de leur interrogatoire pr\u00e9liminaire, en vue de. [telquel.ma]\n-------------------------------------------------\nProc\u00e9dure judiciaire : Le juge d\u2019instruction pr\u00e8s la Cour d\u2019appel d\u2019Agadir a ordonn\u00e9, dimanche, de placer en d\u00e9tention trois individus suite \u00e0 l\u2019incident au cours duquel un policier a \u00e9t\u00e9 percut\u00e9 \u00e0 Agadir lors de l\u2019exercice de ses fonctions et qui a failli lui co\u00fbter la vie, et ce \u00e0 l\u2019issue de leur interrogatoire pr\u00e9liminaire, . [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Apr\u00e8s le non-renouvellement du mandat\nde la Minurso (la mission...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s le non-renouvellement du mandat de la Minurso (la mission de l\u2019ONU au Sahara) par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, le Secr\u00e9taire g\u00e9n\u00e9ral des Nations Unies Antonio Guterres prend acte de la cessation de ses op\u00e9rations. [telquel.ma]\n-------------------------------------------------\nDimanche 1er novembre, les Nations Unies ont officiellement annonc\u00e9 la cessation des op\u00e9rations de la Mission, apr\u00e8s sa non-reconduction par le Conseil de s\u00e9curit\u00e9. [leseco.ma]\n-------------------------------------------------\nLes Nations unies ont d\u00e9voil\u00e9 les d\u00e9tails de l\u2019op\u00e9ration de liquidation de la Mission des Nations unies pour l\u2019organisation d\u2019un r\u00e9f\u00e9rendum au Sahara (MINURSO), dont la phase op\u00e9rationnelle a d\u00e9but\u00e9 le 1er novembre. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le documentaire \u00abLa Tour Mohammed\nVI : L\u2019H\u00e9ritage du Futur\u00bb,...", "mass": 5, "physics": false, "shape": "box", "title": "Le documentaire \u00abLa Tour Mohammed VI : L\u2019H\u00e9ritage du Futur\u00bb, produit par Dounia Benjelloun Mezian et r\u00e9alis\u00e9 par Abderrahim Mettour, a \u00e9t\u00e9 pr\u00e9sent\u00e9 en avant-premi\u00e8re \u00e0 Casablanca, devant une salle comble. [www.yabiladi.com]\n-------------------------------------------------\nR\u00e9alis\u00e9 par Abderrahim Mettour et produit par Dounia Benjelloun Mezian, ce documentaire de 52 minutes met en lumi\u00e8re les femmes et les hommes qui ont donn\u00e9 corps au projet. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le groupe minier a sollicit\u00e9\nla suspension de la cotation...", "mass": 5, "physics": false, "shape"         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
