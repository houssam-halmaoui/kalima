op\u00e9ration \u00e9troite et de confiance mutuelle\u201d. [www.lereporter.ma]\n-------------------------------------------------\nLes relations entre le Maroc et l\u2019Union europ\u00e9enne ont \u00e9t\u00e9 au centre des entretiens tenus jeudi \u00e0 Rabat entre le ministre des Affaires \u00e9trang\u00e8res, Nasser Bourita, et la Haute repr\u00e9sentante de l\u2019UE pour les affaires \u00e9trang\u00e8res et la politique de s\u00e9curit\u00e9, Kaja Kallas, \u00e0 l\u2019occasion de la visite de travail de cette derni\u00e8re au Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le conseil d\u0027administration de la\nConf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du...", "mass": 5, "physics": false, "shape": "box", "title": "Le conseil d\u0027administration de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a valid\u00e9, mercredi 15 avril 2026, la candidature du bin\u00f4me Mehdi Tazi et Mohamed Bachir. [lematin.ma]\n-------------------------------------------------\nA moins d\u2019un mois de passer le t\u00e9moin \u00e0 son successeur, le pr\u00e9sident de la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM), Chakib Alj, a dress\u00e9 un bilan [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La compagnie a\u00e9rienne EasyJet a\ninaugur\u00e9 sa premi\u00e8re base en...", "mass": 5, "physics": false, "shape": "box", "title": "La compagnie a\u00e9rienne EasyJet a inaugur\u00e9 sa premi\u00e8re base en Afrique, situ\u00e9e \u00e0 l\u0027a\u00e9roport de Marrakech-M\u00e9nara, conform\u00e9ment au partenariat strat\u00e9gique conclu en novembre 2025 a. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne easyJet a inaugur\u00e9 sa premi\u00e8re base en Afriq         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');

                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {

                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
