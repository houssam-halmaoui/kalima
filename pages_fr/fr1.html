 et sauvetage des Forces Arm\u00e9es Royales (FAR) sont \u00e0 pied d\u2019\u0153uvre, depuis le 2 mai de jour comme de nuit, pour retrouver les deux militaires am\u00e9ricains port\u00e9s disparus, en marge de leur participation \u00e0 l\u2019exercice African Lion, apprend-on aupr\u00e8s de sources officielles des FAR. [aujourdhui.ma]\n-------------------------------------------------\nLes Forces Arm\u00e9es Royales poursuivent, depuis le 2 mai, d\u2019importantes op\u00e9rations de recherche pour retrouver deux militaires am\u00e9ricains port\u00e9s disparus \u00e0 Cap Draa, en marge de l\u2019exercice African Lion. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La capacit\u00e9 annuelle de production\nd\u2019eau dessal\u00e9e au Maroc s\u2019\u00e9l\u00e8ve...", "mass": 5, "physics": false, "shape": "box", "title": "La capacit\u00e9 annuelle de production d\u2019eau dessal\u00e9e au Maroc s\u2019\u00e9l\u00e8ve \u00e0 420 millions de m3, dans l\u2019ambition de la porter \u00e0 1,7 milliard de m3, a indiqu\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nLa capacit\u00e9 annuelle de production d\u2019eau dessal\u00e9e au Maroc s\u2019\u00e9l\u00e8ve \u00e0 420 millions de m3, dans l\u2019ambition de la porter \u00e0 1,7 milliard de m3, a indiqu\u00e9 mardi le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Retail : C\u2019est au Sela\nPark Almaz que Brands \u0026...", "mass": 5, "physics": false, "shape": "box", "title": "Retail : C\u2019est au Sela Park Almaz que Brands \u0026 Corners, enseigne marocaine sp\u00e9cialis\u00e9e dans le retail, a inaugur\u00e9, mardi \u00e0 Casablanca, son 12\u00e8me magasin au Maroc. [aujourdhui.ma]\n-------------------------------------------------\nBrands \u0026 Corners a inaugur\u00e9 un nouveau point de vente au Maroc, portant \u00e0 douze le nombre total de magasins de l\u2019enseigne dans le pays, dont cinq \u00e0 Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "L\u0027ambassadeur repr\u00e9sentant permanent du Maroc\naupr\u00e8s des Nations Unies a...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies a r\u00e9affirm\u00e9 l\u2019engagement fort et p\u00e9renne du Royaume en faveur de la coop\u00e9ration Sud-Sud et triangulaire, qu\u2019il a qualifi\u00e9 de composante essentielle de la diplomatie Royale. [www.lavieeco.com]\n-------------------------------------------------\nLors d\u2019une r\u00e9union \u00e9largie du Bureau du Comit\u00e9 de haut niveau des Nations Unies sur la coop\u00e9ration Sud-Sud, qui se tient \u00e0 Santa Marta, en Colombie, l\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale, a soulign\u00e9 mercredi que la strat\u00e9gie du Maroc en mati\u00e8re de coop\u00e9ration Sud-Sud, initi\u00e9e par le Roi Mohammed . [atlasinfo.fr]\n-------------------------------------------------\nLa strat\u00e9gie du Maroc en mati\u00e8re de coop\u00e9ration Sud-Sud, initi\u00e9e par Sa Majest\u00e9 le Roi Mohammed VI, constitue \u201cun acte de constante solidarit\u00e9\u201d avec les pays du Sud Global, a affirm\u00e9, mercredi \u00e0 Santa Marta, en Colombie, l\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s des Nations Unies, Omar Hilale. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "La cr\u00e9ation du R\u00e9seau africain\ndes parlements ouverts a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La cr\u00e9ation du R\u00e9seau africain des parlements ouverts a \u00e9t\u00e9 annonc\u00e9e en marge de la Conf\u00e9rence africaine du Partenariat pour un Gouvernement Ouvert. [www.lavieeco.com]\n-------------------------------------------------\nLa cr\u00e9ation du R\u00e9seau africain des parlements ouverts en tant que cadre d\u2019\u00e9change d\u2019exp\u00e9riences entre les parlements des pays membres de l\u2019Initiative \u00ab Partenariat pour un Gouvernement Ouvert (PGO) \u00bb et de ceux candidats \u00e0 y adh\u00e9rer, a \u00e9t\u00e9 annonc\u00e9e mercredi au si\u00e8ge de la Chambre des repr\u00e9sentants. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Ces activit\u00e9s civilo-militaires (CIMIC), men\u00e9es\nen coop\u00e9ration entre les Forces...", "mass": 5, "physics": false, "shape": "box", "title": "Ces activit\u00e9s civilo-militaires (CIMIC), men\u00e9es en coop\u00e9ration entre les Forces Arm\u00e9es Royales et l\u2019arm\u00e9e am\u00e9ricaine, concernent principalement les domaines de l\u2019ophtalmologie et de la m\u00e9decine dentaire, au niveau notamment des \u00e9coles \u201cAl Fadila\u201d et \u201cTawarta\u201d. [www.lavieeco.com]\n-------------------------------------------------\nDes prestations m\u00e9dicales et des actions de sensibilisation en ophtalmologie et m\u00e9decine dentaire ont \u00e9t\u00e9 organis\u00e9es, mercredi, au profit des enfants \u00e0 Dakhla, dans le cadre des activit\u00e9s humanitaires parall\u00e8les de l\u2019exercice combin\u00e9 maroco-am\u00e9ricain \u201cAfrican Lion 2026\u201d, organis\u00e9 conform\u00e9ment aux Hautes Instructions du Roi, Chef supr\u00eame et Chef d\u2019\u00c9tat-Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
