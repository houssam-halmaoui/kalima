-----------------------\nCet \u00e9loge a \u00e9t\u00e9 exprim\u00e9 par le Vice-Premier ministre et ministre des Affaires \u00e9trang\u00e8res de la Pologne, Rados\u0142aw Sikorski, dans un Communiqu\u00e9 conjoint publi\u00e9, mardi, \u00e0 l\u2019issue d\u2019un entretien [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Projet de Loi de\nFinances (PLF) 2026 pr\u00e9voit une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Projet de Loi de Finances (PLF) 2026 pr\u00e9voit une s\u00e9rie de mesures douani\u00e8res strat\u00e9giques, entre hausses et baisses cibl\u00e9es des droits d\u2019importation. [fr.hespress.com]\n-------------------------------------------------\nFouzi Lekjaa, ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du budget, a pr\u00e9sent\u00e9 plusieurs modifications concernant les droits de douane pr\u00e9vues dans le projet de loi de finances (PLF) 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "El Mokhtar Dahraoui prend la\ndirection de l\u2019a\u00e9roport Rabat-Sal\u00e9, une...", "mass": 5, "physics": false, "shape": "box", "title": "El Mokhtar Dahraoui prend la direction de l\u2019a\u00e9roport Rabat-Sal\u00e9, une nomination qui s\u2019inscrit dans la dynamique de modernisation du r\u00e9seau a\u00e9roportuaire national. [lematin.ma]\n-------------------------------------------------\nL\u2019Office National Des A\u00e9roports (ONDA) a nomm\u00e9 El Mokhtar Dahraoui \u00e0 la direction de l\u2019a\u00e9roport Rabat-Sal\u00e9, dans le cadre de sa strat\u00e9gie de restructuration de son r\u00e9seau a\u00e9roportuaire. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des a\u00e9roports (ONDA) poursuit la restructuration de son r\u00e9seau en confiant la direction de l\u2019a\u00e9roport Rabat-Sal\u00e9 \u00e0 El Mokhtar Dahraoui. [www.challenge.ma]\n-------------------------------------------------\n\u00ab L\u2019ONDA poursuit sa strat\u00e9gie de restructuration de son r\u00e9seau en confiant la direction de l\u2019a\u00e9roport Rabat-Sal\u00e9 \u00e0 El Mokhtar Dahraoui \u00bb, indique l\u2019Office dans un communiqu\u00e9, ajoutant que cette nomination s\u2019inscrit dans la volont\u00e9 de doter . [aujourdhui.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9, cette d\u00e9cision s\u2019inscrit dans la strat\u00e9gie de modernisation du r\u00e9seau et vise \u00e0 renforcer la gouvernance de la capitale, au regard de son r\u00f4le croissant \u00e0 l\u2019\u00e9chelle nationale et internationale. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le vol inaugural de cette\nnouvelle desserte, op\u00e9r\u00e9e \u00e0 raison...", "mass": 5, "physics": false, "shape": "box", "title": "Le vol inaugural de cette nouvelle desserte, op\u00e9r\u00e9e \u00e0 raison de deux fr\u00e9quences hebdomadaires (lundis et vendredis), a d\u00e9coll\u00e9 de l\u2019a\u00e9roport Mohammed V de Casablanca \u00e0 13h30 pour a. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale, Royal Air Maroc (RAM) a inaugur\u00e9, lundi, sa nouvelle ligne directe reliant Casablanca \u00e0 Munich, marquant une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne entre le Maroc et l\u2019Allemagne. [telquel.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne nationale, Royal air Maroc (RAM) a inaugur\u00e9, lundi, sa nouvelle ligne directe reliant Casablanca \u00e0 Munich, marquant une nouvelle \u00e9tape dans le renforcement de la connectivit\u00e9 a\u00e9rienne entre le Maroc et l\u2019Allemagne. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "En ex\u00e9cution des Hautes Instructions\nRoyales, le Ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des Hautes Instructions Royales, le Ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u, mardi au si\u00e8ge de cette Administration, la Ministre lib\u00e9rienne de la D\u00e9fense Nationale, Geraldine Janet George, accompagn\u00e9e d\u2019une importante d\u00e9l\u00e9gation en visite de travail au Maroc. [www.lopinion.ma]\n-------------------------------------------------\nEn ex\u00e9cution des instructions royales, le Ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du Gouvernement, charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u lundi, au si\u00e8ge de cette Administration, le G\u00e9n\u00e9ral d\u2019Arm\u00e9e Dagvin Anderson, Commandant du Commandement Am\u00e9ricain pour l\u2019Afrique \u00ab USAFRICOM \u00bb, en visite de travail au Royaume du Maroc. [telquel.ma]\n-------------------------------------------------\nEn ex\u00e9cution des hautes instructions royales, le Ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du Gouvernement, charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u lundi, au si\u00e8ge de cette Administration, le G\u00e9n\u00e9ral d\u2019Arm\u00e9e Dagvin Anderson, Commandant du Commandement Am\u00e9ricain pour l\u2019Afrique \u00ab USAFRICOM \u00bb, en visite de travail au Royaume du Maroc. [atlasinfo.fr]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, le Ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du Gouvernement, charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, a re\u00e7u lundi, au si\u00e8ge de cette Administration, le G\u00e9n\u00e9ral d\u2019Arm\u00e9e Dagvin Anderson, Commandant du Commandement Am\u00e9ricain pour l\u2019Afrique \u201cUSAFRICOM\u201d, en visite de travail au Royaume du Maroc. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019int\u00e9gration des industries du gaming\net du cin\u00e9ma constitue un...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019int\u00e9gration des industries du gaming et du cin\u00e9ma constitue un levier \u00e0 m\u00eame de stimuler l\u2019emploi des jeunes et de renforcer les industries culturelles nationales, a soulign\u00e9, lundi \u00e0 Tanger, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [telquel.ma]\n-------------------------------------------------\nL\u2019int\u00e9gration des industries du gaming et du cin\u00e9ma constitue un levier \u00e0 m\u00eame de stimuler l\u2019emploi des jeunes et de renforcer les industries culturelles nationales, a soulign\u00e9, lundi \u00e0 Tanger, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La ministre de l\u2019\u00c9conomie et\ndes Finances, Nadia Fettah, a...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, a pr\u00e9sent\u00e9, lundi lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re commune entre les deux Chambres du Parlement, les grandes lignes du projet de loi de finances (PLF) n\u00b050-25 au titre de l\u2019ann\u00e9e budg\u00e9taire 2026. [telquel.ma]\n-------------------------------------------------\nLa ministre de l\u2019\u00c9conomie et des finances, Nadia Fettah, a indiqu\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, que moins de 1,3% des demandes de b\u00e9n\u00e9fice des aides sociales directes sont refus\u00e9es chaque mois en 2025. [www.yabiladi.com]\n-------------------------------------------------\nLa ministre de l\u2019Economie et des Finances a indiqu\u00e9 qu\u2019\u00e0 travers ce budget, le gouvernement s\u2019engage \u00e0 mettre en \u0153uvre les chantiers du \"Maroc \u00c9mergent\", afin de r\u00e9aliser un d\u00e9veloppement national alliant justice sociale et d\u00e9veloppement territorial int\u00e9gr\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLors de la s\u00e9ance pl\u00e9ni\u00e8re \u00e0 la Chambre des repr\u00e9sentants, tenue lundi, la ministre de l\u2019\u00c9conomie et des finances, Nadia Fettah Alaoui, a annonc\u00e9 qu\u2019un bilan des chantiers initi\u00e9s dans diff\u00e9rents secteurs d\u2019activit\u00e9 sera pr\u00e9sent\u00e9 dans les prochains jours, au Parlement. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La statistique officielle marocaine, qui\njouit d\u2019une forte cr\u00e9dibilit\u00e9 aupr\u00e8s...", "mass": 5, "physics": false, "shape": "box", "title": "La statistique officielle marocaine, qui jouit d\u2019une forte cr\u00e9dibilit\u00e9 aupr\u00e8s des institutions internationales et des investisseurs, devrait \u00e9voluer et s\u2019adapter aux changements du contexte, d\u2019autant plus que le royaume a amorc\u00e9 de nombreuses transitions structurelles ces derni\u00e8res ann\u00e9es, a soulign\u00e9, lundi \u00e0 Rabat, le Wali de Bank Al-Maghrib (BAM), Abdellatif Jouahri. [www.yabiladi.com]\n-------------------------------------------------\nLe Wali de Bank Al-Maghrib (BAM), Abdellatif Jouahri, a soulign\u00e9, lundi \u00e0 Rabat, la n\u00e9cessit\u00e9 pour la statistique officielle marocaine de s\u2019adapter aux mutations du contexte national et international, alo <script>

    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
