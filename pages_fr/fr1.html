te-priorite-de-la-politique-etrangere-du-royaume-mme-el-mansouri/", "x": 0, "y": 0}, {"font": {"vadjust": -124.5}, "group": 5, "id": 235, "label": "FAR | Mohammed Berrid re\u00e7oit...", "shape": "dot", "size": 83, "title": "FAR | Mohammed Berrid re\u00e7oit le nouveau commandant de la force de la Minurso\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/far-mohammed-berrid-recoit-le-nouveau-commandant-de-la-force-de-la-minurso/", "x": 0, "y": 0}, {"font": {"vadjust": -124.5}, "group": 7, "id": 236, "label": "Finances locales : S\u0026P Global...", "shape": "dot", "size": 83, "title": "Finances locales : S\u0026P Global Ratings attribue \u00e0 Casablanca la notation \u00ab BBB-/A-3 \u00bb avec perspective stable\nSource: lnt.ma", "url": "https://lnt.ma/finances-locales-sp-global-ratings-attribue-a-casablanca-la-notation-bbb-a-3-avec-perspective-stable/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le G\u00e9n\u00e9ral de Division Jawwad\nAhmed, nouveau Commandant de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le G\u00e9n\u00e9ral de Division Jawwad Ahmed, nouveau Commandant de la Force de la Mission des Nations Unies dans les provinces Sud du Royaume, a \u00e9t\u00e9 re\u00e7u, ce jeudi au si\u00e8ge de l\u2019Etat-Major de la Zone Sud \u00e0 Agadir, par le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud. [fr.hespress.com]\n-------------------------------------------------\nLors de cette rencontre, qui a \u00e9t\u00e9 l\u2019occasion pour \u00e9changer sur les activit\u00e9s de la Mission des Nations Unies dans les provinces Sud du Royaume, le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohamm. [lematin.ma]\n-------------------------------------------------\nLe g\u00e9n\u00e9ral de corps d\u2019arm\u00e9e Mohammed Berrid, inspecteur g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR) et commandant la zone sud a re\u00e7u, ce jeudi au si\u00e8ge de l\u2019\u00e9tat-major de la zone sud \u00e0 Agadir, le g\u00e9n\u00e9ral de division Jawwad Ahmed, nouveau commandant de la Force de la mission des Nations Unies dans les provinces sud du Royaume. [telquel.ma]\n-------------------------------------------------\nLe g\u00e9n\u00e9ral de division Jawwad Ahmed, fra\u00eechement nomm\u00e9 commandant de la force de la Mission des Nations unies pour lorganisation dun r\u00e9f\u00e9rendum au Sahara occidental (MINURSO), a \u00e9t\u00e9 re\u00e7u le jeudi 29 octobre au si\u00e8ge de la Zone Sud \u00e0 Agadir. [www.yabiladi.com]\n-------------------------------------------------\nLe G\u00e9n\u00e9ral de Division Jawwad Ahmed, nouveau Commandant de la Force de la Mission des Nations Unies dans les provinces Sud du Royaume, a \u00e9t\u00e9 re\u00e7u, ce jeudi au si\u00e8ge de l\u2019Etat-Major de la Zone Sud \u00e0 Agadir, par le G\u00e9n\u00e9ral de Corps d\u2019Arm\u00e9e, Mohammed Berrid, Inspecteur G\u00e9n\u00e9ral des FAR et Commandant la Zone Sud. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Roi Mohammed VI a\ntoujours fait de l\u2019Afrique une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le Roi au troisi\u00e8me Sommet Russie-Afrique. [fr.hespress.com]\n-------------------------------------------------\nLe roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la cheffe du gouvernement, Fatima Ezzahra El Mansouri, qui repr\u00e9sente le roi au troisi\u00e8me Sommet Russie-Afrique. [telquel.ma]\n-------------------------------------------------\nLe roi Mohammed VI a toujours plac\u00e9 lAfrique au c\u0153ur de la politique \u00e9trang\u00e8re marocaine, a d\u00e9clar\u00e9 jeudi 29 octobre la cheffe du gouvernement, Fatima Zahra El Mansouri, lors du troisi\u00e8me Sommet Russie-Afrique \u00e0 Moscou, o\u00f9 elle repr\u00e9sentait le souverain. [www.yabiladi.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a toujours fait de l\u2019Afrique une haute priorit\u00e9 de la politique \u00e9trang\u00e8re du Royaume du Maroc, a affirm\u00e9, jeudi \u00e0 Moscou, la Cheffe du gouvernement, Mme Fatima Ezzahra El Mansouri, qui repr\u00e9sente Sa Majest\u00e9 le Roi au troisi\u00e8me Sommet Russie-Afrique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Bourse de Casablanca pr\u00e9voit\nde lancer, dans les prochains...", "mass": 5, "physics": false, "shape": "box", "title": "La Bourse de Casablanca pr\u00e9voit de lancer, dans les prochains jours, deux nouveaux indices baptis\u00e9s \u00ab MASI Rentabilit\u00e9 Brut \u00bb et \u00ab MASI Rentabilit\u00e9 Net \u00bb. [lematin.ma]\n-------------------------------------------------\nLa Bourse de Casablanca a annonc\u00e9, mercredi, le lancement de deux nouveaux indices boursiers, le MASI.20 Rentabilit\u00e9 Brut et le MASI.20 Rentabilit\u00e9 Net, visant \u00e0 offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les dividendes, ces indicateurs doivent offrir aux investisseurs une lecture plus compl\u00e8te de la performance du march\u00e9. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Cette     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
