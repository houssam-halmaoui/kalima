exercice-des-droits-inalienables-du-peuple-palestinien-4/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 6, "id": 203, "label": "Casanet d\u00e9sign\u00e9e partenaire de l\u2019ann\u00e9e...", "shape": "dot", "size": 59, "title": "Casanet d\u00e9sign\u00e9e partenaire de l\u2019ann\u00e9e 2026 de Microsoft au Maroc\nSource: lnt.ma", "url": "https://lnt.ma/casanet-designee-partenaire-de-lannee-2026-de-microsoft-au-maroc/", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 9, "id": 212, "label": "BMCE Capital structure sa strat\u00e9gie...", "shape": "dot", "size": 47, "title": "BMCE Capital structure sa strat\u00e9gie de d\u00e9veloppement de l\u2019intelligence artificielle\nSource: lnt.ma", "url": "https://lnt.ma/bmce-capital-structure-sa-strategie-de-developpement-de-lintelligence-artificielle/", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 7, "id": 214, "label": "Palestine : SM le Roi...", "shape": "dot", "size": 71, "title": "Palestine : SM le Roi r\u00e9affirme l\u2019engagement du Maroc en faveur de la solution \u00e0 deux \u00c9tats\nSource: lnt.ma", "url": "https://lnt.ma/question-palestinienne-sm-le-roi-reaffirme-lengagement-du-maroc-en-faveur-de-la-solution-a-deux-etats/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a annonc\u00e9, ce mardi,...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9, ce mardi, qu\u2019elle respectait la d\u00e9cision du Tribunal arbitral du sport (TAS) confirmant le sacre de la s\u00e9lection s\u00e9n\u00e9galaise \u00e0 la Coupe d\u2019Afrique des nations 2025. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc, qui a \u00e9t\u00e9 d\u00e9chu mardi de son titre de champion d\u2019Afrique 2025 au profit du S\u00e9n\u00e9gal par le Tribunal arbitral du sport (TAS), a annonc\u00e9 vouloir \u201cengager l\u2019ensemble des voies de recours juridiques possibles\u201d contre cette d\u00e9cision. [telquel.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \u00ab \u00e0 l\u2019unanimit\u00e9 \u00bb le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u2019Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [telquel.ma]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9 qu\u2019elle \u00e9puiserait toutes les voies de recours pour contester la d\u00e9cision du Tribunal arbitral du sport (TAS), qui r\u00e9tablit le S\u00e9n\u00e9gal dans son titre de champion de la Coupe d\u2019Afrique des nations 2025. [www.yabiladi.com]\n-------------------------------------------------\nIl confirme la victoire du S\u00e9n\u00e9gal, annulant ainsi la d\u00e9cision du jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) qui avait attribu\u00e9 le titre au Maroc sur tapis vert, avec un score de 3-0. [www.yabiladi.com]\n-------------------------------------------------\nD\u00e9chu de son titre de champion d\u0027Afrique 2025 au profit du S\u00e9n\u00e9gal par le Tribunal arbitral du sport, le Maroc n\u0027entend pas en rester l\u00e0. [www.lavieeco.com]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a tranch\u00e9, ce mardi 24 novembre, le litige autour de la finale de la Coupe d\u2019Afrique des nations 2025. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \"\u00e0 l\u0027unanimit\u00e9\" le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u0027Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La mobilisation de l\u2019\u00e9pargne nationale\net son orientation vers le...", "mass": 5, "physics": false, "shape": "box", "title": "La mobilisation de l\u2019\u00e9pargne nationale et son orientation vers le financement des priorit\u00e9s strat\u00e9giques du Royaume passent par l\u2019\u00e9largissement et la modernisation de la collecte, le d\u00e9veloppement de l\u2019\u00e9pargne de long terme, le renforcement du r\u00f4le des investisseurs institutionnels et la mobilisation de financements au profit des territoires, a affirm\u00e9, mardi \u00e0 Rabat, le ministre . [fr.hespress.com]\n-------------------------------------------------\nPour financer les priorit\u00e9s strat\u00e9giques du Royaume, le ministre de l\u2019\u00c9conomie plaide pour une collecte modernis\u00e9e, le d\u00e9veloppement de l\u2019\u00e9pargne de long terme et une meilleure orientation des ressources vers l\u2019investissement et les territoires. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le ministre de l\u2019Int\u00e9rieur a\ntenu, mardi, une r\u00e9union avec...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur a tenu, mardi, une r\u00e9union avec les dirigeants et les responsables des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaires, dans le cadre des pr\u00e9paratifs en vue des \u00e9ch\u00e9ances \u00e9lectorales de 2027. [fr.hespress.com]\n-------------------------------------------------\nLe ministre de l\u2019Int\u00e9rieur a tenu, ce mardi 24 novembre, une r\u00e9union avec les dirigeants et responsables des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaire, consacr\u00e9e \u00e0 la pr\u00e9paration des \u00e9ch\u00e9ances \u00e9lectorales pr\u00e9vues en 2027. [telquel.ma]\n-------         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

            setTimeout(positionCommunityLabels, 50);
        });

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                scrollUp.className = 'scroll-up';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }

                }
            });
        });
