ats (ANEF), Abderrahim Houmy. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Sa Majest\u00e9 le Roi Mohammed\nVI, que Dieu L\u0027assiste, a...", "mass": 5, "physics": false, "shape": "box", "title": "Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u0027assiste, a adress\u00e9, mercredi soir, un Discours \u00e0 Son peuple fid\u00e8le \u00e0 l\u2019occasion du 27e anniversaire de l\u2019accession du Souverain au Tr\u00f4. [lematin.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un Discours \u00e0 la Nation \u00e0 l\u2019occasion du 27e anniversaire de son accession au Tr\u00f4ne, dans lequel le Souverain a [www.challenge.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI, a adress\u00e9, mercredi soir, un Discours \u00e0 Son peuple fid\u00e8le \u00e0 l\u2019occasion du 27e anniversaire de l\u2019accession du Souverain au Tr\u00f4ne de Ses Glorieux Anc\u00eatres. [www.lavieeco.com]\n-------------------------------------------------\nLe Roi Mohammed VI pr\u00e9sidera, jeudi et vendredi, \u00e0 l\u0027occasion de la comm\u00e9moration du 27e anniversaire de son accession au Tr\u00f4ne, les c\u00e9r\u00e9monies comm\u00e9morant la F\u00eate du Tr\u00f4ne, annonce le Minist\u00e8re de la Maison Royale, du Protocole et de la Chancellerie dans un communiqu\u00e9. [leseco.ma]\n-------------------------------------------------\nLe minist\u00e8re de la Maison Royale a annonc\u00e9 le programme des c\u00e9r\u00e9monies pr\u00e9sid\u00e9es par le Roi Mohammed VI \u00e0 M\u0027diq et T\u00e9touan \u00e0 l\u0027occasion du 27e anniversaire de son accession au Tr\u00f4ne. [atlasinfo.fr]\n-------------------------------------------------\n\u00c0 l\u2019occasion du 27\u1d49 anniversaire de son accession au Tr\u00f4ne, Sa Majest\u00e9 le Roi Mohammed VI a dress\u00e9 un bilan des avanc\u00e9es \u00e9conomiques, industrielles et sociales du Royaume, tout en appelant \u00e0 poursuivre les r\u00e9formes engag\u00e9es. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Voici le texte du communiqu\u00e9\n:A l\u0027occasion de la F\u00eate...", "mass": 5, "physics": false, "shape": "box", "title": "Voici le texte du communiqu\u00e9 :A l\u0027occasion de la F\u00eate du Tr\u00f4ne de cette ann\u00e9e 1448 H- 2026 G, Sa Majest\u00e9 le Roi Mohammed VI, que Dieu perp\u00e9tue Sa gloire, a bien voulu acc. [lematin.ma]\n-------------------------------------------------\nA l\u2019occasion de la F\u00eate du Tr\u00f4ne, le roi Mohammed VI, accord\u00e9 sa gr\u00e2ce \u00e0 1.788 personnes, dont certaines sont en d\u00e9tention et d\u2019autres en libert\u00e9, condamn\u00e9es par diff\u00e9rents tribunaux du Royaume, indique un communiqu\u00e9 du minist\u00e8re de la Justice. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc consid\u00e8re ces attaques\ncomme une violation flagrante de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc consid\u00e8re ces attaques comme une violation flagrante de la souverainet\u00e9 du Royaume d\u0027Arabie Saoudite, une atteinte grave \u00e0 sa s\u00e9curit\u00e9 nationale et une menace in. [lematin.ma]\n-------------------------------------------------\nLe Royaume du Maroc condamne, dans les termes les plus fermes, les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res au Royaume d\u2019Arabie Saoudite fr\u00e8re, indique mercredi le minist\u00e8re des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger. [telquel.ma]\n-------------------------------------------------\nLe Maroc a condamn\u00e9 avec fermet\u00e9 les attaques de drones ayant cibl\u00e9 des installations p\u00e9troli\u00e8res en Arabie saoudite, r\u00e9affirmant sa pleine solidarit\u00e9 avec Riyad et son soutien aux mesures prises pour pr\u00e9server sa souverainet\u00e9 et sa s\u00e9curit\u00e9. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Groupe BCP et Seniors\nPlus ont conclu un partenariat...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe BCP et Seniors Plus ont conclu un partenariat pour le lancement de Bladi Tiqqa, une offre de services destin\u00e9e aux Marocains du Monde et con\u00e7ue pour r\u00e9pondre. [lematin.ma]\n-------------------------------------------------\nLe Groupe Banque Centrale Populaire (BCP) et Seniors Plus ont conclu un partenariat strat\u00e9gique pour lancer \u00ab Bladi Tiqqa \u00bb, une offre de services destin\u00e9e aux Marocains du Monde (MDM) souhaitant accompagner leurs proches \u00e2g\u00e9s de 60 ans et plus vivant au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Infobip, plateforme mondiale de communication\ncloud, et Orange Maroc annoncent...", "mass": 5, "physics": false, "shape": "box", "title": "Infobip, plateforme mondiale de communication cloud, et Orange Maroc annoncent le renforcement de leur partenariat autour de Smart Message Plus, une nouvelle version de l\u2019offre Smart Message de [www.challenge.ma]\n-------------------------------------------------\nOrange Maroc et Infobip, plateforme sp\u00e9cialis\u00e9e dans les communications cloud, annoncent le renforcement de leur partenariat avec le lancement de Smart Message Plus, une nouvelle version de l\u2019offre Smart Message d\u2019Orange Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u0027Autori         function positionCommunityLabels() {

            var communities = {};

                    continue;

                    communities[groupId].y += node.y;
