group": 8, "id": "comm_label_8", "label": "Organis\u00e9e par l\u0027Union africaine des\norganisations des transports et de...", "mass": 5, "physics": false, "shape": "box", "title": "Organis\u00e9e par l\u0027Union africaine des organisations des transports et de la logistique (UAOTL), en partenariat avec plusieurs institutions nationales et africaines, cette \u00e9dition. [lematin.ma]\n-------------------------------------------------\nOrganis\u00e9e par l\u2019Union africaine des organisations des transports et de la logistique (UAOTL), en partenariat avec la F\u00e9d\u00e9ration nationale du transport multimodal (FNTM) et l\u2019Association marocaine du transport routier . [aujourdhui.ma]\n-------------------------------------------------\nCet \u00e9v\u00e9nement ambitionne de confirmer le positionnement du Maroc comme plateforme africaine de coop\u00e9ration dans les secteurs du transport, des infrastructures et de la logistique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La campagne Marocains Citoyens du\nMonde 2026 in\u00e9dit et continu...", "mass": 5, "physics": false, "shape": "box", "title": "La campagne Marocains Citoyens du Monde 2026 in\u00e9dit et continu d\u00e9bute dans les pays de r\u00e9sidence, avant m\u00eame le d\u00e9part vers le Maroc \u00e0 travers notamment une plateforme d\u0027Entr\u00e9e. [lematin.ma]\n-------------------------------------------------\nBANK OF AFRICA d\u00e9ploie sa campagne 2026 d\u00e9di\u00e9e aux Marocains Citoyens du Monde (MCM), autour du message identitaire \u00abPartout, le Maroc est en nous\u00bb. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le rapport annuel 2025, pr\u00e9sent\u00e9\nlundi par le wali de...", "mass": 5, "physics": false, "shape": "box", "title": "Le rapport annuel 2025, pr\u00e9sent\u00e         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
