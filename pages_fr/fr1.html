ed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Une enveloppe globale de 1,3\nmilliard de dirhams (MMDH) sera...", "mass": 5, "physics": false, "shape": "box", "title": "Une enveloppe globale de 1,3 milliard de dirhams (MMDH) sera consacr\u00e9e au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me startup marocain dans le cadre de la strat\u00e9gie Maroc Digital 2030, a annonc\u00e9, vendredi \u00e0 Casablanca, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fallah Seghrouchni. [fr.hespress.com]\n-------------------------------------------------\nUne enveloppe globale de 1,3 milliard de dirhams (MMDH) sera consacr\u00e9e au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me startup marocain dans le cadre de la strat\u00e9gie Maroc Digital 2030, a annonc\u00e9, vendredi \u00e0 Casablanca, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fallah Seghrouchni. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Dans le cadre de la\nmise en \u0153uvre des Hautes...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la mise en \u0153uvre des Hautes Orientations Royales relatives au lancement d\u2019une nouvelle g\u00e9n\u00e9ration de Programmes de d\u00e9veloppement territorial Int\u00e9gr\u00e9 (PDTI), une r\u00e9union sous la pr\u00e9sidence du ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, a \u00e9t\u00e9 tenue, vendredi \u00e0 Rabat, avec les pr\u00e9sidents des 12 R\u00e9gions du Royaume. [fr.hespress.com]\n-------------------------------------------------\nDans le cadre de la mise en \u0153uvre des Hautes Orientations Royales relatives au lancement d\u2019une nouvelle g\u00e9n\u00e9ration de Programmes de d\u00e9veloppement territorial Int\u00e9gr\u00e9 (PDTI), une r\u00e9. [lematin.ma]\n-------------------------------------------------\nCette r\u00e9union a pour objectif d\u2019\u00e9largir et d\u2019approfondir le r\u00f4le des collectivit\u00e9s territoriales dans le processus d\u2019\u00e9laboration et de mise en \u0153uvre de la nouvelle g\u00e9n\u00e9ration de Programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 (PDTI). [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les Emirats Arabes Unis se\nsont qualifi\u00e9s pour les demi-finales...", "mass": 5, "physics": false, "shape": "box", "title": "Les Emirats Arabes Unis se sont qualifi\u00e9s pour les demi-finales de la Coupe arabe apr\u00e8s sa victoire, ce vendredi, face \u00e0 l\u2019Alg\u00e9rie aux tirs au but (1-1 ; 5 tab \u00e0 4). [fr.hespress.com]\n-------------------------------------------------\nA l\u2019issue d\u2019une rencontre tr\u00e8s disput\u00e9e, vendredi en soir\u00e9e pour le compte des quarts de finale, la s\u00e9lection nationale des UAE a r\u00e9ussi \u00e0 composter son billet pour le carr\u00e9 final,. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec\nles cinq centrales syndicales repr\u00e9sent\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec les cinq centrales syndicales repr\u00e9sent\u00e9es au sein de Marsa Maroc, \u00e0 savoir l\u2019UMT, l\u2019ODT, la CDT, la FDT et l\u2019UGTM. [lematin.ma]\n-------------------------------------------------\nL\u2019accord a \u00e9t\u00e9 obtenu apr\u00e8s plusieurs rounds de n\u00e9gociation men\u00e9s dans un esprit de transparence, d\u2019\u00e9coute mutuelle et de responsabilit\u00e9 partag\u00e9e. [telquel.ma]\n-------------------------------------------------\nMarsa Maroc et les syndicats repr\u00e9sentant le personnel, UMT, ODT, CDT, FDT et UGTM, ont scell\u00e9 un accord social valable pour cinq ans, jusqu\u2019\u00e0 la fin de l\u2019ann\u00e9e 2030. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u2019ouverture de StartGate Rabat marque\nune nouvelle \u00e9tape dans le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ouverture de StartGate Rabat marque une nouvelle \u00e9tape dans le d\u00e9ploiement du dispositif entrepreneurial de l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P). [lematin.ma]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique a inaugur\u00e9, jeudi \u00e0 Rabat, \"StatGate Rabat\", un nouveau Startup campus d\u00e9di\u00e9 aux startups et au venture building, en extension aux activit\u00e9s de StartGate de Benguerir, lanc\u00e9 il y a cinq ans. [leseco.ma]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) a inaugur\u00e9, jeudi 11 d\u00e9cembre, StartGate Rabat, un nouveau Startup campus d\u00e9di\u00e9 aux startups et au venture building, en extension aux activit\u00e9s de [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Maroc et la Banque\neurop\u00e9enne pour la reconstruction et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u0027euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \"Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III\". [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (1.5 milliards de dirhams), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande\ndu Roadshow \u00ab Morocco Now...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande du Roadshow \u00ab Morocco Now \u00bb, des responsables institutionnels et \u00e9conomiques marocains et allemands se sont r\u00e9unis \u00e0 Stuttgart pour mettre en lumi\u00e8re les fondements et les perspectives du partenariat strat\u00e9gique entre les deux pays. [telquel.ma]\n-------------------------------------------------\nPlusieurs institutionnels et op\u00e9rateurs \u00e9conomiques, allemands et marocains, ont pris part, jeudi soir \u00e0 Stuttgart, dans le Bade-Wurtemberg (sud-ouest), \u00e0 la conf\u00e9rence organis\u00e9e dans le cadre de l\u2019\u00e9tape Allemagne du Roadshow \u201cMorocco Now\u201d, destin\u00e9e \u00e0 promouvoir les atouts comp\u00e9titifs du Maroc, son offre industrielle et les perspectives d\u2019investissement que le Royaume propose dans plusieurs secteurs strat\u00e9giques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Des chutes de neige \u00e0\npartir de 1.700 m\u00e8tres ainsi...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM), a annonc\u00e9 des chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, attendues, de samedi \u00e0 dimanche, dans plusieurs provinces du Royaume. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "CAN 2025 : \u201cJe me\nsuis bas\u00e9 sur des crit\u00e8res...", "mass": 5, "physics": false, "shape": "box", "title": "CAN 2025 : \u201cJe me suis bas\u00e9 sur des crit\u00e8res objectifs dans le choix des joueurs\u201d, assure Regragui. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a affirm\u00e9 que le choix des joueurs de l\u2019\u00e9quipe nationale qui prendront part \u00e0 la Coupe d\u2019Afrique des Nations (CAN) au Maroc est bas\u00e9 sur des crit\u00e8res objectifs. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Conseil d\u2019administration du Group <div id="tooltip">Carte générée par intelligence artificielle le 13/12/2025 à 12h25, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 18h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
