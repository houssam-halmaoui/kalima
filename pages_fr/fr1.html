color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "\u00c9nergie solaire : OCP met\nsous tension le premier syst\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c9nergie solaire : OCP met sous tension le premier syst\u00e8me de stockage par batteries \u00e0 grande \u00e9chelle au Maroc. [lematin.ma]\n-------------------------------------------------\nLe Groupe OCP a annonc\u00e9, lundi, que sa filiale d\u00e9di\u00e9e \u00e0 la production et au stockage d\u2019\u00e9lectricit\u00e9 issue de sources renouvelables, OCP Green Energy, a franchi un cap majeur avec l\u2019installation de son premier syst\u00e8me de stockage d\u2019\u00e9nergie par batteries (Battery Energy Storage System \u2013 Phase I BESS) sur le site minier de Benguerir. [telquel.ma]\n-------------------------------------------------\nOCP Green Energy, filiale du Groupe OCP d\u00e9di\u00e9e a\u0300 la production et au stockage d\u2019\u00e9lectricit\u00e9 issue de sources renouvelables, franchit un cap majeur avec l\u2019installation de son premier syst\u00e8me de stockage d\u2019\u00e9nergie par batteries (Battery Energy Storage System \u2013 Phase . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Bank Of Africa lance, en\npartenariat avec Mastercard, la deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Of Africa lance, en partenariat avec Mastercard, la deuxi\u00e8me \u00e9dition de son programme \u00ab Elevator Pitch by BANK OF AFRICA \u00bb, destin\u00e9 \u00e0 la d\u00e9tection et \u00e0 l\u2019accompagnement de por. [lematin.ma]\n-------------------------------------------------\nFort du succ\u00e8s rencontr\u00e9 lors de sa premi\u00e8re \u00e9dition, BANK OF AFRICA, en partenariat avec Mastercard, lance la deuxi\u00e8me \u00e9dition de son programme \u00ab Elevator Pitch by BANK OF AFRICA \u00bb, une initiative d\u00e9di\u00e9 aSanad Assurance ont organis\u00e9, le 10 septembre \u00e0 Casablanca, une rencontre-d\u00e9bat d\u00e9di\u00e9e aux dirigeants de PME, autour d\u2019un enjeu cl\u00e9 : attirer, fid\u00e9liser et prot\u00e9ger les talents. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La situation des charges et\nressources du Tr\u00e9sor d\u00e9gage un...", "mass": 5, "physics": false, "shape": "box", "title": "La situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 56,9 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre un d\u00e9ficit budg\u00e9taire de 54,1 MMDH durant la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nLa situation des charges et ressources du Tr\u00e9sor d\u00e9gage un d\u00e9ficit budg\u00e9taire de 56,9 milliards de dirhams (MMDH) \u00e0 fin ao\u00fbt 2026, contre un d\u00e9ficit budg\u00e9taire de 54,1 MMDH durant la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Mohamed Ouahbi, s\u00e9lectionneur de l\u2019\u00e9quipe\nnationale marocaine, tiendra jeudi prochain...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Ouahbi, s\u00e9lectionneur de l\u2019\u00e9quipe nationale marocaine, tiendra jeudi prochain une conf\u00e9rence de presse au Complexe Mohammed VI de football afin de d\u00e9voiler la liste d\u00e9finitive des joueurs retenus pour affronter le Gabon et le Lesotho, dans le cadre des \u00e9liminatoires de la Coupe d\u2019Afrique des nations 2027. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur de l\u2019\u00e9quipe nationale, Mohamed Ouahbi, tiendra une conf\u00e9rence de presse, jeudi p         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {

                    Array.from(mutation.addedNodes).forEach(function(node) {
