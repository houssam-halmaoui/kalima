 international pour le suivi des acquis des \u00e9l\u00e8ves (PISA), publi\u00e9e mardi 8 septembre, livre un diagnostic clinique pour le Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "WMCT, filiale de Marsa Maroc\net de TIL, a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "WMCT, filiale de Marsa Maroc et de TIL, a annonc\u00e9 avoir men\u00e9 avec succ\u00e8s les essais op\u00e9rati. [lematin.ma]\n-------------------------------------------------\nWest Med Container Terminal (WMCT), filiale de Marsa Maroc et de TIL et concessionnaire du Terminal Est du port Nador West Med, a annonc\u00e9 l\u2019ach\u00e8vement de la pr\u00e9paration op\u00e9rationnelle de son terminal, \u00e0 l\u2019issue d\u2019essais concluants. [telquel.ma]\n-------------------------------------------------\nWest Med Container Terminal (WMCT), filiale de Marsa Maroc et de TIL et concessionnaire du Terminal Est du port Nador West Med, a annonc\u00e9, ce jeudi, l\u0027ach\u00e8vement de la pr\u00e9paration op\u00e9rationnelle du terminal et confirme sa capacit\u00e9 \u00e0 accueillir et traiter ses premi\u00e8res escales commerciales. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les marques locales restent solidement\ninstall\u00e9es dans les habitudes d\u2019achat...", "mass": 5, "physics": false, "shape": "box", "title": "Les marques locales restent solidement install\u00e9es dans les habitudes d\u2019achat des m\u00e9nages marocains. [lematin.ma]\n-------------------------------------------------\nLes consommateurs marocains continuent d\u2019afficher une nette pr\u00e9f\u00e9rence pour les marques locales, selon la derni\u00e8re \u00e9dition de l\u2019\u00e9tude Brand Footprint 2026 de Worldpanel by Numerator. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 l\u2019issue de la grande\nfinale organis\u00e9e mardi \u00e0 Casablanca,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019issue de la grande finale organis\u00e9e mardi \u00e0 Casablanca, Oussama Bensghir a d\u00e9croch\u00e9 le premier prix, devant Younes E. [lematin.ma]\n-------------------------------------------------\nLa grande finale de \u00ab The Next Ad \u00bb, organis\u00e9e \u00e0 Casablanca, a d\u00e9sign\u00e9 les trois laur\u00e9ats du concours national lanc\u00e9 par inwi au d\u00e9but de l\u2019\u00e9t\u00e9 pour [www.challenge.ma]\n-------------------------------------------------\nOussama Bensghir, Youness El Mendery et Elkaouid Rayan ont remport\u00e9 respectivement les premier, deuxi\u00e8me et troisi\u00e8me prix de la premi\u00e8re \u00e9dition de l\u2019initiative \u00abThe Next Ad\u00bb, organis\u00e9e par Inwi \u00e0 Casablanca. [www.lavieeco.com]\n-------------------------------------------------\nOussama Bensghir, Younes El Mendery et Rayan El Kaouid ont remport\u00e9 la premi\u00e8re \u00e9dition de \u00ab The Next Ad \u00bb, un concours national lanc\u00e9 par inwi pour associer de jeunes cr\u00e9ateurs marocains \u00e0 ses futurs projets publicitaires. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le roi Mohammed VI a\nadress\u00e9 un message de solidarit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le roi Mohammed VI a adress\u00e9 un message de solidarit\u00e9 au souverain jordanien Abdallah II, condamnant fermement les attaques de missiles iraniennes contre la Jordanie et r\u00e9affirmant le soutien \u00ab ind\u00e9fectible et inconditionnel \u00bb du Maroc au royaume hach\u00e9mite. [telquel.ma]\n-------------------------------------------------\nLe roi Mohammed VI a adress\u00e9 un message     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
