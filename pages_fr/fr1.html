2019une d\u00e9l\u00e9gation. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Devant les trois centrales syndicales\nles plus repr\u00e9sentatives, la Cheffe...", "mass": 5, "physics": false, "shape": "box", "title": "Devant les trois centrales syndicales les plus repr\u00e9sentatives, la Cheffe du gouvernement a r\u00e9affirm\u00e9 l\u2019engagement de l\u2019Ex\u00e9cutif \u00e0 mettre en \u0153uvre les accords conclus avec les partenaires sociaux. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u0027issue des rencontres avec la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, les pr\u00e9sidents des deux Conf\u00e9d\u00e9rations ont soulign\u00e9, mercredi \u00e0 Rabat, que l\u0027appui au secteur priv\u00e9 est un levier pour l\u0027investissement et l\u0027exportation. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a affirm\u00e9, jeudi \u00e0 Rabat, que les premi\u00e8res rencontres de concertation tenues par le gouvernement avec les centrales syndicales les plus repr\u00e9sentatives et les organisations professionnelles t\u00e9moignent de l\u0027ouverture de l\u0027Ex\u00e9cutif et de son souci d\u0027\u00eatre \u00e0 l\u0027\u00e9coute des diff\u00e9rents partenaires sociaux et professionnels. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Son IPO avait \u00e9t\u00e9 souscrite\npr\u00e8s de sept fois par...", "mass": 5, "physics": false, "shape": "box", "title": "Son IPO avait \u00e9t\u00e9 souscrite pr\u00e8s de sept fois par 44.378 investisseurs, pour 15,29 milliards de dirhams demand\u00e9s. [telquel.ma]\n-------------------------------------------------\nMercredi 25 novembre, la Bourse de Casablanca a accueilli la premi\u00e8re cotation du groupe pharmaceuti         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({

                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
