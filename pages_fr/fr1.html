: "La 5e \u00e9dition du cycle de formation des observateurs \u00e9lectoraux de l\u2019Union africaine, s\u2019est ouverte ce lundi \u00e0 Rabat, un programme devenu en quelques ann\u00e9es une r\u00e9f\u00e9rence continentale en mati\u00e8re de gouvernance d\u00e9mocratique. [fr.hespress.com]\n-------------------------------------------------\nLa cr\u00e9dibilit\u00e9 d\u2019un processus \u00e9lectoral ne peut \u00eatre pleinement garantie si elle exclut une partie de la population, a affirm\u00e9, lundi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita. [telquel.ma]\n-------------------------------------------------\nLa cr\u00e9dibilit\u00e9 d\u2019un processus \u00e9lectoral ne peut \u00eatre pleinement garantie si elle exclut une partie de la population, a affirm\u00e9, lundi \u00e0 Rabat, le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Il a avanc\u00e9 cette r\u00e9union\nd\u2019un jour dans le cadre...", "mass": 5, "physics": false, "shape": "box", "title": "Il a avanc\u00e9 cette r\u00e9union d\u2019un jour dans le cadre de la mise \u00e0 jour de son programme mensuel sous la pr\u00e9sidence rotative du Royaume de Bahre\u00efn. [fr.hespress.com]\n-------------------------------------------------\nLa r\u00e9union \u00e0 huis clos du Conseil de s\u00e9curit\u00e9 de l\u2019ONU, initialement pr\u00e9vue le 24 avril et consacr\u00e9e \u00e0 la question du Sahara occidental, a \u00e9t\u00e9 avanc\u00e9e de vingt-quatre heures, selon le nouveau programme pr\u00e9visionnel communiqu\u00e9 par la pr\u00e9sidence tournante de l\u2019instance, assur\u00e9e ce mois-ci par Bahre\u00efn. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Intervenant lors de l\u0027\u00abArab Conference\nat Harvard\u00bb, samedi \u00e0 Boston,...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors de l\u0027\u00abArab Conference at Harvard\u00bb, samedi \u00e0 Boston, M. Amrani a relev\u00e9 que pr\u00e8s de 250 ans de partenariat ininterrompu avaient d\u00e9finitivement \u00e9tabli la solidit. [lematin.ma]\n-------------------------------------------------\nA Harvard, Youssef Amrani plaide pour une mont\u00e9e en puissance du partenariat maroco-am\u00e9ricain. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les r\u00e9sultats de l\u2019enqu\u00eate permanente\nde conjoncture men\u00e9e par le...", "mass": 5, "physics": false, "shape": "box", "title": "Les r\u00e9sultats de l\u2019enqu\u00eate permanente de conjoncture men\u00e9e par le Haut-Commissariat au Plan (HCP) indiquent une am\u00e9lioration notable de la confiance des m\u00e9nages au premier trimestr. [lematin.ma]\n-------------------------------------------------\nL\u2019indice de confiance des m\u00e9nages (ICM) s\u2019est \u00e9tabli \u00e0 64,4 points au premier trimestre de 2026, contre 46,6 points au m\u00eame trimestre de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nLes r\u00e9sultats de l\u0027enqu\u00eate permanente de conjoncture aupr\u00e8s des m\u00e9nages, men\u00e9e par le HCP, montrent qu\u0027au premier trimestre de 2026, l\u0027Indice de confiance des m\u00e9nages (ICM) enregistre une am\u00e9lioration, aussi bien par rapport au trimestre pr\u00e9c\u00e9dent que par rapport au m\u00eame trimestre de l\u0027ann\u00e9e 2025. [www.lavieeco.com]\n-------------------------------------     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
