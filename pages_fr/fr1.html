0 0, en match de la premi\u00e8re journ\u00e9e du groupe F de la Coupe d\u2019Afrique des Nations (CAN Maroc-2025). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les Forces arm\u00e9es royales ont\nre\u00e7u la premi\u00e8re livraison de...", "mass": 5, "physics": false, "shape": "box", "title": "Les Forces arm\u00e9es royales ont re\u00e7u la premi\u00e8re livraison de blind\u00e9s \u00e0 roues (WhAP 8\u00d78), fabriqu\u00e9s au sein de l\u2019unit\u00e9 industrielle de la soci\u00e9t\u00e9 indienne Tata Advanced Systems Ltd situ\u00e9e \u00e0 Berrechid, dans la r\u00e9gion Casablanca-Settat, selon une publication de l\u2019entreprise sur son compte officiel sur la plateforme X. [fr.hespress.com]\n-------------------------------------------------\nLe premier lot de v\u00e9hicules blind\u00e9s WhAP 8\u00d78 a \u00e9t\u00e9 officiellement remis aux Forces arm\u00e9es royales, a annonc\u00e9 Tata Advanced Systems Limited (TASL) dans un message publi\u00e9 sur le r\u00e9seau X. Une livraison pr\u00e9sent\u00e9e comme un \u00ab jalon \u00bb, symbole d\u2019un. [telquel.ma]\n-------------------------------------------------\nTata Advanced Systems Limited (TASL) vient de confirmer la livraison du premier lot de ses v\u00e9hicules blind\u00e9s WhAP 8\u00d78 aux Forces arm\u00e9es royales (FAR). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Une convention de partenariat entre\nle Conseil Sup\u00e9rieur du Pouvoir...", "mass": 5, "physics": false, "shape": "box", "title": "Une convention de partenariat entre le Conseil Sup\u00e9rieur du Pouvoir Judiciaire (CSPJ), la Pr\u00e9sidence du Minist\u00e8re public et la Commission du droit d\u2019acc\u00e8s \u00e0 l\u2019information (CDAI) a \u00e9t\u00e9 sign\u00e9e, mercredi \u00e0 Rabat, en vue de leur adh\u00e9sion au Portail national du droit d\u2019acc\u00e8s \u00e0 l\u2019information. [fr.hespress.com]\n-------------------------------------------------\nCette convention a \u00e9t\u00e9 paraph\u00e9e par le Premier pr\u00e9sident de la Cour de cassation, pr\u00e9sident d\u00e9l\u00e9gu\u00e9 du CSPJ, Mohamed Abdennabaoui, le Procureur g\u00e9n\u00e9ral du Roi pr\u00e8s la Cour de Cassa. [lematin.ma]\n-------------------------------------------------\nDeux conventions de partenariat relatives \u00e0 l\u2019adh\u00e9sion du Conseil sup\u00e9rieur du pouvoir judiciaire (CSPJ) et de la Pr\u00e9sidence du Minist\u00e8re public au Portail national du droit d\u2019acc\u00e8s \u00e0 l\u2019information (PNDAI) ont \u00e9t\u00e9 sign\u00e9es, mercredi \u00e0 Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Chambre des conseillers a\nadopt\u00e9 \u00e0 l\u2019unanimit\u00e9 le projet...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9 le projet de loi 26.25 portant r\u00e9organisation du Conseil national de la presse, lors d\u2019une s\u00e9ance l\u00e9gislative marqu\u00e9e par le retra. [lematin.ma]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9, lors d\u0027une s\u00e9ance l\u00e9gislative tenue mercredi, le projet de loi N\u00b0 26.25 portant r\u00e9organisation du Conseil national de la presse, apr\u00e8s le retrait de l\u0027opposition. [www.lavieeco.com]\n-------------------------------------------------\nLa Chambre des conseillers a adopt\u00e9 \u00e0 l\u2019unanimit\u00e9, mercredi, le projet de loi n\u00b0 26.25 portant r\u00e9organisation du Conseil national de la presse, lors d\u2019une s\u00e9ance l\u00e9gislative marqu\u00e9e par le retrait des groupes de l\u2019opposition. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019\u00e9quipe du Maroc poursuit ses\npr\u00e9paratifs pour le choc de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe du Maroc poursuit ses pr\u00e9paratifs pour le choc de la deuxi\u00e8me journ\u00e9e du groupe A de la CAN 2025, qui l\u2019opposera au Mali ce vendredi \u00e0 21 h au Complexe Moulay Abdellah de. [lematin.ma]\n-------------------------------------------------\nCe vendredi, les Lions de lAtlas croiseront le fer avec le Mali pour leur deuxi\u00e8me match du Groupe A de la Coupe dAfrique des Nations 2025, qui se d\u00e9roulera au Stade Prince Moulay Abdellah \u00e0 Rabat. [www.yabiladi.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football affrontera son homologue malienne, vendredi au Stade Prince Moulay Abdellah \u00e0 Rabat (21h00), lors de la 2\u00e8 journ\u00e9e (groupe A) de la Coupe d\u2019Afrique des Nations (CAN) avec pour principal objectif de l\u2019emporter et se hisser en huiti\u00e8mes de finale. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "R\u00e9uni \u00e0 Rabat sous la\npr\u00e9sidence de la ministre de...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni \u00e0 Rabat sous la pr\u00e9sidence de la ministre de l\u2019\u00c9conomie et des Finances, Nadia Fettah, le Conseil d\u2019administration de l\u2019Agence pour l\u2019Am\u00e9nagement du Site de la Lagune de Marc. [lematin.ma]\n-------------------------------------------------\nCette rencontre s\u2019inscrit dans un contexte marqu\u00e9 par la volont\u00e9 d\u2019insuffler une nouvelle dynamique au projet strat\u00e9gique Marchica lanc\u00e9 par le roi Mohammed VI. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label     }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
