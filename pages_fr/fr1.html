 true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019Office national des chemins de\nfer (ONCF) a retenu la...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national des chemins de fer (ONCF) a retenu la soci\u00e9t\u00e9 Gidna pour construire les neuf nouvelles gares du futur r\u00e9seau express r\u00e9gional (RER) de Casablanca. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des chemins de fer a attribu\u00e9 \u00e0 Gidna SARL les deux lots de construction des neuf gares du r\u00e9seau express r\u00e9gional du Grand Casablanca, pour un montant total de 470,72 millions de dirhams hors taxes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Suite au communiqu\u00e9 du Rassemblement\nnational des ind\u00e9pendants (RNI), d\u00e9non\u00e7ant...", "mass": 5, "physics": false, "shape": "box", "title": "Suite au communiqu\u00e9 du Rassemblement national des ind\u00e9pendants (RNI), d\u00e9non\u00e7ant des \"pressions\" et des tentatives de ralliement visant plusieurs de ses \u00e9lus au profit du Parti authenticit\u00e9 et modernit\u00e9 (PAM), le d\u00e9put\u00e9 de la province de Midelt, Marouane Chbaatou, sort du silence pour expliquer les raisons de son d\u00e9part. [leseco.ma]\n-------------------------------------------------\nMembre du bureau politique du RNI et d\u00e9put\u00e9 sortant de Midelt, Marouane Chbaatou a annonc\u00e9 son ralliement au Parti authenticit\u00e9 et modernit\u00e9, provoquant une riposte publique du RNI qui accuse le PAM de \"pressions\" sur ses \u00e9lus. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La deuxi\u00e8me \u00e9dition du Festival\ndes \u00ab Andalousies de la...", "mass": 5, "physics": false, "shape": "box", "ti         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        });

            setTimeout(positionCommunityLabels, 50);
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';

                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
