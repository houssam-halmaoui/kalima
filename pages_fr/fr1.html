 Gouvernement charg\u00e9 de lAdministration de la D\u00e9fense nationale, a accueilli lundi M. Amir Baram, Directeur G\u00e9n\u00e9ral du minist\u00e8re de la d\u00e9fense isra\u00e9lien, lors de sa visite officielle au Maroc. [www.yabiladi.com]\n-------------------------------------------------\nCette rencontre, tenue sur Hautes Instructions Royales, s\u2019inscrit dans le cadre de la visite officielle au Maroc du responsable isra\u00e9lien, accompagn\u00e9 d\u2019une importante d\u00e9l\u00e9gation. [maroc-diplomatique.net]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, M. Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, a re\u00e7u lundi, au si\u00e8ge de cette Administration, M. Amir Baram, Directeur G\u00e9n\u00e9ral du minist\u00e8re de d\u00e9fense isra\u00e9lien, en visite officielle au Maroc \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le groupe Addoha annonce avoir\nobtenu l\u2019agr\u00e9ment de la National...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Addoha annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC), lui permettant de participer en qualit\u00e9 de d\u00e9veloppeur partenaire \u00e0 des projets immobiliers r. [lematin.ma]\n-------------------------------------------------\nLe Groupe Addoha annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC) pour participer, en tant que d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels dans le Royaume d\u2019Arabie Saoudite. [telquel.ma]\n-------------------------------------------------\nLe groupe Addoha a obtenu l\u0027agr\u00e9ment de la National Housing Company (NHC) pour participer, en qualit\u00e9 de d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels en Arabie saoudite. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019athl\u00e8te marocaine Maria Saadi a\nremport\u00e9, lundi, la m\u00e9daille d\u2019argent...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019athl\u00e8te marocaine Maria Saadi a remport\u00e9, lundi, la m\u00e9daille d\u2019argent du concours f\u00e9minin de saut en longueur des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, offrant au Maroc une nouvelle distinction dans cette comp\u00e9tition. [telquel.ma]\n-------------------------------------------------\nL athl\u00e8te marocaine, Maria Saadi, a d\u00e9croch\u00e9 lundi \u00e0 Dakar la m\u00e9daille d\u2019argent en saut en longueur f\u00e9minin lors des Jeux olympiques de la jeunesse Dakar 2026, offrant ainsi une deuxi\u00e8me m\u00e9daille \u00e0 la d\u00e9l\u00e9gation marocaine, selon la MAP. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Du 3 au 6 d\u00e9cembre\n2026, le Festival Zamane revient...", "mass": 5, "physics": false, "shape": "box", "title": "Du 3 au 6 d\u00e9cembre 2026, le Festival Zamane revient \u00e0 M\u2019hamid El Ghizlane, aux portes du Sahara et au c\u0153ur de la vall\u00e9e du Dr\u00e2a, pour une cinqui\u00e8me \u00e9dition plac\u00e9e sous le th\u00e8me \u00ab Le Chant Ahidous \u00bb. [telquel.ma]\n-------------------------------------------------\nElle r\u00e9unira des artistes reconnus de diff\u00e9rentes sc\u00e8nes musicales, dans un dialogue entre h\u00e9ritages traditionnels et expressions contemporaines. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La ville de Casablanca accueillera,\ndu 21 au         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
