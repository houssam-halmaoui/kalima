 {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Dans un communiqu\u00e9, le club\ncasablancais informe l\u2019ensemble de ses...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un communiqu\u00e9, le club casablancais informe l\u2019ensemble de ses supporters et composantes qu\u2019il a \u00e9t\u00e9 d\u00e9cid\u00e9 de mettre fin \u00e0 la mission de Benhachem en tant qu\u2019entra\u00eeneur de l\u2019\u00e9quipe premi\u00e8re, dans un cadre consensuel. [telquel.ma]\n-------------------------------------------------\nLe Wydad de Casablanca a annonc\u00e9, lundi, sa s\u00e9paration \u00e0 l\u2019amiable avec son entra\u00eeneur, Mohamed Amine Benhachem. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019\u00e9conomie marocaine continue de faire\npreuve d\u2019une \u00ab grande r\u00e9silience...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9conomie marocaine continue de faire preuve d\u2019une \u00ab grande r\u00e9silience \u00bb, alors que la dynamique de croissance devrait rester forte en 2026 et \u00e0 moyen terme, port\u00e9e par les investissements publics et priv\u00e9s dans les infrastructures, estime le Fonds mon\u00e9taire international (FMI). [telquel.ma]\n-------------------------------------------------\nL\u00e9conomie marocaine continue de faire preuve dune \u00abgrande r\u00e9silience\u00bb, alors que la dynamique de croissance devrait rester forte en 2026 et \u00e0 moyen terme, port\u00e9e par les investissements publics et priv\u00e9s dans les infrastructures, estime le Fonds mon\u00e9taire international (FMI). [www.yabiladi.com]\n-------------------------------------------------\nPort\u00e9e par les investissements et la r\u00e9silience de l\u2019\u00e9conomie, la croissance marocaine devrait atteindre 4,4% en 2026, selon le FMI, qui souligne la solidit\u00e9 des fondamentaux malgr\u00e9 un contexte international incertain. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027\u00e9conomie marocaine continue de faire preuve d\u0027une \"grande r\u00e9silience\", alors que la dynamique de croissance devrait rester forte en 2026 et \u00e0 moyen terme, port\u00e9e par les investissements publics et priv\u00e9s dans les infrastructures, estime le Fonds mon\u00e9taire international (FMI). [leseco.ma]\n-------------------------------------------------\nLe Fonds mon\u00e9taire international (FMI) estime que l\u2019\u00e9conomie marocaine continue de faire preuve d\u2019une \u00ab grande r\u00e9silience \u00bb, avec des perspectives de croissance jug\u00e9es solides pour les ann\u00e9es \u00e0 venir, malgr\u00e9 un environnement international marqu\u00e9 par l\u2019incertitude. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "En application des hautes instructions\nroyales, visant la mise en...", "mass": 5, "physics": false, "shape": "box", "title": "En application des hautes instructions royales, visant la mise en \u0153uvre du programme de reconstitution du cheptel national, le minist\u00e8re de l\u2019Agriculture, de la P\u00eache maritime, du D\u00e9veloppement rural et des Eaux et For\u00eats annonce le lancement, \u00e0 partir du mardi 24 mars sur l\u2019ensemble du territoire national, de l\u2019op\u00e9ration de contr\u00f4le du maintien des. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Agriculture lance une op\u00e9ration de contr\u00f4le \u00e0 l\u2019\u00e9chelle nationale avant le versement final des aides aux \u00e9leveurs. [www.lavieeco.com]\n-------------------------------------------------\nLe Minist\u00e8re de l\u2019Agriculture, de la P\u00eache Maritime, du D\u00e9veloppement Rural et des Eaux et For\u0         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
