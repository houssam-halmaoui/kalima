lic vient de d\u00e9ployer un nouveau service num\u00e9rique permettant aux usagers de suivre en temps r\u00e9el l\u2019\u00e9volution de leurs plaintes et dol\u00e9ances. [www.lavieeco.com]\n-------------------------------------------------\nLa pr\u00e9sidence du Minist\u00e8re public a annonc\u00e9 le lancement d\u2019un service num\u00e9rique innovant destin\u00e9 \u00e0 am\u00e9liorer la communication entre les parquets du Royaume et les usagers. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Orange Maroc a inaugur\u00e9 mercredi\n19 novembre 2025 son nouveau...", "mass": 5, "physics": false, "shape": "box", "title": "Orange Maroc a inaugur\u00e9 mercredi 19 novembre 2025 son nouveau Data Center de derni\u00e8re g\u00e9n\u00e9ration, \u00ab Orange Tech \u00bb, en pr\u00e9sence de Jalal Benhayoun, Gouverneur de la province de Noua. [lematin.ma]\n-------------------------------------------------\nL\u2019ouverture s\u2019est d\u00e9roul\u00e9e en pr\u00e9sence de repr\u00e9sentants des secteurs public et priv\u00e9, dont Jalal Benhayoun, gouverneur de la province. [lnt.ma]\n-------------------------------------------------\nSelon un communiqu\u00e9 d\u2019Orange Maroc, ce Data Center, d\u2019une capacit\u00e9 initiale de 1,5 MW et construit sur une superficie de 15.000 m\u00b2, incarne la vision strat\u00e9gique d\u2019Orange [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Ce document, consultable sur le\nsite web du minist\u00e8re, r\u00e9sume...", "mass": 5, "physics": false, "shape": "box", "title": "Ce document, consultable sur le site web du minist\u00e8re, r\u00e9sume les principales informations et donn\u00e9es du budget de l\u0027Etat, permettant d\u0027informer les citoyens sur les progra. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9conomie et des Finances a publi\u00e9 le Budget citoyen 2026 qui permet une meilleure compr\u00e9hension du Projet de loi de finances (PLF) et de ses dispositions. [telquel.ma]\n-------------------------------------------------\nCe document r\u00e9sume les principales informations et donn\u00e9es du budget de l\u0027Etat, permettant d\u0027informer les citoyens sur les programmes et les projets les plus importants, ainsi que sur les diff\u00e9rentes mesures budg\u00e9taires, fiscales et douani\u00e8res propos\u00e9es dans ce cadre. [www.lavieeco.com]\n-------------------------------------------------\nCe document, consultable sur le site web du minist\u00e8re, r\u00e9sume les principales informations et donn\u00e9es du budget de l\u2019Etat, permettant d\u2019informer les citoyens sur les programmes [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Avec deux victoires face au\nMozambique et \u00e0 l\u0027Ouganda, le...", "mass": 5, "physics": false, "shape": "box", "title": "Avec deux victoires face au Mozambique et \u00e0 l\u0027Ouganda, le Maroc totalise 1713.12 points, soit 3,01 de plus qu\u0027au classement d\u2019octobre, profitant de la d\u00e9gringolade de l\u2019Ita. [lematin.ma]\n-------------------------------------------------\nAvec deux victoires, le Lions de l\u2019Atlas totalisent 1713,12 points, soit 3,01 de plus qu\u0027au classement d\u2019octobre, profitant de la d\u00e9gringolade de l\u2019Italie (12e) qui a perdu 2 places. [www.lavieeco.com]\n-------------------------------------------------\nLes Lions de l\u2019Atlas ont gagn\u00e9 une place pour reprendre le 11e rang mondial du dernier Classement du football masculin, publi\u00e9 mercredi par la F\u00e9d\u00e9ration internationale de football association (FIFA). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8 e franchir\nun cap in\u00e9dit dans ses...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc vient de franchir un cap in\u00e9dit dans ses exportations agricoles vers l\u2019Irlande. [lematin.ma]\n-------------------------------------------------\nLe Maroc a \u00e9tabli un nouveau record saisonnier pour ses exportations vers l\u2019Irlande. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "V\u00e9ritable c\u00e9l\u00e9bration du regard crois\u00e9\nentre le collectionneur et le...", "mass": 5, "physics": false, "shape": "box", "title": "V\u00e9ritable c\u00e9l\u00e9bration du regard crois\u00e9 entre le collectionneur et le couturier, cette exposition in\u00e9dite invite \u00e0 red\u00e9couvrir Yves Saint Laurent \u00e0 travers l\u2019\u0153il \u00e9rudit d\u2019Hamish Bow. [lematin.ma]\n-------------------------------------------------\nLe mus\u00e9e Yves Saint Laurent Marrakech invite le public \u00e0 d\u00e9couvrir les derniers jours de l\u2019exposition \u00ab Yves Saint Laurent : The Hamish Bowles Collection \u00bb, qui fermera ses portes le dimanche 4 janvier 2026 \u00e0 18h00. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le ministre des Affaires \u00e9trang\u00e8res\ndu Malawi, George Tapatula Chaponda,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \"historique\" par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \u00ab historique \u00bb par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res du Malawi, George Tapatula Chaponda, a r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, le soutien de son pays \u00e0 l\u2019int\u00e9grit\u00e9 territoriale du Maroc et \u00e0 sa souverainet\u00e9 sur l\u2019ensemble de son territoire, y compris le Sahara, saluant l\u2019adoption \u201chistorique\u201d par le Conseil de s\u00e9curit\u00e9 de l\u2019ONU de la r\u00e9solution 2797. [www.lereporter.ma]\n-------------------------------------------------\nLa R\u00e9publique de Sierra Leone a r\u00e9affirm\u00e9, jeudi \u00e0 Rabat, son soutien \u00e0 l\u2019int\u00e9grit\u00e9 territoriale et \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara, tout en prenant note avec grande satisfaction de l\u2019adoption historique de la r\u00e9solution 2797 du Conseil de s\u00e9curit\u00e9 des Nations Unies. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Apr\u00e8s pr\u00e8s de deux mois\ndu d\u00e9marrage de l\u2019ann\u00e9e universitaire,...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s pr\u00e8s de deux mois du d\u00e9marrage de l\u2019ann\u00e9e universitaire, le ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui, a expos\u00e9 les actions cl\u00e9s d\u00e9ploy\u00e9es pour am\u00e9liorer la qualit\u com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et son homologue gambien, Sering Modou Njie, ont r\u00e9affirm\u00e9, mercredi \u00e0 Rabat, la d\u00e9termination du Maroc et de la Gambie \u00e0 consolider la coop\u00e9ration bilat\u00e9rale dans plusieurs domaines. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Jameel Motors, acteur majeur des\nsolutions de mobilit\u00e9 et partenaire...", "mass": 5, "physics": false, "shape": "box", "title": "Jameel Motors, acteur majeur des solutions de mobilit\u00e9 et partenaire privil\u00e9gi\u00e9 des plus grandes marques automobiles, a \u00e9t\u00e9 d\u00e9sign\u00e9 distributeur officiel de Jiangling Motors Corporation (JMC) au Maroc, constructeur chinois sp\u00e9cialis\u00e9 dans les v\u00e9hicules utilitaires l\u00e9gers. [leseco.ma]\n-------------------------------------------------\nJameel Motors poursuit l\u2019\u00e9largissement de son portefeuille au Maroc avec la signature d\u2019un accord de distribution exclusif avec Jiangling Motors Corporation (JMC), constructeur chinois sp\u00e9cialis\u00e9 dans les v\u00e9hicules utilitaires l\u00e9gers. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Lors de cette r\u00e9union, M.\nElhadi a fait part au...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de cette r\u00e9union, M. Elhadi a fait part au Conseil de sa d\u00e9cision de d\u00e9missionner de son mandat d\u2019Administrateur, eu \u00e9gard \u00e0 ses responsabilit\u00e9s au sein du groupe Al Mada. [fr.hespress.com]\n-------------------------------------------------\nR\u00e9uni sous la pr\u00e9sidence de Sa\u00efd Elhadi, le conseil d\u2019administration de Sonasid a pris acte de la d\u00e9mission de ce dernier de son mandat d\u2019administrateur. [lematin.ma]\n-------------------------------------------------\nLe Conseil d\u0027administration de Sonasid (Soci\u00e9t\u00e9 nationale de sid\u00e9rurgie), r\u00e9uni ce jeudi, a coopt\u00e9 Ayoub Azami en qualit\u00e9 d\u0027administrateur et a d\u00e9cid\u00e9, \u00e0 l\u0027unanimit\u00e9, de le nommer \u00e0 la fonction de pr\u00e9sident du Conseil d\u0027administration de la Soci\u00e9t\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le projet doit couvrir une\nsuperficie totale de de 30.000...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet doit couvrir une superficie totale de de 30.000 hectares en y installant des techniques d\u2019irrigation peu consommatrices en eau comme le goutte \u00e0 goutte dans le but de renforcer la s\u00e9curit\u00e9 . [fr.hespress.com]\n-------------------------------------------------\nLe Maroc et le Japon ont conclu, jeudi \u00e0 Rabat, un \u00e9change de notes relatif \u00e0 un accord de pr\u00eat de 64,577 milliards de yens japonais (environ 3,9 milliards de dirhams - MMDH), pour le financement du projet d\u0027am\u00e9nagement hydro-agricole de la zone sud-est de la plaine du Gharb. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc et le Japon ont conclu, jeudi \u00e0 Rabat, un \u00e9change de notes relatif \u00e0 un accord de pr\u00eat de 64,577 milliards de yens japonais (environ 3,9 milliards de dirhams), pour le financement du projet d\u2019am\u00e9nagement hydro-agricole de la zone sud-est de la plaine du Gharb. [telquel.ma]\n-------------------------------------------------\nLe Maroc et le Japon ont conclu, jeudi \u00e0 Rabat, un \u00e9change de notes relatif \u00e0 un accord de pr\u00eat de 64,577 milliards de yens japonais (environ 3,9 milliards de dirhams), pour le financement du projet dam\u00e9nagement hydro-agricole de la zone sud-est de la plaine du Gharb. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et le Japon ont conclu, jeudi \u00e0 Rabat, un \u00e9change de notes relatif \u00e0 un accord de pr\u00eat de 64,577 milliards de yens japonais (environ 3,9 milliards de dirhams \u2013 MMDH), pour le financement du projet d\u2019am\u00e9nagement hydro-agricole de la zone sud-est de la plaine du Gharb. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "L\u2019Association pour la Promotion du\nSport en Entreprise au Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Association pour la Promotion du Sport en Entreprise au Maroc (APSEM) a particip\u00e9, le 16 novembre 2025, \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de la World Federation for Company Sport (WFCS), te. [lematin.ma]\n-------------------------------------------------\nL\u2019Association pour la promotion du sport en entreprise au Maroc (APSEM) a particip\u00e9, le 16 novembre 2025, \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de la World federation for company sport (WFCS) [www.challenge.ma]\n-------------------------------------------------\nL\u2019Association pour la Promotion du Sport en Entreprise au Maroc (APSEM) a particip\u00e9 le 16 novembre 2025 \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de la World Federation for Company Sport (WFCS) \u00e0 M\u00e1laga, Espagne, soulignant l\u2019engagement du Maroc dans le d\u00e9veloppement du sport en entreprise et dans la promotion de la sant\u00e9, de la coh\u00e9sion et de la performance au travail. [www.lavieeco.com]\n-------------------------------------------------\nYounes El Mechrafi, Pr\u00e9sident de l\u2019Association pour la Promotion du Sport en Entreprise au Maroc (APSEM) et Vice-Pr\u00e9sident Afrique de la World Federation for Company Sport (WFCS), a repr\u00e9sent\u00e9 le Maroc lors de l\u2019Assembl\u00e9e G\u00e9n\u00e9rale de la WFCS \u00e0 M\u00e1laga, en Espagne. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Les athl\u00e8tes marocains ont ajout\u00e9\ndeux nouvelles breloques en or,...", "mass": 5, "physics": false, "shape": "box", "title": "Les athl\u00e8tes marocains ont ajout\u00e9 deux nouvelles breloques en or, ce mercredi, lors des \u00e9preuves d\u2019athl\u00e9tisme de la 6\u1d49 \u00e9dition des Jeux de la solidarit\u00e9 islamique. [lematin.ma]\n-------------------------------------------------\nL\u2019athl\u00e8te marocain Rachid Mhamdi a remport\u00e9 la m\u00e9daille d\u2019or du 400 m, mercredi \u00e0 Riyad, lors des \u00e9preuves d\u2019athl\u00e9tisme dans le cadre de la 6\u00e8 \u00e9dition des Jeux de la solidarit\u00e9 islamique qui se poursuit \u00e0 Riyad. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Samsung confirme son ancrage sur\nle march\u00e9 marocain en d\u00e9crochant...", "mass": 5, "physics": false, "shape": "box", "title": "Samsung confirme son ancrage sur le march\u00e9 marocain en d\u00e9crochant trois distinctions majeures dans la nouvelle \u00e9dition du classement Brand Africa 100 | Africa\u2019s Best Brands 2025, qui recense les marques les plus admir\u00e9es \u00e0 l\u2019\u00e9chelle du continent. [www.lopinion.ma]\n-------------------------------------------------\nSamsung, leader mondial de la technologie et de l\u2019\u00e9lectronique grand public, a \u00e9t\u00e9 distingu\u00e9e \u00e0 trois reprises dans le classement Brand Africa 100 | Africa\u2019s Best Brands 2025, qui recense les marques les plus admir\u00e9es sur le continent. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Le ministre de la Sant\u00e9\net de la protection sociale,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Sant\u00e9 et de la protection sociale, Amine tahraoui, et le directeur de l\u2019Agence marocaine des m\u00e9dicaments, se sont longuement expliqu\u00e9s devant les d\u00e9put\u00e9s lors d\u2019une audition \u00e0 la commission des secteurs sociaux \u00e0 propos de la production et l\u2019importation exceptionnelle du chlorure de potassium suite \u00e0 la pol\u00e9mique d\u00e9clench\u00e9e par les accusations d\u2019Abdellah Bouanou. [www.lopinion.ma]\n-------------------------------------------------\nIl a d\u00e9nonc\u00e9 les accusations sans preuves et a rappel\u00e9 qu\u2019il n\u2019accepte aucun dysfonctionnement ni d\u00e9passement dans les proc\u00e9dures des appels d\u2019offres. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "inDrive annonce le lancement d\u2019un\nconcours photo \u00e0 Marrakech invitant...", "mass": 5, "physics": false, "shape": "box", "title": "inDrive annonce le lancement d\u2019un concours photo \u00e0 Marrakech invitant les habitants \u00e0 mettre en valeur les sites embl\u00e9matiques de la ville et \u00e0 les partager en ligne pour tenter de remporter des exp\u00e9riences locales in\u00e9dites. [www.lopinion.ma]\n-------------------------------------------------\ninDrive annonce le lancement d\u2019un concours photo \u00e0 Marrakech invitant les habitants \u00e0 mettre en valeur les sites embl\u00e9matiques de la ville et \u00e0 les partager en ligne pour tenter de remporter des exp\u00e9riences locales in\u00e9dites. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "La Chambre des Conseillers tiendra,\nmardi, une s\u00e9ance pl\u00e9n <script>

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
