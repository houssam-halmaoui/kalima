abilit\u00e9 apr\u00e8s avoir manqu\u00e9 le penalty d\u00e9cisif, dans un moment qui hantera longtemps les . [fr.hespress.com]\n-------------------------------------------------\nLa finale de la Coupe d\u2019Afrique des Nations 2025 opposant le Maroc au S\u00e9n\u00e9gal s\u2019est conclue par une d\u00e9faite des Lions de l\u2019Atlas, mettant fin \u00e0 leur parcours dans la comp\u00e9tition. [lematin.ma]\n-------------------------------------------------\nAu lendemain de la d\u00e9faite des Lions de l\u2019Atlas en finale de la CAN contre le S\u00e9n\u00e9gal, et apr\u00e8s son penalty rat\u00e9, Brahim D\u00edaz a publi\u00e9 un message charg\u00e9 d\u2019\u00e9motion sur ses r\u00e9seaux sociaux ce lundi 19 janvier. [telquel.ma]\n-------------------------------------------------\nL\u0027attaquant marocain Brahim Abdelkader D\u00edaz a fait part de sa d\u00e9ception lundi sur Instagram apr\u00e8s avoir rat\u00e9 le penalty d\u00e9cisif qui aurait pu donner le titre continental au Maroc lors de la finale de la CAN 2025 perdue face au S\u00e9n\u00e9gal (1-0 apr\u00e8s prolongation). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La F\u00e9d\u00e9ration royale marocaine de\nfootball (FRMF) a annonc\u00e9 qu\u2019elle...", "mass": 5, "physics": false, "shape": "box", "title": "La F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9 qu\u2019elle recourra aux proc\u00e9dures l\u00e9gales en vigueur aupr\u00e8s de la Conf\u00e9d\u00e9ration africaine de football (CAF) ainsi que de la F\u00e9d\u00e9ration internationale de football (FIFA), afin de statuer sur l\u2019incident li\u00e9 au retrait de la s\u00e9lection s\u00e9n\u00e9galaise de la pelouse lors de la finale qui l\u2019a oppos\u00e9e . [fr.hespress.com]\n-------------------------------------------------\nDans un communiqu\u00e9 ferme publi\u00e9 ce lundi, la F\u00e9d\u00e9ration Royale Maro ns joueurs et officiels lors de la finale de la CAN 2025 entre le Maroc et le S\u00e9n\u00e9gal qui s\u2019est d\u00e9roul\u00e9e dimanche 18 janvier \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a condamn\u00e9 ce quelle a d\u00e9crit comme un comportement inacceptable de la part de certains joueurs et responsables lors de la finale de la Coupe dAfrique des nations (CAN 2025), qui sest jou\u00e9e dimanche soir \u00e0 Rabat entre le Maroc et le S\u00e9n\u00e9gal. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration Africaine de Football (CAF) a condamn\u00e9 le comportement inacceptable de certains joueurs et officiels lors de la finale de la TotalEnergies CAF Coupe d\u0027Afrique des Nations Maroc 2025 entre le Maroc et le S\u00e9n\u00e9gal, qui s\u0027est d\u00e9roul\u00e9e, dimanche, \u00e0 Rabat. [www.lavieeco.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration Africaine de Football (CAF) a condamn\u00e9 le comportement inacceptable de certains joueurs et officiels lors de la finale de la TotalEnergies CAF Coupe d\u2019Afrique des Nations Maroc 2025 entre le Maroc et le S\u00e9n\u00e9gal, qui s\u2019est d\u00e9roul\u00e9e, dimanche, \u00e0 Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le pr\u00e9sident de la Fifa,\nGianni Infantino, a condamn\u00e9 lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de la Fifa, Gianni Infantino, a condamn\u00e9 lundi \u00ab des sc\u00e8nes inacceptables \u00bb lors de la finale de la CAN, mettant en cause certains joueurs et une partie du staff du S\u00e9n\u00e9gal qui ont quitt\u00e9 le terrain plusieurs minutes en plein match. [telquel.ma]\n-------------------------------------------------\nLe pr\u00e9sident de la F\u00e9d\u00e9ration internationale de football association (FIFA), Gianni Infantino, a r\u00e9agi aux sc\u00e8nes de chaos qui ont entach\u00e9 la finale de la Coupe dAfrique des nations (CAN 2025), hier \u00e0 Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La collision entre deux trains\n\u00e0 grande vitesse dimanche soir,...", "mass": 5, "physics": false, "shape": "box", "title": "La collision entre deux trains \u00e0 grande vitesse dimanche soir, dont l\u2019un a d\u00e9raill\u00e9, dans le sud de l\u2019Espagne a fait au moins 39 morts mais le bilan n\u2019est \u00ab pas d\u00e9finitif \u00bb, ont pr\u00e9venu lundi les autorit\u00e9s, \u00e9voquant un accident \u00ab extr\u00eamement \u00e9trange \u00bb. [telquel.ma]\n-------------------------------------------------\nUn grave accident ferroviaire impliquant deux trains \u00e0 grande vitesse a fait au moins 21 morts et plusieurs dizaines de bless\u00e9s dimanche dans le sud de l\u2019Espagne, pr\u00e8s de la localit\u00e9 d\u2019Adamuz, en Andalousie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Apr\u00e8s la d\u00e9faite face au\nS\u00e9n\u00e9gal lors de la finale...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s la d\u00e9faite face au S\u00e9n\u00e9gal lors de la finale de la CAN remport\u00e9e apr\u00e8s prolongation (1-0), le s\u00e9lectionneur national Walid Regragui a exprim\u00e9 sa d\u00e9ception pour le public et regrett\u00e9 l\u2019image donn\u00e9e du football africain, tout en affirmant que ses joueurs reviendront plus forts. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, n\u2019a pas cach\u00e9 sa frustration apr\u00e8s la finale de la Coupe d\u0027Afrique des Nations (CAN) remport\u00e9e, dimanche soir \u00e0 Rabat par le S\u00e9n\u00e9gal face au Maroc (0-1, a.p), reconnaissant que le football est parfois \"cruel\". [leseco.ma]\n-------------------------------------------------\nAu lendemain de la finale de la Coupe d\u2019Afrique des Nations 2025 remport\u00e9e par le S\u00e9n\u00e9gal face au Maroc apr\u00e8s prolongations, Walid Regragui a exprim\u00e9 sa profonde d\u00e9ception en conf\u00e9rence de presse \u00e0 Rabat, reconnaissant que le football peut parfois se montrer impitoyable, notamment dans un match aussi d\u00e9cisif. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La s\u00e9lection s\u00e9n\u00e9galaise de football\na remport\u00e9 la Coupe d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection s\u00e9n\u00e9galaise de football a remport\u00e9 la Coupe d\u2019Afrique des Nations-2025 en battant son homologue marocaine par 1 but \u00e0 0 apr\u00e8s prolongations (temps r\u00e9glementaire 0-0), dimanche soir au Stade Prince Moulay Abdellah \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nPour cette affiche de gala entre deux s\u00e9lections qui ne s\u2019\u00e9taient jamais affront\u00e9es en phase finale de la CAN, Walid Regragui a reconduit le m\u00eame Onze de d\u00e9part. [www.lereporter.ma]\n-------------------------------------------------\nLe S\u00e9n\u00e9gal a remport\u00e9 la Coupe d\u2019Afrique des Nations 2025 en battant le Maroc 1-0, dimanche au Stade Prince Moulay Abdellah de Rabat, au terme d\u2019une finale longtemps ind\u00e9cise et finalement tranch\u00e9e en prolongations. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "L\u2019actif net sous gestion des\nOrganismes de placement collectif en...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019actif net sous gestion d             setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
