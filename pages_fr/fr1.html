26 apr\u00e8s 4,9% en 2025, port\u00e9e notamment par un fort rebond du secteur agricole. [www.lavieeco.com]\n-------------------------------------------------\nApr\u00e8s un accroissement de 8,2% en 2025, la valeur ajout\u00e9e agricole marquerait un rebond de 16% cette ann\u00e9e tenant compte d\u2019une r\u00e9colte. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "\u00ab Tenant compte de l\u2019\u00e9volution\npr\u00e9vue de l\u2019inflation \u00e0 des...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Tenant compte de l\u2019\u00e9volution pr\u00e9vue de l\u2019inflation \u00e0 des niveaux en ligne avec l\u2019objectif de stabilit\u00e9 des prix \u00e0 moyen terme, de la consolidation de la dynamique de l\u2019activit\u00e9 \u00e9conomique et de la forte incertitude . [fr.hespress.com]\n-------------------------------------------------\nLe Conseil de Bank Al-Maghrib (BAM), r\u00e9uni mardi 23 juin \u00e0 Rabat, a d\u00e9cid\u00e9 de maintenir le taux directeur inchang\u00e9 \u00e0 2,25%. [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Il succ\u00e8de \u00e0Herv\u00e9 Barrere, qui\na d\u00e9cid\u00e9, pour des raisons...", "mass": 5, "physics": false, "shape": "box", "title": "Il succ\u00e8de \u00e0Herv\u00e9 Barrere, qui a d\u00e9cid\u00e9, pour des raisons familiales, de quitter ses fonctions apr\u00e8s neuf ann\u00e9es au sein du Groupe Danone. [fr.hespress.com]\n-------------------------------------------------\nCentrale Danone ouvre un nouveau chapitre de son histoire avec l\u0027arriv\u00e9e d\u0027Imad Bakkali \u00e0 sa t\u00eate. [lematin.ma]\n-------------------------------------------------\nImad Bakkali a \u00e9t\u00e9 nomm\u00e9 au poste de Pr\u00e9sident Directeur G\u00e9n\u00e9ral de Centrale Danone, \u00e0 compter du 1er juillet 202 n. [lematin.ma]\n-------------------------------------------------\nBank Of Africa a conclu deux m\u00e9morandums de coop\u00e9ration \u00e0 P\u00e9kin, visant \u00e0 consolider son r\u00f4le de passerelle financi\u00e8re entre la Chine et l\u2019Afrique. [telquel.ma]\n-------------------------------------------------\nBank of Africa a conclu ce mardi \u00e0 P\u00e9kin deux m\u00e9morandums de coop\u00e9ration destin\u00e9s \u00e0 renforcer les \u00e9changes commerciaux, les investissements et les opportunit\u00e9s d\u0027affaires entre la Chine et l\u0027Afrique, consolidant ainsi son positionnement comme partenaire de r\u00e9f\u00e9rence des relations \u00e9conomiques sino-africaines. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Implant\u00e9e sur un terrain de\n48.000 m\u00b2, l\u0027unit\u00e9 industrielle de...", "mass": 5, "physics": false, "shape": "box", "title": "Implant\u00e9e sur un terrain de 48.000 m\u00b2, l\u0027unit\u00e9 industrielle de Leoni Cable Solutions comprendra 18.000 m\u00b2 d\u0027espaces industriels et de bureaux ainsi qu\u0027une r\u00e9serve fonci. [lematin.ma]\n-------------------------------------------------\nLe groupe allemand Leoni renforce sa pr\u00e9sence au Maroc avec une nouvelle usine de c\u00e2bles automobiles \u00e0 K\u00e9nitra au sein de sa division Leoni Cable Solutions. [telquel.ma]\n-------------------------------------------------\nLe fabricant allemand de c\u00e2bles, LEONI Cable Solutions, a choisi le Maroc pour installer sa premi\u00e8re unit\u00e9 industrielle en Afrique, en investissant 630 millions de dirhams (60 millions deuros) dans lAtlantic Free Zone de K\u00e9nitra. [www.yabiladi.com]\n-------------------------------------------------\nImplant\u00e9e l\u0027Atlantic Free Zone de K\u00e9nitra, cette unit\u00e9 industrielle fabriquera des c\u00e2bles unifilaires, multifilaires et de transmission de don         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }

                var comm = communities[groupId];
                var numNodes = comm.nodes.length;
