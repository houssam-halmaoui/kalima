tecturale et un embl\u00e8me de modernit\u00e9 qui symbolise l\u2019\u00e9mergence et le rayonnement des deux villes [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La ville de Blida, situ\u00e9e\nau sud-ouest de Alger, a...", "mass": 5, "physics": false, "shape": "box", "title": "La ville de Blida, situ\u00e9e au sud-ouest de Alger, a \u00e9t\u00e9 le th\u00e9\u00e2tre, ce lundi, de deux attaques suicides visant des sites sensibles, co\u00efncidant avec le d\u00e9but de la visite officielle du Pape L\u00e9on XIV dans le pays. [fr.hespress.com]\n-------------------------------------------------\nL\u2019Alg\u00e9rie a \u00e9t\u00e9 frapp\u00e9e ce lundi par une s\u00e9rie d\u2019attentats \u00e0 Blida, \u00e0 une cinquantaine de kilom\u00e8tres d\u2019Alger, mettant en lumi\u00e8re de graves d\u00e9faillances dans son dispositif s\u00e9curitaire, \u00e0 un moment particuli\u00e8rement sensible pour le pays. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le minist\u00e8re de la Sant\u00e9\net de la Protection sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Sant\u00e9 et de la Protection sociale (MSPS) franchit une nouvelle \u00e9tape dans sa strat\u00e9gie de modernisation en lan\u00e7ant une version actualis\u00e9e de la plateforme num\u00e9rique d\u00e9di\u00e9e aux r\u00e9clamations des usagers. [fr.hespress.com]\n-------------------------------------------------\nLe ministre de la Sant\u00e9, Amine Tehraoui, a donn\u00e9 le coup d\u2019envoi de la modernisation de la plateforme \u00ab Chikaya Sant\u00e9 \u00bb, un dispositif num\u00e9rique renforc\u00e9 visant \u00e0 centraliser et acc\u00e9l\u00e9rer le traitement des r\u00e9clamations des usagers, tout en consolidant la transparence et la qualit\u00e9 des services de sant\u00e9 au Maroc. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "En 2025, le volume d\u2019affaires\ng\u00e9n\u00e9r\u00e9 a atteint 188 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "En 2025, le volume d\u2019affaires g\u00e9n\u00e9r\u00e9 a atteint 188 milliards de dirhams, en hausse de 8% par rapport \u00e0 l\u2019ann\u00e9e. [lematin.ma]\n-------------------------------------------------\nLe Groupe Tanger Med a enregistr\u00e9 en 2025 un volume d\u2019affaires de 188 milliards de dirhams (MMDH) g\u00e9n\u00e9r\u00e9 par son activit\u00e9 industrielle, soit une progression de 8 % par rapport \u00e0 l\u2019ann\u00e9e pr\u00e9c\u00e9dente. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019a\u00e9roport international de Marrakech-Menara a\nenregistr\u00e9, \u00e0 fin f\u00e9vrier 2026,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019a\u00e9roport international de Marrakech-Menara a enregistr\u00e9, \u00e0 fin f\u00e9vrier 2026, une hausse de 10,40% du trafic des passagers par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon les donn\u00e9es de l\u2019Office national des a\u00e9roports (ONDA). [telquel.ma]\n-------------------------------------------------\nCette plateforme a\u00e9roportuaire a accueilli 1,7 million de passagers durant les deux premiers mois de l\u2019ann\u00e9e en cours, contre 1,6 million de voyageurs \u00e0 fin f\u00e9vrier 2025, pr\u00e9cise l\u2019ONDA. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019a\u00e9roport international de Marrakech-Menara a enregistr\u00e9, \u00e0 fin f\u00e9vrier 2026, une hausse de 10,40% du trafic des passagers par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon les donn\u00e9es de l\u2019Office national des a\u00e9roports (O
