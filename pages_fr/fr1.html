 26}, "group": 35, "id": "comm_label_35", "label": "La R\u00e9publique D\u00e9mocratique du Congo\n(RDC) s\u2019est impos\u00e9e face au...", "mass": 5, "physics": false, "shape": "box", "title": "La R\u00e9publique D\u00e9mocratique du Congo (RDC) s\u2019est impos\u00e9e face au B\u00e9nin 1 \u00e0 0, en match de la premi\u00e8re journ\u00e9e du Groupe D de la Coupe d\u2019Afrique des Nations de football CAN-2025, disput\u00e9 mardi au Stade Al-Madina \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa R\u00e9publique d\u00e9mocratique du Congo (RDC) s\u2019est impos\u00e9e face \u00e0 son homologue b\u00e9ninoise (1-0) en match de la premi\u00e8re journ\u00e9e du Groupe D de la Coupe d\u2019Afrique des nations (CAN 2025), disput\u00e9 mardi au stade Al Madina \u00e0 Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 36, "id": "comm_label_36", "label": "La superstar de la s\u00e9lection\nalg\u00e9rienne de football, Riyad Mahrez,...", "mass": 5, "physics": false, "shape": "box", "title": "La superstar de la s\u00e9lection alg\u00e9rienne de football, Riyad Mahrez, s\u2019est dit content d\u2019\u00eatre au Maroc pour disputer la Coupe d\u2019Afrique des Nations (CAN-2025), notant que les joueurs alg\u00e9riens sont d\u00e9termin\u00e9s \u00e0 tout donner pour r\u00e9aliser une bonne performance. [telquel.ma]\n-------------------------------------------------\nLa superstar de la s\u00e9lection alg\u00e9rienne de football, Riyad Mahrez sest dit content d\u2019\u00eatre au Maroc pour disputer la Coupe d\u2019Afrique des nations (CAN 2025), notant que les joueurs alg\u00e9riens sont d\u00e9termin\u00e9s \u00e0 tout donner pour r\u00e9aliser une bonne performance. [www.yabiladi.com]\n-------------------------------------------------\nLa superstar de la s\u00e9lection alg\u00e9rienne de football, Riyad Mahrez, de p\u00e8re alg\u00e9rien et de m\u00e8re marocaine, s\u20                     scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
