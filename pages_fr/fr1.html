..", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e par le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traore, lors de son entretie. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traor\u00e9, a salu\u00e9, mardi \u00e0 Rabat, la dynamique de coop\u00e9ration entre le Burkina Faso et le Maroc, mettant en avant l\u2019importance de l\u2019Initiative Royale Internationale visant \u00e0 favoriser l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration r\u00e9gionale et des Burkinab\u00e8 de l\u2019ext\u00e9rieur, Karamoko Jean Marie Traor\u00e9, a salu\u00e9, mardi \u00e0 Rabat, la dynamique de coop\u00e9ration entre le Burkina Faso et le Maroc, mettant en avant l\u2019importance de l\u2019Initiative Royale Internationale visant \u00e0 favoriser l\u2019acc\u00e8s des pays du Sahel \u00e0 l\u2019Oc\u00e9an Atlantique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "PLF 2026 : la premi\u00e8re\npartie adopt\u00e9e en commission \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "PLF 2026 : la premi\u00e8re partie adopt\u00e9e en commission \u00e0 la Chambre des conseillers avec plusieurs amendements. [lematin.ma]\n-------------------------------------------------\nLa Commission des finances, de la planification et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des conseillers a adopt\u00e9, mardi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du Projet de loi de finances (PLF) 2026, en pr\u00e9sence du ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Budget, Fouzi Lekjaa. [www.lopinion.ma]\n-------------------------------------------------\nLa Chambre des conseillers tiendra des s\u00e9ances pl\u00e9ni\u00e8res, mercredi et jeudi, pour examiner et voter le Projet de loi de finances N\u00b050.25 au titre de l\u2019ann\u00e9e budg\u00e9taire 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 29, "id": "comm_label_29", "label": "Le pr\u00e9sident de l\u0027Instance nationale\nde la probit\u00e9, de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident de l\u0027Instance nationale de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC), Mohamed Benalilou, a mis en lumi\u00e8re ces efforts aupr\u00e8s de responsables am\u00e9ricains et internationaux. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc a mis en avant \u00e0 Washington son exp\u00e9rience en mati\u00e8re de pr\u00e9vention et de lutte contre la corruption, lors de rencontres qui ont permis de pr\u00e9senter les avanc\u00e9es nationales et de renforcer le dialogue avec des institutions am\u00e9ricaines et internationales. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019exp\u00e9rience du Maroc en mati\u00e8re de pr\u00e9vention et de lutte contre la corruption a \u00e9t\u00e9 mise en avant, lundi \u00e0 Washington, \u00e0 l\u2019occasion d\u2019une s\u00e9rie de r\u00e9unions entre le pr\u00e9sident de l\u2019Instance nationale de la probit\u00e9, de la pr\u00e9vention et de la lutte contre la corruption (INPPLC), Mohamed Benalilou, et des responsables am\u00e9ricains et internationaux. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Cette liaison a\u00e9rienne, op\u  {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le secr\u00e9taire g\u00e9n\u00e9ral adjoint des\nNations unies, chef du bureau...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9taire g\u00e9n\u00e9ral adjoint des Nations unies, chef du bureau des Nations unies pour la lutte contre le terrorisme (ONUCT), Alexander Zuev, a salu\u00e9 mardi \u00e0 Rabat le partenariat \u201csolide\u201d avec le Maroc dans les efforts collectifs de lutte contre le terrorisme. [telquel.ma]\n-------------------------------------------------\nComme annonc\u00e9, Rabat accueille les 2 et 3 d\u00e9cembre la premi\u00e8re conf\u00e9rence des victimes africaines du terrorisme, organis\u00e9e en partenariat avec le Bureau des Nations Unies pour la Lutte contre le Terrorisme (UNOC). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 30, "id": "comm_label_30", "label": "Le segment minist\u00e9riel de la\nConf\u00e9rence sur les victimes africaines...", "mass": 5, "physics": false, "shape": "box", "title": "Le segment minist\u00e9riel de la Conf\u00e9rence sur les victimes africaines du terrorisme, tenue mardi \u00e0 Rabat, a ent\u00e9rin\u00e9 la D\u00e9claration de Rabat qui r\u00e9affirme la place centrale des victimes dans les r\u00e9ponses nationales et r\u00e9gionales au terrorisme et appelle \u00e0 renforcer les cadres juridiques, institutionnels et op\u00e9rationnels d\u00e9di\u00e9s \u00e0 leur protection. [telquel.ma]\n-------------------------------------------------\nLe segment minist\u00e9riel de la Conf\u00e9rence sur les victimes africaines du terrorisme, tenue mardi \u00e0 Rabat, a ent\u00e9rin\u00e9 la D\u00e9claration de Rabat qui r\u00e9affirme la place centrale des victimes dans les r\u00e9ponses nationales et r\u00e9gionales au terrorisme et appelle \u00e0 renforcer les cadres juridiques, institutionnels et op\u00e9rationnels d\u00e9di\u00e9s \u00e0 leur protection. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 27, "id": "comm_label_27", "label": "\u0003 Financement Selon Bank Al-Maghrib,\nl\u2019\u00e9volution du concours bancaire au...", "mass": 5, "physics": false, "shape": "box", "title": "\u0003 Financement Selon Bank Al-Maghrib, l\u2019\u00e9volution du concours bancaire au secteur non financier traduit l\u2019att\u00e9nuation de la baisse des facilit\u00e9s de tr\u00e9sorerie, la progression des cr\u00e9dits . [aujourdhui.ma]\n-------------------------------------------------\nSelon les derniers chiffres de Bank Al-Maghrib, les pr\u00eats aux m\u00e9nages atteignent 412,8 MMDH, soutenus par l\u2019immobilier et le financement participatif, tandis que les cr\u00e9dits aux entreprises priv\u00e9es et publiques connaissent des dynamiques contrast\u00e9es. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 31, "id": "comm_label_31", "label": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9\naux entreprises logistiques pour la...", "mass": 5, "physics": false, "shape": "box", "title": "Le nouveau programme d\u0027accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \"PME Supply Chain\", a \u00e9t\u00e9 lanc\u00e9, mardi \u00e0 Rabat, avec un budget global de 100 millions de dirhams. [www.lavieeco.com]\n-------------------------------------------------\nLe nouveau programme d\u2019accompagnement \u00ab PME Supply Chain \u00bb, destin\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, a \u00e9t\u00e9 officiellement lanc\u00e9 le 2 d\u00e9cembre lors d\u0027une c\u00e9r\u00e9monie \u00e0 Rabat. [leseco.ma]\n-------------------------------------------------\nLe nouveau programme d\u2019accompagnement d\u00e9di\u00e9 aux entreprises logistiques pour la p\u00e9riode 2025-2029, \u00ab PME Supply Chain \u00bb, a \u00e                                 };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
