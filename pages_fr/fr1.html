------------------------\nLes temp\u00eates qui touchent le pays depuis plusieurs jours maintenant ont perturb\u00e9 l\u2019activit\u00e9 portuaire, notamment celle des tankers qui approvisionnent le march\u00e9 local en carburants. [telquel.ma]\n-------------------------------------------------\nLa situation actuelle en mati\u00e8re d\u0027approvisionnement en produits p\u00e9troliers est stable et sous contr\u00f4le, \u00e0 la faveur des mesures proactives prises en coordination avec les acteurs du secteur des carburants pour garantir un stock \u00e0 m\u00eame de couvrir les besoins du march\u00e9 national, a affirm\u00e9 le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable. [leseco.ma]\n-------------------------------------------------\nL\u2019approvisionnement du march\u00e9 national en produits p\u00e9troliers demeure stable et sous contr\u00f4le, a indiqu\u00e9 le Minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable dans un communiqu\u00e9 publi\u00e9 jeudi, assurant que les mesures prises permettent de couvrir les besoins du march\u00e9 national malgr\u00e9 un contexte climatique exceptionnel. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Le dernier trait\u00e9 de d\u00e9sarmement\nnucl\u00e9aire liant les Etats-Unis et...", "mass": 5, "physics": false, "shape": "box", "title": "Le dernier trait\u00e9 de d\u00e9sarmement nucl\u00e9aire liant les Etats-Unis et la Russie, plus connu sous la nom de New Start, a expir\u00e9 jeudi 5 f\u00e9vrier 2026, marquant un [www.challenge.ma]\n-------------------------------------------------\nLe pr\u00e9sident am\u00e9ricain, Donald Trump, a r\u00e9clam\u00e9 jeudi un \u00ab nouveau trait\u00e9 am\u00e9lior\u00e9 et modernis\u00e9 \u00bb avec la Russie, suite \u00e0 l\u2019expiration du trait\u00e9 de d\u00e9sarmement nucl\u00e9aire New Start qui limitait l\u2019arsenal strat\u00e9gique d\u00e9ploy\u00e9 et le nombre de lanceurs de la Russie et des Etats-Unis. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le conseil a d\u00e9cid\u00e9 de\nreporter \u00e0 la deuxi\u00e8me s\u00e9ance...", "mass": 5, "physics": false, "shape": "box", "title": "Le conseil a d\u00e9cid\u00e9 de reporter \u00e0 la deuxi\u00e8me s\u00e9ance de cette session ordinaire, pr\u00e9vue le 13 f\u00e9vrier courant, l\u2019examen et le vote concernant le projet de partenariat relatif \u00e0 la cr\u00e9ation d\u2019un espace d\u00e9di\u00e9 aux jeux \u00e9lectroniques. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de la commune de Casablanca a tenu, jeudi, sa session ordinaire de f\u00e9vrier, marqu\u00e9e par l\u2019approbation de nombreuses conventions de partenariat relatives \u00e0 des projets de d\u00e9veloppement. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Ces interventions d\u0027\u00e9vacuation progressive des\nhabitants des communes expos\u00e9es aux...", "mass": 5, "physics": false, "shape": "box", "title": "Ces interventions d\u0027\u00e9vacuation progressive des habitants des communes expos\u00e9es aux risques d\u0027inondations se poursuivent, selon une approche prenant en consid\u00e9ration le degr\u00e9 de gravit\u00e9 et l\u0027ampleur des \u00e9ventuels d\u00e9g\u00e2ts. [www.lavieeco.com]\n-------------------------------------------------\nLes op\u00e9rations d\u2019\u00e9vacuation des habitants des communes expos\u00e9es aux risques d\u2019inondations ont permis, \u00e0 ce jour, de transporter et d\u2019\u00e9vacuer un total de 143.164 personnes, r\u00e9parties sur plusieurs provinces, dans le cadre des interventions pr\u00e9ventives visant \u00e0 prot\u00e9ger les vies et garantir la s\u00                                 scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
