ion marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN 2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au stade Al Madina \u00e0 Rabat. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9quipe du Cameroun a rejoint la s\u00e9lection marocaine en quart de finale de la CAN-2025 de football, en battant l\u2019Afrique du Sud par 2 buts \u00e0 1, en huiti\u00e8me de finale, dimanche au Stade Al Madina \u00e0 Rabat. [maroc-diplomatique.net]\n-------------------------------------------------\nLa s\u00e9lection camerounaise s\u2019est qualifi\u00e9e, dimanche au stade Al Madina \u00e0 Rabat, pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 en s\u2019imposant face \u00e0 l\u2019Afrique du Sud sur le score de deux buts \u00e0 un, lors du huiti\u00e8me de finale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le s\u00e9lectionneur national, Walid Regragui,\na annonc\u00e9, dimanche, que le...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est indisponible pour le reste de la comp\u00e9tition. [fr.hespress.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est indisponible pour le reste de la comp\u00e9tition. [atlasinfo.fr]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est indisponible pour le reste de la comp\u00e9tition. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9, dimanche, que le milieu de terrain des Lions de lAtlas, Azzedine Ounahi, serait indisponible pour le reste de la comp\u00e9tition. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a annonc\u00e9 dimanche que le milieu de terrain des Lions de l\u2019Atlas, Azzeddine Ounahi, est contraint de d\u00e9clarer forfait pour le reste de la Coupe d\u2019Afrique des Nations Maroc-2025. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La France et son alli\u00e9\nbritannique ont men\u00e9 une attaque...", "mass": 5, "physics": false, "shape": "box", "title": "La France et son alli\u00e9 britannique ont men\u00e9 une attaque contre des positions de l\u2019EI en Syrie, a annonc\u00e9 dimanche le minist\u00e8re fran\u00e7ais des Arm\u00e9es. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019offensive contre les positions du groupe terroriste a \u00e9t\u00e9 men\u00e9e dans le cadre de la force op\u00e9rationnelle interarm\u00e9es combin\u00e9e (Op\u00e9ration Inherent Resolve), pr\u00e9cise le minist\u00e8re fran\u00e7ais sur son compte officiel . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Voici les compositions de la\ns\u00e9lection marocaine de football et...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les compositions de la s\u00e9lection marocaine de football et de son homologue tanzanienne, qui s\u2019affrontent, dimanche (17H00) au Stade Prince Moulay Abdellah \u00e0 Rabat, en match des huiti\u00e8mes de finale de la 35-\u00e8me \u00e9dition de la Coupe d\u2019Afrique des Nations, qui se tient au Maroc jusqu\u2019au 18 janvier. [telquel.ma]\n-------------------------------------------------\nSolides, appliqu\u00e9s et insistants, les Lions de l\u2019Atlas ont valid\u00e9 leur qualification pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025, en \u00e9cartant la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat. [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e aux quarts de finale de la Coupe d\u2019Afrique des Nations de football (CAN Maroc-2025), en s\u2019imposant face \u00e0 la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat. [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine a valid\u00e9, dimanche au stade Prince Moulay Abdellah de Rabat, son billet pour les quarts de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 en s\u2019imposant face \u00e0 la Tanzanie sur le score de 1 but \u00e0 0. [lnt.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football a battu son homologue de la Tanzanie (1-0), dimanche au Stade Prince Moulay Abdellah \u00e0 Rabat, en match comptant pour les huiti\u00e8mes de finale de la Coupe d\u0027Afrique des nations (CAN-2025). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le s\u00e9lectionneur national, Walid Regragui,\na indiqu\u00e9, dimanche \u00e0 Rabat,...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [atlasinfo.fr]\n-------------------------------------------------\nAu terme d\u2019un huiti\u00e8me de finale disput\u00e9 et sans relief spectaculaire, la s\u00e9lection marocaine a assur\u00e9 l\u2019essentiel. [lematin.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a indiqu\u00e9, dimanche \u00e0 Rabat, que la s\u00e9lection marocaine savait qu\u2019elle allait souffrir durant cette CAN, assurant que le plus important reste la qualification pour les quarts de finale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Ce centre strat\u00e9gique marque une\navanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle...", "mass": 5, "physics": false, "shape": "box", "title": "Ce centre strat\u00e9gique marque une avanc\u00e9e structurante dans l\u2019organisation op\u00e9rationnelle du premier a\u00e9roport du Royaume et contribuera \u00e0 la fluidit\u00e9 durant la Coupe d\u2019Afrique des Nations (CAN) 2025 et les grands \u00e9v\u00e9nements internationaux . [fr.hespress.com]\n-------------------------------------------------\nL\u2019Office National des A\u00e9roports (ONDA) vient de mettre en service un Airport Operational Center (APOC) \u00e0 l\u2019a\u00e9roport international Mohammed V de Casablanca, marquant une avanc\u00e9e structurante dans l\u2019organisation [www.challenge.ma]\n-------------------------------------------------\nDans un contexte de croissance soutenue du trafic a\u00e9rien, estim\u00e9e \u00e0 plus de 12%, l\u2019objectif est de favoriser fluidit\u00e9 durant la Coupe d\u2019Afrique des nations (CAN 2025) qui se d\u00e9roule au Maroc, mais aussi pendant les grands \u00e9v\u00e9nements internationaux que le pays va accueillir prochainement. [www.yabiladi.com]\n-------------------------------------------------\nCe centre strat\u00e9gique marque         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {

                }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
