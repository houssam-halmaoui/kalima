harg\u00e9 du Commerce ext\u00e9rieur et de l\u2019Attractivit\u00e9 de France, Nicolas Forissier rencontre des investis. [lematin.ma]\n-------------------------------------------------\nLes moyens de renforcer les relations \u00e9conomiques et commerciales entre le Maroc et la France ont \u00e9t\u00e9 au centre d\u2019entretiens, jeudi \u00e0 Rabat, entre le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Commerce ext\u00e9rieur et de l\u2019Attractivit\u00e9 de France, Nicolas Forissier. [telquel.ma]\n-------------------------------------------------\nLes moyens de renforcer les relations \u00e9conomiques et commerciales entre le Maroc et la France ont \u00e9t\u00e9 au centre d\u0027entretiens, jeudi \u00e0 Rabat, entre le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 du Commerce ext\u00e9rieur et de l\u0027Attractivit\u00e9 de France, Nicolas Forissier. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises\ndu Maroc (CGEM) a tenu...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu une rencontre avec le directeur g\u00e9n\u00e9ral de la Caisse nationale de s\u00e9curit\u00e9 sociale (CNSS), Hassan Boubrik, autour d. [lematin.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a tenu, jeudi \u00e0 Casablanca, en pr\u00e9sence du directeur g\u00e9n\u00e9ral de la Caisse nationale de s\u00e9curit\u00e9 sociale (CNSS), Hassan Boubrik, une rencontre d\u00e9di\u00e9e \u00e0 la relation entre la Caisse et les entreprises, ainsi qu\u0027aux enjeux et transformations engag\u00e9es dans le cadre de la g\u00e9n\u00e9ralisation de la protection sociale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "BMCE Capital a annonc\u00e9 le\nlancement de CAP\u2019AI Reverse by...", "mass": 5, "physics": false, "shape": "box", "title": "BMCE Capital a annonc\u00e9 le lancement de CAP\u2019AI Reverse by BK, cinqui\u00e8me \u00e9dition de son programme d\u2019open innovation, dans la continuit\u00e9 des initiatives men\u00e9es ces derni\u00e8res ann\u00e9es, n. [lematin.ma]\n-------------------------------------------------\nBMCE Capital a annonc\u00e9, ce vendredi, le lancement de CAP\u2019AI Reverse by BK, la 5e \u00e9dition de son programme d\u2019open innovation. [leseco.ma]\n-------------------------------------------------\nCette nouvelle \u00e9dition s\u2019inscrit dans la continuit\u00e9 du programme Cap\u2019AI by BK et en constitue une \u00e9volution, avec une ambition renforc\u00e9e et une orientation plus op\u00e9rationnelle, indique BMCE Capital dans un communiqu\u00e9. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La c\u00e9r\u00e9monie d\u0027inauguration de cette\nstructure au sein du Complexe...", "mass": 5, "physics": false, "shape": "box", "title": "La c\u00e9r\u00e9monie d\u0027inauguration de cette structure au sein du Complexe Hospitalo-Universitaire International Mohammed VI de Rabat s\u2019est d\u00e9roul\u00e9e en pr\u00e9sence du ministre de la Sant\u00e9. [lematin.ma]\n-------------------------------------------------\nLa c\u00e9r\u00e9monie d\u2019inauguration de cette structure au sein du Complexe Hospitalo-Universitaire International Mohammed VI de Rabat s\u2019est d\u00e9roul\u00e9e en pr\u00e9sence du ministre de la Sant\u00e9 et de la Protection Sociale, Amine . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Risma, soci\u00e9t\u00e9 cot\u00e9e \u00e0 la\nBourse de Casablanca, a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Risma, soci\u00e9t\u00e9 cot\u00e9e \u00e0 la Bourse de Casablanca, a annonc\u00e9 la conclusion, le 2 avril 2026, d\u2019un contrat-cadre avec le groupe Accor portant sur la conversion au mod\u00e8le de franchise d. [lematin.ma]\n-------------------------------------------------\nRisma a conclu un nouveau contrat-cadre avec le groupe Accor portant sur la conversion au mod\u00e8le de franchise de 21 h\u00f4tels (hors Sofitel Agadir Thalassa) actuellement exploit\u00e9s sous mandat de gestion, avec une prise d\u2019effet imm\u00e9diate. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Chef du Gouvernement a\npr\u00e9sid\u00e9, ce jeudi 2 avril...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du Gouvernement a pr\u00e9sid\u00e9, ce jeudi 2 avril 2026 \u00e0 Rabat, la 10\u00e8me Commission Nationale des Investissements institu\u00e9e par la nouvelle Charte de l\u2019Investissement, op\u00e9rationn. [lematin.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9, jeudi \u00e0 Rabat, la 10\u00e8me Commission nationale des investissements institu\u00e9e par la nouvelle Charte de l\u2019investissement, op\u00e9rationnelle depuis mars 2023, conform\u00e9ment aux orientations du roi Mohammed VI. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9, jeudi \u00e0 Rabat, la 10e Commission nationale des investissements institu\u00e9e par la nouvelle Charte de l\u0027Investissement. [leseco.ma]\n-------------------------------------------------\nLe Chef du Gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9, jeudi \u00e0 Rabat, la 10\u00e8me Commission Nationale des Investissements institu\u00e9e par la nouvelle Charte de l\u2019Investissement, op\u00e9rationnelle depuis mars 2023, conform\u00e9ment aux Hautes Orientations de Sa Majest\u00e9 le Roi Mohammed VI. [www.lereporter.ma]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, a pr\u00e9sid\u00e9 \u00e0 Rabat la 10\u00e8me r\u00e9union de la Commission Nationale des Investissements (CNI), instance cl\u00e9 de pilotage de la nouvelle Charte de l\u2019investissement, entr\u00e9e en vigueur en mars 2023. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Cette nouvelle desserte vient renforcer\nla connectivit\u00e9 entre le Maroc...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle desserte vient renforcer la connectivit\u00e9 entre le Maroc et l\u2019Espagne, en \u00e9largissant l\u2019offre de la compagnie sur cette liaison durant la saison estivale, indique Rya. [lematin.ma]\n-------------------------------------------------\nLa compagnie a\u00e9rienne Ryanair a inaugur\u00e9, mardi, une nouvelle liaison a\u00e9rienne reliant Valence \u00e0 Rabat, \u00e0 raison de quatre vols hebdomadaires, dans le cadre de son programme pour l\u2019\u00e9t\u00e9 2026. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La capacit\u00e9 b\u00e9n\u00e9ficiaire annuelle de\nla cote casablancaise a atteint...", "mass": 5, "physics": false, "shape": "box", "title": "La capacit\u00e9 b\u00e9n\u00e9ficiaire annuelle de la cote casablancaise a atteint 50,9 milliards de dirhams (MMDH) en 2025, en croissance de 40% par rapport \u00e0 une ann\u00e9e auparavant, selon BMCE Capital Global Research (BKGR). [telquel.ma]\n-------------------------------------------------\nLa capacit\u00e9 b\u00e9n\u00e9ficiaire annuelle de la cote casablancaise a atteint 50,9 milliards de dirhams (MMDH) en 2025, en croissance de 40% par rapport \u00e0 une ann\u00e9e auparavant, selon BMCE Capital Global Research (BKGR). [leseco.ma]\n-------------------------------------------------\nLa capacit\u00e9 b\u00e9n\u00e9ficiaire annuelle de la cote casablancaise a atteint 50,9 milliards de dirhams (MMDH) en 2025, en croissance de 40% par rapport \u00e0 une ann\u00e9e auparavant, selon BMCE Capital Global Research (BKGR). [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Une r\u00e9union de la \u201ctask\nforce\u201d sur la coop\u00e9ration entre...", "mass": 5, "physics": false, "shape": "box", "title": "Une r\u00e9union de la \u201ctask force\u201d sur la coop\u00e9ration entre le Maroc et la France en perspective de la Coupe du monde 2030 a \u00e9t\u00e9 tenue, jeudi, au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [telquel.ma]\n-------------------------------------------------\nUne r\u00e9union de la task force sur la coop\u00e9ration entre le Maroc et la France en perspective du Mondial 2030 a \u00e9t\u00e9 tenue, jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nUne r\u00e9union de la Task Force sur la coop\u00e9ration entre le Maroc et la France en perspective de la Coupe du monde 2030 a \u00e9t\u00e9 tenue, jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nUne r\u00e9union de la Task Force sur la coop\u00e9ration entre le Maroc et la France en perspective de la Coupe du monde 2030 a \u00e9t\u00e9 tenue, jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [leseco.ma]\n-------------------------------------------------\nUne r\u00e9union de la Task Force sur la coop\u00e9ration entre le Maroc et la France en perspective de la Coupe du monde 2030 a \u00e9t\u00e9 tenue, jeudi au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Selon les donn\u00e9es pr\u00e9sent\u00e9es r\u00e9cemment\nlors de la r\u00e9union du...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les donn\u00e9es pr\u00e9sent\u00e9es r\u00e9cemment lors de la r\u00e9union du Conseil d\u2019administration de la Soci\u00e9t\u00e9 de d\u00e9veloppement local (SDL) Grand Agadir Transport et Mobilit\u00e9, ces investissements comportent 759 millions de dirhams. [telquel.ma]\n-------------------------------------------------\nLe volume des investissements r\u00e9alis\u00e9s dans le secteur de mobilit\u00e9 urbaine au niveau du Grand Agadir a d\u00e9pass\u00e9 un milliard de dirhams en 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Sous le th\u00e8me des \u00ab\nDialogues urbains \u00bb, l\u2019\u00e9v\u00e9nement place...", "mass": 5, "physics": false, "shape": "box", "title": "Sous le th\u00e8me des \u00ab Dialogues urbains \u00bb, l\u2019\u00e9v\u00e9nement place cette ann\u00e9e la transmission et la sc\u00e8ne marocaine au c\u0153ur de sa programmation, r\u00e9affirmant son ambition de faire de Rabat un mus\u00e9e \u00e0 ciel ouvert. [telquel.ma]\n-------------------------------------------------\nFid\u00e8le \u00e0 sa mission de transformer Rabat en un mus\u00e9e \u00e0 ciel ouvert, l\u2019\u00e9v\u00e9nement propose cette ann\u00e9e une programmation riche, pla\u00e7ant la transmission et la sc\u00e8ne marocaine au centre de ses \u00ab Dialogues urbains \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u2019Universit\u00e9 Mohammed VI Polytechnique et\nle Boston Consulting Group (BCG),...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Universit\u00e9 Mohammed VI Polytechnique et le Boston Consulting Group (BCG), \u00e0 travers son entit\u00e9 technologique BCG X, annoncent la signature d\u2019une convention visant \u00e0 renforcer leur partenariat. [www.challenge.ma]\n-------------------------------------------------\nL\u2019Universit\u00e9 Mohammed VI Polytechnique et le Boston Consulting Group (BCG), \u00e0 travers son entit\u00e9 technologique BCG X, annoncent la signature d\u2019une convention visant \u00e0 renforcer leur partenariat. [leseco.ma]\n-------------------------------------------------\nCe nouvel accord s\u2019inscrit dans une ambition commune de structuration d\u2019un \u00e9cosyst\u00e8me dynamique reliant formation, recherche et innovation, afin de contribuer durablement \u00e0 la transformation \u00e9conomique, technologique et . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le Conseil de gouvernement a\nadopt\u00e9 un projet de d\u00e9cret...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9 un projet de d\u00e9cret fixant le contenu et les modalit\u00e9s de gestion du registre des barrages, dans le cadre de la mise en \u0153uvre de la loi relative \u00e0 la s\u00e9curit\u00e9 des ouvrages hydrauliques et au renforcement de la transparence. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, le projet de d\u00e9cret n\u00b0 2.25.502 d\u00e9finissant le contenu du registre sp\u00e9cial des barrages, pr\u00e9sent\u00e9 par le ministre de l\u2019\u00c9quipement et de l\u2019Eau. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "En 2025, la BMCI affiche\nune forte performance financi\u00e8re, caract\u00e9ris\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "En 2025, la BMCI affiche une forte performance financi\u00e8re, caract\u00e9ris\u00e9e par une hausse de +28,9 % du r\u00e9sultat net consolid\u00e9 (atteignant 420 MDH) et un r\u00e9sultat net social en progression remarquable de +88,5 % \u00e0 550 MDH. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe BMCI a enregistr\u00e9, au 31 d\u00e9cembre 2025, un r\u00e9sultat net consolid\u00e9 de 420 millions de dirhams (MDH), en progression de 28,9% par rapport \u00e0 fin 2024. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le Conseil de gouvernement a\nadopt\u00e9 un projet de d\u00e9cret...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9 un projet de d\u00e9cret fixant les modalit\u00e9s d\u2019organisation de la profession d\u2019huissier de justice, dans le cadre de la mise en \u0153uvre de la r\u00e9forme introduite par la loi 46.21. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement a adopt\u00e9, jeudi, le projet de d\u00e9cret n\u00b0 2.25.885 portant application de la loi n\u00b0 46.21 relative \u00e0 l\u2019organisation de la profession d\u2019huissier de justice, pr\u00e9sent\u00e9 par le ministre de la Justice. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le Conseil de gouvernement a\nvalid\u00e9 la nomination d\u0027Aahd Oulad...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a valid\u00e9 la nomination d\u0027Aahd Oulad El Hassan en tant que directrice du Centre de s\u00e9rums et vaccins relevant de l\u2019Institut Pasteur. [www.lavieeco.com]\n------------------------------------------------ \u00e0 la souverainet\u00e9 de ces pays ou \u00e0 menacer leur s\u00e9curit\u00e9 et stabilit\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le Maroc a pu s\u2019imposer,\nen deux d\u00e9cennies, comme \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a pu s\u2019imposer, en deux d\u00e9cennies, comme \u00ab une plateforme incontournable \u00bb de l\u2019a\u00e9ronautique, avec l\u2019ambition de fabriquer un avion 100% marocain d\u2019ici 2030, rel\u00e8ve la cha\u00eene de t\u00e9l\u00e9vision internationale TV5 Monde. [atlasinfo.fr]\n-------------------------------------------------\n\u00abEn deux d\u00e9cennies, le Maroc s\u0027est impos\u00e9 comme une plateforme incontournable de l\u2019a\u00e9ronautique, capable de fabriquer 42% des composants d\u0027un avion. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La Mission diplomatique am\u00e9ricaine au\nMaroc a annonc\u00e9 le lancement...", "mass": 5, "physics": false, "shape": "box", "title": "La Mission diplomatique am\u00e9ricaine au Maroc a annonc\u00e9 le lancement d\u2019un concours de r\u00e9alisation de courts-m\u00e9trages ouverts aux jeunes marocains, dans le cadre de la comm\u00e9moration du 250e anniversaire de la fondation des \u00c9tats-Unis et de la c\u00e9l\u00e9bration des relations historiques unissant Rabat et Washington. [atlasinfo.fr]\n-------------------------------------------------\nLa Mission diplomatique am\u00e9ricaine au Maroc a annonc\u00e9 le lancement d\u2019un concours de r\u00e9alisation de courts-m\u00e9trages ouverts aux jeunes marocains, dans le cadre de la comm\u00e9moration du 250e anniversaire de la fondation des \u00c9tats-Unis et de la c\u00e9l\u00e9bration des relations historiques unissant Rabat et Washington. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Haut-Commissariat au Plan a\npubli\u00e9 une note d\u2019information relative...", "mass": 5, "physics": false, "shape": "box", "title": "Le Haut-Commissariat au Plan a publi\u00e9 une note d\u2019information relative aux indices du commerce ext\u00e9rieur au titre du quatri\u00e8me trimestre 2025, faisant \u00e9tat d\u2019une \u00e9volution contrast\u00e9e entre les prix \u00e0 l\u2019importation et \u00e0 l\u2019exportation. [lnt.ma]\n-------------------------------------------------\nLe Haut Commissariat au Plan (HCP), a indiqu\u00e9 que l\u2019indice des valeurs unitaires \u00e0 l\u2019importation a enregistr\u00e9 une baisse de 4,6% au cours du quatri\u00e8me trimestre 2025 par rapport au m\u00eame trimestre de 2024. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La chambre des crimes financiers\npr\u00e8s la Cour d\u2019appel de...", "mass": 5, "physics": false, "shape": "box", "title": "La chambre des crimes financiers pr\u00e8s la Cour d\u2019appel de Marrakech a prononc\u00e9, ce vendredi, des peines de prison ferme dans le dossier dit de la \u00ab vente de dipl\u00f4mes de masters \u00bb au sein de l\u2019Universit\u00e9 Ibn Zohr \u00e0 Agadir. [fr.hespress.com]\n-------------------------------------------------\nLa chambre de premi\u00e8re instance charg\u00e9e des crimes financiers pr\u00e8s la Cour d\u2019appel de Marrakech a condamn\u00e9 \u00e0 une peine de prison ferme Ahmed Kailech, professeur de l\u2019enseignement sup\u00e9rieur \u00e0 la Facult\u00e9 de droit relevant de l\u2019Universit\u00e9 Ibn Zohr d\u2019Agadir, dans l\u2019affaire de vente de dipl\u00f4mes de master. [telquel.ma]\n-------------------------------------------------\nUn professeur a \u00e9t\u00e9 condamn\u00e9 \u00e0 quatre ans de prison, ce vendredi par la chambre des crimes financiers de premi\u00e8re instance pr\u00e8s la Cour dappel de Marrakech, pour \u00abcorruption et abus dinfluence\u00bb. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nfait savoir qu\u2019un total de...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur a fait savoir qu\u2019un total de 73.640 tentatives d\u2019\u00e9migration irr\u00e9guli\u00e8re ont \u00e9t\u00e9 avort\u00e9es en 2025, mettant \u00e0 contribution la r\u00e9silience des dispositifs de surveillance des fronti\u00e8res et des littoraux. [fr.hespress.com]\n-------------------------------------------------\nEn 2025, le Royaume du Maroc a continu\u00e9 \u00e0 faire face \u00e0 une pression migratoire constante et grandissante dans un environnement r\u00e9gional instable et porteur de menaces plurielles, p. [lematin.ma]\n-------------------------------------------------\nUn total de 73.640 tentatives d\u2019\u00e9migration irr\u00e9guli\u00e8re ont \u00e9t\u00e9 avort\u00e9es en 2025, mettant \u00e0 contribution la r\u00e9silience des dispositifs de surveillance des fronti\u00e8res et des littoraux, selon des donn\u00e9es du minist\u00e8re de l\u2019Int\u00e9rieur. [telquel.ma]\n-------------------------------------------------\nUn total de 73.640 tentatives d\u2019\u00e9migration irr\u00e9guli\u00e8re ont \u00e9t\u00e9 avort\u00e9es en 2025, mettant \u00e0 contribution la r\u00e9silience des dispositifs de surveillance des fronti\u00e8res et des littoraux, selon des donn\u00e9es du minist\u00e8re de l\u2019Int\u00e9rieur. [aujourdhui.ma]\n-------------------------------------------------\nUn total de 73.640 tentatives d\u2019\u00e9migration irr\u00e9guli\u00e8re ont \u00e9t\u00e9 avort\u00e9es en 2025, mettant \u00e0 contribution la r\u00e9silience des dispositifs de surveillance des fronti\u00e8res et des littoraux, selon des donn\u00e9es du minist\u00e8re de l\u2019Int\u00e9rieur. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le Minist\u00e8re de la Justice\na mis en garde, ce...", "mass": 5, "physics": false, "shape": "box", "title": "Le Minist\u00e8re de la Justice a mis en garde, ce vendredi, contre la circulation de messages frauduleux redirigeant les citoyens vers un site usurpant son identit\u00e9, pr\u00e9tendant permettre le paiement des contraventions li\u00e9es aux infractions routi\u00e8res. [fr.hespress.com]\n-------------------------------------------------\nLe minist\u00e8re de la Justice a mis en garde les citoyens contre un faux site internet usurpant son identit\u00e9, apr\u00e8s la diffusion r\u00e9cente de SMS au sujet d\u2019un site de paiement des amendes li\u00e9es aux infractions routi\u00e8res constat\u00e9es par radar fixe. [telquel.ma]\n-------------------------------------------------\nLe Minist\u00e8re de la Justice Maroc a alert\u00e9 les citoyens sur la circulation d\u2019un site internet frauduleux usurpant l\u2019identit\u00e9 de ses services officiels de paiement des amendes li\u00e9es aux infractions routi\u00e8res. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Entre changement de mod\u00e8le op\u00e9rationnel\net lancement de projets d\u2019envergure,...", "mass": 5, "physics": false, "shape": "box", "title": "Entre changement de mod\u00e8le op\u00e9rationnel et lancement de projets d\u2019envergure, les deux partenaires s\u2019engagent \u00e0 contribuer durablement au d\u00e9veloppement du tourisme national. [www.lavieeco.com]\n-------------------------------------------------\nAccor et Risma ont annonc\u00e9, ce vendredi \u00e0 Casablanca, \u00e0 l\u0027occasion de la visite du Pr\u00e9sident-directe     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
