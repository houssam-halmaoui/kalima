p": 9, "id": "comm_label_9", "label": "Dans ce cadre, chaque banque\nest charg\u00e9e d\u2019informer ses collaborateurs...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce cadre, chaque banque est charg\u00e9e d\u2019informer ses collaborateurs ainsi que sa client\u00e8le de cette fermeture exceptionnelle, a indiqu\u00e9 un communiqu\u00e9 du groupement. [lematin.ma]\n-------------------------------------------------\nLe Groupement professionnel des banques du Maroc (GPBM) a annonc\u00e9, mardi, qu\u2019\u00e0 l\u2019occasion de l\u2019A\u00efd el-Fitr, le lundi 23 mars 2026 sera exceptionnellement jour f\u00e9ri\u00e9 dans l\u2019ensemble des \u00e9tablissements bancaires du Royaume. [telquel.ma]\n-------------------------------------------------\nLe Groupement Professionnel des Banques du Maroc (GPBM) a annonc\u00e9, mardi, qu\u2019\u00e0 l\u2019occasion de l\u2019A\u00efd el-Fitr, le lundi 23 mars 2026 sera exceptionnellement jour f\u00e9ri\u00e9 dans l\u2019ensemble des \u00e9tablissements bancaires du Royaume. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de A\u00efd Al-Fitr, le Groupement Professionnel des Banques du Maroc (GPBM) annonce que le lundi 23 mars 2026 est, \u00e0 titre exceptionnel, jour f\u00e9ri\u00e9 dans les banques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le partenariat strat\u00e9gique maroco-russe a\nconnu une \u00e9volution constante et...", "mass": 5, "physics": false, "shape": "box", "title": "Le partenariat strat\u00e9gique maroco-russe a connu une \u00e9volution constante et r\u00e9ussie au fil des ans et continue de gagner en dynamisme pour se projeter vers des perspectives plus larges, a soulign\u00e9 l\u2019ambassadeur de la F\u00e9d\u00e9ration de Russie au Maroc, Vladimir Baibakov. [telquel.ma]\n-------------------------------------------------\nLe partenariat strat\u00e9gique maroco-russe a connu une \u00e9volution constante et r\u00e9ussie au fil des ans et continue de gagner en dynamisme pour se projeter vers des perspectives plus larges, a soulign\u00e9 l\u2019ambassadeur de la F\u00e9d\u00e9ration de Russie au Maroc, Vladimir Baibakov. [www.lavieeco.com]\n-------------------------------------------------\nLe partenariat strat\u00e9gique maroco-russe a connu une \u00e9volution constante et r\u00e9ussie au fil des ans et continue de gagner en dynamisme pour se projeter vers des perspectives plus larges, a soulign\u00e9 l\u2019ambassadeur de la F\u00e9d\u00e9ration de Russie au Maroc, Vladimir Baibakov. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Wali de Bank Al-Maghrib,\nAbdellatif Jouahri, s\u2019est montr\u00e9 confiant,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Wali de Bank Al-Maghrib, Abdellatif Jouahri, s\u2019est montr\u00e9 confiant, mardi \u00e0 Rabat, quant \u00e0 la poursuite des activit\u00e9s des banques marocaines en Europe, \u00e0 la faveur de l\u2019accord conclu avec la France sur l\u2019application de la directive europ\u00e9enne CRD VI. [telquel.ma]\n-------------------------------------------------\nLe Wali de Bank Al-Maghrib, Abdellatif Jouahri, a exprim\u00e9 sa confiance mardi \u00e0 Rabat quant \u00e0 la poursuite des activit\u00e9s des banques marocaines en Europe, gr\u00e2ce \u00e0 laccord conclu avec la France concernant lapplication de la directive europ\u00e9enne CRD VI. [www.yabiladi.com]\n-------------------------------------------------\nLe Wali de Bank Al-Maghrib, Abdellatif Jouahri, s\u2019est montr\u00e9 confiant, mardi \u00e0 Rabat, quant \u00e0 la poursuite des activit\u00e9s des banques marocaines en Europe, \u00e0 la faveur de l\u2019accord conclu avec la France sur l\u2019application de la directive europ\u00e9enne CRD VI. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019indice des prix \u00e0 la\nconsommation (IPC) a enregistr\u00e9, en...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en f\u00e9vrier dernier, une baisse de 0,6% comparativement au m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nL\u0027indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en f\u00e9vrier dernier, une baisse de 0,6% comparativement au m\u00eame mois de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nCette \u00e9volution est la cons\u00e9quence de la baisse de l\u2019indice des produits alimentaires de 2% et de la hausse de celui des produits non alimentaires de 0,4%, selon le Haut-Commissariat au Plan. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le jury d\u2019appel de la\nConf\u00e9d\u00e9ration africaine de football (CAF)...", "mass": 5, "physics": false, "shape": "box", "title": "Le jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) a rendu, mardi 17 mars 2026, une d\u00e9cision qui rebat les cartes de la finale de la CAN 2025. [telquel.ma]\n-------------------------------------------------\nLe Jury d\u2019Appel de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) a annonc\u00e9, en application de l\u2019article 84 du r\u00e8glement de la Coupe d\u2019Afrique des Nations, la d\u00e9claration de forfait de l\u2019\u00e9quipe nationale du S\u00e9n\u00e9gal lors de la finale de la CAN Maroc 2025. [leseco.ma]\n-------------------------------------------------\nLe Jury d\u0027Appel de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) a act\u00e9 le forfait du S\u00e9n\u00e9gal au profit du Maroc pour la finale de la CAN 2025, une d\u00e9cision aux cons\u00e9quences juridiques et institutionnelles majeures pour le football africain. [atlasinfo.fr]\n-------------------------------------------------\nLe Jury d\u2019Appel de la Conf\u00e9d\u00e9ration Africaine de Football (CAF) a annonc\u00e9, en application de l\u2019article 84 du r\u00e8glement de la Coupe d\u2019Afrique des Nations, la d\u00e9claration de forfait de l\u2019\u00e9quipe nationale du S\u00e9n\u00e9gal lors de la finale de la CAN Maroc 2025. [www.lereporter.ma]\n-------------------------------------------------\nLe jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9cid\u00e9, mardi 17 mars, d\u2019annuler le r\u00e9sultat initial de la finale remport\u00e9e sur le terrain par le S\u00e9n\u00e9gal et de d\u00e9clarer le Maroc vainqueur de la comp\u00e9tition. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Face \u00e0 la flamb\u00e9e du\ncours du p\u00e9trole sur les...", "mass": 5, "physics": false, "shape": "box", "title": "Face \u00e0 la flamb\u00e9e du cours du p\u00e9trole sur les march\u00e9s internationaux et leur impact sur les prix des hydrocarbures au niveau national, le gouvernement met en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration qui avait \u00e9t\u00e9 mise en place. [telquel.ma]\n-------------------------------------------------\nLe gouvernement a d\u00e9cid\u00e9 de mettre en place une nouvelle op\u00e9ration d\u2019aide exceptionnelle consacr\u00e9e aux professionnels du secteur du transport de marchandises et des personnes, \u00e0 l\u2019instar de l\u2019op\u00e9ration initi\u00e9e en mars 2022. [www.lereporter.ma]\n-------------------------------------------------\nLe gouvernement a annonc\u00e9 la mise en place d\u2019une nouvelle op\u00e9ration d\u2019aide exceptionnelle destin\u00e9e aux professionnels du transport de marchandises et de personnes, dans un contexte marqu\u00e9 par la hausse des prix des hydrocarbures sur les march\u00e9s internationaux et ses r\u00e9percussions au niveau national. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Des averses orageuses localement fortes\navec risque de gr\u00eale, des...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses localement fortes avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses localement fortes avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]\n-------------------------------------------------\nDes averses orageuses localement fortes et de fortes rafales de vent avec chasse-poussi\u00e8res sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Maroc, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nDes averses orageuses localement fortes et de fortes rafales de vent avec chasse-poussi\u00e8res sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lavieeco.com]"}, {"borderWidth": 3, "fi         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
