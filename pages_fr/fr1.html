a]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des averses orageuses avec risque\nde gr\u00eale, des chutes de...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, des chutes de neige et de fortes rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [aujourdhui.ma]\n-------------------------------------------------\nDans un bulletin m\u00e9t\u00e9orologique d\u2019un niveau de vigilance orange, la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie pr\u00e9voit des averses orageuses jusqu\u2019\u00e0 65 mm, des chutes de neige pouvant atteindre 40 cm et de fortes rafales de vent. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Cit\u00e9 par l\u2019Agence de presse\nsaoudienne (SPA), le porte-parole officiel...", "mass": 5, "physics": false, "shape": "box", "title": "Cit\u00e9 par l\u2019Agence de presse saoudienne (SPA), le porte-parole officiel du minist\u00e8re de la D\u00e9fense, le g\u00e9n\u00e9ral de brigade Turki Al-Maliki, a indiqu\u00e9 que les drones ont \u00e9t\u00e9 intercept\u00e9s et d\u00e9truits. [telquel.ma]\n-------------------------------------------------\nCit\u00e9 par l\u2019Agence de presse saoudienne (SPA), le porte-parole officiel du minist\u00e8re de la D\u00e9fense, le g\u00e9n\u00e9ral de brigade Turki Al-Maliki, a indiqu\u00e9 que les drones ont \u00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {

                    window.labelUpdateTimeout = null;
                }, 100);
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';

                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
