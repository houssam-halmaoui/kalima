d": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le minist\u00e8re de l\u2019\u00c9quipement et\nde l\u2019Eau, l\u2019Union europ\u00e9enne, l\u2019Allemagne,...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, l\u2019Union europ\u00e9enne, l\u2019Allemagne, l\u2019Italie et la France ont lanc\u00e9 ce mardi 2 juin \u00e0 Rabat un programme d\u2019appui au Plan national de l\u2019eau (PNE) du Maroc, dot\u00e9 d\u2019une enveloppe de 3,7 milliards de dirhams (348 millions d\u2019euros). [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, l\u2019Union europ\u00e9enne (UE), l\u2019Allemagne, l\u2019Italie et la France, cheffe de file de ce co-financement, ont lanc\u00e9 conjointement, mardi 2 juin \u00e0 [www.challenge.ma]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, l\u2019Union europ\u00e9enne (UE), l\u2019Allemagne, la France et l\u2019Italie ont lanc\u00e9 conjointement, mardi \u00e0 Rabat, un programme de 348 millions d\u2019euros (3,7 milliards de dirhams) d\u2019appui \u00e0 la Politique nationale de l\u2019eau du Maroc. [aujourdhui.ma]\n-------------------------------------------------\nCe programme qui associe l\u0027UE, la France, l\u0027Allemagne et l\u0027Italie, cible quatre axes prioritaires, \u00e0 savoir, une meilleure connaissance des ressources en eau, une gestion renforc\u00e9e des ph\u00e9nom\u00e8nes extr\u00eames, la protection de la qualit\u00e9 de l\u0027eau et la pr\u00e9servation des eaux souterraines. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, l\u2019Union europ\u00e9enne (UE), l\u2019Allemagne, la France et l\u2019Italie ont lanc\u00e9 conjointement, mardi \u00e0 Rabat, un programme de 348 millions d\u2019euros (3,7 milliards de dirhams \u2013 MMDH) d\u2019appui \u00e0 la Politique nationale de l\u2019eau du Maroc. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Aux premi\u00e8res heures de ce\nmardi 2 juin, des \u00e9l\u00e9ments...", "mass": 5, "physics": false, "shape": "box", "title": "Aux premi\u00e8res heures de ce mardi 2 juin, des \u00e9l\u00e9ments du Service provincial de police judiciaire de Beni Mellal, en coordination avec la Direction g\u00e9n\u00e9rale de la surveillance territoriale (DGST), ont arr\u00eat\u00e9 six personnes, dont un mineur de 16 ans, soup\u00e7onn\u00e9es d\u2019agression sexuelle sur une femme. [telquel.ma]\n-------------------------------------------------\nLa police de B\u00e9ni Mellal, en coordination avec la Direction g\u00e9n\u00e9rale de la surveillance du territoire, ont interpell\u00e9 mardi matin six personnes, dont un mineur de 16 ans, soup\u00e7onn\u00e9es d\u2019\u00eatre impliqu\u00e9es dans une agression sexuelle visant une femme. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Agence du bassin hydraulique du\nSebou (ABHS) a annonc\u00e9 le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence du bassin hydraulique du Sebou (ABHS) a annonc\u00e9 le lancement d\u2019une \u00e9tude d\u2019interconnexion des bassins Ouergha, Lben et Inaouen, qui couvrent les provinces de Taounate et Taza. [telquel.ma]\n-------------------------------------------------\nElle consisterait en un transfert unidirectionnel des eaux depuis le sous-bassin de l\u2019Ouergha vers celui de l\u2019Inaouen, en passant par le sous-bassin de l\u2019oued Lben. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La compagni telquel.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 confirm\u00e9e apr\u00e8s une d\u00e9faite contre l\u2019\u00e9quipe \u00e9gyptienne, qui s\u2019est sold\u00e9e par un score de 2 buts \u00e0 0 lors du match de classement, disput\u00e9 lundi soir au . [atlasinfo.fr]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc de football a termin\u00e9 \u00e0 la quatri\u00e8me place de la Coupe d\u2019Afrique des Nations U17 (Maroc-2026), apr\u00e8s sa d\u00e9faite face \u00e0 son homologue \u00e9gyptienne sur le score de 2 buts \u00e0 0, lors du match de classement, disput\u00e9 lundi soir au Complexe Mohammed VI de football \u00e0 Sal\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le ministre de la Sant\u00e9\net de la Protection sociale,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, a indiqu\u00e9, lundi \u00e0 Rabat, que son D\u00e9partement adopte des solutions d\u2019Intelligence artificielle (IA) pour renforcer le diagnostic pr\u00e9coce dans les \u00e9tablissements de sant\u00e9. [telquel.ma]\n-------------------------------------------------\nQuelque 530 m\u00e9decins sp\u00e9cialistes seront affect\u00e9s dans les diff\u00e9rentes r\u00e9gions du Maroc d\u00e8s l\u2019obtention de leurs dipl\u00f4mes \u00e0 compter d\u2019ao\u00fbt prochain, dans le cadre du renforcement de l\u2019offre de soins au sein des h\u00f4pitaux publics, a indiqu\u00e9 lundi \u00e0 Rabat le ministre de la Sant\u00e9 et de la Protection sociale, Amine Tahraoui. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, a annonc\u00e9 lundi \u00e0 Rabat une s\u00e9rie de mesures destin\u00e9es \u00e0 renforcer l\u2019offre de soins dans les h\u00f4pitaux publics et \u00e0 acc\u00e9l\u00e9rer la modernisation du syst\u00e8me de sant\u00e9 national. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019\u00e9volution des prix du gasoil\net de l\u2019essence sur le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9volution des prix du gasoil et de l\u2019essence sur le march\u00e9 national a refl\u00e9t\u00e9 de mani\u00e8re globalement proche les variations enregistr\u00e9es sur les march\u00e9s internationaux entre le 1er mars et le 16 mai 2026, selon le Conseil de la concurrence. [telquel.ma]\n-------------------------------------------------\nAlors que les prix des carburants continuent d\u2019alimenter le d\u00e9bat public au Maroc, le Conseil de la concurrence vient de publier une nouvelle note consacr\u00e9e \u00e0 l\u2019\u00e9volution des prix du gasoil et de l\u2019essence entre le 1er mars et le 16 mai 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le chiffre d\u2019affaires d\u2019Auto Nejma\nMaroc s\u2019est \u00e9tabli \u00e0 815...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires d\u2019Auto Nejma Maroc s\u2019est \u00e9tabli \u00e0 815 millions de dirhams (MDH) au premier trimestre (T1) 2026, en hausse de 3% comparativement \u00e0 la m\u00eame p\u00e9riode [www.challenge.ma]\n-------------------------------------------------\nLe chiffre d\u0027affaires (CA) d\u0027Auto Nejma Maroc s\u0027est \u00e9tabli \u00e0 815 millions de dirhams (MDH) au premier trimestre 2026, en hausse de 3% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "L\u2019Agence nationale des eaux et                     continue;

                    communities[groupId].y += node.y;
