, "y": 0}, {"font": {"vadjust": -70.5}, "group": 8, "id": 302, "label": "Oriental : La 7\u00e8me \u00e9dition...", "shape": "dot", "size": 47, "title": "Oriental : La 7\u00e8me \u00e9dition de \u00ab\u00a0Meet the Lead\u00a0\u00bb pr\u00e9vue les 19 et 20 d\u00e9cembre \u00e0 Oujda\nSource: lnt.ma", "url": "https://lnt.ma/oriental-la-7eme-edition-de-meet-the-lead-prevue-les-19-et-20-decembre-a-oujda/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Ministre de l\u2019Agriculture, de\nla P\u00eache Maritime, du D\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "Le Ministre de l\u2019Agriculture, de la P\u00eache Maritime, du D\u00e9veloppement Rural et des Eaux et For\u00eats, M. Ahmed El Bouari, a pr\u00e9sid\u00e9, le mercredi 26 novembre, l\u2019ouverture officielle de la premi\u00e8re \u00e9dition du Salon National des Agrumes \u00e0 Sidi Kacem, organis\u00e9e du 26 au 29 novembre 2025 sous le th\u00e8me: \u00ab La fili\u00e8re des agrumes . [fr.hespress.com]\n-------------------------------------------------\nLe coup d\u2019envoi de la premi\u00e8re \u00e9dition du Salon National des Agrumes a \u00e9t\u00e9 donn\u00e9 mercredi 26 novembre \u00e0 Sidi Kacem par le ministre de l\u2019Agriculture, de la P\u00eache Maritime, du D\u00e9velo. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le documentaire Fatna, une femme\nnomm\u00e9e Rachid fera ses premiers...", "mass": 5, "physics": false, "shape": "box", "title": "Le documentaire Fatna, une femme nomm\u00e9e Rachid fera ses premiers pas devant le public lors de la 22\u1d49 \u00e9dition du Festival International du Film de Marrakech (FIFM), pr\u00e9vue du 28 novembre au 6 d\u00e9cembre. [fr.hespress.com]\n-------------------------------------------------\nCin\u00e9ma Dans le cadre de la 22\u00e8me \u00e9dition du Festival international du film de Marrakech, le documentaire \u00abFatna, une femme nomm\u00e9e Rachid\u00bb sera projet\u00e9 en premi\u00e8re mondiale le 3 d\u00e9cembre. [aujourdhui.ma]\n-------------------------------------------------\nLe documentaire \u00abFatna, une femme nomm\u00e9e Rachid\u00bb fera partie de la programmation de la 22e \u00e9dition du Festival international du film de Marrakech (FIFM), qui se tient du 28 novembr. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "S\u0027inscrivant dans le cadre de\nla strat\u00e9gie de l\u0027Office pour...", "mass": 5, "physics": false, "shape": "box", "title": "S\u0027inscrivant dans le cadre de la strat\u00e9gie de l\u0027Office pour le renforcement du r\u00e9seau national de transport d\u2019\u00e9lectricit\u00e9 et de son r\u00f4le cl\u00e9 dans la transition \u00e9nerg\u00e9tique. [lematin.ma]\n-------------------------------------------------\nCe projet s\u0027inscrit dans le cadre de la strat\u00e9gie de renforcement du r\u00e9seau national de transport d\u2019\u00e9lectricit\u00e9 pour acc\u00e9l\u00e9rer la transition \u00e9nerg\u00e9tique du Royaume. [www.lopinion.ma]\n-------------------------------------------------\nL\u0027Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) vient de lancer un avis de pr\u00e9-qualification des constructeurs pour la r\u00e9alisation de lignes \u00e9lectriques Ultra Haute Tension \u00e0 courant alternatif (UHT), destin\u00e9es \u00e0 assurer le transport de l\u2019\u00e9lectricit\u00e9 sur une distance d\u0027environ 1.000 km, reliant les zones de Boujdour et de Tensift. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Par ce vote, le Parlement\neurop\u00e9en ent\u00e9rine l\u2019acte d\u00e9l\u00e9gu\u00e9 pr\u00e9se Europ\u00e9en a rejet\u00e9, ce mercredi, une \u201cmotion d\u2019objection\u201d introduite par certains milieux de droite et d\u2019extr\u00eame droite, contre le projet d\u2019acte d\u00e9l\u00e9gu\u00e9 pr\u00e9sent\u00e9 par la Commission Europ\u00e9enne dans le cadre de la mise en \u0153uvre de ses engagements d\u00e9coulant de l\u2019Accord sous forme d\u2019Echange de lettres conclu entre le Maroc et l\u2019UE le [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le 24 novembre 2025, ses\ndirigeants, Karim Bernoussi et Youssef...", "mass": 5, "physics": false, "shape": "box", "title": "Le 24 novembre 2025, ses dirigeants, Karim Bernoussi et Youssef El Aoufir, ont sign\u00e9 un accord de reprise. [lematin.ma]\n-------------------------------------------------\nLes actionnaires dirigeants d\u2019Intelcia, \u00e0 savoir les co-fondateurs Karim Bernoussi et Youssef El Aoufir, d\u00e9tiennent d\u00e9sormais 100% des parts de la soci\u00e9t\u00e9, apr\u00e8s un accord convenu, le 24 [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le\nminist\u00e8re de la Transition \u00e9nerg\u00e9tique...", "mass": 5, "physics": false, "shape": "box", "title": "Ce troph\u00e9e, d\u00e9cern\u00e9 par le minist\u00e8re de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, la Wilaya et le Conseil de la R\u00e9gion Souss-Massa ainsi que la CGEM Souss-Massa, r\u00e9com. [lematin.ma]\n-------------------------------------------------\nL\u2019entreprise a remport\u00e9 le Troph\u00e9e Climat 2025, cat\u00e9gorie Agriculture, d\u00e9cern\u00e9 par le Minist\u00e8re de la Transition \u00e9nerg\u00e9tique, la Wilaya, la R\u00e9gion Souss-Massa et la CGEM locale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La BMCI, filiale du Groupe\nBNP Paribas, a officialis\u00e9 ce...", "mass": 5, "physics": false, "shape": "box", "title": "La BMCI, filiale du Groupe BNP Paribas, a officialis\u00e9 ce 26 novembre 2025 la nomination de S\u00e9bastien Rollet au poste de Secr\u00e9taire G\u00e9n\u00e9ral. [lematin.ma]\n-------------------------------------------------\nLa BMCI annonce la nomination de S\u00e9bastien Rollet en qualit\u00e9 de Secr\u00e9taire g\u00e9n\u00e9ral, \u00e0 compter du 1er octobre 2025. [www.challenge.ma]\n-------------------------------------------------\nLa BMCI a annonc\u00e9 la nomination de S\u00e9bastien Rollet en qualit\u00e9 de Secr\u00e9taire g\u00e9n\u00e9ral \u00e0 compter du 1er octobre 2025. [leseco.ma]\n-------------------------------------------------\nLa BMCI a annonc\u00e9, mercredi 26 novembre 2025 \u00e0 Casablanca, la nomination de S\u00e9bastien Rollet au poste de Secr\u00e9taire g\u00e9n\u00e9ral, \u00e0 compter du 1er octobre 2025, sous r\u00e9serve de la validation des autorit\u00e9s comp\u00e9tentes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Lors de son passage \u00e0\nla Chambre des conseillers, mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de son passage \u00e0 la Chambre des conseillers, mardi 25 novembre, le chef du gouvernement Aziz Akhannouch a annonc\u00e9 que l\u2019ex\u00e9cutif appliquera, d\u00e8s la fin de ce mois, une hausse de l\u2019aide sociale directe, sans toucher au prix du gaz butane. [telquel.ma]\n-------------------------------------------------\nDans le cadre des efforts du gouvernement visant la mise en \u0153uvre progressive de l\u2019aide sociale directe et le renforcement de son impact sur le niveau de vie des familles b\u00e9n\u00e9ficiaires, la premi\u00e8re augmentation des montants du soutien entrera en vigueur \u00e0 compter de fin novembre courant, sans modification du prix du gaz butane, a annonc\u00e9 mardi \u00e0 la Chambre des conseillers, le chef du gouvernement, Aziz Akhannouch. [www.yabiladi.com]\n-------------------------------------------------\nAnnonc\u00e9e par le chef du gouvernement, Aziz Akhannouch, la premi\u00e8re augmentation des montants d\u2019aide sociale directe entrera en vigueur d\u00e8s la fin du mois de novembre. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le chef du gouvernement, Aziz\nAkhannouch, s\u2019est entretenu, mercredi \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch, s\u2019est entretenu, mercredi \u00e0 Rabat, avec le pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement (BAD), Sidi Ould Tah, sur les moyens de promouvoir le partenariat entre le Maroc et l\u2019institution financi\u00e8re. [telquel.ma]\n-------------------------------------------------\nLe Chef du gouvernement, M. Aziz Akhannouch a eu, mercredi 26 novembre 2025 \u00e0 Rabat, des entretiens avec M. Sidi Ould Tah, pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement qui ont \u00e9t\u00e9 l\u2019occasion de prospecter les moyens promouvoir le partenariat privil\u00e9gi\u00e9 entre le Royaume du Maroc et le Groupe de la Banque Africaine . [aujourdhui.ma]\n-------------------------------------------------\nLe pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement (BAD), Sidi Ould Tah, a salu\u00e9, mercredi \u00e0 Rabat, le soutien constant de Sa Majest\u00e9 le Roi Mohammed VI, \u00e0 l\u2019Institution financi\u00e8re panafricaine. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz Akhannouch, s\u0027est entretenu, ce mercredi \u00e0 Rabat, avec le pr\u00e9sident du Groupe de la Banque Africaine de D\u00e9veloppement (BAD), Sidi Ould Tah, sur les moyens de promouvoir le partenariat privil\u00e9gi\u00e9 entre le Maroc et l\u0027Institution financi\u00e8re. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les travaux de la 93e\nsession de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "Les travaux de la 93e session de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (OIPC-INTERPOL) touchent \u00e0 leur fin \u00e0 Marrakech, apr\u00e8s une semaine de d\u00e9bats et d\u2019\u00e9changes entre hauts responsables et chefs de police des 196 pays membres de l\u2019Organisation. [telquel.ma]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, Abdellatif Hammouchi, et la d\u00e9l\u00e9gation l\u2019accompagnant, ont tenu 43 rencontres bilat\u00e9rales avec les chefs des d\u00e9l\u00e9gations des pays et organisations internationales participant \u00e0 l\u2019Assembl\u00e9e G\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (OIPC-INTERPOL), qui se tient du 24 au 27 novembre \u00e0 Marrakech. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "Une deuxi\u00e8me mention au casier\njudiciaire de l\u2019ex-pr\u00e9sident, avant d\u2019affronter...", "mass": 5, "physics": false, "shape": "box", "title": "Une deuxi\u00e8me mention au casier judiciaire de l\u2019ex-pr\u00e9sident, avant d\u2019affronter le proc\u00e8s libyen en appel : la Cour de cassation a rendu d\u00e9finitive mercredi la condamnation de Nicolas Sarkozy dans l\u2019affaire Bygmalion en rejetant son pourvoi. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s une courte incarc\u00e9ration \u00e0 la prison de la Sant\u00e9 dans l\u2019affaire libyenne, l\u2019ex-pr\u00e9sident fran\u00e7ais a vu la Cour de cassation confirmer, ce mercredi, sa condamnation \u00e0 un an de prison dans le dossier Bygmalion. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La 3e \u00e9dition des \u201cRendez-vous\nde la photo d\u2019Essaouira\u201d, un...", "mass": 5, "physics": false, "shape": "box", "title": "La 3e \u00e9dition des \u201cRendez-vous de la photo d\u2019Essaouira\u201d, un \u00e9v\u00e9nement visant \u00e0 cr\u00e9er un espace d\u2019\u00e9change entre photographes professionnels, amateurs et passionn\u00e9s, se tiendra du 27 au 30 novembre, \u00e0 l\u2019initiative de l\u2019Institut fran\u00e7ais de la Cit\u00e9 des Aliz\u00e9s. [telquel.ma]\n-------------------------------------------------\nLa 3\u00e8me \u00e9dition des \u00abRendez-vous de la photo d\u2019Essaouira\u00bb, un \u00e9v\u00e9nement visant \u00e0 cr\u00e9er un espace d\u2019\u00e9change entre photographes professionnels, amateurs et passionn\u00e9s, se tiendra du 27 au 30 novembre, \u00e0 l\u2019initiative de l\u2019Institut fran\u00e7ais de la Cit\u00e9 des Aliz\u00e9s. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Mohamed Sa\u00e2d Berrada : en\nr\u00e8gle sur la proc\u00e9dure, rattrap\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Sa\u00e2d Berrada : en r\u00e8gle sur la proc\u00e9dure, rattrap\u00e9 par de nouvelles accusations. [telquel.ma]\n-------------------------------------------------\nMis en cause pour un \u00e9ventuel conflit d\u2019int\u00e9r\u00eats dans un march\u00e9 d\u2019approvisionnement en chlorure de potassium attribu\u00e9 \u00e0 une soci\u00e9t\u00e9 li\u00e9e \u00e0 sa famille, le ministre es rencontres, tenues \u00e0 la demande des d\u00e9l\u00e9gations des pays et organisations internationales et r\u00e9gionales participant \u00e0 cette Assembl\u00e9e g\u00e9n\u00e9rale, ont \u00e9t\u00e9 l\u0027occasion de discut. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "La Caisse Mutuelle Interprofessionnelle Marocaine\n(CMIM) organise, en partenariat avec...", "mass": 5, "physics": false, "shape": "box", "title": "La Caisse Mutuelle Interprofessionnelle Marocaine (CMIM) organise, en partenariat avec la Marocaine des Jeux et des Sports (MDJS), le mercredi 3 d\u00e9cembre 2025 \u00e0 Casablanca, la 12\u1d49 \u00e9dition de la Journ\u00e9e Sant\u00e9 au Travail, plac\u00e9e sous le th\u00e8me : \u00ab Intelligence des donn\u00e9es et sant\u00e9 globale : l\u2019alliance pour la performance et le bien-\u00eatre au travail \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLa Caisse Mutuelle Interprofessionnelle Marocaine (CMIM) organise, en partenariat avec la Marocaine des Jeux et des Sports (MDJS), la 12\u1d49 \u00e9dition de la Journ\u00e9e Sant\u00e9 au Travail, pr\u00e9vue le mercredi 3 d\u00e9cembre 2025 \u00e0 Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "En r\u00e9ponse \u00e0 une question\ncentrale sur \u00ab le d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "En r\u00e9ponse \u00e0 une question centrale sur \u00ab le d\u00e9veloppement territorial et les enjeux de la justice spatiale \u00bb, Aziz Akhannouch a indiqu\u00e9 que ce programme est fond\u00e9 sur l\u2019accompagnement des zones rurales et montagneuses lors des op\u00e9rations et programmes de r\u00e9habilitation territoriale. [www.lavieeco.com]\n-------------------------------------------------\nLe Chef du gouvernement, Aziz         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
