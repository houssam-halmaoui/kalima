du ministre de l\u2019Industrie et du Commerce, Ryad Mezzour, et du pr\u00e9sident de la CGEM, Chakib Alj. [www.lavieeco.com]\n-------------------------------------------------\nLa troisi\u00e8me \u00e9dition de la Journ\u00e9e nationale de l\u2019industrie, organis\u00e9e les 3 et 4 novembre 2025 \u00e0 Rabat, a \u00e9t\u00e9 marqu\u00e9e d\u00e8s sa premi\u00e8re journ\u00e9e par la signature de cinq conventions d\u00e9di\u00e9es \u00e0 la promotion de l\u2019industrie \u201cMade in Morocco\u201d. [leseco.ma]\n-------------------------------------------------\nEn marge de la 3\u00e8me Journ\u00e9e Nationale de l\u2019Industrie tenue les 3 et 4 novembre \u00e0 Rabat, M.Nassim Belkhayat, le patron de Neo Motors Maroc, a bien voulu nous expliquer les ambitions du groupe, mais surtout les enjeux de l\u2019industrie automobile \u00ab Made In Morocco \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Tenue pour la deuxi\u00e8me ann\u00e9e\ncons\u00e9cutive \u00e0 Casablanca, la 4e...", "mass": 5, "physics": false, "shape": "box", "title": "Tenue pour la deuxi\u00e8me ann\u00e9e cons\u00e9cutive \u00e0 Casablanca, la 4e \u00e9dition de l\u2019African Financial Summit (AFIS) prolonge l\u2019\u00e9lan initi\u00e9 l\u2019an dernier. [leseco.ma]\n-------------------------------------------------\nLes participants \u00e0 un panel, tenu lundi \u00e0 Casablanca dans le cadre de l\u2019Africa Financial Summit (AFIS 2025), ont soulign\u00e9 que la souverainet\u00e9 \u00e9conomique durable du continent passe par la lib\u00e9ration de son \u00e9pargne, l\u2019int\u00e9gration de ses march\u00e9s et la confiance entre ses acteurs. [www.lereporter.ma]\n-------------------------------------------------\nCasablanca accueille, les 3 et 4 novembre, la cinqui\u00e8me \u00e9dition de l\u2019Africa Financial Summit (AFIS), sous le th\u00e8me \u00ab Lib\u00e9rons la puissance financi\u00e8re de l\u2019Afrique \u2013 Il est temps de mobiliser \u00e0 grande \u00e9chelle les capitaux nationaux \u00bb. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Le Royaume du Maroc a\nsu mettre en place une...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a su mettre en place une base industrielle solide dans le domaine de l\u2019a\u00e9ronautique pour jouer un r\u00f4le cl\u00e9 dans la cha\u00eene d\u2019approvisionnement mondiale, a relev\u00e9, lundi \u00e0 Rabat, le Secr\u00e9taire G\u00e9n\u00e9ral de l\u2019AACO (Arab Air Carriers\u2019 Organization \u2013 Organisation des transporteurs a\u00e9riens arabes), Abdul Wahab Teffaha. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc a su mettre en place une base industrielle solide dans le domaine de l\u2019a\u00e9ronautique pour jouer un r\u00f4le cl\u00e9 dans la cha\u00eene d\u2019approvisionnement mondiale, a relev\u00e9, lundi \u00e0 Rabat, le Secr\u00e9taire G\u00e9n\u00e9ral de l\u2019AACO (Arab Air Carriers\u2019 Organization \u2013 Organisation des transporteurs a\u00e9riens arabes), Abdul Wahab Teffaha. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019\u00e9conomie marocaine a enregistr\u00e9 la\ncr\u00e9ation nette de 167.000 emplois...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9conomie marocaine a enregistr\u00e9 la cr\u00e9ation nette de 167.000 emplois entre le troisi\u00e8me trimestre de 2024 et celui de 2025, dont 164.000 en milieu urbain et 3.000 en milieu rural, selon la note d\u2019information du Haut-Commissariat au Plan (HCP) sur la situation du march\u00e9 du travail. [lnt.ma]\n-------------------------------------------------\nSelon la note du Haut-Commissariat au Plan (HCP) relative au troisi\u00e8me trimestre 2025, le ch\u00f4mage recule l\u00e9g\u00e8rement, mais le sous-emploi atteint son niveau le plus \u00e9lev\u00e9 depuis trois ans, traduisant les tensions persistantes sur la qualit\u00e9 de l\u2019emploi. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Trois nageurs passionn\u00e9s: Dino Sebti,\nS\u00e9bastien Deflandre et Nadia Ben...", "mass": 5, "physics": false, "shape": "box", "title": "Trois nageurs passionn\u00e9s: Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 relever un d\u00e9fi hors du commun : parcourir 100 kilom\u00e8tres \u00e0 la nage autour de la lagune, du 3 au 6 novembre . [lnt.ma]\n-------------------------------------------------\nTrois nageurs passionn\u00e9s, Dino Sebti, S\u00e9bastien Deflandre et Nadia Ben Bahtane, s\u2019appr\u00eatent \u00e0 repousser leurs limites pour rendre hommage \u00e0 cet \u00e9v\u00e9nement historique \u00e0 travers une aventure in\u00e9dite : \u00ab La Nage Verte \u00bb. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Roi Mohammed VI a\nre\u00e7u, mardi au Palais Royal...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a re\u00e7u, mardi au Palais Royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [fr.hespress.com]\n-------------------------------------------------\nIl s\u2019agit de : Walis \u00e0 l\u2019Administration territoriale : -M. Khatib El Hebil, Wali de la r\u00e9gion Marrakech-Safi, gouverneur de la pr\u00e9fecture de Marrakech.-M. Khalid Ait Taleb, Wali de. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI, a re\u00e7u, mardi au Palais royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [telquel.ma]\n-------------------------------------------------\nLe roi Mohammed VI a re\u00e7u, mardi au Palais royal de Rabat, les nouveaux walis et gouverneurs nomm\u00e9s au niveau de l\u2019Administration territoriale. [www.yabiladi.com]\n-------------------------------------------------\nAu cours de cette audience, les gouverneurs nouvellement nomm\u00e9s ont pr\u00eat\u00e9 serment devant Sa Majest\u00e9 le Roi. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Cette convention vise la r\u00e9alisation\nde projets int\u00e9gr\u00e9s de production...", "mass": 5, "physics": false, "shape": "box", "title": "Cette convention vise la r\u00e9alisation de projets int\u00e9gr\u00e9s de production d\u2019\u00e9lectricit\u00e9 \u00e0 partir des \u00e9nergies renouvelables, dans le cadre des efforts du gouvernement pour renforcer l\u2019efficacit\u00e9 . [fr.hespress.com]\n-------------------------------------------------\nLe chef du gouvernement Aziz Akhannouch a pr\u00e9sid\u00e9, lundi 3 novembre \u00e0 Rabat, la c\u00e9r\u00e9monie de signature d\u2019une convention visant \u00e0 acc\u00e9l\u00e9rer la mise \u00e0 disposition de 5 gigawatts d\u2019\u00e9lectricit\u00e9 verte au profit de l\u2019industrie marocaine d\u2019ici 2030, tout en rationalisant les co\u00fbts sur l\u2019ensemble de la cha\u00eene de valeur et en assurant un partage \u00e9quitable. [telquel.ma]\n-------------------------------------------------\nUne convention relative \u00e0 des projets de production d\u2019\u00e9lectricit\u00e9 \u00e0 partir des \u00e9nergies renouvelables a \u00e9t\u00e9 sign\u00e9e, lundi \u00e0 Rabat, sous la pr\u00e9sidence du chef du gouvernement, Aziz Akhannouch. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019ONDA lance l\u2019appel d\u2019offres pour\nle futur terminal HUB de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ONDA lance l\u2019appel d\u2019offres pour le futur terminal HUB de l\u2019a\u00e9roport Casablanca Mohammed V. Apr\u00e8s un appel \u00e0 manifestation d\u2019int\u00e9r\u00eat international en mai dernier, l\u2019ONDA enclenche la vitesse sup\u00e9rieure en ouvrant l\u2019appel d\u2019offres pour d\u00e9signer le constructeur ou groupemen. [lematin.ma]\n-------------------------------------------------\nL\u0027ONDA lance l\u0027appel d\u0027offres pour le nouveau terminal de l\u0027a\u00e9roport Casablanca Mohammed V. L\u2019Office national des a\u00e9roports a lanc\u00e9 l\u2019appel d\u2019offres pour la construction du nouveau terminal hub de l\u2019a\u00e9roport Casablanca Mohammed V, apr\u00e8s le lancement, en mai dernier, d\u2019un appel \u00e0 manifestation international, selon un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\nL\u2019Office national des a\u00e9roports (ONDA) a lanc\u00e9 un appel d\u2019offres pour la construction du futur terminal HUB de l\u2019a\u00e9roport Casablanca Mohammed V, engageant l\u2019une des plus grandes op\u00e9rations de construction de son histoire et confirmant sa dynamique de transformation. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Cap Hospitality illustre la force\ndu partenariat public-priv\u00e9 dans le...", "mass": 5, "physics": false, "shape": "box", "title": "Cap Hospitality illustre la force du partenariat public-priv\u00e9 dans le secteur touristique. [lematin.ma]\n-------------------------------------------------\nCe programme de financement pour la mise \u00e0 niveau des h\u00f4tels, a enregistr\u00e9, \u00e0 ce jour, 91 demandes \u00e9ligibles repr\u00e9sentant 14.000 chambres et un investissement global de 7 MMDH, dont une soixantaine de dossiers d\u00e9j\u00e0     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
