 Jorf Fertilizers Company I (JFC I), filiale d\u2019OCP Nutricrops. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019unique r\u00e9alisation de la rencontre\na \u00e9t\u00e9 inscrite par Ferran...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019unique r\u00e9alisation de la rencontre a \u00e9t\u00e9 inscrite par Ferran Torres \u00e0 la 106e minute de jeu, offrant \u00e0 la Roja un sacre mondial au terme d\u2019une. [telquel.ma]\n-------------------------------------------------\nL\u2019unique r\u00e9alisation de la rencontre a \u00e9t\u00e9 inscrite par Ferran Torres \u00e0 la 106e minute de jeu, offrant \u00e0 la Roja un sacre mondial au terme d\u2019une . [aujourdhui.ma]\n-------------------------------------------------\n), dimanche au Stade de New York New Jersey, au terme d\u2019une finale peu spectaculaire mais largement ma\u00eetris\u00e9e par la Roja, dont le r\u00e9cital a \u00e9t\u00e9 r\u00e9compens\u00e9 par un but de Ferran Torres \u00e0 la 106e minute. [atlasinfo.fr]\n-------------------------------------------------\nSeize ans apr\u00e8s son premier sacre historique en Afrique du Sud, la Roja a d\u00e9croch\u00e9, dimanche \u00e0 New Jersey, sa deuxi\u00e8me Coupe du monde en s\u2019imposant 1-0 apr\u00e8s prolongation face \u00e0 l\u2019Argentine, championne en titre. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Mohammed R\u00e9da Lahmini, membre du\nBureau de la Chambre des...", "mass": 5, "physics": false, "shape": "box", "title": "Mohammed R\u00e9da Lahmini, membre du Bureau de la Chambre des conseillers, a \u00e9t\u00e9 \u00e9lu pr\u00e9sident de la Commission des affaires \u00e9conomiques, sociales et environnementales de l\u2019Assembl\u00e9e parlementaire de [www.challenge.ma]\n-------------------------------------------------\nD ne infrastructure \u00e9nerg\u00e9tique de pr\u00e8s de 6.800 kilom\u00e8tres destin\u00e9e \u00e0 [www.lereporter.ma]\n-------------------------------------------------\nLe projet de Gazoduc Afrique Atlantique Nigeria-Maroc a franchi une nouvelle \u00e9tape avec la signature, dimanche \u00e0 Freetown, en Sierra Leone, de l\u2019Accord intergouvernemental (IGA) par les \u00c9tats membres de la Communaut\u00e9 \u00e9conomique des \u00c9tats de l\u2019Afrique de l\u2019Ouest (CEDEAO). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Coupe du monde 2026,\nmarqu\u00e9e par les superlatifs du...", "mass": 5, "physics": false, "shape": "box", "title": "La Coupe du monde 2026, marqu\u00e9e par les superlatifs du d\u00e9but \u00e0 la fin, se termine ce dimanche avec un choc au sommet entre l\u2019Argentine et l\u2019Espagne, deux s\u00e9lections aux profils radicalement diff\u00e9rents. [lnt.ma]\n-------------------------------------------------\nDos tourn\u00e9 au podium lors du sacre espagnol, tensions sur la pelouse et silence complet devant les m\u00e9dias : le comportement de plusieurs membres de l\u2019Albiceleste apr\u00e8s la rencontre . [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le d\u00e9ficit commercial devrait marquer\nun creusement en 2026, passant...", "mass": 5, "physics": false, "shape": "box", "title": "Le d\u00e9ficit commercial devrait marquer un creusement en 2026, passant de 20,5% du produit int\u00e9rieur brut (PIB) \u00e0 21,9%, avant de s\u2019all\u00e9ger \u00e0 21,1% en 2027, selon le Haut-Commissariat au Plan (HCP). [fr.hespress.com]\n-------------------------------------------------\nLes d\u00e9penses globales de l\u2019Etat devraient poursuivre leur trajectoire haussi\u00e8re pour s\u2019\u00e9tablir \u00e0 pr\u00e8s de 28,1% du PIB en 202                     continue;

        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
