es hors raffinage de p\u00e9trole \u00bb a enregistr\u00e9, en novembre 2025, une hausse de 0,3% par rapport au mois [www.challenge.ma]\n-------------------------------------------------\nDans sa note d\u2019information diffus\u00e9e ce mardi, le Haut-commissariat au plan (HCP) explique cette hausse par une \u00e9volution des prix de +1,8% de l\u2019industrie chimique. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Bank Al-Maghrib (BAM) a annonc\u00e9\nla mise en service, \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) a annonc\u00e9 la mise en service, \u00e0 compter du 05 janvier 2026, d\u2019un nouveau module d\u00e9di\u00e9 \u00e0 la gestion d\u00e9mat\u00e9rialis\u00e9e de l\u2019ex\u00e9cution des contrats dans le cadre de son Portail Achats, conform\u00e9ment \u00e0 la D\u00e9cision n\u00b0398/W/2025 du Wali de Bank Al-Maghrib. [fr.hespress.com]\n-------------------------------------------------\nLa banque centrale mettra en service un module d\u00e9di\u00e9 \u00e0 la gestion d\u00e9mat\u00e9rialis\u00e9e de l\u2019ex\u00e9cution des contrats, offrant aux fournisseurs un espace s\u00e9curis\u00e9 pour le suivi contractuel, la signature \u00e9lectronique ainsi que d\u0027autres services. [www.lavieeco.com]\n-------------------------------------------------\nBank Al-Maghrib a annonc\u00e9, ce lundi, la mise en service, \u00e0 compter du 05 janvier 2026, d\u2019un nouveau module d\u00e9di\u00e9 \u00e0 la gestion d\u00e9mat\u00e9rialis\u00e9e de l\u2019ex\u00e9cution des contrats dans le cadre de son Portail Achats, conform\u00e9ment \u00e0 la D\u00e9cision n\u00b0398/W/2025 du Wali de Bank Al-Maghrib. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Voici les temp\u00e9ratures minimales et\nmaximales pr\u00e9vues par la Di e et derni\u00e8re journ\u00e9e du groupe A. S\u2019exprimant en conf\u00e9rence de presse d\u2019avant-match contre la Zambie, pr\u00e9vu lundi au Stade Prince Moulay Abdellah \u00e0. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "D\u2019une longueur de 98 km,\ncette nouvelle infrastructure s\u2019inscrit dans...", "mass": 5, "physics": false, "shape": "box", "title": "D\u2019une longueur de 98 km, cette nouvelle infrastructure s\u2019inscrit dans le cadre du programme des investissements op\u00e9r\u00e9s par l\u2019ONEE pour le renforcement et la s\u00e9curisation du r\u00e9seau. [lematin.ma]\n-------------------------------------------------\nL\u2019Office National de l\u2019\u00c9lectricit\u00e9 et de l\u2019Eau Potable (ONEE) a proc\u00e9d\u00e9, le dimanche 28 d\u00e9cembre 2025, \u00e0 la mise sous tension de la ligne \u00e9lectrique tr\u00e8s haute tension 400 kV double ternes reliant Sidi Bennour \u00e0 La\u00e2wamer. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le taux de g\u00e9n\u00e9ralisation de\nl\u2019\u00e9ducation pr\u00e9scolaire en milieu rural...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de g\u00e9n\u00e9ralisation de l\u2019\u00e9ducation pr\u00e9scolaire en milieu rural s\u2019\u00e9tablit actuellement \u00e0 81%, a indiqu\u00e9 le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports, Moh. [lematin.ma]\n-------------------------------------------------\nLe taux de g\u00e9n\u00e9ralisation de l\u2019\u00e9ducation pr\u00e9scolaire en milieu rural atteint actuellement 81%, bien plus qu\u2019en milieu urbain, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports, Mohamed Saad Berrada. [telquel.ma]\n-------------------------------------------------\nLe taux de g\u00e9n\u00e9ralisation de l\u2019\u00e9ducation pr\u00e9scolaire en milieu rural atteint 81%, bien plus qu\u2019en milieu urbain, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de l\u2019\u00c9ducation nationale, du pr\u00e9scolaire et des sports, Mohamed Saad Berrada. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La cr\u00e9ation d\u2019entreprises par voie\n\u00e9lectronique a atteint 35.000 enregistrements...", "mass": 5, "physics": false, "shape": "box", "title": "La cr\u00e9ation d\u2019entreprises par voie \u00e9lectronique a atteint 35.000 enregistrements via la plateforme nationale d\u00e9di\u00e9e, a indiqu\u00e9 Amal El Fallah Seghrouchni lors d\u2019une s\u00e9ance de quest. [lematin.ma]\n-------------------------------------------------\nPlus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique, gr\u00e2ce \u00e0 la plateforme d\u00e9di\u00e9e \u00e0 cet effet, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni. [telquel.ma]\n-------------------------------------------------\nPlus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique gr\u00e2ce \u00e0 la plateforme d\u00e9di\u00e9e \u00e0 la cr\u00e9ation d\u2019entreprises, a indiqu\u00e9 lundi \u00e0 Rabat la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni, lors d\u2019une s\u00e9ance de questions orales \u00e0 la Chambre des repr\u00e9sentants. [lnt.ma]\n-------------------------------------------------\nLa ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni, a annonc\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants que plus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique via la plateforme d\u00e9di\u00e9e \u00e0 la cr\u00e9ation d\u2019entreprises. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le zoo d\u2019A\u00efn Seba\u00e2 rouvre\nofficiellement ses portes apr\u00e8s un...", "mass": 5, "physics": false, "shape": "box", "title": "Le zoo d\u2019A\u00efn Seba\u00e2 rouvre officiellement ses portes apr\u00e8s un vaste projet de r\u00e9habilitation. [lematin.ma]\n-------------------------------------------------\nLe nouveau parc accueille le grand public \u00e0 partir de ce mardi, dans de meilleures conditions de vie pour les animaux et un meilleur accueil des visiteurs. [www.yabiladi.com]\n-------------------------------------------------\nLe parc zoologique d\u2019A\u00efn Seba\u00e2 a rouvert ses portes lundi \u00e0 Casablanca, \u00e0 l\u2019issue d\u2019un important programme de r\u00e9am\u00e9nagement visant \u00e0 redonner vie \u00e0 ce site embl\u00e9matique de la m\u00e9tropole. [lnt.ma]\n-------------------------------------------------\n\u200bLe parc zoologique d\u2019A\u00efn Seba\u00e2 a rouvert ses portes lundi, \u00e0 l\u2019issue d\u2019un vaste programme de r\u00e9am\u00e9nagement ayant permis de redonner vie \u00e0 ce site embl\u00e9matique de Casablanca. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le s\u00e9lectionneur national, Walid Regragui,\na assur\u00e9, lundi soir, qu\u2019une...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Walid Regragui, a assur\u00e9, lundi soir, qu\u2019une nouvelle comp\u00e9tition commence pour 2019Afrique des Nations-2025, en s\u2019imposant face \u00e0 la Zambie (3-0), en match de la 3\u00e8 journ\u00e9e du groupe A, disput\u00e9 lundi soir au Stade Prince Moulay Abdellah \u00e0 Rabat. [www.lereporter.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football s\u2019est qualifi\u00e9e aux huiti\u00e8mes de finale de la Coupe d\u2019Afrique des Nations-2025, en s\u2019imposant face \u00e0 la Zambie (3-0), en match de la 3\u00e8 journ\u00e9e du groupe A, disput\u00e9 lundi soir au Stade Prince Moulay Abdellah \u00e0 Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Royaume se classe ainsi\ndeuxi\u00e8me en Afrique et dans...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume se classe ainsi deuxi\u00e8me en Afrique et dans le monde arabe, avec un score agr\u00e9g\u00e9 de 63,44 points sur 100, marquant une progression par. [telquel.ma]\n-------------------------------------------------\nLe Maroc a am\u00e9lior\u00e9 davantage ses indicateurs relatifs au climat des affaires, selon la deuxi\u00e8me \u00e9dition du rapport \u00ab Business Ready \u00bb de la Banque mondiale, publi\u00e9e lundi 29 d\u00e9cembre [www.challenge.ma]\n-------------------------------------------------\nSelon la deuxi\u00e8me \u00e9dition du rapport \"Business Ready\" de la Banque Mondiale, le Royaume se classe deuxi\u00e8me en Afrique et dans le Monde arabe, avec un score agr\u00e9g\u00e9 de 63,44 points sur 100, marquant une progression par rapport \u00e0 la premi\u00e8re \u00e9dition. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 une nouvelle am\u00e9lioration de ses indicateurs relatifs au climat des affaires dans la deuxi\u00e8me \u00e9dition du rapport Business Ready de la Banque mondiale, publi\u00e9e lundi \u00e0 Washington. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le mus\u00e9e du patrimoine immat\u00e9riel\nJama\u00e2 el-Fna de Marrakech accueille...", "mass": 5, "physics": false, "shape": "box", "title": "Le mus\u00e9e du patrimoine immat\u00e9riel Jama\u00e2 el-Fna de Marrakech accueille l\u2019exposition \u201cMohammed Ben Allal, r\u00e9cits du quotidien\u201d du 28 d\u00e9cembre 2025 au 25 mai 2026, selon un communiqu\u00e9 de la Fondation nationale des mus\u00e9es (FNM). [telquel.ma]\n-------------------------------------------------\nL\u2019exposition met en lumi\u00e8re l\u2019\u0153uvre de Mohammed Ben Allal, peintre autodidacte n\u00e9 \u00e0 Marrakech, dont la pratique artistique s\u2019est construite en marge des cadres acad\u00e9miques, au plus pr\u00e8s des r\u00e9alit\u00e9s sociales, des gestes ordinaires et des formes de vie populaire. [maroc-diplomatique.net]\n-------------------------------------------------\nLe mus\u00e9e du Patrimoine Immat\u00e9riel Jama\u00e2 el-Fna de Marrakech accueille, jusqu\u2019au 25 mai, l\u2019exposition \u00abMohammed Ben Allal : R\u00e9cits du quotidien\u00bb. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Royaume a enregistr\u00e9, sur\nla p\u00e9riode allant du 27...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume a enregistr\u00e9, sur la p\u00e9riode allant du 27 au 28 d\u00e9cembre 2025, d\u2019importants apports hydriques en l\u2019espace de 24 heures. [telquel.ma]\n-------------------------------------------------\nLes retenues d\u2019eau enregistr\u00e9es depuis le 1er septembre 2025 dans les diff\u00e9rents bassins hydrauliques du Royaume du Maroc ont atteint 1.770 millions m3, selon des donn\u00e9es officielles. [atlasinfo.fr]\n-------------------------------------------------\nLes retenues d\u2019eau enregistr\u00e9es depuis le 1er septembre 2025 <script>

    }

    // Cacher la tooltip quand on clique ailleurs

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
