 presse nationale de ce mercredi 7 octobre 2026 Al Bayane \u2022 \u00c0 la suite des \u00e9lections l\u00e9gislatives du 23 septembre 2026, la Conf\u00e9d\u00e9ration Marocaine des TPE-PME (CM-TPME) appelle la nouvelle Cheffe du gouvernement, Fatima Ezzahra El Mansouri, ainsi que la prochaine coalition gouvernementale, \u00e0 placer les tr\u00e8s petites . [fr.hespress.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration marocaine des TPE-PME (CM-TPME) a appel\u00e9, dans un communiqu\u00e9 publi\u00e9 mardi, la cheffe du gouvernement Fatima Ezzahra El Mansouri et la future coalition gouvernementale \u00e0 placer les tr\u00e8s petites entreprises, les PME et les auto-entrepreneurs au c\u0153ur de l\u2019action publique, apr\u00e8s les l\u00e9gislatives du 23 septembre 2026. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La participation marocaine au salon\nmobilisera 25 groupements issus des...", "mass": 5, "physics": false, "shape": "box", "title": "La participation marocaine au salon mobilisera 25 groupements issus des diff\u00e9rentes r\u00e9gions du Royaume, portant une offre repr\u00e9sentative de la diversit\u00e9 des produits du terroir nat. [lematin.ma]\n-------------------------------------------------\nLa participation du Maroc \u00e0 ce rendez-vous de grande envergure est marqu\u00e9e par la pr\u00e9sence de 25 groupements de producteurs issus des diff\u00e9rentes r\u00e9gions du Royaume, pr\u00e9sentant une offre qui refl\u00e8te \u00e0 la fois, la diversit\u00e9 et la richesse des produits du terroir national. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Vantage Payment Systems (VPS) ouvre\nune nouvelle \u00e9tape de son...", "mass": 5, "physics": false, "shape": "box", "title": "Vantage Payment Systems (VPS) ouvre une nouvelle \u00e9tape de son d\u00e9veloppement au Maroc avec l\u2019arriv\u00e9e d\u2019AfricInvest Financial Inclusion Vehicle (FIVE) au capital de son actionnaire m. [lematin.ma]\n-------------------------------------------------\nIl doit notamment soutenir le d\u00e9ploiement de son offre d\u2019acquisition TPE, ses investissements technologiques et le d\u00e9veloppement de nouvelles solutions de paiement. [lnt.ma]\n-------------------------------------------------\nVantage Payment Systems (VPS) ouvre une nouvelle \u00e9tape de son d\u00e9veloppement avec l\u2019arriv\u00e9e d\u2019AfricInvest Financial Inclusion Vehicle (FIVE) au capital de son actionnaire majoritaire, Equity Invest. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Des informations obtenues par TelQuel\nArabi r\u00e9v\u00e8lent une partie des...", "mass": 5, "physics": false, "shape": "box", "title": "Des informations obtenues par TelQuel Arabi r\u00e9v\u00e8lent une partie des d\u00e9tails de la rencontre qui a r\u00e9uni, dimanche 4 octobre au soir, Fatima Ezzahra El Mansouri, cheffe du gouvernement d\u00e9sign\u00e9e et charg\u00e9e de le former, et Nizar Baraka, secr\u00e9taire g\u00e9n\u00e9ral du parti de l\u2019Istiqlal, dans le cadre du deuxi\u00e8me tour des consultations pour la constitution. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s les consultations men\u00e9es par son premier secr\u00e9taire, Driss Lachgar, avec la Cheffe de gouvernement nomm\u00e9e, Fatima-Zahra El Mansouri, le bureau politique du parti a d\u00e9gag\u00e9 une orientation g\u00e9n\u00e9rale favorable \u00e0 la participation, sans toutefois trancher d\u00e9finitivement. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Comit\u00e9 central du Parti\ndu Progr\u00e8s et du Socialisme...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 central du Parti du Progr\u00e8s et du Socialisme (PPS) a mandat\u00e9, \u00e0 l\u2019unanimit\u00e9, le bureau politique du parti afin de g\u00e9rer la prochaine \u00e9tape relative aux consultations en vue de former le gouvernement. [telquel.ma]\n-------------------------------------------------\nLe Comit\u00e9 central du Parti du Progr\u00e8s et du Socialisme (PPS) a mandat\u00e9, \u00e0 l\u2019unanimit\u00e9, le bureau politique du parti afin de g\u00e9rer la prochaine \u00e9tape relative aux consultations en vue de former le gouvernement. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La r\u00e9gion Tanger-T\u00e9touan-Al Hoceima s\u2019appr\u00eate\n\u00e0 renforcer le dispositif r\u00e9gional...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9gion Tanger-T\u00e9touan-Al Hoceima s\u2019appr\u00eate \u00e0 renforcer le dispositif r\u00e9gional de surveillance de la qualit\u00e9 de l\u2019air et \u00e0 \u00e9tablir un inventaire des \u00e9missions de gaz polluants. [telquel.ma]\n-------------------------------------------------\nLa r\u00e9gion Tanger-T\u00e9touan-Al Hoceima pr\u00e9voit de renforcer son syst\u00e8me de surveillance de la qualit\u00e9 de l\u2019air \u00e0 travers deux conventions repr\u00e9sentant un investissement global de 17 MDH. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le premier F-16 Block 72\ndestin\u00e9 aux Forces Royales Air...", "mass": 5, "physics": false, "shape": "box", "title": "Le premier F-16 Block 72 destin\u00e9 aux Forces Royales Air du Maroc a effectu\u00e9 avec succ\u00e8s son premier vol d\u2019essai, a annonc\u00e9 l\u2019entreprise am\u00e9ricaine de d\u00e9fense et de s\u00e9curit\u00e9 Lockheed Martin. [telquel.ma]\n s au profit des 6.800 nouveaux retrait\u00e9s du d\u00e9partement de l\u0027\u00c9ducation nationale. [www.lavieeco.com]\n-------------------------------------------------\nLa Caisse marocaine des retraites (CMR) a finalis\u00e9 avec succ\u00e8s l\u2019op\u00e9ration de paiement des pensions destin\u00e9es aux nouveaux retrait\u00e9s relevant du D\u00e9partement de l\u2019\u00c9ducation nationale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les livraisons de ciment ont\natteint pr\u00e8s de 11 millions...", "mass": 5, "physics": false, "shape": "box", "title": "Les livraisons de ciment ont atteint pr\u00e8s de 11 millions de tonnes (MT) \u00e0 fin septembre 2026, en l\u00e9g\u00e8re hausse de 1,17% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon les donn\u00e9es du minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [telquel.ma]\n-------------------------------------------------\nLes volumes livr\u00e9s ont atteint 1,46 million de tonnes, contre 1,22 million au m\u00eame mois de 2025, selon les donn\u00e9es du minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Alors que son ancien groupe\npr\u00e9pare sa sortie du capital,...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que son ancien groupe pr\u00e9pare sa sortie du capital, le patron de Marbio affronte une \u00e9ch\u00e9ance : 5,4 millions de doses d\u2019ici fin 2026. [telquel.ma]\n-------------------------------------------------\nAccord-cadre : Le Fonds Mohammed VI pour l\u2019Investissement acquiert 10 % du capital de la soci\u00e9t\u00e9 Maroc Biote <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
