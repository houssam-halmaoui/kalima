abel": "Les recettes voyages en devises\nont atteint, \u00e0 fin d\u00e9cembre,...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes voyages en devises ont atteint, \u00e0 fin d\u00e9cembre, 138 milliards de dirhams (MMDH), soit une progression de 21 % par rapport \u00e0 2024, selon les donn\u00e9es du secteur. [fr.hespress.com]\n-------------------------------------------------\nLe secteur du tourisme marocain a enregistr\u00e9 une performance exceptionnelle en 2025, avec des recettes en devises qui ont atteint \u00e0 fin d\u00e9cembre 138 milliards de dirhams (MMDH), en hausse de 21% par rapport \u00e0 2024, indique le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [aujourdhui.ma]\n-------------------------------------------------\nCe niveau in\u00e9dit est d\u0027autant plus significatif qu\u0027il d\u00e9passe largement, d\u00e8s 2025, l\u0027objectif de 120 MMDH fix\u00e9 par la feuille de route du tourisme \u00e0 l\u0027horizon 2026. [www.lavieeco.com]\n-------------------------------------------------\nLe secteur du tourisme marocain a enregistr\u00e9 une performance exceptionnelle en 2025, avec des recettes en devises qui ont atteint \u00e0 fin d\u00e9cembre 138 milliards de dirhams (MMDH), en hausse de 21% par rapport \u00e0 2024, indique le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La direction provinciale du minist\u00e8re\nde l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire...", "mass": 5, "physics": false, "shape": "box", "title": "La direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Ksar El K\u00e9bir a annonc\u00e9 la suspension des cours dans l\u2019ensemble des \u00e9tablissements scolaires publics et         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
