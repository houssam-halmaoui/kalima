 Orientations de Sa Majest\u00e9 le Roi Mohammed VI, \u201cun vaste chantier national pla\u00e7ant le droit \u00e0 la [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019Organisation mondiale de la Sant\u00e9\n(OMS) a exprim\u00e9, ce mardi,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Organisation mondiale de la Sant\u00e9 (OMS) a exprim\u00e9, ce mardi, sa vive inqui\u00e9tude face \u00e0 \u00ab l\u2019ampleur et la rapidit\u00e9 \u00bb de la propagation de l\u2019\u00e9pid\u00e9mie d\u2019Ebola qui frappe actuellement la R\u00e9publique d\u00e9mocratique du Congo (RDC). [fr.hespress.com]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de l\u2019Organisation mondiale de la sant\u00e9 (OMS) a alert\u00e9 mardi sur \u00ab l\u2019ampleur et la rapidit\u00e9 \u00bb de l\u2019\u00e9pid\u00e9mie d\u2019Ebola qui frappe la R\u00e9publique d\u00e9mocratique du Congo (RDC), o\u00f9 elle est \u00e0 l\u2019origine de 131 d\u00e9c\u00e8s estim\u00e9s et 513 cas suspects. [telquel.ma]\n-------------------------------------------------\nLa situation sanitaire en R\u00e9publique d\u00e9mocratique du Congo (RDC) devient de plus en plus pr\u00e9occupante, avec un bilan alarmant de 131 d\u00e9c\u00e8s et 513 cas suspects li\u00e9s \u00e0 l\u2019\u00e9pid\u00e9mie d\u2019Ebola en cours. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\npar le ministre des Affaires...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e par le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration internationale et des Communaut\u00e9s de la Guin\u00e9e-Bissau, Jo\u00e3o Bernardo Vieira, lors d\u2019une d\u00e9c. [lematin.ma]\n-------------------------------------------------\nLa Guin\u00e9e-Bissau a r\u00e9affirm\u00e9, ce mardi \u00e0 Rabat, sa position ferme et constante concernant la marocanit\u00e9 du Sahara, \u00e0 l\u0027occasion d\u0027une rencontre entre le ministre des Affaires \u00e9trang\u00e8res bissau-guin\u00e9en, Jo\u00e3o Bernardo Vieira, et son homologue marocain, Nasser Bourita. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Coalition pour la Valorisation\ndes D\u00e9chets (COVAD) a reconduit...", "mass": 5, "physics": false, "shape": "box", "title": "La Coalition pour la Valorisation des D\u00e9chets (COVAD) a reconduit Mounir El Bari \u00e0 sa pr\u00e9sidence pour le mandat 2026-2031, \u00e0 l\u2019issue de son Assembl\u00e9e G\u00e9n\u00e9rale \u00c9lective tenue le 7 m. [lematin.ma]\n-------------------------------------------------\nLa Coalition pour la Valorisation des D\u00e9chets (COVAD) a annonc\u00e9 la r\u00e9\u00e9lection de Mounir El Bari \u00e0 sa pr\u00e9sidence pour un nouveau mandat couvrant la p\u00e9riode 2026-2031, \u00e0 l\u2019issue de son Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective tenue le 7 mai \u00e0 Casablanca. [lnt.ma]\n-------------------------------------------------\nLa Coalition pour la valorisation des d\u00e9chets (COVAD) a tenu son assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective, \u00e0 l\u2019issue de laquelle Mounir El Bari a \u00e9t\u00e9 r\u00e9\u00e9lu pr\u00e9sident pour le mandat 2026-2031. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Selon Damane Cash, cette nouvelle\nmarque vise avant tout \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Selon Damane Cash, cette nouvelle marque vise avant tout \u00e0 clarifier son positionnement sur le march\u00e9 du paiement \u00e9lectronique et \u00e0 structurer une o                             x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
