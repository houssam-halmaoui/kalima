matin.ma]\n-------------------------------------------------\nLe Groupe Renault Maroc a franchi une nouvelle \u00e9tape dans le renforcement de son dialogue social en signant, mercredi \u00e0 Casablanca, des conventions collectives pour l\u2019ensemble de ses entit\u00e9s industrielles et commerciales. [telquel.ma]\n-------------------------------------------------\nLe Groupe Renault Maroc a franchi une nouvelle \u00e9tape dans le renforcement de son dialogue social en signant, mercredi \u00e0 Casablanca, des conventions collectives pour l\u2019ensemble de ses entit\u00e9s industrielles et commerciales. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le Maroc confirme, pour la\ncinqui\u00e8me campagne cons\u00e9cutive, la mont\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc confirme, pour la cinqui\u00e8me campagne cons\u00e9cutive, la mont\u00e9e en puissance de ses exportations de poivrons doux. [lematin.ma]\n-------------------------------------------------\nLe Maroc confirme sa position de leader sur le march\u00e9 du poivron doux, avec des exportations record pour la cinqui\u00e8me ann\u00e9e cons\u00e9cutive. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "ojets de d\u00e9cret fixant la\ndate du d\u00e9but effectif de...", "mass": 5, "physics": false, "shape": "box", "title": "ojets de d\u00e9cret fixant la date du d\u00e9but effectif de l\u2019exercice des comp\u00e9tences des Groupements sanitaires territoriaux (GST) dans les diff\u00e9rentes r\u00e9gions du Royaume. [www.lopinion.ma]\n-------------------------------------------------\nCes onze projets de d\u00e9cret, pr\u00e9sent\u00e9s par le ministre de la sant\u00e9, fixent la date du d\u00e9but effectif de l\u2019exercice des comp\u00e9tences des Groupements sanitaires territoriaux (GST) dans les diff\u00e9rentes r\u00e9gions du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019\u00e9v\u00e9nement, organis\u00e9 jusqu\u2019au 13 d\u00e9cembre\n2025 sur le campus de...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9v\u00e9nement, organis\u00e9 jusqu\u2019au 13 d\u00e9cembre 2025 sur le campus de l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) de Rabat, s\u2019attache cette ann\u00e9e \u00e0 d\u00e9crypter les crises mondiales et \u00e0 formuler des pistes de r\u00e9forme adapt\u00e9es aux r\u00e9alit\u00e9s actuelles. [www.lopinion.ma]\n-------------------------------------------------\nLe Policy Center for the New South (PCNS) organise, sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, la 14\u1d49 \u00e9dition de sa conf\u00e9rence phare les Atlantic Dialogues, qui se tient du 11 au 13 d\u00e9cembre sur le campus de l\u2019Universit\u00e9 Mohammed VI Polytechnique (UM6P) \u00e0 Rabat. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Des chutes de neige \u00e0\npartir de 1.400 m et...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1.400 m et de fortes pluies parfois orageuses sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1 400 m et de fortes pluies parfois orageuses sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "g         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                    window.open(url, '_blank');
                }

        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {

                                scrollButtons.className = 'scroll-buttons';

                                scrollUp.className = 'scroll-up';

                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
