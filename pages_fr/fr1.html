ees-a-lechelle-nationale-ministre-de-linterieur/", "x": 0, "y": 0}, {"font": {"vadjust": -88.5}, "group": 10, "id": 239, "label": "Rentr\u00e9e \u00e9conomique : la CGEM...", "shape": "dot", "size": 59, "title": "Rentr\u00e9e \u00e9conomique : la CGEM place les TPME, l\u2019investissement et l\u2019emploi parmi ses priorit\u00e9s\nSource: lnt.ma", "url": "https://lnt.ma/rentree-economique-la-cgem-place-les-tpme-linvestissement-et-lemploi-parmi-ses-priorites/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "West Med Container Terminal (WMCT),\nfiliale de Marsa Maroc et...", "mass": 5, "physics": false, "shape": "box", "title": "West Med Container Terminal (WMCT), filiale de Marsa Maroc et de TIL et concessionnaire du Terminal Est du port Nador West Med, a annonc\u00e9, jeudi, l\u2019ach\u00e8vement de la pr\u00e9paration op\u00e9rationnelle du terminal et confirme sa capacit\u00e9 \u00e0 accueillir et traiter ses premi\u00e8res escales commerciales. \u00ab [fr.hespress.com]\n-------------------------------------------------\nWMCT, filiale de Marsa Maroc et de TIL, a annonc\u00e9 avoir men\u00e9 avec succ\u00e8s les essais op\u00e9rati. [lematin.ma]\n-------------------------------------------------\nWest Med Container Terminal (WMCT), filiale de Marsa Maroc et de TIL et concessionnaire du Terminal Est du port Nador West Med, a annonc\u00e9 l\u2019ach\u00e8vement de la pr\u00e9paration op\u00e9rationnelle de son terminal, \u00e0 l\u2019issue d\u2019essais concluants. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s des essais op\u00e9rationnels concluants, le Terminal Est du port Nador West Med est d\u00e9sormais \u00abpr\u00eat \u00e0 accueillir\u00bb ses premi\u00e8res escales commerciales, a affirm\u00e9, jeudi 10 septembre, son [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc r\u00e9affirme son attachement\nau partenariat avec l\u2019Espagne, tout...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc r\u00e9affirme son attachement au partenariat avec l\u2019Espagne, tout en rejetant les accusations et les prises de position qui, dans le d\u00e9bat migratoire espagnol, tendent \u00e0 faire du Royaume un enjeu de politique int\u00e9rieure. [fr.hespress.com]\n-------------------------------------------------\nLe minist\u00e8re des Affaires \u00e9trang\u00e8res a apport\u00e9, jeudi, des pr\u00e9cisions sur les derniers d\u00e9veloppements des relations maroco-espagnoles, r\u00e9affirmant l\u2019attachement du Maroc au partenariat avec l\u2019Espagne et d\u00e9non\u00e7ant l\u2019instrumentalisation du Royaume dans les d\u00e9bats politiques et m\u00e9diatiques espagnols. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re marocain des Affaires \u00e9trang\u00e8res a publi\u00e9 jeudi un communiqu\u00e9 en cinq points pr\u00e9cisant sa position sur les tensions r\u00e9centes avec Madrid, d\u00e9non\u00e7ant une instrumentalisation politique du Royaume et r\u00e9affirmant l\u0027attachement du Maroc \u00e0 la relation bilat\u00e9rale \u00e9tablie depuis 2022. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Au total, 7.288 candidats et\ncandidates se pr\u00e9sentent \u00e0 ce...", "mass": 5, "physics": false, "shape": "box", "title": "Au total, 7.288 candidats et candidates se pr\u00e9sentent \u00e0 ce scrutin, r\u00e9partis sur 1.850 listes, soit une moyenne nationale de plus de 18 candidatures pour chaque si\u00e8ge de la Chambre des repr\u00e9sentants. [fr.hespress.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur vient de communiquer des statistiques sur le nombre des candidatures pour les listes locales et r\u00e9gionales. [telquel.ma]\n-------------------------------------------------\nQuelque 1.850 listes de candidatures ont \u00e9t\u00e9 pr\u00e9sent\u00e9es \u00e0 l\u2019\u00e9chelle nationale pour les \u00e9lections des membres de la Chambre des repr\u00e9sentants du 23 septembre 2026, soit un total de 7.288 candidatures, selon les donn\u00e9es provisoires du minist\u00e8re de l\u2019Int\u00e9rieur. [www.lavieeco.com]\n-------------------------------------------------\nLe nombre des listes de candidatures pr\u00e9sent\u00e9es \u00e0 l\u2019\u00e9chelle nationale pour l\u2019\u00e9lection des membres de la Chambre des repr\u00e9sentants, au titre de l\u2019ensemble des circonscriptions \u00e9lectorales, locales et r\u00e9gionales s\u2019\u00e9l\u00e8ve \u00e0 1.850, indique un communiqu\u00e9 du ministre de l\u2019Int\u00e9rieur. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019architecte marocaine \u00e9tait finaliste du\nconcours mettant en lumi\u00e8re l\u2019excellence...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019architecte marocaine \u00e9tait finaliste du concours mettant en lumi\u00e8re l\u2019excellence de la cr\u00e9ation contemporaine dans le monde arabe, avec le Centre d\u2019interpr\u00e9tation du patrimoine d. [lematin.ma]\n-------------------------------------------------\nL\u2019Institut du monde arabe (IMA) \u00e0 Paris a d\u00e9voil\u00e9, mercredi soir, les noms des laur\u00e9ats de ses Prix du design 2026, dont l\u2019architecte marocaine Salima Naji, prim\u00e9e dans la cat\u00e9gorie \u00ab Grand Prix \u00bb. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c0 quelques jours des \u00e9lections\nl\u00e9gislatives, la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des...", "mass": 5, "physics"         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;

                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;

            }
