uctions du ministre de la Sant\u00e9 et de la Protection sociale, Amine Tehraoui, 49 nouveaux centres de sant\u00e9 urbains et ruraux sont entr\u00e9s en service le vendredi 24 octobre 2025, dans neuf . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Selon les termes de l\u2019accord,\nune coentreprise d\u00e9tenue \u00e0 51%...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les termes de l\u2019accord, une coentreprise d\u00e9tenue \u00e0 51% par Marsa Maroc et \u00e0 49% par CMA Terminals sera charg\u00e9e de la gestion, du d\u00e9veloppement et de l\u2019exploitation du termina. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019issue de la finalisation de cet accord, soumise \u00e0 l\u2019approbation des autorit\u00e9s comp\u00e9tentes, Marsa Maroc d\u00e9tiendra 51 % du capital et des droits de vote de la soci\u00e9t\u00e9 concessionnaire, tandis que CMA Terminals en poss\u00e9dera 49 %. [www.lavieeco.com]\n-------------------------------------------------\nMarsa Maroc et CMA Terminals, filiale du Groupe CMA CGM, ont annonc\u00e9 la finalisation de leur accord de partenariat pour l\u2019exploitation du Terminal \u00e0 Conteneurs Ouest du port Nador West Med. [lnt.ma]\n-------------------------------------------------\nLe terminal, qui devrait \u00eatre op\u00e9rationnel d\u00e8s 2027, offrira une capacit\u00e9 annuelle de 1,8 million d\u2019EVP, comme lont annonc\u00e9 les deux groupes dans un communiqu\u00e9 commun. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Royal Air Maroc lance de\nnouvelles liaisons reliant Marrakech \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Royal Air Maroc lance de nouvelles liaisons reliant Marrakech \u00e0 Dakha et La\u00e2youne, d\u0027une augmentation des fr\u00e9quences depuis Rabat vers La\u00e2youne et Dakhla, d\u0027une offre \u00e9toff. [lematin.ma]\n-------------------------------------------------\nDans le d\u00e9tail, deux nouvelles liaisons a\u00e9riennes strat\u00e9giques ont \u00e9t\u00e9 inaugur\u00e9es en octobre courant au d\u00e9part de Marrakech, renfor\u00e7ant la connectivit\u00e9 entre la ville ocre et les provinces du Sud.. [telquel.ma]\n-------------------------------------------------\nRoyal Air Maroc (RAM) intensifie sa pr\u00e9sence dans les provinces du Sud du Royaume avec une offre enrichie et diversifi\u00e9e, dans le cadre d\u2019un plan strat\u00e9gique de renforcement des liaisons a\u00e9riennes domestiques. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le tableau \"Nature morte \u00e0\nla guitare\" de Pablo Picasso,...", "mass": 5, "physics": false, "shape": "box", "title": "Le tableau \"Nature morte \u00e0 la guitare\" de Pablo Picasso, disparu d\u00e9but octobre lors de son transfert entre Madrid et Grenade, a \u00e9t\u00e9 retrouv\u00e9, a annonc\u00e9 vendredi la police nationale espagnole. [www.lopinion.ma]\n-------------------------------------------------\nLe tableau \"Nature morte \u00e0 la guitare\" de Pablo Picasso, disparu d\u00e9but octobre lors de son transfert entre Madrid et Grenade, a \u00e9t\u00e9 retrouv\u00e9, a annonc\u00e9 vendredi la police nationale espagnole. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Dans son rapport au Conseil\nde s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral...", "mass": 5, "physics": false, "shape": "box", "title": "Dans son rapport au Conseil de s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019ONU, Antonio Guterres, a interpell\u00e9 le \"polisario\" sur ses violations syst\u00e9matiques et continues du cessez-le-feu, preuve \u00e0 l\u2019appui. [www.lopinion.ma]\n-------------------------------------------------\nDans son rapport au Conseil de s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019ONU, Antonio Guterres, a interpell\u00e9 le \u00ab polisario \u00bb sur ses violations syst\u00e9matiques et continues du cessez-le-feu, preuve \u00e0 l\u2019appui. [aujourdhui.ma]\n-------------------------------------------------\nDans son rapport au Conseil de s\u00e9curit\u00e9, le Secr\u00e9taire g\u00e9n\u00e9ral de l\u2019ONU, Antonio Guterres, a interpell\u00e9 le \"polisario\" sur ses violations syst\u00e9matiques et continues du cessez-le-feu, preuve \u00e0 l\u2019appui. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "D\u00e9ploy\u00e9e en partenariat avec le\nminist\u00e8re de l\u2019\u00c9ducation nationale et...", "mass": 5, "physics": false, "shape": "box", "title": "D\u00e9ploy\u00e9e en partenariat avec le minist\u00e8re de l\u2019\u00c9ducation nationale et les Acad\u00e9mies r\u00e9gionales de Rabat et Tanger, l\u2019initiative est port\u00e9e par la Fondation Al Mada, avec le soutien op\u00e9rationnel des programmes. [telquel.ma]\n-------------------------------------------------\nLa Fondation Al Mada a c\u00e9l\u00e9br\u00e9 cette semaine, \u00e0 Rabat et Tanger, la premi\u00e8re promotion du programme Acad\u00e9mie des Arts, marquant une nouvelle \u00e9tape dans son engagement pour une jeunesse marocaine cr\u00e9ative, \u00e9panouie et actrice de son avenir. [aujourdhui.ma]\n-------------------------------------------------\nEn c\u00e9l\u00e9brant la premi\u00e8re promotion de l\u2019Acad\u00e9mie des Arts \u00e0 Rabat et Tanger, la Fondation Al Mada consacre un mod\u00e8le in\u00e9dit de formation artistique gratuite, ouvert \u00e0 tous les jeunes talents du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000"             var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;

                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;

        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
