: "box", "title": "Sign\u00e9 au si\u00e8ge de la wilaya en pr\u00e9sence du wali de la r\u00e9gion de Dakhla-Oued Eddahab, gouverneur de la province d\u2019Oued Eddahab, Ali Khalil, cet accord s\u2019inscrit dans le cadre de la. [lematin.ma]\n-------------------------------------------------\nL\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) et la Soci\u00e9t\u00e9 r\u00e9gionale multiservices Dakhla-Oued Eddahab (SRM-DO) ont sign\u00e9, mardi 24 novembre, un accord de pr\u00eat de 15 millions d\u2019euros destin\u00e9 \u00e0 [www.challenge.ma]\n-------------------------------------------------\nL\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) et la Soci\u00e9t\u00e9 r\u00e9gionale multiservices Dakhla-Oued Eddahab ont sign\u00e9 mardi \u00e0 Dakhla un pr\u00eat de 15 millions d\u2019euros. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) et la Soci\u00e9t\u00e9 r\u00e9gionale multiservices Dakhla-Oued Eddahab (SRM-DO) ont sign\u00e9, mardi, un accord de pr\u00eat de 15 millions d\u2019euros destin\u00e9 au renforcement des r\u00e9seaux d\u2019eau potable et d\u2019assainissement ainsi qu\u2019\u00e0 l\u2019extension de la station d\u2019\u00e9puration de Dakhla. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La disponibilit\u00e9 des pi\u00e8ces de\nrechange reste un enjeu majeur...", "mass": 5, "physics": false, "shape": "box", "title": "La disponibilit\u00e9 des pi\u00e8ces de rechange reste un enjeu majeur pour les professionnels de la r\u00e9paration automobile au Maroc. [lematin.ma]\n-------------------------------------------------\n\u00c0 travers Distrigo, lanc\u00e9 ce 24 novembre \u00e0 Casablanca aux c\u00f4t\u00e9s d\u2019ADS Group, le constructeur r\u00e9unit sous un m\u00eame toit quatre gammes de pi\u00e8ces : d\u2019origine, multimarques, d\u2019\u00e9quipementiers et de r\u00e9emploi. [telquel.ma]\n-------------------------------------------------\nStellantis Maroc inaugure officiellement Distrigo Maroc, en partenariat avec ADS Group, sur le site de Casablanca A\u00efn Seba\u00e2. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Dynamiser la collecte de l\u2019\u00e9pargne\nnationale, s\u00e9curiser l\u2019\u00e9pargne retraite et...", "mass": 5, "physics": false, "shape": "box", "title": "Dynamiser la collecte de l\u2019\u00e9pargne nationale, s\u00e9curiser l\u2019\u00e9pargne retraite et d\u00e9ployer les ressources financi\u00e8res au service des priorit\u00e9s strat\u00e9giques du Royaume. [lematin.ma]\n-------------------------------------------------\nEn tant qu\u2019enjeu majeur de la souverainet\u00e9 financi\u00e8re, la question de l\u2019orientation de l\u2019\u00e9pargne nationale vers le financement des investissements strat\u00e9giques au Maroc est revenue au-devant de la [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le ministre de l\u2019Int\u00e9rieur a\ntenu, ce mardi 24 novembre,...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Int\u00e9rieur a tenu, ce mardi 24 novembre, une r\u00e9union avec les dirigeants et responsables des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaire, consacr\u00e9e \u00e0 la pr\u00e9paration des \u00e9ch\u00e9ances \u00e9lectorales pr\u00e9vues en 2027. [telquel.ma]\n-------------------------------------------------\nCette rencontre, organis\u00e9e dans le cadre des pr\u00e9paratifs des \u00e9lections de 2027, a permis d\u2019examiner les propositions des partis visant \u00e0 faire \u00e9voluer le cadre \u00e9lectoral, citant un communiqu\u00e9 du minist\u00e8re. [www.yabiladi.com]\n-------------------------------------------------\n\u00c0 l\u2019approche des \u00e9ch\u00e9ances \u00e9lectorales de 2027, le ministre de l\u2019Int\u00e9rieur a tenu, mardi 24 novembre, une r\u00e9union avec les dirigeants des partis politiques disposant d\u2019un groupe ou d\u2019un groupement parlementaire. [www.lavieeco.com]\n-------------------------------------------------\nLes \u00e9lections de 2027 au Maroc ont fait l\u2019objet, mardi, d\u2019une r\u00e9union entre le ministre de l\u2019Int\u00e9rieur et les responsables des partis disposant d\u2019un groupe ou d\u2019un groupement parlementaire. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Le Tribunal arbitral du sport\n(TAS) a d\u00e9cid\u00e9 mardi \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "Le Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \u00ab \u00e0 l\u2019unanimit\u00e9 \u00bb le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u2019Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [telquel.ma]\n-------------------------------------------------\nIl confirme la victoire du S\u00e9n\u00e9gal, annulant ainsi la d\u00e9cision du jury d\u2019appel de la Conf\u00e9d\u00e9ration africaine de football (CAF) qui avait attribu\u00e9 le titre au Maroc sur tapis vert, avec un score de 3-0. [www.yabiladi.com]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \"\u00e0 l\u0027unanimit\u00e9\" le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u0027Afrique des nations 2025, aux d\u00e9pens du Maroc qui avait obtenu le titre sur tapis vert. [leseco.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) a d\u00e9cid\u00e9 mardi \u00ab \u00e0 l\u2019unanimit\u00e9 \u00bb le sacre du S\u00e9n\u00e9gal lors de la Coupe d\u2019Afrique des nations                   return network;

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
