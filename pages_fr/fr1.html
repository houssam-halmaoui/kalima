ement \u00e0 une ann\u00e9e auparavant. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Dans le cadre d\u2019enqu\u00eates sur\nd\u2019\u00e9ventuelles pratiques anticoncurrentielles, le Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre d\u2019enqu\u00eates sur d\u2019\u00e9ventuelles pratiques anticoncurrentielles, le Conseil de la concurrence a proc\u00e9d\u00e9 \u00e0 des visites et saisies inopin\u00e9es aupr\u00e8s de plusieurs op\u00e9rateurs du march\u00e9 des dispositifs m\u00e9dicaux. [fr.hespress.com]\n-------------------------------------------------\nLes services d\u2019instruction et d\u2019enqu\u00eate du Conseil de la concurrence ont proc\u00e9d\u00e9 \u00e0 des op\u00e9rations de visite et de saisie inopin\u00e9es et simultan\u00e9es dans les locaux de plusieurs op\u00e9ra. [lematin.ma]\n-------------------------------------------------\nLes services d\u2019instruction et d\u2019enqu\u00eate du Conseil de la concurrence ont proc\u00e9d\u00e9, en date du 17 f\u00e9vrier 2026, \u00e0 des op\u00e9rations de visite et de saisie inopin\u00e9es et simultan\u00e9es aupr\u00e8s d\u2019entit\u00e9s op\u00e9rant sur le march\u00e9 de la commercialisation des dispositifs m\u00e9dicaux sur la base de suspicions de pratiques anticoncurrentielles dans ledit march\u00e9. [www.lavieeco.com]\n-------------------------------------------------\nLes services d\u2019instruction et d\u2019enqu\u00eate du Conseil de la concurrence ont proc\u00e9d\u00e9, mardi dernier, \u00e0 des op\u00e9rations de visite et de saisie inopin\u00e9es et simultan\u00e9es aupr\u00e8s d\u2019entit\u00e9s op\u00e9rant sur le march\u00e9 de la commercialisation des dispositifs m\u00e9dicaux sur la base de suspicions de pratiques anticoncurrentielles dans ledit march\u00e9. [telquel.ma]\n-------------------------------------------------\nLe Conseil de la concurrence a d\u00e9clench\u00e9 une s\u00e9rie d\u2019inspections inopin\u00e9es dans le secteur de la distribution de dispositifs m\u00e9dicaux au Maroc, suscitant un coup de projecteur sur les pratiques commerciales dans un march\u00e9 jug\u00e9 sensible. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "\u00ab Sa Majest\u00e9 le Roi\nMohammed VI, Que Dieu L\u2019Assiste,...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Sa Majest\u00e9 le Roi Mohammed VI, Que Dieu L\u2019Assiste, soutient l\u2019action du Pr\u00e9sident am\u00e9ricain Donald Trump pour la reconstruction de Gaza et appelle \u00e0 l\u2019av\u00e8nement d\u2019un processus r\u00e9. [lematin.ma]\n-------------------------------------------------\nLe Roi Mohammed VI soutient l\u2019action du Pr\u00e9sident am\u00e9ricain Donald Trump pour la reconstruction de Gaza et appelle \u00e0 l\u2019av\u00e8nement d\u2019un processus r\u00e9el de paix au Moyen Orient, a affirm\u00e9 jeudi \u00e0 Washington, le ministre des affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, lors de la r\u00e9union inaugurale du Conseil de Paix. [leseco.ma]\n-------------------------------------------------\nSM le Roi Mohammed VI soutient l\u2019action du Pr\u00e9sident am\u00e9ricain Donald Trump pour la reconstruction de Gaza et appelle \u00e0 l\u2019av\u00e8nement d\u2019un processus r\u00e9el de paix au Moyen Orient, a affirm\u00e9 jeudi \u00e0 Washington, le ministre des affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, lors de la r\u00e9union . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "R\u00e9uni jeudi \u00e0 Rabat, le\nConseil du gouvernement a examin\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni jeudi \u00e0 Rabat, le Conseil du gouvernement a examin\u00e9 et adopt\u00e9 la version r\u00e9vis\u00e9e du projet de loi 26.25 portant organisation du Conseil national de la presse (CNP). [lematin.ma]\n-------------------------------------------------\nLe ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, a annonc\u00e9 jeudi \u00e0 Rabat l\u2019adoption d\u2019une nouvelle formule de soutien aux entreprises de presse. [telquel.ma]\n-------------------------------------------------\nLe ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, a annonc\u00e9 jeudi \u00e0 Rabat l\u2019adoption d\u0027une nouvelle formule de soutien aux entreprises de presse. [leseco.ma]\n-------------------------------------------------\nLe gouvernement a adopt\u00e9, jeudi \u00e0 Rabat, le projet de loi 09.26 relatif \u00e0 la r\u00e9organisation du Conseil national de la presse (CNP), ainsi qu\u2019une nouvelle formule de soutien aux entreprises de presse, a annonc\u00e9 le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le Conseil de l\u2019Autorit\u00e9 Nationale\nde R\u00e9gulation de l\u2019\u00c9lectricit\u00e9 (ANRE),...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de l\u2019Autorit\u00e9 Nationale de R\u00e9gulation de l\u2019\u00c9lectricit\u00e9 (ANRE), r\u00e9uni mardi, a fix\u00e9 le tarif de l\u0027exc\u00e9dent de l\u0027\u00e9nergie \u00e9lectrique produite dans le cadre des lois. [lematin.ma]\n-------------------------------------------------\nLe Conseil de l\u2019Autorit\u00e9 nationale de r\u00e9gulation de l\u2019\u00e9lectricit\u00e9 (ANRE), r\u00e9uni mardi, a fix\u00e9 le tarif de l\u2019exc\u00e9dent de l\u2019\     });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
