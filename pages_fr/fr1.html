0e9conomique r\u00e9gionale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le minist\u00e8re de l\u2019Int\u00e9rieur a\nannonc\u00e9 le rel\u00e8vement du niveau...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de l\u2019Int\u00e9rieur a annonc\u00e9 le rel\u00e8vement du niveau de mobilisation afin de faire face aux r\u00e9percussions potentielles des perturbations m\u00e9t\u00e9orologiques attendues durant la saison hivernale 2025-2026, et ce conform\u00e9ment aux hautes instructions royales. [fr.hespress.com]\n-------------------------------------------------\nEn ex\u00e9cution des instructions du roi Mohammed VI, le minist\u00e8re de l\u2019Int\u00e9rieur a proc\u00e9d\u00e9, en \u00e9troite coordination avec l\u2019ensemble des secteurs gouvernementaux, services et \u00e9tablissements concern\u00e9s, au rel\u00e8vement des niveaux de mobilisation afin de faire face aux r\u00e9percussions potentielles des fluctuations m\u00e9t\u00e9orologiques susceptibles d\u2019\u00eatre enregistr\u00e9es durant la saison hivernale 2025-2026. [telquel.ma]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, le minist\u00e8re de l\u2019Int\u00e9rieur, en \u00e9troite coordination avec les diff\u00e9rents d\u00e9partements gouvernementaux, services et institutions concern\u00e9s, s\u2019est employ\u00e9 \u00e0 \u00e9lever le niveau de mobilisation pour faire face aux \u00e9ventuelles r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques durant l\u2019hiver 2025-2026. [aujourdhui.ma]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, le minist\u00e8re de l\u2019Int\u00e9rieur, en \u00e9troite coordination avec les diff\u00e9rents d\u00e9partements gouvernementaux, services et institutions concern\u00e9s, s\u2019est employ\u00e9 \u00e0 \u00e9lever le niveau de mobilisation pour faire face aux \u00e9ventuelles r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques durant l\u2019hiver 2025-2026. [maroc-diplomatique.net]\n-------------------------------------------------\nEn ex\u00e9cution des hautes instructions du Roi Mohammed VI, le minist\u00e8re de l\u2019Int\u00e9rieur en \u00e9troite coordination avec les diff\u00e9rents d\u00e9partements gouvernementaux, services et institutions concern\u00e9s, s\u2019est employ\u00e9 \u00e0 \u00e9lever le niveau de mobilisation pour faire face aux \u00e9ventuelles r\u00e9percussions des perturbations m\u00e9t\u00e9orologiques durant l\u2019hiver 2025-2026. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "inwi annonce, le 16 d\u00e9cembre\n2025, l\u2019atterrissement du c\u00e2ble sous-marin...", "mass": 5, "physics": false, "shape": "box", "title": "inwi annonce, le 16 d\u00e9cembre 2025, l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u00e9tape qui marque une avanc\u00e9e majeure dans le renforcement de la souverainet\u00e9 num\u00e9rique du Royaume et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [fr.hespress.com]\n-------------------------------------------------\nL\u2019op\u00e9rateur Inwi annonce l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, le lundi 16 d\u00e9cembre 2025, marquant une avanc\u00e9e majeure pour la souverainet\u00e9 num\u00e9rique du Royaume et l\u2019acc\u00e9l\u00e9ration de l\u2019inclusion digitale \u00e0 l\u2019\u00e9chelle nationale. [www.lopinion.ma]\n-------------------------------------------------\ninwi a annonc\u00e9, le 16 d\u00e9cembre 2025, l\u2019atterrissement du c\u00e2ble sous-marin MEDUSA \u00e0 Nador, une \u0 rWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La s\u00e9lection marocaine de football\nA\u2019 s\u2019est qualifi\u00e9e pour la...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine de football A\u2019 s\u2019est qualifi\u00e9e pour la finale de la Coupe Arabe de football (Qatar-2025), en prenant le dessus sur son homologue \u00e9miratie (3-0), en match des demi-finales, disput\u00e9, lundi au Stade international Khalifa \u00e0 Al Rayyan. [telquel.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine A\u2019 s\u2019est qualifi\u00e9e pour la finale de la Coupe arabe de football (Qatar-2025), en s\u2019imposant sur le score de 3-0 face aux \u00c9mirats arabes unis, [www.challenge.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football A\u2019 s\u2019est qualifi\u00e9e pour la finale de la Coupe Arabe de football (Qatar-2025), en prenant le dessus sur son homologue \u00e9miratie (3-0), en match des demi-finales, disput\u00e9, lundi au Stade international Khalifa \u00e0 Al Rayyan. [atlasinfo.fr]\n-------------------------------------------------\nLa s\u00e9lection marocaine de football A\u2019 s\u2019est qualifi\u00e9e pour la finale de la Coupe Arabe de football (Qatar-2025), en prenant le dessus sur son homologue \u00e9miratie (3-0), en match des demi-finales, disput\u00e9, lundi au Stade international Khalifa \u00e0 Al Rayyan. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Lors de sa 4\u00e8me r\u00e9union\ntrimestrielle de 2025, tenue mardi...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de sa 4\u00e8me r\u00e9union trimestrielle de 2025, tenue mardi 16 d\u00e9cembre, le Conseil de Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9 de maintenir le taux directeur inchang\u00e9 \u00 <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
