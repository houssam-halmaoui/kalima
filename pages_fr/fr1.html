9e et compl\u00e9t\u00e9e. [fr.hespress.com]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants, derni\u00e8re \u00e9tape du circuit l\u00e9gislatif, a adopt\u00e9 \u00e0 la majorit\u00e9, mardi 13 janvier, en deuxi\u00e8me lecture le projet de loi N\u00b071.24 modifiant et compl\u00e9tant [www.challenge.ma]\n-------------------------------------------------\nLe texte a \u00e9t\u00e9 approuv\u00e9 par 95 voix pour et 40 contre, \u00e0 l\u2019issue d\u2019une session l\u00e9gislative consacr\u00e9e \u00e0 l\u2019examen des dispositions issues de la deuxi\u00e8me lecture. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La Chambre des repr\u00e9sentants a\nadopt\u00e9, mardi \u00e0 la majorit\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u0027Assurance-maladie obligatoire de base. [lematin.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u0027Assurance-maladie obligatoire de base (AMO) ainsi que d\u0027autres dispositions sp\u00e9cifiques. [www.lopinion.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u2019Assurance-maladie obligatoire de base (AMO) ainsi que d\u2019autres dispositions sp\u00e9cifiques. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "L\u2019op\u00e9ration portera sur l\u2019\u00e9mission de\n1,5 million de nouvelles actions,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019op\u00e9ration portera sur l\u2019\u00e9mission de 1,5 million de nouvelles actions, propos\u00e9es \u00e0 un prix de souscription de 300 dirhams par action. [lematin.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a annonc\u00e9 avoir vis\u00e9, mardi, le prospectus relatif \u00e0 l\u2019augmentation de capital de Risma, soci\u00e9t\u00e9 d\u2019investissement et propri\u00e9taire h\u00f4telier. [telquel.ma]\n-------------------------------------------------\nD\u0027un montant global de 450 millions de dirhams (MDH), cette op\u00e9ration porte sur 1.500.000 actions, avec un prix de souscription de 300 dirhams. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le Bahre\u00efn r\u00e9it\u00e8re son soutien\n\u00e0 la marocanit\u00e9 du Sahara...", "mass": 5, "physics": false, "shape": "box", "title": "Le Bahre\u00efn r\u00e9it\u00e8re son soutien \u00e0 la marocanit\u00e9 du Sahara et \u00e0 l\u2019initiative d\u2019autonomie en tant que solution r\u00e9aliste et applicable. [lematin.ma]\n-------------------------------------------------\nLe Royaume de Bahre\u00efn r\u00e9it\u00e8re \u201csa position de soutien \u00e0 la marocanit\u00e9 du Sahara et \u00e0 l\u2019initiative d\u2019autonomie pour le r\u00e8glement de la question du Sahara marocain\u201d, indique un communiqu\u00e9 de [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Initi\u00e9 par l\u2019EMA en partenariat\navec Safran et l\u2019Institut des...", "mass": 5, "physics": false, "shape": "box", "title": "Initi\u00e9 par l\u2019EMA en partenariat avec Safran et l\u2019Institut des M\u00e9tiers de l\u2019A\u00e9ronautique (IMA), ce programme vise \u00e0 former et accompagner 130 jeunes par an, afin de leur permettre d. [lematin.ma]\n-------------------------------------------------\nL\u2019association Enfance Maghreb Avenir (EMA) a proc\u00e9d\u00e9, mardi \u00e0 Nouaceur, au lancement du programme AeroChance, une initiative destin\u00e9e \u00e0 accompagner l\u2019insertion professionnelle de jeunes marocains \u00e2g\u00e9s de 18 \u00e0 30 ans, avec ou sans dipl\u00f4me, dans le secteur de l\u2019a\u00e9ronautique. [telquel.ma]\n-------------------------------------------------\nUn nouveau dispositif d\u2019accompagnement \u00e0 l\u2019emploi destin\u00e9 aux jeunes vient d\u2019\u00eatre lanc\u00e9 \u00e0 Nouaceur avec le programme \u00ab AeroChance \u00bb, port\u00e9 par l\u2019association Enfance Maghreb Avenir en partenariat avec le groupe Safran et l\u2019Institut des M\u00e9tiers de l\u2019A\u00e9ronautique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le nombre total provisoire des\ncitoyens inscrits sur les listes...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre total provisoire des citoyens inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales \u00e0 l\u0027\u00e9chelle nationale a atteint pr\u00e8s de 16,5 millions, au cours de la phase actuelle de l\u0027op\u00e9ration de r\u00e9vision annuelle desdites listes, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u0027Int\u00e9rieur, Abdelouafi Laftit. [www.lopinion.ma]\n-------------------------------------------------\nAbdelouafi Laftit, ministre de l\u2019Int\u00e9rieur, a r\u00e9v\u00e9l\u00e9 ce mardi, lors de la s\u00e9ance des questions orales \u00e0 la Conseil des conseillers, que le bilan de l\u2019op\u00e9ration de r\u00e9vision annuelle ordinaire des listes \u00e9lectorales g\u00e9n\u00e9rales a abouti, \u00e0 ce stade, \u00e0 l\u2019inscription de 382.170 nouveaux \u00e9lecteurs, contre la radiation de 1,4 million de cas pour des. [telquel.ma]\n-------------------------------------------------\nLe nombre total provisoire des citoyens inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales \u00e0 l\u2019\u00e9chelle nationale a atteint pr\u00e8s de 16,5 millions, au cours de la phase actuelle de l\u2019op\u00e9ration de r\u00e9vision annuelle desdites listes, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [maroc-diplomatique.net]\n-------------------------------------------------\nLe nombre total provisoire des citoyens inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales \u00e0 l\u2019\u00e9chelle nationale a atteint pr\u00e8s de 16,5 millions, a annonc\u00e9 mardi le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit, lors d\u2019une s\u00e9ance de questions orales \u00e0 la Chambre des conseillers. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Le chiffre d\u2019affaires (CA) des\nneuf soci\u00e9t\u00e9s de distribution en...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires (CA) des neuf soci\u00e9t\u00e9s de distribution en gros du gasoil et d\u2019essence (hors carburant marin) s\u0027est \u00e9tabli \u00e0 18,91 milliards de dirhams (MMDH) au troisi\u00e8me trimestre (T3) 2025, selon le Conseil de la concurrence. [www.lopinion.ma]\n-------------------------------------------------\nLes marges brutes par litre r\u00e9alis\u00e9es par les neuf soci\u00e9t\u00e9s de distribution en gros du gasoil et d\u2019essence concern\u00e9es par le reporting du Conseil de la concurrence ont \u00e9t\u00e9 quasi-stables au titre du troisi\u00e8me trimestre de l\u2019ann\u00e9e 2025. [telquel.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires (CA) des neuf soci\u00e9t\u00e9s de di <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');

            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
