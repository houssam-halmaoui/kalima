rue, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le Maroc a r\u00e9affirm\u00e9, jeudi\nlors d\u2019une r\u00e9union informelle du...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a r\u00e9affirm\u00e9, jeudi lors d\u2019une r\u00e9union informelle du Conseil de s\u00e9curit\u00e9 des Nations unies, son soutien et sa solidarit\u00e9 absolue avec l\u2019Arabie saoudite \u00e0 la suite des attaques \u201cl\u00e2ches\u201d perp\u00e9tr\u00e9es par les rebelles houthis. [telquel.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations Unies selon la formule Arria, que le Maroc consid\u00e8re la gestion des d\u00e9troits comme une responsabilit\u00e9 et non comme une propri\u00e9t\u00e9, appelant \u00e0 une initiative visant. [telquel.ma]\n-------------------------------------------------\nLe Maroc a exprim\u00e9 son \u00absoutien et sa solidarit\u00e9 absolue\u00bb envers l\u2019Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux Houthis, lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU organis\u00e9e le 17 septembre selon la formule Arria. [www.yabiladi.com]\n-------------------------------------------------\nDevant le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, Nasser Bourita a appel\u00e9 \u00e0 renforcer la r\u00e9ponse internationale aux crises qui touchent les d\u00e9troits d\u2019Ormuz et de Bab al-Mandab. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a affirm\u00e9 jeudi devant le Conseil de s\u00e9curit\u00e9 de l\u0027ONU que le Maroc consid\u00e8re la gestion des d\u00e9troits comme une responsabilit\u00e9 et non une propri\u00e9t\u00e9, appelant \u00e0 un code de conduite international pour les pays riverains et proposant d\u0027accueillir un forum sur la libert\u00e9 de navigation. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a r\u00e9affirm\u00e9 jeudi devant le Conseil de s\u00e9curit\u00e9 de l\u0027ONU le soutien et la solidarit\u00e9 absolue du Maroc avec l\u0027Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux rebelles houthis, tout en alertant sur la menace pesant sur les d\u00e9troits de Bab al-Mandab et d\u0027Ormuz. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc a r\u00e9affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations unies selon la formule Arria, son soutien et sa solidarit\u00e9 absolue avec le Royaume d\u2019Arabie saoudite \u00e0 la suite des attaques \u00ab l\u00e2ches \u00bb perp\u00e9tr\u00e9es par les rebelles houthis. \u00ab [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations Unies selon la formule Arria, que le Maroc consid\u00e8re la gestion des d\u00e9troits comme une responsabilit\u00e9 et non comme une propri\u00e9t\u00e9, appelant \u00e0 une initiative visant [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "L\u2019Agence nationale des eaux et\nfor\u00eats (ANEF) a annonc\u00e9, jeudi,...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des eaux et for\u00eats (ANEF) a annonc\u00e9, jeudi, la mise en \u0153uvre d\u2019un programme de conservation ex situ du Turnix d\u2019Andalousie (Turnix sylvaticus sylvaticus), destin\u00e9 \u00e0 contribuer \u00e0 la sauvegarde de cette sous-esp\u00e8ce d\u2019oiseau menac\u00e9e et au renforcement des efforts de conservation engag\u00e9s au Maroc. [telquel.ma]\n-------------------------------------------------\nUn programme de protection du Turnix d\u2019Andalousie (Turnix sylvaticus sylvaticus) a \u00e9t\u00e9 mis en place pour pr\u00e9server cette sous-esp\u00e8ce menac\u00e9e et am\u00e9liorer ses chances de survie au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le renforcement de la coop\u00e9ration\nentre les acteurs \u00e9conomiques et...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement de la coop\u00e9ration entre les acteurs \u00e9conomiques et les hommes d\u2019affaires marocains et leurs homologues mauritaniens a \u00e9t\u00e9 au centre des entretiens, mercredi \u00e0 Nouakchott, de l\u2019ambassadeur du Maroc en R\u00e9publique Islamique de Mauritanie, Hamid Chabar, avec le pr\u00e9sident de l\u2019Union nationale du patronat mauritanien (UNPM), Mohamed Zein El Abidine Ould Cheikh Ahmed.. [telquel.ma]\n-------------------------------------------------\nLe renforcement de la coop\u00e9ration entre les acteurs \u00e9conomiques et les hommes d\u2019affaires marocains et leurs homologues mauritaniens a \u00e9t\u00e9 au centre des entretiens, mercredi \u00e0 Nouakchott, de l\u2019ambassadeur du Maroc en R\u00e9publique Islamique de Mauritanie, Hamid Chabar, avec le pr\u00e9sident de l\u2019Union nationale du patronat mauritanien (UNPM), Mohamed Zein El Abidine Ould Cheikh Ahmed. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Un dialogue \u201couvert, franc et\nserein demeure la voie \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Un dialogue \u201couvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re\u201d, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami, \u00e0 la suite de l\u2019adoption, jeudi 17 septembre par le Parlement europ\u00e9en, d\u2019une. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s le vote du Parlement europ\u00e9en sur les \u00e9v\u00e9nements de Sebta, l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, a soulign\u00e9 que le texte ne comporte \u00abaucune incrimination ou injonction\u00bb \u00e0 l\u2019encontre du Maroc et appelle \u00e0 privil\u00e9gier le dialogue pour traiter les enjeux migratoires. [www.lavieeco.com]\n-------------------------------------------------\nApr\u00e8s l\u0027adoption jeudi par le Parlement europ\u00e9en d\u0027une r\u00e9solution sur les \u00e9v\u00e9nements survenus fin juillet \u00e0 Sebta, l\u0027ambassadeur du Maroc aupr\u00e8s de l\u0027Union europ\u00e9enne et de l\u0027OTAN, Ahmed Reda Chami, a plaid\u00e9 pour un dialogue franc et responsable, affirmant que le texte ne comporte aucune incrimination contre le Royaume. [atlasinfo.fr]\n-------------------------------------------------\nUn dialogue ouvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami \u00e0 la suite de l\u2019adoption, jeudi, par le Parlement europ\u00e9en d\u2019une r\u00e9solution sur [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le jeune milieu offensif marocain\nSafouane Benzahra, 18 ans, devrait...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune milieu offensif marocain Safouane Benzahra, 18 ans, devrait signer dans les prochains jours son premier contrat professionnel avec l\u2019AS Monaco, club fran\u00e7ais de Ligue 1, rapportent des m\u00e9dias sp\u00e9cialis\u00e9s. [telquel.ma]\n-------------------------------------------------\nLe jeune talent marocain Safouane Ben Zahra, \u00e2g\u00e9 de 18 ans, sappr\u00eate \u00e0 signer son premier contrat professionnel avec l\u2019AS Monaco, selon plusieurs sources sp\u00e9cialis\u00e9es. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Maghreb de F\u00e8s (MAS),\nchampion en titre de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [telquel.ma]\n-------------------------------------------------\nLe Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Depuis le 25 juillet 2026,\nFouzi Lekjaa est membre de...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis le 25 juillet 2026, Fouzi Lekjaa est membre de la direction du Parti Authenticit\u00e9 et modernit\u00e9 (PAM). [telquel.ma]\n-------------------------------------------------\nFouzi Lekjaa, membre du bureau politique du Parti authenticit\u00e9 et modernit\u00e9 (PAM), s\u2019est rendu ce jeudi 17 septembre 2026 dans la province de Figuig, accompagn         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

            setTimeout(positionCommunityLabels, 50);

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {

                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });

            childList: true,
            subtree: true
        });
