al de lutte contre les feux de for\u00eat, \u00e0 travers la mobilisation de l\u0027ensemble de. [lematin.ma]\n-------------------------------------------------\nLes Forces Arm\u00e9es Royales (FAR) s\u2019acquittent d\u2019un r\u00f4le central dans le dispositif national de lutte contre les feux de for\u00eat, \u00e0 travers la mobilisation de l\u2019ensemble de leurs moyens a\u00e9riens, notamment une flotte de 8 avions de type Canadair CL-415 relevant des Forces Royales Air (FRA), outre 15 avions de type Turbo Thrush et deux. [telquel.ma]\n-------------------------------------------------\nAu sein d\u2019un dispositif coordonn\u00e9 avec les services civils, les Canadair, Turbo Thrush et h\u00e9licopt\u00e8res Super Puma interviennent pour prot\u00e9ger populations, biens et patrimoine forestier. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le jeune alpiniste marocain Youssef\nTazi a annonc\u00e9 avoir atteint,...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune alpiniste marocain Youssef Tazi a annonc\u00e9 avoir atteint, le 1er ao\u00fbt 2026 \u00e0 9 h 13, le sommet du Kang Yatse II, dans l\u0027Himalaya indien, culminant \u00e0 6.250 m\u00e8tres d\u0027. [lematin.ma]\n-------------------------------------------------\nLe jeune alpiniste marocain Youssef Tazi, \u00e2g\u00e9 de 15 ans, a atteint samedi dernier le sommet du Kang Yatse II, culminant \u00e0 6.250 m\u00e8tres dans l\u2019Himalaya indien, au terme d\u2019une exp\u00e9dition de huit jours. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Un juge espagnol ne peut\npas d\u00e9manteler le dispositif de...", "mass": 5, "physics": false, "shape": "box", "title": "Un juge espagnol ne peut pas d\u00e9manteler le dispositif de lutte contre l\u2019immigration clandestine et demander au Maroc d\u2019en assumer les cons\u00e9quences (source gouvernementale marocaine). [lematin.ma]\n-------------------------------------------------\nUne source gouvernementale marocaine a affirm\u00e9 lundi qu\u0027un juge espagnol ne peut pas d\u00e9manteler le dispositif de lutte contre l\u0027immigration clandestine et demander ensuite au Maroc d\u0027en assumer les cons\u00e9quences, imputant la crise \u00e0 Sebta \u00e0 une d\u00e9cision de justice espagnole. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Club Afrique D\u00e9veloppement d\u0027Attijariwafa\nbank a cl\u00f4tur\u00e9, le 29...", "mass": 5, "physics": false, "shape": "box", "title": "Le Club Afrique D\u00e9veloppement d\u0027Attijariwafa bank a cl\u00f4tur\u00e9, le 29 juillet \u00e0 Al Maqam, \u00e0 Tahannaoute, l\u0027\u00e9dition 2026 de la r\u00e9sidence artistique panafricaine JamSalam. [lematin.ma]\n-------------------------------------------------\nLa r\u00e9sidence artistique panafricaine JamSalam 2026*, organis\u00e9e par le Club Afrique D\u00e9veloppement d\u2019Attijariwafa bank, s\u2019est cl\u00f4tur\u00e9e le 29 juillet dernier \u00e0 Al Maqam, Tahannaoute (Maroc), apr\u00e8s deux semaines durant lesquelles 15 artistes de 15 pays africains ont cr\u00e9\u00e9, dialogu\u00e9 et d\u00e9velopp\u00e9 des liens forts de fraternit\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019\u00e9quipe nationale f\u00e9minine de football\ns\u2019est qualifi\u00e9e pour les quarts...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale f\u00e9minine de football s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe d\u2019Afrique des nations (Maroc-2026) apr\u00e8s un match nul (0-0) face \u00e0 son homologue s\u00e9n\u00e9galaise, lundi soir au Stade Moulay El Has                 if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
