rue, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Les livraisons de ciment ont\natteint plus de 1,04 million...", "mass": 5, "physics": false, "shape": "box", "title": "Les livraisons de ciment ont atteint plus de 1,04 million de tonnes (MT) \u00e0 fin janvier 2025, en hausse de 18,77% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon le minist\u00e8re de l\u0027Am\u00e9nagement du territoire national, de l\u0027Urbanisme, de l\u0027Habitat et de la Politique de la ville. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville a fait savoir que les livraisons de ciment ont atteint plus de 1,04 million de tonnes (MT) \u00e0 fin janvier 2025, en baisse de 18,77% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant. [fr.hespress.com]\n-------------------------------------------------\nLes livraisons de ciment ont atteint plus de 1,04 million de tonnes (MT) \u00e0 fin janvier 2025, en hausse de 18,77% par rapport \u00e0 la m\u00eame p\u00e9riode une ann\u00e9e auparavant, selon le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Il exhorte par la m\u00eame\noccasion les habitants des zones...", "mass": 5, "physics": false, "shape": "box", "title": "Il exhorte par la m\u00eame occasion les habitants des zones \u00e0 risque \u00e0 respecter strictement les consignes d\u2019\u00e9vacuation et \u00e0 se conformer aux directives des autorit\u00e9s. [www.lavieeco.com]\n-------------------------------------------------\nLe minist\u00e8re de l\u2019Int\u00e9rieur a fait le point, ce jeudi 5 f\u00e9vrier, sur les op\u00e9rations d\u2019\u00e9vacuation des populations expos\u00e9es aux risques d\u2019inondations, et qui se chiffrent \u00e0 plus de 143.000 personnes. [fr.hespress.com]\n-------------------------------------------------\nCes interventions sont men\u00e9es en tenant compte des niveaux de danger et des d\u00e9g\u00e2ts potentiels, avec des moyens logistiques adapt\u00e9s pour garantir un relogement dans des conditions optimales. [www.yabiladi.com]\n-------------------------------------------------\nLes op\u00e9rations d\u2019\u00e9vacuation des habitants des communes expos\u00e9es aux risques d\u2019inondations ont permis, \u00e0 ce jour, de transporter et d\u2019\u00e9vacuer un total de 143.164 personnes, r\u00e9parties sur plusieurs provinces, dans le cadre des interventions pr\u00e9ventives visant \u00e0 prot\u00e9ger les vies et garantir la s\u00e9curit\u00e9 des citoyens, selon des donn\u00e9es actualis\u00e9es du minist\u00e8re de l\u2019Int\u00e9rieur. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Intervenant lors de la pr\u00e9sentation\ndu programme annuel des activit\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Intervenant lors de la pr\u00e9sentation du programme annuel des activit\u00e9s culturelles espagnoles pour l\u2019ann\u00e9e 2026, il a relev\u00e9 que cette base permet d\u2019aller de l\u2019avant dans le renforcement des . [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc et l\u2019Espagne entretiennent des relations culturelles enracin\u00e9es, fond\u00e9es sur une \"base solide\", a affirm\u00e9, mercredi \u00e0 Rabat, l\u2019ambassadeur d\u2019Espagne au Royaume, Enrique Ojeda Vila. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Maroc a \u00e9t\u00e9 \u00e9lu,\nmercredi dans                                 };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
