\u00e9rieur des oul\u00e9mas a annonc\u00e9 le montant de la Zakat Al Fitr pour lann\u00e9e 144 (2026) au Maroc, fixant \u00e0 25 dirhams par personne. [www.yabiladi.com]\n-------------------------------------------------\nLe Conseil sup\u00e9rieur des oul\u00e9mas pr\u00e9cise que la Zakat consiste \u00e0 offrir un boisseau proph\u00e9tique (Sa\u00e2 nabaoui) qui \u00e9quivaut \u00e0 4 amd\u00e2d par personne en fonction de l\u2019essentiel de la consommation de la population, soit l\u2019\u00e9quivalent de 2,5 kg de c\u00e9r\u00e9ales ou de farine, affirmant qu\u2019il est possible de la verser sous forme d\u2019argent. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le Maroc a atteint en\n2025 un niveau in\u00e9dit d\u2019importations...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a atteint en 2025 un niveau in\u00e9dit d\u2019importations de pistaches, avec un volume total de 4.050 tonnes pour une valeur estim\u00e9e \u00e0 33,9 millions de dollars. [lematin.ma]\n-------------------------------------------------\nSelon EastFruit, le pays en a achet\u00e9 4.050 tonnes pour une valeur de 33,9 millions de dollars, soit une hausse de 27,5% par rapport \u00e0 2024. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Dipl\u00f4m\u00e9 de l\u2019\u00c9cole Mohammadia d\u2019Ing\u00e9nieurs\net titulaire d\u2019un MBA de...", "mass": 5, "physics": false, "shape": "box", "title": "Dipl\u00f4m\u00e9 de l\u2019\u00c9cole Mohammadia d\u2019Ing\u00e9nieurs et titulaire d\u2019un MBA de l\u2019\u00c9cole Nationale des Ponts et Chauss\u00e9es, Ali Alami a d\u00e9but\u00e9 sa carri\u00e8re au sein du Groupe OCP. [lematin.ma]\n-------------------------------------------------\n\u00c0 la suite du conseil d\u2019administration tenu le 6 mars, la Soci\u00e9t\u0 es \u00ab agressions iraniennes abjectes \u00bb visant ces \u00c9tats, traduisent la solidarit\u00e9 du Maroc avec . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Botola Pro D1 inwi Le\nclub de l\u2019Ittihad de Tanger...", "mass": 5, "physics": false, "shape": "box", "title": "Botola Pro D1 inwi Le club de l\u2019Ittihad de Tanger a annonc\u00e9, mercredi, la signature d\u2019un contrat avec le technicien alg\u00e9rien Abdelhak Benchikha pour prendre les r\u00eanes de l\u2019\u00e9quipe premi\u00e8re, pour une dur\u00e9e d\u2019une saison et demie. [aujourdhui.ma]\n-------------------------------------------------\nL\u0027ancien coach du Raja et de Berkane retrouve un club qu\u0027il a d\u00e9j\u00e0 dirig\u00e9 par le pass\u00e9, avec la mission de redresser la barre apr\u00e8s un d\u00e9but de saison en demi-teinte. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "R\u00e9alis\u00e9e selon les traditions les\nplus authentiques de l\u2019art de...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9alis\u00e9e selon les traditions les plus authentiques de l\u2019art de la sculpture sur bois pour lequel la ville historique d\u0027Essaouira est r\u00e9put\u00e9e, l\u2019\u0153uvre prim\u00e9e est une \"Croix du Christ\" sculpt\u00e9e dans du bois de thuya. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027artisanat marocain, \u00e0 travers une \u0153uvre des artisans de la ville d\u2019Essaouira, a \u00e9t\u00e9 distingu\u00e9 jeudi soir \u00e0 S\u00e9ville par le Prix Dem\u00f3filo, d\u00e9cern\u00e9 aux \u0153uvres artistiques remarquables refl\u00e9tant la cr\u00e9ativit\u00e9 ainsi que la dimension culturelle et civilisationnelle de l\u2019artisanat. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "colo         const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
