00e9 nationale et de...", "mass": 5, "physics": false, "shape": "box", "title": "Abdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire, a re\u00e7u ce mardi, au si\u00e8ge de la DGSN \u00e0 Rabat, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi, chef du Service de la s\u00e9curit\u00e9 de l\u2019\u00c9tat du Qatar, accompagn\u00e9 d\u2019une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau. [fr.hespress.com]\n-------------------------------------------------\nLe directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), Abdellatif Hammouchi et le Chef du Service de la S\u00e9curit\u00e9 de l\u0027\u00c9tat du Qatar, Khalf. [lematin.ma]\n-------------------------------------------------\nAbdellatif Hammouchi, directeur g\u00e9n\u00e9ral de la S\u00fbret\u00e9 nationale et de la Surveillance du territoire (DGSN-DGST), a re\u00e7u mardi \u00e0 Rabat le chef de la S\u00fbret\u00e9 de l\u2019\u00c9tat du Qatar, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi. [www.yabiladi.com]\n-------------------------------------------------\nLe Directeur G\u00e9n\u00e9ral de la S\u00fbret\u00e9 Nationale et de la Surveillance du Territoire (DGSN-DGST), M. Abdellatif Hammouchi, a re\u00e7u, mardi \u00e0 Rabat, le Chef du Service de la S\u00e9curit\u00e9 de l\u2019\u00c9tat du Qatar, Khalfan bin Ali bin Khalfan Al-Batty Al-Kaabi, en pr\u00e9sence d\u2019une d\u00e9l\u00e9gation s\u00e9curitaire de haut niveau des deux parties. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Une op\u00e9ration conjointe de contr\u00f4le\naux fronti\u00e8res, de la police...", "mass": 5, "physics": false, "shape": "box", "title": "Une op\u00e9ration conjointe de contr\u00f4le aux fronti\u00e8res, de la police et des services douaniers a permis de d\u00e9jouer, mardi 3 novembre, une tentative de trafic international de stup\u00e9fiants au port Tanger Med. [fr.hespress.com]\n-------------------------------------------------\nUne op\u00e9ration s\u00e9curitaire conjointe, men\u00e9e ce mardi 3 novembre au port de Tanger-Med par les services de la police et des Douanes, a permis de faire \u00e9chec \u00e0 une tentative de trafic international de stup\u00e9fiants et de substances psychotropes, aboutissant \u00e0 la saisie de 971 kilogrammes de coca\u00efne. [telquel.ma]\n-------------------------------------------------\nLes services de la S\u00fbret\u00e9 nationale et de la Douane ont d\u00e9jou\u00e9, mardi au port Tanger Med, une op\u00e9ration de trafic international de drogue, dissimul\u00e9e dans un conteneur frigorifique. [www.lavieeco.com]\n-------------------------------------------------\nUne op\u00e9ration s\u00e9curitaire conjointe des services de la S\u00fbret\u00e9 nationale et de la Douane r\u00e9alis\u00e9e, mardi apr\u00e8s-midi au Port Tanger Med, a permis la mise en \u00e9chec d\u2019une op\u00e9ration de trafic international de drogues et de psychotropes et la saisie d\u2019un total de 971 kilogrammes de coca\u00efne. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies\ntiendra, le 10 novembre prochain...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies tiendra, le 10 novembre prochain \u00e0 New York, une s\u00e9ance consacr\u00e9e aux v\u00e9tos oppos\u00e9s lors du vote du 30 octobre sur le Sahara marocain. [lematin.ma]\n-------------------------------------------------\nLe pr\u00e9sident de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies a convoqu\u00e9 une r\u00e9union formelle le 10 novembre 2026 pour discuter de l\u2019usage du veto au Conseil de s\u00e9curit\u00e9, concernant la question du Sahara. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La cheffe du gouvernement, Fatima\nZahra El Mansouri, a pr\u00e9sid\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Zahra El Mansouri, a pr\u00e9sid\u00e9, mardi 3 novembre 2026 \u00e0 Rabat, une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique. [lematin.ma]\n-------------------------------------------------\nFatima Ezzahra El Mansouri a indiqu\u00e9, ce mardi 3 novembre dans un communiqu\u00e9 publi\u00e9 sur ses r\u00e9seaux sociaux, avoir pr\u00e9sid\u00e9 \u00e0 Rabat une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique nationale, au suivi du pouvoir d\u2019achat des citoyennes et des citoyens, ainsi qu\u2019\u00e0 l\u2019\u00e9tude de l\u2019impact des fluctuations des prix sur. [telquel.ma]\n-------------------------------------------------\nLa Premi\u00e8re ministre Fatima Zahra Mansouri a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union ax\u00e9e sur les r\u00e9cents d\u00e9veloppements de l\u2019\u00e9conomie nationale, le suivi du pouvoir d\u2019achat des citoyens et l\u2019impact des fluctuations des prix sur le march\u00e9 int\u00e9rieur, ainsi que sur la vie quotidienne des Marocains, selon un communiqu\u00e9 de la Primature. [www.yabiladi.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union sur l\u0027\u00e9volution de la situation \u00e9conomique nationale et du pouvoir d\u0027achat. [www.lavieeco.com]\n-------------------------------------------------\nLa Cheffe du gouvernement, Fatima Ezzahra El Mansouri a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union consacr\u00e9e aux derniers d\u00e9veloppements de la situation de l\u2019\u00e9conomie nationale, au suivi de l\u2019\u00e9volution du pouvoir d\u2019achat et \u00e0 l\u2019examen de l\u2019impact des fluctuations des prix sur le march\u00e9 national et le quotidien des citoyens. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Faisant partie des chocs phares\nde la Botola Pro Inwi...", "mass": 5, "physics": false, "shape": "box", "title": "Faisant partie des chocs phares de la Botola Pro Inwi D1, le clasico opposant le Raja de Casablanca \u00e0 l\u2019AS FAR se d\u00e9roule, ce mercredi (20 h), au stade olympique de Rabat. [lematin.ma]\n-------------------------------------------------\nReport\u00e9 lors de la premi\u00e8re journ\u00e9e de la Botola Pro D1 Inwi, le choc entre l\u2019AS FAR et le Raja Casablanca se dispute ce mercredi au stade Olympique de Rabat. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Alors que plusieurs hypoth\u00e8ses circulent\nsur les circonstances de leur...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que plusieurs hypoth\u00e8ses circulent sur les circonstances de leur d\u00e9c\u00e8s, les investigations se sont intensifi\u00e9es ce mardi, avec le d\u00e9ploiement d\u2019\u00e9quipes sp\u00e9cialis\u00e9es et de chiens de recherche. [telquel.ma]\n-------------------------------------------------\nLa d\u00e9couverte macabre de deux jeunes hommes dans la for\u00eat d\u2019Oued Nfifikh, pr\u00e8s de Mohammedia, a enclench\u00e9 une enqu\u00eate approfondie et une mobilisation s\u00e9curitaire denvergure. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La jeune cr\u00e9atrice culinaire marocaine\nTouria Laalioui-Mbarek a re\u00e7u le...", "mass": 5, "physics": false, "shape": "box", "title": "La jeune cr\u00e9atrice culinaire marocaine Touria Laalioui-Mbarek a re\u00e7u le Grand prix du Paris-Brest de la p\u00e2tisserie fran\u00e7aise, dans la cat\u00e9gorie \u00ab amateurs \u00bb, d\u00e9cern\u00e9 \u00e0 l\u2019occasion du Salon du Chocolat \u0026 de la P\u00e2tisserie de Paris, organis\u00e9 du 28 octobre au 1er novembre. [telquel.ma]\n-------------------------------------------------\nLa cr\u00e9atrice culinaire marocaine Touria Laalioui-Mbarek a d\u00e9croch\u00e9 le prix dans la cat\u00e9gorie amateur du Grand Prix du Paris-Brest de la P\u00e2tisserie Fran\u00e7aise, lors du Salon du chocolat et de la p\u00e2tisserie de Paris, tenu du 28 octobre au 1er novembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "L\u2019Orchestre philharmonique du Maroc (OPM)\ndonnera trois concerts \u00e0 Casablanca...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Orchestre philharmonique du Maroc (OPM) donnera trois concerts \u00e0 Casablanca et \u00e0 Rabat, du 20 au 22 novembre, consacr\u00e9s \u00e0 deux symphonies de Ludwig van Beethoven : la Deuxi\u00e8me et la Quatri\u00e8me. [telquel.ma]\n-------------------------------------------------\nDu 20 au 22 novembre 2026 \u00e0 Casablanca et Rabat, deux symphonies du compositeur allemand seront revisit\u00e9es \u00e0 travers un dialogue artistique entre les sonorit\u00e9s de l\u2019orchestre et l\u2019expression des corps. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Agence nationale des ports (ANP)\net l\u2019Agence fran\u00e7aise de d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des ports (ANP) et l\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) ont sign\u00e9, mardi \u00e0 Rabat, une d\u00e9claration conjointe relative au troisi\u00e8me financement du partenariat ANP-AFD, d\u2019un montant global de 100 millions d\u2019euros, d\u00e9di\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [telquel.ma]\n-------------------------------------------------\nL\u0027Agence nationale des ports et l\u0027Agence fran\u00e7aise de d\u00e9veloppement ont sign\u00e9 une d\u00e9claration conjointe relative au troisi\u00e8me financement de leur partenariat strat\u00e9gique, destin\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Agence nationale des ports et l\u2019Agence fran\u00e7aise de d\u00e9veloppement franchissent une nouvelle \u00e9tape dans leur partenariat strat\u00e9gique. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Mohamed Nabil Benabdellah, ministre de\nl\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de...", "mass": 5, "physics": false, "shape": "box", "title": "Mohamed Nabil Benabdellah, ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, a annonc\u00e9, ce mardi, une initiative visant \u00e0 porter de 35 \u00e0 40 ans l\u2019\u00e2ge limite pour se pr\u00e9senter aux concours d\u2019acc\u00e8s au m\u00e9tier d\u2019enseignant. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, Nabil Benabdellah, a re\u00e7u lundi \u00e0 Rabat Khadija Boumlik, \u00e9l\u00e8ve distingu\u00e9e, class\u00e9e quatri\u00e8me au concours D\u00e9fi de la lecture arabe. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "L\u2019entra\u00eeneur de l\u2019\u00e9quipe nationale masculine\nde football U17, Ahmed Kantari...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019entra\u00eeneur de l\u2019\u00e9quipe nationale masculine de football U17, Ahmed Kantari a d\u00e9voil\u00e9, mardi, la liste finale des joueurs retenus pour disputer la 21\u00e8me \u00e9dition de la Coupe du monde FIFA Qatar 2026. [telquel.ma]\n-------------------------------------------------\nMardi \u00e0 Rabat, Ahmed Kantari, le s\u00e9lectionneur de l\u00e9quipe nationale masculine U17, a d\u00e9voil\u00e9 la liste d\u00e9finitive de 21 joueurs s\u00e9lectionn\u00e9s pour la Coupe du monde FIFA U17 Qatar 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Managem a demand\u00e9 la reprise\nde la cotation de son...", "mass": 5, "physics": false, "shape": "box", "title": "Managem a demand\u00e9 la reprise de la cotation de son titre \u00e0 compter de ce mardi 3 novembre, d\u00e8s l\u2019ouverture de la s\u00e9ance, apr\u00e8s une suspension intervenue le 30 octobre. [telquel.ma]\n-------------------------------------------------\nLe groupe minier a sollicit\u00e9 la suspension de la cotation de son titre depuis le 30 octobre dernier suite \u00e0 sa r\u00e9servation \u00e0 la baisse de 10% cons\u00e9cutivement au changement des r\u00e8gles de pond\u00e9ration par la Bourse de Casablanca. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 la suite de la modification de la composition de l\u2019indice MASI, des informations non confirm\u00e9es ont commenc\u00e9 \u00e0 circuler sur le march\u00e9 au sujet du titre Managem. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Des averses orageuses avec risque\nde gr\u00eale et rafales de...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale et rafales de vent sous orages sont attendues, mardi et mercredi, dans plusieurs provinces du Royaume, a indiqu\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses comprises entre 30 et 40 mm, accompagn\u00e9es d\u2019un risque de gr\u00eale et de rafales de vent sous orages, sont attendues mardi et mercredi dans plusieurs provinces du Royaume, selon un bulletin d\u2019alerte de niveau orange de la DGM. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Marchica Med, filiale de l\u2019Agence\npour l\u2019am\u00e9nagement du site de...", "mass": 5, "physics": false, "shape": "box", "title": "Marchica Med, filiale de l\u2019Agence pour l\u2019am\u00e9nagement du site de la lagune de Marchica, a annonc\u00e9 le lancement prochain des travaux de construction d\u2019un complexe h\u00f4telier haut de gamme s\u2019inscrivant pleinement dans la dynamique d\u2019essor touristique et \u00e9conomique de la province de Nador. [telquel.ma]\n-------------------------------------------------\nLa filiale Marchica Med de lAgence pour lam\u00e9nagement du site de la lagune de Marchica a annonc\u00e9, le 2 novembre 2026 \u00e0 Nador, le lancement dun complexe h\u00f4telier prestigieux sur le site de la lagune. [www.yabiladi.com]\n-------------------------------------------------\nRepr\u00e9sentant un investissement global estim\u00e9 \u00e0 plus de 585 millions de dirhams (MDH) incluant le foncier, le projet, dont la mise en exploitation est pr\u00e9vue en 2029, devrait contribuer de mani\u00e8re significative au rayonnement national et international croissant de Nador et \u00e0 l\u0027\u00e9conomie locale et r\u00e9gionale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le ministre de l\u2019\u00c9quipement, de\nl\u2019Eau et des For\u00eats, Nizar...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9quipement, de l\u2019Eau et des For\u00eats, Nizar Baraka, a affirm\u00e9, lundi \u00e0 Rabat, que son d\u00e9partement a lanc\u00e9 une nouvelle strat\u00e9gie en mati\u00e8re de s\u00e9curit\u00e9 hydrique, qui prend en consid\u00e9ration les grandes mutations li\u00e9es aux changements climatiques. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement, de l\u2019Eau et des For\u00eats a pr\u00e9sent\u00e9 lundi devant la Chambre des repr\u00e9sentants les grandes lignes d\u2019un plan de pr\u00e9vention des inondations reposant sur cinq piliers, qui vise \u00e0 porter la capacit\u00e9 nationale de stockage \u00e0 27 milliards de m\u00e8tres cubes d\u2019ici 2031. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le taux de ch\u00f4mage strict\nest pass\u00e9, entre le deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de ch\u00f4mage strict est pass\u00e9, entre le deuxi\u00e8me et le troisi\u00e8me trimestre 2026, de 9,5% \u00e0 10,5% au niveau national, ressort-il de la r\u00e9cente note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 la situation du march\u00e9 du travail. [telquel.ma]\n-------------------------------------------------\nL\u2019emploi au Maroc a recul\u00e9 de 1,6 % au troisi\u00e8me trimestre 2026 par rapport au trimestre pr\u00e9c\u00e9dent, soit une baisse nette de 173 000 personnes, selon une note r\u00e9cente du Haut-Commissariat au Plan (HCP). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le club explique, dans un\ncommuniqu\u00e9, que cette d\u00e9cision intervient...", "mass": 5, "physics": false, "shape": "box", "title": "Le club explique, dans un communiqu\u00e9, que cette d\u00e9cision intervient \u00e0 l\u2019issue d\u2019une \u00e9valuation globale de la situation sportive de l\u2019\u00e9quipe, les r\u00e9sultats obtenus, la qualit\u00e9 du jeu ainsi. [telquel.ma]\n-------------------------------------------------\nLe Raja Club Athletic (RCA) a annonc\u00e9, lundi 2 novembre 2026 \u00e0 Casablanca, la r\u00e9siliation du contrat de lentra\u00eeneur espagnol Paco J\u00e9mez, responsable de l\u00e9quipe premi\u00e8re de football, apr\u00e8s une analyse approfondie de la situation sportive du club, rapporte la MAP. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Air Force, aux c\u00f4t\u00e9s de\nd\u00e9l\u00e9gations de 18 pays alli\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Air Force, aux c\u00f4t\u00e9s de d\u00e9l\u00e9gations de 18 pays alli\u00e9s et partenaires des \u00c9tats-Unis, a annonc\u00e9 lambassade des \u00c9tats-Unis au Maroc dans un tweet publi\u00e9 mardi 3 novembre. [www.yabiladi.com]\n-------------------------------------------------\nLes Forces Royales Air (FRA) ont particip\u00e9 \u00e0 la Semaine internationale 2026 de l\u2019Acad\u00e9mie de l\u2019US Air Force, organis\u00e9e aux \u00c9tats-Unis, aux c\u00f4t\u00e9s de repr\u00e9sentants de 18 pays alli\u00e9s et partenaires de [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "L\u2019Office national marocain du tourisme\n(ONMT) est pr\u00e9sent au World...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national marocain du tourisme (ONMT) est pr\u00e9sent au World Travel Market de Londres du 3 au 5 novembre, accompagn\ , "size": 26}, "group": 24, "id": "comm_label_24", "label": "Les membres des deux Chambres\ndu Parlement ont salu\u00e9 hautement,...", "mass": 5, "physics": false, "shape": "box", "title": "Les membres des deux Chambres du Parlement ont salu\u00e9 hautement, lundi, le contenu du communiqu\u00e9 du Cabinet Royal du 30 octobre, publi\u00e9 \u00e0 l\u2019issue de la r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU sur la question du Sahara marocain ainsi que les efforts d\u00e9ploy\u00e9s par la diplomatie marocaine pour clore d\u00e9finitivement ce conflit artificiel. [www.lereporter.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM) a salu\u00e9 le communiqu\u00e9 du Cabinet royal du 30 octobre, publi\u00e9 \u00e0 l\u2019issue de la r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU consacr\u00e9e \u00e0 la question du Sahara marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Cette probl\u00e9matique \u00e9tait au centre\nd\u2019une rencontre organis\u00e9e mardi 3...", "mass": 5, "physics": false, "shape": "box", "title": "Cette probl\u00e9matique \u00e9tait au centre d\u2019une rencontre organis\u00e9e mardi 3 novembre \u00e0 Casablanca par PwC au Maroc et Alteryx, sous le th\u00e8me \u00ab R\u00e9ussir vos projets IA : passer du pilote au d\u00e9ploiement . [lnt.ma]\n-------------------------------------------------\nCe mardi 3 novembre \u00e0 Casablanca, PwC au Maroc et Alteryx ont r\u00e9uni des entreprises autour du passage des projets pilotes \u00e0 un d\u00e9ploiement \u00e0 grande \u00e9chelle. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "L\u2019\u00e9tablissement de paiement marocain M2T\na \u00e9t\u00e9 distingu\u00e9 lors de...", "mass": 5, "physi     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
