ciences Humaines de l\u2019Universit\u00e9 Ibn Zohr d\u2019Agadir, cette pr. [lematin.ma]\n-------------------------------------------------\nUne mission arch\u00e9ologique marocaine a men\u00e9 r\u00e9cemment, sur le site d\u2019art rupestre de Laghchiwat, situ\u00e9 dans la commune d\u2019Amgala (\u00e0 environ 120 km au sud d\u2019Es-Semara), des travaux de fouilles et d\u2019investigations arch\u00e9ologiques. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Alors que le Maroc accueille\nla Coupe d\u2019Afrique des Nations...", "mass": 5, "physics": false, "shape": "box", "title": "Alors que le Maroc accueille la Coupe d\u2019Afrique des Nations 2025, l\u2019Office National Marocain du Tourisme (ONMT) transforme cette comp\u00e9tition en v\u00e9ritable vitrine de l\u2019offre tourist. [lematin.ma]\n-------------------------------------------------\nL\u0027Office national marocain du tourisme (ONMT) accueille, \u00e0 l\u0027occasion de la Coupe d\u0027Afrique des Nations (CAN) 2025, des prescripteurs de voyages, des tour-op\u00e9rateurs, des f\u00e9d\u00e9rations professionnelles et des journalistes internationaux pour d\u00e9couvrir \"Maroc, Terre de football\", un Maroc moderne, dynamique et pleinement capable d\u2019organiser des \u00e9v\u00e9nements sportifs internationaux majeurs. [www.lopinion.ma]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations bat son plein, l\u2019ONMT accueille prescripteurs de voyages, tour-op\u00e9rateurs, f\u00e9d\u00e9rations professionnelles et journalistes internationaux pour d\u00e9couvrir \u00ab Maroc, Terre de football [www.challenge.ma]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations bat son plein, l\u2019ONMT accueille prescripteurs de voyages, tour-op\u00e9rateurs, f\u00e9d\u00e9rations professionnelles et journalistes internationaux pour d\u00e9couvrir \u00ab Maroc, Terre de football \u00bb, un Maroc moderne, dynamique et pleinement capable d\u2019organiser des \u00e9v\u00e9nements sportifs internationaux majeurs. [maroc-diplomatique.net]\n-------------------------------------------------\nAlors que la Coupe d\u2019Afrique des Nations bat son plein, l\u2019Office Nationale Marocain du Tourisme (ONMT) accueille prescripteurs de voyages, tour-op\u00e9rateurs, f\u00e9d\u00e9rations professionnelles et journalistes internationaux pour d\u00e9couvrir \u00ab Maroc, Terre de football \u00bb, un Maroc \u00e0 la pointe de l\u0027organisation des \u00e9v\u00e9nements sportifs internationaux majeurs. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le groupe Attijariwafa bank et\nl\u2019INSEA, Institut national de statistique...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe Attijariwafa bank et l\u2019INSEA, Institut national de statistique et d\u2019\u00e9conomie appliqu\u00e9e, ont officialis\u00e9, lundi \u00e0 Casablanca, une nouvelle \u00e9tape de leur relation instituti. [lematin.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA ont sign\u00e9 le 29 d\u00e9cembre 2025 une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [telquel.ma]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019INSEA donnent un nouvel \u00e9lan \u00e0 leur coop\u00e9ration par la signature d\u2019une convention de partenariat visant \u00e0 structurer et approfondir leurs actions conjointes en mati\u00e8re de formation et d\u2019insertion professionnelle. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe Attijariwafa bank et l\u2019Institut national de statistique et d\u2019\u00e9conomie appliqu\u00e9e (INSEA) ont sign\u00e9, le 29 d\u00e9cembre 2025 \u00e0 Casablanca, une convention de partenariat visant \u00e0 structurer et approfondir leur coop\u00e9ration en mati\u00e8re de formation et d\u2019insertion professionnelle. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le sp\u00e9cialiste national de l\u2019exploitation\nportuaire, Marsa Maroc, envisage des...", "mass": 5, "physics": false, "shape": "box", "title": "Le sp\u00e9cialiste national de l\u2019exploitation portuaire, Marsa Maroc, envisage des extensions strat\u00e9giques des capacit\u00e9s de ses terminaux \u00e0 conteneurs TCE et TC3 au port de Casablanca.. [lematin.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur portuaire Marsa Maroc pr\u00e9voit une extension et un approfondissement de ses infrastructures au niveau des terminaux \u00e0 conteneurs TCE et TC3 au port de Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Dans un environnement international marqu\u00e9\npar le ralentissement du commerce...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un environnement international marqu\u00e9 par le ralentissement du commerce mondial, la mont\u00e9e des tensions g\u00e9opolitiques et la fin progressive des cycles de baisse des taux d\u2019int. [lematin.ma]\n-------------------------------------------------\nStandard Chartered Global Research publie son rapport \u00ab Global Focus 2026 \u00bb, qui analyse les tendances \u00e9conomiques mondiales et leurs impacts sur les pays \u00e9mergents. [www.lopinion.ma]\n-------------------------------------------------\nDans son rapport annuel Global Focus 2026, la banque britannique Standard Chartered pr\u00e9voit une croissance de 4,5% pour le Royaume, port\u00e9e par la dynamique des secteurs no     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {

                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },

                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,

                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
