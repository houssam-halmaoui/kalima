ot", "size": 47, "title": "Mondial 2030 : \u00e0 Buenos Aires, le Maroc expose sa vision \u00e0 l\u2019Ol\u00e9 Summit\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/mondial-2030-a-buenos-aires-le-maroc-expose-sa-vision-a-lole-summit.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Apr\u00e8s avoir re\u00e7u, mercredi matin,\nune d\u00e9l\u00e9gation du Rassemblement national...", "mass": 5, "physics": false, "shape": "box", "title": "Apr\u00e8s avoir re\u00e7u, mercredi matin, une d\u00e9l\u00e9gation du Rassemblement national des ind\u00e9pendants (RNI), elle s\u2019est entretenue dans la foul\u00e9e avec les dirigeants du Parti de l\u2019Istiqlal (PI), troisi\u00e8me force politique . [fr.hespress.com]\n-------------------------------------------------\nLe Secr\u00e9taire g\u00e9n\u00e9ral du Parti de l\u2019Istiqlal, Nizar Baraka, a indiqu\u00e9 que le Conseil national du parti examinera la possibilit\u00e9 de participer au nouveau gouvernement et \u00e9valuera les r\u00e9sultats des \u00e9lections du 23 septembre. [leseco.ma]\n-------------------------------------------------\nLe Secr\u00e9taire g\u00e9n\u00e9ral du Parti de l\u2019Istiqlal (PI), Nizar Baraka, a indiqu\u00e9, mercredi \u00e0 Rabat, que le Conseil national du parti examinera la possibilit\u00e9 de participer au nouveau gouvernement et \u00e9valuera les r\u00e9sultats des \u00e9lections du 23 septembre. [telquel.ma]\n-------------------------------------------------\nDeuxi\u00e8me rendez-vous de la journ\u00e9e pour le PAM Le Parti authenticit\u00e9 et modernit\u00e9 (PAM) re\u00e7oit la d\u00e9l\u00e9gation du Parti de l\u2019Istiqlal (PI) \u00e0 son si\u00e8ge de Rabat, dans le cadre des consultations sur la formation du prochain gouvernement. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Maroc et le groupe\nde la Banque africaine de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et le groupe de la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [fr.hespress.com]\n-------------------------------------------------\nLe Maroc et le groupe de la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [telquel.ma]\n-------------------------------------------------\nCe financement vise \u00e0 d\u00e9velopper et moderniser les infrastructures a\u00e9roportuaires du pays dans le cadre du programme PEMIA. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et le groupe de la Banque africaine de d\u00e9veloppement ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u0027euros pour le Programme d\u0027extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA). [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la BAD ont sign\u00e9, mardi \u00e0 Casablanca, un accord de financement de 270 millions d\u2019euros en faveur du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA), une op\u00e9ration destin\u00e9e \u00e0 renforcer les capacit\u00e9s a\u00e9roportuaires du Royaume. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La s\u00e9lection marocaine affrontera son\nhomologue malienne, dimanche 4 octobre...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine affrontera son homologue malienne, dimanche 4 octobre prochain au Grand stade de Tanger, dans le cadre d\u2019un match amical international, en remplacement de la rencontre qui \u00e9tait initialement programm\u00e9e face au Ghana. [fr.hespress.com]\n-------------------------------------------------\nCette rencontre est pr\u00e9vue au Grand Stade de la Cit\u00e9 du D\u00e9troit \u00e0 18h00, souligne la F\u00e9d\u00e9ration royale marocaine de football (FRMF) dans un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\nCette information a \u00e9t\u00e9 communiqu\u00e9e par la F\u00e9d\u00e9ration royale marocaine de football (FRMF) dans un communiqu\u00e9 publi\u00e9 le 30 septembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Avec ce SUV, Mitsubishi Motors\nsigne son retour sur le...", "mass": 5, "physics": false, "shape": "box", "title": "Avec ce SUV, Mitsubishi Motors signe son retour sur le march\u00e9 marocain des v\u00e9hicules particuliers et ouvre un nouveau chapitre de son histoire . [fr.hespress.com]\n-------------------------------------------------\nIl y a des lancements qui introduisent simplement un nouveau mod\u00e8le, et d\u2019autres qui racontent quelque chose de plus grand. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les Lionceaux de l\u2019Atlas ont\nsign\u00e9 leur premi\u00e8re victoire dans...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lionceaux de l\u2019Atlas ont sign\u00e9 leur premi\u00e8re victoire dans le tournoi de l\u2019UNAF U20 en dominant l\u2019Alg\u00e9rie sur le score de 3 buts \u00e0 1, ce mercredi 30 septembre au Stade du Canal. [lematin.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine U20 s\u2019est impos\u00e9e face \u00e0 son homologue alg\u00e9rienne (3-1), mercredi au Suez Canal Stadium d\u2019Isma\u00eflia, en \u00c9gypte, pour le compte de la troisi\u00e8me journ\u00e9e du tournoi de l\u2019Union nord-africaine de football (UNAF), qualificatif pour la CAN U20. [fr.hespress.com]\n-------------------------------------------------\nLa s\u00e9lection marocaine des moins de 20 ans a battu mercredi l\u2019Alg\u00e9rie 3-1 au stade de lAutorit\u00e9 du canal de Suez \u00e0 Isma\u00eflia, pour la troisi\u00e8me journ\u00e9e des \u00e9liminatoires de lUnion nord-africaine de football (UNAF) en vue de la Coupe dAfrique des nations U20 (Ghana 2027). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Les principaux acteurs am\u00e9ricains de\nl\u2019intelligence artificielle ont sign\u00e9, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Les principaux acteurs am\u00e9ricains de l\u2019intelligence artificielle ont sign\u00e9, lundi \u00e0 la Maison Blanche, un code de bonne conduite destin\u00e9 \u00e0 renforcer la surveillance des risques li\u00e9. [lematin.ma]\n-------------------------------------------------\nFace \u00e0 la multiplication d\u2019incidents de s\u00e9curit\u00e9 li\u00e9s \u00e0 l\u2019intelligence artificielle (IA), les g\u00e9ants am\u00e9ricains de la tech ont sign\u00e9 lundi \u00e0 la Maison-Blanche un code de bonne conduite destin\u00e9 \u00e0 mieux appr\u00e9hender les risques de cette technologie. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "La r\u00e9\u00e9lection de Hamid Bentahar\n\u00e0 la t\u00eate du Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "La r\u00e9\u00e9lection de Hamid Bentahar \u00e0 la t\u00eate du Conseil r\u00e9gional du tourisme Marrakech-Safi traduit la volont\u00e9 collective de poursuivre, aux c\u00f4t\u00e9s des \u00e9lus, des institutionnels et des. [lematin.ma]\n-------------------------------------------------\nLe Conseil r\u00e9gional du tourisme (CRT) Marrakech-Safi a r\u00e9\u00e9lu, mardi, Hamid Bentahar \u00e0 sa pr\u00e9sidence pour un nouveau mandat, \u00e0 l\u2019issue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale ordinaire \u00e9lective du Conseil. [telquel.ma]\n-------------------------------------------------\nUne reconduction qui intervient dans un contexte marqu\u00e9 par la poursuite des projets de promotion de la destination, avec une attention accrue port\u00e9e aux provinces de la r\u00e9gion, au patrimoine local et \u00e0 la diversification de l\u2019offre touristique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "CIH Bank a \u00e9t\u00e9 distingu\u00e9e\n\u00e0 l\u2019occasion des GEFF Awards,...", "mass": 5, "physics": false, "shape": "box", "title": "CIH Bank a \u00e9t\u00e9 distingu\u00e9e \u00e0 l\u2019occasion des GEFF Awards, organis\u00e9s par la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD), indique la banque dans un communiqu\u00e9.. [lematin.ma]\n-------------------------------------------------\nCIH BANK a \u00e9t\u00e9 distingu\u00e9 \u00e0 l\u2019occasion de la c\u00e9r\u00e9monie GEFF Awards, organis\u00e9e par la Banque Europ\u00e9enne pour la Reconstruction et le D\u00e9veloppement (BERD), en reconnaissance de son engagement dans le financement de la transition \u00e9nerg\u00e9tique. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Les entreprises repr\u00e9sentent la principale\ncat\u00e9gorie b\u00e9n\u00e9
