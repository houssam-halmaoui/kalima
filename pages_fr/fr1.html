 des enfants b\u00e9n\u00e9ficiant de la pension de survivants \u00e2g\u00e9s de 16 \u00e0 21 ans, ainsi que ceux qui b\u00e9n\u00e9ficient de l\u2019assurance maladie . [fr.hespress.com]\n-------------------------------------------------\nCette d\u00e9marche, d\u00e9sormais largement d\u00e9mat\u00e9rialis\u00e9e, vise \u00e0 v\u00e9rifier la poursuite effective des \u00e9tudes afin de maintenir les droits aux allocations familiales, pensions de survivants et couverture maladie. [www.lavieeco.com]\n-------------------------------------------------\nLa Caisse Nationale de S\u00e9curit\u00e9 Sociale informe l\u2019ensemble de ses assur\u00e9s du lancement de l\u2019op\u00e9ration de contr\u00f4le de la scolarit\u00e9 des enfants b\u00e9n\u00e9ficiant des allocations familiales \u00e2g\u00e9s de 12 \u00e0 21 ans, des enfants b\u00e9n\u00e9ficiant de la pension de survivants \u00e2g\u00e9s de 16 \u00e0 21 ans, ainsi que ceux qui b\u00e9n\u00e9ficient de l\u2019assurance maladie obligatoire \u00e2g\u00e9s de 21 \u00e0 26 ans. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le ministre de l\u2019Enseignement sup\u00e9rieur,\nAzzedine El Midaoui a pr\u00e9sent\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Enseignement sup\u00e9rieur, Azzedine El Midaoui a pr\u00e9sent\u00e9 les priorit\u00e9s du secteur lors d\u2019une rencontre consacr\u00e9e aux r\u00e9formes universitaires. [lematin.ma]\n-------------------------------------------------\nAu moment o\u00f9 l\u2019universit\u00e9 marocaine s\u2019appr\u00eate \u00e0 conna\u00eetre sa plus profonde transformation, le ministre de l\u2019Enseignement sup\u00e9rieur, Azzeddine El Midaoui, d\u00e9voile les contours d\u2019une r\u00e9forme qui veut rompre avec les dysfonctionnements du pass\u00e9. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "FACOP a re\u00e7u la certification\nMade in Morocco d\u00e9livr\u00e9e par...", "mass": 5, "physics": false, "shape": "box", "title": "FACOP a re\u00e7u la certification Made in Morocco d\u00e9livr\u00e9e par l\u2019Association Professionnelle des Marques Marocaines, devenant ainsi le premier fabricant de peintures du pays \u00e0 int\u00e9grer. [lematin.ma]\n-------------------------------------------------\nFACOP, acteur historique de la fabrication de peintures au Maroc depuis 1997, devient le premier fabricant marocain de peintures \u00e0 obtenir le label \u201cMade in Morocco\u201d, d\u00e9livr\u00e9 par l\u2019Association Professionnelle des Marques Marocaines (APMM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Cette d\u00e9claration a \u00e9t\u00e9 faite\npar le porte-parole de l\u2019UE...", "mass": 5, "physics": false, "shape": "box", "title": "Cette d\u00e9claration a \u00e9t\u00e9 faite par le porte-parole de l\u2019UE aux Affaires \u00e9trang\u00e8res lors du point de presse quotidien de la Commission europ\u00e9enne \u00e0 un moment o\u00f9 certains relais s\u00e9par. [lematin.ma]\n-------------------------------------------------\nL\u2019Union europ\u00e9enne (UE) a r\u00e9affirm\u00e9, vendredi, qu\u2019elle ne reconna\u00eet pas la pseudo \u00ab rasd \u00bb et que la pr\u00e9sence de cette entit\u00e9 aux r\u00e9unions Union europ\u00e9enne-Union africaine n\u2019influence en rien cette position. [aujourdhui.ma]\n-------------------------------------------------\nCette d\u00e9claration a \u00e9t\u00e9 faite par le porte-parole de l\u2019UE aux Affaires \u00e9trang\u00e8res lors du point de presse quotidien de la Commission europ\u00e9enne, \u00e0 un moment o\u00f9 certains relais s\u00e9paratistes surcommuniquaient au sujet du Sommet UE-UA, pr\u00e9vu du 24 au 27 novembre \u00e0 Luanda en Angola. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019Union europ\u00e9enne (UE) a r\u00e9affirm\u00e9, vendredi, qu\u2019elle ne reconna\u00eet pas la pseudo \u201crasd\u201d et que la pr\u00e9sence de cette entit\u00e9 aux r\u00e9unions Union europ\u00e9enne-Union africaine n\u2019influence en rien cette position. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Les Lionceaux de l\u2019Atlas poursuivent\nl\u0027aventure au Mondial U17 avec...", "mass": 5, "physics": false, "shape": "box", "title": "Les Lionceaux de l\u2019Atlas poursuivent l\u0027aventure au Mondial U17 avec un duel d\u00e9cisif face au Br\u00e9sil, ce vendredi sur la pelouse de l\u2019Aspire Zone Pitch 7 \u00e0 Doha. [lematin.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc des moins de 17 ans a \u00e9t\u00e9 \u00e9limin\u00e9e de la Coupe du monde de football apr\u00e8s sa d\u00e9faite face au Br\u00e9sil sur le score de 2 buts \u00e0 1, en match des quarts de finale disput\u00e9, vendredi au terrain n\u00b07 de l\u2019Aspire Zone \u00e0 Doha. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Inflation : La hausse des\nprix ralentit en octobre 2025...", "mass": 5, "physics": false, "shape": "box", "title": "Inflation : La hausse des prix ralentit en octobre 2025 (HCP). [lematin.ma]\n-------------------------------------------------\nL\u0027indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en octobre 2025, une hausse de 0,1% par rapport au m\u00eame mois de l\u0027ann\u00e9e \u00e9coul\u00e9e, selon le Haut-Commissariat au Plan (HCP). [www.lopinion.ma]\n-------------------------------------------------\nL\u2019indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en octobre 2025, une hausse de 0,1% par rapport au m\u00eame mois de l\u2019ann\u00e9e \u00e9coul\u00e9e, indique le Haut-Commissariat au [www.challenge.ma]\n-------------------------------------------------\nLindice des prix \u00e0 la consommation (IPC) a enregistr\u00e9, en octobre 2025, une hausse de 0,1% par rapport au m\u00eame mois de lann\u00e9e \u00e9coul\u00e9e, selon le Haut-Commissariat au Plan (HCP). [www.yabiladi.com]\n-------------------------------------------------\nL\u2019Indice des prix \u00e0 la consommation (IPC) a enregistr\u00e9 une baisse de 0,6 % au mois d\u2019octobre 2025 par rapport au mois de septembre, selon la note d\u2019information publi\u00e9e par le Haut-Commissariat au Plan (HCP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 l\u2019occasion de la Journ\u00e9e\nmondiale de l\u2019Olivier, c\u00e9l\u00e9br\u00e9e le...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la Journ\u00e9e mondiale de l\u2019Olivier, c\u00e9l\u00e9br\u00e9e le 20 novembre 2025 \u00e0 Cordoue, en Espagne, le Royaume du Maroc a r\u00e9affirm\u00e9 son engagement en faveur d\u2019une ol\u00e9iculture dur. [lematin.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la Journ\u00e9e mondiale de l\u2019Olivier, le Maroc a adopt\u00e9 la D\u00e9claration de Cordoue, qui consacre une vision commune pour une ol\u00e9iculture durable \u00e0 l\u2019\u00e9chelle mondiale. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La tenue \u00e0 Marrakech de\nla 93e Assembl\u00e9e g\u00e9n\u00e9rale de...", "mass": 5, "physics": false, "shape": "box", "title": "La tenue \u00e0 Marrakech de la 93e Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale de police criminelle (OIPC-INTERPOL) constitue une reconnaissance de la communaut\u00e9 internationale de la contribution du Maroc \u00e0 la s\u00e9curit\u00e9 mondiale, a affirm\u00e9 vendredi le pr\u00e9sident de cette Organisation, le G\u00e9n\u00e9ral-Major Ahmed Naser Al-Raisi. [www.lopinion.ma]\n-------------------------------------------------\nL\u2019accueil de l\u0027instance dirigeante supr\u00eame d\u0027INTERPOL (24-27 novembre) est une reconnaissance de la pr\u00e9sence constante du Royaume dans l\u2019ensemble des forums li\u00e9s \u00e0 la s\u00fbret\u00e9 et \u00e0 la s\u00e9curit\u00e9, ainsi que de son engagement agissant au sein de l\u2019Organisation L\u2019article est apparu en premier sur . [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Une d\u00e9l\u00e9gation de la Fondation\ndu Patrimoine Culturel Prussien (SPK)...", "mass": 5, "physics": false, "shape": "box", "title": "Une d\u00e9l\u00e9gation de la Fondation du Patrimoine Culturel Prussien (SPK) a effectu\u00e9 une visite mercredi et jeudi \u00e0 Rabat, dans le cadre du prolongement des \u00e9changes men\u00e9s en mai et juin derniers \u00e0 Rabat et Berlin, entre la Fondation Nationale des Mus\u00e9es (FNM) et la SPK. [www.lopinion.ma]\n-------------------------------------------------\nUne d\u00e9l\u00e9gation de la Fondation du patrimoine culturel prussien (SPK), institution culturelle allemande bas\u00e9e \u00e0 Berlin, a effectu\u00e9 une visite mercredi et jeudi \u00e0 Rabat, dans le cadre du prolongement des \u00e9changes men\u00e9s en mai et juin derniers \u00e0 Rabat et Berlin, entre la Fondation nationale des mus\u00e9es (FNM) et la SPK. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le tribunal de premi\u00e8re instance\nde Casablanca a condamn\u00e9, ce...", "mass": 5, "physics": false, "shape": "box", "title": "Le tribunal de premi\u00e8re instance de Casablanca a condamn\u00e9, ce vendredi, le rappeur connu sous le nom de sc\u00e8ne Raid \u00e0 un mois de prison avec sursis et \u00e0 une amende de 2.000 dirhams. [www.lopinion.ma]\n-------------------------------------------------\nLe tribunal de premi\u00e8re instance de Casablanca a condamn\u00e9, ce vendredi, le rappeur connu sous le nom de sc\u00e8ne \u201cRaid\u201d \u00e0 un mois de prison avec sursis et \u00e0 une amende de 2.000 dirhams. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u200bDes investisseurs am\u00e9ricains ont effectu\u00e9,\nmercredi, une visite \u00e0 Dakhla...", "mass": 5, "physics": false, "shape": "box", "title": "\u200bDes investisseurs am\u00e9ricains ont effectu\u00e9, mercredi, une visite \u00e0 Dakhla pour explorer le potentiel \u00e9conomique de la r\u00e9gion et identifier les secteurs les plus porteurs. [www.lopinion.ma]\n-------------------------------------------------\nDes investisseurs am\u00e9ricains explorent les potentialit\u00e9s de la r\u00e9gion de Dakhla-Oued Eddahab. [www.libe.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La plateforme nationale du Syst\u00e8me\nde surveillance des d\u00e9c\u00e8s maternels,...", "mass": 5, "physics": false, "shape": "box", "title": "La plateforme nationale du Syst\u00e8me de surveillance des d\u00e9c\u00e8s maternels, audit et riposte (SSDMAR) a \u00e9t\u00e9 lanc\u00e9, jeudi \u00e0 Rabat, \u00e0 l\u2019initiative du minist\u00e8re de la Sant\u00e9 et de la Protection sociale dans l\u2019objectif d\u2019am\u00e9liorer la qualit\u00e9 de la prise en charge des m\u00e8res et des nouveau-n\u00e9s. [telquel.ma]\n-------------------------------------------------\nLa plateforme nationale du Syst\u00e8me de surveillance des d\u00e9c\u00e8s maternels, audit et riposte (SSDMAR) a \u00e9t\u00e9 lanc\u00e9e jeudi \u00e0 Rabat \u00e0 l\u2019initiative du minist\u00e8re de la Sant\u00e9 et de la Protection sociale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Depuis son retour sur le\nmarch\u00e9 automobile, elle s\u2019impose comme...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis son retour sur le march\u00e9 automobile, elle s\u2019impose comme une nouvelle r\u00e9f\u00e9rence de [www.challenge.ma]\n-------------------------------------------------\nEn 2025, elle rena\u00eet au Maroc dans une version 100 % \u00e9lectrique, fid\u00e8le \u00e0 son esprit d\u2019origine fait de modernit\u00e9 et d\u2019audace. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Dans le cadre de la\nmise en \u0153uvre de la...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la mise en \u0153uvre de la strat\u00e9gie nationale \u00ab Maroc Digital 2030 \u00bb, le minist\u00e8re de la Transition Num\u00e9rique et de la R\u00e9forme de l\u2019Administration (MTNRA), [www.challenge.ma]\n-------------------------------------------------\nDans le cadre de la mise en \u0153uvre de la strat\u00e9gie nationale \u00ab Maroc Digital 2030 \u00bb, une convention portant sur le lancement d\u2019un dispositif catalytique de soutien aux fonds d\u00e9di\u00e9s aux startups a \u00e9t\u00e9 sign\u00e9e, le 21 novembre 2025 \u00e0 Rabat, entre le minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019Administration . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La\u00e2youne a accueilli, vendredi 21\nnovembre, une nouvelle session du...", "mass": 5, "physics": false, "shape": "box", "title": "La\u00e2youne a accueilli, vendredi 21 novembre, une nouvelle session du R\u00e9seau des parlementaires africains pour l\u00e9valuation du d\u00e9veloppement (APNODE). [www.yabiladi.com]\n-------------------------------------------------\nLes travaux de la 10e Assembl\u00e9e g\u00e9n\u00e9rale du R\u00e9seau des parlementaires africains pour l\u2019\u00e9valuation du d\u00e9veloppement (APNODE) se sont ouverts, vendredi \u00e0 La\u00e2youne, avec la participation de ministres, de parlementaires, d\u2019experts, de repr\u00e9sentants institutionnels, de la soci\u00e9t\u00e9 civile et de partenaires du d\u00e9veloppement venus de plusieurs pays africains. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019ambassadeur du Maroc en Espagne,\nKarima Benyaich, a eu, le...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur du Maroc en Espagne, Karima Benyaich, a eu, le 20 novembre, \u00e0 Barcelone, une s\u00e9rie d\u2019entretiens avec de hauts responsables catalans, consacr\u00e9s au renforcement de la coop\u00e9ration et \u00e0 l\u2019exploration de nouvelles perspectives de partenariat entre le Royaume et la Catalogne. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019ambassadeur du Maroc en Espagne, Karima Benyaich, a eu, jeudi \u00e0 Barcelone, une s\u00e9rie d\u2019entretiens avec de hauts responsables catalans, consacr\u00e9s au renforcement de la coop\u00e9ration et \u00e0 l\u2019exploration de nouvelles perspectives de partenariat entre le Royaume et la Catalogne. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Cette \u00e9volution intervient au moment\no\u00f9 les avances \u00e0 7...", "mass": 5, "physics": false, "shape": "box", "title": "Cette \u00e9volution intervient au moment o\u00f9 les avances \u00e0 7 jours de Bank Al-Maghrib (BAM) augmentent de 7,6 MMDH pour atteindre 68,7 MMDH, r\u00e9v\u00e8le BMCE Capital Global Research. [www.lavieeco.com]\n-------------------------------------------------\nLe d\u00e9ficit de liquidit\u00e9 bancaire moyen s\u2019est creus\u00e9 de 6,15% pour s\u2019\u00e9tablir \u00e0 137,7 milliards de dirhams (MMDH) durant la p\u00e9riode du 13 au 19 novembre 2025, selon BMCE Capital Global Research (BKGR). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le minist\u00e8re du Tourisme, de\nl\u0027Artisanat et de l\u0027\u00c9conomie sociale...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re du Tourisme, de l\u0027Artisanat et de l\u0027\u00c9conomie sociale et solidaire, la Conf\u00e9d\u00e9ration nationale du tourisme (CNT) et l\u0027Observatoire du Tourisme, ont pr\u00e9sent\u00e9, jeudi \u00e0 Rabat, le nouveau mod\u00e8le d\u0027estimation des indicateurs de fr\u00e9quentation des \u00e9tablissements d\u0027h\u00e9bergement touristique class\u00e9s (EHTC). [leseco.ma]\n-------------------------------------------------\nLe minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, la Conf\u00e9d\u00e9ration nationale du tourisme (CNT) et l\u2019Observatoire du Tourisme ont pr\u00e9sent\u00e9, jeudi \u00e0 Rabat, un nouveau mod\u00e8le d\u2019estimation des indicateurs de fr\u00e9quentation des \u00e9tablissements d\u2019h\u00e9bergement touristique class\u00e9s (EHTC). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La premi\u00e8re \u00e9dition du Forum\nAfricain du Parlement de l\u2019Enfant...", "mass": 5, "physics": false, "shape": "box", "title": "La premi\u00e8re \u00e9dition du Forum Africain du Parlement de l\u2019Enfant s\u2019est ouverte vendredi \u00e0 Rabat, sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI et la Pr\u00e9sidence effective de Son Altesse Royale la Princesse Lalla Meryem. [lnt.ma]\n-------------------------------------------------\nLa Princesse Lalla Meryem, Pr\u00e9sidente de l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE), a pr\u00e9sid\u00e9, samedi au si\u00e8ge du Parlement \u00e0 Rabat, la c\u00e9r\u00e9monie officielle de cl\u00f4ture du Premier Forum Africain du Parlement de l\u2019Enfant, un \u00e9v\u00e9nement continental plac\u00e9 sous le haut patronage du Roi Mohammed VI. [fr.hespress.com]\n-------------------------------------------------\nOrganis\u00e9 par l\u2019ONDE sous le th\u00e8me La participation des enfants au d\u00e9veloppement de l\u2019Afrique, ce forum s\u2019inscrit dans la continuit\u00e9 de la Vision clairvoyante de S.M. [lematin.ma]\n-------------------------------------------------\nLes enfants parlementaires ont annonc\u00e9 l\u2019adoption par acclamation de la \"D\u00e9claration de Rabat pour la participation des enfants au d\u00e9veloppement de l\u2019Afrique\" qui consacre la cr\u00e9ation du R\u00e9seau africain pour les droits de l\u2019enfant pour lequel l\u2019ONDE accueillera le si\u00e8ge et apportera tout le soutien n\u00e9cessaire. [www.lavieeco.com]\n-------------------------------------------------\nSon Altesse Royale la Princesse Lalla Meryem, Pr\u00e9sidente de l\u2019Observatoire National des Droits de l\u2019Enfant (ONDE), a pr\u00e9sid\u00e9, samedi au si\u00e8ge du Parlement \u00e0 Rabat, la c\u00e9r\u00e9monie officielle de cl\u00f4ture du Premier Forum Africain du Parlement de l\u2019Enfant, un \u00e9v\u00e9nement continental plac\u00e9 sous le Haut Patronage de Sa Majest\u00e9 le Roi Mohammed VI, que Dieu . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les clubs marocains entament, ce\nweek-end, la phase de groupes...", "mass": 5, "physics": false, " <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');

            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
