e la production de la plateforme \u00ab\u00a0Smart Car\u00a0\u00bb\nSource: atlasinfo.fr", "url": "https://atlasinfo.fr/kenitra-stellantis-lance-la-production-de-la-plateforme-smart-car.html", "x": 0, "y": 0}, {"font": {"vadjust": -70.5}, "group": 0, "id": 238, "label": "Sur Hautes Instructions de SM...", "shape": "dot", "size": 47, "title": "Sur Hautes Instructions de SM le Roi, MM. Bourita et Loudyi re\u00e7oivent \u00e0 Rabat le Haut repr\u00e9sentant du Conseil de paix pour Gaza\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/sur-hautes-instructions-de-sm-le-roi-mm-bourita-et-loudyi-recoivent-a-rabat-le-haut-representant-du-conseil-de-paix-pour-gaza/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "En ex\u00e9cution des hautes instructions\ndu Roi, Chef Supr\u00eame et...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des hautes instructions du Roi, Chef Supr\u00eame et Chef d\u2019Etat Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR) et Pr\u00e9sident du Comit\u00e9 Al Qods, le inistre des Affaires Etrang\u00e8res, de la Coop\u00e9ration Africaine et des Marocains R\u00e9sidant \u00e0 l\u2019Etranger, Nasser Bourita, et le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi, . [fr.hespress.com]\n-------------------------------------------------\nNasser Bourita et Abdeltif Loudiyi ont sign\u00e9, ce mercredi, un accord officialisant la participation du Maroc \u00e0 la Force internationale de stabilisation (ISF) \u00e0 Gaza. [telquel.ma]\n-------------------------------------------------\nEn ex\u00e9cution des instructions du roi Mohammed VI, chef supr\u00eame et chef d\u2019\u00e9tat major g\u00e9n\u00e9ral des Forces arm\u00e9es royales (FAR) et pr\u00e9sident du Comit\u00e9 Al Qods, le haut repr\u00e9sentant du Conseil de paix pour Gaza, Nickolay Mladenov, a \u00e9t\u00e9 re\u00e7u par Nasser Bourita, ministre des Affaires \u00e9trang\u00e8res, de la coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger et par Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du chef du gouvernement, charg\u00e9 de l\u2019Administration de la d\u00e9fense nationale. [www.yabiladi.com]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions de Sa Majest\u00e9 le Roi, Chef Supr\u00eame et Chef d\u2019Etat Major G\u00e9n\u00e9ral des Forces Arm\u00e9es Royales (FAR) et Pr\u00e9sident du Comit\u00e9 Al Qods, M. Nasser Bourita, Ministre des Affaires Etrang\u00e8res, de la Coop\u00e9ration Africaine et des Marocains R\u00e9sidant \u00e0 l\u2019Etranger et M. Abdeltif Loudyi, Ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La tenue de cette session\nde la R\u00e9union de Haut...", "mass": 5, "physics": false, "shape": "box", "title": "La tenue de cette session de la R\u00e9union de Haut Niveau Maroc-France intervient en cons\u00e9cration du partenariat d\u0027exception renforc\u00e9 liant le Maroc et la France, sous la co. [lematin.ma]\n-------------------------------------------------\nLa tenue de cette session intervient \u00ab en cons\u00e9cration du partenariat d\u2019exception renforc\u00e9 liant le Maroc et la France, sous la conduite des deux Chefs d\u2019\u00c9tat, Sa Majest\u00e9 le Roi Mohammed VI,. [telquel.ma]\n-------------------------------------------------\nLes gouvernements du Maroc et de la France tiennent, ce jeudi \u00e0 Rabat, les travaux de la quinzi\u00e8me session de la r\u00e9union de haut niveau entre les deux pays. [www.yabiladi.com]\n-------------------------------------------------\nLa R\u00e9union de Haut Niveau Maroc-France d\u00e9marre alors que les deux pays comptent donner un nouvel \u00e9lan \u00e0 la coop\u00e9ration bilat\u00e9rale d\u00e9j\u00e0 tr\u00e8s solide. [aujourdhui.ma]\n-------------------------------------------------\nLa tenue de cette session intervient \u00ab en cons\u00e9cration du partenariat d\u2019exception renforc\u00e9 liant le Maroc et la France, sous la conduite des deux Chefs d\u2019\u00c9tat, Sa Majest\u00e9 [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Dans l\u2019attente de sa comparution\nimm\u00e9diate, l\u2019artiste Mehdi Black Wind...", "mass": 5, "physics": false, "shape": "box", "title": "Dans l\u2019attente de sa comparution imm\u00e9diate, l\u2019artiste Mehdi Black Wind a \u00e9t\u00e9 plac\u00e9 en d\u00e9tention provisoire \u00e0 la prison d\u2019Oukacha, ce mercredi 15 juillet. [telquel.ma]\n-------------------------------------------------\nLe parquet de Casablanca a d\u00e9cid\u00e9 de maintenir le rappeur marocain Mehdi El Youbi, alias Mehdi Black Wind, en d\u00e9tention provisoire. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les a\u00e9roports du Royaume ont\naccueilli un total de 18.831.461...", "mass": 5, "physics": false, "shape": "box", "title": "Les a\u00e9roports du Royaume ont accueilli un total de 18.831.461 passagers au cours des six premiers mois de 2026, en hausse de 8,83% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon l\u2019Office national des a\u00e9roports (ONDA). [telquel.ma]\n-------------------------------------------------\nLes a\u00e9roports du Royaume ont accueilli un total de 18.831.461 passagers au cours des six premiers mois de 2026, en hausse de 8,83% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon l\u0027Office national des a\u00e9roports (ONDA). [leseco.ma]\n-------------------------------------------------\nLes a\u00e9roports du Maroc ont accueilli un total de 18 831 461 passagers au cours des six premiers mois de 2026, en hausse de 8,83% par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, selon lOffice national des a\u00e9roports (ONDA). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "\u00c0 l\u2019entame de la saison\nestivale, l\u2019Association marocaine des professionnels...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019entame de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation renforc\u00e9e autour de la pr\u00e9vention, de la sensibilisation et du recours \u00e0 des prestations professionnelles encadr\u00e9es face aux risques li\u00e9s aux nuisibles, aux insectes vecteurs de maladies et aux esp\u00e8ces venimeuses. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019approche de la saison estivale, l\u2019Association marocaine des professionnels de la d\u00e9ratisation, d\u00e9sinsectisation, d\u00e9reptilisation et d\u00e9sinfection (AM3D) appelle \u00e0 une mobilisation accrue pour pr\u00e9venir les risques sanitaires li\u00e9s \u00e0 la prolif\u00e9ration des nuisibles et des esp\u00e8ces venimeuses. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Athl\u00e9tisme : Yassine Hssine signe\nun nouvel exploit en passant...", "mass": 5, "physics": false, "shape": "box", "title": "Athl\u00e9tisme : Yassine Hssine signe un nouvel exploit en passant sous les 20 secondes sur 200 m. Le sprinteur marocain Yassine Hssine continue de marquer l\u2019histoire de l\u2019athl\u00e9tisme en signant un nouvel exploit sur 200 m\u00e8tres. [telquel.ma]\n-------------------------------------------------\nL\u2019athl\u00e8te de 23 ans a effectu\u00e9 le circuit en 19,92 secondes, gagnant quelques milli\u00e8mes par rapport \u00e0 son pr\u00e9c\u00e9dent exploit de 19,97 s. Cette r\u00e9alisation a elle-m\u00eame \u00e9t\u00e9 historique, puisque c\u2019est la premi\u00e8re fois qu\u2019un sprinteur marocain descend sous la barre symbolique des 20 secondes sur le 200 m. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "L\u2019indice de confiance des m\u00e9nages\n(ICM) s\u2019est \u00e9tabli \u00e0 60,1...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice de confiance des m\u00e9nages (ICM) s\u2019est \u00e9tabli \u00e0 60,1 points au deuxi\u00e8me trimestre de 2026, contre 54,6 points le m\u00eame trimestre de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nL\u0027indice de confiance des m\u00e9nages (ICM) s\u0027est \u00e9tabli \u00e0 60,1 points au deuxi\u00e8me trimestre 2026, en am\u00e9lioration par rapport \u00e0 la m\u00eame p\u00e9riode de 2025, malgr\u00e9 un recul par rapport au trimestre pr\u00e9c\u00e9dent, selon les r\u00e9sultats de l\u0027enqu\u00eate permanente de conjoncture du Haut-Commissariat au plan (HCP). [www.lavieeco.com]\n-------------------------------------------------\nL\u0027indice de confiance des m\u00e9nages (ICM) s\u0027est \u00e9tabli \u00e0 60,1 points au deuxi\u00e8me trimestre de 2026, contre 54,6 points le m\u00eame trimestre de l\u0027ann\u00e9e pr\u00e9c\u00e9dente, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nLe Haut-Commissariat au Plan (HCP) a publi\u00e9 les r\u00e9sultats de son enqu\u00eate permanente de conjoncture aupr\u00e8s des m\u00e9nages pour le deuxi\u00e8me trimestre 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true,         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
