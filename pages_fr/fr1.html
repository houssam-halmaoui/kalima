mique que conna\u00eet le pays, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 du Commerce ext\u00e9rieur, Omar Hejira. [www.yabiladi.com]\n-------------------------------------------------\nL\u2019\u00e9volution de la balance commerciale du Maroc et l\u2019augmentation des importations s\u2019inscrivent dans une tendance jug\u00e9e \u00ab naturelle \u00bb, reflet de la dynamique d\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume. [lnt.ma]\n-------------------------------------------------\nL\u2019\u00e9volution de la balance commerciale du Maroc et la hausse des importations s\u2019inscrivent dans une tendance naturelle, traduisant la dynamique de l\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 du Commerce ext\u00e9rieur, Omar Hejira. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le conseil d\u2019administration de Raja\nS.A. a annonc\u00e9 ce 5...", "mass": 5, "physics": false, "shape": "box", "title": "Le conseil d\u2019administration de Raja S.A. a annonc\u00e9 ce 5 janvier la nomination de Nawal El-Aidaoui au poste de directrice g\u00e9n\u00e9rale, marquant une nouvelle \u00e9tape dans la transformation du club en soci\u00e9t\u00e9 anonyme. [telquel.ma]\n-------------------------------------------------\nFigure engag\u00e9e du Raja Club Athletic et dirigeante chevronn\u00e9e, Nawal El-Aidaoui est nomm\u00e9e directrice g\u00e9n\u00e9rale de Raja S.A. Une d\u00e9cision strat\u00e9gique qui marque une nouvelle \u00e9tape dans la [www.challenge.ma]\n-------------------------------------------------\nNawal El-Aidaoui prend les r\u00eanes de Raja S.A.. Raja S.A. officialise la nomination de Nawal El-Aidaoui au poste de directrice g\u00e9n\u00e9rale, confirmant la nouvelle organisation du club en soci\u00e9t\u00e9 anonyme et sa volont\u00e9 de structurer ses activit\u00e9s sportives et \u00e9conomiques. [fr.hespress.com]\n-------------------------------------------------\nRaja S.A., la soci\u00e9t\u00e9 sportive du Raja de Casablanca, a nomm\u00e9 Nawal El-Aidaoui au poste de Directrice g\u00e9n\u00e9rale. [lematin.ma]\n-------------------------------------------------\nCette d\u00e9cision strat\u00e9gique marque une \u00e9tape d\u00e9cisive dans la mise en \u0153uvre de la nouvelle structure de soci\u00e9t\u00e9 anonyme du club, visant \u00e0 consolider sa gouvernance et \u00e0 acc\u00e9l\u00e9rer . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le ministre Karim Zidane a\nfait le point lundi devant...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre Karim Zidane a fait le point lundi devant les d\u00e9put\u00e9s sur l\u2019avancement des m\u00e9canismes d\u2019aide aux entreprises et l\u2019am\u00e9lioration du climat des affaires au Maroc. [telquel.ma]\n-------------------------------------------------\nUn total de 89 projets d\u2019investissement, portant sur plus de 1,28 milliard de dirhams, ont \u00e9t\u00e9 approuv\u00e9s dans le cadre du dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME), lanc\u00e9 il y a un mois et demi, a annonc\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la convergence et de l\u2019\u00e9valuation des politiques publiques, Karim Zidane. [www.yabiladi.com]\n-------------------------------------------------\nLe nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises a permis l\u2019approbation de 89 projets d\u2019investissement pour un montant global d\u00e9passant 1,28 milliard de dirhams, a annonc\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la Convergence et de l\u2019\u00c9valuation des politiques publiques, Karim Zidane. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Deux personnes ont trouv\u00e9 la\nmort et quatre autres ont...", "mass": 5, "physics": false, "shape": "box", "title": "Deux personnes ont trouv\u00e9 la mort et quatre autres ont \u00e9t\u00e9 bless\u00e9s, \u00e0 divers degr\u00e9s de gravit\u00e9, suite \u00e0 l\u2019effondrement partiel, lundi dans le quartier Akkari \u00e0 Rabat, d\u2019un immeuble compos\u00e9 d\u2019un rez-de-chauss\u00e9e \u00e0 usage commercial et de deux \u00e9tages habit\u00e9s par une seule famille, selon les autorit\u00e9s locales de la Pr\u00e9fecture de Rabat. [telquel.ma]\n-------------------------------------------------\nUn drame est survenu lundi dans le quartier Akkari \u00e0 Rabat, o\u00f9 l\u2019effondrement partiel d\u2019un immeuble a caus\u00e9 la mort de deux personnes et fait quatre bless\u00e9s, selon les autorit\u00e9s locales de la pr\u00e9fecture de Rabat. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Les examens m\u00e9dicaux ont confirm\u00e9\nque le milieu de terrain...", "mass": 5, "physics": false, "shape": "box", "title": "Les examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [telquel.ma]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique, ce lundi, la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [leseco.ma]\n-------------------------------------------------\nLes examens m\u00e9dicaux ont confirm\u00e9 que le milieu de terrain des Lions de l\u2019Atlas, Azzedine Ounahi, souffre d\u2019une l\u00e9sion musculaire au niveau du mollet et b\u00e9n\u00e9ficie d\u2019une prise en charge m\u00e9dicale appropri\u00e9e, indique lundi la F\u00e9d\u00e9ration royale marocaine de football (FRMF). [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Voici l\u2019agenda des matchs des\nhuiti\u00e8mes de finale de la...", "mass": 5, "physics": false, "shape": "box", "title": "Voici l\u2019agenda des matchs des huiti\u00e8mes de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 pr\u00e9vus lundi 5 janvier 2026: \u2013 17H00 Egypte \u2013 B\u00e9nin (Grand Stade d\u2019Agadir) -\u2060 \u206020H00 Nigeria \u2013 Mozambique (Complexe Sportif de F\u00e8s). [telquel.ma]\n-------------------------------------------------\nEn inscrivant un but dans chacune des quatre premi\u00e8res rencontres de la Coupe d\u2019Afrique des Nations (Maroc-2025), Brahim Diaz inscrit son nom en lettres d\u2019or dans les annales [www.challenge.ma]\n-------------------------------------------------\nVoici l\u2019agenda des matchs des huiti\u00e8mes de finale de la Coupe d\u2019Afrique des Nations Maroc-2025 pr\u00e9vus mardi 06 janvier 2026: -17H00: Alg\u00e9rie \u2013 RD Congo (Stade Moulay El Hassan \u00e0 Rabat) -20H00: C\u00f4te d\u2019Ivoire \u2013 Burkina Faso (Grand Stade de Marrakech). [maroc-diplomatique.net]\n-------------------------------------------------\nEn inscrivant un but dans chacune des quatre premi\u00e8     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

                    barnesHut: {

                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);
