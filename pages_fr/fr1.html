mdh-mobilises-au-maroc-a-lhorizon-2029-pour-la-mobilite-propre-selon-abdellatif-maazouz/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Plus de 78 milliards de\ndirhams ont \u00e9t\u00e9 mobilis\u00e9s au...", "mass": 5, "physics": false, "shape": "box", "title": "Plus de 78 milliards de dirhams ont \u00e9t\u00e9 mobilis\u00e9s au Maroc pour d\u00e9velopper un syst\u00e8me de transport public propre, moderne, multimodal et accessible d\u2019ici 2029, a indiqu\u00e9 le pr\u00e9sident du conseil r\u00e9gional de Casablanca-Settat, Abdellatif Ma\u00e2zouz. [fr.hespress.com]\n-------------------------------------------------\nParmi ces investissements, 11 MMDH sont consacr\u00e9s \u00e0 l\u2019acquisition de 3.750 bus neufs de nouvelle g\u00e9n\u00e9ration et 67 MMDH d\u00e9di\u00e9s aux transports en sites propres, incluant les tramways. [lematin.ma]\n-------------------------------------------------\nPlus de 78 milliards de dirhams sont consacr\u00e9s au d\u00e9veloppement au Maroc d\u2019un syst\u00e8me de transport public propre, moderne, multimodal et accessible d\u2019ici 2029, affirme le pr\u00e9sident du [www.challenge.ma]\n-------------------------------------------------\nLe Maroc a engag\u00e9 plus de 78 milliards de dirhams pour d\u00e9velopper, d\u2019ici 2029, un syst\u00e8me de transport public propre, moderne et accessible, a indiqu\u00e9 le pr\u00e9sident du Conseil r\u00e9gional de Casablanca-Settat, Abdellatif Ma\u00e2zouz, lors d\u2019un side-event organis\u00e9 en marge de la COP30 \u00e0 Bel\u00e9m par la Direction g\u00e9n\u00e9rale des collectivit\u00e9s territoriales et l\u2019Association marocaine . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le s\u00e9lectionneur du Nigeria, Eric\nChelle, a accus\u00e9 les joueurs...", "mass": 5, "physics": fals nt l\u2019ensemble des r\u00e9gions du Maroc, dans le cadre des pr\u00e9paratifs en cours pour la Coupe d\u2019Afrique des Nations. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a men\u00e9 un programme de formation \u00e0 la s\u00e9curit\u00e9 au niveau national, en pr\u00e9paration de la Coupe dAfrique des nations (CAN 2025) qui d\u00e9bute en d\u00e9cembre au Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a d\u00e9voil\u00e9 les listes...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9 les listes finales des trois meilleurs nomm\u00e9s dans chacune des cat\u00e9gories masculines des CAF Awards 2025, marqu\u00e9es par une forte pr\u00e9sence des repr\u00e9sentants du football marocain. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9voil\u00e9, lundi au Caire, les listes finales des trois nomm\u00e9s dans chacune des cat\u00e9gories masculines des CAF Awards 2025, avec une pr\u00e9sence marocaine marqu\u00e9e dans l\u2019ensemble des distinctions majeures. [lnt.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration Africaine de Football (CAF) a annonc\u00e9 les pr\u00e9sentateurs de l\u2019\u00e9dition 2025 des CAF Awards, pr\u00e9vue le 19 novembre \u00e0 l\u2019Universit\u00e9 Polytechnique Mohammed VI de Rabat. [fr.hespress.com]\n-------------------------------------------------\nPour leur \u00e9dition 2025, les CAF Awards investissent l\u2019Universit\u00e9 Mohammed VI Polytechnique de Rabat ce mercredi 19 novembre 2025, avec une soir\u00e9e annonc\u00e9e comme l\u2019une des plus anim. [lematin.ma]\n--------------------------------             if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
