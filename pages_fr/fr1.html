u 11 juillet 2026 \u00e0 Anfa Park \u00e0 Casablanca, le festival Jazzablanca annonce une nouveaut\u00e9 de taille : quatre concerts chaque soir, r\u00e9partis entre la Sc\u00e8ne 21 et la grande sc\u00e8ne. [telquel.ma]\n-------------------------------------------------\nLa 19\u1d49 \u00e9dition du festival Jazzablanca se tiendra du 2 au 11 juillet 2026,avec plus de 50 artistes programm\u00e9s sur dix jours de concerts entre Anfa Park et le Parc de la Ligue arabe, confirmant l\u2019ampleur exceptionnelle de cette nouvelle \u00e9dition. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "L\u2019ambassadeur repr\u00e9sentant permanent du Maroc\naupr\u00e8s de l\u2019ONU-Gen\u00e8ve, Omar Zniber...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU-Gen\u00e8ve, Omar Zniber a r\u00e9affirm\u00e9, mardi \u00e0 Gen\u00e8ve, l\u2019attachement ind\u00e9fectible du Maroc au multilat\u00e9ralisme, au moment o\u00f9 cette pierre angulaire de la coop\u00e9ration internationale est mise \u00e0 l\u2019\u00e9preuve par des d\u00e9fis mondiaux complexes et \u00e9volutifs. [fr.hespress.com]\n-------------------------------------------------\nL\u2019ambassadeur repr\u00e9sentant permanent du Maroc aupr\u00e8s de l\u2019ONU-Gen\u00e8ve, Omar Zniber a r\u00e9affirm\u00e9, mardi \u00e0 Gen\u00e8ve, l\u2019attachement ind\u00e9fectible du Maroc au multilat\u00e9ralisme, au moment o\u00f9 cette pierre angulaire de la coop\u00e9ration internationale est mise \u00e0 l\u2019\u00e9preuve par des d\u00e9fis mondiaux complexes et \u00e9volutifs. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le ministre de l\u2019Enseignement sup\u00e9rieur,\nde la Recherche scientifique et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019Enseignement sup\u00e9rieur, de la Recherche scientifique et de l\u2019Innovation, Azzedine El Midaoui, et son homologue azerba\u00efdjanais, Emin Amrullayev, en charge de la Science et de l\u2019\u00c9ducation, ont sign\u00e9 lundi \u00e0 Rabat un accord de coop\u00e9ration portant sur le d\u00e9veloppement des relations bilat\u00e9rales dans les domaines acad\u00e9mique et scientifique. [fr.hespress.com]\n-------------------------------------------------\nLe pr\u00e9sident de la CGEM, Chakib Alj, et le ministre de l\u2019Enseignement Sup\u00e9rieur, de la Recherche Scientifique et de l\u2019Innovation, Azzedine El Midaoui, ont sign\u00e9, mardi 17 f\u00e9vrier [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Lors d\u2019une conf\u00e9rence de presse\nconsacr\u00e9e au bilan de la...", "mass": 5, "physics": false, "shape": "box", "title": "Lors d\u2019une conf\u00e9rence de presse consacr\u00e9e au bilan de la coop\u00e9ration et aux perspectives pour. [lematin.ma]\n-------------------------------------------------\nLa d\u00e9l\u00e9gation de l\u2019Union europ\u00e9enne au Maroc et la Banque europ\u00e9enne d\u2019investissement ont dress\u00e9, \u00e0 l\u2019occasion de leur conf\u00e9rence de presse annuelle, tenue ce mardi \u00e0 Rabat, le bilan de l\u2019ann\u00e9e 2025 et pr\u00e9sent\u00e9 les principales priorit\u00e9s ainsi que les perspectives qui orienteront la coop\u00e9ration entre l\u2019UE et le Royaume au cours de l\u2019ann\u00e9e 2026. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de leur conf\u00e9rence de presse annuelle tenue le 17 f\u00e9vrier 2026 \u00e0 Rabat, la D\u00e9l\u00e9gation de l\u2019Union europ\u00e9enne au Maroc et la Banque europ\u00e9enne d\u2019investissement (BEI) ont dress\u00e9 le bilan d\u2019une ann\u00e9e 2025 marqu\u00e9e par une intensification des engagements financiers et pr\u00e9sent\u00e9 les priorit\u00e9s qui structureront la coop\u00e9ration en 2026. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les autorit\u00e9s locales de la\nprovince de Chefchaouen ont supervis\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Les autorit\u00e9s locales de la province de Chefchaouen ont supervis\u00e9 l\u2019op\u00e9ration de retour des familles \u00e9vacu\u00e9es \u00e0 titre pr\u00e9ventif du douar \u201cImoudnene\u201d, relevant de la commune de Tala. [lematin.ma]\n-------------------------------------------------\nLes autorit\u00e9s locales de la province de Chefchaouen ont entam\u00e9, depuis lundi, l\u2019op\u00e9ration de retour des habitants \u00e9vacu\u00e9s provisoirement de leurs domiciles, en raison des perturbations m\u00e9t\u00e9orologiques ayant affect\u00e9 la province. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Port\u00e9e par BANK OF AFRICA\net ses partenaires acad\u00e9miques, la...", "mass": 5, "physics": false, "shape": "box", "title": "Port\u00e9e par BANK OF AFRICA et ses partenaires acad\u00e9miques, la Chaire Panafricaine de Durabilit\u00e9 et Finance \u00e0 Impact atteint aujourd\u2019hui une phase de maturit\u00e9, confirmant sa vocation. [lematin.ma]\n-------------------------------------------------\nDans un contexte de mobilisation croissante autour des enjeux de durabilit\u00e9, Bank of Africa annonce le lancement du Prix d\u2019Excellence en Durabilit\u00e9 \u0026 Impact, une initiative pionni\u00e8re port\u00e9e [www.challenge.ma]\n-------------------------------------------------\nBank of Africa (BOA) a, r\u00e9cemment, lanc\u00e9 le Prix d\u2019Excellence en Durabilit\u00e9 \u0026 Impact avec un appel \u00e0 candidatures ouvert du 15 f\u00e9vrier au 15 avril. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00ab Sur proposition de l\u2019\u00c9tat\nfran\u00e7ais, Madame Anne-Claire Legendre a...", "mass": 5, "physics": false, "shape": "box", "title": "\u00ab Sur proposition de l\u2019\u00c9tat fran\u00e7ais, Madame Anne-Claire Legendre a \u00e9t\u00e9 d\u00e9sign\u00e9e membre du Conseil d\u2019administration et \u00e9lue Pr\u00e9sidente de l\u2019Institut du monde arabe. [lematin.ma]\n-------------------------------------------------\nLe conseil d\u2019administration de l\u2019Institut du monde arabe (IMA) \u00e0 Paris a confirm\u00e9 mardi la nomination de la diplomate fran\u00e7aise Anne-Claire Legendre, premi\u00e8re femme \u00e0 la t\u00eate de cette institution. [telquel.ma]\n-------------------------------------------------\n\u00ab Sur proposition de l\u2019\u00c9tat fran\u00e7ais, Madame Anne-Claire Legendre a \u00e9t\u00e9 d\u00e9sign\u00e9e membre du Conseil d\u2019administration et \u00e9lue Pr\u00e9sidente de l\u2019Institut du monde arabe. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "\u00c0 l\u2019occasion du mois sacr\u00e9\nde Ramadan 1447, l\u2019Office National...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion du mois sacr\u00e9 de Ramadan 1447, l\u2019Office National des Chemins de Fer (ONCF) adresse ses meilleurs v\u0153ux \u00e0 ses clients et annonce l\u2019adaptation de son programme de circulation aux horaires administratifs en vigueur durant cette p\u00e9riode. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion du mois sacr\u00e9 de Ramadan 1447, l\u2019Office National des Chemins de Fer (ONCF) annonce l\u2019adaptation de son programme de circulation aux horaires administratifs en vigueur durant [www.chal
