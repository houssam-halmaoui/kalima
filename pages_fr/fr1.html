e p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [fr.hespress.com]\n-------------------------------------------------\nLes recettes douani\u00e8res ont \u00e9t\u00e9 de 90,8 milliards de dirhams (MMDH) au terme des dix premiers mois de 2026, en am\u00e9lioration de 8,6% comparativement \u00e0 la m\u00eame p\u00e9riode un an auparavant, selon la Tr\u00e9sorerie G\u00e9n\u00e9rale du Royaume (TGR). [telquel.ma]\n-------------------------------------------------\nEn int\u00e9grant les taxes int\u00e9rieures de consommation sur les tabacs manufactur\u00e9s et les autres produits, les recettes de la fiscalit\u00e9 douani\u00e8re avoisinent 108 milliards de dirhams, port\u00e9es notamment par la progression de la TVA \u00e0 l\u2019importation et des droits de douane. [www.lavieeco.com]\n-------------------------------------------------\nLes recettes douani\u00e8res ont atteint 90,8 milliards de dirhams \u00e0 fin octobre 2026, en progression de 8,6 % par rapport \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon la Tr\u00e9sorerie g\u00e9n\u00e9rale du Royaume (TGR). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Selon le Quai d\u0027Orsay, le\nministre fran\u00e7ais de l\u2019Europe et...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le Quai d\u0027Orsay, le ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot participera au panel intitul\u00e9 \u00ab Croiser diplomatie et soci\u00e9t\u00e9 civile pour c. [lematin.ma]\n-------------------------------------------------\nJean-No\u00ebl Barrot est attendu vendredi 13 novembre au Maroc pour participer \u00e0 un panel de haut niveau du Forum mondial des femmes pour la paix 2026. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean No\u00ebl Barrot, a salu\u00e9, vendredi \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine en mati\u00e8re de coexistence et de dialogue au service de la paix. [fr.hespress.com]\n-------------------------------------------------\nLe ministre fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res, Jean-No\u00ebl Barrot, a salu\u00e9 vendredi 13 novembre 2026, \u00e0 Essaouira, l\u2019exp\u00e9rience marocaine de coexistence et de dialogue, qu\u2019il a pr\u00e9sent\u00e9e comme un appui \u00e0 la paix. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La protection du pouvoir d\u2019achat\ndes citoyens figure parmi les...", "mass": 5, "physics": false, "shape": "box", "title": "La protection du pouvoir d\u2019achat des citoyens figure parmi les principales priorit\u00e9s du gouvernement. [lematin.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [telquel.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat demeure une priorit\u00e9 du gouvernement, a r\u00e9affirm\u00e9 jeudi la Cheffe du gouvernement, Fatima Ezzahra El Mansouri, lors du Conseil de gouvernement. [leseco.ma]\n-------------------------------------------------\nLa protection du pouvoir d\u2019achat des citoyens demeure en t\u00eate des priorit\u00e9s du gouvernement, a affirm\u00e9, jeudi \u00e0 Rabat, la Cheffe du gouvernement, Fatima Ezzahra El Mansouri. [www.lereporter.ma]\n-------------------------------------------------\nLe gouvernement a annonc\u00e9 une s\u00e9rie de mesures destin\u00e9es \u00e0 limiter les effets de la hausse des prix sur le pouvoir d\u2019achat des m\u00e9nages. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Wafa Assurance poursuit son d\u00e9veloppement\nsur le march\u00e9 de l\u2019assurance-vie...", "mass": 5, "physics": false, "shape": "box", "title": "Wafa Assurance poursuit son d\u00e9veloppement sur le march\u00e9 de l\u2019assurance-vie avec la signature d\u2019un accord aupr\u00e8s du groupe Saham en vue d\u2019acqu\u00e9rir 99,98% du capital de La Marocaine. [lematin.ma]\n-------------------------------------------------\nWafa Assurance a sign\u00e9 un accord en vue de mettre la main sur 99,98% du capital de La Marocaine Vie. [telquel.ma]\n-------------------------------------------------\nCette op\u00e9ration, qui reste soumise aux autorisations r\u00e9glementaires, s\u0027accompagne d\u0027un partenariat de bancassurance de long terme entre Wafa Assurance et Saham Bank. [www.lavieeco.com]\n-------------------------------------------------\nWafa Assurance a annonc\u00e9, le 12 novembre 2026, avoir sign\u00e9 un accord avec le groupe Saham pour acqu\u00e9rir 99,98 % du capital de La Marocaine Vie. [www.yabiladi.com]\n-------------------------------------------------\nWafa Assurance a conclu un accord avec le groupe Saham pour acqu\u00e9rir 99,98 % du capital de La Marocaine Vie. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc et la Norv\u00e8ge\nrenforcent leur coop\u00e9ration dans les...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Norv\u00e8ge renforcent leur coop\u00e9ration dans les domaines de la finance climatique et des march\u00e9s carbone, \u00e0 travers la signature, jeudi \u00e0 Antalya, d\u2019un accord d\u2019achat de r\u00e9sultats d\u2019att\u00e9nuation (Mitigation Outcome Purchase Agreement \u2013 MOPA), visant \u00e0 g\u00e9n\u00e9rer jusqu\u2019\u00e0 8,89 millions de tonnes \u00e9quivalent CO\u2082 de r\u00e9ductions d\u2019\u00e9missions sur 10 ans. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, en marge de la COP31, un accord visant \u00e0 financer des projets solaires et \u00e9oliens au Maroc par le biais du march\u00e9 carbone. [www.yabiladi.com]\n-------------------------------------------------\nLe Maroc et la Norv\u00e8ge ont conclu, jeudi 12 novembre \u00e0 Antalya, un accord destin\u00e9 \u00e0 mobiliser des financements carbone pour soutenir le d\u00e9veloppement des \u00e9nergies renouvelables dans le Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Quatre lignes \u00e0 haute tension\ntouch\u00e9es, des quartiers plong\u00e9s dans...", "mass": 5, "physics": false, "shape": "box", "title": "Quatre lignes \u00e0 haute tension touch\u00e9es, des quartiers plong\u00e9s dans le noir pendant plusieurs heures le mercredi 11 novembre : \u00e0 Casablanca, la coupure d\u2019\u00e9lectricit\u00e9 du 11 novembre serait li\u00e9e aux intemp\u00e9ries provoqu\u00e9es par la temp\u00eate Charles. [telquel.ma]\n-------------------------------------------------\nLa coupure d\u2019\u00e9lectricit\u00e9 qui a touch\u00e9 plusieurs quartiers de Casablanca, mercredi 11 novembre, doit \u00eatre replac\u00e9e dans le contexte des conditions m\u00e9t\u00e9orologiques exceptionnelles ayant accompagn\u00e9 la temp\u00eate Charles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La Commission des finances et\ndu d\u00e9veloppement \u00e9conomique \u00e0 la...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants a adopt\u00e9, jeudi, \u00e0 la majorit\u00e9, la premi\u00e8re partie du projet de loi de finances (PLF) n\u00b060.26 pour l\u2019ann\u00e9e budg\u00e9taire 2027. [telquel.ma]\n-------------------------------------------------\nL\u2019examen et l\u2019adoption de la premi\u00e8re partie du projet de loi de finances (PLF) 2027 par la Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants ont n\u00e9cessit\u00e9 55 heures et 25 minutes de travaux, r\u00e9parties sur 11 r\u00e9unions et huit jours de travail. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Les acquis accomplis au sein\ndu syst\u00e8me de l\u2019\u00e9ducation, de...", "mass": 5, "physics": false, "shape": "box", "title": "Les acquis accomplis au sein du syst\u00e8me de l\u2019\u00e9ducation, de la formation et de la recherche scientifique n\u2019ont pas encore abouti \u00e0 la transformation globale et syst\u00e9mique escompt\u00e9e, telle que pr\u00e9conis\u00e9e par la vision strat\u00e9gique de la r\u00e9forme 2015-2030, a affirm\u00e9, mercredi \u00e0 Rabat, le directeur de l\u2019Instance nationale d\u2019\u00e9valuation (INE), Hicham Ait Mansour. [telquel.ma]\n-------------------------------------------------\nMalgr\u00e9 les avanc\u00e9es enregistr\u00e9es au cours de la derni\u00e8re d\u00e9cennie, le syst\u00e8me marocain d\u2019\u00e9ducation, de formation et de recherche scientifique n\u2019a pas encore connu la transformation structurelle attendue dans le cadre de la Vision strat\u00e9gique 2015-2030. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les projets ferroviaires en cours\nde r\u00e9alisation, notamment la Ligne...", "mass": 5, "physics": false, "shape": "box", "title": "Les projets ferroviaires en cours de r\u00e9alisation, notamment la Ligne \u00e0 grande vitesse (LGV) qui reliera Tanger \u00e0 Marrakech, vont transformer le paysage du transport et de la mobilit\u00e9 dans le Royaume \u00e0 l\u2019horizon 2029, a affirm\u00e9, mercredi \u00e0 la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh. [telquel.ma]\n-------------------------------------------------\nDevant la Chambre des repr\u00e9sentants, le ministre du Transport et de la Logistique, Abdessamad Kayouh, a notamment mis en avant les perspectives offertes par la ligne \u00e0 grande vitesse Tanger-Marrakech, le d\u00e9veloppement des trains r\u00e9gionaux . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Colas Rail, filiale du groupe\nBouygues, vient de remporter un...", "mass": 5, "physics": false, "shape": "box", "title": "Colas Rail, filiale du groupe Bouygues, vient de remporter un nouveau contrat aupr\u00e8s l\u2019Office national des chemins de fer (ONCF). [telquel.ma]\n-------------------------------------------------\nColas Rail renforce sa participation au d\u00e9veloppement du r\u00e9seau ferroviaire marocain avec l\u2019obtention d\u2019un nouveau contrat aupr\u00e8s de l\u2019Office national des chemins de fer (ONCF). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "L\u2019examen des amendements propos\u00e9s au\nprojet de loi de finances...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019examen des amendements propos\u00e9s au projet de loi de finances (PLF) de 2027 a port\u00e9, mercredi lors d\u2019une r\u00e9union de la Commission des finances et du d\u00e9veloppement \u00e9conomique \u00e0 la Chambre des repr\u00e9sentants, sur plusieurs dispositions douani\u00e8res et fiscales relatives notamment \u00e0 l\u2019organisation de la profession de transitaire en douane, \u00e0 l\u2019importation de b\u00e9tail et. [telquel.ma]\n-------------------------------------------------\nL\u2019examen des amendements au projet de loi de finances (PLF) 2027 a donn\u00e9 lieu, mercredi 11 novembre \u00e0 la Chambre des repr\u00e9sentants, \u00e0 plusieurs d\u00e9bats portant sur la r\u00e9glementation de la profession de transitaire en douane, les exon\u00e9rations accord\u00e9es aux importations de b\u00e9tail et de viandes, ainsi que la protection de l\u2019industrie pharmaceutique nationale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00e9curit\u00e9 des syst\u00e8mes d\u2019information (DGSSI)...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00e9curit\u00e9 des syst\u00e8mes d\u2019information (DGSSI) du Maroc a lanc\u00e9, le 12 novembre 2026, une alerte critique sur une campagne mondiale de cyberattaques visant les prestataires informatiques utilisant la version cloud de ConnectWise ScreenConnect, un outil de gestion et de d\u00e9pannage \u00e0 distance des ordinateurs. [www.yabiladi.com]\n-------------------------------------------------\nC\u2019est le risque mis en lumi\u00e8re par une vaste campagne de cyberattaques ciblant les utilisateurs de ConnectWise ScreenConnect, un outil de t\u00e9l\u00e9maintenance largement utilis\u00e9 par les prestataires informatiques. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Le gouvernement marocain et la\nBanque africaine de d\u00e9veloppement ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement marocain et la Banque africaine de d\u00e9veloppement ont sign\u00e9, vendredi 13 novembre 2026 \u00e0 Rabat, un accord de financement d\u2019un montant \u00e9quivalent \u00e0 434,4 millions d\u2019euros pour acc\u00e9l\u00e9rer la transformation structurelle de l\u2019\u00e9conomie marocaine et promouvoir une croissance plus dynamique, inclusive et r\u00e9siliente aux chocs exog\u00e8nes et climatiques. [aujourdhui.ma]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement ont conclu, ce vendredi 13 novembre \u00e0 Rabat, un accord de financement de 434,4 millions d\u2019euros. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 23, "id": "comm_label_23", "label": "Les \u00c9tats-Unis engagent 4 millions\nde dollars en faveur de...", "mass": 5, "physics": false, "shape": "box", "title": "Les \u00c9tats-Unis engagent 4 millions de dollars en faveur de STRIDES, qui s\u2019ajoutent \u00e0 plus de 10 millions de dollars consacr\u00e9s aux actions conjointes de s\u00e9curit\u00e9 sanitaire, par l\u2019interm\u00e9diaire des Centres pour le contr\u00f4le et la pr\u00e9vention des maladies et de l\u2019Agence de r\u00e9duction des menaces de d\u00e9fense. [www.lavieeco.com]\n-------------------------------------------------\nLe projet STRIDES a \u00e9t\u00e9 lanc\u00e9 jeudi 12 novembre \u00e0 Rabat par le Maroc et les \u00c9tats-Unis pour renforcer la surveillance et la d\u00e9tection pr\u00e9coce des maladies transmissibles. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La Banque centrale populaire (BCP)\net sa filiale Upline Securities...", "mass": 5, "physics": false, "shape": "box", "title": "La Banque centrale populaire (BCP) et sa filiale Upline Securities ont obtenu leurs agr\u00e9ments respectifs aupr\u00e8s des autorit\u00e9s comp\u00e9tentes dans le cadre du lancement du march\u00e9 \u00e0 terme au Maroc, une nouvelle \u00e9tape dans le d\u00e9veloppement du march\u00e9 des capitaux national. [www.lavieeco.com]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9, jeudi 12 novembre, l\u2019obtention de leurs agr\u00e9ments dans le cadre de l\u2019ouverture du march\u00e9 \u00e0 terme au Maroc. [lnt.ma]\n-------------------------------------------------\nLa Banque Centrale Populaire (BCP) et sa filiale Upline Securities ont annonc\u00e9 l\u2019obtention de leurs agr\u00e9ments aupr\u00e8s des autorit\u00e9s comp\u00e9tentes, dans le cadre du lancement du march\u00e9 \u00e0 terme au Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "La 8e \u00e9dition de la\nChina Trade Week Morocco et...", "mass": 5, "physics": false, "shape": "box", "title": "La 8e \u00e9dition de la China Trade Week Morocco et le China-Morocco Smart Life Show se tiendront du 17 au 19 novembre \u00e0 la Foire internationale de Casablanca. [www.lavieeco.com]\n-------------------------------------------------\nCasablanca accueillera pendant trois jours une nouvelle \u00e9dition de la China Trade Week Morocco, une manifestation destin\u00e9e \u00e0 faciliter les relations commerciales entre les exportateurs chinois et les op\u00e9rateurs \u00e9conomiques marocains et africains. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "L\u2019ancien ambassadeur d\u2019Italie au Maroc,\nArmando Barucco, a re\u00e7u jeudi...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ancien ambassadeur d\u2019Italie au Maroc, Armando Barucco, a re\u00e7u jeudi 12 novembre \u00e0 Rome le Wissam Al Alaoui de l\u2019ordre de Grand Officier. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019ancien ambassadeur d\u2019Italie au Maroc, Armando Barucco, a \u00e9t\u00e9 d\u00e9cor\u00e9 jeudi 12 novembre 2026 \u00e0 Rome du Wissam Al Alaoui de l\u2019ordre de Grand Officier, d\u00e9cern\u00e9 par le roi Mohammed VI au terme de sa mission dans le Royaume. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "La France a r\u00e9affirm\u00e9, vendredi,\nsa position \u00ab intangible \u00bb...", "mass": 5, "physics": false, "shape": "box", "title": "La France a r\u00e9affirm\u00e9, vendredi, sa position \u00ab intangible \u00bb selon laquelle \u00ab le pr\u00e9sent et l\u2019avenir du Sahara occidental s\u2019inscrivent dans le cadre de la souverainet\u00e9 marocaine \u00bb, indique-t-on dans une d\u00e9claration du porte-parole du minist\u00e8re fran\u00e7ais de l\u2019Europe et des Affaires \u00e9trang\u00e8res. [fr.hespress.com]\n-------------------------------------------------\nPubli\u00e9e \u00e0 l\u0027issue de l\u2019entretien, \u00e0 Essaouira, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, et. [lematin.ma]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9, vendredi 13 novembre 2026, son soutien \u00e0 la souverainet\u00e9 marocaine sur le Sahara occidental, \u00e0 l\u2019issue d\u2019un entretien \u00e0 Essaouira entre les ministres des Affaires \u00e9trang\u00e8res Nasser Bourita et Jean-No\u00ebl Barrot. [www.yabiladi.com]\n-------------------------------------------------\nLa France consid\u00e8re \u00e9galement le plan d\u2019autonomie propos\u00e9 par le Maroc en 2007 comme \u00ab la seule base \u00bb pour parvenir \u00e0 une solution politique juste, durable et n\u00e9goci\u00e9e. [www.lavieeco.com]\n-------------------------------------------------\nLa France a r\u00e9affirm\u00e9 vendredi sa position sur le Sahara marocain, selon laquelle le pr\u00e9sent et l\u2019avenir du territoire s\u2019inscrivent dans le cadre de la souverainet\u00e9 marocaine. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0\nl\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion d\u2019une discussion \u00e0 l\u2019Assembl\u00e9e g\u00e9n\u00e9rale des Nations unies sur les vetos russe et am\u00e9ricain du 30 octobre pour mettre fin \u00e0 la mission de l\u2019ONU au Sahara (MINURSO), les pays du continent africain l\u2019ayant souhait\u00e9 en ont profit\u00e9 pour se prononcer sur le diff\u00e9rend du Sahara. [telquel.ma]\n-------------------------------------------------\nLa fin du mandat de la MINURSO n\u2019a pas clos le d\u00e9bat sur la place des Nations unies dans le r\u00e8glement du diff\u00e9rend r\u00e9gional autour du Sahara marocain. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "La 13\u00e8me session du comit\u00e9\nde coop\u00e9ration douani\u00e8re (CDD) Maroc-Union...", "mass": 5, "physics": false, "shape": "box", "title": "La 13\u00e8me session du comit\u00e9 de coop\u00e9ration douani\u00e8re (CDD) Maroc-Union europ\u00e9enne (UE) s\u2019est tenue, mardi, au si\u00e8ge de l\u2019Administration des Douanes et Imp\u00f4ts Indirects (ADII) \u00e0 Rabat. [telquel.ma]\n-------------------------------------------------\nLa 13e session du comit\u00e9 de coop\u00e9ration douani\u00e8re Maroc-Union europ\u00e9enne s\u2019est tenue mardi au si\u00e8ge de l\u2019Administration des douanes et imp\u00f4ts indirects (ADII), \u00e0 Rabat. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Casablanca Finance City Authority (CFCA),\nla Caisse de d\u00e9p\u00f4t et...", "mass": 5, "physics":     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
