rtirait en acc\u00e9l\u00e9ration de 4,9% en 2025 \u00e0 5,2% en 2026, puis s\u2019\u00e9tablirait, en raison de l\u2019effet de base, \u00e0 3,1% en 2027, selon les projections de Bank Al-Maghrib (BAM). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La canicule qui frappe l\u2019Europe\noccidentale, in\u00e9dite par son intensit\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La canicule qui frappe l\u2019Europe occidentale, in\u00e9dite par son intensit\u00e9 et sa pr\u00e9cocit\u00e9 dans la saison, met \u00e0 l\u2019\u00e9preuve mercredi les r\u00e9seaux \u00e9lectriques et relance aussi le d\u00e9bat [www.challenge.ma]\n-------------------------------------------------\nLa canicule qui frappe l\u2019Europe occidentale, in\u00e9dite par son intensit\u00e9 et sa pr\u00e9cocit\u00e9 dans la saison, met \u00e0 l\u2019\u00e9preuve mercredi les r\u00e9seaux \u00e9lectriques et relance aussi le d\u00e9bat sur l\u2019utilit\u00e9, ou non, de la climatisation face \u00e0 des chaleurs appel\u00e9es \u00e0 progresser vers l\u2019est du continent. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "La facturation \u00e9lectronique et la\ndigitalisation des flux financiers constituent...", "mass": 5, "physics": false, "shape": "box", "title": "La facturation \u00e9lectronique et la digitalisation des flux financiers constituent un enjeu majeur de comp\u00e9titivit\u00e9 pour les entreprises marocaines, a indiqu\u00e9 le directeur g\u00e9n\u00e9ral du Centre mon\u00e9tique interbancaire (CMI), Rachid Saihi. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019\u00e9volution vers la facturation \u00e9lectronique et la digitalisation des flux financiers repr\u00e9sente un enjeu majeur de comp\u00e9titivit\u00e9 pour les entreprises marocaines et ral de l\u2019Agence pour l\u2019enseignement fran\u00e7ais \u00e0 l\u2019\u00e9tranger (AEFE), a effectu\u00e9 sa premi\u00e8re visite officielle \u00e0 l\u2019\u00e9tranger au Maroc, les 23 et 24 juin 2026. [telquel.ma]\n-------------------------------------------------\nLe pays compte 44 \u00e9tablissements homologu\u00e9s accueillant pr\u00e8s de 49 000 \u00e9l\u00e8ves, constituant \u00abl\u2019un des r\u00e9seaux les plus importants et les plus dynamiques de l\u2019AEFE dans le monde\u00bb, selon un communiqu\u00e9. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le Groupe OCP a franchi\nune nouvelle \u00e9tape majeure dans...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe OCP a franchi une nouvelle \u00e9tape majeure dans sa strat\u00e9gie d\u2019optimisation financi\u00e8re en cl\u00f4turant avec succ\u00e8s une \u00e9mission d\u2019obligations subordonn\u00e9es perp\u00e9tuelles d\u2019un montant global de 5 milliards de dirhams. [fr.hespress.com]\n-------------------------------------------------\nSon \u00e9mission obligataire subordonn\u00e9e perp\u00e9tuelle, d\u2019un montant de 5 milliards de dirhams (MMDH), a \u00e9t\u00e9 int\u00e9gralement plac\u00e9e aupr\u00e8s d\u2019investisseurs institutionnels. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le Royaume du Maroc a\nofficiellement pris, mercredi, la pr\u00e9sidence...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume du Maroc a officiellement pris, mercredi, la pr\u00e9sidence du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5) pour la p\u00e9riode 2026-2028, \u00e0 l\u2019issue des travaux de la 11e Conf\u00e9rence minist\u00e9rielle dudit Groupe \u00e0 Rabat. [fr.hespress.com]\n-------------------------------------------------\nLe Royaume du Maroc a officiellement pris, ce mercredi, la pr\u00e9sidence du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5) pour la p\u00e9riode 2026-2028, \u00e0 l\u2019issue des travaux de la 11e Conf\u00e9rence minist\u00e9rielle dudit Groupe \u00e0 Rabat. [leseco.ma]\n-------------------------------------------------\nLes travaux de la 11e Conf\u00e9rence minist\u00e9rielle du Groupe des ministres des Transports de la M\u00e9diterran\u00e9e occidentale (GTMO 5+5), se sont ouverts, mercredi \u00e0 Rabat, en pr\u00e9sence des ministres et chefs de d\u00e9l\u00e9gation des pays membres du Groupe, ainsi que des repr\u00e9sentants de plusieurs organisations r\u00e9gionales et internationales partenaires. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "AtlantaSanad a annonc\u00e9 l\u2019obtention de\nla certification NM ISO 9001:2015...", "mass": 5, "physics": false, "shape": "box", "title": "AtlantaSanad a annonc\u00e9 l\u2019obtention de la certification NM ISO 9001:2015 pour ses activit\u00e9s Assurance Sant\u00e9, Assurance Automobile et Gestion des R\u00e9clamations. [lematin.ma]\n-------------------------------------------------\nAtlantaSanad Assurance a annonc\u00e9 l\u2019obtention de la certification NM ISO 9001 : 2015 pour ses activit\u00e9s d\u2019Assurance Sant\u00e9, d\u2019Assurance Automobile et de Gestion des R\u00e9clamations. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Au cours de sa r\u00e9union,\ntenue mercredi 24 juin \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Au cours de sa r\u00e9union, tenue mercredi 24 juin \u00e0 Rabat, le Conseil d\u2019administration de l\u2019Office national marocain du tourisme (ONMT) s\u2019est f\u00e9licit\u00e9 de la solidit\u00e9 de la [w         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
