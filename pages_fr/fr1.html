ppement issues des Am\u00e9riques, d\u2019Europe, d\u2019Asie et d\u2019Afrique. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a accueilli, mercredi \u00e0 Rabat, le Sommet annuel du Groupe de Montr\u00e9al, organis\u00e9 pour la premi\u00e8re fois sur le sol africain \u00e0 l\u2019initiative de Tamwilcom. [leseco.ma]\n-------------------------------------------------\nLe Maroc a abrit\u00e9, mercredi \u00e0 Rabat, \u00e0 l\u2019initiative de Tamwilcom, le Sommet Annuel du Groupe de Montr\u00e9al, un r\u00e9seau international r\u00e9unissant treize banques publiques de d\u00e9veloppement issues des Am\u00e9riques, d\u2019Europe, d\u2019Asie et d\u2019Afrique. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "L\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD)\nvient d\u2019annoncer un changement \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) vient d\u2019annoncer un changement \u00e0 la t\u00eate de son antenne marocaine, avec la nomination de Catherine Bonnaud en tant que directrice d\u2019agence. [lematin.ma]\n-------------------------------------------------\nL\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) a annonc\u00e9 la nomination de Catherine Bonnaud au poste de directrice d\u2019agence au Maroc et de Bertrand Poche comme directeur adjoint. [telquel.ma]\n-------------------------------------------------\nLa nouvelle direction souhaite s\u2019inscrire dans la continuit\u00e9, en vue de \u00abconsolider les engagements pris aupr\u00e8s des autorit\u00e9s marocaines et des partenaires locaux\u00bb. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "D\u00e9ploy\u00e9e en partenariat avec le\nminist\u00e8re de l\u2019\u00c9ducation na         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }
