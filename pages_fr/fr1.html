pour offrir aux voyageurs et aux supporters du monde entier une exp\u00e9rience \u00e0 . [lnt.ma]\n-------------------------------------------------\nServices a\u00e9roportuaires : Modernisation des espaces et diversification de l\u2019offre de restauration illustrent la volont\u00e9 de l\u2019ONDA de faire des a\u00e9roports marocains de v\u00e9ritables lieux d\u2019accueil, confortables et conviviaux, \u00e0 la hauteur de la CAN 2025. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019Office National des A\u00e9roports (ONDA) annonce le renforcement et la diversification de l\u2019offre de restauration dans les a\u00e9roports \u00e0 la veille de la Coupe d\u2019Afrique des Nations (CAN) 2025. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le minist\u00e8re de la Transition\nnum\u00e9rique et de la R\u00e9forme...", "mass": 5, "physics": false, "shape": "box", "title": "Le minist\u00e8re de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, en partenariat avec Tamwilcom, a lanc\u00e9 \u00e0 Rabat l\u2019offre \u00ab Startup Venture Building \u00bb (VB), un nouveau dispositif destin\u00e9 \u00e0 renforcer l\u2019accompagnement et le financement des startups marocaines innovantes. [lnt.ma]\n-------------------------------------------------\nDans le cadre de la mise en \u0153uvre de la strat\u00e9gie nationale Digital Morocco 2030, le Minist\u00e8re de la Transition Num\u00e9rique et de la R\u00e9forme de l\u2019Administration, en partenariat avec TAMWILCOM, a proc\u00e9d\u00e9 \u00e0 Rabat au d\u00e9ploiement officiel de l\u2019offre \u00ab Startup Venture Building \u00bb (VB), un dispositif structurant d\u00e9di\u00e9 \u00e0 l\u2019accompagnement et au financement . [maroc-diplomatique.net]\n-------------------------------------------------\nLe minist\u00e8re de la Transition num\u00e9rique, en partenariat avec Tamwilcom, a lanc\u00e9 officiellement l\u2019offre \u00abStartup Venture Building\u00bb, un programme d\u2019accompagnement et de financement d\u00e9di\u00e9 aux startups innovantes marocaines. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "L\u2019\u00e9v\u00e9nement a \u00e9t\u00e9 organis\u00e9 par\nl\u2019Agence nationale pour la r\u00e9novation...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9v\u00e9nement a \u00e9t\u00e9 organis\u00e9 par l\u2019Agence nationale pour la r\u00e9novation urbaine et la r\u00e9habilitation des b\u00e2timents mena\u00e7ant ruine (ANRUR), le Conseil national de l\u2019Ordre des architectes (CNOA) et LafargeHolcim Maroc, sous . [lnt.ma]\n-------------------------------------------------\nLafargeHolcim Maroc, l\u2019Agence Nationale pour la R\u00e9novation Urbaine et la R\u00e9habilitation des B\u00e2timents Mena\u00e7ant Ruine et le Conseil National de l\u2019Ordre des Architectes ont organis\u00e9, le mardi 16 d\u00e9cembre 2025 au Palais des Congr\u00e8s Le Bouregreg \u00e0 Rabat, la premi\u00e8re \u00e9dition de la Conf\u00e9rence Internationale de la R\u00e9novation Urbaine. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Cr\u00e9dit du Maroc a annonc\u00e9\nla signature d\u2019un partenariat strat\u00e9gique...", "mass": 5, "physics": false, "shape": "box", "title": "Cr\u00e9dit du Maroc a annonc\u00e9 la signature d\u2019un partenariat strat\u00e9gique avec la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD), dans le cadre du programme GEFF Plus, visant \u00e0 accompagner les entreprises marocaines dans leurs projets de transition \u00e9nerg\u00e9tique. [lnt.ma]\n-------------------------------------------------\nCr\u00e9dit du Maroc annonce la signature d\u2019un partenariat <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
