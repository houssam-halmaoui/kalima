 allocution adress\u00e9e aux\nFran\u00e7ais dimanche 18 octobre, Emmanuel...", "mass": 5, "physics": false, "shape": "box", "title": "Dans une allocution adress\u00e9e aux Fran\u00e7ais dimanche 18 octobre, Emmanuel Macron a condamn\u00e9 les violences commises en marge des manifestations du 17 octobre, tout en distinguant les manifestants porteurs de revendications l\u00e9gitimes des auteurs de d\u00e9gradations et de pillages. [fr.hespress.com]\n-------------------------------------------------\nEmmanuel Macron s\u2019est adress\u00e9 aux Fran\u00e7ais dimanche soir, au lendemain d\u2019une journ\u00e9e de mobilisation contre la vie ch\u00e8re qui a d\u00e9g\u00e9n\u00e9r\u00e9 en violences dans plusieurs villes. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est\nqualifi\u00e9e pour la phase finale...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019\u00e9quipe nationale de beach-soccer s\u2019est qualifi\u00e9e pour la phase finale de la prochaine \u00e9dition de la Coupe d\u2019Afrique des Nations (CAN), pr\u00e9vue au S\u00e9n\u00e9gal du 28 novembre au 6 d\u00e9cembre 2026. [fr.hespress.com]\n-------------------------------------------------\nL\u00e9quipe marocaine de beach soccer sest qualifi\u00e9e pour la phase finale de la Coupe dAfrique des Nations, qui se tiendra au S\u00e9n\u00e9gal du 28 novembre au 6 d\u00e9cembre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Ce prestigieux \u00e9v\u00e9nement est l\u2019\u00e9preuve\nphare du calendrier \u00e9questre national,...", "mass": 5, "physics": false, "shape": "box", "title": "Ce prestigieux \u00e9v\u00e9nement est l\u2019\u00e9preuve phare du calendrier \u00e9questre national, organis\u00e9 dans le cadre de la finale de la 15e \u00e9diti idth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Oscillant entre 30 \u00e0 50\nmm, ces averses sont pr\u00e9vues...", "mass": 5, "physics": false, "shape": "box", "title": "Oscillant entre 30 \u00e0 50 mm, ces averses sont pr\u00e9vues du dimanche \u00e0 10H au lundi \u00e0 12H dans les provinces d\u0027Errachidia, Tinghir, Al Haouz, Boulemane, Midelt, Zagora et Figuig, a. [lematin.ma]\n-------------------------------------------------\nOscillant entre 30 \u00e0 45 mm, ces averses sont pr\u00e9vues, lundi de 11h \u00e0 20h, dans les provinces de T\u00e9touan, Fahs-Anjra, Chefchaouen, Al Hoceima, Nador, Driouch et M\u2019Diq-Fnideq, a. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "\u00c0 l\u2019occasion de la 114e\nr\u00e9union du Comit\u00e9 de d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la 114e r\u00e9union du Comit\u00e9 de d\u00e9veloppement de la Banque mondiale et du Fonds mon\u00e9taire international, tenue \u00e0 Bangkok, le Maroc a d\u00e9fendu une mobilisation renforc\u00e9e des capitaux priv\u00e9s pour soutenir la croissance et l\u2019emploi. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a plaid\u00e9, \u00e0 Bangkok lors de la 114\u00e8me r\u00e9union du Comit\u00e9 de d\u00e9veloppement, forum conjoint de la Banque mondiale (BM) et du Fonds mon\u00e9taire international (FMI), pour une mobilisation accrue des financements priv\u00e9s en faveur du d\u00e9veloppement. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Jusqu\u2019au 24 octobre, la cit\u00e9\nspirituelle accueille une programmation m\u00ealant...", "mass": 5, "physics": false, "shape": "box", "title": "Jusqu\u2019au 24 octobre, la cit\u00e9 spirituelle accueille une programmation m\u00ealant chants soufis, cr\u00e9ations musicales internationales, rencontres intellectuelles et exp\u00e9riences artistiques autour du th\u00e8me \u00ab La po\u00e9sie mystique, \u00e9lixir de gu\u00e9rison \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLa 18e \u00e9dition du Festival de F\u00e8s de la culture soufie et des sagesses du monde s\u2019est ouverte samedi 17 octobre \u00e0 Bab Al Makina, avec un spectacle consacr\u00e9 aux \u00ab Chemins de l\u2019amour spirituel \u00bb. [lnt.ma]\n-------------------------------------------------\nConcert La 18\u00e8me \u00e9dition du Festival de F\u00e8s de la culture soufie et des sagesses du monde s\u2019est ouverte samedi soir \u00e0 Bab Al Makina, avec le spectacle \u00abChemins de l\u2019amour spirituel\u00bb, donnant le coup d\u2019envoi d\u2019une programmation qui se poursuit jusqu\u2019au 24 octobre sous le th\u00e8me \u00abLa po\u00e9sie mystique, \u00e9lixir de gu\u00e9rison\u00bb. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Fatima Ezzahra El Mansouri, pr\u00e9sente\naujourd\u2019hui le programme de son...", "mass": 5, "physics": false, "shape": "box", "title": "Fatima Ezzahra El Mansouri, pr\u00e9sente aujourd\u2019hui le programme de son gouvernement devant les deux chambres du Parlement r\u00e9unies en s\u00e9ance pl\u00e9ni\u00e8re commune. [leseco.ma]\n-------------------------------------------------\nLa cheffe du gouvernement marocain, Fatima Ezzahra El Mansouri, a affirm\u00e9 que le nouveau mandat gouvernemental proc\u00e9dera \u00e0 la criminalisation de l\u2019enrichissement illicite et \u00e0 la sanction des conflits d\u2019int\u00e9r\u00eats, conform\u00e9ment \u00e0 l\u2019article 36 de la Constitution. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26} oit de rendre sa d\u00e9cision sur la finale contest\u00e9e de la Coupe d\u2019Afrique des nations 2025 entre le Maroc et le S\u00e9n\u00e9gal \u00e0 la fin du mois de novembre 2026. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Une source proche de Fatima\nSaadi, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e du...", "mass": 5, "physics": false, "shape": "box", "title": "Une source proche de Fatima Saadi, ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e du Logement et de la Politique de la ville, a d\u00e9menti les informations relay\u00e9es par certaines plateformes de r\u00e9seaux sociaux et certains m\u00e9dias faisant \u00e9tat d\u2019un jugement rendu \u00e0 son encontre dans le cadre d\u2019une affaire remontant \u00e0 une dizaine d\u2019ann\u00e9es. [fr.hespress.com]\n-------------------------------------------------\n\u00c0 la suite de la circulation, dans certains m\u00e9dias et sur les r\u00e9seaux sociaux, d\u2019informations relatives \u00e0 une ancienne proc\u00e9dure judiciaire concernant Fatima Saadi, le Parti authen. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Cette nouvelle identit\u00e9 intervient dans\nle prolongement du rapprochement avec...", "mass": 5, "physics": false, "shape": "box", "title": "Cette nouvelle identit\u00e9 intervient dans le prolongement du rapprochement avec Allianz Maroc, effectif depuis le 2 juil. [lematin.ma]\n-------------------------------------------------\nSanlam Maroc adopte la marque SanlamAllianz, dans le prolongement du rapprochement avec Allianz Maroc entr\u00e9 en vigueur le 2 juillet 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Prestigia a organis\u00e9, le 17\noctobre 2026, une soir\u00e9e musicale...", "mass": 5, "physics": false, "shape": "box", "title": "Prestigia a organis\u00e9, le 17 octobre 2026, une soir\u00e9e musicale pour marquer le lancement de La Lagune, nouvelle tranche r\u00e9sidentielle du projet Rabat Riviera Golf Living, situ\u00e9 entr. [lematin.ma]\n-------------------------------------------------\nSamedi 17 octobre, Prestigia a organis\u00e9 une soir\u00e9e exceptionnelle r\u00e9unissant plus de 100 musiciens issus des sept ensembles de lAnthologie de lart de l\u00c2la, aux c\u00f4t\u00e9s de 23 artistes internationaux repr\u00e9sentant 13 pays. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le financement des tr\u00e8s petites,\npetites et moyennes entreprises (TPME)...", "mass": 5, "physics": false, "shape": "box", "title": "Le financement des tr\u00e8s petites, petites et moyennes entreprises (TPME) et les conditions n\u00e9cessaires \u00e0 leur d\u00e9veloppement ont \u00e9t\u00e9 au centre des \u00e9changes auxquels a particip\u00e9 Bank. [lematin.ma]\n-------------------------------------------------\nBank of Africa a pris part, samedi 17 octobre \u00e0 Casablanca, au forum \u00ab Entrepreneurs en mouvement : Transformer les priorit\u00e9s en actions \u00bb, organis\u00e9 par la Conf\u00e9d\u00e9ration g\u00e9n\u00e9rale des entreprises du Maroc (CGEM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Garde Royale met en\nexergue, \u00e0 l\u2019occasion de la...", "mass": 5, "physics": false, "shape": "box", "title": "La Garde Royale met en exergue, \u00e0 l\u2019occasion de la 17e \u00e9dition du Salon du Cheval d\u2019El Jadida, une exp\u00e9rience immersive in\u00e9dite permettant aux visiteurs de plonger dans l\u2019univers de sa cavalerie et de d\u00e9couvrir, dans des conditions proches du r\u00e9el, les diff\u00e9rentes discipli         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
