ce Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lavieeco.com]\n-------------------------------------------------\nLa rencontre entre les g\u00e9n\u00e9rations est au c\u0153ur du Festival International du Film de Marrakech, o\u00f9 le cin\u00e9ma se partage avec une spontan\u00e9it\u00e9 et une chaleur qui donnent \u00e0 cette manifestation son caract\u00e8re si particulier, a affirm\u00e9 Son Altesse Royale le Prince Moulay Rachid, Pr\u00e9sident de la Fondation du Festival. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "T2S Group annonce que sa\nfiliale IM Alliance devient distributeur...", "mass": 5, "physics": false, "shape": "box", "title": "T2S Group annonce que sa filiale IM Alliance devient distributeur agr\u00e9\u00e9 des syst\u00e8mes de vid\u00e9o-endoscopie du fabricant SonoScape Medical Corp. sur le march\u00e9 marocain. [lematin.ma]\n-------------------------------------------------\nIM Alliance devient distributeur agr\u00e9\u00e9 au Maroc des syst\u00e8mes de vid\u00e9o-endoscopie du fabricant SonoScape Medical Corp. Deux fabricants, un distributeur. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le gouvernement pr\u00e9voit d\u2019\u00e9largir le\nservice du Roaming national qui...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement pr\u00e9voit d\u2019\u00e9largir le service du Roaming national qui permet aux abonn\u00e9s des services de t\u00e9l\u00e9phonie mobile l\u2019utilisation du r\u00e9seau d\u2019un autre op\u00e9rateur sans changement de tarif, avec la transition automatique entre les r\u00e9seaux, a indiqu\u00e9, lundi, le ministre de l\u2019Intelligence artificielle, de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Ahmed Rahhou.. [telquel.ma]\n-------------------------------------------------\nLe gouvernement pr\u00e9voit d\u0027\u00e9largir le service du Roaming national qui permet aux abonn\u00e9s des services de t\u00e9l\u00e9phonie mobile l\u0027utilisation du r\u00e9seau d\u0027un autre op\u00e9rateur sans changement de tarif, avec la transition automatique entre les r\u00e9seaux, a indiqu\u00e9, lundi, le ministre de l\u0027Intelligence artificielle, de la transition num\u00e9rique et de la r\u00e9forme de l\u2019administration, Ahmed Rahhou. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le premier contingent de la\nMINURSO a amorc\u00e9 son retrait,...", "mass": 5, "physics": false, "shape": "box", "title": "Le premier contingent de la MINURSO a amorc\u00e9 son retrait, ce lundi \u00e0 La\u00e2youne, marquant ainsi le lancement de la premi\u00e8re phase du processus de retrait de la Mission, \u00e0 la suite de l\u2019expiration de son mandat le 31 octobre 2026, a-t-on constat\u00e9 sur place. [telquel.ma]\n-------------------------------------------------\nLe premier contingent de la MINURSO a amorc\u00e9 son retrait, ce lundi \u00e0 La\u00e2youne, marquant ainsi le lancement de la premi\u00e8re phase du processus de retrait de la Mission, \u00e0 la suite de l\u2019expiration de son mandat le 31 octobre 2026, a-t-on constat\u00e9 sur place. [www.lereporter.ma]\n-------------------------------------------------\nSelon la MAP, cette \u00e9tape intervient dans le prolongement des dispositions prises par les autorit\u00e9s marocaines pour accompagner la cessation des activit\u00e9s de la mission des Nations unies. [lnt.ma]\n-------------------------------------------------\nLe premier contingent de la MINURSO a amorc\u00e9 son retrait, lundi \u00e0 La\u00e2youne, marquant ainsi le lancement de la premi\u00e8re phase du processus de retrait de la Mission, \u00e0 la suite de l\u2019expiration de son mandat le 31 octobr
