1 janvier courant, selon les statistiques de la Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN). [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Selon le journal sportif L\u2019Equipe\nde ce mardi, le milieu...", "mass": 5, "physics": false, "shape": "box", "title": "Selon le journal sportif L\u2019Equipe de ce mardi, le milieu offensif de 32 ans, libre de tout contrat, sera un atout offensif pour le club normand en qu\u00eate de renforts \u00e0 m\u00eame d\u2019animer . [fr.hespress.com]\n-------------------------------------------------\nLibre de tout contrat, Sofiane Boufal sera un atout offensif pour le club normand en qu\u00eate de renforts \u00e0 m\u00eame d\u0027animer ses couloirs et de renforcer son attaque, indique le quot. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "R\u00e9pondant \u00e0 des questions orales\nsur l\u0027inscription sur les listes...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9pondant \u00e0 des questions orales sur l\u0027inscription sur les listes \u00e9lectorales, Abdelouafi Laftit a fait savoir que le taux d\u0027inscription est de 54% pour les hom. [lematin.ma]\n-------------------------------------------------\nLe nombre total provisoire des citoyens inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales \u00e0 l\u0027\u00e9chelle nationale a atteint pr\u00e8s de 16,5 millions, au cours de la phase actuelle de l\u0027op\u00e9ration de r\u00e9vision annuelle desdites listes, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u0027Int\u00e9rieur, Abdelouafi Laftit. [www.lopinion.ma]\n-------------------------------------------------\nAbdelouafi Laftit, ministre de l\u2019Int\u00e9rieur, a r\u00e9v\u00e9l\u00e9 ce mardi, lors de la s\u00e9ance des questions orales \u00e0 la Conseil des conseillers, que le bilan de l\u2019op\u00e9ration de r\u00e9vision annuelle ordinaire des listes \u00e9lectorales g\u00e9n\u00e9rales a abouti, \u00e0 ce stade, \u00e0 l\u2019inscription de 382.170 nouveaux \u00e9lecteurs, contre la radiation de 1,4 million de cas pour des. [telquel.ma]\n-------------------------------------------------\nLe nombre total provisoire des citoyens inscrits sur les listes \u00e9lectorales g\u00e9n\u00e9rales \u00e0 l\u2019\u00e9chelle nationale a atteint pr\u00e8s de 16,5 millions, au cours de la phase actuelle de l\u2019op\u00e9ration de r\u00e9vision annuelle desdites listes, a indiqu\u00e9, mardi \u00e0 la Chambre des conseillers, le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Initi\u00e9 par l\u2019EMA en partenariat\navec Safran et l\u2019Institut des...", "mass": 5, "physics": false, "shape": "box", "title": "Initi\u00e9 par l\u2019EMA en partenariat avec Safran et l\u2019Institut des M\u00e9tiers de l\u2019A\u00e9ronautique (IMA), ce programme vise \u00e0 former et accompagner 130 jeunes par an, afin de leur permettre d. [lematin.ma]\n-------------------------------------------------\nL\u2019association Enfance Maghreb Avenir (EMA) a proc\u00e9d\u00e9, mardi \u00e0 Nouaceur, au lancement du programme AeroChance, une initiative destin\u00e9e \u00e0 accompagner l\u2019insertion professionnelle de jeunes marocains \u00e2g\u00e9s de 18 \u00e0 30 ans, avec ou sans dipl\u00f4me, dans le secteur de l\u2019a\u00e9ronautique. [telquel.ma]\n-------------------------------------------------\nUn nouveau dispositif d\u2019accompagnement \u00e0 l\u2019emploi destin\u00e9 aux jeunes vient d\u2019\u00eatre lanc\u00e9 \u00e0 Nouaceur avec le programme \u00ab AeroChance \u00bb, port\u00e9 par l\u2019association Enfance Maghreb Avenir en partenariat avec le groupe Safran et l\u2019Institut des M\u00e9tiers de l\u2019A\u00e9ronautique. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "\u00c9labor\u00e9e avec Accenture, cette cinqui\u00e8me\n\u00e9dition met en lumi\u00e8re un...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c9labor\u00e9e avec Accenture, cette cinqui\u00e8me \u00e9dition met en lumi\u00e8re un paysage des cyberrisques en profonde mutation, marqu\u00e9 par l\u2019essor de l\u2019intelligence artificielle (IA). [lematin.ma]\n-------------------------------------------------\nLa cyberfraude s\u2019impose d\u00e9sormais comme l\u2019une des menaces mondiales les plus r\u00e9pandues, devant les ran\u00e7ongiciels, selon le dernier rapport Global Cybersecurity Outlook 2026 du Forum \u00e9conomique mondial (WEF), publi\u00e9 \u00e0 Gen\u00e8ve. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Selon l\u0027analyse de conjoncture de\nla croissance \u00e9conomique effectu\u00e9e par...", "mass": 5, "physics": false, "shape": "box", "title": "Selon l\u0027analyse de conjoncture de la croissance \u00e9conomique effectu\u00e9e par le Haut-Commissariat au Plan, l\u2019\u00e9conomie marocaine devrait enregistrer une l\u00e9g\u00e8re acc\u00e9l\u00e9ration de son r. [lematin.ma]\n-------------------------------------------------\nCette l\u00e9g\u00e8re acc\u00e9l\u00e9ration serait, essentiellement, le fait des activit\u00e9s agricoles et tertiaires, avec une contribution \u00e0 la croissance \u00e9conomique globale qui s\u2019\u00e9l\u00e8verait \u00e0 +2,9 points, explique le HCP dans un. [telquel.ma]\n-------------------------------------------------\nLa croissance \u00e9conomique nationale devrait atteindre 4,2% au premier trimestre 2026 en rythme annuel, apr\u00e8s 4% au trimestre pr\u00e9c\u00e9dent, pr\u00e9voit le Haut-Commissariat au Plan (HCP). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le chiffre d\u2019affaires (CA) des\nneuf soci\u00e9t\u00e9s de distribution en...", "mass": 5, "physics": false, "shape": "box", "title": "Le chiffre d\u2019affaires (CA) des neuf soci\u00e9t\u00e9s de distribution en gros du gasoil et d\u2019essence (hors carburant marin) s\u0027est \u00e9tabli \u00e0 18,91 milliards de dirhams (MMDH) au troisi\u00e8me trimestre (T3) 2025, selon le Conseil de la concurrence. [www.lopinion.ma]\n-------------------------------------------------\nLes marges brutes par litre r\u00e9alis\u00e9es par les neuf soci\u00e9t\u00e9s de distribution en gros du gasoil et d\u2019essence concern\u00e9es par le reporting du Conseil de la concurrence ont \u00e9t\u00e9 quasi-stables au titre du troisi\u00e8me trimestre de l\u2019ann\u00e9e 2025. [telquel.ma]\n-------------------------------------------------\nLe chiffre d\u2019affaires (CA) des neuf soci\u00e9t\u00e9s de distribution en gros du gasoil et d\u2019essence (hors carburant marin) s\u2019est \u00e9tabli \u00e0 18,91 milliards de dirhams (MMDH) au troisi\u00e8me trimestre (T3) 2025, selon le Conseil de la concurrence. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Les pertes \u00e9conomiques mondiales caus\u00e9es\npar les catastrophes naturelles se...", "mass": 5, "physics": false, "shape": "box", "title": "Les pertes \u00e9conomiques mondiales caus\u00e9es par les catastrophes naturelles se sont \u00e9lev\u00e9es \u00e0 224 milliards de dollars en 2025, contre 368 milliards en 2024, selon le r\u00e9assureur allemand Munich Re. [www.lopinion.ma]\n-------------------------------------------------\nLes pertes \u00e9conomiques mondiales caus\u00e9es par les catastrophes naturelles se sont \u00e9lev\u00e9es \u00e0 224 milliards de dollars en 2025, contre 368 milliards en 2024, selon le r\u00e9assureur allemand Munich Re. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "La Chambre des repr\u00e9sentants a\nadopt\u00e9, mardi \u00e0 la majorit\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u0027Assurance-maladie obligatoire de base (AMO) ainsi que d\u0027autres dispositions sp\u00e9cifiques. [www.lopinion.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u2019Assurance-maladie obligatoire de base (AMO) ainsi que d\u2019autres dispositions sp\u00e9cifiques. [aujourdhui.ma]\n-------------------------------------------------\nCe texte pr\u00e9voit de confier la gestion du r\u00e9gime de l\u0027AMO de base pour le secteur public \u00e0 un seul organisme, \u00e0 savoir la Caisse Nationale de S\u00e9curit\u00e9 Sociale. [www.lavieeco.com]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a adopt\u00e9, mardi \u00e0 la majorit\u00e9, le projet de loi n\u00b054.23 modifiant et compl\u00e9tant la loi n\u00b0 65.00 relative \u00e0 l\u0027Assurance-maladie obligatoire de base. [lematin.ma]\n-------------------------------------------------\nLa Chambre des repr\u00e9sentants a approuv\u00e9 \u00e0 la majorit\u00e9, mardi, le projet de loi n\u00b0 58.25 relatif \u00e0 la proc\u00e9dure civile, apr\u00e8s la prise en compte des effets juridiques d\u00e9coulant de la d\u00e9cision de la Cour constitutionnelle rendue le 4 ao\u00fbt dernier. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "Les ressources financi\u00e8res allou\u00e9es aux\ncollectivit\u00e9s territoriales \u00e0 partir du...", "mass": 5, "physics": false, "shape": "box", "title": "Les ressources financi\u00e8res allou\u00e9es aux collectivit\u00e9s territoriales \u00e0 partir du produit de la taxe sur la valeur ajout\u00e9e (TVA) ont connu, en 2025, une progression comprise entre 10 et 15 %, selon les sp\u00e9cificit\u00e9s propres \u00e0 chaque collectivit\u00e9. [www.lopinion.ma]\n-------------------------------------------------\nLes parts globales des collectivit\u00e9s territoriales dans le produit de la taxe sur la valeur ajout\u00e9e (TVA) en 2025 ont enregistr\u00e9 une hausse de 10 \u00e0 15% selon les sp\u00e9cificit\u00e9s de chaque collectivit\u00e9, a indiqu\u00e9 mardi \u00e0 Rabat le ministre de l\u2019Int\u00e9rieur, Abdelouafi Laftit. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "S\u2019exprimant en conf\u00e9rence de presse\nd\u2019avant-match, le coach a soulign\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "S\u2019exprimant en conf\u00e9rence de presse d\u2019avant-match, le coach a soulign\u00e9 que \u00ab \u00e7a fait longtemps que le Maroc n\u2019a pas \u00e9t\u00e9 en demi-finale de la CAN \u00bb, pr\u00e9cisant que \u00ab nous allons jouer contre une. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui a affirm\u00e9 que le match du dernier carr\u00e9 de la CAN-2025 contre le Nigeria sera \u00ab une finale avant l\u2019heure \u00bb, estimant que \u00ab \u00e7a sera [www.challenge.ma]\n-------------------------------------------------\nS\u2019exprimant en conf\u00e9rence de presse d\u2019avant-match, le coach a soulign\u00e9 que \u00ab \u00e7a fait longtemps que le Maroc n\u2019a pas \u00e9t\u00e9 en demi-finale de la CAN \u00bb, pr\u00e9cisant que \u00ab nous allons jouer contre une . [maroc-diplomatique.net]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui a affirm\u00e9, mardi \u00e0 Rabat, que le match des demi-finales contre le Nigeria est une finale avant l\u0027heure. [atlasinfo.fr]\n-------------------------------------------------\nS\u2019exprimant en conf\u00e9rence de presse d\u2019avant-match, le coach a soulign\u00e9 que \u00ab \u00e7a fait longtemps que le Maroc n\u2019a pas \u00e9t\u00e9 en demi-finale de la CAN \u00bb, pr\u00e9cisant que \u00ab nous allons jouer contre une . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a d\u00e9sign\u00e9 le Ghan\u00e9en...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9sign\u00e9 le Ghan\u00e9en Daniel Nii Ayi Laryea pour officier le match entre le Maroc et le Nigeria, comptant pour les demi-finales de la Coupe d\u2019Afrique des Nations 2025. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9sign\u00e9 le Ghan\u00e9en Daniel Nii Ayi Laryea pour officier le match entre le Maroc et le Nigeria, comptant pour les demi-finales de la Coupe d\u2019Afrique des Nations-2025. [maroc-diplomatique.net]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a d\u00e9sign\u00e9 le Ghan\u00e9en Daniel Nii Ayi Laryea pour officier le match entre le Maroc et le Nigeria, comptant pour les demi-finales de la Coupe d\u2019Afrique des Nations-2025. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Le Maroc et le Nigeria\ns\u2019appr\u00eatent \u00e0 s\u2019affronter dans un...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et le Nigeria s\u2019appr\u00eatent \u00e0 s\u2019affronter dans un duel au sommet, mercredi au stade Prince Moulay Abdellah de Rabat (21h00), pour le compte des demi-finales de la Coupe d\u2019Afrique des nations (CAN), avec en ligne de mire une qualification \u00e0 la finale de cette prestigieuse comp\u00e9tition continentale et un pas de plus vers. [telquel.ma]\n-------------------------------------------------\nLe Maroc et le Nigeria s\u0027affronteront ce mercredi au stade Prince Moulay Abdellah \u00e0 Rabat pour une place en finale dans un duel intense entre les deux s\u00e9lections pour le compte des demi-finales de la Coupe d\u2019Afrique des nation (CAN). [leseco.ma]\n-------------------------------------------------\nLe Maroc et le Nigeria s\u2019appr\u00eatent \u00e0 s\u2019affronter dans un duel au sommet, mercredi au stade Prince Moulay Abdellah (21h00), pour le compte des demi-finales de la Coupe d\u2019Afrique des nation (CAN), avec en ligne de mire une qualification \u00e0 la finale de cette prestigieuse comp\u00e9tition continentale et un pas de plus vers le sacre [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc, pays h\u00f4te, r\u00eave de d\u00e9crocher un premier titre en Coupe d\u2019Afrique des Nations depuis 1976, en affrontant un Nigeria, en qu\u00eate d\u2019un quatri\u00e8me sacre continental. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "En ex\u00e9cution des instructions royales,\nle ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des instructions royales, le ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, Abdeltif Loudyi, a re\u00e7u, lundi, le sous-secr\u00e9taire adjoint \u00e0 la guerre des \u00c9tats-Unis d\u2019Am\u00e9rique, charg\u00e9 des Affaires africaines, Bryan J. Ellis, accompagn\u00e9 d\u2019une d\u00e9l\u00e9gation de haut niveau en visite de travail dans le Royaume du. [telquel.ma]\n-------------------------------------------------\nUne visite officielle \u00e0 forte port\u00e9e strat\u00e9gique s\u2019ouvre avec l\u2019arriv\u00e9e du ministre pakistanais de la D\u00e9fense, illustrant la volont\u00e9 du Maroc et du Pakistan de franchir un nouveau palier dans leur coop\u00e9ration bilat\u00e9rale. [maroc-diplomatique.net]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, le ministre D\u00e9l\u00e9gu\u00e9 aupr\u00e8s du Chef du gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense Nationale, Abdeltif Loudyi a re\u00e7u, mardi, le ministre f\u00e9d\u00e9ral de la D\u00e9fense de la R\u00e9publique Islamique du Pakistan, Muhammad Asif Khawaja, accompagn\u00e9 d\u2019une d\u00e9l\u00e9gation de haut niveau en visite de travail au Royaume du Maroc. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les perturbations m\u00e9t\u00e9orologiques ayant touch\u00e9\nle Maroc entre le 12...", "mass": 5, "physics": false, "shape": "box", "title": "Les perturbations m\u00e9t\u00e9orologiques ayant touch\u00e9 le Maroc entre le 12 d\u00e9cembre dernier et le 7 janvier ont caus\u00e9 des interruptions de la circulation sur plus de 165 tron\u00e7ons routiers nationaux, r\u00e9gionaux et provinciaux, a indiqu\u00e9, lundi, le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka. [telquel.ma]\n-------------------------------------------------\nLe Maroc est sorti d\u2019une s\u00e9cheresse de sept ans \u00e0 la faveur des derni\u00e8res pr\u00e9cipitations et des chutes de neige ayant augment\u00e9 les apports en eau et les taux de remplissage des barrages, a indiqu\u00e9 lundi \u00e0 Rabat, le ministre de l\u2019Equipement et de l\u2019Eau, Nizar Baraka. [www.lereporter.ma]\n-------------------------------------------------\nLe Maroc a d\u00e9pass\u00e9 le cycle prolong\u00e9 de s\u00e9cheresse qui a marqu\u00e9 les sept derni\u00e8res ann\u00e9es, \u00e0 la faveur des importantes pr\u00e9cipitations enregistr\u00e9es depuis le d\u00e9but de la saison hydrologique et des chutes de neige sur les reliefs du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Quelque 382.176 familles ont b\u00e9n\u00e9fici\u00e9\ndu programme \u00ab Villes sans...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 382.176 familles ont b\u00e9n\u00e9fici\u00e9 du programme \u00ab Villes sans bidonvilles \u00bb au 31 d\u00e9cembre 2025, a indiqu\u00e9, lundi \u00e0 Rabat, le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Habitat, Adib Benbrahim. [telquel.ma]\n-------------------------------------------------\nLe programme national \u00ab Villes sans bidonvilles \u00bb poursuit son d\u00e9ploiement \u00e0 l\u2019\u00e9chelle du Royaume, avec plus de 382.000 familles ayant b\u00e9n\u00e9fici\u00e9 des diff\u00e9rentes mesures de r\u00e9sorption de l\u2019habitat insalubre \u00e0 fin d\u00e9cembre 2025, a indiqu\u00e9 le secr\u00e9taire d\u2019\u00c9tat charg\u00e9 de l\u2019Habitat, Adib Benbrahim, lors d\u2019une s\u00e9ance de questions orales \u00e0 la Chambre des repr\u00e9sentants . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La ministre de la Solidarit\u00e9,\nde l\u2019Insertion sociale et de...", "mass": 5, "physics": false, "shape": "box", "title": "La ministre de la Solidarit\u00e9, de     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
