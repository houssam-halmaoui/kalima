": "\u00c9changes en yuan : Attijariwafa bank se connecte au syst\u00e8me chinois CIPS\nSource: leseco.ma", "url": "https://leseco.ma/business/echanges-en-yuan-attijariwafa-bank-se-connecte-au-systeme-chinois-cips.html", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 2, "id": 242, "label": "CAN 2025 : le TAS...", "shape": "dot", "size": 71, "title": "CAN 2025 : le TAS rendra son verdict fin novembre\nSource: leseco.ma", "url": "https://leseco.ma/sports/can-2025-le-tas-rendra-son-verdict-fin-novembre.html", "x": 0, "y": 0}, {"font": {"vadjust": -106.5}, "group": 0, "id": 247, "label": "CAN Futsal 2026 | Le...", "shape": "dot", "size": 71, "title": "CAN Futsal 2026 | Le Maroc \u00e9crase l\u2019\u00c9gypte sur le score de 6-0 et file en finale\nSource: www.lereporter.ma", "url": "https://www.lereporter.ma/can-futsal-2026-le-maroc-ecrase-legypte-sur-le-score-de-6-0-et-file-en-finale/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le s\u00e9lectionneur national de futsal,\nHicham Dguig, a soulign\u00e9, lundi...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national de futsal, Hicham Dguig, a soulign\u00e9, lundi \u00e0 Rabat, l\u2019importance de se concentrer pleinement sur la finale de la Coupe d\u2019Afrique des Nations (CAN) Maroc-2026 face \u00e0 l\u2019Angola, apr\u00e8s la large victoire du Maroc contre l\u2019\u00c9gypte (6-0) en demi-finale. \u00ab [fr.hespress.com]\n-------------------------------------------------\nApr\u00e8s un parcours sans faute lors de la phase de groupes, les Lions de l\u0027Atlas de futsal joueront, ce lundi \u00e0 Rabat, leur place en finale de la Coupe d\u2019Afrique des Nations face. [lematin.ma]\n-------------------------------------------------\nL\u00e9quipe nationale marocaine de futsal a d\u00e9croch\u00e9 sa place en finale de la Coupe dAfrique des nations (Maroc 2026) en infligeant un s\u00e9ance pl\u00e9ni\u00e8re commune. [leseco.ma]\n-------------------------------------------------\nLa nomination, vendredi, des 32 membres du gouvernement conduit par Fatima Ezzahra El Mansouri met fin \u00e0 la phase des n\u00e9gociations autour du nouvel Ex\u00e9cutif et ouvre celle de l\u2019action. [leseco.ma]\n-------------------------------------------------\nLe Sahara marocain demeure au premier rang des causes nationales, a affirm\u00e9, lundi \u00e0 Rabat, la Cheffe du gouvernement Mme Fatema Ezzahra El Mansouri, soulignant que l\u2019Ex\u00e9cutif continuera \u00e0 d\u00e9fendre la souverainet\u00e9, l\u2019int\u00e9grit\u00e9 territoriale et les int\u00e9r\u00eats du Royaume. [www.lereporter.ma]\n-------------------------------------------------\nPouvoir d\u2019achat, emploi des jeunes, protection sociale, lutte contre la corruption, r\u00e9forme de l\u2019\u00e9ducation, logement et souverainet\u00e9 strat\u00e9gique figurent parmi les principales priorit\u00e9s annonc\u00e9es. [lnt.ma]\n-------------------------------------------------\nLa cheffe du gouvernement, Fatima Ezzahra El Mansouri, a pr\u00e9sent\u00e9 lundi devant les deux Chambres du Parlement les grandes orientations du programme gouvernemental pour la p\u00e9riode 2027/31. [fr.hespress.com]\n-------------------------------------------------\nS\u2019exprimant lors d\u2019une s\u00e9ance pl\u00e9ni\u00e8re commune des deux chambres du Parlement consacr\u00e9e \u00e0 la pr\u00e9sentation du programme gouvernemental, Mme El Mansouri a affirm\u00e9 que la modernisation du syst\u00e8me national d\u2019\u00e9ducation, d\u2019enseignement sup\u00e9rieur,. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Le Tribunal arbitral du sport\n(TAS) a apport\u00e9, lundi, de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Tribunal arbitral du sport (TAS) a apport\u00e9, lundi, de nouvelles pr                             if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
    </body>
