le minist\u00e8re de l\u2019Am\u00e9nagement du...", "mass": 5, "physics": false, "shape": "box", "title": "Selon les donn\u00e9es publi\u00e9es par le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville, les ventes de ciments au titre du. [lematin.ma]\n-------------------------------------------------\nLes livraisons de ciment ont enregistr\u00e9 une hausse de 4,53% en octobre 2026, atteignant 1.585.135 tonnes, contre 1.516.473 t durant le m\u00eame mois de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les donn\u00e9es publi\u00e9es par le minist\u00e8re de l\u2019Am\u00e9nagement du territoire national, de l\u2019Urbanisme, de l\u2019Habitat et de la Politique de la ville. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La Direction g\u00e9n\u00e9rale de la\ns\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN) a annonc\u00e9 la cr\u00e9ation, au sein de son si\u00e8ge central, d\u2019un nouveau service charg\u00e9 de la gestion de la salle centrale des grands \u00e9. [lematin.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN) a proc\u00e9d\u00e9 \u00e0 la cr\u00e9ation d\u2019une nouvelle structure s\u00e9curitaire au sein de son si\u00e8ge central : un service d\u00e9di\u00e9 \u00e0 la gestion de la salle centrale pour les grands \u00e9v\u00e9nements et les crises. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le gouvernement a d\u00e9cid\u00e9 de\npoursuivre l\u2019octroi du soutien exceptionnel...", "mass": 5, "physics": false, "shape": "box", "title": "Le gouvernement a d\u00e9cid\u00e9 de poursuivre l\u2019octroi du soutien exceptionnel et direct destin\u00e9 aux professionnels du transport routier des personnes et des marchandises, \u00e0 travers le lancement d\u2019une nouvelle tranche suppl\u00e9mentaire couvrant une p\u00e9riode de 15 jours. [telquel.ma]\n-------------------------------------------------\nLe gouvernement marocain a d\u00e9cid\u00e9, le 2 novembre \u00e0 Rabat, de reconduire le soutien exceptionnel et direct accord\u00e9 aux professionnels du transport routier de voyageurs et de marchandises, \u00e0 travers une nouvelle tranche couvrant 15 jours, afin de limiter l\u2019impact de la hausse persistante des produits p\u00e9troliers. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Marchica Med, filiale de l\u2019Agence\npour l\u2019am\u00e9nagement du site de...", "mass": 5, "physics": false, "shape": "box", "title": "Marchica Med, filiale de l\u2019Agence pour l\u2019am\u00e9nagement du site de la lagune de Marchica, a annonc\u00e9 le lancement prochain des travaux de construction d\u2019un complexe h\u00f4telier haut de gamme s\u2019inscrivant pleinement dans la dynamique d\u2019essor touristique et \u00e9conomique de la province de Nador. [telquel.ma]\n-------------------------------------------------\nLa filiale Marchica Med de lAgence pour lam\u00e9nagement du site de la lagune de Marchica a annonc\u00e9, le 2 novembre 2026 \u00e0 Nador, le lancement dun complexe h\u00f4telier prestigieux sur le site de la lagune. [www.yabiladi.com]\n-------------------------------------------------\nRepr\u00e9sentant un investissement global estim\u00e9 \u00e0 plus de 585 millions de dirhams (MDH) incluant le foncier, le projet, dont la mise en exploitation est pr\u00e9vue en 2029, devrait contribuer de mani\u00e8re significative au rayonnement national et international croissant de Nador et \u00e0 l\u0027\u00e9conomie locale et r\u00e9gionale. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le ministre de l\u2019\u00c9quipement, de\nl\u2019Eau et des For\u00eats, Nizar...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9quipement, de l\u2019Eau et des For\u00eats, Nizar Baraka, a affirm\u00e9, lundi \u00e0 Rabat, que son d\u00e9partement a lanc\u00e9 une nouvelle strat\u00e9gie en mati\u00e8re de s\u00e9curit\u00e9 hydrique, qui prend en consid\u00e9ration les grandes mutations li\u00e9es aux changements climatiques. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement, de l\u2019Eau et des For\u00eats, Nizar Baraka, a affirm\u00e9, lundi \u00e0 Rabat, que son d\u00e9partement a lanc\u00e9 une nouvelle strat\u00e9gie en mati\u00e8re de s\u00e9curit\u00e9 hydrique, qui prend en consid\u00e9ration les grandes mutations li\u00e9es aux changements climatiques. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement, de l\u2019Eau et des For\u00eats a pr\u00e9sent\u00e9 lundi devant la Chambre des repr\u00e9sentants les grandes lignes d\u2019un plan de pr\u00e9vention des inondations reposant sur cinq piliers, qui vise \u00e0 porter la capacit\u00e9 nationale de stockage \u00e0 27 milliards de m\u00e8tres cubes d\u2019ici 2031. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Le taux de ch\u00f4mage strict\nest pass\u00e9, entre le deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le taux de ch\u00f4mage strict est pass\u00e9, entre le deuxi\u00e8me et le troisi\u00e8me trimestre 2026, de 9,5% \u00e0 10,5% au niveau national, ressort-il de la r\u00e9cente note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 la situation du march\u00e9 du travail. [telquel.ma]\n-------------------------------------------------\nLa main-d\u2019\u0153uvre au Maroc s\u2019est \u00e9tablie \u00e0 11,694 millions de personnes au troisi\u00e8me trimestre 2026, en baisse de 70.000 personnes par rapport au trimestre pr\u00e9c\u00e9dent, selon le Haut-Commissariat au plan. [www.lavieeco.com]\n-------------------------------------------------\nLe taux de ch\u00f4mage strict est pass\u00e9, entre le deuxi\u00e8me et le troisi\u00e8me trimestre 2026, de 9,5% \u00e0 10,5% au niveau national, ressort-il de la r\u00e9cente note d\u2019information du Haut-Commissariat au Plan (HCP) relative \u00e0 la situation du march\u00e9 du travail. [maroc-diplomatique.net]\n-------------------------------------------------\nL\u2019emploi au Maroc a recul\u00e9 de 1,6 % au troisi\u00e8me trimestre 2026 par rapport au trimestre pr\u00e9c\u00e9dent, soit une baisse nette de 173 000 personnes, selon une note r\u00e9cente du Haut-Commissariat au Plan (HCP). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Le club explique, dans un\ncommuniqu\u00e9, que cette d\u00e9cision intervient...", "mass": 5, "physics": false, "shape": "box", "title": "Le club explique, dans un communiqu\u00e9, que cette d\u00e9cision intervient \u00e0 l\u2019issue d\u2019une \u00e9valuation globale de la situation sportive de l\u2019\u00e9quipe, les r\u00e9sultats obtenus, la qualit\u00e9 du jeu ainsi. [telquel.ma]\n-------------------------------------------------\nLe Raja Club Athletic (RCA) a annonc\u00e9, lundi 2 novembre 2026 \u00e0 Casablanca, la r\u00e9siliation du contrat de lentra\u00eeneur espagnol Paco J\u00e9mez, responsable de l\u00e9quipe premi\u00e8re de football, apr\u00e8s une analyse approfondie de la situation sportive du club, rapporte la MAP. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le veto russe au projet\nam\u00e9ricain et l\u2019\u00e9chec du contre-projet...", "mass": 5, "physics": false, "shape": "box", "title": "Le veto russe au projet am\u00e9ricain et l\u2019\u00e9chec du contre-projet de Moscou ont r\u00e9v\u00e9l\u00e9 les limites d\u2019un processus onusien soumis aux rivalit\u00e9s des grandes puissances. [telquel.ma]\n-------------------------------------------------\nLe veto oppos\u00e9 vendredi par Moscou au projet am\u00e9ricain, suivi de l\u2019\u00e9chec de la contre-proposition russe, laisse la MINURSO sans nouveau mandat, une premi\u00e8re depuis sa cr\u00e9ation, en 1991. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Elle proposera une s\u00e9lection de\n76 films en provenance de...", "mass": 5, "physics": false, "shape": "box", "title": "Elle proposera une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis entre la comp\u00e9tition officielle, les s\u00e9ances de gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances jeune public \u0026. [telquel.ma]\n-------------------------------------------------\nAu total, 76 films venus de 39 pays seront pr\u00e9sent\u00e9s dans les diff\u00e9rentes sections, dont 10 en premi\u00e8re mondiale. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 l\u2019occasion de sa 23e \u00e9dition qui se d\u00e9roulera du 20 au 28 novembre 2026, le Festival International du Film de Marrakech c\u00e9l\u00e8brera les cin\u00e9mas du monde \u00e0 travers une s\u00e9lection de 76 films en provenance de 39 pays, r\u00e9partis en plusieurs sections : la Comp\u00e9tition officielle, les s\u00e9ances de Gala, la section Horizons, le 11e Continent, le Panorama du cin\u00e9ma marocain, les s\u00e9ances Jeune public \u0026 familles et les films projet\u00e9s dans le cadre des hommages. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le ministre de l\u2019\u00c9ducation nationale,\ndu Pr\u00e9scolaire, de la Formation...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, Nabil Benabdellah, a re\u00e7u lundi \u00e0 Rabat Khadija Boumlik, \u00e9l\u00e8ve distingu\u00e9e, class\u00e9e quatri\u00e8me au concours D\u00e9fi de la lecture arabe. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, Mohamed Nabil Benabdellah, a annonc\u00e9 ce mardi 3 novembre 2026 une nouvelle r\u00e9vision du plafond d\u2019\u00e2ge requis pour se pr\u00e9senter aux concours de recrutement de l\u2019enseignement, fixant d\u00e9sormais la limite maximale \u00e0 40 ans, apr\u00e8s avoir \u00e9t\u00e9 \u00e9tablie \u00e0 35 . [fr.hespress.com]\n-------------------------------------------------\nMohamed Nabil Benabdellah, ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire, de la Formation professionnelle et de la Qualification, a annonc\u00e9, ce mardi, une initiative visant \u00e0 porter de 35 \u00e0 40 ans l\u2019\u00e2ge limite pour se pr\u00e9senter aux concours d\u2019acc\u00e8s au m\u00e9tier d\u2019enseignant. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "R\u00e9alis\u00e9 par Abderrahim Mettour et\nproduit par Dounia Benjelloun Mezian,...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9alis\u00e9 par Abderrahim Mettour et produit par Dounia Benjelloun Mezian, ce documentaire de 52 minutes met en lumi\u00e8re les femmes et les hommes qui ont donn\u00e9 corps au projet. [www.lavieeco.com]\n-------------------------------------------------\nPr\u00e9sent\u00e9 en avant-premi\u00e8re ce lundi \u00e0 Casablanca, \u00ab La Tour Mohammed VI : L\u2019H\u00e9ritage du Futur \u00bb revient sur l\u2019aventure humaine et technologique qui a accompagn\u00e9 la r\u00e9alisation de cet \u00e9difice de 250 m\u00e8tres, depuis la pose de [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le groupe minier a sollicit\u00e9\nla suspension de la cotation...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe minier a sollicit\u00e9 la suspension de la cotation de son titre depuis le 30 octobre dernier suite \u00e0 sa r\u00e9servation \u00e0 la baisse de 10% cons\u00e9cutivement au changement des r\u00e8gles de pond\u00e9ration par la Bourse de Casablanca. [www.lavieeco.com]\n-------------------------------------------------\n\u00c0 la suite de la modification de la composition de l\u2019indice MASI, des informations non confirm\u00e9es ont commenc\u00e9 \u00e0 circuler sur le march\u00e9 au sujet du titre Managem. [leseco.ma]\n-------------------------------------------------\nManagem a demand\u00e9 la reprise de la cotation de son titre \u00e0 compter de ce mardi 3 novembre, d\u00e8s l\u2019ouverture de la s\u00e9ance, apr\u00e8s une suspension intervenue le 30 octobre. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La cheffe du gouvernement, Fatima\nZahra El Mansouri, a pr\u00e9sid\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "La cheffe du gouvernement, Fatima Zahra El Mansouri, a pr\u00e9sid\u00e9, mardi 3 novembre 2026 \u00e0 Rabat, une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique. [lematin.ma]\n-------------------------------------------------\nFatima Ezzahra El Mansouri a indiqu\u00e9, ce mardi 3 novembre dans un communiqu\u00e9 publi\u00e9 sur ses r\u00e9seaux sociaux, avoir pr\u00e9sid\u00e9 \u00e0 Rabat une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen des derni\u00e8res \u00e9volutions de la situation \u00e9conomique nationale, au suivi du pouvoir d\u2019achat des citoyennes et des citoyens, ainsi qu\u2019\u00e0 l\u2019\u00e9tude de l\u2019impact des fluctuations des prix sur. [telquel.ma]\n-------------------------------------------------\nLa Premi\u00e8re ministre Fatima Zahra Mansouri a pr\u00e9sid\u00e9, mardi \u00e0 Rabat, une r\u00e9union ax\u00e9e sur les r\u00e9cents d\u00e9veloppements de l\u2019\u00e9conomie nationale, le suivi du pouvoir d\u2019achat des citoyens et l\u2019impact des fluctuations des prix sur le march\u00e9 int\u00e9rieur, ainsi que sur la vie quotidienne des Marocains, selon un communiqu\u00e9 de la Primature. [www.yabiladi.com]\n-------------------------------------------------\nR\u00e9uni ce mardi 3 novembre \u00e0 Rabat sous la pr\u00e9sidence de Fatima Zahra El Mansouri, le gouvernement a d\u00e9cid\u00e9 de mettre en place une commission interminist\u00e9rielle charg\u00e9e de suivre les fluctuations des prix et de prendre les mesures n\u00e9cessaires pour prot\u00e9ger le pouvoir d\u2019achat. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019Agence nationale des ports (ANP)\net l\u2019Agence fran\u00e7aise de d\u00e9veloppement...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Agence nationale des ports (ANP) et l\u2019Agence fran\u00e7aise de d\u00e9veloppement (AFD) ont sign\u00e9, mardi \u00e0 Rabat, une d\u00e9claration conjointe relative au troisi\u00e8me financement du partenariat ANP-AFD, d\u2019un montant global de 100 millions d\u2019euros, d\u00e9di\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [telquel.ma]\n-------------------------------------------------\nL\u0027Agence nationale des ports et l\u0027Agence fran\u00e7aise de d\u00e9veloppement ont sign\u00e9 une d\u00e9claration conjointe relative au troisi\u00e8me financement de leur partenariat strat\u00e9gique, destin\u00e9 au d\u00e9veloppement des provinces du Sud et des ports verts. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Air Force, aux c\u00f4t\u00e9s de\nd\u00e9l\u00e9gations de 18 pays alli\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Air Force, aux c\u00f4t\u00e9s de d\u00e9l\u00e9gations de 18 pays alli\u00e9s et partenaires des \u00c9tats-Unis, a annonc\u00e9 lambassade des \u00c9tats-Unis au Maroc dans un tweet publi\u00e9 mardi 3 novembre. [www.yabiladi.com]\n-------------------------------------------------\nLes Forces Royales Air (FRA) ont particip\u00e9 \u00e0 la Semaine internationale 2026 de l\u2019Acad\u00e9mie de l\u2019US Air Force, organis\u00e9e aux \u00c9tats-Unis, aux c\u00f4t\u00e9s de repr\u00e9sentants de 18 pays alli\u00e9s et partenaires de [.] [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019Office national marocain du tourisme\n(ONMT) est pr\u00e9sent au World...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Office national marocain du tourisme (ONMT) est pr\u00e9sent au World Travel Market de Londres du 3 au 5 novembre, accompagn\u00e9 de 47 co-exposants et de huit conseils r\u00e9gionaux du tourisme. [www.yabiladi.com]\n-------------------------------------------------\nPr\u00e9sent du 3 au 5 novembre au World Travel Market, l\u0027Office national marocain du tourisme mobilise 47 co-exposants et huit Conseils r\u00e9gionaux du tourisme. [www.lavieeco.com]"}]);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
