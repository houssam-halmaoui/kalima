": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale, le 12 d\u00e9cembre prochain. [lematin.ma]\n-------------------------------------------------\nLe Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale, le 12 d\u00e9cembre prochain, \u00e0 l\u2019issue de sa r\u00e9union pr\u00e9sid\u00e9e par Fouzi Lekjaa. [telquel.ma]\n-------------------------------------------------\nLe Comit\u00e9 directeur de la F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, ce lundi, la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance le 12 d\u00e9cembre prochain. [www.lavieeco.com]\n-------------------------------------------------\nR\u00e9uni lundi sous la pr\u00e9sidence de Fouzi Lekjaa, son Comit\u00e9 directeur a fix\u00e9 au 12 d\u00e9cembre prochain la tenue de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale \u00e9lective de l\u2019instance f\u00e9d\u00e9rale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le projet d\u2019hydrog\u00e8ne vert et\nde production d\u2019ammoniac renouvelable port\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Le projet d\u2019hydrog\u00e8ne vert et de production d\u2019ammoniac renouvelable port\u00e9 par Sahamco Holding BV dans la r\u00e9gion de Dakhla entre dans une nouvelle \u00e9tape dans sa maturation technique. [lematin.ma]\n-------------------------------------------------\nLe projet d\u2019hydrog\u00e8ne vert et d\u2019ammoniac port\u00e9 par Sahamco Holding BV \u00e0 Dakhla franchit une nouvelle \u00e9tape avec l\u2019ach\u00e8vement des \u00e9tudes de pr\u00e9faisabilit\u00e9 avanc\u00e9e (Pr\u00e9-FEED) de sa premi\u00e8re phase. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019athl\u00e8te marocaine Khadija El Mostaqim\na remport\u00e9, lundi, la m\u00e9daille...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019athl\u00e8te marocaine Khadija El Mostaqim a remport\u00e9, lundi, la m\u00e9daille de bronze de l\u2019\u00e9preuve f\u00e9minine du 800 m\u00e8tres des Jeux olympiques de la jeunesse (JOJ) Dakar 2026, en r\u00e9alisant un chrono de 2 min 10 sec 05/100. [telquel.ma]\n-------------------------------------------------\nJOJ Dakar 2026 : Khadija El Mostaqim d\u00e9croche le bronze sur 800 m. Lundi \u00e0 Dakar, la Marocaine Khadija El Mostaqim a d\u00e9croch\u00e9 la m\u00e9daille de bronze du 800 m f\u00e9minin lors des Jeux olympiques de la jeunesse 2026, avec un chrono de 2 min 10 sec 05. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le renforcement de la coop\u00e9ration\ndans le secteur du tourisme...", "mass": 5, "physics": false, "shape": "box", "title": "Le renforcement de la coop\u00e9ration dans le secteur du tourisme a \u00e9t\u00e9 au centre d\u2019entretiens, lundi \u00e0 Rabat, entre le ministre du Tourisme, de l\u2019Artisanat et de l\u2019Economie solidaire, Jalal Charaf, et le ministre des Relations ext\u00e9rieures et de la Mobilit\u00e9 humaine de l\u2019\u00c9quateur, Roberto Carlos Kury Pesantes. [telquel.ma]\n-------------------------------------------------\nLa rencontre a r\u00e9uni Jalal Charaf, ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie solidaire, et Roberto Carlos Kury Pesantes, ministre \u00e9quatorien des Relations ext\u00e9rieures et de la Mobilit\u00e9 humaine. [maroc-diplomatique.net]\n-------------------------------------------------\nLe renforcement des relations \u00e9conomiques et commerciales et le d\u00e9veloppement des \u00e9changes bilat\u00e9raux ont \u00e9t\u00e9 au centre des entretiens, lundi \u00e0 Rabat, entre le ministre de l\u2019Industrie, du Commerce, de l\u2019Investissement et de l\u2019Inclusion \u00e9conomique, Ryad Mezzour, et le ministre \u00e9quatorien des Relations ext\u00e9rieures et de la Mobilit\u00e9 humaine, Roberto Carlos Kury Pesantes. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "En ex\u00e9cution des hautes instructions\nroyales, Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "En ex\u00e9cution des hautes instructions royales, Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la cheffe du gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, a re\u00e7u lundi, au si\u00e8ge de cette administration, Amir Baram, directeur g\u00e9n\u00e9ral du minist\u00e8re de la D\u00e9fense isra\u00e9lien, en visite officielle au Maroc \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation. [telquel.ma]\n-------------------------------------------------\nEn ex\u00e9cution des Hautes Instructions Royales, M. Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 aupr\u00e8s de la Cheffe du Gouvernement charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, a re\u00e7u lundi, au si\u00e8ge de cette Administration, M. Amir Baram, Directeur G\u00e9n\u00e9ral du minist\u00e8re de d\u00e9fense isra\u00e9lien, en visite officielle au Maroc \u00e0 la t\u00eate d\u2019une importante d\u00e9l\u00e9gation. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "La ville de Casablanca accueillera,\ndu 21 au 29 novembre...", "mass": 5, "physics": false, "shape": "box", "title": "La ville de Casablanca accueillera, du 21 au 29 novembre courant, la 4\u00e8 \u00e9dition du Salon international du livre enfant et jeunesse (SILEJ 2026), organis\u00e9 sous le th\u00e8me \u00ab Litt\u00e9rature, environnement et r\u00e9cits de la nature \u00bb. [telquel.ma]\n-------------------------------------------------\nCasablanca accueillera, du 21 au 29 novembre, la quatri\u00e8me \u00e9dition du Salon international du livre enfant et jeunesse (SILEJ 2026), un rendez-vous consacr\u00e9 \u00e0 la promotion de la lecture, de la litt\u00e9rature et de la cr\u00e9ation culturelle aupr\u00e8s des enfants et des adolescents. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "La s\u00e9lection marocaine a remport\u00e9,\npour la premi\u00e8re fois de...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9lection marocaine a remport\u00e9, pour la premi\u00e8re fois de son histoire, la Coupe arabe de beach soccer, apr\u00e8s sa victoire face \u00e0 la Mauritanie (6-5), ce lundi, en finale de la comp\u00e9tition organis\u00e9e \u00e0 Port-Sa\u00efd, en \u00c9gypte. [telquel.ma]\n-------------------------------------------------\nTitre La s\u00e9lection marocaine de beach-soccer a remport\u00e9, lundi, la Coupe arabe pour la premi\u00e8re fois de son histoire, apr\u00e8s sa victoire face \u00e0 son homologue mauritanienne sur le score de 6 buts \u00e0 5, en finale de la cinqui\u00e8me \u00e9dition de cette comp\u00e9tition, disput\u00e9e \u00e0 Port-Sa\u00efd, en \u00c9gypte. [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection nationale a d\u00e9croch\u00e9 le titre lundi \u00e0 Port-Sa\u00efd, au terme d\u2019une finale disput\u00e9e face \u00e0 la Mauritanie, conclue sur une victoire marocaine par 6 buts \u00e0 5. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Pour sa 23e \u00e9dition, qui\nse tiendra du 20 au...", "mass": 5, "physics": false, "shape": "box", "title": "Pour sa 23e \u00e9dition, qui se tiendra du 20 au 28 novembre, le Festival international du film de Marrakech invite le public \u00e0 d\u00e9couvrir la part plus personnelle de la cr\u00e9ation \u00e0 travers son programme \u00ab Conversations \u00bb. [telquel.ma]\n-------------------------------------------------\nAutour d\u2019eux, les \u00ab Conversations \u00bb r\u00e9uniront des cin\u00e9astes et com\u00e9diens qui ont fait du septi\u00e8me art autre chose qu\u2019un divertissement, une mani\u00e8re de regarder le monde, et parfois de le d\u00e9fier. [www.lavieeco.com]\n-------------------------------------------------\nLe Festival international du film de Marrakech a d\u00e9voil\u00e9, lundi 9 novembre, les noms des trois artistes qui seront honor\u00e9s lors de sa 23e \u00e9dition. [lnt.ma]\n-------------------------------------------------\nAu-del\u00e0 des films et des tapis rouges, le Festival international du film de Marrakech entend mettre en lumi\u00e8re les parcours, les exp\u00e9riences et les r\u00e9flexions de celles et ceux qui fa\u00e7onnent le septi\u00e8me art. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Cette position a \u00e9t\u00e9 exprim\u00e9e\ndans le communiqu\u00e9 conjoint publi\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "Cette position a \u00e9t\u00e9 exprim\u00e9e dans le communiqu\u00e9 conjoint publi\u00e9 \u00e0 l\u2019issue d\u2019un entretien, lundi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger,. [telquel.ma]\n-------------------------------------------------\nCette position a \u00e9t\u00e9 exprim\u00e9e dans le communiqu\u00e9 conjoint publi\u00e9 \u00e0 l\u2019issue d\u2019un entretien, lundi \u00e0 Rabat, entre le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, [www.lereporter.ma]\n-------------------------------------------------\nLa R\u00e9publique de l\u2019\u00c9quateur a exprim\u00e9, lundi 9 novembre \u00e0 Rabat, son soutien \u00e0 la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le Groupe Addoha annonce avoir\nobtenu l\u2019agr\u00e9ment de la National...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe Addoha annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC) pour participer, en tant que d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels dans le Royaume d\u2019Arabie Saoudite. [telquel.ma]\n-------------------------------------------------\nLe groupe Addoha, cot\u00e9 \u00e0 la Bourse de Casablanca, a annonc\u00e9 le lundi 9 novembre 2026 avoir re\u00e7u lagr\u00e9ment de la National Housing Company (NHC) pour agir comme d\u00e9veloppeur partenaire sur des projets r\u00e9sidentiels en Arabie saoudite. [www.yabiladi.com]\n-------------------------------------------------\nLe groupe Addoha a obtenu l\u0027agr\u00e9ment de la National Housing Company (NHC) pour participer, en qualit\u00e9 de d\u00e9veloppeur partenaire, \u00e0 des projets r\u00e9sidentiels en Arabie saoudite. [www.lavieeco.com]\n-------------------------------------------------\nDans un communiqu\u00e9 publi\u00e9 sur le site de l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC), la soci\u00e9t\u00e9 annonce avoir obtenu l\u2019agr\u00e9ment de la National Housing Company (NHC), organisme saoudien sp\u00e9cialis\u00e9 dans                                 scrollButtons.appendChild(scrollUp);

                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
