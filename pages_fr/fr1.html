et\nserein demeure la voie \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Un dialogue \u201couvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re\u201d, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami, \u00e0 la suite de l\u2019adoption, jeudi 17 septembre par le Parlement europ\u00e9en, d\u2019une. [telquel.ma]\n-------------------------------------------------\nApr\u00e8s le vote du Parlement europ\u00e9en sur les \u00e9v\u00e9nements de Sebta, l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, a soulign\u00e9 que le texte ne comporte \u00abaucune incrimination ou injonction\u00bb \u00e0 l\u2019encontre du Maroc et appelle \u00e0 privil\u00e9gier le dialogue pour traiter les enjeux migratoires. [www.lavieeco.com]\n-------------------------------------------------\nApr\u00e8s l\u0027adoption jeudi par le Parlement europ\u00e9en d\u0027une r\u00e9solution sur les \u00e9v\u00e9nements survenus fin juillet \u00e0 Sebta, l\u0027ambassadeur du Maroc aupr\u00e8s de l\u0027Union europ\u00e9enne et de l\u0027OTAN, Ahmed Reda Chami, a plaid\u00e9 pour un dialogue franc et responsable, affirmant que le texte ne comporte aucune incrimination contre le Royaume. [atlasinfo.fr]\n-------------------------------------------------\nUn dialogue ouvert, franc et serein demeure la voie \u00e0 privil\u00e9gier pour relever les d\u00e9fis communs, saisir les opportunit\u00e9s qui se pr\u00e9sentent et construire un avenir prosp\u00e8re, a soulign\u00e9 l\u2019ambassadeur du Maroc aupr\u00e8s de l\u2019Union europ\u00e9enne et de l\u2019OTAN, Ahmed Reda Chami \u00e0 la suite de l\u2019adoption, jeudi, par le Parlement europ\u00e9en d\u2019une r\u00e9solution sur [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le jeune milieu offensif marocain\nSafouane Benzahra, 18 ans, devrait...", "mass": 5, "physics": false, "shape": "box", "title": "Le jeune milieu offensif marocain Safouane Benzahra, 18 ans, devrait signer dans les prochains jours son premier contrat professionnel avec l\u2019AS Monaco, club fran\u00e7ais de Ligue 1, rapportent des m\u00e9dias sp\u00e9cialis\u00e9s. [telquel.ma]\n-------------------------------------------------\nLe jeune talent marocain Safouane Ben Zahra, \u00e2g\u00e9 de 18 ans, sappr\u00eate \u00e0 signer son premier contrat professionnel avec l\u2019AS Monaco, selon plusieurs sources sp\u00e9cialis\u00e9es. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Maghreb de F\u00e8s (MAS),\nchampion en titre de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [telquel.ma]\n-------------------------------------------------\nLe Maghreb de F\u00e8s (MAS), champion en titre de la Botola Pro, a annonc\u00e9 la d\u00e9mission de Mohamed Bouzoubaa de la pr\u00e9sidence de l\u2019association sportive du club, pour des raisons personnelles. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des averses orageuses avec risque\nde gr\u00eale, rafales de vent...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses orageuses avec gr\u00eale, temps chaud et de fortes rafales de vent sont attendus, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nAinsi, des averses orageuses avec gr\u00eale et rafales de vent sous orages (15-25 mm) sont attendues, vendredi de 12H00 \u00e0 23H00, dans les provinces de Tinghir, Errachidia, Midelt et Ou. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Maroc et la Banque\nafricaine de d\u00e9veloppement (BAD) ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, jeudi \u00e0 Rabat, deux accords de financement d\u2019un montant total de 405 millions d\u2019euros (soit environ 4,4 milliards de dirhams) destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [telquel.ma]\n-------------------------------------------------\nR\u00e9unis jeudi \u00e0 Rabat, le gouvernement marocain et la Banque africaine de d\u00e9veloppement ont paraph\u00e9 deux accords destin\u00e9s \u00e0 moderniser le rail et \u00e0 d\u00e9velopper les comp\u00e9tences professionnelles, pour un montant cumul\u00e9 de 405 millions d\u0027euros. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9 deux accords de financement d\u2019un montant total de 405 millions d\u2019euros destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [leseco.ma]\n-------------------------------------------------\nLe Royaume et la Banque africaine de d\u00e9veloppement ont sign\u00e9 le 17 septembre \u00e0 Rabat deux accords de financement totalisant 405 millions d\u2019euros, soit environ 4,4 milliards de dirhams, r\u00e9partis entre l\u2019extension de la ligne \u00e0 grande vitesse et un programme de d\u00e9veloppement des comp\u00e9tences. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le s\u00e9lectionneur national, Mohamed Ouahbi,\na d\u00e9voil\u00e9, jeudi au Complexe...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national, Mohamed Ouahbi, a d\u00e9voil\u00e9, jeudi au Complexe Mohammed VI de football, la liste des joueurs convoqu\u00e9s pour les matchs du Gabon et du Lesotho, comptant respectivement pour les 1\u00e8re et 2\u00e8 journ\u00e9es des \u00e9liminatoires pour la Coupe d\u2019Afrique des Nations (CAN-2027), ainsi qu\u2019un match amical contre le Ghana. [telquel.ma]\n-------------------------------------------------\nEliminatoires CAN 2027 Le s\u00e9lectionneur national Mohamed Ouahbi a officiellement d\u00e9voil\u00e9 jeudi sa liste de 29 joueurs convoqu\u00e9s pour le prochain rassemblement des Lions de l\u2019Atlas. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts\n(DGI) rappelle que plusieurs cat\u00e9gories...", "mass": 5, "physics": false, "shape": "box", "title": "La Direction G\u00e9n\u00e9rale des Imp\u00f4ts (DGI) rappelle que plusieurs cat\u00e9gories de contribuables sont tenues d\u2019effectuer, au plus tard le 1er octobre 2026, leurs d\u00e9clarations et versements fiscaux. [telquel.ma]\n-------------------------------------------------\nContribuables La DGI rappelle que plusieurs cat\u00e9gories de contribuables sont tenues d\u2019effectuer, au plus tard le 1er octobre 2026, leurs d\u00e9clarations et versements fiscaux. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Maroc a exprim\u00e9 son\n\u00absoutien et sa solidarit\u00e9 absolue\u00bb...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc a exprim\u00e9 son \u00absoutien et sa solidarit\u00e9 absolue\u00bb envers l\u2019Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux Houthis, lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 de l\u2019ONU organis\u00e9e le 17 septembre selon la formule Arria. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a affirm\u00e9 jeudi devant le Conseil de s\u00e9curit\u00e9 de l\u0027ONU que le Maroc consid\u00e8re la gestion des d\u00e9troits comme une responsabilit\u00e9 et non une propri\u00e9t\u00e9, appelant \u00e0 un code de conduite international pour les pays riverains et proposant d\u0027accueillir un forum sur la libert\u00e9 de navigation. [atlasinfo.fr]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res Nasser Bourita a r\u00e9affirm\u00e9 jeudi devant le Conseil de s\u00e9curit\u00e9 de l\u0027ONU le soutien et la solidarit\u00e9 absolue du Maroc avec l\u0027Arabie saoudite apr\u00e8s les attaques attribu\u00e9es aux rebelles houthis, tout en alertant sur la menace pesant sur les d\u00e9troits de Bab al-Mandab et d\u0027Ormuz. [atlasinfo.fr]\n-------------------------------------------------\nLe Royaume du Maroc a r\u00e9affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations unies selon la formule Arria, son soutien et sa solidarit\u00e9 absolue avec le Royaume d\u2019Arabie saoudite \u00e0 la suite des attaques \u00ab l\u00e2ches \u00bb perp\u00e9tr\u00e9es par les rebelles houthis. \u00ab [www.lereporter.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a affirm\u00e9, jeudi lors d\u2019une r\u00e9union du Conseil de s\u00e9curit\u00e9 des Nations Unies selon la formule Arria, que le Maroc consid\u00e8re la gestion des d\u00e9troits comme une responsabilit\u00e9 et non comme une propri\u00e9t\u00e9, appelant \u00e0 une initiative visant [www.lereporter.ma]\n-------------------------------------------------\nJe tiens \u00e0 r\u00e9affirmer, au nom du Royaume du Maroc, notre soutien et notre solidarit\u00e9 absolue avec le Royaume d\u2019Arabie saoudite \u00e0 la suite des attaques l\u00e2ches perp\u00e9tr\u00e9es par l. [lematin.ma]\n-------------------------------------------------\nDevant le Conseil de s\u00e9curit\u00e9 de l\u2019ONU, Nasser Bourita a appel\u00e9 \u00e0 renforcer la r\u00e9ponse internationale aux crises qui touchent les d\u00e9troits d\u2019Ormuz et de Bab al-Mandab. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Education financi\u00e8re L\u2019Autorit\u00e9 de contr\u00f4le\ndes assurances et de la...", "mass": 5, "physics": false, "shape": "box", "title": "Education financi\u00e8re L\u2019Autorit\u00e9 de contr\u00f4le des assurances et de la pr\u00e9voyance sociale (ACAPS) vient de lancer \u00abMon cahier de l\u2019assurance\u00bb. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 de Contr\u00f4le des Assurances et de la Pr\u00e9voyance Sociale (ACAPS) a annonc\u00e9, jeudi, le lancement de \u00ab Mon cahier de l\u2019assurance \u00bb, une nouvelle collection p\u00e9dagogique visant \u00e0 faciliter la compr\u00e9hension des notions essentielles de l\u2019assurance. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17,                     barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
