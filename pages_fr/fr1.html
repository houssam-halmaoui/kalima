 a re\u00e7u lundi le nouveau sous-secr\u00e9taire g\u00e9n\u00e9ral du Bureau des Nations Unies contre le terrorisme, Alexander Zuev, actuellement en visite de travail dans le Royaume du Maroc. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Saad Lamjarred, qui devait compara\u00eetre\nlibre, n\u0027a pas eu \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Saad Lamjarred, qui devait compara\u00eetre libre, n\u0027a pas eu \u00e0 se pr\u00e9senter au tribunal de Draguignan, indique l#3. [lematin.ma]\n-------------------------------------------------\nLe chanteur Saad Lamjarred n\u2019a finalement pas comparu ce lundi devant la cour d\u2019assises du Var, o\u00f9 il devait \u00eatre jug\u00e9 pour un viol qu\u2019il conteste. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le produit net bancaire (PNB)\nconsolid\u00e9 du groupe Cr\u00e9dit du...", "mass": 5, "physics": false, "shape": "box", "title": "Le produit net bancaire (PNB) consolid\u00e9 du groupe Cr\u00e9dit du Maroc s\u2019\u00e9tablit \u00e0 2,68 milliards de dirhams, en hausse de 9,8%. [lematin.ma]\n-------------------------------------------------\nAvec un PNB de 2,7 MMDH et un r\u00e9sultat brut d\u2019exploitation de 1,5 MMDH, le r\u00e9sultat net part du groupe s\u2019est am\u00e9lior\u00e9 de 20% pour atteindre 690 MDH. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "\u00c0 l\u2019occasion de l\u2019Africa Investment\nForum 2025, la directrice g\u00e9n\u00e9rale...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019Africa Investment Forum 2025, la directrice g\u00e9n\u00e9rale du Fonds Mohammed VI pour l\u2019Investissement, Nezha Hayat a pr\u00e9sent\u00e9 un premier bilan chiffr\u00e9 et ambitieux du d. [lematin.ma]\n-------------------------------------------------\nIl agit comme un catalyseur et un acc\u00e9l\u00e9rateur \u2014 alignant les strat\u00e9gies nationales avec les capitaux priv\u00e9s, et transformant les ambitions publiques en opportunit\u00e9s bancables. [maroc-diplomatique.net]\n-------------------------------------------------\nLors de son intervention en Keynote au Africa Investment Forum 2025, la Directrice g\u00e9n\u00e9rale du Fonds Mohammed VI pour l\u2019Investissement (FM6I), Nezha Hayat, a rappel\u00e9 le r\u00f4le central du fonds souverain marocain dans la transformation du paysage de l\u2019investissement, tant au Maroc qu\u2019\u00e0 l\u2019\u00e9chelle continentale. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le pr\u00e9sident du Conseil Mondial\nde l\u0027Eau, Lo\u00efc Fauchon, s\u0027est...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident du Conseil Mondial de l\u0027Eau, Lo\u00efc Fauchon, s\u0027est f\u00e9licit\u00e9, lundi \u00e0 Marrakech, de la coop\u00e9ration renforc\u00e9e avec le Maroc dans le domaine de l\u0027eau. [www.lopinion.ma]\n-------------------------------------------------\nDessalement, r\u00e9utilisation des eaux us\u00e9es et technologies innovantes au c\u0153ur du 19e Congr\u00e8s Mondial de l\u2019Eau \u00e0 Marrakech. [www.lavieeco.com]\n-------------------------------------------------\nLe lancement du 19\u1d49 Congr\u00e8s Mondial de l\u2019Eau \u00e0 Marrakech a permis au Maroc et au Conseil Mondial de l\u2019Eau d\u2019affirmer une volont\u00e9 conjointe de promouvoir des solutions innovantes pour la gestion des ressources hydriques. [maroc-diplomatique.net]\n-------------------------------------------------\nLes travaux de la 19\u00e8 \u00e9dition du Congr\u00e8s Mondial de l\u2019Eau, tenue sous le th\u00e8me \u201cL\u2019eau dans un monde qui change: Innovation et adaptation\u201d, se sont ouverts lundi \u00e0 Marrakech. [www.lereporter.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a lanc\u00e9, lundi 1er d\u00e9cembre Marrakech, les travaux du Congr\u00e8s Mondial de l\u2019Eau, dont la 19e \u00e9dition est d\u00e9di\u00e9e [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "Khalid Alami Houir a \u00e9t\u00e9\n\u00e9lu, dimanche \u00e0 Bouznika, nouveau...", "mass": 5, "physics": false, "shape": "box", "title": "Khalid Alami Houir a \u00e9t\u00e9 \u00e9lu, dimanche \u00e0 Bouznika, nouveau secr\u00e9taire g\u00e9n\u00e9ral de la Conf\u00e9d\u00e9ration d\u00e9mocratique du travail (CDT). [www.lopinion.ma]\n-------------------------------------------------\nL\u2019\u00e9lection de M. Alami Houir a eu lieu lors des travaux du 7\u00e8me congr\u00e8s national de cette centrale syndicale, tenu du 28 au 30 novembre, sous le th\u00e8me \u00ab Fid\u00e9lit\u00e9 aux principes fondateurs et poursuite de la. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Moins de 100 Airbus de\nla gamme A320 restent immobilis\u00e9s...", "mass": 5, "physics": false, "shape": "box", "title": "Moins de 100 Airbus de la gamme A320 restent immobilis\u00e9s en raison d\u2019un logiciel de commandes vuln\u00e9rable, sur les quelque 6.000 appareils potentiellement concern\u00e9s, a annonc\u00e9 lundi le constructeur a\u00e9ronautique. [telquel.ma]\n-------------------------------------------------\nMoins de 100 avions Airbus de la gamme A320 restent clou\u00e9s au sol en raison d\u2019un logiciel de commandes vuln\u00e9rable aux radiations solaires, sur les quelque 6.000 appareils potentiellement concern\u00e9s, a annonc\u00e9 lundi le constructeur a\u00e9ronautique. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Les recettes de voyage du\nMaroc ont atteint 113 milliards...", "mass": 5, "physics": false, "shape": "box", "title": "Les recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et solidaire. [telquel.ma]\n-------------------------------------------------\nLes recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et solidaire. [aujourdhui.ma]\n-------------------------------------------------\nLes recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u00e9j\u00e0 le total enregistr\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024, selon le minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie Sociale et solidaire. [maroc-diplomatique.net]\n-------------------------------------------------\nLes recettes de voyage du Maroc ont atteint 113 milliards de dirhams (MMDH) \u00e0 fin octobre 2025, d\u00e9passant d\u2019ores et d\u00e9j\u00e0 le total g\u00e9n\u00e9r\u00e9 sur l\u2019ensemble de l\u2019ann\u00e9e 2024. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Des chutes de neige \u00e0\npartir de 1.700 m et...", "mass": 5, "physics": false, "shape": "box", "title": "Des chutes de neige \u00e0 partir de 1.700 m et de fortes rafales de vent sont attendues mercredi dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m et de fortes rafales de vent sont attendues mercredi dans plusieurs provinces du Royaume, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019arr\u00eat\u00e9 du compte satellite du\ntourisme pour l\u2019ann\u00e9e 2024 fait...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019arr\u00eat\u00e9 du compte satellite du tourisme pour l\u2019ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u2019\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [telquel.ma]\n-------------------------------------------------\nSelon le Haut-commissariat au Plan, la contribution au PIB national du tourisme s\u0027est am\u00e9lior\u00e9e en 2024 pour se situer \u00e0 7,3% contre 6,8% en 2019. [www.lavieeco.com]\n-------------------------------------------------\nL\u2019arr\u00eat\u00e9 du compte satellite du tourisme pour l\u2019ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u2019\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [maroc-diplomatique.net]\n-------------------------------------------------\nL\u0027arr\u00eat\u00e9 du compte satellite du tourisme pour l\u0027ann\u00e9e 2024 fait appara\u00eetre une hausse du produit int\u00e9rieur brut (PIB) touristique de 38,4% par rapport \u00e0 2019, pour s\u0027\u00e9tablir \u00e0 116,2 milliards de dirhams (MMDH), selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nLe secteur du tourisme a confirm\u00e9 en 2024 son r\u00f4le de pilier majeur de l\u2019\u00e9conomie nationale, avec un Produit int\u00e9rieur brut (PIB) touristique estim\u00e9 \u00e0 116,2 milliards de dirhams (MMDH), en hausse de 38,4 % par rapport \u00e0 son niveau de 2019, selon les donn\u00e9es du compte satellite du tourisme publi\u00e9es par le Haut-Commissariat au . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Maroc abritera, les 2\net 3 d\u00e9cembre 2025 \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc abritera, les 2 et 3 d\u00e9cembre 2025 \u00e0 Rabat, la premi\u00e8re Conf\u00e9rence internationale d\u00e9di\u00e9e aux victimes africaines du terrorisme, un \u00e9v\u00e9nement d\u2019envergure visant \u00e0 mettre au premier plan les cons\u00e9quences humaines du terrorisme en Afrique et \u00e0 renforcer les m\u00e9canismes de soutien et de r\u00e9silience au niveau du continent. [www.yabiladi.com]\n-------------------------------------------------\nLe Royaume du Maroc abritera, les 2 et 3 d\u00e9cembre 2025, la premi\u00e8re Conf\u00e9rence internationale d\u00e9di\u00e9e aux victimes africaines du terrorisme, un \u00e9v\u00e9nement d\u2019envergure visant \u00e0 mettre au premier plan les cons\u00e9quences humaines du terrorisme en Afrique et \u00e0 renforcer les m\u00e9canismes de soutien et de r\u00e9silience au niveau du continent. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Hommag\u00e9e au Festival international du\nfilm de Marrakech (FIFM 2025)...", "mass": 5, "physics": false, "shape": "box", "title": "Hommag\u00e9e au Festival international du film de Marrakech (FIFM 2025) pour l\u2019ensemble de sa carri\u00e8re su
