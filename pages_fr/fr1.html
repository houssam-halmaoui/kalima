blanca a \u00e9t\u00e9 officiellement admise au R\u00e9seau mondial des villes apprenantes de l\u2019UNESCO, consacrant ainsi son engagement en faveur de l\u2019apprentissage tout au long de la vie et de la promotion du savoir au service de l\u2019ensemble des citoyens. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "La Conf\u00e9d\u00e9ration africaine de football\n(CAF) a ouvert une enqu\u00eate...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration africaine de football (CAF) a ouvert une enqu\u00eate suite \u00e0 des incidents survenus lors des quarts de finale de la CAN 2025, selon un communiqu\u00e9 publi\u00e9 ce lundi 12 janvier. [telquel.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a annonc\u00e9 une enqu\u00eate sur les incidents qui ont entach\u00e9 la fin de match de quart de finale entre lAlg\u00e9rie et le Nigeria, dans le cadre de la Coupe dAfrique des nations (CAN 2025) qui se tient au Maroc. [www.yabiladi.com]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration africaine de football (CAF) a ouvert une enqu\u00eate sur les incidents survenus lors du quart de finale Alg\u00e9rie \u2013 Nigeria, ainsi que lors de Cameroun \u2013 Maroc, condamnant \u00ab le comportement inacceptable des joueurs et des officiels \u00bb, a annonc\u00e9 l\u2019instance lundi. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 21, "id": "comm_label_21", "label": "Depuis son inauguration le 18\nseptembre 2025 par le roi...", "mass": 5, "physics": false, "shape": "box", "title": "Depuis son inauguration le 18 septembre 2025 par le roi Mohammed VI, le nouveau terminal de croisi\u00e8res du port de Casablanca a enregistr\u00e9 une dynamique encourageante, avec l\u2019accueil de 53 navires/paquebots pour un total de 93.970 passagers, indique l\u2019Agence Nationale des Ports (ANP). [telquel.ma]\n-------------------------------------------------\nDans un communiqu\u00e9 mettant en avant les premi\u00e8res r\u00e9alisations de ce nouveau terminal, l\u2019ANP souligne que ces chiffres illustrent l\u2019int\u00e9r\u00eat croissant des armateurs pour Casablanca. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 24, "id": "comm_label_24", "label": "\u00c0 l\u2019occasion de la comm\u00e9moration\nde la pr\u00e9sentation du Manifeste...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de la comm\u00e9moration de la pr\u00e9sentation du Manifeste de l\u2019Ind\u00e9pendance, le roi Mohammed VI a accord\u00e9 sa gr\u00e2ce \u00e0 1.386 personnes condamn\u00e9es par diff\u00e9rents tribunaux du Royaume, annonce le minist\u00e8re de la Justice dans un communiqu\u00e9. [telquel.ma]\n-------------------------------------------------\n\u00c0 l\u2019occasion de la comm\u00e9moration de la pr\u00e9sentation du Manifeste de l\u2019Ind\u00e9pendance, le Roi Mohammed VI a accord\u00e9 une gr\u00e2ce royale \u00e0 1.386 personnes condamn\u00e9es par diff\u00e9rents tribunaux du Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Le RNI a approuv\u00e9, \u00e0\nl\u2019issue d\u2019une r\u00e9union pr\u00e9sid\u00e9e par...", "mass": 5, "physics": false, "shape": "box", "title": "Le RNI a approuv\u00e9, \u00e0 l\u2019issue d\u2019une r\u00e9union pr\u00e9sid\u00e9e par M. Aziz Akhannouch, pr\u00e9sident du parti, la liste des membres la Commission pr\u00e9paratoire dudit Congr\u00e8s, indique le bureau politique de la formation partisane. [telquel.ma]\n-------------------------------------------------\nLe Rassemblement national des ind\u00e9pendants (RNI) a tenu, samedi \u00e0 Rabat, la session ordinaire de son Conseil national, une \u00e9tape \u00e0 la fois organisationnelle et politique, conform\u00e9ment aux statuts et au r\u00e8glement int\u00e9rieur du parti. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Investissement en Bourse Les interventions\ndes organismes de placement collectif...", "mass": 5, "physics": false, "shape": "box", "title": "Investissement en Bourse Les interventions des organismes de placement collectif en valeurs mobili\u00e8res (OPCVM) et des personnes physiques marocaines, sur le compartiment des actions du march\u00e9 central de la Bourse de Casablanca, ont cumul\u00e9 63,4 % du volume des transactions au troisi\u00e8me trimestre 2025. [aujourdhui.ma]\n-------------------------------------------------\nDerri\u00e8re l\u2019envol\u00e9e des volumes et la hausse marqu\u00e9e des indices, le rapport de l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux r\u00e9v\u00e8le la r\u00e9alit\u00e9 d\u2019un march\u00e9 anim\u00e9, avant tout, par les investisseurs domestiques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le besoin de financement du\nTr\u00e9sor est ressorti \u00e0 89,6...", "mass": 5, "physics": false, "shape": "box", "title": "Le besoin de financement du Tr\u00e9sor est ressorti \u00e0 89,6 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, couvert \u00e0 hauteur de 63% sur le march\u00e9 int\u00e9rieur, selon Attijari Global Research (AGR). [www.lavieeco.com]\n-------------------------------------------------\nLe besoin de financement du Tr\u00e9sor est ressorti \u00e0 89,6 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, couvert \u00e0 hauteur de 63% sur le march\u00e9 int\u00e9rieur, selon Attijari Global Research (AGR). [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true,         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);

            setTimeout(positionCommunityLabels, 50);

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {

                    Array.from(mutation.addedNodes).forEach(function(node) {

                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
