 une d\u00e9claration \u00e0 la presse \u00e0 l\u2019issue du Conseil de . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Conseil de gouvernement : Point\nde presse hebdomadaire de Mustapha...", "mass": 5, "physics": false, "shape": "box", "title": "Conseil de gouvernement : Point de presse hebdomadaire de Mustapha Baitas, porte-parole du gouvernement. [lematin.ma]\n-------------------------------------------------\nLe Maroc reviendra \u00e0 l\u2019heure l\u00e9gale (GMT), mettant ainsi fin \u00e0 l\u2019application de l\u2019heure suppl\u00e9mentaire (GMT+1) \u00e0 partir de la fin de l\u2019\u00e9t\u00e9 2026, a annonc\u00e9 Mustapha Baitas, ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement et porte-parole du gouvernement. [fr.hespress.com]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, le projet de d\u00e9cret n\u00b0 2.26.530 relatif \u00e0 l\u2019heure l\u00e9gale, pr\u00e9sent\u00e9 par le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 des Relations avec le Parlement, porte-parole du gouvernement, Mustapha Baitas, au nom de la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "L\u2019ancienne ministre fran\u00e7aise de la\nCulture, Audrey Azoulay, a \u00e9t\u00e9...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ancienne ministre fran\u00e7aise de la Culture, Audrey Azoulay, a \u00e9t\u00e9 \u00e9lue au cours de la s\u00e9ance pl\u00e9ni\u00e8re de l\u2019acad\u00e9mie, tenue mercredi, au fauteuil IV de la section des membres libre. [lematin.ma]\n-------------------------------------------------\nL\u2019ancienne ministre fran\u00e7aise de la Culture a
