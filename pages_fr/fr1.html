9\u00e0 la responsabilit\u00e9 publique qu\u2019il assume. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "R\u00e9uni ce mercredi 28 janvier,\nle Bureau politique du RNI...", "mass": 5, "physics": false, "shape": "box", "title": "R\u00e9uni ce mercredi 28 janvier, le Bureau politique du RNI a annonc\u00e9 avoir re\u00e7u la candidature de Mohamed Chaouki qu\u2019il a d\u00e9cid\u00e9 de soumettre \u00e0 l\u2019appr\u00e9ciation de la session extraordinaire du congr\u00e8s. [telquel.ma]\n-------------------------------------------------\nLe bureau politique du Rassemblement National des Ind\u00e9pendants (RNI) a r\u00e9v\u00e9l\u00e9 dans un communiqu\u00e9 qu\u00e0 la cl\u00f4ture de la p\u00e9riode de d\u00e9p\u00f4t des candidatures pour succ\u00e9der \u00e0 Aziz Akhannouch \u00e0 la t\u00eate du parti, une seule candidature a \u00e9t\u00e9 enregistr\u00e9e, celle de Mohamed Chouki. [www.yabiladi.com]\n-------------------------------------------------\nDans un communiqu\u00e9 diffus\u00e9 ce mercredi 28 janvier, le Bureau politique du Rassemblement national des ind\u00e9pendants (RNI) a annonc\u00e9 avoir re\u00e7u la candidature de Mohamed Chaouki pour la pr\u00e9sidence du parti. [leseco.ma]\n-------------------------------------------------\nR\u00e9uni mercredi 28 janvier 2026 \u00e0 Rabat, le bureau politique du Rassemblement National des Ind\u00e9pendants (RNI), sous la pr\u00e9sidence d\u2019Aziz Akhannouch, a tenu une r\u00e9union consacr\u00e9e \u00e0 l\u2019examen de la conjoncture politique, \u00e9conomique et sociale nationale, ainsi qu\u2019au suivi des pr\u00e9paratifs du congr\u00e8s national extraordinaire pr\u00e9vu le 7 f\u00e9vrier prochain \u00e0 El Jadida. [lnt.ma]\n-------------------------------------------------\n\u00c0 la suite de l\u2019annonce du retrait d\u2019Aziz Akhannouch de la pr\u00e9sidence du Rassemblement National des Ind\u00e9pendants (RNI), Mohamed Chaouki appara\u00eet d\u00e9sormais comme l\u2019unique candidat \u00e0 la t\u00eate du parti. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Les associations de parents d\u2019\u00e9l\u00e8ves\n(APE) se mobilisent, et r\u00e9clament...", "mass": 5, "physics": false, "shape": "box", "title": "Les associations de parents d\u2019\u00e9l\u00e8ves (APE) se mobilisent, et r\u00e9clament un r\u00e9examen des d\u00e9cisions prises le 19 d\u00e9cembre 2025 par le conseil d\u2019administration de l\u2019Agence pour l\u2019enseignement du fran\u00e7ais \u00e0 l\u2019\u00e9tranger (AEFE). [telquel.ma]\n-------------------------------------------------\nUne nouvelle hausse des frais de scolarit\u00e9, annonc\u00e9e dans le sillage du conseil d\u2019administration de l\u2019AEFE (Agence pour l\u2019enseignement fran\u00e7ais \u00e0 l\u2019\u00e9tranger) du 18 d\u00e9cembre 2025, a mis [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Des averses, de fortes pluies\net rafales de vent sont...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses, de fortes pluies et rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes averses, de fortes pluies et rafales de vent sont pr\u00e9vues, mercredi et jeudi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Les services de la pr\u00e9fecture\nde police de B\u00e9ni Mella
