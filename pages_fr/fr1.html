ergy Maroc et INJAZ Al-Maghrib renouvellent leur partenariat historique pour soutenir l\u2019entrepreneuriat des jeunes. [www.challenge.ma]\n-------------------------------------------------\nVivo Energy Maroc, l\u2019entreprise en charge de la commercialisation et de la distribution de carburants et lubrifiants de marque Shell au Maroc et de gaz de p\u00e9trole liqu\u00e9fi\u00e9 de marque Butagaz, consolide son engagement soci\u00e9tal en renouvelant son partenariat strat\u00e9gique avec l\u2019association INJAZ Al-Maghrib. [leseco.ma]\n-------------------------------------------------\nVivo Energy Maroc et l\u2019association INJAZ Al-Maghrib ont sign\u00e9, le 24 octobre, une nouvelle convention de partenariat pour la p\u00e9riode 2025-2027. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Dans le cadre des r\u00e9formes\ndu secteur public et des...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre des r\u00e9formes du secteur public et des grandes orientations royales, le Conseil de la concurrence et l\u2019Agence Nationale de Gestion Strat\u00e9gique des Participations de l\u2019Etat (ANGSPE) ont scell\u00e9, ce mardi 28 octobre \u00e0 Rabat, un partenariat strat\u00e9gique visant \u00e0 garantir la transparence, la neutralit\u00e9 concurrentielle et un cadre favorable \u00e0 l\u2019investissement public . [fr.hespress.com]\n-------------------------------------------------\nLe Conseil de la concurrence et l\u2019Agence Nationale de Gestion Strat\u00e9gique des Participations de l\u2019\u00c9tat et de suivi des performances des \u00e9tablissements et entreprises publics (ANGSPE) ont sign\u00e9, Mardi \u00e0 Rabat, une convention de partenariat destin\u00e9e \u00e0 promouvoir une \u00e9conomie marocaine plus comp\u00e9titive, \u00e9quitable et align\u00e9e sur les principes de bonne gouvernance et de concurrence loyale. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "A quelques jours du d\u00e9but\nde la Conf\u00e9rence mondiale sur...", "mass": 5, "physics": false, "shape": "box", "title": "A quelques jours du d\u00e9but de la Conf\u00e9rence mondiale sur le climat \u00ab COP 2030 \u00bb, qui se tiendra au Br\u00e9sil, la ministre de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, Leila Benali, a pr\u00e9sent\u00e9 le mod\u00e8le de d\u00e9veloppement marocain. [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc se pr\u00e9pare \u00e0 participer activement \u00e0 la conf\u00e9rence sur le climat COP30, qui se tiendra au Br\u00e9sil, a d\u00e9clar\u00e9 lundi la ministre de la Transition \u00e9nerg\u00e9tique et du d\u00e9veloppement durable, Le\u00efla Benali, devant le Parlement. [www.yabiladi.com]\n-------------------------------------------------\nLa ministre de la Transition \u00e9nerg\u00e9tique et du D\u00e9veloppement durable, Le\u00efla Benali, a d\u00e9voil\u00e9 les pr\u00e9paratifs du Maroc en vue de la Conf\u00e9rence mondiale sur le climat COP 2030, qui se tiendra la semaine prochaine au Br\u00e9sil. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Les moyens de renforcer la\ncoop\u00e9ration entre le Maroc et...", "mass": 5, "physics": false, "shape": "box", "title": "Les moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00e9t\u00e9 au centre d\u2019entretiens, mardi \u00e0 Rabat, entre le ministre du Transport et de la Logistique, Abdessamad Kayouh, et l\u2019Ambassadeur du Royaume-Uni au Maroc, Alex Pinfield. [telquel.ma]\n-------------------------------------------------\nLes moyens de renforcer la coop\u00e9ration entre le Maroc et le Royaume-Uni dans le domaine du transport ont \u00  et la Conf\u00e9d\u00e9ration Nationale du Tourisme (CNT) ont organis\u00e9, lundi, un workshop r\u00e9unissant plus de 100 op\u00e9rateurs touristiques, visant \u00e0 renforcer l\u2019attractivit\u00e9 du Maroc aupr\u00e8s du march\u00e9 am\u00e9ricain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Rachad Bouhlal, ambassadeur du Maroc\nau Japon, a \u00e9t\u00e9 \u00e9lu...", "mass": 5, "physics": false, "shape": "box", "title": "Rachad Bouhlal, ambassadeur du Maroc au Japon, a \u00e9t\u00e9 \u00e9lu pr\u00e9sident du Conseil pour la promotion de la francophonie au Japon, \u00e0 l\u2019occasion de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale annuelle tenue \u00e0 Tokyo. [telquel.ma]\n-------------------------------------------------\nRachad Bouhlal, ambassadeur du Maroc au Japon, a \u00e9t\u00e9 \u00e9lu par acclamation pr\u00e9sident du Conseil pour la promotion de la francophonie au Japon, \u00e0 l\u2019occasion de l\u2019Assembl\u00e9e g\u00e9n\u00e9rale annuelle tenue \u00e0 Tokyo. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le ministre des Affaires \u00e9trang\u00e8res,\nde la Coop\u00e9ration africaine et...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, Nasser Bourita, a re\u00e7u, lundi \u00e0 Rabat, une d\u00e9l\u00e9gation de l\u2019intergroupe parlementaire italien de soutien \u00e0 l\u2019initiative d\u2019autonomie au Sahara, en visite de travail dans le Royaume jusqu\u2019au 28 octobre. [telquel.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser B         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {

                var node = network.body.nodes[nodeId];

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
