e son pays en faveur de l\u2019int\u00e9grit\u00e9 territoriale et de la souverainet\u00e9 du Maroc sur l\u2019ensemble de son territoire, y compris la r\u00e9gion du Sahara. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les comptes nationaux du premier\ntrimestre 2026 publi\u00e9s par le...", "mass": 5, "physics": false, "shape": "box", "title": "Les comptes nationaux du premier trimestre 2026 publi\u00e9s par le Haut-Commissariat au Plan (HCP) montrent que l\u0027\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6%, contre 5%. [lematin.ma]\n-------------------------------------------------\nLes r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [www.yabiladi.com]\n-------------------------------------------------\nLes r\u00e9sultats des comptes nationaux du premier trimestre 2026 montrent que l\u2019\u00e9conomie nationale a maintenu un rythme de croissance soutenu de 4,6%, apr\u00e8s 5% au T1-2025, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nCette demande a contribu\u00e9 pour 6,9 points \u00e0 la croissance \u00e9conomique nationale au lieu de 5,3 points, indique le HCP dans sa note d\u2019information sur la situation \u00e9conomique [www.lereporter.ma]\n-------------------------------------------------\nL\u2019\u00e9conomie marocaine a enregistr\u00e9 une croissance de 4,6 % au premier trimestre 2026, contre 5 % \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon les comptes nationaux publi\u00e9s lundi par le Haut-Commissariat au Plan (HCP). [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Festival Gnaoua 2026 : Essaouira\nreferme trois jours de c\u00e9l\u00e9bration...", "mass": 5, "physics": false, "shape": "box", "title": "Festival Gnaoua 2026 : Essaouira referme trois jours de c\u00e9l\u00e9bration musicale et de dialogue entre les cultures. [lematin.ma]\n-------------------------------------------------\nPendant trois jours, Essaouira a r\u00e9uni plus de 300 000 festivaliers, 460 artistes, 43 ma\u00e2lems gnaoua autour de 52 concerts. [www.yabiladi.com]\n-------------------------------------------------\nOrganis\u00e9 du 25 au 27 juin, le Festival Gnaoua et musiques du monde a une nouvelle fois marqu\u00e9 les esprits en transformant Essaouira en un v\u00e9ritable carrefour des . [aujourdhui.ma]\n-------------------------------------------------\nLa 27e \u00e9dition du Festival Gnaoua et Musiques du monde s\u2019est achev\u00e9e, samedi dernier \u00e0 Essaouira, dans une atmosph\u00e8re de f\u00eate, de partage et de ferveur populaire. [leseco.ma]\n-------------------------------------------------\nLe Festival Gnaoua et Musiques du Monde a cl\u00f4tur\u00e9 samedi sa 27e \u00e9dition apr\u00e8s trois jours de concerts, de cr\u00e9ations artistiques et de rencontres culturelles ayant r\u00e9uni plus de 300.000 festivaliers dans la cit\u00e9 des Aliz\u00e9s, selon les organisateurs. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Une vague de chaleur, un\ntemps chaud et de fortes...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur, un temps chaud et de fortes rafales de vent avec temp\u00eate de sable sont attendues de lundi \u00e0 mercredi dans plusieurs provinces du Royaume, a indiqu\u00e9 lundi la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur, un temps chaud et de fortes rafales de vent avec temp\u00eate de sable sont attendues de lundi \u00e0 mercredi dans plusieurs provinces du Maroc, a indiqu\u00e9 lundi la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) annonce une vague de chaleur, un temps chaud et de fortes rafales de vent accompagn\u00e9es de temp\u00eates de sable de lundi \u00e0 mercredi dans plusieurs provinces du Royaume. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La pr\u00e9sidente du Groupe de\nla Banque europ\u00e9enne d\u2019investissement (BEI),...", "mass": 5, "physics": false, "shape": "box", "title": "La pr\u00e9sidente du Groupe de la Banque europ\u00e9enne d\u2019investissement (BEI), Nadia Calvi\u00f1o, a annonc\u00e9 que la Banque pr\u00e9voit d\u2019atteindre 700 millions d\u2019euros d\u2019investissements au Maroc durant l\u2019ann\u00e9e 2026. [telquel.ma]\n-------------------------------------------------\nEn visite de travail dans le Royaume, la pr\u00e9sidente de la Banque europ\u00e9enne d\u2019investissement (BEI), Nadia Calvi\u00f1o, a assur\u00e9 que les investisseurs internationaux font de plus en plus [www.challenge.ma]\n-------------------------------------------------\nLa Banque europ\u00e9enne d\u0027investissement (BEI) pr\u00e9voit de mobiliser plus de 700 millions d\u0027euros d\u0027investissements au Maroc en 2026, a annonc\u00e9 sa pr\u00e9sidente, Nadia Calvi\u00f1o, \u00e0 l\u0027occasion de sa premi\u00e8re visite officielle dans le Royaume. [www.lavieeco.com]\n-------------------------------------------------\nLa pr\u00e9sidente du Groupe de la Banque europ\u00e9enne d\u0027investissement (BEI), Nadia Calvi\u00f1o, a annonc\u00e9 que la Banque pr\u00e9voit d\u0027atteindre 700 millions d\u0027euros (M\u20ac) d\u0027investissements au Maroc durant l\u0027ann\u00e9e 2026. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Groupe BCP et Western\nUnion ont annonc\u00e9, lundi 29...", "mass": 5, "physics": false, "shape": "box", "title": "Le Groupe BCP et Western Union ont annonc\u00e9, lundi 29 juin 2026, le lancement op\u00e9rationnel d\u2019une solution in\u00e9dite de transfert d\u2019argent international reposant sur une int\u00e9gration API directe [www.challenge.ma]\n-------------------------------------------------\nLe Groupe BCP et Western Union ont lanc\u00e9 une nouvelle solution de transfert d\u2019argent international permettant aux fonds envoy\u00e9s depuis l\u2019\u00e9tranger d\u2019\u00eatre d\u00e9pos\u00e9s instantan\u00e9ment et de mani\u00e8re s\u00e9curis\u00e9e sur les comptes bancaires des b\u00e9n\u00e9ficiaires au Maroc, ont annonc\u00e9 les deux entreprises dans un communiqu\u00e9 conjoint publi\u00e9 lundi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "\u00c0 la veille du 16\u00e8\nde finale de la Coupe...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, sest montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.yabiladi.com]\n-------------------------------------------------\nLe s\u00e9lectionneur des Pays-Bas, Ronald Koeman, s\u0027est montr\u00e9 \u00e9logieux envers la s\u00e9lection marocaine, estimant que le match de 16e de finale entre les deux \u00e9quipes, pr\u00e9vu lundi, sera \"un grand match\" entre deux pr\u00e9tendants aux premiers r\u00f4les de la Coupe du monde 2026. [leseco.ma]\n-------------------------------------------------\n\u00c0 la veille du 16\u00e8 de finale de la Coupe du monde 2026 face aux Pays-Bas, le s\u00e9lectionneur du Maroc, Mohamed Ouahbi, s\u2019est montr\u00e9 confiant, tout en insistant que cette affiche entre deux s\u00e9lections du Top 10 mondial se jouera sur tous les plans. [www.lereporter.ma]\n-------------------------------------------------\n\u00c0 l\u2019aube de son huiti\u00e8me de finale de la Coupe du monde 2026 face aux Pays-Bas, la s\u00e9lection marocaine affiche confiance et d\u00e9termination, tout en mesurant l\u2019ampleur du d\u00e9fi qui l\u2019attend lundi au stade de Monterrey. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Aziz Akhannouch a inaugur\u00e9 aujourd\u2019hui\n\u00e0 Agadir le deuxi\u00e8me centre...", "mass": 5, "physics": false, "shape": "box", "title": "Aziz Akhannouch a inaugur\u00e9 aujourd\u2019hui \u00e0 Agadir le deuxi\u00e8me centre de R\u0026D d\u2019Oracle au Maroc. [www.lavieeco.com]\n-------------------------------------------------\nOracle a inaugur\u00e9 lundi \u00e0 Agadir son deuxi\u00e8me hub de recherche et d\u00e9veloppement, R\u0026D, au Maroc, renfor\u00e7ant ainsi ses investissements dans l\u2019\u00e9cosyst\u00e8me technologique national et r\u00e9affirmant son engagement \u00e0 d\u00e9velopper, depuis le Royaume, des technologies cloud et d\u2019intelligence artificielle de rang mondial destin\u00e9es aux march\u00e9s internationaux. [aujourdhui.ma]\n-------------------------------------------------\nOracle a inaugur\u00e9 lundi \u00e0 Agadir son deuxi\u00e8me hub de recherche et d\u00e9veloppement, R\u0026D, au Maroc. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le Roi Mohammed VI a\nadress\u00e9 un message de condol\u00e9ances...", "mass": 5, "physics": false, "shape": "box", "title": "Le Roi Mohammed VI a adress\u00e9 un message de condol\u00e9ances e         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });

                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
