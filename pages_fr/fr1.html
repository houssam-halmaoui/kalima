 26}, "group": 11, "id": "comm_label_11", "label": "Dans un contexte international marqu\u00e9\npar l\u2019essoufflement des \u00e9changes, la...", "mass": 5, "physics": false, "shape": "box", "title": "Dans un contexte international marqu\u00e9 par l\u2019essoufflement des \u00e9changes, la persistance des tensions g\u00e9opolitiques et la normalisation progressive des politiques mon\u00e9taires, le Maroc aborde l\u2019ann\u00e9e 2026 avec des perspectives \u00e9conomiques jug\u00e9es globalement solides. [www.lopinion.ma]\n-------------------------------------------------\nDans son rapport annuel Global Focus 2026, la banque britannique Standard Chartered pr\u00e9voit une croissance de 4,5% pour le Royaume, port\u00e9e par la dynamique des secteurs non agricoles et les grands projets d\u2019investissement. [telquel.ma]\n-------------------------------------------------\nCes taux sont les plus \u00e9lev\u00e9s depuis la pand\u00e9mie, selon le rapport annuel Global Focus analysant les tendances \u00e9conomiques qui influencent les march\u00e9s mondiaux et les \u00e9conomies \u00e9mergentes. [www.yabiladi.com]\n-------------------------------------------------\nDans un environnement international marqu\u00e9 par le ralentissement du commerce mondial, la persistance des tensions g\u00e9opolitiques et la fin progressive des cycles de baisse des taux d\u2019int\u00e9r\u00eat, Standard Chartered Global Research a publi\u00e9 son rapport annuel Global Focus 2026, qui analyse les principales tendances susceptibles d\u2019influencer les march\u00e9s mondiaux et les \u00e9conomies \u00e9mergentes, dont le . [lnt.ma]\n-------------------------------------------------\nLes perspectives de l\u0027\u00e9conomie marocaine pour 2026 sont soutenues par une forte dynamique non agricole, des investissements d\u0027envergure et un environnement inflationniste plus favorable, estime Standard Chartered Global Research dans un r\u00e9cent rapport. [www.lavieeco.com]"}, {"borderWidth": 3 on des importations s\u2019inscrivent dans une tendance jug\u00e9e \u00ab naturelle \u00bb, reflet de la dynamique d\u2019investissement et de l\u2019activit\u00e9 \u00e9conomique que conna\u00eet le Royaume. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le ministre Karim Zidane a\nfait le point lundi devant...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre Karim Zidane a fait le point lundi devant les d\u00e9put\u00e9s sur l\u2019avancement des m\u00e9canismes d\u2019aide aux entreprises et l\u2019am\u00e9lioration du climat des affaires au Maroc. [telquel.ma]\n-------------------------------------------------\nUn total de 89 projets d\u2019investissement, portant sur plus de 1,28 milliard de dirhams, ont \u00e9t\u00e9 approuv\u00e9s dans le cadre du dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME), lanc\u00e9 il y a un mois et demi, a annonc\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la convergence et de l\u2019\u00e9valuation des politiques publiques, Karim Zidane. [www.yabiladi.com]\n-------------------------------------------------\nLe nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises a permis l\u2019approbation de 89 projets d\u2019investissement pour un montant global d\u00e9passant 1,28 milliard de dirhams, a annonc\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants le ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Investissement, de la Convergence et de l\u2019\u00c9valuation des politiques publiques, Karim Zidane. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "17H00 : Alg\u00e9rie \u2013 RD\nCongo (Stade Moulay El Hassan...", "mass": 5, "physics": false, "shape": "box", "title" rds de dirhams (MMDH) \u00e0 fin novembre 2025, contre 89,79 MMDH \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente, selon l\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC). [leseco.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC), a indiqu\u00e9 que les lev\u00e9es de capitaux ont d\u00e9pass\u00e9 106,61 milliards de dirhams (MMDH) \u00e0 fin novembre 2025, contre 89,79 MMDH \u00e0 la m\u00eame p\u00e9riode de l\u2019ann\u00e9e pr\u00e9c\u00e9dente. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "CAN 2025 : L\u2019Alg\u00e9rie se\nqualifie pour les quarts de...", "mass": 5, "physics": false, "shape": "box", "title": "CAN 2025 : L\u2019Alg\u00e9rie se qualifie pour les quarts de finale en battant la RD Congo (1-0). [lematin.ma]\n-------------------------------------------------\nL\u2019Alg\u00e9rie s\u2019est qualifi\u00e9e mardi pour les quarts de finale de la CAN-2025 en \u00e9liminant la RD Congo 1-0 en 8e de finale, tout au bout de la prolongation, et affrontera le Nig\u00e9ria au tour suivant. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les frais du Hajj au\ntitre de la saison 1446H...", "mass": 5, "physics": false, "shape": "box", "title": "Les frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e9dente, a relev\u00e9, mardi, le ministre des Habous et des Affaires islamiques, Ahmed Toufiq, lors de la s\u00e9ance des questions orales \u00e0 la Chambre des conseillers. [www.lavieeco.com]\n-------------------------------------------------\nLes frais du Hajj au titre de la saison 1446H ont connu une baisse d\u2019environ 3.095 DH par rapport \u00e0 la saison pr\u00e9c\u00e <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
