plus-de-800-000-vehicules-par-jour-durant-lete-2026/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Ces nominations s\u2019inscrivent dans la\ncontinuit\u00e9 de la dynamique des...", "mass": 5, "physics": false, "shape": "box", "title": "Ces nominations s\u2019inscrivent dans la continuit\u00e9 de la dynamique des marques Renault et Dacia au Maroc et traduisent la volont\u00e9 de Renault Group de consolider leurs positions sur un march\u00e9 automobile en pleine \u00e9volution. [fr.hespress.com]\n-------------------------------------------------\nMehdi Yaroub est nomm\u00e9 Directeur G\u00e9n\u00e9ral de la marque Renault au Maroc \u00e0 compter du 1er octobr. [lematin.ma]\n-------------------------------------------------\nRenault Group Maroc a annonc\u00e9 deux nouvelles nominations au sein de ses activit\u00e9s commerciales, \u00e0 la t\u00eate des marques Renault et Dacia. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Des averses orageuses avec risque\nde gr\u00eale, rafales de vent...", "mass": 5, "physics": false, "shape": "box", "title": "Des averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale et rafales de vent sous orages (20-25 mm) toucheront, jeudi de 12H00 \u00e0 23H00, les provinces de Zagora, Tinghir, Ouarzazate, Azilal, Boule. [lematin.ma]\n-------------------------------------------------\nDes averses orageuses avec risque de gr\u00eale, rafales de vent sous orages et un temps chaud sont attendus, de jeudi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "N\u00e9 \u00e0 Beyrouth dans une\nfamille d\u2019artistes et install\u00e9 en...", "mass": 5, "physics": false, "shape": "box", "title": "N\u00e9 \u00e0 Beyrouth dans une famille d\u2019artistes et install\u00e9 en France d\u00e8s son enfance, Ibrahim Maalouf a d\u00e9velopp\u00e9 un langage musical singulier, nourri par sa formation classique autant. [lematin.ma]\n-------------------------------------------------\nLe trompettiste et compositeur franco-libanais Ibrahim Maalouf se produira au Th\u00e9\u00e2tre Royal de Rabat le mardi 22 septembre 2026 \u00e0 20h30, selon un communiqu\u00e9 publi\u00e9 le 17 septembre. [www.yabiladi.com]\n-------------------------------------------------\nIl y pr\u00e9sentera \u00ab Trumpets of Michel-Ange \u00bb, un projet qui s\u2019inscrit dans un parcours musical \u00e0 la crois\u00e9e du jazz, des musiques orientales et de la cr\u00e9ation contemporaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le UAE Moroccan Festival revient\n\u00e0 Casablanca pour une deuxi\u00e8me...", "mass": 5, "physics": false, "shape": "box", "title": "Le UAE Moroccan Festival revient \u00e0 Casablanca pour une deuxi\u00e8me \u00e9dition plac\u00e9e sous le signe des courses hippiques de haut niveau. [lematin.ma]\n-------------------------------------------------\nOrganis\u00e9 par la Soci\u00e9t\u00e9 Royale d\u2019Encouragement du Cheval (SOREC) en partenariat avec le UAE President Cup Committee, l\u2019\u00e9v\u00e9nement illustre la coop\u00e9ration culturelle et sportive entre le Maroc et les \u00c9mirats Arabes Unis, deux nations r\u00e9unies par leur passion pour l\u2019univers \u00e9questre. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La s\u00e9ance de cotation \u00e0\nla Bourse de Casablanca est...", "mass": 5, "physics": false, "shape": "box", "title": "La s\u00e9ance de cotation \u00e0 la Bourse de Casablanca est momentan\u00e9ment suspendue en raison d\u2019un incident technique survenu ce jeudi matin, a annonc\u00e9 la place casablancaise. [lematin.ma]\n-------------------------------------------------\nDans la foul\u00e9e, la Bourse de Casablanca a publi\u00e9 un communiqu\u00e9 et annonce qu\u2019elle \u00ab rassure l\u2019ensemble des intervenants du march\u00e9 et des investisseurs quant au suivi \u00e9troit de la situation, conform\u00e9ment aux proc\u00e9dures en. [telquel.ma]\n-------------------------------------------------\nLa Bourse de Casablanca a momentan\u00e9ment interrompu ses \u00e9changes jeudi, suite \u00e0 un incident technique survenu plus t\u00f4t dans la matin\u00e9e, a-t-elle annonc\u00e9 dans un communiqu\u00e9. [www.yabiladi.com]\n-------------------------------------------------\nUn incident technique survenu ce matin a contraint la Bourse de Casablanca \u00e0 suspendre momentan\u00e9ment sa s\u00e9ance de cotation. [www.lavieeco.com]\n-------------------------------------------------\nLa Bourse de Casablanca a annonc\u00e9 la suspension momentan\u00e9e de la s\u00e9ance de cotation de ce jeudi, en raison d\u2019un incident technique survenu dans la matin\u00e9e. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u2019Autorit\u00e9 Marocaine du March\u00e9 des\nCapitaux (AMMC) met en garde...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) met en garde le public contre la recrudescence des plateformes d\u2019investissement frauduleuses. [lematin.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) invite le public \u00e0 faire preuve d\u2019une vigilance accrue et rappelle les principales mesures \u00e0 adopter afin de pr\u00e9server son \u00e9pargne, et ce compte tenu de la recrudescence des offres frauduleuses diffus\u00e9es sur les r\u00e9seaux sociaux et au sein de groupes de messagerie instantan\u00e9e. [telquel.ma]\n-------------------------------------------------\nFace \u00e0 la recrudescence de plateformes d\u0027investissement frauduleuses diffus\u00e9es sur les r\u00e9seaux sociaux et les applications de messagerie, l\u0027Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) appelle le public \u00e0 la vigilance et rappelle les pr\u00e9cautions \u00e0 adopter pour pr\u00e9server son \u00e9pargne. [www.lavieeco.com]\n-------------------------------------------------\nL\u0027Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) invite le public \u00e0 faire preuve d\u2019une vigilance accrue et rappelle les principales mesures \u00e0 adopter afin de pr\u00e9server son \u00e9pargne, et ce compte tenu de la recrudescence des offres frauduleuses diffus\u00e9es sur les r\u00e9seaux sociaux et au sein de groupes de messagerie instantan\u00e9e. [leseco.ma]\n-------------------------------------------------\nL\u2019Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) appelle les \u00e9pargnants \u00e0 renforcer leur vigilance face \u00e0 la multiplication d\u2019offres d\u2019investissement frauduleuses diffus\u00e9es sur les r\u00e9seaux sociaux et les applications de messagerie. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Maroc et la Banque\nafricaine de d\u00e9veloppement (BAD) ont...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9, jeudi \u00e0 Rabat, deux accords de financement d\u2019un montant total de 405 millions d\u2019euros (soit environ 4,4 milliards de dirhams) destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont conclu, jeudi \u00e0 Rabat, deux accords de financement cumulant 405 millions deuros. [www.yabiladi.com]\n-------------------------------------------------\nR\u00e9unis jeudi \u00e0 Rabat, le gouvernement marocain et la Banque africaine de d\u00e9veloppement ont paraph\u00e9 deux accords destin\u00e9s \u00e0 moderniser le rail et \u00e0 d\u00e9velopper les comp\u00e9tences professionnelles, pour un montant cumul\u00e9 de 405 millions d\u0027euros. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc et la Banque africaine de d\u00e9veloppement (BAD) ont sign\u00e9 deux accords de financement d\u2019un montant total de 405 millions d\u2019euros destin\u00e9s \u00e0 valoriser le capital humain et \u00e0 moderniser les infrastructures ferroviaires du Royaume. [leseco.ma]\n-------------------------------------------------\nDeux accords de financement d\u2019un montant cumul\u00e9 de 405 millions d\u2019euros ont \u00e9t\u00e9 sign\u00e9s jeudi \u00e0 Rabat avec la Banque africaine de d\u00e9veloppement. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Critiqu\u00e9 pour avoir refus\u00e9 de\nporter enti\u00e8rement un tee-shirt de...", "mass": 5, "physics": false, "shape": "box", "title": "Critiqu\u00e9 pour avoir refus\u00e9 de porter enti\u00e8rement un tee-shirt de soutien \u00e0 la population de Sebta, l\u2019attaquant du Real Madrid Kylian Mbapp\u00e9 a clarifi\u00e9 sa position en assurant qu\u2019il soutenait \u00ab \u00e0 100% \u00bb les habitants de l\u2019encla         window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
