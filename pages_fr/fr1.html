i\u00e9t\u00e9 nationale des autoroutes du Maroc (ADM) annonce la fin des travaux de transformation de son homologue nord, le n\u0153ud autoroutier de Ain Harrouda, pour un investissement de 750 Millions de Dirhams. [fr.hespress.com]\n-------------------------------------------------\nLa Soci\u00e9t\u00e9 nationale des autoroutes du Maroc (ADM) a annonc\u00e9 ce lundi la fin des travaux de transformation du n\u0153ud autoroutier de A\u00efn Harrouda, entr\u00e9e nord de Casablanca. [telquel.ma]\n-------------------------------------------------\nL\u2019infrastructure made in Morocco dont la r\u00e9alisation a n\u00e9cessit\u00e9 un investissement de 750 MDH est livr\u00e9e en avance par rapport au programme pr\u00e9\u00e9tabli. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le tribunal de premi\u00e8re instance\nd\u2019El Jadida a rendu son...", "mass": 5, "physics": false, "shape": "box", "title": "Le tribunal de premi\u00e8re instance d\u2019El Jadida a rendu son verdict ce mardi apr\u00e8s-midi, condamnant le c\u00e9l\u00e8bre \u00ab streamer \u00bb Ilyas El Malki \u00e0 dix mois de prison ferme. [fr.hespress.com]\n-------------------------------------------------\nLe tribunal de premi\u00e8re instance d\u2019El Jadida a condamn\u00e9, ce mardi, le \u00ab streamer \u00bb Ilyas El Maliki \u00e0 10 mois de prison ferme, assortis d\u2019une amende de 20.000 dirhams. [telquel.ma]\n-------------------------------------------------\nLe tribunal de premi\u00e8re instance dEl Jadida a condamn\u00e9, ce mardi, le streamer Ilyas El Maliki \u00e0 10 mois de prison ferme et \u00e0 une amende de 20 000 dirhams. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "La cr\u00e9ation d\u2019entreprises par voie\n\u00e9lectronique a atteint 35.000 enregistrements...", "mass": 5, "physics": false, "shape": "box", "title": "La cr\u00e9ation d\u2019entreprises par voie \u00e9lectronique a atteint 35.000 enregistrements via la plateforme nationale d\u00e9di\u00e9e, a indiqu\u00e9 Amal El Fallah Seghrouchni lors d\u2019une s\u00e9ance de quest. [lematin.ma]\n-------------------------------------------------\nLa ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni, a annonc\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants que plus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique via la plateforme d\u00e9di\u00e9e \u00e0 la cr\u00e9ation d\u2019entreprises. [www.lopinion.ma]\n-------------------------------------------------\nPlus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique, gr\u00e2ce \u00e0 la plateforme d\u00e9di\u00e9e \u00e0 cet effet, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni. [telquel.ma]\n-------------------------------------------------\nPlus de 35.000 entreprises ont \u00e9t\u00e9 cr\u00e9\u00e9es par voie \u00e9lectronique gr\u00e2ce \u00e0 la plateforme d\u00e9di\u00e9e \u00e0 la cr\u00e9ation d\u2019entreprises, a indiqu\u00e9 lundi \u00e0 Rabat la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme de l\u2019administration, Amal El Fallah Seghrouchni, lors d\u2019une s\u00e9ance de questions orales \u00e0 la Chambre des repr\u00e9sentants. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les prix du gasoil et\nde l\u2019essence enregistrent une baisse...", "mass": 5, "physics": false, "shape": "box", "title": "Les prix du gasoil et de l\u2019essence enregistrent une baisse \u00e0 la pompe \u00e0 compter du 30 d\u00e9cembre 2025 \u00e0 00h01, marquant un retournement apr\u00e8s les deux derni\u00e8res hausses observ\u00e9es sur. [lematin.ma]\n-------------------------------------------------\nPour la premi\u00e8re fois depuis 2021, le prix du gasoil au Maroc est repass\u00e9 sous la barre symbolique des 10 dirhams le litre, marquant un tournant notable sur le march\u00e9 national des carburants. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Le secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de\nla P\u00eache maritime a annonc\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de la P\u00eache maritime a annonc\u00e9, mardi, l\u2019ouverture de la campagne de p\u00eache au poulpe hivernale \u00e0 partir du 1er janvier jusqu\u2019au 31 mars 2026 sur tout le littoral national. [www.lopinion.ma]\n-------------------------------------------------\nLe secr\u00e9tariat d\u2019\u00c9tat charg\u00e9 de la P\u00eache maritime a annonc\u00e9, mardi 30 d\u00e9cembre, l\u2019ouverture de la campagne de p\u00eache au poulpe hivernale \u00e0 partir du 1er janvier jusqu\u2019au [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Quinze personnes ont trouv\u00e9 la\nmort et 2.559 autres ont...", "mass": 5, "physics": false, "shape": "box", "title": "Quinze personnes ont trouv\u00e9 la mort et 2.559 autres ont \u00e9t\u00e9 bless\u00e9es, dont 102 gri\u00e8vement, dans 1.941 accidents de la circulation survenus en p\u00e9rim\u00e8tre urbain durant la semaine allant du 22 au 28 d\u00e9cembre, selon les statistiques de la Direction g\u00e9n\u00e9rale de la S\u00fbret\u00e9 nationale (DGSN). [www.lopinion.ma]\n-------------------------------------------------\nLa Direction g\u00e9n\u00e9rale de la s\u00fbret\u00e9 nationale (DGSN), a fait savoir que 15 personnes ont trouv\u00e9 la mort et 2.559 autres ont \u00e9t\u00e9 bless\u00e9es, dont 102 gri\u00e8vement, dans 1.941 accidents de la circulation survenus en p\u00e9rim\u00e8tre urbain durant la semaine allant du 22 au 28 d\u00e9cembre. [fr.hespress.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La Commission de la justice,\nde la l\u00e9gislation, des droits...", "mass": 5, "physics": false, "shape": "box", "title": "La Commission de la justice, de la l\u00e9gislation, des droits de l\u0027Homme et des libert\u00e9s \u00e0 la Chambre des repr\u00e9sentants a entam\u00e9, lundi, l\u0027examen g\u00e9n\u00e9ral des dispositions du projet de loi n\u00b0 58.25 relative \u00e0 la proc\u00e9dure civile, apr\u00e8s la prise en compte des effets juridiques d\u00e9coulant de la d\u00e9cision de la Cour constitutionnelle rendue le 4 ao\u00fbt dernier. [www.lopinion.ma]\n-------------------------------------------------\nCet examen intervient apr\u00e8s la prise en compte des effets juridiques d\u00e9coulant de la d\u00e9cision de la Cour constitutionnelle rendue le 4 ao\u00fbt dernier. [www.lavieeco.com]\n-------------------------------------------------\nLa Commission de la justice, de la l\u00e9gislation, des droits de l\u2019Homme et des libert\u00e9s \u00e0 la Chambre des repr\u00e9sentants a entam\u00e9, lundi \u00e0 Rabat, l\u2019examen g\u00e9n\u00e9ral des dispositions du projet de loi n\u00b0 58.25 relatif \u00e0 la proc\u00e9dure civile, apr\u00e8s la prise en compte des effets juridiques d\u00e9coulant de la d\u00e9cision rendue le 4 . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u0027administration de la prison locale\nd\u0027Ain Sebaa 1 a d\u00e9menti...", "mass": 5, "physics": false, "shape": "box", "title": "L\u0027administration de la prison locale d\u0027Ain Sebaa 1 a d\u00e9menti les all\u00e9gations selon lesquelles la d\u00e9tenue Saida El Alami aurait fait l\u0027objet de torture et d\u0027agression et serait en gr\u00e8ve de la faim. [www.lopinion.ma]\n-------------------------------------------------\nR\u00e9agissant aux all\u00e9gations relay\u00e9es sur certains sites \u00e9lectroniques et des r\u00e9seaux sociaux pr\u00e9tendant que la d\u00e9tenue aurait vu \u00abses v\u00eatements et sa literie asperg\u00e9s d\u2019eau par l\u2019une des fonctionnaires, ce qui l\u2019aurait incit\u00e9e \u00e0 entamer une gr\u00e8ve de la faim\u00bb, l\u2019administration affirme que la concern\u00e9e n\u2019a jamais pr\u00e9sent\u00e9 d\u2019avis dans ce sens. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "\u200bLe parc zoologique d\u2019A\u00efn Seba\u00e2\na rouvert ses portes lundi,...", "mass": 5, "physics": false, "shape": "box", "title": "\u200bLe parc zoologique d\u2019A\u00efn Seba\u00e2 a rouvert ses portes lundi, \u00e0 l\u2019issue d\u2019un vaste programme de r\u00e9am\u00e9nagement ayant permis de redonner vie \u00e0 ce site embl\u00e9matique de Casablanca. [www.lopinion.ma]\n-------------------------------------------------\nLe nouveau parc accueille le grand public \u00e0 partir de ce mardi, dans de meilleures conditions de vie pour les animaux et un meilleur accueil des visiteurs. [www.yabiladi.com]\n-------------------------------------------------\nLe parc zoologique d\u2019A\u00efn Seba\u00e2 a rouvert ses portes lundi \u00e0 Casablanca, \u00e0 l\u2019issue d\u2019un important programme de r\u00e9am\u00e9nagement visant \u00e0 redonner vie \u00e0 ce site embl\u00e9matique de la m\u00e9tropole. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id" i\u00e8me \u00e9dition du rapport \u00ab Business Ready \u00bb de la Banque mondiale, publi\u00e9e lundi 29 d\u00e9cembre [www.challenge.ma]\n-------------------------------------------------\nSelon la deuxi\u00e8me \u00e9dition du rapport \"Business Ready\" de la Banque Mondiale, le Royaume se classe deuxi\u00e8me en Afrique et dans le Monde arabe, avec un score agr\u00e9g\u00e9 de 63,44 points sur 100, marquant une progression par rapport \u00e0 la premi\u00e8re \u00e9dition. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a enregistr\u00e9 une nouvelle am\u00e9lioration de ses indicateurs relatifs au climat des affaires dans la deuxi\u00e8me \u00e9dition du rapport Business Ready de la Banque mondiale, publi\u00e9e lundi \u00e0 Washington. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "L\u2019indice des prix \u00e0 la\nproduction du secteur des \u00ab...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice des prix \u00e0 la production du secteur des \u00ab Industries manufacturi\u00e8res hors raffinage de p\u00e9trole \u00bb a enregistr\u00e9, en novembre 2025, une hausse de 0,3% par rapport au mois [www.challenge.ma]\n-------------------------------------------------\nDans sa note d\u2019information diffus\u00e9e ce mardi, le Haut-commissariat au plan (HCP) explique cette hausse par une \u00e9volution des prix de +1,8% de l\u2019industrie chimique. [www.yabiladi.com]\n-------------------------------------------------\nL\u0027indice des prix \u00e0 la production du secteur des \"Industries manufacturi\u00e8res hors raffinage de p\u00e9trole\" a enregistr\u00e9, en novembre 2025, une hausse de 0,3% par rapport au mois d\u0027octobre dernier, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", " le mettra en service un module d\u00e9di\u00e9 \u00e0 la gestion d\u00e9mat\u00e9rialis\u00e9e de l\u2019ex\u00e9cution des contrats, offrant aux fournisseurs un espace s\u00e9curis\u00e9 pour le suivi contractuel, la signature \u00e9lectronique ainsi que d\u0027autres services. [www.lavieeco.com]\n-------------------------------------------------\nBank Al-Maghrib a annonc\u00e9, ce lundi, la mise en service, \u00e0 compter du 05 janvier 2026, d\u2019un nouveau module d\u00e9di\u00e9 \u00e0 la gestion d\u00e9mat\u00e9rialis\u00e9e de l\u2019ex\u00e9cution des contrats dans le cadre de son Portail Achats, conform\u00e9ment \u00e0 la D\u00e9cision n\u00b0398/W/2025 du Wali de Bank Al-Maghrib. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "La caravane r\u00e9gionale d\u00e9di\u00e9e \u00e0\nla pr\u00e9sentation du nouveau dispositif...", "mass": 5, "physics": false, "shape": "box", "title": "La caravane r\u00e9gionale d\u00e9di\u00e9e \u00e0 la pr\u00e9sentation du nouveau dispositif de soutien aux tr\u00e8s petites, petites et moyennes entreprises (TPME) a fait escale, lundi, dans la province d\u2019El Jadida, marquant une nouvelle \u00e9tape au niveau de la r\u00e9gion Casablanca-Settat. [leseco.ma]\n-------------------------------------------------\nUne rencontre \u00e9largie entre responsables et acteurs \u00e9conomiques s\u0027est tenue ce lundi matin au si\u00e8ge de la province d\u0027El Jadida, d\u00e9di\u00e9e \u00e0 la pr\u00e9sentation de nouveaux m\u00e9canismes de soutien aux entreprises. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Les retenues d\u2019eau enregistr\u00e9es depuis\nle 1er septembre 2025 dans...", "mass": 5, "physics": false, "shape": "box", "title": "Les retenues d\u2019eau enregistr\u00e9es depuis le 1er septembre 2025 dans les diff\u00         const tooltip = document.getElementById('tooltip');

    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
