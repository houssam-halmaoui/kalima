8tres ainsi que de fortes pluies, parfois orageuses, attendues, de samedi \u00e0 dimanche, dans plusieurs provinces du Royaume. [fr.hespress.com]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [telquel.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1.700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de vendredi \u00e0 dimanche, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [lnt.ma]\n-------------------------------------------------\nDes chutes de neige \u00e0 partir de 1 700 m\u00e8tres ainsi que de fortes pluies, parfois orageuses, sont attendues, de samedi \u00e0 dimanche, dans plusieurs provinces du Maroc, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le Royaume sera repr\u00e9sent\u00e9 au\nsein de cette instance charg\u00e9e...", "mass": 5, "physics": false, "shape": "box", "title": "Le Royaume sera repr\u00e9sent\u00e9 au sein de cette instance charg\u00e9e de la sauvegarde et de la restauration du patrimoine culturel mondial par Rabiaa Harrak, architecte en chef au D\u00e9partem. [lematin.ma]\n-------------------------------------------------\nLe Royaume sera repr\u00e9sent\u00e9 au sein de cette instance par Rabiaa Harrak, architecte en chef au D\u00e9partement du patrimoine historique du minist\u00e8re de la Jeunesse, de la Culture et de la Communication, pour un mandat de 4 ans. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Dans le cadre de la\nmise en \u0153uvre des Hautes...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de la mise en \u0153uvre des Hautes Orientations Royales relatives au lancement d\u2019une nouvelle g\u00e9n\u00e9ration de Programmes de d\u00e9veloppement territorial Int\u00e9gr\u00e9 (PDTI), une r\u00e9. [lematin.ma]\n-------------------------------------------------\nCette r\u00e9union a pour objectif d\u2019\u00e9largir et d\u2019approfondir le r\u00f4le des collectivit\u00e9s territoriales dans le processus d\u2019\u00e9laboration et de mise en \u0153uvre de la nouvelle g\u00e9n\u00e9ration de Programmes de d\u00e9veloppement territorial int\u00e9gr\u00e9 (PDTI). [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Casablanca Events Animation annonce l\u2019organisation\nde Winter Africa by WeCasablanca,...", "mass": 5, "physics": false, "shape": "box", "title": "Casablanca Events Animation annonce l\u2019organisation de Winter Africa by WeCasablanca, un \u00e9v\u00e9nement d\u2019envergure appel\u00e9 \u00e0 s\u2019inscrire comme l\u2019un des temps forts de la saison hivernal. [lematin.ma]\n-------------------------------------------------\nCasablanca Events \u0026 Animation, a annonc\u00e9 vendredi, l\u0027organisation du Winter Africa by WeCasablanca, un grand rendez-vous culturel et festif qui se tiendra du 18 d\u00e9cembre 2025 au 17 janvier 2026 au Parc de la Ligue Arabe. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec\nles cinq centrales syndicales repr\u00e9sent\u00e9es...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019accord a \u00e9t\u00e9 sign\u00e9 avec les cinq centrales syndicales repr\u00e9sent\u00e9es au sein de Marsa Maroc, \u00e0 savoir l\u2019UMT, l\u2019ODT, la CDT, la FDT et l\u2019UGTM. [lematin.ma]\n-------------------------------------------------\nL\u2019accord a \u00e9t\u00e9 obtenu apr\u00e8s plusieurs rounds de n\u00e9gociation men\u00e9s dans un esprit de transparence, d\u2019\u00e9coute mutuelle et de responsabilit\u00e9 partag\u00e9e. [telquel.ma]\n-------------------------------------------------\nL\u2019op\u00e9rateur portuaire national a annonc\u00e9, vendredi, la conclusion d\u2019un accord social avec cinq centrales syndicales \u2014 l\u2019UMT, l\u2019ODT, la CDT, la FDT et l\u2019UGTM \u2014 \u00e9tablissant un cadre de paix sociale valable jusqu\u2019\u00e0 la fin de l\u2019ann\u00e9e 2030. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 18, "id": "comm_label_18", "label": "Une enveloppe globale de 1,3\nmilliard de dirhams (MMDH) sera...", "mass": 5, "physics": false, "shape": "box", "title": "Une enveloppe globale de 1,3 milliard de dirhams (MMDH) sera consacr\u00e9e au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me startup marocain dans le cadre de la strat\u00e9gie Maroc Digital 2030, a annonc\u00e9, vendredi \u00e0 Casablanca, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fallah Seghrouchni. [www.lopinion.ma]\n-------------------------------------------------\nUne enveloppe globale de 1,3 milliard de dirhams (MMDH) sera consacr\u00e9e au d\u00e9veloppement de l\u2019\u00e9cosyst\u00e8me startup marocain dans le cadre de la strat\u00e9gie Maroc Digital 2030, a annonc\u00e9, vendredi \u00e0 Casablanca, la ministre d\u00e9l\u00e9gu\u00e9e charg\u00e9e de la Transition num\u00e9rique et de la R\u00e9forme administrative, Amal El Fallah Seghrouchni. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Lors de la s\u00e9ance d\u2019ouverture\ndu 2\u1d49 Forum d\u2019Affaires de...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la s\u00e9ance d\u2019ouverture du 2\u1d49 Forum d\u2019Affaires de la ZLECAF, tenue vendredi \u00e0 Marrakech, Aziz Akhannouch, Ryad Mezzour et Omar Hejira ont mis en avant l\u2019acc\u00e9l\u00e9ration de l\u2019int\u00e9gration \u00e9conomique africaine et r\u00e9affirm\u00e9 l\u2019engagement du Maroc \u00e0 faire de la ZLECAF un levier majeur de d\u00e9veloppement continental.D\u00e9tails. [www.lopinion.ma]\n-------------------------------------------------\nLa Zone de Libre-\u00c9change Continentale Africaine (ZLECAF)constitue un pilier strat\u00e9gique pour le d\u00e9veloppement \u00e9conomique de l\u2019Afrique, a d\u00e9clar\u00e9 vendredi 12 d\u00e9cembre, M. Omar Hejira, secr\u00e9taire d\u2019\u00c9tat marocain charg\u00e9 du Commerce ext\u00e9rieur, lors de la 2\u00e8 \u00e9dition du Forum d\u2019Affaires . [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Maroc et la Banque\neurop\u00e9enne pour la reconstruction et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u0027euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \"Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III\". [www.lopinion.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (1.5 milliards de dirhams), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [telquel.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u00ab Conservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III \u00bb. [aujourdhui.ma]\n-------------------------------------------------\nLe Maroc et la Banque europ\u00e9enne pour la reconstruction et le d\u00e9veloppement (BERD) ont conclu, vendredi \u00e0 Rabat, un contrat de financement de 150 millions d\u2019euros (M\u20ac), soit environ 1,617 milliard de dirhams (MMDH), pour le projet \u201cConservation des eaux de la plaine de Sa\u00efss \u2013 SAISS III\u201d. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande\ndu Roadshow \u00ab Morocco Now...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019occasion de l\u2019\u00e9tape allemande du Roadshow \u00ab Morocco Now \u00bb, des responsables institutionnels et \u00e9conomiques marocains et allemands se sont r\u00e9unis \u00e0 Stuttgart pour mettre en lumi\u00e8re les fondements et les perspectives du partenariat strat\u00e9gique entre les deux pays. [telquel.ma]\n-------------------------------------------------\nPlusieurs institutionnels et op\u00e9rateurs \u00e9conomiques, allemands et marocains, ont pris part, jeudi soir \u00e0 Stuttgart, dans le Bade-Wurtemberg (sud-ouest), \u00e0 la conf\u00e9rence organis\u00e9e dans le cadre de l\u2019\u00e9tape Allemagne du Roadshow \u201cMorocco Now\u201d, destin\u00e9e \u00e0 promouvoir les atouts comp\u00e9titifs du Maroc, son offre industrielle et les perspectives d\u2019investissement que le Royaume propose dans plusieurs secteurs strat\u00e9giques. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "CAN 2025 : \u201cJe me\nsuis bas\u00e9 sur des crit\u00e8res...", "mass": 5, "physics": false, "shape": "box", "title": "CAN 2025 : \u201cJe me suis bas\u00e9 sur des crit\u00e8res objectifs dans le choix des joueurs\u201d, assure Regragui. [telquel.ma]\n-------------------------------------------------\nLe s\u00e9lectionneur national, Walid Regragui, a affirm\u00e9 que le choix des joueurs de l\u2019\u00e9quipe nationale qui prendront part \u00e0 la Coupe d\u2019Afrique des Nations (CAN) au Maroc est bas\u00e9 sur des crit\u00e8res objectifs. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le Conseil d\u2019administration du Groupe\nde la Banque africaine de...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 270 millions d\u2019euros (2,7 milliards de dirhams) au Maroc pour la mise en \u0153uvre du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA). [telquel.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 270 millions d\u2019euros (M\u20ac) au Maroc pour la mise en \u0153uvre du Programme d\u2019extension et de modernisation des infrastructures a\u00e9roportuaires (PEMIA). [leseco.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque africaine de d\u00e9veloppement (BAD) a approuv\u00e9 un financement de 270 millions d\u2019euros (M\u20ac) au Maroc pour la mise en \u0153uvre du Programme d\u2019extension et de modernisation des infrastructures a\u00e9ropor <script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
