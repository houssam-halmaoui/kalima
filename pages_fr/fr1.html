19encre, le Maroc et le S\u00e9n\u00e9gal se retrouvent ce jeudi devant le Tribunal arbitral du sport, \u00e0 Lausanne. [telquel.ma]\n-------------------------------------------------\nLe Tribunal arbitral du sport (TAS) tient aujourdhui \u00e0 Lausanne en Suisse, une audience cruciale sur la finale controvers\u00e9e de la Coupe d\u2019Afrique des nations 2025 entre le Maroc et le S\u00e9n\u00e9gal. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "JESA, acteur majeur dans la\nlivraison de projets et fournisseur...", "mass": 5, "physics": false, "shape": "box", "title": "JESA, acteur majeur dans la livraison de projets et fournisseur de solutions int\u00e9gr\u00e9es au Maroc et en Afrique, accompagne le R\u00e9seau Gazier du S\u00e9n\u00e9gal S.A. (RGS), filiale de PETROSEN HOLDING, dans le d\u00e9veloppement et la pr\u00e9paration \u00e0 l\u2019exploitation du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal, une infrastructure strat\u00e9gique de pr\u00e8s de . [fr.hespress.com]\n-------------------------------------------------\nLa filiale du groupe OCP, JESA, acteur majeur dans la livraison de projets et fournisseur de solutions int\u00e9gr\u00e9es au Maroc et en Afrique, accompagne le R\u00e9seau gazier du S\u00e9n\u00e9gal S.A. (RGS), filiale de Petrosen Holding, dans le d\u00e9veloppement et la pr\u00e9paration \u00e0 l\u2019exploitation du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal. [www.lavieeco.com]\n-------------------------------------------------\nLe groupe d\u2019ing\u00e9nierie JESA, coentreprise entre OCP et Worley, participe au d\u00e9veloppement du futur r\u00e9seau national de transport de gaz naturel du S\u00e9n\u00e9gal, une infrastructure de pr\u00e8s de 400 kilom\u00e8tres destin\u00e9e \u00e0 relier les ressources gazi\u00e8res offshore aux centrales \u00e9lectriques et aux zones in -----------------\nUn pavillon isra\u00e9lien est pr\u00e9sent pour la premi\u00e8re fois au Marrakech Airshow, le salon consacr\u00e9 \u00e0 l\u2019a\u00e9ronautique civile et militaire, \u00ab nouveau signe de rapprochement entre Rabat et Isra\u00ebl \u00bb, a annonc\u00e9 jeudi le minist\u00e8re isra\u00e9lien de la D\u00e9fense. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "Le groupe technologique marocain ABA\nTechnology a r\u00e9v\u00e9l\u00e9 lors du...", "mass": 5, "physics": false, "shape": "box", "title": "Le groupe technologique marocain ABA Technology a r\u00e9v\u00e9l\u00e9 lors du Marrakech Air Show 2026 cinq syst\u00e8mes de d\u00e9fense, de l\u00e9quipement de surveillance aux drones, en passant par une plateforme d\u2019intelligence artificielle reliant donn\u00e9es terrain et op\u00e9rations de commandement, selon un communiqu\u00e9 de l\u2019entreprise. [www.yabiladi.com]\n-------------------------------------------------\nLe groupe technologique marocain ABA Technology a pr\u00e9sent\u00e9, jeudi 8 octobre, \u00e0 l\u2019occasion du Marrakech Air Show 2026, une gamme de syst\u00e8mes destin\u00e9s au secteur de la d\u00e9fense. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "L\u2019ambassade du P\u00e9rou au Royaume\ndu Maroc, en collaboration avec...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019ambassade du P\u00e9rou au Royaume du Maroc, en collaboration avec le Kenzi Tower Hotel \u00e0 Casablanca, pr\u00e9sente la huiti\u00e8me \u00e9dition du Festival gastronomique p\u00e9ruvien, un rendez-vous qui invite \u00e0 d\u00e9couvrir l\u2019extraordinaire diversit\u00e9 culinaire du P\u00e9rou, du 14 au 17 octobre 2026, aux restaurants Skies de l\u2019h\u00f4tel. [aujourdhui.ma]\n-------------------------------------------------\nL\u2019Ambassade du P\u00e9rou au Royaume du Maroc, en collaboration avec le Kenzi Tower Hotel \u00e0 Casablanca, organise la huiti\u00e8me \u00e9dition du Festival gastronomique p\u00e9ruvien, du 14 au 17 octobre 2026, au restaurant lounge SKIES de l\u2019\u00e9tablissement. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Mise en sc\u00e8ne par Benjamin\nElharrar, la pi\u00e8ce r\u00e9unit Samy...", "mass": 5, "physics": false, "shape": "box", "title": "Mise en sc\u00e8ne par Benjamin Elharrar, la pi\u00e8ce r\u00e9unit Samy Berry, Vanessa Fery, Valentin Giard et Audrey David autour d\u2019un d\u00eener qui va rapidement prendre une tournure inattendue ! [www.lavieeco.com]\n-------------------------------------------------\nDans le cadre de la programmation des Th\u00e9\u00e2trales, Top Event Production accueille la nouvelle com\u00e9die d\u2019Amanda Sthers, \u00ab Le R\u00f4ti \u00bb, le jeudi 15 octobre au Studio des Arts Vivants \u00e0 Casablanca. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le secteur a\u00e9ronautique marocain a\nfranchi un saut qualitatif, passant...", "mass": 5, "physics": false, "shape": "box", "title": "Le secteur a\u00e9ronautique marocain a franchi un saut qualitatif, passant de l\u2019assemblage \u00e0 la fabrication et \u00e0 l\u2019ing\u00e9nierie avanc\u00e9e, a affirm\u00e9 mercredi \u00e0 Marrakech Abdeltif Loudyi, ministre d\u00e9l\u00e9gu\u00e9 charg\u00e9 de l\u2019Administration de la D\u00e9fense nationale, \u00e0 l\u2019ouverture de la 8e \u00e9dition du Marrakech Airshow. [www.lavieeco.com]\n-------------------------------------------------\nLe Maroc a accumul\u00e9, au cours des deux derni\u00e8res d\u00e9cennies, des capacit\u00e9s industrielles et technologiques lui permettant de passer \u00e0 la r\u00e9alisation des syst\u00e8mes les plus complexes dans les secteurs de l\u2019a\u00e9ronautique et de la d\u00e9fense, a affirm\u00e9, mercredi \u00e0 Marrakech, le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [www.lereporter.ma]\n-------------------------------------------------\nApr\u00e8s deux d\u00e9cennies de d\u00e9veloppement de son industrie a\u00e9ronautique, le Maroc dispose d\u00e9sormais de capacit\u00e9s lui permettant d\u2019aborder la fabrication, mais aussi la conception de syst\u00e8mes plus complexes, selon le ministre de l\u2019Industrie et du Commerce, Ryad Mezzour. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Plusieurs p\u00e9titionnaires ont condamn\u00e9, mercredi\n7 octobre au si\u00e8ge des...", "mass": 5, "physics": false, "shape": "box", "title": "Plusieurs p\u00e9titionnaires ont condamn\u00e9, mercredi 7 octobre au si\u00e8ge des Nations unies \u00e0 New York, l\u2019enr\u00f4lement et l\u2019embrigadement d\u2019enfants dans les camps de Tindouf, contr\u00f4l\u00e9s par les milices du \u00ab polisario \u00bb. [atlasinfo.fr]\n-------------------------------------------------\nPlusieurs p\u00e9titionnaires ont d\u00e9nonc\u00e9, mercredi au si\u00e8ge des Nations Unies \u00e0 New York, l\u2019enr\u00f4lement et l\u2019embrigadement des enfants dans les camps de Tindouf, contr\u00f4l\u00e9s par les milices du \u00ab polisario \u00bb, tout en tirant la sonnette d\u2019alarme sur l\u2019absence de perspectives pour les jeunes dans ces camps et les risques d\u2019exploitation et de radicalisation qui en d\u00e9coulent. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Le prix a \u00e9t\u00e9 attribu\u00e9\nau Fran\u00e7ais Henri Kagan et...", "mass": 5, "physics": false, "shape": "box", "title": "Le prix a \u00e9t\u00e9 attribu\u00e9 au Fran\u00e7ais Henri Kagan     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
