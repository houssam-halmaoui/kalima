ns le cadre de l\u2019op\u00e9ration\nd\u2019h\u00e9bergement des personnes affect\u00e9es par...", "mass": 5, "physics": false, "shape": "box", "title": "Dans le cadre de l\u2019op\u00e9ration d\u2019h\u00e9bergement des personnes affect\u00e9es par les inondations ayant touch\u00e9 la ville de Ksar El K\u00e9bir, le Centre national d\u2019estivage \u00e0 la for\u00eat diplomatique de Tanger accueille, depuis mardi, des centaines de sinistr\u00e9s. [fr.hespress.com]\n-------------------------------------------------\nLe centre, dont la capacit\u00e9 d\u2019accueil atteint 600 personnes et est situ\u00e9 \u00e0 proximit\u00e9 du Centre hospitalier universitaire Mohammed VI, a re\u00e7u quelque 400 personnes originaires de Ks. [lematin.ma]\n-------------------------------------------------\nDans le cadre de l\u2019op\u00e9ration d\u2019h\u00e9bergement des personnes affect\u00e9es par les inondations ayant touch\u00e9 la ville de Ksar El K\u00e9bir, le Centre national d\u2019estivage \u00e0 la for\u00eat diplomatique de Tanger accueille, depuis mardi, des centaines de sinistr\u00e9s. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_13", "label": "En d\u00e9pit d\u2019un taux de\nremplissage qui exc\u00e8de largement les...", "mass": 5, "physics": false, "shape": "box", "title": "En d\u00e9pit d\u2019un taux de remplissage qui exc\u00e8de largement les normales saisonni\u00e8res depuis le 6 janvier dernier, le barrage Oued El Makhazine ne pr\u00e9sente absolument aucun dysfonctionnement technique. [fr.hespress.com]\n-------------------------------------------------\nLa situation hydrologique exceptionnelle observ\u00e9e dans le nord du Royaume place le barrage Oued El Makhazine au c\u0153ur des pr\u00e9occupations, alors que les fortes pr\u00e9cipitations enregis. [lematin.ma]\n-------------------------------------------------\nAucun dysfonctionnement ou signes inhabituels n\u2019ont \u00e9t\u00e9 enregistr\u00e9s \u00e0 l\u2019heure actuelle, au niveau du barrage Oued El Makhazine et ses \u00e9quipements, en d\u00e9pit du d\u00e9passement de son taux normal de remplissage depuis le 06 janvier dernier, a affirm\u00e9, mercredi \u00e0 Rabat, le Directeur g\u00e9n\u00e9ral de l\u2019Hydraulique au minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, Salaheddine Dahbi.. [telquel.ma]\n-------------------------------------------------\nLe Directeur g\u00e9n\u00e9ral de l\u0027Hydraulique au minist\u00e8re de l\u2019\u00c9quipement et de l\u0027Eau a fait le point sur la situation du barrage dont le taux de remplissage exc\u00e8de la capacit\u00e9 normale. [www.lavieeco.com]\n-------------------------------------------------\nAucun dysfonctionnement ou signes inhabituels n\u2019ont \u00e9t\u00e9 enregistr\u00e9s \u00e0 l\u2019heure actuelle, au niveau du barrage Oued El Makhazine et ses \u00e9quipements, en d\u00e9pit du d\u00e9passement de son taux normal de remplissage depuis le 06 janvier dernier, a affirm\u00e9, mercredi \u00e0 Rabat, le Directeur g\u00e9n\u00e9ral de l\u2019Hydraulique au minist\u00e8re de l\u2019\u00c9quipement et de l\u2019Eau, Salaheddine Dahbi. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le classement du programme international\nBest Places to Work est...", "mass": 5, "physics": false, "shape": "box", "title": "Le classement du programme international Best Places to Work est \u00e9tabli sur la base de plusieurs crit\u00e8res, parmi lesquels la culture d\u2019entreprise, les conditions de travail, les pr. [lematin.ma]\n-------------------------------------------------\nLe programme international \u201cBest Places to Work\u201d a d\u00e9voil\u00e9 hier les r\u00e9sultats du Classement des Meilleurs Employeurs au Maroc 2025, mettant \u00e0 l\u2019honneur les organisations qui se distinguent par la qualit\u00e9 exceptionnelle de leurs environnements de travail. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 22, "id": "comm_label_22", "label": "Organis\u00e9e par le Secr\u00e9taire d\u2019Etat\nam\u00e9ricain, Marco Rubio, l\u2019objectif de...", "mass": 5, "physics": false, "shape": "box", "title": "Organis\u00e9e par le Secr\u00e9taire d\u2019Etat am\u00e9ricain, Marco Rubio, l\u2019objectif de cette r\u00e9union \u00e9tait d\u2019\u00e9changer sur les solutions permettant de s\u00e9curiser et diversifier les cha\u00eenes d\u0027a. [lematin.ma]\n-------------------------------------------------\nCette rencontre organis\u00e9e par le Secr\u00e9taire d\u2019Etat am\u00e9ricain, Marco Rubio, a r\u00e9uni des ministres des Affaires \u00e9trang\u00e8res et de hauts responsables de plus d\u2019une cinquantaine de pays. [www.lavieeco.com]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a particip\u00e9, mercredi \u00e0 Washington, \u00e0 une r\u00e9union minist\u00e9rielle sur les min\u00e9raux critiques. [maroc-diplomatique.net]\n-------------------------------------------------\nLe ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u00e0 l\u2019\u00e9tranger, M. Nasser Bourita, a particip\u00e9, mercredi \u00e0 Washington, \u00e0 une r\u00e9union minist\u00e9rielle sur les min\u00e9raux critiques L\u2019article est apparu en premier sur . [atlasinfo.fr]\n-------------------------------------------------\nSous le leadership du Roi Mohammed VI, le Maroc s\u2019impose comme un partenaire strat\u00e9gique cr\u00e9dible et responsable dans le domaine des min\u00e9raux critiques, a affirm\u00e9 le ministre des Affaires \u00e9trang\u00e8res, de la Coop\u00e9ration africaine et des Marocains r\u00e9sidant \u     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
