es courses via son application \u00e0 Casablanca et Marrakech. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "La collaboration avec le Maroc\nest non pas \u00e0 inventer,...", "mass": 5, "physics": false, "shape": "box", "title": "La collaboration avec le Maroc est non pas \u00e0 inventer, mais elle est \u00e0 faire vivre encore plus \u00bb, a d\u00e9clar\u00e9 \u00e0 la presse Lucas Philippe, \u00e9lu \u00e0 la t\u00eate de. [telquel.ma]\n-------------------------------------------------\nLe Fran\u00e7ais Lucas Philippe, a \u00e9t\u00e9 \u00e9lu, jeudi 27 novembre, nouveau pr\u00e9sident d\u2019Interpol pour un mandat de quatre ans, lors de la 93\u00e8me Assembl\u00e9e g\u00e9n\u00e9rale de l\u2019Organisation internationale [www.challenge.ma]\n-------------------------------------------------\nLe Fran\u00e7ais Lucas Philippe, qui succ\u00e8de dans ce poste \u00e0 Ahmed Naser Al-Raisi des \u00c9mirats Arabes Unis, dont le mandat est arriv\u00e9 \u00e0 son terme, affirme que la coop\u00e9ration de l\u2019organisation avec le Maroc \u00ab n\u2019est pas \u00e0 inventer, mais \u00e0 faire vivre \u00bb. [www.lavieeco.com]\n-------------------------------------------------\nLe nouveau pr\u00e9sident de l\u2019Organisation internationale de police criminelle (INTERPOL), Lucas Philippe, a promis, depuis Marrakech, de renforcer davantage la coop\u00e9ration s\u00e9curitaire avec le Maroc. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Le Bureau central d\u2019investigations judiciaires\n(BCIJ) a proc\u00e9d\u00e9, mardi, sur...", "mass": 5, "physics": false, "shape": "box", "title": "Le Bureau central d\u2019investigations judiciaires (BCIJ) a proc\u00e9d\u00e9, mardi, sur la base d\u2019informations pr\u00e9cises fournies par les Services centraux de la Direction g\u00e         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                        communities[groupId] = {nodes: [], x: 0, y: 0};

                    communities[groupId].y += node.y;
