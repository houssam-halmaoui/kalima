-systeme-scolaire/", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Voici les principaux titres d\u00e9velopp\u00e9s\npar la presse nationale de...", "mass": 5, "physics": false, "shape": "box", "title": "Voici les principaux titres d\u00e9velopp\u00e9s par la presse nationale de ce mardi 9 juin 2026 Le Matin \u2022 Le Roi Mohammed VI a re\u00e7u, lundi au Palais Royal de Rabat, l\u2019alpiniste marocaine Nawal Sfendla, qui a r\u00e9cemment encha\u00een\u00e9 les ascensions de l\u2019Everest et du Lhotse d\u2019une seule traite. [fr.hespress.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI, que Dieu L\u2019assiste, a re\u00e7u, lundi au Palais Royal de Rabat, l\u2019alpiniste marocaine Nawal Sfendla, qui a r\u00e9cemment encha\u00een\u00e9 les ascensions de l\u2019Everest. [lematin.ma]\n-------------------------------------------------\nLe roi Mohammed VI a re\u00e7u, lundi au Palais Royal de Rabat, l\u2019alpiniste marocaine Nawal Sfendla, qui a r\u00e9cemment encha\u00een\u00e9 les ascensions de l\u2019Everest et du Lhotse d\u2019une seule traite. [telquel.ma]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a re\u00e7u, lundi au Palais Royal de Rabat, l\u2019alpiniste marocaine Nawal Sfendla, auteure de l\u2019ascension successive de l\u2019Everest et du Lhotse. [www.lavieeco.com]\n-------------------------------------------------\nSM le Roi Mohammed VI a re\u00e7u, lundi au Palais Royal de Rabat, l\u2019alpiniste marocaine Nawal Sfendla, auteure d\u2019un exploit in\u00e9dit pour l\u2019alpinisme marocain apr\u00e8s avoir r\u00e9ussi l\u2019ascension de l\u2019Everest (8.849 m\u00e8tres) et du Lhotse (8.516 m\u00e8tres), deux des plus hauts sommets du monde, au cours d\u2019une m\u00eame exp\u00e9dition. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "Le chef du gouvernement, Aziz\nAkhannouch, a fait de la...", "mass": 5, "physics": false, "shape": "box", "title": "Le chef du gouvernement, Aziz Akhannouch, a fait de la croissance \u00e9conomique l\u2019un des principaux arguments de d\u00e9fense de son bilan, lundi, lors de la s\u00e9ance mensuelle consacr\u00e9e \u00e0 la politique g\u00e9n\u00e9rale \u00e0 la Chambre des repr\u00e9sentants. [fr.hespress.com]\n-------------------------------------------------\nLe nombre des \u00e9coles communautaires est pass\u00e9 de 226 en 2021 \u00e0 349 durant l\u2019ann\u00e9e scolaire actuelle 2025-2026, a affirm\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants, le Chef du gouvernement, Aziz Akhannouch. [aujourdhui.ma]\n-------------------------------------------------\nDevant la Chambre des repr\u00e9sentants, Aziz Akhannouch a d\u00e9fendu les choix du gouvernement en mati\u00e8re d\u2019\u00e9ducation, en mettant l\u2019accent sur le d\u00e9veloppement des \u00e9coles communautaires, la cr\u00e9ation de nouveaux \u00e9tablissements et la r\u00e9duction de la surcharge dans les classes. [www.lavieeco.com]\n-------------------------------------------------\nPr\u00e8s de 3,4 millions d\u2019\u00e9l\u00e8ves ont b\u00e9n\u00e9fici\u00e9 de l\u2019aide sociale directe au titre de l\u2019ann\u00e9e scolaire 2025-2026, contre 2,7 millions lors de l\u2019ann\u00e9e scolaire pr\u00e9c\u00e9dente, a affirm\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants, le Chef du gouvernement, Aziz Akhannouch. [telquel.ma]\n-------------------------------------------------\nLe chef du gouvernement, Aziz Akhannouch, a pr\u00e9sent\u00e9 lundi devant la Chambre des repr\u00e9sentants un bilan des r\u00e9formes engag\u00e9es dans le secteur de l\u2019\u00e9ducation et de la formation, mettant en avant les r\u00e9sultats enregistr\u00e9s en mati\u00e8re de g\u00e9n\u00e9ralisation de l\u2019enseignement, d\u2019am\u00e9lioration des infrastructures, de r\u00e9duction du d\u00e9crochage scolaire et de renforcement des dispositifs de soutien . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "La session ordinaire de l\u2019examen\nnational unifi\u00e9 du baccalaur\u00e9at 2026...", "mass": 5, "physics": false, "shape": "box", "title": "La session ordinaire de l\u2019examen national unifi\u00e9 du baccalaur\u00e9at 2026 s\u2019est d\u00e9roul\u00e9e dans de bonnes conditions, selon le minist\u00e8re de l\u2019\u00c9ducation nationale. [lematin.ma]\n-------------------------------------------------\nLa session ordinaire de l\u2019examen national unifi\u00e9 du Baccalaur\u00e9at, tenue du 4 au 6 juin, s\u2019est d\u00e9roul\u00e9e dans de bonnes conditions, tant sur le plan p\u00e9dagogique qu\u2019organisationnel, a indiqu\u00e9, dimanche, le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports. [www.lereporter.ma]\n-------------------------------------------------\nLa session ordinaire de l\u2019examen national unifi\u00e9 du baccalaur\u00e9at 2026 s\u2019est d\u00e9roul\u00e9e dans de bonnes conditions sur les plans p\u00e9dagogique et organisationnel, a indiqu\u00e9 le minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 l\u2019issue des \u00e9preuves organis\u00e9es du 4 au 6 juin. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Les discussions entre les deux\nparties ont port\u00e9 sur le...", "mass": 5, "physics": false, "shape": "box", "title": "Les discussions entre les deux parties ont port\u00e9 sur le r\u00f4le majeur et la contribution substantielle et exemplaire du Royaume du Maroc au sein des Op\u00e9rations de maintien de la paix. [lematin.ma]\n-------------------------------------------------\nLe ministre des Affaires \u00         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;

                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }

                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
