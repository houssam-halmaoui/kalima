te Virtuelle, une solution enti\u00e8rement d\u00e9mat\u00e9rialis\u00e9e d\u00e9di\u00e9e aux paiements [www.challenge.ma]\n-------------------------------------------------\nDans le cadre de sa strat\u00e9gie de transformation digitale et d\u2019innovation continue, Attijariwafa bank annonce le lancement de la Carte Virtuelle, une solution enti\u00e8rement d\u00e9mat\u00e9rialis\u00e9e d\u00e9di\u00e9e aux paiements en ligne. [www.lavieeco.com]\n-------------------------------------------------\nDans le cadre de sa strat\u00e9gie de transformation digitale et d\u2019innovation continue, Attijariwafa bank annonce le lancement de la Carte Virtuelle, une solution enti\u00e8rement d\u00e9mat\u00e9rialis\u00e9e d\u00e9di\u00e9e aux paiements en ligne. [leseco.ma]\n-------------------------------------------------\nAttijariwafa bank a annonc\u00e9 le lancement d\u2019une nouvelle solution de paiement enti\u00e8rement d\u00e9mat\u00e9rialis\u00e9e, baptis\u00e9e \u00ab Carte Virtuelle \u00bb, destin\u00e9e aux transactions en ligne et accessible exclusivement via son application mobile. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "Le m\u00e9dia marocain Campus Mag\na d\u00e9voil\u00e9 \u00e0 Casablanca les...", "mass": 5, "physics": false, "shape": "box", "title": "Le m\u00e9dia marocain Campus Mag a d\u00e9voil\u00e9 \u00e0 Casablanca les r\u00e9sultats de la troisi\u00e8me \u00e9dition du classement \u00ab Top School in Morocco \u00bb, pr\u00e9sent\u00e9 en marge du salon Master Plus organis\u00e9 \u00e0. [lematin.ma]\n-------------------------------------------------\nLa troisi\u00e8me \u00e9dition du classement Top School in Morocco a d\u00e9voil\u00e9 cette semaine ses r\u00e9sultats \u00e0 Casablanca, en marge du salon Master Plus organis\u00e9 \u00e0 l\u2019\u00c9cole Centrale Casablanca. [telquel.ma]\n-------------------------------------------------\nLa troisi\u00e8  [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Ce qu\u0027a fait le Maroc,\nsous la conduite de Sa...", "mass": 5, "physics": false, "shape": "box", "title": "Ce qu\u0027a fait le Maroc, sous la conduite de Sa Majest\u00e9 le Roi Mohammed VI, est une r\u00e9volution incroyable, a estim\u00e9 Emmanuel Macron, qui intervenait lors de la cl\u00f4tur. [lematin.ma]\n-------------------------------------------------\nLe Pr\u00e9sident fran\u00e7ais a hautement salu\u00e9, ce lundi \u00e0 Nairobi, la r\u00e9volution qu\u2019a connue le syst\u00e8me marocain d\u2019enseignement, sous la conduite de Sa Majest\u00e9 le Roi Mohammed VI. [www.lavieeco.com]\n-------------------------------------------------\nLe Pr\u00e9sident fran\u00e7ais Emmanuel Macron a affirm\u00e9, lundi \u00e0 Nairobi, que les r\u00e9alisations accomplies par le syst\u00e8me d\u2019\u00e9ducation au Maroc, sous la conduite de Sa Majest\u00e9 le Roi Mohammed VI, constituent \u201cun mod\u00e8le extraordinaire\u201d pour le continent africain. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Dans ce message, Sa Majest\u00e9\nle Roi affirme avoir appris...", "mass": 5, "physics": false, "shape": "box", "title": "Dans ce message, Sa Majest\u00e9 le Roi affirme avoir appris avec une vive \u00e9motion et une profonde affliction la triste nouvelle du d\u00e9c\u00e8s de feu Ali Fassi Fihri, que Dieu l\u2019accueille da. [lematin.ma]\n-------------------------------------------------\nDans ce message, le roi affirme avoir appris \u00ab avec une vive \u00e9motion et une profonde affliction la triste nouvelle du d\u00e9c\u00e8s de feu Ali Fassi Fihri, que Dieu l\u2019accueille dans Son vaste. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": ]\n-------------------------------------------------\nDu 13 mai au 2 juin, seize s\u00e9lections du continent se donneront rendez-vous pour tenter de d\u00e9crocher le prestigieux Troph\u00e9e continental, mais aussi l\u2019une des places qualificatives pour la prochaine Coupe du monde U17 pr\u00e9vue au Qatar. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "La session 2026 des examens\ndu baccalaur\u00e9at sera marqu\u00e9e par...", "mass": 5, "physics": false, "shape": "box", "title": "La session 2026 des examens du baccalaur\u00e9at sera marqu\u00e9e par la mise en place d\u2019un nouveau dispositif num\u00e9rique destin\u00e9 \u00e0 renforcer le suivi du d\u00e9roulement des examens et \u00e0 r\u00e9duire les \u201cerreurs\u201d de gestion, a indiqu\u00e9 le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports, Mohamed Saad Berrada, lundi \u00e0 la Chambre des repr\u00e9sentants.. [telquel.ma]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9ducation a soulign\u00e9 au Parlement que cette mesure intervient vu le nombre important de candidats estim\u00e9 \u00e0 520.000 et a pr\u00e9cis\u00e9 qu\u2019une nouvelle m\u00e9thode num\u00e9rique sera adopt\u00e9e, permettant de doter chaque candidat d\u2019un identifiant et d\u2019un code QR pour suivre les diff\u00e9rentes \u00e9tapes de l\u2019examen et du processus de correction. [www.lavieeco.com]\n-------------------------------------------------\nLa session 2026 des examens du baccalaur\u00e9at sera marqu\u00e9e par la mise en place d\u2019un nouveau dispositif num\u00e9rique destin\u00e9 \u00e0 renforcer le suivi du d\u00e9roulement des examens et \u00e0 r\u00e9duire les \u00ab erreurs \u00bb de gestion, a indiqu\u00e9 le ministre de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports, Mohamed Saad Berrada, lundi \u00e0 la Chambre des repr\u00e9sentants. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "Quelque 502.000 personnes, tous \u00e2ges\nconfondus, ont visit\u00e9 le 31e...", "mass": 5, "physics": false, "shape": "box", "title": "Quelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [telquel.ma]\n-------------------------------------------------\nQuelque 502.000 personnes, tous \u00e2ges confondus, ont visit\u00e9 le 31e Salon international de l\u2019\u00e9dition et du livre (SIEL), qui a pris fin dimanche, a annonc\u00e9 le minist\u00e8re de la Jeunesse, de la Culture et de la Communication. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "La Fondation T\u00e9nor pour la\nCulture organise, sous l\u2019\u00e9gide de...", "mass": 5, "physics": false, "shape": "box", "title": "La Fondation T\u00e9nor pour la Culture organise, sous l\u2019\u00e9gide de la Fondation de l\u2019Acad\u00e9mie du Royaume du Maroc, la 23\u1d49 \u00e9dition du Concours national de musique du Maroc (CNMM), d\u00e9di\u00e9e \u00e0 la promotion des talents musicaux \u00e0 l\u2019\u00e9chelle nationale. [telquel.ma]\n-------------------------------------------------\nComp\u00e9tition La Fondation T\u00e9nor pour la Culture organise sous l\u2019\u00e9gide de la Fondation de l\u2019Acad\u00e9mie du Royaume du Maroc la 23e \u00e9dition du Concours National de Musique du Maroc (CNMM), un rendez-vous incontournable d\u00e9di\u00e9 \u00e0 la promotion des talents musicaux \u00e0 l\u2019\u00e9chelle nationale. [aujourdhui.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 13, "id": "comm_label_1     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
