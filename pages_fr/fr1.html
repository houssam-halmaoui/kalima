----------------------\nLors d\u0027une audience au Palais de Lusail, M. Akhannouch a pr\u00e9sent\u00e9 les condol\u00e9ances de Sa Majest\u00e9 le Roi \u00e0 l\u2019\u00c9mir de l\u2019\u00c9tat du Qatar, Son Altesse Cheikh Tamim Bin Hamad Al-Thani. [lematin.ma]\n-------------------------------------------------\nSur Hautes Instructions Royales, le Chef du gouvernement, Aziz Akhannouch, a repr\u00e9sent\u00e9, lundi \u00e0 Doha, Sa Majest\u00e9 le Roi Mohammed VI \u00e0 la pr\u00e9sentation des condol\u00e9ances \u00e0 la suite du d\u00e9c\u00e8s de Son Altesse Cheikh Hamad Bin Khalifa Al-Thani. [www.lavieeco.com]\n-------------------------------------------------\nSa Majest\u00e9 le Roi Mohammed VI a adress\u00e9 un message de condol\u00e9ances et de compassion \u00e0 l\u2019\u00c9mir de l\u2019\u00c9tat du Qatar, SA Cheikh Tamim Bin Hamad Al-Thani, \u00e0 la suite du d\u00e9c\u00e8s de son p\u00e8re, SA Cheikh Hamad Bin Khalifa Al-Thani. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Le s\u00e9lectionneur national Mohamed Ouahbi\nanimera, mardi au Complexe Mohammed...", "mass": 5, "physics": false, "shape": "box", "title": "Le s\u00e9lectionneur national Mohamed Ouahbi animera, mardi au Complexe Mohammed VI de football, une conf\u00e9rence de presse consacr\u00e9e au parcours de la s\u00e9lection marocaine lors de la Coupe du monde 2026. [fr.hespress.com]\n-------------------------------------------------\nLa F\u00e9d\u00e9ration royale marocaine de football (FRMF) a annonc\u00e9, ce lundi, la tenue d\u2019une conf\u00e9rence de presse du s\u00e9lectionneur national, Mohamed Ouahbi, apr\u00e8s l\u2019\u00e9limination des Lions de l\u2019Atlas en quart de finale de la Coupe du monde 2026. [telquel.ma]\n-------------------------------------------------\nL\u2019\u00e9limination des Lions de l\u2019Atlas en quarts de finale du Mondial 2026 face \u00e0 la France (2-0) cl\u00f4t une \u00e9pop\u00e9e qui, loin d\u2019\u00eatre un \u00e9chec, constitue un jalon dans la confirmation du nouveau statut du football marocain. [leseco.ma]\n-------------------------------------------------\nMardi 14 juillet \u00e0 17h00, le s\u00e9lectionneur national Mohamed Ouahbi tiendra une conf\u00e9rence de presse pour dresser le bilan de la participation des Lions de l\u0027Atlas \u00e0 la Coupe du monde 2026. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Le pr\u00e9sident am\u00e9ricain, Donald Trump,\na annonc\u00e9 lundi r\u00e9tablir le...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident am\u00e9ricain, Donald Trump, a annonc\u00e9 lundi r\u00e9tablir le blocus des ports iraniens et d\u00e9clar\u00e9 vouloir instaurer une taxe pour les navires souhaitant traverser le d\u00e9troit d\u2019Ormuz, voie maritime strat\u00e9gique qui cristallise les affrontements avec l\u2019Iran. [fr.hespress.com]\n-------------------------------------------------\nWashington, 13/07/2026 (MAP) \u2013 Le pr\u00e9sident Donald Trump a annonc\u00e9, lundi, le r\u00e9tablissement du blocus maritime contre l\u2019Iran dans le d\u00e9troit d\u2019Ormuz, o\u00f9 les Etats-Unis seront d\u00e9sormais les \u00ab gardiens \u00bb de ce passage maritime moyennant une taxe de 20% sur toutes les marchandises qui y transitent. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9\nd\u2019abaisser, \u00e0 partir du 1er...", "mass": 5, "physics": false, "shape": "box", "title": "Bank Al-Maghrib (BAM) a d\u00e9cid\u00e9 d\u2019abaisser, \u00e0 partir du 1er octobre 2026, le plafond g\u00e9n\u00e9ral des frais d\u2019interchange mon\u00e9tique domestique de 0,65% \u00e0 0,5% (hors taxes), en vertu de sa D\u00e9cision R\u0         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }

    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
