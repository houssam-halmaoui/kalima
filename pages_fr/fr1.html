": "Le spot de la campagne internationale \u00ab Maroc, Terre de Lumi\u00e8re \u00bb de l\u2019ONMT est diffus\u00e9 sur l\u2019\u00e9cran ext\u00e9rieur monumental du Stade Prince Moulay Abdellah de Rabat, l\u2019une des enceintes [www.challenge.ma]\n-------------------------------------------------\nLe spot de la campagne internationale \"Maroc, Terre de Lumi\u00e8re\" de l\u2019ONMT est diffus\u00e9 sur l\u2019\u00e9cran ext\u00e9rieur monumental du Stade Prince Moulay Abdellah de Rabat, l\u2019une des enceintes sportives les plus embl\u00e9matiques du Royaume et une vitrine urbaine de tout premier plan qui contribue au rayonnement du Maroc. [leseco.ma]\n-------------------------------------------------\nLa diffusion de la campagne de l\u2019ONMT sur l\u2019\u00e9cran ext\u00e9rieur du stade Prince Moulay Abdellah offre une visibilit\u00e9 exceptionnelle aux images du Maroc. [lematin.ma]\n-------------------------------------------------\nLa campagne \u201cMaroc, Terre de lumi\u00e8re\u201d de l\u2019ONMT illumine la fa\u00e7ade du Stade Prince Moulay Abdellah \u00e0 Rabat. [www.libe.ma]\n-------------------------------------------------\nLe spot de la campagne internationale \u00ab Maroc, Terre de Lumi\u00e8re \u00bb de l\u2019ONMT est diffus\u00e9 sur l\u2019\u00e9cran ext\u00e9rieur monumental du Stade Prince Moulay Abdellah de Rabat, l\u2019une des enceintes sportives les plus embl\u00e9matiques du Royaume et une vitrine urbaine de tout premier plan qui contribue au rayonnement du Maroc. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Duel haletant L\u2019\u00e9quipe \u00e9gyptienne de\nfootball s\u2019est qualifi\u00e9e pour les...", "mass": 5, "physics": false, "shape": "box", "title": "Duel haletant L\u2019\u00e9quipe \u00e9gyptienne de football s\u2019est qualifi\u00e9e pour les demi-finales de la CAN Maroc-2025 en s\u2019imposant face \u00e0 s omologue belge, Annelies Verlinden, des moyens de hisser la coop\u00e9ration juridique et judiciaire entre les deux pays \u00e0 un niveau sup\u00e9rieur et de renforcer la coordination sur les questions d\u2019int\u00e9r\u00eat commun. [www.lopinion.ma]\n-------------------------------------------------\nLe ministre de la Justice, Abdellatif Ouahbi, s\u2019est entretenu, lundi \u00e0 Bruxelles, avec son homologue belge, Annelies Verlinden, des moyens de hisser la coop\u00e9ration juridique et judiciaire entre les deux pays \u00e0 un niveau sup\u00e9rieur et de renforcer la coordination sur les questions d\u2019int\u00e9r\u00eat commun. [telquel.ma]\n-------------------------------------------------\nDans le cadre du renforcement des relations de coop\u00e9ration bilat\u00e9rale, le ministre de la Justice du Royaume du Maroc, Abdellatif Ouahbi, a effectu\u00e9 une visite de travail en Belgique, au cours de laquelle il a eu des entretiens officiels avec son homologue, la ministre de la Justice du Royaume de Belgique, Annelies Verlinden. [www.lavieeco.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "Au d\u00e9but de ses travaux,\nle Conseil de gouvernement examinera...", "mass": 5, "physics": false, "shape": "box", "title": "Au d\u00e9but de ses travaux, le Conseil de gouvernement examinera un projet de loi relatif \u00e0 l\u2019accr\u00e9ditation des organismes d\u2019\u00e9valuation de la conformit\u00e9.Le Conseil se penchera par la. [lematin.ma]\n-------------------------------------------------\nAu d\u00e9but de ses travaux, le Conseil examinera un projet de loi relatif \u00e0 l\u2019accr\u00e9ditation des organismes d\u2019\u00e9valuation de la conformit\u00e9. [telquel.ma]\n-------------------------------------------------\nAu d\u00e9but de ses travaux, le Conseil examinera un projet de loi relatif \u00e0 l\u2019accr\u00e9ditation des organismes d\u2019\u00e9valuation de <script>

        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');

            tooltip.style.display = 'none';
        }

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
