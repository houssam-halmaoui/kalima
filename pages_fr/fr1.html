de-deja-vu.html", "x": 0, "y": 0}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 0, "id": "comm_label_0", "label": "Une vague de chaleur et\nde fortes rafales de vent...", "mass": 5, "physics": false, "shape": "box", "title": "Une vague de chaleur et de fortes rafales de vent sont attendues dans plusieurs provinces du Royaume \u00e0 partir de ce vendredi, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau de vigilance orange. [fr.hespress.com]\n-------------------------------------------------\nUne vague de chaleur et de fortes rafales de vent sont attendues dans plusieurs provinces du Royaume \u00e0 partir de ce vendredi, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin d\u2019alerte de niveau de vigilance orange. [telquel.ma]\n-------------------------------------------------\nUne vague de chaleur et de fortes rafales de vent sont attendues dans plusieurs provinces du Maroc \u00e0 partir de ce vendredi, indique la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM) dans un bulletin dalerte de niveau de vigilance orange. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Jeudi soir, Anfa Park a\nvibr\u00e9 au rythme d\u2019une programmation...", "mass": 5, "physics": false, "shape": "box", "title": "Jeudi soir, Anfa Park a vibr\u00e9 au rythme d\u2019une programmation exceptionnelle port\u00e9e par deux univers radicalement diff\u00e9rents mais tout aussi f\u00e9d\u00e9rateurs. [fr.hespress.com]\n-------------------------------------------------\nPour son premier show au Maroc, la star britannique a livr\u00e9 un concert pens\u00e9 comme une grande c\u00e9l\u00e9bra. [lematin.ma]\n-------------------------------------------------\nLe rideau sest lev\u00e9 sur la 19e \u00e9dition du festival Jazzablanca, jeudi \u00e0 Anfa Park \u00e0 Casablanca, avec un show \u00e9poustouflant pr\u00e9sent\u00e9 par des artistes aux univers musicaux divers, dont la star mondiale Robbie Williams. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "Selon l\u0027Organisation m\u00e9t\u00e9orologique mondiale (OMM),\ndes conditions El Ni\u00f1o sont...", "mass": 5, "physics": false, "shape": "box", "title": "Selon l\u0027Organisation m\u00e9t\u00e9orologique mondiale (OMM), des conditions El Ni\u00f1o sont apparues dans le Pacifique tropical et devraient se renforcer rapidement ces prochains moi. [lematin.ma]\n-------------------------------------------------\nL\u2019ONU a alert\u00e9 vendredi sur un renforcement rapide du ph\u00e9nom\u00e8ne climatique naturel El Ni\u00f1o en cours qui devrait atteindre une \u00ab forte intensit\u00e9 \u00bb entre juillet et septembre (niveau 3 sur 4), augmentant la probabilit\u00e9 de ph\u00e9nom\u00e8nes m\u00e9t\u00e9orologiques extr\u00eames dans le monde. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 15, "id": "comm_label_15", "label": "Cet investissement dans les infrastructures\nd\u2019\u00e9nergie propre, l\u2019un des plus...", "mass": 5, "physics": false, "shape": "box", "title": "Cet investissement dans les infrastructures d\u2019\u00e9nergie propre, l\u2019un des plus importants en Afrique, permettra de renforcer la fiabilit\u00e9 et la r\u00e9silience du syst\u00e8me \u00e9lectrique maroca. [lematin.ma]\n-------------------------------------------------\nLe Conseil d\u2019administration du Groupe de la Banque mondiale a approuv\u00e9, le 1er juillet 2026, un financement de 265 millions de dollars (environ 2,4 milliards de dirhams) pour le projet de station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, dans le nord du Maroc. [telquel.ma]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9, mercredi, un financement de 265 millions de dollars pour la Station de transfert d\u0027\u00e9nergie par pompage (STEP) d\u0027Ifahsa, pr\u00e8s de Chefchaouen, l\u0027un des plus importants investissements en \u00e9nergie propre en Afrique. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil des administrateurs de la Banque mondiale a approuv\u00e9 mercredi un financement de 265 millions de dollars en faveur du projet de Station de transfert d\u2019\u00e9nergie par pompage (STEP) d\u2019Ifahsa, situ\u00e9 dans le nord du Maroc, indique le Groupe de la Banque mondiale dans un communiqu\u00e9. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 4, "id": "comm_label_4", "label": "AXA Assurance Maroc d\u00e9voile sa\npremi\u00e8re campagne de marque panafricaine,...", "mass": 5, "physics": false, "shape": "box", "title": "AXA Assurance Maroc d\u00e9voile sa premi\u00e8re campagne de marque panafricaine, une initiative qui place la solidarit\u00e9 interg\u00e9n\u00e9rationnelle au c\u0153ur de son discours. [lematin.ma]\n-------------------------------------------------\nCette initiative, premi\u00e8re campagne panafricaine de la marque con\u00e7ue au Maroc, sera progressivement d\u00e9ploy\u00e9e dans plusieurs pays du continent apr\u00e8s son lancement sur le march\u00e9 marocain. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "Lors de la Coupe du\nmonde 2022, les Marocains s\u2019\u00e9taient...", "mass": 5, "physics": false, "shape": "box", "title": "Lors de la Coupe du monde 2022, les Marocains s\u2019\u00e9taient impos\u00e9s (2-1) gr\u00e2ce \u00e0 Hakim Ziyech et Youssef En-Nesyri. [telquel.ma]\n-------------------------------------------------\nMondial 2026: Maroc-Canada Le ions d\u2019investissement repr\u00e9sentant un montant global de pr\u00e8s de 42 milliards de dirhams (MMDH), ainsi que neuf avenants \u00e0 des conventions existantes dans le cadre du dispositif principal de la nouvelle Charte . [lnt.ma]\n-------------------------------------------------\nR\u00e9unie jeudi 2 juillet \u00e0 Rabat, sous la pr\u00e9sidence du chef de gouvernement Aziz Akhannouch, la 11\u00e8me Commission nationale des investissements (CNI) a approuv\u00e9 29 projets de conventions [www.challenge.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Ce projet de loi est\nporteur d\u2019une r\u00e9forme substantielle du...", "mass": 5, "physics": false, "shape": "box", "title": "Ce projet de loi est porteur d\u2019une r\u00e9forme substantielle du HCP qui sera ainsi transform\u00e9 en une instance de bonne gouvernance dot\u00e9e de la personnalit\u00e9 morale et de l\u2019autonomie administrative. [telquel.ma]\n-------------------------------------------------\nLe Conseil de gouvernement a approuv\u00e9, jeudi, le projet de loi 047.26 relatif au Haut-Commissariat au plan (HCP), pr\u00e9sent\u00e9 par le ministre de lInt\u00e9rieur. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Conseil de gouvernement a\nadopt\u00e9, jeudi \u00e0 Rabat, le...", "mass": 5, "physics": false, "shape": "box", "title": "Le Conseil de gouvernement a adopt\u00e9, jeudi \u00e0 Rabat, le projet de loi N\u00b0 051.26 relatif \u00e0 l\u2019organisation de la profession d\u2019adoul, pr\u00e9sent\u00e9 par le ministre de la Justice. [telquel.ma]\n-------------------------------------------------\nPr\u00e9sent\u00e9 par le ministre de la Justice, ce texte vise \u00e0 tirer les cons\u00e9quences juridiques de la d\u00e9cision de la Cour constitutionnelle concernant la loi n\u00b0 16.22 sur     <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
