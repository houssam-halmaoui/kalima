e du Mondial en disposant du Mali sur le score de 3 buts \u00e0 2, mardi \u00e0 Doha. [lematin.ma]\n-------------------------------------------------\nL\u2019\u00e9quipe nationale du Maroc des moins de 17 ans s\u2019est qualifi\u00e9e aux quarts de finale de la Coupe du monde de football en battant son homologue malienne sur le score de 3 buts \u00e0 2, en match des 8es de finale disput\u00e9, mardi au terrain n\u00b0 7 de l\u2019Aspire Zone \u00e0 Doha. [telquel.ma]\n-------------------------------------------------\nLes Lionceaux de l\u2019Atlas, tranchants face au Mali (3-2), se sont qualifi\u00e9s haut la main aux quarts de finale de la Coupe du monde U17, \u00e0 l\u2019issue du match des 8es de finale, disput\u00e9 mardi au terrain n\u00b0 7 de l\u2019Aspire Zone \u00e0 Doha. [aujourdhui.ma]\n-------------------------------------------------\nLa s\u00e9lection marocaine des moins de 17 ans s\u2019est qualifi\u00e9e pour les quarts de finale de la Coupe du monde U17 en s\u2019imposant face au Mali (3-2), mardi \u00e0 l\u2019Aspire Zone de Doha, au terme d\u2019une rencontre disput\u00e9e et marqu\u00e9e par une efficacit\u00e9 offensive marocaine. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 5, "id": "comm_label_5", "label": "Le 19 novembre de chaque\nann\u00e9e repr\u00e9sente l\u2019occasion de mettre...", "mass": 5, "physics": false, "shape": "box", "title": "Le 19 novembre de chaque ann\u00e9e repr\u00e9sente l\u2019occasion de mettre en relief les multiples initiatives de Son Altesse Royale la Princesse Lalla Hasnaa, pr\u00e9sidente de la Fondation Moham. [lematin.ma]\n-------------------------------------------------\nLe peuple marocain et l\u2019Auguste Famille Royale c\u00e9l\u00e8brent, mercredi, l\u2019anniversaire de Son Altesse Royale la Princesse Lalla Hasnaa, qui a fait de l\u2019action climatique et de la diffusion de la culture environnementale son cheval de bataille, tant au Maroc qu  de stabilisation dans la bande de Gaza. [www.lopinion.ma]\n-------------------------------------------------\nLe Conseil de s\u00e9curit\u00e9 de l\u2019ONU a vot\u00e9, lundi, en faveur d\u2019une r\u00e9solution autorisant la cr\u00e9ation d\u2019une force internationale de stabilisation dans la bande de Gaza. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Ces appareils seront destin\u00e9s aux\nop\u00e9rations de recherche et de...", "mass": 5, "physics": false, "shape": "box", "title": "Ces appareils seront destin\u00e9s aux op\u00e9rations de recherche et de sauvetage au combat et seront exploit\u00e9s par les Forces royales air. [www.lopinion.ma]\n-------------------------------------------------\nLe Royaume a sign\u00e9 un contrat avec Airbus Helicopters pour l\u2019acquisition de dix H225M destin\u00e9s aux missions de recherche et sauvetage au combat au sein des Forces royales air. [telquel.ma]\n-------------------------------------------------\nLe Maroc a officialis\u00e9 au Dubai AirShow l\u2019achat de dix h\u00e9licopt\u00e8res H225M Caracal aupr\u00e8s d\u2019Airbus Helicopters pour \u00e9quiper les Forces Royales Air en missions de recherche et sauvetage au combat. [atlasinfo.fr]\n-------------------------------------------------\nAirbus Helicopters a annonc\u00e9 mardi 18 novembre 2025 la signature d\u0027un contrat avec le Royaume du Maroc portant sur dix H225M destin\u00e9s aux op\u00e9rations de recherche et sauvetage a. [lematin.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "L\u2019international marocain Achraf Hakimi a\nremport\u00e9 le prix Lion d\u2019Or...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019international marocain Achraf Hakimi a remport\u00e9 le prix Lion d\u2019Or 2025, au terme d\u2019un vote organis\u00e9 par le journa <script>

    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
