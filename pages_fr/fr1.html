size": 26}, "group": 2, "id": "comm_label_2", "label": "Chutes de neiges, fortes pluies\net temps froid, de samedi...", "mass": 5, "physics": false, "shape": "box", "title": "Chutes de neiges, fortes pluies et temps froid, de samedi \u00e0 lundi, dans plusieurs provinces du Royaume. [lematin.ma]\n-------------------------------------------------\nDes chutes de neige, de fortes pluies parfois orageuses ainsi que de fortes rafales de vent sont pr\u00e9vues, de dimanche \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [fr.hespress.com]\n-------------------------------------------------\nDes chutes de neige, de fortes pluies parfois orageuses ainsi que de fortes rafales de vent sont pr\u00e9vues, de dimanche \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [www.lopinion.ma]\n-------------------------------------------------\nDes chutes de neige, de fortes pluies parfois orageuses ainsi que de fortes rafales de vent sont pr\u00e9vues, de dimanche \u00e0 mercredi, dans plusieurs provinces du Royaume, a annonc\u00e9 la Direction g\u00e9n\u00e9rale de la m\u00e9t\u00e9orologie (DGM). [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 11, "id": "comm_label_11", "label": "\u00c0 quelques heures du coup\nd\u2019envoi de la Coupe d\u2019Afrique...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 quelques heures du coup d\u2019envoi de la Coupe d\u2019Afrique des Nations 2025, les a\u00e9roports marocains enregistrent des chiffres historiques d\u2019arriv\u00e9es internationales. [lematin.ma]\n-------------------------------------------------\nLes a\u00e9roports du Royaume enregistrent des pics historiques d\u2019arriv\u00e9es, avec 868.287 passagers accueillis entre le 8 et le 18 d\u00e9cembre, soit +10,7 % par rapport \u00e0 2024, selon l\u0027office national des a\u00e9roports. [www.lopinion.ma]\n-------------------------------------------------\n\u00c0 la veille de la Coupe d\u2019Afrique des Nations (CAN 2025), les a\u00e9roports du Royaume enregistrent des pics historiques d\u2019arriv\u00e9es, avec 868.287 passagers accueillis entre le 8 et le 18 d\u00e9cembre, soit +10,7 % par rapport \u00e0 2024, annonce l\u2019Office National des A\u00e9roports (ONDA). [leseco.ma]\n-------------------------------------------------\nEntre le 8 et le 18 d\u00e9cembre 2025, 868.287 passagers ont \u00e9t\u00e9 accueillis dans les a\u00e9roports des villes h\u00f4tes, soit une progression de 10,7 % par rapport \u00e0 la m\u00eame p\u00e9riode en 2024. . [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 14, "id": "comm_label_14", "label": "\u00c0 l\u2019approche de la CAN\n2025, la Marocaine des Jeux...", "mass": 5, "physics": false, "shape": "box", "title": "\u00c0 l\u2019approche de la CAN 2025, la Marocaine des Jeux et des Sports (MDJS) renforce son engagement en faveur du sport et de la culture footballistique en lan\u00e7ant un Guide Football d\u00e9d. [lematin.ma]\n-------------------------------------------------\nLa Marocaine Des Jeux et des Sports (MDJS), en partenariat avec l\u2019hebdomadaire sportif Derby, offre un Guide Football CAN 2025, une publication sp\u00e9ciale con\u00e7ue pour faire vivre au [www.challenge.ma]\n-------------------------------------------------\nLa Marocaine des Jeux et des Sports (MDJS), en partenariat avec l\u2019hebdomadaire sportif Derby, a annonc\u00e9 la publication du Guide Football CAN 2025, une \u00e9dition sp\u00e9ciale d\u00e9di\u00e9e \u00e0 la Coupe d\u2019Afrique des Nations organis\u00e9e au Maroc. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le pr\u00e9sident de la Conf\u00e9d\u00e9rati         max-width: 90vw;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        z-index: 10001;

    @media (hover: hover) and (pointer: fine) {
        #info-icon:hover + #tooltip {

<div id="info-icon" onclick="toggleTooltip()">i</div>
<div id="tooltip">Carte générée par intelligence artificielle le 21/12/2025 à 18h29, à partir d'une analyse automatique de l'actualité. Elle met en évidence les sujets les plus traités par la presse ces dernières 24 heures. Prochaine mise à jour prévue à 07h30.</div>

<script>
    function toggleTooltip() {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.display = (tooltip.style.display === 'block') ? 'none' : 'block';
    }

    // Cacher la tooltip quand on clique ailleurs
    document.addEventListener('click', function(event) {
        const icon = document.getElementById('info-icon');
        const tooltip = document.getElementById('tooltip');
        if (!icon.contains(event.target) && !tooltip.contains(event.target)) {
            tooltip.style.display = 'none';
        }
    });
</script>

    
    
    
    
    
    
    
    
    
    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
