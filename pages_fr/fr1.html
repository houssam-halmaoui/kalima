 selon l\u2019Office marocain de la propri\u00e9t\u00e9 industrielle et commerciale (OMPIC). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "Le nombre de paiements par\ncartes bancaires, y compris les...", "mass": 5, "physics": false, "shape": "box", "title": "Le nombre de paiements par cartes bancaires, y compris les paiements sur GAB et ceux en ligne, s\u0027est \u00e9tabli \u00e0 192,5 millions d\u2019op\u00e9rations en 2024, pour une valeur de 63 milliards de dirhams (MMDH), enregistrant une hausse de 17% en nombre et de 11% en valeur par rapport \u00e0 2023, selon Bank Al Maghrib (BAM). [www.lopinion.ma]\n-------------------------------------------------\nLe nombre de paiements par cartes bancaires, y compris les paiements sur GAB et ceux en ligne, s\u2019est \u00e9tabli \u00e0 192,5 millions d\u2019op\u00e9rations en 2024, pour une valeur de 63 milliards de dirhams (MMDH), enregistrant une hausse de 17% en nombre et de 11% en valeur par rapport \u00e0 2023, selon Bank Al Maghrib (BAM).. [telquel.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 8, "id": "comm_label_8", "label": "La poursuite de la d\u00e9tention\nde l\u2019ex avocat Mohamed Ziane...", "mass": 5, "physics": false, "shape": "box", "title": "La poursuite de la d\u00e9tention de l\u2019ex avocat Mohamed Ziane n\u2019est en aucun cas arbitraire, mais intervient en application d\u2019une proc\u00e9dure dict\u00e9e par la loi, indique le procureur du roi pr\u00e8s la Cour d\u2019appel de Rabat. [telquel.ma]\n-------------------------------------------------\nLa poursuite de la d\u00e9tention du prisonnier (M.Z) n\u2019est en aucun cas arbitraire, mais intervient en application d\u2019une proc\u00e9dure dict\u00e9e par la loi, indique le procureur du Roi pr\u00e8s la Cour d\u2019appel de Rabat. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 9, "id": "comm_label_9", "label": "L\u2019Autorit\u00e9 marocaine du march\u00e9 des\ncapitaux (AMMC) a annonc\u00e9 avoir...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019Autorit\u00e9 marocaine du march\u00e9 des capitaux (AMMC) a annonc\u00e9 avoir vis\u00e9 le prospectus relatif \u00e0 l\u2019\u00e9mission d\u2019obligations remboursables en actions (ORA) r\u00e9serv\u00e9e \u00e0 des investisseurs identifi\u00e9s de la soci\u00e9t\u00e9 les Eaux min\u00e9rales d\u2019Oulm\u00e8s pour un montant de 350 millions de dirhams (MDH). [telquel.ma]\n-------------------------------------------------\nL\u0027Autorit\u00e9 Marocaine du March\u00e9 des Capitaux (AMMC) a annonc\u00e9 avoir viser le prospectus relatif \u00e0 l\u2019\u00e9mission d\u2019obligations remboursables en actions (ORA) r\u00e9serv\u00e9e \u00e0 des investisseurs identifi\u00e9s de la soci\u00e9t\u00e9 les Eaux Min\u00e9rales d\u2019Oulm\u00e8s pour un montant de 350 millions de dirhams (MDH). [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 3, "id": "comm_label_3", "label": "L\u2019objectif principal du projet de\nloi de r\u00e9organisation du Conseil...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019objectif principal du projet de loi de r\u00e9organisation du Conseil national de la presse (CNP) est de renforcer les pouvoirs et les capacit\u00e9s juridiques de l\u2019institution, a affirm\u00e9, lundi \u00e0 la Chambre des repr\u00e9sentants, le ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid. [telquel.ma]\n-------------------------------------------------\nLe ministre de la Jeunesse, de la Culture et de la Communication, Mohamed Mehdi Bensaid, a indiqu\u00e9 lundi \u00e0 la Chambre des repr\u00e9sentants que le projet de loi relatif \u00e0 la r\u00e9organisation du Conseil national de la presse (CNP) a 0 Rabat, la ministre de la Solidarit\u00e9, de l\u2019Insertion sociale et de la Famille, Naima Ben Yahya. [lnt.ma]\n-------------------------------------------------\nUn chiffre fort mis en avant par la ministre Na\u00efma Ben Yahya, ce lundi 24 novembre 2025, devant les membres de la Chambre des Repr\u00e9sentants. [www.lopinion.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 16, "id": "comm_label_16", "label": "Selon plusieurs sources concordantes, des\n\u00e9l\u00e9ments de la police ont...", "mass": 5, "physics": false, "shape": "box", "title": "Selon plusieurs sources concordantes, des \u00e9l\u00e9ments de la police ont arr\u00eat\u00e9, dans la soir\u00e9e de ce lundi, le streamer Ilyas El Maliki dans la ville d\u2019El Jadida, afin de l\u2019entendre dans le cadre d\u2019une enqu\u00eate. [telquel.ma]\n-------------------------------------------------\nSelon des sources concordantes, des policiers se sont rendus au domicile du concern\u00e9, qui a \u00e9t\u00e9 conduit vers le si\u00e8ge de la pr\u00e9fecture de police. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 20, "id": "comm_label_20", "label": "Le ministre de l\u2019\u00c9quipement et\nde l\u2019Eau, Nizar Baraka, a...", "mass": 5, "physics": false, "shape": "box", "title": "Le ministre de l\u2019\u00c9quipement et de l\u2019Eau, Nizar Baraka, a pris part au 7e Sommet Union Africaine\u2011Union Europ\u00e9enne, dont les travaux. [telquel.ma]\n-------------------------------------------------\nSur instruction du roi, le ministre de l\u2019\u00c9quipement et de l\u2019eau, Nizar Baraka, a pris part au 7e Sommet Union africaine\u00e2\u20ac\u2018Union europ\u00e9enne, dont les travaux se sont ouverts, lundi \u00e0 Luanda (Angola), sous le th\u00e8me Promouvoir la paix et la prosp\u00e9rit\u00e9 gr\u00e2ce \u00e0 un multilat\u00e9ralisme effectif. [www.yabiladi.com]\n-------------------------------------------------\nLe ministre de l\u2019\u00c9quipement et de l\u2019Eau Nizar Baraka, a pris part, sur hautes instructions royales, au 7e Sommet Union Africaine\u2011Union Europ\u00e9enne, dont les travaux se sont ouverts lundi \u00e0 Luanda (Angola), sous le th\u00e8me \u00ab Promouvoir la paix et la prosp\u00e9rit\u00e9 gr\u00e2ce \u00e0 un multilat\u00e9ralisme effectif \u00bb. [atlasinfo.fr]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 17, "id": "comm_label_17", "label": "La quatri\u00e8me \u00e9dition du \u00ab\nHuawei Morocco Intelligent Finance Summit...", "mass": 5, "physics": false, "shape": "box", "title": "La quatri\u00e8me \u00e9dition du \u00ab Huawei Morocco Intelligent Finance Summit \u00bb, organis\u00e9e ce mardi 25 novembre 2025 \u00e0 Casablanca, a marqu\u00e9 une \u00e9tape importante dans le renforcement des relations entre Huawei et les acteurs du secteur financier marocain et international. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Huawei Intelligent Finance Summit 2025, organis\u00e9 le 25 novembre \u00e0 Casablanca, a mis en lumi\u00e8re la mani\u00e8re dont l\u2019intelligence artificielle red\u00e9finit les mod\u00e8les op\u00e9rationnels des institutions financi\u00e8res. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 19, "id": "comm_label_19", "label": "La 41e \u00e9dition du Carrefour\ndu Manager, organis\u00e9e conjointement par...", "mass": 5, "physics": false, "shape": "box", "title": "La 41e \u00e9dition du Carrefour du Manager, organis\u00e9e conjointement par la Chambre fran\u00e7aise de commerce et d\u2019industrie et l\u2019Institut Sup\u00e9rieur de Commerce et d\u2019Administration des Entreprises (ISCAE), a r\u00e9uni, mardi 25 novembre, un parterre d\u2019acteurs cl\u00e9s de l\u2019\u00e9cosyst\u00e8me \u00e9conomique marocain. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Groupe ISCAE organise, en partenariat avec la Chambre Fran\u00e7aise de Commerce et d\u2019Industrie du Maroc (CFCIM), la 41\u1d49 \u00e9dition du Carrefour du Manager, pr\u00e9vue les 25 et 26 novembre 2025 sur son campus de Casablanca. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 1, "id": "comm_label_1", "label": "La Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises\ndu Maroc (CGEM), suite \u00e0...", "mass": 5, "physics": false, "shape": "box", "title": "La Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM), suite \u00e0 la r\u00e9union de son Comit\u00e9 d\u0027attribution du Label Responsabilit\u00e9 Soci\u00e9tale des Entreprises (RSE), a attribu\u00e9 ce label aux entreprises S2M et la Compagnie G\u00e9n\u00e9rale Immobili\u00e8re (CGI) et l\u0027a renouvel\u00e9 \u00e0 LEYTON. [leseco.ma]\n-------------------------------------------------\nLa Conf\u00e9d\u00e9ration G\u00e9n\u00e9rale des Entreprises du Maroc (CGEM) a annonc\u00e9 l\u2019attribution de son Label Responsabilit\u00e9 Soci\u00e9tale des Entreprises (RSE) \u00e0 la Compagnie G\u00e9n\u00e9rale Immobili\u00e8re (CGI) et \u00e0 S2M, \u00e0 l\u2019issue de la derni\u00e8re r\u00e9union de son Comit\u00e9 d\u2019attribution. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 6, "id": "comm_label_6", "label": "Le pr\u00e9sident chinois Xi Jinping\na abord\u00e9 la question de...", "mass": 5, "physics": false, "shape": "box", "title": "Le pr\u00e9sident chinois Xi Jinping a abord\u00e9 la question de Ta\u00efwan lundi lors d\u2019un entretien t\u00e9l\u00e9phonique avec son homologue am\u00e9ricain Donald Trump, affirmant que le \u00ab retour \u00bb de l\u2019\u00eele sous pavillon chinois constitue un enjeu majeur pour l\u2019ordre international, selon l\u2019agence Chine nouvelle. [lnt.ma]\n----         function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {

                            x: centerX,

                            fixed: {

            }
