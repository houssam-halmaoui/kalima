---------------------------------\nLe lancement du programme de soutien aux populations impact\u00e9es par les inondations dans les provinces de Larache, K\u00e9nitra, Sidi Kacem et Sidi Slimane sinscrit dans le cadre dune r\u00e9ponse globale et imm\u00e9diate \u00e0 la situation exceptionnelle, a d\u00e9clar\u00e9 une source autoris\u00e9e, mercredi. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 12, "id": "comm_label_12", "label": "Le Chef du gouvernement, Aziz\nAkhannouch a pr\u00e9sid\u00e9, ce mercredi...", "mass": 5, "physics": false, "shape": "box", "title": "Le Chef du gouvernement, Aziz Akhannouch a pr\u00e9sid\u00e9, ce mercredi \u00e0 Rabat, la r\u00e9union du Conseil d\u2019Administration de l\u2019Agence Nationale de Soutien Social (ANSS), cr\u00e9\u00e9e en vue de d\u00e9velopper et de mettre en \u0153uvre les politiques de soutien social, notamment le chantier des aides sociales directes lanc\u00e9 fin 2023, conform\u00e9ment aux hautes directives royales. [fr.hespress.com]\n-------------------------------------------------\nAziz Akhannouch a pr\u00e9sid\u00e9, ce mercredi 18 f\u00e9vrier \u00e0 Rabat, la r\u00e9union du Conseil d\u2019administration de l\u2019Agence nationale de soutien social (ANSS), cr\u00e9\u00e9e en vue de d\u00e9velopper et de mettre en \u0153uvre les politiques de soutien social, notamment le chantier des aides sociales directes lanc\u00e9 fin 2023. [telquel.ma]\n-------------------------------------------------\nLa cr\u00e9ation de cette derni\u00e8re vise \u00e0 dynamiser la mise en \u0153uvre des politiques sociales, \u00e0 commencer par les aides directes lanc\u00e9es fin 2023. [www.yabiladi.com]\n-------------------------------------------------\nLe syst\u00e8me de l\u2019aide sociale directe consacre un tournant qualitatif dans le traitement des besoins des cat\u00e9gories vuln\u00e9rables, \u00e0 travers la transition depuis les approches conjoncturelles vers un syst\u00e8me institutionnel bas\u00e9 sur le ciblage pr\u00e9cis, l\u2019\u00e9quit\u00e9 sociale et l\u2019efficience dans l\u2019affectation des ressources, a affirm\u00e9, mercredi \u00e0 Rabat, le Chef du gouvernement, Aziz Akhannouch. [aujourdhui.ma]\n-------------------------------------------------\nLe syst\u00e8me de l\u2019aide sociale directe consacre un tournant qualitatif dans le traitement des besoins des cat\u00e9gories vuln\u00e9rables, \u00e0 travers la transition depuis les approches conjoncturelles vers un syst\u00e8me institutionnel bas\u00e9 sur le ciblage pr\u00e9cis, l\u2019\u00e9quit\u00e9 sociale et l\u2019efficience dans l\u2019affectation des ressources, a affirm\u00e9, mercredi \u00e0 Rabat, le chef du gouvernement, Aziz Akhannouch. [leseco.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 2, "id": "comm_label_2", "label": "Sign\u00e9 par la ministre du\nTourisme, de l\u2019Artisanat et de...", "mass": 5, "physics": false, "shape": "box", "title": "Sign\u00e9 par la ministre du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Fatim-Zahra Ammor, le Pr\u00e9sident-Directeur G\u00e9n\u00e9ral d\u2019Attijariwafa bank, Mohamed El Kettani,. [lematin.ma]\n-------------------------------------------------\nLe minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Attijariwafa Bank et Visa ont sign\u00e9, mercredi \u00e0 Rabat, un m\u00e9morandum d\u2019entente (MoU) portant sur le lancement du programme \u201cStay Cashless\u201d, pour acc\u00e9l\u00e9rer la transformation digitale dans le secteur touristique. [telquel.ma]\n-------------------------------------------------\nLe minist\u00e8re du Tourisme, de l\u2019Artisanat et de l\u2019\u00c9conomie sociale et solidaire, Attijariwafa Bank et Visa ont sign\u00e9, mercredi \u00e0 Rabat, un m\u00e9morandum d\u2019entente (MoU) portant sur le lancement du programme
