l s\u2019est \u00e9galement inform\u00e9 du\nprojet de loi portant approbation...", "mass": 5, "physics": false, "shape": "box", "title": "Il s\u2019est \u00e9galement inform\u00e9 du projet de loi portant approbation de cet accord, pr\u00e9sent\u00e9 par le ministre du Transport et de la Logistique. [www.lavieeco.com]\n-------------------------------------------------\nLe Conseil de gouvernement s\u2019est inform\u00e9, jeudi \u00e0 Rabat, d\u2019un accord sur les services a\u00e9riens, sign\u00e9 \u00e0 Montr\u00e9al le 25 septembre 2025, entre le Gouvernement du Royaume du Maroc et le Gouvernement de la R\u00e9publique du Rwanda. [www.lereporter.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 25, "id": "comm_label_25", "label": "Le Maroc et l\u2019Organisation internationale\ndu Travail (OIT) ont annonc\u00e9,...", "mass": 5, "physics": false, "shape": "box", "title": "Le Maroc et l\u2019Organisation internationale du Travail (OIT) ont annonc\u00e9, vendredi \u00e0 Gen\u00e8ve, le lancement de la campagne mondiale \u201cCarton rouge au travail des enfants\u201d visant \u00e0 accro\u00eetre la sensibilisation aux efforts de lutte contre ce fl\u00e9au. [maroc-diplomatique.net]\n-------------------------------------------------\nLe Maroc et l\u2019Organisation internationale du Travail (OIT) ont annonc\u00e9, vendredi \u00e0 Gen\u00e8ve, le lancement de la campagne mondiale \u00ab Carton rouge au travail des enfants \u00bb, une initiative destin\u00e9e \u00e0 renforcer la sensibilisation internationale et \u00e0 mobiliser les acteurs publics, priv\u00e9s et associatifs autour de l\u2019\u00e9limination de ce ph\u00e9nom\u00e8ne. [lnt.ma]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 26, "id": "comm_label_26", "label": "L\u2019indice des prix \u00e0 la\nproduction du secteur des \"Industries...", "mass": 5, "physics": false, "shape": "box", "title": "L\u2019indice des prix \u00e0 la production du secteur des \"Industries manufacturi\u00e8res hors raffinage de p\u00e9trole\" a enregistr\u00e9 une baisse de 0,1% en d\u00e9cembre 2025 par rapport \u00e0 un mois auparavant, selon le Haut-Commissariat au Plan (HCP). [leseco.ma]\n-------------------------------------------------\nL\u2019indice des prix \u00e0 la production du secteur des \u00ab Industries manufacturi\u00e8res hors raffinage de p\u00e9trole \u00bb a enregistr\u00e9 une baisse de 0,1% en d\u00e9cembre 2025 par rapport \u00e0 un mois auparavant, selon le Haut-Commissariat au Plan (HCP). [fr.hespress.com]\n-------------------------------------------------\nL\u2019indice des prix \u00e0 la production industrielle, \u00e9nerg\u00e9tique et mini\u00e8re (IPPI) a enregistr\u00e9 un l\u00e9ger repli de 0,1 % en d\u00e9cembre 2025, selon les donn\u00e9es publi\u00e9es par le Haut-Commissariat au Plan. [maroc-diplomatique.net]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 10, "id": "comm_label_10", "label": "Le Comit\u00e9 national de veille\ncharg\u00e9 de la gestion et...", "mass": 5, "physics": false, "shape": "box", "title": "Le Comit\u00e9 national de veille charg\u00e9 de la gestion et du suivi des \u00e9v\u00e9nements li\u00e9s aux inondations s\u2019est r\u00e9uni vendredi au si\u00e8ge du minist\u00e8re de l\u2019Int\u00e9rieur afin d\u2019examiner la situation dans les zones touch\u00e9es par les fortes perturbations m\u00e9t\u00e9orologiques enregistr\u00e9es ces derniers jours, notamment dans la ville de Ksar El K\u00e9bir. [lnt.ma]\n-------------------------------------------------\nLa direction provinciale du minist\u00e8re de l\u2019\u00c9ducation nationale, du Pr\u00e9scolaire et des Sports \u00e0 Ksar El K\u00e9bir a annonc\u00e9 la suspension des cours dans l\u2019ensemble des \u00e9tablissements scolaires publics et priv\u00e9s de la ville, en raison des conditions m\u00e9t\u00e9orologiques difficiles et des perturbations climatiques que conna\u00eet la r\u00e9gion. [fr.hespress.com]\n-------------------------------------------------\nCette mesure, effective du lundi 2 f\u00e9vrier 2026 jusquau samedi 7 f\u00e9vrier, intervient en r\u00e9ponse aux inondations qui ont frapp\u00e9 la ville suite \u00e0 des conditions m\u00e9t\u00e9orologiques d\u00e9favorables. [www.yabiladi.com]"}, {"borderWidth": 3, "fixed": true, "font": {"bold": true, "color": "#000", "size": 26}, "group": 7, "id": "comm_label_7", "label": "La sc\u00e8ne artistique marocaine a\nperdu, en cette soir\u00e9e du...", "mass": 5, "physics": false, "shape": "box", "title": "La sc\u00e8ne artistique marocaine a perdu, en cette soir\u00e9e du vendredi 30 janvier, l\u2019une de ses grandes figures avec le d\u00e9c\u00e8s du chanteur Abdelhadi Belkhayat, qui s\u2019est \u00e9teint apr\u00e8s un long parcours artistique ayant marqu\u00e9 durablement la m\u00e9moire musicale nationale. [fr.hespress.com]\n-------------------------------------------------\nAbdelhadi Belkhayat, ic\u00f4ne de la chanson marocaine, est mort \u00e0 86 ans apr\u00e8s une longue maladie. [lematin.ma]\n-------------------------------------------------\nL\u2019artiste marocain \u00e0 la retraite, Abdelhadi Belkhayat, s\u2019est \u00e9teint ce vendredi soir, 30 janvier 2026, \u00e0 l\u2019\u00e2ge de 86 ans, apr\u00e8s avoir lutt\u00e9 contre la maladie. [www.yabiladi.com]\n-------------------------------------------------\nHospitalis\u00e9 au centre hospitalier militaire de Rabat, l\u2019artiste s\u2019est \u00e9teint en laissant derri\u00e8re lui une \u0153uvre profonde, intemporelle, et intimement li\u00e9e \u00e0 la m\u00e9moire collective de plusieurs g\u00e9n\u00e9rations de Marocains. [lnt.ma]"}]);

                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"font": {"size": 16, "align": "middle"}, "scaling": {"min": 10, "max": 30}}, "edges": {"color": {"inherit": true}, "smooth": {"type": "continuous"}, "font": {"size": 10, "align": "middle"}, "label": {"enabled": true}}, "physics": {"solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -150, "centralGravity": 0.008, "springLength": 100, "springConstant": 0.08, "damping": 1.0, "avoidOverlap": 1.0}, "minVelocity": 0.75, "stabilization": {"enabled": true, "iterations": 200}}, "interaction": {"hover": true, "navigationButtons": false, "multiselect": true, "tooltipDelay": 300, "dragNodes": true}};

                  


                  

                  network = new vis.Network(container, data, options);

    <script type="text/javascript">


        function positionCommunityLabels() {

            var communities = {};

            for (var nodeId in network.body.nodes) {
                var node = network.body.nodes[nodeId];

                if (nodeId.toString().indexOf('comm_label_') === 0) {
                    continue;
                }

                var groupId = node.options.group;
                if (groupId !== undefined) {
                    if (!communities[groupId]) {
                        communities[groupId] = {nodes: [], x: 0, y: 0};
                    }
                    communities[groupId].nodes.push(nodeId);
                    communities[groupId].x += node.x;
                    communities[groupId].y += node.y;
                }
            }


            for (var groupId in communities) {
                var comm = communities[groupId];
                var numNodes = comm.nodes.length;

                if (numNodes > 0) {
                    var centerX = comm.x / numNodes;
                    var centerY = comm.y / numNodes;
                    var labelId = 'comm_label_' + groupId;


                    if (network.body.nodes[labelId]) {
                        network.body.data.nodes.update({
                            id: labelId,
                            x: centerX,
                            y: centerY,
                            fixed: {
                                x: true,
                                y: true
                            }
                        });
                    } 
                }
            }
        }

        network.once("stabilized", function() {
            setTimeout(positionCommunityLabels, 100);
        });

        window.addEventListener('resize', function() {
            setTimeout(positionCommunityLabels, 50);
        });


        network.on("dragEnd", function(params) {
            setTimeout(positionCommunityLabels, 50);
        });

        network.on("afterDrawing", function() {
            if (!window.labelUpdateTimeout) {
                window.labelUpdateTimeout = setTimeout(function() {
                    positionCommunityLabels();
                    window.labelUpdateTimeout = null;
                }, 100);
            }
        });




        network.on("doubleClick", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        network.on("hold", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = network.body.nodes[nodeId];
                var url = node.options.url;
                if (url && url !== '#') {
                    window.open(url, '_blank');
                }
            }
        });

        function adjustForScreenSize() {
            var isMobile = window.innerWidth < 768;
            var options = {
                nodes: {
                    font: { size: isMobile ? 18 : 20 },
                    scaling: { min: isMobile ? 5 : 10, max: isMobile ? 20 : 30 }
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: isMobile ? -1000 : -2000,
                        springLength: isMobile ? 80 : 120
                    }
                }
            };
            network.setOptions(options);
        }






    function addScrollButtonsToTooltips() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    Array.from(mutation.addedNodes).forEach(function(node) {
                        if (node.classList && node.classList.contains('vis-tooltip')) {
                            if (node.scrollHeight > node.clientHeight) {
                                const scrollButtons = document.createElement('div');
                                scrollButtons.className = 'scroll-buttons';
                                
                                const scrollUp = document.createElement('div');
                                scrollUp.className = 'scroll-up';
                                scrollUp.innerHTML = '▲';
                                scrollUp.onclick = function() {
                                    node.scrollBy(0, -50);
                                };
                                
                                const scrollDown = document.createElement('div');
                                scrollDown.className = 'scroll-down';
                                scrollDown.innerHTML = '▼';
                                scrollDown.onclick = function() {
                                    node.scrollBy(0, 50);
                                };
                                
                                scrollButtons.appendChild(scrollUp);
                                scrollButtons.appendChild(scrollDown);
                                node.appendChild(scrollButtons);
                            }
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }
    
    
    
        window.addEventListener('load', adjustForScreenSize);
        window.addEventListener('resize', adjustForScreenSize);


    
    document.addEventListener('DOMContentLoaded', addScrollButtonsToTooltips);



    </script>
